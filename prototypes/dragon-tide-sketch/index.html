/**
 * v0.48: ロケット弾を1発、指定の角度へ撃つ（誘導なし・遅い・着弾でAoE）。
 * spawnFanProjectileRaw と同じく「角度で撃つ」形にして、斉射の扇を作れるようにする。
 */
function spawnRocket(fromWx, fromWy, angle) {
  const slot = takeProjectileSlot();
  if (slot < 0) return;
  const sp = ROCKET_SPEED * PROJECTILE_SPEED_MULT;
  projActive[slot]    = 1;
  projWx[slot]        = fromWx;   projWy[slot]      = fromWy;
  projTailX[slot]     = fromWx;   projTailY[slot]   = fromWy;
  projStartWx[slot]   = fromWx;   projStartWy[slot] = fromWy;
  projVx[slot]        = Math.cos(angle) * sp;
  projVy[slot]        = Math.sin(angle) * sp;
  projDmg[slot]       = ROCKET_DAMAGE;
  projAoe[slot]       = ROCKET_AOE;
  projTracking[slot]  = 0;
  projTargetIdx[slot] = -1;
  projColor[slot]     = "#ffb060";
  projKind[slot]      = 3;
}

// -----------------------------------------------------------------
// v0.48: 極太レーザー（予兆つき）
// -----------------------------------------------------------------
// 「予兆 → 極太の一撃」は、危険地帯（hazards）と同じ**先に見せてから当てる**作法の
// 見せ場版。狙いは撃つ瞬間ではなく**予兆の1.3秒で群れを線から外させる**こと。
// 当たると重いが、避ければゼロ＝プレイヤーの操作が結果を決める。
const LASER_WARN_TIME  = 1.3;   // 予兆（細い線が伸びて脈打つ）
const LASER_FIRE_TIME  = 0.9;   // 照射（極太・この間ずっと判定がある）
const LASER_TICK       = 0.15;  // ダメージを刻む間隔
const laserStrikes = [];

/**
 * 極太レーザーを1本置く。予兆の時点で向きが確定するので、プレイヤーは横へ抜ければ避けられる。
 * @param {number} x,y     発射位置
 * @param {number} angle   照射方向（rad）
 * @param {number} width   ビームの太さ（px）
 * @param {number} length  届く距離（px）
 * @param {number} dps     照射中の毎秒ダメージ
 */
function spawnLaserStrike(x, y, angle, width, length, dps, color) {
  laserStrikes.push({ x, y, angle, width, length, dps, color,
                      t: 0, tick: 0, total: LASER_WARN_TIME + LASER_FIRE_TIME });
}

function updateLaserStrikes(dt) {
  for (let k = laserStrikes.length - 1; k >= 0; k--) {
    const L = laserStrikes[k];
    L.t += dt;
    if (L.t >= L.total) { laserStrikes.splice(k, 1); continue; }
    if (L.t < LASER_WARN_TIME) continue;          // 予兆中は当たらない
    L.tick -= dt;
    if (L.tick > 0) continue;
    L.tick = LASER_TICK;
    // ビーム軸に射影して「線分の内側か」を見る（矩形判定）
    const ax = Math.cos(L.angle), ay = Math.sin(L.angle);
    const half = L.width * 0.5;
    for (let i = 0; i < N; i++) {
      if (boidDead[i] || boidDowned[i]) continue;
      const dx = px[i] - L.x, dy = py[i] - L.y;
      const along = dx * ax + dy * ay;
      if (along < 0 || along > L.length) continue;
      const perp = dx * -ay + dy * ax;
      if (Math.abs(perp) > half) continue;
      applyDamageToBoid(i, L.dps * LASER_TICK);
      // 軸の外へ押し出す＝「なぎ払われる」感触。減衰する外力チャネルに乗せる
      const sgn = perp >= 0 ? 1 : -1;
      applyKickDist(i, -ay * sgn, ax * sgn, 26);
    }
  }
}

/** 予兆＝細い線が脈打つ／照射＝極太の帯。カメラ変換の内側で呼ぶ。 */
function drawLaserStrikes() {
  if (laserStrikes.length === 0) return;
  ctx.save();
  ctx.lineCap = "butt";
  for (const L of laserStrikes) {
    const ex = L.x + Math.cos(L.angle) * L.length;
    const ey = L.y + Math.sin(L.angle) * L.length;
    if (L.t < LASER_WARN_TIME) {
      const prog = L.t / LASER_WARN_TIME;              // 0→1
      // 予兆: 細い線が伸びていき、当たる幅も薄く見せる（どこが焼けるか読める）
      ctx.globalAlpha = 0.20 + 0.25 * Math.abs(Math.sin(L.t * 12));
      ctx.strokeStyle = L.color;
      ctx.lineWidth = L.width;
      ctx.beginPath();
      ctx.moveTo(L.x, L.y);
      ctx.lineTo(L.x + Math.cos(L.angle) * L.length * prog,
                 L.y + Math.sin(L.angle) * L.length * prog);
      ctx.stroke();
      ctx.globalAlpha = 0.9;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(L.x, L.y);
      ctx.lineTo(ex, ey);
      ctx.stroke();
    } else {
      const f = (L.t - LASER_WARN_TIME) / LASER_FIRE_TIME;   // 0→1
      const fade = f > 0.8 ? (1 - f) / 0.2 : 1;              // 終わり際だけ薄れる
      for (const [wMul, alpha] of [[1.0, 0.35], [0.55, 0.75], [0.22, 1.0]]) {
        ctx.globalAlpha = alpha * fade;
        ctx.strokeStyle = wMul < 0.3 ? "#ffffff" : L.color;
        ctx.lineWidth = L.width * wMul;
        ctx.beginPath();
        ctx.moveTo(L.x, L.y);
        ctx.lineTo(ex, ey);
        ctx.stroke();
      }
      // 発射口の閃光
      ctx.globalAlpha = 0.8 * fade;
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(L.x, L.y, L.width * 0.42, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

const MORTAR_SCATTER    = 78;    // 落下点のばらつき（px）
const FLAK_SPEED        = 265;
const FLAK_DAMAGE       = 2.4;
const FLAK_AOE          = 44;
const FLAK_COUNT        = 5;
const FLAK_SCATTER      = 135;
const PRISM_WIDTH       = 30;    // 首都の極太レーザー(86)の小型版
const PRISM_LENGTH      = 640;
const PRISM_DPS         = 14;

// v0.48: ロケット砲台（建物側の見せ場）。**弾速の遅い大きな弾をまとめて撃つ**。
// 速い弾は「気づいたら削れている」だけだが、遅い弾は**飛んでくる間に避けられる**＝
// 画面を読んで群れを動かす時間が生まれる。当たると重い（AoE付き）。
const ROCKET_COUNT      = 5;     // 1斉射の発数
const ROCKET_SPREAD     = 0.42;  // 扇の広がり（rad）
const ROCKET_SPEED      = 46;    // 遅い（矢は75〜95）
const ROCKET_DAMAGE     = 3.0;
const ROCKET_AOE        = 52;    // 着弾の巻き込み半径
const ROCKET_MAX_RANGE  = 620;   // 遅いぶん遠くまで届く
// ※ 発動間隔は EMPLACEMENT_DEFS[].interval が持つ（v0.57で一元化）
const EMBER_TOWER_RADIUS   = 145;
const EMBER_TOWER_LIFE     = 4.0;
const EMBER_TOWER_DPS      = 4.0;

const HAZARD_MAX        = 48;    // 同時に存在できる数（超えたら古いものから消す）
const HAZARD_TICK       = 0.25;  // ダメージを刻む間隔（秒）。毎フレーム引くと数値が細かすぎる
const HAZARD_WARN_TIME  = 0.7;   // 出現直後の予告時間。この間はダメージなしで輪だけ出す
const hazards = [];

/**
 * 危険地帯を1つ置く。
 * @param {number} x,y      中心（ワールド）
 * @param {number} radius   最終半径
 * @param {number} life     持続（秒。予告時間を含む）
 * @param {number} dps      1秒あたりのダメージ
 * @param {string} color    表示色
 * @param {number} growFrom 開始半径（radius へ広がる。同値なら固定サイズ）
 */
// -----------------------------------------------------------------
// v0.63: 危険地帯の「撃った弾」の演出（当たり判定なし）
// -----------------------------------------------------------------
// 実機判定「円形の予兆あり範囲攻撃は誰が撃ってきてるか分からない」（Shooter指示）。
// 予告の輪だけだと**降ってくる出どころ**が読めず、狙ってきた相手を潰す判断ができない。
// 予告時間（HAZARD_WARN_TIME=0.7秒）ちょうどで着弾する見せ弾を飛ばして、
// 「あいつが撃った → あいつを先に潰す」を成立させる。
// 当たり判定は一切持たない（ダメージは hazard 側が持つ）ので、投射物プールとは別管理。
const MAX_HAZARD_SHOTS = 48;
const hazardShots = [];

/**
 * 見せ弾を1発飛ばす。到達時間は予告時間ちょうど。
 * @param {number} fx,fy  発射元
 * @param {number} tx,ty  着弾点（危険地帯の中心）
 * @param {number} life   飛行時間（＝予告時間）
 */
function spawnHazardShot(fx, fy, tx, ty, life, color, radius) {
  if (hazardShots.length >= MAX_HAZARD_SHOTS) hazardShots.shift();
  // v0.64: 弾の大きさは**置かれる危険地帯の大きさ**に比例させる（Shooter指示「もっと大きく」）。
  // 大きい輪ほど大きい塊が飛んでくる＝着弾前に規模が読める。
  const scale = Math.max(0.9, Math.min(2.1, (radius ?? 110) / 95));
  hazardShots.push({ fx, fy, tx, ty, t: 0, life, color, scale });
}

function updateHazardShots(dt) {
  for (let i = hazardShots.length - 1; i >= 0; i--) {
    const h = hazardShots[i];
    h.t += dt;
    if (h.t >= h.life) hazardShots.splice(i, 1);
  }
}

/**
 * 見せ弾の描画。**山なりに投げた**ように見せるため、直線の中間を法線方向へ膨らませる
 * （トップビューなので高さは出せない。弧を描かせることで「飛んできた」を表す）。
 * 影を地面の直線上に置くと、弧と影の差が高さに読める。
 */
function drawHazardShots() {
  ctx.save();
  for (const h of hazardShots) {
    const p  = Math.min(1, h.t / h.life);
    const gx = h.fx + (h.tx - h.fx) * p;      // 地面をまっすぐ進む影
    const gy = h.fy + (h.ty - h.fy) * p;
    const dx = h.tx - h.fx, dy = h.ty - h.fy;
    const len = Math.sqrt(dx * dx + dy * dy) || 1;
    // 弧の高さ: 中間で最大。距離に比例させる（遠いほど大きく打ち上がる）
    const lift = Math.sin(p * Math.PI) * Math.min(70, len * 0.22);
    const bx = gx + (-dy / len) * lift;
    const by = gy + ( dx / len) * lift;

    const sc = h.scale ?? 1;

    // 地面の影（弾が高いほど小さく薄い＝高度が読める）
    ctx.globalAlpha = 0.30 * (1 - 0.5 * Math.sin(p * Math.PI));
    ctx.fillStyle = "#000000";
    ctx.beginPath();
    ctx.ellipse(gx, gy, 9 * sc, 4.5 * sc, 0, 0, Math.PI * 2);
    ctx.fill();

    // 尾: 少し前の位置を3つ、小さく薄く重ねる（飛んでいる向きが読める）
    for (let k = 1; k <= 3; k++) {
      const pt = Math.max(0, p - k * 0.045);
      const tgx = h.fx + (h.tx - h.fx) * pt;
      const tgy = h.fy + (h.ty - h.fy) * pt;
      const tl  = Math.sin(pt * Math.PI) * Math.min(70, len * 0.22);
      ctx.globalAlpha = 0.20 - k * 0.045;
      ctx.fillStyle = h.color;
      ctx.beginPath();
      ctx.arc(tgx + (-dy / len) * tl, tgy + (dx / len) * tl, (12 - k * 2.2) * sc, 0, Math.PI * 2);
      ctx.fill();
    }

    // 本体: 脈打つ外光 → 芯 → 白いハイライト
    const pulse = 0.88 + 0.12 * Math.sin(breathTime * 18 + h.fx * 0.01);
    ctx.globalAlpha = 0.34;
    ctx.fillStyle = h.color;
    ctx.beginPath();
    ctx.arc(bx, by, 20 * sc * pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 0.75;
    ctx.beginPath();
    ctx.arc(bx, by, 12 * sc * pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.beginPath();
    ctx.arc(bx, by, 7.5 * sc, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.92)";
    ctx.beginPath();
    ctx.arc(bx - 2.2 * sc, by - 2.2 * sc, 3.0 * sc, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

/**
 * @param {number} [fromX] 撃った相手の位置。渡すと見せ弾が飛ぶ（当たり判定なし）
 * @param {number} [fromY]
 */
function spawnHazard(x, y, radius, life, dps, color, growFrom = radius, fromX, fromY) {
  // 発射元が離れているときだけ見せ弾を出す。自分の足元に置くタイプ（焼夷塔・瘴気塔）は
  // 出どころが自明なので飛ばさない。
  if (fromX !== undefined && fromY !== undefined) {
    const fdx = x - fromX, fdy = y - fromY;
    if (fdx * fdx + fdy * fdy > 60 * 60) {
      spawnHazardShot(fromX, fromY, x, y, HAZARD_WARN_TIME, color, radius);
    }
  }
  if (hazards.length >= HAZARD_MAX) hazards.shift();
  hazards.push({ x, y, r: radius, r0: growFrom, life, maxLife: life, dps, color, tick: 0 });
}

function updateHazards(dt) {
  for (let k = hazards.length - 1; k >= 0; k--) {
    const h = hazards[k];
    h.life -= dt;
    if (h.life <= 0) { hazards.splice(k, 1); continue; }
    // 予告中はまだ焼かない（理不尽に見えないよう、必ず輪が先に出る）
    const age = h.maxLife - h.life;
    if (age < HAZARD_WARN_TIME) continue;
    h.tick -= dt;
    if (h.tick > 0) continue;
    h.tick = HAZARD_TICK;
    const rNow = hazardRadiusAt(h);
    const r2 = rNow * rNow;
    for (let i = 0; i < N; i++) {
      if (boidDead[i] || boidDowned[i]) continue;
      const dx = px[i] - h.x, dy = py[i] - h.y;
      if (dx * dx + dy * dy > r2) continue;
      applyDamageToBoid(i, h.dps * HAZARD_TICK);
    }
  }
}

/** 現在の半径（growFrom → radius へ寿命の前半で広がる）。 */
function hazardRadiusAt(h) {
  if (h.r0 === h.r) return h.r;
  const t = Math.min(1, (h.maxLife - h.life) / (h.maxLife * 0.5));
  return h.r0 + (h.r - h.r0) * t;
}

// v0.43: 連鎖電撃の表示FX（折れ線をそのまま描く）
const chainFxList = [];
const CHAIN_FX_DURATION = 0.28;

function updateChainFx(dt) {
  for (let k = chainFxList.length - 1; k >= 0; k--) {
    chainFxList[k].life -= dt;
    if (chainFxList[k].life <= 0) chainFxList.splice(k, 1);
  }
}

/** 連鎖電撃。竜から竜へ数珠つなぎの折れ線を描く＝「固めていると全部に通る」が一目で分かる。 */
function drawChainFx() {
  if (chainFxList.length === 0) return;
  ctx.save();
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  for (const fx of chainFxList) {
    const a = Math.max(0, fx.life / CHAIN_FX_DURATION);
    for (const [w, col, alpha] of [[6, "#a0d8ff", 0.30], [2.2, "#eaf6ff", 0.95]]) {
      ctx.globalAlpha = alpha * a;
      ctx.strokeStyle = col;
      ctx.lineWidth = w;
      ctx.beginPath();
      for (const sg of fx.segs) {
        // 稲妻らしく中点を折る（見た目だけの乱数なので fxRandom）
        const mxs = (sg[0] + sg[2]) * 0.5 + (fxRandom() - 0.5) * 9;
        const mys = (sg[1] + sg[3]) * 0.5 + (fxRandom() - 0.5) * 9;
        ctx.moveTo(sg[0], sg[1]);
        ctx.lineTo(mxs, mys);
        ctx.lineTo(sg[2], sg[3]);
      }
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

/**
 * v0.43: 堰の決壊 — 下流へ水の壁を走らせる。
 * @param {number} fromIdx 川ポリラインのどの点から下流かのインデックス
 */
function triggerFlood(fromIdx) {
  if (riverPolyline.length < 2) return;
  // 下流側の残り距離を測って、そこまで走らせる
  let total = 0;
  for (let i = fromIdx; i < riverPolyline.length - 1; i++) {
    total += Math.hypot(riverPolyline[i + 1].x - riverPolyline[i].x,
                        riverPolyline[i + 1].y - riverPolyline[i].y);
  }
  floodWave = { dist: 0, maxDist: total, fromIdx, hit: new Set() };
  triggerFlash("rgba(120,200,255,0.35)", 0.35);
  triggerShake(6, 0.5);
  hapticPulse(220);
}

/** 洪水の先端位置（ワールド座標）と、そこでの進行方向。 */
function floodFrontAt(dist) {
  let acc = 0;
  for (let i = floodWave.fromIdx; i < riverPolyline.length - 1; i++) {
    const a = riverPolyline[i], b = riverPolyline[i + 1];
    const segLen = Math.hypot(b.x - a.x, b.y - a.y) || 1;
    if (acc + segLen >= dist) {
      const t = (dist - acc) / segLen;
      return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t,
               dx: (b.x - a.x) / segLen, dy: (b.y - a.y) / segLen };
    }
    acc += segLen;
  }
  const last = riverPolyline[riverPolyline.length - 1];
  return { x: last.x, y: last.y, dx: 0, dy: 1 };
}

function updateFlood(dt) {
  if (!floodWave) return;
  const prev = floodWave.dist;
  floodWave.dist += DAM_FLOOD_SPEED * dt;
  // 先端が通り過ぎた区間の建物を水没させる。刻みが粗いと取りこぼすので少しずつ進めて判定する
  const STEP = 60;
  for (let d = prev; d < floodWave.dist; d += STEP) {
    const f = floodFrontAt(Math.min(d, floodWave.maxDist));
    const cell = Math.max(1, Math.ceil(DAM_FLOOD_BAND / BUILDING_GRID_CELL));
    buildingGridQueryRadius(f.x, f.y, cell, _buildingNeighbourBuf);
    for (const sIdx of _buildingNeighbourBuf) {
      const b = settlements[sIdx];
      if (!b || b.fallen || b.isBoss || b._isWall) continue;   // 城壁とボスは流されない
      if (floodWave.hit.has(sIdx)) continue;
      const bx = b.wx - f.x, by = b.wy - f.y;
      if (bx * bx + by * by > DAM_FLOOD_BAND * DAM_FLOOD_BAND) continue;
      floodWave.hit.add(sIdx);
      b.hp -= DAM_FLOOD_DAMAGE;
      if (b.hp <= 0) settlementFall(sIdx);
    }
    // 水しぶき（先端の左右へ）
    if (fxRandom() < 0.6) {
      const side = fxRandom() < 0.5 ? 1 : -1;
      spawnHitParticles(f.x - f.dy * side * (30 + fxRandom() * DAM_FLOOD_BAND * 0.7),
                        f.y + f.dx * side * (30 + fxRandom() * DAM_FLOOD_BAND * 0.7));
    }
  }
  if (floodWave.dist >= floodWave.maxDist) floodWave = null;
}

/** 洪水の描画。通り過ぎた帯を水色に沈め、先端に白い波頭を置く。 */
function drawFlood() {
  if (!floodWave || riverPolyline.length < 2) return;
  ctx.save();
  // 沈んだ帯（堰から先端まで）
  ctx.globalAlpha = 0.30;
  ctx.strokeStyle = "#5ab0e8";
  ctx.lineWidth = DAM_FLOOD_BAND * 2;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.beginPath();
  let acc = 0, started = false;
  for (let i = floodWave.fromIdx; i < riverPolyline.length - 1; i++) {
    const a = riverPolyline[i], b = riverPolyline[i + 1];
    const segLen = Math.hypot(b.x - a.x, b.y - a.y) || 1;
    if (!started) { ctx.moveTo(a.x, a.y); started = true; }
    if (acc + segLen >= floodWave.dist) {
      const t = (floodWave.dist - acc) / segLen;
      ctx.lineTo(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t);
      break;
    }
    ctx.lineTo(b.x, b.y);
    acc += segLen;
  }
  ctx.stroke();
  // 波頭
  const f = floodFrontAt(Math.min(floodWave.dist, floodWave.maxDist));
  ctx.globalAlpha = 0.9;
  ctx.strokeStyle = "#dff2ff";
  ctx.lineWidth = 7;
  ctx.beginPath();
  ctx.moveTo(f.x - f.dy * DAM_FLOOD_BAND, f.y + f.dx * DAM_FLOOD_BAND);
  ctx.lineTo(f.x + f.dy * DAM_FLOOD_BAND, f.y - f.dx * DAM_FLOOD_BAND);
  ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.restore();
}

/** 堰の見た目。川に直交する石の壁として live 描画する（建物レイヤーはキャッシュのため）。 */
function drawDams() {
  for (const b of settlements) {
    if (!b || !b._isDam || b.fallen) continue;
    ctx.save();
    ctx.translate(b.wx, b.wy);
    ctx.rotate(b._damAngle ?? 0);
    // 川を堰き止める板（進行方向に対して直交＝横長）
    ctx.fillStyle = "#8a94a0";
    ctx.fillRect(-10, -riverWidth * 0.9, 20, riverWidth * 1.8);
    ctx.strokeStyle = "#c8d4e0";
    ctx.lineWidth = 2;
    ctx.strokeRect(-10, -riverWidth * 0.9, 20, riverWidth * 1.8);
    // 上流側に溜まった水（壊すと出るぞ、の予告）
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = "#5ab0e8";
    ctx.fillRect(-46, -riverWidth * 0.85, 36, riverWidth * 1.7);
    ctx.globalAlpha = 1;
    ctx.restore();
  }
}

/**
 * v0.44: デバッグ用の敵ラベル。名前・HP・状態（潜航中／盾の向き）を頭上に出す。
 * 見た目が似た敵（スプライトを流用している）を**現場で見分けられない**問題への対応。
 * カメラ変換の内側（ワールド座標）で呼ぶ。
 */
function drawEnemyDebugLabels() {
  if (!debugShowEnemyLabels) return;
  ctx.save();
  ctx.font = "10px monospace";
  ctx.textAlign = "center";
  for (const m of movers) {
    if (!m.alive) continue;
    const name = DEBUG_ENEMY_LABELS[m.def.name] ?? m.def.name;
    const state = m.submerged ? " [潜航中/無敵]" : "";
    const text = `${name} ${Math.max(0, Math.ceil(m.hp))}/${m.maxHp}${state}`;
    const y = m.wy - m.def.radius - 12;
    const w = ctx.measureText(text).width + 8;
    ctx.globalAlpha = 0.72;
    ctx.fillStyle = "#000";
    ctx.fillRect(m.wx - w / 2, y - 10, w, 13);
    ctx.globalAlpha = 1;
    ctx.fillStyle = m.submerged ? "#ffd080" : "#e8f4ff";
    ctx.fillText(text, m.wx, y);
    // 盾持ちは弾かれる向きが分かるように扇を出す
    if (m.def.shieldArc !== undefined) {
      const ang = Math.atan2(m.headingY, m.headingX);
      ctx.globalAlpha = 0.25;
      ctx.fillStyle = "#9fd8ff";
      ctx.beginPath();
      ctx.moveTo(m.wx, m.wy);
      ctx.arc(m.wx, m.wy, m.def.radius + 26, ang - m.def.shieldArc, ang + m.def.shieldArc);
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
  ctx.restore();
}

/**
 * 時代兵器を持つ建物の目印。脈打つ輪で「ここは普通の建物ではない」と予告する。
 * ライブ描画（建物レイヤーはキャッシュなのでここには置けない）。
 * v0.57: 焼夷塔専用だったものを全兵器へ広げ、**輪の色で種類を見分けられる**ようにした。
 */
function drawEmplacements() {
  ctx.save();
  for (const s of settlements) {
    if (!s || !s._emplacement || s.fallen) continue;
    const def = EMPLACEMENT_DEFS[s._emplacement];
    if (!def) continue;
    const pulse = 0.5 + 0.5 * Math.sin(breathTime * 3 + s.wx * 0.01);
    ctx.globalAlpha = 0.25 + 0.35 * pulse;
    ctx.strokeStyle = def.ring;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(s.wx, s.wy, s.radius + 6 + pulse * 4, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = def.ring;
    ctx.beginPath();
    ctx.arc(s.wx, s.wy, 3.2, 0, Math.PI * 2);
    ctx.fill();

    // v0.60: 押してくる建物（衝撃砲台）は、押してくる**敵と同じ記号**を出す。
    // 外へ広がり続ける輪＋4方向のくさび＝「ここに入ると飛ばされる」。
    if (def.knockback) {
      const kph = (breathTime * 0.75 + s.wx * 0.013) % 1;
      for (let k = 0; k < 2; k++) {
        const ph = (kph + k * 0.5) % 1;
        ctx.globalAlpha = 0.50 * (1 - ph);
        ctx.strokeStyle = KNOCKBACK_MARK_COLOR;
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.arc(s.wx, s.wy, s.radius * (0.9 + ph * 1.3), 0, Math.PI * 2);
        ctx.stroke();
      }
      const wedge = s.radius * (1.2 + 0.3 * Math.sin(breathTime * 3 + s.wx * 0.01));
      ctx.globalAlpha = 0.75;
      ctx.fillStyle = KNOCKBACK_MARK_COLOR;
      for (let k = 0; k < 4; k++) {
        const a = k * (Math.PI / 2) + Math.PI / 4;
        const cosA = Math.cos(a), sinA = Math.sin(a);
        ctx.beginPath();
        ctx.moveTo(s.wx + cosA * (wedge + 7), s.wy + sinA * (wedge + 7));
        ctx.lineTo(s.wx + cosA * wedge - sinA * 4.2, s.wy + sinA * wedge + cosA * 4.2);
        ctx.lineTo(s.wx + cosA * wedge + sinA * 4.2, s.wy + sinA * wedge - cosA * 4.2);
        ctx.closePath();
        ctx.fill();
      }
    }
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

/** 危険地帯の描画。カメラ変換の内側（ワールド座標）で呼ぶ。 */
function drawHazards() {
  if (hazards.length === 0) return;
  ctx.save();
  for (const h of hazards) {
    const age   = h.maxLife - h.life;
    const rNow  = hazardRadiusAt(h);
    const warn  = age < HAZARD_WARN_TIME;
    // 消える間際は薄くなる＝「もう抜けていい」が読める
    const fade  = Math.min(1, h.life / 0.6);
    if (warn) {
      // 予告: 輪だけが点滅する（まだ安全）
      ctx.globalAlpha = 0.35 + 0.35 * Math.abs(Math.sin(age * 14));
      ctx.strokeStyle = h.color;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(h.x, h.y, rNow, 0, Math.PI * 2);
      ctx.stroke();
    } else {
      ctx.globalAlpha = 0.16 * fade;
      ctx.fillStyle = h.color;
      ctx.beginPath();
      ctx.arc(h.x, h.y, rNow, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 0.5 * fade;
      ctx.strokeStyle = h.color;
      ctx.lineWidth = 2;
      ctx.stroke();
      // 内側で揺らめく小さな輪（静止画に見せない）
      ctx.globalAlpha = 0.22 * fade;
      ctx.beginPath();
      ctx.arc(h.x, h.y, rNow * (0.45 + 0.12 * Math.sin(age * 5)), 0, Math.PI * 2);
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

/** ステージの移動敵を生成する。waypoint はボス要塞圏・スタート地点を避けて取る。 */
function generateMovers(stageIndex, boss, tierForCount = 0) {
  const spawns = MOVER_SPAWNS_BY_STAGE[stageIndex];
  const result = [];

  const bossClear2 = (WALL_OUTER_RING_RADIUS + 150) ** 2;
  function randPoint() {
    for (let attempt = 0; attempt < 20; attempt++) {
      const x = 300 + random() * (WORLD_W - 600);
      const y = 250 + random() * (WORLD_H - 500);
      if (dist2(x, y, boss.wx, boss.wy) < bossClear2) continue;
      if (dist2(x, y, 250, WORLD_H * 0.5) < 500 * 500) continue;
      return { x, y };
    }
    return { x: WORLD_W * 0.5, y: WORLD_H * 0.5 };
  }

  // v0.41: ボス直衛の守備隊。巡回点をボス周りのリング内に限定して湧かせる。
  const garrison = BOSS_GARRISON_BY_STAGE[stageIndex] ?? [];
  function garrisonPoint() {
    const a = random() * Math.PI * 2;
    const r = BOSS_GARRISON_INNER + random() * (BOSS_GARRISON_OUTER - BOSS_GARRISON_INNER);
    return {
      x: Math.max(60, Math.min(WORLD_W - 60, boss.wx + Math.cos(a) * r)),
      y: Math.max(60, Math.min(WORLD_H - 60, boss.wy + Math.sin(a) * r)),
    };
  }

  // 通常枠（マップ全体を巡回）＋ 守備隊枠（ボス周りだけを巡回）をまとめて処理する。
  // 3要素目 true が守備隊 = 巡回点の生成器だけを差し替える。
  // v0.49: マップ全体を巡回する枠はワールド面積に合わせて増やす。
  // 大陸サイズで数を据え置くと動く敵に一度も出会わないまま終わってしまう。
  // 守備隊はボス周りの固定半径を巡回するので、密度は世界の広さに影響されない＝据え置き。
  // v0.56: 動員段階のぶんだけ部隊数を増やす（守備隊はボス周りの固定半径なので据え置き）
  const tierMult = TIER_MOVER_MULT[clampTier(tierForCount)] ?? 1;
  const spawnEntries = spawns.map(e => [e[0], Math.max(1, Math.round(scaledForWorld(e[1], MOVER_DENSITY_FACTOR) * tierMult)), false])
                             .concat(garrison.map(e => [e[0], e[1], true]));

  for (const [defKey, count, isGarrison] of spawnEntries) {
    const def = MOVER_DEFS[defKey];
    const pointFor = isGarrison ? garrisonPoint : randPoint;
    for (let k = 0; k < count; k++) {
      // v0.13: packCount 持ちの敵は「同じ経路を共有する別々の個体」を頭数分湧かせる。
      // 先頭個体の経路・出現位置を仲間へ複製し、位置は散らして群れの初期配置にする。
      const leader = makeMover(def, pointFor);
      const pack = [leader];
      for (let p = 1; p < (def.packCount ?? 1); p++) {
        const member = makeMover(def, pointFor);
        member.waypoints = leader.waypoints;   // 経路を共有（配列参照ごと）
        member.wpIdx     = leader.wpIdx;
        member.wpDir     = leader.wpDir;
        member.wx = leader.wx + randRange(-70, 70);
        member.wy = leader.wy + randRange(-70, 70);
        pack.push(member);
      }
      for (const mover of pack) {
        if (def.packCount) {
          mover.packId    = nextPackId;
          // 歩調のゆらぎ（全員同速だと隊列が凍って見える。±8%で追い越し・遅れが出る）
          mover.speedMult = randRange(0.92, 1.08);
        }
        // v0.15: HP・XPともステージスケールなし（種類による固定値）。
        // ステージ進行の脅威は攻撃の苛烈さ（moverStageFerocity）と数で表現する
        mover.maxHp   = def.hp;
        mover.hp      = def.hp;
        mover.xpValue = def.xp;
        result.push(mover);
      }
      if (def.packCount) nextPackId++;
    }
  }

  // v0.25.1: 財宝馬車を1体（逃げるボーナス）。どのステージにも1つの"当たり枠"。
  {
    const t = makeMover(MOVER_DEFS.treasure, randPoint);
    t.maxHp   = MOVER_DEFS.treasure.hp;
    t.hp      = MOVER_DEFS.treasure.hp;
    t.xpValue = MOVER_DEFS.treasure.xp;
    result.push(t);
  }

  // v0.26: 巨獣（多パーツボス）を後半の一部ステージ（STAGE6・STAGE8）に1体。
  if (stageIndex === 5 || stageIndex === 7) {
    const core = makeMover(MOVER_DEFS.behemoth_core, randPoint);
    core.maxHp   = MOVER_DEFS.behemoth_core.hp;
    core.hp      = MOVER_DEFS.behemoth_core.hp;
    core.xpValue = MOVER_DEFS.behemoth_core.xp;
    result.push(core);
    for (const side of [-1, 1]) {
      const arm = makeMover(MOVER_DEFS.behemoth_arm, randPoint);
      arm.maxHp       = MOVER_DEFS.behemoth_arm.hp;
      arm.hp          = MOVER_DEFS.behemoth_arm.hp;
      arm.xpValue     = MOVER_DEFS.behemoth_arm.xp;
      arm.parent      = core;
      arm.armSide     = side;   // -1=左 / +1=右（コアの向きに対する脇）
      arm.attackTimer = random() * 2;
      core[side < 0 ? "armL" : "armR"] = arm;
      result.push(arm);
    }
  }

  return result;
}

// v0.13: 群れ（pack）識別子の採番。ステージを跨いで一意なら十分
let nextPackId = 1;

// 群れの結束・分離パラメータ
const PACK_COHESION_DIST   = 160;  // 群れ重心からこれ以上離れた個体は重心へ寄せる
const PACK_SEPARATION_GAP  = 6;    // 同一pack個体間に確保する隙間（半径の和に加算）

/** 移動敵1体を生成する（経路生成込み）。 */
function makeMover(def, randPoint) {
  {
    const waypoints = [];
    if (def.moveType === "loop") {
      // 外周航路: マップ縁に沿った6点の周回路
      const marginX = 400, marginY = 320;
      waypoints.push(
        { x: marginX, y: marginY },
        { x: WORLD_W * 0.5, y: marginY * 0.8 },
        { x: WORLD_W - marginX, y: marginY },
        { x: WORLD_W - marginX, y: WORLD_H - marginY },
        { x: WORLD_W * 0.5, y: WORLD_H - marginY * 0.8 },
        { x: marginX, y: WORLD_H - marginY },
      );
    } else if (def.moveType === "patrol") {
      for (let p = 0; p < 4; p++) waypoints.push(randPoint());
    } else {
      // pingpong: 2点間往復（600〜1200px 離す）
      const a = randPoint();
      let b = randPoint();
      for (let attempt = 0; attempt < 10; attempt++) {
        const d2ab = dist2(a.x, a.y, b.x, b.y);
        if (d2ab > 600 * 600 && d2ab < 1200 * 1200) break;
        b = randPoint();
      }
      waypoints.push(a, b);
    }

    const start = waypoints[Math.floor(random() * waypoints.length)];
    return {
      def,
      hp: def.hp,
      maxHp: def.hp,
      wx: start.x + randRange(-40, 40),
      wy: start.y + randRange(-40, 40),
      headingX: 1,
      headingY: 0,
      waypoints,
      wpIdx: Math.floor(random() * waypoints.length),
      wpDir: 1,                 // pingpong 用の進行方向（1/-1）
      attackTimer: random() * 2.0,
      beamTargetIdx: -1,        // colossus の照射対象（描画用）
      swayPhase: random() * Math.PI * 2,  // v0.9: 生気づけアニメの個体位相
      alive: true,
    };
  }
}

// v0.27: 召喚門が湧かせたレイダーの一時置き場（updateMovers 反復後にまとめて movers へ）
const _pendingMovers = [];

// v0.26: 巨獣の腕の挙動パラメータ
const BEHEMOTH_ARM_ORBIT         = 100;  // コア中心からの浮遊半径
const BEHEMOTH_ARM_SLAM_INTERVAL = 2.4;  // 叩きつけ間隔（秒）
const BEHEMOTH_ARM_SLAM_RANGE    = 280;  // 叩きつけを始める距離
const BEHEMOTH_ARM_SLAM_RADIUS   = 120;  // 衝撃波半径
const BEHEMOTH_ARM_SLAM_DMG      = 6;    // 衝撃波ダメージ
const BEHEMOTH_ARM_SLAM_PUSH     = 70;   // ノックバック距離（通常の踏鳴らし26より強い）

// 指定座標に衝撃波を発生（範囲内の竜へダメージ＋外向き押し飛ばし＋リングFX）。
/**
 * v0.43: 連鎖電撃。最寄りの竜に落ちてから、**触れている仲間へ次々に広がる**（幅優先）。
 * v0.57: 敵（雷撃塔車）と建物（テスラ塔）の両方から呼べるよう関数に切り出した。
 *
 * 一本道で辿ると、最初に落ちた1体が群れの端のはぐれ個体だった場合にそこで途切れる
 * （実測: 密集しているのに2体で止まった）。幅優先なら塊の中へ入った時点で全体へ回る。
 * 1体ごとのダメージは**その竜の周りの密度**に比例＝固めるほど痛い。
 * @returns {boolean} 撃てたら true（射程内に竜が居なければ false）
 */
function emitChainLightning(fromX, fromY, atk, ferocity = 1) {
  const dRange2 = atk.densityRange * atk.densityRange;
  const hopR2   = atk.hopRange * atk.hopRange;
  const range2  = atk.range * atk.range;

  let nearestIdx = -1, nearestD2 = Infinity;
  for (let i = 0; i < N; i++) {
    if (boidDead[i] || boidDowned[i]) continue;
    const dx = px[i] - fromX, dy = py[i] - fromY;
    const d2 = dx * dx + dy * dy;
    if (d2 < nearestD2) { nearestD2 = d2; nearestIdx = i; }
  }
  if (nearestIdx < 0 || nearestD2 > range2) return false;

  // 落雷点は「最寄り」だが、**はぐれ個体には落とさない**。
  // 群れの端の1体に落ちるとそこで途切れて、密集させても何も起きない
  // （実測: 平均6.9体の隣がいる密集状態なのに1体しか感電しなかった）。
  const hasNeighbour = (idx) => {
    for (let i = 0; i < N; i++) {
      if (i === idx || boidDead[i] || boidDowned[i]) continue;
      const dx2 = px[i] - px[idx], dy2 = py[i] - py[idx];
      if (dx2 * dx2 + dy2 * dy2 < hopR2) return true;
    }
    return false;
  };
  let strike = nearestIdx;
  if (!hasNeighbour(strike)) {
    let bestD2s = Infinity;
    for (let i = 0; i < N; i++) {
      if (boidDead[i] || boidDowned[i]) continue;
      const dx2 = px[i] - fromX, dy2 = py[i] - fromY;
      const d2s = dx2 * dx2 + dy2 * dy2;
      if (d2s < bestD2s && d2s < range2 && hasNeighbour(i)) { bestD2s = d2s; strike = i; }
    }
  }

  // ① 触れ合っている仲間をたどって感電する範囲を集める（幅優先）
  const segs = [[fromX, fromY, px[strike], py[strike]]];
  const hitList = [strike];
  const hitSet = new Set(hitList);
  for (let q = 0; q < hitList.length && hitList.length < atk.hops; q++) {
    const cur = hitList[q];
    for (let i = 0; i < N && hitList.length < atk.hops; i++) {
      if (boidDead[i] || boidDowned[i] || hitSet.has(i)) continue;
      const cdx = px[i] - px[cur], cdy = py[i] - py[cur];
      if (cdx * cdx + cdy * cdy > hopR2) continue;
      hitSet.add(i);
      hitList.push(i);
      segs.push([px[cur], py[cur], px[i], py[i]]);
    }
  }
  // ② 集めきってからダメージを配る（集計と適用を分けないと、
  //    上限に達した時点で残りが無傷のまま終わる）
  for (const idx of hitList) {
    let neighbours = 0;
    for (let i = 0; i < N; i++) {
      if (i === idx || boidDead[i] || boidDowned[i]) continue;
      const ndx2 = px[i] - px[idx], ndy2 = py[i] - py[idx];
      if (ndx2 * ndx2 + ndy2 * ndy2 < dRange2) neighbours++;
    }
    const mult = Math.min(atk.densityMax, 1 + neighbours * atk.densityScale);
    applyDamageToBoid(idx, atk.damage * ferocity * mult);
  }
  chainFxList.push({ segs, life: CHAIN_FX_DURATION });
  return true;
}

function emitShockwave(wx, wy, radius, damage, pushDist) {
  shockwaveFxList.push({ x: wx, y: wy, maxR: radius, life: SHOCKWAVE_FX_DURATION });
  for (let i = 0; i < N; i++) {
    if (boidDead[i] || boidDowned[i]) continue;
    const sdx = px[i] - wx, sdy = py[i] - wy;
    const sd2 = sdx * sdx + sdy * sdy;
    if (sd2 < radius * radius) {
      applyDamageToBoid(i, damage);
      const sd = Math.sqrt(sd2) || 1;
      // v0.34.1: 位置を直接ずらすとワープに見えるので、減衰する外力で押す
      applyKickDist(i, sdx / sd, sdy / sd, pushDist);
    }
  }
  hapticPulse(25);
}

// 巨獣の腕: コアの左右に浮遊（ゆっくり漂う）し、最寄りの竜へ拳を向けて叩きつける。
// コアが倒れると腕も落ちる（道連れ）。腕自身は個別HPで先に壊せる。
function updateBehemothArm(m, dt) {
  const core = m.parent;
  if (!core || !core.alive) { m.alive = false; return; }
  const t = performance.now() * 0.001;
  // コアの向き（進行方向）に対する左右（±90度）へ配置。コアが回頭すると腕も脇へ追従する。
  const coreAng = Math.atan2(core.headingY, core.headingX);
  const ang     = coreAng + m.armSide * (Math.PI / 2) + Math.sin(t * 0.8 + m.swayPhase) * 0.18;
  const orbit   = BEHEMOTH_ARM_ORBIT + Math.sin(t * 1.1 + m.swayPhase) * 10;
  m.wx = core.wx + Math.cos(ang) * orbit;
  m.wy = core.wy + Math.sin(ang) * orbit;

  const nearestIdx = findNearestAliveBoid(m.wx, m.wy);
  if (nearestIdx < 0) { m.headingX = Math.cos(ang); m.headingY = Math.sin(ang); return; }
  // 拳を最寄りの竜へ向ける
  let hx = px[nearestIdx] - m.wx, hy = py[nearestIdx] - m.wy;
  const hl = Math.sqrt(hx * hx + hy * hy) || 1;
  m.headingX = hx / hl; m.headingY = hy / hl;

  m.attackTimer -= dt;
  if (m.attackTimer > 0) return;
  if (hl < BEHEMOTH_ARM_SLAM_RANGE) {
    m.attackTimer = BEHEMOTH_ARM_SLAM_INTERVAL / moverStageFerocity(currentStage);
    emitShockwave(m.wx, m.wy, BEHEMOTH_ARM_SLAM_RADIUS, BEHEMOTH_ARM_SLAM_DMG, BEHEMOTH_ARM_SLAM_PUSH);
    triggerFlash("rgba(255,120,40,0.16)", 0.12);
  } else {
    m.attackTimer = 0.4;   // 射程外は短い再チェック
  }
}

function updateMovers(dt) {
  // 衝撃波FXの寿命更新
  for (let i = shockwaveFxList.length - 1; i >= 0; i--) {
    shockwaveFxList[i].life -= dt;
    if (shockwaveFxList[i].life <= 0) shockwaveFxList.splice(i, 1);
  }

  // v0.13: 群れ（pack）ごとの重心を先に集計（はぐれ個体の引き戻しに使う）
  const packCentroids = new Map();
  for (const m of movers) {
    if (!m.alive || m.packId === undefined) continue;
    let c = packCentroids.get(m.packId);
    if (!c) { c = { x: 0, y: 0, n: 0 }; packCentroids.set(m.packId, c); }
    c.x += m.wx; c.y += m.wy; c.n++;
  }

  for (const m of movers) {
    if (!m.alive) continue;
    const def = m.def;

    // v0.26: 巨獣の腕はコアに追従して浮遊し、独自ロジックで叩きつける
    if (def.part === "arm") { updateBehemothArm(m, dt); continue; }

    // v0.42: 潜行者 — 潜っている間は無敵・攻撃なし。移動は続けるので「どこから出るか」を読む。
    if (def.submerge) {
      if (m.submergeTimer === undefined) {
        m.submerged = true;
        m.submergeTimer = def.submerge.hidden * (0.4 + random() * 0.6);   // 個体ごとに位相をずらす
      }
      m.submergeTimer -= dt;
      if (m.submergeTimer <= 0) {
        m.submerged = !m.submerged;
        m.submergeTimer = m.submerged ? def.submerge.hidden : def.submerge.exposed;
        // 浮上の瞬間は土煙＝「今叩ける」の合図
        if (!m.submerged) { spawnCollisionParticles(m.wx, m.wy); m.attackTimer = 0.35; }
      }
    }

    // ---- 移動 ----
    // v0.7: 全移動敵が追跡型に。反応距離内に群れがいれば重心へ進撃、
    // いなければ各自の経路（往復/巡回/外周）を回る。
    let targetX, targetY;
    let pursuing = false;
    const centroid = calcFriendlyCentroid();
    if (dist2(m.wx, m.wy, centroid.x, centroid.y) < MOVER_PURSUIT_RANGE * MOVER_PURSUIT_RANGE) {
      if (def.fleer) {
        // v0.25.1: 財宝馬車は群れから離れる方向へ逃げる（追いかける楽しさ）
        const fx = m.wx - centroid.x, fy = m.wy - centroid.y;
        const fd = Math.sqrt(fx * fx + fy * fy) || 1;
        targetX = m.wx + (fx / fd) * 300;
        targetY = m.wy + (fy / fd) * 300;
      } else {
        targetX = centroid.x;
        targetY = centroid.y;
      }
      pursuing = true;
    }
    if (!pursuing) {
      const wp = m.waypoints[m.wpIdx];
      targetX = wp.x;
      targetY = wp.y;
      if (dist2(m.wx, m.wy, wp.x, wp.y) < 40 * 40) {
        // 到着 → 次のwaypointへ（pingpongは端で折り返し、他は周回）
        if (def.moveType === "pingpong") {
          if (m.wpIdx + m.wpDir < 0 || m.wpIdx + m.wpDir >= m.waypoints.length) m.wpDir *= -1;
          m.wpIdx += m.wpDir;
        } else {
          m.wpIdx = (m.wpIdx + 1) % m.waypoints.length;
        }
      }
    }

    // v0.13: はぐれ個体は群れの重心方向へ目標をブレンド（経路共有＋これで群れが保たれる）
    if (m.packId !== undefined) {
      const c = packCentroids.get(m.packId);
      if (c && c.n > 1) {
        const cx = c.x / c.n;
        const cy = c.y / c.n;
        if (dist2(m.wx, m.wy, cx, cy) > PACK_COHESION_DIST * PACK_COHESION_DIST) {
          targetX = (targetX + cx * 2) / 3;
          targetY = (targetY + cy * 2) / 3;
        }
      }
    }

    const dx = targetX - m.wx;
    const dy = targetY - m.wy;
    const d  = Math.sqrt(dx * dx + dy * dy) || 1;
    const dirX = dx / d, dirY = dy / d;
    // 進む向き。既定は「向いている方向」＝従来と同じ（向きが即座に目標を向くため）
    let moveX = dirX, moveY = dirY;

    if (def.stepTurn) {
      // 巨人型: 向きは60度刻み。移動は目標方向のままなので**横歩き・後ずさり**が出る
      const want = Math.atan2(dirY, dirX);
      if (m.faceAngle === undefined) m.faceAngle = Math.round(want / def.stepTurn) * def.stepTurn;
      if (Math.abs(wrapAngle(want - m.faceAngle)) > STEP_TURN_HYSTERESIS) {
        m.faceAngle = Math.round(want / def.stepTurn) * def.stepTurn;
      }
      m.headingX = Math.cos(m.faceAngle);
      m.headingY = Math.sin(m.faceAngle);
    } else if (def.turnRate) {
      // 船・車両: 旋回角速度に上限。**向いている方向にしか進めない**ので大回りになる
      const cur  = Math.atan2(m.headingY, m.headingX);
      const diff = wrapAngle(Math.atan2(dirY, dirX) - cur);
      const maxTurn = def.turnRate * dt;
      const next = cur + Math.max(-maxTurn, Math.min(maxTurn, diff));
      m.headingX = Math.cos(next);
      m.headingY = Math.sin(next);
      moveX = m.headingX;
      moveY = m.headingY;
    } else {
      m.headingX = dirX;
      m.headingY = dirY;
    }

    // v0.61: 画面外から来る増援は、群れに近づくまで行軍速度で走る
    const moveSpeed = def.speed * (m.speedMult ?? 1) * (m._marching ? BOSS_REINFORCE_MARCH_MULT : 1);
    m.wx += moveX * moveSpeed * dt;
    m.wy += moveY * moveSpeed * dt;

    // 地形（岩山）は移動敵も回り込む（押し出しスライド）。飛行ユニットは無視。
    // v0.17.1: 湖は単なる背景（当たり判定なし）にしたので押し出し対象から除外
    if (def.flying) { /* 気球は地形を飛び越える */ } else
    for (const ob of terrainObstacles) {
      if (ob.type === "lake") continue;   // 湖は素通り（背景扱い）
      const odx = m.wx - ob.wx;
      const ody = m.wy - ob.wy;
      const minD = ob.radius + def.radius;
      const od2  = odx * odx + ody * ody;
      if (od2 < minD * minD && od2 > 0) {
        const od = Math.sqrt(od2);
        m.wx = ob.wx + (odx / od) * minD;
        m.wy = ob.wy + (ody / od) * minD;
      }
    }

    // ---- 攻撃 ----
    const nearestIdx = findNearestAliveBoid(m.wx, m.wy);
    if (nearestIdx < 0) { m.beamTargetIdx = -1; continue; }
    const ndx = px[nearestIdx] - m.wx;
    const ndy = py[nearestIdx] - m.wy;
    const nearestD2 = ndx * ndx + ndy * ndy;

    const atk = def.attack;
    if (!atk) { m.beamTargetIdx = -1; continue; }   // v0.25.1: 財宝馬車など無攻撃ユニット
    if (m.submerged) { m.beamTargetIdx = -1; continue; }   // v0.42: 潜行中は撃たない
    // v0.15: ステージが進むほど攻撃が苛烈に（間隔短縮・ビームDPS増。HPは据え置き）
    const ferocity = moverStageFerocity(currentStage);
    if (atk.type === "beam") {
      // コロッサス: 眼光ビーム（持続照射）
      // v0.63: atk.frontArc があると**正面の扇の中にいる竜にしか当たらない**。
      // 向きが60度刻みでしか変わらないので「正面から外れる」が有効な回避になる。
      // そのぶん dps は上げてある（当てられたら苛烈）。
      let inFront = true;
      if (atk.frontArc !== undefined) {
        const toTarget = Math.atan2(ndy, ndx);
        const face = Math.atan2(m.headingY, m.headingX);
        inFront = Math.abs(wrapAngle(toTarget - face)) < atk.frontArc;
      }
      if (inFront && nearestD2 < atk.range * atk.range) {
        m.beamTargetIdx = nearestIdx;
        applyDamageToBoid(nearestIdx, atk.dps * ferocity * dt);
      } else {
        m.beamTargetIdx = -1;
      }
      continue;
    }

    // v0.27: 治癒塔 — 周囲の建物/移動敵を回復（群れの近接に依存せず常時作動＝放置で長引く優先目標）
    if (atk.type === "heal") {
      m.attackTimer -= dt;
      if (m.attackTimer <= 0) {
        m.attackTimer = atk.interval;
        const r2 = atk.radius * atk.radius;
        for (const s of settlements) {
          if (!s || s.fallen || s.isBoss || !s.maxHp) continue;
          const dx = s.wx - m.wx, dy = s.wy - m.wy;
          if (dx * dx + dy * dy < r2 && s.hp < s.maxHp) s.hp = Math.min(s.maxHp, s.hp + atk.heal);
        }
        for (const o of movers) {
          if (!o.alive || o === m || o.def.part) continue;   // 巨獣パーツは回復対象外
          const dx = o.wx - m.wx, dy = o.wy - m.wy;
          if (dx * dx + dy * dy < r2 && o.hp < o.maxHp) o.hp = Math.min(o.maxHp, o.hp + atk.heal);
        }
        shockwaveFxList.push({ x: m.wx, y: m.wy, maxR: atk.radius * 0.4, life: SHOCKWAVE_FX_DURATION });
      }
      continue;
    }

    // v0.27: 召喚門 — レイダーを能動的に湧かせて群れを分散させる（門を壊すと湧きが止まる）
    if (atk.type === "summon") {
      m.attackTimer -= dt;
      if (m.attackTimer <= 0) {
        m.attackTimer = atk.interval;
        let raiders = 0;
        for (const o of movers) if (o.alive && o.def.name === "raider") raiders++;
        if (raiders < (atk.cap ?? 8)) {
          const ra = makeMover(MOVER_DEFS.raider, () => ({ x: m.wx, y: m.wy }));
          ra.wx = m.wx + (random() - 0.5) * 40;
          ra.wy = m.wy + (random() - 0.5) * 40;
          ra.xpValue = MOVER_DEFS.raider.xp;
          _pendingMovers.push(ra);   // 反復中は直接 push せず末尾でまとめて追加
          spawnCollisionParticles(m.wx, m.wy);
        }
      }
      continue;
    }

    if (nearestD2 > MOVER_ENGAGE_RANGE * MOVER_ENGAGE_RANGE) continue;
    m.attackTimer -= dt;
    if (m.attackTimer > 0) continue;
    m.attackTimer = atk.interval / ferocity;

    if (atk.type === "shockwave") {
      // 踏鳴らし/叩きつけ: 半径内の全個体にダメージ＋押し飛ばし＋リングFX（emitShockwave に集約）
      // atk.push を持つ敵（衝撃兵など）は通常より強く吹き飛ばす。
      if (nearestD2 < (atk.radius + 60) * (atk.radius + 60)) {
        emitShockwave(m.wx, m.wy, atk.radius, atk.damage, atk.push ?? SHOCKWAVE_PUSH_DIST);
      } else {
        m.attackTimer = 0.4; // 射程外: 短い再チェック間隔で待機
      }
    } else if (atk.type === "fan") {
      // 騎士方陣: 扇状の矢斉射
      // v0.59: atk.kind=1 を指定すると**カタパルト弾**（強ノックバック）で撃つ。
      // 散弾砲車・衝撃砲がこれで「押してくる射撃」になる。
      if (nearestD2 < atk.range * atk.range) {
        const baseAngle = Math.atan2(ndy, ndx);
        const fanSpread = atk.spread ?? 0.22;
        for (let k = -(atk.count >> 1); k <= (atk.count >> 1); k++) {
          spawnFanProjectileRaw(m.wx, m.wy, baseAngle + k * fanSpread, atk.speed, atk.damage,
                                atk.color ?? "#e8eef8", atk.kind ?? 0, 0, atk.knockR ?? 0);
        }
      } else {
        m.attackTimer = 0.4;
      }
    } else if (atk.type === "broadside") {
      // 陸上甲鉄艦: 進行方向と直交する2方向に3連砲
      const heading = Math.atan2(m.headingY, m.headingX);
      for (const side of [Math.PI / 2, -Math.PI / 2]) {
        for (let k = -1; k <= 1; k++) {
          spawnFanProjectileRaw(m.wx, m.wy, heading + side + k * 0.15, atk.speed, atk.damage, "#90b0d0", 1);
        }
      }
    } else if (atk.type === "chain") {
      // v0.43: 連鎖電撃（本体は emitChainLightning。v0.57で建物のテスラ塔と共有した）
      if (nearestD2 < atk.range * atk.range) {
        emitChainLightning(m.wx, m.wy, atk, ferocity);
      } else {
        m.attackTimer = 0.4;
      }
    } else if (atk.type === "hazard") {
      // v0.42: 持続する範囲攻撃。atTarget=true なら群れの足元、false なら自分の周り。
      if (nearestD2 < atk.range * atk.range) {
        const hx = atk.atTarget ? px[nearestIdx] : m.wx;
        const hy = atk.atTarget ? py[nearestIdx] : m.wy;
        spawnHazard(hx, hy, atk.radius, atk.life, atk.damage ?? atk.dps, atk.color,
                    atk.growFrom ?? atk.radius, m.wx, m.wy);   // v0.63: 見せ弾の発射元
      } else {
        m.attackTimer = 0.4;
      }
    } else if (atk.type === "shell") {
      // v0.57: 予告円つきの着弾弾を散らして落とす（建物の臼砲と同じ部品）。
      // 「線を外す」ではなく「円から退く」を敵側にも持たせる枠。
      if (nearestD2 < atk.range * atk.range) {
        const stx = px[nearestIdx], sty = py[nearestIdx];
        for (let k = 0; k < atk.count; k++) {
          const sa = random() * Math.PI * 2;
          const sr = random() * atk.scatter;
          queueShell(k * 0.2, m.wx, m.wy, stx + Math.cos(sa) * sr, sty + Math.sin(sa) * sr,
                     atk.speed, atk.damage * ferocity, atk.aoe, atk.color);
        }
      } else {
        m.attackTimer = 0.4;
      }
    } else if (atk.type === "bomb") {
      // v0.7 爆撃気球: 最寄りの竜めがけてAoE爆弾を投下（projectileAoe で着弾時に範囲被害）
      if (nearestD2 < atk.range * atk.range) {
        spawnProjectile(m.wx, m.wy, nearestIdx, atk.speed, atk.damage, "#e0b070", atk.aoe, false, 1);
      } else {
        m.attackTimer = 0.4;
      }
    }
  }

  // v0.13: 同一pack内の分離（重なり防止の相互押し出し）。
  // pack人数は最大8・mover総数も少ないためO(n^2)で十分
  for (let i = 0; i < movers.length; i++) {
    const a = movers[i];
    if (!a.alive || a.packId === undefined) continue;
    for (let j = i + 1; j < movers.length; j++) {
      const b = movers[j];
      if (!b.alive || b.packId !== a.packId) continue;
      const sdx = b.wx - a.wx;
      const sdy = b.wy - a.wy;
      const minD = a.def.radius + b.def.radius + PACK_SEPARATION_GAP;
      const sd2 = sdx * sdx + sdy * sdy;
      if (sd2 < minD * minD && sd2 > 0.01) {
        const sd = Math.sqrt(sd2);
        const push = (minD - sd) * 0.5;
        const nx = sdx / sd;
        const ny = sdy / sd;
        a.wx -= nx * push; a.wy -= ny * push;
        b.wx += nx * push; b.wy += ny * push;
      }
    }
  }

  // v0.27: 反復中に召喚門が積んだレイダーを、ここでまとめて movers へ追加する（反復中の破壊的変更を避ける）
  if (_pendingMovers.length) {
    for (const nm of _pendingMovers) movers.push(nm);
    _pendingMovers.length = 0;
  }
}

// -----------------------------------------------------------------
// v0.7: ボスノヴァ — ボスが周期的に放つ反発衝撃波。
// 「序盤は跳ね返される」の本体: 育っていない群れはボスに張り付けない。
// -----------------------------------------------------------------
let bossSettlementIdx = -1;   // 現ステージのボス index（generateStageLayout 後に検索）
let bossNovaTimer = BOSS_NOVA_INTERVAL;
// v0.48 → v0.57: 首都の大技。**文明ごとに1種**（STAGE_FEATURES[].bossArt）。
// 共通する作法は「予兆を見せてから当てる」。どれも1〜2秒の猶予があり、
// 群れを動かせば無傷で抜けられる＝見せ場でありながら腕が結果に出る。
const BOSS_ART_INTERVAL   = 7.5;   // 大技の間隔（全時代共通）
const BOSS_ART_RANGE      = 1500;  // この距離に群れが居ないと撃たない（無人の空へ撃たない）
const BOSS_LASER_WIDTH    = 86;    // 極太。群れの塊がまるごと入る
const BOSS_LASER_LENGTH   = 1500;  // 画面を越えて伸びる
const BOSS_LASER_DPS      = 26;
// 石器: 巨岩投擲
const BOSS_BOULDER_COUNT  = 3;
const BOSS_BOULDER_SPEED  = 170;
const BOSS_BOULDER_DMG    = 7;
const BOSS_BOULDER_AOE    = 118;
// 古代: 神託の光柱（円周に立つ火柱。1か所だけ空けて逃げ道にする）
const BOSS_PILLAR_SLOTS   = 8;
const BOSS_PILLAR_INNER   = 62;    // 内側の柱（重心を覆う＝居座ると必ず焼ける）
const BOSS_PILLAR_OUTER   = 140;   // 外側の柱（逃げ道を狭める）
const BOSS_PILLAR_RADIUS  = 74;
const BOSS_PILLAR_LIFE    = 3.2;
const BOSS_PILLAR_DPS     = 4.5;  // 8だと居座った群れに1388（レーザーの1.7倍）入りすぎた
// 中世: 矢の雨
const BOSS_RAIN_COUNT     = 34;   // 26だと当たりが疎で、測定のたび 27〜75 と暴れた
const BOSS_RAIN_AREA      = 175;
const BOSS_RAIN_SPREAD    = 1.8;   // 降り切るまでの秒数
const BOSS_RAIN_SPEED     = 300;
const BOSS_RAIN_DMG       = 3.0;
const BOSS_RAIN_AOE       = 26;
// 近世: 一斉射（弾の壁）
const BOSS_VOLLEY_COUNT   = 13;
const BOSS_VOLLEY_ARC     = 0.5;
const BOSS_VOLLEY_WAVES   = [95, 80, 66];   // 同時に撃つが速度差で3枚の壁になる
const BOSS_VOLLEY_SPEED   = 95;
const BOSS_VOLLEY_DMG     = 3;
const BOSS_VOLLEY_RANGE   = 900;   // 既定の catapult 射程(420)では首都から群れへ届かない
// 産業: 絨毯爆撃（首都から群れへ向かって歩いてくる爆発の列）
const BOSS_CARPET_COUNT   = 10;
const BOSS_CARPET_STEP    = 95;
const BOSS_CARPET_DELAY   = 0.13;
const BOSS_CARPET_SPEED   = 210;
const BOSS_CARPET_DMG     = 4;
const BOSS_CARPET_AOE     = 74;
// 大戦: 対空弾幕
const BOSS_STORM_COUNT    = 26;   // 同上（16発では 18〜165 と安定しない）
const BOSS_STORM_AREA     = 150;
const BOSS_STORM_SPREAD   = 2.2;
const BOSS_STORM_SPEED    = 285;
const BOSS_STORM_DMG      = 3.0;
const BOSS_STORM_AOE      = 46;
// 最終: 十字プリズム（4方向の同時照射。四象限のどれかへ抜ける）
const BOSS_CROSS_WIDTH    = 46;
const BOSS_CROSS_LENGTH   = 1300;
const BOSS_CROSS_DPS      = 20;

let bossArtTimer = BOSS_ART_INTERVAL;

function cacheBossIndex() {
  bossSettlementIdx = settlements.findIndex(s => s.isBoss);
  // 建物の並びが変わったら攻撃判定クエリの走査半径も引き直す（時代兵器の射程が効くように）
  recomputeAttackQueryRadius();
  bossNovaTimer = BOSS_NOVA_INTERVAL;
  bossArtTimer = BOSS_ART_INTERVAL;
}

/**
 * v0.57: 首都の大技。文明ごとに技が変わる（STAGE_FEATURES[].bossArt）。
 * 予兆の時点で狙いが固定されるので、猶予のあいだに群れを退かせれば無傷で抜けられる。
 */
function updateBossArt(dt) {
  if (bossSettlementIdx < 0) return;
  const boss = settlements[bossSettlementIdx];
  if (!boss || boss.fallen) return;

  bossArtTimer -= dt;
  if (bossArtTimer > 0) return;

  const c = calcFriendlyCentroid();
  const dx = c.x - boss.wx, dy = c.y - boss.wy;
  if (dx * dx + dy * dy > BOSS_ART_RANGE * BOSS_ART_RANGE) { bossArtTimer = 0.6; return; }

  bossArtTimer = BOSS_ART_INTERVAL;
  fireBossArt(boss, stageFeatures(currentStage).bossArt, c.x, c.y,
              Math.atan2(dy, dx), boss._bossGlowColor ?? "#ff8800");
  triggerShake(3.5, 0.25);
  hapticPulse(60);
}

/**
 * 首都の大技を1回撃つ。
 * @param {object} boss  首都
 * @param {string} art   STAGE_FEATURES[].bossArt
 * @param {number} cx    群れの重心X
 * @param {number} cy    群れの重心Y
 * @param {number} ang   首都から群れへの向き
 * @param {string} color 首都のテーマ色
 */
function fireBossArt(boss, art, cx, cy, ang, color) {
  if (art === "boulders") {
    // 石器: 巨岩投擲。**一番大きく一番遅い**炸裂。重心とその左右へ落とす
    for (let k = 0; k < BOSS_BOULDER_COUNT; k++) {
      const off = (k - (BOSS_BOULDER_COUNT - 1) / 2) * 150;
      queueShell(k * 0.25, boss.wx, boss.wy,
                 cx + Math.cos(ang + Math.PI / 2) * off,
                 cy + Math.sin(ang + Math.PI / 2) * off,
                 BOSS_BOULDER_SPEED, BOSS_BOULDER_DMG, BOSS_BOULDER_AOE, "#e8dcc0");
    }
  } else if (art === "pillars") {
    // 古代: 神託の光柱。群れを囲む円周に火柱が立つ。**1か所だけ空ける**＝逃げ道を読ませる
    const gap = Math.floor(random() * BOSS_PILLAR_SLOTS);
    for (let k = 0; k < BOSS_PILLAR_SLOTS; k++) {
      if (k === gap) continue;
      const a = (k / BOSS_PILLAR_SLOTS) * Math.PI * 2;
      // 内・外を交互に。内側の柱が重心を覆うので**その場に留まると必ず焼ける**
      const orbit = (k % 2 === 0) ? BOSS_PILLAR_INNER : BOSS_PILLAR_OUTER;
      spawnHazard(cx + Math.cos(a) * orbit, cy + Math.sin(a) * orbit,
                  BOSS_PILLAR_RADIUS, BOSS_PILLAR_LIFE, BOSS_PILLAR_DPS, color, 20,
                  boss.wx, boss.wy);   // v0.63: 首都から光の柱が飛んでくるのを見せる
    }
  } else if (art === "arrowRain") {
    // 中世: 矢の雨。細かい着弾が1.8秒かけて降る＝**走り抜ける**のが正解
    for (let k = 0; k < BOSS_RAIN_COUNT; k++) {
      const a = random() * Math.PI * 2;
      const r = Math.sqrt(random()) * BOSS_RAIN_AREA;   // 面積で一様に散らす
      queueShell(random() * BOSS_RAIN_SPREAD, boss.wx, boss.wy,
                 cx + Math.cos(a) * r, cy + Math.sin(a) * r,
                 BOSS_RAIN_SPEED, BOSS_RAIN_DMG, BOSS_RAIN_AOE, color);
    }
  } else if (art === "volley") {
    // 近世: 一斉射。扇状の**弾の壁**。線と線の隙間を抜けるか、横へ回り込む
    for (let w = 0; w < BOSS_VOLLEY_WAVES.length; w++) {
      // 波ごとに半目盛ずらして、隙間が一直線に並ばないようにする
      const jitter = (w % 2) * (BOSS_VOLLEY_ARC / (BOSS_VOLLEY_COUNT - 1)) * 0.5;
      for (let k = 0; k < BOSS_VOLLEY_COUNT; k++) {
        const t = (k / (BOSS_VOLLEY_COUNT - 1) - 0.5);
        spawnFanProjectileRaw(boss.wx, boss.wy, ang + t * BOSS_VOLLEY_ARC + jitter,
                              BOSS_VOLLEY_WAVES[w], BOSS_VOLLEY_DMG, color, 1, BOSS_VOLLEY_RANGE);
      }
    }
  } else if (art === "carpet") {
    // 産業: 絨毯爆撃。首都から群れへ**歩いてくる**爆発の列。横へ退けば抜けられる
    for (let k = 0; k < BOSS_CARPET_COUNT; k++) {
      const d = 120 + k * BOSS_CARPET_STEP;
      queueShell(k * BOSS_CARPET_DELAY, boss.wx, boss.wy,
                 boss.wx + Math.cos(ang) * d, boss.wy + Math.sin(ang) * d,
                 BOSS_CARPET_SPEED, BOSS_CARPET_DMG, BOSS_CARPET_AOE, "#ffb060");
    }
  } else if (art === "flakStorm") {
    // 大戦: 対空弾幕。逃げ場を削るように広く長く撒く
    for (let k = 0; k < BOSS_STORM_COUNT; k++) {
      const a = random() * Math.PI * 2;
      const r = Math.sqrt(random()) * BOSS_STORM_AREA;
      queueShell(random() * BOSS_STORM_SPREAD, boss.wx, boss.wy,
                 cx + Math.cos(a) * r, cy + Math.sin(a) * r,
                 BOSS_STORM_SPEED, BOSS_STORM_DMG, BOSS_STORM_AOE, "#ffd070");
    }
  } else if (art === "prismCross") {
    // 最終: 十字プリズム。4方向を同時に焼く＝**四象限のどれかへ抜ける**しかない
    for (let k = 0; k < 4; k++) {
      spawnLaserStrike(boss.wx, boss.wy, ang + k * (Math.PI / 2),
                       BOSS_CROSS_WIDTH, BOSS_CROSS_LENGTH, BOSS_CROSS_DPS, color);
    }
  } else {
    // 電気（既定）: 極太レーザー。群れの塊がまるごと入る幅
    spawnLaserStrike(boss.wx, boss.wy, ang,
                     BOSS_LASER_WIDTH, BOSS_LASER_LENGTH, BOSS_LASER_DPS, color);
  }
}

function updateBossNova(dt) {
  if (bossSettlementIdx < 0) return;
  const boss = settlements[bossSettlementIdx];
  if (!boss || boss.fallen) return;

  bossNovaTimer -= dt;
  if (bossNovaTimer > 0) return;

  // 半径内に有効個体がいるときだけ発動（無人の空に撃たない）
  const r2 = BOSS_NOVA_RADIUS * BOSS_NOVA_RADIUS;
  let anyInRange = false;
  for (let i = 0; i < N; i++) {
    if (boidDead[i] || boidDowned[i]) continue;
    const dx = px[i] - boss.wx;
    const dy = py[i] - boss.wy;
    if (dx * dx + dy * dy < r2) { anyInRange = true; break; }
  }
  if (!anyInRange) { bossNovaTimer = 0.5; return; }  // 短い間隔で再チェック

  bossNovaTimer = BOSS_NOVA_INTERVAL;
  shockwaveFxList.push({
    x: boss.wx, y: boss.wy, maxR: BOSS_NOVA_RADIUS,
    life: SHOCKWAVE_FX_DURATION, color: boss._bossGlowColor ?? "#ff8800",
  });

  for (let i = 0; i < N; i++) {
    if (boidDead[i] || boidDowned[i]) continue;
    const dx = px[i] - boss.wx;
    const dy = py[i] - boss.wy;
    const d2 = dx * dx + dy * dy;
    if (d2 >= r2) continue;
    const d  = Math.sqrt(d2) || 1;
    const nx = dx / d;
    const ny = dy / d;
    applyDamageToBoid(i, BOSS_NOVA_DAMAGE);
    // 中心に近いほど強く弾き飛ばす。v0.34.1: 位置変位＋速度上書きをやめ、
    // 減衰する外力に一本化（ワープに見えず、押し出されて戻ってくる動きになる）。
    const pushDist = BOSS_NOVA_PUSH_MIN + (1 - d / BOSS_NOVA_RADIUS) * 90;
    applyKickDist(i, nx, ny, pushDist);
  }
  triggerFlash("rgba(255,140,40,0.18)", 0.15);
  triggerShake(5, 0.3);   // v0.8: ノヴァの衝撃を画面でも伝える
  hapticPulse(60);
}

// -----------------------------------------------------------------
// v0.8: レイダー湧き — 通常建物が枯れてもXP/卵が尽きないための詰み防止。
// 残存建物が閾値を切ると、ボス城塞から小型レイダーが定期的に湧き続ける。
// -----------------------------------------------------------------
const RAIDER_TRIGGER_RATIO  = 0.10;  // 通常建物の残存率がこれ未満で湧き始める
const RAIDER_SPAWN_INTERVAL = 3.5;   // 湧き間隔（秒）
const RAIDER_MAX_ALIVE      = 10;    // 同時生存上限
const RAIDER_CHECK_INTERVAL = 1.0;   // 残存数の集計間隔（毎フレームの全建物走査を避ける）

let raiderSpawnTimer = 0;
let raiderCheckTimer = 0;
let raiderModeActive = false;

// v0.29 / v0.29.1: 群れが大きくなると"たまに"大きな敵ラッシュ（ヴァンサバ的な波状攻撃）。
// 頻度を落とし（2分間隔）、1波を苛烈に（多数のレイダー＋衝撃兵を数体）。
// 前の波が残っている間は次を発生させない＝敵が溜まって処理落ちするのを防ぐ。
const RUSH_FLOCK_THRESHOLD = 30;    // この生存数以上でラッシュ発生
const RUSH_INTERVAL        = 120;   // 波の間隔（秒 ≒ 2分）
const RUSH_RECHECK         = 12;    // 前の波が残っている時の再チェック間隔（秒）
const RUSH_BASE_RAIDERS    = 10;    // 1波の基本レイダー数
const RUSH_PER_10          = 3;     // 群れ10体ごとに +3体
const RUSH_MAX_RAIDERS     = 30;    // 1波のレイダー上限
const RUSH_HEAVY_COUNT     = 2;     // 1波に混ぜる衝撃兵の数（苛烈さ）
const RUSH_SPAWN_RADIUS    = 640;   // 群れ重心からこの距離の外周に湧く（外から迫る）
let rushTimer = RUSH_INTERVAL;

// 群れ重心の外周にラッシュ用の敵を1体湧かせる（_rushWave タグ付き）。
function spawnRushMover(def, centroid) {
  const a  = random() * Math.PI * 2;
  const r  = RUSH_SPAWN_RADIUS + randRange(-50, 110);
  const wx = Math.max(60, Math.min(WORLD_W - 60, centroid.x + Math.cos(a) * r));
  const wy = Math.max(60, Math.min(WORLD_H - 60, centroid.y + Math.sin(a) * r));
  const m = makeMover(def, () => ({ x: wx, y: wy }));
  m.wx = wx; m.wy = wy;
  m.maxHp = def.hp; m.hp = def.hp; m.xpValue = def.xp;
  m._rushWave = true;   // この波の生き残り判定用
  movers.push(m);
}

function updateEnemyRush(dt) {
  if (gameState !== "playing") return;
  const alive = countAliveBoids();
  if (alive < RUSH_FLOCK_THRESHOLD) { rushTimer = RUSH_INTERVAL; return; }
  rushTimer -= dt;
  if (rushTimer > 0) return;

  // 前の波の敵がまだ生きていれば発生させない（溜まり＝処理落ち防止）。少し後に再チェック。
  if (movers.some(m => m.alive && m._rushWave)) { rushTimer = RUSH_RECHECK; return; }
  rushTimer = RUSH_INTERVAL;

  const c = calcFriendlyCentroid();
  const raiders = Math.min(RUSH_MAX_RAIDERS, RUSH_BASE_RAIDERS + Math.floor(alive / 10) * RUSH_PER_10);
  for (let k = 0; k < raiders; k++) spawnRushMover(MOVER_DEFS.raider, c);
  for (let k = 0; k < RUSH_HEAVY_COUNT; k++) spawnRushMover(MOVER_DEFS.shockman, c);   // 苛烈さ

  triggerFlash("rgba(210,40,40,0.16)", 0.28);
  hapticPulse(120);
}

// -----------------------------------------------------------------
// v0.58: 首都の増援
// -----------------------------------------------------------------
// 実機判定（2026-09-02）「取り巻きを倒してしまうと後は消化試合になる」。
// 守備隊は**置いてあるだけの有限な数**なので、片付けたあとの首都は
// 建物の弾を浴びながらHPを削るだけの作業になっていた。
// 群れが首都の圏内に居るあいだ、**首都が兵を出し続ける**ようにする。
//
// 設計の意図:
//   - 湧くのは首都の門（中心から150px）＝「城から出てくる」ことが見えるので理不尽にならない
//   - 顔ぶれはその文明の守備隊表（BOSS_GARRISON_BY_STAGE）＝時代の手触りを崩さない
//   - 3波に1回は**看板ユニット**が出る＝波が進むほど重くなる
//   - 同時生存数に上限を置く（溜めて処理落ちさせない・囲まれ殺しにしない）
//   - 群れが圏外へ出れば止まり、タイマーも巻き戻る＝逃げれば追撃されない
const BOSS_REINFORCE_RANGE     = 720;  // 群れ重心がこの距離に居るあいだだけ出す
const BOSS_REINFORCE_FIRST     = 8;    // 圏内に入ってから最初の波までの秒数
const BOSS_REINFORCE_INTERVAL  = 13;   // 波の間隔（秒）
const BOSS_REINFORCE_RECHECK   = 4;    // 上限に達しているときの再チェック間隔（秒）
// 前の波を片付けたら次を早める。育った群れは1波を5秒で溶かすので、
// 間隔を固定にすると「湧く→即殲滅→10秒の空白」になって消化試合が戻ってくる（実測）。
const BOSS_REINFORCE_MIN_GAP   = 4;    // 全滅させた場合の最短の間隔（秒）
const BOSS_REINFORCE_MAX_ALIVE = 22;   // 同時に生きていられる増援の頭数
const BOSS_REINFORCE_BASE      = 4;    // 第1波の頭数
const BOSS_REINFORCE_GROW      = 1;    // 波ごとの増分
const BOSS_REINFORCE_CAP       = 12;   // 1波の頭数上限
const BOSS_REINFORCE_SIG_EVERY = 3;    // この波数ごとに看板ユニットを混ぜる
// v0.61: **画面外から入ってくる**（Shooter指示「同じ場所からダンゴになって出てくるので
// 風情がない」）。首都の門(150px)に一気に湧かせる方式をやめ、
//   ・湧く位置は**カメラの視界の外**（群れ重心を中心にした画面対角より外側）
//   ・角度は首都側の半円に散らす＝「帝国の領内から来た」に見える
//   ・1体ずつ時間差で出す＝隊列がほどけて、順に画面端から現れる
// 一気に見えないところで湧かせるので、遠すぎると来ない。到着までは行軍速度で走る。
const BOSS_REINFORCE_ARC        = 2.6;  // 出現角の広がり（首都方向を中心に ±ARC/2）
const BOSS_REINFORCE_EDGE_PAD   = 90;   // 画面の外接円からさらに外へ出す余白(px)
const BOSS_REINFORCE_MIN_RADIUS = 640;  // 画面サイズが取れない場合の下限（プレビュー対策）
const BOSS_REINFORCE_MAX_RADIUS = 1150; // 遠すぎると永遠に来ないので上限
const BOSS_REINFORCE_STAGGER    = 0.55; // 1組ごとの時間差（秒）
const BOSS_REINFORCE_MIN_GROUPS = 3;    // 1波あたりの最低の出現方向数
// 到着までの行軍。コロッサス(22px/s)が800px歩くと36秒かかって波が成立しないため、
// **群れから遠いあいだだけ**速度を上げる。近づいたら本来の速度に戻る＝戦闘中は等速。
const BOSS_REINFORCE_MARCH_MULT = 3.2;
// 420 では「640→420 の220pxだけ速く走って、残り420pxを本来の速度で歩く」だけになり、
// コロッサス(26px/s)は接敵まで20秒かかっていた（実測）。射程に入る手前まで行軍させる。
const BOSS_REINFORCE_MARCH_DIST = 260;  // これより近づいたら行軍をやめる
// 行軍の時間切れ。群れが逃げ続けて一度も近づかない場合に、
// 速いままの敵が延々マップを走り回るのを防ぐ保険。
const BOSS_REINFORCE_MARCH_MAX  = 14;
let bossReinforceTimer = BOSS_REINFORCE_FIRST;
let bossReinforceWave  = 0;

// 出撃待ちの増援（1体ずつ時間差で画面外に現れる）
const bossReinforceQueue = [];

function resetBossReinforcements() {
  bossReinforceTimer = BOSS_REINFORCE_FIRST;
  bossReinforceWave  = 0;
  bossReinforceQueue.length = 0;
}

/**
 * v0.61: 群れ重心から見て「画面の外」になる距離。
 * 画面の外接円（対角の半分）＋余白。プレビューでは viewW/viewH が0になるので下限を置く
 * （既知の罠: canvas サイズが0でも湧き位置が群れの真上にならないようにする）。
 */
function offscreenSpawnRadius() {
  const halfW = (viewW * 0.5) / (cam.scale || 1);
  const halfH = (viewH * 0.5) / (cam.scale || 1);
  const diag  = Math.sqrt(halfW * halfW + halfH * halfH) + BOSS_REINFORCE_EDGE_PAD;
  return Math.max(BOSS_REINFORCE_MIN_RADIUS, Math.min(BOSS_REINFORCE_MAX_RADIUS, diag));
}

/**
 * 増援を1組（隊なら隊ごと）湧かせる。
 * @returns {number} 実際に出た頭数
 */
function spawnBossReinforcement(defKey, boss, angle) {
  const def = MOVER_DEFS[defKey];
  if (!def) return 0;
  // v0.61: 群れ重心を基準に「画面の外」へ置く。首都からの相対ではなく群れからの相対に
  // するのは、**画面に映っていないこと**が湧きの条件だから（首都が画面外のこともある）。
  const c = calcFriendlyCentroid();
  const r = offscreenSpawnRadius();
  const baseX = Math.max(60, Math.min(WORLD_W - 60, c.x + Math.cos(angle) * r));
  const baseY = Math.max(60, Math.min(WORLD_H - 60, c.y + Math.sin(angle) * r));
  // 巡回点は首都の周り＝門を出たあと城の周囲を回る（群れが近ければ追撃に切り替わる）
  const ringPoint = () => {
    const a = random() * Math.PI * 2;
    const r = BOSS_GARRISON_INNER + random() * (BOSS_GARRISON_OUTER - BOSS_GARRISON_INNER);
    return {
      x: Math.max(60, Math.min(WORLD_W - 60, boss.wx + Math.cos(a) * r)),
      y: Math.max(60, Math.min(WORLD_H - 60, boss.wy + Math.sin(a) * r)),
    };
  };
  const spawnOne = (offX, offY) => {
    const m = makeMover(def, ringPoint);
    m.wx = baseX + offX; m.wy = baseY + offY;
    m.maxHp = def.hp; m.hp = def.hp; m.xpValue = def.xp;
    m._bossReinforce = true;
    m._marching      = true;   // 群れに近づくまでは行軍速度で走る
    m._marchTimer    = BOSS_REINFORCE_MARCH_MAX;
    movers.push(m);
    spawnDragonAppearEffect(m.wx, m.wy);
    return m;
  };

  const count = def.packCount ?? 1;
  // v0.61: 隊は**進行方向に対して横一列**で並べる（旧: 半径42pxの輪＝ダンゴに見えた）。
  // 画面端から横に広がって入ってくるので「部隊が来た」と読める。
  const tx = -Math.sin(angle), ty = Math.cos(angle);   // 進行方向の法線
  const lineGap = 58;
  const offAt = (k) => {
    const t = (k - (count - 1) / 2) * lineGap;
    return [tx * t, ty * t];
  };
  const lead0 = offAt(0);
  const leader = spawnOne(lead0[0], lead0[1]);
  for (let k = 1; k < count; k++) {
    const off = offAt(k);
    const mem = spawnOne(off[0], off[1]);
    mem.waypoints = leader.waypoints;   // 隊は同じ経路を共有する（本編の湧き方と同じ）
    mem.packId    = leader.packId ?? (leader.packId = nextPackId++);
    mem.speedMult = randRange(0.92, 1.08);
  }
  if (count > 1 && leader.packId === undefined) leader.packId = nextPackId++;
  return count;
}

/**
 * 行軍の解除。群れに近づいた増援は本来の速度へ戻す
 * （遠いあいだだけ速いので、戦闘が始まってからは等速で読める）。
 * 首都が落ちても圏外でも必ず走らせたいので、増援の湧き処理とは分けてある
 * ＝速いままの敵が延々マップを走り回るのを防ぐ。
 */
function releaseMarchingReinforcements(dt) {
  let any = false;
  for (const m of movers) { if (m._marching && m.alive) { any = true; break; } }
  if (!any) return;
  const c = calcFriendlyCentroid();
  const marchD2 = BOSS_REINFORCE_MARCH_DIST * BOSS_REINFORCE_MARCH_DIST;
  for (const m of movers) {
    if (!m._marching || !m.alive) continue;
    m._marchTimer -= dt;
    const ddx = m.wx - c.x, ddy = m.wy - c.y;
    if (m._marchTimer <= 0 || ddx * ddx + ddy * ddy < marchD2) m._marching = false;
  }
}

function updateBossReinforcements(dt) {
  if (gameState !== "playing") return;
  releaseMarchingReinforcements(dt);
  if (bossSettlementIdx < 0) return;
  const boss = settlements[bossSettlementIdx];
  if (!boss || boss.fallen) return;

  // 出撃待ちを時間差で画面外へ出す（1体ずつ・別々の方向から）
  for (let i = bossReinforceQueue.length - 1; i >= 0; i--) {
    const q = bossReinforceQueue[i];
    q.t -= dt;
    if (q.t > 0) continue;
    spawnBossReinforcement(q.key, boss, q.angle);
    bossReinforceQueue.splice(i, 1);
  }

  // 圏外なら止める＆タイマーを巻き戻す（離れて立て直す余地を残す）
  const c = calcFriendlyCentroid();
  const dx = c.x - boss.wx, dy = c.y - boss.wy;
  if (dx * dx + dy * dy > BOSS_REINFORCE_RANGE * BOSS_REINFORCE_RANGE) {
    bossReinforceTimer = BOSS_REINFORCE_FIRST;
    return;
  }

  // 前の波が残っていなければ待ち時間を詰める（詰めるだけで、伸ばしはしない）
  let aliveReinforce = 0;
  for (const m of movers) if (m.alive && m._bossReinforce) aliveReinforce++;
  if (aliveReinforce === 0 && bossReinforceWave > 0) {
    bossReinforceTimer = Math.min(bossReinforceTimer, BOSS_REINFORCE_MIN_GAP);
  }

  bossReinforceTimer -= dt;
  if (bossReinforceTimer > 0) return;

  // 溜まりすぎているあいだは出さない（処理落ちと囲まれ殺しの両方を避ける）
  if (aliveReinforce >= BOSS_REINFORCE_MAX_ALIVE) {
    bossReinforceTimer = BOSS_REINFORCE_RECHECK;
    return;
  }

  bossReinforceTimer = BOSS_REINFORCE_INTERVAL;
  bossReinforceWave++;

  // 倒した増援の死骸を配列から掃除する。増援は無限に湧くので、
  // 放っておくと movers が延々伸びて毎フレームの走査が重くなる
  // （レイダーだけ同じ掃除を updateRaiderSpawns がやっている）。
  movers = movers.filter(m => m.alive || !m._bossReinforce);

  // 顔ぶれはその文明の守備隊表から（数の重みぶんだけ候補に入れる）
  const roster = [];
  for (const [key, n] of (BOSS_GARRISON_BY_STAGE[currentStage] ?? [])) {
    for (let k = 0; k < n; k++) roster.push(key);
  }
  if (roster.length === 0) roster.push("raider");

  const budget = Math.min(BOSS_REINFORCE_CAP,
                          BOSS_REINFORCE_BASE + (bossReinforceWave - 1) * BOSS_REINFORCE_GROW);
  // 首都から群れへ向かう向き＝「敵の領内の側」。この半円に散らして出す
  const baseAngle = Math.atan2(dy, dx);
  const picks = [];

  // 3波に1回は看板ユニット（MOVER_SPAWNS_BY_STAGE の先頭）を先鋒に置く
  if (bossReinforceWave % BOSS_REINFORCE_SIG_EVERY === 0) {
    const sig = (MOVER_SPAWNS_BY_STAGE[currentStage] ?? [])[0];
    if (sig) picks.push(sig[0]);
  }
  let planned = picks.reduce((n, k) => n + (MOVER_DEFS[k]?.packCount ?? 1), 0);
  // v0.61: **最低3方向**から出す。隊（packCount 4〜5）を1つ引くと頭数だけで budget を
  // 満たしてしまい、結局「1か所から出てくる」に戻るため（実測: 第1波が盾兵4体×1方向だけ）。
  const minGroups = Math.min(BOSS_REINFORCE_MIN_GROUPS, budget);
  const headCap   = budget * 2;   // 隊を足しすぎて一気に増えないための上限
  while ((planned < budget || picks.length < minGroups) && planned < headCap) {
    const key = roster[Math.floor(random() * roster.length)];
    if (!MOVER_DEFS[key]) break;   // 未知のキー: 無限ループを避ける
    picks.push(key);
    planned += MOVER_DEFS[key].packCount ?? 1;
  }

  // v0.61: 1体ずつ時間差で**画面外の別々の方向**から出す。
  // 同時に1点へ出すと「ダンゴで湧いた」と見えてしまうため（Shooter指摘）。
  for (let k = 0; k < picks.length; k++) {
    const spread = picks.length === 1 ? 0 : (k / (picks.length - 1) - 0.5);
    // 等間隔＋わずかな揺らぎ＝並びすぎず、固まりすぎない
    const a = baseAngle + spread * BOSS_REINFORCE_ARC + (random() - 0.5) * 0.35;
    bossReinforceQueue.push({ t: k * BOSS_REINFORCE_STAGGER, key: picks[k], angle: a });
  }

  triggerFlash("rgba(255,170,60,0.14)", 0.24);
  hapticPulse(90);
  // 初回だけ非モーダルのバナーで知らせる（毎回出すとテンポを壊す）
  if (bossReinforceWave === 1) {
    stageTextEl.textContent = STRINGS.bossReinforceTitle;
    stageSubEl.textContent  = STRINGS.bossReinforceSub;
    stageOverlayEl.classList.add("visible");
    setTimeout(() => stageOverlayEl.classList.remove("visible"), 1600);
  }
}

function resetRaiderState() {
  raiderSpawnTimer = 0;
  raiderCheckTimer = 0;
  raiderModeActive = false;
}

function updateRaiderSpawns(dt) {
  if (bossSettlementIdx < 0) return;
  const boss = settlements[bossSettlementIdx];
  if (!boss || boss.fallen) return;

  // 残存建物率のチェック（1秒間隔）
  raiderCheckTimer -= dt;
  if (raiderCheckTimer <= 0) {
    raiderCheckTimer = RAIDER_CHECK_INTERVAL;
    let remaining = 0;
    let total = 0;
    for (const s of settlements) {
      if (s.isBoss || s._isWall) continue;
      total++;
      if (!s.fallen) remaining++;
    }
    raiderModeActive = total > 0 && (remaining / total) < RAIDER_TRIGGER_RATIO;
  }
  if (!raiderModeActive) return;

  raiderSpawnTimer -= dt;
  if (raiderSpawnTimer > 0) return;
  raiderSpawnTimer = RAIDER_SPAWN_INTERVAL;

  // 生存レイダー数の確認＋死骸の間引き（配列の無限成長防止）
  let aliveRaiders = 0;
  for (const m of movers) {
    if (m.def.name === "raider" && m.alive) aliveRaiders++;
  }
  movers = movers.filter(m => m.alive || m.def.name !== "raider");
  if (aliveRaiders >= RAIDER_MAX_ALIVE) return;

  // ボス城塞の縁から1〜2体湧く（経路はボス周辺の徘徊。追跡は共通ロジックが担う）
  const spawnCount = Math.min(1 + (random() < 0.5 ? 1 : 0), RAIDER_MAX_ALIVE - aliveRaiders);
  for (let k = 0; k < spawnCount; k++) {
    const angle = random() * Math.PI * 2;
    const raider = makeMover(MOVER_DEFS.raider, () => ({
      x: Math.max(100, Math.min(WORLD_W - 100, boss.wx + randRange(-800, 800))),
      y: Math.max(100, Math.min(WORLD_H - 100, boss.wy + randRange(-800, 800))),
    }));
    raider.wx = boss.wx + Math.cos(angle) * (boss.radius + 34);
    raider.wy = boss.wy + Math.sin(angle) * (boss.radius + 34);
    raider.xpValue = MOVER_DEFS.raider.xp;   // v0.14: XPのステージスケール廃止
    movers.push(raider);
    spawnCollisionParticles(raider.wx, raider.wy);
  }
  hapticPulse(15);
}

/** 移動敵へのダメージ適用。倒したらXPジェム＋卵＋演出。 */
/**
 * 移動敵にダメージを与える。
 * v0.42: srcX/srcY（攻撃が来た位置）を渡すと、**盾の向き**を見て弾けるようになる。
 * 渡さない攻撃は「どこから来たか分からない」＝盾は働かない（＝素通しにはしない）ので、
 * 呼び出し側は可能な限り攻撃者の座標を渡すこと。
 */
function damageMover(m, damage, srcX, srcY) {
  if (!m.alive) return;
  // v0.42: 潜行中は無敵（浮上した時だけ殴れる）
  if (m.submerged) {
    // 手応えが無いと「当たっていないのかバグなのか」が分からないので土煙だけ返す
    if (fxRandom() < 0.12) spawnHitParticles(m.wx + (fxRandom() - 0.5) * 20, m.wy + (fxRandom() - 0.5) * 20);
    return;
  }
  // v0.42: 鏡の盾兵 — 正面（進行方向±shieldArc）からの被弾を減衰させる
  if (m.def.shieldArc !== undefined && srcX !== undefined) {
    let a = Math.atan2(srcY - m.wy, srcX - m.wx) - Math.atan2(m.headingY, m.headingX);
    while (a >  Math.PI) a -= Math.PI * 2;
    while (a < -Math.PI) a += Math.PI * 2;
    if (Math.abs(a) < m.def.shieldArc) {
      damage *= m.def.shieldBlock ?? 0;
      // 弾いた合図（火花）。ここが無いと「効いていない」ことが伝わらない
      if (fxRandom() < 0.5) {
        const fx = m.wx + Math.cos(a + Math.atan2(m.headingY, m.headingX)) * (m.def.radius + 4);
        const fy = m.wy + Math.sin(a + Math.atan2(m.headingY, m.headingX)) * (m.def.radius + 4);
        spawnHitParticles(fx, fy);
      }
      if (damage <= 0) return;
    }
  }
  m.hp -= damage;
  if (m.hp <= 0) {
    m.alive = false;
    m.hp = 0;
    runKills++;
    // v0.25: エリート撃破の累計（チャレンジ用）
    if (m.def.elite) { profile.eliteKills = (profile.eliteKills || 0) + 1; saveProfile(); }
    // v0.8: ステージスケール済みXP（xpValue）。未設定の個体は基礎値
    spawnXpGems(m.wx, m.wy, m.xpValue ?? m.def.xp);
    let eggs = m.def.eggDrop;
    // v0.8: 確率卵（レイダー用。群れの供給源が完全に絶えないように）
    if (m.def.eggChance && random() < m.def.eggChance) eggs += 1;
    for (let k = 0; k < eggs; k++) {
      const angle = random() * Math.PI * 2;
      const r = m.def.radius + 12 + random() * 30;
      spawnEgg(m.wx + Math.cos(angle) * r, m.wy + Math.sin(angle) * r);
    }
    // v0.25.1: 財宝馬車は金色の大量スパーク＋竜晶ボーナス（当たり枠）
    if (m.def.treasureReward) {
      awardCrystals(m.def.treasureReward);
      for (let k = 0; k < 24; k++) {
        const a = fxRandom() * Math.PI * 2;
        const r = 10 + fxRandom() * 60;
        spawnHitParticles(m.wx + Math.cos(a) * r, m.wy + Math.sin(a) * r);
      }
      triggerFlash("rgba(255,210,80,0.40)", 0.30);
      hapticPulse(180);
    } else {
      spawnCollisionParticles(m.wx, m.wy);
      spawnCollisionParticles(m.wx + 8, m.wy - 8);
      triggerFlash("rgba(255,255,255,0.18)", 0.12);
      hapticPulse(90);
    }
    // v0.42: 分裂体 — 壊れると小さいのが2体出る（世代が進むほど小さく速く弱い）
    if (m.def.splitInto) {
      const childDef = MOVER_DEFS[m.def.splitInto.key];
      if (childDef) {
        for (let k = 0; k < m.def.splitInto.count; k++) {
          const child = makeMover(childDef, () => ({ x: m.wx, y: m.wy }));
          const a = (k / m.def.splitInto.count) * Math.PI * 2 + random() * 0.6;
          child.wx = m.wx + Math.cos(a) * (m.def.radius + 6);
          child.wy = m.wy + Math.sin(a) * (m.def.radius + 6);
          child.xpValue = childDef.xp;
          // 親の巡回路を引き継ぐ（散り散りにならず、その場を守り続ける）
          child.waypoints = m.waypoints;
          _pendingMovers.push(child);
        }
        spawnCollisionParticles(m.wx, m.wy);
      }
    }

    // v0.26: 巨獣コア撃破 → 腕も道連れ＋大報酬＋派手演出
    if (m.def.part === "core") {
      if (m.armL && m.armL.alive) m.armL.alive = false;
      if (m.armR && m.armR.alive) m.armR.alive = false;
      if (m.def.behemothReward) awardCrystals(m.def.behemothReward);
      for (let k = 0; k < 30; k++) {
        const a = fxRandom() * Math.PI * 2;
        const r = 20 + fxRandom() * 90;
        spawnHitParticles(m.wx + Math.cos(a) * r, m.wy + Math.sin(a) * r);
      }
      triggerFlash("rgba(255,150,60,0.50)", 0.40);
      hapticPulse(300);
    }
  }
}

/** 群れの体当たり判定（移動敵版）。建物用クールダウンを共用して連打を防ぐ。 */
function updateMoverRams() {
  if (movers.length === 0) return;
  const isMelee = flockWeapon === "melee";
  const ramDamage = isMelee ? MELEE_COLLISION_DAMAGE * effWeaponDmgMult("melee") : COLLISION_DAMAGE;

  for (const m of movers) {
    if (!m.alive) continue;
    const hitR = m.def.radius + 6;
    const hitR2 = hitR * hitR;
    for (let i = 0; i < N; i++) {
      if (boidDead[i] || boidDowned[i]) continue;
      if (boidCollisionCooldown[i] > 0) continue;
      const dx = m.wx - px[i];
      const dy = m.wy - py[i];
      if (dx * dx + dy * dy > hitR2) continue;
      damageMover(m, ramDamage, px[i], py[i]);
      boidHitStopTimer[i]      = HITSTOP_DURATION;
      boidCollisionCooldown[i] = isMelee ? MELEE_COLLISION_COOLDOWN : COLLISION_COOLDOWN;
      spawnCollisionParticles(m.wx, m.wy);
      // v0.8: 緋竜の斬閃演出（移動敵への体当たりも派手に）
      if (isMelee) {
        spawnMeleeImpactFx(m.wx, m.wy, Math.atan2(vy[i], vx[i]));
        triggerShake(2.2, 0.09);
      }
      hapticPulse(15);
      if (!m.alive) break;
    }
  }
}

/** 移動敵の描画（本体＋HPバー＋コロッサスの眼光ビーム＋衝撃波リング）。ワールド座標系で呼ぶ。 */
function drawMovers() {
  for (const m of movers) {
    if (!m.alive) continue;
    const def = m.def;
    const angle = Math.atan2(m.headingY, m.headingX);

    // v0.42: 潜行中は本体を描かず、地面の膨らみ（土煙の輪）だけにする＝無敵なのが一目で分かる。
    if (m.submerged) {
      const t = breathTime * 2 + (m.swayPhase ?? 0);
      ctx.save();
      ctx.globalAlpha = 0.30;
      ctx.fillStyle = def.color;
      ctx.beginPath();
      ctx.ellipse(m.wx, m.wy, def.radius * (0.9 + 0.08 * Math.sin(t)), def.radius * 0.55, angle, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 0.5;
      ctx.strokeStyle = def.glowColor;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(m.wx, m.wy, def.radius * 1.15, def.radius * 0.7, angle, 0, Math.PI * 2);
      ctx.stroke();
      // まもなく浮上: 残り0.8秒で輪が強く脈打つ（叩く準備をさせる）
      if (m.submergeTimer !== undefined && m.submergeTimer < 0.8) {
        ctx.globalAlpha = 0.35 + 0.45 * Math.abs(Math.sin(breathTime * 16));
        ctx.beginPath();
        ctx.arc(m.wx, m.wy, def.radius * 1.5, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      ctx.restore();
      continue;
    }

    ctx.save();
    ctx.translate(m.wx, m.wy);

    // v0.42: 鏡の盾兵の盾。**正面（進行方向）に弧を描く**ので、どちらから殴れば通るかが見える。
    if (def.shieldArc !== undefined) {
      ctx.save();
      ctx.rotate(angle);
      const rr = def.radius + 7;
      ctx.globalAlpha = 0.85;
      ctx.strokeStyle = "#dff0ff";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(0, 0, rr, -def.shieldArc, def.shieldArc);
      ctx.stroke();
      ctx.globalAlpha = 0.35;
      ctx.strokeStyle = "#9fd8ff";
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.arc(0, 0, rr, -def.shieldArc, def.shieldArc);
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    // v0.59: 押してくる敵の標識。**外へ広がり続ける二重の輪＋4方向のくさび**で
    // 「こいつは押す」を一目で読ませる（Shooter指示「見た目でわかるように」）。
    // 種類ごとの絵は流用なので、識別はこの共通の標識が担う。
    // 攻撃の瞬間ではなく**常時**出す＝近づく前に判断できる。
    if (def.knockback) {
      const kphase = (breathTime * 0.75 + (m.swayPhase ?? 0)) % 1;
      for (let k = 0; k < 2; k++) {
        const ph = (kphase + k * 0.5) % 1;
        ctx.globalAlpha = 0.50 * (1 - ph);
        ctx.strokeStyle = KNOCKBACK_MARK_COLOR;
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.arc(0, 0, def.radius * (0.85 + ph * 1.25), 0, Math.PI * 2);
        ctx.stroke();
      }
      // 外向きのくさび4つ（輪と同じ位相で外へ流れる＝押し出す向きが分かる）
      const wedge = def.radius * (1.15 + 0.35 * Math.sin(breathTime * 3 + (m.swayPhase ?? 0)));
      ctx.globalAlpha = 0.75;
      ctx.fillStyle = KNOCKBACK_MARK_COLOR;
      for (let k = 0; k < 4; k++) {
        const a = k * (Math.PI / 2) + Math.PI / 4;
        const cosA = Math.cos(a), sinA = Math.sin(a);
        ctx.beginPath();
        ctx.moveTo(cosA * (wedge + 7), sinA * (wedge + 7));
        ctx.lineTo(cosA * wedge - sinA * 4.2, sinA * wedge + cosA * 4.2);
        ctx.lineTo(cosA * wedge + sinA * 4.2, sinA * wedge - cosA * 4.2);
        ctx.closePath();
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // 外周グロー（存在感。v0.24: エリートは赤／財宝馬車は金の、大きく明るいオーラで際立たせる）
    const bigGlow = def.elite || def.treasure;
    ctx.globalAlpha = bigGlow ? 0.35 : 0.20;
    ctx.fillStyle = def.glowColor;
    ctx.beginPath();
    ctx.arc(0, 0, def.radius * (bigGlow ? 1.9 : 1.5), 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;

    // v0.7: Gemini生成スプライトがあれば画像描画（実測ピボット・前方方向補正つき）。
    // 読めなかった敵だけ従来のベクター描画にフォールバックする。
    // v0.13: マンモス・騎士は個体分割され、単体スプライトがこの通常パスで描かれる
    const spriteKey = def.sprite ?? def.name;   // v0.24: エリートは既存スプライトを流用
    const enemyImg = enemyImages[spriteKey];
    if (enemyImg) {
      const meta  = ENEMY_SPRITE_META[spriteKey];
      const drawW = def.radius * meta.drawScale;
      const s     = drawW / enemyImg.naturalWidth;
      const drawH = enemyImg.naturalHeight * s;
      const phase = m.swayPhase ?? 0;

      // v0.9: 浮遊ユニット（守護像・気球）は地面に落ち影を描いて高度感を出す
      if (meta.hover || def.flying) {
        ctx.globalAlpha = 0.22;
        ctx.fillStyle = "#000000";
        ctx.beginPath();
        ctx.ellipse(5, 8, def.radius * 0.85, def.radius * 0.55, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
      }

      if (meta.forward === "up")        ctx.rotate(angle + Math.PI / 2);
      else if (meta.forward === "down") ctx.rotate(angle - Math.PI / 2);

      // v0.9: 生気づけアニメーション。静止画のまま滑るのを防ぐ
      if (meta.hover) {
        // 浮遊: 呼吸のような脈動＋ゆっくり漂う傾き（守護像＝歩行アニメ不要のデザイン）
        const bob = Math.sin(breathTime * 2.2 + phase);
        ctx.rotate(bob * 0.06);
        const sc = 1 + bob * 0.045;
        ctx.scale(sc, sc);
      } else if (def.name === "balloon") {
        ctx.rotate(Math.sin(breathTime * 0.9 + phase) * 0.07);
      } else {
        // 地上ユニット: 歩行スイング（車両の甲鉄艦はごく控えめに）
        const swayAmp = def.name === "ironclad" ? 0.02 : 0.05;
        ctx.rotate(Math.sin(breathTime * 5.0 + phase) * swayAmp);
      }

      ctx.drawImage(
        enemyImg,
        -enemyImg.naturalWidth  * s * meta.px,
        -enemyImg.naturalHeight * s * meta.py,
        drawW, drawH,
      );
      ctx.restore();
    } else {
    ctx.rotate(angle);
    if (def.name === "mammoth") {
      // v0.13: 単体マンモス（楕円1体＋牙）。個体分割によりフォールバックも1頭分
      ctx.fillStyle = def.color;
      ctx.strokeStyle = "rgba(255,255,255,0.4)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(0, 0, 16, 11, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      // 牙
      ctx.strokeStyle = "#f0e0c0";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(12, -4); ctx.lineTo(20, -8);
      ctx.moveTo(12,  4); ctx.lineTo(20,  8);
      ctx.stroke();
    } else if (def.name === "colossus") {
      // 歩く神像: 胴体の縦長矩形＋頭部円＋肩
      ctx.fillStyle = def.color;
      ctx.strokeStyle = "rgba(255,255,255,0.5)";
      ctx.lineWidth = 1.5;
      ctx.fillRect(-10, -16, 22, 32);
      ctx.strokeRect(-10, -16, 22, 32);
      ctx.beginPath();
      ctx.arc(16, 0, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      // 目（眼光の源）
      ctx.fillStyle = "#ff4040";
      ctx.beginPath();
      ctx.arc(19, 0, 2.5, 0, Math.PI * 2);
      ctx.fill();
    } else if (def.name === "knights") {
      // v0.13: 単体騎士（盾1枚＋槍先）。個体分割によりフォールバックも1兵分
      ctx.fillStyle = def.color;
      ctx.strokeStyle = "rgba(60,70,90,0.8)";
      ctx.lineWidth = 1;
      ctx.fillRect(-7, -6, 14, 12);
      ctx.strokeRect(-7, -6, 14, 12);
      // 槍先（進行方向）
      ctx.strokeStyle = "#d0d8e8";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(7, 0); ctx.lineTo(13, 0);
      ctx.stroke();
    } else if (def.name === "raider") {
      // v0.8 レイダー: 小型の赤い牙獣（シェブロン型）。画像なしのベクター専用
      ctx.fillStyle = def.color;
      ctx.strokeStyle = "rgba(255,160,160,0.7)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(11, 0);       // 鼻先
      ctx.lineTo(-2, -7);
      ctx.lineTo(-8, -4);
      ctx.lineTo(-5, 0);       // 尾の付け根のくびれ
      ctx.lineTo(-8, 4);
      ctx.lineTo(-2, 7);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      // 牙
      ctx.strokeStyle = "#ffe0e0";
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(8, -3); ctx.lineTo(12, -5);
      ctx.moveTo(8, 3);  ctx.lineTo(12, 5);
      ctx.stroke();
    } else if (def.name === "balloon") {
      // 爆撃気球: 丸い気嚢＋吊り索＋ゴンドラ（回転させず常に上向きで描く）
      ctx.rotate(-angle); // 気球は姿勢を回転させない
      ctx.fillStyle = def.color;
      ctx.strokeStyle = "rgba(255,230,180,0.5)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(0, -4, 15, 12, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      // 気嚢の縦帯
      ctx.strokeStyle = "rgba(60,40,20,0.5)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, -16); ctx.lineTo(0, 8);
      ctx.moveTo(-9, -13); ctx.lineTo(-6, 6);
      ctx.moveTo(9, -13); ctx.lineTo(6, 6);
      ctx.stroke();
      // ゴンドラ
      ctx.fillStyle = "#4a3520";
      ctx.fillRect(-5, 10, 10, 6);
      ctx.beginPath();
      ctx.moveTo(-6, 8); ctx.lineTo(-9, 2);
      ctx.moveTo(6, 8); ctx.lineTo(9, 2);
      ctx.strokeStyle = "rgba(30,20,10,0.8)";
      ctx.stroke();
    } else {
      // 陸上甲鉄艦: 細長い装甲艦体＋砲塔
      ctx.fillStyle = def.color;
      ctx.strokeStyle = "rgba(255,255,255,0.45)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(26, 0);
      ctx.lineTo(14, -11);
      ctx.lineTo(-22, -11);
      ctx.lineTo(-28, 0);
      ctx.lineTo(-22, 11);
      ctx.lineTo(14, 11);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#2a3540";
      for (const tx of [-12, 2]) {
        ctx.beginPath();
        ctx.arc(tx, 0, 5, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
    } // v0.7: 画像/ベクター分岐の閉じ

    // HPバー（ボスバーの縮小版）。
    // v0.13: pack個体（マンモス・騎士）は頭数が多くバーが常時出ると視覚ノイズに
    // なるため、被弾している個体だけ表示する。単独の大物は従来どおり常時表示
    const hpRatio = Math.max(0, m.hp / m.maxHp);
    if (m.packId === undefined || hpRatio < 1) {
      const barW = def.radius * 2.4;
      const barX = m.wx - barW * 0.5;
      const barY = m.wy - def.radius - 14;
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = "rgba(0,0,0,0.6)";
      ctx.fillRect(barX - 1, barY - 1, barW + 2, 7);
      ctx.fillStyle = hpRatio > 0.5 ? def.glowColor : (hpRatio > 0.25 ? "#e0c040" : "#e04040");
      ctx.fillRect(barX, barY, barW * hpRatio, 5);
      ctx.globalAlpha = 1.0;
    }

    // コロッサスの眼光ビーム（v0.26: 無攻撃ユニット=財宝馬車/巨獣の腕でも例外にならないようガード）
    if (def.attack && def.attack.type === "beam" && m.beamTargetIdx >= 0 && !boidDead[m.beamTargetIdx]) {
      ctx.save();
      ctx.strokeStyle = "rgba(255,64,64,0.65)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(m.wx, m.wy);
      ctx.lineTo(px[m.beamTargetIdx], py[m.beamTargetIdx]);
      ctx.stroke();
      ctx.restore();
    }
  }

  // 衝撃波リング（マンモス踏鳴らし・ボスノヴァ共用。色は発生源が指定）
  for (const fx of shockwaveFxList) {
    const progress = 1 - fx.life / SHOCKWAVE_FX_DURATION;
    ctx.save();
    ctx.globalAlpha = Math.max(0, 1 - progress) * 0.7;
    ctx.strokeStyle = fx.color ?? "#d0a060";
    ctx.lineWidth = Math.max(1, 4 * (1 - progress));
    ctx.beginPath();
    ctx.arc(fx.x, fx.y, fx.maxR * progress, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
}

// -----------------------------------------------------------------
// 地形障害物（岩山・湖）: 破壊不可・ドラゴン侵入不可。
// 岩山は投射不透過（氷弾・敵弾を止める）、湖は投射透過。ミサイルは全て飛び越える。
// -----------------------------------------------------------------
let terrainObstacles = [];

const TERRAIN_COUNT_MIN   = 5;
const TERRAIN_COUNT_MAX   = 9;
const TERRAIN_MARGIN      = 140;   // マップ端からの最小距離
const TERRAIN_START_CLEAR = 420;   // 群れスタート地点（左端中央）の確保半径
