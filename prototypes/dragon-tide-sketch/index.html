function settlementFall(settlementIndex) {
  const settlement = settlements[settlementIndex];
  settlement.fallen = true;
  settlement.hp = 0;

  // v0.6: XPジェムを撒く＋撃破数を記録（仕様 §5.1）
  spawnXpGems(settlement.wx, settlement.wy, xpValueOf(settlement));
  runKills++;

  // v0.23: 花火要塞は派手な演出＋竜晶/XPボーナス
  if (settlement.isFirework) detonateFirework(settlement);

  // v0.43: 堰が落ちたら下流へ洪水を流す（通った帯の建物が順に崩れる）
  if (settlement._isDam) triggerFlood(settlement._damIdx);

  // v0.10: 石造りの城壁以外は炎上させる（燃える街の演出）
  if (!settlement._isWall) spawnFire(settlement.wx, settlement.wy, settlement.radius);

  // 変更1: 卵持ち建物だけが卵を EGG_DROP_COUNT 個落とす。
  // 残りの建物は壊しても卵を落とさない（破壊演出はそのまま）。
  if (settlement.isEggBearer) {
    for (let k = 0; k < EGG_DROP_COUNT; k++) {
      const angle = random() * Math.PI * 2;
      const r = settlement.radius + 10 + random() * 40;
      spawnEgg(settlement.wx + Math.cos(angle) * r, settlement.wy + Math.sin(angle) * r);
    }
  }

  hapticPulse(80);

  rebuildBuildingGrid();
  minimapBaseDirty = true;  // v0.6-p4: ミニマップの建物ドットキャッシュも更新

  // 建物レイヤーを部分的に再描画（fallen状態に更新）
  if (buildingTiledLayer) {
    // v0.11.4: 密集した市街地ではクリア矩形が連鎖的に重なり合う（A⊃B⊃C…）ため、
    // 自分と直接重なる相手だけ直しても、3棟以上の巻き込みは取りこぼす。
    // 重なりが連鎖する範囲全体（連結成分）をBFSで集め、
    // 「全棟クリア→全棟描画」の二段階でまとめて処理する。
    //
    // v0.49: タイル化により、対象は「その棟に掛かる生成済みタイル」だけになる。
    // 未生成のタイルは触らない（後で焼かれるとき fallen 状態で描かれる）。
    // 二段階の順序はタイル内でも保たれる（全棟のクリアを終えてから全棟を描く）。
    const affected = collectOverlappingCluster(settlementIndex);
    for (const s of affected) {
      const pad = settlementLayerPadding(s);
      forEachLayerTileOverlapping(buildingTiledLayer, s.wx - pad, s.wy - pad, s.wx + pad, s.wy + pad,
        (tile) => clearSettlementLayerBox(tile.ctx, s));
    }
    for (const s of affected) {
      const pad = settlementLayerPadding(s);
      forEachLayerTileOverlapping(buildingTiledLayer, s.wx - pad, s.wy - pad, s.wx + pad, s.wy + pad,
        (tile) => paintSettlementScorchAndSprite(tile.ctx, s));
    }
  }

  updateHUDBuildings();

  // v0.52: ランのクリア条件は「ボス（首都）撃破」。時代は問わない（Shooter指示）。
  // 首都は2時代先の建築で建っていて最初から格上なので、
  // 「今の群れで挑むか、時代を進めて力をつけてから挑むか」の判断がランを貫く軸になる。
  // ただし待つほど首都も建て替わって強くなるので、待てば有利とは限らない。
  if (settlement.isBoss) {
    triggerAllClear();
    return;
  }

  // 通常建物: その時代の破壊率が閾値を超えたら文明が次の時代へ進む
  maybeAdvanceTier();
}

// -----------------------------------------------------------------
// Spatial Hash（自軍用）
// -----------------------------------------------------------------
const grid = new Map();

function gridKey(cx, cy) { return (cx * 73856093 ^ cy * 19349663); }
function gridClear() { grid.clear(); }
function gridInsert(index, x, y, cellSize) {
  const cx = (x / cellSize) | 0;
  const cy = (y / cellSize) | 0;
  const k  = gridKey(cx, cy);
  let bucket = grid.get(k);
  if (!bucket) { bucket = []; grid.set(k, bucket); }
  bucket.push(index);
}
function gridQuery(x, y, cellSize, out) {
  out.length = 0;
  const cx = (x / cellSize) | 0;
  const cy = (y / cellSize) | 0;
  for (let dy = -1; dy <= 1; dy++) {
    for (let dx = -1; dx <= 1; dx++) {
      const b = grid.get(gridKey(cx + dx, cy + dy));
      if (b) for (let i = 0; i < b.length; i++) out.push(b[i]);
    }
  }
}

/**

 * boot / advanceToNextStage の両方からこの関数を通す（共通化）。
 *
 * - 群れを BOIDS_INITIAL=10 体に戻す
 * - 全個体のHP・ダウン/復帰状態・フェード・衝突タイマーをクリア
 * - 尻尾角度履歴も初期化
 * - カメラズームは有効個体数=10 に下がることで自動的に寄りに戻る（追加処理不要）
 *
 * 前ステージの群れ数・HP・ダウン状態は一切持ち越さない。
 * これにより「ステージ開始は寄り、育つと引き」という弧が毎ステージ生まれる。
 */
function resetBoidsForStageStart(initialCount = BOIDS_INITIAL) {
  rushTimer = RUSH_INTERVAL;   // v0.29: ステージ開始ごとにラッシュ間隔をリセット
  resetBossReinforcements();   // v0.58: 増援の波数とタイマーも持ち越さない
  const startWx = 250;
  const startWy = WORLD_H * 0.5;

  // N を初期数に戻し、全スロットを dead でリセットしてから有効分を起こす。
  // v0.19: 2回目以降のラン開始は初期1体（塊魂的にゼロから積み上げる）。
  // ステージ間リセットは既定の BOIDS_INITIAL。範囲は 1..MAX_BOIDS にクランプ。
  N = Math.max(1, Math.min(MAX_BOIDS, initialCount | 0));

  // v0.7: 強化カードが持ち越されるため、HPは実効最大値（硬鱗・種族補正込み）で初期化する
  const maxHpNow = effBoidMaxHp();
  for (let i = 0; i < MAX_BOIDS; i++) {
    boidHp[i]                = maxHpNow;
    boidDead[i]              = 1;           // 一旦全滅状態に
    boidFadeTimer[i]         = 0;
    boidHitStopTimer[i]      = 0;
    boidKnockStun[i]         = 0;
    boidKickX[i]             = 0;
    boidKickY[i]             = 0;
    boidHopAir[i]            = 0;
    boidCollisionCooldown[i] = 0;
    boidDowned[i]            = 0;
    boidDownTimer[i]         = 0;
    boidReviveTimer[i]       = 0;
    boidFireTimer[i]         = random() * currentFireInterval(); // 射撃をばらけさせる
    const base = i * TAIL_SEGS;
    for (let s = 0; s < TAIL_SEGS; s++) boidAngleHistory[base + s] = 0;
  }

  // BOIDS_INITIAL 体だけ有効化・配置
  for (let i = 0; i < N; i++) {
    const r   = random() * 80;
    const a   = random() * Math.PI * 2;
    px[i]     = startWx + Math.cos(a) * r;
    py[i]     = startWy + Math.sin(a) * r;
    const ang = random() * Math.PI * 2;
    vx[i]     = Math.cos(ang) * mv().minSpeed;
    vy[i]     = Math.sin(ang) * mv().minSpeed;
    boidDead[i] = 0;
    const base = i * TAIL_SEGS;
    for (let s = 0; s < TAIL_SEGS; s++) boidAngleHistory[base + s] = ang;
  }

  // v0.22: 母竜だけ恒常ツリーの motherHp 倍率ぶん最大HPを引き上げる
  if (N > MOTHER_DRAGON_IDX) boidHp[MOTHER_DRAGON_IDX] = effBoidMaxHpFor(MOTHER_DRAGON_IDX);
}

function countAliveBoids() {
  // 変更2: ダウン中（boidDowned）は有効個体数から除外する。
  // これによりカメラズーム・ブレス範囲・HUD表示がダウン分だけ薄まり、
  // 復帰すると盛り返す気持ちいいフィードバックになる。
  let count = 0;
  for (let i = 0; i < N; i++) {
    if (!boidDead[i] && !boidDowned[i]) count++;
  }
  return count;
}

// -----------------------------------------------------------------
// パーティクルプール（v0.8: 200個へ拡張。緋竜の斬撃火花・派手化した攻撃FXのため）
// -----------------------------------------------------------------
const MAX_PARTICLES = 200;
const partX      = new Float32Array(MAX_PARTICLES);
const partY      = new Float32Array(MAX_PARTICLES);
const partVx     = new Float32Array(MAX_PARTICLES);
const partVy     = new Float32Array(MAX_PARTICLES);
const partLife   = new Float32Array(MAX_PARTICLES);
const partActive = new Uint8Array(MAX_PARTICLES);
// partType: 0=ブレス火花（橙〜赤）、1=出現エフェクト火花（金〜白〜薄橙）、2=死亡FX（灰〜暗赤）
const partType   = new Uint8Array(MAX_PARTICLES);

function spawnHitParticles(wx, wy) {
  // ブレスの火花は少数（2〜4個）に抑えてパフォーマンスを確保
  const count = 2 + Math.floor(fxRandom() * 3);
  let spawned = 0;
  for (let i = 0; i < MAX_PARTICLES && spawned < count; i++) {
    if (partActive[i]) continue;
    partActive[i] = 1;
    partType[i]   = 0; // ブレス火花
    partX[i] = wx;
    partY[i] = wy;
    const angle = fxRandom() * Math.PI * 2;
    const speed = 30 + fxRandom() * 60;
    partVx[i]   = Math.cos(angle) * speed;
    partVy[i]   = Math.sin(angle) * speed;
    partLife[i] = 0.20 + fxRandom() * 0.15;
    spawned++;
  }
}

function updateParticles(dt) {
  for (let i = 0; i < MAX_PARTICLES; i++) {
    if (!partActive[i]) continue;
    partX[i]    += partVx[i] * dt;
    partY[i]    += partVy[i] * dt;
    partVx[i]   *= 0.85;
    partVy[i]   *= 0.85;
    partLife[i] -= dt;
    if (partLife[i] <= 0) partActive[i] = 0;
  }
}

// -----------------------------------------------------------------
// v0.10: 炎上システム — 破壊した建物が数秒燃え、火の粉と煙柱を上げる。
// 「人間社会が燃えている」画を作る。専用プールで既存FXと枠を奪い合わない。
// -----------------------------------------------------------------
const MAX_FIRES = 48;
const fireX      = new Float32Array(MAX_FIRES);
const fireY      = new Float32Array(MAX_FIRES);
const fireLife   = new Float32Array(MAX_FIRES);
const fireEmit   = new Float32Array(MAX_FIRES);
const fireScale  = new Float32Array(MAX_FIRES);   // 建物サイズに応じた炎の規模
const fireActive = new Uint8Array(MAX_FIRES);
const FIRE_DURATION = 2.4;

const MAX_EMBERS = 200;
const emberX       = new Float32Array(MAX_EMBERS);
const emberY       = new Float32Array(MAX_EMBERS);
const emberVx      = new Float32Array(MAX_EMBERS);
const emberVy      = new Float32Array(MAX_EMBERS);
const emberLife    = new Float32Array(MAX_EMBERS);
const emberMaxLife = new Float32Array(MAX_EMBERS);
const emberType    = new Uint8Array(MAX_EMBERS);   // 0=火の粉, 1=煙
const emberActive  = new Uint8Array(MAX_EMBERS);

function resetFires() {
  fireActive.fill(0);
  emberActive.fill(0);
}

// 建物破壊時に炎上を開始する。radius で炎の規模を決める。
function spawnFire(wx, wy, radius) {
  let slot = -1;
  for (let i = 0; i < MAX_FIRES; i++) { if (!fireActive[i]) { slot = i; break; } }
  if (slot < 0) {
    // 満杯なら残り寿命最小を上書き（新しい破壊を優先）
    let minL = Infinity;
    for (let i = 0; i < MAX_FIRES; i++) if (fireLife[i] < minL) { minL = fireLife[i]; slot = i; }
  }
  fireActive[slot]  = 1;
  fireX[slot]       = wx;
  fireY[slot]       = wy;
  fireLife[slot]    = FIRE_DURATION * (0.7 + fxRandom() * 0.6);
  fireEmit[slot]    = 0;
  fireScale[slot]   = Math.max(0.7, radius / 12);
}

function _spawnEmber(wx, wy, type, scale) {
  let slot = -1;
  for (let i = 0; i < MAX_EMBERS; i++) { if (!emberActive[i]) { slot = i; break; } }
  if (slot < 0) return;
  emberActive[slot] = 1;
  emberX[slot] = wx + (fxRandom() - 0.5) * 8 * scale;
  emberY[slot] = wy + (fxRandom() - 0.5) * 6 * scale;
  if (type === 0) {
    emberVx[slot]   = (fxRandom() - 0.5) * 30;
    emberVy[slot]   = -40 - fxRandom() * 50;      // 火の粉は上へ舞う
    emberLife[slot] = 0.4 + fxRandom() * 0.35;
  } else {
    emberVx[slot]   = (fxRandom() - 0.5) * 18 - 6; // 煙はわずかに一方向へ流れる
    emberVy[slot]   = -22 - fxRandom() * 16;
    emberLife[slot] = 1.1 + fxRandom() * 0.8;
  }
  emberMaxLife[slot] = emberLife[slot];
  emberType[slot]    = type;
}

function updateFires(dt) {
  for (let i = 0; i < MAX_FIRES; i++) {
    if (!fireActive[i]) continue;
    fireLife[i] -= dt;
    if (fireLife[i] <= 0) { fireActive[i] = 0; continue; }
    fireEmit[i] -= dt;
    if (fireEmit[i] <= 0) {
      fireEmit[i] = 0.05 + fxRandom() * 0.05;
      const sc = fireScale[i];
      _spawnEmber(fireX[i], fireY[i], 0, sc);                       // 火の粉
      if (fxRandom() < 0.7) _spawnEmber(fireX[i], fireY[i], 1, sc); // 煙
    }
  }
  for (let i = 0; i < MAX_EMBERS; i++) {
    if (!emberActive[i]) continue;
    emberX[i] += emberVx[i] * dt;
    emberY[i] += emberVy[i] * dt;
    if (emberType[i] === 1) { emberVy[i] *= 0.98; emberVx[i] *= 0.99; } // 煙は上昇が緩む
    else                    { emberVy[i] += 8 * dt; }                    // 火の粉はやや重力
    emberLife[i] -= dt;
    if (emberLife[i] <= 0) emberActive[i] = 0;
  }
}

// ember描画（カメラ変換内・ワールド座標）。竜より下の地上レイヤーで呼ぶ。
function drawEmbers() {
  for (let i = 0; i < MAX_EMBERS; i++) {
    if (!emberActive[i]) continue;
    const t = emberLife[i] / emberMaxLife[i];   // 1→0
    if (emberType[i] === 1) {
      // 煙: 灰、寿命で膨張＆フェード（アルファ抑えめでユニット視認性を守る）
      const r = 4 + (1 - t) * 14;
      ctx.globalAlpha = t * 0.26;
      ctx.fillStyle = "#4a4a4a";
      ctx.beginPath();
      ctx.arc(emberX[i], emberY[i], r, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // 火の粉: 橙〜黄、小さく明るい
      const r = 1 + t * 2.2;
      const g = (120 + 120 * t) | 0;
      ctx.globalAlpha = Math.min(1, t * 1.4);
      ctx.fillStyle = `rgb(255,${g},40)`;
      ctx.beginPath();
      ctx.arc(emberX[i], emberY[i], r, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1.0;
}

// 卵システム（ワールド座標）
// -----------------------------------------------------------------
const MAX_EGGS = 200;
const eggWx     = new Float32Array(MAX_EGGS);
const eggWy     = new Float32Array(MAX_EGGS);
const eggActive = new Uint8Array(MAX_EGGS);
let totalEggCount = 0;

function spawnEgg(wx, wy) {
  for (let i = 0; i < MAX_EGGS; i++) {
    if (eggActive[i]) continue;
    eggActive[i] = 1;
    eggWx[i] = wx;
    eggWy[i] = wy;
    return i;
  }
  return -1;
}

function collectNearbyEggs() {
  for (let e = 0; e < MAX_EGGS; e++) {
    if (!eggActive[e]) continue;
    for (let i = 0; i < N; i++) {
      if (boidDead[i]) continue;
      const dx = eggWx[e] - px[i];
      const dy = eggWy[e] - py[i];
      if (dx * dx + dy * dy < 60 * 60) {
        eggActive[e] = 0;
        totalEggCount++;
        // 卵回収 = その場で竜+1（群れ上限未満のときのみ）
        // v0.6: 上限到達後の卵は XP+10 に変換する（拾って無駄がない）
        const added = spawnBoidAtEgg(eggWx[e], eggWy[e]);
        if (!added) spawnXpGems(eggWx[e], eggWy[e], EGG_OVERFLOW_XP);
        break;
      }
    }
  }
}

/**
 * 卵の位置に竜を1体スポーンする。
 * 群れが上限（effFlockCap）に達していたら何もしない（カウンタは増える）。
 * SoA の全要素を初期化して NaN/ゴミを防ぐ。
 * @returns {boolean} 追加に成功したら true（上限到達時は false）
 */
function spawnBoidAtEgg(wx, wy) {
  if (N >= effFlockCap() || N >= MAX_BOIDS) return false; // 上限到達時は追加しない
  // 変更2: 竜出現エフェクトをスポーン（追加に成功したときのみ）
  spawnDragonAppearEffect(wx, wy);

  const idx = N; // 新しい個体スロット
  N++;           // 有効個体数を先に増やす

  // 群れの平均速度を取得して初速に使う（群れの流れに乗せる）
  let avgVx = 0, avgVy = 0, aliveCount = 0;
  for (let i = 0; i < N - 1; i++) {
    if (!boidDead[i]) { avgVx += vx[i]; avgVy += vy[i]; aliveCount++; }
  }
  if (aliveCount > 0) {
    avgVx /= aliveCount;
    avgVy /= aliveCount;
  } else {
    // 群れが全滅していたら右方向に発射
    avgVx = mv().minSpeed;
    avgVy = 0;
  }
  // 群れ平均速度にランダム成分を少し加える（単純コピーで整列しすぎないよう）
  const randAngle = random() * Math.PI * 2;
  const randStrength = mv().minSpeed * 0.3;
  const initVx = avgVx + Math.cos(randAngle) * randStrength;
  const initVy = avgVy + Math.sin(randAngle) * randStrength;

  // 速度の大きさを minSpeed 以上に保証
  const speed = Math.sqrt(initVx * initVx + initVy * initVy) || mv().minSpeed;
  const scale = speed < mv().minSpeed ? mv().minSpeed / speed : 1;
  const finalVx = initVx * scale;
  const finalVy = initVy * scale;

  // 初期角度（尻尾の向き初期化に使う）
  const initAngle = Math.atan2(finalVy, finalVx);

  // SoA 全要素を正確に初期化
  px[idx]                   = wx;
  py[idx]                   = wy;
  vx[idx]                   = finalVx;
  vy[idx]                   = finalVy;
  boidHp[idx]               = BOID_MAX_HP;
  boidDead[idx]             = 0;
  boidFadeTimer[idx]        = 0;
  boidHitStopTimer[idx]     = 0;
  boidKnockStun[idx]        = 0;
  boidKickX[idx]            = 0;
  boidKickY[idx]            = 0;
  boidCollisionCooldown[idx] = 0;
  // 変更2: ダウン/復帰モデル配列の初期化（NaN/未定義防止）
  boidDowned[idx]      = 0;
  boidDownTimer[idx]   = 0;
  boidReviveTimer[idx] = 0;

  // 尻尾角度履歴：全セグメントを初期角度で埋める（NaN 防止）
  const base = idx * TAIL_SEGS;
  for (let s = 0; s < TAIL_SEGS; s++) {
    boidAngleHistory[base + s] = initAngle;
  }

  // v0.6: リザルト用の最大群れ数を更新
  if (N > runMaxFlock) runMaxFlock = N;
  return true;
}

// ★レベルアップ調整パラメータ（ここだけ変えればレベルの上がり方を調整できる）
//   必要XP(Lv n → n+1) = XP_LEVEL_BASE × XP_LEVEL_GROWTH^(min(n, XP_LEVEL_CAP)-1)
//   - XP_LEVEL_BASE  : 最初のレベルアップに必要なXP。大きいほど全体的に上がりにくい
//   - XP_LEVEL_GROWTH: レベルごとの必要XP倍率。大きいほど序盤〜中盤の伸びが急になる
//   - XP_LEVEL_CAP   : このレベル以降は必要XPが一定（曲線の頭打ち）
//   例) もっと速く上げたい → XP_LEVEL_BASE を 120 などに下げる
//       もっとゆっくりにしたい → XP_LEVEL_BASE を 220 などに上げる
//   v0.11: 建物数が約1.8倍に増えXP総量が増えたため 110→160 に引き上げ
//   v0.14: 「後半レベルが上がらなすぎる」対策で Lv10 以降の必要XPを頭打ちに。
//   同時に敵XPのステージスケール（moverStageXpMult）を廃止し、
//   レベル進行はこの曲線だけでコントロールする（Shooter指示）
// ============================================================
const XP_LEVEL_BASE   = 160;
const XP_LEVEL_GROWTH = 1.35;
const XP_LEVEL_CAP    = 10;
function xpForNext(level) {
  return Math.ceil(XP_LEVEL_BASE * Math.pow(XP_LEVEL_GROWTH, Math.min(level, XP_LEVEL_CAP) - 1));
}

// ---- 効果の集計（取得回数から都度計算。ステージリセットで自然に戻る）----

function effHpMult()        { return (1 + 0.20 * upCount("scale")) * permaBuff.flockHp; }

function effReviveMult()    { return Math.pow(0.85, upCount("tide")) * permaBuff.reviveMult; }

function eraFlockCapFraction() {
  return TIER_FLOCK_CAP_FRACTION[Math.min(powerTier, TIER_FLOCK_CAP_FRACTION.length - 1)];
}
function effFlockCap()      {
  const base = BASE_FLOCK_CAP + 25 * upCount("brood") + permaBuff.flockCap;
  return Math.max(1, Math.min(MAX_BOIDS, Math.round(base * eraFlockCapFraction())));

    }
  } else if (cardId === "brood") {
    // 上限+25 に加えて即時に竜5体を群れ重心付近へ無償孵化
    const centroid = calcFriendlyCentroid();
    for (let k = 0; k < 5; k++) {
      const angle = random() * Math.PI * 2;
      const r     = 30 + random() * 50;
      spawnBoidAtEgg(centroid.x + Math.cos(angle) * r, centroid.y + Math.sin(angle) * r);
    }
  } else if (cardId === "evo_bullet") {
    convertFlock("ice");
  } else if (cardId === "evo_missile") {
    convertFlock("shadow");
  } else if (cardId === "evo_melee") {
    convertFlock("crimson");
  } else if (cardId === "orb") {
    addXp(150);
  }
}

// ---- XP加算とレベルアップ検出 ----
function addXp(value) {
  value = Math.round(value * permaBuff.xpGain);   // v0.21: 恵みライン「成長の律動」
  playerXp   += value;
  runTotalXp += value;
  while (playerXp >= xpForNext(playerLevel)) {
    playerXp -= xpForNext(playerLevel);
    playerLevel++;
    pendingCards++;
  }
  updateXpHud();
}

// ---- ラン開始時の進行完全リセット ----
// v0.7: ステージ遷移では呼ばない（強化・レベル・竜の種族はラン全体で持ち越し）。
// タイトルへ戻ったとき（returnToTitle）と起動時（boot）のみ呼ぶ。
function resetProgression() {
  playerLevel  = 1;
  playerXp     = 0;
  pendingCards = 0;
  // v0.51: 時代の進行もランごとにゼロへ（群れ上限の係数がこれに従うため必須）
  runEra          = 0;
  powerTier       = 0;
  tierSlowmoTimer = 0;
  evolutionChosen = false;   // v0.14: 新しいランでは再び最初のレベルアップで竜種を選ぶ
  for (const key of Object.keys(upgradeCounts)) delete upgradeCounts[key];
  // 竜種も火竜に戻る（新しいランはビルドをゼロから組み直す）
  setFlockSpecies("fire");
  if (boidFireTimer) boidFireTimer.fill(0);
  clearDragonProjectiles();
  // 表示中のカードとスローを畳む
  dismissLevelUpCards();
  updateHUDWeapon();
  updateXpHud();
}

// -----------------------------------------------------------------
// v0.6: XPジェム（破壊対象から飛び出し群れへ吸い込まれる光の粒）
// -----------------------------------------------------------------
const MAX_GEMS = 400;
const gemX      = new Float32Array(MAX_GEMS);
const gemY      = new Float32Array(MAX_GEMS);
const gemVx     = new Float32Array(MAX_GEMS);
const gemVy     = new Float32Array(MAX_GEMS);
const gemVal    = new Float32Array(MAX_GEMS);
const gemAge    = new Float32Array(MAX_GEMS);
const gemActive = new Uint8Array(MAX_GEMS);

const XP_MAGNET_RADIUS_BASE = 120;  // 吸引開始半径（「吸引域」カードで拡大）
const XP_COLLECT_RADIUS     = 14;   // 回収判定半径
const XP_ATTRACT_SPEED      = 600;  // 吸引速度（px/s）
const GEM_SCATTER_DURATION  = 0.22; // 飛散フェーズの長さ（秒）
const EGG_OVERFLOW_XP       = 10;   // 群れ上限到達後の卵1個ぶんのXP

// 撃破対象のXP基礎値（仕様 §5.1）
function xpValueOf(settlement) {
  if (settlement.isBoss)     return 300;
  if (settlement._isWall)    return 12;
  if (settlement._isCapital) return 30;
  let base;
  switch (settlement.size) {
    case "tiny":   base = 1; break;
    case "medium": base = 8; break;
    case "large":  base = 20; break;
    default:       base = 2; break; // small / 城下small
  }
  // v0.7: 要塞都市はリスクに見合う2倍報酬
  return settlement._fortified ? base * 2 : base;
}

/**
 * value ぶんのXPジェムを額面 25/5/1 に分割してスポーンする。
 * 大きい建物ほど粒が多く飛び散る（報酬の視覚化）。プール満杯時は直接加算。
 */
function spawnXpGems(wx, wy, value) {
  const DENOMS = [25, 5, 1];
  let remaining = value;
  for (const denom of DENOMS) {
    while (remaining >= denom) {
      remaining -= denom;
      let slot = -1;
      for (let i = 0; i < MAX_GEMS; i++) {
        if (!gemActive[i]) { slot = i; break; }
      }
      if (slot < 0) { addXp(remaining + denom); return; } // プール枯渇: 残額を直接加算
      gemActive[slot] = 1;
      gemX[slot]   = wx + (random() - 0.5) * 8;
      gemY[slot]   = wy + (random() - 0.5) * 8;
      const angle  = random() * Math.PI * 2;
      const speed  = 60 + random() * 120;
      gemVx[slot]  = Math.cos(angle) * speed;
      gemVy[slot]  = Math.sin(angle) * speed;
      gemVal[slot] = denom;
      gemAge[slot] = 0;
    }
  }
}

function clearXpGems() { gemActive.fill(0); }

function updateXpGems(dt) {
  const magnetR2  = effMagnetRadius() * effMagnetRadius();
  const collectR2 = XP_COLLECT_RADIUS * XP_COLLECT_RADIUS;

  for (let g = 0; g < MAX_GEMS; g++) {
    if (!gemActive[g]) continue;
    gemAge[g] += dt;

    if (gemAge[g] < GEM_SCATTER_DURATION) {
      // 飛散フェーズ: 初速で広がりつつ減速
      gemX[g]  += gemVx[g] * dt;
      gemY[g]  += gemVy[g] * dt;
      gemVx[g] *= 0.88;
      gemVy[g] *= 0.88;
      continue;
    }

    // 吸引フェーズ: 最寄りの有効個体を探して吸い込まれる
    let nearest = -1;
    let nearestD2 = magnetR2;
    for (let i = 0; i < N; i++) {
      if (boidDead[i] || boidDowned[i]) continue;
      const dx = px[i] - gemX[g];
      const dy = py[i] - gemY[g];
      const d2 = dx * dx + dy * dy;
      if (d2 < nearestD2) { nearestD2 = d2; nearest = i; }
    }
    if (nearest < 0) continue; // 吸引範囲外: その場で待機（消えない）

    if (nearestD2 < collectR2) {
      gemActive[g] = 0;
      addXp(gemVal[g]);
      continue;
    }

    const d  = Math.sqrt(nearestD2) || 1;
    const nx = (px[nearest] - gemX[g]) / d;
    const ny = (py[nearest] - gemY[g]) / d;
    // 近いほど速く吸い込まれる（気持ちいい加速感）
    const speedScale = 1 + (1 - Math.min(1, d / effMagnetRadius())) * 1.5;
    gemX[g] += nx * XP_ATTRACT_SPEED * speedScale * dt;
    gemY[g] += ny * XP_ATTRACT_SPEED * speedScale * dt;
  }
}

/**
 * XPジェムを描画する。カメラ変換内（ワールド座標系）で呼ぶこと。
 * 青白いダイヤ型＝XP。金色の卵と色で明確に区別する。
 */
function drawXpGems() {
  ctx.save();
  for (let g = 0; g < MAX_GEMS; g++) {
    if (!gemActive[g]) continue;
    // 額面でサイズを変える: 1→2.5px, 5→3.5px, 25→5px
    const r = gemVal[g] >= 25 ? 5 : (gemVal[g] >= 5 ? 3.5 : 2.5);
    const pulse = 0.75 + 0.25 * Math.sin(breathTime * 6 + g * 1.7);
    const wx = gemX[g], wy = gemY[g];
    ctx.globalAlpha = pulse;
    ctx.fillStyle   = gemVal[g] >= 25 ? "#a0ecff" : "#60c8ff";
    ctx.beginPath();
    ctx.moveTo(wx, wy - r);
    ctx.lineTo(wx + r * 0.7, wy);
    ctx.lineTo(wx, wy + r);
    ctx.lineTo(wx - r * 0.7, wy);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = pulse * 0.9;
    ctx.strokeStyle = "rgba(255,255,255,0.7)";
    ctx.lineWidth   = 0.8;
    ctx.stroke();
  }
  ctx.globalAlpha = 1.0;
  ctx.restore();
}

// -----------------------------------------------------------------
// v0.6.1: レベルアップ3択カードUI（非モーダル・スローモー方式）
// 時間停止をやめ、カード表示中はワールドを SLOWMO_SCALE 倍速で進める。
// 線描画は継続でき、SLOWMO_DURATION 秒たつと通常速度に戻る（カードは選ぶまで残る）。
// ゲームオーバーが存在しないため、選択中の被弾リスクはほぼ無い。
// -----------------------------------------------------------------
const levelupOverlayEl = document.getElementById("levelup-overlay");
const levelupTitleEl   = document.getElementById("levelup-title");
const cardListEl       = document.getElementById("card-list");

const SLOWMO_SCALE    = 0.25;  // カード表示中のワールド速度倍率
const SLOWMO_DURATION = 7.0;   // スローが持続する秒数（実時間。以降は通常速度でカードだけ残る）
const SLOWMO_EASE     = 8;     // timeScale の追従速さ（急停止感を出さないためのイージング）

let upgradeCardsVisible = false;
let slowmoTimer = 0;
let timeScale   = 1;   // ワールド時間倍率（tick で dt に乗算）

/**
 * pendingCards が残っていれば3択カードを画面下部に出す。tick の playing 分岐末尾から呼ぶ。
 * ゲームは止めない（スローモーのみ）。表示中は新たに開かない（選択後に次を開く）。
 */
function maybeShowLevelUp() {
  if (gameState !== "playing" || pendingCards <= 0 || upgradeCardsVisible) return;
  upgradeCardsVisible = true;
  slowmoTimer = SLOWMO_DURATION;
  levelupTitleEl.textContent = STRINGS.levelUp;  // 竜種選択で書き換わったタイトルを戻す
  buildLevelUpCards();
  levelupOverlayEl.classList.add("visible");
  triggerFlash("rgba(160,236,255,0.35)", 0.15);
  hapticPulse(60);
}

/** 取得可能なカードから重み付きで3枚（重複なし）選んでDOMに並べる。 */
function buildLevelUpCards() {
  // v0.19: 竜種はラン開始メニューで確定済み（evolutionChosen=true）。
  // ラン中の初回4択は廃止し、レベルアップは純粋な強化のみ。
  const pool = CARD_DEFS.filter(def => {
    if (upCount(def.id) >= def.max) return false;
    // v0.31: 母竜ブレスの強化はラン中に「母なる吐息」を引いた後だけ出す（空振りカードを作らない）
    if (def.mother && !isMotherBreathUnlocked()) return false;
    // 武器強化カードは現在の武器タイプにのみ出現
    if (def.weapon && def.weapon !== flockWeapon) return false;
    // ★進化は最初のレベルアップ専用（上の分岐でのみ出る）
    if (def.targetWeapon) return false;
    return true;
  });

  const picks = [];
  const candidates = pool.slice();
  while (picks.length < 3 && candidates.length > 0) {
    let totalWeight = 0;
    for (const def of candidates) totalWeight += CARD_RARITY_WEIGHT[def.rarity];
    let roll = random() * totalWeight;
    let chosenIdx = 0;
    for (let i = 0; i < candidates.length; i++) {
      roll -= CARD_RARITY_WEIGHT[candidates[i].rarity];
      if (roll <= 0) { chosenIdx = i; break; }
    }
    const chosen = candidates[chosenIdx];
    picks.push(chosen);
    candidates.splice(chosenIdx, 1);
  }
  // プールが痩せた場合は竜玉（XP+50）で補充（最低1枚は必ず出す）
  if (picks.length < 3) picks.push(CARD_ORB);

  renderLevelUpCards(picks);
}

/** カード定義の配列をそのまま3択UIとしてDOMに並べる。 */
function renderLevelUpCards(picks) {
  cardListEl.classList.remove("species-grid");   // 竜種選択の2列モードを解除（同じDOMを使い回す）
  cardListEl.innerHTML = "";
  for (const def of picks) {
    const text = STRINGS.cards[def.id];
    const btn  = document.createElement("button");
    btn.className = "upgrade-card rarity-" + def.rarity;
    const taken = upCount(def.id);
    const stack = (def.max !== Infinity && def.max > 1) ? ` (${taken + 1}/${def.max})` : "";
    btn.innerHTML =
      `<span class="card-icon">${def.icon}</span>` +
      `<span><div class="card-name">${text.name}${stack}</div>` +
      `<div class="card-desc">${text.desc}</div></span>`;
    btn.addEventListener("pointerdown", (e) => {
      e.stopPropagation();
      e.preventDefault();
      chooseCard(def);
    });
    cardListEl.appendChild(btn);
  }
}

function chooseCard(def) {
  if (!upgradeCardsVisible) return;
  // v0.14: 進化カードか「火竜を続ける」を選んだ（＝最初のレベルアップを消化した）ら
  // 以降は通常プールのみ。竜種の選択はラン開始時の一度きり
  if (def.targetWeapon || def.id === "stay_fire") evolutionChosen = true;
  upgradeCounts[def.id] = upCount(def.id) + 1;
  applyCardImmediate(def.id);
  pendingCards--;
  updateHUDLevel();
  hapticPulse(30);

  upgradeCardsVisible = false;
  slowmoTimer = 0;
  levelupOverlayEl.classList.remove("visible");
  // 連続レベルアップが残っていれば続けて開く（スロー時間もリフレッシュされる）
  if (pendingCards > 0) maybeShowLevelUp();
}

/** カードUIを閉じてスローを解除する（ステージ遷移・タイトル帰還時の安全網）。 */
function dismissLevelUpCards() {
  upgradeCardsVisible = false;
  slowmoTimer = 0;
  timeScale   = 1;
  levelupOverlayEl.classList.remove("visible");
}

// v0.6-p2: 武器タイプシステム（BEAM / BULLET / MISSILE / MELEE）
// 群れは常に単一タイプ（★進化で100%全転換。仕様 §5.4-C / §6）
// =================================================================

// v0.34: 竜種が正（SPECIES_DEFS のキー）。ステージ開始時は必ず火竜（resetProgression で戻る）。
let flockSpecies = "fire";
// flockWeapon は「現在の攻撃の kind」＝竜種から導出される値。
// 攻撃処理の分岐（updateWeaponAttacks 等）は従来どおりこれを見る。
// 直接代入せず setFlockSpecies() 経由で更新する。
let flockWeapon = "beam";

/**
 * v0.34: 竜種を切り替える唯一の入口。flockWeapon（攻撃の kind）を導出し直す。
 * 未知のIDが来たら火竜へフォールバックする（旧セーブ・想定外値の保険）。
 */
function setFlockSpecies(speciesId) {
  flockSpecies = SPECIES_DEFS[speciesId] ? speciesId : "fire";
  flockWeapon  = ATTACK_DEFS[SPECIES_DEFS[flockSpecies].attack].kind;
  // HUD をここで必ず追従させる（呼び出し側の更新漏れで表示がズレるのを防ぐ）
  updateHUDWeapon();
}

// 転換時のフラッシュ色（進化の瞬間を派手に）。v0.34: 竜種IDキーに変更。
const SPECIES_FLASH_COLOR = {
  fire:    "rgba(255,140,40,0.6)",
  ice:     "rgba(160,232,255,0.6)",
  shadow:  "rgba(192,128,255,0.6)",
  crimson: "rgba(255,64,48,0.6)",
};

// ---- BULLET（氷竜・直進弾丸）基礎性能（仕様 §6.2）----
const BULLET_RANGE      = 220;  // 射出可能距離（px）
const BULLET_SPEED      = 400;  // 弾速（px/s・直進非追尾）
const BULLET_DAMAGE     = 6;    // 単発ダメージ
const BULLET_INTERVAL   = 1.2;  // 発射間隔（秒）
const BULLET_MAX_TRAVEL = 300;  // 弾の最大飛距離（px）

// ---- MISSILE（影竜・加速ホーミング）基礎性能（仕様 §6.3）----
const MISSILE_RANGE      = 300;   // ロックオン距離（px）
const MISSILE_DAMAGE     = 15;    // 直撃ダメージ
const MISSILE_INTERVAL   = 2.5;   // 発射間隔（秒）
const MISSILE_INIT_SPEED = 60;    // 初速（px/s）
const MISSILE_MAX_SPEED  = 500;   // 最高速（px/s）
const MISSILE_ACCEL      = 600;   // 加速度（px/s²）
const MISSILE_TURN_RATE  = 3.5;   // 旋回率（rad/s）
const MISSILE_AOE        = 30;    // 爆発半径（px）
const MISSILE_AOE_FACTOR = 0.5;   // 爆発範囲ダメージ係数
const MISSILE_LIFETIME   = 4.0;   // 追尾失敗時の寿命（秒）

// ---- MELEE（緋竜・直接攻撃特化）基礎性能（仕様 §6.4）----
const MELEE_COLLISION_DAMAGE   = 25;    // 体当たりダメージ（通常8の約3倍強）
const MELEE_COLLISION_COOLDOWN = 0.35;  // 体当たりクールダウン（通常0.5より短い）
const MELEE_HP_MULT            = 1.5;   // 個体最大HP倍率

// 各個体の射撃タイマー（BULLET/MISSILE共用。initBoids で確保）
let boidFireTimer = null;

/**
 * ★進化: 群れ全体を weapon タイプへ100%転換する。
 * - HP上限の変化（melee ±50%）は現在HPも比率維持で追従
 * - 全個体の位置に閃光パーティクル＋画面フラッシュで「一斉に色が変わる」を演出
 */
function convertFlock(speciesId) {
  const oldMax = effBoidMaxHp();
  setFlockSpecies(speciesId);
  const newMax = effBoidMaxHp();
  const ratio  = newMax / oldMax;

  for (let i = 0; i < N; i++) {
    if (!boidDead[i]) boidHp[i] = Math.min(newMax, boidHp[i] * ratio);
    // 射撃タイマーをばらけさせて一斉射撃の不自然さを防ぐ
    if (boidFireTimer) boidFireTimer[i] = random() * currentFireInterval();
  }

  // 進化演出: 群れの一部個体に出現FXリング＋強フラッシュ＋強振動
  let fxCount = 0;
  for (let i = 0; i < N && fxCount < 12; i++) {
    if (boidDead[i] || boidDowned[i]) continue;
    if (fxRandom() < 0.4) { spawnDragonAppearEffect(px[i], py[i]); fxCount++; }
  }
  triggerFlash(SPECIES_FLASH_COLOR[speciesId] ?? "rgba(255,255,255,0.5)", 0.35);
  hapticPulse(120);
  updateHUDWeapon();
}

function currentFireInterval() {
  if (flockWeapon === "bullet")   return BULLET_INTERVAL * effFireIntervalMult("bullet");
  if (flockWeapon === "missile")  return MISSILE_INTERVAL * effFireIntervalMult("missile");
  // v0.35: Ⅱ群＋ガーゴイル
  if (flockWeapon === "blade")    return BLADE_INTERVAL * effFireIntervalMult("blade");
  if (flockWeapon === "scatter")  return SCATTER_INTERVAL * effFireIntervalMult("scatter");
  if (flockWeapon === "divebomb") return DIVE_INTERVAL * effFireIntervalMult("divebomb");
  // v0.37.1: 極端枠
  if (flockWeapon === "bomb")     return BOMB_INTERVAL * effFireIntervalMult("bomb");
  if (flockWeapon === "tongue")   return TONGUE_INTERVAL * effFireIntervalMult("tongue");
  return 1.0;   // beam / melee / satellite は発射タイマーを使わない
}

const hudWeaponEl = document.getElementById("h-weapon");
function updateHUDWeapon() {
  const s = sp();
  hudWeaponEl.textContent = `${s.icon} ${s.ja}`;
  hudWeaponEl.style.color = s.color;
}

/** 建物へのダメージ適用＋陥落処理の共通ヘルパー（弾丸・ミサイル用） */
function damageBuilding(settlementIdx, damage) {
  const settlement = settlements[settlementIdx];
  if (!settlement || settlement.fallen) return;
  settlement.hp -= damage;
  if (settlement.hp <= 0 && !settlement.fallen) {
    settlementFall(settlementIdx);
    buildingLayerDirty = true;
  }
}

// -----------------------------------------------------------------
// 自軍投射物プール（BULLET弾・MISSILE弾。敵投射物プールとは独立）
// -----------------------------------------------------------------
const MAX_DPROJ = 300;
const dprojX       = new Float32Array(MAX_DPROJ);
const dprojY       = new Float32Array(MAX_DPROJ);
const dprojVx      = new Float32Array(MAX_DPROJ);
const dprojVy      = new Float32Array(MAX_DPROJ);
const dprojStartX  = new Float32Array(MAX_DPROJ);
const dprojStartY  = new Float32Array(MAX_DPROJ);
const dprojAge     = new Float32Array(MAX_DPROJ);
const dprojActive  = new Uint8Array(MAX_DPROJ);
const dprojKind    = new Uint8Array(MAX_DPROJ);   // 0=bullet, 1=missile
const dprojHits    = new Uint8Array(MAX_DPROJ);   // bullet: 残り貫通ヒット数
const dprojLastHit = new Int32Array(MAX_DPROJ);   // bullet: 直前ヒット建物（連続多段ヒット防止）
const dprojTarget  = new Int32Array(MAX_DPROJ);   // missile: 追尾対象の建物インデックス

function clearDragonProjectiles() { dprojActive.fill(0); }

/**
 * v0.33: 発射の反動と硬直を1個体に適用する。
 * 反動 = 発射方向の逆に速度を足す（撃つと押し戻される手触り）。
 * 硬直 = boidHitStopTimer を使って物理更新を止める（体当たりのヒットストップと同じ機構。
 *        「この個体の物理を N 秒止める」という意味がまさに硬直なので流用する）。
 */
function applyFireKick(boidIdx, angle) {
  const a = atk();   // v0.34: 反動・硬直は攻撃側の性質
  // v0.34.1: 反動は vx/vy を直接いじらず外力チャネルへ。
  // 旧実装（vx/vy への加算）は操舵の極座標積分に3フレームで打ち消されて
  // ほぼ体感できていなかった（実測：18px/s の反動が速度差 2.8〜9.4px/s しか残らず、
  // 横方向へ撃つと0、後方へ撃つと逆に加速していた）。
  const recoil = effRecoilDist();
  // 自分の反動では攻撃を止めない（硬直は fireStun が別に持つ）
  if (recoil > 0) applyKickDist(boidIdx, -Math.cos(angle), -Math.sin(angle), recoil, false);
  if (a.fireStun > 0) {
    boidHitStopTimer[boidIdx] = Math.max(boidHitStopTimer[boidIdx], a.fireStun);
  }
}

function spawnDragonProjectile(fromX, fromY, kind, angle, targetIdx) {
  let slot = -1;
  for (let i = 0; i < MAX_DPROJ; i++) {
    if (!dprojActive[i]) { slot = i; break; }
  }
  if (slot < 0) return;

  dprojActive[slot]  = 1;
  dprojX[slot]       = fromX;
  dprojY[slot]       = fromY;
  dprojStartX[slot]  = fromX;
  dprojStartY[slot]  = fromY;
  dprojAge[slot]     = 0;
  dprojKind[slot]    = kind;
  dprojLastHit[slot] = -1;
  dprojTarget[slot]  = targetIdx;

  if (kind === 0) {
    dprojVx[slot]  = Math.cos(angle) * BULLET_SPEED;
    dprojVy[slot]  = Math.sin(angle) * BULLET_SPEED;
    dprojHits[slot] = Math.min(255, effBulletPierce());
  } else {
    // ミサイルは初速が遅く、発射方向にゆらぎ（±0.8rad）を持たせてから加速追尾する
    const wobbled = angle + (random() - 0.5) * 1.6;
    dprojVx[slot]  = Math.cos(wobbled) * MISSILE_INIT_SPEED;
    dprojVy[slot]  = Math.sin(wobbled) * MISSILE_INIT_SPEED;
    dprojHits[slot] = 1;
  }
}

// 近傍建物クエリ用の作業バッファ（自軍弾専用。既存バッファと分離して干渉を防ぐ）
const _dprojNeighbourBuf = [];

/**
 * 指定座標から最も近い未陥落の建物を探す（cellRadius セル走査）。
 * @param {boolean} excludeWalls  true のとき城壁を対象外にする
 *   （ミサイルは壁を飛び越える＝壁を狙えないため。弾丸は壁を狙える＝攻城槌）
 */
function findNearestBuilding(wx, wy, maxDist, cellRadius, excludeWalls) {
  buildingGridQueryRadius(wx, wy, cellRadius, _dprojNeighbourBuf);
  let best = -1;
  let bestD2 = maxDist * maxDist;
  for (const sIdx of _dprojNeighbourBuf) {
    const s = settlements[sIdx];
    if (!s || s.fallen) continue;
    if (excludeWalls && s._isWall) continue;
    const dx = s.wx - wx;
    const dy = s.wy - wy;
    const d2 = dx * dx + dy * dy;
    if (d2 < bestD2) { bestD2 = d2; best = sIdx; }
  }
  return best;
}

/** BULLET: 射程内の最近建物へ直進弾を放つ（各個体、間隔 1.2s×連射機構） */
function updateBulletAttacks(dt) {
  const range      = BULLET_RANGE * effWeaponRangeMult("bullet");
  const interval   = BULLET_INTERVAL * effFireIntervalMult("bullet");
  const cellRadius = Math.max(1, Math.ceil(range / BUILDING_GRID_CELL));

  for (let i = 0; i < N; i++) {
    if (boidDead[i] || boidDowned[i] || boidKnockStun[i] > 0) continue;   // v0.59: 押されている間は攻撃しない
    boidFireTimer[i] -= dt;
    if (boidFireTimer[i] > 0) continue;

    const targetIdx = findNearestBuilding(px[i], py[i], range, cellRadius, false);
    if (targetIdx < 0) continue; // 射程内に標的なし: タイマーは0のまま待機（見つけ次第撃つ）

    boidFireTimer[i] = interval;
    const target = settlements[targetIdx];
    const angle  = Math.atan2(target.wy - py[i], target.wx - px[i]);
    spawnDragonProjectile(px[i], py[i], 0, angle, targetIdx);
    applyFireKick(i, angle);   // v0.33: 竜種プロファイルの反動・硬直
  }
}

/** MISSILE: ロック距離内の最近建物に向けて加速ホーミング弾を放つ（間隔 2.5s×連射機構） */
function updateMissileAttacks(dt) {
  const range      = MISSILE_RANGE * effWeaponRangeMult("missile");
  const interval   = MISSILE_INTERVAL * effFireIntervalMult("missile");
  const cellRadius = Math.max(1, Math.ceil(range / BUILDING_GRID_CELL));

  for (let i = 0; i < N; i++) {
    if (boidDead[i] || boidDowned[i] || boidKnockStun[i] > 0) continue;   // v0.59: 押されている間は攻撃しない
    boidFireTimer[i] -= dt;
    if (boidFireTimer[i] > 0) continue;

    // v0.6-p3: ミサイルは城壁を狙わない（壁越しに内部の建物をロックする）
    const targetIdx = findNearestBuilding(px[i], py[i], range, cellRadius, true);
    if (targetIdx < 0) continue;

    boidFireTimer[i] = interval;
    // 発射方向は現在の進行方向（そこからゆらいで加速する軌道が気持ちよさの本体）
    const angle = Math.atan2(vy[i], vx[i]);
    spawnDragonProjectile(px[i], py[i], 1, angle, targetIdx);
    applyFireKick(i, angle);   // v0.33: 竜種プロファイルの反動・硬直
  }
}

/** 自軍投射物の移動・追尾・建物ヒット処理 */
function updateDragonProjectiles(dt) {
  for (let i = 0; i < MAX_DPROJ; i++) {
    if (!dprojActive[i]) continue;
    dprojAge[i] += dt;

    if (dprojKind[i] === 1) {
      // ---- ミサイル: 加速＋旋回追尾 ----
      let targetIdx = dprojTarget[i];
      let target = (targetIdx >= 0) ? settlements[targetIdx] : null;
      if (!target || target.fallen) {
        // 対象消失: 現在位置周辺で再ロック（城壁は対象外。見つからなければ直進して寿命切れ）
        targetIdx = findNearestBuilding(dprojX[i], dprojY[i], 250, 3, true);
        dprojTarget[i] = targetIdx;
        target = (targetIdx >= 0) ? settlements[targetIdx] : null;
      }

      const speed = Math.min(
        MISSILE_MAX_SPEED,
        Math.sqrt(dprojVx[i] * dprojVx[i] + dprojVy[i] * dprojVy[i]) + MISSILE_ACCEL * dt,
      );
      let heading = Math.atan2(dprojVy[i], dprojVx[i]);
      if (target) {
        const desired = Math.atan2(target.wy - dprojY[i], target.wx - dprojX[i]);
        let diff = desired - heading;
        while (diff >  Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        const maxTurn = MISSILE_TURN_RATE * dt;
        heading += Math.max(-maxTurn, Math.min(maxTurn, diff));
      }
      dprojVx[i] = Math.cos(heading) * speed;
      dprojVy[i] = Math.sin(heading) * speed;

      if (dprojAge[i] > MISSILE_LIFETIME) { dprojActive[i] = 0; continue; }
    } else {
      // ---- 弾丸: 直進・飛距離上限 ----
      const tdx = dprojX[i] - dprojStartX[i];
      const tdy = dprojY[i] - dprojStartY[i];
      if (tdx * tdx + tdy * tdy > BULLET_MAX_TRAVEL * BULLET_MAX_TRAVEL) {
        dprojActive[i] = 0;
        continue;
      }
    }

    dprojX[i] += dprojVx[i] * dt;
    dprojY[i] += dprojVy[i] * dt;

    if (dprojX[i] < -50 || dprojX[i] > WORLD_W + 50 || dprojY[i] < -50 || dprojY[i] > WORLD_H + 50) {
      dprojActive[i] = 0;
      continue;
    }

    // ---- v0.6-p3: 岩山チェック（弾丸のみ。ミサイルは地形を飛び越える）----
    if (dprojKind[i] === 0) {
      let blockedByRock = false;
      for (const ob of terrainObstacles) {
        if (ob.type !== "rock") continue;
        const rdx = ob.wx - dprojX[i];
        const rdy = ob.wy - dprojY[i];
        if (rdx * rdx + rdy * rdy < ob.radius * ob.radius) { blockedByRock = true; break; }
      }
      if (blockedByRock) {
        spawnHitParticles(dprojX[i], dprojY[i]);
        dprojActive[i] = 0;
        continue;
      }
    }

    // ---- v0.6-p4: 移動敵ヒット判定（数が少ないので全走査） ----
    let hitMover = false;
    for (const m of movers) {
      if (!m.alive) continue;
      const mdx = m.wx - dprojX[i];
      const mdy = m.wy - dprojY[i];
      const mHitR = m.def.radius + 3;
      if (mdx * mdx + mdy * mdy > mHitR * mHitR) continue;
      if (dprojKind[i] === 0) {
        damageMover(m, BULLET_DAMAGE * effWeaponDmgMult("bullet"), dprojX[i], dprojY[i]);
        spawnHitParticles(dprojX[i], dprojY[i]);
        dprojHits[i]--;
        if (dprojHits[i] <= 0) dprojActive[i] = 0;
      } else {
        damageMover(m, MISSILE_DAMAGE * effWeaponDmgMult("missile"), dprojX[i], dprojY[i]);
        spawnCollisionParticles(dprojX[i], dprojY[i]);
        dprojActive[i] = 0;
      }
      hitMover = true;
      break;
    }
    if (hitMover && !dprojActive[i]) continue;

    // ---- 建物ヒット判定 ----
    buildingGridQuery(dprojX[i], dprojY[i], _dprojNeighbourBuf);
    for (const sIdx of _dprojNeighbourBuf) {
      const s = settlements[sIdx];
      if (!s || s.fallen) continue;
      // v0.6-p3: ミサイルは城壁を飛び越える（唯一の壁越し攻撃。仕様 §6.3）
      if (dprojKind[i] === 1 && s._isWall) continue;
      if (dprojKind[i] === 0 && sIdx === dprojLastHit[i]) continue; // 同じ建物への多段ヒット防止
      const hitR = s.radius + 3;
      const dx = s.wx - dprojX[i];
      const dy = s.wy - dprojY[i];
      if (dx * dx + dy * dy > hitR * hitR) continue;

      if (dprojKind[i] === 0) {
        // 弾丸: ダメージ＋貫通消費
        damageBuilding(sIdx, BULLET_DAMAGE * effWeaponDmgMult("bullet"));
        spawnHitParticles(dprojX[i], dprojY[i]);
        dprojLastHit[i] = sIdx;
        dprojHits[i]--;
        if (dprojHits[i] <= 0) { dprojActive[i] = 0; }
        break;
      } else {
        // ミサイル: 直撃＋爆発範囲ダメージ
        const dmg  = MISSILE_DAMAGE * effWeaponDmgMult("missile");
        const aoeR = MISSILE_AOE * effMissileAoeMult();
        damageBuilding(sIdx, dmg);
        // 爆心周辺の他建物に範囲ダメージ
        buildingGridQueryRadius(dprojX[i], dprojY[i], Math.max(1, Math.ceil(aoeR / BUILDING_GRID_CELL)), _dprojNeighbourBuf);
        for (const aIdx of _dprojNeighbourBuf) {
          if (aIdx === sIdx) continue;
          const a = settlements[aIdx];
          if (!a || a.fallen) continue;
          const adx = a.wx - dprojX[i];
          const ady = a.wy - dprojY[i];
          if (adx * adx + ady * ady < (aoeR + a.radius) * (aoeR + a.radius)) {
            damageBuilding(aIdx, dmg * MISSILE_AOE_FACTOR);
          }
        }
        spawnCollisionParticles(dprojX[i], dprojY[i]);
        hapticPulse(12);
        dprojActive[i] = 0;
        break;
      }
    }
  }
}

/** 自軍投射物の描画。カメラ変換内（ワールド座標系）で呼ぶこと。 */
function drawDragonProjectiles() {
  ctx.save();
  for (let i = 0; i < MAX_DPROJ; i++) {
    if (!dprojActive[i]) continue;

    // ビューポートカリング
    const sx = (dprojX[i] - cam.x) * cam.scale + viewW * 0.5;
    const sy = (dprojY[i] - cam.y) * cam.scale + viewH * 0.5;
    if (sx < -40 || sx > viewW + 40 || sy < -40 || sy > viewH + 40) continue;

    const speed = Math.sqrt(dprojVx[i] * dprojVx[i] + dprojVy[i] * dprojVy[i]) || 1;
    const nx = dprojVx[i] / speed;
    const ny = dprojVy[i] / speed;

    if (dprojKind[i] === 0) {
      // 弾丸: 氷色の細長い光条（進行方向に伸びる）
      const len = 9;
      ctx.strokeStyle = "rgba(160,232,255,0.95)";
      ctx.lineWidth   = 2.2;
      ctx.lineCap     = "round";
      ctx.beginPath();
      ctx.moveTo(dprojX[i] - nx * len, dprojY[i] - ny * len);
      ctx.lineTo(dprojX[i], dprojY[i]);
      ctx.stroke();
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(dprojX[i], dprojY[i], 1.6, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // ミサイル: 影紫の弾頭＋速度に応じて伸びる排気トレイル
      const trailLen = 6 + (speed / MISSILE_MAX_SPEED) * 16;
      ctx.strokeStyle = "rgba(192,128,255,0.55)";
      ctx.lineWidth   = 2.8;
      ctx.lineCap     = "round";
      ctx.beginPath();
      ctx.moveTo(dprojX[i] - nx * trailLen, dprojY[i] - ny * trailLen);
      ctx.lineTo(dprojX[i], dprojY[i]);
      ctx.stroke();
      ctx.fillStyle = "#c080ff";
      ctx.beginPath();
      ctx.arc(dprojX[i], dprojY[i], 3.0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.85)";
      ctx.beginPath();
      ctx.arc(dprojX[i], dprojY[i], 1.2, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();
}

/**
 * 武器攻撃のディスパッチャ。tick の playing 分岐から毎フレーム呼ぶ。
 * breathTime（羽ばたき・ジェム明滅などの共通アニメ時計）もここで進める。
 */
// -----------------------------------------------------------------
// v0.22: 母竜の署名ブレス。v0.31: 恒常ツリーでの解禁をやめ、
// **ラン中の★カード「母なる吐息」を引いた時点でそのランだけ発動**するようになった
// （＝毎ランの引き次第。恒常ツリーは引けた時の底上げに徹する）。
// 母竜(スロット0)が周期的に、周囲の建物/移動敵を最大 N 体まとめて薙ぐ特大バースト。
// 通常の群れブレス（母竜も1個体として撃つ）に上乗せされる"必殺"。
// 威力 = 基礎 × permaBuff.motherDmg（ツリー下限強化）× effMotherBreathDmg()（ラン中カード）。
// 間隔 = 基礎 × permaBuff.motherRate（ツリー下限強化）× effMotherBreathRate()（ラン中カード）。
// -----------------------------------------------------------------
const MOTHER_BREATH_INTERVAL = 7.0;   // 発動間隔（秒。v0.22.1: デフォルト頻度を半分に）
const MOTHER_BREATH_RANGE    = 220;   // 効果半径（通常ブレスより広い）
const MOTHER_BREATH_TARGETS  = 6;     // 同時に薙ぐ対象数
const MOTHER_BREATH_DAMAGE   = 60;    // 1発の基礎バーストダメージ
let motherBreathTimer = 0;
const _motherBreathBuf = [];

// v0.24.1: 母竜ブレスの残像FX。発射線をしばらく残し、ネオン虹色をゆっくりフェードアウトさせる。
const MBREATH_FX_LIFE = 0.7;   // フェードアウトにかける秒数
const MAX_MBREATH_FX  = 64;
const motherBreathFx  = [];    // {x0,y0,x1,y1,hue,born}
function pushMotherBreathFx(x0, y0, x1, y1, hue) {
  motherBreathFx.push({ x0, y0, x1, y1, hue, born: performance.now() });
  if (motherBreathFx.length > MAX_MBREATH_FX) {
    motherBreathFx.splice(0, motherBreathFx.length - MAX_MBREATH_FX);
  }
}

// v0.31: このランで母竜ブレスを解禁済みか（★カード「母なる吐息」の取得有無）
function isMotherBreathUnlocked() { return upCount("mbreath_unlock") > 0; }

// ラン中強化カード「母竜の吐息」による威力倍率（都度計算）
function effMotherBreathDmg()  { return 1 + 0.30 * upCount("mbreath_dmg"); }
// v0.28: 母竜ブレスの発動間隔倍率（<1で高頻度化）。ラン中カード「母竜の鼓動」で1枚ごとに短縮。
function effMotherBreathRate() { return Math.pow(0.82, upCount("mbreath_rate")); }

function updateMotherBreath(dt) {
  if (!isMotherBreathUnlocked() || !isMotherActive()) { motherBreathTimer = 0; return; }
  motherBreathTimer -= dt;
  if (motherBreathTimer > 0) return;
  // v0.28: ラン中強化で高頻度化／v0.30: ツリー「轟く吐息」の底上げも合流
  motherBreathTimer = MOTHER_BREATH_INTERVAL * permaBuff.motherRate * effMotherBreathRate();

  const mx = px[MOTHER_DRAGON_IDX], my = py[MOTHER_DRAGON_IDX];
  const R2  = MOTHER_BREATH_RANGE * MOTHER_BREATH_RANGE;
  const dmg = MOTHER_BREATH_DAMAGE * permaBuff.motherDmg * effMotherBreathDmg();
  const cellRadius = Math.max(1, Math.ceil(MOTHER_BREATH_RANGE / BUILDING_GRID_CELL));

  // 近傍の建物を距離順に最大 MOTHER_BREATH_TARGETS 件薙ぐ
  buildingGridQueryRadius(mx, my, cellRadius, _motherBreathBuf);
  const targets = [];
  for (const sIdx of _motherBreathBuf) {
    const s = settlements[sIdx];
    if (!s || s.fallen) continue;
    const dx = s.wx - mx, dy = s.wy - my;
    const d2 = dx * dx + dy * dy;
    if (d2 < R2) targets.push({ sIdx, d2 });
  }
  targets.sort((a, b) => a.d2 - b.d2);

  let hits = 0;
  for (const tg of targets) {
    if (hits >= MOTHER_BREATH_TARGETS) break;
    const s = settlements[tg.sIdx];
    if (s.fallen) continue;
    s.hp -= dmg;
    spawnHitParticles(s.wx, s.wy);
    pushMotherBreathFx(mx, my, s.wx, s.wy, (hits * 60) % 360);   // 虹色に色相をずらす
    if (s.hp <= 0 && !s.fallen) { settlementFall(tg.sIdx); buildingLayerDirty = true; }
    hits++;
  }
  // 建物が足りなければ移動敵も薙ぐ
  if (hits < MOTHER_BREATH_TARGETS) {
    for (const m of movers) {
      if (hits >= MOTHER_BREATH_TARGETS) break;
      if (!m.alive) continue;
      const mdx = m.wx - mx, mdy = m.wy - my;
      if (mdx * mdx + mdy * mdy >= R2) continue;
      damageMover(m, dmg, mx, my);
      pushMotherBreathFx(mx, my, m.wx, m.wy, (hits * 60) % 360);   // 虹色に色相をずらす
      hits++;
    }
  }
  if (hits > 0) { triggerFlash("rgba(255,180,60,0.22)", 0.14); hapticPulse(40); }
}

// =================================================================
// v0.35: Ⅱ群＋ガーゴイルの攻撃4種
// 既存部品（findNearestBuilding / damageBuilding / damageMover /
// spawnDragonProjectile / slashFxList / shockwaveFxList）を組み替えて作る。
// =================================================================

/** 近傍の建物と移動敵にまとめてダメージを入れる共通ヘルパー（範囲攻撃用）。 */
function damageInRadius(wx, wy, radius, damage) {
  let hits = 0;
  const cellRadius = Math.max(1, Math.ceil(radius / BUILDING_GRID_CELL));
  buildingGridQueryRadius(wx, wy, cellRadius, _buildingNeighbourBuf);
  const r2 = radius * radius;
  for (const sIdx of _buildingNeighbourBuf) {
    const s = settlements[sIdx];
    if (!s || s.fallen) continue;
    const dx = s.wx - wx, dy = s.wy - wy;
    if (dx * dx + dy * dy > r2) continue;
    damageBuilding(sIdx, damage);
    hits++;
  }
  for (const m of movers) {
    if (!m.alive) continue;
    const dx = m.wx - wx, dy = m.wy - wy;
    if (dx * dx + dy * dy > r2) continue;
    damageMover(m, damage, wx, wy);
    hits++;
  }
  return hits;
}

// ---- 刃翼（隼竜）: すれ違いざま、進行方向の前方を扇状に斬る ----
const BLADE_RANGE    = 62;    // 前方の届く距離
const BLADE_ARC      = 1.0;   // 扇の半角（rad。約57度）
const BLADE_DAMAGE   = 16;   // v0.35: 既存4種の掃討速度に合わせて調整（11では明確に低かった）
const BLADE_INTERVAL = 0.55;
function updateBladeAttacks(dt) {
  const range  = BLADE_RANGE * effWeaponRangeMult("blade");
  const dmg    = BLADE_DAMAGE * effWeaponDmgMult("blade");
  const inter  = BLADE_INTERVAL * effFireIntervalMult("blade");
  const cell   = Math.max(1, Math.ceil(range / BUILDING_GRID_CELL));
  const r2     = range * range;
  for (let i = 0; i < N; i++) {
    if (boidDead[i] || boidDowned[i] || boidKnockStun[i] > 0) continue;   // v0.59: 押されている間は攻撃しない
    boidFireTimer[i] -= dt;
    if (boidFireTimer[i] > 0) continue;

    const heading = Math.atan2(vy[i], vx[i]);
    let hit = false;
    // 前方の扇に入っている建物を斬る
    buildingGridQueryRadius(px[i], py[i], cell, _buildingNeighbourBuf);
    for (const sIdx of _buildingNeighbourBuf) {
      const s = settlements[sIdx];
      if (!s || s.fallen) continue;
      const dx = s.wx - px[i], dy = s.wy - py[i];
      if (dx * dx + dy * dy > r2) continue;
      let da = Math.atan2(dy, dx) - heading;
      while (da >  Math.PI) da -= Math.PI * 2;
      while (da < -Math.PI) da += Math.PI * 2;
      if (Math.abs(da) > BLADE_ARC) continue;
      damageBuilding(sIdx, dmg);
      hit = true;
    }
    for (const m of movers) {
      if (!m.alive) continue;
      const dx = m.wx - px[i], dy = m.wy - py[i];
      if (dx * dx + dy * dy > r2) continue;
      let da = Math.atan2(dy, dx) - heading;
      while (da >  Math.PI) da -= Math.PI * 2;
      while (da < -Math.PI) da += Math.PI * 2;
      if (Math.abs(da) > BLADE_ARC) continue;
      damageMover(m, dmg, px[i], py[i]);
      hit = true;
    }
    // 空振りでは撃たない（タイマーを進めず標的を待つ＝他武器と同じ作法）
    if (!hit) continue;
    boidFireTimer[i] = inter;
    // 銀の三日月（既存の斬閃FXを色指定で流用）
    pushSlashFx(px[i] + Math.cos(heading) * range * 0.5,
                py[i] + Math.sin(heading) * range * 0.5,
                heading, "#dce8ff");
  }
}

// ---- 羽根散弾（燕竜）: 前方3方向へ扇状に羽根を飛ばす ----
// 弾は既存の直進弾（dprojKind=0）を流用し、**3方向に散らす形**で見た目を差別化する。
const SCATTER_SPREAD  = 0.30;  // 隣の羽根までの角度（rad）
const SCATTER_COUNT   = 3;
const SCATTER_INTERVAL = 0.95;
function updateScatterAttacks(dt) {
  const range = BULLET_RANGE * effWeaponRangeMult("scatter");
  const inter = SCATTER_INTERVAL * effFireIntervalMult("scatter");
  const cell  = Math.max(1, Math.ceil(range / BUILDING_GRID_CELL));
  for (let i = 0; i < N; i++) {
    if (boidDead[i] || boidDowned[i] || boidKnockStun[i] > 0) continue;   // v0.59: 押されている間は攻撃しない
    boidFireTimer[i] -= dt;
    if (boidFireTimer[i] > 0) continue;

    const targetIdx = findNearestBuilding(px[i], py[i], range, cell, false);
    if (targetIdx < 0) continue;
    boidFireTimer[i] = inter;
    const t = settlements[targetIdx];
    const base = Math.atan2(t.wy - py[i], t.wx - px[i]);
    const half = (SCATTER_COUNT - 1) / 2;
    for (let k = 0; k < SCATTER_COUNT; k++) {
      spawnDragonProjectile(px[i], py[i], 0, base + (k - half) * SCATTER_SPREAD, targetIdx);
    }
    applyFireKick(i, base);
  }
}

// ---- 衛星蜂（蜂竜）: 各個体の周囲を小さな蜂が周回し、触れたものを削る ----
// 実体を持たせず「位置は時間から計算」する（プール管理なしで軽い）。
const SAT_COUNT      = 2;     // 1個体あたりの衛星数
const SAT_ORBIT_R    = 26;    // 周回半径
const SAT_ANGULAR    = 3.4;   // 角速度（rad/s）
const SAT_HIT_R      = 16;    // 接触判定半径（v0.35: 13では届かず掃討速度が半分だった）
const SAT_DPS        = 20;    // 触れている間の毎秒ダメージ（衛星1個あたり）
/** 個体 i の衛星 k のワールド座標（描画とダメージで同じ式を使う）。 */
function satellitePos(i, k, out) {
  const ang = breathTime * SAT_ANGULAR + (k / SAT_COUNT) * Math.PI * 2 + i * 0.7;
  out.x = px[i] + Math.cos(ang) * SAT_ORBIT_R;
  out.y = py[i] + Math.sin(ang) * SAT_ORBIT_R;
}
const _satPos = { x: 0, y: 0 };
function updateSatelliteAttacks(dt) {
  const dmg = SAT_DPS * effWeaponDmgMult("satellite") * dt;
  const hitR = SAT_HIT_R * effWeaponRangeMult("satellite");
  for (let i = 0; i < N; i++) {
    if (boidDead[i] || boidDowned[i] || boidKnockStun[i] > 0) continue;   // v0.59: 押されている間は攻撃しない
    for (let k = 0; k < SAT_COUNT; k++) {
      satellitePos(i, k, _satPos);
      damageInRadius(_satPos.x, _satPos.y, hitR, dmg);
    }
  }
}
/** 衛星蜂の描画。カメラ変換の内側で呼ぶ。 */
function drawSatellites() {
  if (flockWeapon !== "satellite") return;
  ctx.save();
  for (let i = 0; i < N; i++) {
    if (boidDead[i] || boidDowned[i]) continue;
    for (let k = 0; k < SAT_COUNT; k++) {
      satellitePos(i, k, _satPos);
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = "#ffd83a";
      ctx.beginPath();
      ctx.arc(_satPos.x, _satPos.y, 2.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = "#fff6c0";
      ctx.beginPath();
      ctx.arc(_satPos.x, _satPos.y, 5.0, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();
}

// ---- 落下叩きつけ（ガーゴイル）: 真下を石の衝撃で叩く ----
const DIVE_RADIUS   = 56;
const DIVE_DAMAGE   = 18;
const DIVE_INTERVAL = 1.5;
function updateDivebombAttacks(dt) {
  const radius = DIVE_RADIUS * effWeaponRangeMult("divebomb");
  const dmg    = DIVE_DAMAGE * effWeaponDmgMult("divebomb");
  const inter  = DIVE_INTERVAL * effFireIntervalMult("divebomb");
  for (let i = 0; i < N; i++) {
    if (boidDead[i] || boidDowned[i] || boidKnockStun[i] > 0) continue;   // v0.59: 押されている間は攻撃しない
    boidFireTimer[i] -= dt;
    if (boidFireTimer[i] > 0) continue;

    // 射程内に何か居るときだけ叩く（空振りしない）
    if (damageInRadius(px[i], py[i], radius, 0) === 0) continue;
    boidFireTimer[i] = inter;
    damageInRadius(px[i], py[i], radius, dmg);
    // 石色の衝撃リング＋硬直（fireStun 0.18）
    shockwaveFxList.push({ x: px[i], y: py[i], maxR: radius, life: SHOCKWAVE_FX_DURATION, color: "#b8c0c8" });
    spawnCollisionParticles(px[i], py[i]);
    applyFireKick(i, Math.atan2(vy[i], vx[i]));
  }
}

// ---- 絨毯爆撃（爆竜）: 今いる場所に爆弾を落とし、通り過ぎた後ろで炸裂する ----
// 「移動したあとに広範囲攻撃が発生する」＝投下と炸裂の間に竜が前へ抜けるのが要点。
// 竜が止まれない・曲がれない移動プロファイルと噛み合って「舐めるように爆撃する」操作になる。
const BOMB_FUSE     = 0.55;  // 投下から炸裂まで（秒）。竜は最高速175で約96px先へ抜ける
const BOMB_RADIUS    = 92;   // 炸裂半径（落下叩きつけ56より明確に広い）
const BOMB_DAMAGE    = 26;
const BOMB_INTERVAL  = 1.6;  // 1体あたりの投下間隔
const BOMB_MAX       = 160;  // 同時に空中にある爆弾の上限（群れ100体でも溢れない）
const bombList = [];         // { x, y, t } t=残りの導火時間

/** 投下（爆竜のときだけ呼ぶ）。 */
function updateBombDrops(dt) {
  const radius = BOMB_RADIUS * effWeaponRangeMult("bomb");
  const inter  = BOMB_INTERVAL * effFireIntervalMult("bomb");
  for (let i = 0; i < N; i++) {
    if (boidDead[i] || boidDowned[i] || boidKnockStun[i] > 0) continue;   // v0.59: 押されている間は攻撃しない
    boidFireTimer[i] -= dt;
    if (boidFireTimer[i] > 0) continue;
    // 炸裂したとき当たるものが今この場所にあるか（空振りでは落とさない＝他武器と同じ作法）
    if (damageInRadius(px[i], py[i], radius, 0) === 0) continue;
    boidFireTimer[i] = inter;
    if (bombList.length < BOMB_MAX) bombList.push({ x: px[i], y: py[i], t: BOMB_FUSE });
  }
}

/** 導火 → 炸裂。**竜種を切り替えても投下済みの爆弾は炸裂させきる**ので毎フレーム呼ぶ。 */
function updateBombFuses(dt) {
  if (bombList.length === 0) return;
  const radius = BOMB_RADIUS * effWeaponRangeMult("bomb");
  const dmg    = BOMB_DAMAGE * effWeaponDmgMult("bomb");
  for (let k = bombList.length - 1; k >= 0; k--) {
    const b = bombList[k];
    b.t -= dt;
    if (b.t > 0) continue;
    damageInRadius(b.x, b.y, radius, dmg);
    shockwaveFxList.push({ x: b.x, y: b.y, maxR: radius, life: SHOCKWAVE_FX_DURATION, color: "#ffb060" });
    spawnCollisionParticles(b.x, b.y);
    bombList.splice(k, 1);
  }
}

/** 投下済みで未炸裂の爆弾。導火が進むほど速く明滅する＝どこが吹き飛ぶかの予告。 */
function drawBombs() {
  if (bombList.length === 0) return;
  ctx.save();
  for (const b of bombList) {
    const prog  = 1 - Math.max(0, b.t) / BOMB_FUSE;     // 0=投下直後, 1=炸裂寸前
    const blink = 0.45 + 0.55 * Math.abs(Math.sin(prog * Math.PI * 6));
    // 予告円（炸裂半径まで縮んでいく＝範囲が読める）
    ctx.globalAlpha = 0.18 + 0.22 * prog;
    ctx.strokeStyle = "#ffb060";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(b.x, b.y, BOMB_RADIUS * (1.15 - 0.15 * prog), 0, Math.PI * 2);
    ctx.stroke();
    // 爆弾本体
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = "#3a3026";
    ctx.beginPath();
    ctx.arc(b.x, b.y, 4.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = blink;
    ctx.fillStyle = "#ffd070";
    ctx.beginPath();
    ctx.arc(b.x, b.y, 2.0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// ---- 舌撃（蛙竜）: 正面まっすぐだけに伸びる舌 ----
// 刃翼（扇・半角57度）と違い、**線（カプセル）判定**にして「まっすぐ前だけ」を厳密に出す。
// 射程は竜の体長（スプライト実測で約33論理px）の約2倍。
const TONGUE_RANGE    = 66;   // 届く距離 px
const TONGUE_HALF_W   = 7;    // 舌の太さの半分 px（当たり判定の膨らみ）
const TONGUE_DAMAGE   = 24;
const TONGUE_INTERVAL = 0.7;  // 跳躍周期（0.7）と同じ＝1回の跳躍につき1回伸ばす
const TONGUE_FX_LIFE  = 0.14;
const tongueFxList = [];      // { x, y, angle, t }

function updateTongueAttacks(dt) {
  const range = TONGUE_RANGE * effWeaponRangeMult("tongue");
  const dmg   = TONGUE_DAMAGE * effWeaponDmgMult("tongue");
  const inter = TONGUE_INTERVAL * effFireIntervalMult("tongue");
  const cell  = Math.max(1, Math.ceil(range / BUILDING_GRID_CELL));

  for (let k = tongueFxList.length - 1; k >= 0; k--) {
    tongueFxList[k].t -= dt;
    if (tongueFxList[k].t <= 0) tongueFxList.splice(k, 1);
  }

  for (let i = 0; i < N; i++) {
    if (boidDead[i] || boidDowned[i] || boidKnockStun[i] > 0) continue;   // v0.59: 押されている間は攻撃しない
    boidFireTimer[i] -= dt;
    if (boidFireTimer[i] > 0) continue;

    const heading = Math.atan2(vy[i], vx[i]);
    const hx = Math.cos(heading), hy = Math.sin(heading);
    let hit = false;

    // 前方の線分（太さ TONGUE_HALF_W）に触れているものだけ斬る
    buildingGridQueryRadius(px[i], py[i], cell, _buildingNeighbourBuf);
    for (const sIdx of _buildingNeighbourBuf) {
      const s = settlements[sIdx];
      if (!s || s.fallen) continue;
      const dx = s.wx - px[i], dy = s.wy - py[i];
      const along = dx * hx + dy * hy;                  // 前方への距離
      if (along < 0 || along > range) continue;
      const side = Math.abs(dx * -hy + dy * hx);        // 線からの横ずれ
      if (side > s.radius + TONGUE_HALF_W) continue;
      damageBuilding(sIdx, dmg);
      hit = true;
    }
    for (const m of movers) {
      if (!m.alive) continue;
      const dx = m.wx - px[i], dy = m.wy - py[i];
      const along = dx * hx + dy * hy;
      if (along < 0 || along > range) continue;
      const side = Math.abs(dx * -hy + dy * hx);
      if (side > (m.radius || 12) + TONGUE_HALF_W) continue;
      damageMover(m, dmg, px[i], py[i]);
      hit = true;
    }
    if (!hit) continue;   // 空振りでは伸ばさない
    boidFireTimer[i] = inter;
    tongueFxList.push({ x: px[i], y: py[i], angle: heading, t: TONGUE_FX_LIFE });
  }
}

/** 伸びた舌。付け根が太く先が細い1本の線。伸び切ってから素早く戻る。 */
function drawTongueFx() {
  if (tongueFxList.length === 0) return;
  ctx.save();
  ctx.lineCap = "round";
  for (const f of tongueFxList) {
    const prog = 1 - f.t / TONGUE_FX_LIFE;              // 0→1
    // 前半で伸びて後半で戻る
    const reach = TONGUE_RANGE * (prog < 0.4 ? prog / 0.4 : 1 - (prog - 0.4) / 0.6);
    const ex = f.x + Math.cos(f.angle) * reach;
    const ey = f.y + Math.sin(f.angle) * reach;
    ctx.globalAlpha = 0.85 * (1 - prog * 0.4);
    ctx.strokeStyle = "#ff7a9a";
    ctx.lineWidth = 3.4;
    ctx.beginPath();
    ctx.moveTo(f.x, f.y);
    ctx.lineTo(ex, ey);
    ctx.stroke();
    // 先端の光
    ctx.globalAlpha = 0.9 * (1 - prog);
    ctx.fillStyle = "#ffd0dc";
    ctx.beginPath();
    ctx.arc(ex, ey, 2.6, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function updateWeaponAttacks(dt) {
  if (gameState !== "playing") return;
  breathTime += dt;
  activeBreaths.length = 0;

  if (flockWeapon === "beam") {
    updateBeamAttacks(dt);
  } else if (flockWeapon === "bullet") {
    updateBulletAttacks(dt);
  } else if (flockWeapon === "missile") {
    updateMissileAttacks(dt);
  } else if (flockWeapon === "blade") {
    updateBladeAttacks(dt);
  } else if (flockWeapon === "scatter") {
    updateScatterAttacks(dt);
  } else if (flockWeapon === "satellite") {
    updateSatelliteAttacks(dt);
  } else if (flockWeapon === "divebomb") {
    updateDivebombAttacks(dt);
  } else if (flockWeapon === "bomb") {
    updateBombDrops(dt);
  } else if (flockWeapon === "tongue") {
    updateTongueAttacks(dt);
  }
  // melee は遠隔攻撃なし（強化された体当たり = updateCollisionAttacks が担う）

  updateBombFuses(dt);   // 投下済みの爆弾は竜種が変わっても炸裂させきる

  updateMotherBreath(dt);   // v0.22: 母竜の署名ブレス（v0.31: ラン中に「母なる吐息」を引いた時のみ）
  updateDragonProjectiles(dt);
}

// -----------------------------------------------------------------
// 変更2(追加): 竜やられエフェクト — HP0でダウンに入る瞬間に出す死亡FX
// 出現FX(金色)と明確に色を変え、灰/暗赤の飛散パーティクルで「やられた」を伝える。
// プール上限付き（MAX_PARTICLES 内で既存スロット流用）。多数同時でも破綻しない。
// -----------------------------------------------------------------

// 死亡FX: やられリングプール（出現FXプールとは別）
const MAX_DOWN_FX = 20;
const downFxWx     = new Float32Array(MAX_DOWN_FX);
const downFxWy     = new Float32Array(MAX_DOWN_FX);
const downFxLife   = new Float32Array(MAX_DOWN_FX);
const downFxActive = new Uint8Array(MAX_DOWN_FX);
const DOWN_FX_DURATION = 0.70; // やられリング表示時間（0.40では一瞬すぎて気づけなかった）
const DOWN_FX_SPOKES   = 7;    // 放射する光条の本数
// v0.61: やられFXを目立たせる（Shooter指示）。
// 旧: 0.40秒・半径40の**しぼむ暗いリング**＋灰の火花5〜7個＝画面の中で埋もれていた。
// 新: **白熱の爆発リングが外へ広がる**＋光条＋赤白の火花＝1体落ちたことが必ず目に入る。
// 出現FX（金色・弾ける）とは色で対になる（やられ＝白→赤）。
const DOWN_FX_RING_MAX = 62;   // 広がりきったときの半径

/**
 * 竜がダウンに入った瞬間に呼ぶ。
 * 灰/暗赤のパーティクル（partType=2）+ しぼむリングエフェクトをスポーンする。
 * 出現FX（金色・弾ける）と色と挙動を明確に差別化して「やられた」を伝える。
 */
function spawnDragonDownEffect(wx, wy) {
  // --- しぼむリング ---
  let slot = -1;
  for (let i = 0; i < MAX_DOWN_FX; i++) {
    if (!downFxActive[i]) { slot = i; break; }
  }
  // 空きがなければ残り寿命最小を上書き
  if (slot < 0) {
    let minLife = Infinity;
    for (let i = 0; i < MAX_DOWN_FX; i++) {
      if (downFxLife[i] < minLife) { minLife = downFxLife[i]; slot = i; }
    }
  }
  downFxActive[slot] = 1;
  downFxWx[slot]     = wx;
  downFxWy[slot]     = wy;
  downFxLife[slot]   = DOWN_FX_DURATION;

  // --- 飛散パーティクル（白熱→赤・14〜18個）---
  // v0.61: 5〜7個の灰では地味すぎたので、数・速さ・寿命をすべて上げて
  // 「弾け飛ぶ」読み味にした（出現FXの金14個と同格の存在感）
  const DEATH_SPARK_COUNT = 14 + Math.floor(fxRandom() * 5); // 14〜18個
  let spawned = 0;
  for (let i = 0; i < MAX_PARTICLES && spawned < DEATH_SPARK_COUNT; i++) {
    if (partActive[i]) continue;
    partActive[i] = 1;
    partType[i]   = 2; // 死亡FX（白熱→赤）
    partX[i] = wx + (fxRandom() - 0.5) * 10;
    partY[i] = wy + (fxRandom() - 0.5) * 10;
    const angle = fxRandom() * Math.PI * 2;
    // v0.61: 勢いよく散らす（旧 40〜120 → 110〜260）
    const speed = 110 + fxRandom() * 150;
    partVx[i]   = Math.cos(angle) * speed;
    partVy[i]   = Math.sin(angle) * speed;
    // v0.61: 寿命も伸ばす（旧 0.25〜0.40 → 0.40〜0.62）
    partLife[i] = 0.40 + fxRandom() * 0.22;
    spawned++;
  }

  // v0.61: 小さく揺らす。triggerShake は「進行中より強いときだけ上書き」なので、
  // 大量にやられても揺れが積み上がって画面が壊れることはない。
  triggerShake(2.2, 0.12);
  hapticPulse(35);
}

function updateDownEffects(dt) {
  for (let i = 0; i < MAX_DOWN_FX; i++) {
    if (!downFxActive[i]) continue;
    downFxLife[i] -= dt;
    if (downFxLife[i] <= 0) downFxActive[i] = 0;
  }
}

/**
 * やられリングを描画する。カメラ変換内（ワールド座標系）で呼ぶこと。
 * 出現FXとは逆に「しぼむ」ように内側に向かって半径が縮まる演出。
 * 色は暗赤〜灰系で「失った」感を出す。
 */
function drawDownEffects() {
  for (let i = 0; i < MAX_DOWN_FX; i++) {
    if (!downFxActive[i]) continue;
    const progress = 1.0 - downFxLife[i] / DOWN_FX_DURATION; // 0→1
    const wx = downFxWx[i];
    const wy = downFxWy[i];

    ctx.save();

    // --- (1) 白熱の爆発リング: 外へ広がりながら消える（v0.61の主役）---
    // 旧FXは「しぼむ暗いリング」で、群れの中で落ちると全く見えなかった。
    // 広がる明るい輪にすると、周りの竜より外側へ抜けるので必ず視界に入る。
    {
      const p = Math.min(1, progress / 0.75);            // 0.75 まで広がりきる
      const r = DOWN_FX_RING_MAX * (0.18 + p * 0.82);
      const a = Math.max(0, 1 - p * p);
      ctx.globalAlpha = a * 0.95;
      ctx.strokeStyle = "#fff2e8";
      ctx.lineWidth   = Math.max(0.6, 4.2 * (1 - p));
      ctx.beginPath();
      ctx.arc(wx, wy, Math.max(0.5, r), 0, Math.PI * 2);
      ctx.stroke();
      // 少し遅れる赤い輪（白の外側に残光を作る）
      ctx.globalAlpha = a * 0.65;
      ctx.strokeStyle = "#ff4020";
      ctx.lineWidth   = Math.max(0.5, 6.0 * (1 - p));
      ctx.beginPath();
      ctx.arc(wx, wy, Math.max(0.5, r * 0.82), 0, Math.PI * 2);
      ctx.stroke();
    }

    // --- (2) 放射する光条: 最初の 0.25 だけ。爆ぜた向きを作る ---
    if (progress < 0.25) {
      const p = progress / 0.25;
      const inner = DOWN_FX_RING_MAX * 0.20;
      const outer = DOWN_FX_RING_MAX * (0.55 + p * 0.75);
      ctx.globalAlpha = (1 - p) * 0.85;
      ctx.strokeStyle = "#ffd9c0";
      ctx.lineWidth   = 2.0;
      ctx.beginPath();
      for (let k = 0; k < DOWN_FX_SPOKES; k++) {
        const a = (k / DOWN_FX_SPOKES) * Math.PI * 2 + wx * 0.01;
        const c = Math.cos(a), sn = Math.sin(a);
        ctx.moveTo(wx + c * inner, wy + sn * inner);
        ctx.lineTo(wx + c * outer, wy + sn * outer);
      }
      ctx.stroke();
    }

    // --- (3) 中心の閃光: ごく短く、真っ白に飛ばす ---
    if (progress < 0.35) {
      const p = progress / 0.35;
      ctx.globalAlpha = (1 - p) * 0.9;
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(wx, wy, Math.max(0.5, 13 * (1 - p)), 0, Math.PI * 2);
      ctx.fill();
    }

    // --- (4) しぼむ暗い輪: 旧FXの「力が抜ける」読み味を残す ---
    if (progress > 0.15) {
      const p = (progress - 0.15) / 0.85;
      ctx.globalAlpha = Math.max(0, 1 - p) * 0.5;
      ctx.strokeStyle = "#802018";
      ctx.lineWidth   = Math.max(0.5, 2.0 * (1 - p));
      ctx.beginPath();
      ctx.arc(wx, wy, Math.max(0.5, DOWN_FX_RING_MAX * 0.5 * (1 - p * 0.7)), 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

// -----------------------------------------------------------------
// 変更2: 竜出現エフェクト — 卵回収で竜+1したときの弾けるエフェクト
// プール上限 12: 多数同時発生でも破綻しない軽量構造。
// リングは拡大しながらフェードアウト（0.4秒）、火花は短命パーティクルを流用。
// -----------------------------------------------------------------
const MAX_APPEAR_FX = 20;  // プール拡張: 多数同時出現（Katamari的に増える）に対応
const appearFxWx    = new Float32Array(MAX_APPEAR_FX);
const appearFxWy    = new Float32Array(MAX_APPEAR_FX);
const appearFxLife  = new Float32Array(MAX_APPEAR_FX);  // 残り寿命（秒）
const appearFxActive = new Uint8Array(MAX_APPEAR_FX);
const APPEAR_FX_DURATION = 0.62; // リングの表示時間（秒）: 0.42→0.62 で一瞬すぎず目立つ
const APPEAR_FX_RING_MAX = 76;   // リングの最大半径（論理px）: 38→76 で倍の広がり

/**
 * 指定ワールド座標に竜出現エフェクトをスポーンする。
 * プールが満杯のときは古いスロット（最も残り寿命が少ない）を上書き。
 */
function spawnDragonAppearEffect(wx, wy) {
  // 空きスロットを探す
  let slot = -1;
  for (let i = 0; i < MAX_APPEAR_FX; i++) {
    if (!appearFxActive[i]) { slot = i; break; }
  }
  // 空きがなければ残り寿命が最も少ないスロットを再利用
  if (slot < 0) {
    let minLife = Infinity;
    for (let i = 0; i < MAX_APPEAR_FX; i++) {
      if (appearFxLife[i] < minLife) { minLife = appearFxLife[i]; slot = i; }
    }
  }
  appearFxActive[slot] = 1;
  appearFxWx[slot]     = wx;
  appearFxWy[slot]     = wy;
  appearFxLife[slot]   = APPEAR_FX_DURATION;

  // 金〜白〜薄橙の火花パーティクル: partType=1 で描画時に金色系で描き分ける
  // 14個に増量、飛散半径・初速・サイズ大きめで「弾けるお祝い」感を出す
  const SPARK_COUNT = 14;
  let spawned = 0;
  for (let i = 0; i < MAX_PARTICLES && spawned < SPARK_COUNT; i++) {
    if (partActive[i]) continue;
    partActive[i] = 1;
    partType[i]   = 1; // 出現エフェクト火花（金〜白〜薄橙）
    partX[i] = wx + (fxRandom() - 0.5) * 14;
    partY[i] = wy + (fxRandom() - 0.5) * 14;
    const angle = fxRandom() * Math.PI * 2;
    // 内側の輝く粒子（遅め・大きめ）と外側に飛ぶ粒子（速め）を混在させる
    const speed = 80 + fxRandom() * 160;
    partVx[i]   = Math.cos(angle) * speed;
    partVy[i]   = Math.sin(angle) * speed;
    // 寿命: 0.45〜0.65秒（APPEAR_FX_DURATIONに近い長さで同期感）
    partLife[i] = 0.45 + fxRandom() * 0.20;
    spawned++;
  }

  // 軽い振動フィードバック（8ms: 気づける程度、連打でも不快にならない長さ）
  hapticPulse(8);
}

function updateAppearEffects(dt) {
  for (let i = 0; i < MAX_APPEAR_FX; i++) {
    if (!appearFxActive[i]) continue;
    appearFxLife[i] -= dt;
    if (appearFxLife[i] <= 0) appearFxActive[i] = 0;
  }
}

/**
 * 竜出現エフェクトを描画する。カメラ変換内（ワールド座標系）で呼ぶこと。
 * 3重リング＋中心閃光で「嬉しい瞬間」を派手に祝う。
 * リングはイーズアウトで減速しながら拡大し、progress二乗でフェードアウト。
 */
function drawAppearEffects() {
  for (let i = 0; i < MAX_APPEAR_FX; i++) {
    if (!appearFxActive[i]) continue;
    const progress = 1.0 - appearFxLife[i] / APPEAR_FX_DURATION; // 0→1
    // フェードアウト: 前半は不透明を保ち、後半で急速に消える（より存在感を出す）
    const alpha    = Math.max(0, 1.0 - progress * progress * progress);
    const wx       = appearFxWx[i];
    const wy       = appearFxWy[i];

    ctx.save();

    // ---- 中心閃光: 最初の20%だけ表示する小さな白い光球 ----
    if (progress < 0.20) {
      const flashP = progress / 0.20; // 0→1（最初の20%区間内）
      // 始まりに強く光り、すぐ消える（エネルギーが放出される感じ）
      const flashAlpha = Math.max(0, 1.0 - flashP * flashP) * 0.90;
      const flashR     = 10 + flashP * 6; // 10→16px
      ctx.globalAlpha  = flashAlpha;
      const grd = ctx.createRadialGradient(wx, wy, 0, wx, wy, flashR);
      grd.addColorStop(0, "#ffffff");
      grd.addColorStop(0.4, "#fff8c0");
      grd.addColorStop(1.0, "rgba(255,220,80,0)");
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.arc(wx, wy, flashR, 0, Math.PI * 2);
      ctx.fill();
    }

    // ---- 外側リング（金）: 最大半径まで広がるメインリング ----
    const outerRadius = APPEAR_FX_RING_MAX * progress;
    ctx.globalAlpha   = alpha * 0.90;
    ctx.strokeStyle   = "#ffe060";
    ctx.lineWidth     = Math.max(0.5, 3.5 * (1 - progress));
    ctx.beginPath();
    ctx.arc(wx, wy, Math.max(0.5, outerRadius), 0, Math.PI * 2);
    ctx.stroke();

    // ---- 中間リング（白）: 外側の75%の位置に追随 ----
    const midRadius   = APPEAR_FX_RING_MAX * 0.75 * progress;
    ctx.globalAlpha   = alpha * 0.65;
    ctx.strokeStyle   = "#ffffff";
    ctx.lineWidth     = Math.max(0.5, 2.0 * (1 - progress));
    ctx.beginPath();
    ctx.arc(wx, wy, Math.max(0.5, midRadius), 0, Math.PI * 2);
    ctx.stroke();

    // ---- 内側リング（薄橙）: 外側の45%の位置、やや遅れて展開する感じ ----
    // progress が 0.1 を過ぎてから表示（展開の「タメ」を演出）
    if (progress > 0.08) {
      const innerProgress = Math.min(1.0, (progress - 0.08) / 0.92);
      const innerRadius   = APPEAR_FX_RING_MAX * 0.45 * innerProgress;
      ctx.globalAlpha     = alpha * 0.50;
      ctx.strokeStyle     = "#ffb040";
      ctx.lineWidth       = Math.max(0.5, 1.5 * (1 - innerProgress));
      ctx.beginPath();
      ctx.arc(wx, wy, Math.max(0.5, innerRadius), 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.restore();
  }
}

let flashTimer = 0;
let flashColor = "";

function triggerFlash(color, duration) {
  flashTimer = duration ?? 0.1;
  flashColor = color;
}

// -----------------------------------------------------------------
// v0.8: 画面シェイク（緋竜の体当たり・ボスノヴァなどの衝撃演出）
// render 冒頭でスクリーン座標に微小オフセットを加える。
// -----------------------------------------------------------------
let shakeTimer = 0;
let shakeDuration = 0;
let shakeAmplitude = 0;

function triggerShake(amplitude, duration) {
  // 進行中のシェイクより強いときだけ上書き（弱い揺れで強い揺れを消さない）
  if (shakeTimer > 0 && amplitude < shakeAmplitude) return;
  shakeAmplitude = amplitude;
  shakeDuration = duration;
  shakeTimer = duration;
}

// -----------------------------------------------------------------
// v0.8: 緋竜の斬撃インパクトFX（体当たり命中時の深紅の斬閃）
// -----------------------------------------------------------------
const MAX_SLASH_FX = 24;
const slashFxList = [];

/**
 * 斬閃FXを1つ積む。color を省略すると緋竜の深紅になる。
 * v0.35: 隼竜「刃翼」が銀色で流用するため色を引数化した。
 */
function pushSlashFx(wx, wy, angle, color) {
  if (slashFxList.length >= MAX_SLASH_FX) slashFxList.shift();
  slashFxList.push({ x: wx, y: wy, angle, life: SLASH_FX_DURATION, color });
}
const SLASH_FX_DURATION = 0.22;

function spawnMeleeImpactFx(wx, wy, angle) {
  pushSlashFx(wx, wy, angle);

  // 深紅の火花（partType=3）を撒く
  const count = 8 + Math.floor(fxRandom() * 5);
  let spawned = 0;
  for (let i = 0; i < MAX_PARTICLES && spawned < count; i++) {
    if (partActive[i]) continue;
    partActive[i] = 1;
    partType[i]   = 3;
    partX[i] = wx + (fxRandom() - 0.5) * 10;
    partY[i] = wy + (fxRandom() - 0.5) * 10;
    // 斬撃方向を中心に扇状へ飛ぶ
    const sparkAngle = angle + (fxRandom() - 0.5) * 1.8;
    const speed = 120 + fxRandom() * 200;
    partVx[i]   = Math.cos(sparkAngle) * speed;
    partVy[i]   = Math.sin(sparkAngle) * speed;
    partLife[i] = 0.22 + fxRandom() * 0.18;
    spawned++;
  }
}

function updateSlashFx(dt) {
  for (let i = slashFxList.length - 1; i >= 0; i--) {
    slashFxList[i].life -= dt;
    if (slashFxList[i].life <= 0) slashFxList.splice(i, 1);
  }
}

/** 斬閃を描画する。カメラ変換内（ワールド座標系）で呼ぶこと。 */
function drawSlashFx() {
  for (const fx of slashFxList) {
    const progress = 1 - fx.life / SLASH_FX_DURATION;
    const alpha = Math.max(0, 1 - progress * progress);
    const len = 16 + progress * 22;   // 斬閃が伸びる
    ctx.save();
    ctx.translate(fx.x, fx.y);
    ctx.rotate(fx.angle + Math.PI / 4); // 進行方向に対して斜めの斬り筋
    ctx.lineCap = "round";
    // 外側の色（v0.35: 竜種ごとに変えられるよう fx.color。既定は緋竜の深紅）
    ctx.globalAlpha = alpha * 0.85;
    ctx.strokeStyle = fx.color ?? "#ff3020";
    ctx.lineWidth = 4 * (1 - progress * 0.6);
    ctx.beginPath();
    ctx.moveTo(-len, 0);
    ctx.lineTo(len, 0);
    ctx.stroke();
    // 内側の白いコア
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = "rgba(255,240,230,0.95)";
    ctx.lineWidth = 1.6 * (1 - progress * 0.5);
    ctx.beginPath();
    ctx.moveTo(-len * 0.8, 0);
    ctx.lineTo(len * 0.8, 0);
    ctx.stroke();
    ctx.restore();
  }
  ctx.globalAlpha = 1.0;
}

// -----------------------------------------------------------------
// v0.19: 永続化基盤（メタ進行）
// localStorage を「ベスト2キー」から2つの JSON blob に再編：
//   dragonTide_profile … 永続メタ（竜晶・チャレンジ・ツリー・ベスト・累計）
//   dragonTide_run     … 進行中ランの再開チェックポイント（ステージ開始位置）
// 旧 dragonTide_bestTimeMs / _bestKills は初回読込で profile.best へ移行する。
// -----------------------------------------------------------------
const BEST_TIME_KEY  = "dragonTide_bestTimeMs";   // 旧キー（移行元としてのみ参照）
const BEST_KILLS_KEY = "dragonTide_bestKills";    // 旧キー（移行元としてのみ参照）
const PROFILE_KEY     = "dragonTide_profile";
const RUN_SAVE_KEY    = "dragonTide_run";
const PROFILE_VERSION = 1;
const RUN_SAVE_VERSION = 1;

function defaultProfile() {
  return {
    version: PROFILE_VERSION,
    runsStarted: 0,   // 開始したランの累計（初回=火竜即開始 かの判定に使う）
    clears: 0,        // 全クリア回数
    crystals: 0,      // メタ通貨「竜晶」残高
    challenges: {},   // id -> { done }（v0.25 チャレンジ達成記録）
    tree: {},         // nodeId -> { unlocked, enabled }
    best: { timeMs: 0, kills: 0 },
    // v0.25: チャレンジ用の累計カウンタ
    eliteKills: 0,        // エリート敵の累計撃破数
    fireworksDestroyed: 0, // 花火要塞の累計破壊数
    // v0.55: 解放済みの大陸（開始時代）の数。1 = 大陸I のみ。クリアで1つ増える。
    unlockedContinents: 1,
  };
}

// 旧ベスト2キーを profile.best へ吸収（存在すれば）。破壊はせず読むだけ。
function migrateLegacyBest(p) {
  try {
    const t = Number(localStorage.getItem(BEST_TIME_KEY)) || 0;
    const k = Number(localStorage.getItem(BEST_KILLS_KEY)) || 0;
    if (t > 0 && (!p.best.timeMs || t < p.best.timeMs)) p.best.timeMs = t;
    if (k > p.best.kills) p.best.kills = k;
  } catch (_) {}
  return p;
}

function loadProfile() {
  let p = null;
  try {
    const raw = localStorage.getItem(PROFILE_KEY);
    p = raw ? JSON.parse(raw) : null;
  } catch (_) { p = null; }
  if (!p || typeof p !== "object") {
    // 初回起動 or 破損 → 既定＋旧ベスト移行
    p = migrateLegacyBest(defaultProfile());
  } else {
    // 欠損フィールドを既定で補完（前方互換）
    p = Object.assign(defaultProfile(), p);
    p.best = Object.assign({ timeMs: 0, kills: 0 }, p.best || {});
    p.challenges = p.challenges || {};
    p.tree = p.tree || {};
  }
  p.version = PROFILE_VERSION;
  return p;
}

// 起動時に確定する単一のプロファイル。以降 saveProfile() で都度永続化。
let profile = loadProfile();

function saveProfile() {
  try { localStorage.setItem(PROFILE_KEY, JSON.stringify(profile)); } catch (_) {}
}

// 今から始める（or 進行中の）ランが「一番最初のラン」かどうか。
// startRun 時点で runsStarted を増やす前の値で判定し currentRunIsFirst に固定する。
function isFirstEverRun() {
  return !profile || profile.runsStarted <= 0;
}

// ---- ラン再開チェックポイント（枠のみ。書き込み/再開の結線は Phase 1）----
function loadRunSave() {
  try {
    const raw = localStorage.getItem(RUN_SAVE_KEY);
    const r = raw ? JSON.parse(raw) : null;
    if (!r || r.version !== RUN_SAVE_VERSION) return null;
    return r;
  } catch (_) { return null; }
}

function saveRunSave(data) {
  try {
    localStorage.setItem(RUN_SAVE_KEY, JSON.stringify(Object.assign({ version: RUN_SAVE_VERSION }, data)));
  } catch (_) {}
}

function clearRunSave() {
  try { localStorage.removeItem(RUN_SAVE_KEY); } catch (_) {}
}

// ---- ベスト記録（profile.best を単一の真実として読み書き）----
function loadBestRecord() {
  return { timeMs: profile.best.timeMs || 0, kills: profile.best.kills || 0 };
}

function saveBestRecord(timeMs, kills) {
  if (!profile.best.timeMs || timeMs < profile.best.timeMs) profile.best.timeMs = Math.round(timeMs);
  if (kills > profile.best.kills) profile.best.kills = kills;
  saveProfile();
}

function formatRunTime(ms) {
  const totalSec = Math.floor(ms / 1000);
  return Math.floor(totalSec / 60) + ":" + String(totalSec % 60).padStart(2, "0");
}

function refreshTitleBest() {
  const best = loadBestRecord();
  titleBestEl.textContent = best.timeMs > 0
    ? STRINGS.bestLine(formatRunTime(best.timeMs), best.kills)
    : STRINGS.noRecord;
}

// v0.20: 恒常強化ツリー（メタ進行）
// 竜晶（crystals）で購入し、各ノードは個別に ON/OFF できる（縛り/実験用）。
// 効果は permaBuff に集計され、eff*／stageStartFlockCount へ合流する。
// =================================================================

// ---- 竜晶の獲得 ----
// ステージをクリアするたびに付与（進むほど増える）。全クリアで追加ボーナス。
const CRYSTAL_STAGE_BASE     = 6;    // ステージクリア1回の基本量
const CRYSTAL_STAGE_STEP     = 3;    // ステージ番号が進むほどの増分（stageIdx × step）
const CRYSTAL_ALLCLEAR_BONUS = 40;   // 全クリアの追加ボーナス

// stageIdx（0始まり）を1つクリアしたときの基本獲得量。
function crystalsForStageClear(stageIdx) {
  return CRYSTAL_STAGE_BASE + CRYSTAL_STAGE_STEP * stageIdx;
}

// 竜晶を付与（恒常ツリーの獲得倍率 permaBuff.crystalGain を掛ける）。付与量を返す。
function awardCrystals(n) {
  const gain = Math.max(0, Math.round(n * permaBuff.crystalGain));
  if (gain <= 0) return 0;
  profile.crystals += gain;
  saveProfile();
  return gain;
}

const TREE_CATEGORIES = [
  { id: "mother",  label: "母竜" },
  { id: "swarm",   label: "大群" },

  { id: "command", label: "統率" },

];

// ノードの状態: "owned"（購入済み）/ "available"（購入可）/ "locked"（前提未達）
function treeNodeState(id) {
  const st = profile.tree[id];
  if (st && st.unlocked) return "owned";
  const node = TREE_DEFS.find(n => n.id === id);
  const ok = node.prereq.every(p => profile.tree[p] && profile.tree[p].unlocked);
  return ok ? "available" : "locked";
}

// enabled かつ unlocked なノードの効果を集計して permaBuff を作り直す。
function recomputePermaBuff() {
  const b = defaultPermaBuff();
  for (const node of TREE_DEFS) {
    const st = profile.tree[node.id];
    if (!st || !st.unlocked || !st.enabled) continue;
    const e = node.effect;
    if (e.type === "startFlock" || e.type === "flockCap") b[e.type] += e.value;
    else b[e.type] *= e.value;
  }
  permaBuff = b;
}

function purchaseTreeNode(node) {
  if (treeNodeState(node.id) !== "available") return;
  if (profile.crystals < node.cost) return;
  profile.crystals -= node.cost;
  profile.tree[node.id] = { unlocked: true, enabled: true };
  recomputePermaBuff();
  saveProfile();
  renderTree();
}

function toggleTreeNode(node) {
  const st = profile.tree[node.id];
  if (!st || !st.unlocked) return;
  st.enabled = !st.enabled;
  recomputePermaBuff();
  saveProfile();
  renderTree();
}

// ---- ツリー画面（タイトルから開く全画面オーバーレイ）----
const treeOverlayEl = document.getElementById("tree-overlay");

function openTree() {
  renderTree();
  treeOverlayEl.classList.add("visible");
}

function closeTree() {
  treeOverlayEl.classList.remove("visible");
  refreshTitleMenu();   // 竜晶残高のボタン表示を更新
}

function renderTree() {
  let html =
    `<div class="tree-head">` +
      `<div class="tree-title">恒常強化ツリー</div>` +
      `<div class="tree-crystals">🔷 ${profile.crystals}</div>` +
      `<button class="tree-close">✕</button>` +
    `</div>` +
    `<div class="tree-hint">タップで購入／購入済みはタップで ON・OFF 切替</div>` +
    `<div class="tree-cols">`;
  for (const cat of TREE_CATEGORIES) {
    html += `<div class="tree-col"><div class="tree-col-label">${cat.label}</div>`;
    for (const node of TREE_DEFS.filter(n => n.cat === cat.id)) {
      const state = treeNodeState(node.id);
      const st = profile.tree[node.id];
      const on = !!(st && st.enabled);
      const cls = ["tree-node", "st-" + state];
      if (state === "owned") cls.push(on ? "on" : "off");
      const badge = state === "owned" ? (on ? "ON" : "OFF")
                  : state === "available" ? `🔷${node.cost}`
                  : "🔒";
      const req = node.prereq.length
        ? `<div class="tn-req">要: ${node.prereq.map(p => TREE_DEFS.find(n => n.id === p).name).join("・")}</div>`
        : "";
      html +=
        `<button class="${cls.join(" ")}" data-id="${node.id}">` +
          `<div class="tn-badge">${badge}</div>` +
          `<div class="tn-name">${node.name}</div>` +
          `<div class="tn-desc">${node.desc}</div>` +
          req +
        `</button>`;
    }
    html += `</div>`;
  }
  html += `</div>`;
  treeOverlayEl.innerHTML = html;

  treeOverlayEl.querySelector(".tree-close").addEventListener("pointerdown", (e) => {
    e.stopPropagation();
    closeTree();
  });
  treeOverlayEl.querySelectorAll(".tree-node").forEach((btn) => {
    btn.addEventListener("pointerdown", (e) => {
      e.stopPropagation();
      const node = TREE_DEFS.find(n => n.id === btn.dataset.id);
      const state = treeNodeState(node.id);
      if (state === "owned") toggleTreeNode(node);
      else if (state === "available") purchaseTreeNode(node);
      // locked は何もしない
    });
  });
}
