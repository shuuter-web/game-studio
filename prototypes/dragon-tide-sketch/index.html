<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>竜潮 / Dragon Tide — 手描き風バージョン</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #08101a;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #stage { display: block; width: 100%; height: 100%; }

  /* 右上 HUD: FPS */
  #hud {
    position: fixed;
    top: env(safe-area-inset-top, 8px);
    right: 8px;
    padding: 5px 8px;
    background: rgba(8, 16, 26, 0.70);
    border: 1px solid rgba(120, 200, 255, 0.20);
    border-radius: 6px;
    font-family: -apple-system, BlinkMacSystemFont, monospace;
    font-size: 11px;
    line-height: 1.6;
    color: #fff;
    pointer-events: none;
    min-width: 70px;
    text-align: right;
  }
  #hud .k { color: #6fa6c8; margin-right: 4px; }

  /* 左上 HUD: FLOCK残数 */
  #hud-left {
    position: fixed;
    top: env(safe-area-inset-top, 8px);
    left: 8px;
    padding: 5px 8px;
    background: rgba(8, 16, 26, 0.70);
    border: 1px solid rgba(120, 200, 255, 0.20);
    border-radius: 6px;
    font-family: -apple-system, BlinkMacSystemFont, monospace;
    font-size: 13px;
    line-height: 1.6;
    color: #fff;
    pointer-events: none;
  }
  #hud-left .label { color: #6fa6c8; font-size: 10px; }

  /* 右下 HUD: 卵カウント + ステージ */
  #hud-eggs {
    position: fixed;
    bottom: calc(20vh + env(safe-area-inset-bottom, 0px) + 8px);
    right: 8px;
    padding: 5px 10px;
    background: rgba(8, 16, 26, 0.70);
    border: 1px solid rgba(255, 200, 40, 0.30);
    border-radius: 6px;
    font-family: -apple-system, BlinkMacSystemFont, monospace;
    font-size: 13px;
    color: #ffd040;
    pointer-events: none;
    line-height: 1.7;
  }

  /* 左下 HUD: ミニマップ */
  #minimap-container {
    position: fixed;
    bottom: calc(20vh + env(safe-area-inset-bottom, 0px) + 8px);
    left: 8px;
    background: rgba(8, 16, 26, 0.80);
    border: 1px solid rgba(120, 200, 255, 0.25);
    border-radius: 4px;
    pointer-events: none;
    overflow: hidden;
  }
  #minimap { display: block; }

  /* 残建物カウント（ミニマップの上） */
  #hud-buildings {
    position: fixed;
    /* ミニマップ（120×90）の上に置く。高さを変えたらここも合わせること */
    bottom: calc(20vh + env(safe-area-inset-bottom, 0px) + 8px + 90px + 4px);
    left: 8px;
    padding: 3px 8px;
    background: rgba(8, 16, 26, 0.70);
    border: 1px solid rgba(255, 180, 60, 0.25);
    border-radius: 4px;
    font-family: -apple-system, BlinkMacSystemFont, monospace;
    font-size: 11px;
    color: #ffb840;
    pointer-events: none;
  }

  /* リトライ / クリアオーバーレイ */
  #overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 20px;
    pointer-events: none;
  }
  #overlay.visible { display: flex; pointer-events: auto; }
  #overlay-title {
    font-family: -apple-system, BlinkMacSystemFont, monospace;
    font-size: 28px;
    color: #fff;
    text-shadow: 0 0 20px rgba(255,200,80,0.8);
    letter-spacing: 0.08em;
    opacity: 0;
    transition: opacity 0.8s;
  }
  #overlay-title.show { opacity: 1; }
  #retry-btn {
    padding: 14px 40px;
    background: rgba(180, 40, 40, 0.85);
    border: 2px solid rgba(255, 100, 100, 0.60);
    border-radius: 30px;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, monospace;
    font-size: 16px;
    cursor: pointer;
    display: none;
    pointer-events: auto;
    letter-spacing: 0.1em;
  }
  #retry-btn.visible { display: block; }

  /* バージョン表示（左下・スクリーン固定） */
  #hud-version {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 4px);
    left: 8px;
    font-family: -apple-system, BlinkMacSystemFont, monospace;
    font-size: 10px;
    color: rgba(120, 180, 255, 0.45);
    /* v0.16.1: デバッグ用に3連タップを受ける（ステージ送り）。タップ域も少し広げる */
    pointer-events: auto;
    padding: 10px 14px 6px 6px;
    letter-spacing: 0.05em;
  }

  /* ステージ間演出オーバーレイ */
  #stage-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
  }
  #stage-overlay.visible { opacity: 1; }
  #stage-text {
    font-family: -apple-system, BlinkMacSystemFont, monospace;
    font-size: 42px;
    color: #fff;
    text-shadow: 0 0 30px rgba(255,200,80,0.9), 0 0 60px rgba(255,120,40,0.5);
    letter-spacing: 0.12em;
    text-align: center;
  }
  #stage-sub {
    font-family: -apple-system, BlinkMacSystemFont, monospace;
    font-size: 18px;
    color: #ffd080;
    margin-top: 12px;
    letter-spacing: 0.2em;
    text-align: center;
  }

  /* v0.6: XPバー（画面最上部の極細バー） */
  #xp-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: rgba(255,255,255,0.10);
    z-index: 30;
    pointer-events: none;
  }
  #xp-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #40c8ff, #a0ecff);
    box-shadow: 0 0 6px rgba(100,220,255,0.8);
    transition: width 0.15s ease-out;
  }
  #xp-fill.near-full { animation: xpPulse 0.5s infinite alternate; }
  @keyframes xpPulse { from { filter: brightness(1.0); } to { filter: brightness(1.7); } }

  /* v0.6.1: レベルアップ3択カード（非モーダル・画面下部）
     時間停止をやめてスローモー0.25倍速に変更。オーバーレイは下部だけを覆い、
     pointer-events:none で背後のcanvasへ線描画を通す（カード本体のみ操作可）。 */
  #levelup-overlay {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    padding-bottom: 16px;
    background: linear-gradient(to top, rgba(0,0,10,0.72) 60%, rgba(0,0,10,0));
    z-index: 40;
    pointer-events: none;
  }
  #levelup-overlay.visible { display: flex; }
  #levelup-title {
    font-family: -apple-system, BlinkMacSystemFont, monospace;
    font-size: 15px;
    color: #a0ecff;
    letter-spacing: 0.18em;
    text-shadow: 0 0 14px rgba(100,220,255,0.9);
    margin: 10px 0 8px;
  }
  #card-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: min(86vw, 340px);
  }
  .upgrade-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 14px;
    min-height: 52px;
    background: rgba(10, 16, 30, 0.92);
    border: 2px solid #5a7a9a;
    border-radius: 12px;
    color: #e8f4ff;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    text-align: left;
    cursor: pointer;
    pointer-events: auto;
    -webkit-tap-highlight-color: transparent;
  }
  .upgrade-card:active { transform: scale(0.97); }
  .upgrade-card.rarity-rare { border-color: #ffd060; box-shadow: 0 0 14px rgba(255,208,96,0.35); }
  .upgrade-card.rarity-star { border-color: #ff70d0; box-shadow: 0 0 18px rgba(255,112,208,0.45); }
  /* v0.55: 未解放の大陸。押せないことが見て分かればよいので彩度と輝度だけ落とす */
  .upgrade-card.card-locked {
    border-color: #3a4a5a;
    color: #7a8a9a;
    opacity: 0.55;
    cursor: default;
    box-shadow: none;
  }
  .upgrade-card.card-locked:active { transform: none; }
  .upgrade-card .card-icon { font-size: 24px; flex-shrink: 0; }
  .upgrade-card .card-name { font-size: 15px; font-weight: bold; letter-spacing: 0.08em; }
  .upgrade-card .card-desc { font-size: 11px; color: #a8c4e0; margin-top: 2px; }

  /* v0.37: 竜種選択だけ2列グリッド。11種を1列で出すと縦776pxになり小さい端末で
     上のカードが画面外へ出て押せなくなる。スクロールにしないのは、カードが
     pointerdown で即選択される作りなので、スクロールのドラッグと衝突するため。 */
  #card-list.species-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    width: min(94vw, 400px);
  }
  #card-list.species-grid .upgrade-card { padding: 7px 9px; gap: 7px; min-height: 46px; }
  #card-list.species-grid .card-icon { font-size: 19px; }
  #card-list.species-grid .card-name { font-size: 13px; letter-spacing: 0.04em; }
  #card-list.species-grid .card-desc { font-size: 10px; line-height: 1.25; }
  #card-list.species-grid .card-span-2 { grid-column: 1 / -1; }

  /* v0.6: タイトル画面 */
  #title-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 8, 0.35);
    z-index: 50;
  }
  #title-overlay.visible { display: flex; }
  #title-logo {
    font-family: -apple-system, BlinkMacSystemFont, serif;
    font-size: 64px;
    font-weight: bold;
    color: #fff;
    letter-spacing: 0.15em;
    text-shadow: 0 0 40px rgba(255,140,40,0.9), 0 0 80px rgba(255,80,20,0.5);
  }
  #title-sub {
    font-family: monospace;
    font-size: 16px;
    color: #ffb060;
    letter-spacing: 0.5em;
    text-align: center;
    margin-top: 6px;
  }
  #title-best {
    font-family: monospace;
    font-size: 13px;
    color: #a0c0e0;
    margin-top: 30px;
    text-align: center;
    line-height: 1.7;
  }
  #title-hint {
    font-family: monospace;
    font-size: 15px;
    color: #fff;
    letter-spacing: 0.25em;
    margin-top: 34px;
    animation: hintBlink 1.4s infinite;
  }
  @keyframes hintBlink { 0%,100% { opacity: 1.0; } 50% { opacity: 0.25; } }

  /* v0.19: タイトルメニュー（2回目以降のラン。はじめる／つづきから） */
  #title-menu {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    margin-top: 34px;
  }
  .title-btn {
    font-family: monospace;
    font-size: 17px;
    color: #fff;
    letter-spacing: 0.12em;
    padding: 13px 40px;
    min-width: 240px;
    border: 1px solid rgba(255,176,96,0.5);
    border-radius: 10px;
    background: rgba(20,12,4,0.55);
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .title-btn:hover { background: rgba(60,36,12,0.7); border-color: rgba(255,176,96,0.9); }
  .title-btn:active { transform: translateY(1px); }
  .title-btn-primary {
    color: #ffe0b0;
    border-color: rgba(255,176,96,0.95);
    background: rgba(80,44,12,0.7);
    box-shadow: 0 0 24px rgba(255,140,40,0.35);
  }

  /* v0.20: 恒常強化ツリー画面 */
  #tree-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    display: none;
    flex-direction: column;
    padding: 16px 14px 24px;
    background: rgba(4,6,14,0.96);
    z-index: 55;
    pointer-events: auto;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  #tree-overlay.visible { display: flex; }
  #tree-overlay .tree-head {
    display: flex; align-items: center; gap: 12px; margin-bottom: 4px;
  }
  #tree-overlay .tree-title {
    font-family: -apple-system, BlinkMacSystemFont, serif;
    font-size: 20px; font-weight: bold; color: #ffe0b0; letter-spacing: 0.12em;
    text-shadow: 0 0 20px rgba(255,140,40,0.6);
  }
  #tree-overlay .tree-crystals {
    font-family: monospace; font-size: 16px; color: #8cd8ff; margin-left: auto;
    text-shadow: 0 0 12px rgba(100,200,255,0.7);
  }
  #tree-overlay .tree-close {
    font-size: 20px; color: #ff8888; background: none; border: none;
    cursor: pointer; padding: 0 6px;
  }
  #tree-overlay .tree-hint {
    font-family: monospace; font-size: 11px; color: #8aa; margin-bottom: 14px;
  }
  #tree-overlay .tree-cols {
    display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start;
  }
  #tree-overlay .tree-col {
    flex: 1 1 200px; min-width: 160px;
    display: flex; flex-direction: column; gap: 8px;
  }
  #tree-overlay .tree-col-label {
    font-family: monospace; font-size: 12px; color: #ffd070; letter-spacing: 0.2em;
    border-bottom: 1px solid #4a5a3a; padding-bottom: 4px; margin-bottom: 2px;
  }
  #tree-overlay .tree-node {
    position: relative; text-align: left;
    padding: 9px 12px 9px 46px;
    background: rgba(16,22,36,0.92); border: 1px solid #3a4a66; border-radius: 10px;
    color: #dce8f6; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  #tree-overlay .tree-node:active { transform: scale(0.98); }
  #tree-overlay .tree-node .tn-badge {
    position: absolute; left: 8px; top: 50%; transform: translateY(-50%);
    font-family: monospace; font-size: 11px; font-weight: bold;
    width: 30px; text-align: center; color: #9cf;
  }
  #tree-overlay .tree-node .tn-name { font-size: 14px; font-weight: bold; }
  #tree-overlay .tree-node .tn-desc { font-size: 11px; color: #9fbad6; margin-top: 1px; }
  #tree-overlay .tree-node .tn-req  { font-size: 10px; color: #c88; margin-top: 3px; }
  /* 状態別スタイル */
  #tree-overlay .tree-node.st-available { border-color: #6a8ac8; box-shadow: 0 0 10px rgba(90,130,220,0.25); }
  #tree-overlay .tree-node.st-locked    { opacity: 0.45; }
  #tree-overlay .tree-node.on  { border-color: #58c878; box-shadow: 0 0 12px rgba(88,200,120,0.4); }
  #tree-overlay .tree-node.on  .tn-badge { color: #7fe89a; }
  #tree-overlay .tree-node.off { border-color: #886; opacity: 0.7; }
  #tree-overlay .tree-node.off .tn-badge { color: #cc9; }

  /* v0.25: チャレンジ一覧（ツリーと同じ全画面オーバーレイの見た目を流用） */
  #challenge-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    display: none; flex-direction: column;
    padding: 16px 14px 24px; background: rgba(4,6,14,0.96);
    z-index: 55; pointer-events: auto; overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  #challenge-overlay.visible { display: flex; }
  #challenge-overlay .tree-head { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  #challenge-overlay .tree-title { font-family: -apple-system, BlinkMacSystemFont, serif; font-size: 20px; font-weight: bold; color: #ffe0b0; letter-spacing: 0.12em; text-shadow: 0 0 20px rgba(255,140,40,0.6); }
  #challenge-overlay .tree-crystals { font-family: monospace; font-size: 16px; color: #8cd8ff; margin-left: auto; }
  #challenge-overlay .tree-close { font-size: 20px; color: #ff8888; background: none; border: none; cursor: pointer; padding: 0 6px; }
  #challenge-overlay .tree-hint { font-family: monospace; font-size: 11px; color: #8aa; margin-bottom: 14px; }
  .ch-list { display: flex; flex-direction: column; gap: 8px; }
  .ch-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: rgba(16,22,36,0.92); border: 1px solid #3a4a66; border-radius: 10px; }
  .ch-row.done { border-color: #58c878; box-shadow: 0 0 10px rgba(88,200,120,0.3); }
  .ch-badge { font-family: monospace; font-size: 12px; font-weight: bold; color: #9cf; min-width: 46px; text-align: center; }
  .ch-row.done .ch-badge { color: #7fe89a; font-size: 16px; }
  .ch-name { font-size: 14px; font-weight: bold; color: #dce8f6; }
  .ch-desc { font-size: 11px; color: #9fbad6; margin-top: 1px; }

  /* v0.67: 敵図鑑（チャレンジ一覧と同じ全画面オーバーレイの見た目を流用） */
  #codex-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    display: none; flex-direction: column;
    padding: 16px 14px 24px; background: rgba(4,6,14,0.96);
    z-index: 55; pointer-events: auto; overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  #codex-overlay.visible { display: flex; }
  #codex-overlay .tree-head { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  #codex-overlay .tree-title { font-family: -apple-system, BlinkMacSystemFont, serif; font-size: 20px; font-weight: bold; color: #ffe0b0; letter-spacing: 0.12em; text-shadow: 0 0 20px rgba(255,140,40,0.6); }
  #codex-overlay .tree-crystals { font-family: monospace; font-size: 14px; color: #8cd8ff; margin-left: auto; }
  #codex-overlay .tree-close { font-size: 20px; color: #ff8888; background: none; border: none; cursor: pointer; padding: 0 6px; }
  #codex-overlay .tree-hint { font-family: monospace; font-size: 11px; color: #8aa; margin-bottom: 12px; }
  /* 時代の見出し（この時代から出る敵、の区切り） */
  .cx-era { font-family: monospace; font-size: 12px; color: #ffd08a; letter-spacing: 0.1em;
            margin: 14px 0 6px; padding-bottom: 3px; border-bottom: 1px solid #4a3a28; }
  .cx-era:first-child { margin-top: 2px; }
  .cx-list { display: flex; flex-direction: column; gap: 7px; }
  .cx-row { display: flex; align-items: center; gap: 11px; padding: 8px 10px;
            background: rgba(16,22,36,0.92); border: 1px solid #3a4a66; border-radius: 10px; }
  .cx-row.elite { border-color: #b06a4a; box-shadow: 0 0 10px rgba(255,90,40,0.20); }
  .cx-row.knock { border-color: #7ba8c8; }
  /* 絵は縦横比がばらばら（縦長の塔・横長の車両）なので contain で収める */
  .cx-thumb { width: 52px; height: 52px; flex: 0 0 52px; display: flex; align-items: center; justify-content: center;
              background: rgba(0,0,0,0.35); border-radius: 8px; overflow: hidden; }
  .cx-thumb img { max-width: 100%; max-height: 100%; object-fit: contain; image-rendering: auto; }
  .cx-body { min-width: 0; flex: 1 1 auto; }
  .cx-name { font-size: 14px; font-weight: bold; color: #dce8f6; }
  .cx-tags { font-family: monospace; font-size: 10px; color: #ffb070; margin-top: 1px; }
  .cx-atk  { font-size: 11px; color: #9fbad6; margin-top: 2px; }
  .cx-stat { font-family: monospace; font-size: 10px; color: #7d93ab; margin-top: 2px; }
  /* v0.68: 敵／建物／弾 のタブ */
  .cx-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .cx-tab { flex: 1 1 0; padding: 8px 4px; font-family: monospace; font-size: 12px;
            color: #9fbad6; background: rgba(16,22,36,0.92); border: 1px solid #3a4a66;
            border-radius: 8px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .cx-tab.on { color: #ffe0b0; border-color: #b08a4a; background: rgba(46,34,20,0.92); }
  /* 弾の見本（drawEraShot が実際に描くのと同じ絵をここに出す） */
  .cx-shot { width: 52px; height: 52px; flex: 0 0 52px; background: rgba(0,0,0,0.35);
             border-radius: 8px; }

  /* v0.25: チャレンジ達成トースト */
  #challenge-toast {
    position: fixed; left: 50%; top: 70px; transform: translateX(-50%) translateY(-12px);
    padding: 10px 18px; background: rgba(20,40,20,0.92); border: 1px solid #58c878;
    border-radius: 10px; color: #d8ffe0; font-family: monospace; font-size: 13px;
    z-index: 70; opacity: 0; pointer-events: none;
    transition: opacity 0.3s, transform 0.3s; box-shadow: 0 4px 24px rgba(0,0,0,0.5);
  }
  #challenge-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* v0.19.2: デバッグパネル（左下バージョンを800ms以内に3回タップでトグル） */
  #debug-panel {
    position: fixed;
    top: 8px; left: 50%; transform: translateX(-50%);
    display: none;
    flex-direction: column;
    width: min(94vw, 380px);
    max-height: 74vh;
    overflow-y: auto;
    padding: 10px 12px 12px;
    background: rgba(8,10,18,0.94);
    border: 1px solid #4a6a8a;
    border-radius: 10px;
    z-index: 60;
    pointer-events: auto;
    box-shadow: 0 6px 30px rgba(0,0,0,0.6);
  }

<script>
"use strict";

// -----------------------------------------------------------------
// バージョン定数（ここだけ更新すれば画面に反映される）
// -----------------------------------------------------------------
const GAME_VERSION = "v0.1.0";   // 手描き風バージョン。本編 v0.70.0 から分岐
document.getElementById("hud-version").textContent = GAME_VERSION;

// -----------------------------------------------------------------
// 決定性RNG（v0.38.0）
// 乱数を「ロジック用 random()」と「演出用 fxRandom()」の2ストリームに分ける。
// 分ける理由: パーティクルや画面揺れを間引いてもロジック側の乱数列がずれないため、
// 描画なしのヘッドレス実行と実プレイで同じランを再現できる（自動プレイテスト・回帰テストの前提）。
// 素の Math.random() の直接呼び出しは禁止（tools/check.mjs が検出する）。 allow-math-random
//
// 使い方:
//   ?seed=12345 を付けて開くと、そのシードでランが固定され何度でも同じ展開を再現できる。
//   シード無しの場合は起動ごとに引き直し、現在値は debugGetSeed() で取得できる。
// -----------------------------------------------------------------
function makeRandomGenerator(seedValue) {   // mulberry32
  let state = seedValue >>> 0;
  return function nextRandom() {
    state = (state + 0x6D2B79F5) >>> 0;
    let t = state;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// 文字列シード（"boss-bug" など覚えやすい名前）も使えるように32bitへ畳む
function hashSeed(text) {
  let hash = 0x811C9DC5;
  const source = String(text);
  for (let i = 0; i < source.length; i++) {
    hash ^= source.charCodeAt(i);
    hash = Math.imul(hash, 0x01000193);
  }
  return hash >>> 0;
}

let currentSeed        = 0;
let nextLogicRandom    = null;
let nextFxRandom       = null;

function reseedRandom(seedValue) {
  currentSeed = (typeof seedValue === "number") ? (seedValue >>> 0) : hashSeed(seedValue);
  nextLogicRandom = makeRandomGenerator(currentSeed);
  // 演出用は別ストリーム。ロジック側の消費数に一切影響されないよう種をずらす。
  nextFxRandom    = makeRandomGenerator((currentSeed ^ 0x9E3779B9) >>> 0);
  return currentSeed;
}

function random()   { return nextLogicRandom(); }   // ゲーム状態に影響する乱数
function fxRandom() { return nextFxRandom(); }      // 見た目だけの乱数

// URLで固定されたシード（指定が無ければ null）。ラン開始のたびにこの値へ戻す。
const fixedSeedParam = new URLSearchParams(location.search).get("seed") || null;

// ラン開始時に呼ぶ。?seed= 指定時は毎ランその値へ固定＝完全再現できる。
function reseedForNewRun() {
  return reseedRandom(fixedSeedParam !== null ? fixedSeedParam : (Date.now() >>> 0));
}

function debugGetSeed() { return currentSeed; }

reseedForNewRun();   // 起動直後のタイトル演出などにも乱数が要るため先に初期化しておく

// -----------------------------------------------------------------
// v0.16.1 / v0.19.2: デバッグパネル（テスト用・Shooter依頼）
// 左下のバージョン表示を800ms以内に3回タップでパネルをトグル（モバイル対応）。
// N キーは従来通り「次ステージ」の即実行（デスクトップ用ショートカット）。
//
// 既存の「次ステージ送り」は advanceToNextStage を直接呼ぶため正規のクリア処理
// （triggerStageClear/triggerAllClear → clears++・オートセーブ・報酬）を通らない。
// そこで「このステージをクリア」「全クリア（即）」を正規経路で用意し、
// レベル/竜/XP/竜晶などパワーアップ系デバッグも同じパネルに集約する。
// -----------------------------------------------------------------
// v0.51: 「次ステージ」は「次の時代へ」になった。
// 最終時代では大陸を作り直して時代1へ戻す（デバッグで回し続けられるように）。
function debugAdvanceStage() {
  if (typeof gameState === "undefined" || gameState !== "playing") return;
  // 最大段階なら次の文明へ回す（デバッグで全時代を見て回れるように）
  if (isFinalTier()) {
    runEra = (runEra + 1) % STAGE_CONFIGS.length;
    buildContinent(0);
    return;
  }
  triggerTierAdvance();
}

// n レベル分のレベルアップを発生させる（3択カードが開く）。
function debugLevelUp(n) {
  if (gameState !== "playing") return;
  for (let i = 0; i < n; i++) { playerLevel++; pendingCards++; }
  updateXpHud();
  maybeShowLevelUp();
}

// 群れ重心付近に竜を n 体追加する（大繁殖カードと同じ孵化経路）。
function debugAddDragons(n) {
  if (gameState !== "playing") return;
  const c = calcFriendlyCentroid();
  for (let i = 0; i < n; i++) {
    const a = random() * Math.PI * 2;
    const r = 30 + random() * 60;
    spawnBoidAtEgg(c.x + Math.cos(a) * r, c.y + Math.sin(a) * r);
  }
}

// プロファイルとラン再開データを消して初回ラン状態に戻す（初回/2回目フローの検証用）。
/**
 * v0.65: 全文明（開始時代）を解放する（Shooter指示）。
 * ラン構成が「1ラン＝1文明」になってから、後半の時代を確認するには
 * 前の文明を全部クリアする必要があり、動作確認に何十分もかかっていた。
 *
 * 解放フラグを立てるだけでは足りない点が2つある:
 *   - 初回ラン（runsStarted=0）はタイトルのメニュー自体が出ず、
 *     beginRun も era 0 に固定する（`currentRunIsFirst ? 0 : ...`）ので選べない
 *   - 大陸選択が開いたままだと、その場では鍵アイコンが消えない
 * どちらもここで面倒を見る。
 */
function debugUnlockAllContinents() {
  if (!profile) return;
  profile.unlockedContinents = CONTINENT_DEFS.length;
  // 「初回ラン」扱いのままだと文明を選べないので、1回遊んだ状態にしておく
  if (profile.runsStarted <= 0) profile.runsStarted = 1;
  saveProfile();
  if (gameState === "title") {
    refreshTitleMenu();
    // 大陸選択を開いている最中なら、その場で描き直して鍵を外す
    if (continentSelecting) showContinentSelect();
  }
}

function debugResetProfile() {
  try {
    localStorage.removeItem(PROFILE_KEY);
    localStorage.removeItem(RUN_SAVE_KEY);

  recomputePermaBuff();
  if (gameState === "playing") returnToTitle();
  else { refreshTitleBest(); refreshTitleMenu(); }
}

// v0.33: 動きプロファイルの切り替え（実機で手触りを比べるため）。
// null = 竜種本来の動き → hover → ground → null … と巡回する。
function debugCycleMoveProfile() {

// v0.34.1: 反動の強さを巡回する（定義値 → 0 → 40 → 100 → 240px）。
// 反動は現状ほぼ体感できないので、どのくらいの値が気持ちいいかを実機で探るため。
function debugCycleRecoil() {

  debugRecoilOverride = DEBUG_RECOIL_STEPS[(i + 1) % DEBUG_RECOIL_STEPS.length];
}

// パネルのボタン定義。run 実行後にパネルは自動で再描画/クローズされる。
// -----------------------------------------------------------------
// v0.44: 敵を確認するためのデバッグ機能
// -----------------------------------------------------------------
// マップは 4800×3600 あるので、特定の敵の挙動を見たいときに「探す」のが一番の手間だった。
// ここでは「呼ぶ・見分ける・落ち着いて眺める」の3つを用意する。
//   ① 敵図鑑: 種類を選んで**群れのすぐ隣に湧かせる**（隊で出る敵は隊ごと）
//   ② 名前ラベル: 全ての敵に名前とHPを出す（見分けがつかない問題の解消）
//   ③ 竜を無敵: 群れが落ちないので敵の動きだけを観察できる
let debugShowEnemyLabels = false;
let debugInvincible      = false;

// 敵の表示名（デバッグ専用。ゲーム内の文言ではないので STRINGS には置かない）
const DEBUG_ENEMY_LABELS = {

// 図鑑に並べる順（見たい順＝新しい敵を上に）。treasure まで含めて全部出せるようにする。
const DEBUG_ENEMY_ORDER = [

/** 群れのすぐ横に敵を湧かせる。隊（packCount）は隊ごと、巨獣はコア＋腕2本まとめて。 */
function debugSpawnEnemy(key) {
  if (gameState !== "playing") return;
  const def = MOVER_DEFS[key];
  if (!def) return;
  const c = calcFriendlyCentroid();
  // 群れの右手前に置く（重なって見えないよう少し離す）
  const baseX = Math.max(80, Math.min(WORLD_W - 80, c.x + 300));
  const baseY = Math.max(80, Math.min(WORLD_H - 80, c.y));
  const at = () => ({ x: baseX, y: baseY });

  const spawnOne = (d, ox, oy) => {
    const m = makeMover(d, at);
    m.wx = baseX + ox; m.wy = baseY + oy;
    m.maxHp = d.hp; m.hp = d.hp; m.xpValue = d.xp;
    movers.push(m);
    spawnDragonAppearEffect(m.wx, m.wy);
    return m;
  };

  if (key === "behemoth_core") {
    const core = spawnOne(def, 0, 0);
    for (const side of [-1, 1]) {
      const arm = spawnOne(MOVER_DEFS.behemoth_arm, side * 60, 0);
      arm.parent = core; arm.armSide = side; arm.attackTimer = random() * 2;
      core[side < 0 ? "armL" : "armR"] = arm;
    }
    return;
  }

  const count = def.packCount ?? 1;
  const leaderM = spawnOne(def, 0, 0);
  for (let k = 1; k < count; k++) {
    const a = (k / count) * Math.PI * 2;
    const mem = spawnOne(def, Math.cos(a) * 46, Math.sin(a) * 46);
    mem.waypoints = leaderM.waypoints;   // 隊で同じ経路を共有する（本編の湧き方と同じ）
    mem.packId    = leaderM.packId ?? (leaderM.packId = nextPackId++);
    mem.speedMult = randRange(0.92, 1.08);
  }
  if (count > 1 && leaderM.packId === undefined) leaderM.packId = nextPackId++;
}

/** 場を片付けて1体だけ観察したいとき用。 */
function debugClearEnemies() {
  for (const m of movers) m.alive = false;
  movers.length = 0;
}

/** 堰を探しに行かずに決壊を見る。 */
function debugBreakDam() {
  const idx = settlements.findIndex(b => b && b._isDam && !b.fallen);
  if (idx >= 0) settlementFall(idx);
}

/** ボス周辺（守備隊・城下・城壁）を見に行く。群れとカメラごと運ぶ。 */
function debugWarpToBoss() {
  const boss = settlements.find(b => b && b.isBoss);
  if (!boss) return;
  const tx = boss.wx - 560, ty = boss.wy;
  for (let i = 0; i < N; i++) {
    if (boidDead[i]) continue;
    px[i] = tx + (i % 8) * 22;
    py[i] = ty - 80 + Math.floor(i / 8) * 22;
  }
  leader.x = tx; leader.y = ty; leader.vx = 0; leader.vy = 0;
  cam.x = tx; cam.y = ty;
  pathClear();
}

}

function renderDebugPanel() {
  const title = debugPage === "enemies" ? "ENEMIES" : `DEBUG ${GAME_VERSION}`;
  debugPanelEl.innerHTML =
    `<div class="dbg-title">${title}<span class="dbg-close">✕</span></div>` +
    `<div class="dbg-status">${debugStatusLine()}</div>` +
    `<div class="dbg-grid"></div>`;
  const grid = debugPanelEl.querySelector(".dbg-grid");

  // v0.44: 敵図鑑ページ — 押すとその敵が群れの隣に湧く（パネルは開いたまま＝続けて出せる）
  if (debugPage === "enemies") {
    grid.classList.add("enemies");
    const back = document.createElement("button");
    back.className = "dbg-btn";
    back.style.gridColumn = "1 / -1";
    back.textContent = "← もどる";
    back.addEventListener("pointerdown", (e) => {
      e.stopPropagation(); e.preventDefault();
      debugPage = "main"; renderDebugPanel();
    });
    grid.appendChild(back);

    for (const key of DEBUG_ENEMY_ORDER) {
      const def = MOVER_DEFS[key];
      if (!def) continue;
      const b = document.createElement("button");
      b.className = "dbg-btn";
      // HPは現場の名札に出るので、ここは名前だけにして高さを詰める（スクロール回避）
      const packNote = def.packCount ? `×${def.packCount}` : "";
      b.textContent = `${DEBUG_ENEMY_LABELS[key] ?? key}${packNote}`;
      b.addEventListener("pointerdown", (e) => {
        e.stopPropagation(); e.preventDefault();
        debugSpawnEnemy(key);
        renderDebugPanel();
      });
      grid.appendChild(b);
    }
    debugPanelEl.querySelector(".dbg-close").addEventListener("pointerdown", (e) => {
      e.stopPropagation();
      toggleDebugPanel(false);
    });
    return;
  }

  for (const act of DEBUG_ACTIONS) {
    const b = document.createElement("button");
    b.className = "dbg-btn";
    // トグル系は現在の状態を出す（押したのに何も起きていないように見えるのを防ぐ）
    let label = act.label;
    if (act.label.startsWith("🏷")) label += debugShowEnemyLabels ? "：ON" : "：OFF";
    if (act.label.startsWith("🛡")) label += debugInvincible ? "：ON" : "：OFF";
    b.textContent = label;
    b.addEventListener("pointerdown", (e) => {
      e.stopPropagation();
      e.preventDefault();
      act.run();
      // プレイ外へ抜けた／カードが開いたらパネルは閉じ、そうでなければ数値を更新
      // （keepOpen の項目は観察を続けたいので閉じない）
      if (!act.keepOpen && (gameState !== "playing" || upgradeCardsVisible)) toggleDebugPanel(false);
      else renderDebugPanel();
    });
    grid.appendChild(b);
  }
  debugPanelEl.querySelector(".dbg-close").addEventListener("pointerdown", (e) => {
    e.stopPropagation();
    toggleDebugPanel(false);
  });
}

function toggleDebugPanel(force) {
  debugPanelOpen = (typeof force === "boolean") ? force : !debugPanelOpen;
  if (debugPanelOpen) { renderDebugPanel(); debugPanelEl.classList.add("visible"); }
  else debugPanelEl.classList.remove("visible");
}

/* ============================================================
 * 竜潮 / Dragon Tide — Stage Edition v3
 *
 * v3改修:
 *   - 街区（ブロック）方式マップ: 1ステージ150〜250建物
 *   - 静的レイヤー（オフスクリーンCanvas）で建物描画コスト削減
 *   - ブレス攻撃（レーザー）: 近接接触ダメージを廃止し連続照射方式に変更
 *   - ブレス命中点にヒットパーティクル（0.2秒間引き）
 * ============================================================ */

// -----------------------------------------------------------------
// ワールド定数
// -----------------------------------------------------------------
// 変更1: ワールドサイズを拡大（4800×3600）
// オフスクリーンcanvasメモリ: 4800×3600×4byte = 69.1MB（許容範囲内）
// 建物間隔も52px（旧26px）に広げているため、1町の占有面積は旧比約4倍になる
// v0.49: 大陸サイズへ拡張（面積4倍）。「1ラン＝1大陸」構成の土台。
// 静的レイヤーはタイル化済みなので、ここを広げてもメモリは可視範囲に比例したままになる。
// 従来サイズ（4800×3600）は WORLD_REF_W/H として残し、町・地形・森の数を面積比で決める。
const WORLD_W = 9600;
const WORLD_H = 7200;

// 数量スケールの基準（v0.48 までのワールド）
const WORLD_REF_W = 4800;
const WORLD_REF_H = 3600;
const WORLD_AREA_RATIO = (WORLD_W * WORLD_H) / (WORLD_REF_W * WORLD_REF_H);

// 町の密度。1.0 で基準ワールドと同密度。
// v0.52: 0.75 では大陸がスカスカだったため 1.25 へ（Shooter指示）。
const TOWN_DENSITY_FACTOR = 1.25;

// 巡回する動く敵は町とは別の密度で持つ。町と同じ係数で増やすと
// ステージ後半で200体近くになり、遭遇密度ではなく物量になってしまう。
const MOVER_DENSITY_FACTOR = 0.75;

/** ワールド面積に合わせて個数をスケールする（基準ワールドでの個数を渡す）。 */
function scaledForWorld(baseCount, densityFactor = 1) {
  return Math.max(1, Math.round(baseCount * WORLD_AREA_RATIO * densityFactor));
}

// ブレス射程（px）
const BREATH_RANGE = 80;
// ブレス基礎ダメージ（毎フレーム・秒間換算: 0.05/frame × 60fps = 3/sec）
const BREATH_DAMAGE_PER_SEC = 3.0;
// ブレスヒットパーティクル間引き間隔（秒）
const BREATH_PARTICLE_INTERVAL = 0.2;

// -----------------------------------------------------------------
// 変更1: 卵持ち建物パラメータ
// 全建物のうち約18%だけが陥落時に卵を落とす（EGG_BEARER_RATIO）。
// 落とす卵は常に1個（EGG_DROP_COUNT）で群れの増加ペースを緩やかにする。
// 視覚的な目印は毎フレーム動的描画（明滅アニメ付き）で陥落後は消える。
// -----------------------------------------------------------------
// 実験: 建物密度の一括倍率。各ステージの町あたり建物数にこれを掛ける。
// 卵割合はこの倍率で割って、卵の絶対数（＝群れの成長ペース）を一定に保つ。
let BUILDING_DENSITY_MULT = 4; // 4=密な街（最適化済み後のデフォルト）
                               // ビューポートカリング＋空間ハッシュゲートにより
                               // 数千棟でも per-frame コストはほぼ一定。
const EGG_BEARER_RATIO_BASE = 0.18; // 基準割合（密度1倍のときの値）
// 実効割合は BASE / 密度倍率。密度を上げた分だけ割合を下げて卵の総数を一定に。
function eggBearerRatio() { return EGG_BEARER_RATIO_BASE / BUILDING_DENSITY_MULT; }
const EGG_DROP_COUNT   = 1;    // 陥落時に落とす卵の個数

// -----------------------------------------------------------------
// 変更2: ダウン/復帰モデル パラメータ
// HP0 以下 → ダウン状態（フェードアウト → 一定秒後フェードインで全回復して復帰）
// 恒久消滅はない。ダウン中は有効個体数から除外されカメラ・ブレス範囲に影響しない。
// -----------------------------------------------------------------
const BOID_DOWN_DURATION    = 10.0;  // ダウン継続秒数（この後フェードインで復帰）
const BOID_REVIVE_DURATION  = 0.6;  // フェードイン復帰アニメ秒数

// 1ヒットあたりのダメージ量（BOID_MAX_HP の約1/7 ≒ 数発耐える）
// BOID_MAX_HP=30 → 約4.3ダメージ → 7発でダウン
const PROJECTILE_HIT_DAMAGE = 4.3;

// -----------------------------------------------------------------
// バランスデータ（Phase2から流用）
// -----------------------------------------------------------------
// Boids パラメータ（散開相当の値を恒久固定値として採用）。
// v0.33: 速度・加速・旋回・リーダー関連は竜種ごとに変えるため MOVE_PROFILE_* へ移動した。
// ここに残すのは「竜種を問わず群れの隊列を決める値」だけ。
const BASE_CFG = {
  perception:       55,   // 近傍とみなす半径（整列・結合の参照範囲）
  separationRadius: 28,   // この距離より近い個体からは離れる
  wSeparation:      2.5,
  wAlignment:       1.0,
  wCohesion:        0.4,
  idleWanderRadius: 120,  // アイドル旋回の半径
  fixedStepMs:      16,
  maxDtMs:          64,
};

// パスに点を記録する最小移動距離（ワールドpx）。
// 小さくすると細かい線が拾えるが点が増える。旧 BASE_CFG.pathMinSegment は
// Math.max(値, 30) に負けて死んでいたので、実効値をそのまま定数にした。
const PATH_MIN_SEGMENT = 30;

// 個体がリーダーへ「到達した」とみなし始める距離。この内側では望む速さを
// 距離に比例して落とす（minSpeed=0 の竜種はその場に留まれる）。
const BOID_ARRIVE_DIST = 70;

// リーダー方向へのコース修正のゲイン（1/s）。角度誤差×これ＝指示角速度で、turnRate で上限を掛ける。
// 大きい誤差（大きく向きを変える場面）では turnRate に張り付き、
// 小さい誤差（仲間との押し合い程度）では静かになる、という効き方にするための係数。
const TURN_GAIN = 3.0;

// コース修正の不感帯（rad）。この範囲のズレでは操作項を効かせず物理項だけに任せる。
// 群れの中で少し横にいる個体は「リーダーへの方位」がわずかにズレるが、
// そこへ律儀に舵を当てると隊列の中で細かく蛇行して見える（v0.32 には無かった揺れ）。
// 約5.7度。大きなコース変更には影響しないので旋回性能の効きは損なわない。
const TURN_DEADZONE = 0.10;

// 近すぎる仲間がいるときに確保する最低速度（maxSpeed に対する割合）。
// minSpeed=0 の竜種が操縦点で完全停止して重なるのを防ぐ。
const SEP_MIN_SPEED_FRAC = 0.25;

// -----------------------------------------------------------------
// v0.34.1: 外力（反動・ノックバック）＝操舵とは独立した速度チャネル
// -----------------------------------------------------------------
// なぜ別チャネルが必要か：
//   simStep の極座標積分は毎フレーム vx/vy の**向きと速さを操舵から作り直す**ので、
//   vx/vy へ足した衝撃は次のフレームで消える（実測：反動18を足しても3フレームで復帰）。
//   だからといって px/py を直接動かすと**ワープして見えて不自然**（v0.34まではこれ）。
// 解決：
//   外力を「減衰する速度」として別に持ち、位置更新のときだけ加算する。
//   操舵に消されず、かつ連続的に動くので「押されて、じわっと収まる」反動になる。
//
// 総変位 = kick速度 / KICK_DECAY_PER_SEC なので、
// 「何px押したいか」から必要な速度は kickSpeedForDistance() で求められる。
const KICK_DECAY_PER_SEC = 6.0;   // 減衰の速さ（大きいほど早く収まる）
const KICK_MAX_SPEED     = 1200;  // 多重ヒットで暴れないための上限 px/s

/** 押し戻したい距離(px) → 必要な初速(px/s)。既存の距離チューニング値をそのまま使えるように。 */
function kickSpeedForDistance(dist) { return dist * KICK_DECAY_PER_SEC; }

// -----------------------------------------------------------------
// v0.59: ノックバック硬直
// -----------------------------------------------------------------
// 「押されている間は攻撃が止まる」（Shooter指示）。押し返しが**ただの見た目**ではなく
// 火力の損失になるので、ノックバック持ちの敵が「先に処理する理由のある的」になる。
// 自分の攻撃の反動（氷槍の recoilDist など）では止まらない＝反動は硬直 fireStun が別に持つ。
const KNOCK_STUN_MIN_DIST = 12;     // これ未満の押しでは止まらない（矢の小突きで攻撃が途切れないように）
const KNOCK_STUN_BASE     = 0.15;   // 押された瞬間の最低硬直（秒）
const KNOCK_STUN_PER_PX   = 0.0055; // 押し距離1pxあたりの追加硬直
const KNOCK_STUN_MAX      = 0.85;   // 上限（連打で永久に撃てなくならないように）

// v0.59: 押してくる敵・建物の標識色。固有色（暖色〜寒色までばらばら）に埋もれないよう、
// どの文明でも同じ**白に寄せた水色**を使う＝「この色の輪＝押される」を1つ覚えれば済む。
// ※ EMPLACEMENT_DEFS が参照するので、必ずそれより前で宣言すること（const の TDZ）。
const KNOCKBACK_MARK_COLOR = "#cfefff";

/** 押し距離(px)に応じた攻撃停止時間を積む。既にもっと長い硬直中なら伸ばさない。 */
function applyKnockbackStun(i, dist) {
  if (dist < KNOCK_STUN_MIN_DIST) return;
  const t = Math.min(KNOCK_STUN_MAX, KNOCK_STUN_BASE + dist * KNOCK_STUN_PER_PX);
  if (t > boidKnockStun[i]) boidKnockStun[i] = t;
}

/**
 * 個体 i に外力を加える。nx,ny は正規化済みの向き、speed は px/s。
 * @param {boolean} stun  敵に押された場合は true（既定）。自分の攻撃の反動なら false。
 */
function applyKick(i, nx, ny, speed, stun = true) {
  if (stun) applyKnockbackStun(i, speed / KICK_DECAY_PER_SEC);
  boidKickX[i] += nx * speed;
  boidKickY[i] += ny * speed;
  const m = Math.sqrt(boidKickX[i] * boidKickX[i] + boidKickY[i] * boidKickY[i]);
  if (m > KICK_MAX_SPEED) {
    const s = KICK_MAX_SPEED / m;
    boidKickX[i] *= s; boidKickY[i] *= s;
  }
}

/** 距離指定版（push距離のチューニング値をそのまま渡せる）。 */
function applyKickDist(i, nx, ny, dist, stun = true) {
  applyKick(i, nx, ny, kickSpeedForDistance(dist), stun);
}

// -----------------------------------------------------------------
// v0.33: 竜種ごとの「動きの手触り」プロファイル
// -----------------------------------------------------------------
// 移動の性格をこの1か所に集約する。simStep（群れの積分）と updateLeader（操縦点）が参照。
//
// 速度を「向き」と「速さ」に分解して積分するので、次の2つが独立に効く：
//   turnRate … 旋回角速度の上限(rad/s)。小さいほど大回りになる
//   accel    … 速さの変化率の上限(px/s^2)。小さいほど出足が鈍い
// どちらも INSTANT を入れると制限なし＝UFO 的な即時方向転換になる。
//
// v0.32 までは力ベース積分だったため、実効の旋回角速度は
// maxForce / maxSpeed = 320 / 160 ≈ 2.0 rad/s だった。
// MOVE_PROFILE_DEFAULT はこの手触りを再現する値にしてある（既存竜種の互換）。
const INSTANT = Infinity;

// v0.34: 反動(recoil)・硬直(fireStun) は**攻撃に付随する**ものなのでここには置かない
// （体当たりの硬直は操作性ではなく攻撃手段の性質。→ ATTACK_DEFS）。
const MOVE_PROFILE_DEFAULT = {
  maxSpeed:    160,    // 最高速度 px/s
  minSpeed:    60,     // 最低速度 px/s（0 にすると止まれる。maxSpeed と同値にすると等速＝減速しない）
  accel:       320,    // 加速度の上限 px/s^2（INSTANT で即時）
  turnRate:    2.0,    // 旋回角速度の上限 rad/s（INSTANT で即時方向転換＝UFO型）
  leaderSpeed: 220,    // 操縦点（リーダー）の移動速度 px/s
  leaderPull:  1.6,    // リーダーへの引力の重み
  pathEndMode: "loop", // パス末端に達した後の挙動（下記）

  // v0.37: 極端な動きのための追加チャネル。既定値はすべて「無効」＝従来挙動。
  // 名前付きプリセットには畳まず、竜種ごとに自由に組み合わせられる形を保つ。
  orbitRadius:   0,    // >0: 操縦点にこの距離まで寄ったら**回り込む**（接線方向へ舵を切る）。
                       //     等速で止まれない竜が操縦点の上で往復・振動するのを防ぐ。0=直進で寄る
  hopPeriod:     0,    // >0: 跳躍移動（蛙型）。1サイクルの秒数
  hopFlightFrac: 0.42, // サイクルのうち滞空している割合（残りは着地して静止）
  hopGroundFrac: 0.06, // 着地中の速さ（maxSpeed比）。完全に0にすると向きを見失うので微速で残す
  hopPathSkip:   0,    // 跳躍1回でリーダーが進むパス点数（>0で「パスを飛ばして処理」する）
  pathTrace:     false,// true で**描いた線を弧長でそのままなぞる**（角を丸めない）。
                       // 群れも線上の隊列スロットを追うので、線の形がそのまま群れの軌跡になる
  // v0.38: 描いた線の**解釈**を切り替える。物理（リーダー・群れ）は共通のまま。
  //   "path"   … 線を軌跡として追う（従来。指が常に操縦点）
  //   "vector" … 線を**向きの指定**として読む。離した瞬間に進路が確定し、以後その向きへ突っ込む
  controlScheme: "path",
};

// pathEndMode: 指を離してパスの終端まで行った後どうするか。
//   "loop"     … 記録した軌跡を繰り返しなぞる（閉じた円を描くと周回する。従来の挙動）
//   "wander"   … その場でウロウロする（群れ重心のまわりを旋回）
//   "straight" … そのままの向きへ直進し続ける
//   "stop"     … 減速してその場に留まる
//   "orbit"    … 終端の点を中心に**一定半径で旋回し続ける**（v0.37。等速型のUFO用）
// ※閉じた線（始点と終点が近い）は竜種に関わらず常に周回する。
//   周回は「円を描いて放置して眺める」アクアリウム柱の要なので潰さない。
const PATH_END_MODES = ["loop", "wander", "straight", "stop", "orbit"];

// "orbit" の既定旋回半径（px）。竜種が orbitRadius を持つならそちらを優先する。
const PATH_END_ORBIT_RADIUS = 90;
// 跳躍の位相を個体ごとにずらす量（サイクルに対する割合）。
// 0 にすると群れ全員が同時に跳ぶ（軍隊行進に見える）。大きくすると跳躍感が薄れる。
const HOP_PHASE_STAGGER = 0.14;

// -----------------------------------------------------------------
// v0.34: 攻撃定義（竜種から独立）
// -----------------------------------------------------------------
// kind = 攻撃処理の分岐キー。updateWeaponAttacks が見る（旧 flockWeapon の値そのもの）。
// recoil / fireStun は**攻撃に付随する**性質としてここに置く
// （移動プロファイルではない。体当たりの硬直は操作性ではなく攻撃手段の性質だから）。
// 竜種と分離してあるので、同じ攻撃を別の動きの竜に載せられる。
// recoilDist の単位（v0.34.1で px/s → px に変更）：
//   単発攻撃（bullet/missile）… 1発ごとに**発射方向の逆へ押し戻す距離(px)**
//   持続攻撃（beam）          … 照射している間の**押し戻し速度(px/s)**
// 実際の押し出しは applyKickDist（減衰する外力）で行う＝ワープに見えない。
const ATTACK_DEFS = {
  flamebreath:    { ja: "炎息",       en: "Flamebreath",       kind: "beam",      recoilDist: 0,  fireStun: 0    },
  // recoilDist 28: 実機で 0/40/100/240 を比べたユーザー判断（v0.35.2）
  icelance:       { ja: "氷槍",       en: "Ice Lance",         kind: "bullet",    recoilDist: 28, fireStun: 0    },
  shadowbolt:     { ja: "影弾",       en: "Shadow Bolt",       kind: "missile",   recoilDist: 0,  fireStun: 0    },

const SPECIES_BY_ATTACK_KIND = {};

  const kind = ATTACK_DEFS[sdef.attack].kind;

}

// 有効プロファイルの解決（竜種 or デバッグ上書き）。
// キーが変わったときだけ合成しキャッシュするので毎フレーム呼んでも割り当てが起きない。
let moveProfileOverride = null;   // MOVE_PROFILE_PRESETS のキー or null
let _mvCache = null, _mvKey = "";
function mv() {
  const key = (moveProfileOverride || "-") + "|" + flockSpecies;
  if (key !== _mvKey) {
    _mvKey = key;
    const ov = moveProfileOverride
      ? MOVE_PROFILE_PRESETS[moveProfileOverride]
      : (SPECIES_DEFS[flockSpecies] && SPECIES_DEFS[flockSpecies].move);
    _mvCache = Object.assign({}, MOVE_PROFILE_DEFAULT, ov || {});
  }
  return _mvCache;
}

/** 現在の竜種定義。 */
function sp() { return SPECIES_DEFS[flockSpecies] || SPECIES_DEFS.fire; }
/** 現在の攻撃定義（反動・硬直はここから引く）。 */
function atk() { return ATTACK_DEFS[sp().attack] || ATTACK_DEFS.flamebreath; }

// v0.41: 城下にも medium を混ぜる（街は small/medium/large が混在するのに
// 城下は large リング＋small だけで、密度以前に「街に見えない」問題があった）。
const CAPITAL_MEDIUM_COUNT       = 40;   // 増やすほど small の入る隙間が減る（棟数密度とのトレードオフ）
// medium は**外周側だけ**に置く。ボス至近は large リングが場所を食っているので、
// そこへさらに大きい建物を混ぜると棟数密度が落ちる（内側は small で埋め切る）。
const CAPITAL_MEDIUM_INNER       = 210;
// 城下の民家が**撃つ**割合。
// v0.41 では 0.06 まで絞っていた。理由は「密度を5倍にしたら弾も5倍になり群れが全滅した」
// という実測だったが、**その結果ボス周辺が普通の街より弱くなってしまった**
//（実機判定 2026-08-21「弱くする必要はない」）。首都は街と同じ密度で撃ち、
// さらに城壁・要塞リング（カタパルト）・守備隊・ボス本体が上乗せされる＝街より強い、が正しい。
// ここを下げるのは「城下は無防備な民家」という別の設計を選ぶときだけにする。
const CAPITAL_SMALL_SHOOTER_RATE = 1.0;
const CAPITAL_MEDIUM_RADIUS      = BUILDING_SIZE_PARAMS.medium.radiusBase; // 16px
const CAPITAL_MEDIUM_MIN_SPACING = CAPITAL_MEDIUM_RADIUS * 2 + 6; // 38px

// 小集落クラスタとの分離に使う「ボス＋リング＋城下充填」占有半径
// 城下外縁 CAPITAL_SMALL_OUTER + small radius + 余白 → 他クラスタを外に追い出す
const CAPITAL_EXCLUSION_RADIUS = CAPITAL_SMALL_OUTER + CAPITAL_SMALL_RADIUS + 60; // 430px
// ボスをマップ端から確保するマージン（城下外縁 + 余白がマップ外に出ないよう）
const CAPITAL_BOSS_MARGIN = CAPITAL_SMALL_OUTER + CAPITAL_SMALL_RADIUS + 80; // 450px

// -----------------------------------------------------------------
// ボス集落パラメータ
// ボスはステージごとに1体だけ配置される高耐久・高火力の核心目標。
// HP: 小集落の約15倍を起点に、ステージが進むほど係数を掛けて増やす。
// 火力: 発射間隔=小集落の約1/3、projectileCount 3〜5、弾速・ダメージ高め。
// 投射ダメージはダウン/復帰モデルのまま（恒久喪失なし）。
// -----------------------------------------------------------------
// v0.7: ボスを「序盤は跳ね返される」強さへ大幅増強（Shooterプレイテスト）。
// 育っていない群れが挑むと、強ノックバック弾＋ノヴァで物理的に押し返される。
const BOSS_BASE_HP = 850;          // v0.29: ボスを強化（600→850。群れが育つと弱かった）
const BOSS_HP_STAGE_MULT = 1.45;   // v0.29: ステージ増加係数を強め（1.4→1.45）
const BOSS_RADIUS = 46;            // ボスの見た目半径（小集落10の4.6倍、一目でボスと分かる）
const BOSS_ATTACK_RADIUS = 380;    // ボスの攻撃射程（小集落の2.5倍以上）

// ボスの投射パラメータ（ステージ4 large より強い）
const BOSS_FIRE_PARAMS = {
  projectileInterval: 0.5,         // v0.29: 高頻度化（0.6→0.5）
  projectileSpeed:    300,
  projectileDamage:   4.0,         // v0.29: AoE被害を強化（3.0→4.0）
  projectileCount:    7,           // v0.29: 7方向ファンで群れをより散らす（5→7）
  projectileTracking: false,
};

// v0.7: ボス弾（kind=2）の跳ね返し。速度クランプで消えないよう「位置ごと押し戻す」
const BOSS_SHOT_KNOCKBACK_DIST = 46;   // 被弾時の押し戻し距離（px）
const BOSS_SHOT_MAX_RANGE      = 460;  // ボス弾の飛距離上限（射程380より広く）

// v0.7: ボスノヴァ（周期的な反発衝撃波）。近づいた群れを面で弾き飛ばす
const BOSS_NOVA_INTERVAL = 5.0;   // v0.29: ノヴァを高頻度化（6.0→5.0）
const BOSS_NOVA_RADIUS   = 280;   // v0.29: 効果半径を拡大（260→280）
const BOSS_NOVA_DAMAGE   = 3.5;   // v0.29: ノヴァ強化（2.5→3.5）
const BOSS_NOVA_PUSH_MIN = 40;    // 最低押し戻し距離（px。中心に近いほど大きく飛ぶ）

// ボスのHP計算（stageIndexは0始まり）
function calcBossHp(stageIndex) {
  return Math.round(BOSS_BASE_HP * Math.pow(BOSS_HP_STAGE_MULT, stageIndex));
}
