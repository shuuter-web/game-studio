function challengeDone(id) { return !!(profile.challenges[id] && profile.challenges[id].done); }
function challengeCompletion() {
  return { done: CHALLENGE_DEFS.filter(c => challengeDone(c.id)).length, total: CHALLENGE_DEFS.length };
}

// 未達成のチャレンジを判定し、達成に報酬（竜晶）を付与＋トースト表示。
function evaluateChallenges() {
  let changed = false;
  for (const ch of CHALLENGE_DEFS) {
    if (challengeDone(ch.id)) continue;
    if (ch.done()) {
      profile.challenges[ch.id] = { done: true };
      profile.crystals += ch.reward;
      changed = true;
      showChallengeToast(ch);
    }
  }
  if (changed) { saveProfile(); refreshTitleMenu(); }
}

  if (!challengeToastEl) return;

  challengeToastEl.classList.add("show");
  if (challengeToastTimer) clearTimeout(challengeToastTimer);

/** その敵が出る文明を数字（I〜VIII）で並べた文字列にする。 */
function codexEraLabel(key) {
  if (CODEX_SPECIAL_ERA[key]) return CODEX_SPECIAL_ERA[key];
  const eras = [];
  for (let era = 0; era < STAGE_CONFIGS.length; era++) {
    const roam = (MOVER_SPAWNS_BY_STAGE[era] ?? []).some(e => e[0] === key);
    const gar  = (BOSS_GARRISON_BY_STAGE[era] ?? []).some(e => e[0] === key);
    if (roam || gar) eras.push(CONTINENT_NUMERALS[era] + (roam ? "" : "*"));
  }
  if (eras.length === 0) return "—";
  if (eras.length === STAGE_CONFIGS.length) return "全文明";
  return eras.join(" ");
}

/** def.attack から攻撃の説明を組み立てる（数値は定義から直接引くのでずれない）。 */
function codexAttackLabel(def) {
  const a = def.attack;
  if (!a) {
    if (def.name === "behemoth_arm") return "叩きつけ衝撃波（コアの脇から）";
    if (def.treasure) return "攻撃しない — 逃げ回る";
    return "攻撃しない";
  }
  const t = a.type;
  if (t === "shockwave") return `踏鳴らし 半径${a.radius}・押し${a.push ?? SHOCKWAVE_PUSH_DIST}・${a.interval}秒ごと`;
  if (t === "beam")      return `眼光ビーム ${a.dps}dps・射程${a.range}` + (a.frontArc ? "（正面のみ）" : "");
  if (t === "fan")       return `${a.pierce ? "貫通弾" : (a.kind === 1 ? "重弾" : "矢")}${a.count}連射 射程${a.range}・${a.interval}秒ごと`;
  if (t === "broadside") return `舷側砲 ${a.count}連×左右・${a.interval}秒ごと` + (a.pierce ? "（貫通）" : "");
  if (t === "bomb")      return `爆弾 範囲${a.aoe}・射程${a.range}・${a.interval}秒ごと`;
  if (t === "hazard")    return `${a.atTarget ? "足元に" : "周囲に"}居座る帯 半径${a.radius}・${a.dps ?? a.damage}dps・${a.life}秒`;
  if (t === "chain")     return `連鎖電撃 射程${a.range}・密集しているほど痛い`;
  if (t === "heal")      return `周囲の建物と敵を回復 半径${a.radius}`;
  if (t === "summon")    return `レイダーを召喚（最大${a.cap}体）`;
  if (t === "shell")     return `着弾弾${a.count}発 範囲${a.aoe}・射程${a.range}（予告円つき）`;
  return t;
}

/** 図鑑に並べる順。出る文明が早い順 → 同じ文明ならHPの軽い順。 */
function codexEntries() {
  const firstEra = (key) => {
    for (let era = 0; era < STAGE_CONFIGS.length; era++) {
      if ((MOVER_SPAWNS_BY_STAGE[era] ?? []).some(e => e[0] === key)) return era;
      if ((BOSS_GARRISON_BY_STAGE[era] ?? []).some(e => e[0] === key)) return era;
    }
    return 99;   // 出現テーブルに載らない特殊枠は最後
  };
  return Object.keys(CODEX_ENEMY_NAMES)
    .filter(k => MOVER_DEFS[k])
    .map(k => ({ key: k, def: MOVER_DEFS[k], era: firstEra(k) }))
    .sort((a, b) => (a.era - b.era) || (a.def.hp - b.def.hp));
}

const codexOverlayEl = document.getElementById("codex-overlay");
let codexTab = "enemy";   // "enemy" | "building" | "shot"
function openCodex()  { codexTab = "enemy"; renderCodex(); codexOverlayEl.classList.add("visible"); }
function closeCodex() { codexOverlayEl.classList.remove("visible"); refreshTitleMenu(); }

function renderCodex() {
  const tabs = [["enemy", "敵"], ["building", "建物"], ["shot", "弾"]];
  let html =
    `<div class="tree-head">` +
      `<div class="tree-title">図鑑</div>` +
      `<button class="tree-close">✕</button>` +
    `</div>` +
    `<div class="cx-tabs">` +
      tabs.map(([id, label]) =>
        `<button class="cx-tab ${codexTab === id ? "on" : ""}" data-tab="${id}">${label}</button>`).join("") +
    `</div>`;

  if (codexTab === "building") html += codexBuildingHtml();
  else if (codexTab === "shot") html += codexShotHtml();
  else html += codexEnemyHtml();

  codexOverlayEl.innerHTML = html;
  // 弾のページは canvas を後から差し込む（innerHTML では canvas の中身を渡せない）
  if (codexTab === "shot") codexFillShotCanvases();
  codexOverlayEl.querySelector(".tree-close").addEventListener("pointerdown", (e) => {
    e.stopPropagation();
    closeCodex();
  });
  for (const b of codexOverlayEl.querySelectorAll(".cx-tab")) {
    b.addEventListener("pointerdown", (e) => {
      e.stopPropagation();
      codexTab = b.getAttribute("data-tab");
      renderCodex();
    });
  }
}

/** 敵ページ。 */
function codexEnemyHtml() {
  const entries = codexEntries();
  let html =
    `<div class="tree-hint">${entries.length}種。数字は出てくる文明。* は首都の守備隊だけに出る。` +
      `${CODEX_UNLOCK_ALL ? "（開発中のため全解放）" : ""}</div>` +
    `<div class="cx-list">`;

  let shownEra = -1;
  for (const e of entries) {
    if (e.era !== shownEra) {
      shownEra = e.era;
      const head = e.era < STAGE_CONFIGS.length
        ? `${CONTINENT_NUMERALS[e.era]}. ${STAGE_CONFIGS[e.era].name}`
        : "特殊枠";
      html += `</div><div class="cx-era">${head}</div><div class="cx-list">`;
    }
    const def = e.def;
    const spriteKey = def.sprite ?? def.name;
    const src = ENEMY_IMAGE_SOURCES[spriteKey];
    const tags = [];
    if (def.elite) tags.push("エリート");
    if (def.knockback) tags.push("押してくる");
    if (def.flying) tags.push("飛行");
    if (def.packCount) tags.push(`${def.packCount}体の隊`);
    if (def.shieldArc !== undefined) tags.push("正面を弾く");
    if (def.submerge) tags.push("潜る");
    if (def.splitInto) tags.push("分裂する");
    html +=
      `<div class="cx-row ${def.elite ? "elite" : ""} ${def.knockback ? "knock" : ""}">` +
        `<div class="cx-thumb">${src ? `<img src="${src}" alt="">` : "？"}</div>` +
        `<div class="cx-body">` +
          `<div class="cx-name">${CODEX_ENEMY_NAMES[e.key]}</div>` +
          `<div class="cx-tags">${codexEraLabel(e.key)}${tags.length ? " ／ " + tags.join("・") : ""}</div>` +
          `<div class="cx-atk">${codexAttackLabel(def)}</div>` +
          `<div class="cx-stat">HP ${def.hp} ／ XP ${def.xp} ／ 卵 ${def.eggDrop ?? 0}</div>` +
        `</div>` +
      `</div>`;
  }
  html += `</div>`;
  return html;
}

/** 弾ページの見本 canvas を差し込む（innerHTML では canvas の中身を渡せないため後入れ）。 */
function codexFillShotCanvases() {
  for (const slot of codexOverlayEl.querySelectorAll(".cx-shot-slot")) {
    const key = slot.getAttribute("data-style");
    const sc  = parseFloat(slot.getAttribute("data-scale")) || 1;
    const st  = SHOT_STYLES.find(x => x.key === key) ?? SHOT_STYLES[2];
    const era = SHOT_STYLES.indexOf(st);
    // 弾の色はその文明の large 建物のものを使う（本編で一番よく見る色）
    const color = (STAGE_CONFIGS[era] ?? STAGE_CONFIGS[2]).buildings.large.projectileColor;
    slot.replaceWith(codexShotCanvas(key, color, st.size * sc));
  }
}

const titleHintEl = document.getElementById("title-hint");
const titleMenuEl = document.getElementById("title-menu");

// タイトルのメニュー内容を状況に合わせて組み直す。
// 初回ラン：ヒント「TAP TO START」＋背景タップで即開始。
// 2回目以降：メニューボタン（つづきから／はじめる）。背景タップは無効。
function refreshTitleMenu() {
  const first = isFirstEverRun();
  titleHintEl.style.display = first ? "" : "none";
  titleMenuEl.innerHTML = "";
  if (first) { titleMenuEl.style.display = "none"; return; }
  titleMenuEl.style.display = "flex";

  const save = loadRunSave();
  if (save) {
    const cont = document.createElement("button");
    cont.className = "title-btn title-btn-primary";
    cont.textContent = STRINGS.continueRun((save.stage | 0) + 1);
    cont.addEventListener("pointerdown", (e) => { e.stopPropagation(); resumeRun(); });
    titleMenuEl.appendChild(cont);
  }
  const startBtn = document.createElement("button");
  startBtn.className = "title-btn";
  startBtn.textContent = STRINGS.startRun;
  startBtn.addEventListener("pointerdown", (e) => { e.stopPropagation(); onTitleStart(); });
  titleMenuEl.appendChild(startBtn);

  // v0.20: 恒常強化ツリー（竜晶を持っていなくても開けて、何が伸ばせるか見せる）
  const treeBtn = document.createElement("button");
  treeBtn.className = "title-btn";
  treeBtn.textContent = STRINGS.openTree(profile.crystals);
  treeBtn.addEventListener("pointerdown", (e) => { e.stopPropagation(); openTree(); });
  titleMenuEl.appendChild(treeBtn);

  // v0.25: チャレンジ一覧（達成数を表示）
  const chRate = challengeCompletion();
  const chBtn = document.createElement("button");
  chBtn.className = "title-btn";
  chBtn.textContent = STRINGS.openChallenges(chRate.done, chRate.total);
  chBtn.addEventListener("pointerdown", (e) => { e.stopPropagation(); openChallenges(); });
  titleMenuEl.appendChild(chBtn);

  // v0.67: 敵図鑑（絵・名前・出る文明・攻撃方法の一覧）
  const cxBtn = document.createElement("button");
  cxBtn.className = "title-btn";
  cxBtn.textContent = STRINGS.openCodex;
  cxBtn.addEventListener("pointerdown", (e) => { e.stopPropagation(); openCodex(); });
  titleMenuEl.appendChild(cxBtn);
}

// ---- ラン開始（タイトル → STAGE 1）----
// v0.19: 初回=火竜固定で即開始・初期10体、2回目以降=竜種選択メニュー・初期1体。

// 竜種選択メニューの選択肢（stay_fire は火竜として提示）。
// v0.34: 竜種IDで持つ（アイコン・名前・色は SPECIES_DEFS 側にあるので重複させない）。
// 竜種が増えたらここに足す。将来アンロック制にするならこの配列を絞り込む。
const SPECIES_CHOICES = [
  { species: "fire" },
  { species: "ice" },
  { species: "shadow" },
  { species: "crimson" },
  // v0.35: 2群（軽量機動）＋ガーゴイル。動きの違いを実機で比べるため全部選べるようにする。
  // 将来アンロック制にするならこの配列を絞り込む。
  { species: "falcon" },
  { species: "swallow" },
  { species: "hornet" },
  { species: "gargoyle" },
  // v0.37: Ⅲ群（極端枠）。手触りの限界を実機で確かめるための3種。
  { species: "ufo" },
  { species: "comet" },     // v0.45: UFOと同じ動きの「尻尾あり」版
  { species: "bomber" },
  { species: "wayward" },   // v0.40: 爆竜の旧操作（線をなぞる）版
  { species: "frog" },
];
let speciesSelecting = false;

// ステージ開始時の竜の数。基本値は 1（毎ステージ塊魂的にゼロから積み上げる）。
// 一番最初のランだけ特別に多く（導入をやさしく）、それ以降は毎ステージ基本値スタート。
// Phase 2 の恒常強化ツリーでこの初期数を底上げしていく想定（ここに加算を足す）。
const FLOCK_START_BASE      = 5;    // v0.29.2: 通常ランのステージ開始数（1体は辛すぎたので5に）
const FLOCK_START_FIRST_RUN = 10;   // 一番最初のランだけの特別値
function stageStartFlockCount() {
  const base = currentRunIsFirst ? FLOCK_START_FIRST_RUN : FLOCK_START_BASE;
  return base + permaBuff.startFlock;   // v0.20: 恒常ツリーで初期数を底上げ
}

// タイトルのタップ／「はじめる」の入口。
function onTitleStart() {
  if (gameState !== "title") return;
  if (isFirstEverRun()) {
    // 初回だけは特別ラン。大陸も竜種も選ばせず、黎明の大陸×火竜で即開始する。
    pendingStartEra = 0;
    beginRun("fire");
  } else {
    // v0.55: 2回目以降は「どの大陸から始めるか」→「どの竜で行くか」の2段階
    showContinentSelect();
  }
}

// 次に始めるランの開始時代。大陸選択で確定し beginRun が読む。
let pendingStartEra = 0;
let continentSelecting = false;

// 大陸（開始時代）選択メニュー。竜種選択と同じオーバーレイを流用する。
function showContinentSelect() {
  if (gameState !== "title") return;
  continentSelecting = true;
  levelupTitleEl.textContent = STRINGS.chooseContinent;
  cardListEl.classList.add("species-grid");
  cardListEl.innerHTML = "";

  const unlocked = unlockedContinentCount();
  for (let i = 0; i < CONTINENT_DEFS.length; i++) {
    const c        = CONTINENT_DEFS[i];
    const isLocked = i >= unlocked;
    // その文明の建物がどれだけ硬いか（時代の底上げ）を一言で出す
    const eraBoost  = STAGE_DIFFICULTY_BOOST[c.era];
    const toughness = "×" + (eraBoost ? eraBoost.hp : 1).toFixed(2);

    const btn = document.createElement("button");
    btn.className = "upgrade-card card-span-2" + (isLocked ? " card-locked" : " rarity-star");
    btn.innerHTML =
      `<span class="card-icon">${isLocked ? "🔒" : "🏙"}</span>` +
      `<span><div class="card-name">${CONTINENT_NUMERALS[i]}. ${c.name}</div>` +
      `<div class="card-desc">${isLocked ? STRINGS.continentLocked(CONTINENT_NUMERALS[i - 1] || "I")
                                          : c.subtitle}</div>` +
      `${isLocked ? "" : `<div class="card-desc" style="opacity:0.7">${STRINGS.continentToughness(toughness)}</div>`}</span>`;
    if (!isLocked) {
      btn.addEventListener("pointerdown", (e) => {
        e.stopPropagation();
        e.preventDefault();
        pendingStartEra = c.era;
        dismissContinentSelect();
        showSpeciesSelect();
      });
    }
    cardListEl.appendChild(btn);
  }

  const back = document.createElement("button");
  back.className = "upgrade-card card-span-2";
  back.style.justifyContent = "center";
  back.style.minHeight = "40px";
  back.innerHTML = `<span class="card-name">${STRINGS.backToTitle}</span>`;
  back.addEventListener("pointerdown", (e) => {
    e.stopPropagation();
    e.preventDefault();
    dismissContinentSelect();
    refreshTitleMenu();
    titleOverlayEl.classList.add("visible");
  });
  cardListEl.appendChild(back);

  titleOverlayEl.classList.remove("visible");
  levelupOverlayEl.classList.add("visible");
}

function dismissContinentSelect() {
  if (!continentSelecting) return;
  continentSelecting = false;
  levelupTitleEl.textContent = STRINGS.levelUp;
  levelupOverlayEl.classList.remove("visible");
}

// 竜種選択メニュー（レベルアップ用オーバーレイを流用）。
function showSpeciesSelect() {
  if (gameState !== "title") return;
  speciesSelecting = true;
  levelupTitleEl.textContent = STRINGS.chooseDragon;
  // v0.37: 11種になって1列では画面に収まらない（12行×60px≒776px）。
  // スクロールにすると pointerdown 選択とドラッグが喧嘩するので**2列グリッド**にする。
  cardListEl.classList.add("species-grid");
  cardListEl.innerHTML = "";
  for (const ch of SPECIES_CHOICES) {
    const s    = SPECIES_DEFS[ch.species];
    const btn  = document.createElement("button");
    btn.className = "upgrade-card rarity-star";
    btn.innerHTML =
      `<span class="card-icon">${s.icon}</span>` +
      `<span><div class="card-name" style="color:${s.color}">${s.icon} ${s.ja}</div>` +
      `<div class="card-desc">${s.desc}</div></span>`;
    btn.addEventListener("pointerdown", (e) => {
      e.stopPropagation();
      e.preventDefault();
      beginRun(ch.species);
    });
    cardListEl.appendChild(btn);
  }
  // 「もどる」でタイトルへ戻れる（つづきから等を選び直せる）
  const back = document.createElement("button");
  back.className = "upgrade-card card-span-2";   // 2列グリッドでは横いっぱいに広げる
  back.style.justifyContent = "center";
  back.style.minHeight = "40px";
  back.innerHTML = `<span class="card-name">${STRINGS.backToTitle}</span>`;
  back.addEventListener("pointerdown", (e) => {
    e.stopPropagation();
    e.preventDefault();
    cancelSpeciesSelect();
  });
  cardListEl.appendChild(back);

  // v0.19.1: 竜種カードは levelup-overlay(z40) に出るが、タイトル(z50) が
  // 全画面で被さるとタップを奪う。選択中はタイトルを隠して背景に世界を見せる。
  titleOverlayEl.classList.remove("visible");
  levelupOverlayEl.classList.add("visible");
}

function dismissSpeciesSelect() {
  if (!speciesSelecting) return;
  speciesSelecting = false;
  levelupTitleEl.textContent = STRINGS.levelUp;
  levelupOverlayEl.classList.remove("visible");
}

// 竜種選択をやめる。v0.55: 2回目以降は1段前（大陸選択）へ戻す。
function cancelSpeciesSelect() {
  dismissSpeciesSelect();
  if (!isFirstEverRun()) { showContinentSelect(); return; }
  refreshTitleMenu();
  titleOverlayEl.classList.add("visible");
}

// 新規ランを開始する（竜種 weapon 確定済み）。
function beginRun(speciesId) {
  if (gameState !== "title") return;
  // 乱数を引き直す。以降このランで使う乱数はすべてこのシードから決まるので、
  // 同じシード＋同じ操作なら同じランになる（不具合はシードとセットで報告する）。
  reseedForNewRun();
  currentRunIsFirst = isFirstEverRun();   // runsStarted を増やす前に固定
  profile.runsStarted++;
  saveProfile();
  clearRunSave();                          // 新規ランは既存の再開データを破棄

  setFlockSpecies(speciesId || "fire");
  evolutionChosen = true;                  // 竜種は開始前に確定（ラン中4択は廃止）
  updateHUDWeapon();

  // v0.51: 大陸をこのランのシードから組み立てる。
  // 以前はタイトル背景のワールドをそのまま使い回していたため、ランのシードと
  // ワールドのシードが食い違っていた（?seed= 指定時だけ偶然一致していた）。
  // ここで作り直すことで「同じシード＝同じ大陸」が常に成り立つ。
  // v0.56: タイトルで選んだ文明（時代）に攻め込む。初回ランは石器時代で固定。
  runEra = currentRunIsFirst ? 0 : clampEra(pendingStartEra);
  buildContinent(0);                       // ワールド生成＋段階0の確定＋初期群れ

  runStartTime = performance.now();
  runKills     = 0;
  runMaxFlock  = countAliveBoids();
  runTotalXp   = 0;

  dismissSpeciesSelect();
  titleOverlayEl.classList.remove("visible");
  gameState = "playing";
  hapticPulse(30);
}

// ---- ラン再開チェックポイント（ステージクリアごとのオートセーブ）----
// 「次ステージ開始状態」を保存し、途中でアプリを閉じても続きから遊べる。
function snapshotRunSave() {
  saveRunSave({
    // v0.56: 保存するのは「動員段階」と「ランの時代」。旧セーブとの互換のため
    // キー名は stage / startEra のまま（読み込み側でクランプする）。
    stage:         powerTier,
    startEra:      runEra,
    isFirstRun:    currentRunIsFirst,
    playerLevel,
    playerXp,
    pendingCards,
    flockSpecies,                 // v0.34: 竜種が正
    flockWeapon,                  // 旧版で読めるように攻撃の kind も残す
    upgradeCounts: Object.assign({}, upgradeCounts),
    runKills,
    runMaxFlock,
    runTotalXp,
    elapsedMs:     performance.now() - runStartTime,
  });
}

// タイトルの「つづきから」。保存済みステージ開始状態を復元して再開する。
function resumeRun() {
  if (gameState !== "title") return;
  const save = loadRunSave();
  if (!save) { refreshTitleMenu(); return; }

  // 再開ランは途中経過を復元するので厳密な再現はできないが、
  // 以降の乱数列を定義された状態から始めるためここでも引き直す。
  reseedForNewRun();

  // 進行の復元
  currentRunIsFirst = !!save.isFirstRun;
  // 旧セーブは stage に絶対ステージ番号（0..7）が入っていることがあるが、
  // clampTier で潰せばどちらでも破綻せずに再開できる。
  runEra            = clampEra(save.startEra | 0);
  powerTier         = clampTier(save.stage | 0);
  currentStage      = runEra;
  playerLevel       = (save.playerLevel | 0) || 1;
  playerXp          = save.playerXp || 0;
  pendingCards      = save.pendingCards | 0;
  // v0.34: 竜種があればそれを使う。無い旧セーブは攻撃の kind から竜種を逆引きする。
  setFlockSpecies(save.flockSpecies || SPECIES_BY_ATTACK_KIND[save.flockWeapon] || "fire");
  evolutionChosen   = true;
  for (const k of Object.keys(upgradeCounts)) delete upgradeCounts[k];
  if (save.upgradeCounts) Object.assign(upgradeCounts, save.upgradeCounts);

  // ラン統計の復元（経過時間を継続させる）
  runKills     = save.runKills || 0;
  runMaxFlock  = save.runMaxFlock || 0;
  runTotalXp   = save.runTotalXp || 0;
  runStartTime = performance.now() - (save.elapsedMs || 0);

  // 保存ステージを組み立てて再開（ステージ間リセット相当の体数）
  dismissSpeciesSelect();
  dismissLevelUpCards();
  setupStageForResume(powerTier);   // v0.56: 引数は動員段階

  updateHUDWeapon();
  updateXpHud();
  titleOverlayEl.classList.remove("visible");
  gameState = "playing";
  hapticPulse(30);
}

// v0.51: ステージ送り（ワールドごと差し替え）は廃止。
// 残っているのはデバッグと保険のための「時代を1つ進める」入口だけ。
// 最終時代なら全クリア扱いにする。
function triggerStageClear() {
  if (gameState !== "playing") return;
  if (isFinalTier()) { triggerAllClear(); return; }
  triggerTierAdvance();
}

// ---- 全制覇（STAGE 4 ボス撃破）→ リザルト表示 ----
function triggerAllClear() {
  gameState = "all-clear";
  const runTimeMs = performance.now() - runStartTime;
  saveBestRecord(runTimeMs, runKills);
  profile.clears++;          // v0.19: 全クリア回数（チャレンジ/コンプ用の累計）
  // v0.55: この大陸をクリアしたら次の大陸（開始時代）を解放する
  const unlockedNew = unlockNextContinent(runEra);
  // v0.51: 最終時代ぶん＋大陸制覇ボーナスの竜晶（awardCrystals が saveProfile 済み）
  awardCrystals(crystalsForStageClear(currentStage) + CRYSTAL_ALLCLEAR_BONUS);
  evaluateChallenges();               // v0.25: 全クリア・累計系チャレンジを判定
  saveProfile();
  clearRunSave();            // 全クリア＝再開データは不要

  overlayEl.classList.add("visible");
  overlayTitle.textContent = STRINGS.resultTitle;
  resultStatsEl.innerHTML =
    `${STRINGS.statTime}: <span class="stat-value">${formatRunTime(runTimeMs)}</span><br>` +
    `${STRINGS.statKills}: <span class="stat-value">${runKills}</span><br>` +
    `${STRINGS.statFlock}: <span class="stat-value">${runMaxFlock}</span><br>` +
    `${STRINGS.statLevel}: <span class="stat-value">Lv.${playerLevel}</span><br>` +
    `${STRINGS.statXp}: <span class="stat-value">${runTotalXp}</span>` +
    (unlockedNew
      ? `<br><span class="stat-value" style="color:#ffd060">🔓 ${
          STRINGS.continentUnlocked(CONTINENT_DEFS[profile.unlockedContinents - 1].name)}</span>`
      : "");
  resultStatsEl.classList.add("visible");
  retryBtn.textContent = STRINGS.toTitle;
  setTimeout(() => overlayTitle.classList.add("show"), 300);
  setTimeout(() => retryBtn.classList.add("visible"), 1500);
  hapticPulse(300);
}

// v0.51: 旧「ステージクリア演出」（gameState を止めて 2.8 秒待たせるシーケンス）は撤去した。
// 時代遷移はラン中に3回起きるため、止めると毎回テンポを殺す。
// 代わりに triggerTierAdvance() がフラッシュ＋スローモー＋見出しだけで伝える（非モーダル）。

// -----------------------------------------------------------------
// 時代進行（v0.51）— ワールドを作り直さずに文明だけを進める
// -----------------------------------------------------------------

/** 破壊対象（首都・城壁を除く建物）のうち、まだ建っている数。 */
function countDestructibleAlive() {
  let n = 0;
  for (let i = 0; i < settlements.length; i++) {
    const s = settlements[i];
    if (s.isBoss || s._isWall || s.fallen) continue;
    n++;
  }
  return n;
}

/** その段階に建っていた建物を何割落としたか（0..1）。 */
function tierDestroyRatio() {
  if (tierStartDestructible <= 0) return 0;
  return 1 - countDestructibleAlive() / tierStartDestructible;
}

/**
 * 動員段階の開始状態を確定する。比率の分母をここで揃える。
 * ワールド生成の直後と段階遷移の直後に呼ぶ。
 * 時代（currentStage）はここでは触らない——ランを通して固定だから。
 */
function beginTier(tier) {
  powerTier = clampTier(tier);
  tierStartDestructible = countDestructibleAlive();
  updateHUDStage();
  updateHUDBuildings();
}

/**
 * 建物1棟を「補強された状態」に更新する。
 * v0.56: 建築（形・色の系統）は変えない。同じ文明の同じ建物が、
 * 動員段階のぶんだけ頑丈になり火力が上がる——それだけ。
 * 色は段階ぶん締める（同じ色相のまま暗くする）ので、
 * 「別の時代の建物になった」ようには見えない。
 */
function reinforceSettlementForTier(settlement, baseTier) {
  const config  = STAGE_CONFIGS[currentStage];
  const key     = settlement.size === "tiny" ? "small" : settlement.size;
  const bConfig = config.buildings[key] ?? config.buildings.small;
  const tier    = settlementTier(settlement, baseTier);
  const boost   = settlementPowerBoost(settlement, baseTier);

  // 色は「元の色 × 段階ぶんの締め」。建て替えではないので色相は動かさない。
  if (settlement._baseColor == null) settlement._baseColor = settlement.color;
  // 要塞は「最大段階のさらに1段上」の濃さにする。そうしないと段階4で
  // 普通の街と同じ色になり、格上であることが見た目で分からなくなる。
  const shadeTier = settlement._fixedTier != null ? tier + 1 : tier;
  settlement.color = shadeTier > 0 ? shadeColor(settlement._baseColor, TIER_SHADE_STEP * shadeTier)
                                   : settlement._baseColor;

  const sizeParams = BUILDING_SIZE_PARAMS[settlement.size];
  let hp = randInt(sizeParams.hpMin, sizeParams.hpMax);
  if (settlement._landmark) hp = Math.round(hp * 1.3);
  hp = Math.round(hp * boost.hp);
  settlement.maxHp = hp;
  settlement.hp    = hp;

  settlement.attackRadius       = bConfig.attackRadius;
  // v0.57: 時代兵器は自前の射程を持つ。ここで街の既定値に戻すと、
  // 動員段階が上がった瞬間に投石機やロケット砲台が近距離武器へ化ける
  // （実測: 段階1に上げたら走査半径が5→4に落ちて投石機の射程が 500→400 になった）。
  const _emp = settlement._emplacement ? EMPLACEMENT_DEFS[settlement._emplacement] : null;
  if (_emp) settlement.attackRadius = Math.max(settlement.attackRadius, _emp.range);
  settlement.projectileInterval = bConfig.projectileInterval;
  settlement.projectileSpeed    = bConfig.projectileSpeed;
  settlement.projectileDamage   = bConfig.projectileDamage * boost.dmg;
  settlement.projectileColor    = bConfig.projectileColor;
  settlement.projectileCount    = bConfig.projectileCount;
  settlement.projectileTracking = bConfig.projectileTracking;
  settlement.projectileAoe      = bConfig.projectileAoe ?? 0;
  settlement.reward             = bConfig.reward;
  settlement.attackTimer        = random() * bConfig.projectileInterval;
  settlement._breathParticleTimer = 0;
}

/**
 * 廃墟の一部を再建する。同じ文明が同じ場所に建て直すだけで、時代は変わらない。
 * これが無いと段階が進むほどマップが空になり、後半ほど壊す対象が減ってしまう。
 * @returns {number} 再建した棟数
 */
function rebuildRuinsForTier(baseTier) {
  const ruins = [];
  for (let i = 0; i < settlements.length; i++) {
    const s = settlements[i];
    if (s.isBoss || s._isWall) continue;
    // 時代固定ではなく「段階固定」の要塞は再建しない。落としたら落としたまま
    if (s._fixedTier != null) continue;
    if (s.fallen) ruins.push(s);
  }
  const count = Math.round(ruins.length * TIER_REBUILD_RATIO);
  const ratio = eggBearerRatio();
  for (let i = 0; i < count && i < ruins.length; i++) {
    const j = i + Math.floor(random() * (ruins.length - i));
    const tmp = ruins[i]; ruins[i] = ruins[j]; ruins[j] = tmp;
    const s = ruins[i];
    s.fallen = false;
    s.isEggBearer = random() < ratio;
    reinforceSettlementForTier(s, baseTier);
  }
  return count;
}

/** 城壁を張り直す。時代は固定なので、増えるのは段階に応じた町の部分壁だけ。 */
function rebuildWallsForTier() {
  const kept = [];
  for (let i = 0; i < settlements.length; i++) {
    if (!settlements[i]._isWall) kept.push(settlements[i]);
  }
  const boss = kept.find(s => s.isBoss);
  if (!boss) { settlements = kept; return; }

  const townMetas = [];
  for (const s of kept) if (s._townMeta) townMetas.push(s._townMeta);

  // 城壁の量は時代（文明）で決まる。段階では増減させない。
  const walls = generateWallRing(boss, currentStage)
    .concat(generateTownWalls(townMetas, currentStage));
  settlements = kept.concat(walls);
}

/**
 * 次の動員段階へ上げる。ワールドも時代も変えない。
 * 生き残った建物が補強され、廃墟の一部が再建され、守備隊が増える。
 */
function advanceTier() {
  const nextTier = clampTier(powerTier + 1);

  // (1) 廃墟の一部を再建（先に立たせてから、生きている建物をまとめて補強する）
  const rebuilt = rebuildRuinsForTier(nextTier);

  // (2) 生き残っている建物を補強。段階固定の要塞は触らない
  //     （触ると同じ段階のままHPだけ全快してしまい、削った意味が消える）
  for (let i = 0; i < settlements.length; i++) {
    const s = settlements[i];
    if (s.isBoss || s._isWall || s.fallen) continue;
    if (s._fixedTier != null) continue;
    reinforceSettlementForTier(s, nextTier);
  }

  // (3) 城壁を張り直す（首都は最初から最大なのでボスは触らない）
  rebuildWallsForTier();

  // (4) 動く敵の部隊を増やす。時代は同じなので顔ぶれは変わらず、部隊数だけ増える
  movers = generateMovers(currentStage, settlements.find(s => s.isBoss), nextTier);

  // (5) 前の段階の残り火・進行中の演出を持ち越さない
  resetFires();
  hazards.length = 0;
  floodWave = null;

  // (6) 索引とレイヤーを作り直す。色を締めたぶんだけ焼き直す
  rebuildBuildingGrid();
  cacheBossIndex();
  repaintTiledLayer(buildingTiledLayer);
  minimapBaseDirty = true;
  minimapBaseLastBuilt = -Infinity;

  // (7) 新しい段階の開始状態を確定（比率の分母がここでリセットされる）
  beginTier(nextTier);

  // (8) 群れの天井が開く
  updateHUDWeapon();

  // (9) 報酬とチャレンジ
  awardCrystals(crystalsForStageClear(nextTier));
  evaluateChallenges();
  snapshotRunSave();

  return rebuilt;
}

// ---- 動員段階の演出（非モーダル: プレイは止めない）----
const TIER_SLOWMO_DURATION = 1.2;
const TIER_BANNER_DURATION_MS = 2200;
let tierSlowmoTimer = 0;

function triggerTierAdvance() {
  if (gameState !== "playing") return;
  if (isFinalTier()) return;

  const rebuilt = advanceTier();

  triggerFlash("rgba(255,240,200,0.85)", 0.35);
  tierSlowmoTimer = TIER_SLOWMO_DURATION;
  hapticPulse(150);

  stageTextEl.textContent = TIER_NAMES[powerTier] ?? ("PHASE " + (powerTier + 1));
  stageSubEl.textContent  = STAGE_CONFIGS[currentStage].name + " — PHASE " + (powerTier + 1);
  stageOverlayEl.classList.add("visible");
  setTimeout(() => stageOverlayEl.classList.remove("visible"), TIER_BANNER_DURATION_MS);

  return rebuilt;
}

/** 建物が落ちるたびに呼ばれ、破壊率が閾値を超えたら動員段階を上げる。 */
function maybeAdvanceTier() {
  if (gameState !== "playing") return;
  if (isFinalTier()) return;
  if (tierDestroyRatio() < TIER_ADVANCE_RATIO) return;
  triggerTierAdvance();
}

// ステージ stageIdx のワールド（街・地形・レイヤー）を生成し直す共通処理。
// advanceToNextStage（次ステージへ）と setupStageForResume（続きから）で共用。
function loadStageWorld(stageIdx) {
  for (let i = 0; i < MAX_PROJECTILES; i++) projActive[i] = 0;
  for (let i = 0; i < MAX_PARTICLES; i++)   partActive[i] = 0;
  for (let e = 0; e < MAX_EGGS; e++)        eggActive[e] = 0;
  for (let i = 0; i < MAX_APPEAR_FX; i++)   appearFxActive[i] = 0;
  for (let i = 0; i < MAX_DOWN_FX; i++)     downFxActive[i] = 0;

  activeBreaths.length = 0;
  motherBreathFx.length = 0;
  clearXpGems();
  clearDragonProjectiles();
  resetFires();                 // v0.10: 前ステージの炎を消す

  settlements = generateStageLayout(stageIdx);
  rebuildBuildingGrid();
  buildingLayerDirty = true;
  minimapBaseDirty = true;
  minimapBaseLastBuilt = -Infinity;   // ステージ切り替えは間引かずに即座に焼き直す
  rebuildGroundLayer();   // v0.11.3: 地面（道路・畑・川など）を新ステージ分焼き直す
  rebuildBuildingLayer();
  cacheBossIndex();
}

/**
 * v0.56: 大陸（ワールド）を runEra の文明で組み立て、指定の動員段階から始める。
 * 段階が上がってもワールドは作り直さない（advanceTier が強さだけ変える）ので、
 * ここが呼ばれるのは「新規ラン」と「つづきから」の2箇所だけ。
 */
function buildContinent(tier) {
  stageClearPhase = "none";
  totalEggCount   = 0;
  gameState       = "playing";

  currentStage = clampEra(runEra);   // 時代はランを通して固定
  loadStageWorld(currentStage);
  beginTier(tier);

  resetBoidsForStageStart(stageStartFlockCount());
  resetLeader();
  dismissLevelUpCards();
  updateHUDEggs();
}

// 「つづきから」で保存した段階から再開する（進行は resumeRun が復元済み）。
function setupStageForResume(tier) {
  // 町の破壊状況までは保存しないので、その段階の頭（再建済みの状態）から組み直す。
  buildContinent(clampTier(tier));
}

// -----------------------------------------------------------------
// ウェイポイントパス（リーダー追従）
// -----------------------------------------------------------------
const PATH_MAX = 240;
const pathBuf = new Float32Array(PATH_MAX * 2);
let pathHead = 0;
let pathLen  = 0;
let leaderPathConsumeIdx = 0;
// v0.33: 開いた線の終端に到達したか。到達後は竜種の pathEndMode に従う（updateLeader）。
let pathEndReached = false;

// 始点と終点がこの距離以内なら「閉じた線」とみなして周回させる（円を描いて放置＝周回）
const PATH_CLOSED_DIST    = 120;
// 開いた線の終端に「着いた」と判定する距離
const PATH_END_REACH_DIST = 50;

function pathGet(logicalIdx) {
  const ring = (pathHead - pathLen + logicalIdx + PATH_MAX) % PATH_MAX;
  return { x: pathBuf[ring * 2], y: pathBuf[ring * 2 + 1] };
}

/** 描いた線が閉じている（始点と終点が近い）か。閉じていれば竜種に関わらず周回させる。 */
function isPathClosed() {
  if (pathLen < 6) return false;
  const a = pathGet(0), b = pathGet(pathLen - 1);
  const dx = a.x - b.x, dy = a.y - b.y;
  return dx * dx + dy * dy < PATH_CLOSED_DIST * PATH_CLOSED_DIST;
}

function pathClear() {
  pathLen  = 0;
  pathHead = 0;
  leaderPathConsumeIdx = 0;
  pathEndReached = false;
  leaderArc  = 0;
  traceIdle  = 0;
}

// -----------------------------------------------------------------
// v0.37.1: パスを「弧長」で扱う（`pathTrace` の竜種＝UFO用）
// -----------------------------------------------------------------
// 通常の竜は「数点先のウェイポイントへ操舵する」ので、角を丸めて内側を突っ切る。
// UFO は**描いた線をそのままなぞる**のが仕様なので、操舵ではなく
// 「線の上を弧長で進む」に切り替える。そのために累積長のテーブルをフレーム内で1回作る。
const _pathCum = new Float32Array(PATH_MAX);   // _pathCum[k] = 点0から点kまでの長さ
let _pathCumLen = 0;                            // テーブルが有効な点数
let leaderArc   = 0;                            // リーダーの弧長位置（px）
let traceIdle   = 0;                            // 弧が伸びていない時間（秒）

/** 累積長テーブルを作り直し、パス全長を返す。フレームに1回でよい。 */
function pathBuildCum() {
  _pathCumLen = pathLen;
  if (pathLen === 0) return 0;
  _pathCum[0] = 0;
  let prev = pathGet(0);
  for (let k = 1; k < pathLen; k++) {
    const p = pathGet(k);
    _pathCum[k] = _pathCum[k - 1] + Math.hypot(p.x - prev.x, p.y - prev.y);
    prev = p;
  }
  return _pathCum[pathLen - 1];
}

/**
 * 弧長 arc の位置と、その点での進行方向（単位ベクトル）を out に書く。
 * pathBuildCum() を**同じフレームで先に呼んでおくこと**。
 */
const _tracePtA = { x: 0, y: 0, tx: 1, ty: 0 };
const _tracePtB = { x: 0, y: 0, tx: 1, ty: 0 };
function pathPointAtArc(arc, out) {
  const n = Math.min(_pathCumLen, pathLen);
  if (n === 0) { out.x = leader.x; out.y = leader.y; out.tx = 1; out.ty = 0; return out; }
  const total = _pathCum[n - 1];
  if (arc <= 0)      { const a = pathGet(0), b = pathGet(Math.min(1, n - 1));
                       out.x = a.x; out.y = a.y;
                       const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
                       out.tx = dx / d; out.ty = dy / d; return out; }
  if (arc >= total)  { const a = pathGet(Math.max(0, n - 2)), b = pathGet(n - 1);
                       out.x = b.x; out.y = b.y;
                       const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
                       out.tx = dx / d; out.ty = dy / d; return out; }
  // 二分探索で arc を含む区間を求める
  let lo = 0, hi = n - 1;
  while (hi - lo > 1) {
    const mid = (lo + hi) >> 1;
    if (_pathCum[mid] <= arc) lo = mid; else hi = mid;
  }
  const a = pathGet(lo), b = pathGet(hi);
  const segLen = _pathCum[hi] - _pathCum[lo];
  const t = segLen > 0.0001 ? (arc - _pathCum[lo]) / segLen : 0;
  out.x = a.x + (b.x - a.x) * t;
  out.y = a.y + (b.y - a.y) * t;
  const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
  out.tx = dx / d; out.ty = dy / d;
  return out;
}

function pathPush(wx, wy) {
  if (pathLen > 0) {
    const last = pathGet(pathLen - 1);
    const dx = wx - last.x, dy = wy - last.y;
    const minSeg = PATH_MIN_SEGMENT;
    if (dx * dx + dy * dy < minSeg * minSeg) return;
  }
  pathBuf[pathHead * 2]     = wx;
  pathBuf[pathHead * 2 + 1] = wy;
  pathHead = (pathHead + 1) % PATH_MAX;
  if (pathLen < PATH_MAX) {
    pathLen++;
  } else {
    // バッファが満杯で最古点を上書きするとき、論理窓が1つ前進する。
    // leaderPathConsumeIdx が同じ「実点」を指し続けるよう1だけ引く。
    // ただし 0 未満にはしない（負になると pathGet が誤変換する）。
    leaderPathConsumeIdx = Math.max(0, leaderPathConsumeIdx - 1);
  }
}

const leader = { x: 250, y: WORLD_H * 0.5, vx: 0, vy: 0 };

// v0.38: 矢印操作の状態。**リーダーと群れの物理はそのまま**で、
// 「描いた線をどう読むか」と「何を表示するか」だけがここで変わる。
let vectorBearing   = null;   // 確定した進路（rad）。null = まだ指示なし＝従来のウロウロ
let vectorAiming    = false;  // なぞっている最中（プレビュー矢印を出す）
let vectorAimAngle  = 0;      // なぞり中の暫定の向き
let vectorCommitFx  = 0;      // 確定直後の演出タイマー（秒）
let vectorShowTimer = 0;      // 進路矢印を表示しておく残り時間（秒）。0で消える

function resetLeader() {
  leader.x  = 250;
  leader.y  = WORLD_H * 0.5;
  leader.vx = 0;
  leader.vy = 0;
  pathClear();
  idleAngle = 0;
  vectorBearing   = null;
  vectorAiming    = false;
  vectorCommitFx  = 0;
  vectorShowTimer = 0;
}

// -----------------------------------------------------------------
// 触覚フィードバック
// -----------------------------------------------------------------
function hapticPulse(durationMs) {
  try { navigator.vibrate?.(durationMs); } catch (_) {}
}

// -----------------------------------------------------------------
// 入力システム（スクリーン座標 → ワールド座標変換）
// -----------------------------------------------------------------
let inputMode = "NONE";
let isDrawing = false;
let touchRing = { active: false, x: 0, y: 0 };

// 変更3: 指の現在ワールド座標を保持する。
// isDrawing 中は静止していてもこの位置をリーダー目標として供給し続けることで、
// 指を押し続けるだけで群れが誘導され続ける（パスが尽きてアイドルに落ちない）。
let pointerWorldX = 0;
let pointerWorldY = 0;

const TRAIL_LIFETIME = 1.2;
const trailPoints    = [];

function addTrailPoint(sx, sy, now) {
  if (trailPoints.length >= 400) trailPoints.shift();
  trailPoints.push({ x: sx, y: sy, bornAt: now });
}

function inputStart(sx, sy, now) {
  // v0.6: ライン描画はプレイ中とステージクリア演出中のみ受け付ける。
  // タイトル/リザルトはDOMオーバーレイが操作を担う。
  // v0.6.1: 3択カード表示中もプレイ継続（カード領域外なら線が引ける）。
  if (gameState !== "playing" && gameState !== "stage-clear") {
    inputMode = "NONE";
    return;
  }
  if (sy >= viewH - bottomUIHeight) {
    inputMode = "UI";
    return;
  }
  inputMode = "DRAW";
  isDrawing = true;
  pathClear();
  const w = screenToWorld(sx, sy);
  pathPush(w.x, w.y);
  addTrailPoint(w.x, w.y, now);
  // 変更3: 指のワールド座標を保持（静止保持でも誘導継続するため）
  pointerWorldX = w.x;
  pointerWorldY = w.y;
  touchRing.active = true;
  touchRing.x = sx;
  touchRing.y = sy;
  hapticPulse(10);
}

function inputMove(sx, sy, now) {
  if (inputMode !== "DRAW") return;
  const w = screenToWorld(sx, sy);
  pathPush(w.x, w.y);
  addTrailPoint(w.x, w.y, now);
  // 変更3: 指が動いたときも最新ワールド座標を更新する
  pointerWorldX = w.x;
  pointerWorldY = w.y;
  touchRing.x = sx;
  touchRing.y = sy;
}

function inputEnd() {
  isDrawing = false;
  inputMode = "NONE";
  touchRing.active = false;
}

canvas.addEventListener("touchstart", (e) => {
  const t = e.touches[0];
  inputStart(t.clientX, t.clientY, performance.now());
  e.preventDefault();
}, { passive: false });

canvas.addEventListener("touchmove", (e) => {
  const t = e.touches[0];
  inputMove(t.clientX, t.clientY, performance.now());
  e.preventDefault();
}, { passive: false });

canvas.addEventListener("touchend", (e) => {
  // touches が残っている（マルチタッチの一本が離れただけ）は無視する。
  // e.touches.length === 0 のときのみ入力終了とする。
  if (e.touches.length === 0) { inputEnd(); }
  e.preventDefault();
}, { passive: false });
// touchcancel はスクロール防止 preventDefault の失敗時などに誤発火しやすい。
// isDrawing を切らず、そのまま巡航継続させる。
// ただし touches が完全に 0 になった場合は終了する（ハードウェア切断など）。
canvas.addEventListener("touchcancel", (e) => {
  if (e.touches.length === 0) { inputEnd(); }
  e.preventDefault();
}, { passive: false });

canvas.addEventListener("mousedown",  (e) => inputStart(e.clientX, e.clientY, performance.now()));
canvas.addEventListener("mousemove",  (e) => { if (isDrawing) inputMove(e.clientX, e.clientY, performance.now()); });
canvas.addEventListener("mouseup",    () => inputEnd());
canvas.addEventListener("mouseleave", () => inputEnd());

// -----------------------------------------------------------------
// アイドル旋回（ワールド座標でリーダーが徘徊）
// -----------------------------------------------------------------
let idleAngle = 0;
const IDLE_ANGULAR_SPEED = 0.35;

function getIdleLeaderTarget(dt) {
  idleAngle += IDLE_ANGULAR_SPEED * dt;
  const r = BASE_CFG.idleWanderRadius;
  const centroid = calcFriendlyCentroid();
  return {
    x: centroid.x + Math.cos(idleAngle) * r,
    y: centroid.y + Math.sin(idleAngle) * r * 0.6,
  };
}

// -----------------------------------------------------------------
// 自軍の重心（ワールド座標）
// -----------------------------------------------------------------
function calcFriendlyCentroid() {
  let cx = 0, cy = 0, count = 0;
  for (let i = 0; i < N; i++) {
    // 変更2: ダウン中は重心計算から除外（カメラ追従が薄まるフィードバックのため）
    if (boidDead[i] || boidDowned[i]) continue;
    cx += px[i];
    cy += py[i];
    count++;
  }
  if (count === 0) return { x: leader.x, y: leader.y };
  return { x: cx / count, y: cy / count };
}

// -----------------------------------------------------------------
// 消滅フェードタイマー更新 + 変更2: ダウンタイマー更新・復帰処理
// -----------------------------------------------------------------
function updateDeathTimers(dt) {
  for (let i = 0; i < N; i++) {
    // 既存: フェードアウトタイマー（ダウン開始直後のフェードアウト）
    if (boidFadeTimer[i] > 0) boidFadeTimer[i] = Math.max(0, boidFadeTimer[i] - dt);

    // 変更2: ダウンタイマーが進み、0になったら復帰開始
    if (boidDowned[i]) {
      boidDownTimer[i] = Math.max(0, boidDownTimer[i] - dt);
      if (boidDownTimer[i] <= 0 && boidReviveTimer[i] <= 0) {
        // 復帰開始: 群れの重心付近にフェードインで出現
        const centroid = calcFriendlyCentroid();
        const angle    = random() * Math.PI * 2;
        const scatter  = 40 + random() * 60;
        px[i] = centroid.x + Math.cos(angle) * scatter;
        py[i] = centroid.y + Math.sin(angle) * scatter;
        // 群れ平均速度に乗せる
        let avgVx = 0, avgVy = 0, cnt = 0;
        for (let j = 0; j < N; j++) {
          if (!boidDead[j] && !boidDowned[j]) { avgVx += vx[j]; avgVy += vy[j]; cnt++; }
        }
        if (cnt > 0) { avgVx /= cnt; avgVy /= cnt; }
        else { avgVx = mv().minSpeed; avgVy = 0; }
        vx[i] = avgVx + (random() - 0.5) * 30;
        vy[i] = avgVy + (random() - 0.5) * 30;
        // HP全回復・フラグリセット（v0.6: 硬鱗カード分も含めた実効最大HP。v0.22: 母竜は motherHp 込み）
        boidHp[i]          = effBoidMaxHpFor(i);
        boidDowned[i]      = 0;
        boidDead[i]        = 0;
        boidFadeTimer[i]   = 0;
        boidReviveTimer[i] = BOID_REVIVE_DURATION;
        // 尻尾角度履歴を現在の速度方向で初期化（NaN防止）
        const initAngle = Math.atan2(vy[i], vx[i]);
        const base = i * TAIL_SEGS;
        for (let s = 0; s < TAIL_SEGS; s++) boidAngleHistory[base + s] = initAngle;
      }
    }

    // 変更2: フェードイン復帰アニメタイマー
    if (boidReviveTimer[i] > 0) boidReviveTimer[i] = Math.max(0, boidReviveTimer[i] - dt);
  }
}

function applyDamageToBoid(boidIndex, damage) {
  // 変更2: ダウン中・すでに dead の場合は何もしない
  if (boidDead[boidIndex] || boidDowned[boidIndex]) return;
  if (debugInvincible) return;   // v0.44: デバッグ「竜を無敵」中は落ちない（敵の観察用）
  // v0.6: 「竜鱗共鳴」カードで被ダメージ軽減
  boidHp[boidIndex] -= damage * effDmgTakenMult();
  if (boidHp[boidIndex] <= 0) {
    // 変更2: 消滅ではなくダウン状態へ移行（恒久喪失なし）
    // v0.6: 「再生の潮」カードで復帰時間短縮
    boidDowned[boidIndex]    = 1;
    boidDownTimer[boidIndex] = BOID_DOWN_DURATION * effReviveMult();
    boidReviveTimer[boidIndex] = 0;
    // boidDead は立てない（dead=生存スロット外を意味するため）
    // フェードアウトは boidFadeTimer で表現する
    boidFadeTimer[boidIndex] = FADE_DURATION;
    boidHp[boidIndex]        = 0;
    // 変更2(追加): やられた瞬間に死亡FX（灰/暗赤）を出す。
    // 出現FX（金色・弾ける）と色味を明確に変えて「やられた」と認識させる。
    spawnDragonDownEffect(px[boidIndex], py[boidIndex]);
  }
}

// v0.6: 全滅チェック（checkGameConditions/triggerDefeat）は廃止。
// ダウンした竜は必ず復帰するためゲームオーバーは存在しない（仕様 §2.2）。

// -----------------------------------------------------------------
// Simulation step — 自軍Boids
// -----------------------------------------------------------------
const neighbours = [];

// v0.6: フレーム内で使い回す速度倍率キャッシュ（simStep 冒頭で更新）
let _simSpeedMult = 1;

// v0.37: 跳躍サイクルの共通時計（秒）。スローモー中は遅く進む＝群れと歩調が合う。
// 個体ごとの位相は BOID_FLAP_PHASE から作るので、個体別の配列は持たない。
let hopClock = 0;

// v0.37: 回り込み（orbitRadius）の回転方向。群れ全体で共有する（+1/-1）。
let _orbitSide = 1;
// 回転方向を切り替える角運動量のしきい値。0付近で毎フレーム反転しないための不感帯。
const ORBIT_SIDE_HYSTERESIS = 4000;
// 回り込み中の分離を外力チャネルへ流すときの加速度 px/s^2。
// 定常速度 = これ × 分離ベクトルの大きさ / KICK_DECAY_PER_SEC なので、
// 300 なら隣が1体で約50px/s の押し分けになる。
const ORBIT_SEP_KICK_ACCEL = 300;
// ---- v0.37.1: 線をそのままなぞる（pathTrace）ときの隊列 ----
// 線の上に「1行 PATH_TRACE_COLUMNS 機」の隊列を並べ、行ごとに後ろへずらす。
// 竜は線上のスロットではなく**その少し先（LOOKAHEAD）**を狙う＝純追尾。
// スロットそのものを狙うと、到達した瞬間に狙う向きが定まらず（距離0）その場で震える。
// 行間・列間は分離半径（BASE_CFG.separationRadius = 28）より広く取る。
// 狭いと隊列を組んだ瞬間に押し合って、線から横へ弾かれる。
// 列数は群れの数で決める：**少数のときほど細く**して線の上に重ねる（トレースが最も目に付く場面）。
// 増えたら横に広げる（1列で伸ばすと100体で1000px超の蛇になり、線より隊列の長さが目立つ）。
const PATH_TRACE_COLS_MIN  = 3;
const PATH_TRACE_COLS_MAX  = 7;
const PATH_TRACE_ROW_GAP   = 32;   // 行間（線に沿った距離 px）
const PATH_TRACE_LATERAL   = 32;   // 列間（線に垂直な距離 px）
const PATH_TRACE_LOOKAHEAD = 36;   // スロットからどれだけ先を狙うか px
const PATH_TRACE_SNAP_DIST = 70;   // リーダーがこの距離まで線に寄ったら弧長の追従に入る
// ---- v0.38: 矢印操作（controlScheme:"vector"）----
// なぞっている間は操縦しない。**離した瞬間に進路が確定**し、以後その向きへ突っ込み続ける。
// 曲がれない・止まれない群れを線でなぞらせると操作が破綻するので、
// 「approach vector を決めて突っ込む」爆撃機の動詞に置き換える。
const VECTOR_MIN_STROKE   = 26;   // これ未満のなぞりは「タップ」扱い（重心→触れた点を進路にする）
const VECTOR_COMMIT_FX    = 0.45; // 確定直後に矢印を強く光らせる時間（秒）
const VECTOR_BEARING_SHOW = 2.2;  // 確定後に進路矢印を出しておく時間（秒）。過ぎたら消える
const VECTOR_BEARING_FADE = 0.7;  // 消える前のフェード時間（秒）
const VECTOR_WALL_MARGIN  = 120;  // 世界の縁からこの距離で進路を壁沿いに寝かせる
const VECTOR_WALL_ESCAPE  = 0.3;  // 壁沿いに寝かせるとき外向きに混ぜる量（0=真横。縁に貼り付かないため）
const VECTOR_AIM_LEN      = 150;  // 照準中の矢印の長さ（px）
const VECTOR_BEARING_LEN  = 96;   // 確定後に出しっぱなしにする矢印の長さ（px）
const PATH_TRACE_IDLE_HOLD = 0.3;  // 弧が伸びないまま経った時間がこれを超えたら隊列を解いて操縦点へ戻る
// 輪を何列ぶんまで詰め込んでよいか。1=きれいな1本の輪だが群れが増えると輪が巨大化して
// 縦持ち390pxの画面から溢れる。3 なら 80体でも半径119px＝直径238pxに収まり、
// はみ出したぶんは分離（外力チャネル）が内外へ散らして自然な帯になる。
const ORBIT_RING_ROWS = 3;

function simStep(dt) {
  _simSpeedMult = effSpeedMult();
  hopClock += dt * _simSpeedMult;
  updateLeader(dt);

  // ヒットストップ中の個体は移動・加速を計算するが位置更新をスキップ
  // （速度ベクトルは維持することで停止後にスムーズに動き出す）
  const boidHitStopped = boidHitStopTimer; // 参照を短縮

  // 隊列を決める値は竜種共通（BASE_CFG）
  const perc = BASE_CFG.perception;
  const sepR = BASE_CFG.separationRadius;
  const wSep = BASE_CFG.wSeparation;
  const wAli = BASE_CFG.wAlignment;
  const wCoh = BASE_CFG.wCohesion;

  // v0.33: 動きの性格は竜種プロファイルから。ループ外で1回だけ引く。
  const prof     = mv();
  const maxSp    = prof.maxSpeed * _simSpeedMult;
  const minSp    = prof.minSpeed * _simSpeedMult;
  const wLead    = prof.leaderPull;
  const accelLim = prof.accel === INSTANT ? Infinity : prof.accel * _simSpeedMult;
  const turnLim  = prof.turnRate === INSTANT ? Infinity : prof.turnRate;
  // v0.37: 回り込み半径（0=無効）と跳躍サイクル。ループ外で1回だけ解決する。
  let   orbitR   = prof.orbitRadius;
  const hopPer   = prof.hopPeriod;

  // v0.37.1: 弧長トレース中は、竜は操縦点ではなく**線上の隊列スロット**を追う。
  // これで線の形がそのまま群れの軌跡になる（操縦点だけを追うと角の内側を突っ切る）。
  // 弧が伸びていない（指が止まった／末端に着いた）ときは隊列を解いて操縦点へ戻す。
  const traceActive = prof.pathTrace && pathLen > 1 && !pathEndReached && traceIdle < PATH_TRACE_IDLE_HOLD;
  let traceCols = PATH_TRACE_COLS_MIN;
  if (traceActive) {
    pathBuildCum();   // updateLeader と同じフレームだが、パス更新後に作り直す
    // 「1列あたり3行」くらいの塊になる列数。少数なら細く、増えたら横に広がる。
    traceCols = Math.round(Math.sqrt(countAliveBoids() / 3));
    if (traceCols < PATH_TRACE_COLS_MIN) traceCols = PATH_TRACE_COLS_MIN;
    else if (traceCols > PATH_TRACE_COLS_MAX) traceCols = PATH_TRACE_COLS_MAX;
  }

  // v0.37: 回り込みの向きは**群れ全体で1つ**にする。
  // 個体ごとに「今回っている向き」で決めると半数が逆回りになって正面衝突し、
  // 分離力と接線が毎フレーム争って激しく震える（実測: 1フレームあたり平均0.30rad・
  // 符号反転11回/秒）。群れの角運動量の符号で全員の回転方向を揃えると輪になって回る。
  if (orbitR > 0) {
    let angularMomentum = 0, aliveForOrbit = 0;
    for (let i = 0; i < N; i++) {
      if (boidDead[i] || boidDowned[i]) continue;
      const rx = px[i] - leader.x, ry = py[i] - leader.y;
      angularMomentum += rx * vy[i] - ry * vx[i];
      aliveForOrbit++;
    }
    // ヒステリシス: ほぼ0のときは前の向きを保つ（0付近でパタパタ反転させない）
    if (Math.abs(angularMomentum) > ORBIT_SIDE_HYSTERESIS) {
      _orbitSide = angularMomentum > 0 ? 1 : -1;
    }
    // 群れが増えたら輪を広げる。固定半径のままだと 40体で間隔10px＝重なって潰れる
    // （実測: 最近接4.5px）。ORBIT_RING_ROWS 列ぶんの詰め込みまでは許容して輪を太らせる。
    const needed = (aliveForOrbit * sepR) / (Math.PI * 2 * ORBIT_RING_ROWS);
    if (needed > orbitR) orbitR = needed;
  }
  const orbitSide = _orbitSide;

  gridClear();
  for (let i = 0; i < N; i++) {
    // 変更2: ダウン中の個体はグリッドに登録しない（他の個体の分離・整列計算対象外）
    if (!boidDead[i] && !boidDowned[i]) gridInsert(i, px[i], py[i], perc);
  }

  for (let i = 0; i < N; i++) {
    // 変更2: ダウン中も位置更新をスキップ（タイマーは updateDeathTimers で進む）
    if (boidDead[i] || boidDowned[i]) continue;

    // ヒットストップ中は物理更新を丸ごとスキップして速度・向きも凍結する。
    // 位置だけ止めて速度を積分し続けると向き(atan2)が毎フレーム振れて
    // 三角形がチラついて見えるため（ちらつき報告の原因）。
    if (boidHitStopped[i] > 0) continue;

    const perc2 = perc * perc;
    const sep2  = sepR * sepR;
    const xi = px[i], yi = py[i];

    let sepX = 0, sepY = 0;
    let aliX = 0, aliY = 0;
    let cohX = 0, cohY = 0;
    let nAli = 0, nCoh = 0, nSep = 0;

    gridQuery(xi, yi, perc, neighbours);
    for (let k = 0; k < neighbours.length; k++) {
      const j = neighbours[k];
      if (j === i || boidDead[j]) continue;
      const dx = xi - px[j], dy = yi - py[j];
      const d2 = dx * dx + dy * dy;
      if (d2 > perc2) continue;
      if (d2 === 0) {
        // v0.33.1: 完全に重なった場合。0除算を避けつつ**決定的な向き**へ押し分ける。
        // 従来は continue でスキップしていたため、重なると分離が一切効かず
        // 二度と離れられなかった（minSpeed=0 の竜種で20体が1点に団子になる原因）。
        const a = i * 2.399963 + j * 0.5;   // 黄金角ベースで方向を散らす
        sepX += Math.cos(a);
        sepY += Math.sin(a);
        nSep++;
        continue;
      }
      if (d2 < sep2) {
        const invD = 1 / Math.sqrt(d2);
        sepX += dx * invD;
        sepY += dy * invD;
        nSep++;
      }
      aliX += vx[j]; aliY += vy[j]; nAli++;
      cohX += px[j]; cohY += py[j]; nCoh++;
    }

    let ax = 0, ay = 0;
    ax += sepX * wSep * 80;
    ay += sepY * wSep * 80;

    if (nAli > 0) {
      const inv = 1 / nAli;
      ax += (aliX * inv - vx[i]) * wAli;
      ay += (aliY * inv - vy[i]) * wAli;
    }
    if (nCoh > 0) {
      const inv = 1 / nCoh;
      ax += (cohX * inv - xi) * wCoh;
      ay += (cohY * inv - yi) * wCoh;
    }

    // 追う点。通常は操縦点、弧長トレース中は線上の隊列スロット（の少し先）。
    let tgtX = leader.x, tgtY = leader.y;
    if (traceActive) {
      const row = (i / traceCols) | 0;
      const col = (i % traceCols) - (traceCols - 1) * 0.5;
      const slotArc = leaderArc - row * PATH_TRACE_ROW_GAP;
      // スロットそのものではなく LOOKAHEAD ぶん先を狙う（純追尾）。
      // 直接狙うと到達時に方向が定まらず震える。
      const p = pathPointAtArc(Math.max(0, slotArc + PATH_TRACE_LOOKAHEAD), _tracePtB);
      tgtX = p.x - p.ty * col * PATH_TRACE_LATERAL;   // 進行方向の法線へ列ぶんずらす
      tgtY = p.y + p.tx * col * PATH_TRACE_LATERAL;
    }

    // 目標への引力（方向のみ。距離減衰はなし）。単位ベクトルと距離は下でも使う。
    const ldx = tgtX - xi, ldy = tgtY - yi;
    const aDist = Math.sqrt(ldx * ldx + ldy * ldy) || 1;
    const leadNx = ldx / aDist, leadNy = ldy / aDist;

    // v0.37: 操縦点へ「まっすぐ寄る」か「回り込む」か。
    // 等速で止まれない竜（minSpeed===maxSpeed）は操縦点の上で往復して激しく震えるので、
    // orbitRadius の内側では**接線方向**へ舵を切って周回に落とす。
    // 半径のズレは半径方向成分で補正する（外なら内向き・内なら外向き）。
    // ※トレース中は回り込まない（隊列スロットの周りを回ったら線をなぞらなくなる）。
    let steerNx = leadNx, steerNy = leadNy;
    const orbiting = orbitR > 0 && !traceActive && aDist < orbitR * 2;
    if (orbiting) {
      const rxn = -leadNx, ryn = -leadNy;                  // 操縦点→竜（半径方向の外向き）
      const radialErr = Math.max(-1, Math.min(1, (aDist - orbitR) / orbitR));
      // 接線（群れ共通の回転方向）＋ 半径のズレを戻す成分（leadN＝内向き）
      const ox = -ryn * orbitSide + leadNx * radialErr;
      const oy =  rxn * orbitSide + leadNy * radialErr;
      const om = Math.sqrt(ox * ox + oy * oy) || 1;
      steerNx = ox / om; steerNy = oy / om;
    }

    ax += steerNx * wLead * 120;
    ay += steerNy * wLead * 120;

    // ---- v0.33: 「向き」と「速さ」を分けて積分する ----
    // 向きは turnRate、速さは accel で別々に制限するので、
    // 「小回りは利くが加速は鈍い」「即時方向転換（UFO）」を独立に表現できる。
    const curSpeed = Math.sqrt(vx[i] * vx[i] + vy[i] * vy[i]);
    const curAngle = curSpeed > 0.0001 ? Math.atan2(vy[i], vx[i]) : 0;

    // ---- v0.37: 跳躍（蛙型）----
    // サイクルの前半 hopFlightFrac が滞空、残りが着地。滞空中は**舵が効かない（弾道）**、
    // 着地中は turnRate で向きを合わせ直すだけでほとんど進まない。
    // 滞空中の速さを 1/hopFlightFrac 倍にするので、平均速度は maxSpeed に一致する。
    let hopAirborne = false, hopSpeedMul = 1;
    if (hopPer > 0) {
      const phase = ((hopClock + BOID_FLAP_PHASE[i] * HOP_PHASE_STAGGER * hopPer) % hopPer) / hopPer;
      hopAirborne = phase < prof.hopFlightFrac;
      hopSpeedMul = hopAirborne ? 1 / prof.hopFlightFrac : prof.hopGroundFrac;
      // 描画用の滞空度（0=着地, 1=跳躍の頂点）。sin で山なりにする。
      boidHopAir[i] = hopAirborne ? Math.sin((phase / prof.hopFlightFrac) * Math.PI) : 0;
    } else if (boidHopAir[i] !== 0) {
      boidHopAir[i] = 0;   // 跳ばない竜種へ切り替えた直後に浮いたままにしない
    }
    // 滞空中は旋回不能。着地中と通常の竜種は竜種の turnRate。
    const turnLimI = hopAirborne ? 0 : turnLim;

    // 行きたい向きの決定（v0.33.1 で作り直し）。2段構えにする。
    //
    // ① 物理項：現在の速度に操舵力を積んだ向き。分離・整列・結合はここで効く。
    //    **力の大きさがそのまま効く**ので、隣の竜との弱い押し合いでは向きがわずかしか動かない。
    //    （v0.33.0 は力の"向き"だけを見ていたため、弱い横力でも毎フレーム目標角が
    //      振れ、外周の個体が 5〜9Hz で左右に揺れる不具合になっていた）
    const tvx = vx[i] + ax * dt;
    const tvy = vy[i] + ay * dt;
    const naturalAngle = (tvx * tvx + tvy * tvy) > 0.0001 ? Math.atan2(tvy, tvx) : curAngle;

    // ② 操作項：リーダー（＝指）方向へのコース修正。
    //    誤差に比例した角速度（ゲイン TURN_GAIN）を作り turnRate で上限を掛ける。
    //    こうすると「大きく向きを変えるときだけ turnRate が効いて、
    //    仲間との小さなズレでは静か」になる＝旋回性能が実際に効くパラメータになる。
    //    リーダー方向を基準にするのが要点：操舵の合力を使うと分離・整列の弱い横力にも
    //    即応してしまい群れが高周波で震える（実測 45回/秒/体）。
    let err = Math.atan2(steerNy, steerNx) - naturalAngle;
    while (err >  Math.PI) err -= Math.PI * 2;
    while (err < -Math.PI) err += Math.PI * 2;

    let desiredAngle;
    if (turnLimI === Infinity) {
      if (orbiting || traceActive) {
        // v0.37: 回り込み・トレース中は**向きを分離で汚さない**。狙う方向だけを見る。
        // 代わりに分離は**外力チャネル（kick）へ回して位置で押し分ける**。
        // 分離を向きに混ぜたままだと、即時方向転換ゆえに隣とのわずかな押し合いが
        // そのまま毎フレームの方向転換になり、群れが増えるほど激しく震える
        // （実測 40体: 平均0.15rad/フレーム・符号反転17.5回/秒・急転回29%のフレーム）。
        desiredAngle = Math.atan2(steerNy, steerNx);
        if (nSep > 0) {
          boidKickX[i] += sepX * ORBIT_SEP_KICK_ACCEL * dt;
          boidKickY[i] += sepY * ORBIT_SEP_KICK_ACCEL * dt;
        }
      } else {
        // 即時方向転換（UFO型）: 操縦点方向へ即座に向く。
        // ただし**分離だけは合成する**。これを入れないと全個体が操縦点へ直行して
        // 1点に重なる（実測: 最近接距離 0.1px の団子になった）。
        // 整列・結合は入れない＝弱い横力に即応して高周波で震えるのを避ける。
        const gx = steerNx * wLead * 120 + sepX * wSep * 80;
        const gy = steerNy * wLead * 120 + sepY * wSep * 80;
        desiredAngle = (gx * gx + gy * gy) > 0.0001 ? Math.atan2(gy, gx) : naturalAngle;
      }
    } else {
      // 不感帯を差し引いた誤差に比例させる（小さなズレでは舵を当てない）
      let eMag = Math.abs(err) - TURN_DEADZONE;
      if (eMag < 0) eMag = 0;
      let rate = TURN_GAIN * eMag * Math.sign(err);
      if      (rate >  turnLimI) rate =  turnLimI;
      else if (rate < -turnLimI) rate = -turnLimI;
      let turnDelta = rate * dt;
      // 目標を追い越さない（追い越すと行き過ぎ→引き返しの振動になる）
      if (Math.abs(turnDelta) > Math.abs(err)) turnDelta = err;
      desiredAngle = naturalAngle + turnDelta;
    }

    // 望む速さ: 基本は最高速。リーダーに近いほど落として最低速に寄せる
    // ＝ minSpeed が 0 の竜種は操縦点の上でその場に留まれる。
    // minSpeed === maxSpeed の竜種（UFO）はこの減速が丸ごと無効になり**等速**になる。
    let desiredSpeed = maxSp * Math.min(1, aDist / BOID_ARRIVE_DIST);
    if (desiredSpeed < minSp) desiredSpeed = minSp;
    // v0.33.1: 近すぎる仲間がいるときは、操縦点の上でも最低限の速さを残して押し分ける。
    // これがないと minSpeed=0 の竜種（UFO型）が操縦点で完全停止し、全個体が1点に重なる。
    if (nSep > 0) {
      const sepFloor = maxSp * SEP_MIN_SPEED_FRAC;
      if (desiredSpeed < sepFloor) desiredSpeed = sepFloor;
    }
    // v0.37: 跳躍の速度エンベロープは**最後に掛ける**（分離の下限より優先）。
    // ここより前に掛けると着地中も分離の下限速度でずるずる進んで「静止」に見えない。
    if (hopPer > 0) desiredSpeed *= hopSpeedMul;

    // 旋回制限: 1ステップで turnRate*dt ラジアンまでしか向きを変えられない
    // （滞空中は turnLimI=0 ＝ 向きが固定される＝弾道飛行）
    let dAng = desiredAngle - curAngle;
    while (dAng >  Math.PI) dAng -= Math.PI * 2;
    while (dAng < -Math.PI) dAng += Math.PI * 2;
    const turnMax = turnLimI * dt;
    if      (dAng >  turnMax) dAng =  turnMax;
    else if (dAng < -turnMax) dAng = -turnMax;
    const newAngle = curAngle + dAng;

    // 加速制限: 速さの変化も accelLim*dt までに抑える
    let dSpd = desiredSpeed - curSpeed;
    const spdMax = accelLim * dt;
    if      (dSpd >  spdMax) dSpd =  spdMax;
    else if (dSpd < -spdMax) dSpd = -spdMax;
    const newSpeed = curSpeed + dSpd;

    const nvx = Math.cos(newAngle) * newSpeed;
    const nvy = Math.sin(newAngle) * newSpeed;
    vx[i] = nvx; vy[i] = nvy;

    // v0.34.1: 外力（反動・ノックバック）は操舵で作った速度に**足して位置に効かせる**。
    // vx/vy 自体には混ぜない＝次フレームの操舵計算を汚さないため。
    // 加算したあと指数減衰させるので「押されて、じわっと収まる」動きになる。
    let nx = xi + (nvx + boidKickX[i]) * dt;
    let ny = yi + (nvy + boidKickY[i]) * dt;
    const kickDecay = Math.exp(-KICK_DECAY_PER_SEC * dt);
    boidKickX[i] *= kickDecay;
    boidKickY[i] *= kickDecay;
    if (nx < 10)         { nx = 10;         vx[i] = Math.abs(vx[i]) * 0.5; boidKickX[i] = 0; }
    else if (nx > WORLD_W - 10) { nx = WORLD_W - 10; vx[i] = -Math.abs(vx[i]) * 0.5; boidKickX[i] = 0; }
    if (ny < 10)         { ny = 10;         vy[i] = Math.abs(vy[i]) * 0.5; boidKickY[i] = 0; }
    else if (ny > WORLD_H - 10) { ny = WORLD_H - 10; vy[i] = -Math.abs(vy[i]) * 0.5; boidKickY[i] = 0; }
    px[i] = nx; py[i] = ny;
  }
}

// -----------------------------------------------------------------
// v0.6-p3: 障害物押し出し（城壁・岩山・湖はドラゴン侵入不可）
// リーダー（指の軌跡）は壁を無視できるが、個体は物理的に堰き止められる。
// 押し出し距離は 障害物半径+5px（体当たり判定の半径+6px より内側）に置くことで、
// 壁面に押し付けられた竜が連続で壁をラミング攻撃できる＝ブリーチの手段になる。
// -----------------------------------------------------------------
const _obstacleQueryBuf = [];
const OBSTACLE_PUSH_GAP = 5;

function applyObstaclePushout() {
  for (let i = 0; i < N; i++) {
    if (boidDead[i] || boidDowned[i]) continue;

    // 地形（岩山）: 個数が少ないので全走査。
    // v0.17.1: 湖は単なる背景（当たり判定なし）にしたのでドラゴンは素通りできる
    for (const ob of terrainObstacles) {
      if (ob.type === "lake") continue;   // 湖はドラゴンが入れる（背景扱い）
      pushBoidOutOfCircle(i, ob.wx, ob.wy, ob.radius + OBSTACLE_PUSH_GAP);
    }

    // 城壁セグメント: 建物空間ハッシュから近傍のみ
    buildingGridQuery(px[i], py[i], _obstacleQueryBuf);
    for (const sIdx of _obstacleQueryBuf) {
      const s = settlements[sIdx];
      if (!s || s.fallen || !s._isWall) continue;
      pushBoidOutOfCircle(i, s.wx, s.wy, s.radius + OBSTACLE_PUSH_GAP);
    }
  }
}

/** 個体 i を円 (cx,cy,minDist) の外側へ押し出し、内向き速度成分を殺してスライドさせる。 */
function pushBoidOutOfCircle(i, cx, cy, minDist) {
  const dx = px[i] - cx;
  const dy = py[i] - cy;
  const d2 = dx * dx + dy * dy;
  if (d2 >= minDist * minDist || d2 === 0) return;
  const d  = Math.sqrt(d2);
  const nx = dx / d;
  const ny = dy / d;
  px[i] = cx + nx * minDist;
  py[i] = cy + ny * minDist;
  // 法線方向の内向き速度を除去 → 壁面に沿って滑る（渦を巻く絵になる）
  const vDotN = vx[i] * nx + vy[i] * ny;
  if (vDotN < 0) {
    vx[i] -= vDotN * nx;
    vy[i] -= vDotN * ny;
  }
}

// v0.32: 到達減速の半径。目標までの距離がこの値を下回ると距離に比例して減速し、
// 目標の上でなめらかに停止する（等速のまま突っ込むと通り過ぎ→引き返しの往復になる）。
const LEADER_ARRIVAL_DIST = 60; // px（パスの先読み半径 24px より大きく取る）

/**
 * v0.38: 矢印操作。**線の解釈と表示だけ**が新しく、リーダーの存在と群れの物理は従来のまま。
 *
 *  なぞっている間 … 操縦しない（群れは今の進路のまま飛び続ける）。始点→現在点で進路を予告。
 *  離した瞬間     … その向きに進路が確定し、以後リーダーはその向きへ進み続ける。
 *  タップ（短いなぞり）… 群れの重心から触れた点への向きを進路にする（タップを死に入力にしない）。
 *
 * リーダーは止まらないので、世界の縁では進路を壁沿いに寝かせる（潰れて団子にならないため）。
 */
/**
 * 進路が世界の縁へ向いているとき、**壁に沿う向きへ確定し直す**。
 * 沿う向きは今の進み方に近い方を選ぶ（真正面から当たった場合は上下/左右を速度で決める）。
 */
function deflectVectorBearingAtWall() {
  if (vectorBearing === null) return;
  let bx = Math.cos(vectorBearing), by = Math.sin(vectorBearing);
  let changed = false;
  // 左右の壁 → 上下（±Y）へ寝かせる
  if ((leader.x < VECTOR_WALL_MARGIN && bx < 0) || (leader.x > WORLD_W - VECTOR_WALL_MARGIN && bx > 0)) {
    const sign = Math.abs(by) > 0.05 ? Math.sign(by) : (Math.abs(leader.vy) > 1 ? Math.sign(leader.vy) : 1);
    // 真横ではなく少しだけ内側へ向ける＝縁に貼り付いて群れが世界の外へはみ出すのを防ぐ
    bx = (leader.x < VECTOR_WALL_MARGIN ? 1 : -1) * VECTOR_WALL_ESCAPE; by = sign; changed = true;
  }
  // 上下の壁 → 左右（±X）へ寝かせる
  if ((leader.y < VECTOR_WALL_MARGIN && by < 0) || (leader.y > WORLD_H - VECTOR_WALL_MARGIN && by > 0)) {
    const sign = Math.abs(bx) > 0.05 ? Math.sign(bx) : (Math.abs(leader.vx) > 1 ? Math.sign(leader.vx) : 1);
    by = (leader.y < VECTOR_WALL_MARGIN ? 1 : -1) * VECTOR_WALL_ESCAPE; bx = sign; changed = true;
  }
  if (changed) {
    const next = Math.atan2(by, bx);
    // 実際に向きが変わったときだけ矢印を出し直す（縁を沿って走っている間は出しっぱなしにしない）
    let d = next - vectorBearing;
    while (d >  Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    if (Math.abs(d) > 0.05) vectorShowTimer = VECTOR_BEARING_SHOW;
    vectorBearing = next;
  }
}

function updateLeaderVector(dt, speed) {
  if (vectorCommitFx  > 0) vectorCommitFx  = Math.max(0, vectorCommitFx - dt);
  if (vectorShowTimer > 0) vectorShowTimer = Math.max(0, vectorShowTimer - dt);

  if (isDrawing && pathLen > 0) {
    // 照準中。線は「始点 → 現在点」のベクトルとしてだけ読む（途中の形は使わない）。
    const a = pathGet(0), b = pathGet(pathLen - 1);
    const dx = b.x - a.x, dy = b.y - a.y;
    vectorAiming = true;
    if (dx * dx + dy * dy >= VECTOR_MIN_STROKE * VECTOR_MIN_STROKE) {
      vectorAimAngle = Math.atan2(dy, dx);
    } else {
      const c = calcFriendlyCentroid();          // タップ＝重心からその点へ
      const tx = b.x - c.x, ty = b.y - c.y;
      if (tx * tx + ty * ty > 1) vectorAimAngle = Math.atan2(ty, tx);
    }
  } else if (vectorAiming) {
    // 指を離した＝確定。パスは軌跡として使わないのでここで捨てる。
    vectorAiming    = false;
    vectorBearing   = vectorAimAngle;
    vectorCommitFx  = VECTOR_COMMIT_FX;
    vectorShowTimer = VECTOR_BEARING_SHOW;
    pathClear();
  }

  if (vectorBearing === null) {
    // まだ一度も指示されていない（ステージ開始直後）。従来どおり重心のまわりをウロウロ。
    const target = getIdleLeaderTarget(dt);
    leader.vx += ((target.x - leader.x) * 0.8 - leader.vx) * Math.min(1, dt * 2.0);
    leader.vy += ((target.y - leader.y) * 0.8 - leader.vy) * Math.min(1, dt * 2.0);
  } else {
    // 世界の縁：壁に突っ込む進路は**壁沿いへ寝かせて確定し直す**。
    // 成分を殺すだけだと、縁を出た瞬間に元の進路へ戻って壁際で往復し、
    // リーダーの速さが0を通る（実測 minSpeed 0）＝群れが縁でガタつく。
    // 進路そのものを書き換えれば「縁に当たったので縁沿いに走る」で安定し、矢印表示とも一致する。
    deflectVectorBearingAtWall();
    const bx = Math.cos(vectorBearing), by = Math.sin(vectorBearing);
    const k = Math.min(1, dt * 3);   // 進路変更はリーダー側でも少し粘らせる（唐突に折れない）
    leader.vx += (bx * speed - leader.vx) * k;
    leader.vy += (by * speed - leader.vy) * k;
  }

  leader.x += leader.vx * dt;
  leader.y += leader.vy * dt;
  leader.x = Math.max(0, Math.min(WORLD_W, leader.x));
  leader.y = Math.max(0, Math.min(WORLD_H, leader.y));
}

function updateLeader(dt) {
  // v0.6: 「疾風」カードでリーダー速度も伸びる（群れと感覚を揃える）
  // v0.33: 竜種プロファイルの leaderSpeed を使う（鈍重な竜は操縦点も遅い）
  const prof = mv();
  let speed = prof.leaderSpeed * _simSpeedMult;

  // v0.37: 跳躍する竜種は**操縦点も跳ぶ**。群れと同じ位相（stagger なし）で
  // 進む／止まるを繰り返すので、群れが操縦点に置いていかれない。
  // さらに hopPathSkip でパスの先読みを大きく取り、1回の跳躍でパスを数点ぶん飛ばす。
  const hopPer   = prof.hopPeriod;
  let   hopAhead = 0;
  if (hopPer > 0) {
    const phase = (hopClock % hopPer) / hopPer;
    speed *= (phase < prof.hopFlightFrac) ? (1 / prof.hopFlightFrac) : prof.hopGroundFrac;
    hopAhead = prof.hopPathSkip;
  }

  // ---- v0.38: 矢印操作（`controlScheme:"vector"` の竜種）----
  // 線を軌跡ではなく**向きの指定**として読む。指を離した瞬間に進路が確定する。
  if (prof.controlScheme === "vector") {
    updateLeaderVector(dt, speed);
    return;
  }

  // ---- v0.37.1: 弧長トレース（`pathTrace` の竜種）----
  // 「数点先へ操舵する」のをやめ、**線の上を弧長で進む**。角を丸めず線の形をそのまま描く。
  // 閉じた線は弧長を折り返して周回し続ける（アクアリウム柱を潰さない）。
  if (prof.pathTrace && pathLen > 1 && !pathEndReached) {
    const total = pathBuildCum();
    const closed = isPathClosed();
    const cur = pathPointAtArc(Math.min(leaderArc, total), _tracePtA);
    const gx = cur.x - leader.x, gy = cur.y - leader.y;
    const gd = Math.hypot(gx, gy);
    if (gd > PATH_TRACE_SNAP_DIST) {
      // まだ線に乗っていない（線から遠い所で描き始めた）。弧は進めず、線上の現在地へ寄る。
      const k = Math.min(1, dt * 10);
      leader.vx += ((gx / gd) * speed - leader.vx) * k;
      leader.vy += ((gy / gd) * speed - leader.vy) * k;
      leader.x += leader.vx * dt;
      leader.y += leader.vy * dt;
      traceIdle += dt;
    } else {
      const prevX = leader.x, prevY = leader.y;
      leaderArc += speed * dt;
      const atEnd = leaderArc >= total;
      if (closed && total > 1) leaderArc = leaderArc % total;
      else if (atEnd)          leaderArc = total;
      const q = pathPointAtArc(leaderArc, _tracePtA);
      leader.x = q.x; leader.y = q.y;
      // 見かけの速度（尻尾の向き・カメラ・末端旋回の初期方向に使う）。
      // 弧が飛んだフレームで暴れないよう speed で頭打ちにする。
      const mx = (leader.x - prevX) / dt, my = (leader.y - prevY) / dt;
      const mm = Math.hypot(mx, my);
      const cap = mm > speed ? speed / mm : 1;
      leader.vx = mx * cap; leader.vy = my * cap;
      // 指を止めて線の終端に着いたら隊列を解く（traceIdle）。離していれば pathEndMode へ移す。
      if (!closed && atEnd) {
        traceIdle += dt;
        if (!isDrawing) pathEndReached = true;
      } else {
        traceIdle = 0;
      }
    }
    leader.x = Math.max(0, Math.min(WORLD_W, leader.x));
    leader.y = Math.max(0, Math.min(WORLD_H, leader.y));
    return;
  }

  if (isDrawing) {
    // ---- 追従モード（v0.32: 巡航操舵を廃止して「指へ向かう、着いたら止まる」に単純化）----
    // 旧実装は指に到達すると指を見るのをやめて直進し続けたため、
    // 押さえっぱなしで操縦点が画面外まで逃げていた。指を常に操縦点にする。

    // v0.32: 指のワールド座標を毎フレーム解決し直す。
    // カメラは群れを追って動くので、押した瞬間の値のままだと
    // 「画面のここを押さえている」が指すワールド点がずれていく。
    if (touchRing.active) {
      const pw = screenToWorld(touchRing.x, touchRing.y);
      pointerWorldX = pw.x;
      pointerWorldY = pw.y;
    }

    // 目標点を決める: 描いた軌跡（パス）が残っていればそのウェイポイントを追従、
    // 消費しきったら指の現在位置。
    let tx = pointerWorldX, ty = pointerWorldY;
    if (pathLen > 0) {
      if (leaderPathConsumeIdx >= pathLen) leaderPathConsumeIdx = pathLen - 1;
      // 進行はリーダーに「最も近い未消費ウェイポイント」まで進める。
      // こうするとコーナーを突っ切って各ウェイポイント半径に入らなくても消費が進み、
      // 「線の最初しか追わずインデックスが止まる」問題を防げる。
      // 自己交差で遠くへ飛ばないよう前方の探索窓を限定する。
      const SCAN_AHEAD = 40;
      const scanEnd = Math.min(pathLen - 1, leaderPathConsumeIdx + SCAN_AHEAD);
      let bestIdx = leaderPathConsumeIdx, bestD2 = Infinity;
      for (let k = leaderPathConsumeIdx; k <= scanEnd; k++) {
        const p = pathGet(k);
        const ex = p.x - leader.x, ey = p.y - leader.y;
        const e2 = ex * ex + ey * ey;
        if (e2 < bestD2) { bestD2 = e2; bestIdx = k; }
      }
      if (bestIdx > leaderPathConsumeIdx) leaderPathConsumeIdx = bestIdx; // 戻らない
      // 末尾インデックスに達するまではパスを追従（弧などをなぞる）。
      // 末尾に達したらパス追従を終え、指の現在位置へ向かう。
      // ここで pathClear はしない＝指を離した後のループ追従（円を描いて離すと周回）のため保持。
      if (leaderPathConsumeIdx < pathLen - 1) {
        // 最近傍より少し先（lookahead +2）を目標にして弧へ早めに舵を切る。
        // v0.37: 跳躍する竜種は hopPathSkip ぶん先を見る＝1回の跳躍でパスを飛ばして処理する。
        const aimIdx = Math.min(leaderPathConsumeIdx + (hopAhead > 0 ? hopAhead : 2), pathLen - 1);
        const atgt = pathGet(aimIdx);
        tx = atgt.x; ty = atgt.y;
      }
    }

    // 目標へ向かうだけ。LEADER_ARRIVAL_DIST の内側では距離に比例して減速し、
    // 目標の上で停止する（指を止めれば止まる＝指が常に操縦点）。
    const dx = tx - leader.x, dy = ty - leader.y;
    const d  = Math.sqrt(dx * dx + dy * dy) || 1;
    const desired = speed * Math.min(1, d / LEADER_ARRIVAL_DIST);
    const nx = dx / d, ny = dy / d;
    const k  = Math.min(1, dt * 10); // 機敏な操舵
    leader.vx += (nx * desired - leader.vx) * k;
    leader.vy += (ny * desired - leader.vy) * k;
  } else if (pathLen > 2 && !pathEndReached) {
    // ---- パス追従モード（指を離した後）----
    // 最近傍ウェイポイントを全走査で求め、数点先を目標に全速で追う。
    let ni = 0, nd = Infinity;
    for (let k = 0; k < pathLen; k++) {
      const p = pathGet(k);
      const ex = p.x - leader.x, ey = p.y - leader.y;
      const e2 = ex * ex + ey * ey;
      if (e2 < nd) { nd = e2; ni = k; }
    }

    // v0.33: 閉じた線（円など）は従来どおり周回し続ける＝放置して眺められる。
    // 開いた線は末尾で折り返さず、終端に着いたら竜種の pathEndMode へ移す
    // （旧実装は開いた線でも (ni+3)%pathLen で先頭へ飛び、終端付近で
    //   「前へ進む／先頭へ戻る」が拮抗してリーダーが停止していた）。
    // v0.37: 跳躍する竜種は hopPathSkip ぶん先読みして、パスを数点ずつ飛ばして進む。
    const lookAhead = hopAhead > 0 ? hopAhead : 3;
    let aimIdx;
    if (isPathClosed()) {
      aimIdx = (ni + lookAhead) % pathLen;
    } else {
      aimIdx = ni + lookAhead;
      if (aimIdx >= pathLen) {
        aimIdx = pathLen - 1;
        const last = pathGet(pathLen - 1);
        const ex = last.x - leader.x, ey = last.y - leader.y;
        if (ex * ex + ey * ey < PATH_END_REACH_DIST * PATH_END_REACH_DIST) pathEndReached = true;
      }
    }

    const aim = pathGet(aimIdx);
    const dx = aim.x - leader.x, dy = aim.y - leader.y;
    const d  = Math.sqrt(dx * dx + dy * dy) || 1;
    const nx = dx / d, ny = dy / d;
    const k  = Math.min(1, dt * 6);
    leader.vx += (nx * speed - leader.vx) * k;
    leader.vy += (ny * speed - leader.vy) * k;
  } else {
    // ---- パス末端に到達した後、またはパスが無いとき ----
    // v0.33: 竜種の pathEndMode で挙動を変える。パスが無い（ステージ開始直後など）は常にウロウロ。
    // "loop" の竜種が開いた線を引いた場合もここに来る＝ウロウロに落ち着く。
    const mode = (pathLen > 2 && pathEndReached) ? prof.pathEndMode : "wander";

    if (mode === "orbit") {
      // v0.37: パスの終端を中心に一定半径で旋回し続ける（等速で止まれない竜用）。
      // 中心はパス末尾の点そのものなので**状態を持たない**（リロードや再計算で揺れない）。
      // 回る向きは「いま向いている向き」から決めるので、旋回に入っても反転しない。
      const c  = pathGet(pathLen - 1);
      const R  = prof.orbitRadius > 0 ? prof.orbitRadius : PATH_END_ORBIT_RADIUS;
      const rx = leader.x - c.x, ry = leader.y - c.y;
      const rd = Math.sqrt(rx * rx + ry * ry);
      // 中心→リーダーの単位ベクトル。**中心にちょうど乗っている場合は方向が決まらない**ので
      // 進行方向で代用する（弧長トレースの竜は終端の点に正確に着くので必ずここを通る）。
      let ux, uy;
      if (rd > 0.5) {
        ux = rx / rd; uy = ry / rd;
      } else {
        const lsp = Math.hypot(leader.vx, leader.vy);
        if (lsp > 1) { ux = leader.vx / lsp; uy = leader.vy / lsp; }
        else         { ux = 1; uy = 0; }
      }
      const side = (leader.vx * -uy + leader.vy * ux) >= 0 ? 1 : -1;
      // 接線（周回方向）＋ 半径のズレを戻す成分
      const radialErr = Math.max(-1, Math.min(1, (rd - R) / R));
      const tx2 = -uy * side - ux * radialErr;
      const ty2 =  ux * side - uy * radialErr;
      const tm  = Math.sqrt(tx2 * tx2 + ty2 * ty2) || 1;
      const k   = Math.min(1, dt * 4);
      leader.vx += ((tx2 / tm) * speed - leader.vx) * k;
      leader.vy += ((ty2 / tm) * speed - leader.vy) * k;
    } else if (mode === "straight") {
      // 今の向きへ直進し続ける。速さは leaderSpeed に寄せる。
      const sp = Math.sqrt(leader.vx * leader.vx + leader.vy * leader.vy);
      if (sp > 1) {
        const k = Math.min(1, dt * 3);
        leader.vx += ((leader.vx / sp) * speed - leader.vx) * k;
        leader.vy += ((leader.vy / sp) * speed - leader.vy) * k;
      } else {
        pathEndReached = false;   // 向きが決まらない（停止状態）ならパス追従へ戻す
      }
    } else if (mode === "stop") {
      // 減速してその場に留まる（群れは最低速度で周囲を漂う）
      const k = Math.min(1, dt * 4);
      leader.vx += (0 - leader.vx) * k;
      leader.vy += (0 - leader.vy) * k;
    } else {
      // "wander"（と開いた線の "loop"）: 群れ重心のまわりをウロウロ
      const target = getIdleLeaderTarget(dt);
      leader.vx += ((target.x - leader.x) * 0.8 - leader.vx) * Math.min(1, dt * 2.0);
      leader.vy += ((target.y - leader.y) * 0.8 - leader.vy) * Math.min(1, dt * 2.0);
    }
  }

  leader.x += leader.vx * dt;
  leader.y += leader.vy * dt;
  leader.x = Math.max(0, Math.min(WORLD_W, leader.x));
  leader.y = Math.max(0, Math.min(WORLD_H, leader.y));
}
