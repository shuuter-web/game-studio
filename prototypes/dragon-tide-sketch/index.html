// -----------------------------------------------------------------
// 時代（フレーバー）と 動員段階（強化）— v0.56 で分離
// -----------------------------------------------------------------
// v0.51〜v0.55 は「壊すほど文明が時代を進める」構成だったが、1ランの中で
// 石器の街が神殿になり城塞になる、というのは世界の理屈として無理があった。
//
// そこで**時代は1ランを通して固定のフレーバー**に戻し、
// 「ラン中に敵が強くなる」ぶんは **動員段階（mobilization tier）** という
// 別の軸に分けた。時代が決めるのは見た目・建築・敵の顔ぶれ・兵器の種類で、
// 段階が決めるのは強さ（HP・火力）と物量だけ。両者は互いに独立している。
//
//   時代 runEra    … ラン開始時に選ぶ。ラン中ずっと変わらない（currentStage と同値）
//   段階 powerTier … 0..TIERS_PER_RUN-1。破壊率で上がる。強さと物量だけが変わる
const TIERS_PER_RUN = 4;

// その段階で建っていた破壊対象を何割落としたら次の段階へ上がるか。
const TIER_ADVANCE_RATIO = 0.3;

// 段階が上がるとき、廃墟のうちどれだけが再建されるか。
// これが無いと段階が進むほどマップが空になり、後半ほど手応えが薄くなる。
const TIER_REBUILD_RATIO = 0.3;

// 段階ごとの群れ上限（effFlockCap への係数）。
// 群れは段階をまたいでも削らない代わりに、天井が段階的に開く＝解放の快感にする。
const TIER_FLOCK_CAP_FRACTION = [0.55, 0.70, 0.85, 1.0];

// 動員段階ごとの強さ倍率。**時代とは独立した純粋な強さの軸**。
// 建物の見た目（建築・色の系統）はこの段階では変わらない。
const POWER_TIER_BOOST = [
  { hp: 1.00, dmg: 1.00 },   // 段階1 平時
  { hp: 1.35, dmg: 1.20 },   // 段階2 動員
  { hp: 1.80, dmg: 1.45 },   // 段階3 総力戦
  { hp: 2.40, dmg: 1.75 },   // 段階4 決戦
];
const TIER_NAMES = ["平時", "動員", "総力戦", "決戦"];

// 段階が上がると動く敵の部隊数も増える。
// 顔ぶれは時代で決まっているので変わらない——増えるのは部隊の数だけ。
const TIER_MOVER_MULT = [1.0, 1.3, 1.6, 2.0];

// 段階が上がるほど建物の色を締める（同じ建築のまま「補強された」ことを見せる）。
// 建て替えではないので形は変わらない。段階ごとの暗さの差。
const TIER_SHADE_STEP = -10;

// 最初から最大段階で立っている陣営（Shooter指示: ボス直行を道中で止める）。
const TOWN_TIER_ADVANCED   = 1;     // 一部の街は1段階先
const TOWN_ADVANCED_RATIO  = 0.25;
// 首都は最大段階のさらに上。ランの「壁」として動かない。
const CAPITAL_POWER_MULT   = 2.6;

/** 動員段階を範囲に収める。 */
function clampTier(tier) {
  return Math.max(0, Math.min(POWER_TIER_BOOST.length - 1, tier));
}
/** 時代番号を STAGE_CONFIGS の範囲に収める。 */
function clampEra(eraIdx) {
  return Math.max(0, Math.min(STAGE_CONFIGS.length - 1, eraIdx));
}
/** 最大段階（要塞・首都はここに固定される）。 */
function maxPowerTier() { return POWER_TIER_BOOST.length - 1; }

/**
 * その建物の動員段階。
 * `_fixedTier` を持つ建物（首都区画・要塞都市）はラン中ずっとその段階に固定。
 * それ以外はラン進行＋その街のオフセット。
 */
function settlementTier(settlement, baseTier) {
  if (settlement._fixedTier != null) return clampTier(settlement._fixedTier);
  return clampTier(baseTier + (settlement._tierOffset || 0));
}

/** その建物に掛かる強さ倍率（時代の底上げ × 動員段階）。 */
function settlementPowerBoost(settlement, baseTier) {
  const eraBoost  = STAGE_DIFFICULTY_BOOST[currentStage] || { hp: 1, dmg: 1 };
  const tierBoost = POWER_TIER_BOOST[settlementTier(settlement, baseTier)];
  return { hp: eraBoost.hp * tierBoost.hp, dmg: eraBoost.dmg * tierBoost.dmg };
}

// -----------------------------------------------------------------
// 攻め込む文明（＝ランの時代）— v0.56
// -----------------------------------------------------------------
// v0.55 までは「連続4時代を通る大陸」を5種類から選ぶ形だったが、
// 時代がラン中に進まなくなったので、選ぶのは素直に**どの文明に攻め込むか**。
// STAGE_CONFIGS の8文明がそのまま8つの選択肢になる。
// 後ろの文明ほど建物も敵も強く、兵器も増える。解放は順送り。
const CONTINENT_DEFS = STAGE_CONFIGS.map((cfg, i) => ({
  era: i, name: cfg.name, subtitle: cfg.subtitle,
}));
const CONTINENT_NUMERALS = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII"];

/** 解放済みの文明数（1以上）。 */
function unlockedContinentCount() {
  const n = (profile && profile.unlockedContinents) | 0;
  return Math.max(1, Math.min(CONTINENT_DEFS.length, n));
}

/** 文明をクリアしたら次を解放する。 */
function unlockNextContinent(clearedEra) {
  const idx = CONTINENT_DEFS.findIndex(c => c.era === clearedEra);
  if (idx < 0) return false;
  if (profile.unlockedContinents > idx + 1) return false;   // すでに先まで解放済み
  if (idx + 1 >= CONTINENT_DEFS.length) return false;       // 最後には次が無い
  profile.unlockedContinents = idx + 2;
  return true;
}

let runEra                = 0;   // このランの時代（タイトルで選ぶ。ラン中ずっと固定）
let powerTier             = 0;   // 動員段階 0..TIERS_PER_RUN-1（破壊率で上がる）
let tierStartDestructible = 0;   // その段階の開始時に建っていた破壊対象の数（比率の分母）

/** 最大段階（これ以上は上がらない）か。 */
function isFinalTier() { return powerTier >= TIERS_PER_RUN - 1; }

// 旧 API 互換（HUD・セーブが参照する）。1ランの長さは段階数で数える。
function runStageCount() { return TIERS_PER_RUN; }

// -----------------------------------------------------------------
// Canvas セットアップ
// -----------------------------------------------------------------
const canvas = document.getElementById("stage");
// desynchronized:true は低レイテンシ描画パスを使うが、毎フレーム全画面を
// 再描画する本作ではダブルバッファを経由せず未完成フレームが表示され、
// 動的要素が点滅して見える。安定した合成のため無効化する。
const ctx = canvas.getContext("2d", { alpha: false });

const minimapCanvas = document.getElementById("minimap");
const minimapCtx = minimapCanvas.getContext("2d");

// -----------------------------------------------------------------
// 静的レイヤー（地面 / 建物）— タイル化オフスクリーンキャンバス
// -----------------------------------------------------------------
// v0.49: ワールド全面のキャンバス2枚をやめ、LAYER_TILE 角のタイルに分割して
// 「見えている範囲だけ」保持する方式に変えた。
//
// 経緯: 4800×3600 の全面キャンバスは 17.3Mpx × RGBA ≒ 69MB で、2枚で約138MB。
// iOS Safari の canvas 面積上限（約16.7Mpx）を既に超えかけている。大陸化で
// 面積を4倍にすると2枚で約553MB になりモバイルで確実に落ちるため、
// ワールドを広げる前提としてここをタイル化する。
//
// 各タイルの ctx には translate(-tileX, -tileY) を掛けてあるので、
// 既存の「ワールド座標で描く」描画関数をそのまま呼べる。タイルの外に出た分は
// キャンバス境界で自動的にクリップされる。
//
// v0.11.3 からの「地面と建物を別キャンバスに分ける」方針は維持している。
// 建物破壊時の部分クリアが道路・畑・川を巻き込んで消す不具合の根本対策のため、
// ここを1枚に戻してはいけない。
const LAYER_TILE         = 1200;   // WORLD_W/H の約数にしておくと端に無駄が出ない
const LAYER_PAINT_MARGIN = 300;    // 可視範囲をこれだけ広げた範囲まで先に焼く
const LAYER_KEEP_MARGIN  = 1500;   // これを超えて離れたタイルは破棄してメモリを返す

let buildingLayerDirty  = true;

let groundTiledLayer   = null;
let buildingTiledLayer = null;

/**
 * タイル化レイヤーを作る。
 * @param {string}   name  デバッグ表示用の名前
 * @param {Function} paint (tileCtx, bounds) を受け取り、その範囲を描く関数。
 *                         bounds は {x0,y0,x1,y1}（ワールド座標）。
 */
function makeTiledLayer(name, paint) {
  return {
    name,
    paint,
    cols:  Math.ceil(WORLD_W / LAYER_TILE),
    rows:  Math.ceil(WORLD_H / LAYER_TILE),
    tiles: new Map(),   // key = row * cols + col → { canvas, ctx, col, row, x, y }
  };
}

function createBuildingLayer() {
  groundTiledLayer   = makeTiledLayer("ground",   paintGroundTile);
  buildingTiledLayer = makeTiledLayer("building", paintBuildingTile);
  buildingLayerDirty = true;
}

/** 円（中心＋半径）がタイル範囲に掛かるか。bounds 未指定なら常に true（全面描画用）。 */
function layerBoundsHitCircle(bounds, wx, wy, radius) {
  if (!bounds) return true;
  return wx + radius >= bounds.x0 && wx - radius <= bounds.x1 &&
         wy + radius >= bounds.y0 && wy - radius <= bounds.y1;
}

/** 現在の可視ワールド矩形を margin ぶん広げて返す。 */
function viewWorldRect(margin) {
  const halfW = viewW * 0.5 / cam.scale;
  const halfH = viewH * 0.5 / cam.scale;
  return {
    x0: cam.x - halfW - margin, y0: cam.y - halfH - margin,
    x1: cam.x + halfW + margin, y1: cam.y + halfH + margin,
  };
}

/** 指定タイルを用意する（無ければ生成して焼く）。 */
function acquireLayerTile(layer, col, row) {
  const key = row * layer.cols + col;
  const cached = layer.tiles.get(key);
  if (cached) return cached;

  const tileCanvas = document.createElement("canvas");
  tileCanvas.width  = LAYER_TILE;
  tileCanvas.height = LAYER_TILE;
  const tileCtx = tileCanvas.getContext("2d");

  const x = col * LAYER_TILE;
  const y = row * LAYER_TILE;
  // ワールド座標のまま描けるように原点をタイル左上へずらす
  tileCtx.setTransform(1, 0, 0, 1, -x, -y);

  const tile = { canvas: tileCanvas, ctx: tileCtx, col, row, x, y };
  layer.tiles.set(key, tile);
  layer.paint(tileCtx, { x0: x, y0: y, x1: x + LAYER_TILE, y1: y + LAYER_TILE });
  return tile;
}

/** 矩形に掛かるタイルの範囲（列・行のインデックス）を返す。 */
function layerTileRange(layer, x0, y0, x1, y1) {
  return {
    c0: Math.max(0, Math.min(layer.cols - 1, Math.floor(x0 / LAYER_TILE))),
    c1: Math.max(0, Math.min(layer.cols - 1, Math.floor(x1 / LAYER_TILE))),
    r0: Math.max(0, Math.min(layer.rows - 1, Math.floor(y0 / LAYER_TILE))),
    r1: Math.max(0, Math.min(layer.rows - 1, Math.floor(y1 / LAYER_TILE))),
  };
}

/** 矩形に掛かる「既に生成済みの」タイルだけを走査する（部分クリア・部分再描画用）。 */
function forEachLayerTileOverlapping(layer, x0, y0, x1, y1, fn) {
  if (!layer) return;
  const r = layerTileRange(layer, x0, y0, x1, y1);
  for (let row = r.r0; row <= r.r1; row++) {
    for (let col = r.c0; col <= r.c1; col++) {
      // 未生成のタイルは触らない。後で焼かれるときに最新状態で描かれる。
      const tile = layer.tiles.get(row * layer.cols + col);
      if (tile) fn(tile);
    }
  }
}

/** レイヤー全体を無効化する（次の描画で可視範囲から焼き直される）。 */
function invalidateTiledLayer(layer) {
  if (!layer) return;
  for (const tile of layer.tiles.values()) {
    // width=0 でバックストアを即座に解放する（Map から消すだけでは GC 任せになる）
    tile.canvas.width  = 0;
    tile.canvas.height = 0;
  }
  layer.tiles.clear();
}

/**
 * 生成済みのタイルを「キャンバスを使い回したまま」焼き直す。
 *
 * invalidateTiledLayer との違いは、キャンバスを捨てないこと。時代遷移のように
 * 「同じ場所を別の見た目で描き直す」ときは、捨てて作り直すと 1200×1200 の
 * キャンバス確保がタイル枚数ぶん走り、遷移の瞬間に数十msのヒッチになる。
 * 大陸そのものが変わる（＝可視範囲も変わる）ときは invalidate 側を使う。
 */
function repaintTiledLayer(layer) {
  if (!layer) return;
  for (const tile of layer.tiles.values()) {
    layer.paint(tile.ctx, {
      x0: tile.x, y0: tile.y,
      x1: tile.x + LAYER_TILE, y1: tile.y + LAYER_TILE,
    });
  }
}

/** 可視範囲のタイルを用意し、遠く離れたタイルを破棄する。描画の直前に呼ぶ。 */
function updateTiledLayer(layer) {
  if (!layer) return;

  const paintRect = viewWorldRect(LAYER_PAINT_MARGIN);
  const range = layerTileRange(layer, paintRect.x0, paintRect.y0, paintRect.x1, paintRect.y1);
  for (let row = range.r0; row <= range.r1; row++) {
    for (let col = range.c0; col <= range.c1; col++) acquireLayerTile(layer, col, row);
  }

  const keepRect = viewWorldRect(LAYER_KEEP_MARGIN);
  for (const [key, tile] of layer.tiles) {
    if (tile.x + LAYER_TILE < keepRect.x0 || tile.x > keepRect.x1 ||
        tile.y + LAYER_TILE < keepRect.y0 || tile.y > keepRect.y1) {
      tile.canvas.width  = 0;
      tile.canvas.height = 0;
      layer.tiles.delete(key);
    }
  }
}

/**
 * タイルをメインキャンバスへ転送する。
 *
 * 転送先はスクリーン座標で整数に丸める。ワールド変換のまま drawImage すると
 * 隣り合うタイルの境界が非整数ピクセルに落ち、リサンプルの取りこぼしで
 * 継ぎ目が1本の線として見えてしまう。左右の端を同じ丸め方で求めれば
 * 隣接タイルは必ず同じ整数境界を共有し、隙間も二重描画も出ない。
 */
function drawTiledLayer(targetCtx, layer) {
  if (!layer) return;
  const m = targetCtx.getTransform();   // 回転は掛けていないので a/d/e/f だけ見ればよい
  const view = viewWorldRect(0);

  targetCtx.save();
  targetCtx.setTransform(1, 0, 0, 1, 0, 0);
  for (const tile of layer.tiles.values()) {
    if (tile.x + LAYER_TILE < view.x0 || tile.x > view.x1 ||
        tile.y + LAYER_TILE < view.y0 || tile.y > view.y1) continue;
    const sx0 = Math.round(m.a * tile.x + m.e);
    const sy0 = Math.round(m.d * tile.y + m.f);
    const sx1 = Math.round(m.a * (tile.x + LAYER_TILE) + m.e);
    const sy1 = Math.round(m.d * (tile.y + LAYER_TILE) + m.f);
    targetCtx.drawImage(tile.canvas, sx0, sy0, sx1 - sx0, sy1 - sy0);
  }
  targetCtx.restore();
}

let viewW = 0, viewH = 0, dpr = 1;
let bottomUIHeight = 0;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  viewW = window.innerWidth;
  viewH = window.innerHeight;
  // 隊形ボタンを撤廃したため UI 領域は 0 — 画面全体が線描画エリア
  bottomUIHeight = 0;
  canvas.width  = Math.floor(viewW * dpr);
  canvas.height = Math.floor(viewH * dpr);
  canvas.style.width  = viewW + "px";
  canvas.style.height = viewH + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", resize);
resize();

// -----------------------------------------------------------------
// カメラ（ワールド座標系でのカメラ中心＋ズームスケール）
// -----------------------------------------------------------------
// ドラゴンの見た目が良くなった（胴体・翼分離）ことで、開始直後はズームインして
// 竜をアップで見せ、卵を回収して群れが増えるほどカメラが引いていく、という
// 「塊魂」的な規模のエスカレーション演出を復活させる。
// BOIDS_INITIAL(10匹)で最もズームイン、群れ上限（effFlockCap）で最大ズームアウト。
const CAM_SCALE_MIN_COUNT = 1.15; // BOIDS_INITIAL 時のスケール（アップ）
const CAM_SCALE_MAX_COUNT = 0.6;  // 群れ上限時のスケール（従来の最大引き量）
const cam = { x: 400, y: WORLD_H / 2, scale: CAM_SCALE_MIN_COUNT };

// 有効個体数から目標ズームスケールを算出する。
// BOIDS_INITIAL〜effFlockCap() の範囲で線形補間し、範囲外はクランプする。
// v0.6: 上限は「大繁殖」カードで動的に増えるため effFlockCap() を参照する。
function calcTargetCamScale(aliveCount) {
  const t = (aliveCount - BOIDS_INITIAL) / (effFlockCap() - BOIDS_INITIAL);
  const tc = Math.max(0, Math.min(1, t));
  return CAM_SCALE_MIN_COUNT + (CAM_SCALE_MAX_COUNT - CAM_SCALE_MIN_COUNT) * tc;
}

function worldToScreen(wx, wy) {
  return {
    x: (wx - cam.x) * cam.scale + viewW * 0.5,
    y: (wy - cam.y) * cam.scale + viewH * 0.5,
  };
}

function screenToWorld(sx, sy) {
  return {
    x: (sx - viewW * 0.5) / cam.scale + cam.x,
    y: (sy - viewH * 0.5) / cam.scale + cam.y,
  };
}

function updateCamera(dt) {
  const centroid = calcFriendlyCentroid();
  const lerpFactor = 0.08;
  cam.x += (centroid.x - cam.x) * lerpFactor;
  cam.y += (centroid.y - cam.y) * lerpFactor;

  // ズームスケール: 有効ワールド表示範囲をスケールで除した値でクランプする
  // scale が小さいほど広い範囲が見えるため、境界余白はスケールを考慮する
  const halfW = viewW * 0.5 / cam.scale;
  const halfH = viewH * 0.5 / cam.scale;
  cam.x = Math.max(halfW, Math.min(WORLD_W - halfW, cam.x));
  cam.y = Math.max(halfH, Math.min(WORLD_H - halfH, cam.y));

  // 群れ生存数に応じてスケールをなめらかに変化させる（lerpで追従）
  const aliveCount = countAliveBoids();
  const targetScale = calcTargetCamScale(aliveCount);
  cam.scale += (targetScale - cam.scale) * Math.min(1, dt * 1.5);
}

// -----------------------------------------------------------------
// 集落（建物）の動的生成 — 街区（ブロック）方式
// -----------------------------------------------------------------
let settlements = [];

function randRange(min, max) {
  return min + random() * (max - min);
}

function randInt(min, max) {
  return min + Math.floor(random() * (max - min + 1));
}

function randChoice(array) {
  return array[Math.floor(random() * array.length)];
}

function dist2(ax, ay, bx, by) {
  const dx = ax - bx, dy = ay - by;
  return dx * dx + dy * dy;
}

/**
 * 町の中心座標を均等にマップへ配置（グリッドジッター法）。
 *
 * bossWx/bossWy が渡されたとき、その周囲 CAPITAL_EXCLUSION_RADIUS 以内の
 * グリッドセルを除外して小集落クラスタが首都要塞と重ならないようにする。
 * 除外されたセルは最大3回まで再抽選し、それでも回避できない場合はスキップする
 * （小集落数がやや減るが、要塞都市の「独立感」を優先）。
 *
 * @param {number} townCount  生成したい町の数
 * @param {number} [bossWx]   ボスのワールドX（オプション）
 * @param {number} [bossWy]   ボスのワールドY（オプション）
 */
// v0.29: 群れのスタート地点（左端中央）。この周囲には街を置かず、まばらな家だけにする。
const START_X = 250;
const START_Y = WORLD_H * 0.5;
const START_TOWN_CLEAR = 500;   // v0.29.2: この距離内に町の中心を置かない（950→500に緩和）

function placeTownCenters(townCount, bossWx, bossWy) {
  // 左端250pxは群れスタート地点なので除外
  const MARGIN_LEFT  = 300;
  const startClear2  = START_TOWN_CLEAR * START_TOWN_CLEAR;
  const MARGIN_RIGHT = 150;
  const MARGIN_Y     = 200;

  const usableW = WORLD_W - MARGIN_LEFT - MARGIN_RIGHT;
  const usableH = WORLD_H - MARGIN_Y * 2;

  const cols = Math.ceil(Math.sqrt(townCount * (usableW / usableH)));
  const rows = Math.ceil(townCount / cols);
  const cellW = usableW / cols;
  const cellH = usableH / rows;

  // ボス＋リング占有の排除半径の二乗（距離比較用）
  const excl2 = CAPITAL_EXCLUSION_RADIUS * CAPITAL_EXCLUSION_RADIUS;
  const hasExclusion = (bossWx !== undefined && bossWy !== undefined);

  const centers = [];
  for (let row = 0; row < rows && centers.length < townCount; row++) {
    for (let col = 0; col < cols && centers.length < townCount; col++) {
      let cx, cy;
      let accepted = false;

      // 最大3回試行して排除ゾーン外の座標を探す
      for (let attempt = 0; attempt < 3; attempt++) {
        cx = MARGIN_LEFT + col * cellW + randRange(cellW * 0.25, cellW * 0.75);
        cy = MARGIN_Y    + row * cellH + randRange(cellH * 0.25, cellH * 0.75);
        // v0.29: スタート地点周辺には街を置かない
        if (dist2(cx, cy, START_X, START_Y) < startClear2) continue;
        if (!hasExclusion || dist2(cx, cy, bossWx, bossWy) >= excl2) {
          accepted = true;
          break;
        }
      }

      // 3回試行してもボス周辺だった場合はこのセルをスキップ
      // （首都と重なる小集落を強制配置しない）
      if (!accepted) continue;

      centers.push({ x: cx, y: cy });
    }
  }
  return centers;
}

// -----------------------------------------------------------------
// v0.10: 有機的な町生成 — 「広場＋ランドマークを中心に、通りに沿って
// 建物が並ぶ」現実の集落の育ち方を模す。
// 建物総数・サイズ構成・HPは旧格子方式と同一（バランス不変条件）。
// v0.16: 文明（ステージ）ごとに町の骨格を変える（アクアリウム施策）。
//   scattered: 骨格なしの自然発生集落（石器）
//   rings    : 同心円の環状都市（古代・終末）
//   radial   : 広場＋放射状の通り＋環状路（中世・近世 — v0.10からの現行形）
//   grid     : 直交する碁盤目の街路（産業革命以降）
// -----------------------------------------------------------------
const STAGE_TOWN_LAYOUTS = [
  "scattered",  // 1 STONE AGE     — 獣道と焚き火の集落
  "rings",      // 2 ANCIENT ERA   — 同心円の神殿都市
  "radial",     // 3 MEDIEVAL AGE  — 広場を核にした城下町
  "radial",     // 4 MODERN FORTRESS
  "grid",       // 5 INDUSTRIAL AGE — 計画された碁盤目
  "grid",       // 6 ELECTRIC AGE
  "grid",       // 7 GREAT WAR
  "rings",      // 8 FINAL DOMINION — ボス城塞と同じ同心円意匠
];

function generateTown(townCenterX, townCenterY, smallCount, mediumCount, largeCount, config, townIndex, stageIndex) {
  const result = [];
  const baseHue = config.townBaseHues[townIndex % config.townBaseHues.length];
  const bSmall  = config.buildings.small;
  const bMedium = config.buildings.medium;
  const bLarge  = config.buildings.large;
  const layout  = STAGE_TOWN_LAYOUTS[stageIndex] ?? "radial";

  const totalCount = smallCount + mediumCount + largeCount;
  const PLAZA_R = 36;                                          // 中央広場の半径
  // v0.11: 大都市（scale 1.7 → 建物約400棟）が収まるよう上限を430へ拡大。
  // 係数も 15→16.5 に上げて敷地に余裕を持たせ、配置成功率（実建物数）を上げる。
  const townR   = Math.max(170, Math.min(430, 16.5 * Math.sqrt(totalCount))); // 町の外縁半径
  const RING_R  = PLAZA_R + 58;                                // 環状路の半径

  // --- v0.16.1: 町の外形（シルエット）。全部が円だとレイアウトを変えても
  // 同じ町に見えるため、輪郭そのものをレイアウトで変える（Shooter指摘）。
  //   scattered: 輪郭なし（塊の群れ） / rings: 真円（環状都市の意匠）
  //   radial   : 有機ブロブ（低周波の凹凸でいびつに広がる城下町）
  //   grid     : 回転矩形（区画整理された市域）
  let shapeType = layout === "radial" ? "blob" : (layout === "grid" ? "rect" : "circle");
  const blobA1 = randRange(0.10, 0.17), blobF1 = 2 + (townIndex % 2), blobP1 = randRange(0, Math.PI * 2);
  const blobA2 = randRange(0.05, 0.10), blobF2 = 5,                   blobP2 = randRange(0, Math.PI * 2);
  const rectTheta = randRange(0, Math.PI / 2);
  const rectAspect = randRange(0.68, 0.88);
  const rectHalfW = townR * 1.12;
  const rectHalfH = townR * 1.12 * rectAspect;

  function townRadiusAt(theta) {
    if (shapeType !== "blob") return townR;
    return townR * (1 + blobA1 * Math.sin(theta * blobF1 + blobP1)
                      + blobA2 * Math.sin(theta * blobF2 + blobP2));
  }
  function insideTownShape(wx, wy, margin) {
    const dx = wx - townCenterX, dy = wy - townCenterY;
    if (shapeType === "rect") {
      const ca = Math.cos(-rectTheta), sa = Math.sin(-rectTheta);
      const lx = dx * ca - dy * sa;
      const ly = dx * sa + dy * ca;
      return Math.abs(lx) <= rectHalfW - margin && Math.abs(ly) <= rectHalfH - margin;
    }
    return Math.hypot(dx, dy) <= townRadiusAt(Math.atan2(dy, dx)) - margin;
  }
  // 町の最大到達半径（畑・装飾を輪郭の外へ置くための基準）
  const maxExtent = shapeType === "rect" ? Math.hypot(rectHalfW, rectHalfH)
    : shapeType === "blob" ? townR * (1 + blobA1 + blobA2)
    : townR;

  // --- レイアウト別の道路骨格 ---
  const streets   = [];   // 放射状の通り {angle, len}（scattered/rings では本数を絞る）
  const ringRadii = [];   // 環状路の半径（rings は多重、radial は1本、他はなし）
  const gridRoads = [];   // 碁盤目の道路セグメント {x1,y1,x2,y2,angle}
  if (layout === "radial") {
    const streetCount = 3 + (townIndex % 3);
    const streetBase = randRange(0, Math.PI * 2);
    for (let k = 0; k < streetCount; k++) {
      const angle = streetBase + (k * Math.PI * 2) / streetCount + randRange(-0.25, 0.25);
      streets.push({
        angle,
        len: townRadiusAt(angle) * randRange(0.85, 1.0),   // ブロブ輪郭まで伸ばす
      });
    }
    ringRadii.push(RING_R);
  } else if (layout === "scattered") {
    // 獣道が1〜2本だけ通る。環状路はない
    const trailCount = 1 + (townIndex % 2);
    const trailBase = randRange(0, Math.PI * 2);
    for (let k = 0; k < trailCount; k++) {
      streets.push({
        angle: trailBase + k * Math.PI + randRange(-0.5, 0.5),
        len: townR * randRange(0.7, 0.95),
      });
    }
  } else if (layout === "rings") {
    // 同心円2〜3重＋放射の連絡路2〜3本
    for (let r = RING_R; r < townR - 24; r += 64) ringRadii.push(r);
    if (ringRadii.length === 0) ringRadii.push(RING_R);
    const spokeCount = 2 + (townIndex % 2);
    const spokeBase = randRange(0, Math.PI * 2);
    for (let k = 0; k < spokeCount; k++) {
      streets.push({
        angle: spokeBase + (k * Math.PI * 2) / spokeCount + randRange(-0.2, 0.2),
        len: townR * randRange(0.9, 1.0),
      });
    }
  } else if (layout === "grid") {
    // 基準角に沿った直交道路網（市域の矩形いっぱいに通す）
    const ROAD_SPACING = 68;
    for (let axis = 0; axis < 2; axis++) {
      const a = rectTheta + axis * Math.PI / 2;             // 道路の方向
      const alongHalf = axis === 0 ? rectHalfW : rectHalfH; // 道の長さ（半分）
      const perpHalf  = axis === 0 ? rectHalfH : rectHalfW; // 道を並べる幅（半分）
      const nx = Math.cos(a + Math.PI / 2);
      const ny = Math.sin(a + Math.PI / 2);
      const maxK = Math.floor((perpHalf - 22) / ROAD_SPACING);
      for (let k = -maxK; k <= maxK; k++) {
        const off = k * ROAD_SPACING;
        const halfLen = alongHalf - 10;
        const mx = townCenterX + nx * off;
        const my = townCenterY + ny * off;
        gridRoads.push({
          x1: mx - Math.cos(a) * halfLen, y1: my - Math.sin(a) * halfLen,
          x2: mx + Math.cos(a) * halfLen, y2: my + Math.sin(a) * halfLen,
          angle: a, halfLen, mx, my,
        });
      }
    }
  }

  const placedPos = [];   // {x, y, r} 重なりチェック用
  function tryPlace(wx, wy, radius, minGap) {
    if (wx < 30 || wx > WORLD_W - 30 || wy < 30 || wy > WORLD_H - 30) return false;
    for (const p of placedPos) {
      const minD = p.r + radius + minGap;
      if (dist2(wx, wy, p.x, p.y) < minD * minD) return false;
    }
    placedPos.push({ x: wx, y: wy, r: radius });
    return true;
  }

  // --- (1) ランドマーク（広場中央）: 神殿/風車を町ごとに交互。large級のHP×1.3 ---
  const landmarkKind = townIndex % 2 === 0 ? "temple" : "windmill";
  const lmHp = Math.round(randInt(BUILDING_SIZE_PARAMS.large.hpMin, BUILDING_SIZE_PARAMS.large.hpMax) * 1.3);
  const landmark = makeBuilding(townCenterX, townCenterY, "large", bLarge.colors[0], bLarge, lmHp);
  landmark._landmark  = landmarkKind;
  landmark._faceAngle = randRange(-0.2, 0.2);
  placedPos.push({ x: townCenterX, y: townCenterY, r: landmark.radius });
  result.push(landmark);

  // 建物1棟の配置試行ヘルパー（成功時に result へ積む）
  const sizeGap = { large: 8, medium: 6, small: 4 };
  const sizeConfig = { large: bLarge, medium: bMedium, small: bSmall };
  function tryPlaceBuilding(size, wx, wy, faceAngle, colorOverride) {
    if (!tryPlace(wx, wy, BUILDING_SIZE_PARAMS[size].radiusBase, sizeGap[size])) return false;
    const hp = randInt(BUILDING_SIZE_PARAMS[size].hpMin, BUILDING_SIZE_PARAMS[size].hpMax);
    const color = colorOverride ??
      shadeColor(baseHue, size === "medium" ? randInt(-10, 20) : randInt(-15, 15));
    const b = makeBuilding(wx, wy, size, color, sizeConfig[size], hp);
    b._faceAngle = faceAngle;
    result.push(b);
    return true;
  }

  // scattered 用: 集落の塊（ブロブ）の中心を先に決めておく
  const scatterHubs = [];
  if (layout === "scattered") {
    const hubCount = 4 + (townIndex % 3);
    for (let k = 0; k < hubCount; k++) {
      const a = randRange(0, Math.PI * 2);
      const r = randRange(PLAZA_R + 24, townR * 0.85);
      scatterHubs.push({ x: townCenterX + Math.cos(a) * r, y: townCenterY + Math.sin(a) * r });
    }
  }

  // --- (2) 大型建物: レイアウトごとの「権威が立つ場所」に置く ---
  let placedLarge = 0;
  for (let k = 0; k < largeCount * 10 && placedLarge < largeCount; k++) {
    let wx, wy, face;
    if (layout === "grid" && gridRoads.length > 0) {
      // 中心街区の大通り沿い（官庁・大工場）
      const road = gridRoads[Math.floor(random() * gridRoads.length)];
      const t    = randRange(-road.halfLen * 0.5, road.halfLen * 0.5);
      const side = random() < 0.5 ? 1 : -1;
      const off  = side * (20 + BUILDING_SIZE_PARAMS.large.radiusBase);
      wx = road.mx + Math.cos(road.angle) * t + Math.cos(road.angle + Math.PI / 2) * off;
      wy = road.my + Math.sin(road.angle) * t + Math.sin(road.angle + Math.PI / 2) * off;
      // 市域内かつ中心街区（官庁は郊外に建たない）
      if (!insideTownShape(wx, wy, 16) ||
          dist2(wx, wy, townCenterX, townCenterY) > (Math.min(rectHalfW, rectHalfH) * 0.6) ** 2) continue;
      face = road.angle + Math.PI / 2;
    } else if (layout === "scattered") {
      // 集落の中心近くに散在（長の住居・祭場）
      const angle = randRange(0, Math.PI * 2);
      const r     = randRange(PLAZA_R + 16, townR * 0.45);
      wx = townCenterX + Math.cos(angle) * r;
      wy = townCenterY + Math.sin(angle) * r;
      face = angle + Math.PI / 2;
    } else {
      // radial / rings: 最内の環状路上（にらみを利かせる領主館・聖堂）
      const angle = randRange(0, Math.PI * 2);
      const r     = (ringRadii[0] ?? RING_R) + randRange(10, 40);
      wx = townCenterX + Math.cos(angle) * r;
      wy = townCenterY + Math.sin(angle) * r;
      face = angle + Math.PI / 2;   // 広場（中心）に正面を向ける
    }
    if (tryPlaceBuilding("large", wx, wy, face, bLarge.colors[placedLarge % bLarge.colors.length])) {
      placedLarge++;
    }
  }

  // --- (3) 中型建物: 骨格の内側区間（商家・工房の並び） ---
  let placedMedium = 0;
  for (let k = 0; k < mediumCount * 10 && placedMedium < mediumCount; k++) {
    let wx, wy, face;
    if (layout === "grid" && gridRoads.length > 0) {
      const road = gridRoads[Math.floor(random() * gridRoads.length)];
      const t    = randRange(-road.halfLen * 0.8, road.halfLen * 0.8);
      const side = k % 2 === 0 ? 1 : -1;
      const off  = side * (16 + randRange(0, 8) + BUILDING_SIZE_PARAMS.medium.radiusBase);
      wx = road.mx + Math.cos(road.angle) * t + Math.cos(road.angle + Math.PI / 2) * off;
      wy = road.my + Math.sin(road.angle) * t + Math.sin(road.angle + Math.PI / 2) * off;
      if (!insideTownShape(wx, wy, 12)) continue;
      face = road.angle + Math.PI / 2;
    } else if (layout === "rings") {
      // 中間の環状路沿い（商家の環）
      const ring  = ringRadii[Math.min(1, ringRadii.length - 1)];
      const angle = randRange(0, Math.PI * 2);
      const side  = k % 2 === 0 ? 1 : -1;
      const r     = ring + side * (14 + BUILDING_SIZE_PARAMS.medium.radiusBase);
      wx = townCenterX + Math.cos(angle) * r;
      wy = townCenterY + Math.sin(angle) * r;
      face = angle + Math.PI / 2;
    } else if (layout === "scattered") {
      const angle = randRange(0, Math.PI * 2);
      const r     = randRange(PLAZA_R + 20, townR * 0.7);
      wx = townCenterX + Math.cos(angle) * r;
      wy = townCenterY + Math.sin(angle) * r;
      face = angle + Math.PI / 2 + randRange(-0.4, 0.4);
    } else {
      // radial: 放射状の通り沿いの内側区間
      const st   = streets[k % streets.length];
      const t    = randRange(PLAZA_R + 22, townR * 0.55);
      const side = k % 2 === 0 ? 1 : -1;
      const off  = side * (16 + randRange(0, 8) + BUILDING_SIZE_PARAMS.medium.radiusBase);
      wx = townCenterX + Math.cos(st.angle) * t + Math.cos(st.angle + Math.PI / 2) * off;
      wy = townCenterY + Math.sin(st.angle) * t + Math.sin(st.angle + Math.PI / 2) * off;
      face = st.angle + Math.PI / 2;   // 通りに面する
    }
    if (tryPlaceBuilding("medium", wx, wy, face)) placedMedium++;
  }

  // --- (4) 小型建物: まず骨格沿い、埋まらない分は路地に有機的に充填 ---
  let placedSmall = 0;
  // (4a) 骨格沿い（道路・環状路の両側にぎっしり並ぶ長屋／集落の塊）
  for (let k = 0; k < smallCount * 6 && placedSmall < smallCount; k++) {
    let wx, wy, face;
    if (layout === "grid" && gridRoads.length > 0) {
      const road = gridRoads[k % gridRoads.length];
      const t    = randRange(-road.halfLen + 10, road.halfLen - 10);
      const side = (k >> 1) % 2 === 0 ? 1 : -1;
      const off  = side * (13 + randRange(0, 6) + BUILDING_SIZE_PARAMS.small.radiusBase);
      wx = road.mx + Math.cos(road.angle) * t + Math.cos(road.angle + Math.PI / 2) * off;
      wy = road.my + Math.sin(road.angle) * t + Math.sin(road.angle + Math.PI / 2) * off;
      if (!insideTownShape(wx, wy, 8)) continue;
      face = road.angle + Math.PI / 2;
    } else if (layout === "rings") {
      // 各環状路の両側（環に沿った家並み）
      const ring  = ringRadii[k % ringRadii.length];
      const angle = randRange(0, Math.PI * 2);
      const side  = (k >> 1) % 2 === 0 ? 1 : -1;
      const r     = ring + side * (12 + randRange(0, 5) + BUILDING_SIZE_PARAMS.small.radiusBase);
      wx = townCenterX + Math.cos(angle) * r;
      wy = townCenterY + Math.sin(angle) * r;
      face = angle + Math.PI / 2;
    } else if (layout === "scattered") {
      // 集落の塊に寄せて置く（塊と塊の間は空く＝自然発生の疎密）
      const hub = scatterHubs[k % scatterHubs.length];
      wx = hub.x + randRange(-46, 46);
      wy = hub.y + randRange(-46, 46);
      face = randRange(0, Math.PI * 2);
    } else {
      // radial: 通り沿い
      const st   = streets[k % streets.length];
      const t    = randRange(PLAZA_R + 16, st.len);
      const side = (k >> 1) % 2 === 0 ? 1 : -1;
      const off  = side * (13 + randRange(0, 6) + BUILDING_SIZE_PARAMS.small.radiusBase);
      wx = townCenterX + Math.cos(st.angle) * t + Math.cos(st.angle + Math.PI / 2) * off;
      wy = townCenterY + Math.sin(st.angle) * t + Math.sin(st.angle + Math.PI / 2) * off;
      if (!insideTownShape(wx, wy, 6)) continue;   // ブロブ輪郭の外へはみ出さない
      face = st.angle + Math.PI / 2;
    }
    if (tryPlaceBuilding("small", wx, wy, face)) placedSmall++;
  }
  // (4b) 路地充填。v0.11: 試行回数×16で充填率を上げる＝実建物数を目標値に近づける
  // v0.16: scattered は充填も塊（ハブ）に寄せる。一様に埋めると塊と塊の間の
  // 空白が消えて「自然発生集落の疎密」が死ぬため。埋まるほど広がりを緩める
  for (let k = 0; k < smallCount * 16 && placedSmall < smallCount; k++) {
    let wx, wy, face;
    if (layout === "scattered" && scatterHubs.length > 0) {
      const hub = scatterHubs[Math.floor(random() * scatterHubs.length)];
      const spread = 50 + (k / (smallCount * 16)) * 50;   // 混んできたら少しずつ外へ
      wx = hub.x + randRange(-spread, spread);
      wy = hub.y + randRange(-spread, spread);
      face = randRange(0, Math.PI * 2);
    } else if (shapeType === "rect") {
      // 矩形市域: ローカル座標で一様に埋める（街区の向きに沿って建てる）
      const lx = randRange(-rectHalfW + 18, rectHalfW - 18);
      const ly = randRange(-rectHalfH + 18, rectHalfH - 18);
      const ca = Math.cos(rectTheta), sa = Math.sin(rectTheta);
      wx = townCenterX + lx * ca - ly * sa;
      wy = townCenterY + lx * sa + ly * ca;
      face = rectTheta + (random() < 0.5 ? 0 : Math.PI / 2) + Math.PI / 2;
    } else {
      // 円/ブロブ: 中心に密・外縁に疎（√分布で中心へ寄せ、輪郭半径で打ち切る）
      const angle = randRange(0, Math.PI * 2);
      const rMax  = townRadiusAt(angle);
      const r     = PLAZA_R + 14 + Math.sqrt(random()) * (rMax - PLAZA_R - 14);
      wx = townCenterX + Math.cos(angle) * r;
      wy = townCenterY + Math.sin(angle) * r;
      face = angle + Math.PI / 2 + randRange(-0.3, 0.3);
    }
    if (tryPlaceBuilding("small", wx, wy, face)) placedSmall++;
  }

  // --- (5) 畑: 農地「区画」として町の外縁にまとめて置く ---
  // v0.16: 旧実装はバラバラの向き・位置で1枚ずつ置いていたため互いに重なり
  // 「人の営み」に見えなかった。実際の農村のように、同じ向きの区画が
  // 隣り合って並ぶまとまり（クラスタ）を1〜3箇所作る。川の上は避ける。
  const fields = [];
  const decor  = [];
  const clusterCount = randInt(1, 3);
  const clusterBase  = randRange(0, Math.PI * 2);
  for (let c = 0; c < clusterCount; c++) {
    // クラスタ方向は等分＋ジッター（クラスタ同士が重ならないように離す）
    const dirAngle   = clusterBase + c * (Math.PI * 2 / clusterCount) + randRange(-0.35, 0.35);
    const fieldAngle = dirAngle + Math.PI / 2 + randRange(-0.12, 0.12);
    const cols = randInt(2, 4);
    const rows = random() < 0.4 ? 2 : 1;
    const pw   = randRange(52, 78);
    const ph   = randRange(36, 54);
    const gap  = 7;
    const clusterW = cols * pw + (cols - 1) * gap;
    const clusterH = rows * ph + (rows - 1) * gap;
    // v0.16.1: 矩形・ブロブ輪郭でも外へ出るよう maxExtent 基準に
    const dist = maxExtent + 46 + Math.max(clusterW, clusterH) * 0.5 + randRange(0, 60);
    const ccx  = townCenterX + Math.cos(dirAngle) * dist;
    const ccy  = townCenterY + Math.sin(dirAngle) * dist;
    if (ccx < 80 || ccx > WORLD_W - 80 || ccy < 80 || ccy > WORLD_H - 80) continue;
    // 川の上に畑を敷かない（クラスタ中心で判定。多少の際は水辺の畑として許容）
    if (riverPolyline.length > 1 &&
        distPointToPolylineSq(ccx, ccy, riverPolyline) < (riverWidth * 0.5 + 30) ** 2) continue;

    const ux = Math.cos(fieldAngle), uy = Math.sin(fieldAngle);   // 列方向の単位ベクトル
    const vxL = -uy, vyL = ux;                                    // 行方向の単位ベクトル
    // 作付けの違い（耕地・青作物・実り）を区画ごとに混ぜる
    const FIELD_TONES = ["#96804a", "#7a8a4a", "#a08c56"];
    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < cols; col++) {
        const offCol = (col - (cols - 1) / 2) * (pw + gap);
        const offRow = (row - (rows - 1) / 2) * (ph + gap);
        fields.push({
          x: ccx + ux * offCol + vxL * offRow,
          y: ccy + uy * offCol + vyL * offRow,
          w: pw, h: ph, angle: fieldAngle,
          tone: FIELD_TONES[(c + col + row) % FIELD_TONES.length],
        });
      }
    }
    // 干し草の山: 区画の隅に1〜2個（収穫の気配）
    const hayCount = randInt(1, 2);
    for (let hIdx = 0; hIdx < hayCount; hIdx++) {
      const hSide = hIdx % 2 === 0 ? 1 : -1;
      decor.push({
        type: "hay",
        x: ccx + ux * hSide * (clusterW * 0.5 + 16) + vxL * randRange(-clusterH * 0.4, clusterH * 0.4),
        y: ccy + uy * hSide * (clusterW * 0.5 + 16) + vyL * randRange(-clusterH * 0.4, clusterH * 0.4),
        r: randRange(6, 9),
      });
    }
  }
  // 井戸: 広場の縁に1つ（共同の水場＝集落の生活の中心）
  {
    const wellAngle = randRange(0, Math.PI * 2);
    decor.push({
      type: "well",
      x: townCenterX + Math.cos(wellAngle) * (PLAZA_R - 6),
      y: townCenterY + Math.sin(wellAngle) * (PLAZA_R - 6),
    });
  }

  // v0.16.1: 輪郭ポリゴン（町の土台・城郭リムの描画用。circle は null で従来の円描画）
  let outline = null;
  if (shapeType === "blob") {
    outline = [];
    const OUTLINE_STEPS = 28;
    for (let i = 0; i < OUTLINE_STEPS; i++) {
      const a = (i / OUTLINE_STEPS) * Math.PI * 2;
      const r = townRadiusAt(a);
      outline.push({ x: townCenterX + Math.cos(a) * r, y: townCenterY + Math.sin(a) * r });
    }
  } else if (shapeType === "rect") {
    const ca = Math.cos(rectTheta), sa = Math.sin(rectTheta);
    outline = [
      { lx: -rectHalfW, ly: -rectHalfH }, { lx: rectHalfW, ly: -rectHalfH },
      { lx: rectHalfW, ly: rectHalfH },   { lx: -rectHalfW, ly: rectHalfH },
    ].map(p => ({
      x: townCenterX + p.lx * ca - p.ly * sa,
      y: townCenterY + p.lx * sa + p.ly * ca,
    }));
  }

  // 描画用メタデータ（先頭のランドマークに付属）
  landmark._townMeta = {
    cx: townCenterX,
    cy: townCenterY,
    plazaR: PLAZA_R,
    ringR: RING_R,
    townR,
    layout,       // v0.16: 町の骨格タイプ
    shapeType,    // v0.16.1: 外形（circle/blob/rect）
    outline,      // v0.16.1: 外形ポリゴン（circleはnull）
    maxExtent,    // v0.16.1: 中心からの最大到達半径
    streets,
    ringRadii,    // v0.16: 環状路の半径（radial=1本 / rings=多重 / 他=空）
    gridRoads,    // v0.16: 碁盤目の道路セグメント
    decor,        // v0.16: 井戸・干し草などの静的装飾
    fields,
    // v0.9.1以前の互換フィールド（fortified リム等が参照）
    spacing: 52,
  };

  // v0.51: どの町の建物かを刻んでおく。時代が上がったときに
  // 「その町の色」を新しい時代のパレットから引き直すために要る。
  for (const b of result) b._townIndex = townIndex;

  return result;
}

// 点からポリラインへの最短距離の2乗（畑の川回避などの粗い判定用）
function distPointToPolylineSq(x, y, poly) {
  let best = Infinity;
  for (let i = 0; i < poly.length - 1; i++) {
    const ax = poly[i].x, ay = poly[i].y;
    const abx = poly[i + 1].x - ax, aby = poly[i + 1].y - ay;
    const t = Math.max(0, Math.min(1, ((x - ax) * abx + (y - ay) * aby) / (abx * abx + aby * aby || 1)));
    const dx = x - (ax + abx * t), dy = y - (ay + aby * t);
    const d2 = dx * dx + dy * dy;
    if (d2 < best) best = d2;
  }
  return best;
}

function makeBuilding(wx, wy, size, color, bConfig, hp) {
  return {
    wx,
    wy,
    size,
    color,
    shape:  randChoice(bConfig.shapes),
    radius: BUILDING_SIZE_PARAMS[size].radiusBase,
    maxHp:  hp,
    hp,
    fallen: false,
    // 変更1: 卵持ちフラグ（generateTown 内で EGG_BEARER_RATIO に従い後から設定する）
    isEggBearer: false,
    // ボス集落フラグ（通常建物は false。makeBossBuilding で true になる）
    isBoss: false,
    attackTimer: random() * bConfig.projectileInterval,
    attackRadius:        bConfig.attackRadius,
    projectileInterval:  bConfig.projectileInterval,
    projectileSpeed:     bConfig.projectileSpeed,
    projectileDamage:    bConfig.projectileDamage,
    projectileColor:     bConfig.projectileColor,
    projectileCount:     bConfig.projectileCount,
    projectileTracking:  bConfig.projectileTracking,
    projectileAoe:       bConfig.projectileAoe ?? 0,
    reward:              bConfig.reward,
    // ブレスヒットパーティクルのインターバルカウンタ
    _breathParticleTimer: 0,
  };
}

/**
 * tiny ハムレット（集落クラスタ）をマップ全体に配置する。
 *
 * 単体バラバラ配置から「ハムレット単位のクラスタ配置」に変更。
 * 1クラスタ = TINY_PER_HAMLET_MIN〜MAX 棟の密集体。
 * クラスタ中心はボス＋首都占有領域・既存街区・他クラスタと重ならない位置に散在させる。
 *
 * settlements 配列への追加 → 空間ハッシュ・ビューポートカリング・攻撃ゲート・
 * オフスクリーン合成・ミニマップは自動的に対象になる（既存最適化を壊さない）。
 *
 * @param {Array}  existingBuildings  既存の建物リスト（重なりチェック用）
 * @param {number} bossWx            ボスのワールドX
 * @param {number} bossWy            ボスのワールドY
 * @param {Object} config            STAGE_CONFIGS[stageIndex]
 * @returns {Array}  配置された tiny 建物のリスト
 */
function generateTinySettlements(existingBuildings, bossWx, bossWy, config) {
  const result = [];
  const bSmall = config.buildings.small; // tiny は small のパラメータを流用（攻撃・色）
  const tinyR  = BUILDING_SIZE_PARAMS.tiny.radiusBase;

  // 既存建物の位置リスト（tiny との重なりチェック用）
  const occupied = existingBuildings.map(b => ({ x: b.wx, y: b.wy, r: b.radius }));

  // 首都占有領域の二乗（ボス中心からの排除距離）
  const excl2 = CAPITAL_EXCLUSION_RADIUS * CAPITAL_EXCLUSION_RADIUS;
  // クラスタ同士の最小間隔二乗
  const hamletSpacing2 = TINY_HAMLET_MIN_SPACING * TINY_HAMLET_MIN_SPACING;
  // 既存街区との最小間隔二乗（クラスタ中心 vs 既存建物中心）
  const fromTown2 = TINY_HAMLET_FROM_TOWN_GAP * TINY_HAMLET_FROM_TOWN_GAP;

  // 確定したクラスタ中心リスト（他クラスタとの分離チェック用）
  const hamletCenters = [];

  for (let h = 0; h < TINY_HAMLET_COUNT; h++) {
    // --- クラスタ中心の配置 ---
    let centerX = 0, centerY = 0;
    let hamletPlaced = false;

    for (let attempt = 0; attempt < TINY_HAMLET_MAX_ATTEMPTS && !hamletPlaced; attempt++) {
      const cx = TINY_MARGIN + random() * (WORLD_W - TINY_MARGIN * 2);
      const cy = TINY_MARGIN + random() * (WORLD_H - TINY_MARGIN * 2);

      // 首都占有領域チェック（クラスタ中心がボス周辺に入らない）
      if (dist2(cx, cy, bossWx, bossWy) < excl2) continue;

      // 既存街区（small/medium/large 建物）との間隔チェック
      // クラスタ半径 + fromTown2 内に既存建物があれば除外
      let tooCloseToTown = false;
      for (const ob of occupied) {
        // 既存建物との最小間隔 = その建物 radius + tinyハムレット半径 + gap
        const minD = ob.r + TINY_HAMLET_RADIUS_MAX + TINY_HAMLET_FROM_TOWN_GAP;
        if (dist2(cx, cy, ob.x, ob.y) < minD * minD) {
          tooCloseToTown = true;
          break;
        }
      }
      if (tooCloseToTown) continue;

      // 他クラスタ中心との最小間隔チェック
      let tooCloseToHamlet = false;
      for (const hc of hamletCenters) {
        if (dist2(cx, cy, hc.x, hc.y) < hamletSpacing2) {
          tooCloseToHamlet = true;
          break;
        }
      }
      if (tooCloseToHamlet) continue;

      centerX = cx;
      centerY = cy;
      hamletPlaced = true;
    }

    if (!hamletPlaced) continue; // このクラスタは配置不能 → スキップ

    hamletCenters.push({ x: centerX, y: centerY });

    // --- クラスタ内の棟を配置 ---
    const buildingCount = randInt(TINY_PER_HAMLET_MIN, TINY_PER_HAMLET_MAX);
    const hamletR = randRange(TINY_HAMLET_RADIUS_MIN, TINY_HAMLET_RADIUS_MAX);
    // このクラスタで確定した棟（クラスタ内の重なりチェック用）
    const hamletBuildings = [];

    for (let k = 0; k < buildingCount; k++) {
      let placed = false;

      for (let attempt = 0; attempt < TINY_PER_BUILDING_MAX_ATTEMPTS && !placed; attempt++) {
        // クラスタ中心の周囲 hamletR 以内にランダム配置（一様分布にするため√補正）
        const angle = random() * Math.PI * 2;
        const r     = hamletR * Math.sqrt(random());
        const wx    = centerX + Math.cos(angle) * r;
        const wy    = centerY + Math.sin(angle) * r;

        // ワールド境界チェック
        if (wx < TINY_MARGIN || wx > WORLD_W - TINY_MARGIN ||
            wy < TINY_MARGIN || wy > WORLD_H - TINY_MARGIN) continue;

        // 既存建物（街区・首都）との重なりチェック
        let tooClose = false;
        for (const ob of occupied) {
          const minD = ob.r + tinyR + TINY_FROM_EXISTING_GAP;
          if (dist2(wx, wy, ob.x, ob.y) < minD * minD) { tooClose = true; break; }
        }
        if (tooClose) continue;

        // クラスタ内 tiny 棟同士の重なりチェック
        for (const hb of hamletBuildings) {
          if (dist2(wx, wy, hb.x, hb.y) < TINY_MIN_SPACING * TINY_MIN_SPACING) {
            tooClose = true; break;
          }
        }
        if (tooClose) continue;

        // 他クラスタ（result 全体）との重なりチェック
        for (const t of result) {
          if (dist2(wx, wy, t.wx, t.wy) < TINY_MIN_SPACING * TINY_MIN_SPACING) {
            tooClose = true; break;
          }
        }
        if (tooClose) continue;

        // 配置確定
        const hp    = randInt(BUILDING_SIZE_PARAMS.tiny.hpMin, BUILDING_SIZE_PARAMS.tiny.hpMax);
        const color = randChoice(bSmall.colors);
        const b     = makeBuilding(wx, wy, "tiny", color, bSmall, hp);
        // tiny 専用フラグ（ミニマップ・デバッグ等で識別）
        b._tinySettlement = true;
        // tiny の radius は BUILDING_SIZE_PARAMS.tiny.radiusBase で確定
        b.radius = tinyR;
        result.push(b);
        occupied.push({ x: wx, y: wy, r: tinyR });
        hamletBuildings.push({ x: wx, y: wy });
        placed = true;
      }
    }
  }

  return result;
}

/**
 * v0.11: 道沿いの集落を生成する。
 * 各街道エッジの途中（等分点＋横オフセット）に3〜6棟の民家群を置く。
 * 町・首都・川の上は避け、建物は道に面する向きで並べる。
 *
 * @param {Array} existingBuildings  既存の全建物（重なり回避用）
 * @param {Array} roadEdges          townRoadEdges（[{x,y},{x,y}] の配列）
 * @param {Object} boss              ボス建物
 * @param {Object} config            STAGE_CONFIGS[stageIndex]
 * @returns {Array} 配置された tiny 建物のリスト
 */
function generateRoadsideHamlets(existingBuildings, roadEdges, boss, config) {
  const result = [];
  const bSmall = config.buildings.small;
  const tinyR  = BUILDING_SIZE_PARAMS.tiny.radiusBase;
  const occupied = existingBuildings.map(b => ({ x: b.wx, y: b.wy, r: b.radius }));
  // v0.16: 畑クラスタも占有領域に含める（民家が畑の上に建つのを防ぐ）
  for (const b of existingBuildings) {
    if (!b._townMeta) continue;
    for (const f of b._townMeta.fields ?? []) {
      occupied.push({ x: f.x, y: f.y, r: Math.hypot(f.w, f.h) * 0.5 });
    }
  }
  const bossClear2 = (WALL_OUTER_RING_RADIUS + 80) ** 2;

  for (const [a, b] of roadEdges) {
    const hamletCount = randInt(2, 4);
    for (let h = 0; h < hamletCount; h++) {
      const t   = (h + 1) / (hamletCount + 1) + randRange(-0.08, 0.08);
      const dx  = b.x - a.x, dy = b.y - a.y;
      const len = Math.sqrt(dx * dx + dy * dy) || 1;
      const side = random() < 0.5 ? 1 : -1;
      const off  = side * (34 + randRange(0, 26));   // 道の脇（街道帯の外側すぐ）
      const cx = a.x + dx * t + (-dy / len) * off;
      const cy = a.y + dy * t + (dx / len) * off;

      if (cx < 60 || cx > WORLD_W - 60 || cy < 60 || cy > WORLD_H - 60) continue;
      if (dist2(cx, cy, boss.wx, boss.wy) < bossClear2) continue;

      // 川の上を避ける（中心線の頂点との距離で近似）
      let onRiver = false;
      for (const rp of riverPolyline) {
        if (dist2(cx, cy, rp.x, rp.y) < riverWidth * riverWidth) { onRiver = true; break; }
      }
      if (onRiver) continue;

      // 町の中・既存建物のそばはスキップ（道中の「ぽつんとした集落」感を守る）
      // v0.11: 大都市化で町が広がったため間隔を 90→60 に緩めて出現数を確保
      let nearExisting = false;
      for (const ob of occupied) {
        const minD = ob.r + 60;
        if (dist2(cx, cy, ob.x, ob.y) < minD * minD) { nearExisting = true; break; }
      }
      if (nearExisting) continue;

      // 3〜6棟の民家を道に沿って置く
      const count = randInt(3, 6);
      const faceAngle = Math.atan2(dy, dx) + Math.PI / 2;   // 道に面する向き
      for (let k = 0; k < count; k++) {
        const wx = cx + randRange(-36, 36);
        const wy = cy + randRange(-30, 30);
        let clash = false;
        for (const r of result) {
          if (dist2(wx, wy, r.wx, r.wy) < (tinyR * 2 + 6) ** 2) { clash = true; break; }
        }
        if (clash) continue;
        const hp  = randInt(BUILDING_SIZE_PARAMS.tiny.hpMin, BUILDING_SIZE_PARAMS.tiny.hpMax);
        const bld = makeBuilding(wx, wy, "tiny", randChoice(bSmall.colors), bSmall, hp);
        bld._tinySettlement = true;   // 足元の土広場・ミニマップ描画を tiny 集落と共通化
        bld.radius = tinyR;
        bld._faceAngle = faceAngle + randRange(-0.15, 0.15);
        result.push(bld);
        occupied.push({ x: wx, y: wy, r: tinyR });
      }
    }
  }
  return result;
}

/**
 * ボス集落を1体生成する。
 * 高HP・高火力・大半径で、小集落の育成なしでは倒せない圧力を作る。
 * isBoss=true を持つことでクリア条件・描画・ミニマップで特別扱いされる。
 */
function makeBossBuilding(wx, wy, stageIndex, bossTheme) {
  const hp = calcBossHp(stageIndex);
  // 攻撃タイマーはあえて0から始めて、ステージ開始直後から脅威感を出す
  return {
    wx,
    wy,
    size: "boss",
    color: bossTheme.color,
    shape: bossTheme.shape,        // "bossCircle" — 専用描画関数で処理
    radius: BOSS_RADIUS,
    maxHp: hp,
    hp,
    fallen: false,
    isEggBearer: false,            // ボスは卵を落とさない（強すぎる報酬になるため）
    isBoss: true,
    attackTimer: 0,
    attackRadius:       BOSS_ATTACK_RADIUS,
    projectileInterval: BOSS_FIRE_PARAMS.projectileInterval,
    projectileSpeed:    BOSS_FIRE_PARAMS.projectileSpeed,
    projectileDamage:   BOSS_FIRE_PARAMS.projectileDamage,
    projectileColor:    bossTheme.projectileColor,
    projectileCount:    BOSS_FIRE_PARAMS.projectileCount,
    projectileTracking: BOSS_FIRE_PARAMS.projectileTracking,
    projectileAoe:      0,
    reward:             { eggMin: 0, eggMax: 0 },
    _breathParticleTimer: 0,
    // ボス専用: グロー色（描画時に外輪のグロー効果に使う）
    _bossGlowColor: bossTheme.glowColor,
  };
}

// v0.29: スタート地点周辺の「まばらな家」。街（密集）は置かず単独の家を散らして緩衝地帯にする。
function generateStartAreaHouses(existing, config) {
  const result = [];
  const bSmall = config.buildings.small;
  const tinyR  = BUILDING_SIZE_PARAMS.tiny.radiusBase;
  const occupied = existing.map(b => ({ x: b.wx, y: b.wy, r: b.radius }));
  const INNER = 440;   // 群れ初期域(TERRAIN_START_CLEAR=420)より外
  const OUTER = 900;   // v0.29.2: START_TOWN_CLEAR から独立（緩和しても家のリングが破綻しない）
  const target = 9;
  let placed = 0, attempts = 0;
  while (placed < target && attempts < target * 14) {
    attempts++;
    const a = random() * Math.PI * 2;
    const d = INNER + random() * (OUTER - INNER);
    const wx = START_X + Math.cos(a) * d;
    const wy = START_Y + Math.sin(a) * d;
    if (wx < TINY_MARGIN || wx > WORLD_W - TINY_MARGIN ||
        wy < TINY_MARGIN || wy > WORLD_H - TINY_MARGIN) continue;
    let ok = true;
    for (const ob of occupied) { const minD = ob.r + tinyR + 70; if (dist2(wx, wy, ob.x, ob.y) < minD * minD) { ok = false; break; } }
    if (!ok) continue;
    for (const t of result) { if (dist2(wx, wy, t.wx, t.wy) < 130 * 130) { ok = false; break; } }  // まばら＝間隔広め
    if (!ok) continue;
    const hp = randInt(BUILDING_SIZE_PARAMS.tiny.hpMin, BUILDING_SIZE_PARAMS.tiny.hpMax);
    const b  = makeBuilding(wx, wy, "tiny", randChoice(bSmall.colors), bSmall, hp);
    b._tinySettlement = true; b.radius = tinyR;
    result.push(b); occupied.push({ x: wx, y: wy, r: tinyR });
    placed++;
  }
  return result;
}

// v0.29: 閉じたポリライン points の「連続する一部区間(約35〜50%)」だけに城壁セグメントを敷く。
// rect町の outline は長方形なので、自動的に「長方形の壁の一部」になる。
function placeWallArcAlong(points, hp, out) {
  const n = points.length;
  if (n < 2) return;
  const segLen = [];
  let total = 0;
  for (let i = 0; i < n; i++) {
    const a = points[i], b = points[(i + 1) % n];
    segLen.push(Math.hypot(b.x - a.x, b.y - a.y)); total += segLen[i];
  }
  if (total < WALL_SEG_SPACING) return;
  const span  = total * randRange(0.35, 0.5);   // 全部は覆わない（一部だけ）
  const start = random() * total;
  for (let d = 0; d < span; d += WALL_SEG_SPACING) {
    let t = (start + d) % total, idx = 0;
    while (idx < n && t > segLen[idx]) { t -= segLen[idx]; idx++; }
    if (idx >= n) idx = n - 1;
    const a = points[idx], b = points[(idx + 1) % n];
    const f = segLen[idx] > 0 ? t / segLen[idx] : 0;
    out.push(makeWallSegment(a.x + (b.x - a.x) * f, a.y + (b.y - a.y) * f, hp, Math.atan2(b.y - a.y, b.x - a.x)));
  }
}

// v0.29: STAGE3以降、一部の町にも部分的な城壁を付ける（rect町は長方形の壁）。
function generateTownWalls(townMetas, stageIndex) {
  if (stageIndex < 2 || townMetas.length === 0) return [];   // STAGE3(index2)以降
  const wcfg = WALL_STAGE_CONFIG[stageIndex] ?? WALL_STAGE_CONFIG[WALL_STAGE_CONFIG.length - 1];
  const hp = Math.round((wcfg && wcfg.hp ? wcfg.hp : 52) * 0.7);   // 町壁はボス城壁より弱め
  const result = [];
  const idxs = townMetas.map((_, i) => i);
  for (let i = idxs.length - 1; i > 0; i--) { const j = Math.floor(random() * (i + 1)); [idxs[i], idxs[j]] = [idxs[j], idxs[i]]; }
  const walledCount = Math.max(1, Math.round(townMetas.length * 0.4));   // 一部の町だけ
  for (let w = 0; w < walledCount && w < idxs.length; w++) {
    const meta = townMetas[idxs[w]];
    let perim = meta.outline;
    if (!perim) {   // circle町: 外接円をサンプリング
      perim = [];
      const R = (meta.maxExtent ?? meta.townR ?? 120) + 14;
      for (let i = 0; i < 36; i++) { const a = (i / 36) * Math.PI * 2; perim.push({ x: meta.cx + Math.cos(a) * R, y: meta.cy + Math.sin(a) * R }); }
    }
    placeWallArcAlong(perim, hp, result);
  }
  return result;
}

function generateStageLayout(stageIndex) {
  const config = STAGE_CONFIGS[stageIndex];

  // --- (1) ボスを先に配置する ---
  // ボス＋要塞リングが確実にマップ内に収まる位置を確保してから、
  // 小集落クラスタをその周囲を避けて配置する（先取り方式）。
  // v0.56: ボスの見た目・武装は**ランの時代**のまま（フレーバーは固定）。
  // 強さだけ「最大段階 × 首都倍率」で最初から最強にする（以後 動かない壁）。
  const boss = placeBossBuilding(stageIndex, config);
  boss._fixedTier = maxPowerTier();
  {
    const tb = POWER_TIER_BOOST[maxPowerTier()];
    boss.maxHp = Math.round(boss.maxHp * tb.hp * CAPITAL_POWER_MULT);
    boss.hp    = boss.maxHp;
    boss.projectileDamage *= tb.dmg;
  }

  // --- (2) 小集落クラスタの中心をボス＋リング占有領域を避けて決める ---
  const townCenters = placeTownCenters(scaledForWorld(config.townCount, TOWN_DENSITY_FACTOR), boss.wx, boss.wy);

  // v0.9.1: 街道網（町同士＋ボス首都を最小全域木で接続。描画は建物レイヤー再構築時）
  townRoadEdges = buildTownRoadNetwork(townCenters, boss);

  // v0.10: 川を1本引き、街道との交点に橋を架ける（背景の地理と攻略導線）
  riverPolyline    = generateRiver(stageIndex);
  bridgePlacements = computeBridges(townRoadEdges, riverPolyline);

  // v0.7: ボスに近い2〜3町を「要塞都市」に指定する（Shooterプレイテスト:
  // ボス周辺にもっと強い都市が欲しい・強さが見た目で分かること）。
  const fortifiedCount = stageIndex >= 2 ? 3 : 2;
  const fortifiedSet = new Set(
    townCenters
      .map((c, idx) => ({ idx, d2: dist2(c.x, c.y, boss.wx, boss.wy) }))
      .sort((a, b) => a.d2 - b.d2)
      .slice(0, fortifiedCount)
      .map(e => e.idx),
  );

  // v0.11: 都市の規模に変化をつける（大都市1・中都市1・残りは標準±ゆらぎ）。
  // 建物数は scale^2 で増やす＝「建物を壊す」メイン体験の総量を底上げする。
  const cityScaleByIdx = new Map();
  {
    const order = townCenters.map((_, i) => i);
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    cityScaleByIdx.set(order[0], 1.7);                       // 大都市（首府級）
    if (order.length > 1) cityScaleByIdx.set(order[1], 1.35); // 中核都市
  }

  // v0.56: 街ごとの**動員段階**オフセット（時代は全部同じ＝同じ文明の街並み）。
  // 要塞都市は最初から最大段階、ほかにも一部が1段階先。
  const townTierOffset = new Map();
  for (let t = 0; t < townCenters.length; t++) {
    if (!fortifiedSet.has(t) && random() < TOWN_ADVANCED_RATIO) {
      townTierOffset.set(t, TOWN_TIER_ADVANCED);
    }
  }

  const result = [];
  const townMetas = [];   // v0.29: 部分壁を付けるための町メタ一覧
  for (let t = 0; t < townCenters.length; t++) {
    const center = townCenters[t];
    const cityScale = cityScaleByIdx.get(t) ?? randRange(0.9, 1.1);
    const s2 = cityScale * cityScale;
    // v0.56: 建築・レイアウトは全部ランの時代のもの（同じ文明の街並み）。
    // 差がつくのは動員段階＝強さと、それに伴う色の締まり具合だけ。
    const offset     = townTierOffset.get(t) || 0;
    const isFortress = fortifiedSet.has(t);
    const townBuildings = generateTown(
      center.x, center.y,
      Math.round(config.smallPerTown  * BUILDING_DENSITY_MULT * s2),
      Math.round(config.mediumPerTown * BUILDING_DENSITY_MULT * s2),
      Math.max(1, Math.round(config.largePerTown * BUILDING_DENSITY_MULT * s2)),
      config,
      t,
      stageIndex,   // v0.16: 文明ごとの町レイアウト選択に使う
    );
    for (const b of townBuildings) b._tierOffset = offset;
    if (isFortress) {
      applyTownFortification(townBuildings);
      // 「強化しながらボス直行」を道中の街で止める（Shooter指示）。
      // 最初から最大段階で、段階が上がっても補強し直さない
      // ＝削った傷が残り、攻略が積み上がる。
      for (const b of townBuildings) b._fixedTier = maxPowerTier();
    }
    const tmeta = townBuildings.find(b => b._townMeta);   // v0.29: 部分壁のため町メタを収集
    if (tmeta) townMetas.push(tmeta._townMeta);
    for (const b of townBuildings) result.push(b);
  }

  // --- (2b) 首都要塞リング（座標のみ先計算）して小集落建物との衝突除去に使う ---
  // placeCapitalDistrict は config が必要なため、ここで仮実行して座標を取得する。
  // 首都建物と重なるクラスタ建物は remove してから result に残す。
  // v0.56: 首都区画は同じ文明の建築のまま、最初から最大段階で固定。
  const capitalBuildings = placeCapitalDistrict(boss, config);
  for (const b of capitalBuildings) b._fixedTier = maxPowerTier();

  // 首都建物の占有エリアを「除去対象」として各小集落建物をフィルタリングする。
  // 重なり判定: 中心距離 < 首都建物 radius + 小集落建物 radius + 最小隙間 6px
  const CLUSTER_PURGE_GAP = 6;
  function collidesWithCapital(b) {
    for (const cap of capitalBuildings) {
      const d2 = dist2(b.wx, b.wy, cap.wx, cap.wy);
      const minD = cap.radius + b.radius + CLUSTER_PURGE_GAP;
      if (d2 < minD * minD) return true;
    }
    return false;
  }

  // _townMeta フラグを保持しながらフィルタ（先頭建物の meta を後続に移す必要はない）
  const purged = result.filter(b => !collidesWithCapital(b));
  // result を purged で置き換える（参照を変えず内容を更新）
  result.length = 0;
  for (const b of purged) result.push(b);

  // v0.43: ダム／堰 — 川の中流に1基だけ置く。川沿いは建物が避けているので場所は空いている。
  if (riverPolyline.length > 4) {
    const idx = Math.floor(riverPolyline.length * randRange(0.35, 0.62));
    const rp  = riverPolyline[idx];
    const nxt = riverPolyline[Math.min(idx + 1, riverPolyline.length - 1)];
    const bLarge = config.buildings.large;
    const hp = Math.round(randInt(BUILDING_SIZE_PARAMS.large.hpMin, BUILDING_SIZE_PARAMS.large.hpMax) * DAM_HP_MULT);
    const dam = makeBuilding(rp.x, rp.y, "large", "#8a94a0", bLarge, hp);
    dam._isDam     = true;
    dam._damIdx    = idx;                                        // 下流の起点
    dam._damAngle  = Math.atan2(nxt.y - rp.y, nxt.x - rp.x);      // 川に直交して描くための向き
    dam.radius     = 34;
    dam.attackRadius = 0;                                        // 堰は撃たない（構造物）
    dam._noAttack  = true;
    result.push(dam);
  }

  // v0.42: 焼夷塔 — large 建物のいくつかを「持続する炎の輪」を張る塔にする。
  // 建物側にも「その場から退かせる」圧を持たせるための枠（敵の hazard と同じ仕組み）。
  {
    const feat = stageFeatures(stageIndex);
    const larges = result.filter(b => b.size === "large" && !b.isBoss);
    for (let i = larges.length - 1; i > 0; i--) {
      const j = Math.floor(random() * (i + 1));
      const t = larges[i]; larges[i] = larges[j]; larges[j] = t;
    }
    // v0.57: 時代ごとの兵器をテーブル順に割り当てる（同じ建物に2種は付けない）
    let cursor = 0;
    for (const [key, count] of feat.emplacements) {
      const def = EMPLACEMENT_DEFS[key];
      if (!def) continue;
      for (let k = 0; k < count && cursor < larges.length; k++, cursor++) {
        larges[cursor]._emplacement = key;
        larges[cursor].attackRadius = Math.max(larges[cursor].attackRadius, def.range);
      }
    }
  }

  // 卵持ちフラグをステージ全体に散らばらせて付与する（町ごとに均等割当）。
  assignEggBearers(result);

  // --- (3) ボスと首都建物を配列に追加 ---
  result.push(boss);
  for (const b of capitalBuildings) result.push(b);

  // v0.60: 衝撃砲台を**強い街と首都区画**に置く（Shooter指示）。
  // 時代ごとの兵器（feat.emplacements）とは別枠なのでどの文明でも出る。
  // 首都建物を含めたいので、capitalBuildings を result に入れた後で回す。
  {
    const pickInto = (pool, count) => {
      // 既に時代兵器が付いている建物は避ける（1棟に2種は付けない）
      const free = pool.filter(b => !b._emplacement && !b.fallen);
      for (let i = free.length - 1; i > 0; i--) {
        const j = Math.floor(random() * (i + 1));
        const t = free[i]; free[i] = free[j]; free[j] = t;
      }
      const def = EMPLACEMENT_DEFS.concussionBattery;
      for (let k = 0; k < count && k < free.length; k++) {
        free[k]._emplacement = "concussionBattery";
        free[k].attackRadius = Math.max(free[k].attackRadius, def.range);
      }
    };

    // 町ごとにまとめる（_townIndex は generateTown が振る）
    const byTown = new Map();
    for (const b of result) {
      if (b.isBoss || b._isWall || b._isCapital) continue;
      if (b.size !== "large" && b.size !== "medium") continue;
      const key = b._townIndex;
      if (key === undefined) continue;
      if (!byTown.has(key)) byTown.set(key, []);
      byTown.get(key).push(b);
    }
    for (const [, buildings] of byTown) {
      // 要塞都市＝最初から最大段階で固定。格上の街＝動員段階が1つ先
      const isFortress = buildings.some(b => b._fixedTier != null);
      const isAdvanced = buildings.some(b => (b._tierOffset || 0) > 0);
      if (isFortress) pickInto(buildings, CONCUSSION_PER_FORTRESS_TOWN);
      else if (isAdvanced && random() < CONCUSSION_ADVANCED_CHANCE) {
        pickInto(buildings, CONCUSSION_PER_ADVANCED_TOWN);
      }
    }
    // ボス周辺（首都区画）。城下の民家は _noAttack なので対象から外す
    pickInto(result.filter(b => b._isCapital && !b._noAttack), CONCUSSION_IN_CAPITAL);
  }

  // --- (4) 変更4: tiny 集落をマップ全体に散布する ---
  // 首都・既存建物との重なりを避けて配置し、最後に result へ追加する。
  // assignEggBearers の後に追加するため、tiny はフォールバック（towns=0）で
  // 全体1町として扱われるが、ここでは全建物確定後に個別に卵持ち割当を補う。
  const tinyBuildings = generateTinySettlements(result, boss.wx, boss.wy, config);
  // tiny だけを対象に卵持ちを割当（eggBearerRatio に基づく）
  const tinyEggCount = Math.max(1, Math.round(tinyBuildings.length * eggBearerRatio()));
  const tinyIndices  = Array.from({ length: tinyBuildings.length }, (_, i) => i);
  for (let i = 0; i < tinyEggCount && i < tinyIndices.length; i++) {
    const j   = i + Math.floor(random() * (tinyIndices.length - i));
    const tmp = tinyIndices[i]; tinyIndices[i] = tinyIndices[j]; tinyIndices[j] = tmp;
    tinyBuildings[tinyIndices[i]].isEggBearer = true;
  }
  for (const b of tinyBuildings) result.push(b);

  // --- (4b) v0.11: 道沿いの集落 — 街道のところどころに小さな民家群を置く。
  // 「道があるから人が住む」の地理感＋壊す対象の追加供給。卵割当は tiny と同率。
  const roadsideBuildings = generateRoadsideHamlets(result, townRoadEdges, boss, config);
  const rsEggCount  = Math.max(1, Math.round(roadsideBuildings.length * eggBearerRatio()));
  const rsIndices   = Array.from({ length: roadsideBuildings.length }, (_, i) => i);
  for (let i = 0; i < rsEggCount && i < rsIndices.length; i++) {
    const j   = i + Math.floor(random() * (rsIndices.length - i));
    const tmp = rsIndices[i]; rsIndices[i] = rsIndices[j]; rsIndices[j] = tmp;
    roadsideBuildings[rsIndices[i]].isEggBearer = true;
  }
  for (const b of roadsideBuildings) result.push(b);

  // --- (4c) v0.29: スタート地点周辺の「まばらな家」（街は置かず単独の家を散らす）---
  const startHouses = generateStartAreaHouses(result, config);
  for (const b of startHouses) result.push(b);

  // --- (5) v0.6-p3: 首都城壁リング（STAGE 2以降。ゲート数はステージで減る） ---
  const wallSegments = generateWallRing(boss, stageIndex);   // v0.56: 城壁の量は文明（時代）で決まる
  for (const w of wallSegments) result.push(w);

  // --- (5b) v0.29: 一部の町にも部分的な城壁（STAGE3以降。rect町は長方形の壁）---
  const townWalls = generateTownWalls(townMetas, stageIndex);
  for (const w of townWalls) result.push(w);

  // --- (6) v0.6-p3: 地形障害物（岩山・湖）を空白地帯へ散布 ---
  // settlements とは別系統（破壊不可）。モジュールスコープの terrainObstacles を更新する。
  terrainObstacles = generateTerrainObstacles(result, boss);

  // v0.17: 森（非ブロッキングの自然装飾。竜は上を飛ぶ）を空白地帯へ散布
  forestClusters = generateForests(result, boss);

  // --- (7) v0.6-p4: 移動敵ユニット（文明別・ステージ数に応じた混成編成） ---
  movers = generateMovers(stageIndex, boss);
  shockwaveFxList.length = 0;
  bombList.length = 0;       // v0.37.1: 前ステージの未炸裂爆弾を持ち越さない
  tongueFxList.length = 0;
  hazards.length = 0;        // v0.42: 前ステージの危険地帯を持ち越さない
  laserStrikes.length = 0;   // v0.48: 撃ちかけのレーザーを持ち越さない
  barrageQueue.length = 0;   // v0.57: 予約済みの斉射を持ち越さない
  hazardShots.length = 0;    // v0.63: 飛行中の見せ弾を持ち越さない
  chainFxList.length = 0;
  floodWave = null;          // v0.43: 前ステージの洪水を持ち越さない
  resetRaiderState();   // v0.8: レイダー湧き状態もステージごとにリセット

  // --- (8) v0.6-p4: 後半ステージの難度底上げ（仕様 §4。プレイヤーの3択強化ぶんを相殺） ---
  // ボスは BOSS_HP_STAGE_MULT で既にスケールするため対象外。城壁もステージ別HP設定済みのため対象外。
  // v0.56: 係数は「時代の底上げ（文明ごとの基礎難度）× その建物の動員段階」。
  // 段階0の普通の街は等倍、要塞都市は最大段階ぶん重くなる。
  for (const b of result) {
    if (b.isBoss || b._isWall) continue;
    const boost = settlementPowerBoost(b, 0);
    b._baseColor = b.color;   // 段階で色を締めるときの基準を控えておく
    b.maxHp = Math.round(b.maxHp * boost.hp);
    b.hp    = b.maxHp;
    b.projectileDamage *= boost.dmg;
    // 最初から段階が上がっている街は、その分だけ色を締めて見分けられるようにする
    // （要塞は最大段階のさらに1段上。段階4になっても普通の街と混ざらない）
    const tier = settlementTier(b, 0);
    const shadeTier = b._fixedTier != null ? tier + 1 : tier;
    if (shadeTier > 0) b.color = shadeColor(b._baseColor, TIER_SHADE_STEP * shadeTier);
  }

  // --- (9) v0.23: 花火要塞 — 倒すと連鎖的に散る"うまみ"建物を各ステージに数棟仕込む ---
  // ボス・城壁・首都・卵持ち以外の通常建物から抽選（後半ほど棟数が増える）。
  {
    const fwCandidates = [];
    for (let i = 0; i < result.length; i++) {
      const b = result[i];
      if (b.isBoss || b._isWall || b._isCapital || b.isEggBearer) continue;
      fwCandidates.push(i);
    }
    const fwCount = 1 + Math.floor(stageIndex / 3);   // stage1-3=1, 4-6=2, 7-8=3
    for (let k = 0; k < fwCount && fwCandidates.length > 0; k++) {
      const pick = Math.floor(random() * fwCandidates.length);
      const idx  = fwCandidates.splice(pick, 1)[0];
      result[idx].isFirework = true;
    }
  }

  return result;
}

// v0.6-p4: ステージ別の難度底上げ係数（stageIndex 0始まり）
// v0.8: ステージ5〜8を追加（持ち越した強化を相殺しつつ右肩上がりの緊張を作る）
const STAGE_DIFFICULTY_BOOST = [
  null,
  null,
  { hp: 1.15, dmg: 1.10 },
  { hp: 1.30, dmg: 1.20 },
  { hp: 1.55, dmg: 1.30 },
  { hp: 1.80, dmg: 1.42 },
  { hp: 2.10, dmg: 1.55 },

// -----------------------------------------------------------------
// v0.9.1: 街道網 — 町の中心とボス首都を最小全域木（Prim法）でつなぐ。
// 「街と街をつなぐ道」として建物レイヤーの最背面近くに描かれる。
// -----------------------------------------------------------------
let townRoadEdges = [];

function buildTownRoadNetwork(townCenters, boss) {
  const nodes = townCenters.map(c => ({ x: c.x, y: c.y }));
  nodes.push({ x: boss.wx, y: boss.wy });   // 首都へも街道が伸びる（攻略導線を兼ねる）
  const edges = [];
  if (nodes.length < 2) return edges;

  const inTree = new Set([0]);
  while (inTree.size < nodes.length) {
    let best = null;
    for (const i of inTree) {
      for (let j = 0; j < nodes.length; j++) {
        if (inTree.has(j)) continue;
        const d = dist2(nodes[i].x, nodes[i].y, nodes[j].x, nodes[j].y);
        if (!best || d < best.d) best = { i, j, d };
      }
    }
    edges.push([nodes[best.i], nodes[best.j]]);
    inTree.add(best.j);
  }
  return edges;
}

// -----------------------------------------------------------------
// v0.10: 川と橋 — 「川と街道が土地を形づくり、その結節点に街がある」の演出。
// 川は蛇行しながらマップを縦断する視覚要素（通行判定なし＝飛竜は川を越えて飛べる）。
// 橋は川と街道が交わる点に架け、地理の説得力と攻略導線の両方を担う。
// -----------------------------------------------------------------
// -----------------------------------------------------------------
// v0.43: ダム／堰 — 壊すと下流が一斉に水没する
// -----------------------------------------------------------------
// 「1つ壊すと広域が落ちる」＝俯瞰で最も映える攻略対象（next-steps §5-3 の推し筆頭）。
// 川沿いに建つ堰を壊すと、下流へ水の壁が走り、通り過ぎた帯の建物が順に崩れる。
// 高HPにして「わざわざ狙いに行く価値のある的」にする。
const DAM_HP_MULT      = 6.0;   // large 建物基準の倍率
const DAM_FLOOD_SPEED  = 900;   // 水が下流へ走る速さ（px/s）。速すぎると何が起きたか読めない
const DAM_FLOOD_BAND   = 230;   // 水没する川からの距離（片側）
const DAM_FLOOD_DAMAGE = 400;   // 水没した建物へのダメージ（小屋〜大型まで確実に落ちる量）
let floodWave = null;           // { dist, maxDist, fromIdx } 進行中の洪水（1本だけ）

let riverPolyline    = [];   // [{x,y}, ...] 川の中心線
let riverWidth       = 56;
let bridgePlacements = [];    // [{x, y, angle}] 街道×川の交点

// 川の中心線を生成する（縦断／横断を交互に、sin蛇行）。
function generateRiver(stageIndex) {
  const vertical = stageIndex % 2 === 0;   // 偶数ステージは縦断、奇数は横断
  const pts = [];
  const amp  = randRange(240, 420);
  const freq = randRange(1.4, 2.4);
  const phase = randRange(0, Math.PI * 2);
  const baseAlong = vertical
    ? randRange(WORLD_W * 0.32, WORLD_W * 0.68)
    : randRange(WORLD_H * 0.32, WORLD_H * 0.68);
  const STEPS = 24;
  for (let i = 0; i <= STEPS; i++) {
    const t = i / STEPS;                 // 0→1
    const along = t * Math.PI * freq + phase;
    const cross = baseAlong + Math.sin(along) * amp;
    if (vertical) pts.push({ x: cross, y: t * WORLD_H });
    else          pts.push({ x: t * WORLD_W, y: cross });
  }
  riverWidth = randRange(48, 70);
  return pts;
}

// 2線分の交点（なければ null）。
function segmentIntersection(p1, p2, p3, p4) {
  const d = (p2.x - p1.x) * (p4.y - p3.y) - (p2.y - p1.y) * (p4.x - p3.x);
  if (Math.abs(d) < 1e-9) return null;
  const t = ((p3.x - p1.x) * (p4.y - p3.y) - (p3.y - p1.y) * (p4.x - p3.x)) / d;
  const u = ((p3.x - p1.x) * (p2.y - p1.y) - (p3.y - p1.y) * (p2.x - p1.x)) / d;
  if (t < 0 || t > 1 || u < 0 || u > 1) return null;
  return { x: p1.x + t * (p2.x - p1.x), y: p1.y + t * (p2.y - p1.y) };
}

// 街道（直線近似）と川の交点に橋を架ける。
function computeBridges(roadEdges, river) {
  const bridges = [];
  for (const [a, b] of roadEdges) {
    for (let i = 0; i < river.length - 1; i++) {
      const hit = segmentIntersection(a, b, river[i], river[i + 1]);
      if (hit) {
        // 橋は街道の進行方向を向く
        const angle = Math.atan2(b.y - a.y, b.x - a.x);
        bridges.push({ x: hit.x, y: hit.y, angle });
        break;  // 1街道につき最初の交点のみ（多重橋を避ける）
      }
    }
  }
  return bridges;
}

// v0.7: 要塞都市の強化倍率（ボス近傍2〜3町に適用）
const FORTIFIED_HP_MULT       = 2.2;
const FORTIFIED_DMG_MULT      = 1.5;
const FORTIFIED_INTERVAL_MULT = 0.7;   // 発射間隔短縮（撃ってくる頻度が上がる）

/**
 * 町の全建物を要塞化する。HP・火力を引き上げ、_fortified フラグで
 * 描画側が「明らかに強そうな見た目」（黒鉄の輪郭＋深紅の軍旗）に切り替える。
 */
function applyTownFortification(townBuildings) {
  for (const b of townBuildings) {
    b._fortified = true;
    b.maxHp = Math.round(b.maxHp * FORTIFIED_HP_MULT);
    b.hp    = b.maxHp;
    b.projectileDamage  *= FORTIFIED_DMG_MULT;
    b.projectileInterval *= FORTIFIED_INTERVAL_MULT;
    if (b._townMeta) b._townMeta._fortified = true;  // 道路描画で城郭リムを引く
  }
}

/**
 * ボス集落を「ボス＋リング全体がマップ内に収まる」ワールド右寄り位置に配置する。
 * 小集落クラスタはこの後に生成されるため、ここでは既存建物チェックは不要。
 * マップ端からのマージンに CAPITAL_BOSS_MARGIN（リング外縁＋余白）を使う。
 */
function placeBossBuilding(stageIndex, config) {
  const bossTheme = config.boss;
  // ワールド右2/3エリアかつリング外縁がマップ外に出ない安全内側に配置する。
  // CAPITAL_BOSS_MARGIN = CAPITAL_RING_OUTER + CAPITAL_RADIUS_BASE + 80px のマージン。
  const minX = WORLD_W * 0.45;
  const maxX = WORLD_W - CAPITAL_BOSS_MARGIN;
  const minY = CAPITAL_BOSS_MARGIN;
  const maxY = WORLD_H - CAPITAL_BOSS_MARGIN;

  // 乱数で配置（マップが狭くて範囲が逆転しないようクランプ）
  const safeMaxX = Math.max(minX + 1, maxX);
  const safeMaxY = Math.max(minY + 1, maxY);
  const bossWx = minX + random() * (safeMaxX - minX);
  const bossWy = minY + random() * (safeMaxY - minY);

  return makeBossBuilding(bossWx, bossWy, stageIndex, bossTheme);
}

/**
 * ボス周囲に large サイズ帯の建物を環状（ドーナツ状）に配置して「首都要塞」を形成する。
 *
 * アルゴリズム:
 *   CAPITAL_RING_COUNT 本の候補角度をリング内に均等分割し、
 *   CAPITAL_RING_INNER〜CAPITAL_RING_OUTER のドーナツ領域に収めた座標を生成する。
 *   各候補は (1) ボス本体との最小間隔、(2) 先行配置済み首都建物との最小間隔を確認し、
 *   重なる場合は半径または角度を微調整して再試行する。
 *
 * @param {Object} boss  placeBossBuilding で生成したボスオブジェクト
 * @param {Object} config  STAGE_CONFIGS[stageIndex]
 * @returns {Array}  配置された首都建物のリスト
 */
function placeCapitalDistrict(boss, config) {
  const result = [];
  const bossX = boss.wx;
  const bossY = boss.wy;

  // ボス中心から最低限離れなければならない距離（ボス半径 + 首都建物半径 + 最小隙間）
  const minBossDist = BOSS_RADIUS + CAPITAL_RADIUS_BASE + 10;
  const minBossDist2 = minBossDist * minBossDist;

  // 首都建物同士の最小距離（重なり防止）
  const minCapDist2 = CAPITAL_MIN_SPACING * CAPITAL_MIN_SPACING;

  // 角度スロットを CAPITAL_RING_COUNT 等分割
  const angleStep = (Math.PI * 2) / CAPITAL_RING_COUNT;

  for (let k = 0; k < CAPITAL_RING_COUNT; k++) {
    // 各スロットで最大4回試行：境界チェックや重なりで失敗した場合に半径・角度を微変化させて再挑戦
    const MAX_ATTEMPTS = 4;
    let placed = false;

    for (let attempt = 0; attempt < MAX_ATTEMPTS && !placed; attempt++) {
      // 角度に±15%のランダムオフセット（有機的な配置感）
      const baseAngle = k * angleStep + (random() * angleStep * 0.30 - angleStep * 0.15);

      // 半径: ドーナツ内縁〜外縁のランダム位置（attempt が増えるほど内縁寄りを試して境界を回避）
      const radiusRand = Math.max(0, random() - attempt * 0.15);
      const radius = CAPITAL_RING_INNER + radiusRand * (CAPITAL_RING_OUTER - CAPITAL_RING_INNER);

      const wx = bossX + Math.cos(baseAngle) * radius;
      const wy = bossY + Math.sin(baseAngle) * radius;

      // ワールド境界チェック（建物半径分の余白を確保）
      const pad = CAPITAL_RADIUS_BASE + 10;
      if (wx < pad || wx > WORLD_W - pad || wy < pad || wy > WORLD_H - pad) continue;

      // ボス本体との最小間隔チェック
      if (dist2(wx, wy, bossX, bossY) < minBossDist2) continue;

      // 先行配置済み首都建物との重なりチェック
      let tooClose = false;
      for (const cap of result) {
        if (dist2(wx, wy, cap.wx, cap.wy) < minCapDist2) {
          tooClose = true;
          break;
        }
      }
      if (tooClose) continue;

      result.push(makeCapitalBuilding(wx, wy, config));
      placed = true;
    }
    // MAX_ATTEMPTS 試行後も配置できなかった場合はそのスロットをスキップ
    // （ボスが端に追い込まれた場合の安全網）
  }

  // v0.41: 城下の充填。**候補点を同心リング上に作ってから置く**方式に変えた。
  // 旧実装は「完全ランダムな点を6回試す」だったので、密度を上げようとしても
  // 後半はほぼ全部が重なりで弾かれ、棟数を増やしても密にならなかった。
  // 六方最密に近い候補列（行間 = 間隔×0.87）を作ってシャッフルすれば、
  // 見た目のランダムさを保ったまま**上限近くまで詰められる**。
  const fillPad = CAPITAL_SMALL_RADIUS + 10;
  function capitalFillCandidates(spacing, phase = 0, rInner = CAPITAL_SMALL_INNER) {
    const pts = [];
    let row = 0;
    for (let r = rInner; r <= CAPITAL_SMALL_OUTER; r += spacing * 0.87, row++) {
      const slots = Math.max(1, Math.floor((Math.PI * 2 * r) / spacing));
      // 隣の行と半スロットずらす＝六方最密。ずらさないと行間が詰まったとき互いに弾き合う。
      const angOff = random() * Math.PI * 2 + (row % 2) * (Math.PI / slots) + phase;
      for (let k = 0; k < slots; k++) {
        // ジッタは控えめ（大きくすると隣と衝突して置けなくなり、かえって粗くなる）
        const rr = r + randRange(-spacing * 0.07, spacing * 0.07);
        const aa = angOff + ((k + randRange(-0.12, 0.12)) / slots) * Math.PI * 2;
        pts.push({ x: bossX + Math.cos(aa) * rr, y: bossY + Math.sin(aa) * rr });
      }
    }
    for (let i = pts.length - 1; i > 0; i--) {
      const j = Math.floor(random() * (i + 1));
      const t = pts[i]; pts[i] = pts[j]; pts[j] = t;
    }
    return pts;
  }

  // 既存の首都建物すべてと重ならないか（サイズごとに必要な間隔が違う）
  function capitalSpotFree(wx, wy, radius, selfSpacing) {
    if (wx < fillPad || wx > WORLD_W - fillPad || wy < fillPad || wy > WORLD_H - fillPad) return false;
    if (dist2(wx, wy, bossX, bossY) < (BOSS_RADIUS + radius + 14) ** 2) return false;
    for (const cap of result) {
      const capR = cap.size === "large" ? CAPITAL_RADIUS_BASE
                 : cap.size === "medium" ? CAPITAL_MEDIUM_RADIUS
                 : CAPITAL_SMALL_RADIUS;
      // 同サイズ同士は selfSpacing、異サイズは「両者の半径 + 余白」
      const gap = (capR === radius) ? selfSpacing : (capR + radius + 5);
      if (dist2(wx, wy, cap.wx, cap.wy) < gap * gap) return false;
    }
    return true;
  }

  // medium を先に置く（大きい方から置かないと small に埋められて入る場所が無くなる）
  {
    const cands = capitalFillCandidates(CAPITAL_MEDIUM_MIN_SPACING, 0, CAPITAL_MEDIUM_INNER);
    let placed = 0;
    for (const p of cands) {
      if (placed >= CAPITAL_MEDIUM_COUNT) break;
      if (!capitalSpotFree(p.x, p.y, CAPITAL_MEDIUM_RADIUS, CAPITAL_MEDIUM_MIN_SPACING)) continue;
      result.push(makeCapitalMediumBuilding(p.x, p.y, config));
      placed++;
    }
  }

  // small で残りの隙間を埋める。**2巡する**（1巡目で弾かれた隙間を、
  // 角度位相をずらした2巡目が拾う。1巡だけだと上限の6割程度で止まる）。
  {
    let placed = 0;
    for (let pass = 0; pass < 4 && placed < CAPITAL_SMALL_COUNT; pass++) {
      const cands = capitalFillCandidates(CAPITAL_SMALL_MIN_SPACING, pass * 0.37);
      for (const p of cands) {
        if (placed >= CAPITAL_SMALL_COUNT) break;
        if (!capitalSpotFree(p.x, p.y, CAPITAL_SMALL_RADIUS, CAPITAL_SMALL_MIN_SPACING)) continue;
        result.push(makeCapitalSmallBuilding(p.x, p.y, config));
        placed++;
      }
    }
  }

  return result;
}

/**
 * 首都要塞建物を生成する。
 * 通常 large 帯のパラメータを使い、HP のみ CAPITAL_HP_MULT 倍で「首都＝強い」感を出す。
 * isBoss は false のまま——ボスではなく「ボスを守る要塞の一部」として機能する。
 *
 * @param {number} wx  ワールドX座標
 * @param {number} wy  ワールドY座標
 * @param {Object} config  STAGE_CONFIGS[stageIndex]
 * @returns {Object}  建物オブジェクト
 */
function makeCapitalBuilding(wx, wy, config) {
  const bLarge = config.buildings.large;
  const baseHp = randInt(BUILDING_SIZE_PARAMS.large.hpMin, BUILDING_SIZE_PARAMS.large.hpMax);
  const hp     = Math.round(baseHp * CAPITAL_HP_MULT);
  // 首都建物の色は large カラーから選ぶ（ステージテーマに合わせる）
  const color  = randChoice(bLarge.colors);

  const building = makeBuilding(wx, wy, "large", color, bLarge, hp);
  // 首都建物は要塞都市の一部であることを示すフラグ
  // （_townMeta は持たない → assignEggBearers のフォールバックで全体1町として卵割当対象に含まれる）
  building._isCapital = true;
  return building;
}

/**
 * 城下の雑魚建物（small サイズ）を生成する。
 * 通常 small 帯と同じパラメータを使う（弱い・すぐ壊れる城下住民）。
 * 卵持ち割当の対象になることでボス前で群れが育つ良い流れを作る。
 *
 * @param {number} wx  ワールドX座標
 * @param {number} wy  ワールドY座標
 * @param {Object} config  STAGE_CONFIGS[stageIndex]
 * @returns {Object}  建物オブジェクト
 */
function makeCapitalSmallBuilding(wx, wy, config) {
  const bSmall = config.buildings.small;
  const hp     = randInt(BUILDING_SIZE_PARAMS.small.hpMin, BUILDING_SIZE_PARAMS.small.hpMax);
  // 城下の small は small カラーから選ぶ（ステージテーマに合わせる）
  const color  = randChoice(bSmall.colors);
  // v0.41: HP倍率は掛けない。城下の民家は**壊して卵に変える材料**なので、
  // 密度を上げたぶん1棟あたりは軽いままにしておかないと群れが育つ前に足が止まる
  // （実測: ×1.3 だと STAGE8 でボスHPを88%残して全滅した）。
  const building = makeBuilding(wx, wy, "small", color, bSmall, hp);
  // 城下建物フラグ（通常クラスタとの区別用。卵割当・カリング対象には通常通り含まれる）
  building._isCapitalSmall = true;
  // 大半は「ただの民家」＝撃たない。守りは城壁・要塞リング・守備隊が担う。
  building._noAttack = random() > CAPITAL_SMALL_SHOOTER_RATE;
  return building;
}

/**
 * v0.41: 城下の medium 建物。街と同じサイズ構成にして「首都の市街」に見せるために足した。
 * 通常 medium 帯のパラメータをそのまま使う（カタパルトは撃たない＝弾幕は増やさない）。
 */
function makeCapitalMediumBuilding(wx, wy, config) {
  const bMedium = config.buildings.medium;
  const hp      = randInt(BUILDING_SIZE_PARAMS.medium.hpMin, BUILDING_SIZE_PARAMS.medium.hpMax);
  const building = makeBuilding(wx, wy, "medium", randChoice(bMedium.colors), bMedium, hp);
  building._isCapitalSmall = true;   // 城下フラグ（卵割当・カリングは通常どおり）
  building._noAttack = random() > CAPITAL_SMALL_SHOOTER_RATE;
  return building;
}

// =================================================================
// v0.6-p3: 首都城壁（ドラゴン侵入不可・破壊可能）＋地形障害物（破壊不可）
// 仕様: docs/gdd/dragon-tide-v0.6-spec.md §8
// =================================================================

// 城壁リング半径（城下充填の外縁360pxの外側）
const WALL_RING_RADIUS   = 420;
// セグメント間隔（弧長px）。半径420の円周≈2639px ÷ 48px ≈ 55セグメント
const WALL_SEG_SPACING   = 48;
// セグメントの当たり半径（隣とほぼ接し、隙間から竜が抜けない値）
const WALL_SEG_RADIUS    = 26;
// ゲート（開口部）の幅（弧長px）。群れが余裕を持って通れる幅
const WALL_GATE_WIDTH    = 150;
// ステージ別城壁設定（stageIndex 0始まり）: STAGE1は城壁なし、進むほどゲートが減る（§8.2）
// v0.8: ステージ5〜8を追加。後半は二重リング＋高HPが標準になる
// v0.58: **HPを6倍**にした（Shooter指示「全体的に壁はもっと硬くていい」）。
// 旧値では40体の群れが1セグメントを **0.27〜0.97秒**で割っていて、
// 城壁が「門を探すか壊すか」の判断を一切生んでいなかった。
// 町壁は generateTownWalls がこの値の0.7倍を使う＝同時に厚くなる。
const WALL_STAGE_CONFIG = [
  null,
  { gates: 3, hp: 240, doubleRing: false },
  { gates: 2, hp: 280, doubleRing: false },
  { gates: 1, hp: 320, doubleRing: true },
  { gates: 2, hp: 380, doubleRing: true },
  { gates: 2, hp: 440, doubleRing: true },
  { gates: 1, hp: 500, doubleRing: true },
  { gates: 1, hp: 580, doubleRing: true },
];
// 二重リング（STAGE 4）の外側リング半径
const WALL_OUTER_RING_RADIUS = 484;

/**
 * 城壁セグメントを1つ生成する。settlements パイプライン（描画・ダメージ・
 * 空間ハッシュ・XP）に乗せるため建物オブジェクトとして作る。
 * _isWall=true: Boids押し出し対象・卵/攻撃なし・XP12（xpValueOf参照）。
 */
function makeWallSegment(wx, wy, hp, tangentAngle) {
  return {
    wx,
    wy,
    size: "wall",
    color: "#6a7078",
    shape: "wallSegment",
    radius: WALL_SEG_RADIUS,
    maxHp: hp,
    hp,
    fallen: false,
    isEggBearer: false,
    isBoss: false,
    _isWall: true,
    _wallAngle: tangentAngle,   // 描画時にリング接線方向へ回転させる
    // 城壁は攻撃しない（attackRadius=0 で射程判定に一切かからない）
    attackTimer: Infinity,
    attackRadius: 0,
    projectileInterval: Infinity,
    projectileSpeed: 0,
    projectileDamage: 0,
    projectileColor: "#fff",
    projectileCount: 0,
    projectileTracking: false,
    projectileAoe: 0,
    reward: { eggMin: 0, eggMax: 0 },
    _breathParticleTimer: 0,
  };
}

/**
 * ボスを中心とした城壁リングを生成する（STAGE 2以降）。
 * ゲート角をランダム基準で等間隔に取り、その弧幅内のセグメントを抜いて開口部にする。
 * STAGE 4 は外側にもう1周（二重リング。ゲート角は共有＝一直線に突破口が並ぶ）。
 */
function generateWallRing(boss, stageIndex) {
  const config = WALL_STAGE_CONFIG[stageIndex];
  if (!config) return [];

  const result = [];
  const gateBaseAngle = random() * Math.PI * 2;
  const gateAngles = [];
  for (let g = 0; g < config.gates; g++) {
    gateAngles.push(gateBaseAngle + (g * Math.PI * 2) / config.gates);
  }

  const rings = config.doubleRing
    ? [WALL_RING_RADIUS, WALL_OUTER_RING_RADIUS]
    : [WALL_RING_RADIUS];

  for (const ringRadius of rings) {
    const segCount      = Math.floor((Math.PI * 2 * ringRadius) / WALL_SEG_SPACING);
    const angleStep     = (Math.PI * 2) / segCount;
    const gateHalfAngle = (WALL_GATE_WIDTH * 0.5) / ringRadius;

    for (let k = 0; k < segCount; k++) {
      const angle = k * angleStep;

      // ゲート開口部チェック（角度差を -π〜π に正規化して比較）
      let inGate = false;
      for (const gate of gateAngles) {
        let diff = angle - gate;
        while (diff >  Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        if (Math.abs(diff) < gateHalfAngle) { inGate = true; break; }
      }
      if (inGate) continue;

      const wx = boss.wx + Math.cos(angle) * ringRadius;
      const wy = boss.wy + Math.sin(angle) * ringRadius;
      // マップ外にはみ出るセグメントはスキップ（ボスは端から十分内側だが安全網）
      if (wx < 20 || wx > WORLD_W - 20 || wy < 20 || wy > WORLD_H - 20) continue;

      result.push(makeWallSegment(wx, wy, config.hp, angle + Math.PI / 2));
    }
  }
  return result;
}

// =================================================================

// 追いかけっこにしない: 低速の巡回/行進のみ。騎士方陣だけ反応射程400px内で接近。

/** 角度差を -π..π に畳む。 */
function wrapAngle(a) {
  while (a > Math.PI) a -= Math.PI * 2;
  while (a < -Math.PI) a += Math.PI * 2;
  return a;
}
