const TERRAIN_MAX_ATTEMPTS = 30;

// v0.17.1: 地形・森スプライトの不透明度（背景要素なのでトーンを落として主張を抑える）。
// 低いほど暗い地面が透けて背景に馴染む。ここだけ変えれば見え方を調整できる。
const TERRAIN_SPRITE_ALPHA = { rock: 0.55, lake: 0.55, forest: 0.40 };

// v0.17: 森クラスタ（非ブロッキングの自然装飾。竜も敵も上を飛び越える＝当たり判定なし）。
// 「文明の外側に広がる自然」を描いてアクアリウム感（世界の生命感）を足す。
let forestClusters = [];
const FOREST_COUNT_MIN = 8;
const FOREST_COUNT_MAX = 16;
const FOREST_MARGIN    = 90;

/**
 * 森を空白地帯へ散布する（非ブロッキング＝当たり判定なし・純粋な背景装飾）。
 * 建物・地形・川・スタート地点・ボス圏を避けて置く。数個ずつ寄せて「林」の塊にする。
 */
function generateForests(buildings, boss) {
  const result = [];
  // v0.49: 森も空白を埋める役なので面積比そのまま
  const count  = randInt(scaledForWorld(FOREST_COUNT_MIN), scaledForWorld(FOREST_COUNT_MAX));
  const bossClear = WALL_OUTER_RING_RADIUS + 100;
  // 畑クラスタの位置（森が畑に被らないように）
  const fieldSpots = [];
  for (const b of buildings) {
    if (!b._townMeta) continue;
    for (const f of b._townMeta.fields ?? []) fieldSpots.push({ x: f.x, y: f.y, r: Math.hypot(f.w, f.h) * 0.5 });
  }

  for (let k = 0; k < count; k++) {
    const radius = randRange(45, 95);
    for (let attempt = 0; attempt < 24; attempt++) {
      const wx = FOREST_MARGIN + random() * (WORLD_W - FOREST_MARGIN * 2);
      const wy = FOREST_MARGIN + random() * (WORLD_H - FOREST_MARGIN * 2);

      if (dist2(wx, wy, 250, WORLD_H * 0.5) < (TERRAIN_START_CLEAR + radius) ** 2) continue;
      if (dist2(wx, wy, boss.wx, boss.wy) < (bossClear + radius) ** 2) continue;

      let collides = false;
      // 建物（町の敷地）を避ける
      for (const b of buildings) {
        const minD = radius + b.radius + 24;
        if (dist2(wx, wy, b.wx, b.wy) < minD * minD) { collides = true; break; }
      }
      if (collides) continue;
      // 岩山・湖を避ける
      for (const ob of terrainObstacles) {
        const minD = radius + ob.radius + 20;
        if (dist2(wx, wy, ob.wx, ob.wy) < minD * minD) { collides = true; break; }
      }
      if (collides) continue;
      // 畑を避ける
      for (const f of fieldSpots) {
        const minD = radius + f.r + 12;
        if (dist2(wx, wy, f.x, f.y) < minD * minD) { collides = true; break; }
      }
      if (collides) continue;
      // 川の上を避ける
      if (riverPolyline.length > 1 &&
          distPointToPolylineSq(wx, wy, riverPolyline) < (riverWidth * 0.5 + radius * 0.6) ** 2) continue;
      // 既存の森と近すぎない（少しは寄せてよいので緩め）
      for (const fo of result) {
        const minD = radius + fo.radius - 20;
        if (dist2(wx, wy, fo.wx, fo.wy) < minD * minD) { collides = true; break; }
      }
      if (collides) continue;

      result.push({ wx, wy, radius });
      break;
    }
  }
  return result;
}

/** v0.17: 森スプライトを地面レイヤーに焼く（当たり判定なし・純装飾）。 */
function drawForestsOnLayer(bctx, bounds) {
  const img = terrainImages.forest;
  if (!img) return;   // 画像が読めないときは森を描かない（ベクター林は用意しない）
  for (const fo of forestClusters) {
    // v0.49: スプライトは半径の2.3倍まで広がるので、判定もその外接円で行う
    if (!layerBoundsHitCircle(bounds, fo.wx, fo.wy, fo.radius * 2.3)) continue;
    const drawW = fo.radius * 2.3;
    const drawH = drawW * (img.naturalHeight / img.naturalWidth);
    const rot   = Math.sin(fo.wx * 0.011 + fo.wy * 0.019) * 0.6;
    const flip  = (Math.floor(fo.wy * 0.05) % 2 === 0) ? 1 : -1;
    bctx.save();
    bctx.globalAlpha = TERRAIN_SPRITE_ALPHA.forest;   // v0.17.1: 背景に馴染ませる
    bctx.translate(fo.wx, fo.wy);
    bctx.rotate(rot);
    bctx.scale(flip, 1);
    bctx.drawImage(img, -drawW / 2, -drawH / 2, drawW, drawH);
    bctx.restore();
  }
}

/**
 * 地形障害物をマップの空白地帯へ散布する。
 * 建物・首都城壁・他の地形と重ならない位置のみ採用（重なったらスキップ）。
 * 「何もない空間」を「回り込む地形」に置き換えるのが目的（仕様 §9.2）。
 */
function generateTerrainObstacles(buildings, boss) {
  const result = [];
  // v0.49: 岩山・湖は「空白を埋める」役なので面積比そのままで増やす
  const count  = randInt(scaledForWorld(TERRAIN_COUNT_MIN), scaledForWorld(TERRAIN_COUNT_MAX));
  // 城壁リング＋余白の外側にのみ配置（要塞攻略の導線を地形で塞がない）
  const bossClear = WALL_OUTER_RING_RADIUS + 120;

  // v0.16: 畑クラスタの位置を集めておく（岩山・湖が畑の上に落ちるのを防ぐ）
  const fieldSpots = [];
  for (const b of buildings) {
    if (!b._townMeta) continue;
    for (const f of b._townMeta.fields ?? []) {
      // 畑の外接円半径（回転を考慮した対角の半分）
      fieldSpots.push({ x: f.x, y: f.y, r: Math.hypot(f.w, f.h) * 0.5 });
    }
  }

  for (let k = 0; k < count; k++) {
    const type   = random() < 0.55 ? "rock" : "lake";
    const radius = type === "rock" ? randRange(40, 85) : randRange(55, 105);

    for (let attempt = 0; attempt < TERRAIN_MAX_ATTEMPTS; attempt++) {
      const wx = TERRAIN_MARGIN + random() * (WORLD_W - TERRAIN_MARGIN * 2);
      const wy = TERRAIN_MARGIN + random() * (WORLD_H - TERRAIN_MARGIN * 2);

      // 群れスタート地点の確保
      if (dist2(wx, wy, 250, WORLD_H * 0.5) < (TERRAIN_START_CLEAR + radius) ** 2) continue;
      // ボス要塞圏の確保
      if (dist2(wx, wy, boss.wx, boss.wy) < (bossClear + radius) ** 2) continue;

      // 既存建物との重なりチェック
      let collides = false;
      for (const b of buildings) {
        const minD = radius + b.radius + 30;
        if (dist2(wx, wy, b.wx, b.wy) < minD * minD) { collides = true; break; }
      }
      if (collides) continue;

      // v0.16: 畑クラスタとの重なりチェック
      for (const f of fieldSpots) {
        const minD = radius + f.r + 12;
        if (dist2(wx, wy, f.x, f.y) < minD * minD) { collides = true; break; }
      }
      if (collides) continue;

      // 他の地形との重なりチェック
      for (const ob of result) {
        const minD = radius + ob.radius + 60;
        if (dist2(wx, wy, ob.wx, ob.wy) < minD * minD) { collides = true; break; }
      }
      if (collides) continue;

      result.push({ wx, wy, radius, type });
      break;
    }
  }
  return result;
}

// 各町の建物リストから EGG_BEARER_RATIO の割合でランダムに卵持ちを選ぶ。
// _townMeta を持つ建物が「町の先頭」なので、それを境界として町ごとに分割する。
// 町ごとに割り当てることで全マップに散らばった配置になる。
function assignEggBearers(buildings) {
  // まず全フラグをリセット
  for (const b of buildings) b.isEggBearer = false;

  // _townMeta の有無で町の区切りを検出し、町ごとの配列を作る
  const towns = [];
  let current = null;
  for (const b of buildings) {
    if (b._townMeta) {
      current = [];
      towns.push(current);
    }
    if (current) current.push(b);
  }
  // _townMeta が一切ない場合は全体を1町として扱う（フォールバック）
  if (towns.length === 0) towns.push(buildings);

  for (const town of towns) {
    // この町での卵持ち数（最低1、実効割合で計算。密度倍率で割って絶対数を一定に）
    const count = Math.max(1, Math.round(town.length * eggBearerRatio()));
    // シャッフル相当: インデックス配列をランダムに選んでフラグを立てる
    const indices = [];
    for (let i = 0; i < town.length; i++) indices.push(i);
    // フィッシャー–イェーツで先頭 count 要素だけ選ぶ（部分シャッフル）
    for (let i = 0; i < count; i++) {
      const j = i + Math.floor(random() * (indices.length - i));
      const tmp = indices[i]; indices[i] = indices[j]; indices[j] = tmp;
      town[indices[i]].isEggBearer = true;
    }
  }
}

// -----------------------------------------------------------------
// オフスクリーンCanvas: 建物の静的描画レイヤー
// 建物が壊れたときだけ部分再描画する
// -----------------------------------------------------------------
/**
 * v0.11.3: 地面レイヤー（地表・川・街道・橋・地形・町の下地）を一度だけ焼く。
 * ステージ生成のたびに1回だけ呼ばれ、以降は建物が壊れても二度と書き換わらない
 * （建物レイヤー側の部分クリアが道路・畑・川を消す不具合の根本対策）。
 */
function rebuildGroundLayer() {
  // v0.49: 地表のむらの位置をここで確定させる（理由は regenerateGroundDetail 参照）
  regenerateGroundDetail();
  invalidateTiledLayer(groundTiledLayer);
}

/**
 * v0.49: 地面レイヤーのタイル1枚を焼く。描く順序は従来の全面焼きと同じ。
 * bounds を渡された描画関数は、その範囲に掛からない要素を自前で捨てる
 * （タイルごとに全ワールドを走査すると枚数ぶんの無駄になるため）。
 */
function paintGroundTile(bctx, bounds) {
  bctx.clearRect(bounds.x0, bounds.y0, LAYER_TILE, LAYER_TILE);

  // v0.8: 地面のディテール（土のパッチ＋スペックル）を最背面に焼く
  drawGroundDetailOnLayer(bctx, bounds);

  // v0.10: 川（街道より下に敷き、橋は街道の後で川の上に架ける）
  drawRiverOnLayer(bctx);

  // v0.9.1: 街と街をつなぐ街道（地形より下＝湖にかかる部分は湖が上書きして途切れる）
  drawInterTownRoadsOnLayer(bctx);

  // v0.10: 橋（川×街道の交点。川と街道の両方の上に乗る）
  drawBridgesOnLayer(bctx);

  // v0.6-p3: 地形（岩山・湖）は最背面に焼く
  drawTerrainOnLayer(bctx, bounds);

  // v0.17: 森（非ブロッキングの自然装飾。文明の外側に広がる林）
  drawForestsOnLayer(bctx, bounds);

  // v0.9.1: 街区の下地（石畳ベース＋集落の土地面）。道路より先に敷く
  drawTownBasesOnLayer(bctx, bounds);

  // 道路ラインを先に描く（建物の下に来る）
  drawRoadsOnLayer(bctx, bounds);
}

/**
 * v0.11.3: 建物レイヤー（建物・城壁・ボスのみ）を焼く。
 * このレイヤーは透過背景のまま地面レイヤーの上に重ねて転送される。
 * 建物破壊時の部分クリアはこちらのキャンバスにしか影響しないため、
 * 地面・道路・畑・川が巻き込まれて消えることがない。
 */
function rebuildBuildingLayer() {
  invalidateTiledLayer(buildingTiledLayer);
  buildingLayerDirty = false;
}

/**
 * v0.49: 建物レイヤーのタイル1枚を焼く。
 * settlements の配列順はそのまま保つ（重なりの前後関係が変わらないように）。
 * タイルに掛からない棟は描かずに捨てる。
 */
function paintBuildingTile(bctx, bounds) {
  bctx.clearRect(bounds.x0, bounds.y0, LAYER_TILE, LAYER_TILE);

  for (let s = 0; s < settlements.length; s++) {
    const settlement = settlements[s];
    if (!layerBoundsHitCircle(bounds, settlement.wx, settlement.wy,
                              settlementLayerPadding(settlement))) continue;
    drawSettlementOnLayer(bctx, settlement);
  }
}

/**
 * v0.8: 地面のディテールを静的レイヤーに焼く（背景クオリティアップ）。
 * ステージ背景色から導出した明暗2色で、大きな柔らかいパッチ（地表のむら）と
 * 細かいスペックル（砂利・草）を散らす。ステージ生成時に1回だけ実行される。
 */
// v0.49: 地表のむら・スペックルは「焼くとき」ではなく「ステージ生成時」に
// 位置を確定させておく。レイヤーをタイル化したことで焼くタイミングが
// タイルごとにばらばらになり、描画のたびに fxRandom() を引くと
// 同じ場所が焼き直されるたびに違う模様になってしまうため。
// 個数は面積比で決める（4800×3600 のとき従来と同じ 60 / 700 になる）。
const GROUND_PATCH_DENSITY   = 60  / (4800 * 3600);
const GROUND_SPECKLE_DENSITY = 700 / (4800 * 3600);

let groundDetailPatches  = [];
let groundDetailSpeckles = [];

function regenerateGroundDetail() {
  const patchCount   = Math.round(GROUND_PATCH_DENSITY   * WORLD_W * WORLD_H);
  const speckleCount = Math.round(GROUND_SPECKLE_DENSITY * WORLD_W * WORLD_H);

  groundDetailPatches  = new Array(patchCount);
  groundDetailSpeckles = new Array(speckleCount);

  // fxRandom() を引く順序は従来の描画コードと同じにしてある（見た目を変えないため）
  for (let k = 0; k < patchCount; k++) {
    const x     = fxRandom() * WORLD_W;
    const y     = fxRandom() * WORLD_H;
    const rx    = 90 + fxRandom() * 240;
    const ry    = rx * (0.5 + fxRandom() * 0.5);
    const alpha = 0.16 + fxRandom() * 0.10;
    const light = fxRandom() < 0.5;
    const rot   = fxRandom() * Math.PI;
    groundDetailPatches[k] = { x, y, rx, ry, alpha, light, rot };
  }

  for (let k = 0; k < speckleCount; k++) {
    const x     = fxRandom() * WORLD_W;
    const y     = fxRandom() * WORLD_H;
    const size  = 1 + fxRandom() * 2.5;
    const light = fxRandom() < 0.6;
    groundDetailSpeckles[k] = { x, y, size, light };
  }
}

function drawGroundDetailOnLayer(bctx, bounds) {
  const config = STAGE_CONFIGS[currentStage];
  // bgColor("#rrggbb")から明・暗のバリエーションを作る
  const lighter = shadeColor(config.bgColor, 14);
  const darker  = shadeColor(config.bgColor, -8);

  // v0.9: Gemini生成の低コントラスト地表タイルを薄く敷く。
  // alpha を抑えてステージ背景色を透かす＝時代ごとの色味を保ちつつ質感だけ足す。
  // ユニット視認性を優先し、これ以上濃くしないこと。
  // v0.49: パターンの原点は変換行列に従うのでタイルをまたいでワールド原点で揃う＝継ぎ目が出ない。
  // 塗る矩形はタイルの範囲だけに絞る（ワールド全面を塗るとタイル1枚あたり数msを無駄にする）。
  if (groundTileImage) {
    const pattern = bctx.createPattern(groundTileImage, "repeat");
    if (pattern) {
      bctx.globalAlpha = 0.30;
      bctx.fillStyle = pattern;
      if (bounds) bctx.fillRect(bounds.x0, bounds.y0, bounds.x1 - bounds.x0, bounds.y1 - bounds.y0);
      else        bctx.fillRect(0, 0, WORLD_W, WORLD_H);
      bctx.globalAlpha = 1.0;
    }
  }

  // 大きな柔らかいパッチ（地表のむら）
  for (let k = 0; k < groundDetailPatches.length; k++) {
    const patch = groundDetailPatches[k];
    const reach = Math.max(patch.rx, patch.ry);
    if (!layerBoundsHitCircle(bounds, patch.x, patch.y, reach)) continue;
    bctx.globalAlpha = patch.alpha;
    bctx.fillStyle = patch.light ? lighter : darker;
    bctx.beginPath();
    bctx.ellipse(patch.x, patch.y, patch.rx, patch.ry, patch.rot, 0, Math.PI * 2);
    bctx.fill();
  }

  // 細かいスペックル（砂利・草むら。v0.9: タイルが質感を担うため減量）
  bctx.globalAlpha = 0.22;
  for (let k = 0; k < groundDetailSpeckles.length; k++) {
    const speckle = groundDetailSpeckles[k];
    if (!layerBoundsHitCircle(bounds, speckle.x, speckle.y, speckle.size)) continue;
    bctx.fillStyle = speckle.light ? lighter : darker;
    bctx.fillRect(speckle.x, speckle.y, speckle.size, speckle.size);
  }
  bctx.globalAlpha = 1.0;
}

function drawRoadsOnLayer(bctx, bounds) {
  // 各町のメタ情報から道路を描く
  for (let s = 0; s < settlements.length; s++) {
    const meta = settlements[s]._townMeta;
    if (!meta) continue;
    if (!layerBoundsHitCircle(bounds, meta.cx, meta.cy, townMetaLayerReach(meta))) continue;
    drawTownRoadsOnLayer(bctx, meta);
  }
}

/**
 * v0.49: 町の下地・道路が中心からどこまで広がるかの外接半径。
 * 下地グラデーションが maxExtent+30、畑や道路がさらに外へ出るため余裕を持たせる。
 */
function townMetaLayerReach(meta) {
  const base = meta.maxExtent ?? meta.townR ?? 0;
  return base + 120;
}

/**
 * v0.10: 川を建物レイヤーに焼く。ポリラインを太線で二層描き（濃い水＋明るい流れ）。
 * 通行判定は持たない＝飛竜は川を越えられる。あくまで土地を形づくる背景。
 */
function drawRiverOnLayer(bctx) {
  if (riverPolyline.length < 2) return;
  bctx.save();
  bctx.lineJoin = "round";
  bctx.lineCap = "round";

  const stroke = (width, style, alpha) => {
    bctx.globalAlpha = alpha;
    bctx.strokeStyle = style;
    bctx.lineWidth = width;
    bctx.beginPath();
    bctx.moveTo(riverPolyline[0].x, riverPolyline[0].y);
    for (let i = 1; i < riverPolyline.length; i++) bctx.lineTo(riverPolyline[i].x, riverPolyline[i].y);
    bctx.stroke();
  };

  // 岸（濃い土の縁）→ 水面（深い青）→ 流れのハイライト
  stroke(riverWidth + 12, "rgba(40, 45, 40, 0.55)", 1);
  stroke(riverWidth,      "rgba(34, 62, 104, 0.92)", 1);
  stroke(riverWidth * 0.45, "rgba(90, 140, 200, 0.5)", 1);
  bctx.restore();
  bctx.globalAlpha = 1.0;
}

/**
 * v0.10: 橋を川×街道の交点に描く。橋スプライト（bridge.png）があれば街道角度で回転配置、
 * なければ石畳の矩形でフォールバック。
 */
function drawBridgesOnLayer(bctx) {
  if (bridgePlacements.length === 0) return;
  const img = buildingImages.bridge;
  for (const br of bridgePlacements) {
    bctx.save();
    bctx.translate(br.x, br.y);
    bctx.rotate(br.angle);
    // 石の土台を必ず先に敷く（川の青が透けず橋がはっきり見える。両岸に乗る長さ）
    const baseW = riverWidth + 56;
    const baseH = 34;
    bctx.fillStyle = "#8a8478";
    bctx.fillRect(-baseW / 2, -baseH / 2, baseW, baseH);
    bctx.strokeStyle = "rgba(30,28,24,0.8)";
    bctx.lineWidth = 2.5;
    bctx.strokeRect(-baseW / 2, -baseH / 2, baseW, baseH);
    if (img) {
      const drawW = riverWidth + 56;
      const drawH = drawW * (img.naturalHeight / img.naturalWidth);
      bctx.drawImage(img, -drawW / 2, -drawH / 2, drawW, drawH);
    }
    bctx.restore();
  }
}

/**
 * v0.9.1: 街と街をつなぐ街道を描く。
 * 中点を法線方向に決定的にたわませた二次曲線＝手で踏み固めた道の有機感。
 * 二層描き（広い土の道＋中央の轍）で「使い込まれた街道」に見せる。
 */
function drawInterTownRoadsOnLayer(bctx) {
  if (townRoadEdges.length === 0) return;
  const config = STAGE_CONFIGS[currentStage];
  const roadBase = shadeColor(config.bgColor, 20);
  const roadWorn = shadeColor(config.bgColor, 34);

  bctx.save();
  bctx.lineCap = "round";
  for (const [a, b] of townRoadEdges) {
    const midX = (a.x + b.x) / 2;
    const midY = (a.y + b.y) / 2;
    const dx = b.x - a.x, dy = b.y - a.y;
    const len = Math.sqrt(dx * dx + dy * dy) || 1;
    // 法線方向の決定的なたわみ（±80px。座標由来なので再構築しても同じ形）
    const bulge = (Math.sin(a.x * 0.013 + b.y * 0.017) * 80);
    const cx = midX + (-dy / len) * bulge;
    const cy = midY + (dx / len) * bulge;

    // 広い土の道
    bctx.globalAlpha = 0.50;
    bctx.strokeStyle = roadBase;
    bctx.lineWidth = 26;
    bctx.beginPath();
    bctx.moveTo(a.x, a.y);
    bctx.quadraticCurveTo(cx, cy, b.x, b.y);
    bctx.stroke();

    // 中央の轍（明るい擦れ）
    bctx.globalAlpha = 0.30;
    bctx.strokeStyle = roadWorn;
    bctx.lineWidth = 9;
    bctx.beginPath();
    bctx.moveTo(a.x, a.y);
    bctx.quadraticCurveTo(cx, cy, b.x, b.y);
    bctx.stroke();
  }
  bctx.restore();
}

/**
 * v0.9.1: 街区の下地。町全体に石畳ベース（角丸矩形）を敷いて
 * 「格子模様の上に建物が浮いている」感を消す。tiny集落には小さな土の広場。
 */
function drawTownBasesOnLayer(bctx, bounds) {
  const config = STAGE_CONFIGS[currentStage];
  const paveColor = shadeColor(config.bgColor, 16);
  const edgeColor = shadeColor(config.bgColor, -10);

  bctx.save();
  for (let s = 0; s < settlements.length; s++) {
    const meta = settlements[s]._townMeta;
    if (!meta) continue;
    if (!layerBoundsHitCircle(bounds, meta.cx, meta.cy, townMetaLayerReach(meta))) continue;
    const { cx, cy, plazaR, streets, townR, fields } = meta;
    const ringRadii = meta.ringRadii ?? [meta.ringR];
    const gridRoads = meta.gridRoads ?? [];
    const decor     = meta.decor ?? [];

    // v0.10: 町の敷地＝広場円＋道路骨格に沿った太い踏み固め帯
    // v0.16.1: 土台の形は町の外形（円/ブロブ/矩形）に合わせる。
    // 輪郭が全部円だとレイアウトを変えても同じ町に見えるため
    bctx.globalAlpha = 0.50;
    const gradEnd = (meta.maxExtent ?? townR) + 30;
    const grad = bctx.createRadialGradient(cx, cy, plazaR, cx, cy, gradEnd);
    grad.addColorStop(0, paveColor);
    grad.addColorStop(1, "rgba(0,0,0,0)");
    bctx.fillStyle = grad;
    bctx.beginPath();
    if (meta.outline) {
      // 輪郭ポリゴンを中心から+26px 膨らませて土台にする
      for (let i = 0; i < meta.outline.length; i++) {
        const p = meta.outline[i];
        const d = Math.hypot(p.x - cx, p.y - cy) || 1;
        const ex = cx + (p.x - cx) * (1 + 26 / d);
        const ey = cy + (p.y - cy) * (1 + 26 / d);
        if (i === 0) bctx.moveTo(ex, ey); else bctx.lineTo(ex, ey);
      }
      bctx.closePath();
    } else {
      bctx.arc(cx, cy, townR + 30, 0, Math.PI * 2);
    }
    bctx.fill();
    // 広場（濃いめの石畳）
    bctx.globalAlpha = 0.55;
    bctx.fillStyle = paveColor;
    bctx.beginPath();
    bctx.arc(cx, cy, plazaR + 12, 0, Math.PI * 2);
    bctx.fill();
    // 道路骨格の踏み固め帯（v0.16: レイアウトごとに 放射通り／環状路／碁盤目 を描く）
    bctx.strokeStyle = paveColor;
    bctx.lineCap = "round";
    bctx.globalAlpha = 0.40;
    bctx.lineWidth = 44;
    for (const st of streets) {
      bctx.beginPath();
      bctx.moveTo(cx, cy);
      bctx.lineTo(cx + Math.cos(st.angle) * st.len, cy + Math.sin(st.angle) * st.len);
      bctx.stroke();
    }
    bctx.lineWidth = 40;
    for (const road of gridRoads) {
      bctx.beginPath();
      bctx.moveTo(road.x1, road.y1);
      bctx.lineTo(road.x2, road.y2);
      bctx.stroke();
    }
    bctx.lineWidth = 38;
    for (const rr of ringRadii) {
      bctx.beginPath();
      bctx.arc(cx, cy, rr, 0, Math.PI * 2);
      bctx.stroke();
    }

    // v0.10: 畑 — 縞模様の耕作地＋柵。「人が住み、耕している土地」の記号
    // v0.16: 区画ごとの作付けトーン（tone）で耕地・青作物・実りを混ぜる
    const fieldImg = terrainImages.field;
    for (const f of fields) {
      bctx.save();
      bctx.translate(f.x, f.y);
      bctx.rotate(f.angle);
      if (fieldImg) {
        // v0.17: セル調の畑スプライト。区画は gap(7px) 分だけ大きく描き、
        // 隣接区画の柵が連なって「区切られた耕作地」に見えるようにする。
        // tone を薄い乗算で重ね、耕地/青作物/実りの作付け差を残す。
        const dw = f.w + 7, dh = f.h + 7;
        bctx.drawImage(fieldImg, -dw / 2, -dh / 2, dw, dh);
        if (f.tone) {
          bctx.globalAlpha = 0.22;
          bctx.globalCompositeOperation = "multiply";
          bctx.fillStyle = f.tone;
          bctx.fillRect(-f.w / 2, -f.h / 2, f.w, f.h);
          bctx.globalCompositeOperation = "source-over";
          bctx.globalAlpha = 1.0;
        }
      } else {
        // --- ベクターフォールバック ---
        bctx.globalAlpha = 0.46;
        bctx.fillStyle = f.tone ?? "#96804a";
        bctx.fillRect(-f.w / 2, -f.h / 2, f.w, f.h);
        bctx.globalAlpha = 0.35;
        bctx.strokeStyle = shadeColor(f.tone ?? "#96804a", -46);
        bctx.lineWidth = 2.5;
        for (let fx = -f.w / 2 + 6; fx < f.w / 2 - 3; fx += 9) {
          bctx.beginPath();
          bctx.moveTo(fx, -f.h / 2 + 4);
          bctx.lineTo(fx, f.h / 2 - 4);
          bctx.stroke();
        }
        bctx.globalAlpha = 0.55;
        bctx.strokeStyle = "rgba(70, 52, 30, 0.9)";
        bctx.lineWidth = 2;
        bctx.strokeRect(-f.w / 2, -f.h / 2, f.w, f.h);
      }
      bctx.restore();
    }

    // v0.16: 静的装飾 — 井戸・干し草（人の営みの記号）
    for (const d of decor) {
      if (d.type === "well") {
        // 石組みの輪＋暗い水面＋井桁の梁
        bctx.globalAlpha = 0.9;
        bctx.strokeStyle = "#8a8578";
        bctx.lineWidth = 3;
        bctx.beginPath();
        bctx.arc(d.x, d.y, 6.5, 0, Math.PI * 2);
        bctx.stroke();
        bctx.fillStyle = "#20242c";
        bctx.beginPath();
        bctx.arc(d.x, d.y, 4.5, 0, Math.PI * 2);
        bctx.fill();
        bctx.strokeStyle = "#6a5236";
        bctx.lineWidth = 1.6;
        bctx.beginPath();
        bctx.moveTo(d.x - 8, d.y - 2);
        bctx.lineTo(d.x + 8, d.y - 2);
        bctx.stroke();
      }
      // v0.28.2: 干し草の山（hay）はトップビューで卵オーブと紛らわしく、
      // かつ良い俯瞰表現が未定のため、ひとまず描画カット（生成データは残すが描かない）。
    }
  }

  // tiny集落: 各棟の足元に踏み固めた土の広場
  bctx.globalAlpha = 0.30;
  bctx.fillStyle = paveColor;
  for (let s = 0; s < settlements.length; s++) {
    const st = settlements[s];
    if (!st._tinySettlement) continue;
    bctx.beginPath();
    bctx.ellipse(st.wx, st.wy, st.radius * 2.6, st.radius * 2.1, 0, 0, Math.PI * 2);
    bctx.fill();
  }
  bctx.restore();
  bctx.globalAlpha = 1.0;
}

function drawTownRoadsOnLayer(bctx, meta) {
  const { cx, cy, plazaR, streets, townR } = meta;
  const ringRadii = meta.ringRadii ?? [meta.ringR];
  const gridRoads = meta.gridRoads ?? [];

  // v0.7: 要塞都市には町全体を囲う「城郭リム」
  // v0.16.1: 町の外形（円/ブロブ/矩形）に沿って引く
  if (meta._fortified) {
    const rimPath = (expand) => {
      bctx.beginPath();
      if (meta.outline) {
        for (let i = 0; i < meta.outline.length; i++) {
          const p = meta.outline[i];
          const d = Math.hypot(p.x - cx, p.y - cy) || 1;
          const ex = cx + (p.x - cx) * (1 + expand / d);
          const ey = cy + (p.y - cy) * (1 + expand / d);
          if (i === 0) bctx.moveTo(ex, ey); else bctx.lineTo(ex, ey);
        }
        bctx.closePath();
      } else {
        bctx.arc(cx, cy, townR + expand, 0, Math.PI * 2);
      }
    };
    bctx.save();
    bctx.strokeStyle = "rgba(224, 32, 48, 0.35)";
    bctx.lineWidth = 5;
    rimPath(22);
    bctx.stroke();
    bctx.strokeStyle = "rgba(20, 20, 28, 0.55)";
    bctx.lineWidth = 2;
    rimPath(27);
    bctx.stroke();
    bctx.restore();
  }

  // v0.10: 通りの中心線を明るく見せる（v0.16: 放射／環状／碁盤目をレイアウト通りに）
  bctx.save();
  bctx.strokeStyle = "rgba(210, 195, 160, 0.18)";
  bctx.lineCap = "round";
  bctx.lineWidth = 9;
  for (const st of streets) {
    bctx.beginPath();
    bctx.moveTo(cx + Math.cos(st.angle) * plazaR * 0.6, cy + Math.sin(st.angle) * plazaR * 0.6);
    bctx.lineTo(cx + Math.cos(st.angle) * st.len, cy + Math.sin(st.angle) * st.len);
    bctx.stroke();
  }
  bctx.lineWidth = 8;
  for (const road of gridRoads) {
    bctx.beginPath();
    bctx.moveTo(road.x1, road.y1);
    bctx.lineTo(road.x2, road.y2);
    bctx.stroke();
  }
  bctx.lineWidth = 7;
  for (const rr of ringRadii) {
    bctx.beginPath();
    bctx.arc(cx, cy, rr, 0, Math.PI * 2);
    bctx.stroke();
  }
  // 広場の縁取り
  bctx.strokeStyle = "rgba(210, 195, 160, 0.22)";
  bctx.lineWidth = 2.5;
  bctx.beginPath();
  bctx.arc(cx, cy, plazaR - 4, 0, Math.PI * 2);
  bctx.stroke();
  bctx.restore();
}

// -----------------------------------------------------------------
// v0.9: 建物スプライトのティント（無彩色スプライト × 建物色 = 時代ごとの街並み）
// multiply で着色 → destination-in で元の透明度を復元する定番レシピ。
// キャッシュは (サイズ, 色) 単位。1ステージで使う色は十数種なので小さく収まる。
// -----------------------------------------------------------------
const _tintedBuildingCache = new Map();

// 建物色はshadeColorの±15ゆらぎで建物ごとに微妙に違う。そのままキャッシュキーに
// すると数百枚のティントcanvas（数十MB）になるため、RGB各24刻みに量子化して
// 色数を数十種に抑える（見た目の差はほぼ分からない）。
function quantizeTintColor(color) {
  let r = 128, g = 128, b = 128;
  if (color.startsWith("#") && color.length >= 7) {
    r = parseInt(color.slice(1, 3), 16);
    g = parseInt(color.slice(3, 5), 16);
    b = parseInt(color.slice(5, 7), 16);
  } else {
    const m = color.match(/rgb\((\d+),(\d+),(\d+)\)/);
    if (m) { r = +m[1]; g = +m[2]; b = +m[3]; }
  }
  const q = (v) => Math.min(255, Math.round(v / 24) * 24);
  return `rgb(${q(r)},${q(g)},${q(b)})`;
}

function getTintedBuildingSprite(sizeKey, rawColor) {
  const color = quantizeTintColor(rawColor);
  const cacheKey = sizeKey + "_" + color;
  const cached = _tintedBuildingCache.get(cacheKey);
  if (cached) return cached;
  const img = buildingImages[sizeKey];
  if (!img) return null;

  // ティントcanvasは128pxに縮小して保持する。建物の描画サイズは最大でも
  // 64ワールドpx程度なので画質は落ちず、キャッシュのメモリを1/4に抑えられる。
  const TINT_CANVAS_SIZE = 128;
  const scale = TINT_CANVAS_SIZE / Math.max(img.naturalWidth, img.naturalHeight);
  const tc = document.createElement("canvas");
  tc.width  = Math.max(1, Math.round(img.naturalWidth * scale));
  tc.height = Math.max(1, Math.round(img.naturalHeight * scale));
  const c = tc.getContext("2d");
  c.drawImage(img, 0, 0, tc.width, tc.height);
  c.globalCompositeOperation = "multiply";
  c.fillStyle = color;
  c.fillRect(0, 0, tc.width, tc.height);
  c.globalCompositeOperation = "destination-in";
  c.drawImage(img, 0, 0, tc.width, tc.height);

  _tintedBuildingCache.set(cacheKey, tc);
  return tc;
}

/** 建物に使うスプライトのサイズキーを返す（対象外の建物は null）。 */
function buildingSpriteKeyFor(settlement) {
  if (settlement._isWall || settlement.isBoss) return null;
  // v0.70: 時代兵器は**機能ごとの専用の絵**（どの文明でも同じ）。
  if (settlement._emplacement && buildingImages[settlement._emplacement]) {
    return settlement._emplacement;
  }
  if (settlement._landmark) return settlement._landmark;  // v0.10: temple / windmill
  let size = null;
  switch (settlement.size) {
    case "tiny":
    case "small":  size = "small";  break;
    case "medium": size = "medium"; break;
    case "large":  size = "large";  break;
    default:       return null;
  }
  // v0.70: その文明の建築があればそれを使う（無ければ旧共通の絵に落ちる）。
  const eraKey = "e" + (currentStage + 1) + "_" + size;
  return buildingImages[eraKey] ? eraKey : size;
}

function drawSettlementOnLayer(bctx, settlement) {
  const alpha = settlement.fallen ? 0.22 : 1.0;
  const color = settlement.fallen ? "#333" : settlement.color;

  bctx.save();
  bctx.globalAlpha = alpha;

  // v0.8: ドロップシャドウ（立体感）。瓦礫と城壁・ボスには不要
  if (!settlement.fallen && !settlement._isWall && !settlement.isBoss) {
    bctx.globalAlpha = 0.30;
    bctx.fillStyle = "#000000";
    bctx.beginPath();
    bctx.ellipse(
      settlement.wx + settlement.radius * 0.18,
      settlement.wy + settlement.radius * 0.26,
      settlement.radius * 1.02, settlement.radius * 0.92, 0, 0, Math.PI * 2,
    );
    bctx.fill();
    bctx.globalAlpha = alpha;
  }

  // v0.9: 建物スプライトが使えるならティントして描画
  const spriteKey  = settlement.fallen ? null : buildingSpriteKeyFor(settlement);
  const tinted     = spriteKey ? getTintedBuildingSprite(spriteKey, color) : null;
  // v0.9.1: 陥落建物は廃墟スプライト（城壁セグメントだけは従来の瓦礫ベクター）
  const ruinImg    = (settlement.fallen && !settlement._isWall) ? buildingImages.ruin : null;
  const usedSprite = !!tinted || !!ruinImg;

  if (ruinImg) {
    // v0.11.1: 廃墟のサイズは建物とほぼ同等（×2.2）。密集市街でも
    // 廃墟同士が融合して灰色の塊に見えないよう、元建物より小さめに抑える。
    const drawW = settlement.radius * 2.2;
    const drawH = drawW * (ruinImg.naturalHeight / ruinImg.naturalWidth);
    // 座標由来の決定的な90度回転＋反転で同じ廃墟の並びに見えないようにする
    const seed = Math.floor(settlement.wx * 7 + settlement.wy * 13);
    bctx.save();
    bctx.globalAlpha = 0.95;
    bctx.translate(settlement.wx, settlement.wy);
    bctx.rotate((seed % 4) * Math.PI / 2);
    bctx.scale(seed % 2 === 0 ? 1 : -1, 1);
    bctx.drawImage(ruinImg, -drawW / 2, -drawH / 2, drawW, drawH);
    bctx.restore();
  } else if (tinted) {
    const drawW = settlement.radius * (settlement._landmark ? 2.6 : 2.3);
    const drawH = drawW * (tinted.height / tinted.width);
    // 座標由来の決定的な左右反転でタイル感を減らす
    const flip = (Math.floor(settlement.wx * 7 + settlement.wy * 13) % 2 === 0) ? 1 : -1;
    bctx.save();
    bctx.translate(settlement.wx, settlement.wy);
    // v0.10: 通りに面する向きで建物を回転（有機的な街並みの核）
    bctx.rotate(settlement._faceAngle ?? 0);
    bctx.scale(flip, 1);
    bctx.drawImage(tinted, -drawW / 2, -drawH / 2, drawW, drawH);
    bctx.restore();
  } else {
  switch (settlement.shape) {
    case "circle":      drawCircleOnCtx(bctx, settlement.wx, settlement.wy, settlement.radius, color); break;
    case "square":      drawSquareOnCtx(bctx, settlement.wx, settlement.wy, settlement.radius, color); break;
    case "squareTower": drawSquareTowerOnCtx(bctx, settlement.wx, settlement.wy, settlement.radius, color); break;
    case "hexagon":     drawHexagonOnCtx(bctx, settlement.wx, settlement.wy, settlement.radius, color); break;
    case "triangle":    drawTriangleOnCtx(bctx, settlement.wx, settlement.wy, settlement.radius, color); break;
    case "polygon":     drawPolygonOnCtx(bctx, settlement.wx, settlement.wy, settlement.radius, color); break;
    case "star":        drawStarOnCtx(bctx, settlement.wx, settlement.wy, settlement.radius, color, 5); break;
    case "star4":       drawStarOnCtx(bctx, settlement.wx, settlement.wy, settlement.radius, color, 4); break;
    // ボス集落専用形状: 外輪グロー + 多重リング + 中心十字で一目でボスと分かる
    case "bossCircle":
      drawBossOnLayer(bctx, settlement, color);
      break;
    // v0.6-p3: 城壁セグメント（リング接線方向に回転した石ブロック）
    case "wallSegment":
      drawWallSegmentOnCtx(bctx, settlement, color);
      break;
    default:            drawCircleOnCtx(bctx, settlement.wx, settlement.wy, settlement.radius, color); break;
  }
  }

  // v0.8: 屋根のシェーディング（左上のシーン＋窓明かり）で建物のクオリティを上げる
  // v0.9: スプライト描画時はスプライト自体に陰影があるためスキップ
  if (!usedSprite && !settlement.fallen && !settlement._isWall && !settlement.isBoss) {
    const swx = settlement.wx;
    const swy = settlement.wy;
    const sr  = settlement.radius;
    // 左上のハイライト（陽の当たる面）
    bctx.globalAlpha = 0.16;
    bctx.fillStyle = "#ffffff";
    bctx.beginPath();
    bctx.arc(swx - sr * 0.30, swy - sr * 0.32, sr * 0.48, 0, Math.PI * 2);
    bctx.fill();
    bctx.globalAlpha = 1.0;
    // 窓明かり（medium/large のみ。座標由来の決定的配置で焼き付ける）
    if (settlement.size === "medium" || settlement.size === "large") {
      const windowCount = settlement.size === "large" ? 4 : 2;
      bctx.fillStyle = "rgba(255, 220, 130, 0.75)";
      for (let k = 0; k < windowCount; k++) {
        const seed  = Math.sin(swx * 0.37 + swy * 0.61 + k * 5.3);
        const angle = seed * Math.PI * 2;
        const dist  = sr * (0.28 + 0.30 * Math.abs(Math.sin(seed * 13.7)));
        bctx.fillRect(swx + Math.cos(angle) * dist - 1.2, swy + Math.sin(angle) * dist - 1.2, 2.4, 2.4);
      }
    }
  }

  // v0.7: 要塞都市の建物は「明らかに強そう」な装飾を重ねる
  // （黒鉄の太い輪郭＋屋上の深紅の軍旗。fallen 後は通常の瓦礫と同じ見た目に落ちる）
  if (settlement._fortified && !settlement.fallen) {
    const wx = settlement.wx;
    const wy = settlement.wy;
    const r  = settlement.radius;
    // 黒鉄の輪郭（二重）
    bctx.strokeStyle = "rgba(20, 20, 28, 0.9)";
    bctx.lineWidth = 2.5;
    bctx.beginPath();
    bctx.arc(wx, wy, r + 2, 0, Math.PI * 2);
    bctx.stroke();
    bctx.strokeStyle = "rgba(255, 60, 60, 0.55)";
    bctx.lineWidth = 1;
    bctx.beginPath();
    bctx.arc(wx, wy, r + 4, 0, Math.PI * 2);
    bctx.stroke();
    // 深紅の軍旗（ポール＋三角旗）
    bctx.strokeStyle = "#404048";
    bctx.lineWidth = 1.2;
    bctx.beginPath();
    bctx.moveTo(wx, wy - r);
    bctx.lineTo(wx, wy - r - 9);
    bctx.stroke();
    bctx.fillStyle = "#e02030";
    bctx.beginPath();
    bctx.moveTo(wx, wy - r - 9);
    bctx.lineTo(wx + 7, wy - r - 6.5);
    bctx.lineTo(wx, wy - r - 4);
    bctx.closePath();
    bctx.fill();
  }

  bctx.restore();
}

/**
 * v0.6-p3: 城壁セグメントを描画する。
 * リング接線方向（_wallAngle）に回転した石ブロック＋胸壁の刻みで「城壁」に見せる。
 * fallen 時は呼び出し元の alpha=0.22/color="#333" でそのまま瓦礫化する。
 */
function drawWallSegmentOnCtx(c, settlement, color) {
  const halfL = WALL_SEG_SPACING * 0.5 + 3; // 隣セグメントと視覚的につながる長さ
  const halfW = 9;                          // 壁の厚み（見た目）
  c.save();
  c.translate(settlement.wx, settlement.wy);
  c.rotate(settlement._wallAngle);

  // 壁本体
  c.fillStyle = color;
  c.strokeStyle = "rgba(255,255,255,0.35)";
  c.lineWidth = 1.5;
  c.fillRect(-halfL, -halfW, halfL * 2, halfW * 2);
  c.strokeRect(-halfL, -halfW, halfL * 2, halfW * 2);

  // 胸壁の刻み（上辺の凸凹）
  if (!settlement.fallen) {
    c.fillStyle = shadeColor("#6a7078", 25);
    const merlonW = 8;
    for (let mx = -halfL + 2; mx < halfL - merlonW; mx += merlonW * 2) {
      c.fillRect(mx, -halfW - 3, merlonW, 3);
    }
  }
  c.restore();
}

/**
 * v0.6-p3: 地形障害物（岩山・湖）を静的レイヤーに焼く。
 * 岩山: 灰色の多角形の山＋ハイライト。湖: 深い青の楕円＋岸のリム。
 */
function drawTerrainOnLayer(bctx, bounds) {
  for (const ob of terrainObstacles) {
    // v0.49: 岩・湖のスプライトは判定円の 2.3 倍まではみ出す
    if (!layerBoundsHitCircle(bounds, ob.wx, ob.wy, ob.radius * 2.3)) continue;
    const img = terrainImages[ob.type];
    if (img) {
      // v0.17: セル調スプライト（建物と画風を統一）。当たり判定円(radius)を
      // 少し超える大きさで描き、岩肌・水面が判定縁まで満ちるようにする。
      // 個体ごとに座標由来の決定的な回転・左右反転で「同じ画像の並び」感を消す。
      // v0.17.1: 背景要素なので TERRAIN_SPRITE_ALPHA で不透明度を下げてトーンを落とし、
      // 暗い地面が透けて「主張しすぎない背景」に馴染ませる。
      const scale = ob.type === "rock" ? 2.3 : 2.15;   // 直径 = radius × scale
      const drawW = ob.radius * scale;
      const drawH = drawW * (img.naturalHeight / img.naturalWidth);
      const rot   = Math.sin(ob.wx * 0.017 + ob.wy * 0.013) * 0.5;   // ±0.5rad
      const flip  = (Math.floor(ob.wx * 0.05) % 2 === 0) ? 1 : -1;
      bctx.save();
      bctx.globalAlpha = TERRAIN_SPRITE_ALPHA[ob.type] ?? 0.7;
      bctx.translate(ob.wx, ob.wy);
      bctx.rotate(rot);
      bctx.scale(flip, 1);
      bctx.drawImage(img, -drawW / 2, -drawH / 2, drawW, drawH);
      bctx.restore();
      continue;
    }
    // --- 画像が読めなかったときのベクターフォールバック ---
    if (ob.type === "rock") {
      // ごつごつした多角形（座標由来の決定的ジッター）
      bctx.fillStyle = "#4a4e52";
      bctx.strokeStyle = "rgba(255,255,255,0.25)";
      bctx.lineWidth = 2;
      bctx.beginPath();
      const sides = 8;
      for (let k = 0; k < sides; k++) {
        const angle  = (k * Math.PI * 2) / sides;
        const jitter = 0.75 + 0.25 * ((Math.sin(k * 7.3 + ob.wx * 0.013) + 1) * 0.5);
        const rx = ob.wx + Math.cos(angle) * ob.radius * jitter;
        const ry = ob.wy + Math.sin(angle) * ob.radius * jitter;
        if (k === 0) bctx.moveTo(rx, ry); else bctx.lineTo(rx, ry);
      }
      bctx.closePath();
      bctx.fill();
      bctx.stroke();
      // 山頂ハイライト
      bctx.fillStyle = "#6a7076";
      bctx.beginPath();
      bctx.arc(ob.wx - ob.radius * 0.18, ob.wy - ob.radius * 0.22, ob.radius * 0.38, 0, Math.PI * 2);
      bctx.fill();
    } else {
      // 湖: 深い青＋岸のリム
      bctx.fillStyle = "rgba(30, 60, 110, 0.85)";
      bctx.strokeStyle = "rgba(120, 180, 230, 0.45)";
      bctx.lineWidth = 2.5;
      bctx.beginPath();
      bctx.ellipse(ob.wx, ob.wy, ob.radius, ob.radius * 0.78, ob.wx * 0.01, 0, Math.PI * 2);
      bctx.fill();
      bctx.stroke();
    }
  }
}

/**
 * ボス集落をオフスクリーンCanvasに描画する。
 * 外輪グロー（薄い大円）＋実体（二重リング）＋中心の8角星＋十字マークで
 * 小集落とは明確に差別化した外観を作る。
 * fallen 時は通常建物と同じく暗く潰れる（alpha=0.22, color="#333" で呼ばれる）。
 */
function drawBossOnLayer(bctx, settlement, color) {
  const wx = settlement.wx;
  const wy = settlement.wy;
  const r  = settlement.radius;        // BOSS_RADIUS = 46
  const glowColor = settlement._bossGlowColor ?? color;
  const isFallen  = settlement.fallen;

  if (isFallen) {
    // 陥落後は単純な暗い大円にまとめる（視認は残すが存在感は消す）
    bctx.fillStyle = color;
    bctx.beginPath();
    bctx.arc(wx, wy, r, 0, Math.PI * 2);
    bctx.fill();
    return;
  }

  // --- 外輪グロー（大きな半透明円） ---
  // 半透明でじわっと広がる光。オフスクリーン焼き付けなので毎フレームコストゼロ。
  bctx.globalAlpha = 0.18;
  bctx.fillStyle   = glowColor;
  bctx.beginPath();
  bctx.arc(wx, wy, r * 1.7, 0, Math.PI * 2);
  bctx.fill();

  bctx.globalAlpha = 0.10;
  bctx.fillStyle   = glowColor;
  bctx.beginPath();
  bctx.arc(wx, wy, r * 2.2, 0, Math.PI * 2);
  bctx.fill();

  bctx.globalAlpha = 1.0;

  // --- 外リング（太い輪郭） ---
  bctx.strokeStyle = glowColor;
  bctx.lineWidth   = 4;
  bctx.beginPath();
  bctx.arc(wx, wy, r, 0, Math.PI * 2);
  bctx.stroke();

  // --- 実体（中塗り） ---
  const grad = bctx.createRadialGradient(wx, wy, r * 0.1, wx, wy, r * 0.95);
  grad.addColorStop(0.0, glowColor);
  grad.addColorStop(0.5, color);
  grad.addColorStop(1.0, "rgba(0,0,0,0.6)");
  bctx.fillStyle = grad;
  bctx.beginPath();
  bctx.arc(wx, wy, r, 0, Math.PI * 2);
  bctx.fill();

  // --- 内リング --- （中心との境界を強調）
  bctx.strokeStyle = "rgba(255,255,255,0.55)";
  bctx.lineWidth   = 1.5;
  bctx.beginPath();
  bctx.arc(wx, wy, r * 0.55, 0, Math.PI * 2);
  bctx.stroke();

  // --- 8角星（中心マーク） ---
  drawStarOnCtx(bctx, wx, wy, r * 0.35, glowColor, 8);

  // --- 十字ライン（城砦感） ---
  bctx.strokeStyle = "rgba(255,255,255,0.40)";
  bctx.lineWidth   = 1.5;
  const cr = r * 0.85;
  bctx.beginPath();
  bctx.moveTo(wx - cr, wy); bctx.lineTo(wx + cr, wy);
  bctx.moveTo(wx, wy - cr); bctx.lineTo(wx, wy + cr);
  bctx.stroke();

  // --- 外縁の白い輪郭線（存在感を締める） ---
  bctx.strokeStyle = "rgba(255,255,255,0.70)";
  bctx.lineWidth   = 2;
  bctx.beginPath();
  bctx.arc(wx, wy, r + 2, 0, Math.PI * 2);
  bctx.stroke();
}

// -----------------------------------------------------------------
// 建物形状描画（オフスクリーン用・メインCanvas用共通）
// -----------------------------------------------------------------
function drawCircleOnCtx(c, wx, wy, r, color) {
  c.fillStyle = color;
  c.strokeStyle = "rgba(255,255,255,0.4)";
  c.lineWidth = 1.5;
  c.beginPath();
  c.arc(wx, wy, r, 0, Math.PI * 2);
  c.fill();
  c.stroke();
}

function drawSquareOnCtx(c, wx, wy, r, color) {
  c.fillStyle = color;
  c.strokeStyle = "rgba(255,255,255,0.35)";
  c.lineWidth = 1.5;
  c.fillRect(wx - r, wy - r, r * 2, r * 2);
  c.strokeRect(wx - r, wy - r, r * 2, r * 2);
}

function drawSquareTowerOnCtx(c, wx, wy, r, color) {
  c.fillStyle = color;
  c.strokeStyle = "rgba(255,255,255,0.4)";
  c.lineWidth = 1.5;
  c.fillRect(wx - r, wy - r, r * 2, r * 2);
  c.strokeRect(wx - r, wy - r, r * 2, r * 2);
  const towerSize = r * 0.4;
  const positions = [
    [wx - r, wy - r], [wx + r - towerSize, wy - r],
    [wx - r, wy + r - towerSize], [wx + r - towerSize, wy + r - towerSize],
  ];
  c.fillStyle = shadeColor(color, -20);
  for (const [tx, ty] of positions) {
    c.fillRect(tx, ty, towerSize, towerSize);
  }
}

function drawHexagonOnCtx(c, wx, wy, r, color) {
  c.fillStyle = color;
  c.strokeStyle = "rgba(255,255,255,0.5)";
  c.lineWidth = 1.5;
  c.beginPath();
  for (let k = 0; k < 6; k++) {
    const angle = (k * Math.PI * 2) / 6 - Math.PI / 6;
    if (k === 0) c.moveTo(wx + Math.cos(angle) * r, wy + Math.sin(angle) * r);
    else c.lineTo(wx + Math.cos(angle) * r, wy + Math.sin(angle) * r);
  }
  c.closePath();
  c.fill();
  c.stroke();
}

function drawTriangleOnCtx(c, wx, wy, r, color) {
  c.fillStyle = color;
  c.strokeStyle = "rgba(255,255,255,0.45)";
  c.lineWidth = 1.5;
  c.beginPath();
  c.moveTo(wx, wy - r);
  c.lineTo(wx + r * 0.9, wy + r * 0.7);
  c.lineTo(wx - r * 0.9, wy + r * 0.7);
  c.closePath();
  c.fill();
  c.stroke();
}

function drawPolygonOnCtx(c, wx, wy, r, color) {
  c.fillStyle = color;
  c.strokeStyle = "rgba(255,255,255,0.3)";
  c.lineWidth = 1.5;
  const sides = 5 + ((Math.round(wx + wy) % 3));
  c.beginPath();
  for (let k = 0; k < sides; k++) {
    const baseAngle = (k * Math.PI * 2) / sides;
    const jitter = 0.65 + 0.35 * ((Math.sin(k * 13.7 + wx * 0.01) + 1) * 0.5);
    const rx = wx + Math.cos(baseAngle) * r * jitter;
    const ry = wy + Math.sin(baseAngle) * r * jitter;
    if (k === 0) c.moveTo(rx, ry);
    else c.lineTo(rx, ry);
  }
  c.closePath();
  c.fill();
  c.stroke();
}

function drawStarOnCtx(c, wx, wy, r, color, spikes) {
  c.fillStyle = color;
  c.strokeStyle = "rgba(255,255,255,0.4)";
  c.lineWidth = 1.5;
  c.beginPath();
  const innerR = r * 0.50;
  for (let k = 0; k < spikes * 2; k++) {
    const angle = (k * Math.PI) / spikes - Math.PI / 2;
    const rad = k % 2 === 0 ? r : innerR;
    if (k === 0) c.moveTo(wx + Math.cos(angle) * rad, wy + Math.sin(angle) * rad);
    else c.lineTo(wx + Math.cos(angle) * rad, wy + Math.sin(angle) * rad);
  }
  c.closePath();
  c.fill();
  c.stroke();
}

// -----------------------------------------------------------------
// 投射物プール
// -----------------------------------------------------------------
// v0.62: 通常弾を 1/3 の速さにしたぶん、同じ弾が画面に残る時間が3倍になる。
// 200 のままだと最大同時数が上限に張り付き、**撃たれた弾が黙って消える**
// （spawnProjectile は空きが無いと何もしない）。
// 実測: 最終文明の首都に55体で張り付いた最悪ケースで 旧 平均31.4/最大136 だったので、
// 3倍でも収まる 640 にする。1発あたりの更新コストは実測 0.5µs 未満（N=55）。
const MAX_PROJECTILES = 900;

const projWx        = new Float32Array(MAX_PROJECTILES);
const projWy        = new Float32Array(MAX_PROJECTILES);
const projVx        = new Float32Array(MAX_PROJECTILES);
const projVy        = new Float32Array(MAX_PROJECTILES);
const projActive    = new Uint8Array(MAX_PROJECTILES);
const projDmg       = new Float32Array(MAX_PROJECTILES);
const projAoe       = new Float32Array(MAX_PROJECTILES);
const projTracking  = new Uint8Array(MAX_PROJECTILES);
const projTargetIdx = new Int32Array(MAX_PROJECTILES);
const projColor     = new Array(MAX_PROJECTILES).fill("#fff");
const projTailX     = new Float32Array(MAX_PROJECTILES);
const projTailY     = new Float32Array(MAX_PROJECTILES);
// 変更3: 飛距離管理用 SoA（発射点を記録して走破距離で消滅判定する）
const projStartWx   = new Float32Array(MAX_PROJECTILES);
const projStartWy   = new Float32Array(MAX_PROJECTILES);
// 変更5: 投射物種別 SoA（0=arrow 通常矢弾、1=catapult カタパルト弾）
// Uint8Array: 0 or 1 で表現。初期化漏れなし（new Uint8Array はゼロ初期化される）
const projKind      = new Uint8Array(MAX_PROJECTILES); // 0=arrow, 1=catapult, 2=ボス重弾, 3=ロケット, 4=着弾弾
// v0.57: 着弾弾（kind=4）の落下点。飛行中は竜に当たらず、**この点まで飛んでから炸裂**する。
// 「線に当たるか」ではなく「円から退けるか」を問う弾で、予告円とセットで使う。
const projTgtX      = new Float32Array(MAX_PROJECTILES);
const projTgtY      = new Float32Array(MAX_PROJECTILES);
// v0.57: 通常弾の見た目（時代）。SHOT_STYLES の添字。発射時に現在の文明で焼き付ける。
const projStyle     = new Uint8Array(MAX_PROJECTILES);
// v0.57: 飛距離の個別上限（0 = kind ごとの既定値を使う）。
// 首都の一斉射やバリスタ塔は**撃てる距離まで届かせたい**が、既定の 420/460px だと
// 射程の手前で消えて1発も当たらない（実測: 首都から600px の群れに volley が0ダメージ）。
const projRange     = new Float32Array(MAX_PROJECTILES);
// v0.59: 着弾点で**周囲も押し飛ばす**半径（0 = 押さない）。
// 弾1発は竜1体しか押せないので、射撃型のノックバック敵は
// 弾を増やしても攻撃停止が2%しか出なかった（実測）。着弾を小さな衝撃波にして解決する。
const projKnockR    = new Float32Array(MAX_PROJECTILES);
const KNOCK_SHOT_PUSH = 52;   // 着弾衝撃の押し距離（px）

// 変更3: 投射物パラメータ定数
// 弾速倍率: ステージ設定の projectileSpeed にこの倍率を掛けて「大型矢」の重厚な速さにする。
const PROJECTILE_SPEED_MULT  = 3.6;
// v0.62: **通常弾（kind=0 矢 / kind=1 カタパルト弾）だけ 1/3 の速さ**にする（Shooter指示
// 「敵の通常弾の速度が速すぎて見た目がイマイチ。1/3くらいにすると攻撃の激しさが目に見える」）。
// ロケット(kind=3)・ボス重弾(kind=2)・着弾弾(kind=4)は現状の見た目が良いので触らない。
// 弾は飛距離で消えるので、遅くすると**画面に残っている時間が3倍**になる＝同時発射数も3倍になる。
// そのぶん MAX_PROJECTILES を広げてある（下記）。
const NORMAL_SHOT_SPEED_SCALE = 1 / 3;
// 変更5: 種別ごとの飛距離上限（px）
// カタパルト弾: 広い射程（大型・首都・ボスのみが撃つ威圧感）
const PROJECTILE_MAX_RANGE   = 420; // catapult 用（従来値を維持）
// 通常矢弾: 短い射程（small/tiny/medium が撃つ。近づかないと当たらない）
const ARROW_MAX_RANGE        = 250;

// 変更5: 種別ごとのノックバック速度（px/s）
// カタパルト弾: 強いノックバック（大型・首都・ボスの圧力感）
const CATAPULT_KNOCKBACK_SPEED = 220; // 旧120→220へ増強
// 通常矢弾: 弱いノックバック（ちょっと押される程度）
const ARROW_KNOCKBACK_SPEED    = 60;

// -----------------------------------------------------------------
// v0.57: 通常弾の「時代の顔」
// -----------------------------------------------------------------
// 1ラン＝1文明になったので、**ラン中ずっと目に入る通常弾**が時代を語る一番の面積になる。
// 石器の街から鉛玉が飛んでくるのは絵として嘘なので、弾の形・速さ・尾を文明ごとに変える。
// 速度倍率は見た目に合わせた**手触りの差**（投石は見てから避けられる／曳光弾は反応が要る）。
// ダメージは STAGE_CONFIGS の projectileDamage のままで、ここでは触らない。
const SHOT_STYLES = [
  { key: "sling",   speedMult: 0.80, size: 1.00 },  // 1 石器: 回る石つぶて
  { key: "javelin", speedMult: 1.00, size: 1.15 },  // 2 古代: 投槍（穂先が長い）
  { key: "bolt",    speedMult: 1.05, size: 1.00 },  // 3 中世: 弩の矢（従来の矢）
  { key: "musket",  speedMult: 1.50, size: 0.80 },  // 4 近世: 鉛玉＋白煙
  { key: "shell",   speedMult: 1.15, size: 1.10 },  // 5 産業: 榴弾（黒い弾体＋煙）
  { key: "arc",     speedMult: 1.30, size: 0.95 },  // 6 電気: 放電弾
  { key: "tracer",  speedMult: 1.60, size: 0.90 },  // 7 大戦: 曳光弾
  { key: "plasma",  speedMult: 1.20, size: 1.20 },  // 8 最終: プラズマ球
];
/** 現在の文明の弾スタイル添字。 */
function eraShotStyle() {
  return Math.max(0, Math.min(SHOT_STYLES.length - 1, currentStage));
}
/** 現在の文明の弾速倍率（kind=0/1 の通常弾にだけ掛ける）。 */
function eraShotSpeedMult() {
  return SHOT_STYLES[eraShotStyle()].speedMult;
}

// -----------------------------------------------------------------
// v0.57: 着弾弾（bombardment shell / kind=4）
// -----------------------------------------------------------------
// 既存の弾は「竜に当たると消える線」だが、これは**指定した地面まで飛んで炸裂する点**。
// 飛行中は当たり判定を持たず、落下点に予告円が出る＝**円から退く**という別種の課題になる。
// 投石・矢の雨・絨毯爆撃・対空弾幕・臼砲を、この1つの部品で全部作っている。
const SHELL_PUSH_DIST = 22;   // 炸裂の押し飛ばし（emitShockwave へ渡す）
function spawnShell(fromWx, fromWy, tx, ty, speed, damage, aoe, color) {
  const slot = takeProjectileSlot();
  if (slot < 0) return;
  const dx = tx - fromWx, dy = ty - fromWy;
  const d  = Math.sqrt(dx * dx + dy * dy) || 1;
  projActive[slot]    = 1;
  projWx[slot]        = fromWx;
  projWy[slot]        = fromWy;
  projTailX[slot]     = fromWx;
  projTailY[slot]     = fromWy;
  projStartWx[slot]   = fromWx;
  projStartWy[slot]   = fromWy;
  projTgtX[slot]      = tx;
  projTgtY[slot]      = ty;
  projVx[slot]        = dx / d * speed;
  projVy[slot]        = dy / d * speed;
  projDmg[slot]       = damage;
  projAoe[slot]       = aoe;
  projTracking[slot]  = 0;
  projTargetIdx[slot] = -1;
  projColor[slot]     = color;
  projKind[slot]      = 4;
  projStyle[slot]     = eraShotStyle();
}

/** 着弾弾の炸裂。範囲ダメージ＋押し飛ばし＋輪のFXは既存の衝撃波に集約する。 */
function detonateShell(i) {
  emitShockwave(projTgtX[i], projTgtY[i], projAoe[i], projDmg[i], SHELL_PUSH_DIST);
  spawnCollisionParticles(projTgtX[i], projTgtY[i]);
  projActive[i] = 0;
}

// 時間差の斉射キュー。**同時に撒くと避けようがない**ので、絨毯爆撃も矢の雨も
// 「少しずつ落ちてくる」形にして、走って抜ける余地を作る。
const barrageQueue = [];
const BARRAGE_QUEUE_MAX = 96;
function queueShell(delay, fromWx, fromWy, tx, ty, speed, damage, aoe, color) {
  if (barrageQueue.length >= BARRAGE_QUEUE_MAX) return;
  barrageQueue.push({ t: delay, fx: fromWx, fy: fromWy, tx, ty, speed, damage, aoe, color });
}
function updateBarrageQueue(dt) {
  for (let i = barrageQueue.length - 1; i >= 0; i--) {
    const q = barrageQueue[i];
    q.t -= dt;
    if (q.t > 0) continue;
    spawnShell(q.fx, q.fy, q.tx, q.ty, q.speed, q.damage, q.aoe, q.color);
    barrageQueue.splice(i, 1);
  }
}

// v0.62: 空きスロット探し。プールを640に広げたので、毎回先頭から舐めると
// 発射のたびに最大640回の走査になる。前回の続きから回す巻き取り式にして
// ならし O(1) にする（弾はだいたい発射順に消えるので、続きに空きがある）。
let _projScanCursor = 0;
function takeProjectileSlot() {
  for (let k = 0; k < MAX_PROJECTILES; k++) {
    const i = _projScanCursor;
    _projScanCursor = (_projScanCursor + 1) % MAX_PROJECTILES;
    if (!projActive[i]) return i;
  }
  return -1;   // 満杯（この弾は出ない）
}

// 変更5: kind=0(arrow) / kind=1(catapult)
function spawnProjectile(fromWx, fromWy, targetBoidIdx, speed, damage, color, aoe, isTracking, kind) {
  const slot = takeProjectileSlot();
  if (slot < 0) return;

  // 変更3: 弾速倍率を適用（大型矢の重厚な速さ）
  // v0.57: 通常弾（kind=0/1）だけ、文明ごとの弾速倍率を重ねる。
  // ボス重弾(2)・ロケット(3)は専用の速度設計なので触らない。
  // v0.62: 同じ条件で 1/3 の減速も掛ける（見て避けられる速さにする）。
  const isNormal    = !(kind === 2 || kind === 3);
  const eraMult     = isNormal ? eraShotSpeedMult() * NORMAL_SHOT_SPEED_SCALE : 1;
  const actualSpeed = speed * PROJECTILE_SPEED_MULT * eraMult;

  projActive[slot]     = 1;
  projWx[slot]         = fromWx;
  projWy[slot]         = fromWy;
  projTailX[slot]      = fromWx;
  projTailY[slot]      = fromWy;
  // 変更3: 発射点を記録（飛距離上限判定用）
  projStartWx[slot]    = fromWx;
  projStartWy[slot]    = fromWy;
  projDmg[slot]        = damage;
  projAoe[slot]        = aoe ?? 0;
  projTracking[slot]   = isTracking ? 1 : 0;
  projTargetIdx[slot]  = targetBoidIdx;
  projColor[slot]      = color;
  // 変更5: 種別を記録（デフォルト 0=arrow）。v0.48: 3=ロケットを追加したので丸めない
  projKind[slot]       = (kind === 1 || kind === 2 || kind === 3) ? kind : 0;
  projStyle[slot]      = eraShotStyle();
  projRange[slot]      = 0;
  projKnockR[slot]     = 0;

  if (targetBoidIdx >= 0 && !boidDead[targetBoidIdx]) {
    const dx = px[targetBoidIdx] - fromWx;
    const dy = py[targetBoidIdx] - fromWy;
    const d  = Math.sqrt(dx * dx + dy * dy) || 1;
    projVx[slot] = (dx / d) * actualSpeed;
    projVy[slot] = (dy / d) * actualSpeed;
  } else {
    projVx[slot] = actualSpeed;
    projVy[slot] = 0;
  }
}

function findNearestAliveBoid(wx, wy) {
  let nearest = -1;
  let nearestDist2 = Infinity;
  for (let i = 0; i < N; i++) {
    // 変更2: ダウン中の個体は投射物のターゲットにしない
    if (boidDead[i] || boidDowned[i]) continue;
    const dx = px[i] - wx;
    const dy = py[i] - wy;
    const d2 = dx * dx + dy * dy;
    if (d2 < nearestDist2) {
      nearestDist2 = d2;
      nearest = i;
    }
  }
  return nearest;
}

// 建物のSpatial Hash（ブレス射程判定用）
// 建物は静的なのでステージ生成時に1回だけ構築する
const buildingGrid = new Map();
const BUILDING_GRID_CELL = 100; // セルサイズ（px）

function buildingGridClear() { buildingGrid.clear(); }

function buildingGridInsert(settlementIdx, wx, wy) {
  const cx = (wx / BUILDING_GRID_CELL) | 0;
  const cy = (wy / BUILDING_GRID_CELL) | 0;
  const key = cx * 100003 + cy;
  let bucket = buildingGrid.get(key);
  if (!bucket) { bucket = []; buildingGrid.set(key, bucket); }
  bucket.push(settlementIdx);
}

function buildingGridQuery(wx, wy, out) {
  out.length = 0;
  const cx = (wx / BUILDING_GRID_CELL) | 0;
  const cy = (wy / BUILDING_GRID_CELL) | 0;
  // BREATH_RANGE 80px を BUILDING_GRID_CELL 100px で割ると1セル以内に収まる
  for (let dy = -1; dy <= 1; dy++) {
    for (let dx = -1; dx <= 1; dx++) {
      const key = (cx + dx) * 100003 + (cy + dy);
      const b = buildingGrid.get(key);
      if (b) for (const idx of b) out.push(idx);
    }
  }
}

// v0.6: 走査セル半径を指定できる版。「射程延伸」でブレス射程が
// グリッドセル（100px）を超えたときに取りこぼしを防ぐ。
function buildingGridQueryRadius(wx, wy, cellRadius, out) {
  out.length = 0;
  const cx = (wx / BUILDING_GRID_CELL) | 0;
  const cy = (wy / BUILDING_GRID_CELL) | 0;
  for (let dy = -cellRadius; dy <= cellRadius; dy++) {
    for (let dx = -cellRadius; dx <= cellRadius; dx++) {
      const key = (cx + dx) * 100003 + (cy + dy);
      const b = buildingGrid.get(key);
      if (b) for (const idx of b) out.push(idx);
    }
  }
}

function rebuildBuildingGrid() {
  buildingGridClear();
  // v0.11.4: 陥落済み（廃墟）の建物も含めて全件を登録する。
  // 理由: settlementFall() の近傍再描画（廃墟同士が互いを巻き込んで消す問題の修正）は
  // 廃墟も検出できる必要がある。攻撃判定・障害物判定など他の全消費箇所は
  // クエリ結果を受け取った後で必ず自前の `if (!s || s.fallen) continue;` を
  // 行っているため、fallen を含めて登録しても既存の挙動に影響しない。
  for (let s = 0; s < settlements.length; s++) {
    buildingGridInsert(s, settlements[s].wx, settlements[s].wy);
  }
}

// 建物Spatial Hashの近傍クエリ用バッファ
const _buildingNeighbourBuf = [];
// settlementFall 専用の近傍探索バッファ（_clusterQueryBuf 等）は
// collectOverlappingCluster の定義側にまとめてある。
// _buildingNeighbourBuf は呼び出し側（updateCollisionAttacks 等）が
// for-of で反復している最中に settlementFall() を呼ぶことがあるため、
// settlementFall 系の処理でこの配列を使い回してはいけない（専用配列を使うこと）。

// 攻撃判定ゲート用: フレーム内で「射程内にドラゴンがいる」とマークされた建物インデックスの集合。
// ドラゴン側から建物ハッシュをたどる逆引き方式で、群れから遠い建物の全ドラゴン走査を省く。
// Set は毎フレームクリアして使い回す。
const _settlementsInRange = new Set();

// 攻撃判定に使う空間ハッシュのセルサイズ。
// 最大attackRadius=300px を1クエリ(±1セル)でカバーするには cellSize >= 300 が必要。
// BUILDING_GRID_CELL=100 は 100px 範囲クエリ用なので、攻撃判定用に別グリッドを持つ。
// ただし、専用グリッドを別途維持するコストを避けるため、以下の方式を採る:
// 「各ドラゴンの位置から最大攻撃射程(MAX_ATTACK_RADIUS)内の建物グリッドセルを走査し、
//  ヒットした建物インデックスを _settlementsInRange に登録する」
// BUILDING_GRID_CELL=100 で cellRadius=ceil(300/100)=3 → ±3セル(7×7=49セル) のクエリ
// ボスの BOSS_ATTACK_RADIUS=380 が最大値。空間ハッシュクエリ半径もこれに合わせる。
const MAX_ATTACK_RADIUS = 380; // ボスの attackRadius
// v0.57: 走査半径は**実際に置かれた建物の最大 attackRadius** から毎ステージ決める。
// ここを 380 固定にしていたせいで、attackRadius をいくら広げても
// 400px より遠い群れは Set に入らず、その建物は永久に撃たなかった
// （実測: プリズム塔は射程620のはずが496px の群れへ10秒間0ダメージ。
//  v0.48 のロケット砲台も 465 と称して実効 400px だった）。
let _atkCellRadius = Math.ceil(MAX_ATTACK_RADIUS / BUILDING_GRID_CELL);
/** ステージ生成後に呼ぶ。置かれた建物の射程に合わせて走査半径を広げる。 */
function recomputeAttackQueryRadius() {
  let maxR = MAX_ATTACK_RADIUS;
  for (const s of settlements) {
    if (s && !s._noAttack && s.attackRadius > maxR) maxR = s.attackRadius;
  }
  _atkCellRadius = Math.ceil(maxR / BUILDING_GRID_CELL);
}

// ドラゴン位置周辺の建物を攻撃判定グリッドで収集する
function _queryBuildingsForAttack(bx, by) {
  const cx = (bx / BUILDING_GRID_CELL) | 0;
  const cy = (by / BUILDING_GRID_CELL) | 0;
  for (let dy = -_atkCellRadius; dy <= _atkCellRadius; dy++) {
    for (let dx = -_atkCellRadius; dx <= _atkCellRadius; dx++) {
      const key = (cx + dx) * 100003 + (cy + dy);
      const bucket = buildingGrid.get(key);
      if (bucket) {
        for (const idx of bucket) _settlementsInRange.add(idx);
      }
    }
  }
}

/**
 * v0.57: 時代兵器を1回撃つ。次弾までの間隔もここで決める。
 * @param {object} s          撃つ建物
 * @param {number} targetIdx  狙う竜（最寄り）
 */
function fireEmplacement(s, targetIdx) {
  const key = s._emplacement;
  const def = EMPLACEMENT_DEFS[key];
  if (!def) return;
  s.attackTimer = def.interval;
  const tx = px[targetIdx], ty = py[targetIdx];
  const base = Math.atan2(ty - s.wy, tx - s.wx);

  if (key === "ember") {
    // 足元に燃える輪を置く（0.7秒の予告つき）。弾ではないので当たり判定は hazard 側
    spawnHazard(s.wx, s.wy, EMBER_TOWER_RADIUS, EMBER_TOWER_LIFE, EMBER_TOWER_DPS, "#ff8038");
  } else if (key === "trebuchet") {
    // 巨岩を1発。遅い＝予告円を見てから退ける
    spawnShell(s.wx, s.wy, tx, ty, TREBUCHET_SPEED, TREBUCHET_DAMAGE, TREBUCHET_AOE, "#e8dcc0");
  } else if (key === "ballista") {
    // 重矢の3連射。線なので横へ抜ければ避けられる（当たるとカタパルト弾の強ノックバック）
    for (let k = 0; k < BALLISTA_COUNT; k++) {
      spawnFanProjectileRaw(s.wx, s.wy, base + (k - (BALLISTA_COUNT - 1) / 2) * 0.055,
                            BALLISTA_SPEED, BALLISTA_DAMAGE, "#f0e4c8", 1, def.range + 30);
    }
  } else if (key === "rocket") {
    // 遅い大弾を扇状にまとめて撃つ（避けられる猶予がある）
    for (let k = 0; k < ROCKET_COUNT; k++) {
      const spread = ROCKET_COUNT === 1 ? 0 : (k / (ROCKET_COUNT - 1) - 0.5) * 2;   // -1..1
      spawnRocket(s.wx, s.wy, base + spread * ROCKET_SPREAD);
    }
  } else if (key === "mortar") {
    // 群れの周りへ散らして落とす。時間差にして「割って抜ける」余地を残す
    for (let k = 0; k < MORTAR_COUNT; k++) {
      const a = random() * Math.PI * 2;
      const r = random() * MORTAR_SCATTER;
      queueShell(k * 0.22, s.wx, s.wy, tx + Math.cos(a) * r, ty + Math.sin(a) * r,
                 MORTAR_SPEED, MORTAR_DAMAGE, MORTAR_AOE, "#c8d0d8");
    }
  } else if (key === "tesla") {
    // 連鎖電撃（敵の雷撃塔車と同じ）。固めているほど痛い＝建物側にも密度の罰を置く
    const fired = emitChainLightning(s.wx, s.wy, {
      range: def.range, damage: 2.2, hops: 14, hopRange: 58,
      densityRange: 46, densityScale: 0.30, densityMax: 3.0,
    });
    if (!fired) s.attackTimer = 0.5;
  } else if (key === "flak") {
    // 対空弾幕。小さい炸裂を群れの周囲へ広く撒いて逃げ場を削る
    for (let k = 0; k < FLAK_COUNT; k++) {
      const a = random() * Math.PI * 2;
      const r = random() * FLAK_SCATTER;
      queueShell(k * 0.14, s.wx, s.wy, tx + Math.cos(a) * r, ty + Math.sin(a) * r,
                 FLAK_SPEED, FLAK_DAMAGE, FLAK_AOE, "#ffd070");
    }
  } else if (key === "concussionBattery") {
    // ノックバック弾の斉射。当たった竜だけでなく**着弾点の周りごと**押す
    // （弾1発は竜1体しか押せないので、着弾を小さな衝撃波にしないと群れには効かない）。
    for (let k = 0; k < CONCUSSION_BATTERY_COUNT; k++) {
      const t = (k - (CONCUSSION_BATTERY_COUNT - 1) / 2);
      spawnFanProjectileRaw(s.wx, s.wy, base + t * CONCUSSION_BATTERY_SPREAD,
                            CONCUSSION_BATTERY_SPEED, CONCUSSION_BATTERY_DAMAGE,
                            "#dff2ff", 1, def.range + 40, CONCUSSION_BATTERY_KNOCK_R);
    }
  } else if (key === "prism") {
    // 首都の極太レーザーの小型版。細いぶん予兆から外れやすい
    spawnLaserStrike(s.wx, s.wy, base, PRISM_WIDTH, PRISM_LENGTH, PRISM_DPS, "#e0a0ff");
  }
}

function updateSettlementAttacks(dt) {
  // (A) 逆引き方式: ドラゴン側から「近くの建物」を空間ハッシュで収集する。
  // 群れ全体でO(N × (2*cellRadius+1)^2) ≈ O(N × 49)。
  // 群れから遠い大多数の建物は Set に入らないため全ドラゴン走査から除外される。
  _settlementsInRange.clear();
  for (let i = 0; i < N; i++) {
    if (boidDead[i] || boidDowned[i]) continue;
    _queryBuildingsForAttack(px[i], py[i]);
  }

  // (B) Set 内の建物だけ射程内判定・発射処理する。
  // Set サイズは群れ近傍の建物数のみ（遠方の建物は含まれない）。
  for (const s of _settlementsInRange) {
    const settlement = settlements[s];
    if (!settlement || settlement.fallen) continue;
    if (settlement._noAttack) continue;   // v0.41: 城下の民家は撃たない（弾量を街と同等に保つ）

    let inRange = false;
    const atkR2 = settlement.attackRadius * settlement.attackRadius;
    for (let i = 0; i < N; i++) {
      if (boidDead[i] || boidDowned[i]) continue;
      const dx = px[i] - settlement.wx;
      const dy = py[i] - settlement.wy;
      if (dx * dx + dy * dy < atkR2) { inRange = true; break; }
    }
    if (!inRange) continue;

    settlement.attackTimer -= dt;
    if (settlement.attackTimer > 0) continue;
    // 通常建物: 発射頻度を大幅に下げる（×4倍の間隔 = たまに飛ぶ「雰囲気」として残す）
    // ボス: projectileInterval をそのまま使う（定数で設定した高頻度を活かす）
    settlement.attackTimer = settlement.isBoss
      ? settlement.projectileInterval
      : settlement.projectileInterval * 4.0;

    const targetIdx = findNearestAliveBoid(settlement.wx, settlement.wy);
    if (targetIdx < 0) continue;

    // v0.57: 時代兵器を持つ建物は通常弾を撃たず、専用の技を出す。
    // ※ targetIdx を使うので、必ずその宣言より後に置くこと
    //   （前に置いて const の TDZ で落ちた。構文チェックでは検出できない）。
    if (settlement._emplacement) {
      fireEmplacement(settlement, targetIdx);
      continue;
    }

    // 変更5: 集落種別に応じて弾種を決定する。
    // ボス → ボス重弾（kind=2: 位置ごと押し戻す強烈なノックバック。v0.7）
    // large・首都（_isCapital）→ カタパルト弾（kind=1: 強ノックバック・大きな矢）
    // それ以外（small/tiny/medium）→ 通常矢弾（kind=0: 小さく・射程短い・弱ノックバック）
    const isCatapultShooter = settlement._isCapital || settlement.size === "large";
    const kind = settlement.isBoss ? 2 : (isCatapultShooter ? 1 : 0);

    const count = settlement.projectileCount;
    if (count === 1) {
      spawnProjectile(
        settlement.wx, settlement.wy,
        targetIdx,
        settlement.projectileSpeed,
        settlement.projectileDamage,
        settlement.projectileColor,
        settlement.projectileAoe,
        settlement.projectileTracking,
        kind,
      );
    } else if (count === 2) {
      const baseAngle = calcAngleToTarget(settlement.wx, settlement.wy, targetIdx);
      for (let k = -1; k <= 0; k++) {
        spawnFanProjectileRaw(
          settlement.wx, settlement.wy,
          baseAngle + k * 0.4,
          settlement.projectileSpeed,
          settlement.projectileDamage,
          settlement.projectileColor,
          kind,
        );
      }
    } else if (count === 3) {
      const baseAngle = calcAngleToTarget(settlement.wx, settlement.wy, targetIdx);
      for (let k = -1; k <= 1; k++) {
        spawnFanProjectileRaw(
          settlement.wx, settlement.wy,
          baseAngle + k * 0.3,
          settlement.projectileSpeed,
          settlement.projectileDamage,
          settlement.projectileColor,
          kind,
        );
      }
    } else {
      const angleStep = (Math.PI * 2) / count;
      const baseAngle = random() * Math.PI * 2;
      for (let k = 0; k < count; k++) {
        spawnFanProjectileRaw(
          settlement.wx, settlement.wy,
          baseAngle + k * angleStep,
          settlement.projectileSpeed,
          settlement.projectileDamage,
          settlement.projectileColor,
          kind,
        );
      }
    }
  }
}

function calcAngleToTarget(fromX, fromY, targetBoidIdx) {
  if (targetBoidIdx < 0) return 0;
  return Math.atan2(py[targetBoidIdx] - fromY, px[targetBoidIdx] - fromX);
}

// 変更5: kind=0(arrow) / kind=1(catapult)
function spawnFanProjectileRaw(fromWx, fromWy, angle, speed, damage, color, kind, maxRange, knockR) {
  const slot = takeProjectileSlot();
  if (slot < 0) return;
  // 変更3: 弾速倍率を適用（v0.57: 文明ごとの弾速倍率／v0.62: 1/3 の減速を重ねる）
  // ここを通るのは扇撃ち＝すべて通常弾（矢・カタパルト弾）なので一律で減速する。
  const actualSpeed = speed * PROJECTILE_SPEED_MULT * eraShotSpeedMult() * NORMAL_SHOT_SPEED_SCALE;
  projActive[slot]     = 1;
  projWx[slot]         = fromWx;
  projWy[slot]         = fromWy;
  projTailX[slot]      = fromWx;
  projTailY[slot]      = fromWy;
  // 変更3: 発射点を記録（飛距離上限判定用）
  projStartWx[slot]    = fromWx;
  projStartWy[slot]    = fromWy;
  projVx[slot]         = Math.cos(angle) * actualSpeed;
  projVy[slot]         = Math.sin(angle) * actualSpeed;
  projDmg[slot]        = damage;
  projAoe[slot]        = 0;
  projTracking[slot]   = 0;
  projTargetIdx[slot]  = -1;
  projColor[slot]      = color;
  // 変更5: 種別を記録（デフォルト 0=arrow）
  projKind[slot]       = (kind === 1) ? 1 : 0;
  projStyle[slot]      = eraShotStyle();
  projRange[slot]      = maxRange || 0;   // v0.57: 0 なら kind ごとの既定射程
  projKnockR[slot]     = knockR || 0;     // v0.59: 着弾点で周囲を押す半径
}

function updateProjectiles(dt) {
  for (let i = 0; i < MAX_PROJECTILES; i++) {
    if (!projActive[i]) continue;

    if (projTracking[i] && projTargetIdx[i] >= 0 && !boidDead[projTargetIdx[i]]) {
      const dx = px[projTargetIdx[i]] - projWx[i];
      const dy = py[projTargetIdx[i]] - projWy[i];
      const d  = Math.sqrt(dx * dx + dy * dy) || 1;
      const currentSpeed = Math.sqrt(projVx[i] * projVx[i] + projVy[i] * projVy[i]);
      projVx[i] += (dx / d * currentSpeed - projVx[i]) * 0.06;
      projVy[i] += (dy / d * currentSpeed - projVy[i]) * 0.06;
    }

    projTailX[i] = projWx[i];
    projTailY[i] = projWy[i];

    projWx[i] += projVx[i] * dt;
    projWy[i] += projVy[i] * dt;

    if (projWx[i] < -50 || projWx[i] > WORLD_W + 50 || projWy[i] < -50 || projWy[i] > WORLD_H + 50) {
      projActive[i] = 0;
      continue;
    }

    // v0.57: 着弾弾（kind=4）は飛距離ではなく**落下点への到達**で終わる。
    // 竜との当たり判定は持たない（線ではなく円で脅すための弾）。
    if (projKind[i] === 4) {
      const sdx = projTgtX[i] - projWx[i];
      const sdy = projTgtY[i] - projWy[i];
      // 行き過ぎ（内積が負）か、1フレームぶんの距離まで来たら炸裂
      if (sdx * projVx[i] + sdy * projVy[i] <= 0 || sdx * sdx + sdy * sdy < 64) detonateShell(i);
      continue;
    }

    // 変更5: 飛距離上限チェック（種別ごとに異なる最大射程を適用）
    // catapult(kind=1): PROJECTILE_MAX_RANGE=420px（広い射程）
    // arrow  (kind=0): ARROW_MAX_RANGE=250px（短い射程、近づかないと当たらない）
    const tdx      = projWx[i] - projStartWx[i];
    const tdy      = projWy[i] - projStartWy[i];
    const maxRange = projRange[i] > 0  ? projRange[i]          // v0.57: 個別指定（首都の一斉射など）
                   : projKind[i] === 3 ? ROCKET_MAX_RANGE      // v0.48: ロケットは遅い代わりに長射程
                   : projKind[i] === 2 ? BOSS_SHOT_MAX_RANGE
                   : projKind[i] === 1 ? PROJECTILE_MAX_RANGE
                   : ARROW_MAX_RANGE;
    if (tdx * tdx + tdy * tdy > maxRange * maxRange) {
      projActive[i] = 0;
      continue;
    }

    // v0.6-p3: 岩山は敵の投射も止める（岩陰に隠れる立ち回りが生まれる）
    let blockedByRock = false;
    for (const ob of terrainObstacles) {
      if (ob.type !== "rock") continue;
      const rdx = ob.wx - projWx[i];
      const rdy = ob.wy - projWy[i];
      if (rdx * rdx + rdy * rdy < ob.radius * ob.radius) { blockedByRock = true; break; }
    }
    if (blockedByRock) {
      projActive[i] = 0;
      continue;
    }

    checkProjectileHitBoids(i);
  }
}

// 投射物ダメージ係数: 1ヒットで BOID_MAX_HP の 1/7 程度（数発耐える）
// 0.0 から復活。ダウンモデルにより恒久消滅しないのでダメージを有効化する。
const PROJECTILE_DAMAGE_MULTIPLIER = 1.0;

// v0.63: **通常弾（kind=0 矢 / kind=1 カタパルト弾）だけ威力+30%**（Shooter指示）。
// v0.62 で 1/3 の速さにしたぶん当たらなくなり、20秒の被ダメージが 24,265 → 20,900（-14%）
// まで落ちていた。速くするのではなく1発を重くして戻す＝弾幕の見た目はそのまま。
// ロケット・ボス重弾・着弾弾は速度も威力も据え置き（見た目・手触りが良いとの判断）。
const NORMAL_SHOT_DAMAGE_MULT = 1.3;

// 変更3: 投射物命中時のノックバック速度（px/s）
// 弾の進行方向と同方向に押し出す（矢が刺さって押される感覚）。
// 120px/s は maxSpeed(160) の75%なので体感できるが maxSpeed クランプで飛び出さない。
const PROJECTILE_KNOCKBACK_SPEED = 120;

function checkProjectileHitBoids(projIdx) {
  const HIT_R  = 8;
  const HIT_R2 = HIT_R * HIT_R;

  // トンネリング対策: 弾速が高いと1フレームで HIT_R を超える距離を移動しうる。
  // テール（前フレーム位置）と現在位置の中間点でも判定することで
  // 最大936 px/s（260 × 3.6）の弾でもすり抜けを防ぐ。
  // 中間点 = tailX + (wx - tailX) * 0.5。2ステップで直径16pxのギャップをカバーできる。
  const midX = (projWx[projIdx] + projTailX[projIdx]) * 0.5;
  const midY = (projWy[projIdx] + projTailY[projIdx]) * 0.5;

  for (let i = 0; i < N; i++) {
    if (boidDead[i] || boidDowned[i]) continue;

    // 現在位置で判定
    let dx = projWx[projIdx] - px[i];
    let dy = projWy[projIdx] - py[i];
    let hit = dx * dx + dy * dy < HIT_R2;

    // 当たらなければ中間点でも判定（高速弾のトンネリングを防ぐ）
    if (!hit) {
      dx  = midX - px[i];
      dy  = midY - py[i];
      hit = dx * dx + dy * dy < HIT_R2;
    }

    if (hit) {
      // v0.63: 遅くした通常弾(0/1)だけ +30%。ロケット(3)・ボス重弾(2)・着弾弾(4)は据え置き
      const kindMult = (projKind[projIdx] === 0 || projKind[projIdx] === 1)
        ? NORMAL_SHOT_DAMAGE_MULT : 1;
      applyDamageToBoid(i, PROJECTILE_HIT_DAMAGE * PROJECTILE_DAMAGE_MULTIPLIER * kindMult);
      // v0.7: AoE弾（爆撃気球・古代の投石など projectileAoe>0）は着弾点周囲にも被害
      if (projAoe[projIdx] > 0) {
        applyAoeProjectileDamage(projWx[projIdx], projWy[projIdx], projAoe[projIdx],
                                 projDmg[projIdx] * 0.6);
        spawnCollisionParticles(projWx[projIdx], projWy[projIdx]);
      }
      // v0.59: 押してくる射撃（散弾砲車・衝撃砲）は**着弾点で周りごと押す**。
      // ダメージは既に上で入っているので、ここは押し出しとリングFXだけ（damage 0）。
      if (projKnockR[projIdx] > 0) {
        emitShockwave(projWx[projIdx], projWy[projIdx], projKnockR[projIdx], 0, KNOCK_SHOT_PUSH);
      }
      spawnHitParticles(projWx[projIdx], projWy[projIdx]);
      if (!boidDowned[i]) applyProjectileKnockback(i, projIdx);
      projActive[projIdx] = 0;
      return;
    }
  }
}

function applyProjectileKnockback(boidIdx, projIdx) {
  // v0.6-p2: 緋竜（MELEE）はノックバック無効（突っ込み続ける。仕様 §6.4）
  if (flockWeapon === "melee") return;

  const pvx    = projVx[projIdx];
  const pvy    = projVy[projIdx];
  const pspeed = Math.sqrt(pvx * pvx + pvy * pvy) || 1;
  const nx = pvx / pspeed;
  const ny = pvy / pspeed;

  // v0.34.1: ノックバックはすべて「減衰する外力」に統一した。
  // 旧実装は kind=2 だけ px/py を直接ずらしていたが（速度加算が操舵に
  // 打ち消されるため）、ワープして見えて不自然だった。
  // 外力チャネルなら操舵に消されず、かつ連続的に動くので両方の問題が解ける。
  if (projKind[projIdx] === 2) {
    applyKickDist(boidIdx, nx, ny, BOSS_SHOT_KNOCKBACK_DIST);
    return;
  }

  // 変更5: 種別ごとにノックバック強度を分岐する
  // catapult(kind=1): CATAPULT_KNOCKBACK_SPEED=220（強い。体感できる吹き飛び）
  // arrow  (kind=0): ARROW_KNOCKBACK_SPEED=60（弱い。ちょっと押される程度）
  const knockbackSpeed = projKind[projIdx] === 1
    ? CATAPULT_KNOCKBACK_SPEED
    : ARROW_KNOCKBACK_SPEED;
  applyKick(boidIdx, nx, ny, knockbackSpeed);
}

function applyAoeProjectileDamage(wx, wy, aoeR, damage) {
  const r2 = aoeR * aoeR;
  for (let i = 0; i < N; i++) {
    if (boidDead[i] || boidDowned[i]) continue;
    const dx = wx - px[i];
    const dy = wy - py[i];
    if (dx * dx + dy * dy < r2) {
      applyDamageToBoid(i, damage);
    }
  }
}

// -----------------------------------------------------------------
// ブレス攻撃（レーザー照射）
// 近接ダメージの代替: ドラゴンが射程内の最近建物へ連続照射
// ブレスデータは描画フェーズで使えるよう毎フレーム収集する
// -----------------------------------------------------------------

// ブレス情報バッファ: { boidIdx, settlementIdx, hitX, hitY } の配列
// 毎フレームのupdate時に構築し、draw時に参照する
const activeBreaths = [];

// ブレスのアニメーション時間（sin揺らぎ用）
let breathTime = 0;

// v0.6: 多重照射の最大対象数（「多重照射」カード max=2 → 最大3対象）
const BREATH_MAX_TARGETS = 3;
// 多重照射の近傍上位選択に使う作業バッファ（毎フレーム使い回し）
const _breathTargetBuf = [];

// v0.6-p2: BEAM武器の攻撃処理。updateWeaponAttacks から flockWeapon==="beam" のとき呼ばれる
// （breathTime の加算と activeBreaths のクリアはディスパッチャ側で行う）。
function updateBeamAttacks(dt) {
  // v0.6: 射程・威力・対象数は強化カードで伸びる
  const effRange   = BREATH_RANGE * effWeaponRangeMult("beam");
  const BREATH_R2  = effRange * effRange;
  const maxTargets = Math.min(BREATH_MAX_TARGETS, effBeamTargets());
  const damageThisFrame = BREATH_DAMAGE_PER_SEC * effWeaponDmgMult("beam") * dt;
  // 射程延伸で 100px（グリッドセル）を超えたら近傍クエリの走査半径も広げる
  const cellRadius = Math.max(1, Math.ceil(effRange / BUILDING_GRID_CELL));

  // Spatial Hash を使ってブレス射程内の建物候補を絞る
  for (let i = 0; i < N; i++) {
    // 変更2: ダウン中はブレスを吐かない
    if (boidDead[i] || boidDowned[i] || boidKnockStun[i] > 0) continue;   // v0.59: 押されている間は攻撃しない

    buildingGridQueryRadius(px[i], py[i], cellRadius, _buildingNeighbourBuf);

    // 射程内の建物を距離昇順で最大 maxTargets 件選ぶ（挿入ソート、k≤3 なので軽い）
    _breathTargetBuf.length = 0;
    for (const sIdx of _buildingNeighbourBuf) {
      const settlement = settlements[sIdx];
      if (!settlement || settlement.fallen) continue;
      const dx = settlement.wx - px[i];
      const dy = settlement.wy - py[i];
      const d2 = dx * dx + dy * dy;
      if (d2 >= BREATH_R2) continue;

      let insertAt = _breathTargetBuf.length;
      for (let t = 0; t < _breathTargetBuf.length; t++) {
        if (d2 < _breathTargetBuf[t].d2) { insertAt = t; break; }
      }
      _breathTargetBuf.splice(insertAt, 0, { sIdx, d2 });
      if (_breathTargetBuf.length > maxTargets) _breathTargetBuf.length = maxTargets;
    }

    // v0.6-p4: 射程内に建物が無いときは移動敵を照射する（純BEAM群でも移動敵を倒せる）
    if (_breathTargetBuf.length === 0) {
      let nearestMover = null;
      let nearestMoverD2 = BREATH_R2;
      for (const m of movers) {
        if (!m.alive) continue;
        const mdx = m.wx - px[i];
        const mdy = m.wy - py[i];
        const md2 = mdx * mdx + mdy * mdy;
        if (md2 < nearestMoverD2) { nearestMoverD2 = md2; nearestMover = m; }
      }
      if (nearestMover) {
        damageMover(nearestMover, damageThisFrame, px[i], py[i]);
        activeBreaths.push({ boidIdx: i, targetWx: nearestMover.wx, targetWy: nearestMover.wy });
      }
      continue;
    }

    for (let t = 0; t < _breathTargetBuf.length; t++) {
      const sIdx = _breathTargetBuf[t].sIdx;
      const settlement = settlements[sIdx];
      if (settlement.fallen) continue; // 同フレーム内で先の照射により陥落済み

      // ダメージ適用
      settlement.hp -= damageThisFrame;

      // ヒットパーティクル（0.2秒間引き）
      settlement._breathParticleTimer -= dt;
      if (settlement._breathParticleTimer <= 0) {
        settlement._breathParticleTimer = BREATH_PARTICLE_INTERVAL;
        spawnHitParticles(
          settlement.wx + (fxRandom() - 0.5) * settlement.radius,
          settlement.wy + (fxRandom() - 0.5) * settlement.radius,
        );
      }

      // 建物破壊チェック
      if (settlement.hp <= 0 && !settlement.fallen) {
        settlementFall(sIdx);
        // 破壊された建物のグリッドエントリを更新（次フレームで再構築される）
        buildingLayerDirty = true;
      }

      // ブレス描画データを収集
      activeBreaths.push({
        boidIdx: i,
        targetWx: settlement.wx,
        targetWy: settlement.wy,
      });
    }
  }

  // v0.33: BEAM は単発ではなく持続照射なので、反動は「照射している間ずっと押し戻される」
  // 連続的な力として与える。v0.34.1: 外力チャネルへ移した。
  // 減衰率 λ に対して毎フレーム λ*R*dt を注ぎ足すと外力の定常値が R に落ち着く
  // ＝「撃っている間 R px/s で押し戻され続ける」になる。
  // 既存の火竜は recoilDist=0 なので挙動は変わらない（デバッグ上書き時のみ効く）。
  const recoil = effRecoilDist();
  if (recoil > 0) {
    const inject = KICK_DECAY_PER_SEC * recoil * dt;
    for (const b of activeBreaths) {
      const i = b.boidIdx;
      const ang = Math.atan2(b.targetWy - py[i], b.targetWx - px[i]);
      applyKick(i, -Math.cos(ang), -Math.sin(ang), inject, false);   // 自分の反動なので硬直させない
    }
  }
}

// -----------------------------------------------------------------
// 変更2: 直接衝突攻撃（ドラゴンが建物に体当たりしたときのダメージ＋ヒットストップ）
// 群れの流れを止めないよう、衝突しても押し戻しはせず通過させる。
// かわりにクールダウンで連続ヒットを防ぎ、単発の重い一撃感を出す。
// -----------------------------------------------------------------
function updateCollisionAttacks(dt) {
  if (gameState !== "playing") return;

  // ヒットストップタイマーとクールダウンを先に進める
  for (let i = 0; i < N; i++) {
    if (boidHitStopTimer[i] > 0)      boidHitStopTimer[i]    = Math.max(0, boidHitStopTimer[i] - dt);
    if (boidKnockStun[i] > 0)         boidKnockStun[i]       = Math.max(0, boidKnockStun[i] - dt);
    if (boidCollisionCooldown[i] > 0) boidCollisionCooldown[i] = Math.max(0, boidCollisionCooldown[i] - dt);
  }

  for (let i = 0; i < N; i++) {
    // 変更2: ダウン中は建物に衝突しない
    if (boidDead[i] || boidDowned[i] || boidKnockStun[i] > 0) continue;   // v0.59: 押されている間は攻撃しない
    // クールダウン中はこの個体の衝突判定をスキップ
    if (boidCollisionCooldown[i] > 0) continue;

    // Spatial Hash で近傍建物を取得（BREATH_RANGE と同じグリッドを流用）
    buildingGridQuery(px[i], py[i], _buildingNeighbourBuf);

    for (const sIdx of _buildingNeighbourBuf) {
      const s = settlements[sIdx];
      if (!s || s.fallen) continue;

      // 衝突判定: ドラゴン半径6px + 建物半径 の合計以内に入ったら衝突
      const collideR = s.radius + 6;
      const dx = s.wx - px[i];
      const dy = s.wy - py[i];
      if (dx * dx + dy * dy > collideR * collideR) continue;

      // --- 衝突発生 ---

      // 建物にダメージ（ブレスより大きい単発ダメージ）
      // v0.6-p2: 緋竜（MELEE）は体当たりが主武装（威力約3倍・クールダウン短縮。仕様 §6.4）
      const isMelee = flockWeapon === "melee";
      s.hp -= isMelee
        ? MELEE_COLLISION_DAMAGE * effWeaponDmgMult("melee")
        : COLLISION_DAMAGE;

      // ヒットストップ: この個体だけ一瞬止める（3フレーム相当）。
      // v0.33: 攻撃の fireStun（硬直）が長ければそちらを使う
      // ＝爪撃（緋竜）は当たった後にぐっと重く止まる。v0.34: 攻撃側から引く。
      boidHitStopTimer[i]    = Math.max(HITSTOP_DURATION, atk().fireStun);
      // クールダウンをセットして同じ建物への連続ヒットを防ぐ
      boidCollisionCooldown[i] = isMelee ? MELEE_COLLISION_COOLDOWN : COLLISION_COOLDOWN;

      // 強めのパーティクル（破片が飛ぶ）
      spawnCollisionParticles(s.wx, s.wy);
      // v0.8: 緋竜は深紅の斬閃＋火花＋画面シェイクで一撃の重さを出す
      if (isMelee) {
        spawnMeleeImpactFx(s.wx, s.wy, Math.atan2(vy[i], vx[i]));
        triggerShake(2.2, 0.09);
      }

      // 振動フィードバック（15ms）
      hapticPulse(15);

      // 建物破壊チェック
      if (s.hp <= 0 && !s.fallen) {
        settlementFall(sIdx);
        buildingLayerDirty = true;
      }

      // 1個体につき1建物までで打ち切り（同フレームで複数衝突しない）
      break;
    }
  }
}

// 衝突時の強めパーティクル（破片感）
function spawnCollisionParticles(wx, wy) {
  // 通常のブレスパーティクルより多く、速く、広がりも大きい
  const count = 6 + Math.floor(fxRandom() * 5); // 6〜10個
  let spawned = 0;
  for (let i = 0; i < MAX_PARTICLES && spawned < count; i++) {
    if (partActive[i]) continue;
    partActive[i] = 1;
    partX[i] = wx + (fxRandom() - 0.5) * 12;
    partY[i] = wy + (fxRandom() - 0.5) * 12;
    const angle = fxRandom() * Math.PI * 2;
    // 通常の2〜3倍の初速で破片が吹き飛ぶ
    const speed = 80 + fxRandom() * 160;
    partVx[i]   = Math.cos(angle) * speed;
    partVy[i]   = Math.sin(angle) * speed;
    // 寿命も少し長め
    partLife[i] = 0.25 + fxRandom() * 0.20;
    spawned++;
  }
}

/**
 * settlement 1棟ぶんのクリア矩形半径（建物レイヤー上でこの建物が占めうる最大範囲）。
 *
 * v0.11.4: 通常建物の式を大幅に絞った。旧式 max(radius*1.55, radius+14) は
 * 「+14」の定数項が小さい建物（tiny/small: radius 6〜10）で支配的になり、
 * 実際の建物間最小配置間隔（tinyで20px）に対して倍以上の半幅（20〜24px）を
 * 取ってしまっていた。密集市街ではクリア矩形どうしが数珠つなぎに重なり合い、
 * settlementFall() の巻き込み修復（collectOverlappingCluster）が
 * 連結成分112棟・処理29〜63msという致命的な性能劣化を起こすことを実測で確認した。
 * 廃墟スプライト自体は radius*2.2（半幅 radius*1.1）なので、わずかな
 * 余白（+4px）だけ足せば見た目上は十分（v0.11.6で焦土は廃止済み）。
 * ボスと要塞建物（軍旗の描画が radius+9 上方まで伸びる）だけは従来の余裕ある式を残す。
 */
function settlementLayerPadding(settlement) {
  if (settlement.isBoss) return settlement.radius * 2.5;
  if (settlement._fortified) return Math.max(settlement.radius * 1.55, settlement.radius + 14);
  return settlement.radius * 1.3 + 4;
}

/**
 * v0.11.4: settlement 1棟ぶんのクリア矩形だけを消す（描画はしない）。
 *
 * 複数棟が互いのクリア矩形を巻き込む密集地では、「1棟ずつクリア→描画」を
 * 順番に繰り返すと、後から処理した棟のクリアが直前に描いたばかりの棟の
 * スプライトを再び消してしまう（3棟以上の連鎖で発覚。B死亡時にA→Cの順で
 * 処理すると、Cのクリアが直前に復元したAを再度巻き込む）。
 * そのため settlementFall() では「影響範囲の全棟を先にクリアし終えてから、
 * 全棟をまとめて描画する」の二段階に分離する。クリア同士は結果が可換
 * （どの順でクリアしても合成後の消去範囲は同じ）なので、これで安全になる。
 */
function clearSettlementLayerBox(bc, settlement) {
  const padding = settlementLayerPadding(settlement);
  // v0.11.3: このキャンバスは建物専用レイヤー（地面・道路・畑・川は別キャンバス
  // 地面レイヤー側）なので、ここでクリアしても地面側は一切影響を受けない。
  bc.clearRect(
    settlement.wx - padding,
    settlement.wy - padding,
    padding * 2,
    padding * 2,
  );
}

/**
 * v0.11.4: settlement を「今の状態」に合わせて描く（クリアは行わない）。
 * 陥落済みなら廃墟、生存中なら通常の建物スプライトを描く。
 * clearSettlementLayerBox() とセットで、必ず「対象全棟のクリアを終えてから
 * 全棟を描く」の後半フェーズとして呼ぶこと。
 *
 * v0.11.6: 焦土（半透明の円形グラデーション）を廃止した。密集地では隣り合う
 * ruinのクリア矩形（正方形）の縁が視認でき、「四角く見える」とShooterから
 * 指摘された。半透明グラデーションはクリップ矩形の境界で必ずこの縁が出るため、
 * 中途半端に透明を残すより完全に透過（背景の地面レイヤーがそのまま見える）
 * にした方が見栄えが良い。廃墟スプライト自体の見た目はそのまま。
 */
function paintSettlementScorchAndSprite(bc, settlement) {
  drawSettlementOnLayer(bc, settlement);
}

// v0.11.4: settlementFall 専用のBFS作業キュー・訪問集合（毎回使い回す）。
// 呼び出し中に他コードから割り込みで参照されることはない（同期実行のため）。
const _clusterQueue = [];
const _clusterQueryBuf = [];

// v0.11.5: 連結成分の探索上限（純粋な安全弁。通常は絶対に発動しない値にしてある）。
//
// 密集した町の中心部ではクリア矩形が数珠つなぎに重なり続け、連結成分が
// 90〜110棟に達することを実測で確認した。上限を「実測される最大規模ぎりぎり」
// （例:48）に絞ると、連結成分の一部だけを毎回バラバラに塗り直すことになり、
// 巻き込み漏れ（廃墟の消失）がむしろ増えることも実測で確認済み
// （キャップ不足の中途半端な打ち切りは、キャップなしより悪化しうる）。
// 1棟あたりの実描画コストは実測で約0.15〜0.3ms程度と軽いため、
// 実測上限90〜110棟を大きく超える150を安全弁として設定し、
// 通常のゲームプレイでは常に連結成分全体をカバーして廃墟の消失を防ぐ。
// この上限はあくまで「万一さらに稠密なマップが将来追加された場合」の
// 処理コスト暴走を防ぐ保険であり、実測される密度では発動しない。
const CLUSTER_REPAINT_CAP = 150;

/**
 * originIdx の建物から出発し、クリア矩形が連鎖的に重なり合う建物を
 * 幅優先探索（FIFO）で近い順に集める（A⊃B, B⊃C なら A,B,C 全部）。
 * CLUSTER_REPAINT_CAP 件に達したら打ち切る（起点から遠い分だけが漏れる）。
 *
 * 経緯: 1ホップ隣接（自分と直接重なる相手だけ）を復元する方式では、密集地で
 * 3棟以上が数珠つなぎに重なっている場合に対応できなかった
 * （A死亡→A,B,Cを直す→次にB'死亡→BとC'は直るがCから見て初めて重なるDは
 * 直らない、という取りこぼしが実測で確認された）。
 * 円距離での重なり判定は正方形どうしの重なりを見落とす場合があるため
 * （対角方向のオフセットでは実際は重なっているのに距離判定だと重ならないと
 * 誤判定しうる）、軸並行の矩形同士の重なり判定（AABB）に修正している。
 */
function collectOverlappingCluster(originIdx) {
  const visited = new Set([originIdx]);
  _clusterQueue.length = 0;
  _clusterQueue.push(originIdx);
  let head = 0; // FIFO: shift()のO(n)コストを避けるためインデックスで進める

  while (head < _clusterQueue.length && visited.size < CLUSTER_REPAINT_CAP) {
    const curIdx = _clusterQueue[head++];
    const cur = settlements[curIdx];
    const curPad = settlementLayerPadding(cur);

    buildingGridQuery(cur.wx, cur.wy, _clusterQueryBuf);
    for (const nIdx of _clusterQueryBuf) {
      if (visited.size >= CLUSTER_REPAINT_CAP) break;
      if (visited.has(nIdx)) continue;
      const n = settlements[nIdx];
      if (!n) continue;
      const nPad = settlementLayerPadding(n);
      // AABB重なり判定（軸ごとに独立。円距離判定より正確）
      if (Math.abs(n.wx - cur.wx) > curPad + nPad) continue;
      if (Math.abs(n.wy - cur.wy) > curPad + nPad) continue;
      visited.add(nIdx);
      _clusterQueue.push(nIdx);
    }
  }

  const result = [];
  for (const idx of visited) result.push(settlements[idx]);
  return result;
}
