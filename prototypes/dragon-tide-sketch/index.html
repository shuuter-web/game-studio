// 分離方式の属性を別の属性の画像で描く場合の対応。
// v0.36.2: 緋竜に専用アセットができたので空になった（以前は火竜の絵を赤ティントして流用）。
// 新竜種の絵が用意できるまで既存の絵で仮に出したいときに使える。
const DRAGON_PARTS_ALIAS = {};
/** 属性 element を描くのに使うパーツ定義のキー（無ければ null）。 */
function dragonPartsKey(element) {
  const key = DRAGON_PARTS_ALIAS[element] ?? element;
  return DRAGON_PART_SPRITES[key] ? key : null;
}

// 胴体・翼の描画サイズの決め方（火竜で実測した基準値。他の竜種も概ねこの範囲に収める）:
// 両翼を広げた全体の見た目が旧一体画像版（DRAGON_TARGET_WINGSPAN=40相当）と
// 大きく違わないよう、胴体高さ27・翼幅26に調整してある。

// ロード済みの Image オブジェクト（element名 → HTMLImageElement）。一体画像方式用。
const dragonImages = makeSketchDict("colored");
// 分離方式のロード済み画像（element名 → { body, wing }）
const dragonPartImages = makeNestedSketchDict("colored");
// ロードに成功したかどうか（失敗時はベクター描画へフォールバック）
let dragonImagesLoaded = false;

/**
 * 竜のラスター画像を全属性分プリロードする（ice/shadowの単一画像 + fireのbody/wing分離画像）。
 * @returns {Promise<void>} 全画像のロードが完了（または失敗確定）したら解決
 */
function preloadDragonImages() {
  const loadOne = (src, onSuccess) => new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      onSuccess(img);
      resolve(true);
    };
    img.onerror = () => {
      console.error(`[DragonTide] 竜画像のロードに失敗しました: ${src}`);
      resolve(false);
    };
    img.src = src;
  });

  const tasks = [
    ...Object.keys(DRAGON_IMAGE_SOURCES).map((element) =>
      loadOne(DRAGON_IMAGE_SOURCES[element], (img) => { dragonImages[element] = img; })),
    // 分離方式の竜種ぶん（body/wing の2枚ずつ）
    ...Object.keys(DRAGON_PART_SPRITES).flatMap((el) => {
      dragonPartImages[el] = dragonPartImages[el] || {};
      // v0.46: 翼を持たない竜種（UFO）は wing を宣言していないので body だけ読む
      return ["body", "wing", "bodyAir"]
        .filter((part) => DRAGON_PART_SPRITES[el][part])
        .map((part) =>
          loadOne(DRAGON_PART_SPRITES[el][part], (img) => { dragonPartImages[el][part] = img; }));
    }),
  ];

  // v0.7: 敵スプライトも並行ロード。失敗しても全体を失敗扱いにしない
  // （enemyImages に入らなかった敵だけベクター描画へ個別フォールバック）。
  const enemyTasks = Object.keys(ENEMY_IMAGE_SOURCES).map((name) =>
    loadOne(ENEMY_IMAGE_SOURCES[name], (img) => { enemyImages[name] = img; }));

  // v0.9: 建物スプライト＋地面タイル（失敗した分だけベクター/単色にフォールバック）
  const buildingTasks = Object.keys(BUILDING_IMAGE_SOURCES).map((size) =>
    loadOne(BUILDING_IMAGE_SOURCES[size], (img) => { buildingImages[size] = img; }));
  const groundTask = loadOne(GROUND_TILE_SOURCE, (img) => { groundTileImage = img; });

  // v0.17: 地形・自然物スプライト（岩・湖・畑・森）
  const terrainTasks = Object.keys(TERRAIN_IMAGE_SOURCES).map((name) =>
    loadOne(TERRAIN_IMAGE_SOURCES[name], (img) => { terrainImages[name] = img; }));

  return Promise.all([...tasks, ...enemyTasks, ...buildingTasks, groundTask, ...terrainTasks]).then(() => {
    prebakeSketches();   // 手描き版: 空き時間に先回りで焼く（初登場時の引っかかり回避）
    // dragonImagesLoaded は竜画像のみで判定（敵画像の失敗と切り離す）
    // v0.35.2: 竜画像が「1枚も欠けていない」かの目安。実際の描画方式は
    // renderDragonFrame が属性ごとに判定するので、ここが false でも
    // 揃っている竜種はラスターで描かれる（欠けた竜種だけベクターに落ちる）。
    dragonImagesLoaded =
      Object.keys(DRAGON_IMAGE_SOURCES).every((element) => dragonImages[element]) &&
      Object.keys(DRAGON_PART_SPRITES).every((el) =>
        dragonPartImages[el] && dragonPartImages[el].body &&
        (!DRAGON_PART_SPRITES[el].wing || dragonPartImages[el].wing));
    if (!dragonImagesLoaded) {
      console.error("[DragonTide] 一部の竜画像が読み込めなかったため、ベクター描画にフォールバックします。");
    }
  });
}

// 個体ごとの羽ばたき位相オフセット（index で決定的に割り当て）
// 0〜1 の値 × 2π がラジアン位相
const BOID_FLAP_PHASE = new Float32Array(MAX_BOIDS); // MAX_BOIDS=100
for (let i = 0; i < MAX_BOIDS; i++) {
  // 黄金角分割でなるべく均等に散らす
  BOID_FLAP_PHASE[i] = (i * 0.618033988) % 1.0;
}

// -----------------------------------------------------------------
// 尻尾：動的描画パラメータ
// -----------------------------------------------------------------
// 各boidの過去の進行角度を保持するリングバッファ
// TAIL_SEGS セグメント分の角度を記録し、旋回に追従した「鞭のしなり」を実現する。
// MAX_BOIDS=20、TAIL_SEGS=5 → 100要素のFloat32Array（≈400Bytes）
const TAIL_SEGS     = 5;    // 尻尾セグメント数（多いほど滑らかだがコスト増）
const TAIL_SEG_LEN  = 4.5;  // 1セグメントの長さ（論理px）
const TAIL_WIDTH0   = 2.2;  // 根元の線幅（px）
const TAIL_WOBBLE   = 0.07; // 時間ベースの微小揺れ振幅（ラジアン）。過剰にならない値
// 尻尾は「緩和チェーン」で柔らかく追従させる。各フレーム、先頭は現在の進行方向へ、
// 後続セグメントは1つ前のセグメントへ、指数平滑で少しずつ寄っていく（バネ/鞭のしなり）。
// 係数が小さいほど遅れて柔らかくしなる。生の履歴をそのまま使うとカクつくため平滑化する。
const TAIL_EASE_HEAD = 0.18; // 先頭セグメントが現在の進行方向へ寄る速さ
const TAIL_EASE_SEG  = 0.16; // 後続セグメントが前セグメントへ寄る速さ
// boidAngleHistory[i * TAIL_SEGS + s] = 平滑化された各セグメントの向き
// s=0 が先頭（頭に近い）、s=TAIL_SEGS-1 が尾の先端
let boidAngleHistory; // initBoids() で確保

// 角度を最短回り（±π境界をまたがない）で target へ k だけ寄せる
function easeAngle(cur, target, k) {
  let d = target - cur;
  while (d >  Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return cur + d * k;
}

/**
 * 胴体（固定サイズ）+ 翼（左右、flapFactorで羽ばたき）を合成描画する（カテゴリA）。
 * 胴体まで一緒に伸縮すると「蝶々がペラペラ開閉している」ように見えてしまうため、
 * 胴体は常に固定サイズで描き、羽ばたきのscaleは翼にのみ適用する。
 * v0.35.2: fire専用から DRAGON_PART_SPRITES 駆動へ一般化（竜種を増やしても共通で使える）。
 * @param {string} partsKey  DRAGON_PART_SPRITES のキー
 * @param {number} flapFactor  翼スパン軸の縮小係数（常に正、0.13〜1.0）
 * @param {CanvasRenderingContext2D} c
 */
function drawPartSeparatedDragon(partsKey, flapFactor, c, variant) {
  const spec    = DRAGON_PART_SPRITES[partsKey];
  const imgs    = dragonPartImages[partsKey];
  // v0.47.1: 跳躍ポーズ（後脚を伸ばした胴体）。持っていない竜種は通常の胴体のまま。
  const useAir  = variant === "air" && !!(spec.bodyAir && imgs.bodyAir);
  const bodyImg = useAir ? imgs.bodyAir : imgs.body;
  const wingImg = imgs.wing;

  const bodyPivot = useAir ? spec.bodyAirPivot : spec.bodyPivot;
  const bodyDrawH = spec.bodyDrawH;
  const bodyDrawW = bodyDrawH * (bodyImg.naturalWidth / bodyImg.naturalHeight);
  // 胴体の論理スケール（元画像px → 描画px）。肩オフセットの換算にも使う。
  const kxBody = bodyDrawW / bodyPivot.w;
  const kyBody = bodyDrawH / bodyPivot.h;
  const bodyPivotX = bodyPivot.cx * kxBody;
  const bodyPivotY = bodyPivot.cy * kyBody;

  // v0.46: 翼を持たない竜種（カテゴリD＝UFOの円盤）は wing を宣言しない。
  // その場合は胴体だけを描いて終わる。
  const hasWing = !!(wingImg && spec.wing && spec.wingAnchor);
  const wingDrawW = hasWing ? spec.wingDrawW : 0;
  const wingDrawH = hasWing ? wingDrawW * (wingImg.naturalHeight / wingImg.naturalWidth) : 0;
  const wingRootX = hasWing ? spec.wingAnchor.x * (wingDrawW / wingImg.naturalWidth) : 0;
  const wingRootY = hasWing ? spec.wingAnchor.y * (wingDrawH / wingImg.naturalHeight) : 0;

  // 肩の元画像座標を、胴体ピボットと同じ回転後ローカル座標系に変換する。
  // （回転後の座標系では「前後方向」がlocalX、「左右方向」がlocalYになる。
  //  導出はTDD参照。preview_evalで実測検証済み。）
  function shoulderLocal(rawX, rawY) {
    const localY = kxBody * (rawX - bodyPivot.cx);
    const localX = -kyBody * (rawY - bodyPivot.cy);
    return { localX, localY };
  }
  const leftShoulder  = hasWing ? shoulderLocal(spec.shoulder.left.x,  spec.shoulder.left.y)  : null;
  const rightShoulder = hasWing ? shoulderLocal(spec.shoulder.right.x, spec.shoulder.right.y) : null;

  // v0.36: **翼を先に描いて胴体を上に重ねる**。
  // 逆順（胴体が下）だと翼の肩側の膜が背中を覆ってしまい、
  // 竜のシルエットが読めなくなる（ユーザー指摘の「翼の位置がよくない」の一因）。

  // ---- 左翼: 肩に付け根(root)を合わせ、翼のスパン軸（画像ローカルX）にのみflapFactorを適用 ----
  if (hasWing) {
  c.save();
  c.translate(leftShoulder.localY, -leftShoulder.localX);
  c.scale(flapFactor, 1);
  c.drawImage(wingImg, -wingRootX, -wingRootY, wingDrawW, wingDrawH);
  c.restore();

  // ---- 右翼: 左翼と左右対称の同一画像を水平反転して使う ----
  c.save();
  c.translate(rightShoulder.localY, -rightShoulder.localX);
  c.scale(-flapFactor, 1);
  c.drawImage(wingImg, -wingRootX, -wingRootY, wingDrawW, wingDrawH);
  c.restore();
  }

  // ---- 胴体（固定サイズ・flapFactorのscaleを適用しない）: 翼の上に重ねる ----
  c.drawImage(bodyImg, -bodyPivotX, -bodyPivotY, bodyDrawW, bodyDrawH);
}

/**
 * 竜シルエットを1フレーム分オフスクリーンcanvasに描画して返す。
 * ラスター画像（assets/dragon_*.png）が読み込めている場合はそれを使い、
 * 失敗している場合のみ旧ベクター描画（renderDragonFrameVector）へフォールバックする。
 * 分離方式（drawPartSeparatedDragon）が使えるのは DRAGON_PART_SPRITES 登録済みの竜種。それ以外は従来の
 * 一体画像＋whole-image scale方式のまま変更しない。
 * @param {string} element  "fire" | "ice" | "shadow"
 * @param {number} wingAngle  翼の上下角度（ラジアン）。0=水平、+はたたんだ方向
 * @param {number} spritePx  canvas物理解像度（= 論理サイズ × DPR）
 * @returns {HTMLCanvasElement}
 */
function renderDragonFrame(element, wingAngle, spritePx, variant) {

  // v0.35.2: 描画方式は**属性ごとに**決める（従来はグローバルな dragonImagesLoaded で
  // 全属性まとめて判定していたため、1枚欠けると全竜種がベクターに落ちていた）。
  //   1) 分離方式（DRAGON_PART_SPRITES に登録があり画像も揃っている）
  //   2) 一体画像方式（dragonImages に画像がある）
  //   3) ベクター描画（どちらも無い＝新竜種の暫定表示）
  const partsKey  = dragonPartsKey(element);
  const partImgs  = partsKey ? dragonPartImages[partsKey] : null;
  const usesParts = !!(partImgs && partImgs.body &&
                       (!DRAGON_PART_SPRITES[partsKey].wing || partImgs.wing));
  const wholeImg  = dragonImages[element];
  if (!usesParts && !wholeImg) {
    return renderDragonFrameVector(element, wingAngle, spritePx);
  }

  const oc = document.createElement("canvas");
  oc.width  = spritePx;
  oc.height = spritePx;
  const c = oc.getContext("2d");

  const half  = spritePx / 2;
  // 論理サイズ→物理ピクセルへのスケール
  const scale = spritePx / DRAGON_SPRITE_LOGICAL;

  // wingAngle（0=水平最大展開 〜 π*0.65=最大羽ばたみ）から羽ばたき係数を算出。
  // 常に正の値（0.13〜1.0）になるため、羽ばたんでも潰れて反転することはない。
  const flapFactor = 0.4 + 0.6 * Math.cos(wingAngle);

  c.save();
  c.translate(half, half);
  c.scale(scale, scale);
  // 画像は「鼻先が画像の上方向（-Y）」を向いているため、まず+X（ゲーム内の進行方向規約）へ回頭する。
  c.rotate(Math.PI / 2);

  if (usesParts) {
    // 分離方式: 胴体固定 + 翼のみ羽ばたき（胴体まで伸縮する「蝶々開閉」を防ぐため）
    drawPartSeparatedDragon(partsKey, flapFactor, c, variant);
  } else {
    // 一体画像方式（旧）: 全身画像に flapFactor の scale をまとめて適用する。
    // **胴体まで横に伸縮する**ので、分離方式へ移行できた竜種は上の分岐に載せる。
    // 翼スパン（画像の横幅）を DRAGON_TARGET_WINGSPAN 論理pxに正規化し、
    // 縦は元画像のアスペクト比を保って算出する（属性ごとに縦が異なる＝仕様）。
    const img   = wholeImg;
    const drawW = DRAGON_TARGET_WINGSPAN;
    const drawH = DRAGON_TARGET_WINGSPAN * (img.naturalHeight / img.naturalWidth);

    // 画像中心(w/2,h/2)は視覚的重心と一致しないため、質量重心(DRAGON_SPRITE_PIVOTS)を
    // 描画原点に使う。drawW/drawHへの縮小スケールと同じ比率で重心座標も換算する。
    const pivot = DRAGON_SPRITE_PIVOTS[element] ?? DRAGON_SPRITE_PIVOTS.ice;
    const pivotScaleX = drawW / pivot.w;
    const pivotScaleY = drawH / pivot.h;
    const pivotX = pivot.cx * pivotScaleX;
    const pivotY = pivot.cy * pivotScaleY;

    // 画像自身のX軸（翼スパン方向）をflapFactorで縮小してから描画する
    // （rotateは既に上で適用済み。逆順だと翼スパン軸がずれる）。
    c.scale(flapFactor, 1);
    c.drawImage(img, -pivotX, -pivotY, drawW, drawH);
  }

  c.restore();

  // v0.36.2: 緋竜は専用アセットになったので赤ティント合成は不要（元絵が既に緋色）。

  return oc;
}

/**
 * 竜シルエットのベクター描画版（旧実装）。
 * ラスター画像のロードに失敗した場合のフォールバックとして残す。
 * @param {string} element  "fire" | "ice" | "shadow"
 * @param {number} wingAngle  翼の上下角度（ラジアン）。0=水平、+はたたんだ方向
 * @param {number} spritePx  canvas物理解像度（= 論理サイズ × DPR）
 * @returns {HTMLCanvasElement}
 */
function renderDragonFrameVector(element, wingAngle, spritePx) {
  const oc = document.createElement("canvas");
  oc.width  = spritePx;
  oc.height = spritePx;
  const c = oc.getContext("2d");

  const palette = DRAGON_ELEMENT_COLORS[element] ?? DRAGON_ELEMENT_COLORS.fire;
  const half    = spritePx / 2;
  // 論理サイズ→物理ピクセルへのスケール
  const scale   = spritePx / DRAGON_SPRITE_LOGICAL;

  c.save();
  c.translate(half, half);
  c.scale(scale, scale);

  // --- 全体を半透明に --- globalAlpha でなく fillStyle/strokeStyle に埋め込む
  // 死亡フェードは drawBoids 側で globalAlpha を設定するためここでは 1.0 で焼く

  // ---- 翼（左右対称。wingAngle で上下に開閉） ----
  // 翼の付け根は胴体中央よりやや前 (x=3)。
  // wingAngle が 0 = 水平（最大展開）、π*0.65 に近づく = たたんだ状態。
  const wBase = 3;   // 付け根 x
  const wOpen = 19;  // 水平展開時の Y 振れ幅（翼を大きく＝厚みアップ）
  const yOffset = Math.cos(wingAngle) * wOpen;  // 正=下方向

  // 上翼（sign=+1 で Y が上=負方向）
  drawWing(c, wBase, 0, -yOffset, palette);
  // 下翼（sign=-1 で Y が下=正方向）
  drawWing(c, wBase, 0,  yOffset, palette);

  // ---- 胴体（細長い楕円形、角張り翼に馴染む細身） ----
  // 注意: 尻尾は毎フレーム drawBoids() で動的描画するためここでは焼かない
  // +X が頭方向。胴体は x=-5〜+11 の範囲、中心y=0
  c.beginPath();
  c.ellipse(3, 0, 9, 2.8, 0, 0, Math.PI * 2);
  const bodyGrad = c.createRadialGradient(4, -1, 0.5, 3, 0, 9);
  bodyGrad.addColorStop(0.0, palette.body);
  bodyGrad.addColorStop(1.0, palette.rim);
  c.fillStyle = bodyGrad;
  c.fill();

  // ---- 頭部（+X 方向。細い首 → 菱形ベース → 尖ったマズル） ----
  // 全体が x=10〜16 の範囲に収まる。幅は ±3.5 程度。
  // トップビューの竜頭：後頭部が広く前方に向けて先細りするひし形シルエット。
  // 首（胴体前端 x≈9 から頭の後端 x≈14 まで伸ばす。細長くして首を長く見せる）
  c.beginPath();
  c.moveTo(9.0, -1.9);
  c.lineTo(14.0, -1.5);
  c.lineTo(14.0,  1.5);
  c.lineTo(9.0,  1.9);
  c.closePath();
  c.fillStyle = palette.body;
  c.fill();

  // 頭（首の先 x=14 から前方へ。元より +3 前進させて首を長く見せる）
  c.beginPath();
  // 首の接続点（頭の後端）
  c.moveTo(14,  1.8);   // 右首付け根
  c.lineTo(14, -1.8);   // 左首付け根
  // 後頭部の広がり（左右に張り出す）
  c.lineTo(15, -3.2);
  // 頭頂（最も広い部分）
  c.lineTo(16, -3.5);
  // こめかみ〜マズルへの先細り
  c.lineTo(18, -1.8);
  // マズル先端（鼻先）
  c.lineTo(19,  0.0);
  c.lineTo(18,  1.8);
  c.lineTo(16,  3.5);
  c.lineTo(15,  3.2);
  c.closePath();
  c.fillStyle = palette.body;
  c.fill();

  // 頭部の輪郭を少し締める（存在感強化）
  c.strokeStyle = palette.wing;
  c.lineWidth   = 0.8;
  c.globalAlpha = 0.7;
  c.stroke();
  c.globalAlpha = 1.0;

  // ---- ツノ（後頭部から後方斜めに伸びる1対） ----
  // +X が進行方向なのでツノは -X 方向（後ろ）に伸びる。
  // 上ツノ（頭の前進に合わせて +3）
  c.beginPath();
  c.moveTo(15, -3.0);   // ツノの付け根（後頭部）
  c.lineTo(12, -6.5);   // ツノの先端（後方かつ外側）
  c.lineTo(14, -3.8);   // ツノの腹側
  c.closePath();
  c.fillStyle = palette.wing;
  c.globalAlpha = 0.85;
  c.fill();
  c.globalAlpha = 1.0;

  // 下ツノ
  c.beginPath();
  c.moveTo(15,  3.0);
  c.lineTo(12,  6.5);
  c.lineTo(14,  3.8);
  c.closePath();
  c.fillStyle = palette.wing;
  c.globalAlpha = 0.85;
  c.fill();
  c.globalAlpha = 1.0;

  c.restore();
  return oc;
}

/**
 * 角張った膜翼を1枚描画するヘルパー。
 * ドラゴンスピリット系のトップビュー飛竜翼を模した lineTo ポリゴン。
 *
 * 翼の構成（全 lineTo：quadraticCurveTo なし）:
 *   付け根(bx,by) → 前縁先端（斜め前＋外側）→ 翼先端（尖り角）
 *   → 後縁スカラップ1 → スカラップ2 → 後縁付け根
 *
 * wingTipY の符号で上翼/下翼を切り替える（上翼は負、下翼は正）。
 *
 * @param {CanvasRenderingContext2D} c
 * @param {number} bx         翼の付け根 x（胴体上の接続点）
 * @param {number} by         翼の付け根 y（通常 0）
 * @param {number} wingTipY   翼先端の Y 座標（wingAngle=0 で ±wOpen、たたむと 0 に近づく）
 * @param {Object} palette
 */
function drawWing(c, bx, _by, wingTipY, palette) {
  // sign: +1=下翼（Y正）、-1=上翼（Y負）
  const sign = wingTipY >= 0 ? 1 : -1;
  // 翼の絶対Y振れ（0〜wOpen）
  const yAbs = Math.abs(wingTipY);

  // ---------------------------------------------------------------
  // トップビュー飛竜翼の頂点レイアウト（+X=頭方向）
  //
  //  胴体方向(+X) ←→ 尾方向(-X)
  //
  //  frontRoot ─── lead              ← 前縁（シャープな直線エッジ）
  //      |                    \
  //    rearRoot        tip(翼先端・最外縁)
  //      ↑   \              /
  //   後縁付け根  sc1Out ── sc1In     ← スカラップ（指の骨）
  //              sc2Out ── sc2In
  //
  // 前縁は「前肩(lead)が胴体よりも前(+X)に出る」ことで
  // 矢じり形の後退翼シルエットを作る。
  // ---------------------------------------------------------------

  // 前縁の付け根（胴体の前寄りに接続）— 根元を厚めに
  const frontRootX = bx + 4;
  const frontRootY = sign * 1.7;

  // 前縁の「肩」: 胴体よりさらに前(+X)に張り出し、外側(Y)にも出る
  // ここが前縁の最も前方の点 → 直線エッジの鋭角感を作る。肩を高くして前縁を肉厚に
  const leadX = bx + 7;
  const leadY = sign * (yAbs * 0.60);

  // 翼先端（最も外側・後退角で後方へ。さらに後ろへ引いて翼を大きく＝厚みアップ）
  const tipX = bx - 7;
  const tipY = sign * yAbs;

  // 後縁スカラップ1: 翼先端から後縁を辿る最初の「指の骨」突起
  // 谷(InY)を浅くして膜を肉厚に見せる
  const sc1OutX = bx - 2;
  const sc1OutY = sign * (yAbs * 0.84);
  const sc1InX  = bx + 1.5;
  const sc1InY  = sign * (yAbs * 0.66);

  // 後縁スカラップ2: 中間の突起（谷を浅く）
  const sc2OutX = bx + 4;
  const sc2OutY = sign * (yAbs * 0.50);
  const sc2InX  = bx + 6;
  const sc2InY  = sign * (yAbs * 0.34);

  // 後縁の付け根（胴体の後方寄りに接続。後方へ引いてコード＝前後幅を増やす）
  const rearRootX = bx - 4;
  const rearRootY = sign * 1.9;

  // ----- パス描画（全 lineTo：曲線なし） -----
  c.beginPath();
  c.moveTo(frontRootX, frontRootY);  // 前縁付け根
  c.lineTo(leadX,      leadY);       // 前縁の肩（前方に突き出る）
  c.lineTo(tipX,       tipY);        // 翼先端（尖り角）
  c.lineTo(sc1OutX,    sc1OutY);     // スカラップ1 突起
  c.lineTo(sc1InX,     sc1InY);      // スカラップ1 谷
  c.lineTo(sc2OutX,    sc2OutY);     // スカラップ2 突起
  c.lineTo(sc2InX,     sc2InY);      // スカラップ2 谷
  c.lineTo(rearRootX,  rearRootY);   // 後縁付け根
  c.closePath();

  // グラデーション: 付け根 body色 → 先端 rim色（透明）
  const grd = c.createLinearGradient(frontRootX, frontRootY, tipX, tipY);
  grd.addColorStop(0.0,  palette.body);
  grd.addColorStop(0.55, palette.wing);
  grd.addColorStop(1.0,  palette.rim);
  c.fillStyle = grd;
  c.fill();

  // 前縁ライン強調（付け根 → 肩 → 翼先端）: 直線エッジの存在感を出す
  c.beginPath();
  c.moveTo(frontRootX, frontRootY);
  c.lineTo(leadX,      leadY);
  c.lineTo(tipX,       tipY);
  c.strokeStyle = palette.wing;
  c.lineWidth   = 0.9;
  c.globalAlpha = 0.65;
  c.stroke();
  c.globalAlpha = 1.0;
}

/** 1属性ぶんの羽ばたき全コマをプリレンダして返す。 */
function buildElementSprites(element, variant) {
  const spriteDpr = Math.min(window.devicePixelRatio || 1, 2);
  const spritePx  = Math.ceil(DRAGON_SPRITE_LOGICAL * spriteDpr);
  const frames    = [];
  for (let f = 0; f < DRAGON_FLAP_FRAMES; f++) {
    // 羽ばたきの位相: 0〜2π を FLAP_FRAMES 分割
    // wingAngle: 0=水平（最大展開）→ π*0.65 = 約37度折りたたみ
    const phase     = (f / DRAGON_FLAP_FRAMES) * Math.PI * 2;
    const wingAngle = (Math.sin(phase) * 0.5 + 0.5) * (Math.PI * 0.65);
    frames.push(renderDragonFrame(element, wingAngle, spritePx, variant));
  }
  return frames;
}

// -----------------------------------------------------------------
// v0.34: スプライトは「要求時に生成し、複数種を保持できる」キャッシュにする。
// -----------------------------------------------------------------
// 1種あたり 羽ばたき16コマ ≒ 672KB なので、竜種が15種に増えると全種常駐は厳しい。
// かといって「常に1種だけ」を前提にすると、ラン途中で竜種が増えるケース
// （将来の混成群れ・味方の増援など）に対応できない。
// そこで **種IDキーの簡易LRU** にして、上限を超えたら古いものから捨てる。
const spriteCache = new Map();      // speciesId -> フレーム配列
const SPRITE_CACHE_MAX = 3;         // 同時保持数。1固定にはしない（暫定値・実機で調整）

/**
 * 竜種のスプライト列を返す。
 * v0.47.1: variant="air" で「跳躍ポーズ」の列を別に持てる（蛙竜の脚の動き）。
 * キャッシュキーを分けるだけなので、変種を持たない竜種では従来どおり1列しか作られない。
 */
function getSpeciesSprites(speciesId, variant) {
  const cacheKey = variant ? speciesId + ":" + variant : speciesId;
  let frames = spriteCache.get(cacheKey);
  if (frames) {
    // 参照されたら最新に回す（Map は挿入順を保つので削除→再挿入でLRUになる）
    spriteCache.delete(cacheKey);
    spriteCache.set(cacheKey, frames);
    return frames;
  }
  const def = SPECIES_DEFS[speciesId] || SPECIES_DEFS.fire;
  frames = buildElementSprites(def.element, variant);
  spriteCache.set(cacheKey, frames);
  while (spriteCache.size > SPRITE_CACHE_MAX) {
    spriteCache.delete(spriteCache.keys().next().value);   // 最古から破棄
  }
  return frames;
}

/** 起動時は現在の竜種だけ用意する（残りは必要になった時点で生成される）。 */
function createDragonSprites() {
  getSpeciesSprites(flockSpecies);
}

// -----------------------------------------------------------------
// ユーティリティ
// -----------------------------------------------------------------
function shadeColor(hex, amount) {
  // hex は "#rrggbb" 形式
  let num;
  try {
    num = parseInt(hex.replace("#", ""), 16);
  } catch (_) {
    return hex;
  }
  const r = Math.min(255, Math.max(0, (num >> 16) + amount));
  const g = Math.min(255, Math.max(0, ((num >> 8) & 0xff) + amount));
  const b = Math.min(255, Math.max(0, (num & 0xff) + amount));
  return `rgb(${r},${g},${b})`;
}

// -----------------------------------------------------------------
// ゲームループ（setInterval固定16ms）
// -----------------------------------------------------------------
let lastTickTs = performance.now();

function tick() {
  const now  = performance.now();
  let dtMs   = now - lastTickTs;
  if (dtMs > BASE_CFG.maxDtMs) dtMs = BASE_CFG.maxDtMs;
  lastTickTs = now;
  const dt   = dtMs / 1000;

  if (gameState === "playing") {
    // v0.6.1: カード表示中はスローモー（時間停止は廃止）。
    // timeScale はイージングで目標値に寄せ、急停止・急再開のカクつきを防ぐ。
    // v0.51: 時代遷移も同じスローモー枠を使う（プレイは止めない。
    // ラン中に3回起きるので、止めるとテンポを殺すため）。
    const cardSlowmo = upgradeCardsVisible && slowmoTimer > 0;
    const eraSlowmo  = tierSlowmoTimer > 0;
    const targetScale = (cardSlowmo || eraSlowmo) ? SLOWMO_SCALE : 1;
    timeScale += (targetScale - timeScale) * Math.min(1, dt * SLOWMO_EASE);
    if (cardSlowmo) slowmoTimer -= dt;                 // 実時間で減衰
    if (eraSlowmo)  tierSlowmoTimer = Math.max(0, tierSlowmoTimer - dt);
    const wdt = dt * timeScale;

    simStep(wdt);
    applyObstaclePushout();       // v0.6-p3: 城壁・地形の侵入不可
    updateCamera(wdt);
    updateSettlementAttacks(wdt);
    updateProjectiles(wdt);
    updateWeaponAttacks(wdt);     // v0.6-p2: 武器ディスパッチ（BEAM/BULLET/MISSILE）
    updateCollisionAttacks(wdt);  // 変更2: 直接衝突ダメージ＋ヒットストップ（MELEEは威力増）
    updateMovers(wdt);            // v0.6-p4: 移動敵の巡回・攻撃
    updateHazards(wdt);           // v0.42: 持続する範囲攻撃（敵・建物が置く危険地帯）
    updateHazardShots(wdt);       // v0.63: 危険地帯の見せ弾（当たり判定なし）
    updateFlood(wdt);             // v0.43: 決壊した堰の洪水（下流の建物を順に沈める）
    updateChainFx(wdt);           // v0.43: 連鎖電撃のFX
    updateMoverRams();            // v0.6-p4: 移動敵への体当たり
    updateBossNova(wdt);          // v0.7: ボスの反発衝撃波
    updateBossArt(wdt);           // v0.57: 首都の大技（文明ごとに技が変わる・予兆つき）
    updateLaserStrikes(wdt);
    updateBarrageQueue(wdt);      // v0.57: 時間差の斉射（矢の雨・絨毯爆撃・対空弾幕）
    updateRaiderSpawns(wdt);      // v0.8: 建物枯渇時のレイダー湧き（詰み防止）
    updateBossReinforcements(wdt); // v0.58: 首都が兵を出し続ける（取り巻きを倒しても消化試合にしない）
    updateEnemyRush(wdt);         // v0.29: 群れ30体以上で定期ラッシュ（ヴァンサバ的）
    updateDeathTimers(wdt);
    updateParticles(wdt);
    updateAppearEffects(wdt);     // 変更2: 竜出現エフェクト更新
    updateDownEffects(wdt);       // 変更2(追加): 竜やられエフェクト更新
    collectNearbyEggs();
    updateXpGems(wdt);            // v0.6: XPジェムの飛散・吸引・回収
    updateSlashFx(wdt);           // v0.8: 緋竜の斬閃FX
    updateFires(wdt);             // v0.10: 燃える建物の火の粉・煙柱
    maybeShowLevelUp();           // v0.6: レベルアップが積まれていれば3択を出す（非モーダル）
  } else if (gameState === "title") {
    // v0.6: タイトル画面ではアイドル旋回する群れを背景として見せる
    simStep(dt);
    updateCamera(dt);
    updateParticles(dt);
  } else if (gameState === "stage-clear") {
    simStep(dt);
    updateHazards(dt);            // v0.42: クリア演出中も燃え尽きさせる（画面に焼き付いたまま残さない）
    applyObstaclePushout();
    updateCamera(dt);
    updateParticles(dt);
    updateAppearEffects(dt);
    updateDownEffects(dt);
    updateXpGems(dt);             // v0.6: ボスのXPジェムをクリア演出中に吸収させる
    updateFires(dt);              // v0.10: クリア演出中も街は燃え続ける
    // （撤去済み: 時代遷移は "playing" のまま進む）
  } else if (gameState === "all-clear") {
    simStep(dt);
    updateCamera(dt);
  }

  if (flashTimer > 0) flashTimer = Math.max(0, flashTimer - dt);
  if (shakeTimer > 0) shakeTimer = Math.max(0, shakeTimer - dt);

  render(now);
  drawMinimap();
  updateHUD();
  tickFps(now);
}

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) lastTickTs = performance.now();
});

// -----------------------------------------------------------------
// 起動
// -----------------------------------------------------------------
async function boot() {
  resize();
  // 竜のラスター画像を先にロードしてから竜スプライトをプリレンダする。
  // ロードが完了する前に createDragonSprites を呼ぶと画像が未定義のまま焼き込まれる
  // （renderDragonFrame内でロード未完了と判定されベクター描画にフォールバックしてしまう）ため、
  // 必ずこの await の後で呼ぶこと。ロード失敗時も preloadDragonImages 内で
  // dragonImagesLoaded=false が設定され、renderDragonFrame が自動でベクター描画に切り替わる。
  await preloadDragonImages();
  // v0.12: ボス城塞をリング層に分解（画像ロード完了後に一度だけ。失敗時は一枚絵のまま）
  buildBossRingLayers();
  // 竜スプライトを起動時に一度だけプリレンダする（DPR確定後・画像ロード完了後に呼ぶこと）
  createDragonSprites();
  createBuildingLayer();
  settlements = generateStageLayout(0);
  rebuildBuildingGrid();
  rebuildGroundLayer();   // v0.11.3: 地面レイヤーの初回生成
  rebuildBuildingLayer();
  cacheBossIndex();
  beginTier(0);   // v0.56: タイトル背景のワールドも段階0として確定させる
  // 変更1: initBoids で配列を確保してから resetBoidsForStageStart で初期状態を作る。
  // initBoids は配列アロケーションのみ担い、resetBoidsForStageStart が
  // boot/restart/advanceToNextStage の共通初期化パスになる。
  initBoids();
  resetBoidsForStageStart();
  resetLeader();
  resetProgression();
  updateHUDStage();
  updateHUDBuildings();
  // v0.6: タイトル画面から開始（背景でアイドル旋回する群れが見える）
  recomputePermaBuff();   // v0.20: 保存済みツリーから永続バフを反映
  refreshTitleBest();
  refreshTitleMenu();
  titleOverlayEl.classList.add("visible");
  setInterval(tick, BASE_CFG.fixedStepMs);
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", boot);
} else {
  boot();
}
</script>
