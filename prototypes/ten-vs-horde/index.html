<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>十人と百鬼 — スキルラボ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0a0c14; color: #e8ecf4;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    touch-action: none; user-select: none;
  }
  #stage { position: fixed; top: 0; left: 0; display: block; }

  #hud {
    position: fixed; top: 0; left: 0; right: 0; padding: 6px 10px; z-index: 10;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
    font-size: 12px; pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,0.85);
  }
  #hud .right { text-align: right; color: rgba(230,238,255,0.6); font-size: 11px; line-height: 1.45; }

  #impact {
    position: fixed; left: 0; right: 0; top: 20%; text-align: center;
    pointer-events: none; z-index: 12; font-weight: 800; font-size: 60px;
    color: #fff; text-shadow: 0 0 24px rgba(120,200,255,0.9), 0 4px 12px rgba(0,0,0,0.6);
    opacity: 0;
  }
  #impact .label { display: block; font-size: 13px; font-weight: 600; letter-spacing: 0.3em; opacity: 0.7; }
  #impact.show { animation: pop 0.8s cubic-bezier(0.16,1,0.3,1) forwards; }
  @keyframes pop {
    0% { opacity: 0; transform: scale(0.6); }
    18% { opacity: 1; transform: scale(1.12); }
    45% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(1) translateY(-24px); }
  }

  #panel {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 14;
    background: rgba(8,11,20,0.96); border-top: 1px solid rgba(255,255,255,0.09);
    padding: 4px 5px calc(4px + env(safe-area-inset-bottom));
  }
  #controls { display: flex; gap: 4px; align-items: center; margin-bottom: 4px; }
  #controls button, #tabs button {
    border: none; border-radius: 7px; background: #202a3d; color: #cdd8ea;
    font-size: 10px; padding: 5px 7px; font-weight: 600; white-space: nowrap;
  }
  #controls button.on, #tabs button.on { background: #3f6fd8; color: #fff; }
  #controls .spacer { flex: 1; }
  #tabs { display: flex; gap: 3px; margin-bottom: 4px; overflow-x: auto; }
  #skills { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .skill {
    position: relative; border: none; border-radius: 9px; padding: 6px 2px 5px;
    background: #1b2334; display: flex; flex-direction: column;
    align-items: center; gap: 1px; box-shadow: 0 0 0 1.5px currentColor inset;
  }
  .skill:active { transform: scale(0.94); }
  .skill .glyph { font-size: 19px; font-weight: 800; line-height: 1.05; }
  .skill .name  { font-size: 8.5px; opacity: 0.85; letter-spacing: 0.04em; color: #e8ecf4; }
  .skill .num   { font-size: 8.5px; opacity: 0.55; color: #e8ecf4; }

  #toast {
    position: fixed; left: 8px; right: 8px; z-index: 15; padding: 6px 9px;
    border-radius: 9px; pointer-events: none; background: rgba(10,14,24,0.92);
    border: 1px solid rgba(255,255,255,0.1); font-size: 11.5px; line-height: 1.45; opacity: 0;
  }
  #toast.show { animation: fade 3s ease forwards; }
  @keyframes fade {
    0% { opacity: 0; transform: translateY(5px); }
    7% { opacity: 1; transform: translateY(0); }
    80% { opacity: 1; }
    100% { opacity: 0; }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="hud">
  <span id="hud-left">敵 0</span>
  <span class="right" id="hud-right"></span>
</div>
<div id="impact"><span class="label">IMPACT</span><span id="impact-num">0</span></div>
<div id="toast"></div>
<div id="panel">
  <div id="controls"></div>
  <div id="tabs"></div>
  <div id="skills"></div>
</div>

<script>
"use strict";

// =================================================================
// 十人と百鬼 — スキルラボ（v0.8.0）
//
// 目的が変わった。ここは「ゲーム」ではなく撃ち味の比較台。
//   - 最終的に10個を選ぶために、候補を30個用意して撃ち比べる
//   - 「気持ちよさ」は機械では測れない。機械がやるのは
//     「同じ盤面を何度でも再現して条件を揃えること」だけ
//   - 敗北・城・ウェーブ・クールダウンは全て撤去した（撃ち味以外の変数を消すため）
//
// 同じシード＋同じ密度で盤面を作り直せるので、A案とB案を
// まったく同じ状況に対して撃って比べられる。決定性RNGの主目的はこれ。
// =================================================================

const GAME_VERSION = "v0.8.0";

// -----------------------------------------------------------------
// 決定性RNG（ロジック用 random / 演出用 fxRandom）
// 素の Math.random() の直接呼び出しは禁止（tools/check.mjs が検出）。 allow-math-random
// -----------------------------------------------------------------
function makeRandomGenerator(seedValue) {   // mulberry32
  let state = seedValue >>> 0;
  return function nextRandom() {
    state = (state + 0x6D2B79F5) >>> 0;
    let t = state;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let nextLogicRandom = null, nextFxRandom = null, currentSeed = 0;
function reseedRandom(seedValue) {
  currentSeed = seedValue >>> 0;
  nextLogicRandom = makeRandomGenerator(currentSeed);
  nextFxRandom    = makeRandomGenerator((currentSeed ^ 0x9E3779B9) >>> 0);
  return currentSeed;
}
function random()   { return nextLogicRandom(); }
function fxRandom() { return nextFxRandom(); }

// =================================================================
// 盤面
// =================================================================
const COLS = 12, ROWS = 22;
const GOAL_ROW = ROWS - 1;            // 敵はここを目指す（到達されても負けない）
const MAX_ENEMIES = 1200;
const ENEMY_HP = 4, ENEMY_SPEED = 1.15;
const SIM_DT = 1 / 60;

const TERRAIN_OPEN = 0, TERRAIN_WALL = 1, TERRAIN_PIT = 2, TERRAIN_SLOW = 3, TERRAIN_BURN = 4;

const DENSITY_PRESETS = { "薄": 70, "中": 180, "密": 380 };

// =================================================================
// ===== SIM ======================================================
// =================================================================
function createState(seedValue) {
  reseedRandom(seedValue);
  const state = {
    seed: seedValue, time: 0, tick: 0, count: 0,
    ex: new Float32Array(MAX_ENEMIES), ey: new Float32Array(MAX_ENEMIES),
    ehp: new Float32Array(MAX_ENEMIES), emax: new Float32Array(MAX_ENEMIES),
    alive: new Uint8Array(MAX_ENEMIES), jit: new Float32Array(MAX_ENEMIES),
    stun: new Float32Array(MAX_ENEMIES), slow: new Float32Array(MAX_ENEMIES),
    rev:  new Float32Array(MAX_ENEMIES), burn: new Float32Array(MAX_ENEMIES),
    pet:  new Float32Array(MAX_ENEMIES), ally: new Uint8Array(MAX_ENEMIES),
    flash: new Float32Array(MAX_ENEMIES),
    terrain: new Uint8Array(COLS * ROWS), terrainTimer: new Float32Array(COLS * ROWS),
    flow: new Int32Array(COLS * ROWS), flowDirty: true,
    buckets: Array.from({ length: COLS * ROWS }, () => []),
    pending: [],
    reached: 0,
  };
  rebuildFlow(state);
  return state;
}

const cellIndex = (col, row) => row * COLS + col;
const inBounds  = (col, row) => col >= 0 && col < COLS && row >= 0 && row < ROWS;

function rebuildFlow(state) {
  const flow = state.flow;
  flow.fill(-1);
  const queue = [];
  for (let col = 0; col < COLS; col++) {
    const index = cellIndex(col, GOAL_ROW);
    const kind = state.terrain[index];
    if (kind !== TERRAIN_WALL && kind !== TERRAIN_PIT) { flow[index] = 0; queue.push(index); }
  }
  let head = 0;
  while (head < queue.length) {
    const index = queue[head++];
    const col = index % COLS, row = (index / COLS) | 0;
    const next = flow[index] + 1;
    for (let d = 0; d < 4; d++) {
      const nc = col + [1, -1, 0, 0][d], nr = row + [0, 0, 1, -1][d];
      if (!inBounds(nc, nr)) continue;
      const ni = cellIndex(nc, nr);
      const kind = state.terrain[ni];
      if (kind === TERRAIN_WALL || kind === TERRAIN_PIT) continue;
      if (flow[ni] !== -1) continue;
      flow[ni] = next; queue.push(ni);
    }
  }
  state.flowDirty = false;
}

function spawnEnemy(state, col, row) {
  if (state.count >= MAX_ENEMIES) return -1;
  let slot = -1;
  for (let i = 0; i < MAX_ENEMIES; i++) if (!state.alive[i]) { slot = i; break; }
  if (slot < 0) return -1;
  state.alive[slot] = 1;
  state.ex[slot] = col + 0.5 + (random() - 0.5) * 0.6;
  state.ey[slot] = row + 0.5 + (random() - 0.5) * 0.6;
  state.ehp[slot] = ENEMY_HP; state.emax[slot] = ENEMY_HP;
  state.jit[slot] = (random() - 0.5) * 0.55;
  state.stun[slot] = state.slow[slot] = state.rev[slot] = 0;
  state.burn[slot] = state.pet[slot] = state.flash[slot] = 0;
  state.ally[slot] = 0;
  state.count++;
  return slot;
}

function rebuildBuckets(state) {
  for (const bucket of state.buckets) bucket.length = 0;
  for (let i = 0; i < MAX_ENEMIES; i++) {
    if (!state.alive[i]) continue;
    const col = Math.min(COLS - 1, Math.max(0, state.ex[i] | 0));
    const row = Math.min(ROWS - 1, Math.max(0, state.ey[i] | 0));
    state.buckets[cellIndex(col, row)].push(i);
  }
}

function enemiesNear(state, x, y, radius) {
  const found = [], r2 = radius * radius;
  const c0 = Math.max(0, Math.floor(x - radius)), c1 = Math.min(COLS - 1, Math.ceil(x + radius));
  const r0 = Math.max(0, Math.floor(y - radius)), r1 = Math.min(ROWS - 1, Math.ceil(y + radius));
  for (let row = r0; row <= r1; row++) for (let col = c0; col <= c1; col++) {
    for (const i of state.buckets[cellIndex(col, row)]) {
      const dx = state.ex[i] - x, dy = state.ey[i] - y;
      if (dx * dx + dy * dy <= r2) found.push(i);
    }
  }
  return found;
}

function aliveList(state) {
  const list = [];
  for (let i = 0; i < MAX_ENEMIES; i++) if (state.alive[i]) list.push(i);
  return list;
}

function densestCell(state, reach) {
  let best = { col: COLS >> 1, row: ROWS >> 1, count: -1 };
  for (let row = 1; row < GOAL_ROW; row++) for (let col = 0; col < COLS; col++) {
    let count = 0;
    for (let dr = -reach; dr <= reach; dr++) {
      const nr = row + dr; if (nr < 0 || nr >= ROWS) continue;
      for (let dc = -reach; dc <= reach; dc++) {
        const nc = col + dc; if (nc < 0 || nc >= COLS) continue;
        count += state.buckets[cellIndex(nc, nr)].length;
      }
    }
    if (count > best.count) best = { col, row, count };
  }
  return best;
}

function frontline(state, limit) {
  const list = aliveList(state);
  list.sort((a, b) => state.ey[b] - state.ey[a]);
  return list.slice(0, limit);
}

function removeEnemy(state, i) {
  if (!state.alive[i]) return false;
  state.alive[i] = 0; state.count--;
  return true;
}

function setTerrain(state, col, row, kind, duration) {
  if (!inBounds(col, row) || row >= GOAL_ROW) return false;
  const index = cellIndex(col, row);
  state.terrain[index] = kind;
  state.terrainTimer[index] = duration;
  state.flowDirty = true;
  return true;
}

function simStep(state) {
  const dt = SIM_DT;
  state.time += dt; state.tick++;

  for (let k = state.pending.length - 1; k >= 0; k--) {
    state.pending[k].t -= dt;
    if (state.pending[k].t <= 0) { const job = state.pending.splice(k, 1)[0]; job.run(state); }
  }

  let expired = false;
  for (let index = 0; index < state.terrain.length; index++) {
    if (state.terrain[index] === TERRAIN_OPEN) continue;
    state.terrainTimer[index] -= dt;
    if (state.terrainTimer[index] <= 0) { state.terrain[index] = TERRAIN_OPEN; expired = true; }
  }
  if (expired || state.flowDirty) rebuildFlow(state);

  rebuildBuckets(state);

  for (let i = 0; i < MAX_ENEMIES; i++) {
    if (!state.alive[i]) continue;
    if (state.flash[i] > 0) state.flash[i] -= dt;

    if (state.burn[i] > 0) {
      state.burn[i] -= dt;
      state.ehp[i] -= 2.2 * dt;
      if (state.ehp[i] <= 0) { removeEnemy(state, i); continue; }
    }
    if (state.stun[i] > 0) { state.stun[i] -= dt; continue; }
    if (state.pet[i]  > 0) { state.pet[i]  -= dt; continue; }
    if (state.slow[i] > 0) state.slow[i] -= dt;
    if (state.rev[i]  > 0) state.rev[i]  -= dt;

    const col = Math.min(COLS - 1, Math.max(0, state.ex[i] | 0));
    const row = Math.min(ROWS - 1, Math.max(0, state.ey[i] | 0));
    const here = cellIndex(col, row);

    if (state.terrain[here] === TERRAIN_PIT)  { removeEnemy(state, i); continue; }
    if (state.terrain[here] === TERRAIN_BURN) {
      state.ehp[i] -= 6 * dt;
      if (state.ehp[i] <= 0) { removeEnemy(state, i); continue; }
    }

    // 寝返った敵は逆走し、ぶつかった敵を削る
    if (state.ally[i]) {
      state.ey[i] -= ENEMY_SPEED * 1.2 * dt;
      for (const j of enemiesNear(state, state.ex[i], state.ey[i], 0.7)) {
        if (j === i || state.ally[j]) continue;
        state.ehp[j] -= 9 * dt;
        if (state.ehp[j] <= 0) removeEnemy(state, j);
      }
      if (state.ey[i] < 0.3) removeEnemy(state, i);
      continue;
    }

    if (row >= GOAL_ROW) { state.reached++; removeEnemy(state, i); continue; }

    const seekFar = state.rev[i] > 0;
    let bestCol = col, bestRow = row;
    let bestDistance = state.flow[here] < 0 ? (seekFar ? -Infinity : Infinity) : state.flow[here];
    for (let d = 0; d < 4; d++) {
      const nc = col + [1, -1, 0, 0][d], nr = row + [0, 0, 1, -1][d];
      if (!inBounds(nc, nr)) continue;
      const nd = state.flow[cellIndex(nc, nr)];
      if (nd < 0) continue;
      if (seekFar ? nd > bestDistance : nd < bestDistance) { bestDistance = nd; bestCol = nc; bestRow = nr; }
    }
    const tx = bestCol + 0.5 + state.jit[i], ty = bestRow + 0.5;
    const dx = tx - state.ex[i], dy = ty - state.ey[i];
    const length = Math.hypot(dx, dy) || 1;
    let speed = ENEMY_SPEED;
    if (state.slow[i] > 0) speed *= 0.35;
    if (state.terrain[here] === TERRAIN_SLOW) speed *= 0.4;
    state.ex[i] += (dx / length) * speed * dt;
    state.ey[i] += (dy / length) * speed * dt;
  }
}

// =================================================================
// ===== スキル候補 30 =============================================
// 系統ごとに「撃ったときの感触」が別物になるように振ってある。
// 最終的にここから10個を選ぶ。run(state, fx) が効果本体。
// =================================================================

function makeEffectContext(state, record) {
  const fx = {
    state,
    mark(i) { record.affected.add(i); state.flash[i] = 0.45; },
    damage(i, amount) {
      state.ehp[i] -= amount; fx.mark(i);
      if (state.ehp[i] <= 0) {
        // 石化中に砕くと周囲を巻き込む（状態＋追撃のコンボ用）
        if (state.pet[i] > 0) {
          for (const j of enemiesNear(state, state.ex[i], state.ey[i], 1.8)) {
            if (j === i) continue;
            state.ehp[j] -= 4; fx.mark(j);
            if (state.ehp[j] <= 0 && removeEnemy(state, j)) record.killed++;
          }
        }
        if (removeEnemy(state, i)) record.killed++;
        return true;
      }
      return false;
    },
    slay(i) { fx.mark(i); if (removeEnemy(state, i)) record.killed++; },
    move(i, dx, dy) {
      state.ex[i] = Math.min(COLS - 0.2, Math.max(0.2, state.ex[i] + dx));
      state.ey[i] = Math.min(ROWS - 0.2, Math.max(0.2, state.ey[i] + dy));
      if (Math.hypot(dx, dy) >= 0.6) fx.mark(i);
    },
    status(i, key, duration) { state[key][i] = Math.max(state[key][i], duration); fx.mark(i); },
    terrain(col, row, kind, duration) { if (setTerrain(state, col, row, kind, duration)) record.cells++; },
    after(delay, run) { state.pending.push({ t: delay, run }); record.delayed = true; },
    near: (x, y, r) => enemiesNear(state, x, y, r),
    all:  () => aliveList(state),
    dense: (reach) => densestCell(state, reach),
    front: (n) => frontline(state, n),
    focus(col, row) { record.focusCol = col; record.focusRow = row; },
    reroute() {
      const key = (i) => state.flow[cellIndex(
        Math.min(COLS - 1, Math.max(0, state.ex[i] | 0)),
        Math.min(ROWS - 1, Math.max(0, state.ey[i] | 0)))];
      const before = aliveList(state).map((i) => [i, key(i)]);
      rebuildFlow(state);
      for (const [i, prev] of before) if (key(i) !== prev) fx.mark(i);
    },
  };
  return fx;
}

const SKILLS = [
  // ---- 瞬間・広範囲（ドカンと消える）----
  { id: "blast", glyph: "爆", name: "爆発", family: "瞬間", desc: "最も密集した場所に大爆発",
    run(s, fx) { const d = fx.dense(3); fx.focus(d.col, d.row);
      for (const i of fx.near(d.col + 0.5, d.row + 0.5, 3.4)) fx.damage(i, 8); } },

  { id: "meteor", glyph: "隕", name: "隕石", family: "瞬間", desc: "3発が時間差で降る。連続で弾ける",
    run(s, fx) { const d = fx.dense(3); fx.focus(d.col, d.row);
      for (let k = 0; k < 3; k++) fx.after(k * 0.35, (st) => {
        rebuildBuckets(st);
        const target = densestCell(st, 3);
        for (const i of enemiesNear(st, target.col + 0.5, target.row + 0.5, 2.8)) {
          st.ehp[i] -= 7; st.flash[i] = 0.45;
          if (st.ehp[i] <= 0) removeEnemy(st, i);
        }
      }); } },

  { id: "cross", glyph: "十", name: "十字", family: "瞬間", desc: "縦一列と横一列を同時に薙ぐ",
    run(s, fx) { const d = fx.dense(2); fx.focus(d.col, d.row);
      for (const i of fx.all()) {
        if (Math.abs(s.ex[i] - (d.col + 0.5)) < 1.1 || Math.abs(s.ey[i] - (d.row + 0.5)) < 1.1) fx.damage(i, 9);
      } } },

  { id: "shock", glyph: "波", name: "衝撃波", family: "瞬間", desc: "手前から扇状に広がり押し返す",
    run(s, fx) { fx.focus(COLS >> 1, GOAL_ROW - 1);
      for (const i of fx.all()) {
        const dist = GOAL_ROW - s.ey[i];
        if (dist > 9) continue;
        fx.move(i, 0, -Math.max(0.8, 3.4 - dist * 0.25));
        fx.damage(i, 3);
      } } },

  { id: "crush", glyph: "圧", name: "圧壊", family: "瞬間", desc: "盤面の上半分をまとめて押し潰す",
    run(s, fx) { fx.focus(COLS >> 1, 5);
      for (const i of fx.all()) if (s.ey[i] < ROWS * 0.5) fx.damage(i, 6); } },

  // ---- 連鎖・伝播（じわっと広がる）----
  { id: "chain", glyph: "雷", name: "連鎖", family: "伝播", desc: "敵づたいに感電。密集ほど伸びる",
    run(s, fx) { const d = fx.dense(2); fx.focus(d.col, d.row);
      const seeds = fx.near(d.col + 0.5, d.row + 0.5, 2.5);
      if (!seeds.length) return;
      const seen = new Set([seeds[0]]); const queue = [seeds[0]];
      while (queue.length && seen.size < 140) {
        const cur = queue.shift();
        fx.damage(cur, 5);
        for (const n of fx.near(s.ex[cur], s.ey[cur], 1.7)) {
          if (!seen.has(n)) { seen.add(n); queue.push(n); if (seen.size >= 140) break; }
        }
      } } },

  { id: "plague", glyph: "疫", name: "疫病", family: "伝播", desc: "隣へ移りながら広がり続ける",
    run(s, fx) { const d = fx.dense(2); fx.focus(d.col, d.row);
      for (const i of fx.near(d.col + 0.5, d.row + 0.5, 2.2)) fx.status(i, "burn", 3.0);
      const spread = (st, depth) => {
        if (depth > 5) return;
        rebuildBuckets(st);
        const burning = [];
        for (let i = 0; i < MAX_ENEMIES; i++) if (st.alive[i] && st.burn[i] > 0) burning.push(i);
        for (const i of burning) for (const j of enemiesNear(st, st.ex[i], st.ey[i], 1.5)) {
          if (st.burn[j] <= 0) { st.burn[j] = 2.4; st.flash[j] = 0.3; }
        }
        st.pending.push({ t: 0.8, run: (next) => spread(next, depth + 1) });
      };
      fx.after(0.8, (st) => spread(st, 0)); } },

  { id: "fuse", glyph: "導", name: "導火線", family: "伝播", desc: "一列に沿って火が走り抜ける",
    run(s, fx) { const d = fx.dense(2); fx.focus(d.col, 1);
      for (let row = 0; row < GOAL_ROW; row++) {

const FAMILIES = ["瞬間", "伝播", "操作", "地形", "状態", "増殖"];

function useSkill(state, skillId) {
  const def = SKILLS.find((skill) => skill.id === skillId);
  if (!def) return null;
  const record = {
    id: skillId, affected: new Set(), killed: 0, cells: 0,
    delayed: false, focusCol: -1, focusRow: -1,
  };
  rebuildBuckets(state);
  def.run(state, makeEffectContext(state, record));
  return {
    id: skillId, affected: record.affected.size, killed: record.killed,
    cells: record.cells, delayed: record.delayed,
    focusCol: record.focusCol, focusRow: record.focusRow,
  };
}

// =================================================================
// ===== 比較台（同一盤面の再現）===================================
// =================================================================

/** シードと密度から、いつでも同じ盤面を作り直す。A案とB案を同条件で比べるため。 */
function makeBoard(seed, density) {
  const state = createState(seed);
  const target = DENSITY_PRESETS[density] ?? DENSITY_PRESETS["中"];
  // 上端から一定レートで流し込み、盤面の上から下まで敵が伸びた状態を作る。
  // 短時間で目標数だけ詰め込むと敵が上部に固まり、手前に効くスキル（後退・衝撃波）が
  // 空振りして計測できなくなる（v0.8.0 の初回計測でこれを踏んだ）。
  const fillSeconds = 17;
  const perSecond = target / fillSeconds * 1.25;   // 一部はゴールに抜けるので多めに流す
  let credit = 0;
  for (let t = 0; t < fillSeconds * 60; t++) {
    credit += perSecond * SIM_DT;
    while (credit >= 1) { credit -= 1; spawnEnemy(state, (random() * COLS) | 0, 0); }
    simStep(state);
  }
  return state;
}

/**
 * 全スキルを同一の盤面に撃って比べる。
 * 機械が出せるのは「量」だけで、気持ちよさは出せない。
 * 量が極端に小さい候補を落とす足切りとして使う。
 */
function benchmarkSkills(options) {
  const seeds = (options && options.seeds) || [11, 22, 33];
  const densities = (options && options.densities) || ["薄", "中", "密"];
  const settleSec = (options && options.settleSec) ?? 3.0;
  const table = {};
  for (const def of SKILLS) {
    const row = { name: def.name, family: def.family, byDensity: {} };
    for (const density of densities) {
      let affected = 0, immediate = 0, total = 0, runs = 0;
      for (const seed of seeds) {
        const state = makeBoard(seed, density);
        const before = state.count;
        const result = useSkill(state, def.id);
        if (!result) continue;
        immediate += before - state.count;
        for (let t = 0; t < Math.round(settleSec / SIM_DT); t++) simStep(state);
        affected += result.affected;
        total += before - state.count;
        runs++;
      }
      if (!runs) continue;
      row.byDensity[density] = {
        影響: Math.round(affected / runs),
        即撃破: Math.round(immediate / runs),
        "3秒後": Math.round(total / runs),
      };
    }
    table[def.id] = row;
  }
  return table;
}

// =================================================================
// ===== 撃ち味プロファイラ ========================================
//
// 「気持ちよさ」そのものは計算できない。が、それを構成する物理量は測れる:
//   遅延 / ピーク強度 / 持続の形 / 画面がどれだけ変わったか / 効果の集中度 /
//   読みやすさ（何が起きたか分かる割合）/ ばらつき
//
// 特に「画面変化量」は、実際に描画してピクセルを数えれば直接測れる。
// ただし敵は撃たなくても動くので、**同じ盤面を複製して「撃たなかった世界」を
// 並走させ、同時刻のフレーム同士を比べる**（交絡を除く）。
// =================================================================

function cloneState(state) {
  const copy = Object.assign({}, state);
  for (const key of ["ex", "ey", "ehp", "emax", "alive", "jit", "stun", "slow",
                     "rev", "burn", "pet", "ally", "flash", "terrain", "terrainTimer", "flow"]) {
    copy[key] = state[key].slice();
  }
  copy.buckets = Array.from({ length: COLS * ROWS }, () => []);
  copy.pending = state.pending.slice();
  rebuildBuckets(copy);
  return copy;
}

const PROFILE_CELL = 10;
let profileCanvas = null, profileCtx = null;

/** 盤面を小さく描いてピクセルを取り出す（見た目の変化量を測るため） */
function snapshotPixels(state, silhouette) {
  if (!profileCanvas) {
    profileCanvas = document.createElement("canvas");
    profileCanvas.width = COLS * PROFILE_CELL;
    profileCanvas.height = ROWS * PROFILE_CELL;
    profileCtx = profileCanvas.getContext("2d", { willReadFrequently: true });
  }
  const c = profileCtx;
  c.fillStyle = "#111726";
  c.fillRect(0, 0, profileCanvas.width, profileCanvas.height);
  for (let row = 0; row < ROWS; row++) for (let col = 0; col < COLS; col++) {
    const kind = state.terrain[cellIndex(col, row)];
    if (kind === TERRAIN_OPEN) continue;
    c.fillStyle = kind === TERRAIN_WALL ? "#6f9e70" : kind === TERRAIN_PIT ? "#100408"
                : kind === TERRAIN_SLOW ? "#6b7c4e" : "#a04a20";
    c.fillRect(col * PROFILE_CELL, row * PROFILE_CELL, PROFILE_CELL, PROFILE_CELL);
  }
  for (let i = 0; i < MAX_ENEMIES; i++) {
    if (!state.alive[i]) continue;
    // silhouette=true では状態色を無視する。色だけ変わったのか、
    // 実際に敵が動いた／消えたのかを切り分けるため。
    c.fillStyle = silhouette ? "#ffffff"
                : state.flash[i] > 0 ? "#ffffff"
                : state.ally[i] ? "#7dffb0"
                : state.stun[i] > 0 ? "#a8ddff"
                : state.burn[i] > 0 ? "#c7d45a" : "#e8556d";
    c.beginPath();
    c.arc(state.ex[i] * PROFILE_CELL, state.ey[i] * PROFILE_CELL, PROFILE_CELL * 0.3, 0, Math.PI * 2);
    c.fill();
  }
  return c.getImageData(0, 0, profileCanvas.width, profileCanvas.height).data;
}

/** 2枚のフレームで色が変わったピクセルの割合 */
function pixelDifference(a, b) {
  let changed = 0;
  const total = a.length / 4;
  for (let k = 0; k < a.length; k += 4) {
    const d = Math.abs(a[k] - b[k]) + Math.abs(a[k + 1] - b[k + 1]) + Math.abs(a[k + 2] - b[k + 2]);
    if (d > 40) changed++;
  }
  return changed / total;
}

const PROFILE_MARKS = [0.1, 0.3, 0.6, 1.0, 2.0, 3.0];

/**
 * 1スキルの撃ち味プロファイル。撃った世界と撃たなかった世界を並走させる。
 */
function profileSkill(skillId, seed, density) {
  const base = makeBoard(seed, density);
  const withSkill = cloneState(base);
  const without   = cloneState(base);

  const beforeX = base.ex.slice(), beforeY = base.ey.slice();
  const aliveBefore = base.alive.slice();
  const countBefore = base.count;
  const reachedBefore = base.reached;

  const result = useSkill(withSkill, skillId);
  if (!result) return null;

  // 影響を受けた敵の広がり（集中度）
  let sumX = 0, sumY = 0, marked = 0;
  const markedIndices = [];
  for (let i = 0; i < MAX_ENEMIES; i++) {
    if (withSkill.flash[i] > 0 && aliveBefore[i]) { sumX += beforeX[i]; sumY += beforeY[i]; marked++; markedIndices.push(i); }
  }
  let spread = 0;
  if (marked > 0) {
    const cx = sumX / marked, cy = sumY / marked;
    const distances = markedIndices.map((i) => Math.hypot(beforeX[i] - cx, beforeY[i] - cy)).sort((a, b) => a - b);
    spread = distances[Math.floor(distances.length * 0.8)] || 0;   // 8割が収まる半径
  }

  // 時間を進めながら、撃破の時間分布と画面変化を測る
  const killBins = [];
  const pixelMarks = [];
  const shapeMarks = [];
  // 発動した瞬間の撃破も最初のビンに入れる（ここを withSkill.count にすると
  // 即死系の遅延が「発動後に初めて死んだ時刻」になり、瞬間系が全部0.8秒遅延と出る）
  let previousCount = countBefore;
  let reachedSoFar = reachedBefore;
  let elapsed = 0, markIndex = 0;
  const totalTicks = Math.round(3.0 / SIM_DT);
  const binTicks = Math.round(0.1 / SIM_DT);
  let binKills = 0;

  for (let t = 0; t < totalTicks; t++) {
    simStep(withSkill); simStep(without);
    elapsed += SIM_DT;
    // ゴールに抜けた分は「撃破」ではない。これを引かないと、何も殺さないスキルが
    // 一律「撃破28・遅延0.9秒」と出る（v0.8.0 の初回プロファイルでこれを踏んだ）。
    const exited = withSkill.reached - reachedSoFar;
    reachedSoFar = withSkill.reached;
    binKills += Math.max(0, previousCount - withSkill.count - exited);
    previousCount = withSkill.count;
    if ((t + 1) % binTicks === 0) { killBins.push(binKills); binKills = 0; }
    if (markIndex < PROFILE_MARKS.length && elapsed >= PROFILE_MARKS[markIndex] - 1e-6) {
      pixelMarks.push(pixelDifference(snapshotPixels(withSkill, false), snapshotPixels(without, false)));
      shapeMarks.push(pixelDifference(snapshotPixels(withSkill, true), snapshotPixels(without, true)));
      markIndex++;
    }
  }

  const totalKilled = (countBefore - withSkill.count) - (withSkill.reached - reachedBefore);
  const blocked = (without.reached - reachedBefore) - (withSkill.reached - reachedBefore);
  const cumulative = [];
  let running = 0;
  for (const bin of killBins) { running += bin; cumulative.push(running); }

  const firstKillBin = killBins.findIndex((n) => n > 0);
  const peakBin = Math.max(0, ...killBins);
  const ninetyIndex = cumulative.findIndex((n) => n >= running * 0.95);

  // 読みやすさ: 影響を受けたうち「消えた or 1マス以上動いた」割合
  let readable = 0;
  for (const i of markedIndices) {
    if (!withSkill.alive[i]) { readable++; continue; }
    if (Math.hypot(withSkill.ex[i] - beforeX[i], withSkill.ey[i] - beforeY[i]) > 1.0) readable++;
  }

  return {
    影響: result.affected,
    撃破: totalKilled,
    遅延秒: firstKillBin < 0 ? null : +(firstKillBin * 0.1).toFixed(1),
    ピーク: peakBin,
    持続秒: ninetyIndex < 0 ? 0 : +((ninetyIndex + 1) * 0.1).toFixed(1),
    集中半径: +spread.toFixed(1),
    読みやすさ: marked > 0 ? +(readable / marked).toFixed(2) : 0,
    通過阻止: blocked,
    画面変化: pixelMarks.map((v) => +(v * 100).toFixed(1)),
    画面変化ピーク: +(Math.max(0, ...pixelMarks) * 100).toFixed(1),
    形の変化ピーク: +(Math.max(0, ...shapeMarks) * 100).toFixed(1),
  };
}

/** 全スキルをプロファイルし、シード間のばらつきも出す */
function profileAll(options) {
  const seeds = (options && options.seeds) || [11, 22, 33];
  const density = (options && options.density) || "中";
  const table = {};
  for (const def of SKILLS) {
    const runs = seeds.map((seed) => profileSkill(def.id, seed, density)).filter(Boolean);
    if (!runs.length) continue;
    const mean = (key) => runs.reduce((sum, r) => sum + (r[key] ?? 0), 0) / runs.length;
    const killValues = runs.map((r) => r.撃破);
    const meanKill = killValues.reduce((a, b) => a + b, 0) / killValues.length;
    const variance = killValues.reduce((sum, v) => sum + (v - meanKill) ** 2, 0) / killValues.length;
    table[def.id] = {
      名: def.name, 系: def.family,
      影響: Math.round(mean("影響")),
      撃破: Math.round(mean("撃破")),
      遅延秒: +mean("遅延秒").toFixed(2),
      ピーク: Math.round(mean("ピーク")),
      持続秒: +mean("持続秒").toFixed(1),
      集中半径: +mean("集中半径").toFixed(1),
      読みやすさ: +mean("読みやすさ").toFixed(2),
      通過阻止: Math.round(mean("通過阻止")),
      画面変化ピーク: +mean("画面変化ピーク").toFixed(1),
      形の変化ピーク: +mean("形の変化ピーク").toFixed(1),
      ばらつき: +(Math.sqrt(variance) / Math.max(1, meanKill)).toFixed(2),
    };
  }
  return table;
}

/**
 * 撃ち味プロファイルから10種を機械的に選ぶ。
 *
 * 機械にできるのは「気持ちよさの順位づけ」ではなく、次の2つだけ:
 *   1. 必要条件を満たさないものを落とす（画面が動く／何が起きたか分かる／盤面に利益がある）
 *   2. 残りから、撃ち味プロファイルが最も散らばる組を選ぶ（＝被りの排除）
 * 「どれが一番気持ちいいか」は人間の採点でしか決まらない。
 */
function selectTen(table, count) {
  const wanted = count || 10;
  const rejected = [];
  const survivors = Object.entries(table).filter(([, r]) => {
    const reasons = [];
    if (r.形の変化ピーク < 5) reasons.push("画面がほぼ動かない(" + r.形の変化ピーク + "%)");
    if (r.読みやすさ < 0.5) reasons.push("何が起きたか分からない(" + r.読みやすさ + ")");
    if (r.撃破 === 0 && r.通過阻止 <= 0) reasons.push("盤面に利益がない");
    if (reasons.length) { rejected.push({ 名: r.名, 理由: reasons }); return false; }
    return true;
  });

  const axes = ["撃破", "通過阻止", "遅延秒", "持続秒", "ピーク", "形の変化ピーク", "集中半径", "読みやすさ"];
  const min = {}, max = {};
  for (const axis of axes) {
    const values = survivors.map(([, r]) => r[axis]);
    min[axis] = Math.min(...values); max[axis] = Math.max(...values);
  }
  const toVector = (r) => axes.map((a) => (max[a] - min[a]) ? (r[a] - min[a]) / (max[a] - min[a]) : 0);
  const distance = (a, b) => Math.hypot(...a.map((v, i) => v - b[i]));

  const points = survivors.map(([id, r]) => ({ id, 名: r.名, 系: r.系, vector: toVector(r), row: r }));
  if (!points.length) return { 足切り: rejected, 選抜: [], 落選: [] };

  // 最も画面が動くものを起点に、既に選んだどれからも最も遠いものを足していく
  const picked = [points.reduce((best, p) => (p.row.形の変化ピーク > best.row.形の変化ピーク ? p : best), points[0])];
  while (picked.length < wanted && picked.length < points.length) {
    let bestPoint = null, bestScore = -1;
    for (const p of points) {
      if (picked.includes(p)) continue;
      const nearest = Math.min(...picked.map((q) => distance(p.vector, q.vector)));
      if (nearest > bestScore) { bestScore = nearest; bestPoint = p; }
    }
    picked.push(bestPoint);
  }

  const dropped = points.filter((p) => !picked.includes(p)).map((p) => {
    let nearest = null, best = Infinity;
    for (const q of picked) { const d = distance(p.vector, q.vector); if (d < best) { best = d; nearest = q; } }
    return { 名: p.名, 被り相手: nearest.名, 距離: +best.toFixed(2) };
  }).sort((a, b) => a.距離 - b.距離);

  return { 足切り: rejected, 選抜: picked.map((p) => ({ 名: p.名, 系: p.系, id: p.id })), 落選: dropped };
}

// =================================================================
// ===== RENDER / UI ==============================================
// =================================================================
const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
const hudLeft = document.getElementById("hud-left");
const hudRight = document.getElementById("hud-right");
const impactEl = document.getElementById("impact");
const impactNum = document.getElementById("impact-num");
const toastEl = document.getElementById("toast");
const controlsEl = document.getElementById("controls");
const tabsEl = document.getElementById("tabs");
const skillsEl = document.getElementById("skills");

let viewW = 0, viewH = 0, cellSize = 0, originX = 0, originY = 0;
let board = null;
let boardSeed = 11, boardDensity = "中", paused = false, activeFamily = FAMILIES[0];
const rings = [];
let lastResult = null;

const screenX = (x) => originX + x * cellSize;
const screenY = (y) => originY + y * cellSize;

function familyColor(family) {
  return { "瞬間": "#ff8a5c", "伝播": "#7fd4ff", "操作": "#c98bff",
           "地形": "#9fe8a0", "状態": "#a8ddff", "増殖": "#ffd479" }[family] || "#e8ecf4";
}

function resetBoard() {
  board = makeBoard(boardSeed, boardDensity);
  rings.length = 0;
  lastResult = null;
  for (const label of skillsEl.querySelectorAll(".num")) label.textContent = "";
}

function buildControls() {
  controlsEl.innerHTML = "";
  const add = (label, onTap, isOn) => {
    const button = document.createElement("button");
    button.textContent = label;
    if (isOn) button.classList.add("on");
    button.addEventListener("pointerdown", (event) => {
      event.preventDefault(); onTap(); buildControls();
    });
    controlsEl.appendChild(button);
  };
  add("リセット", () => resetBoard());
  for (const density of Object.keys(DENSITY_PRESETS)) {
    add(density, () => { boardDensity = density; resetBoard(); }, boardDensity === density);
  }
  add(paused ? "再開" : "停止", () => { paused = !paused; }, paused);
  const spacer = document.createElement("span");
  spacer.className = "spacer";
  controlsEl.appendChild(spacer);
  add("seed " + boardSeed, () => { boardSeed = (boardSeed + 11) % 999; resetBoard(); });
}

function buildTabs() {
  tabsEl.innerHTML = "";
  for (const family of FAMILIES) {
    const button = document.createElement("button");
    button.textContent = family;
    if (family === activeFamily) button.classList.add("on");
    button.addEventListener("pointerdown", (event) => {
      event.preventDefault(); activeFamily = family; buildTabs(); buildSkills();
    });
    tabsEl.appendChild(button);
  }
}

function buildSkills() {
  skillsEl.innerHTML = "";
  for (const def of SKILLS.filter((skill) => skill.family === activeFamily)) {
    const button = document.createElement("button");
    button.className = "skill";
    button.style.color = familyColor(def.family);
    button.innerHTML =
      '<span class="glyph">' + def.glyph + '</span>' +
      '<span class="name">' + def.name + '</span>' +
      '<span class="num" data-for="' + def.id + '"></span>';
    button.addEventListener("pointerdown", (event) => { event.preventDefault(); fire(def); });
    skillsEl.appendChild(button);
  }
}

function fire(def) {
  if (!board) return;
  const before = board.count;
  const result = useSkill(board, def.id);
  if (!result) return;
  lastResult = { def, result, killed: before - board.count };

  impactNum.textContent = String(result.affected);
  impactEl.classList.remove("show"); void impactEl.offsetWidth; impactEl.classList.add("show");

  if (result.focusCol >= 0) {
    rings.push({ col: result.focusCol, row: result.focusRow,
                 color: familyColor(def.family), life: 0.55, max: 0.55 });
  }
  toastEl.innerHTML =
    '<b style="color:' + familyColor(def.family) + '">' + def.glyph + ' ' + def.name + '</b> — ' + def.desc +
    '<br>影響 <b>' + result.affected + '</b> 体／即撃破 <b>' + (before - board.count) + '</b> 体' +
    (result.delayed ? '（時間差で続く）' : '');
  toastEl.classList.remove("show"); void toastEl.offsetWidth; toastEl.classList.add("show");

  const label = skillsEl.querySelector('[data-for="' + def.id + '"]');
  if (label) label.textContent = String(result.affected);
  if (navigator.vibrate) navigator.vibrate(Math.min(140, 20 + result.affected));
}

function resize() {
  viewW = window.innerWidth; viewH = window.innerHeight;
  const panelH = document.getElementById("panel").offsetHeight || 150;
  const boardH = viewH - panelH;
  canvas.width = viewW; canvas.height = boardH;
  cellSize = Math.min(viewW / COLS, (boardH - 30) / ROWS);
  originX = (viewW - cellSize * COLS) / 2;
  originY = (boardH - cellSize * ROWS) / 2 + 12;
  toastEl.style.bottom = (panelH + 6) + "px";
}
window.addEventListener("resize", resize);

function render() {
  ctx.fillStyle = "#0a0c14";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (!board) return;

  ctx.fillStyle = "#111726";
  ctx.fillRect(originX, originY, cellSize * COLS, cellSize * ROWS);
  ctx.strokeStyle = "rgba(255,255,255,0.035)";
  ctx.lineWidth = 1;
  for (let col = 0; col <= COLS; col++) {
    ctx.beginPath(); ctx.moveTo(screenX(col), originY);
    ctx.lineTo(screenX(col), originY + cellSize * ROWS); ctx.stroke();
  }
  for (let row = 0; row <= ROWS; row++) {
    ctx.beginPath(); ctx.moveTo(originX, screenY(row));
    ctx.lineTo(originX + cellSize * COLS, screenY(row)); ctx.stroke();
  }

  ctx.fillStyle = "rgba(90,160,255,0.14)";
  ctx.fillRect(originX, screenY(GOAL_ROW), cellSize * COLS, cellSize);

  for (let row = 0; row < ROWS; row++) for (let col = 0; col < COLS; col++) {
    const kind = board.terrain[cellIndex(col, row)];
    if (kind === TERRAIN_OPEN) continue;
    ctx.fillStyle = kind === TERRAIN_WALL ? "rgba(159,232,160,0.5)"
                  : kind === TERRAIN_PIT  ? "rgba(16,4,10,0.96)"
                  : kind === TERRAIN_SLOW ? "rgba(120,150,90,0.35)"
                  : "rgba(255,110,50,0.35)";
    ctx.fillRect(screenX(col) + 1, screenY(row) + 1, cellSize - 2, cellSize - 2);
  }

  const radius = Math.max(2, cellSize * 0.18);
  for (let i = 0; i < MAX_ENEMIES; i++) {
    if (!board.alive[i]) continue;
    const flash = board.flash[i];
    ctx.fillStyle = flash > 0 ? "#ffffff"
                  : board.ally[i] ? "#7dffb0"
                  : board.pet[i]  > 0 ? "#b9b2a4"
                  : board.stun[i] > 0 ? "#a8ddff"
                  : board.rev[i]  > 0 ? "#ff9ad5"
                  : board.burn[i] > 0 ? "#c7d45a"
                  : board.slow[i] > 0 ? "#8fa4c8" : "#e8556d";
    ctx.beginPath();
    ctx.arc(screenX(board.ex[i]), screenY(board.ey[i]), flash > 0 ? radius * 1.8 : radius, 0, Math.PI * 2);
    ctx.fill();
  }

  for (const ring of rings) {
    const progress = 1 - ring.life / ring.max;
    ctx.globalAlpha = ring.life / ring.max;
    ctx.strokeStyle = ring.color; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(screenX(ring.col + 0.5), screenY(ring.row + 0.5), cellSize * (0.5 + progress * 4.5), 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

function updateHud() {
  hudLeft.textContent = "敵 " + board.count;
  const detail = lastResult
    ? lastResult.def.name + ": 影響" + lastResult.result.affected + "／撃破" + lastResult.killed
    : "押して撃ち味を比べる";
  hudRight.innerHTML = GAME_VERSION + "　seed " + boardSeed + "／" + boardDensity + "<br>" + detail;
}

let lastFrameTime = performance.now(), accumulator = 0;
function frame(now) {
  const elapsed = Math.min(0.25, (now - lastFrameTime) / 1000);
  lastFrameTime = now;
  if (board && !paused) {
    accumulator += elapsed;
    while (accumulator >= SIM_DT) { simStep(board); accumulator -= SIM_DT; }
  }
  for (let i = rings.length - 1; i >= 0; i--) {
    rings[i].life -= elapsed;
    if (rings[i].life <= 0) rings.splice(i, 1);
  }
  render();
  if (board) updateHud();
  requestAnimationFrame(frame);
}

buildControls();
buildTabs();
buildSkills();
resetBoard();
resize();
requestAnimationFrame(frame);

window.skillLab = {
  SKILLS, FAMILIES, DENSITY_PRESETS,
  makeBoard, useSkill, simStep, benchmarkSkills, createState, reseedRandom,
  cloneState, profileSkill, profileAll, snapshotPixels, pixelDifference, selectTen,
  getBoard: () => board,
};
</script>
</body>
</html>
