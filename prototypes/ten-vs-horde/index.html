<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>十人と百鬼 / Ten vs Horde</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0a0c14; color: #e8ecf4;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    touch-action: none; user-select: none;
  }
  #stage { position: fixed; top: 0; left: 0; display: block; }

  #hud-top {
    position: fixed; top: 0; left: 0; right: 0; padding: 8px 12px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; letter-spacing: 0.04em; pointer-events: none; z-index: 10;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }
  #hud-castle { color: #7fd4ff; }
  #hud-wave   { color: #ffd479; }

  /* 「1タップの影響量」＝このゲームの価値そのもの。計測器と演出を兼ねて大きく出す。 */
  #impact {
    position: fixed; left: 0; right: 0; top: 28%;
    text-align: center; pointer-events: none; z-index: 12;
    font-weight: 800; font-size: 66px; letter-spacing: -0.02em;
    color: #fff; text-shadow: 0 0 24px rgba(120,200,255,0.9), 0 4px 12px rgba(0,0,0,0.6);
    opacity: 0;
  }
  #impact .label { display: block; font-size: 14px; font-weight: 600; letter-spacing: 0.3em; opacity: 0.75; }
  #impact.show { animation: impactPop 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  @keyframes impactPop {
    0%   { opacity: 0; transform: scale(0.6); }
    18%  { opacity: 1; transform: scale(1.12); }
    45%  { opacity: 1; transform: scale(1.0); }
    100% { opacity: 0; transform: scale(1.0) translateY(-26px); }
  }

  /* スキルバー: 位置の概念を捨てて、10個のボタンにした（v0.4.0） */
  #skillbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 14;
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px;
    padding: 5px 5px calc(5px + env(safe-area-inset-bottom));
    background: rgba(8,11,20,0.94);
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .skill {
    position: relative; overflow: hidden;
    border: none; border-radius: 10px; padding: 7px 2px 6px;
    background: #1b2334; color: #e8ecf4;
    display: flex; flex-direction: column; align-items: center; gap: 1px;
    transition: transform 0.06s ease;
  }
  .skill:active { transform: scale(0.94); }
  .skill .glyph { font-size: 21px; font-weight: 800; line-height: 1.05; }
  .skill .name  { font-size: 9px; opacity: 0.75; letter-spacing: 0.06em; }
  .skill .cool {
    position: absolute; left: 0; right: 0; bottom: 0; top: 0;
    background: rgba(6,9,16,0.78); transform-origin: bottom;
  }
  .skill.ready .cool { display: none; }
  .skill.ready { box-shadow: 0 0 0 1.5px currentColor inset; }
  .skill.dud  { opacity: 0.45; }

  #hud-version {
    position: fixed; left: 8px; top: 26px; font-size: 11px;
    color: rgba(230,238,255,0.35); z-index: 10;
  }
  #hud-stats {
    position: fixed; right: 8px; top: 26px; font-size: 11px; text-align: right;
    color: rgba(230,238,255,0.5); z-index: 10; line-height: 1.5;
  }

  /* 効果の説明。プレイを止めないよう、モーダルにはしない
     （開いている間もゲームは進行し、スキルバーも隠さない） */
  #help-toggle {
    position: fixed; right: 8px; top: 4px; z-index: 16;
    width: 26px; height: 26px; border: none; border-radius: 50%;
    background: rgba(60,74,102,0.9); color: #dfe8f7; font-size: 14px; font-weight: 700;
  }
  #help-panel {
    position: fixed; left: 6px; right: 6px; z-index: 15; display: none;
    padding: 8px; border-radius: 12px;
    background: rgba(10,14,24,0.93); border: 1px solid rgba(255,255,255,0.12);
    font-size: 11px; line-height: 1.45; max-height: 62vh; overflow-y: auto;
  }
  #help-panel.visible { display: block; }
  #help-panel .row { display: flex; gap: 7px; padding: 3px 0; align-items: baseline; }
  #help-panel .row .g { font-weight: 800; font-size: 15px; min-width: 1.3em; text-align: center; }
  #help-panel .row .n { font-weight: 700; min-width: 3.2em; }
  #help-panel .row .c { opacity: 0.6; min-width: 2.4em; text-align: right; }
  #help-panel .row .e { flex: 1; opacity: 0.85; }
  #help-panel .fam { margin-top: 6px; font-size: 10px; letter-spacing: 0.2em; opacity: 0.5; }

  /* 発動したスキルが何をしたかを、その場で言葉にする */
  #toast {
    position: fixed; left: 8px; right: 8px; z-index: 15;
    padding: 7px 10px; border-radius: 10px; pointer-events: none;
    background: rgba(10,14,24,0.9); border: 1px solid rgba(255,255,255,0.1);
    font-size: 12px; line-height: 1.4; opacity: 0;
  }
  #toast.show { animation: toastFade 2.6s ease forwards; }
  @keyframes toastFade {
    0% { opacity: 0; transform: translateY(6px); }
    8% { opacity: 1; transform: translateY(0); }
    75% { opacity: 1; }
    100% { opacity: 0; }
  }
  #toast b { font-size: 13px; }

  #result {
    position: fixed; inset: 0; display: none; z-index: 20;
    background: rgba(6,8,14,0.93); flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; padding: 24px;
  }
  #result.visible { display: flex; }
  #result h1 { font-size: 22px; letter-spacing: 0.1em; }
  #result .rows { font-size: 14px; line-height: 2; color: #b9c6dc; text-align: center; }
  #result .rows b { color: #fff; font-size: 18px; }
  #result button {
    margin-top: 8px; padding: 14px 34px; font-size: 16px; font-weight: 700;
    border: none; border-radius: 999px; background: #4a8fff; color: #fff;
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="hud-top">
  <span id="hud-castle">城 100</span>
  <span id="hud-wave">WAVE 1</span>
</div>
<div id="hud-version">v0.4.0</div>
<div id="hud-stats"></div>
<div id="impact"><span class="label">IMPACT</span><span id="impact-num">0</span></div>
<button id="help-toggle">?</button>
<div id="help-panel"></div>
<div id="toast"></div>
<div id="skillbar"></div>
<div id="result">
  <h1>突破された</h1>
  <div class="rows" id="result-rows"></div>
  <button id="result-retry">もう一度</button>
</div>

<script>
"use strict";

// =================================================================
// 十人と百鬼 / Ten vs Horde
//
// 価値基準: 「ユーザーの少ないアクションで、たくさんの影響が起きること」。
// 客観量として測れるので、最初から計測器を内蔵している:
//   - 1タップごとに「影響を受けた敵の数」を記録し、画面にも出す（計測器＝演出）
//   - 描画なしで回す headless 実行があり、無操作ベースラインとの差分を取れる
//
// v0.4.0 の設計変更:
//   味方ユニットを盤面から撤去し、10個のボタンにした。
//   v0.3.0 までは味方に位置があったが、動かせないため位置が「制約」にしか
//   なっていなかった（射程外だと押せないだけ）。位置の意味を捨てる代わりに、
//   全スキルが盤面を見て自分で最適な対象を選ぶ。
//   プレイヤーの決定は「どのスキルを・いつ」だけに絞られる。
//
// SIM は DOM も canvas も触らない（描画を止めても同じ状態遷移になる）。
// =================================================================

const GAME_VERSION = "v0.6.0";

// -----------------------------------------------------------------
// 決定性RNG（ロジック用 random / 演出用 fxRandom の2ストリーム）
// 素の Math.random() の直接呼び出しは禁止（tools/check.mjs が検出）。 allow-math-random
// -----------------------------------------------------------------
function makeRandomGenerator(seedValue) {   // mulberry32
  let state = seedValue >>> 0;
  return function nextRandom() {
    state = (state + 0x6D2B79F5) >>> 0;
    let t = state;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function hashSeed(text) {
  let hash = 0x811C9DC5;
  const source = String(text);
  for (let i = 0; i < source.length; i++) {
    hash ^= source.charCodeAt(i);
    hash = Math.imul(hash, 0x01000193);
  }
  return hash >>> 0;
}

let currentSeed = 0, nextLogicRandom = null, nextFxRandom = null;

function reseedRandom(seedValue) {
  currentSeed = (typeof seedValue === "number") ? (seedValue >>> 0) : hashSeed(seedValue);
  nextLogicRandom = makeRandomGenerator(currentSeed);
  nextFxRandom    = makeRandomGenerator((currentSeed ^ 0x9E3779B9) >>> 0);
  return currentSeed;
}
function random()   { return nextLogicRandom(); }
function fxRandom() { return nextFxRandom(); }

const fixedSeedParam = new URLSearchParams(location.search).get("seed") || null;
function seedForNewGame() {
  return reseedRandom(fixedSeedParam !== null ? fixedSeedParam : (Date.now() >>> 0));
}

// =================================================================
// 設定
// =================================================================
const COLS = 12;
const ROWS = 22;
const CASTLE_ROW = ROWS - 1;
const MAX_ENEMIES = 900;
const CASTLE_HP_MAX = 100;

const ENEMY_HP    = 4;
const ENEMY_SPEED = 1.15;             // マス/秒
const ENEMY_CONTACT_DAMAGE = 1;

// 城の自動迎撃（v0.6.0 で 0 に）。
// v0.5.0 までは 22 あり、放っておいても敵が減っていた。計測の「無操作ベースライン」を
// 非ゼロにするために入れていたが、価値基準（プレイヤーの一手で盤面が動く）を薄めていた。
// 0 にするとタップの価値はむしろ広がる（無操作との差が3.0倍→4.4倍）。
// createState / headlessRun の castleDps オプションで有無を比較できる。
const CASTLE_DPS     = 0;
const CASTLE_TARGETS = 10;            // 同時に狙う数（迎撃を有効にした場合）

const SIM_DT = 1 / 60;

const SPAWN_RATE_BASE     = 7;        // 毎秒（ウェーブ1）
const SPAWN_RATE_PER_WAVE = 5;
const WAVE_INTERVAL_SEC   = 26;

const TERRAIN_OPEN = 0, TERRAIN_WALL = 1, TERRAIN_PIT = 2;
const WALL_DURATION = 9;
const PIT_DURATION  = 7;

// 位置が変わった敵を「影響あり」と数える最小距離。
// これ未満の微動まで数えると引き寄せ系の影響量が過大に出て、計測器が嘘をつく。
const MEANINGFUL_MOVE = 0.6;

/**
 * スキル10種。すべて「位置を持たない」。
 * 対象は盤面から自動で選ぶ（最密地帯・最前線・全体など）ので、
 * プレイヤーの決定は「どれを・いつ」だけになる。
 *
 * 影響の型を3系統に分けてあり、この3系統の使い分けが判断の中身になる:
 *   狩る   … 敵を減らす（雷・爆・穴）
 *   崩す   … 隊列を動かす／進路を変える（磁・風・壁・反）
 *   抑える … 時間を稼ぐ（凍・腐・鼓）
 */
const SKILL_DEFS = [
  { id: "chain", cost: 25,   glyph: "雷", name: "連鎖",  color: "#7fd4ff", cooldown: 8,  family: "狩る", effect: "密集地から敵づたいに感電。密集しているほど連鎖が伸びる" },
  { id: "blast", cost: 22,   glyph: "爆", name: "爆発",  color: "#ff8a5c", cooldown: 7,  family: "狩る", effect: "最も密集した場所を吹き飛ばす" },
  { id: "pit", cost: 34,     glyph: "穴", name: "陥没",  color: "#ff6b8a", cooldown: 13, family: "狩る", effect: "密集地を落とし穴に。数秒間そこを通れなくなる" },
  { id: "pull", cost: 16,    glyph: "磁", name: "集約",  color: "#c98bff", cooldown: 7,  family: "崩す", effect: "盤面全体の敵を一点に集める。単体では倒せない布石" },
  { id: "push", cost: 20,    glyph: "風", name: "後退",  color: "#ffd479", cooldown: 8,  family: "崩す", effect: "手前まで来た敵をまとめて後方へ押し戻す" },
  { id: "wall", cost: 24,    glyph: "壁", name: "遮断",  color: "#9fe8a0", cooldown: 11, family: "崩す", effect: "前線の手前に壁。数百体の進路がまとめて変わる" },
  { id: "reverse", cost: 22, glyph: "反", name: "反転",  color: "#ff9ad5", cooldown: 12, family: "崩す", effect: "密集地の敵を反転させ、後続にぶつける" },
  { id: "freeze", cost: 28,  glyph: "凍", name: "停止",  color: "#a8ddff", cooldown: 10, family: "抑える", effect: "城に近い60体をその場に凍結する" },
  { id: "rot", cost: 30,     glyph: "腐", name: "腐蝕",  color: "#a0d468", cooldown: 12, family: "抑える", effect: "盤面の全ての敵をじわじわ削る" },
  { id: "rally", cost: 18,   glyph: "鼓", name: "鼓舞",  color: "#ffe08a", cooldown: 15, family: "抑える", effect: "城の自動迎撃を数秒間3倍にする" },
];

// 気力: 全スキル共通の消費リソース（v0.5.0）
// v0.4.0 は「クールダウンさえ空けば何でも押せる」ためアクションが希少でなく、
// 湧き3倍でも負けようがなかった（＝判断が要らない）。
// 価値基準は「少ないアクションで大きな影響」なので、少なさを強制する軸を入れる。
const ENERGY_MAX   = 100;
const ENERGY_REGEN = 5.5;   // 毎秒

const REVERSE_DURATION = 3.0;
const FREEZE_DURATION  = 4.0;
const ROT_DURATION     = 6.0;
const ROT_DPS          = 1.2;
const RALLY_DURATION   = 8.0;
const RALLY_MULTIPLIER = 3.0;

// =================================================================
// ===== SIM ======================================================
// =================================================================

function createState(seedValue, options) {
  const seed = reseedRandom(seedValue);
  const state = {
    seed, time: 0, tick: 0, over: false,
    // 難易度を外から掃引できるようにしておく（headless で天井を測るため）
    spawnMultiplier: (options && options.spawnMultiplier) || 1,
    // 城の自動迎撃の強さ。0 にすると「倒すのは全てプレイヤーの一手」になる。
    // 外から差し替えられるようにしてあるのは、有無を計測で比べるため。
    castleDps: (options && options.castleDps !== undefined) ? options.castleDps : CASTLE_DPS,
    castleHp: CASTLE_HP_MAX, wave: 1, waveTimer: 0, spawnCredit: 0,

    enemyCount: 0,
    ex:     new Float32Array(MAX_ENEMIES),
    ey:     new Float32Array(MAX_ENEMIES),
    ehp:    new Float32Array(MAX_ENEMIES),
    ealive: new Uint8Array(MAX_ENEMIES),
    ejit:   new Float32Array(MAX_ENEMIES),
    estun:  new Float32Array(MAX_ENEMIES),   // 凍結
    erev:   new Float32Array(MAX_ENEMIES),   // 反転（城から遠ざかる）
    eflash: new Float32Array(MAX_ENEMIES),   // 見た目専用: 影響を受けた瞬間の発光

    energy: ENERGY_MAX,
    skills: SKILL_DEFS.map((d) => ({ id: d.id, cooldown: 0, cooldownMax: d.cooldown, cost: d.cost })),
    rotTimer: 0, rallyTimer: 0,

    terrain:      new Uint8Array(COLS * ROWS),
    terrainTimer: new Float32Array(COLS * ROWS),
    flow:         new Int32Array(COLS * ROWS),
    flowDirty:    true,
    buckets: Array.from({ length: COLS * ROWS }, () => []),

    // ---- 計測 ----
    taps: 0, tapLog: [], kills: 0, leaked: 0, peakEnemies: 0,
  };
  rebuildFlow(state);
  return state;
}

function cellIndex(col, row) { return row * COLS + col; }
function inBounds(col, row)  { return col >= 0 && col < COLS && row >= 0 && row < ROWS; }

/** 城までの距離場。壁・穴は通れない。壁1枚で数百体の経路が同時に変わる仕組み。 */
function rebuildFlow(state) {
  const flow = state.flow;
  flow.fill(-1);
  const queue = [];
  for (let col = 0; col < COLS; col++) {
    const index = cellIndex(col, CASTLE_ROW);
    if (state.terrain[index] === TERRAIN_OPEN) { flow[index] = 0; queue.push(index); }
  }
  let head = 0;
  while (head < queue.length) {
    const index = queue[head++];
    const col = index % COLS, row = (index / COLS) | 0;
    const nextDistance = flow[index] + 1;
    for (let d = 0; d < 4; d++) {
      const nc = col + [1, -1, 0, 0][d];
      const nr = row + [0, 0, 1, -1][d];
      if (!inBounds(nc, nr)) continue;
      const ni = cellIndex(nc, nr);
      if (state.terrain[ni] !== TERRAIN_OPEN || flow[ni] !== -1) continue;
      flow[ni] = nextDistance;
      queue.push(ni);
    }
  }
  state.flowDirty = false;
}

function spawnEnemy(state, col) {
  if (state.enemyCount >= MAX_ENEMIES) return -1;
  let slot = -1;
  for (let i = 0; i < MAX_ENEMIES; i++) if (!state.ealive[i]) { slot = i; break; }
  if (slot < 0) return -1;
  state.ealive[slot] = 1;
  state.ex[slot]  = col + 0.5;
  state.ey[slot]  = 0.5 + random() * 0.8;
  state.ehp[slot] = ENEMY_HP;
  state.ejit[slot] = (random() - 0.5) * 0.55;
  state.estun[slot] = 0;
  state.eflash[slot] = 0;
  state.erev[slot]  = 0;
  state.enemyCount++;
  return slot;
}

function rebuildBuckets(state) {
  const buckets = state.buckets;
  for (let i = 0; i < buckets.length; i++) buckets[i].length = 0;
  for (let i = 0; i < MAX_ENEMIES; i++) {
    if (!state.ealive[i]) continue;
    const col = Math.min(COLS - 1, Math.max(0, state.ex[i] | 0));
    const row = Math.min(ROWS - 1, Math.max(0, state.ey[i] | 0));
    buckets[cellIndex(col, row)].push(i);
  }
}

function enemiesNear(state, x, y, radius) {
  const found = [];
  const r2 = radius * radius;
  const minCol = Math.max(0, Math.floor(x - radius)), maxCol = Math.min(COLS - 1, Math.ceil(x + radius));
  const minRow = Math.max(0, Math.floor(y - radius)), maxRow = Math.min(ROWS - 1, Math.ceil(y + radius));
  for (let row = minRow; row <= maxRow; row++) {
    for (let col = minCol; col <= maxCol; col++) {
      const list = state.buckets[cellIndex(col, row)];
      for (let k = 0; k < list.length; k++) {
        const i = list[k];
        const dx = state.ex[i] - x, dy = state.ey[i] - y;
        if (dx * dx + dy * dy <= r2) found.push(i);
      }
    }
  }
  return found;
}

function aliveIndices(state) {
  const list = [];
  for (let i = 0; i < MAX_ENEMIES; i++) if (state.ealive[i]) list.push(i);
  return list;
}

function killEnemy(state, i) {
  if (!state.ealive[i]) return false;
  state.ealive[i] = 0;
  state.enemyCount--;
  state.kills++;
  return true;
}

function setTerrain(state, col, row, kind, duration) {
  if (!inBounds(col, row) || row >= CASTLE_ROW) return false;   // 城の列は塞げない（詰み防止）
  const index = cellIndex(col, row);
  state.terrain[index] = kind;
  state.terrainTimer[index] = duration;
  state.flowDirty = true;
  return true;
}

/**
 * 盤面で最も敵が密集しているセル（全スキル共通の自動照準）。
 * 距離計算をせず、セルごとの在籍数を箱状に足し合わせるだけにしてある。
 * 素朴に enemiesNear を全セルで呼ぶと1タップあたり1万回以上の距離計算になり、
 * 計測（数百ラン）が現実的な時間で終わらなくなるため。
 */
function densestCell(state, radius) {
  const reach = Math.max(1, Math.round(radius));
  let best = { col: (COLS / 2) | 0, row: (ROWS / 2) | 0, count: -1 };
  for (let row = 1; row < CASTLE_ROW; row++) {
    for (let col = 0; col < COLS; col++) {
      let count = 0;
      for (let dr = -reach; dr <= reach; dr++) {
        const nr = row + dr;
        if (nr < 0 || nr >= ROWS) continue;
        for (let dc = -reach; dc <= reach; dc++) {
          const nc = col + dc;
          if (nc < 0 || nc >= COLS) continue;
          count += state.buckets[cellIndex(nc, nr)].length;
        }
      }
      if (count > best.count) best = { col, row, count };
    }
  }
  return best;
}

/** 城に近い順の敵（最前線） */
function frontlineEnemies(state, limit) {
  const list = aliveIndices(state);
  list.sort((a, b) => state.ey[b] - state.ey[a]);
  return list.slice(0, limit);
}

function simStep(state) {
  if (state.over) return;
  const dt = SIM_DT;
  state.time += dt;
  state.tick++;

  state.energy = Math.min(ENERGY_MAX, state.energy + ENERGY_REGEN * dt);
  for (let i = 0; i < MAX_ENEMIES; i++) if (state.eflash[i] > 0) state.eflash[i] -= dt;
  if (state.rotTimer   > 0) state.rotTimer   = Math.max(0, state.rotTimer - dt);
  if (state.rallyTimer > 0) state.rallyTimer = Math.max(0, state.rallyTimer - dt);
  for (const skill of state.skills) {
    if (skill.cooldown > 0) skill.cooldown = Math.max(0, skill.cooldown - dt);
  }

  // ---- 地形の時間切れ ----
  let terrainExpired = false;
  for (let index = 0; index < state.terrain.length; index++) {
    if (state.terrain[index] === TERRAIN_OPEN) continue;
    state.terrainTimer[index] -= dt;
    if (state.terrainTimer[index] <= 0) { state.terrain[index] = TERRAIN_OPEN; terrainExpired = true; }
  }
  if (terrainExpired || state.flowDirty) rebuildFlow(state);

  // ---- ウェーブと常時湧き ----
  state.waveTimer += dt;
  if (state.waveTimer >= WAVE_INTERVAL_SEC) { state.waveTimer -= WAVE_INTERVAL_SEC; state.wave++; }
  state.spawnCredit += (SPAWN_RATE_BASE + SPAWN_RATE_PER_WAVE * (state.wave - 1)) * state.spawnMultiplier * dt;
  while (state.spawnCredit >= 1) { state.spawnCredit -= 1; spawnEnemy(state, (random() * COLS) | 0); }

  rebuildBuckets(state);

  // ---- 腐蝕（全体持続ダメージ）----
  if (state.rotTimer > 0) {
    for (let i = 0; i < MAX_ENEMIES; i++) {
      if (!state.ealive[i]) continue;
      state.ehp[i] -= ROT_DPS * dt;
      if (state.ehp[i] <= 0) killEnemy(state, i);
    }
  }

  // ---- 敵の移動 ----
  for (let i = 0; i < MAX_ENEMIES; i++) {
    if (!state.ealive[i]) continue;

    if (state.estun[i] > 0) { state.estun[i] = Math.max(0, state.estun[i] - dt); continue; }
    if (state.erev[i]  > 0) state.erev[i] = Math.max(0, state.erev[i] - dt);

    const col = Math.min(COLS - 1, Math.max(0, state.ex[i] | 0));
    const row = Math.min(ROWS - 1, Math.max(0, state.ey[i] | 0));

    if (state.terrain[cellIndex(col, row)] === TERRAIN_PIT) { killEnemy(state, i); continue; }

    if (row >= CASTLE_ROW) {
      state.castleHp -= ENEMY_CONTACT_DAMAGE;
      state.leaked++;
      killEnemy(state, i);
      if (state.castleHp <= 0) { state.castleHp = 0; state.over = true; }
      continue;
    }

    // 反転中は城から遠ざかる（＝後続とぶつかる）
    const seekFar = state.erev[i] > 0;
    const here = state.flow[cellIndex(col, row)];
    let bestCol = col, bestRow = row;
    let bestDistance = here < 0 ? (seekFar ? -Infinity : Infinity) : here;
    for (let d = 0; d < 4; d++) {
      const nc = col + [1, -1, 0, 0][d];
      const nr = row + [0, 0, 1, -1][d];
      if (!inBounds(nc, nr)) continue;
      const nd = state.flow[cellIndex(nc, nr)];
      if (nd < 0) continue;
      if (seekFar ? nd > bestDistance : nd < bestDistance) { bestDistance = nd; bestCol = nc; bestRow = nr; }
    }
    const targetX = bestCol + 0.5 + state.ejit[i];
    const targetY = bestRow + 0.5;
    const dx = targetX - state.ex[i], dy = targetY - state.ey[i];
    const length = Math.hypot(dx, dy) || 1;
    const step = ENEMY_SPEED * dt;
    state.ex[i] += (dx / length) * step;
    state.ey[i] += (dy / length) * step;
  }

  // ---- 城の自動迎撃（無操作ベースライン）----
  const targets = state.castleDps > 0 ? frontlineEnemies(state, CASTLE_TARGETS) : [];
  if (targets.length > 0) {
    const multiplier = state.rallyTimer > 0 ? RALLY_MULTIPLIER : 1;
    const perTarget = (state.castleDps * multiplier * dt) / targets.length;
    for (const i of targets) {
      state.ehp[i] -= perTarget;
      if (state.ehp[i] <= 0) killEnemy(state, i);
    }
  }

  if (state.enemyCount > state.peakEnemies) state.peakEnemies = state.enemyCount;
}

/** そのスキルが「何かを起こせる」状態か（空振りをさせないため） */
function canActivate(state, skillIndex) {
  const skill = state.skills[skillIndex];
  if (!skill || skill.cooldown > 0 || state.over) return false;
  if (state.energy < skill.cost) return false;        // 気力が足りなければ押せない
  if (skill.id === "rally") return true;              // 味方バフなので敵がいなくても可
  return state.enemyCount > 0;
}

/**
 * スキル発動。位置は取らない（対象は盤面から自動で選ぶ）。
 * 戻り値がこの1タップの影響記録。
 */
function activateSkill(state, skillIndex) {
  if (!canActivate(state, skillIndex)) return null;
  const skill = state.skills[skillIndex];
  const affected = new Set();
  let killed = 0, cellsChanged = 0, chainLen = 0;
  let focusCol = -1, focusRow = -1;

  const rerouteScope = () => {
    const before = [];
    for (let i = 0; i < MAX_ENEMIES; i++) if (state.ealive[i]) before.push([i, preferredCell(state, i)]);
    rebuildFlow(state);
    for (const [i, prev] of before) if (preferredCell(state, i) !== prev) affected.add(i);
  };

  if (skill.id === "blast") {
    const spot = densestCell(state, 3.2);
    focusCol = spot.col; focusRow = spot.row;
    for (const i of enemiesNear(state, spot.col + 0.5, spot.row + 0.5, 3.4)) {
      state.ehp[i] -= 8;
      affected.add(i);
      if (state.ehp[i] <= 0 && killEnemy(state, i)) killed++;
    }

  } else if (skill.id === "chain") {
    const spot = densestCell(state, 1.8);
    focusCol = spot.col; focusRow = spot.row;
    const seeds = enemiesNear(state, spot.col + 0.5, spot.row + 0.5, 2.5);
    if (seeds.length > 0) {
      const visited = new Set([seeds[0]]);
      const queue = [seeds[0]];
      while (queue.length > 0 && visited.size < 120) {
        const current = queue.shift();
        state.ehp[current] -= 5;
        affected.add(current);
        for (const n of enemiesNear(state, state.ex[current], state.ey[current], 1.7)) {
          if (visited.has(n)) continue;
          visited.add(n); queue.push(n);
          if (visited.size >= 120) break;
        }
      }
      chainLen = visited.size;
      for (const i of visited) if (state.ehp[i] <= 0 && killEnemy(state, i)) killed++;
    }

  } else if (skill.id === "pit") {
    const spot = densestCell(state, 1.8);
    focusCol = spot.col; focusRow = spot.row;
    for (let row = spot.row - 1; row <= spot.row + 1; row++) {
      for (let col = spot.col - 1; col <= spot.col + 1; col++) {
        if (!setTerrain(state, col, row, TERRAIN_PIT, PIT_DURATION)) continue;
        cellsChanged++;
        for (const i of enemiesNear(state, col + 0.5, row + 0.5, 0.75)) {
          affected.add(i);
          if (killEnemy(state, i)) killed++;
        }
      }
    }
    rerouteScope();

  } else if (skill.id === "pull") {
    // 盤面全体の敵を最密点へ寄せる。単体では何も殺さない布石。
    const spot = densestCell(state, 3.0);
    focusCol = spot.col; focusRow = spot.row;
    const cx = spot.col + 0.5, cy = spot.row + 0.5;
    for (const i of aliveIndices(state)) {
      const dx = cx - state.ex[i], dy = cy - state.ey[i];
      const length = Math.hypot(dx, dy) || 1;
      const pull = Math.min(length - 0.3, 4.2);
      if (pull < MEANINGFUL_MOVE) continue;
      state.ex[i] += (dx / length) * pull;
      state.ey[i] += (dy / length) * pull;
      affected.add(i);
    }

  } else if (skill.id === "push") {
    // 城に近い側の敵をまとめて押し戻す
    for (const i of aliveIndices(state)) {
      if (state.ey[i] < ROWS * 0.45) continue;
      state.ey[i] = Math.max(0.4, state.ey[i] - 6);
      state.ehp[i] -= 2;
      affected.add(i);
      if (state.ehp[i] <= 0 && killEnemy(state, i)) killed++;
    }

  } else if (skill.id === "wall") {
    // 最前線の少し手前を横断する壁。進路がまとめて曲がる。
    const front = frontlineEnemies(state, 40);
    if (front.length > 0) {
      let sumCol = 0, maxRow = 0;
      for (const i of front) { sumCol += state.ex[i]; maxRow = Math.max(maxRow, state.ey[i]); }
      const centerCol = Math.round(sumCol / front.length);
      const row = Math.max(1, Math.min(CASTLE_ROW - 2, Math.floor(maxRow) + 1));
      focusCol = centerCol; focusRow = row;
      for (let col = centerCol - 3; col <= centerCol + 3; col++) {
        if (setTerrain(state, col, row, TERRAIN_WALL, WALL_DURATION)) cellsChanged++;
      }
      rerouteScope();
    }

  } else if (skill.id === "reverse") {
    const spot = densestCell(state, 3.5);
    focusCol = spot.col; focusRow = spot.row;
    for (const i of enemiesNear(state, spot.col + 0.5, spot.row + 0.5, 5.5)) {
      state.erev[i] = REVERSE_DURATION;
      affected.add(i);
    }

  } else if (skill.id === "freeze") {
    for (const i of frontlineEnemies(state, 60)) {
      state.estun[i] = FREEZE_DURATION;
      affected.add(i);
    }

  } else if (skill.id === "rot") {
    state.rotTimer = ROT_DURATION;
    for (const i of aliveIndices(state)) affected.add(i);

  } else if (skill.id === "rally") {
    state.rallyTimer = RALLY_DURATION;
  }

  // 「1タップで何がどこまで届いたか」を目で見せる（見た目専用・ロジックには影響しない）
  for (const i of affected) state.eflash[i] = 0.45;

  skill.cooldown = skill.cooldownMax;
  state.energy -= skill.cost;
  state.taps++;
  const record = {
    time: state.time, skill: skill.id, skillIndex,
    affected: affected.size, killed, cellsChanged, chainLen,
    focusCol, focusRow,
  };
  state.tapLog.push(record);
  return record;
}

function preferredCell(state, i) {
  const col = Math.min(COLS - 1, Math.max(0, state.ex[i] | 0));
  const row = Math.min(ROWS - 1, Math.max(0, state.ey[i] | 0));
  let bestIndex = cellIndex(col, row);
  let bestDistance = state.flow[bestIndex];
  if (bestDistance < 0) bestDistance = Infinity;
  for (let d = 0; d < 4; d++) {
    const nc = col + [1, -1, 0, 0][d];
    const nr = row + [0, 0, 1, -1][d];
    if (!inBounds(nc, nr)) continue;
    const ni = cellIndex(nc, nr);
    const nd = state.flow[ni];
    if (nd >= 0 && nd < bestDistance) { bestDistance = nd; bestIndex = ni; }
  }
  return bestIndex;
}

// =================================================================
// ===== HEADLESS =================================================
// =================================================================

/**
 * 描画せずロジックだけ回す計測モード。
 * policy: none（無操作）/ random（撃てるものを適当に）/ greedy（敵が多いほど強い札を選ぶ）
 * none との差 = タップの価値、random との差 = 判断の価値。
 */
function headlessRun(options) {
  const seconds = options.seconds ?? 240;
  const policy  = options.policy ?? "none";
  const state = createState(options.seed ?? 1, {
    spawnMultiplier: options.spawnMultiplier ?? 1,
    castleDps: options.castleDps,
  });
  const totalTicks = Math.round(seconds / SIM_DT);

  for (let t = 0; t < totalTicks && !state.over; t++) {
    simStep(state);
    if (policy === "none" || state.tick % 15 !== 0) continue;

    const ready = state.skills.map((s, i) => i).filter((i) => canActivate(state, i));
    if (ready.length === 0) continue;

    if (policy === "random") {
      if (random() < 0.5) activateSkill(state, ready[(random() * ready.length) | 0]);
    } else if (policy === "greedy") {
      // 素朴な人間らしい判断:
      // 城が危ないなら止める、敵が多いなら狩る、そうでなければ布石を置く。
      const danger = frontlineEnemies(state, 1).some((i) => state.ey[i] > ROWS * 0.7);
      const crowded = state.enemyCount > 90;
      const wants = danger ? ["freeze", "push", "wall", "pit"]
                  : crowded ? ["pull", "chain", "blast", "rot"]
                  : ["rally", "rot", "chain"];
      for (const want of wants) {
        const index = state.skills.findIndex((s) => s.id === want);
        if (index >= 0 && ready.includes(index)) { activateSkill(state, index); break; }
      }
    }
  }

  const perSkill = {};
  for (const record of state.tapLog) {
    const bucket = perSkill[record.skill] || (perSkill[record.skill] = { taps: 0, affected: 0, killed: 0 });
    bucket.taps++; bucket.affected += record.affected; bucket.killed += record.killed;
  }
  for (const key of Object.keys(perSkill)) {
    perSkill[key].affectedPerTap = +(perSkill[key].affected / perSkill[key].taps).toFixed(1);
    perSkill[key].killedPerTap   = +(perSkill[key].killed   / perSkill[key].taps).toFixed(1);
  }
  const sorted = state.tapLog.map((r) => r.affected).sort((a, b) => a - b);

  return {
    seed: state.seed, policy, spawnMultiplier: state.spawnMultiplier,
    survivedSec: +state.time.toFixed(1), over: state.over, castleHp: state.castleHp,
    taps: state.taps, kills: state.kills, leaked: state.leaked, peakEnemies: state.peakEnemies,
    affectedPerTap: state.taps > 0 ? +(sorted.reduce((a, b) => a + b, 0) / state.taps).toFixed(1) : 0,
    affectedMedian: sorted.length > 0 ? sorted[(sorted.length / 2) | 0] : 0,
    affectedMax: sorted.length > 0 ? sorted[sorted.length - 1] : 0,
    perSkill,
  };
}

// =================================================================
// ===== RENDER / INPUT ===========================================
// =================================================================

const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
const hudCastle = document.getElementById("hud-castle");
const hudWave   = document.getElementById("hud-wave");
const hudStats  = document.getElementById("hud-stats");
const impactEl  = document.getElementById("impact");
const impactNum = document.getElementById("impact-num");
const skillbar  = document.getElementById("skillbar");
const helpPanel = document.getElementById("help-panel");
const helpToggle = document.getElementById("help-toggle");
const toastEl   = document.getElementById("toast");
const resultEl  = document.getElementById("result");
const resultRows = document.getElementById("result-rows");

document.getElementById("hud-version").textContent = GAME_VERSION;

let viewW = 0, viewH = 0, cellSize = 0, originX = 0, originY = 0;
let game = null;
const bursts = [];      // 発動地点のリング演出

const buttons = SKILL_DEFS.map((def, index) => {
  const button = document.createElement("button");
  button.className = "skill";
  button.style.color = def.color;
  button.innerHTML =
    `<span class="glyph" style="color:${def.color}">${def.glyph}</span>` +
    `<span class="name">${def.name} ${def.cost}</span><span class="cool"></span>`;
  button.addEventListener("pointerdown", (event) => {
    event.preventDefault();
    tapSkill(index);
  });
  skillbar.appendChild(button);
  return button;
});

// 効果一覧。系統ごとにまとめて、何を選んでいるのかが分かるようにする。
(function buildHelpPanel() {
  const families = ["狩る", "崩す", "抑える"];
  const labels = { "狩る": "狩る — 敵を減らす", "崩す": "崩す — 隊列と進路を動かす", "抑える": "抑える — 時間を稼ぐ" };
  helpPanel.innerHTML = families.map((family) =>
    `<div class="fam">${labels[family]}</div>` +
    SKILL_DEFS.filter((d) => d.family === family).map((d) =>
      `<div class="row"><span class="g" style="color:${d.color}">${d.glyph}</span>` +
      `<span class="n">${d.name}</span><span class="c">気力${d.cost}</span>` +
      `<span class="e">${d.effect}</span></div>`).join("")
  ).join("");
})();

helpToggle.addEventListener("pointerdown", (event) => {
  event.preventDefault();
  event.stopPropagation();
  helpPanel.classList.toggle("visible");
});

function showToast(def, record) {
  toastEl.innerHTML =
    `<b style="color:${def.color}">${def.glyph} ${def.name}</b> — ${def.effect}` +
    `<br>この一手で <b>${record.affected}</b> 体に影響` +
    (record.killed > 0 ? `／<b>${record.killed}</b> 体撃破` : "");
  toastEl.classList.remove("show");
  void toastEl.offsetWidth;
  toastEl.classList.add("show");
}

function resize() {
  viewW = window.innerWidth;
  viewH = window.innerHeight;
  const barHeight = skillbar.offsetHeight || 110;
  const boardH = viewH - barHeight;
  canvas.width  = viewW;
  canvas.height = boardH;
  cellSize = Math.min(viewW / COLS, (boardH - 40) / ROWS);
  originX = (viewW - cellSize * COLS) / 2;
  originY = (boardH - cellSize * ROWS) / 2 + 14;
  // スキルバーを覆わない位置に置く（開いたままでも遊べるようにするため）
  helpPanel.style.bottom = (barHeight + 8) + "px";
  toastEl.style.bottom   = (barHeight + 8) + "px";
}
window.addEventListener("resize", resize);

function screenX(x) { return originX + x * cellSize; }
function screenY(y) { return originY + y * cellSize; }

function render() {
  ctx.fillStyle = "#0a0c14";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (!game) return;

  ctx.fillStyle = "#111726";
  ctx.fillRect(originX, originY, cellSize * COLS, cellSize * ROWS);
  ctx.strokeStyle = "rgba(255,255,255,0.04)";
  ctx.lineWidth = 1;
  for (let col = 0; col <= COLS; col++) {
    ctx.beginPath(); ctx.moveTo(screenX(col), originY);
    ctx.lineTo(screenX(col), originY + cellSize * ROWS); ctx.stroke();
  }
  for (let row = 0; row <= ROWS; row++) {
    ctx.beginPath(); ctx.moveTo(originX, screenY(row));
    ctx.lineTo(originX + cellSize * COLS, screenY(row)); ctx.stroke();
  }

  // 城
  const castleAlpha = 0.18 + 0.12 * (game.rallyTimer > 0 ? 1 : 0);
  ctx.fillStyle = `rgba(90,160,255,${castleAlpha})`;
  ctx.fillRect(originX, screenY(CASTLE_ROW), cellSize * COLS, cellSize);

  // 地形
  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const kind = game.terrain[cellIndex(col, row)];
      if (kind === TERRAIN_OPEN) continue;
      ctx.fillStyle = kind === TERRAIN_WALL ? "rgba(159,232,160,0.55)" : "rgba(18,5,12,0.96)";
      ctx.fillRect(screenX(col) + 1, screenY(row) + 1, cellSize - 2, cellSize - 2);
    }
  }

  // 敵（状態で色を変える）
  const radius = Math.max(2.0, cellSize * 0.18);
  for (let i = 0; i < MAX_ENEMIES; i++) {
    if (!game.ealive[i]) continue;
    const flash = game.eflash[i];
    ctx.fillStyle = flash > 0 ? "#ffffff"
                  : game.estun[i] > 0 ? "#a8ddff"
                  : game.erev[i]  > 0 ? "#ff9ad5"
                  : game.rotTimer > 0 ? "#b6c96a" : "#e8556d";
    ctx.beginPath();
    ctx.arc(screenX(game.ex[i]), screenY(game.ey[i]), flash > 0 ? radius * 1.9 : radius, 0, Math.PI * 2);
    ctx.fill();
  }

  // 発動地点のリング
  for (const burst of bursts) {
    const progress = 1 - burst.life / burst.maxLife;
    ctx.globalAlpha = burst.life / burst.maxLife;
    ctx.strokeStyle = burst.color;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(screenX(burst.col + 0.5), screenY(burst.row + 0.5), cellSize * (0.6 + progress * 4), 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

function tapSkill(index) {
  if (!game || game.over) return;
  const record = activateSkill(game, index);
  if (!record) return;

  impactNum.textContent = String(record.affected);
  impactEl.classList.remove("show");
  void impactEl.offsetWidth;
  impactEl.classList.add("show");

  showToast(SKILL_DEFS[index], record);

  if (record.focusCol >= 0) {
    bursts.push({
      col: record.focusCol, row: record.focusRow,
      color: SKILL_DEFS[index].color, life: 0.5, maxLife: 0.5,
    });
  }
  if (navigator.vibrate) navigator.vibrate(Math.min(140, 25 + record.affected));
}

function updateHud() {
  hudCastle.textContent = `城 ${game.castleHp}`;
  hudWave.textContent = `WAVE ${game.wave}`;
  const avg = game.taps > 0
    ? (game.tapLog.reduce((sum, r) => sum + r.affected, 0) / game.taps).toFixed(1) : "—";
  hudStats.innerHTML = `気力 ${Math.floor(game.energy)}／${ENERGY_MAX}<br>敵 ${game.enemyCount}・撃破 ${game.kills}<br>${game.taps}タップ・平均影響 ${avg}`;

  for (let i = 0; i < buttons.length; i++) {
    const skill = game.skills[i];
    const button = buttons[i];
    const ready = skill.cooldown <= 0 && game.energy >= skill.cost;
    button.classList.toggle("ready", ready);
    button.classList.toggle("dud", !ready);
    if (!ready) {
      button.querySelector(".cool").style.transform = `scaleY(${skill.cooldown / skill.cooldownMax})`;
    }
  }
}

function endGame() {
  const avg = game.taps > 0
    ? (game.tapLog.reduce((sum, r) => sum + r.affected, 0) / game.taps).toFixed(1) : "0";
  resultRows.innerHTML =
    `到達 WAVE ${game.wave}・${game.time.toFixed(0)}秒<br>` +
    `撃破 <b>${game.kills}</b><br>` +
    `タップ <b>${game.taps}</b> 回<br>` +
    `1タップあたりの影響 <b>${avg}</b> 体<br>` +
    `<span style="opacity:.55;font-size:12px">seed: ${game.seed}</span>`;
  resultEl.classList.add("visible");
}

function startGame() {
  game = createState(seedForNewGame());
  bursts.length = 0;
  resultEl.classList.remove("visible");
  resize();
}

document.getElementById("result-retry").addEventListener("click", startGame);

let lastFrameTime = performance.now();
let simAccumulator = 0;

function frame(now) {
  const elapsed = Math.min(0.25, (now - lastFrameTime) / 1000);
  lastFrameTime = now;

  if (game && !game.over) {
    simAccumulator += elapsed;
    while (simAccumulator >= SIM_DT) { simStep(game); simAccumulator -= SIM_DT; }
    if (game.over) endGame();
  }
  for (let i = bursts.length - 1; i >= 0; i--) {
    bursts[i].life -= elapsed;
    if (bursts[i].life <= 0) bursts.splice(i, 1);
  }
  render();
  if (game) updateHud();
  requestAnimationFrame(frame);
}

startGame();
requestAnimationFrame(frame);

window.tenVsHorde = {
  headlessRun, createState, simStep, activateSkill, canActivate, reseedRandom,
  getState: () => game, tapSkill, SKILL_DEFS, COLS, ROWS,
};
</script>
