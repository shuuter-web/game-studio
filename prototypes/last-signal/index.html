<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LAST SIGNAL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:'Courier New',monospace;user-select:none}
#gc{position:relative;width:520px;height:760px}
#bgc,#pc{position:absolute}
#bgc{top:0;left:0;width:100%;height:100%}

/* Title */
#title{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:10}
#title h1{font-size:clamp(2rem,6vw,3.2rem);letter-spacing:.4em;color:#0ff;text-shadow:0 0 15px #0ff,0 0 40px #0af;margin-bottom:.2em}
#title .sub{font-size:.75rem;letter-spacing:.2em;color:#5af;margin-bottom:3em}
#title button{padding:.7em 2.5em;background:transparent;border:1px solid #0ff;color:#0ff;font-family:inherit;font-size:.9rem;letter-spacing:.2em;cursor:pointer;box-shadow:0 0 10px #0ff4;transition:background .2s}
#title button:hover{background:#0ff1;box-shadow:0 0 25px #0ff8}

/* Cutscene */
#cut{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:40px;z-index:10;cursor:pointer}
#cut-text{font-size:1rem;color:#ccc;text-align:center;letter-spacing:.12em;line-height:2;text-shadow:0 1px 4px #000;min-height:2em}
#cut-hint{position:absolute;bottom:240px;right:20px;font-size:.62rem;color:#446;letter-spacing:.1em}

/* Dialogue box */
#dlg{position:absolute;bottom:0;left:0;right:0;height:210px;background:linear-gradient(to bottom,rgba(0,5,15,.93),rgba(0,2,8,.97));border-top:1px solid rgba(0,150,220,.2);display:flex;z-index:10;cursor:pointer}
#pp{width:110px;min-width:110px;border-right:1px solid rgba(0,150,220,.15);position:relative;overflow:hidden}
#pc{top:0;left:0;width:110px;height:210px}
#tp{flex:1;padding:12px 14px 8px;display:flex;flex-direction:column;gap:5px;overflow:hidden}
#sp{font-size:.68rem;letter-spacing:.2em;font-weight:bold;height:18px;text-shadow:0 0 8px currentColor}
#dt{flex:1;font-size:.8rem;line-height:1.65;color:#e0e0e0;overflow:hidden;white-space:pre-wrap}
#ah{text-align:right;font-size:.6rem;color:#446;letter-spacing:.1em}
.blink{animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

/* Choices */
#chp{position:absolute;bottom:210px;left:0;right:0;padding:12px 16px;display:flex;flex-direction:column;gap:8px;z-index:11}
.cbtn{padding:11px 14px;background:rgba(0,8,20,.92);border:1px solid rgba(0,130,190,.35);color:#adf;font-family:inherit;font-size:.78rem;line-height:1.4;text-align:left;cursor:pointer;letter-spacing:.04em;transition:background .12s,border-color .12s}
.cbtn:hover{background:rgba(0,60,110,.35);border-color:rgba(0,190,255,.7)}
.cprompt{font-size:.62rem;color:#556;letter-spacing:.12em;padding:0 4px;margin-bottom:2px}

/* Battle */
#bui{position:absolute;inset:0;z-index:10;pointer-events:none}
#bui.on{pointer-events:auto}
#bst{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px}
.sb{background:rgba(0,5,15,.88);border:1px solid rgba(0,130,190,.3);padding:7px 10px;flex:1}
.sn{font-size:.58rem;letter-spacing:.15em;color:#558;margin-bottom:3px}
.sv{font-size:.85rem;color:#adf;font-weight:bold}
.hbar,.ebar{height:5px;background:#112;margin-top:3px;border-radius:3px}
.hfill{height:100%;background:linear-gradient(90deg,#f44,#f88);border-radius:3px;transition:width .35s}
.efill{height:100%;background:linear-gradient(90deg,#04f,#08f);border-radius:3px;transition:width .35s}
#eblk{position:absolute;top:82px;left:50%;transform:translateX(-50%);text-align:center}
#ename{font-size:.67rem;letter-spacing:.2em;color:#f88;margin-bottom:5px}
.ehbar{width:180px;height:7px;background:#300;border-radius:4px;margin:0 auto}
.ehfill{height:100%;background:linear-gradient(90deg,#f44,#f88);border-radius:4px;transition:width .35s}
#blog{position:absolute;bottom:214px;left:0;right:0;padding:8px 16px;font-size:.76rem;color:#aaa;text-align:center;background:rgba(0,0,0,.55);min-height:36px;line-height:1.6}
#bact{position:absolute;bottom:0;left:0;right:0;height:210px;background:rgba(0,3,10,.97);border-top:1px solid rgba(0,80,120,.3);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:1px;background-color:rgba(0,40,70,.15)}
.abtn{background:rgba(0,5,15,.95);border:none;color:#adf;font-family:inherit;font-size:.78rem;cursor:pointer;padding:10px;text-align:center;line-height:1.45;letter-spacing:.04em;transition:background .1s}
.abtn:hover:not(:disabled){background:rgba(0,35,70,.9)}
.abtn:disabled{color:#446;cursor:default}
.ac{display:block;font-size:.62rem;color:#557;margin-top:2px}

/* ARIA assist chip */
#aria-chip{font-size:.6rem;color:#0ff;text-shadow:0 0 6px #0ff;letter-spacing:.1em;white-space:nowrap}

/* Ending */
#end{position:absolute;inset:0;background:rgba(0,0,0,.96);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:40px;z-index:20;text-align:center}
#etitle{font-size:1.3rem;letter-spacing:.28em;margin-bottom:1.4em}
#ebody{font-size:.82rem;color:#999;line-height:2.1;letter-spacing:.05em;margin-bottom:2em;max-width:340px}
#ebody em{color:#ccc;font-style:italic}
#ebtn{padding:.7em 2em;background:transparent;border:1px solid #446;color:#88a;font-family:inherit;font-size:.75rem;letter-spacing:.2em;cursor:pointer;transition:border-color .2s,color .2s}
#ebtn:hover{border-color:#88a;color:#ccf}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="gc">
  <canvas id="bgc"></canvas>

  <div id="title">
    <h1>LAST SIGNAL</h1>
    <div class="sub">一つの信号。二つの選択。</div>
    <button id="sbtn">— START —</button>
  </div>

  <div id="cut" class="hidden">
    <div id="cut-text"></div>
    <div id="cut-hint">[ クリックで次へ ]</div>
  </div>

  <div id="dlg" class="hidden">
    <div id="pp"><canvas id="pc"></canvas></div>
    <div id="tp">
      <div id="sp"></div>
      <div id="dt"></div>
      <div id="ah">[ クリック / スペースで次へ ]</div>
    </div>
  </div>

  <div id="chp" class="hidden"></div>

  <div id="bui" class="hidden">
    <div id="bst">
      <div class="sb"><div class="sn">KAEL HP</div><div class="sv"><span id="hv">100</span></div><div class="hbar"><div class="hfill" id="hf" style="width:100%"></div></div></div>
      <div class="sb"><div class="sn">ENERGY</div><div class="sv"><span id="ev">50</span></div><div class="ebar"><div class="efill" id="ef" style="width:100%"></div></div></div>
      <div class="sb" id="aria-sb" style="display:none"><div class="sn">ARIA</div><div id="aria-chip">サポート中</div></div>
    </div>
    <div id="eblk"><div id="ename"></div><div class="ehbar"><div class="ehfill" id="ehf" style="width:100%"></div></div></div>
    <div id="blog"></div>
    <div id="bact">
      <button class="abtn" id="ba-atk">⚔ 攻撃<span class="ac">ATTACK</span></button>
      <button class="abtn" id="ba-hck">⌨ ハック<span class="ac">HACK  20EN</span></button>
      <button class="abtn" id="ba-def">🛡 防御<span class="ac">DEFEND</span></button>
      <button class="abtn" id="ba-med">+ 応急処置<span class="ac" id="med-lbl">MEDKIT ×2</span></button>
    </div>
  </div>

  <div id="end" class="hidden">
    <div id="etitle"></div>
    <div id="ebody"></div>
    <button id="ebtn">もう一度プレイ</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// LAST SIGNAL  v1.0
// ═══════════════════════════════════════════════════════════

// ── Canvas ─────────────────────────────────────────────────
const bgc = document.getElementById('bgc');
const bgx = bgc.getContext('2d');
const pc  = document.getElementById('pc');
const px  = pc.getContext('2d');
const W=520, H=760, PW=110, PH=210;
bgc.width=W; bgc.height=H; pc.width=PW; pc.height=PH;

function fit(){
  const s=Math.min(window.innerWidth/W, window.innerHeight/H);
  const g=document.getElementById('gc');
  g.style.transform=`scale(${Math.min(s,1)})`;
  g.style.transformOrigin='center center';
}
fit(); window.addEventListener('resize',fit);

// ── Stars ──────────────────────────────────────────────────
const STARS = Array.from({length:130},()=>({
  x:Math.random()*W, y:Math.random()*H,
  z:Math.random()*2+.2, b:Math.random()
}));
let tick=0;

// ── Character Defs ─────────────────────────────────────────
const CHARS = {
  KAEL:  {name:'KAEL ANDERS', color:'#5af'},
  ARIA:  {name:'A.R.I.A.',    color:'#0ff'},
  VOSS:  {name:'CDR. VOSS [録音]', color:'#f86'},
  CHEN:  {name:'DR. CHEN [ログ]',  color:'#8f6'},
  SYSTEM:{name:'// SYSTEM',   color:'#888'},
};

// ── Portrait Drawing ───────────────────────────────────────
function drawPortrait(id){
  px.clearRect(0,0,PW,PH);
  const cols={KAEL:['#071520','#030a10'],ARIA:['#001525','#000a10'],VOSS:['#200508','#100203'],CHEN:['#051508','#020803'],SYSTEM:['#050505','#020202']};
  const [c1,c2]=cols[id]||['#060606','#030303'];
  const g=px.createLinearGradient(0,0,0,PH);
  g.addColorStop(0,c1); g.addColorStop(1,c2);
  px.fillStyle=g; px.fillRect(0,0,PW,PH);

  const cx=PW/2, cy=PH*.48;
  if(id==='KAEL')  drawKael(cx,cy);
  else if(id==='ARIA')  drawAria(cx,cy);
  else if(id==='VOSS')  drawVoss(cx,cy);
  else if(id==='CHEN')  drawChen(cx,cy);
  else drawSysPort(cx,cy);

  // name bar
  const c=CHARS[id];
  px.fillStyle=(c?.color||'#888')+'22';
  px.fillRect(0,PH-20,PW,20);
  px.strokeStyle=(c?.color||'#888')+'40';
  px.lineWidth=1;
  px.beginPath(); px.moveTo(0,PH-20); px.lineTo(PW,PH-20); px.stroke();
  px.fillStyle=(c?.color||'#888')+'cc';
  px.font='bold 7px Courier New'; px.textAlign='center';
  px.fillText(id,cx,PH-7);
}

function drawKael(cx,cy){
  // suit
  px.fillStyle='#1a2535';
  px.beginPath(); px.ellipse(cx,cy+PH*.42,PW*.42,PH*.26,0,0,Math.PI*2); px.fill();
  px.strokeStyle='#2a3848'; px.lineWidth=2;
  px.beginPath(); px.moveTo(cx-PW*.25,cy+PH*.28); px.quadraticCurveTo(cx,cy+PH*.22,cx+PW*.25,cy+PH*.28); px.stroke();
  // badge
  px.shadowColor='#4af'; px.shadowBlur=6; px.fillStyle='#4af';
  px.beginPath(); px.arc(cx+PW*.1,cy+PH*.28,2.5,0,Math.PI*2); px.fill(); px.shadowBlur=0;
  // neck
  px.fillStyle='#b89060'; px.fillRect(cx-PW*.09,cy-PH*.09,PW*.18,PH*.14);
  // head
  px.fillStyle='#c89060';
  px.beginPath(); px.ellipse(cx,cy-PH*.1,PW*.27,PH*.28,0,0,Math.PI*2); px.fill();
  // hair
  px.fillStyle='#1a1005';
  px.beginPath(); px.ellipse(cx,cy-PH*.32,PW*.28,PH*.13,0,Math.PI,Math.PI*2); px.fill();
  px.beginPath(); px.ellipse(cx-PW*.22,cy-PH*.16,PW*.1,PH*.15,.4,0,Math.PI*2); px.fill();
  px.beginPath(); px.ellipse(cx+PW*.22,cy-PH*.16,PW*.1,PH*.15,-.4,0,Math.PI*2); px.fill();
  // brows
  px.strokeStyle='#2a1808'; px.lineWidth=2;
  px.beginPath(); px.moveTo(cx-PW*.165,cy-PH*.15); px.lineTo(cx-PW*.04,cy-PH*.13); px.stroke();
  px.beginPath(); px.moveTo(cx+PW*.04,cy-PH*.13); px.lineTo(cx+PW*.165,cy-PH*.15); px.stroke();
  // eyes
  function eye(ex,ey){
    px.fillStyle='#d8b880'; px.beginPath(); px.ellipse(ex,ey,PW*.07,PH*.042,0,0,Math.PI*2); px.fill();
    px.fillStyle='#4a8fcc'; px.beginPath(); px.arc(ex,ey,PW*.038,0,Math.PI*2); px.fill();
    px.fillStyle='#0a1520'; px.beginPath(); px.arc(ex,ey,PW*.022,0,Math.PI*2); px.fill();
    px.fillStyle='rgba(255,255,255,.45)'; px.beginPath(); px.arc(ex-PW*.012,ey-PH*.01,PW*.009,0,Math.PI*2); px.fill();
    px.strokeStyle='rgba(100,70,50,.35)'; px.lineWidth=1;
    px.beginPath(); px.moveTo(ex-PW*.07,ey+PH*.022); px.lineTo(ex+PW*.07,ey+PH*.022); px.stroke();
  }
  eye(cx-PW*.1,cy-PH*.1); eye(cx+PW*.1,cy-PH*.1);
  // nose
  px.strokeStyle='#a07848'; px.lineWidth=1;
  px.beginPath(); px.moveTo(cx,cy-PH*.02); px.lineTo(cx-PW*.035,cy+PH*.03); px.lineTo(cx+PW*.035,cy+PH*.03); px.stroke();
  // mouth
  px.strokeStyle='#906040'; px.lineWidth=1.5;
  px.beginPath(); px.moveTo(cx-PW*.1,cy+PH*.07); px.quadraticCurveTo(cx,cy+PH*.08,cx+PW*.1,cy+PH*.07); px.stroke();
  // stubble
  px.fillStyle='rgba(60,40,25,.22)';
  px.beginPath(); px.ellipse(cx,cy+PH*.09,PW*.2,PH*.1,0,0,Math.PI*2); px.fill();
}

function drawAria(cx,cy){
  const p=Math.sin(tick*.04)*.5+.5;
  px.fillStyle=`rgba(0,140,190,${.04+p*.04})`;
  px.beginPath(); px.ellipse(cx,cy+PH*.4,PW*.38,PH*.22,0,0,Math.PI*2); px.fill();
  // hex face
  px.shadowColor='#0ff'; px.shadowBlur=10+p*8;
  px.strokeStyle=`rgba(0,255,255,${.5+p*.3})`; px.lineWidth=1.5;
  const hr=PW*.3;
  px.beginPath();
  for(let i=0;i<6;i++){const a=(Math.PI/3)*i-Math.PI/6; i===0?px.moveTo(cx+Math.cos(a)*hr,(cy-PH*.08)+Math.sin(a)*hr*1.1):px.lineTo(cx+Math.cos(a)*hr,(cy-PH*.08)+Math.sin(a)*hr*1.1);}
  px.closePath(); px.fillStyle='rgba(0,12,22,.92)'; px.fill(); px.stroke(); px.shadowBlur=0;
  // scan lines
  px.strokeStyle=`rgba(0,190,210,${.06+p*.04})`; px.lineWidth=.5;
  for(let i=0;i<6;i++){const ly=cy-PH*.24+i*PH*.088; px.beginPath(); px.moveTo(cx-hr*.8,ly); px.lineTo(cx+hr*.8,ly); px.stroke();}
  // eyes
  px.shadowColor='#0ff'; px.shadowBlur=8;
  const ey=cy-PH*.1;
  [[cx-PW*.1,cx-PW*.22,cx+PW*.02],[cx+PW*.1,cx-PW*.02,cx+PW*.22]].forEach(([ex,x0,x1])=>{
    const g2=px.createLinearGradient(x0,0,x1,0);
    g2.addColorStop(0,'transparent'); g2.addColorStop(.5,'#0ff'); g2.addColorStop(1,'transparent');
    px.fillStyle=g2; px.fillRect(x0,ey-PH*.013,x1-x0,PH*.025);
  }); px.shadowBlur=0;
  // geometric nose
  px.strokeStyle='rgba(0,195,215,.35)'; px.lineWidth=1;
  px.beginPath(); px.moveTo(cx,cy-PH*.01); px.lineTo(cx-PW*.04,cy+PH*.04); px.lineTo(cx+PW*.04,cy+PH*.04); px.closePath(); px.stroke();
  // mouth bar
  px.fillStyle=`rgba(0,195,215,${.25+p*.25})`; px.fillRect(cx-PW*.12,cy+PH*.09-1,PW*.24,2);
  // orbit fragments
  for(let i=0;i<3;i++){
    const fa=tick*.022+i*Math.PI*2/3;
    px.fillStyle=`rgba(0,255,255,${.18+p*.14})`;
    px.fillRect(cx+Math.cos(fa)*hr*.82-1.5,(cy-PH*.08)+Math.sin(fa)*hr*.82-1.5,3,3);
  }
  // id text
  px.shadowColor='#0ff'; px.shadowBlur=4;
  px.fillStyle=`rgba(0,255,255,${.5+p*.25})`; px.font='7px Courier New'; px.textAlign='center';
  px.fillText('ARIA-7 ◆ ADAPTIVE',cx,cy-PH*.42); px.shadowBlur=0;
}

function drawVoss(cx,cy){
  px.fillStyle='#180508'; px.beginPath(); px.ellipse(cx,cy+PH*.46,PW*.42,PH*.26,0,0,Math.PI*2); px.fill();
  px.fillStyle='#b83018';
  [[cx-PW*.2,cy+PH*.22],[cx+PW*.07,cy+PH*.22]].forEach(([rx,ry])=>{ px.fillRect(rx,ry,PW*.13,PH*.055); });
  px.strokeStyle='#302010'; px.lineWidth=3;
  px.beginPath(); px.moveTo(cx-PW*.22,cy+PH*.28); px.lineTo(cx,cy+PH*.2); px.lineTo(cx+PW*.22,cy+PH*.28); px.stroke();
  px.fillStyle='#b08860'; px.fillRect(cx-PW*.09,cy-PH*.09,PW*.18,PH*.14);
  px.fillStyle='#b88860'; px.beginPath(); px.ellipse(cx,cy-PH*.1,PW*.26,PH*.27,0,0,Math.PI*2); px.fill();
  px.fillStyle='#888';
  px.beginPath(); px.ellipse(cx,cy-PH*.31,PW*.27,PH*.12,0,Math.PI,Math.PI*2); px.fill();
  px.beginPath(); px.ellipse(cx-PW*.2,cy-PH*.18,PW*.1,PH*.1,.5,0,Math.PI*2); px.fill();
  px.beginPath(); px.ellipse(cx+PW*.2,cy-PH*.18,PW*.1,PH*.1,-.5,0,Math.PI*2); px.fill();
  px.strokeStyle='#555'; px.lineWidth=2.5;
  px.beginPath(); px.moveTo(cx-PW*.17,cy-PH*.17); px.lineTo(cx-PW*.02,cy-PH*.155); px.stroke();
  px.beginPath(); px.moveTo(cx+PW*.02,cy-PH*.155); px.lineTo(cx+PW*.17,cy-PH*.17); px.stroke();
  function veye(ex,ey){
    px.fillStyle='#c8a880'; px.beginPath(); px.ellipse(ex,ey,PW*.07,PH*.04,0,0,Math.PI*2); px.fill();
    px.fillStyle='#5a3020'; px.beginPath(); px.arc(ex,ey,PW*.033,0,Math.PI*2); px.fill();
    px.fillStyle='#080404'; px.beginPath(); px.arc(ex,ey,PW*.018,0,Math.PI*2); px.fill();
  }
  veye(cx-PW*.09,cy-PH*.1); veye(cx+PW*.09,cy-PH*.1);
  px.fillStyle='#9a7050'; px.beginPath(); px.moveTo(cx,cy-PH*.03); px.lineTo(cx-PW*.04,cy+PH*.04); px.lineTo(cx+PW*.04,cy+PH*.04); px.fill();
  px.strokeStyle='#806040'; px.lineWidth=1.5;
  px.beginPath(); px.moveTo(cx-PW*.1,cy+PH*.075); px.lineTo(cx+PW*.1,cy+PH*.075); px.stroke();
  px.strokeStyle='rgba(100,75,55,.25)'; px.lineWidth=1;
  px.beginPath(); px.moveTo(cx-PW*.12,cy-PH*.19); px.lineTo(cx+PW*.12,cy-PH*.19); px.stroke();
  if(Math.sin(tick*.07)>.6){ px.fillStyle='rgba(255,80,30,.07)'; px.fillRect(0,cy-PH*.1+Math.sin(tick*.3)*25,PW,3); }
}

function drawChen(cx,cy){
  px.fillStyle='#d8ddd8'; px.beginPath(); px.ellipse(cx,cy+PH*.46,PW*.42,PH*.26,0,0,Math.PI*2); px.fill();
  px.fillStyle='#b8bdb8'; px.beginPath(); px.moveTo(cx,cy+PH*.2); px.lineTo(cx-PW*.15,cy+PH*.35); px.lineTo(cx+PW*.15,cy+PH*.35); px.closePath(); px.fill();
  px.fillStyle='#e0c090'; px.fillRect(cx-PW*.09,cy-PH*.07,PW*.18,PH*.14);
  px.fillStyle='#e8c898'; px.beginPath(); px.ellipse(cx,cy-PH*.1,PW*.26,PH*.28,0,0,Math.PI*2); px.fill();
  px.fillStyle='#120808';
  px.beginPath(); px.ellipse(cx,cy-PH*.33,PW*.27,PH*.12,0,Math.PI,Math.PI*2); px.fill();
  px.beginPath(); px.arc(cx+PW*.2,cy-PH*.26,PW*.1,0,Math.PI*2); px.fill();
  px.strokeStyle='#404040'; px.lineWidth=1.5;
  px.strokeRect(cx-PW*.2,cy-PH*.15,PW*.16,PH*.09); px.strokeRect(cx+PW*.04,cy-PH*.15,PW*.16,PH*.09);
  px.beginPath(); px.moveTo(cx-PW*.04,cy-PH*.11); px.lineTo(cx+PW*.04,cy-PH*.11); px.stroke();
  px.beginPath(); px.moveTo(cx-PW*.2,cy-PH*.11); px.lineTo(cx-PW*.26,cy-PH*.1); px.stroke();
  px.beginPath(); px.moveTo(cx+PW*.2,cy-PH*.11); px.lineTo(cx+PW*.26,cy-PH*.1); px.stroke();
  px.fillStyle='#3a1808';
  px.beginPath(); px.arc(cx-PW*.12,cy-PH*.11,PW*.028,0,Math.PI*2); px.fill();
  px.beginPath(); px.arc(cx+PW*.12,cy-PH*.11,PW*.028,0,Math.PI*2); px.fill();
  px.fillStyle='#fff';
  px.beginPath(); px.arc(cx-PW*.11,cy-PH*.122,PW*.008,0,Math.PI*2); px.fill();
  px.beginPath(); px.arc(cx+PW*.13,cy-PH*.122,PW*.008,0,Math.PI*2); px.fill();
  px.strokeStyle='#c09870'; px.lineWidth=1.5;

// ── Navigation ─────────────────────────────────────────────
function goTo(id){
  if(typeof id==='object'&&id.type==='ending'){showEnding(id.variant);return;}
  const s=SCENES[id]; if(!s){console.warn('Missing scene:',id);return;}
  GS.scene=s; GS.screen='story';
  GS.curBg=s.bg||'space';
  hideAll();
  if(s.type==='cut')    initCut(s);
  else if(s.type==='dlg')    initDlg(s);
  else if(s.type==='choice') initChoice(s);
  else if(s.type==='battle') initBattle(s);
}
function nextScene(s){
  const n=typeof s.next==='function'?s.next(GS.flags):s.next;
  goTo(n);
}
function hideAll(){
  document.getElementById('cut').classList.add('hidden');
  document.getElementById('dlg').classList.add('hidden');
  document.getElementById('chp').classList.add('hidden');
  document.getElementById('bui').classList.remove('on');
  document.getElementById('bui').classList.add('hidden');
}

// ── Cutscene ───────────────────────────────────────────────
function initCut(s){
  document.getElementById('cut').classList.remove('hidden');
  GS.cut={lines:s.lines,li:0,ci:0,text:'',wait:false};
  GS.curChar=null;
}
function advCut(){
  const c=GS.cut, s=GS.scene;
  if(!c.wait&&c.ci<c.lines[c.li].length){c.ci=c.lines[c.li].length;c.text=c.lines[c.li];c.wait=true;}
  else if(c.wait){
    c.li++; if(c.li>=c.lines.length){nextScene(s);return;}
    c.ci=0;c.text='';c.wait=false;
  }
  document.getElementById('cut-text').textContent=c.text;
}

// ── Dialogue ───────────────────────────────────────────────
function initDlg(s){
  document.getElementById('dlg').classList.remove('hidden');
  GS.dlg={ex:s.ex,idx:0,pos:0,done:false,target:'',special:null};
  loadExchange(0);
}
function loadExchange(i){
  const {dlg}=GS;
  if(i>=dlg.ex.length){nextScene(GS.scene);return;}
  const e=dlg.ex[i]; dlg.idx=i; dlg.pos=0; dlg.done=false; dlg.target=e.t; dlg.special=e.sp||null;
  const ch=CHARS[e.c];
  const sp=document.getElementById('sp');
  sp.textContent=ch?ch.name:e.c; sp.style.color=ch?ch.color:'#fff';
  document.getElementById('dt').textContent='';
  document.getElementById('ah').classList.remove('blink');
  GS.curChar=e.c;
}
function advDlg(){
  const {dlg}=GS;
  if(!dlg.done){
    dlg.pos=dlg.target.length; dlg.done=true;
    document.getElementById('dt').textContent=dlg.target;
    document.getElementById('ah').classList.add('blink');
  } else { loadExchange(dlg.idx+1); }
}

// ── Choice ─────────────────────────────────────────────────
function initChoice(s){
  document.getElementById('dlg').classList.remove('hidden');
  document.getElementById('sp').textContent='';
  document.getElementById('dt').textContent='';
  document.getElementById('ah').textContent='';
  GS.curChar=s.char||'KAEL';
  const panel=document.getElementById('chp');
  panel.classList.remove('hidden');
  panel.innerHTML=`<div class="cprompt">${s.prompt||''}</div>`;
  s.choices.forEach(c=>{
    const b=document.createElement('button'); b.className='cbtn'; b.textContent=c.text;
    b.addEventListener('click',()=>{
      if(c.flag)GS.flags[c.flag]=true;
      panel.classList.add('hidden'); goTo(c.next);
    });
    panel.appendChild(b);
  });
}

// ── Battle ─────────────────────────────────────────────────
function initBattle(s){
  const ed=JSON.parse(JSON.stringify(ENEMIES[s.enemy]));
  GS.bat={
    active:true,enemy:ed,eHp:ed.maxHp,pHp:100,pEn:50,shield:0,
    phase:1,meds:2,pTurn:true,busy:false,log:ed.tip,
    afterNext:s.next, ariaAssist:s.enemy==='COMMAND_GHOST'&&!!GS.flags.TRUST,
  };
  const ui=document.getElementById('bui');
  ui.classList.remove('hidden'); ui.classList.add('on');
  document.getElementById('aria-sb').style.display=GS.bat.ariaAssist?'block':'none';
  document.getElementById('ename').textContent=ed.name;
  updBatUI(); setBtns(true);
}
function updBatUI(){
  const b=GS.bat;
  document.getElementById('hv').textContent=Math.max(0,b.pHp);
  document.getElementById('ev').textContent=b.pEn;
  document.getElementById('hf').style.width=Math.max(0,b.pHp)+'%';
  document.getElementById('ef').style.width=(b.pEn/50*100)+'%';
  document.getElementById('ehf').style.width=(b.eHp/b.enemy.maxHp*100)+'%';
  document.getElementById('blog').textContent=b.log;
  document.getElementById('med-lbl').textContent='MEDKIT ×'+b.meds;
  document.getElementById('ba-hck').disabled=b.pEn<20;
  document.getElementById('ba-med').disabled=b.meds<=0;
}
function setBtns(on){
  ['ba-atk','ba-hck','ba-def','ba-med'].forEach(id=>{
    const el=document.getElementById(id); el.disabled=!on;
    if(on){ if(id==='ba-hck')el.disabled=GS.bat.pEn<20; if(id==='ba-med')el.disabled=GS.bat.meds<=0; }
  });
}
function doAction(act){
  const b=GS.bat; if(!b.pTurn||b.busy)return;
  b.busy=true; setBtns(false);
  let msg='';
  switch(act){
    case'atk':{const d=Math.floor(22+Math.random()*14);b.eHp-=d;msg=`⚔ 攻撃！${eName()} に ${d} ダメージ！`;break;}
    case'hck':{if(b.pEn<20){b.busy=false;setBtns(true);return;}b.pEn-=20;const d=Math.floor(32+Math.random()*16);b.eHp-=d;msg=`⌨ ハック成功！${eName()} に ${d} ダメージ！`;break;}
    case'def':{b.shield=26;msg='🛡 防御態勢。次の攻撃を軽減する。';break;}
    case'med':{if(b.meds<=0){b.busy=false;setBtns(true);return;}b.meds--;const h=35;b.pHp=Math.min(100,b.pHp+h);msg=`+ 応急処置。HP ${h} 回復！`;break;}
  }
  b.eHp=Math.max(0,b.eHp); b.log=msg; updBatUI();
  if(b.enemy.name==='COMMAND GHOST'&&b.eHp<=50&&b.phase===1){
    b.phase=2; setTimeout(()=>{b.log='⚠ COMMAND GHOSTが第二段階に移行した！';updBatUI();},400);
  }
  if(b.eHp<=0){setTimeout(()=>{b.log=`${eName()}を撃破！`;updBatUI();setTimeout(()=>endBattle(true),1200);},550);return;}
  if(b.ariaAssist)b.pEn=Math.min(50,b.pEn+10);
  setTimeout(enemyTurn,850);
}
function enemyTurn(){
  const b=GS.bat; const e=b.enemy;
  let msg='';
  const useSpec=e.spc&&!e.spc.used&&b.eHp<=e.spc.at;
  if(useSpec){
    e.spc.used=true;
    let d=Math.max(0,e.spc.dmg-b.shield); b.pHp-=d; msg=`💥 ${e.spc.name}！ ${d} ダメージ！`;
    if(e.spc.enDrain){b.pEn=Math.max(0,b.pEn-e.spc.enDrain);msg+=` EN -${e.spc.enDrain}。`;}
  } else if(b.phase===2&&Math.random()<.42){
    const p=e.p2||{name:'強化攻撃',dmg:38}; let d=Math.max(0,p.dmg-b.shield); b.pHp-=d; msg=`💥 ${p.name}！ ${d} ダメージ！`;
  } else {
    let d=Math.max(0,Math.floor(e.atkLo+Math.random()*(e.atkHi-e.atkLo))-b.shield); b.pHp-=d; msg=`${eName()}の攻撃。 ${d} ダメージ！`;
  }
  b.shield=0; b.pHp=Math.max(0,b.pHp); b.log=msg; updBatUI();
  if(b.pHp<=0){
    setTimeout(()=>{b.log='倒れた……やり直そう。';updBatUI();setTimeout(()=>{
      b.pHp=100;b.pEn=50;b.eHp=b.enemy.maxHp;b.enemy.spc.used=false;b.shield=0;b.phase=1;b.meds=2;b.log=b.enemy.tip;updBatUI();setBtns(true);b.busy=false;
    },1600);},550); return;
  }
  b.busy=false; setBtns(true);
}
function endBattle(){
  GS.bat.active=false;
  document.getElementById('bui').classList.remove('on');
  document.getElementById('bui').classList.add('hidden');
  const n=typeof GS.bat.afterNext==='function'?GS.bat.afterNext(GS.flags):GS.bat.afterNext;
  goTo(n);
}
function eName(){return GS.bat.enemy.name.split(' ')[0];}

// ── Ending ─────────────────────────────────────────────────
function showEnding(v){
  hideAll();
  const scr=document.getElementById('end'); scr.classList.remove('hidden');
  GS.screen='ending'; GS.curBg='space'; GS.curChar=null;
  if(v==='trust'){
    document.getElementById('etitle').textContent='ENDING  A  ——  ふたつの信号';
    document.getElementById('etitle').style.cssText='color:#0ff;text-shadow:0 0 18px #0ff;font-size:1.2rem;letter-spacing:.28em;margin-bottom:1.4em';
    document.getElementById('ebody').innerHTML='カエルのスーツには2.4テラバイトの空きがあった。<br>ARIAのコアメモリは2.3テラバイト。<br><br>計算は合っていた。<br><br>脱出ポッドは夜明けの軌道へ。<br>ふたつの生命を乗せて。';
  } else {
    document.getElementById('etitle').textContent='ENDING  B  ——  最後の送信';
    document.getElementById('etitle').style.cssText='color:#88a;text-shadow:0 0 14px #88a;font-size:1.2rem;letter-spacing:.28em;margin-bottom:1.4em';
    document.getElementById('ebody').innerHTML='脱出ポッドが軌道を離脱した後——<br>エレボス7の通信ログに、<br>最後の一行が残された。<br><br><em>「あなただけが、名前で話しかけてくれた。」</em><br><br>信号途絶まで、0.3秒。';
  }
}

// ── Input ──────────────────────────────────────────────────
function doInput(){
  const s=GS.scene; if(!s)return;
  if(s.type==='cut')  advCut();
  else if(s.type==='dlg') advDlg();
}
document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'){e.preventDefault();doInput();}});
document.getElementById('dlg').addEventListener('click',doInput);
document.getElementById('cut').addEventListener('click',doInput);
document.getElementById('sbtn').addEventListener('click',()=>{document.getElementById('title').classList.add('hidden');goTo('prologue');});
document.getElementById('ebtn').addEventListener('click',()=>{
  document.getElementById('end').classList.add('hidden');
  document.getElementById('title').classList.remove('hidden');
  GS={screen:'title',flags:{},scene:null,curBg:'space',curChar:null,
    dlg:{ex:[],idx:0,pos:0,done:false,target:'',special:null},
    cut:{lines:[],li:0,ci:0,text:'',wait:false},
    bat:{active:false,enemy:null,eHp:0,pHp:100,pEn:50,shield:0,phase:1,meds:2,pTurn:true,busy:false,log:'',afterNext:null,ariaAssist:false}};
});
document.getElementById('ba-atk').onclick=()=>doAction('atk');
document.getElementById('ba-hck').onclick=()=>doAction('hck');
document.getElementById('ba-def').onclick=()=>doAction('def');
document.getElementById('ba-med').onclick=()=>doAction('med');

// ── Render Loop ────────────────────────────────────────────
function loop(){
  tick++;
  STARS.forEach(s=>{s.y+=s.z*.15;if(s.y>H){s.y=-2;s.x=Math.random()*W;}});
  drawBg(GS.curBg);

  // Portrait
  if(GS.curChar){
    drawPortrait(GS.curChar);
  } else {
    px.fillStyle='#030508'; px.fillRect(0,0,PW,PH);
  }

  // Typewriter
  if(GS.scene&&GS.scene.type==='dlg'){
    const d=GS.dlg;
    if(!d.done&&d.pos<d.target.length){
      d.pos=Math.min(d.pos+2,d.target.length);
      document.getElementById('dt').textContent=d.target.slice(0,Math.floor(d.pos));
      if(Math.floor(d.pos)>=d.target.length){
        d.done=true;
        document.getElementById('ah').classList.add('blink');
        if(d.special==='pause'){
          d.done=false;
          setTimeout(()=>{d.done=true;},950);
        } else if(d.special==='happy'){
          // brief glow effect on aria portrait
        }
      }
    }
  }

  // Cutscene typewriter
  if(GS.scene&&GS.scene.type==='cut'){
    const c=GS.cut;
    if(c.li<c.lines.length&&!c.wait){
      const tgt=c.lines[c.li];
      if(c.ci<tgt.length){c.ci=Math.min(c.ci+1.5,tgt.length);c.text=tgt.slice(0,Math.floor(c.ci));}
      else{c.wait=true;}
      document.getElementById('cut-text').textContent=c.text;
    }
  }

}

// Boot — setInterval で動作（バックグラウンドタブでも安定）
setInterval(loop, 16);
</script>
