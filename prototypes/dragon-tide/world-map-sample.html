<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dragon Tide 世界図</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&display=swap" rel="stylesheet">
<!--
  DT-574（全体サイクル案B）の「世界地図」の部分だけを試すサンプル（地域だけの見本）。
  12回目（11/24・DT-610）：ゲーム本体（index.html の WORLD_MAP）に入れた。このページはデバッグ版のオプション「世界図の見本（地域だけ）」から開く。
  小惑星帯の説明を「首都を宇宙に移して宇宙から支配している」に直した。世界の決まりを変えるときは index.html の WORLD_MAP と両方を直す。
  13回目（v3.218.0・案帳 DT-034）：ゲームに新しく足した地域「星形の巨城」を土台の地域に足した（土台の17地域から8つ引く）。
  ステージは遊ばず、選んだ地域は即クリア扱い。決めてほしいこと①〜④はすべて案のおすすめで入れている:
   ① 地図の形は固定（8区画）・中身（どの区画にどの地域・何の時代）はランのシードで引く。
      最初の数ラン用の「はじまりの世界」（中身も固定）も、下の「サンプルの設定」で試せる。
   ② 選べるのは焼け跡に接する区画だけ（接する区画が2つ未満なら全区画から）。最初は卵を奪った文明（時代I）だけ。
   ③ 最初の区画は8つ。
   ④ 特殊な地域に変わる表は案のとおり（SPECIAL_RULES）。
  2回目（11/20 手直し）：
   ・ひと目で地図と分かる絵にした（古地図の羊皮紙・揺れた海岸線・波・方位・地域ごとの地形の記号・地名）。
   ・「手番」「残り○区画」「世界の出来事」のようなストラテジーの言葉と画面全体の記録をやめた。
     育った・併合した・変わった、は地域を選んだときの説明（フレーバーテキスト）にまとめる。地図では光るだけ。
   ・時代は数字で出さず、首都のまわりの街並み（小屋→家→塔→煙突→摩天楼）で見せる。
  3回目（11/22 手直し）：
   ・最初のステージ（卵を奪った国）は地図で選ばない。落とした後の地図から始める。
   ・攻略を「焼く」と言わない（攻める・滅ぼす・廃墟）。選べない国の名前は地図に出さない。
   ・竜が滅ぼした土地（廃墟）は、次の回から1回に1区画ずつ、接している生き残った国が併合する。
   ・英字の時代名をやめ、地域ごとの言い方（例：大樹海なら「樹上の砦」）にした。
   ・説明文（物語の声）と操作の案内を分け、案内は地図の下の別の欄に出す。竜の印を上から見た竜の形にした。
  4回目（11/22 2回目の手直し）：
   ・カードの見出しの下に、薄い英字の時代名を戻した（文中には出さない）。難しさの星（時代 I〜VIII ＝ 星1〜8）を足した。
   ・攻め込めない国もタップで説明文を出す（「まだ攻め込めない」のボタンは押せない）。地図に名前は出さないまま。
   ・攻め込めない国では首都の赤い二重丸を出さない（選べる印に見えるため）。
  5回目（11/22 4回目の手直し）：廃墟は竜のいる1区画だけ。いくつもの区画を持つ国を滅ぼしたら残りの区画は接する国が併合。大きい国は時代も上がる。
  6回目（11/22 5回目の手直し）：竜のいる区画は首都の区画ではなく、滅ぼした国の区画のうち前に竜がいた区画の隣（飛んだように見えないように）。
  7回目（11/22 6回目の手直し・Shooter「初期状態を固定にして、もう少しだけマップを広くした上で、進化の元になる基本の地域をいくつか足して、
       攻略の仕方によって様々な地域が出てくるように」「地図の形状はもう少しだけ本当の地図に寄せて。表現の仕方はそのまま」）：
   ・初期状態は1つに固定（FIXED_WORLD）。シードで中身を引くのと「はじまりの世界」の切り替えはやめた。
   ・地図を 8区画 → 11区画 に。北の海岸・西の入り江・南東の半島のある、本物の地図に近い形にした（描き方は前のまま）。
   ・基本の地域に「四方の祠の結界」「宿借りの浜」を足した（ゲーム本体の地域。11区画に土台の11地域を1つずつ置く）。
   ・変わって出てくる地域に「光線の塔が立つ高原」「雲海に浮かぶ浮き城の空」「英雄が守る王国」「剣の道の国」を足した。
   ・世界の動きから運（乱数）を抜いた。同じ順番で攻めれば必ず同じ世界になり、違いは攻める順番だけから生まれる：
     ・時代で変わる地域は、その国を早く滅ぼせば出ず、残せば出る
     ・廃墟は、接している国のうち時代の高い国が取り（時代 +1）、時代が下の隣の国を呑む（1回に1つまで。呑むとさらに +1）
     ・どの国に廃墟を取らせるか＝どこを攻めるかで、呑む国・呑まれる国が決まり、呑んで変わる地域が出るかどうかが決まる
  8回目（11/23 手直し・Shooter「広がり方は前の方が良かったので島のサイズを戻す」「マップはランダムで、島の形もランダムに。
       いくつかのテンプレートで」「巨岩→光線など無理のある変化はやめ、一部は変化元になる地域自体を新しく足す」）：
   ・区画は 11 → 8 に戻した（地図の大きさも 360×300 に）。
   ・地図の形は5つのテンプレート（MAP_TEMPLATES）からシードで引き、左右の反転・頂点の揺らし・海岸線の揺れもシードで変える。
     どの区画にどの地域が来るか・卵を奪った国もシードで引く（土台の15地域から8つ）。シードは欄と ?seed= で指定できる。
   ・世界の動き（育つ・廃墟を取る・呑む）は7回目のまま運を使わない。違いは「シードで引いた世界」と「攻める順番」から生まれる。
   ・変わる表を見直した（SPECIAL_RULES）：巨岩を拝む荒地→光線の塔、四方の祠の結界→浮き城、平原→英雄の王国、英雄の王国→剣の道 はやめ、
     英雄が守る王国・剣の道の国は土台の地域にした。光線の塔と浮き城には、変わる元の地域を新しく足した：
     「烽火の連なる丘陵」（時代 VI で 光線の塔が立つ高原 に）・「雲を突く峰の国」（時代 VI で 雲海に浮かぶ浮き城の空 に）。
     漂う岩塊の小惑星帯は 浮き城の空／車列の流れる大都会 が時代 VIII に達すると出る。
  9回目（11/23 手直し・Shooter「軌道を大都会の変化先にするのはやめる。鉱山をテーマにした地域を作ってそれの変化先に」
       「図形的な地図はジオラマ感が薄れるので、リアリティのある形に。内海を囲む環の島と横に広い大陸だけ残す」）：
   ・車列の流れる大都会 が隣を呑むと 無人列車の走る軌道、をやめた。新しく土台の地域「トロッコの走る鉱山の谷」を足し、
     それが時代 V（工業の時代）に達すると 無人列車の走る軌道 に変わる（トロッコの線路が国じゅうに延び、人の乗らない列車が走り出す）。
   ・地図のひな形は「横に広い大陸」と「内海を囲む環の島」の2つだけにした。どちらも格子・扇形の形をやめ、
     半島・湾・入り江のある形にした。海岸線は中点をずらしていく描き方（フラクタル）で、本物の海岸のように細かく入り組ませる。
     環の島は、内海の形・島の太さ・外の海岸の出っ張りをシードで変える。
   ・巨岩を拝む荒地 の工業の時代の暮らしぶりにあった「鉱山」の言葉は、鉱山の谷と紛れるので「石切り」に替えた。
  10回目（11/23 手直し・Shooter「内海を囲む環の島と横に広い大陸だけ採用で、あとはリテイク」。別案B は破棄）：
   ・9回目で没にした3つのひな形（三日月の島・地峡でつながる二つの島・斜めにのびる島）を、横に広い大陸と同じ作り方
     （海岸の頂点を1つずつ置いて半島・湾・入り江を描き、国境の交わる点を内陸に置く）で作り直して戻した。
     弓なりの島（三日月の島の作り直し）・地峡でつながる二つの大陸（地峡でつながる二つの島の作り直し）・斜めにのびる島。
     扇形・格子で区画を切るのはやめた。ひな形は5つ（採用の2つ＋作り直しの3つ）。描き方（古地図の線画）は変えていない。
  11回目（11/23 手直し・Shooter「環の島と弓なりの島はやはり没で、代わりに別の形の案を」「地域の隣接具合が固定されすぎていてまずい」
       「弓なりの方はマップが端に寄っているのも良くない」）：
   ・内海を囲む環の島（どの国も両隣としか接しない輪）と弓なりの島（一本の帯で、地図の上の端に寄る）を外した。
   ・新しい形を2つ足した：縦に長い大陸（地図の真ん中を北から南へ。国が2列に並ぶ）・丸みのある大きな島（地図の真ん中にまとまり、海に面さない国が1〜2つ）。
   ・国境の引き方（区画の分け方）を、どのひな形にも2通り用意し、シードで引く。同じ形でも、どの国とどの国が接するかがランごとに変わる。
     ひな形は5つ（横に広い大陸・地峡でつながる二つの大陸・斜めにのびる島・縦に長い大陸・丸みのある大きな島）×国境の引き方2通り×左右の反転。
  乱数は決定性を守るため makeRandomGenerator（mulberry32）だけを使う。ブラウザ任せの乱数は使わない。
-->
<style>
:root {
  --page: #14110d;
  --panel: #f1e4c4;
  --panel-ink: #3a2a18;
  --panel-dim: #7a6448;
  --panel-edge: #b89a68;
  --button: #b8321f;
  --button-ink: #fff6e6;
  --button-off: #cbb894;
  --ink-light: #e8dcc0;
}
:root[data-theme="light"] { color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; } }
:root[data-theme="dark"] { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: radial-gradient(ellipse at 50% 20%, #2a2118 0%, var(--page) 70%);
  background-color: var(--page);
  min-height: 100vh;
  color: var(--ink-light);
  font-family: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  -webkit-tap-highlight-color: transparent;
}
.app { max-width: 560px; margin: 0 auto; padding: 10px 16px 36px; }
.map-wrap {
  position: relative; border-radius: 6px; overflow: hidden;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 0 1px #4a3a26;
}
svg#map { display: block; width: 100%; height: auto; touch-action: manipulation; user-select: none; }
.cell { cursor: pointer; }
@keyframes flash { 0% { filter: brightness(1.9) saturate(1.4); } 100% { filter: none; } }
.flash { animation: flash 1.8s ease-out 1; }
@keyframes dash { to { stroke-dashoffset: -18; } }
.choosable { animation: dash 1.2s linear infinite; }
@keyframes flicker { 0%, 100% { opacity: 0.9; } 50% { opacity: 0.45; } }
.ember { animation: flicker 1.6s ease-in-out infinite; }
@keyframes drift { 0% { transform: translate(0, 0); } 50% { transform: translate(3px, -2px); } 100% { transform: translate(0, 0); } }
.flock { animation: drift 3s ease-in-out infinite; }
@keyframes flap { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(0.72); } }
.wings { animation: flap 0.9s ease-in-out infinite; transform-box: view-box; transform-origin: 0 0; }
@keyframes rise { 0% { opacity: 0; transform: translateY(0); } 30% { opacity: 0.5; } 100% { opacity: 0; transform: translateY(-14px); } }
.smoke { animation: rise 4s ease-out infinite; }
.card {
  position: relative; margin-top: 14px; padding: 16px 18px 18px; border-radius: 4px;
  background: var(--panel); color: var(--panel-ink); min-height: 150px;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5), inset 0 0 40px rgba(120, 80, 30, 0.25);
  border: 1px solid var(--panel-edge);
}
.card[hidden] { display: none; }
.guide {
  margin-top: 12px; padding: 10px 12px; border-radius: 6px; border: 1px dashed #6a5638;
  font-family: system-ui, -apple-system, sans-serif; font-size: 14px; line-height: 1.6; color: #cdbf9f; background: rgba(0, 0, 0, 0.25);
}
.guide[hidden] { display: none; }
.card .hint { color: var(--panel-dim); font-size: 16px; line-height: 1.8; text-align: center; padding-top: 30px; }
.card h2 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: 0.04em; }
.card .era { font-size: 13px; color: var(--panel-dim); letter-spacing: 0.12em; margin: 2px 0 4px; }
.card .stars { font-size: 15px; color: #b8321f; letter-spacing: 0.08em; margin: 0 0 10px; }
.card .stars .off { color: #cdb88e; }
.card .stars .label { font-size: 12px; color: var(--panel-dim); letter-spacing: 0.1em; margin-right: 6px; vertical-align: 1px; }
.card .flavor { font-size: 16px; line-height: 1.9; margin: 0 0 14px; }
.card .flavor p { margin: 0 0 6px; }
.attack {
  width: 100%; height: 54px; border: none; border-radius: 4px; font-family: inherit;
  font-size: 19px; font-weight: 700; letter-spacing: 0.08em;
  background: linear-gradient(#c83c25, #9a2814); color: var(--button-ink); cursor: pointer;
  box-shadow: 0 3px 0 #5e1608;
}
.attack:disabled { background: var(--button-off); color: #6e5a3e; box-shadow: none; cursor: default; font-size: 16px; font-weight: 500; }
.row { display: flex; gap: 8px; }
.row .attack { flex: 1; font-size: 15px; letter-spacing: 0; }
.attack.secondary { background: linear-gradient(#6d5636, #4e3c24); box-shadow: 0 3px 0 #2c2112; }
.done-title { font-size: 26px; font-weight: 800; margin: 0 0 8px; text-align: center; }
details.settings { margin-top: 22px; font-family: system-ui, sans-serif; color: #9a8c74; font-size: 13px; }
details.settings summary { cursor: pointer; padding: 6px 0; }
.settings .controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
.settings input {
  width: 80px; height: 40px; padding: 0 8px; border-radius: 6px; font-size: 16px;
  border: 1px solid #4a3a26; background: #221b13; color: var(--ink-light);
}
.settings input:disabled { opacity: 0.5; }
.btn-small {
  height: 40px; padding: 0 10px; border-radius: 6px; border: 1px solid #4a3a26;
  background: #221b13; color: var(--ink-light); font-size: 13px; cursor: pointer;
}
.btn-small[aria-pressed="true"] { background: #4e3c24; border-color: #a8874e; }
.settings .note { margin-top: 8px; line-height: 1.6; }
</style>
</head>
<body>
<div class="app">
  <div class="map-wrap"><svg id="map" viewBox="0 0 360 300" aria-label="世界図"></svg></div>
  <div class="guide" id="guide"></div>
  <div class="card" id="card" hidden></div>
  <details class="settings">
    <summary>サンプルの設定</summary>
    <div class="controls">
      <input id="seedInput" inputmode="numeric" aria-label="シード">
      <button class="btn-small" id="newWorldButton">新しい世界</button>
      <button class="btn-small" id="retryButton">やり直す</button>
      <button class="btn-small" id="mergeButton" aria-pressed="false">呑み合いを多く</button>
    </div>
    <div class="note" id="templateNote"></div>
    <div class="note">数字はランのシード（URL の ?seed= でも指定できます）。シードで地図の形（5つのひな形・左右の向き・海岸線の入り組み方）と、どこにどの国があるかが決まります。世界の動きに運はなく、同じシードで同じ順番に攻めれば同じ世界になります。ふだんは時代が2つ以上離れた隣の国だけを呑みます。「呑み合いを多く」は、時代が1つでも上なら隣の国を呑む決まりに切り替えます（前の版の既定。ステージが短くなり、世界が大きく動きます）。地図は最初のステージ（竜の卵を奪った国）を落とした後から始まります。国をタップして「この国を攻める」を押すと、その国は即クリアになります。</div>
  </details>
</div>
<script>
"use strict";

// ---------------------------------------------------------------
// 表示文字（prototypes の単一HTMLはインライン辞書可。本制作では locales/ へ抽出）
// 地域名は index.html の STRINGS.shapeNames と同じ正式名称。時代の名前は STAGE_CONFIGS の name
// ただし continent（index.html では「大陸」）は、世界地図の1区画を「大陸」と呼ぶと地図と食い違うので、
// このサンプルでは仮に「町の散らばる平原」と呼ぶ（11/22 4回目の手直し。名前は Shooter に選んでもらう）
// ---------------------------------------------------------------
const STRINGS = {
  regionNames: {
    continent: "町の散らばる平原", riverline: "大河の線状都市", citadel: "同心円の城塞都市", frontline: "長城の防衛線",
    forest: "森に覆われた大樹海", badlands: "巨岩を拝む荒地", serpent: "蛇神を祀る密林の国",
    mushroom: "増えるキノコの里", flower: "竜食い花の園",
    metro: "車列の流れる大都会", railway: "無人列車の走る軌道", bomb: "爆弾玉の国", asteroids: "漂う岩塊の小惑星帯",
    // 7回目で足した地域（名前は index.html の STRINGS.shapeNames と同じ）
    sanctuary: "四方の祠の結界", beach: "宿借りの浜",
    plateau: "光線の塔が立つ高原", skyland: "雲海に浮かぶ浮き城の空", heroland: "英雄が守る王国", swordway: "剣の道の国",
    // 8回目で新しく足した地域（ゲーム本体にはまだ無い。光線の塔・浮き城に変わる元）
    beacon: "烽火の連なる丘陵", peaks: "雲を突く峰の国",
    // 9回目で新しく足した地域（ゲーム本体にはまだ無い。無人列車の走る軌道に変わる元）
    mine: "トロッコの走る鉱山の谷",
    // 13回目（v3.218.0・案帳 DT-034）で足した地域
    starfort: "星形の巨城",
  },
  // 地図に書く地名（区画に収まる短さ）
  mapLabels: {
    continent: "平原", riverline: "大河", citadel: "城塞都市", frontline: "長城", forest: "大樹海", badlands: "荒地",
    serpent: "蛇神の密林", mushroom: "キノコの里", flower: "花の園", metro: "大都会", railway: "軌道", bomb: "爆弾玉の国", asteroids: "小惑星帯",
    sanctuary: "祠の結界", beach: "宿借りの浜", plateau: "光線の高原", skyland: "浮き城", heroland: "英雄の王国", swordway: "剣の道",
    beacon: "烽火の丘", peaks: "峰の国", mine: "鉱山の谷", starfort: "星形の巨城",
  },
  // 地図のひな形の名前（サンプルの設定に出すだけ）
  templateNames: { broad: "横に広い大陸", isthmus: "地峡でつながる二つの大陸", slant: "斜めにのびる島", tall: "縦に長い大陸", round: "丸みのある大きな島" },
  templateNote: (name, partition, mirrored) => `この世界の形：${name}・国境の引き方 ${partition}${mirrored ? "（左右反転）" : ""}`,

// ---------------------------------------------------------------
// 決まった擬似乱数（mulberry32）。同じシード・同じ選び方なら同じ世界になる
// ---------------------------------------------------------------
function makeRandomGenerator(seedValue) {
  let state = seedValue >>> 0;
  return function next() {
    state = (state + 0x6D2B79F5) >>> 0;
    let t = state;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function mixSeed(a, b) {
  let h = (a ^ Math.imul(b + 0x9E3779B9, 0x85EBCA6B)) >>> 0;
  h = Math.imul(h ^ (h >>> 16), 0x7FEB352D) >>> 0;
  h = Math.imul(h ^ (h >>> 15), 0x846CA68B) >>> 0;
  return (h ^ (h >>> 16)) >>> 0;
}
function pickIndex(random, count) { return Math.min(count - 1, Math.floor(random() * count)); }
function shuffled(list, random) {
  const out = list.slice();
  for (let i = out.length - 1; i > 0; i--) {
    const j = pickIndex(random, i + 1);
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}

// 海岸の折れ線の各区間を、中点をずらしながら細かく割る（端の点は動かさないので、隣の国境とずれない）
function fractalCoast(points, random) {
  let line = points;
  for (let level = 0; level < LOOK.coastFractalLevels; level++) {
    const next = [line[0]];
    for (let i = 1; i < line.length; i++) {
      const [a, b] = [line[i - 1], line[i]];
      const length = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
      const offset = length * LOOK.coastRoughness * (random() - 0.5) * 2;
      next.push([(a[0] + b[0]) / 2 - ((b[1] - a[1]) / length) * offset, (a[1] + b[1]) / 2 + ((b[0] - a[0]) / length) * offset], b);
    }
    line = next;
  }
  return line;
}
function pathOf(points, closed) {
  return points.map((p, i) => `${i === 0 ? "M" : "L"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join("") + (closed ? "Z" : "");
}
function pointInPolygon(point, polygon) {
  let inside = false;
  for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
    const [xi, yi] = polygon[i], [xj, yj] = polygon[j];
    if ((yi > point[1]) !== (yj > point[1]) && point[0] < ((xj - xi) * (point[1] - yi)) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}

  });
  EDGES = [...byKey.values()];
  CELL_NEIGHBORS = MAP_CELLS.map((_, cellIndex) => {
    const set = new Set();
    EDGES.forEach((edge) => {
      if (edge.cells.length === 2 && edge.cells.includes(cellIndex)) set.add(edge.cells.find((c) => c !== cellIndex));
    });
    return set;
  });
  CELL_CENTERS = MAP_CELLS.map((cell) => {
    const sum = cell.reduce((acc, v) => [acc[0] + MAP_VERTICES[v][0], acc[1] + MAP_VERTICES[v][1]], [0, 0]);
    return [sum[0] / cell.length, sum[1] / cell.length];
  });
  // 辺を揺らした折れ線にする（海岸は大きく、国境は小さく）。辺ごとに決まった形なので、両側の区画でぴったり重なる。
  // 8回目：揺れ方もシードで変える（島の形がランごとに変わる）
  EDGE_LINES = new Map(EDGES.map((edge) => {
    const coast = edge.cells.length === 1;
    const steps = coast ? LOOK.coastSteps : LOOK.innerSteps;
    const edgeRandom = makeRandomGenerator(mixSeed(edge.a * 31 + edge.b, seed ^ 0xC0A57));
    const [p, q] = [MAP_VERTICES[edge.a], MAP_VERTICES[edge.b]];
    const length = Math.hypot(q[0] - p[0], q[1] - p[1]);
    const amplitude = Math.min(coast ? LOOK.coastWobble : LOOK.innerWobble, length * LOOK.wobblePerLength);
    const normal = [-(q[1] - p[1]) / length, (q[0] - p[0]) / length];
    const phaseA = edgeRandom() * Math.PI * 2, phaseB = edgeRandom() * Math.PI * 2;
    const points = [];
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const envelope = Math.sin(Math.PI * t);
      const offset = (i === 0 || i === steps) ? 0
        : amplitude * envelope * (0.6 * Math.sin(phaseA + t * 7) + 0.4 * Math.sin(phaseB + t * 17) + (edgeRandom() - 0.5) * 0.5);
      points.push([p[0] + (q[0] - p[0]) * t + normal[0] * offset, p[1] + (q[1] - p[1]) * t + normal[1] * offset]);
    }
    // 9回目：海岸は中点をずらしていく描き方（フラクタル）で細かく入り組ませ、本物の海岸のように見せる
    return [edge.key, coast ? fractalCoast(points, edgeRandom) : points];
  }));
  CELL_OUTLINES = MAP_CELLS.map((cell) => {
    const out = [];
    cell.forEach((vertex, i) => {
      const other = cell[(i + 1) % cell.length];
      const key = vertex < other ? `${vertex}-${other}` : `${other}-${vertex}`;
      const line = vertex < other ? EDGE_LINES.get(key) : EDGE_LINES.get(key).slice().reverse();
      out.push(...line.slice(0, -1));
    });
    return out;
  });
  // 区画の中で、首都と地名をよけた飾りの置き場
  CELL_SPOTS = MAP_CELLS.map((cell, cellIndex) => {
    const spotRandom = makeRandomGenerator(mixSeed(cellIndex + 3, seed ^ 0x5907));
    const [cx, cy] = CELL_CENTERS[cellIndex];
    const base = CELL_OUTLINES[cellIndex].map(([x, y]) => [cx + (x - cx) * 0.8, cy + (y - cy) * 0.8]);
    const spots = [];
    for (let tries = 0; tries < 500 && spots.length < 14; tries++) {
      const point = [cx + (spotRandom() - 0.5) * 130, cy + (spotRandom() - 0.5) * 100];
      if (!pointInPolygon(point, base)) continue;
      const dx = point[0] - cx, dy = point[1] - cy;
      if (Math.abs(dx) < 34 && dy > -24 && dy < 14) continue;   // 首都の街並みと地名
      if (spots.some((s) => Math.hypot(s[0] - point[0], s[1] - point[1]) < 11)) continue;
      spots.push(point);
    }
    return spots;
  });
  // 方位は陸からいちばん離れた隅に、小島は陸から離れた海に（ひな形ごとに海の場所が違うため）
  const coastPoints = CELL_OUTLINES.flat();
  const distanceToLand = ([x, y]) => Math.min(...coastPoints.map(([px, py]) => Math.hypot(px - x, py - y)))
    * (MAP_CELLS.some((_, c) => pointInPolygon([x, y], CELL_OUTLINES[c])) ? -1 : 1);
  const corners = [[38, 262], [MAP_W - 38, 262], [38, 44], [MAP_W - 38, 44]];
  const compass = corners.slice().sort((a, b) => distanceToLand(b) - distanceToLand(a))[0];
  const islands = [];
  for (let tries = 0; tries < 300 && islands.length < 4; tries++) {
    const point = [24 + random() * (MAP_W - 48), 30 + random() * (MAP_H - 50)];
    if (distanceToLand(point) < 16) continue;
    if (Math.hypot(point[0] - compass[0], point[1] - compass[1]) < 34) continue;
    if (islands.some((i) => Math.hypot(i[0] - point[0], i[1] - point[1]) < 40)) continue;
    islands.push([point[0], point[1], 0.7 + random() * 0.6]);
  }
  MAP_DECOR = { compass, islands };
}

// ---------------------------------------------------------------
// 世界の状態
//   regions: 生きている地域（cells が複数＝併合で広がった）
//   cellOwner[c]: その区画を持つ地域の id、焼け跡なら null
//   region.story: その国に起きたこと（地域を選んだときの説明に使う。地図には出さない）
// ---------------------------------------------------------------
let world = null;
let selectedRegionId = null;
let selectedBurnedCell = null;

function regionName(region) { return STRINGS.regionNames[region]; }

// 8回目：どこにどの地域があるか・卵を奪った国をシードで引く。変わる元の地域は少なくとも minChangeSources 個
function rollLayout(seed) {
  const random = makeRandomGenerator(mixSeed(seed, 0xA11CE));
  const sources = shuffled(CHANGE_SOURCES, random);
  const picked = sources.slice(0, WORLD_RULES.minChangeSources);
  const rest = shuffled(BASE_REGIONS.filter((key) => !picked.includes(key)), random);
  const regions = shuffled(picked.concat(rest.slice(0, MAP_CELLS.length - picked.length)), random);
  const layout = regions.map((region) => ({ region, era: WORLD_RULES.startEra }));
  const eggCell = pickIndex(random, layout.length);
  layout[eggCell].egg = true;
  layout[eggCell].era = WORLD_RULES.eggEra;
  return layout;
}

function createWorld(seed) {
  buildGeometry(seed);
  const state = {
    seed, turn: 1, regions: [], cellOwner: [], burned: new Set(), burnedNames: [], usedRegions: new Set(),
    history: [], unclaimed: [], merges: 0, specials: 0, done: false, flashIds: new Set(), eggRegionId: null, eggRegion: null, lastBurnedCell: null,
    ruinTurn: [],
  };
  rollLayout(seed).forEach((entry, cellIndex) => {
    const region = {
      id: cellIndex, region: entry.region, era: entry.era, startEra: entry.era, cells: [cellIndex], capitalCell: cellIndex,
      story: [], absorbedRealms: 0,
    };
    state.regions.push(region);
    state.cellOwner[cellIndex] = region.id;
    state.usedRegions.add(entry.region);
    if (entry.egg) state.eggRegionId = region.id;
  });
  return state;
}
function regionById(id) { return world.regions.find((r) => r.id === id) || null; }

function neighborRegionIds(region) {
  const ids = new Set();
  region.cells.forEach((c) => CELL_NEIGHBORS[c].forEach((n) => {
    const owner = world.cellOwner[n];
    if (owner !== null && owner !== region.id) ids.add(owner);
  }));
  return ids;
}

// ② 選べるのは焼け跡に接する地域だけ。2つ未満なら全部から。最初は卵を奪った文明だけ
function choosableIds() {
  if (world.done) return new Set();
  if (world.turn === 1 && world.eggRegionId !== null) return new Set([world.eggRegionId]);
  const touching = world.regions.filter((r) => r.cells.some((c) => [...CELL_NEIGHBORS[c]].some((n) => world.burned.has(n))));
  if (touching.length < WORLD_RULES.minChoices) return new Set(world.regions.map((r) => r.id));
  return new Set(touching.map((r) => r.id));
}

function nextUnused(candidates) {
  return candidates.find((c) => !world.usedRegions.has(c)) || null;
}

function changeRegion(region, toRegion) {
  region.region = toRegion;
  world.usedRegions.add(toRegion);
  world.specials += 1;
  world.flashIds.add(region.id);
}

// 竜が次にいる区画：前に竜がいた区画の隣にある、滅ぼした国の区画。
// 隣が複数なら前の区画に中心の近い方（同じ近さなら番号の小さい方）。
// 最初の回や、隣に区画が無い国（選べる国が2つ未満で全部から選んだとき）は、前の区画にいちばん近い区画。
// 前の区画が無い最初の回は首都の区画
function dragonLandingCell(region) {
  const from = world.lastBurnedCell;
  if (from === null) return region.capitalCell;
  const distance = (c) => Math.hypot(CELL_CENTERS[c][0] - CELL_CENTERS[from][0], CELL_CENTERS[c][1] - CELL_CENTERS[from][1]);
  const adjacent = region.cells.filter((c) => CELL_NEIGHBORS[from].has(c));
  const pool = adjacent.length > 0 ? adjacent : region.cells;
  return pool.slice().sort((a, b) => distance(a) - distance(b) || a - b)[0];
}

// 選んだ地域は即クリア → 焼け跡にして、世界の時計を1つ進める
function destroyRegion(regionId) {
  const region = regionById(regionId);
  if (!region || !choosableIds().has(regionId)) return;
  const playedTurn = world.turn;
  world.flashIds = new Set();
  // 廃墟は竜のいる1区画だけ（11/22 4回目の手直し）。
  // 竜のいる区画は、滅ぼした国の区画のうち「前に竜がいた区画の隣」（11/22 5回目の手直し）。
  // 首都の区画はゲームに絡まない便宜上の区画なので、そこへ移すと竜が飛んだように見えるため。
  // 前の廃墟と、滅ぼした国のほかの区画は、この回の世界の時計で生き残った国が併合する
  const ruinCell = dragonLandingCell(region);
  world.unclaimed = [...world.burned].concat(region.cells.filter((c) => c !== ruinCell));
  region.cells.forEach((c) => { world.cellOwner[c] = null; });
  world.burned = new Set([ruinCell]);
  world.burnedNames[ruinCell] = region.region;
  world.ruinTurn[ruinCell] = playedTurn;
  if (regionId === world.eggRegionId) world.eggRegion = region.region;
  world.lastBurnedCell = ruinCell;
  world.regions = world.regions.filter((r) => r.id !== regionId);
  world.history.push({ turn: playedTurn, region: region.region, era: region.era, cells: region.cells.length });
  selectedRegionId = null;
  selectedBurnedCell = null;
  if (world.regions.length === 0) {
    // 最後の国まで滅ぼしたら、残りの地も全部廃墟のまま
    world.unclaimed.forEach((c) => { world.burned.add(c); if (!world.burnedNames[c]) world.burnedNames[c] = region.region; });
    world.unclaimed = [];
    world.done = true;
    return;
  }
  advanceWorldClock(playedTurn, region.region);
  world.turn = playedTurn + 1;
}

function advanceWorldClock(playedTurn, burnedRegion) {
  // 7回目：乱数を使わない。同じ順番で攻めれば、いつも同じ世界になる
  // world.turn は 1 から数えるので、この回を含めた「滅ぼした数」は playedTurn そのもの（DT-610 11/24：
  // 前は +1 が重なって上限が1つ先へずれ、2ステージ目の国が時代 III になっていた）
  const eraCap = Math.min(WORLD_RULES.maxEra, playedTurn + WORLD_RULES.eraAheadOfTurn);
  // 大きい国ほど先の時代まで育てる（区画1つにつき +1、最大 +2）
  const capOf = (r) => Math.min(WORLD_RULES.maxEra,
    eraCap + Math.min(WORLD_RULES.eraLeadMax, (r.cells.length - 1) * WORLD_RULES.eraLeadPerCell));
  // 上限は下げる向きには使わない（前の回に先へ行った国を引き戻さない）
  const raiseEra = (r) => { r.era = Math.max(r.era, Math.min(capOf(r), r.era + 1)); };
  // この回に国土が増えた国（あとで 時代 +1）
  const grewThisTurn = new Set();
  const after = burnedRegion;
  // 強い順（時代が高い→国土が広い→区画の番号が小さい）。同じ強さの取り合いを運でなく決まった順で決める
  const stronger = (a, b) => (b.era - a.era) || (b.cells.length - a.cells.length) || (a.id - b.id);

  // 変わるのは「この回の初めからその地域だった」ときだけ（育って変わった直後に、続けて変わらないように）
  const regionAtStart = new Map(world.regions.map((r) => [r.id, r.region]));

  // 成長：残った区画は全部 時代 +1（上限 VIII・滅ぼした数+1）
  world.regions.forEach((r) => raiseEra(r));

  // 育って特殊な地域に（表の上から順に、当てはまった最初の1つ）
  world.regions.forEach((r) => {
    const rule = SPECIAL_RULES.grow.find((g) => g.from.includes(r.region) && r.era >= g.atEra && regionAtStart.get(r.id) === r.region);
    if (!rule) return;
    const to = nextUnused(rule.candidates);
    if (!to) return;
    changeRegion(r, to);
    r.story.push({ kind: rule.space ? "space" : "grewInto", after, to });
  });

  // 滅びた地の併合（11/22 4回目の手直し）：竜が去った前の廃墟と、滅ぼした国の首都以外の区画は、
  // 接している生き残った国のうち強い国が取る。間に別の空き区画しか無い区画は、隣が取られてから取る
  let pending = world.unclaimed.slice().sort((a, b) => a - b);
  world.unclaimed = [];
  while (pending.length > 0) {
    const claimable = pending.filter((c) => [...CELL_NEIGHBORS[c]].some((n) => world.cellOwner[n] !== null));
    if (claimable.length === 0) break;
    claimable.forEach((cell) => {
      const takers = [...new Set([...CELL_NEIGHBORS[cell]].map((n) => world.cellOwner[n]).filter((o) => o !== null))]
        .map(regionById).sort(stronger);
      const taker = takers[0];
      world.cellOwner[cell] = taker.id;
      taker.cells.push(cell);
      world.flashIds.add(taker.id);
      grewThisTurn.add(taker.id);
      taker.story.push({ kind: "resettled", after });
    });
    pending = pending.filter((c) => world.cellOwner[c] === null);
  }
  // どの国にも接していない地は廃墟のまま（地図がつながっているので起きない想定）
  pending.forEach((c) => world.burned.add(c));
  // 国土が増えた国は 時代 +1（廃墟を取った国も。1回に +1 まで）
  grewThisTurn.forEach((id) => raiseEra(regionById(id)));

  // 併合（7回目）：時代が mergeEraGap 以上離れた隣の国を、時代の高い国が呑む。1回に1つまで、差のいちばん大きい組から。
  // この回に生まれたばかりの特殊な地域は、地図に一度も出ないまま消えないよう、呑む側にも呑まれる側にもならない
  const changedThisTurn = new Set(world.regions.filter((r) => regionAtStart.get(r.id) !== r.region).map((r) => r.id));
  for (let m = 0; m < WORLD_RULES.mergesPerTurn; m++) {
    const pairs = [];
    world.regions.forEach((r) => neighborRegionIds(r).forEach((otherId) => {
      const other = regionById(otherId);
      if (r.era - other.era < WORLD_RULES.mergeEraGap) return;
      if (WORLD_RULES.mergeNeedsMoreCells && r.cells.length <= other.cells.length) return;
      if (changedThisTurn.has(r.id) || changedThisTurn.has(other.id)) return;
      pairs.push([r, other]);
    }));
    if (pairs.length === 0) break;
    pairs.sort(([a1, b1], [a2, b2]) => ((a2.era - b2.era) - (a1.era - b1.era)) || stronger(a1, a2) || (b1.id - b2.id));
    const [big, small] = pairs[0];
    const bigEraBeforeMerge = big.era;
    small.cells.forEach((c) => { world.cellOwner[c] = big.id; });
    big.absorbedRealms += 1 + small.absorbedRealms;
    big.cells = big.cells.concat(small.cells);
    world.regions = world.regions.filter((r) => r.id !== small.id);
    raiseEra(big);   // 国土が増えた国は 時代 +1
    world.merges += 1;
    world.flashIds.add(big.id);
    big.story.push({ kind: "absorbed", after, other: small.region });
    if (world.eggRegionId === small.id) world.eggRegionId = null;
    // 併合して特殊な地域に
    const rule = regionAtStart.get(big.id) === big.region
      && SPECIAL_RULES.merge.find((r) => r.from.includes(big.region) && bigEraBeforeMerge >= r.minEra);
    if (rule) {
      const to = nextUnused(rule.candidates);
      if (to) {
        changeRegion(big, to);
        big.story.push({ kind: "mergedInto", after, to, other: small.region });
      }
    }
  }
}

// 時代の段（I〜II・III〜IV・V〜VI・VII〜VIII）
function eraEntry(region) {
  const band = Math.min(3, Math.floor((region.era - 1) / 2));
  return STRINGS.eraLore[region.region][band];
}

// 地域を選んだときの説明（物語の声だけ。操作の案内は入れない）
// 姿の変わった出来事は順に1文ずつ、姿の変わらない併合・廃墟の取り込みはまとめて1文にする（11/22 3回目の手直し）
function flavorOf(region) {
  const paragraphs = [eraEntry(region).lore];
  const changes = [];
  let plainAbsorbed = 0;
  let ruinsTaken = 0;
  region.story.forEach((event, index) => {
    const next = region.story[index + 1];
    if (event.kind === "absorbed") {
      // 呑み込んだ結果 姿が変わったときだけ、呑んだ相手の名を書く
      if (next && next.kind === "mergedInto" && next.after === event.after) {
        const special = STRINGS.absorbedChangedSpecial[next.to];
        changes.push(special ? special(regionName(event.other)) : STRINGS.absorbedChanged(regionName(event.other), regionName(next.to)));
      } else {
        plainAbsorbed += 1;
      }
      return;
    }
    if (event.kind === "mergedInto") return; // 直前の absorbed と一緒に書いた
    if (event.kind === "resettled") { ruinsTaken += 1; return; }
    if (event.kind === "grewInto") changes.push(STRINGS.grewIntoSpecial[event.to] || STRINGS.grewInto(regionName(event.to)));
    if (event.kind === "space") changes.push(STRINGS.wentToSpace(regionName(event.to)));
  });
  const growth = [...changes];
  if (plainAbsorbed > 0 && ruinsTaken > 0) growth.push(STRINGS.annexedAndRuins);
  else if (plainAbsorbed > 1) growth.push(STRINGS.annexedMany);
  else if (plainAbsorbed === 1) growth.push(STRINGS.annexedOne);
  else if (ruinsTaken > 0) growth.push(STRINGS.ruinsTaken);
  if (growth.length > changes.length && changes.length > 0) growth[changes.length] = STRINGS.furthermore + growth[changes.length];
  if (growth.length > 0) paragraphs.push(growth.join(""));
  if (region.cells.length > 1) paragraphs.push(STRINGS.bigRealm);
  return paragraphs;
}

// 描画（SVG）
// ---------------------------------------------------------------
const mapElement = document.getElementById("map");
const cardElement = document.getElementById("card");
const guideElement = document.getElementById("guide");

function regionCenter(region) {
  const sum = region.cells.reduce((acc, c) => [acc[0] + CELL_CENTERS[c][0], acc[1] + CELL_CENTERS[c][1]], [0, 0]);
  return [sum[0] / region.cells.length, sum[1] / region.cells.length];
}

// 古地図の下地：羊皮紙のむら・海の波・方位・枠
function backgroundLayer() {
  let svg = `<defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.24  0 0 0 0 0.12  0 0 0 0.22 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="#5a3a18" stop-opacity="0"/>
      <stop offset="100%" stop-color="#5a3a18" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.4"/></filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="${INK}" stroke-width="0.5" stroke-opacity="0.18"/>
    </pattern>
  </defs>`;
  svg += `<rect width="${MAP_W}" height="${MAP_H}" fill="${PARCHMENT}"/>`;
  svg += `<rect x="12" y="12" width="${MAP_W - 24}" height="${MAP_H - 24}" fill="${SEA}"/>`;
  // 波（海であることが分かる小さな山形）
  const random = makeRandomGenerator(0x5EA);
  for (let i = 0; i < 80; i++) {
    const x = 18 + random() * (MAP_W - 36), y = 18 + random() * (MAP_H - 36);
    if (MAP_CELLS.some((_, c) => pointInPolygon([x, y], CELL_OUTLINES[c].map(([px, py]) => {
      const [cx, cy] = CELL_CENTERS[c];
      return [cx + (px - cx) * 1.18, cy + (py - cy) * 1.18];
    })))) continue;
    svg += `<path d="M${(x - 5).toFixed(1)},${y.toFixed(1)} q2.5,-3 5,0 q2.5,-3 5,0" fill="none" stroke="#5f8580" stroke-width="0.8" stroke-linecap="round"/>`;
  }
  // 小島（8回目：ひな形ごとに海の場所が違うので、陸から離れた所に置く）
  MAP_DECOR.islands.forEach(([x, y, size]) => {
    svg += `<path transform="translate(${x.toFixed(1)},${y.toFixed(1)}) scale(${size.toFixed(2)})" d="M-6,0 q5,-5 10,0 q2,5 -5,6 q-6,0 -5,-6Z" fill="${PARCHMENT}" stroke="${INK}" stroke-width="0.9"/>`;
  });
  return svg;
}

// 方位（左下）と表題（上の巻物）。地図の約束ごとで、ひと目で地図と分かるように
function decorationLayer() {
  let svg = "";
  const [x, y] = MAP_DECOR.compass;
  svg += `<g pointer-events="none" opacity="0.9">
    <circle cx="${x}" cy="${y}" r="15" fill="none" stroke="${INK}" stroke-width="0.7"/>
    <circle cx="${x}" cy="${y}" r="11" fill="none" stroke="${INK}" stroke-width="0.4" stroke-dasharray="1.5 1.5"/>
    <path d="M${x},${y - 20} L${x + 3.5},${y} L${x},${y + 20} L${x - 3.5},${y}Z" fill="${INK}"/>
    <path d="M${x - 20},${y} L${x},${y - 3.5} L${x + 20},${y} L${x},${y + 3.5}Z" fill="${PARCHMENT}" stroke="${INK}" stroke-width="0.7"/>
    <path d="M${x},${y - 20} L${x + 3.5},${y} L${x},${y}Z" fill="#b8321f"/>
    <text x="${x}" y="${y - 23}" text-anchor="middle" font-size="7" font-weight="700" fill="${INK}">N</text>
  </g>`;
  // 枠（二重線）
  svg += `<rect x="12" y="12" width="${MAP_W - 24}" height="${MAP_H - 24}" fill="none" stroke="${INK}" stroke-width="1.6" pointer-events="none"/>`;
  svg += `<rect x="8" y="8" width="${MAP_W - 16}" height="${MAP_H - 16}" fill="none" stroke="${INK}" stroke-width="0.6" pointer-events="none"/>`;
  // 表題の巻物は枠の線より後に描き、巻物の中に線が透けないようにする（11/22 手直し）
  // 表題の巻物
  svg += `<g pointer-events="none">
    <path d="M126,3 h108 q7,0 7,8.5 q0,8.5 -7,8.5 h-108 q-7,0 -7,-8.5 q0,-8.5 7,-8.5Z" fill="#f4e7c6" stroke="${INK}" stroke-width="0.9"/>
    <text x="180" y="16" text-anchor="middle" font-size="${LOOK.titleSize}" font-weight="800" fill="${INK}" letter-spacing="2">${STRINGS.mapTitle}</text>
  </g>`;

  svg += `<rect width="${MAP_W}" height="${MAP_H}" fill="url(#vignette)" pointer-events="none"/>`;
  svg += `<rect width="${MAP_W}" height="${MAP_H}" fill="#fff" filter="url(#paper)" pointer-events="none" opacity="0.9"/>`;
  return svg;
}

// 地域ごとの地形の記号（墨の線画）。spots は区画の中の飾りの置き場
function terrainMarks(regionKey, cellIndex) {
  const spots = CELL_SPOTS[cellIndex];
  const [cx, cy] = CELL_CENTERS[cellIndex];
  const random = makeRandomGenerator(mixSeed(cellIndex + 11, 0x7E77));
  let out = "";
  const each = (count, draw) => spots.slice(0, count).forEach(([x, y], i) => { out += draw(x, y, i); });
  switch (regionKey) {
    case "continent":
      // 街道と畑
      out += `<path d="M${cx - 40},${cy + 22} Q${cx - 10},${cy + 4} ${cx + 38},${cy + 20}" fill="none" stroke="${INK_SOFT}" stroke-width="0.9" stroke-dasharray="2 2"/>`;
      each(8, (x, y) => `<rect x="${x - 4}" y="${y - 2.5}" width="8" height="5" fill="none" stroke="${INK_SOFT}" stroke-width="0.6"/><line x1="${x - 4}" y1="${y}" x2="${x + 4}" y2="${y}" stroke="${INK_SOFT}" stroke-width="0.4"/>`);
      break;
    case "riverline":
      out += `<path d="M${cx - 46},${cy - 26} C${cx - 20},${cy - 4} ${cx - 30},${cy + 20} ${cx + 4},${cy + 22} S${cx + 34},${cy + 4} ${cx + 48},${cy + 26}" fill="none" stroke="#4f7f8a" stroke-width="3" stroke-linecap="round"/>`;
      out += `<path d="M${cx - 46},${cy - 26} C${cx - 20},${cy - 4} ${cx - 30},${cy + 20} ${cx + 4},${cy + 22} S${cx + 34},${cy + 4} ${cx + 48},${cy + 26}" fill="none" stroke="#9cc4c6" stroke-width="1.2" stroke-linecap="round"/>`;
      each(6, (x, y) => `<rect x="${x - 2}" y="${y - 2}" width="4" height="4" fill="#9a4a2a" stroke="${INK}" stroke-width="0.4"/>`);
      break;
    case "citadel":
      [30, 22].forEach((r) => { out += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${INK}" stroke-width="${r > 25 ? 1.6 : 1.1}" stroke-dasharray="${r > 25 ? "4 1.5" : "3 1.5"}"/>`; });
      break;
    case "frontline": {
      // 国境の長城（凸凹の線）
      const y0 = cy + 24;
      let d = `M${cx - 44},${y0}`;
      for (let i = 0; i < 11; i++) d += ` h4 v-3 h4 v3`;
      out += `<path d="${d}" fill="none" stroke="${INK}" stroke-width="1.3"/>`;
      each(4, (x, y) => (y < y0 - 6 ? `<rect x="${x - 2.5}" y="${y - 5}" width="5" height="7" fill="#d9c29a" stroke="${INK}" stroke-width="0.7"/>` : ""));
      break;
    }
    case "forest":
      each(14, (x, y) => `<path d="M${x},${y - 6} l4,7 h-8Z" fill="#4f7a45" stroke="${INK}" stroke-width="0.6"/><line x1="${x}" y1="${y + 1}" x2="${x}" y2="${y + 3}" stroke="${INK}" stroke-width="0.7"/>`);
      break;
    case "badlands":
      each(6, (x, y, i) => (i % 2 === 0
        ? `<path d="M${x - 7},${y + 3} l5,-9 l3,4 l2,-3 l4,8Z" fill="#c99b5c" stroke="${INK}" stroke-width="0.8"/>`
        : `<ellipse cx="${x}" cy="${y}" rx="5" ry="3.5" fill="#a88252" stroke="${INK}" stroke-width="0.7"/>`));
      break;
    case "serpent":
      out += `<path d="M${cx - 40},${cy + 22} q10,-10 20,0 t20,0 t20,0 t20,0" fill="none" stroke="#3f6a3a" stroke-width="2.2" stroke-linecap="round"/>`;
      out += `<circle cx="${cx + 41}" cy="${cy + 21}" r="2" fill="#3f6a3a"/>`;
      each(10, (x, y) => `<path d="M${x},${y + 3} v-6 m0,0 q-4,-1 -5,2 m5,-2 q4,-1 5,2 m-5,-2 q-2,-3 -4,-3 m4,3 q2,-3 4,-3" fill="none" stroke="#2f5a2c" stroke-width="0.8"/>`);
      break;
    case "mushroom":
      each(10, (x, y) => `<path d="M${x - 4},${y} a4,3.5 0 0 1 8,0Z" fill="#b8423a" stroke="${INK}" stroke-width="0.6"/><rect x="${x - 1}" y="${y}" width="2" height="3" fill="#f1e4c4" stroke="${INK}" stroke-width="0.4"/>`);
      break;
    case "flower":
      each(10, (x, y) => {
        let petals = "";
        for (let k = 0; k < 5; k++) {
          const a = (k / 5) * Math.PI * 2;
          petals += `<circle cx="${(x + Math.cos(a) * 2.6).toFixed(1)}" cy="${(y + Math.sin(a) * 2.6).toFixed(1)}" r="1.8" fill="#b4568e"/>`;
        }
        return petals + `<circle cx="${x}" cy="${y}" r="1.3" fill="#e8c34a"/>`;
      });
      break;
    case "metro":
      each(12, (x, y) => `<rect x="${x - 3}" y="${y - 3}" width="6" height="6" fill="#8d8d88" stroke="${INK}" stroke-width="0.5"/>`);
      out += `<path d="M${cx - 44},${cy + 18} H${cx + 44} M${cx - 20},${cy - 30} V${cy + 30}" stroke="#d8c27a" stroke-width="1.6" stroke-dasharray="2 1.5"/>`;
      break;
    case "railway": {
      const d = `M${cx - 44},${cy + 24} C${cx - 20},${cy - 6} ${cx + 10},${cy + 40} ${cx + 44},${cy + 10}`;
      out += `<path d="${d}" fill="none" stroke="${INK}" stroke-width="4" stroke-dasharray="0.8 2.4"/>`;
      out += `<path d="${d}" fill="none" stroke="${INK}" stroke-width="1.2"/>`;
      out += `<rect x="${cx + 4}" y="${cy + 17}" width="10" height="5" rx="1" fill="#6a3a1c" stroke="${INK}" stroke-width="0.5"/>`;
      break;
    }
    case "bomb":
      out += `<circle cx="${cx}" cy="${cy}" r="27" fill="none" stroke="${INK}" stroke-width="1.4" stroke-dasharray="4 1.5"/>`;
      each(8, (x, y) => `<circle cx="${x}" cy="${y}" r="3.4" fill="#2a2420"/><path d="M${x + 2},${y - 2.5} q2,-3 4,-2" fill="none" stroke="${INK}" stroke-width="0.6"/><circle cx="${x + 6}" cy="${y - 4.5}" r="0.9" fill="#e0682a"/>`);
      break;
    case "asteroids":
      for (let i = 0; i < 22; i++) {
        const x = cx + (random() - 0.5) * 90, y = cy + (random() - 0.5) * 66;
        if (!pointInPolygon([x, y], CELL_OUTLINES[cellIndex])) continue;
        out += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(0.4 + random() * 0.8).toFixed(1)}" fill="#f4eed8"/>`;
      }
      each(7, (x, y, i) => `<ellipse cx="${x}" cy="${y}" rx="${3 + (i % 3)}" ry="${2.4 + (i % 2)}" fill="#8a7f6a" stroke="#d6cdb4" stroke-width="0.5"/>`);
      break;
    // ---- 7回目で足した地域 ----
    case "sanctuary": {
      // 四方の祠と、祠を結ぶ結界の点線
      const r = 24;
      out += `<rect x="${cx - r}" y="${cy - r + 4}" width="${r * 2}" height="${r * 2 - 8}" fill="none" stroke="#7a5a9a" stroke-width="1" stroke-dasharray="2 2"/>`;
      [[-r, -r + 4], [r, -r + 4], [-r, r - 4], [r, r - 4]].forEach(([dx, dy]) => {
        const x = cx + dx, y = cy + dy;
        out += `<path d="M${x - 4},${y - 3} h8 M${x - 3},${y - 1.5} h6 M${x - 2.4},${y - 1.5} v5 M${x + 2.4},${y - 1.5} v5" stroke="#9a2a1a" stroke-width="1.1" stroke-linecap="round"/>`;
      });
      each(5, (x, y) => `<path d="M${x - 4},${y + 3} l4,-7 l4,7Z" fill="#9a8fa8" stroke="${INK}" stroke-width="0.6"/>`);
      break;
    }
    case "beach":
      // 波打ち際の線と、家を背負ったヤドカリ
      [0, 6].forEach((k) => { out += `<path d="M${cx - 46},${cy - 18 - k} q8,-4 16,0 t16,0 t16,0 t16,0 t16,0 t16,0" fill="none" stroke="#5f8580" stroke-width="0.8"/>`; });
      each(6, (x, y) => `<circle cx="${x}" cy="${y}" r="3.6" fill="#8a7050" stroke="${INK}" stroke-width="0.5"/><circle cx="${x - 3.8}" cy="${y + 1.5}" r="1" fill="#c8502a"/><circle cx="${x + 3.8}" cy="${y + 1.5}" r="1" fill="#c8502a"/><rect x="${x - 1.8}" y="${y - 2}" width="3.6" height="3" fill="#b0583a" stroke="${INK}" stroke-width="0.3"/>`);
      break;
    case "plateau":
      // 塔と、塔を結ぶ光線
      each(5, (x, y, i) => {
        let t = `<rect x="${x - 1.6}" y="${y - 8}" width="3.2" height="9" fill="#d9cfb8" stroke="${INK}" stroke-width="0.6"/><circle cx="${x}" cy="${y - 9}" r="1.3" fill="#e8c34a"/>`;
        if (i % 2 === 0) t += `<path d="M${x},${y - 9} l${i === 0 ? 14 : -12},-6" stroke="#e8a34a" stroke-width="0.8" stroke-dasharray="1.6 1"/>`;
        return t;
      });
      break;
    case "skyland":
      // 雲海と浮き島
      each(7, (x, y, i) => (i % 2 === 0
        ? `<path d="M${x - 7},${y + 2} q1,-4 5,-3 q2,-4 6,-1 q4,-1 4,4Z" fill="#f4f6f4" stroke="#7d97a2" stroke-width="0.6"/>`
        : `<path d="M${x - 5},${y - 1} h10 l-3,5 h-4Z" fill="#b59a6a" stroke="${INK}" stroke-width="0.6"/><path d="M${x - 2},${y - 1} v-3 h4 v3" fill="none" stroke="${INK}" stroke-width="0.5"/>`));
      break;
    case "heroland":
      // 旗の立つ城と街道
      out += `<path d="M${cx - 40},${cy + 20} Q${cx},${cy + 8} ${cx + 40},${cy + 22}" fill="none" stroke="${INK_SOFT}" stroke-width="0.9" stroke-dasharray="2 2"/>`;
      each(5, (x, y) => `<line x1="${x}" y1="${y + 3}" x2="${x}" y2="${y - 7}" stroke="${INK}" stroke-width="0.8"/><path d="M${x},${y - 7} l6,2 l-6,2Z" fill="#c43a2a" stroke="${INK}" stroke-width="0.4"/>`);
      break;
    case "swordway":
      // 交差した剣と道場
      each(6, (x, y, i) => (i % 2 === 0
        ? `<path d="M${x - 5},${y - 5} l10,10 M${x + 5},${y - 5} l-10,10" stroke="#4a4f58" stroke-width="1.1" stroke-linecap="round"/><path d="M${x - 3},${y + 1} l2,2 M${x + 3},${y + 1} l-2,2" stroke="${INK}" stroke-width="1.4"/>`
        : `<rect x="${x - 4}" y="${y - 2}" width="8" height="5" fill="#e4d2a8" stroke="${INK}" stroke-width="0.6"/><path d="M${x - 5},${y - 2} l5,-3.5 l5,3.5Z" fill="#4a4f58" stroke="${INK}" stroke-width="0.5"/>`));
      break;
    // ---- 8回目で新しく足した地域 ----
    case "beacon":
      // なだらかな丘と、丘の上の烽火台（煙の立つ火）
      each(6, (x, y, i) => {
        let t = `<path d="M${x - 8},${y + 3} q8,-9 16,0" fill="#b7a674" stroke="${INK}" stroke-width="0.7"/>`;
        if (i % 2 === 0) t += `<rect x="${x - 1.4}" y="${y - 6}" width="2.8" height="4" fill="#d9c7a0" stroke="${INK}" stroke-width="0.5"/><path d="M${x},${y - 9} q-1.6,1.6 0,3 q1.6,-1.4 0,-3Z" fill="#e0682a"/><circle class="smoke" cx="${x + 1}" cy="${y - 12}" r="1.6" fill="#8a8072" opacity="0.5"/>`;
        return t;
      });
      break;
    case "peaks":
      // 雪をかぶった高い峰と、峰を取り巻く雲
      each(7, (x, y, i) => (i % 3 === 2
        ? `<path d="M${x - 7},${y + 2} q1,-4 5,-3 q2,-4 6,-1 q4,-1 4,4Z" fill="#f4f6f4" stroke="#7d97a2" stroke-width="0.6"/>`
        : `<path d="M${x - 7},${y + 4} l7,-12 l7,12Z" fill="#8f979b" stroke="${INK}" stroke-width="0.7"/><path d="M${x - 2.6},${y - 3.5} l2.6,-4.5 l2.6,4.5 l-1.3,-0.8 l-1.3,1 l-1.3,-1Z" fill="#f4f6f4"/>`));
      break;
    // ---- 9回目で新しく足した地域 ----
    case "mine": {
      // 岩山と坑道の口、谷を下るトロッコのレール
      each(5, (x, y, i) => (i % 2 === 0
        ? `<path d="M${x - 8},${y + 4} l5,-10 l3,3 l3,-5 l5,12Z" fill="#9a8a72" stroke="${INK}" stroke-width="0.7"/><path d="M${x - 2},${y + 4} v-3 a2,2 0 0 1 4,0 v3Z" fill="#2a2420"/>`
        : `<path d="M${x - 4},${y + 2} l2,-4 l3,1 l2,3Z" fill="#7a6a58" stroke="${INK}" stroke-width="0.5"/>`));
      const d = `M${cx - 40},${cy - 22} Q${cx - 6},${cy - 4} ${cx + 8},${cy + 24}`;
      out += `<path d="${d}" fill="none" stroke="${INK}" stroke-width="3.2" stroke-dasharray="0.7 2.2"/>`;
      out += `<path d="${d}" fill="none" stroke="${INK}" stroke-width="0.9"/>`;
      out += `<path d="M${cx - 18},${cy - 12} h7 l-1,4 h-5Z" fill="#6a5a48" stroke="${INK}" stroke-width="0.5"/><circle cx="${cx - 16}" cy="${cy - 7.5}" r="0.9" fill="${INK}"/><circle cx="${cx - 12}" cy="${cy - 7.5}" r="0.9" fill="${INK}"/>`;
      break;
    }
    // ---- 13回目（v3.218.0・案帳 DT-034）で足した地域 ----
    case "starfort":
      // 堀に囲まれた星形の城（五稜郭のような形）
      each(3, (x, y) => {
        let pts = "";
        for (let k = 0; k < 10; k++) {
          const a = -Math.PI / 2 + k * Math.PI / 5, r = k % 2 === 0 ? 9 : 4.6;
          pts += `${(x + Math.cos(a) * r).toFixed(1)},${(y + Math.sin(a) * r).toFixed(1)} `;
        }
        return `<polygon points="${pts.trim()}" fill="#9a958a" stroke="#4f6f7a" stroke-width="1.6"/><polygon points="${pts.trim()}" fill="none" stroke="${INK}" stroke-width="0.5"/><circle cx="${x}" cy="${y}" r="1.4" fill="#9a2a1a"/>`;
      });
      break;
    default:
      break;
  }
  return out;
}

// 首都のまわりの街並み。時代が上がるほど建物が育つ（時代を数字でなく絵で見せる）
function cityMarks(region, showCapital) {
  const [cx, cy] = CELL_CENTERS[region.capitalCell];
  const era = region.era;
  const dark = region.region === "asteroids";
  const stroke = dark ? "#e8dcc0" : INK;
  const roof = "#9a3a22";
  const count = Math.min(5, 2 + Math.floor(era / 2));
  let out = "";
  for (let i = 0; i < count; i++) {
    const x = cx - 22 + i * 9 + (i >= Math.floor(count / 2) ? 18 : 0) - (count > 4 ? 4 : 0);
    const baseY = cy + 5;
    if (era <= 1) {
      out += `<path d="M${x - 3},${baseY} l3,-5 l3,5Z" fill="#b08a5a" stroke="${stroke}" stroke-width="0.6"/>`;
    } else if (era <= 3) {
      out += `<rect x="${x - 3}" y="${baseY - 4}" width="6" height="4" fill="#e4d2a8" stroke="${stroke}" stroke-width="0.6"/><path d="M${x - 3.6},${baseY - 4} l3.6,-3.4 l3.6,3.4Z" fill="${roof}" stroke="${stroke}" stroke-width="0.5"/>`;
    } else if (era <= 5) {
      const h = 7 + (i % 2) * 3;
      out += `<rect x="${x - 2.5}" y="${baseY - h}" width="5" height="${h}" fill="#d9c7a0" stroke="${stroke}" stroke-width="0.6"/>`;
      if (era >= 5 && i % 2 === 0) out += `<rect x="${x + 1}" y="${baseY - h - 4}" width="1.4" height="4" fill="${stroke}"/><circle class="smoke" cx="${x + 2}" cy="${baseY - h - 6}" r="1.8" fill="#8a8072" opacity="0.5"/>`;
    } else {
      const h = 10 + (i % 3) * 4;
      out += `<rect x="${x - 2.5}" y="${baseY - h}" width="5" height="${h}" fill="#bfc3c4" stroke="${stroke}" stroke-width="0.6"/>`;
      for (let k = 0; k < h - 3; k += 3) out += `<rect x="${x - 1}" y="${baseY - h + 2 + k}" width="2" height="1" fill="#f0d36a"/>`;
    }
  }
  // 首都：赤い二重丸（ゲーム画面の約束）。攻め込めない国では出さない（選べる印に見えるため。11/22 2回目の手直し）
  if (!showCapital) return out;
  const big = region.cells.length > 1;
  out += `<circle cx="${cx}" cy="${cy}" r="${big ? 7.5 : 5.5}" fill="${dark ? "#3b3554" : "#f4e7c6"}" stroke="#c41e1e" stroke-width="${big ? 2.2 : 1.7}"/>`;
  out += `<circle cx="${cx}" cy="${cy}" r="${big ? 3.2 : 2.4}" fill="#c41e1e"/>`;
  return out;
}

// 焼け跡：黒く焦げた地面・燃えさし・煙
function burnedMarks(cellIndex) {
  const spots = CELL_SPOTS[cellIndex];
  const [cx, cy] = CELL_CENTERS[cellIndex];
  let out = "";
  spots.forEach(([x, y], i) => {
    if (i % 3 === 0) out += `<path d="M${x - 5},${y + 2} l3,-3 l2,2 l4,-4" fill="none" stroke="#120b07" stroke-width="0.8"/>`;
    else out += `<circle class="ember" style="animation-delay:${(i * 0.23).toFixed(2)}s" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${i % 2 ? 1.6 : 2.2}" fill="#ff7a2a"/>`;
  });
  // 首都のあった所の廃墟
  out += `<path d="M${cx - 8},${cy + 4} l2,-6 l2,3 l2,-5 l2,4 l2,-3 l2,7Z" fill="#1a120d" stroke="#5a2e14" stroke-width="0.6"/>`;
  out += `<circle class="smoke" cx="${cx - 2}" cy="${cy - 6}" r="3.5" fill="#6b625a" opacity="0.4"/>`;
  out += `<circle class="smoke" style="animation-delay:1.5s" cx="${cx + 4}" cy="${cy - 8}" r="2.8" fill="#6b625a" opacity="0.4"/>`;
  return out;
}

// 竜の印（上から見た竜：頭と角・広げた翼・長い尾）。原点が胴の中心、頭が上
function dragonMark(x, y, scale, angle, delay) {
  const wing = "M-1.6,-3.2 L-6.5,-7.5 L-14,-6.2 Q-11.2,-3.6 -12,-0.4 Q-9,-1.6 -7.8,1.8 Q-5.6,-0.2 -3.4,2.8 L-1.6,1.6Z";
  return `<g transform="translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${angle}) scale(${scale})">
    <ellipse cx="0" cy="2" rx="3" ry="2" fill="#000" opacity="0.18" transform="translate(4,6)"/>
    <path d="M0,4.5 Q-2.6,9 0.4,12.5 Q3,15.5 0.6,18" fill="none" stroke="#5a2a08" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M0,4.5 Q-2.6,9 0.4,12.5 Q3,15.5 0.6,18" fill="none" stroke="#f08a24" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M0.6,17 l2.4,3.2 l-3.6,0.2Z" fill="#f08a24" stroke="#5a2a08" stroke-width="0.6"/>
    <g class="wings" style="animation-delay:${delay}s">
      <path d="${wing}" fill="#f6a640" stroke="#5a2a08" stroke-width="0.8" stroke-linejoin="round"/>
      <path d="${wing}" transform="scale(-1,1)" fill="#f6a640" stroke="#5a2a08" stroke-width="0.8" stroke-linejoin="round"/>
      <path d="M-1.8,-2.6 L-6.5,-7.2 M-2,-0.6 L-11.6,-5.6 M-2.6,1.4 L-9,-1.2" stroke="#b55a14" stroke-width="0.5"/>
      <path d="M1.8,-2.6 L6.5,-7.2 M2,-0.6 L11.6,-5.6 M2.6,1.4 L9,-1.2" stroke="#b55a14" stroke-width="0.5"/>
    </g>
    <ellipse cx="0" cy="0" rx="2.6" ry="6" fill="#e8741c" stroke="#5a2a08" stroke-width="0.8"/>
    <path d="M0,-11.5 L2.4,-6.8 L0,-5.4 L-2.4,-6.8Z" fill="#e8741c" stroke="#5a2a08" stroke-width="0.7"/>
    <path d="M-1.4,-8.6 L-3.2,-11.6 M1.4,-8.6 L3.2,-11.6" stroke="#5a2a08" stroke-width="0.8" stroke-linecap="round"/>
  </g>`;
}

// 竜の群れ。いちばん新しい廃墟の上を舞う
function flockMarks() {
  if (world.lastBurnedCell === null) return "";
  const [tx, ty] = CELL_CENTERS[world.lastBurnedCell];
  let out = `<g class="flock" pointer-events="none">`;
  out += dragonMark(tx + 20, ty - 16, 0.85, 18, 0.4);
  out += dragonMark(tx - 20, ty - 10, 0.85, -14, 0.15);
  out += dragonMark(tx, ty - 26, 1.3, 4, 0);
  return out + `</g>`;
}

let animateChanges = false;
function renderMap() {
  const choosable = choosableIds();
  let svg = backgroundLayer();
  svg += `<defs>${MAP_CELLS.map((_, c) => `<clipPath id="cellClip${c}"><path d="${pathOf(CELL_OUTLINES[c], true)}"/></clipPath>`).join("")}</defs>`;

  // 海岸のさざ波（陸の外側を淡く何重にも縁取る。古地図の描き方）
  const coastEdges = EDGES.filter((e) => e.cells.length === 1);
  [[11, 0.12], [7, 0.18], [3.5, 0.3]].forEach(([width, opacity]) => {
    coastEdges.forEach((edge) => {
      svg += `<path d="${pathOf(EDGE_LINES.get(edge.key), false)}" fill="none" stroke="#3e6660" stroke-opacity="${opacity}" stroke-width="${width}" stroke-linejoin="round" stroke-linecap="round" pointer-events="none"/>`;
    });
  });

  // 区画の塗りと地形
  MAP_CELLS.forEach((_, cellIndex) => {
    const owner = world.cellOwner[cellIndex];
    const region = owner === null ? null : regionById(owner);
    const flash = animateChanges && region && world.flashIds.has(region.id) ? " flash" : "";
    const outline = pathOf(CELL_OUTLINES[cellIndex], true);
    svg += `<g class="cell${flash}" data-cell="${cellIndex}">`;
    if (region) {
      svg += `<path d="${outline}" fill="${REGION_COLORS[region.region]}"/>`;
      if (region.region !== "asteroids") svg += `<path d="${outline}" fill="url(#hatch)"/>`;
      svg += `<g clip-path="url(#cellClip${cellIndex})">${terrainMarks(region.region, cellIndex)}</g>`;   // 7回目：区画が小さくなったので、記号を区画の形で切る
      // 廃墟から併合した土地は、ほんのり煤けた色を残す
      if (world.burnedNames[cellIndex]) svg += `<path d="${outline}" fill="#3a2516" opacity="0.18"/>`;
    } else {
      svg += `<path d="${outline}" fill="#2a1d15"/>`;
      svg += `<path d="${outline}" fill="#7a2c10" opacity="0.35"/>`;
      svg += burnedMarks(cellIndex);
    }
    svg += `</g>`;
  });

  // 境目：国境は墨の点線、併合でつながった所は消す。海岸は墨の太線。焼け跡と生きた国の境は燃える線
  EDGES.forEach((edge) => {
    const d = pathOf(EDGE_LINES.get(edge.key), false);
    const owners = edge.cells.map((c) => world.cellOwner[c]);
    if (edge.cells.length === 1) {
      svg += `<path d="${d}" fill="none" stroke="${INK}" stroke-width="1.5" stroke-linecap="round" pointer-events="none"/>`;
      return;
    }
    if (owners[0] !== null && owners[0] === owners[1]) return;
    const burnedCount = owners.filter((o) => o === null).length;
    if (burnedCount === 1) {
      svg += `<path d="${d}" fill="none" stroke="#ff6a1a" stroke-width="4" filter="url(#glow)" class="ember" pointer-events="none"/>`;
      svg += `<path d="${d}" fill="none" stroke="#ffb347" stroke-width="1.2" pointer-events="none"/>`;
    } else if (burnedCount === 0) {
      svg += `<path d="${d}" fill="none" stroke="${INK}" stroke-width="0.9" stroke-dasharray="3 1.6 0.8 1.6" pointer-events="none"/>`;
    }
  });

  // 選べる地域：白い点線で縁取り、ほんのり明るく
  const outerEdgesOf = (regionId) => EDGES.filter((edge) => edge.cells.filter((c) => world.cellOwner[c] === regionId).length === 1
    || (edge.cells.length === 1 && world.cellOwner[edge.cells[0]] === regionId));
  world.regions.forEach((region) => {
    if (!choosable.has(region.id)) return;
    region.cells.forEach((c) => { svg += `<path d="${pathOf(CELL_OUTLINES[c], true)}" fill="#fff6dc" fill-opacity="0.16" pointer-events="none"/>`; });
    outerEdgesOf(region.id).forEach((edge) => {
      svg += `<path class="choosable" d="${pathOf(EDGE_LINES.get(edge.key), false)}" fill="none" stroke="#fff" stroke-width="2.2" stroke-dasharray="5 4" stroke-linecap="round" pointer-events="none"/>`;
    });
  });
  // 選んでいる地域は金の縁取り
  const selected = selectedRegionId !== null ? regionById(selectedRegionId) : null;
  if (selected) {
    outerEdgesOf(selected.id).forEach((edge) => {
      svg += `<path d="${pathOf(EDGE_LINES.get(edge.key), false)}" fill="none" stroke="#ffd36b" stroke-width="3.4" stroke-linecap="round" pointer-events="none"/>`;
    });
  }
  if (selectedBurnedCell !== null) {
    svg += `<path d="${pathOf(CELL_OUTLINES[selectedBurnedCell], true)}" fill="none" stroke="#ffd36b" stroke-width="2" pointer-events="none"/>`;
  }

  // 街並み・首都・地名
  // 地名は攻められる国にだけ書く（選べない国の名前は地図に出さない。11/22 手直し）
  world.regions.forEach((region) => {
    svg += `<g pointer-events="none">${cityMarks(region, choosable.has(region.id))}`;
    if (!choosable.has(region.id)) { svg += `</g>`; return; }
    const [lx, ly] = region.cells.length > 1 ? regionCenter(region) : CELL_CENTERS[region.capitalCell];
    const labelY = region.cells.length > 1 && Math.abs(ly - CELL_CENTERS[region.capitalCell][1]) > 20 ? ly : CELL_CENTERS[region.capitalCell][1] - 13;
    const light = region.region === "asteroids";
    svg += `<text x="${lx.toFixed(1)}" y="${labelY.toFixed(1)}" text-anchor="middle" font-size="${LOOK.labelSize}" font-weight="800" letter-spacing="1"
      fill="${light ? "#f4eed8" : INK}" stroke="${light ? "#3b3554" : PARCHMENT}" stroke-width="2.6" paint-order="stroke">${STRINGS.mapLabels[region.region]}</text>`;
    svg += `</g>`;
  });

  svg += flockMarks();
  svg += decorationLayer();
  mapElement.innerHTML = svg;
}

// 案内の欄（操作の説明。物語の文のカードとは書体も場所も分ける）
let guideKey = "start";
function renderGuide() {
  guideElement.textContent = world.done ? "" : STRINGS.guide[guideKey];
  guideElement.hidden = world.done;
}

// 難しさの星：ステージの時代（I〜VIII）をそのまま星の数にする（併合で上がった時代も含む）
function starsOf(era) {
  const maxEra = STRINGS.eraNames.length - 1;
  const on = "★".repeat(era);
  const off = "★".repeat(Math.max(0, maxEra - era));
  return `<div class="stars" aria-label="${STRINGS.difficultyLabel} ${era}/${maxEra}"><span class="label">${STRINGS.difficultyLabel}</span>${on}<span class="off">${off}</span></div>`;
}

function renderCard() {
  cardElement.hidden = false;
  if (world.done) {
    const first = regionName(world.history[0].region);
    const last = regionName(world.history[world.history.length - 1].region);
    cardElement.innerHTML = `<div class="done-title">${STRINGS.doneTitle}</div>
      <div class="flavor"><p>${STRINGS.doneText(first, last)}</p></div>
      <button class="attack" id="againButton">${STRINGS.again}</button>`;
    document.getElementById("againButton").onclick = () => startWorld(world.seed);
    return;
  }
  if (selectedBurnedCell !== null) {
    const name = regionName(world.burnedNames[selectedBurnedCell]);
    const text = world.ruinTurn[selectedBurnedCell] === 1 ? STRINGS.eggRuinText(name) : STRINGS.ruinText(name);
    cardElement.innerHTML = `<h2>${STRINGS.ruinTitle}</h2><div class="era">&nbsp;</div>
      <div class="flavor"><p>${text}</p></div>`;
    return;
  }
  const region = selectedRegionId !== null ? regionById(selectedRegionId) : null;
  if (!region) {
    cardElement.hidden = true;
    cardElement.innerHTML = "";
    return;
  }
  const paragraphs = flavorOf(region).map((p) => `<p>${p}</p>`).join("");
  const canAttack = choosableIds().has(region.id);
  cardElement.innerHTML = `<h2>${regionName(region.region)}</h2>
    <div class="era">${STRINGS.eraNames[region.era]}</div>
    ${starsOf(region.era)}
    <div class="flavor">${paragraphs}</div>
    <button class="attack" id="attackButton"${canAttack ? "" : " disabled"}>${canAttack ? STRINGS.attack : STRINGS.notChoosable}</button>`;
  if (!canAttack) return;
  document.getElementById("attackButton").onclick = () => {
    destroyRegion(region.id);
    guideKey = "pick";
    animateChanges = true; render(); animateChanges = false;
  };
}

function render() {
  renderMap();
  renderGuide();
  renderCard();
}

// 区画をタップ → その地域のカード。焼け跡はその地の跡を出す
mapElement.addEventListener("click", (event) => {
  const group = event.target.closest(".cell");
  if (!group || world.done) return;
  const cellIndex = Number(group.dataset.cell);
  const owner = world.cellOwner[cellIndex];
  // まだ攻め込めない国も説明文は出す（ボタンは押せない。地図には名前を出さないまま。11/22 2回目の手直し）
  const locked = owner !== null && !choosableIds().has(owner);
  selectedRegionId = owner;
  selectedBurnedCell = owner === null ? cellIndex : null;
  guideKey = locked ? "locked" : selectedRegionId !== null ? "selected" : (world.turn === 2 ? "start" : "pick");
  render();
});

// ---------------------------------------------------------------
// サンプルの設定（8回目：シードを戻した。シードで地図の形と中身が決まる）
// ---------------------------------------------------------------
const seedInput = document.getElementById("seedInput");
const templateNote = document.getElementById("templateNote");
function startWorld(seed) {
  world = createWorld((Number.isFinite(seed) ? seed : world.seed) >>> 0);
  // 最初のステージ（卵を奪った国）は地図で選ばない。落とした後の地図から始める（11/22 手直し）
  destroyRegion(world.eggRegionId);
  guideKey = "start";
  selectedRegionId = null;
  selectedBurnedCell = null;
  seedInput.value = String(world.seed);
  templateNote.textContent = STRINGS.templateNote(STRINGS.templateNames[MAP_TEMPLATE.key], MAP_PARTITION.name, MAP_MIRRORED);
  render();
}
document.getElementById("newWorldButton").onclick = () => {
  // 新しいシードは時刻から作る（作ったシードは欄に出るので、同じ世界を再現できる）
  startWorld(mixSeed(Date.now() >>> 0, world ? world.seed : 1) % 100000);
};
document.getElementById("retryButton").onclick = () => startWorld(parseInt(seedInput.value, 10));
seedInput.addEventListener("keydown", (event) => {
  if (event.key === "Enter") startWorld(parseInt(seedInput.value, 10));
});
// 呑み合いの多い・少ないを見比べる切り替え（サンプルだけ。差2＝少ない（8回目の既定）、差1＝多い）
const mergeButton = document.getElementById("mergeButton");
mergeButton.onclick = () => {
  WORLD_RULES.mergeEraGap = WORLD_RULES.mergeEraGap === 1 ? 2 : 1;
  mergeButton.setAttribute("aria-pressed", WORLD_RULES.mergeEraGap === 1 ? "true" : "false");
  startWorld(world.seed);
};
const urlSeed = parseInt(new URLSearchParams(location.search).get("seed"), 10);
startWorld(Number.isFinite(urlSeed) ? urlSeed : 4242);
</script>
