<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>竜の宝石サンプル</title>
<style>
  :root {
    --ground: #2a3324;
    --panel: #222a1d;
    --ink: #e9ecdf;
    --muted: #a9b19b;
    --line: #3d4834;
    --accent: #e0c27a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #1b2117; color: var(--ink);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 4px 0 6px; }
  h2 { font-size: 16px; margin: 28px 0 8px; }
  h3 { font-size: 15px; margin: 0 0 8px; }
  p, li { font-size: 13px; line-height: 1.65; color: var(--muted); }
  .lead { margin: 0 0 8px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px; margin: 12px 0; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .cell span { font-size: 12px; color: var(--muted); }
  canvas { display: block; background: var(--ground); border-radius: 6px; }
  .note { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .chips button { font: inherit; font-size: 13px; color: var(--ink); background: #2f3a27;
    border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
  .chips button[aria-pressed="true"] { background: var(--accent); color: #1b2117; border-color: var(--accent); }
  #tray { width: 100%; }
</style>
</head>
<body>
<main>
  <h1>竜の見た目サンプル：宝石（ルース）4回目</h1>
  <p class="lead">竜は竜のまま、色・質感・光り方だけをルース（裸石）から借りる案（DT-597）。
    照り返しは<strong>竜の向き（と地図上の位置）だけ</strong>で決まる。光源は見せない・動かさない・地面には何も出さない。
    同じ位置・同じ向きなら同じ照り返しになるので、群れが曲がると先頭から順にきらっと光が走る（イワシの群れのつもり）。</p>

  <h2>1. 群れ（線をなぞって動く）</h2>
  <div class="card">
    <div class="chips" id="speciesChips"></div>
    <div class="chips" id="modeChips"></div>
    <div class="chips" id="optionChips"></div>
    <canvas id="tray"></canvas>
    <p class="note" id="modeNote"></p>
  </div>

  <h2>2. いまの絵と新しい絵（ゲームの大きさ・4倍）</h2>
  <p class="note">4倍の新しい絵はゆっくり向きを変える。決まった向きに来たときだけ照り返しが段々に入って抜ける。</p>
  <div id="compare"></div>
</main>

<script>
"use strict";

// ---- 竜の寸法 ----
// current は index.html の DRAGON_PART_SPRITES と同じ値。
// gem（新しい絵）は bodyPivot・wingAnchor を tools/sprite_meta.py で実測し、
// shoulder だけは「いまの絵」の手詰め値を画像幅の比で写した（形は同じなので。
// 実測の肩は極光で棘の幅を拾い y=109 になり、手詰めの y=185 と大きくずれるため）。
const SPECIES = [
  {
    key: "fire",
    label: "火竜（ガーネット）",
    current: {
      body: "assets/dragon_fire_body.png", wing: "assets/dragon_fire_wing.png",
      bodyPivot: { cx: 64.4, cy: 169.1, w: 130, h: 320 },
      shoulder: { left: { x: 17.0, y: 152 }, right: { x: 112.0, y: 152 } },
      wingAnchor: { x: 317, y: 64.7 },
    },
    gem: {
      body: "assets/dragon_fire_gem_body.png", wing: "assets/dragon_fire_gem_wing.png",
      bodyPivot: { cx: 62.7, cy: 169.4, w: 126, h: 320 },
      shoulder: { left: { x: 16.5, y: 152 }, right: { x: 108.6, y: 152 } },
      wingAnchor: { x: 319, y: 63.4 },
    },
    // gloss = 照り返しの最大の濃さ。wingAlpha = 翼膜の透け（最小〜最大）
    gloss: 0.7, glintColor: "#ffe6ea", belly: 0.70, hueJitter: 7, lightJitter: 0.07, wingAlpha: [0.80, 0.94],
  },
  {
    key: "ice",
    label: "氷竜（アクアマリン）",
    current: {
      body: "assets/dragon_ice_body.png", wing: "assets/dragon_ice_wing.png",
      bodyPivot: { cx: 83.5, cy: 175.0, w: 168, h: 320 },
      shoulder: { left: { x: 24.3, y: 151 }, right: { x: 142.7, y: 151 } },
      wingAnchor: { x: 316, y: 71.2 },
    },
    gem: {
      body: "assets/dragon_ice_gem_body.png", wing: "assets/dragon_ice_gem_wing.png",
      bodyPivot: { cx: 81.8, cy: 175.5, w: 165, h: 320 },
      shoulder: { left: { x: 23.9, y: 151 }, right: { x: 140.2, y: 151 } },
      wingAnchor: { x: 319, y: 69.6 },
    },
    gloss: 0.75, glintColor: "#f2fbff", belly: 0.72, hueJitter: 9, lightJitter: 0.06, wingAlpha: [0.72, 0.9],
  },
  {
    key: "rainbow",
    label: "極光（いまの絵のまま）",
    current: {
      body: "assets/dragon_rainbow_body.png", wing: "assets/dragon_rainbow_wing.png",
      bodyPivot: { cx: 73.0, cy: 168.2, w: 147, h: 320 },
      shoulder: { left: { x: 35.2, y: 185 }, right: { x: 110.8, y: 185 } },
      wingAnchor: { x: 316, y: 58.4 },
    },
    // 宝石の描き直しは「前の方がよかった」ので、絵はいまのまま。照り返しだけ足す
    gem: {
      body: "assets/dragon_rainbow_body.png", wing: "assets/dragon_rainbow_wing.png",
      bodyPivot: { cx: 73.0, cy: 168.2, w: 147, h: 320 },
      shoulder: { left: { x: 35.2, y: 185 }, right: { x: 110.8, y: 185 } },
      wingAnchor: { x: 316, y: 58.4 },
    },
    // 遊色のような虹色なので、1匹ずつの色相のぶれを大きめにする
    gloss: 0.65, glintColor: "#ffffff", belly: 0.72, hueJitter: 18, lightJitter: 0.05, wingAlpha: [0.78, 0.92],
  },
  {
    key: "gargoyle",
    label: "ガーゴイル（灰色の石・光が鈍い系）",
    current: {
      body: "assets/dragon_gargoyle_body.png", wing: "assets/dragon_gargoyle_wing.png",
      bodyPivot: { cx: 115.0, cy: 173.2, w: 231, h: 320 },
      shoulder: { left: { x: 20.9, y: 110 }, right: { x: 209.1, y: 110 } },
      wingAnchor: { x: 317, y: 68.0 },
    },
    gem: {
      body: "assets/dragon_gargoyle_stone_body.png", wing: "assets/dragon_gargoyle_stone_wing.png",
      bodyPivot: { cx: 114.0, cy: 173.9, w: 229, h: 320 },
      shoulder: { left: { x: 20.7, y: 110 }, right: { x: 207.3, y: 110 } },
      wingAnchor: { x: 319, y: 66.9 },
    },
    // 普通の石は不透明でほぼ光らない：照り返しは薄く、翼も透けない。差は明るさのむらで出す
    // DT-597 3回目（Shooter「全然光って見えないのは絵のせい？元の絵をもっと暗く」）: 石の絵を半分ほどの明るさにして、鈍い照り返しが見えるように
    // DT-597 手直し（Shooter「ガーゴイルの鈍い光は全然見えないので、もう少し明るく」）: 0.18→0.4。手足が太いので照り返しの形を強めに縮める
    gloss: 0.4, glintColor: "#f2ede4", belly: 0.60, maskCut: 3.0, maskRegrow: 1.5, hueJitter: 5, lightJitter: 0.1, wingAlpha: [1, 1],
  },
];
const BODY_DRAW_H = 27;   // ゲームと同じ（論理px）
const WING_DRAW_W = 25;
const GLINT_FILES = [0, 1, 2, 3].map((i) => `assets/dragon_gem_glint_${i}.png`);
const TINT_VARIANTS = 3;          // 竜ごとの色むらは、読み込み時に作る3色から選ぶ
const ZOOM = 4;
const GROUND = "#2a3324";

// ---- 決定的なハッシュ（Math.random は使わない） ----
function hash01(index, salt) {
  let h = (index * 374761393 + salt * 668265263) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error("画像を読めない: " + src));
    img.src = src;
  });
}

function makeCanvas(w, h) {
  const canvas = document.createElement("canvas");
  canvas.width = w;
  canvas.height = h;
  return canvas;
}

// 色相回転と明るさを画素に掛けた写しを作る（読み込み時に1回だけ）。
// file:// で開くと getImageData が使えないことがあるので、そのときは元画像を返す。
function tintedCopy(img, hueDegrees, brightness) {
  const canvas = makeCanvas(img.naturalWidth, img.naturalHeight);
  const ctx = canvas.getContext("2d");
  ctx.drawImage(img, 0, 0);
  try {
    const data = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const px = data.data;
    const a = hueDegrees * Math.PI / 180, cos = Math.cos(a), sin = Math.sin(a);
    // 輝度を保つ色相回転行列（CSS の hue-rotate と同じ係数）
    const m = [
      0.213 + cos * 0.787 - sin * 0.213, 0.715 - cos * 0.715 - sin * 0.715, 0.072 - cos * 0.072 + sin * 0.928,
      0.213 - cos * 0.213 + sin * 0.143, 0.715 + cos * 0.285 + sin * 0.140, 0.072 - cos * 0.072 - sin * 0.283,
      0.213 - cos * 0.213 - sin * 0.787, 0.715 - cos * 0.715 + sin * 0.715, 0.072 + cos * 0.928 + sin * 0.072,
    ];
    for (let i = 0; i < px.length; i += 4) {
      if (px[i + 3] === 0) continue;
      const r = px[i], g = px[i + 1], b = px[i + 2];
      px[i]     = (m[0] * r + m[1] * g + m[2] * b) * brightness;
      px[i + 1] = (m[3] * r + m[4] * g + m[5] * b) * brightness;
      px[i + 2] = (m[6] * r + m[7] * g + m[8] * b) * brightness;
    }
    ctx.putImageData(data, 0, 0);
  } catch (error) {
    return img;
  }
  return canvas;
}

// DT-597 手直し（Shooter「照り返しが竜をはみ出している」「足側がはみ出てるのが気になる。腹までに収めて」）:
// ゲーム（index.html の gemGlintBodyMask）と同じ。胴体の形を CUT だけ縮めて脚・腕を消し、REGROW だけ戻し、
// belly（胴体の絵の高さの割合）より後ろ（後脚・尾）を消した形で切り抜く。単位は竜の論理px
const GLINT_MASK_CUT = 2.0, GLINT_MASK_REGROW = 1.0, GLINT_MASK_FEATHER = 0.5, GLINT_MASK_DIRS = 16, GLINT_BELLY_FADE = 0.06;
function glintBodyMask(bodyImg, sp) {
  const w = bodyImg.naturalWidth, h = bodyImg.naturalHeight, pxPerLogical = h / BODY_DRAW_H;
  const ring = (r) => {
    const out = [];
    for (const rr of [r * 0.5, r]) for (let k = 0; k < GLINT_MASK_DIRS; k++) {
      const a = k * Math.PI * 2 / GLINT_MASK_DIRS;
      out.push([Math.cos(a) * rr, Math.sin(a) * rr]);
    }
    return out;
  };
  const eroded = makeCanvas(w, h), ec = eroded.getContext("2d");
  ec.drawImage(bodyImg, 0, 0, w, h);
  ec.globalCompositeOperation = "destination-in";
  for (const [dx, dy] of ring((sp.maskCut ?? GLINT_MASK_CUT) * pxPerLogical)) ec.drawImage(bodyImg, dx, dy, w, h);
  const grown = makeCanvas(w, h), gc = grown.getContext("2d");
  gc.drawImage(eroded, 0, 0);
  for (const [dx, dy] of ring((sp.maskRegrow ?? GLINT_MASK_REGROW) * pxPerLogical)) gc.drawImage(eroded, dx, dy);
  const soft = makeCanvas(w, h), sc = soft.getContext("2d");
  const f = GLINT_MASK_FEATHER * pxPerLogical * 0.5;
  sc.globalCompositeOperation = "lighter";
  sc.globalAlpha = 1 / 9;
  for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) sc.drawImage(grown, ox * f, oy * f);
  sc.globalAlpha = 1;
  sc.globalCompositeOperation = "destination-in";
  sc.drawImage(bodyImg, 0, 0, w, h);
  if (sp.belly !== undefined) {
    const g = sc.createLinearGradient(0, h * (sp.belly - GLINT_BELLY_FADE), 0, h * sp.belly);
    g.addColorStop(0, "rgba(0,0,0,1)");
    g.addColorStop(1, "rgba(0,0,0,0)");
    sc.fillStyle = g;
    sc.fillRect(0, 0, w, h);
  }
  return soft;
}

// 照り返しの絵を竜種ごとに胴体の内側の形で切り抜いておく（読み込み時に1回だけ）。
// こうしておけば描画時は drawImage 1回で済み、竜の外・脚に光がはみ出さない。
function maskedGlint(glintImg, bodyImg, color, bodyMask) {
  const w = bodyImg.naturalWidth, h = bodyImg.naturalHeight;
  const canvas = makeCanvas(w, h);
  const ctx = canvas.getContext("2d");
  ctx.drawImage(glintImg, 0, 0, w, h);
  ctx.globalCompositeOperation = "source-in";
  ctx.fillStyle = color;
  ctx.fillRect(0, 0, w, h);
  ctx.globalCompositeOperation = "destination-in";
  ctx.drawImage(bodyMask, 0, 0, w, h);
  return canvas;
}

// ---- ゲームの drawPartSeparatedDragon と同じ組み方 ----
// spec: 寸法、parts: { body, wing }（Image か Canvas）、原点＝胴体ピボット、上が前
function drawDragon(c, spec, parts, flapFactor, opts) {
  const bodyImg = parts.body, wingImg = parts.wing;
  const bodyNatW = spec.bodyPivot.w, bodyNatH = spec.bodyPivot.h;
  const bodyDrawH = BODY_DRAW_H;
  const bodyDrawW = bodyDrawH * (bodyNatW / bodyNatH);
  const kx = bodyDrawW / bodyNatW, ky = bodyDrawH / bodyNatH;
  const pivotX = spec.bodyPivot.cx * kx, pivotY = spec.bodyPivot.cy * ky;
  const wingNatW = wingImg.naturalWidth || wingImg.width;
  const wingNatH = wingImg.naturalHeight || wingImg.height;
  const wingDrawH = WING_DRAW_W * (wingNatH / wingNatW);
  const rootX = spec.wingAnchor.x * (WING_DRAW_W / wingNatW);
  const rootY = spec.wingAnchor.y * (wingDrawH / wingNatH);
  const shoulder = (raw) => ({ x: kx * (raw.x - spec.bodyPivot.cx), y: ky * (raw.y - spec.bodyPivot.cy) });
  const left = shoulder(spec.shoulder.left), right = shoulder(spec.shoulder.right);

  const wingAlpha = opts && opts.wingAlpha !== undefined ? opts.wingAlpha : 1;
  c.save();
  c.globalAlpha = wingAlpha;
  c.save();
  c.translate(left.x, left.y);
  c.scale(flapFactor, 1);
  c.drawImage(wingImg, -rootX, -rootY, WING_DRAW_W, wingDrawH);
  c.restore();
  c.save();
  c.translate(right.x, right.y);
  c.scale(-flapFactor, 1);
  c.drawImage(wingImg, -rootX, -rootY, WING_DRAW_W, wingDrawH);
  c.restore();
  c.restore();

  c.drawImage(bodyImg, -pivotX, -pivotY, bodyDrawW, bodyDrawH);
  // 照り返し：画像1枚を薄く重ねるだけ
  if (opts && opts.glint && opts.glintAlpha > 0.01) {
    c.save();
    c.globalAlpha = Math.min(1, opts.glintAlpha);
    c.globalCompositeOperation = "lighter";
    c.drawImage(opts.glint, -pivotX, -pivotY, bodyDrawW, bodyDrawH);
    if (opts.glint2 && opts.glintAlpha2 > 0.01) {   // 腹の2本の窓が重なる向きだけ、もう1枚
      c.globalAlpha = Math.min(1, opts.glintAlpha2);
      c.drawImage(opts.glint2, -pivotX, -pivotY, bodyDrawW, bodyDrawH);
    }
    c.restore();
  }
}

// ---- 照り返し：竜の向き（と地図上の位置）だけで決める ----
// 光源は見せない・動かさない。「この向きを向いた竜はきらっとする」という向きを地図に1つ決めておくだけ。
// 時間は使わないので、同じ位置・同じ向きの竜はいつでも同じ照り返しになる。
// 群れが曲がると、先頭から順にその向きを通るので、光が群れの中を走って見える（イワシの群れのつもり）。
const GLINT_HEADING = 0.35;  // 見比べの止めた竜の向き（肩が光る向き）
// DT-597 4回目（Shooter「多すぎる。それぞれの光る幅は広すぎるので半分に。箇所も3箇所に」）:
// 1か所の幅を半分に：±8°で最大・±28°で消える → ±4°で最大・±14°で消える
const GLINT_FULL = 4 * Math.PI / 180; // この角度までは照り返しが最大
const GLINT_EDGE = 14 * Math.PI / 180; // ここまでで段々に消える
// 向きの窓は3つ（6か所 → 3か所）：120°おき。窓どうしの間に 92° ずつ照り返しが0の向きがあるので、
// 照り返しの絵が切り替わるのは必ず照り返しが0のとき（いきなり切り替わらない）
// DT-597 手直し（v3.174.0・11/22 Shooter「背中の中央が光るのをやめて、肩と、腹と、逆側の腹の3箇所に。光る角度はすべてその線が同じ角度に入るときに」）:
// どの光の筋も、画面の上でその筋が GLINT_LINE_ANGLE の向きにそろったときに光る。ゲーム（index.html の GEM_GLINT_LINES）と同じ値
const GLINT_LINES = [{ image: 3, axis: 29 }, { image: 1, axis: 98 }, { image: 2, axis: 82 }];   // 肩・左の腹・右の腹（絵の筋の向き・度）
const GLINT_LINE_ANGLE = 139;
const GLINT_WINDOWS = GLINT_LINES.map((l) => ({ center: (GLINT_LINE_ANGLE - l.axis - 90) * Math.PI / 180, image: l.image }));
// 「角度＋位置」のとき：地図に固定した斜めの縞の上にいる竜だけが照り返す（縞は描かない）
const STRIPE_ANGLE = 0.6;
const STRIPE_SPACING = 150;

function wrapAngle(a) {
  while (a <= -Math.PI) a += Math.PI * 2;
  while (a > Math.PI) a -= Math.PI * 2;
  return a;
}

function smoothstep(edge0, edge1, x) {
  const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
  return t * t * (3 - 2 * t);
}

function stripeGain(x, y) {
  const along = (x * Math.cos(STRIPE_ANGLE) + y * Math.sin(STRIPE_ANGLE)) / STRIPE_SPACING;
  const wave = 0.5 + 0.5 * Math.cos(along * Math.PI * 2);
  return smoothstep(0.3, 0.85, wave);
}

function glintFor(x, y, heading, usePosition) {
  const out = { index: 0, strength: 0, index2: 0, strength2: 0 };
  const byPosition = usePosition ? stripeGain(x, y) : 1;
  for (const win of GLINT_WINDOWS) {
    const off = Math.abs(wrapAngle(heading - win.center));
    if (off >= GLINT_EDGE) continue;
    const byAngle = 1 - smoothstep(GLINT_FULL, GLINT_EDGE, off);
    if (out.strength === 0) { out.index = win.image; out.strength = byAngle * byPosition; }
    else { out.index2 = win.image; out.strength2 = byAngle * byPosition; break; }
  }
  return out;
}

// ---- 読み込み ----
async function loadAll() {
  const glints = await Promise.all(GLINT_FILES.map(loadImage));
  for (const sp of SPECIES) {
    const [cb, cw, gb, gw] = await Promise.all([
      loadImage(sp.current.body), loadImage(sp.current.wing), loadImage(sp.gem.body), loadImage(sp.gem.wing)]);
    sp.currentParts = { body: cb, wing: cw };
    sp.gemParts = { body: gb, wing: gw };
    const bodyMask = glintBodyMask(gb, sp);
    sp.glints = glints.map((g) => maskedGlint(g, gb, sp.glintColor, bodyMask));
    // 色むらの3色：色相を -j/0/+j、明るさを少しずらす
    sp.variants = [];
    for (let v = 0; v < TINT_VARIANTS; v++) {
      const t = v - 1;
      sp.variants.push({
        body: tintedCopy(gb, t * sp.hueJitter, 1 + t * sp.lightJitter * (v === 0 ? 1 : 0.6)),
        wing: tintedCopy(gw, t * sp.hueJitter, 1 + t * sp.lightJitter * (v === 0 ? 1 : 0.6)),
      });
    }
  }
}

function setupCanvas(canvas, cssW, cssH) {
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  canvas.style.width = cssW + "px";
  canvas.style.height = cssH + "px";
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingQuality = "high";
  return { ctx, dpr, w: cssW, h: cssH };
}

// ---- 1. 群れ：プレイヤーの引いた線（毎回ちがう形）をなぞって飛ぶ ----
const state = { filter: "all", usePosition: false, showPath: true, glintOn: true, paused: false };
const FLOCK_SPEED = 75;          // 群れの速さ（論理px/秒）
const FLOCK_ALONG = 85;          // 群れの前後の広がり（半分）
const FLOCK_ACROSS = 34;         // 群れの左右の広がり（半分）
const DRAGONS_PER_SPECIES = 40;
const DRAGONS_PER_SPECIES_MIXED = 12;
const TRAY_HEIGHT = 440;
const PATH_SAMPLES = 2400;
// なぞる線は毎回ちがう形（DT-597 3回目・Shooter「サンプルの軌道はもっとランダムに」）。
// 閉じた曲線にするため、ゆらぎの波（1〜PATH_HARMONICS 番目）を重ねて作り、枠に収める
const PATH_HARMONICS = 7;
let pathSeed = 1 + Math.floor(Date.now() % 100000);   // ページを開くたびに変わる（「軌道を変える」でも変わる）
let trayView = null;
let dragons = [];
let path = null;

function buildPath(width, height) {
  const waves = [];
  for (let k = 1; k <= PATH_HARMONICS; k++) {
    // 高い波ほど小さく（大きくうねりつつ、ときどき小さく曲がる）
    const amp = 1 / Math.pow(k, 1.1);
    waves.push({ k, ax: amp * (hash01(pathSeed, k * 4) - 0.5), px: hash01(pathSeed, k * 4 + 1) * Math.PI * 2,
                 ay: amp * (hash01(pathSeed, k * 4 + 2) - 0.5), py: hash01(pathSeed, k * 4 + 3) * Math.PI * 2 });
  }
  const raw = [];
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (let i = 0; i <= PATH_SAMPLES; i++) {
    const u = (i / PATH_SAMPLES) * Math.PI * 2;
    let x = 0, y = 0;
    for (const w of waves) { x += w.ax * Math.sin(w.k * u + w.px); y += w.ay * Math.sin(w.k * u + w.py); }
    raw.push({ x, y });
    minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, y); maxY = Math.max(maxY, y);
  }
  const margin = FLOCK_ALONG * 0.6;
  const sx = (width - margin * 2) / Math.max(1e-6, maxX - minX), sy = (height - margin * 2) / Math.max(1e-6, maxY - minY);
  const points = [];
  let length = 0;
  for (let i = 0; i <= PATH_SAMPLES; i++) {
    const p = { x: margin + (raw[i].x - minX) * sx, y: margin + (raw[i].y - minY) * sy, s: 0 };
    if (i > 0) {
      const q = points[i - 1];
      length += Math.hypot(p.x - q.x, p.y - q.y);
    }
    p.s = length;
    points.push(p);
  }
  return { points, length };
}

// 線の上の道のり s の点と向き
function pointOnPath(s) {
  const total = path.length;
  s = ((s % total) + total) % total;
  let lo = 0, hi = path.points.length - 1;
  while (hi - lo > 1) {
    const mid = (lo + hi) >> 1;
    if (path.points[mid].s <= s) lo = mid; else hi = mid;
  }
  const a = path.points[lo], b = path.points[hi];
  const t = (s - a.s) / Math.max(1e-6, b.s - a.s);
  return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t, heading: Math.atan2(b.y - a.y, b.x - a.x) };
}

function buildDragons() {
  dragons = [];
  const pool = state.filter === "all" ? SPECIES : SPECIES.filter((s) => s.key === state.filter);
  const count = state.filter === "all" ? DRAGONS_PER_SPECIES_MIXED : DRAGONS_PER_SPECIES;
  const total = pool.length * count;
  for (let n = 0; n < total; n++) {
    const seed = n + 1;
    const sp = pool[n % pool.length];
    // 群れの中の持ち場：楕円の中に散らす（真ん中ほど密）
    const radius = Math.sqrt(hash01(seed, 1));
    const angle = hash01(seed, 2) * Math.PI * 2;
    dragons.push({
      sp,
      along: Math.cos(angle) * radius * FLOCK_ALONG,
      across: Math.sin(angle) * radius * FLOCK_ACROSS,
      // 1匹ずつ向きが少し揺れる（同じ群れでも光る竜と光らない竜が混ざる）
      wobble: 0.06 + hash01(seed, 3) * 0.1,
      wobbleRate: 1.2 + hash01(seed, 11) * 1.6,
      wobblePhase: hash01(seed, 12) * Math.PI * 2,
      x: 0, y: 0, heading: 0,
      variant: Math.floor(hash01(seed, 4) * TINT_VARIANTS),
      wingAlpha: sp.wingAlpha[0] + (sp.wingAlpha[1] - sp.wingAlpha[0]) * hash01(seed, 6),
      flapPhase: hash01(seed, 7) * Math.PI * 2,
      flapRate: 5.5 + hash01(seed, 8) * 2.5,
      scale: 0.94 + hash01(seed, 9) * 0.12,
    });
  }
  stepTray(simTime);
}

function setupTray() {
  const canvas = document.getElementById("tray");
  const width = Math.max(300, Math.round(canvas.parentElement.clientWidth - 24));
  trayView = setupCanvas(canvas, width, TRAY_HEIGHT);
  path = buildPath(width, TRAY_HEIGHT);
  buildDragons();
}

function stepTray(time) {
  const flockS = time * FLOCK_SPEED;
  for (const d of dragons) {
    const p = pointOnPath(flockS + d.along);
    const nx = -Math.sin(p.heading), ny = Math.cos(p.heading);
    d.x = p.x + nx * d.across;
    d.y = p.y + ny * d.across;
    d.heading = p.heading + Math.sin(time * d.wobbleRate + d.wobblePhase) * d.wobble;
  }
}

function drawTray(time) {
  const { ctx, dpr, w, h } = trayView;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);
  if (state.showPath) {
    ctx.save();
    ctx.strokeStyle = "rgba(255,255,255,0.35)";
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 7]);
    ctx.beginPath();
    for (let i = 0; i < path.points.length; i++) {
      const p = path.points[i];
      if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();
    ctx.restore();
  }
  for (const d of dragons) {
    const g = glintFor(d.x, d.y, d.heading, state.usePosition);
    const parts = d.sp.variants[d.variant];
    const flap = 0.55 + 0.45 * (0.5 + 0.5 * Math.sin(time * d.flapRate + d.flapPhase));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.translate(d.x, d.y);
    // 画像の上＝前なので、進行方向に +90° 足して回す
    ctx.rotate(d.heading + Math.PI / 2);
    ctx.scale(d.scale, d.scale);
    drawDragon(ctx, d.sp.gem, parts, flap, {
      wingAlpha: d.wingAlpha,
      glint: state.glintOn ? d.sp.glints[g.index] : null,
      glintAlpha: g.strength * d.sp.gloss,
      glint2: state.glintOn ? d.sp.glints[g.index2] : null,
      glintAlpha2: g.strength2 * d.sp.gloss,
    });
  }
}

// ---- 2. 見比べ ----
const comparePanels = [];
const COMPARE_TURN_RATE = 0.45;  // 4倍の新しい絵が向きを変える速さ（ラジアン/秒）

function buildCompare() {
  const root = document.getElementById("compare");
  for (const sp of SPECIES) {
    const card = document.createElement("div");
    card.className = "card";
    const title = document.createElement("h3");
    title.textContent = sp.label;
    card.appendChild(title);
    const row = document.createElement("div");
    row.className = "row";
    const addCell = (labelText, w, h, kind, zoom) => {
      const cell = document.createElement("div");
      cell.className = "cell";
      const canvas = document.createElement("canvas");
      const label = document.createElement("span");
      label.textContent = labelText;
      cell.appendChild(canvas);
      cell.appendChild(label);
      row.appendChild(cell);
      comparePanels.push({ sp, kind, zoom, view: setupCanvas(canvas, w, h) });
    };
    const same = sp.key === "rainbow";
    addCell("いまの絵（等倍）", 76, 64, "current", 1);
    addCell(same ? "いまの絵＋照り返し（等倍）" : "新しい絵（等倍）", 76, 64, "gem", 1);
    addCell("いまの絵（4倍）", 220, 170, "current", ZOOM);
    addCell(same ? "いまの絵＋照り返し（4倍・回る）" : "新しい絵（4倍・回る）", 220, 170, "gem", ZOOM);
    card.appendChild(row);
    root.appendChild(card);
  }
}

function drawCompare(time) {
  for (const p of comparePanels) {
    const { ctx, dpr, w, h } = p.view;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, w, h);
    ctx.translate(w / 2, h / 2 + 2 * p.zoom);
    ctx.scale(p.zoom, p.zoom);
    if (p.kind === "current") {
      drawDragon(ctx, p.sp.current, p.sp.currentParts, 1);
      continue;
    }
    // 4倍の方はゆっくり回し、決まった向きを通るときだけ照り返しが入る様子を見せる
    const heading = p.zoom > 1 ? -Math.PI / 2 + time * COMPARE_TURN_RATE : GLINT_HEADING;
    const g = glintFor(0, 0, heading, false);
    ctx.rotate(heading + Math.PI / 2);
    drawDragon(ctx, p.sp.gem, p.sp.gemParts, 1, {
      glint: p.sp.glints[g.index], glintAlpha: g.strength * p.sp.gloss, wingAlpha: p.sp.wingAlpha[1],
      glint2: p.sp.glints[g.index2], glintAlpha2: g.strength2 * p.sp.gloss });
  }
}

// ---- ボタン ----
const MODE_NOTES = {
  angle: "角度だけ：決まった向き（120°おきに3か所。それぞれ±4°で最大、±14°までで段々に消える）を向いた竜だけが照り返す。群れが曲がると先頭から順に光が走る。",
  position: "角度＋位置：上の条件に加えて、地図に固定した斜めの縞（見えない）の上にいるときだけ照り返す。同じ場所を同じ向きで通れば毎回同じところで光る。",
};

function makeChip(parent, label, pressed, onClick) {
  const b = document.createElement("button");
  b.textContent = label;
  b.setAttribute("aria-pressed", String(pressed));
  b.addEventListener("click", () => onClick(b));
  parent.appendChild(b);
  return b;
}

function buildChips() {
  const speciesChips = document.getElementById("speciesChips");
  const options = [{ key: "all", label: "全部まぜる" }].concat(
    SPECIES.map((s) => ({ key: s.key, label: s.label.replace(/（.*/, "") })));
  for (const o of options) {
    makeChip(speciesChips, o.label, state.filter === o.key, (b) => {
      state.filter = o.key;
      for (const other of speciesChips.children) other.setAttribute("aria-pressed", "false");
      b.setAttribute("aria-pressed", "true");
      buildDragons();
    });
  }
  const modeChips = document.getElementById("modeChips");
  const note = document.getElementById("modeNote");
  const modes = [{ key: "angle", label: "角度だけ" }, { key: "position", label: "角度＋位置" }];
  for (const m of modes) {
    makeChip(modeChips, m.label, (m.key === "position") === state.usePosition, (b) => {
      state.usePosition = m.key === "position";
      for (const other of modeChips.children) other.setAttribute("aria-pressed", "false");
      b.setAttribute("aria-pressed", "true");
      note.textContent = MODE_NOTES[m.key];
    });
  }
  note.textContent = MODE_NOTES[state.usePosition ? "position" : "angle"];
  const optionChips = document.getElementById("optionChips");
  const toggles = [
    { prop: "glintOn", label: "照り返し" },
    { prop: "showPath", label: "なぞる線" },
    { prop: "paused", label: "止める" },
  ];
  makeChip(optionChips, "軌道を変える", false, () => { pathSeed++; setupTray(); });
  for (const t of toggles) {
    makeChip(optionChips, t.label, state[t.prop], (b) => {
      state[t.prop] = !state[t.prop];
      b.setAttribute("aria-pressed", String(state[t.prop]));
    });
  }
}

let simTime = 0;
let lastFrame = 0;
function frame(now) {
  const dt = Math.min(0.05, lastFrame ? (now - lastFrame) / 1000 : 0);
  lastFrame = now;
  if (!state.paused) {
    simTime += dt;
    stepTray(simTime);
  }
  drawCompare(simTime);
  drawTray(simTime);
  requestAnimationFrame(frame);
}

loadAll().then(() => {
  // ?t=秒 でその時刻から始める、?mode=position で「角度＋位置」から始める（スクリーンショットの確認用）
  const params = new URLSearchParams(location.search);
  const startAt = Number(params.get("t"));
  if (startAt > 0) simTime = startAt;
  if (params.get("mode") === "position") state.usePosition = true;
  buildCompare();
  buildChips();
  setupTray();
  requestAnimationFrame(frame);
}).catch((error) => {
  const p = document.createElement("p");
  p.textContent = String(error.message || error);
  document.querySelector("main").prepend(p);
});
</script>
