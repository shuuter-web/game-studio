<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>竜の新デザイン見本</title>
<style>
:root{--bg:#1d2e1b;--fg:#eef3ea;--sub:#a9b9a4;--card:#27401f}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;padding:16px}
h1{font-size:20px;margin:0 0 4px}p{color:var(--sub);font-size:14px;margin:0 0 16px}
section{background:var(--card);border-radius:10px;padding:12px;margin-bottom:16px}
h2{font-size:17px;margin:0 0 8px}.row{display:flex;flex-wrap:wrap;gap:12px}
figure{margin:0;flex:1 1 280px;text-align:center}figure img{max-width:100%;height:auto}
figcaption{font-size:13px;color:var(--sub);margin-top:4px}.parts img{max-height:220px;margin:4px}
</style></head><body>
<h1>竜の新デザイン見本（DT-650）</h1>
<p>宝石にする前の、最初のデザインだけ。胴と翼を並べた絵は目安の組み合わせ（ゲームでの翼の付け根は、決まってから測って合わせます）。ゲームにはまだ入れていません。</p>
<section><h2>鮫竜（もっと鮫らしく：ホホジロザメの頭・えら・背びれ、翼は胸びれ）</h2><div class="row">
<figure><img src="assets/design_candidates/preview_shark_now.png" alt=""><figcaption>いま</figcaption></figure>
<figure><img src="assets/design_candidates/preview_shark_new.png" alt=""><figcaption>新しいデザイン</figcaption></figure></div>
<div class="parts"><img src="assets/design_candidates/dragon_shark_body.png" alt=""><img src="assets/design_candidates/dragon_shark_wing.png" alt=""></div></section>
<section><h2>亀竜（恐竜の鎧竜・アンキロサウルス：背の装甲板と鋲、脇の棘）</h2><div class="row">
<figure><img src="assets/design_candidates/preview_tortoise_now.png" alt=""><figcaption>いま</figcaption></figure>
<figure><img src="assets/design_candidates/preview_tortoise_new.png" alt=""><figcaption>新しいデザイン</figcaption></figure></div>
<div class="parts"><img src="assets/design_candidates/dragon_tortoise_body.png" alt=""><img src="assets/design_candidates/dragon_tortoise_wing.png" alt=""></div></section>
<section><h2>雷雲竜（デザインはそのまま、胴の絵の尻尾を除いた）</h2><div class="row">
<figure><img src="assets/design_candidates/preview_thunder_now.png" alt=""><figcaption>いま（胴の絵の尻尾とゲームの尻尾で2本）</figcaption></figure>
<figure><img src="assets/design_candidates/preview_thunder_new.png" alt=""><figcaption>尻尾を除いた胴（尻尾はゲームが描く1本だけ）</figcaption></figure></div></section>
</body></html>
