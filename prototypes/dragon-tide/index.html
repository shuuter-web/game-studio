<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>竜潮 / Dragon Tide — World Map</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #08101a;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #stage { display: block; width: 100%; height: 100%; }

  /* 右上 HUD: FPS */
  #hud {
    position: fixed;
    top: env(safe-area-inset-top, 8px);
    right: 8px;
    padding: 5px 8px;
    background: rgba(8, 16, 26, 0.70);
    border: 1px solid rgba(120, 200, 255, 0.20);
    border-radius: 6px;
    font-family: -apple-system, BlinkMacSystemFont, monospace;
    font-size: 11px;
    line-height: 1.6;
    color: #fff;
    pointer-events: none;
    min-width: 70px;
    text-align: right;
  }
  #hud .k { color: #6fa6c8; margin-right: 4px; }

  /* 左上 HUD: FLOCK残数 */
  #hud-left {
    position: fixed;
    top: env(safe-area-inset-top, 8px);
    left: 8px;
    padding: 5px 8px;
    background: rgba(8, 16, 26, 0.70);
    border: 1px solid rgba(120, 200, 255, 0.20);
    border-radius: 6px;
    font-family: -apple-system, BlinkMacSystemFont, monospace;
    font-size: 13px;
    line-height: 1.6;
    color: #fff;
    pointer-events: none;
  }
  #hud-left .label { color: #6fa6c8; font-size: 10px; }

  /* 右下 HUD: 卵カウント */
  #hud-eggs {
    position: fixed;
    bottom: calc(20vh + env(safe-area-inset-bottom, 0px) + 8px);
    right: 8px;
    padding: 5px 10px;
    background: rgba(8, 16, 26, 0.70);
    border: 1px solid rgba(255, 200, 40, 0.30);
    border-radius: 6px;
    font-family: -apple-system, BlinkMacSystemFont, monospace;
    font-size: 13px;
    color: #ffd040;
    pointer-events: none;
  }

  /* 左下 HUD: ミニマップ */
  #minimap-container {
    position: fixed;
    bottom: calc(20vh + env(safe-area-inset-bottom, 0px) + 8px);
    left: 8px;
    background: rgba(8, 16, 26, 0.80);
    border: 1px solid rgba(120, 200, 255, 0.25);
    border-radius: 4px;
    pointer-events: none;
    overflow: hidden;
  }
  #minimap { display: block; }

  /* 隊形切替ボタン — 画面下部 */
  #formation-bar {
    position: fixed;
    bottom: 0;
    left: 0; right: 0;
    height: calc(20vh + env(safe-area-inset-bottom, 0px));
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    pointer-events: none;
  }
  .formation-btn {
    pointer-events: auto;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: 2px solid rgba(120, 200, 255, 0.35);
    background: rgba(10, 22, 38, 0.80);
    color: #d8e6f2;
    font-size: 11px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    -webkit-tap-highlight-color: transparent;
    line-height: 1.2;
    gap: 2px;
  }
  .formation-btn .icon { font-size: 20px; line-height: 1; }
  .formation-btn .label { font-size: 9px; color: #8ab; opacity: 0.8; }
  .formation-btn.active {
    background: rgba(30, 90, 138, 0.90);
    border-color: #6fc0ff;
    box-shadow: 0 0 12px rgba(111, 192, 255, 0.40);
  }
  .formation-btn.active .label { color: #adf; opacity: 1; }

  /* リトライ / クリアオーバーレイ */
  #overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 20px;
    pointer-events: none;
  }
  #overlay.visible { display: flex; pointer-events: auto; }
  #overlay-title {
    font-family: -apple-system, BlinkMacSystemFont, monospace;
    font-size: 28px;
    color: #fff;
    text-shadow: 0 0 20px rgba(255,200,80,0.8);
    letter-spacing: 0.08em;
    opacity: 0;
    transition: opacity 0.8s;
  }
  #overlay-title.show { opacity: 1; }
  #retry-btn {
    padding: 14px 40px;
    background: rgba(180, 40, 40, 0.85);
    border: 2px solid rgba(255, 100, 100, 0.60);
    border-radius: 30px;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, monospace;
    font-size: 16px;
    cursor: pointer;
    display: none;
    pointer-events: auto;
    letter-spacing: 0.1em;
  }
  #retry-btn.visible { display: block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<!-- 右上 HUD: FPS -->
<div id="hud">
  <span class="k">FPS</span><span id="h-fps">--</span>
</div>

<!-- 左上 HUD: FLOCK残数 -->
<div id="hud-left">
  <div class="label">FLOCK</div>
  <span id="h-alive">20</span> / <span id="h-max">20</span>
</div>

<!-- 右下 HUD: 卵 -->
<div id="hud-eggs">&#x1F95A; x <span id="h-eggs">0</span></div>

<!-- 左下: ミニマップ -->
<div id="minimap-container">
  <canvas id="minimap" width="80" height="60"></canvas>
</div>

<!-- 隊形ボタン -->
<div id="formation-bar">
  <button class="formation-btn active" id="btn-tight"  data-formation="tight">
    <span class="icon">&#9679;</span><span class="label">密集</span>
  </button>
  <button class="formation-btn"       id="btn-spread" data-formation="spread">
    <span class="icon">&#8756;</span><span class="label">散開</span>
  </button>
  <button class="formation-btn"       id="btn-ring"   data-formation="ring">
    <span class="icon">&#9675;</span><span class="label">円環</span>
  </button>
</div>

<!-- ゲームオーバー/クリアオーバーレイ -->
<div id="overlay">
  <div id="overlay-title">EPOCH CONQUERED</div>
  <button id="retry-btn">R — リスタート</button>
</div>

<script>
"use strict";

/* ============================================================
 * 竜潮 / Dragon Tide — World Map Edition
 *
 * コアファンタジー（GDD §3）:
 *   「竜の群れが世界を渡り歩き、文明を蹂躙していく」
 *
 * 実装方針:
 *   - Boids / ウェイポイント / 隊形ロジックは Phase2 から流用
 *   - ワールド座標系 + カメラ追従を新規追加
 *   - 集落（静的ターゲット）と投射物システムを新規実装
 *   - setInterval(16ms) 固定維持
 * ============================================================ */

// -----------------------------------------------------------------
// ワールド定数
// -----------------------------------------------------------------
const WORLD_W = 3200;
const WORLD_H = 2400;

// -----------------------------------------------------------------
// バランスデータ（Phase2から流用）
// -----------------------------------------------------------------
const BASE_CFG = {
  perception:       40,
  separationRadius: 18,
  maxSpeed:         160,
  minSpeed:         60,
  maxForce:         320,
  wSeparation:      1.8,
  wAlignment:       1.0,
  wCohesion:        0.9,
  wLeader:          1.6,
  leaderSeekDist:   80,
  pathMaxPoints:    240,
  pathMinSegment:   8,
  leaderSpeed:      220,
  idleWanderRadius: 120,
  fixedStepMs:      16,
  maxDtMs:          64,
};

const FORMATION_OVERRIDES = {
  tight:  { wCohesion: 2.2, wSeparation: 0.8, perception: 30, separationRadius: 12 },
  spread: { wCohesion: 0.4, wSeparation: 2.5, perception: 55, separationRadius: 28 },
  ring:   { wCohesion: 1.5, wSeparation: 1.2, perception: 45, separationRadius: 22, ringRadius: 80 },
};

// 隊形別戦闘パラメータ（新仕様）
// 密集: 攻撃力×2.0・被弾率×1.3 / 散開: ×0.8・×0.6 / 円環: ×0.6・×0.3
const FORMATION_COMBAT = {
  tight:  { attackMultiplier: 2.0, hitRateMultiplier: 1.3, flashColor: "rgba(255,80,40,0.15)" },
  spread: { attackMultiplier: 0.8, hitRateMultiplier: 0.6, flashColor: "rgba(60,120,255,0.15)" },
  ring:   { attackMultiplier: 0.6, hitRateMultiplier: 0.3, flashColor: "rgba(40,200,100,0.15)" },
};

// -----------------------------------------------------------------
// Canvas セットアップ
// -----------------------------------------------------------------
const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });

const minimapCanvas = document.getElementById("minimap");
const minimapCtx = minimapCanvas.getContext("2d");

let viewW = 0, viewH = 0, dpr = 1;
let bottomUIHeight = 0;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  viewW = window.innerWidth;
  viewH = window.innerHeight;
  bottomUIHeight = viewH * 0.20;
  canvas.width  = Math.floor(viewW * dpr);
  canvas.height = Math.floor(viewH * dpr);
  canvas.style.width  = viewW + "px";
  canvas.style.height = viewH + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", resize);
resize();

// -----------------------------------------------------------------
// カメラ（ワールド座標系でのカメラ中心）
// -----------------------------------------------------------------
const cam = { x: 400, y: WORLD_H / 2 };

// ワールド座標 → スクリーン座標変換
function worldToScreen(wx, wy) {
  return {
    x: wx - cam.x + viewW * 0.5,
    y: wy - cam.y + viewH * 0.5,
  };
}

// スクリーン座標 → ワールド座標変換
function screenToWorld(sx, sy) {
  return {
    x: sx + cam.x - viewW * 0.5,
    y: sy + cam.y - viewH * 0.5,
  };
}

// カメラを群れの重心に向けてlerpで追従（追従係数0.08）
function updateCamera(dt) {
  const centroid = calcFriendlyCentroid();
  const lerpFactor = 0.08;
  cam.x += (centroid.x - cam.x) * lerpFactor;
  cam.y += (centroid.y - cam.y) * lerpFactor;
  // カメラをワールド境界内にクランプ
  cam.x = Math.max(viewW * 0.5, Math.min(WORLD_W - viewW * 0.5, cam.x));
  cam.y = Math.max(viewH * 0.5, Math.min(WORLD_H - viewH * 0.5, cam.y));
}

// -----------------------------------------------------------------
// 集落定義
// -----------------------------------------------------------------

// 集落種別パラメータ
// hitProb: フレームごとの近接攻撃確率（基準値。隊形で補正）
const SETTLEMENT_TYPES = {
  village: {
    name: "石器村",
    color: "#e07030",
    shape: "circle",
    radius: 22,
    maxHp: 20,
    attackRadius: 180,
    projectileInterval: 2.0,   // 秒
    projectileSpeed: 90,
    projectileDamage: 1,
    projectileColor: "#c0a060",
    projectileCount: 1,
    projectileTracking: false,
    reward: { eggMin: 3, eggMax: 5 },
    hitProb: 0.15,
  },
  ancientCity: {
    name: "古代都市",
    color: "#4070c0",
    shape: "square",
    radius: 28,
    maxHp: 40,
    attackRadius: 220,
    projectileInterval: 2.5,
    projectileSpeed: 70,
    projectileDamage: 1,        // 着弾時に周囲20pxに範囲ダメージ
    projectileColor: "#8090d0",
    projectileCount: 1,
    projectileTracking: false,
    projectileAoe: 20,
    reward: { eggMin: 4, eggMax: 6 },
    hitProb: 0.15,
  },
  medievalTown: {
    name: "中世の町",
    color: "#808080",
    shape: "squareTower",
    radius: 32,
    maxHp: 60,
    attackRadius: 250,
    projectileInterval: 1.5,
    projectileSpeed: 110,
    projectileDamage: 1,
    projectileColor: "#aaa",
    projectileCount: 3,         // 扇状3本
    projectileTracking: false,
    reward: { eggMin: 5, eggMax: 7 },
    hitProb: 0.15,
  },
  feudalCastle: {
    name: "封建城",
    color: "#e0e0e0",
    shape: "square",
    radius: 40,
    maxHp: 100,
    attackRadius: 300,
    projectileInterval: 1.2,
    projectileSpeed: 200,
    projectileDamage: 1,
    projectileColor: "#f0c040",
    projectileCount: 1,
    projectileTracking: false,
    reward: { eggMin: 6, eggMax: 9 },
    hitProb: 0.15,
  },
  templeCity: {
    name: "神殿都市",
    color: "#ffd700",
    shape: "hexagon",
    radius: 35,
    maxHp: 80,
    attackRadius: 280,
    projectileInterval: 1.8,
    projectileSpeed: 130,
    projectileDamage: 1,
    projectileColor: "#ffe060",
    projectileCount: 1,
    projectileTracking: true,   // 追尾あり
    reward: { eggMin: 5, eggMax: 8 },
    hitProb: 0.15,
  },
  modernFortress: {
    name: "近世要塞",
    color: "#405060",
    shape: "star",
    radius: 50,
    maxHp: 150,
    attackRadius: 320,
    projectileInterval: 0.6,
    projectileSpeed: 250,
    projectileDamage: 1,
    projectileColor: "#80c0ff",
    projectileCount: 5,         // 多方向
    projectileTracking: false,
    reward: { eggMin: 8, eggMax: 12 },
    hitProb: 0.15,
    isFinalBoss: true,
  },
};

// マップ上の集落配置
const SETTLEMENT_DEFINITIONS = [
  { type: "village",        wx: 400,  wy: 1200 },
  { type: "village",        wx: 700,  wy: 600  },
  { type: "village",        wx: 700,  wy: 1800 },
  { type: "ancientCity",    wx: 1000, wy: 900  },
  { type: "ancientCity",    wx: 1100, wy: 1600 },
  { type: "medievalTown",   wx: 1500, wy: 700  },
  { type: "medievalTown",   wx: 1600, wy: 1800 },
  { type: "feudalCastle",   wx: 2000, wy: 1200 },
  { type: "templeCity",     wx: 2400, wy: 700  },
  { type: "templeCity",     wx: 2400, wy: 1700 },
  { type: "modernFortress", wx: 3000, wy: 1200 },
];

// 集落の状態
const settlements = SETTLEMENT_DEFINITIONS.map(def => ({
  ...def,
  params: SETTLEMENT_TYPES[def.type],
  hp: SETTLEMENT_TYPES[def.type].maxHp,
  fallen: false,
  attackTimer: Math.random() * SETTLEMENT_TYPES[def.type].projectileInterval,
}));

// -----------------------------------------------------------------
// 投射物プール（最大200個）
// -----------------------------------------------------------------
const MAX_PROJECTILES = 200;

const projWx      = new Float32Array(MAX_PROJECTILES);
const projWy      = new Float32Array(MAX_PROJECTILES);
const projVx      = new Float32Array(MAX_PROJECTILES);
const projVy      = new Float32Array(MAX_PROJECTILES);
const projActive  = new Uint8Array(MAX_PROJECTILES);
const projDmg     = new Float32Array(MAX_PROJECTILES);
const projAoe     = new Float32Array(MAX_PROJECTILES); // 範囲半径 0=なし
const projTracking = new Uint8Array(MAX_PROJECTILES);  // 追尾フラグ
const projTargetIdx = new Int32Array(MAX_PROJECTILES); // 追尾対象boid index
const projColor   = new Array(MAX_PROJECTILES).fill("#fff");
const projTailX   = new Float32Array(MAX_PROJECTILES); // 1フレーム前の位置（尾描画）
const projTailY   = new Float32Array(MAX_PROJECTILES);

// 投射物をスポーンする。最も近いboidを対象にする。
function spawnProjectile(fromWx, fromWy, targetBoidIdx, speed, damage, color, aoe, isTracking) {
  // 空スロットを探す
  let slot = -1;
  for (let i = 0; i < MAX_PROJECTILES; i++) {
    if (!projActive[i]) { slot = i; break; }
  }
  if (slot < 0) return; // プール枯渇は無視（GCゼロ設計）

  projActive[slot]  = 1;
  projWx[slot]      = fromWx;
  projWy[slot]      = fromWy;
  projTailX[slot]   = fromWx;
  projTailY[slot]   = fromWy;
  projDmg[slot]     = damage;
  projAoe[slot]     = aoe ?? 0;
  projTracking[slot] = isTracking ? 1 : 0;
  projTargetIdx[slot] = targetBoidIdx;
  projColor[slot]   = color;

  // 対象boidへの初期方向を計算
  if (targetBoidIdx >= 0 && !boidDead[targetBoidIdx]) {
    const dx = px[targetBoidIdx] - fromWx;
    const dy = py[targetBoidIdx] - fromWy;
    const d  = Math.sqrt(dx * dx + dy * dy) || 1;
    projVx[slot] = (dx / d) * speed;
    projVy[slot] = (dy / d) * speed;
  } else {
    // 対象なしのときは右方向に飛ばす
    projVx[slot] = speed;
    projVy[slot] = 0;
  }
}

// 最も近い生存boidのインデックスを返す（なければ-1）
function findNearestAliveBoid(wx, wy) {
  let nearest = -1;
  let nearestDist2 = Infinity;
  for (let i = 0; i < N; i++) {
    if (boidDead[i]) continue;
    const dx = px[i] - wx;
    const dy = py[i] - wy;
    const d2 = dx * dx + dy * dy;
    if (d2 < nearestDist2) {
      nearestDist2 = d2;
      nearest = i;
    }
  }
  return nearest;
}

// 集落の攻撃タイマーを更新し、必要なら投射物を発射する
function updateSettlementAttacks(dt) {
  for (let s = 0; s < settlements.length; s++) {
    const settlement = settlements[s];
    if (settlement.fallen) continue;

    const params = settlement.params;

    // 攻撃半径内に群れがいるか判定
    let inRange = false;
    const atkR2 = params.attackRadius * params.attackRadius;
    for (let i = 0; i < N; i++) {
      if (boidDead[i]) continue;
      const dx = px[i] - settlement.wx;
      const dy = py[i] - settlement.wy;
      if (dx * dx + dy * dy < atkR2) { inRange = true; break; }
    }

    if (!inRange) continue;

    settlement.attackTimer -= dt;
    if (settlement.attackTimer > 0) continue;
    settlement.attackTimer = params.projectileInterval;

    const targetIdx = findNearestAliveBoid(settlement.wx, settlement.wy);
    if (targetIdx < 0) continue;

    // 投射物を発射（projectileCount本）
    if (params.projectileCount === 1) {
      spawnProjectile(
        settlement.wx, settlement.wy,
        targetIdx,
        params.projectileSpeed,
        params.projectileDamage,
        params.projectileColor,
        params.projectileAoe ?? 0,
        params.projectileTracking,
      );
    } else if (params.projectileCount === 3) {
      // 扇状3本（中世の町）
      const baseAngle = calcAngleToTarget(settlement.wx, settlement.wy, targetIdx);
      for (let k = -1; k <= 1; k++) {
        spawnFanProjectile(settlement, targetIdx, baseAngle + k * 0.3, params);
      }
    } else {
      // 多方向（近世要塞）
      const angleStep = (Math.PI * 2) / params.projectileCount;
      const baseAngle = Math.random() * Math.PI * 2;
      for (let k = 0; k < params.projectileCount; k++) {
        spawnDirectedProjectile(settlement, baseAngle + k * angleStep, params);
      }
    }
  }
}

function calcAngleToTarget(fromX, fromY, targetBoidIdx) {
  if (targetBoidIdx < 0) return 0;
  return Math.atan2(py[targetBoidIdx] - fromY, px[targetBoidIdx] - fromX);
}

function spawnFanProjectile(settlement, targetIdx, angle, params) {
  let slot = -1;
  for (let i = 0; i < MAX_PROJECTILES; i++) {
    if (!projActive[i]) { slot = i; break; }
  }
  if (slot < 0) return;
  projActive[slot]     = 1;
  projWx[slot]         = settlement.wx;
  projWy[slot]         = settlement.wy;
  projTailX[slot]      = settlement.wx;
  projTailY[slot]      = settlement.wy;
  projVx[slot]         = Math.cos(angle) * params.projectileSpeed;
  projVy[slot]         = Math.sin(angle) * params.projectileSpeed;
  projDmg[slot]        = params.projectileDamage;
  projAoe[slot]        = 0;
  projTracking[slot]   = 0;
  projTargetIdx[slot]  = targetIdx;
  projColor[slot]      = params.projectileColor;
}

function spawnDirectedProjectile(settlement, angle, params) {
  let slot = -1;
  for (let i = 0; i < MAX_PROJECTILES; i++) {
    if (!projActive[i]) { slot = i; break; }
  }
  if (slot < 0) return;
  projActive[slot]     = 1;
  projWx[slot]         = settlement.wx;
  projWy[slot]         = settlement.wy;
  projTailX[slot]      = settlement.wx;
  projTailY[slot]      = settlement.wy;
  projVx[slot]         = Math.cos(angle) * params.projectileSpeed;
  projVy[slot]         = Math.sin(angle) * params.projectileSpeed;
  projDmg[slot]        = params.projectileDamage;
  projAoe[slot]        = 0;
  projTracking[slot]   = 0;
  projTargetIdx[slot]  = -1;
  projColor[slot]      = params.projectileColor;
}

function updateProjectiles(dt) {
  for (let i = 0; i < MAX_PROJECTILES; i++) {
    if (!projActive[i]) continue;

    // 追尾投射物: 対象へ向けて方向を補正（ゆるい追尾）
    if (projTracking[i] && projTargetIdx[i] >= 0 && !boidDead[projTargetIdx[i]]) {
      const dx = px[projTargetIdx[i]] - projWx[i];
      const dy = py[projTargetIdx[i]] - projWy[i];
      const d  = Math.sqrt(dx * dx + dy * dy) || 1;
      const currentSpeed = Math.sqrt(projVx[i] * projVx[i] + projVy[i] * projVy[i]);
      // 少しずつ向きを変える（完全追尾でなく角度補正）
      projVx[i] += (dx / d * currentSpeed - projVx[i]) * 0.06;
      projVy[i] += (dy / d * currentSpeed - projVy[i]) * 0.06;
    }

    projTailX[i] = projWx[i];
    projTailY[i] = projWy[i];

    projWx[i] += projVx[i] * dt;
    projWy[i] += projVy[i] * dt;

    // ワールド外に出たら消す
    if (projWx[i] < -50 || projWx[i] > WORLD_W + 50 || projWy[i] < -50 || projWy[i] > WORLD_H + 50) {
      projActive[i] = 0;
      continue;
    }

    // boidとの当たり判定
    checkProjectileHitBoids(i);
  }
}

function checkProjectileHitBoids(projIdx) {
  const HIT_R = 8;
  const HIT_R2 = HIT_R * HIT_R;
  for (let i = 0; i < N; i++) {
    if (boidDead[i]) continue;
    const dx = projWx[projIdx] - px[i];
    const dy = projWy[projIdx] - py[i];
    if (dx * dx + dy * dy < HIT_R2) {
      // 命中
      if (projAoe[projIdx] > 0) {
        // 範囲ダメージ
        applyAoeProjectileDamage(projWx[projIdx], projWy[projIdx], projAoe[projIdx], projDmg[projIdx]);
      } else {
        applyDamageToBoid(i, projDmg[projIdx]);
      }
      spawnHitParticles(projWx[projIdx], projWy[projIdx]);
      projActive[projIdx] = 0;
      return;
    }
  }
}

function applyAoeProjectileDamage(wx, wy, aoeR, damage) {
  const r2 = aoeR * aoeR;
  for (let i = 0; i < N; i++) {
    if (boidDead[i]) continue;
    const dx = wx - px[i];
    const dy = wy - py[i];
    if (dx * dx + dy * dy < r2) {
      applyDamageToBoid(i, damage);
    }
  }
}

// -----------------------------------------------------------------
// 集落への近接攻撃（群れが集落に近づくとHP減少）
// -----------------------------------------------------------------
function updateSettlementMeleeAttacks(dt) {
  if (gameState !== "playing") return;

  const combatParams = FORMATION_COMBAT[currentFormation];
  // ベース確率: 0.05/フレーム ≒ 3.125ヒット/秒（16ms固定）
  // 密集×2.0 = 6.25/秒、散開×0.8 = 2.5/秒、円環×0.6 = 1.875/秒
  // 集落HP20の石器村：密集で約3.2秒、散開で約8秒で陥落
  const effectiveHitProb = 0.05 * combatParams.attackMultiplier;

  for (let s = 0; s < settlements.length; s++) {
    const settlement = settlements[s];
    if (settlement.fallen) continue;

    const params = settlement.params;
    // 近接判定: 集落のradius + 少し余裕を持たせた範囲
    const meleeR = params.radius + 5;
    const meleeR2 = meleeR * meleeR;

    // 近接範囲内にいるBoidを収集
    let contactCount = 0;
    for (let i = 0; i < N; i++) {
      if (boidDead[i]) continue;
      const dx = px[i] - settlement.wx;
      const dy = py[i] - settlement.wy;
      if (dx * dx + dy * dy < meleeR2) {
        contactCount++;
        // 個体ごとに独立した確率で攻撃
        // contactCountが多いほど集落へのダメージ機会が増えるが
        // 1フレームあたりの期待ダメージ = contactCount × prob × multiplier
        if (Math.random() < effectiveHitProb) {
          settlement.hp -= 1;
          spawnHitParticles(
            settlement.wx + (Math.random() - 0.5) * params.radius,
            settlement.wy + (Math.random() - 0.5) * params.radius,
          );
          if (settlement.hp <= 0) {
            settlementFall(s);
            break;
          }
        }
      }
    }
  }
}

function settlementFall(settlementIndex) {
  const settlement = settlements[settlementIndex];
  settlement.fallen = true;
  settlement.hp = 0;

  // 卵を3〜5個ドロップ
  const params = settlement.params;
  const eggCount = params.reward.eggMin + Math.floor(Math.random() * (params.reward.eggMax - params.reward.eggMin + 1));
  for (let k = 0; k < eggCount; k++) {
    const angle = Math.random() * Math.PI * 2;
    const r = params.radius + 10 + Math.random() * 40;
    spawnEgg(settlement.wx + Math.cos(angle) * r, settlement.wy + Math.sin(angle) * r);
  }

  hapticPulse(80);

  // 近世要塞陥落 = クリア
  if (params.isFinalBoss) {
    triggerClear();
  }
}

// -----------------------------------------------------------------
// Spatial Hash（自軍用）
// -----------------------------------------------------------------
const grid = new Map();

function gridKey(cx, cy) { return (cx * 73856093 ^ cy * 19349663); }
function gridClear() { grid.clear(); }
function gridInsert(index, x, y, cellSize) {
  const cx = (x / cellSize) | 0;
  const cy = (y / cellSize) | 0;
  const k  = gridKey(cx, cy);
  let bucket = grid.get(k);
  if (!bucket) { bucket = []; grid.set(k, bucket); }
  bucket.push(index);
}
function gridQuery(x, y, cellSize, out) {
  out.length = 0;
  const cx = (x / cellSize) | 0;
  const cy = (y / cellSize) | 0;
  for (let dy = -1; dy <= 1; dy++) {
    for (let dx = -1; dx <= 1; dx++) {
      const b = grid.get(gridKey(cx + dx, cy + dy));
      if (b) for (let i = 0; i < b.length; i++) out.push(b[i]);
    }
  }
}

// -----------------------------------------------------------------
// Boids SoA — 自軍（ワールド座標で管理）
// -----------------------------------------------------------------
const MAX_BOIDS = 20;
let N = 0;
let px, py, vx, vy;
let boidHp;
let boidDead;
let boidFadeTimer;
let formationLerp;
let formationDelay;

const BOID_MAX_HP   = 3;
const FADE_DURATION = 0.3;
const TRANSITION_SECS = 0.15;
const JITTER_MAX = 0.08;

function initBoids() {
  N = MAX_BOIDS;
  px             = new Float32Array(N);
  py             = new Float32Array(N);
  vx             = new Float32Array(N);
  vy             = new Float32Array(N);
  boidHp         = new Float32Array(N);
  boidDead       = new Uint8Array(N);
  boidFadeTimer  = new Float32Array(N);
  formationLerp  = new Float32Array(N);
  formationDelay = new Float32Array(N);

  // 群れの初期位置: マップ左端中央
  const startWx = 250;
  const startWy = WORLD_H * 0.5;
  for (let i = 0; i < N; i++) {
    const r = Math.random() * 80;
    const a = Math.random() * Math.PI * 2;
    px[i] = startWx + Math.cos(a) * r;
    py[i] = startWy + Math.sin(a) * r;
    const ang = Math.random() * Math.PI * 2;
    vx[i] = Math.cos(ang) * BASE_CFG.minSpeed;
    vy[i] = Math.sin(ang) * BASE_CFG.minSpeed;
    boidHp[i]        = BOID_MAX_HP;
    boidDead[i]      = 0;
    boidFadeTimer[i] = 0;
    formationLerp[i]  = 1.0;
    formationDelay[i] = 0;
  }
}

function countAliveBoids() {
  let count = 0;
  for (let i = 0; i < N; i++) {
    if (!boidDead[i]) count++;
  }
  return count;
}

// -----------------------------------------------------------------
// パーティクルプール（最大80個）
// -----------------------------------------------------------------
const MAX_PARTICLES = 80;
const partX      = new Float32Array(MAX_PARTICLES); // ワールド座標
const partY      = new Float32Array(MAX_PARTICLES);
const partVx     = new Float32Array(MAX_PARTICLES);
const partVy     = new Float32Array(MAX_PARTICLES);
const partLife   = new Float32Array(MAX_PARTICLES);
const partActive = new Uint8Array(MAX_PARTICLES);

function spawnHitParticles(wx, wy) {
  const count = 3 + Math.floor(Math.random() * 3);
  let spawned = 0;
  for (let i = 0; i < MAX_PARTICLES && spawned < count; i++) {
    if (partActive[i]) continue;
    partActive[i] = 1;
    partX[i] = wx;
    partY[i] = wy;
    const angle = Math.random() * Math.PI * 2;
    const speed = 40 + Math.random() * 80;
    partVx[i]   = Math.cos(angle) * speed;
    partVy[i]   = Math.sin(angle) * speed;
    partLife[i] = 0.25 + Math.random() * 0.15;
    spawned++;
  }
}

function updateParticles(dt) {
  for (let i = 0; i < MAX_PARTICLES; i++) {
    if (!partActive[i]) continue;
    partX[i]    += partVx[i] * dt;
    partY[i]    += partVy[i] * dt;
    partVx[i]   *= 0.85;
    partVy[i]   *= 0.85;
    partLife[i] -= dt;
    if (partLife[i] <= 0) partActive[i] = 0;
  }
}

// -----------------------------------------------------------------
// 卵システム（ワールド座標）
// -----------------------------------------------------------------
const MAX_EGGS = 60;
const eggWx     = new Float32Array(MAX_EGGS);
const eggWy     = new Float32Array(MAX_EGGS);
const eggActive = new Uint8Array(MAX_EGGS);
let totalEggCount = 0;

function spawnEgg(wx, wy) {
  for (let i = 0; i < MAX_EGGS; i++) {
    if (eggActive[i]) continue;
    eggActive[i] = 1;
    eggWx[i] = wx;
    eggWy[i] = wy;
    return i;
  }
  return -1;
}

// 自軍個体が60px以内の卵を自動回収する
function collectNearbyEggs() {
  for (let e = 0; e < MAX_EGGS; e++) {
    if (!eggActive[e]) continue;
    for (let i = 0; i < N; i++) {
      if (boidDead[i]) continue;
      const dx = eggWx[e] - px[i];
      const dy = eggWy[e] - py[i];
      if (dx * dx + dy * dy < 60 * 60) {
        eggActive[e] = 0;
        totalEggCount++;
        break;
      }
    }
  }
}

// -----------------------------------------------------------------
// ウェイポイントパス（リーダー追従）
// -----------------------------------------------------------------
const PATH_MAX = 240;
const pathBuf = new Float32Array(PATH_MAX * 2);
let pathHead = 0;
let pathLen  = 0;
let leaderPathConsumeIdx = 0;

function pathGet(logicalIdx) {
  const ring = (pathHead - pathLen + logicalIdx + PATH_MAX) % PATH_MAX;
  return { x: pathBuf[ring * 2], y: pathBuf[ring * 2 + 1] };
}

function pathClear() {
  pathLen  = 0;
  pathHead = 0;
  leaderPathConsumeIdx = 0;
}

function pathPush(wx, wy) {
  if (pathLen > 0) {
    const last = pathGet(pathLen - 1);
    const dx = wx - last.x, dy = wy - last.y;
    const minSeg = Math.max(BASE_CFG.pathMinSegment, 30);
    if (dx * dx + dy * dy < minSeg * minSeg) return;
  }
  pathBuf[pathHead * 2]     = wx;
  pathBuf[pathHead * 2 + 1] = wy;
  pathHead = (pathHead + 1) % PATH_MAX;
  if (pathLen < PATH_MAX) pathLen++;
}

// リーダーはワールド座標で管理
const leader = { x: 250, y: WORLD_H * 0.5, vx: 0, vy: 0 };

function resetLeader() {
  leader.x  = 250;
  leader.y  = WORLD_H * 0.5;
  leader.vx = 0;
  leader.vy = 0;
  pathClear();
  idleAngle = 0;
}

// 隊形管理
// -----------------------------------------------------------------
let currentFormation = "tight";
let prevFormation    = "tight";

function setFormation(name) {
  if (name === currentFormation) return;
  prevFormation    = currentFormation;
  currentFormation = name;
  for (let i = 0; i < N; i++) {
    formationLerp[i]  = 0;
    formationDelay[i] = Math.random() * JITTER_MAX;
  }
  hapticPulse(30);
  formationJustChanged = true;
  updateFormationButtons(name);
}

function updateFormationButtons(name) {
  document.querySelectorAll(".formation-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.formation === name);
  });
}

document.querySelectorAll(".formation-btn").forEach(btn => {
  btn.addEventListener("pointerdown", (e) => {
    e.stopPropagation();
    setFormation(btn.dataset.formation);
  });
});

// 触覚フィードバック

function hapticPulse(durationMs) {
  try { navigator.vibrate?.(durationMs); } catch (_) {}
}

// -----------------------------------------------------------------
// 入力システム（スクリーン座標 → ワールド座標変換）
// -----------------------------------------------------------------
let inputMode = "NONE";
let isDrawing = false;
let touchRing = { active: false, x: 0, y: 0 };

const TRAIL_LIFETIME = 1.2;
const trailPoints    = [];

// 画面トレイルはスクリーン座標で保存（描画が楽なため）
function addTrailPoint(sx, sy, now) {
  if (trailPoints.length >= 400) trailPoints.shift();
  trailPoints.push({ x: sx, y: sy, bornAt: now });
}

function inputStart(sx, sy, now) {
  if (sy >= viewH - bottomUIHeight) {
    inputMode = "UI";
    return;
  }
  inputMode = "DRAW";
  isDrawing = true;
  pathClear();
  // スクリーン座標 → ワールド座標に変換してウェイポイントに追加
  const w = screenToWorld(sx, sy);
  pathPush(w.x, w.y);
  addTrailPoint(sx, sy, now);
  touchRing.active = true;
  touchRing.x = sx;
  touchRing.y = sy;
  hapticPulse(10);
}

function inputMove(sx, sy, now) {
  if (inputMode !== "DRAW") return;
  const w = screenToWorld(sx, sy);
  pathPush(w.x, w.y);
  addTrailPoint(sx, sy, now);
  touchRing.x = sx;
  touchRing.y = sy;
}

function inputEnd() {
  isDrawing = false;
  inputMode = "NONE";
  touchRing.active = false;
}

canvas.addEventListener("touchstart", (e) => {
  const t = e.touches[0];
  inputStart(t.clientX, t.clientY, performance.now());
  e.preventDefault();
}, { passive: false });

canvas.addEventListener("touchmove", (e) => {
  const t = e.touches[0];
  inputMove(t.clientX, t.clientY, performance.now());
  e.preventDefault();
}, { passive: false });

canvas.addEventListener("touchend",    (e) => { inputEnd(); e.preventDefault(); }, { passive: false });
canvas.addEventListener("touchcancel", (e) => { inputEnd(); e.preventDefault(); }, { passive: false });

canvas.addEventListener("mousedown",  (e) => inputStart(e.clientX, e.clientY, performance.now()));
canvas.addEventListener("mousemove",  (e) => { if (isDrawing) inputMove(e.clientX, e.clientY, performance.now()); });
canvas.addEventListener("mouseup",    () => inputEnd());
canvas.addEventListener("mouseleave", () => inputEnd());

// -----------------------------------------------------------------
// アイドル旋回（ワールド座標でリーダーが徘徊）
// -----------------------------------------------------------------
let idleAngle = 0;
const IDLE_ANGULAR_SPEED = 0.35;

function getIdleLeaderTarget(dt) {
  idleAngle += IDLE_ANGULAR_SPEED * dt;
  const r = BASE_CFG.idleWanderRadius;
  const centroid = calcFriendlyCentroid();
  return {
    x: centroid.x + Math.cos(idleAngle) * r,
    y: centroid.y + Math.sin(idleAngle) * r * 0.6,
  };
}

// -----------------------------------------------------------------
// 自軍の重心（ワールド座標）
// -----------------------------------------------------------------
function calcFriendlyCentroid() {
  let cx = 0, cy = 0, count = 0;
  for (let i = 0; i < N; i++) {
    if (boidDead[i]) continue;
    cx += px[i];
    cy += py[i];
    count++;
  }
  if (count === 0) return { x: leader.x, y: leader.y };
  return { x: cx / count, y: cy / count };
}

// -----------------------------------------------------------------
// 消滅フェードタイマー更新
// -----------------------------------------------------------------
function updateDeathTimers(dt) {
  for (let i = 0; i < N; i++) {
    if (boidFadeTimer[i] > 0) boidFadeTimer[i] = Math.max(0, boidFadeTimer[i] - dt);
  }
}

function applyDamageToBoid(boidIndex, damage) {
  const combatParams = FORMATION_COMBAT[currentFormation];
  // 被弾率補正: 隊形による被弾率を反映
  const effectiveDamage = damage * combatParams.hitRateMultiplier;
  boidHp[boidIndex] -= effectiveDamage;
  if (boidHp[boidIndex] <= 0 && !boidDead[boidIndex]) {
    boidDead[boidIndex]      = 1;
    boidFadeTimer[boidIndex] = FADE_DURATION;
  }
}

// -----------------------------------------------------------------
// ゲーム状態チェック
// -----------------------------------------------------------------
function checkGameConditions() {
  if (gameState !== "playing") return;
  if (countAliveBoids() === 0) {
    triggerDefeat();
  }
}

// -----------------------------------------------------------------
// Simulation step — 自軍Boids（ワールド座標）
// Phase2コードを流用、ラップアラウンドをワールド境界クランプに変更
// -----------------------------------------------------------------
const neighbours = [];

function buildFormationParams() {
  const ov = FORMATION_OVERRIDES[currentFormation] ?? {};
  return {
    perception:       ov.perception       ?? BASE_CFG.perception,
    separationRadius: ov.separationRadius ?? BASE_CFG.separationRadius,
    wSeparation:      ov.wSeparation      ?? BASE_CFG.wSeparation,
    wAlignment:       BASE_CFG.wAlignment,
    wCohesion:        ov.wCohesion        ?? BASE_CFG.wCohesion,
    ringRadius:       ov.ringRadius       ?? 0,
  };
}

function buildPrevFormationParams() {
  const ov = FORMATION_OVERRIDES[prevFormation] ?? {};
  return {
    perception:       ov.perception       ?? BASE_CFG.perception,
    separationRadius: ov.separationRadius ?? BASE_CFG.separationRadius,
    wSeparation:      ov.wSeparation      ?? BASE_CFG.wSeparation,
    wAlignment:       BASE_CFG.wAlignment,
    wCohesion:        ov.wCohesion        ?? BASE_CFG.wCohesion,
    ringRadius:       ov.ringRadius       ?? 0,
  };
}

function lerpVal(a, b, t) { return a + (b - a) * t; }

function simStep(dt) {
  updateLeader(dt);

  for (let i = 0; i < N; i++) {
    if (boidDead[i]) continue;
    if (formationDelay[i] > 0) {
      formationDelay[i] -= dt;
    } else if (formationLerp[i] < 1) {
      formationLerp[i] = Math.min(1, formationLerp[i] + dt / TRANSITION_SECS);
    }
  }

  const paramsNext = buildFormationParams();
  const paramsPrev = buildPrevFormationParams();

  gridClear();
  for (let i = 0; i < N; i++) {
    if (!boidDead[i]) gridInsert(i, px[i], py[i], paramsNext.perception);
  }

  for (let i = 0; i < N; i++) {
    if (boidDead[i]) continue;

    const t    = formationLerp[i];
    const perc = lerpVal(paramsPrev.perception,       paramsNext.perception,       t);
    const sepR = lerpVal(paramsPrev.separationRadius, paramsNext.separationRadius, t);
    const wSep = lerpVal(paramsPrev.wSeparation,      paramsNext.wSeparation,      t);
    const wAli = paramsNext.wAlignment;
    const wCoh = lerpVal(paramsPrev.wCohesion,        paramsNext.wCohesion,        t);
    const ringR = lerpVal(paramsPrev.ringRadius,      paramsNext.ringRadius,       t);

    const perc2 = perc * perc;
    const sep2  = sepR * sepR;
    const xi = px[i], yi = py[i];

    let sepX = 0, sepY = 0;
    let aliX = 0, aliY = 0;
    let cohX = 0, cohY = 0;
    let nAli = 0, nCoh = 0;

    gridQuery(xi, yi, paramsNext.perception, neighbours);
    for (let k = 0; k < neighbours.length; k++) {
      const j = neighbours[k];
      if (j === i || boidDead[j]) continue;
      const dx = xi - px[j], dy = yi - py[j];
      const d2 = dx * dx + dy * dy;
      if (d2 > perc2 || d2 === 0) continue;
      if (d2 < sep2) {
        const invD = 1 / Math.sqrt(d2);
        sepX += dx * invD;
        sepY += dy * invD;
      }
      aliX += vx[j]; aliY += vy[j]; nAli++;
      cohX += px[j]; cohY += py[j]; nCoh++;
    }

    let ax = 0, ay = 0;
    ax += sepX * wSep * 80;
    ay += sepY * wSep * 80;

    if (nAli > 0) {
      const inv = 1 / nAli;
      ax += (aliX * inv - vx[i]) * wAli;
      ay += (aliY * inv - vy[i]) * wAli;
    }
    if (nCoh > 0) {
      const inv = 1 / nCoh;
      ax += (cohX * inv - xi) * wCoh;
      ay += (cohY * inv - yi) * wCoh;
    }

    // リーダーへの引力
    {
      const ldx = leader.x - xi, ldy = leader.y - yi;
      const ld  = Math.sqrt(ldx * ldx + ldy * ldy) || 1;
      if (ringR > 0) {
        const targetX = leader.x - (ldx / ld) * ringR;
        const targetY = leader.y - (ldy / ld) * ringR;
        ax += (targetX - xi) * BASE_CFG.wLeader * 1.5;
        ay += (targetY - yi) * BASE_CFG.wLeader * 1.5;
      } else {
        ax += (ldx / ld) * BASE_CFG.wLeader * 120;
        ay += (ldy / ld) * BASE_CFG.wLeader * 120;
      }
    }

    const am = Math.sqrt(ax * ax + ay * ay);
    if (am > BASE_CFG.maxForce) { const s = BASE_CFG.maxForce / am; ax *= s; ay *= s; }

    let nvx = vx[i] + ax * dt;
    let nvy = vy[i] + ay * dt;
    const sp = Math.sqrt(nvx * nvx + nvy * nvy);
    if      (sp > BASE_CFG.maxSpeed) { const s = BASE_CFG.maxSpeed / sp; nvx *= s; nvy *= s; }
    else if (sp < BASE_CFG.minSpeed && sp > 0.0001) { const s = BASE_CFG.minSpeed / sp; nvx *= s; nvy *= s; }
    else if (sp <= 0.0001) { nvx = BASE_CFG.minSpeed; nvy = 0; }
    vx[i] = nvx; vy[i] = nvy;

    let nx = xi + nvx * dt;
    let ny = yi + nvy * dt;
    // ワールド境界でバウンス（速度反転 + 位置クランプ）
    // ラップアラウンドをやめて広いマップの端を感じさせる
    if (nx < 10)         { nx = 10;         vx[i] = Math.abs(vx[i]) * 0.5; }
    else if (nx > WORLD_W - 10) { nx = WORLD_W - 10; vx[i] = -Math.abs(vx[i]) * 0.5; }
    if (ny < 10)         { ny = 10;         vy[i] = Math.abs(vy[i]) * 0.5; }
    else if (ny > WORLD_H - 10) { ny = WORLD_H - 10; vy[i] = -Math.abs(vy[i]) * 0.5; }
    px[i] = nx; py[i] = ny;
  }
}

function updateLeader(dt) {
  if (pathLen > 0) {
    if (leaderPathConsumeIdx >= pathLen) leaderPathConsumeIdx = pathLen - 1;

    let tgt = pathGet(Math.min(leaderPathConsumeIdx, pathLen - 1));
    let dx = tgt.x - leader.x, dy = tgt.y - leader.y;
    let d2 = dx * dx + dy * dy;

    while (d2 < 24 * 24 && leaderPathConsumeIdx < pathLen - 1) {
      leaderPathConsumeIdx++;
      tgt = pathGet(leaderPathConsumeIdx);
      dx = tgt.x - leader.x; dy = tgt.y - leader.y;
      d2 = dx * dx + dy * dy;
    }

    const d = Math.sqrt(d2) || 1;
    const desiredVx = (dx / d) * BASE_CFG.leaderSpeed;
    const desiredVy = (dy / d) * BASE_CFG.leaderSpeed;
    leader.vx += (desiredVx - leader.vx) * Math.min(1, dt * 8);
    leader.vy += (desiredVy - leader.vy) * Math.min(1, dt * 8);
  } else {
    const target = getIdleLeaderTarget(dt);
    leader.vx += ((target.x - leader.x) * 0.8 - leader.vx) * Math.min(1, dt * 2.0);
    leader.vy += ((target.y - leader.y) * 0.8 - leader.vy) * Math.min(1, dt * 2.0);
  }

  leader.x += leader.vx * dt;
  leader.y += leader.vy * dt;
  // リーダーもワールド境界内にクランプ
  leader.x = Math.max(0, Math.min(WORLD_W, leader.x));
  leader.y = Math.max(0, Math.min(WORLD_H, leader.y));
}

// -----------------------------------------------------------------
// 描画
// -----------------------------------------------------------------
function render(now) {
  // 背景クリア（暗い緑 = 荒野）
  ctx.fillStyle = "#0e1a0e";
  ctx.fillRect(0, 0, viewW, viewH);

  // カメラ変換を適用
  ctx.save();
  ctx.translate(-cam.x + viewW * 0.5, -cam.y + viewH * 0.5);

  drawWorldGrid();
  drawSettlementRanges();
  drawSettlements();
  drawEggs();
  drawBoids();
  drawProjectiles();
  drawParticles();

  ctx.restore();

  // スクリーン座標系の描画（トレイル・タッチリング）
  drawTrail(now);
  drawTouchRing();
  drawFlash();

  // 敗北演出
  if (gameState === "defeat") {
    const darkness = Math.min(0.75, 1 - defeatTimer / 2.0);
    ctx.fillStyle = `rgba(0,0,0,${darkness.toFixed(3)})`;
    ctx.fillRect(0, 0, viewW, viewH);
  }
}

// 格子線（ワールド広がりを示す）
function drawWorldGrid() {
  ctx.strokeStyle = "rgba(40, 80, 40, 0.35)";
  ctx.lineWidth = 1;
  const GRID_SIZE = 200;
  for (let x = 0; x <= WORLD_W; x += GRID_SIZE) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, WORLD_H);
    ctx.stroke();
  }
  for (let y = 0; y <= WORLD_H; y += GRID_SIZE) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(WORLD_W, y);
    ctx.stroke();
  }
  // ワールド境界線
  ctx.strokeStyle = "rgba(60, 100, 60, 0.5)";
  ctx.lineWidth = 2;
  ctx.strokeRect(0, 0, WORLD_W, WORLD_H);
}

// 集落の攻撃範囲を薄く表示
function drawSettlementRanges() {
  for (let s = 0; s < settlements.length; s++) {
    const settlement = settlements[s];
    if (settlement.fallen) continue;
    const params = settlement.params;

    // 攻撃範囲円
    ctx.strokeStyle = "rgba(180, 60, 60, 0.12)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(settlement.wx, settlement.wy, params.attackRadius, 0, Math.PI * 2);
    ctx.stroke();
  }
}

// 集落描画
function drawSettlements() {
  for (let s = 0; s < settlements.length; s++) {
    const settlement = settlements[s];
    const params = settlement.params;
    const alpha = settlement.fallen ? 0.35 : 1.0;
    const color = settlement.fallen ? "#444" : params.color;

    ctx.save();
    ctx.globalAlpha = alpha;

    // 形状に応じて描画
    switch (params.shape) {
      case "circle":       drawSettlementCircle(settlement.wx, settlement.wy, params.radius, color); break;
      case "square":       drawSettlementSquare(settlement.wx, settlement.wy, params.radius, color); break;
      case "squareTower":  drawSettlementSquareTower(settlement.wx, settlement.wy, params.radius, color); break;
      case "hexagon":      drawSettlementHexagon(settlement.wx, settlement.wy, params.radius, color); break;
      case "star":         drawSettlementStar(settlement.wx, settlement.wy, params.radius, color); break;
    }

    // HP バー（陥落前のみ）
    if (!settlement.fallen) {
      const hpRatio = Math.max(0, settlement.hp / params.maxHp);
      const barW = params.radius * 2;
      const barX = settlement.wx - params.radius;
      const barY = settlement.wy - params.radius - 8;
      ctx.globalAlpha = 0.8;
      ctx.fillStyle = "rgba(0,0,0,0.5)";
      ctx.fillRect(barX, barY, barW, 4);
      ctx.fillStyle = hpRatio > 0.5 ? "#50e070" : (hpRatio > 0.25 ? "#e0c040" : "#e04040");
      ctx.fillRect(barX, barY, barW * hpRatio, 4);
    }

    ctx.restore();
  }
}

function drawSettlementCircle(wx, wy, r, color) {
  ctx.fillStyle = color;
  ctx.strokeStyle = "rgba(255,255,255,0.4)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(wx, wy, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
}

function drawSettlementSquare(wx, wy, r, color) {
  ctx.fillStyle = color;
  ctx.strokeStyle = "rgba(255,255,255,0.4)";
  ctx.lineWidth = 2;
  ctx.fillRect(wx - r, wy - r, r * 2, r * 2);
  ctx.strokeRect(wx - r, wy - r, r * 2, r * 2);
}

function drawSettlementSquareTower(wx, wy, r, color) {
  // 本体
  ctx.fillStyle = color;
  ctx.strokeStyle = "rgba(255,255,255,0.4)";
  ctx.lineWidth = 2;
  ctx.fillRect(wx - r, wy - r, r * 2, r * 2);
  ctx.strokeRect(wx - r, wy - r, r * 2, r * 2);
  // 小塔（4隅）
  const towerSize = r * 0.4;
  const positions = [
    [wx - r, wy - r], [wx + r - towerSize, wy - r],
    [wx - r, wy + r - towerSize], [wx + r - towerSize, wy + r - towerSize],
  ];
  ctx.fillStyle = shadeColor(color, -20);
  for (const [tx, ty] of positions) {
    ctx.fillRect(tx, ty, towerSize, towerSize);
  }
}

function drawSettlementHexagon(wx, wy, r, color) {
  ctx.fillStyle = color;
  ctx.strokeStyle = "rgba(255,255,255,0.5)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let k = 0; k < 6; k++) {
    const angle = (k * Math.PI * 2) / 6 - Math.PI / 6;
    if (k === 0) ctx.moveTo(wx + Math.cos(angle) * r, wy + Math.sin(angle) * r);
    else ctx.lineTo(wx + Math.cos(angle) * r, wy + Math.sin(angle) * r);
  }
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
}

function drawSettlementStar(wx, wy, r, color) {
  // 星形（5つの突起を持つ要塞）
  ctx.fillStyle = color;
  ctx.strokeStyle = "rgba(255,255,255,0.4)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  const spikes = 5;
  const innerR = r * 0.55;
  for (let k = 0; k < spikes * 2; k++) {
    const angle = (k * Math.PI) / spikes - Math.PI / 2;
    const rad = k % 2 === 0 ? r : innerR;
    if (k === 0) ctx.moveTo(wx + Math.cos(angle) * rad, wy + Math.sin(angle) * rad);
    else ctx.lineTo(wx + Math.cos(angle) * rad, wy + Math.sin(angle) * rad);
  }
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
}

// 簡易カラーシェーダー（明るさ調整）
function shadeColor(hex, amount) {
  const num = parseInt(hex.replace("#", ""), 16);
  const r = Math.min(255, Math.max(0, (num >> 16) + amount));
  const g = Math.min(255, Math.max(0, ((num >> 8) & 0xff) + amount));
  const b = Math.min(255, Math.max(0, (num & 0xff) + amount));
  return `rgb(${r},${g},${b})`;
}

// 自軍Boids描画（竜の群れ：青い矢印形）
// カメラ変換ブロック内で呼ばれるため、ワールド座標をそのまま使う
function drawBoids() {
  for (let i = 0; i < N; i++) {
    if (boidDead[i] && boidFadeTimer[i] <= 0) continue;

    let alpha = 0.85;
    if (boidDead[i]) {
      alpha = (boidFadeTimer[i] / FADE_DURATION) * 0.85;
    }

    const wx = px[i], wy = py[i];
    const angle = Math.atan2(vy[i], vx[i]);

    ctx.save();
    ctx.translate(wx, wy);
    ctx.rotate(angle);
    ctx.fillStyle = `rgba(120, 200, 255, ${alpha.toFixed(3)})`;
    ctx.beginPath();
    ctx.moveTo(10,  0);
    ctx.lineTo(-7,   5);
    ctx.lineTo(-4,   0);
    ctx.lineTo(-7,  -5);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // HP バー（ダメージを受けた時のみ）
    // カメラ変換が有効な状態でワールド座標を使う（setTransformを使わない）
    if (!boidDead[i] && boidHp[i] < BOID_MAX_HP) {
      const hpRatio = Math.max(0, boidHp[i] / BOID_MAX_HP);
      const barW = 14;
      ctx.fillStyle = "rgba(0,0,0,0.5)";
      ctx.fillRect(wx - barW / 2, wy - 18, barW, 3);
      ctx.fillStyle = hpRatio > 0.5 ? "#4adf80" : "#f0604a";
      ctx.fillRect(wx - barW / 2, wy - 18, barW * hpRatio, 3);
    }
  }
}

// 投射物描画（短い線分 = 彗星のような尾）
// カメラ変換ブロック内で呼ばれるため、ワールド座標をそのまま使う
function drawProjectiles() {
  for (let i = 0; i < MAX_PROJECTILES; i++) {
    if (!projActive[i]) continue;

    // 可視チェック: ワールド座標からスクリーン座標を計算して判定
    const sx = projWx[i] - cam.x + viewW * 0.5;
    const sy = projWy[i] - cam.y + viewH * 0.5;
    if (sx < -20 || sx > viewW + 20 || sy < -20 || sy > viewH + 20) continue;

    // 尾（テール）: 細い線（ワールド座標で描画）
    ctx.strokeStyle = projColor[i];
    ctx.lineWidth = 1.5;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(projTailX[i], projTailY[i]);
    ctx.lineTo(projWx[i], projWy[i]);
    ctx.stroke();

    // 頭部: 小さい輝点
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(projWx[i], projWy[i], 2, 0, Math.PI * 2);
    ctx.fill();
  }
}

// パーティクル描画
function drawParticles() {
  ctx.save();
  for (let i = 0; i < MAX_PARTICLES; i++) {
    if (!partActive[i]) continue;
    const lifeRatio = partLife[i] / 0.35;
    const alpha = Math.max(0, lifeRatio);
    const radius = 2 + lifeRatio * 2;
    ctx.fillStyle = `rgba(255, 220, 80, ${alpha.toFixed(3)})`;
    ctx.beginPath();
    ctx.arc(partX[i], partY[i], radius, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// 卵描画（金色の小円）
function drawEggs() {
  ctx.save();
  for (let e = 0; e < MAX_EGGS; e++) {
    if (!eggActive[e]) continue;
    ctx.fillStyle = "rgba(255, 200, 40, 0.90)";
    ctx.strokeStyle = "rgba(255, 240, 120, 0.60)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(eggWx[e], eggWy[e], 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  }
  ctx.restore();
}

// ライン残光（スクリーン座標）
function drawTrail(now) {
  if (trailPoints.length < 2) return;
  const cutoff = now - TRAIL_LIFETIME * 1000;
  while (trailPoints.length > 0 && trailPoints[0].bornAt < cutoff) {
    trailPoints.shift();
  }
  if (trailPoints.length < 2) return;

  for (let i = 1; i < trailPoints.length; i++) {
    const p    = trailPoints[i];
    const prev = trailPoints[i - 1];
    const ageRatio = (now - p.bornAt) / (TRAIL_LIFETIME * 1000);
    const alpha    = Math.max(0, 1 - ageRatio) * 0.35;
    ctx.strokeStyle = `rgba(140, 200, 255, ${alpha.toFixed(3)})`;
    ctx.lineWidth   = 2.5;
    ctx.lineCap     = "round";
    ctx.beginPath();
    ctx.moveTo(prev.x, prev.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  }
}

// タッチリング（スクリーン座標）
function drawTouchRing() {
  if (!touchRing.active) return;
  ctx.strokeStyle = "rgba(200, 230, 255, 0.30)";
  ctx.lineWidth   = 1.5;
  ctx.beginPath();
  ctx.arc(touchRing.x, touchRing.y, 20, 0, Math.PI * 2);
  ctx.stroke();
}

// フラッシュ（スクリーン座標）
function drawFlash() {
  if (flashTimer <= 0) return;
  ctx.fillStyle = flashColor;
  ctx.fillRect(0, 0, viewW, viewH);
}

// -----------------------------------------------------------------
// ミニマップ描画
// -----------------------------------------------------------------
const MINIMAP_W = 80;
const MINIMAP_H = 60;

function drawMinimap() {
  minimapCtx.fillStyle = "#0e1a0e";
  minimapCtx.fillRect(0, 0, MINIMAP_W, MINIMAP_H);

  const scaleX = MINIMAP_W / WORLD_W;
  const scaleY = MINIMAP_H / WORLD_H;

  // 集落を点で表示
  for (let s = 0; s < settlements.length; s++) {
    const settlement = settlements[s];
    const mx = settlement.wx * scaleX;
    const my = settlement.wy * scaleY;
    minimapCtx.fillStyle = settlement.fallen ? "#444" : settlement.params.color;
    minimapCtx.beginPath();
    minimapCtx.arc(mx, my, 2.5, 0, Math.PI * 2);
    minimapCtx.fill();
  }

  // 群れの位置（白い点）
  const centroid = calcFriendlyCentroid();
  const mx = centroid.x * scaleX;
  const my = centroid.y * scaleY;
  minimapCtx.fillStyle = "rgba(255,255,255,0.9)";
  minimapCtx.beginPath();
  minimapCtx.arc(mx, my, 2, 0, Math.PI * 2);
  minimapCtx.fill();

  // カメラ視野範囲（薄い矩形）
  const vpLeft   = (cam.x - viewW * 0.5) * scaleX;
  const vpTop    = (cam.y - viewH * 0.5) * scaleY;
  const vpWidth  = viewW * scaleX;
  const vpHeight = viewH * scaleY;
  minimapCtx.strokeStyle = "rgba(120,200,255,0.25)";
  minimapCtx.lineWidth   = 0.5;
  minimapCtx.strokeRect(vpLeft, vpTop, vpWidth, vpHeight);
}

// -----------------------------------------------------------------
// HUD更新
// -----------------------------------------------------------------
let hudUpdateCounter = 0;
const hudAlive = document.getElementById("h-alive");
const hudMax   = document.getElementById("h-max");
const hudEggs  = document.getElementById("h-eggs");

function updateHUD() {
  hudUpdateCounter++;
  if (hudUpdateCounter < 10) return;
  hudUpdateCounter = 0;

  const aliveCount = countAliveBoids();
  hudAlive.textContent = aliveCount;
  hudMax.textContent   = MAX_BOIDS;
  updateHUDEggs();
}

function updateHUDEggs() {
  hudEggs.textContent = totalEggCount;
}

// -----------------------------------------------------------------
// FPS計測
// -----------------------------------------------------------------
let fpsFrames = 0;
let fpsLast   = performance.now();
let fpsEma    = 0;
const hudFps  = document.getElementById("h-fps");

function tickFps(now) {
  fpsFrames++;
  const elapsed = now - fpsLast;
  if (elapsed >= 500) {
    const fps  = (fpsFrames * 1000) / elapsed;
    fpsEma     = fpsEma === 0 ? fps : fpsEma * 0.7 + fps * 0.3;
    fpsFrames  = 0;
    fpsLast    = now;
    hudFps.textContent = fps.toFixed(1);
  }
}

// -----------------------------------------------------------------
// ゲームループ（setInterval固定16ms）
// -----------------------------------------------------------------
let lastTickTs = performance.now();

function tick() {
  const now  = performance.now();
  let dtMs   = now - lastTickTs;
  if (dtMs > BASE_CFG.maxDtMs) dtMs = BASE_CFG.maxDtMs;
  lastTickTs = now;
  const dt   = dtMs / 1000;

  // --- Update ---
  if (gameState === "playing") {
    simStep(dt);
    updateCamera(dt);
    updateSettlementAttacks(dt);
    updateProjectiles(dt);
    updateSettlementMeleeAttacks(dt);
    updateDeathTimers(dt);
    updateParticles(dt);
    collectNearbyEggs();
    checkGameConditions();
  } else if (gameState === "defeat") {
    defeatTimer -= dt;
    updateDeathTimers(dt);
    updateParticles(dt);
    updateCamera(dt);
  } else if (gameState === "clear") {
    clearTimer -= dt;
    simStep(dt);        // 群れは動き続ける
    updateCamera(dt);
    updateParticles(dt);
    if (clearTimer <= 0) {
      restartGame();
    }
  }

  // フラッシュタイマー
  if (flashTimer > 0) flashTimer = Math.max(0, flashTimer - dt);

  // --- Render ---
  render(now);
  drawMinimap();

  // HUD
  updateHUD();
  tickFps(now);
}

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) lastTickTs = performance.now();
});

// -----------------------------------------------------------------
// 起動
// -----------------------------------------------------------------
function boot() {
  resize();
  initBoids();
  resetLeader();
  setInterval(tick, BASE_CFG.fixedStepMs);
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", boot);
} else {
  boot();
}
</script>
