<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>竜潮 / Dragon Tide — World Map</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #08101a;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #stage { display: block; width: 100%; height: 100%; }

  /* 右上 HUD: FPS */
  #hud {
    position: fixed;
    top: env(safe-area-inset-top, 8px);
    right: 8px;
    padding: 5px 8px;
    background: rgba(8, 16, 26, 0.70);
    border: 1px solid rgba(120, 200, 255, 0.20);
    border-radius: 6px;
    font-family: -apple-system, BlinkMacSystemFont, monospace;
    font-size: 11px;
    line-height: 1.6;
    color: #fff;
    pointer-events: none;
    min-width: 70px;
    text-align: right;
  }
  #hud .k { color: #6fa6c8; margin-right: 4px; }

  /* 左上 HUD: FLOCK残数 */
  #hud-left {
    position: fixed;
    top: env(safe-area-inset-top, 8px);
    left: 8px;
    padding: 5px 8px;
    background: rgba(8, 16, 26, 0.70);
    border: 1px solid rgba(120, 200, 255, 0.20);
    border-radius: 6px;
    font-family: -apple-system, BlinkMacSystemFont, monospace;
    font-size: 13px;
    line-height: 1.6;
    color: #fff;
    pointer-events: none;
  }
  #hud-left .label { color: #6fa6c8; font-size: 10px; }

  /* 右下 HUD: 卵カウント + ステージ */
  #hud-eggs {
    position: fixed;
    bottom: calc(20vh + env(safe-area-inset-bottom, 0px) + 8px);
    right: 8px;
    padding: 5px 10px;
    background: rgba(8, 16, 26, 0.70);
    border: 1px solid rgba(255, 200, 40, 0.30);
    border-radius: 6px;
    font-family: -apple-system, BlinkMacSystemFont, monospace;
    font-size: 13px;
    color: #ffd040;
    pointer-events: none;
    line-height: 1.7;
  }

  /* 左下 HUD: ミニマップ */
  #minimap-container {
    position: fixed;
    bottom: calc(20vh + env(safe-area-inset-bottom, 0px) + 8px);
    left: 8px;
    background: rgba(8, 16, 26, 0.80);
    border: 1px solid rgba(120, 200, 255, 0.25);
    border-radius: 4px;
    pointer-events: none;
    overflow: hidden;
  }
  #minimap { display: block; }

  /* 残建物カウント（ミニマップの上） */
  #hud-buildings {
    position: fixed;
    bottom: calc(20vh + env(safe-area-inset-bottom, 0px) + 8px + 60px + 4px);
    left: 8px;
    padding: 3px 8px;
    background: rgba(8, 16, 26, 0.70);
    border: 1px solid rgba(255, 180, 60, 0.25);
    border-radius: 4px;
    font-family: -apple-system, BlinkMacSystemFont, monospace;
    font-size: 11px;
    color: #ffb840;
    pointer-events: none;
  }

  /* リトライ / クリアオーバーレイ */
  #overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 20px;
    pointer-events: none;
  }
  #overlay.visible { display: flex; pointer-events: auto; }
  #overlay-title {
    font-family: -apple-system, BlinkMacSystemFont, monospace;
    font-size: 28px;
    color: #fff;
    text-shadow: 0 0 20px rgba(255,200,80,0.8);
    letter-spacing: 0.08em;
    opacity: 0;
    transition: opacity 0.8s;
  }
  #overlay-title.show { opacity: 1; }
  #retry-btn {
    padding: 14px 40px;
    background: rgba(180, 40, 40, 0.85);
    border: 2px solid rgba(255, 100, 100, 0.60);
    border-radius: 30px;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, monospace;
    font-size: 16px;
    cursor: pointer;
    display: none;
    pointer-events: auto;
    letter-spacing: 0.1em;
  }
  #retry-btn.visible { display: block; }

  /* バージョン表示（左下・スクリーン固定） */
  #hud-version {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 4px);
    left: 8px;
    font-family: -apple-system, BlinkMacSystemFont, monospace;
    font-size: 10px;
    color: rgba(120, 180, 255, 0.45);
    pointer-events: none;
    letter-spacing: 0.05em;
  }

  /* ステージ間演出オーバーレイ */
  #stage-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
  }
  #stage-overlay.visible { opacity: 1; }
  #stage-text {
    font-family: -apple-system, BlinkMacSystemFont, monospace;
    font-size: 42px;
    color: #fff;
    text-shadow: 0 0 30px rgba(255,200,80,0.9), 0 0 60px rgba(255,120,40,0.5);
    letter-spacing: 0.12em;
    text-align: center;
  }
  #stage-sub {
    font-family: -apple-system, BlinkMacSystemFont, monospace;
    font-size: 18px;
    color: #ffd080;
    margin-top: 12px;
    letter-spacing: 0.2em;
    text-align: center;
  }

  /* v0.6: XPバー（画面最上部の極細バー） */
  #xp-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: rgba(255,255,255,0.10);
    z-index: 30;
    pointer-events: none;
  }
  #xp-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #40c8ff, #a0ecff);
    box-shadow: 0 0 6px rgba(100,220,255,0.8);
    transition: width 0.15s ease-out;
  }
  #xp-fill.near-full { animation: xpPulse 0.5s infinite alternate; }
  @keyframes xpPulse { from { filter: brightness(1.0); } to { filter: brightness(1.7); } }

  /* v0.6.1: レベルアップ3択カード（非モーダル・画面下部）
     時間停止をやめてスローモー0.25倍速に変更。オーバーレイは下部だけを覆い、
     pointer-events:none で背後のcanvasへ線描画を通す（カード本体のみ操作可）。 */
  #levelup-overlay {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    padding-bottom: 16px;
    background: linear-gradient(to top, rgba(0,0,10,0.72) 60%, rgba(0,0,10,0));
    z-index: 40;
    pointer-events: none;
  }
  #levelup-overlay.visible { display: flex; }
  #levelup-title {
    font-family: -apple-system, BlinkMacSystemFont, monospace;
    font-size: 15px;
    color: #a0ecff;
    letter-spacing: 0.18em;
    text-shadow: 0 0 14px rgba(100,220,255,0.9);
    margin: 10px 0 8px;
  }
  #card-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: min(86vw, 340px);
  }
  .upgrade-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 14px;
    min-height: 52px;
    background: rgba(10, 16, 30, 0.92);
    border: 2px solid #5a7a9a;
    border-radius: 12px;
    color: #e8f4ff;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    text-align: left;
    cursor: pointer;
    pointer-events: auto;
    -webkit-tap-highlight-color: transparent;
  }
  .upgrade-card:active { transform: scale(0.97); }
  .upgrade-card.rarity-rare { border-color: #ffd060; box-shadow: 0 0 14px rgba(255,208,96,0.35); }
  .upgrade-card.rarity-star { border-color: #ff70d0; box-shadow: 0 0 18px rgba(255,112,208,0.45); }
  .upgrade-card .card-icon { font-size: 24px; flex-shrink: 0; }
  .upgrade-card .card-name { font-size: 15px; font-weight: bold; letter-spacing: 0.08em; }
  .upgrade-card .card-desc { font-size: 11px; color: #a8c4e0; margin-top: 2px; }

  /* v0.6: タイトル画面 */
  #title-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 8, 0.35);
    z-index: 50;
  }
  #title-overlay.visible { display: flex; }
  #title-logo {
    font-family: -apple-system, BlinkMacSystemFont, serif;
    font-size: 64px;
    font-weight: bold;
    color: #fff;
    letter-spacing: 0.15em;
    text-shadow: 0 0 40px rgba(255,140,40,0.9), 0 0 80px rgba(255,80,20,0.5);
  }
  #title-sub {
    font-family: monospace;
    font-size: 16px;
    color: #ffb060;
    letter-spacing: 0.5em;
    text-align: center;
    margin-top: 6px;
  }
  #title-best {
    font-family: monospace;
    font-size: 13px;
    color: #a0c0e0;
    margin-top: 30px;
    text-align: center;
    line-height: 1.7;
  }
  #title-hint {
    font-family: monospace;
    font-size: 15px;
    color: #fff;
    letter-spacing: 0.25em;
    margin-top: 34px;
    animation: hintBlink 1.4s infinite;
  }
  @keyframes hintBlink { 0%,100% { opacity: 1.0; } 50% { opacity: 0.25; } }

  /* v0.6: リザルト統計 */
  #result-stats {
    font-family: monospace;
    font-size: 15px;
    color: #d0e8ff;
    margin-top: 22px;
    line-height: 2.0;
    text-align: left;
    display: none;
  }
  #result-stats.visible { display: block; }
  #result-stats .stat-value { color: #ffe060; font-weight: bold; }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<!-- 右上 HUD: FPS -->
<div id="hud">
  <span class="k">FPS</span><span id="h-fps">--</span>
</div>

<!-- 左上 HUD: FLOCK残数 + レベル -->
<div id="hud-left">
  <div class="label">FLOCK</div>
  <span id="h-alive">10</span> / <span id="h-max">100</span>
  <div id="h-level" style="color:#a0ecff;font-size:11px;margin-top:2px;">Lv.1</div>
  <div id="h-weapon" style="color:#ff8c28;font-size:11px;margin-top:2px;">&#x1F525; 火竜</div>
</div>

<!-- 右下 HUD: 卵 + ステージ -->
<div id="hud-eggs">
  <div>&#x1F95A; x <span id="h-eggs">0</span></div>
  <div id="h-stage" style="color:#80c8ff;font-size:11px;">STAGE 1/4</div>
</div>

<!-- 残建物カウント -->
<div id="hud-buildings">&#x1F3F0; <span id="h-buildings">--/--</span></div>

<!-- 左下: ミニマップ -->
<div id="minimap-container">
  <canvas id="minimap" width="80" height="60"></canvas>
</div>

<!-- バージョン表示（左下・スクリーン固定） -->
<div id="hud-version"></div>

<!-- 全制覇リザルトオーバーレイ -->
<div id="overlay">
  <div id="overlay-title">EPOCH CONQUERED</div>
  <div id="result-stats"></div>
  <button id="retry-btn">タイトルへ</button>
</div>

<!-- ステージ間演出 -->
<div id="stage-overlay">
  <div>
    <div id="stage-text">STAGE 2</div>
    <div id="stage-sub">ANCIENT CIVILIZATION</div>
  </div>
</div>

<!-- v0.6: XPバー -->
<div id="xp-bar"><div id="xp-fill"></div></div>

<!-- v0.6: レベルアップ3択カード -->
<div id="levelup-overlay">
  <div id="levelup-title">LEVEL UP</div>
  <div id="card-list"></div>
</div>

<!-- v0.6: タイトル画面 -->
<div id="title-overlay">
  <div style="text-align:center;">
    <div id="title-logo">竜潮</div>
    <div id="title-sub">DRAGON TIDE</div>
  </div>
  <div id="title-best"></div>
  <div id="title-hint">TAP TO START</div>
</div>

<script>
"use strict";

// -----------------------------------------------------------------
// バージョン定数（ここだけ更新すれば画面に反映される）
// -----------------------------------------------------------------
const GAME_VERSION = "v0.11.0";
document.getElementById("hud-version").textContent = GAME_VERSION;

/* ============================================================
 * 竜潮 / Dragon Tide — Stage Edition v3
 *
 * v3改修:
 *   - 街区（ブロック）方式マップ: 1ステージ150〜250建物
 *   - 静的レイヤー（オフスクリーンCanvas）で建物描画コスト削減
 *   - ブレス攻撃（レーザー）: 近接接触ダメージを廃止し連続照射方式に変更
 *   - ブレス命中点にヒットパーティクル（0.2秒間引き）
 * ============================================================ */

// -----------------------------------------------------------------
// ワールド定数
// -----------------------------------------------------------------
// 変更1: ワールドサイズを拡大（4800×3600）
// オフスクリーンcanvasメモリ: 4800×3600×4byte = 69.1MB（許容範囲内）
// 建物間隔も52px（旧26px）に広げているため、1町の占有面積は旧比約4倍になる
const WORLD_W = 4800;
const WORLD_H = 3600;

// ブレス射程（px）
const BREATH_RANGE = 80;
// ブレス基礎ダメージ（毎フレーム・秒間換算: 0.05/frame × 60fps = 3/sec）
const BREATH_DAMAGE_PER_SEC = 3.0;
// ブレスヒットパーティクル間引き間隔（秒）
const BREATH_PARTICLE_INTERVAL = 0.2;

// -----------------------------------------------------------------
// 変更1: 卵持ち建物パラメータ
// 全建物のうち約18%だけが陥落時に卵を落とす（EGG_BEARER_RATIO）。
// 落とす卵は常に1個（EGG_DROP_COUNT）で群れの増加ペースを緩やかにする。
// 視覚的な目印は毎フレーム動的描画（明滅アニメ付き）で陥落後は消える。
// -----------------------------------------------------------------
// 実験: 建物密度の一括倍率。各ステージの町あたり建物数にこれを掛ける。
// 卵割合はこの倍率で割って、卵の絶対数（＝群れの成長ペース）を一定に保つ。
let BUILDING_DENSITY_MULT = 4; // 4=密な街（最適化済み後のデフォルト）
                               // ビューポートカリング＋空間ハッシュゲートにより
                               // 数千棟でも per-frame コストはほぼ一定。
const EGG_BEARER_RATIO_BASE = 0.18; // 基準割合（密度1倍のときの値）
// 実効割合は BASE / 密度倍率。密度を上げた分だけ割合を下げて卵の総数を一定に。
function eggBearerRatio() { return EGG_BEARER_RATIO_BASE / BUILDING_DENSITY_MULT; }
const EGG_DROP_COUNT   = 1;    // 陥落時に落とす卵の個数

// -----------------------------------------------------------------
// 変更2: ダウン/復帰モデル パラメータ
// HP0 以下 → ダウン状態（フェードアウト → 一定秒後フェードインで全回復して復帰）
// 恒久消滅はない。ダウン中は有効個体数から除外されカメラ・ブレス範囲に影響しない。
// -----------------------------------------------------------------
const BOID_DOWN_DURATION    = 10.0;  // ダウン継続秒数（この後フェードインで復帰）
const BOID_REVIVE_DURATION  = 0.6;  // フェードイン復帰アニメ秒数

// 1ヒットあたりのダメージ量（BOID_MAX_HP の約1/7 ≒ 数発耐える）
// BOID_MAX_HP=30 → 約4.3ダメージ → 7発でダウン
const PROJECTILE_HIT_DAMAGE = 4.3;

// -----------------------------------------------------------------
// バランスデータ（Phase2から流用）
// -----------------------------------------------------------------
// Boids パラメータ（散開相当の値を恒久固定値として採用）
const BASE_CFG = {
  perception:       55,   // spread 値
  separationRadius: 28,   // spread 値
  maxSpeed:         160,
  minSpeed:         60,
  maxForce:         320,
  wSeparation:      2.5,  // spread 値
  wAlignment:       1.0,
  wCohesion:        0.4,  // spread 値
  wLeader:          1.6,
  leaderSeekDist:   80,
  pathMaxPoints:    240,
  pathMinSegment:   8,
  leaderSpeed:      220,
  idleWanderRadius: 120,
  fixedStepMs:      16,
  maxDtMs:          64,
};

// -----------------------------------------------------------------
// ステージ定義
// -----------------------------------------------------------------

const BUILDING_SIZE_PARAMS = {
  // tiny は小さく散在する極小集落（変更4追加）。すぐ壊れる育成フィーダー。
  // small の 0.6 倍の radius で地図にまばらに点在する。
  tiny:   { hpMin: 3, hpMax: 6,  radiusBase: 6  },
  // small は「育成フィーダー」。すぐ壊れて卵が出て群れが育つことが目的。HP低め。
  small:  { hpMin: 6, hpMax: 10, radiusBase: 10 },
  medium: { hpMin: 25, hpMax: 35, radiusBase: 16 },
  large:  { hpMin: 60, hpMax: 85, radiusBase: 28 },
  // boss: 別途 BOSS_PARAMS で管理（サイズ/形状はここと独立）
};

// -----------------------------------------------------------------
// tiny ハムレット（クラスタ）パラメータ
// tiny を単体バラバラではなく「小さな集落（ハムレット）」の塊として配置する。
// 各クラスタ中心をマップに散在させ、そこから近距離に複数棟を密集配置することで
// 「農村の集まり」という視覚的まとまりを作る。
// -----------------------------------------------------------------
// ステージあたりのハムレット数（クラスタ数）
// v0.6-p4: 空白削減のため 10→17 に増量（町の隙間を農村で埋める。仕様 §9.2）
const TINY_HAMLET_COUNT     = 17;
// 1クラスタあたりの tiny 棟数（min/max でランダム）
const TINY_PER_HAMLET_MIN   = 5;
const TINY_PER_HAMLET_MAX   = 8;   // 5〜10棟。合計は50〜80棟程度
// クラスタ内での棟の散布半径（px）：密集して「集落」に見える大きさ
const TINY_HAMLET_RADIUS_MIN = 40;
const TINY_HAMLET_RADIUS_MAX = 65;
// クラスタ中心同士の最小間隔（他クラスタとの分離）
const TINY_HAMLET_MIN_SPACING = 280; // クラスタ同士がくっつかない最小値
// 既存街区（small/medium/large）クラスタとの最小間隔
const TINY_HAMLET_FROM_TOWN_GAP = 120;
// クラスタ内 tiny 棟同士の最小中心間距離（重なり防止）
const TINY_MIN_SPACING        = BUILDING_SIZE_PARAMS.tiny.radiusBase * 2 + 8; // 20px
// 既存建物（small/medium/large）との最小間隔
const TINY_FROM_EXISTING_GAP  = BUILDING_SIZE_PARAMS.tiny.radiusBase + 10;   // 16px
// マップ端からのマージン
const TINY_MARGIN = 80;
// クラスタ中心の配置試行回数
const TINY_HAMLET_MAX_ATTEMPTS = 20;
// クラスタ内各棟の配置試行回数
const TINY_PER_BUILDING_MAX_ATTEMPTS = 12;

// -----------------------------------------------------------------
// 首都要塞（capital district）パラメータ
// ボス周囲を大型建物のリングで取り囲み、さらに城下の雑魚建物で埋める「首都城下町」。
// -----------------------------------------------------------------
// リング配置半径（ボス中心からの距離）
const CAPITAL_RING_INNER = 80;   // ドーナツ内縁: ボス半径(46) + 最低間隔(34)
const CAPITAL_RING_OUTER = 180;  // ドーナツ外縁（外縁を広げて建物が並ぶ余地を確保）
// リングの建物数。
// 理論上限: 中間半径 130px の円周 ≈ 817px ÷ 最小間隔60px ≈ 13棟。
// 14棟を目標に設定（試行4回で多少スキップが出ても 10〜14 棟確保できる）。
const CAPITAL_RING_COUNT = 14;
// 首都建物の HP は通常 large より 30% 高い（「首都＝強い」感。ただしボスより明確に弱い）
const CAPITAL_HP_MULT = 1.30;
// 首都建物の radius は通常 large と同じ（見た目の一貫性を維持）
const CAPITAL_RADIUS_BASE = BUILDING_SIZE_PARAMS.large.radiusBase; // 28px
// 首都建物同士の最小中心間距離（重なり防止）
// radius*2 + 4px = 60px（ぎりぎり接触しない最小値）
const CAPITAL_MIN_SPACING = CAPITAL_RADIUS_BASE * 2 + 4; // 60px

// 変更1: 城下の雑魚建物（small）充填パラメータ
// 大型リング（外縁180px）の外側〜360px の環状帯に small 建物を敷き詰めて城下町にする。
// small radius=10px なので間隔26px あれば隣接せず、32px で余裕を確保。
const CAPITAL_SMALL_INNER  = CAPITAL_RING_OUTER + 8;   // 188px: リング直外から開始
const CAPITAL_SMALL_OUTER  = 360;  // 360px: 城下充填の外縁
// small 建物内の充填試行数。ポアソンディスク風にランダム配置 × 試行でほぼ上限に収束。
const CAPITAL_SMALL_COUNT  = 45;   // 目標棟数（実際は重なり除去で若干減る場合あり）
const CAPITAL_SMALL_RADIUS = BUILDING_SIZE_PARAMS.small.radiusBase; // 10px
// small 同士の最小間隔（radius*2 + 12px のゆとり）
const CAPITAL_SMALL_MIN_SPACING = CAPITAL_SMALL_RADIUS * 2 + 12; // 32px

// 小集落クラスタとの分離に使う「ボス＋リング＋城下充填」占有半径
// 城下外縁 CAPITAL_SMALL_OUTER + small radius + 余白 → 他クラスタを外に追い出す
const CAPITAL_EXCLUSION_RADIUS = CAPITAL_SMALL_OUTER + CAPITAL_SMALL_RADIUS + 60; // 430px
// ボスをマップ端から確保するマージン（城下外縁 + 余白がマップ外に出ないよう）
const CAPITAL_BOSS_MARGIN = CAPITAL_SMALL_OUTER + CAPITAL_SMALL_RADIUS + 80; // 450px

// -----------------------------------------------------------------
// ボス集落パラメータ
// ボスはステージごとに1体だけ配置される高耐久・高火力の核心目標。
// HP: 小集落の約15倍を起点に、ステージが進むほど係数を掛けて増やす。
// 火力: 発射間隔=小集落の約1/3、projectileCount 3〜5、弾速・ダメージ高め。
// 投射ダメージはダウン/復帰モデルのまま（恒久喪失なし）。
// -----------------------------------------------------------------
// v0.7: ボスを「序盤は跳ね返される」強さへ大幅増強（Shooterプレイテスト）。
// 育っていない群れが挑むと、強ノックバック弾＋ノヴァで物理的に押し返される。
const BOSS_BASE_HP = 600;          // ステージ1のボスHP（旧150。開幕10体では歯が立たない）
const BOSS_HP_STAGE_MULT = 1.4;    // ステージごとのHP増加係数（1→600, 2→840, 3→1176, 4→1646）
const BOSS_RADIUS = 46;            // ボスの見た目半径（小集落10の4.6倍、一目でボスと分かる）
const BOSS_ATTACK_RADIUS = 380;    // ボスの攻撃射程（小集落の2.5倍以上）

// ボスの投射パラメータ（ステージ4 large より強い）
const BOSS_FIRE_PARAMS = {
  projectileInterval: 0.6,         // ボスは interval をそのまま使う（高頻度）
  projectileSpeed:    280,
  projectileDamage:   3.0,         // BOID_MAX_HP=30 → 10発でダウン ×5本ファン
  projectileCount:    5,           // 5方向にファン展開で群れを散らす
  projectileTracking: false,
};

// v0.7: ボス弾（kind=2）の跳ね返し。速度クランプで消えないよう「位置ごと押し戻す」
const BOSS_SHOT_KNOCKBACK_DIST = 46;   // 被弾時の押し戻し距離（px）
const BOSS_SHOT_MAX_RANGE      = 460;  // ボス弾の飛距離上限（射程380より広く）

// v0.7: ボスノヴァ（周期的な反発衝撃波）。近づいた群れを面で弾き飛ばす
const BOSS_NOVA_INTERVAL = 6.0;   // 発動間隔（秒）
const BOSS_NOVA_RADIUS   = 260;   // 効果半径（px）
const BOSS_NOVA_DAMAGE   = 2.5;   // ノヴァのダメージ
const BOSS_NOVA_PUSH_MIN = 40;    // 最低押し戻し距離（px。中心に近いほど大きく飛ぶ）

// ボスのHP計算（stageIndexは0始まり）
function calcBossHp(stageIndex) {
  return Math.round(BOSS_BASE_HP * Math.pow(BOSS_HP_STAGE_MULT, stageIndex));
}

function createBuildingLayer() {
  buildingLayerCanvas = document.createElement("canvas");
  buildingLayerCanvas.width  = WORLD_W;
  buildingLayerCanvas.height = WORLD_H;
  buildingLayerCtx = buildingLayerCanvas.getContext("2d");
  buildingLayerDirty = true;
}

let viewW = 0, viewH = 0, dpr = 1;
let bottomUIHeight = 0;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  viewW = window.innerWidth;
  viewH = window.innerHeight;
  // 隊形ボタンを撤廃したため UI 領域は 0 — 画面全体が線描画エリア
  bottomUIHeight = 0;
  canvas.width  = Math.floor(viewW * dpr);
  canvas.height = Math.floor(viewH * dpr);
  canvas.style.width  = viewW + "px";
  canvas.style.height = viewH + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", resize);
resize();

// -----------------------------------------------------------------
// カメラ（ワールド座標系でのカメラ中心＋ズームスケール）
// -----------------------------------------------------------------
// ドラゴンの見た目が良くなった（胴体・翼分離）ことで、開始直後はズームインして
// 竜をアップで見せ、卵を回収して群れが増えるほどカメラが引いていく、という
// 「塊魂」的な規模のエスカレーション演出を復活させる。
// BOIDS_INITIAL(10匹)で最もズームイン、群れ上限（effFlockCap）で最大ズームアウト。
const CAM_SCALE_MIN_COUNT = 1.15; // BOIDS_INITIAL 時のスケール（アップ）
const CAM_SCALE_MAX_COUNT = 0.6;  // 群れ上限時のスケール（従来の最大引き量）
const cam = { x: 400, y: WORLD_H / 2, scale: CAM_SCALE_MIN_COUNT };

// 有効個体数から目標ズームスケールを算出する。
// BOIDS_INITIAL〜effFlockCap() の範囲で線形補間し、範囲外はクランプする。
// v0.6: 上限は「大繁殖」カードで動的に増えるため effFlockCap() を参照する。
function calcTargetCamScale(aliveCount) {
  const t = (aliveCount - BOIDS_INITIAL) / (effFlockCap() - BOIDS_INITIAL);
  const tc = Math.max(0, Math.min(1, t));
  return CAM_SCALE_MIN_COUNT + (CAM_SCALE_MAX_COUNT - CAM_SCALE_MIN_COUNT) * tc;
}

function worldToScreen(wx, wy) {
  return {
    x: (wx - cam.x) * cam.scale + viewW * 0.5,
    y: (wy - cam.y) * cam.scale + viewH * 0.5,
  };
}

function screenToWorld(sx, sy) {
  return {
    x: (sx - viewW * 0.5) / cam.scale + cam.x,
    y: (sy - viewH * 0.5) / cam.scale + cam.y,
  };
}

function updateCamera(dt) {
  const centroid = calcFriendlyCentroid();
  const lerpFactor = 0.08;
  cam.x += (centroid.x - cam.x) * lerpFactor;
  cam.y += (centroid.y - cam.y) * lerpFactor;

  // ズームスケール: 有効ワールド表示範囲をスケールで除した値でクランプする
  // scale が小さいほど広い範囲が見えるため、境界余白はスケールを考慮する
  const halfW = viewW * 0.5 / cam.scale;
  const halfH = viewH * 0.5 / cam.scale;
  cam.x = Math.max(halfW, Math.min(WORLD_W - halfW, cam.x));
  cam.y = Math.max(halfH, Math.min(WORLD_H - halfH, cam.y));

  // 群れ生存数に応じてスケールをなめらかに変化させる（lerpで追従）
  const aliveCount = countAliveBoids();
  const targetScale = calcTargetCamScale(aliveCount);
  cam.scale += (targetScale - cam.scale) * Math.min(1, dt * 1.5);
}

// -----------------------------------------------------------------
// 集落（建物）の動的生成 — 街区（ブロック）方式
// -----------------------------------------------------------------
let settlements = [];

function randRange(min, max) {
  return min + Math.random() * (max - min);
}

function randInt(min, max) {
  return min + Math.floor(Math.random() * (max - min + 1));
}

function randChoice(array) {
  return array[Math.floor(Math.random() * array.length)];
}

function dist2(ax, ay, bx, by) {
  const dx = ax - bx, dy = ay - by;
  return dx * dx + dy * dy;
}

/**
 * 町の中心座標を均等にマップへ配置（グリッドジッター法）。
 *
 * bossWx/bossWy が渡されたとき、その周囲 CAPITAL_EXCLUSION_RADIUS 以内の
 * グリッドセルを除外して小集落クラスタが首都要塞と重ならないようにする。
 * 除外されたセルは最大3回まで再抽選し、それでも回避できない場合はスキップする
 * （小集落数がやや減るが、要塞都市の「独立感」を優先）。
 *
 * @param {number} townCount  生成したい町の数
 * @param {number} [bossWx]   ボスのワールドX（オプション）
 * @param {number} [bossWy]   ボスのワールドY（オプション）
 */
function placeTownCenters(townCount, bossWx, bossWy) {
  // 左端250pxは群れスタート地点なので除外
  const MARGIN_LEFT  = 300;
  const MARGIN_RIGHT = 150;
  const MARGIN_Y     = 200;

  const usableW = WORLD_W - MARGIN_LEFT - MARGIN_RIGHT;
  const usableH = WORLD_H - MARGIN_Y * 2;

  const cols = Math.ceil(Math.sqrt(townCount * (usableW / usableH)));
  const rows = Math.ceil(townCount / cols);
  const cellW = usableW / cols;
  const cellH = usableH / rows;

  // ボス＋リング占有の排除半径の二乗（距離比較用）
  const excl2 = CAPITAL_EXCLUSION_RADIUS * CAPITAL_EXCLUSION_RADIUS;
  const hasExclusion = (bossWx !== undefined && bossWy !== undefined);

  const centers = [];
  for (let row = 0; row < rows && centers.length < townCount; row++) {
    for (let col = 0; col < cols && centers.length < townCount; col++) {
      let cx, cy;
      let accepted = false;

      // 最大3回試行して排除ゾーン外の座標を探す
      for (let attempt = 0; attempt < 3; attempt++) {
        cx = MARGIN_LEFT + col * cellW + randRange(cellW * 0.25, cellW * 0.75);
        cy = MARGIN_Y    + row * cellH + randRange(cellH * 0.25, cellH * 0.75);
        if (!hasExclusion || dist2(cx, cy, bossWx, bossWy) >= excl2) {
          accepted = true;
          break;
        }
      }

      // 3回試行してもボス周辺だった場合はこのセルをスキップ
      // （首都と重なる小集落を強制配置しない）
      if (!accepted) continue;

      centers.push({ x: cx, y: cy });
    }
  }
  return centers;
}

// -----------------------------------------------------------------
// v0.10: 有機的な町生成 — 「広場＋ランドマークを中心に、放射状の通りと
// 環状路に沿って建物が通りに面して並ぶ」現実の集落の育ち方を模す。
// 建物総数・サイズ構成・HPは旧格子方式と同一（バランス不変条件）。
// -----------------------------------------------------------------
function generateTown(townCenterX, townCenterY, smallCount, mediumCount, largeCount, config, townIndex) {
  const result = [];
  const baseHue = config.townBaseHues[townIndex % config.townBaseHues.length];
  const bSmall  = config.buildings.small;
  const bMedium = config.buildings.medium;
  const bLarge  = config.buildings.large;

  const totalCount = smallCount + mediumCount + largeCount;
  const PLAZA_R = 36;                                          // 中央広場の半径
  // v0.11: 大都市（scale 1.7 → 建物約400棟）が収まるよう上限を430へ拡大。
  // 係数も 15→16.5 に上げて敷地に余裕を持たせ、配置成功率（実建物数）を上げる。
  const townR   = Math.max(170, Math.min(430, 16.5 * Math.sqrt(totalCount))); // 町の外縁半径
  const RING_R  = PLAZA_R + 58;                                // 環状路の半径

  // 放射状の通り（3〜5本、角度ジッター付き）
  const streetCount = 3 + (townIndex % 3);
  const streets = [];
  const streetBase = randRange(0, Math.PI * 2);
  for (let k = 0; k < streetCount; k++) {
    streets.push({
      angle: streetBase + (k * Math.PI * 2) / streetCount + randRange(-0.25, 0.25),
      len: townR * randRange(0.85, 1.0),
    });
  }

  const placedPos = [];   // {x, y, r} 重なりチェック用
  function tryPlace(wx, wy, radius, minGap) {
    if (wx < 30 || wx > WORLD_W - 30 || wy < 30 || wy > WORLD_H - 30) return false;
    for (const p of placedPos) {
      const minD = p.r + radius + minGap;
      if (dist2(wx, wy, p.x, p.y) < minD * minD) return false;
    }
    placedPos.push({ x: wx, y: wy, r: radius });
    return true;
  }

  // --- (1) ランドマーク（広場中央）: 神殿/風車を町ごとに交互。large級のHP×1.3 ---
  const landmarkKind = townIndex % 2 === 0 ? "temple" : "windmill";
  const lmHp = Math.round(randInt(BUILDING_SIZE_PARAMS.large.hpMin, BUILDING_SIZE_PARAMS.large.hpMax) * 1.3);
  const landmark = makeBuilding(townCenterX, townCenterY, "large", bLarge.colors[0], bLarge, lmHp);
  landmark._landmark  = landmarkKind;
  landmark._faceAngle = randRange(-0.2, 0.2);
  placedPos.push({ x: townCenterX, y: townCenterY, r: landmark.radius });
  result.push(landmark);

  // --- (2) 大型建物: 環状路上の通りと通りの間（にらみを利かせる領主館・聖堂） ---
  let placedLarge = 0;
  for (let k = 0; k < largeCount * 8 && placedLarge < largeCount; k++) {
    const angle = randRange(0, Math.PI * 2);
    const r     = RING_R + randRange(10, 40);
    const wx = townCenterX + Math.cos(angle) * r;
    const wy = townCenterY + Math.sin(angle) * r;
    if (!tryPlace(wx, wy, BUILDING_SIZE_PARAMS.large.radiusBase, 8)) continue;
    const hp = randInt(BUILDING_SIZE_PARAMS.large.hpMin, BUILDING_SIZE_PARAMS.large.hpMax);
    const b  = makeBuilding(wx, wy, "large", bLarge.colors[placedLarge % bLarge.colors.length], bLarge, hp);
    b._faceAngle = angle + Math.PI / 2;   // 広場（中心）に正面を向ける
    result.push(b);
    placedLarge++;
  }

  // --- (3) 中型建物: 放射状の通り沿いの内側区間（商家・工房の並び） ---
  let placedMedium = 0;
  for (let k = 0; k < mediumCount * 8 && placedMedium < mediumCount; k++) {
    const st   = streets[k % streets.length];
    const t    = randRange(PLAZA_R + 22, townR * 0.55);
    const side = k % 2 === 0 ? 1 : -1;
    const off  = side * (16 + randRange(0, 8) + BUILDING_SIZE_PARAMS.medium.radiusBase);
    const wx = townCenterX + Math.cos(st.angle) * t + Math.cos(st.angle + Math.PI / 2) * off;
    const wy = townCenterY + Math.sin(st.angle) * t + Math.sin(st.angle + Math.PI / 2) * off;
    if (!tryPlace(wx, wy, BUILDING_SIZE_PARAMS.medium.radiusBase, 6)) continue;
    const hp = randInt(BUILDING_SIZE_PARAMS.medium.hpMin, BUILDING_SIZE_PARAMS.medium.hpMax);
    const b  = makeBuilding(wx, wy, "medium", shadeColor(baseHue, randInt(-10, 20)), bMedium, hp);
    b._faceAngle = st.angle + Math.PI / 2;   // 通りに面する
    result.push(b);
    placedMedium++;
  }

  // --- (4) 小型建物: まず通り沿い、埋まらない分は町の中の路地に有機的に充填 ---
  let placedSmall = 0;
  // (4a) 通り沿い（両側にぎっしり並ぶ長屋）
  for (let k = 0; k < smallCount * 4 && placedSmall < smallCount; k++) {
    const st   = streets[k % streets.length];
    const t    = randRange(PLAZA_R + 16, st.len);
    const side = (k >> 1) % 2 === 0 ? 1 : -1;
    const off  = side * (13 + randRange(0, 6) + BUILDING_SIZE_PARAMS.small.radiusBase);
    const wx = townCenterX + Math.cos(st.angle) * t + Math.cos(st.angle + Math.PI / 2) * off;
    const wy = townCenterY + Math.sin(st.angle) * t + Math.sin(st.angle + Math.PI / 2) * off;
    if (!tryPlace(wx, wy, BUILDING_SIZE_PARAMS.small.radiusBase, 4)) continue;
    const hp = randInt(BUILDING_SIZE_PARAMS.small.hpMin, BUILDING_SIZE_PARAMS.small.hpMax);
    const b  = makeBuilding(wx, wy, "small", shadeColor(baseHue, randInt(-15, 15)), bSmall, hp);
    b._faceAngle = st.angle + Math.PI / 2;
    result.push(b);
    placedSmall++;
  }
  // (4b) 路地充填（中心に密・外縁に疎。√分布で中心へ寄せる）
  // v0.11: 試行回数を倍増（×8→×16）して充填率を上げる＝実建物数を目標値に近づける
  for (let k = 0; k < smallCount * 16 && placedSmall < smallCount; k++) {
    const angle = randRange(0, Math.PI * 2);
    const r     = PLAZA_R + 14 + Math.sqrt(Math.random()) * (townR - PLAZA_R - 14);
    const wx = townCenterX + Math.cos(angle) * r;
    const wy = townCenterY + Math.sin(angle) * r;
    if (!tryPlace(wx, wy, BUILDING_SIZE_PARAMS.small.radiusBase, 4)) continue;
    const hp = randInt(BUILDING_SIZE_PARAMS.small.hpMin, BUILDING_SIZE_PARAMS.small.hpMax);
    const b  = makeBuilding(wx, wy, "small", shadeColor(baseHue, randInt(-15, 15)), bSmall, hp);
    b._faceAngle = angle + Math.PI / 2 + randRange(-0.3, 0.3);   // おおよそ中心を向く
    result.push(b);
    placedSmall++;
  }

  // --- (5) 畑: 町の外縁に沿って3〜6枚（通りの延長方向に整列＝街道沿いの耕作地） ---
  const fields = [];
  const fieldCount = randInt(3, 6);
  for (let k = 0; k < fieldCount; k++) {
    const st = streets[k % streets.length];
    const angle = st.angle + randRange(-0.5, 0.5);
    const dist  = townR + randRange(50, 150);
    fields.push({
      x: townCenterX + Math.cos(angle) * dist,
      y: townCenterY + Math.sin(angle) * dist,
      w: randRange(70, 130),
      h: randRange(45, 80),
      angle: st.angle + randRange(-0.15, 0.15),
    });
  }

  // 描画用メタデータ（先頭のランドマークに付属）
  landmark._townMeta = {
    cx: townCenterX,
    cy: townCenterY,
    plazaR: PLAZA_R,
    ringR: RING_R,
    townR,
    streets,
    fields,
    // v0.9.1以前の互換フィールド（fortified リム等が参照）
    spacing: 52,
  };

  return result;
}

function makeBuilding(wx, wy, size, color, bConfig, hp) {
  return {
    wx,
    wy,
    size,
    color,
    shape:  randChoice(bConfig.shapes),
    radius: BUILDING_SIZE_PARAMS[size].radiusBase,
    maxHp:  hp,
    hp,
    fallen: false,
    // 変更1: 卵持ちフラグ（generateTown 内で EGG_BEARER_RATIO に従い後から設定する）
    isEggBearer: false,
    // ボス集落フラグ（通常建物は false。makeBossBuilding で true になる）
    isBoss: false,
    attackTimer: Math.random() * bConfig.projectileInterval,
    attackRadius:        bConfig.attackRadius,
    projectileInterval:  bConfig.projectileInterval,
    projectileSpeed:     bConfig.projectileSpeed,
    projectileDamage:    bConfig.projectileDamage,
    projectileColor:     bConfig.projectileColor,
    projectileCount:     bConfig.projectileCount,
    projectileTracking:  bConfig.projectileTracking,
    projectileAoe:       bConfig.projectileAoe ?? 0,
    reward:              bConfig.reward,
    // ブレスヒットパーティクルのインターバルカウンタ
    _breathParticleTimer: 0,
  };
}

/**
 * tiny ハムレット（集落クラスタ）をマップ全体に配置する。
 *
 * 単体バラバラ配置から「ハムレット単位のクラスタ配置」に変更。
 * 1クラスタ = TINY_PER_HAMLET_MIN〜MAX 棟の密集体。
 * クラスタ中心はボス＋首都占有領域・既存街区・他クラスタと重ならない位置に散在させる。
 *
 * settlements 配列への追加 → 空間ハッシュ・ビューポートカリング・攻撃ゲート・
 * オフスクリーン合成・ミニマップは自動的に対象になる（既存最適化を壊さない）。
 *
 * @param {Array}  existingBuildings  既存の建物リスト（重なりチェック用）
 * @param {number} bossWx            ボスのワールドX
 * @param {number} bossWy            ボスのワールドY
 * @param {Object} config            STAGE_CONFIGS[stageIndex]
 * @returns {Array}  配置された tiny 建物のリスト
 */
function generateTinySettlements(existingBuildings, bossWx, bossWy, config) {
  const result = [];
  const bSmall = config.buildings.small; // tiny は small のパラメータを流用（攻撃・色）
  const tinyR  = BUILDING_SIZE_PARAMS.tiny.radiusBase;

  // 既存建物の位置リスト（tiny との重なりチェック用）
  const occupied = existingBuildings.map(b => ({ x: b.wx, y: b.wy, r: b.radius }));

  // 首都占有領域の二乗（ボス中心からの排除距離）
  const excl2 = CAPITAL_EXCLUSION_RADIUS * CAPITAL_EXCLUSION_RADIUS;
  // クラスタ同士の最小間隔二乗
  const hamletSpacing2 = TINY_HAMLET_MIN_SPACING * TINY_HAMLET_MIN_SPACING;
  // 既存街区との最小間隔二乗（クラスタ中心 vs 既存建物中心）
  const fromTown2 = TINY_HAMLET_FROM_TOWN_GAP * TINY_HAMLET_FROM_TOWN_GAP;

  // 確定したクラスタ中心リスト（他クラスタとの分離チェック用）
  const hamletCenters = [];

  for (let h = 0; h < TINY_HAMLET_COUNT; h++) {
    // --- クラスタ中心の配置 ---
    let centerX = 0, centerY = 0;
    let hamletPlaced = false;

    for (let attempt = 0; attempt < TINY_HAMLET_MAX_ATTEMPTS && !hamletPlaced; attempt++) {
      const cx = TINY_MARGIN + Math.random() * (WORLD_W - TINY_MARGIN * 2);
      const cy = TINY_MARGIN + Math.random() * (WORLD_H - TINY_MARGIN * 2);

      // 首都占有領域チェック（クラスタ中心がボス周辺に入らない）
      if (dist2(cx, cy, bossWx, bossWy) < excl2) continue;

      // 既存街区（small/medium/large 建物）との間隔チェック
      // クラスタ半径 + fromTown2 内に既存建物があれば除外
      let tooCloseToTown = false;
      for (const ob of occupied) {
        // 既存建物との最小間隔 = その建物 radius + tinyハムレット半径 + gap
        const minD = ob.r + TINY_HAMLET_RADIUS_MAX + TINY_HAMLET_FROM_TOWN_GAP;
        if (dist2(cx, cy, ob.x, ob.y) < minD * minD) {
          tooCloseToTown = true;
          break;
        }
      }
      if (tooCloseToTown) continue;

      // 他クラスタ中心との最小間隔チェック
      let tooCloseToHamlet = false;
      for (const hc of hamletCenters) {
        if (dist2(cx, cy, hc.x, hc.y) < hamletSpacing2) {
          tooCloseToHamlet = true;
          break;
        }
      }
      if (tooCloseToHamlet) continue;

      centerX = cx;
      centerY = cy;
      hamletPlaced = true;
    }

    if (!hamletPlaced) continue; // このクラスタは配置不能 → スキップ

    hamletCenters.push({ x: centerX, y: centerY });

    // --- クラスタ内の棟を配置 ---
    const buildingCount = randInt(TINY_PER_HAMLET_MIN, TINY_PER_HAMLET_MAX);
    const hamletR = randRange(TINY_HAMLET_RADIUS_MIN, TINY_HAMLET_RADIUS_MAX);
    // このクラスタで確定した棟（クラスタ内の重なりチェック用）
    const hamletBuildings = [];

    for (let k = 0; k < buildingCount; k++) {
      let placed = false;

      for (let attempt = 0; attempt < TINY_PER_BUILDING_MAX_ATTEMPTS && !placed; attempt++) {
        // クラスタ中心の周囲 hamletR 以内にランダム配置（一様分布にするため√補正）
        const angle = Math.random() * Math.PI * 2;
        const r     = hamletR * Math.sqrt(Math.random());
        const wx    = centerX + Math.cos(angle) * r;
        const wy    = centerY + Math.sin(angle) * r;

        // ワールド境界チェック
        if (wx < TINY_MARGIN || wx > WORLD_W - TINY_MARGIN ||
            wy < TINY_MARGIN || wy > WORLD_H - TINY_MARGIN) continue;

        // 既存建物（街区・首都）との重なりチェック
        let tooClose = false;
        for (const ob of occupied) {
          const minD = ob.r + tinyR + TINY_FROM_EXISTING_GAP;
          if (dist2(wx, wy, ob.x, ob.y) < minD * minD) { tooClose = true; break; }
        }
        if (tooClose) continue;

        // クラスタ内 tiny 棟同士の重なりチェック
        for (const hb of hamletBuildings) {
          if (dist2(wx, wy, hb.x, hb.y) < TINY_MIN_SPACING * TINY_MIN_SPACING) {
            tooClose = true; break;
          }
        }
        if (tooClose) continue;

        // 他クラスタ（result 全体）との重なりチェック
        for (const t of result) {
          if (dist2(wx, wy, t.wx, t.wy) < TINY_MIN_SPACING * TINY_MIN_SPACING) {
            tooClose = true; break;
          }
        }
        if (tooClose) continue;

        // 配置確定
        const hp    = randInt(BUILDING_SIZE_PARAMS.tiny.hpMin, BUILDING_SIZE_PARAMS.tiny.hpMax);
        const color = randChoice(bSmall.colors);
        const b     = makeBuilding(wx, wy, "tiny", color, bSmall, hp);
        // tiny 専用フラグ（ミニマップ・デバッグ等で識別）
        b._tinySettlement = true;
        // tiny の radius は BUILDING_SIZE_PARAMS.tiny.radiusBase で確定
        b.radius = tinyR;
        result.push(b);
        occupied.push({ x: wx, y: wy, r: tinyR });
        hamletBuildings.push({ x: wx, y: wy });
        placed = true;
      }
    }
  }

  return result;
}

/**
 * v0.11: 道沿いの集落を生成する。
 * 各街道エッジの途中（等分点＋横オフセット）に3〜6棟の民家群を置く。
 * 町・首都・川の上は避け、建物は道に面する向きで並べる。
 *
 * @param {Array} existingBuildings  既存の全建物（重なり回避用）
 * @param {Array} roadEdges          townRoadEdges（[{x,y},{x,y}] の配列）
 * @param {Object} boss              ボス建物
 * @param {Object} config            STAGE_CONFIGS[stageIndex]
 * @returns {Array} 配置された tiny 建物のリスト
 */
function generateRoadsideHamlets(existingBuildings, roadEdges, boss, config) {
  const result = [];
  const bSmall = config.buildings.small;
  const tinyR  = BUILDING_SIZE_PARAMS.tiny.radiusBase;
  const occupied = existingBuildings.map(b => ({ x: b.wx, y: b.wy, r: b.radius }));
  const bossClear2 = (WALL_OUTER_RING_RADIUS + 80) ** 2;

  for (const [a, b] of roadEdges) {
    const hamletCount = randInt(2, 4);
    for (let h = 0; h < hamletCount; h++) {
      const t   = (h + 1) / (hamletCount + 1) + randRange(-0.08, 0.08);
      const dx  = b.x - a.x, dy = b.y - a.y;
      const len = Math.sqrt(dx * dx + dy * dy) || 1;
      const side = Math.random() < 0.5 ? 1 : -1;
      const off  = side * (34 + randRange(0, 26));   // 道の脇（街道帯の外側すぐ）
      const cx = a.x + dx * t + (-dy / len) * off;
      const cy = a.y + dy * t + (dx / len) * off;

      if (cx < 60 || cx > WORLD_W - 60 || cy < 60 || cy > WORLD_H - 60) continue;
      if (dist2(cx, cy, boss.wx, boss.wy) < bossClear2) continue;

      // 川の上を避ける（中心線の頂点との距離で近似）
      let onRiver = false;
      for (const rp of riverPolyline) {
        if (dist2(cx, cy, rp.x, rp.y) < riverWidth * riverWidth) { onRiver = true; break; }
      }
      if (onRiver) continue;

      // 町の中・既存建物のそばはスキップ（道中の「ぽつんとした集落」感を守る）
      // v0.11: 大都市化で町が広がったため間隔を 90→60 に緩めて出現数を確保
      let nearExisting = false;
      for (const ob of occupied) {
        const minD = ob.r + 60;
        if (dist2(cx, cy, ob.x, ob.y) < minD * minD) { nearExisting = true; break; }
      }
      if (nearExisting) continue;

      // 3〜6棟の民家を道に沿って置く
      const count = randInt(3, 6);
      const faceAngle = Math.atan2(dy, dx) + Math.PI / 2;   // 道に面する向き
      for (let k = 0; k < count; k++) {
        const wx = cx + randRange(-36, 36);
        const wy = cy + randRange(-30, 30);
        let clash = false;
        for (const r of result) {
          if (dist2(wx, wy, r.wx, r.wy) < (tinyR * 2 + 6) ** 2) { clash = true; break; }
        }
        if (clash) continue;
        const hp  = randInt(BUILDING_SIZE_PARAMS.tiny.hpMin, BUILDING_SIZE_PARAMS.tiny.hpMax);
        const bld = makeBuilding(wx, wy, "tiny", randChoice(bSmall.colors), bSmall, hp);
        bld._tinySettlement = true;   // 足元の土広場・ミニマップ描画を tiny 集落と共通化
        bld.radius = tinyR;
        bld._faceAngle = faceAngle + randRange(-0.15, 0.15);
        result.push(bld);
        occupied.push({ x: wx, y: wy, r: tinyR });
      }
    }
  }
  return result;
}

/**
 * ボス集落を1体生成する。
 * 高HP・高火力・大半径で、小集落の育成なしでは倒せない圧力を作る。
 * isBoss=true を持つことでクリア条件・描画・ミニマップで特別扱いされる。
 */
function makeBossBuilding(wx, wy, stageIndex, bossTheme) {
  const hp = calcBossHp(stageIndex);
  // 攻撃タイマーはあえて0から始めて、ステージ開始直後から脅威感を出す
  return {
    wx,
    wy,
    size: "boss",
    color: bossTheme.color,
    shape: bossTheme.shape,        // "bossCircle" — 専用描画関数で処理
    radius: BOSS_RADIUS,
    maxHp: hp,
    hp,
    fallen: false,
    isEggBearer: false,            // ボスは卵を落とさない（強すぎる報酬になるため）
    isBoss: true,
    attackTimer: 0,
    attackRadius:       BOSS_ATTACK_RADIUS,
    projectileInterval: BOSS_FIRE_PARAMS.projectileInterval,
    projectileSpeed:    BOSS_FIRE_PARAMS.projectileSpeed,
    projectileDamage:   BOSS_FIRE_PARAMS.projectileDamage,
    projectileColor:    bossTheme.projectileColor,
    projectileCount:    BOSS_FIRE_PARAMS.projectileCount,
    projectileTracking: BOSS_FIRE_PARAMS.projectileTracking,
    projectileAoe:      0,
    reward:             { eggMin: 0, eggMax: 0 },
    _breathParticleTimer: 0,
    // ボス専用: グロー色（描画時に外輪のグロー効果に使う）
    _bossGlowColor: bossTheme.glowColor,
  };
}

function generateStageLayout(stageIndex) {
  const config = STAGE_CONFIGS[stageIndex];

  // --- (1) ボスを先に配置する ---
  // ボス＋要塞リングが確実にマップ内に収まる位置を確保してから、
  // 小集落クラスタをその周囲を避けて配置する（先取り方式）。
  const boss = placeBossBuilding(stageIndex, config);

  // --- (2) 小集落クラスタの中心をボス＋リング占有領域を避けて決める ---
  const townCenters = placeTownCenters(config.townCount, boss.wx, boss.wy);

  // v0.9.1: 街道網（町同士＋ボス首都を最小全域木で接続。描画は建物レイヤー再構築時）
  townRoadEdges = buildTownRoadNetwork(townCenters, boss);

  // v0.10: 川を1本引き、街道との交点に橋を架ける（背景の地理と攻略導線）
  riverPolyline    = generateRiver(stageIndex);
  bridgePlacements = computeBridges(townRoadEdges, riverPolyline);

  // v0.7: ボスに近い2〜3町を「要塞都市」に指定する（Shooterプレイテスト:
  // ボス周辺にもっと強い都市が欲しい・強さが見た目で分かること）。
  const fortifiedCount = stageIndex >= 2 ? 3 : 2;
  const fortifiedSet = new Set(
    townCenters
      .map((c, idx) => ({ idx, d2: dist2(c.x, c.y, boss.wx, boss.wy) }))
      .sort((a, b) => a.d2 - b.d2)
      .slice(0, fortifiedCount)
      .map(e => e.idx),
  );

  // v0.11: 都市の規模に変化をつける（大都市1・中都市1・残りは標準±ゆらぎ）。
  // 建物数は scale^2 で増やす＝「建物を壊す」メイン体験の総量を底上げする。
  const cityScaleByIdx = new Map();
  {
    const order = townCenters.map((_, i) => i);
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    cityScaleByIdx.set(order[0], 1.7);                       // 大都市（首府級）
    if (order.length > 1) cityScaleByIdx.set(order[1], 1.35); // 中核都市
  }

  const result = [];
  for (let t = 0; t < townCenters.length; t++) {
    const center = townCenters[t];
    const cityScale = cityScaleByIdx.get(t) ?? randRange(0.9, 1.1);
    const s2 = cityScale * cityScale;
    const townBuildings = generateTown(
      center.x, center.y,
      Math.round(config.smallPerTown  * BUILDING_DENSITY_MULT * s2),
      Math.round(config.mediumPerTown * BUILDING_DENSITY_MULT * s2),
      Math.max(1, Math.round(config.largePerTown * BUILDING_DENSITY_MULT * s2)),
      config,
      t,
    );
    if (fortifiedSet.has(t)) applyTownFortification(townBuildings);
    for (const b of townBuildings) result.push(b);
  }

  // --- (2b) 首都要塞リング（座標のみ先計算）して小集落建物との衝突除去に使う ---
  // placeCapitalDistrict は config が必要なため、ここで仮実行して座標を取得する。
  // 首都建物と重なるクラスタ建物は remove してから result に残す。
  const capitalBuildings = placeCapitalDistrict(boss, config);

  // 首都建物の占有エリアを「除去対象」として各小集落建物をフィルタリングする。
  // 重なり判定: 中心距離 < 首都建物 radius + 小集落建物 radius + 最小隙間 6px
  const CLUSTER_PURGE_GAP = 6;
  function collidesWithCapital(b) {
    for (const cap of capitalBuildings) {
      const d2 = dist2(b.wx, b.wy, cap.wx, cap.wy);
      const minD = cap.radius + b.radius + CLUSTER_PURGE_GAP;
      if (d2 < minD * minD) return true;
    }
    return false;
  }

  // _townMeta フラグを保持しながらフィルタ（先頭建物の meta を後続に移す必要はない）
  const purged = result.filter(b => !collidesWithCapital(b));
  // result を purged で置き換える（参照を変えず内容を更新）
  result.length = 0;
  for (const b of purged) result.push(b);

  // 卵持ちフラグをステージ全体に散らばらせて付与する（町ごとに均等割当）。
  assignEggBearers(result);

  // --- (3) ボスと首都建物を配列に追加 ---
  result.push(boss);
  for (const b of capitalBuildings) result.push(b);

  // --- (4) 変更4: tiny 集落をマップ全体に散布する ---
  // 首都・既存建物との重なりを避けて配置し、最後に result へ追加する。
  // assignEggBearers の後に追加するため、tiny はフォールバック（towns=0）で
  // 全体1町として扱われるが、ここでは全建物確定後に個別に卵持ち割当を補う。
  const tinyBuildings = generateTinySettlements(result, boss.wx, boss.wy, config);
  // tiny だけを対象に卵持ちを割当（eggBearerRatio に基づく）
  const tinyEggCount = Math.max(1, Math.round(tinyBuildings.length * eggBearerRatio()));
  const tinyIndices  = Array.from({ length: tinyBuildings.length }, (_, i) => i);
  for (let i = 0; i < tinyEggCount && i < tinyIndices.length; i++) {
    const j   = i + Math.floor(Math.random() * (tinyIndices.length - i));
    const tmp = tinyIndices[i]; tinyIndices[i] = tinyIndices[j]; tinyIndices[j] = tmp;
    tinyBuildings[tinyIndices[i]].isEggBearer = true;
  }
  for (const b of tinyBuildings) result.push(b);

  // --- (4b) v0.11: 道沿いの集落 — 街道のところどころに小さな民家群を置く。
  // 「道があるから人が住む」の地理感＋壊す対象の追加供給。卵割当は tiny と同率。
  const roadsideBuildings = generateRoadsideHamlets(result, townRoadEdges, boss, config);
  const rsEggCount  = Math.max(1, Math.round(roadsideBuildings.length * eggBearerRatio()));
  const rsIndices   = Array.from({ length: roadsideBuildings.length }, (_, i) => i);
  for (let i = 0; i < rsEggCount && i < rsIndices.length; i++) {
    const j   = i + Math.floor(Math.random() * (rsIndices.length - i));
    const tmp = rsIndices[i]; rsIndices[i] = rsIndices[j]; rsIndices[j] = tmp;
    roadsideBuildings[rsIndices[i]].isEggBearer = true;
  }
  for (const b of roadsideBuildings) result.push(b);

  // --- (5) v0.6-p3: 首都城壁リング（STAGE 2以降。ゲート数はステージで減る） ---
  const wallSegments = generateWallRing(boss, stageIndex);
  for (const w of wallSegments) result.push(w);

  // --- (6) v0.6-p3: 地形障害物（岩山・湖）を空白地帯へ散布 ---
  // settlements とは別系統（破壊不可）。モジュールスコープの terrainObstacles を更新する。
  terrainObstacles = generateTerrainObstacles(result, boss);

  // --- (7) v0.6-p4: 移動敵ユニット（文明別・ステージ数に応じた混成編成） ---
  movers = generateMovers(stageIndex, boss);
  shockwaveFxList.length = 0;
  resetRaiderState();   // v0.8: レイダー湧き状態もステージごとにリセット

  // --- (8) v0.6-p4: 後半ステージの難度底上げ（仕様 §4。プレイヤーの3択強化ぶんを相殺） ---
  // ボスは BOSS_HP_STAGE_MULT で既にスケールするため対象外。城壁もステージ別HP設定済みのため対象外。
  const boost = STAGE_DIFFICULTY_BOOST[stageIndex];
  if (boost) {
    for (const b of result) {
      if (b.isBoss || b._isWall) continue;
      b.maxHp = Math.round(b.maxHp * boost.hp);
      b.hp    = b.maxHp;
      b.projectileDamage *= boost.dmg;
    }
  }

  return result;
}

// v0.6-p4: ステージ別の難度底上げ係数（stageIndex 0始まり）
// v0.8: ステージ5〜8を追加（持ち越した強化を相殺しつつ右肩上がりの緊張を作る）
const STAGE_DIFFICULTY_BOOST = [
  null,
  null,
  { hp: 1.15, dmg: 1.10 },
  { hp: 1.30, dmg: 1.20 },
  { hp: 1.55, dmg: 1.30 },
  { hp: 1.80, dmg: 1.42 },
  { hp: 2.10, dmg: 1.55 },
  { hp: 2.50, dmg: 1.70 },
];

// -----------------------------------------------------------------
// v0.9.1: 街道網 — 町の中心とボス首都を最小全域木（Prim法）でつなぐ。
// 「街と街をつなぐ道」として建物レイヤーの最背面近くに描かれる。
// -----------------------------------------------------------------
let townRoadEdges = [];

function buildTownRoadNetwork(townCenters, boss) {
  const nodes = townCenters.map(c => ({ x: c.x, y: c.y }));
  nodes.push({ x: boss.wx, y: boss.wy });   // 首都へも街道が伸びる（攻略導線を兼ねる）
  const edges = [];
  if (nodes.length < 2) return edges;

  const inTree = new Set([0]);
  while (inTree.size < nodes.length) {
    let best = null;
    for (const i of inTree) {
      for (let j = 0; j < nodes.length; j++) {
        if (inTree.has(j)) continue;
        const d = dist2(nodes[i].x, nodes[i].y, nodes[j].x, nodes[j].y);
        if (!best || d < best.d) best = { i, j, d };
      }
    }
    edges.push([nodes[best.i], nodes[best.j]]);
    inTree.add(best.j);
  }
  return edges;
}

// -----------------------------------------------------------------
// v0.10: 川と橋 — 「川と街道が土地を形づくり、その結節点に街がある」の演出。
// 川は蛇行しながらマップを縦断する視覚要素（通行判定なし＝飛竜は川を越えて飛べる）。
// 橋は川と街道が交わる点に架け、地理の説得力と攻略導線の両方を担う。
// -----------------------------------------------------------------
let riverPolyline    = [];   // [{x,y}, ...] 川の中心線
let riverWidth       = 56;
let bridgePlacements = [];    // [{x, y, angle}] 街道×川の交点

// 川の中心線を生成する（縦断／横断を交互に、sin蛇行）。
function generateRiver(stageIndex) {
  const vertical = stageIndex % 2 === 0;   // 偶数ステージは縦断、奇数は横断
  const pts = [];
  const amp  = randRange(240, 420);
  const freq = randRange(1.4, 2.4);
  const phase = randRange(0, Math.PI * 2);
  const baseAlong = vertical
    ? randRange(WORLD_W * 0.32, WORLD_W * 0.68)
    : randRange(WORLD_H * 0.32, WORLD_H * 0.68);
  const STEPS = 24;
  for (let i = 0; i <= STEPS; i++) {
    const t = i / STEPS;                 // 0→1
    const along = t * Math.PI * freq + phase;
    const cross = baseAlong + Math.sin(along) * amp;
    if (vertical) pts.push({ x: cross, y: t * WORLD_H });
    else          pts.push({ x: t * WORLD_W, y: cross });
  }
  riverWidth = randRange(48, 70);
  return pts;
}

// 2線分の交点（なければ null）。
function segmentIntersection(p1, p2, p3, p4) {
  const d = (p2.x - p1.x) * (p4.y - p3.y) - (p2.y - p1.y) * (p4.x - p3.x);
  if (Math.abs(d) < 1e-9) return null;
  const t = ((p3.x - p1.x) * (p4.y - p3.y) - (p3.y - p1.y) * (p4.x - p3.x)) / d;
  const u = ((p3.x - p1.x) * (p2.y - p1.y) - (p3.y - p1.y) * (p2.x - p1.x)) / d;
  if (t < 0 || t > 1 || u < 0 || u > 1) return null;
  return { x: p1.x + t * (p2.x - p1.x), y: p1.y + t * (p2.y - p1.y) };
}

// 街道（直線近似）と川の交点に橋を架ける。
function computeBridges(roadEdges, river) {
  const bridges = [];
  for (const [a, b] of roadEdges) {
    for (let i = 0; i < river.length - 1; i++) {
      const hit = segmentIntersection(a, b, river[i], river[i + 1]);
      if (hit) {
        // 橋は街道の進行方向を向く
        const angle = Math.atan2(b.y - a.y, b.x - a.x);
        bridges.push({ x: hit.x, y: hit.y, angle });
        break;  // 1街道につき最初の交点のみ（多重橋を避ける）
      }
    }
  }
  return bridges;
}

// v0.7: 要塞都市の強化倍率（ボス近傍2〜3町に適用）
const FORTIFIED_HP_MULT       = 2.2;
const FORTIFIED_DMG_MULT      = 1.5;
const FORTIFIED_INTERVAL_MULT = 0.7;   // 発射間隔短縮（撃ってくる頻度が上がる）

/**
 * 町の全建物を要塞化する。HP・火力を引き上げ、_fortified フラグで
 * 描画側が「明らかに強そうな見た目」（黒鉄の輪郭＋深紅の軍旗）に切り替える。
 */
function applyTownFortification(townBuildings) {
  for (const b of townBuildings) {
    b._fortified = true;
    b.maxHp = Math.round(b.maxHp * FORTIFIED_HP_MULT);
    b.hp    = b.maxHp;
    b.projectileDamage  *= FORTIFIED_DMG_MULT;
    b.projectileInterval *= FORTIFIED_INTERVAL_MULT;
    if (b._townMeta) b._townMeta._fortified = true;  // 道路描画で城郭リムを引く
  }
}

/**
 * ボス集落を「ボス＋リング全体がマップ内に収まる」ワールド右寄り位置に配置する。
 * 小集落クラスタはこの後に生成されるため、ここでは既存建物チェックは不要。
 * マップ端からのマージンに CAPITAL_BOSS_MARGIN（リング外縁＋余白）を使う。
 */
function placeBossBuilding(stageIndex, config) {
  const bossTheme = config.boss;
  // ワールド右2/3エリアかつリング外縁がマップ外に出ない安全内側に配置する。
  // CAPITAL_BOSS_MARGIN = CAPITAL_RING_OUTER + CAPITAL_RADIUS_BASE + 80px のマージン。
  const minX = WORLD_W * 0.45;
  const maxX = WORLD_W - CAPITAL_BOSS_MARGIN;
  const minY = CAPITAL_BOSS_MARGIN;
  const maxY = WORLD_H - CAPITAL_BOSS_MARGIN;

  // 乱数で配置（マップが狭くて範囲が逆転しないようクランプ）
  const safeMaxX = Math.max(minX + 1, maxX);
  const safeMaxY = Math.max(minY + 1, maxY);
  const bossWx = minX + Math.random() * (safeMaxX - minX);
  const bossWy = minY + Math.random() * (safeMaxY - minY);

  return makeBossBuilding(bossWx, bossWy, stageIndex, bossTheme);
}

/**
 * ボス周囲に large サイズ帯の建物を環状（ドーナツ状）に配置して「首都要塞」を形成する。
 *
 * アルゴリズム:
 *   CAPITAL_RING_COUNT 本の候補角度をリング内に均等分割し、
 *   CAPITAL_RING_INNER〜CAPITAL_RING_OUTER のドーナツ領域に収めた座標を生成する。
 *   各候補は (1) ボス本体との最小間隔、(2) 先行配置済み首都建物との最小間隔を確認し、
 *   重なる場合は半径または角度を微調整して再試行する。
 *
 * @param {Object} boss  placeBossBuilding で生成したボスオブジェクト
 * @param {Object} config  STAGE_CONFIGS[stageIndex]
 * @returns {Array}  配置された首都建物のリスト
 */
function placeCapitalDistrict(boss, config) {
  const result = [];
  const bossX = boss.wx;
  const bossY = boss.wy;

  // ボス中心から最低限離れなければならない距離（ボス半径 + 首都建物半径 + 最小隙間）
  const minBossDist = BOSS_RADIUS + CAPITAL_RADIUS_BASE + 10;
  const minBossDist2 = minBossDist * minBossDist;

  // 首都建物同士の最小距離（重なり防止）
  const minCapDist2 = CAPITAL_MIN_SPACING * CAPITAL_MIN_SPACING;

  // 角度スロットを CAPITAL_RING_COUNT 等分割
  const angleStep = (Math.PI * 2) / CAPITAL_RING_COUNT;

  for (let k = 0; k < CAPITAL_RING_COUNT; k++) {
    // 各スロットで最大4回試行：境界チェックや重なりで失敗した場合に半径・角度を微変化させて再挑戦
    const MAX_ATTEMPTS = 4;
    let placed = false;

    for (let attempt = 0; attempt < MAX_ATTEMPTS && !placed; attempt++) {
      // 角度に±15%のランダムオフセット（有機的な配置感）
      const baseAngle = k * angleStep + (Math.random() * angleStep * 0.30 - angleStep * 0.15);

      // 半径: ドーナツ内縁〜外縁のランダム位置（attempt が増えるほど内縁寄りを試して境界を回避）
      const radiusRand = Math.max(0, Math.random() - attempt * 0.15);
      const radius = CAPITAL_RING_INNER + radiusRand * (CAPITAL_RING_OUTER - CAPITAL_RING_INNER);

      const wx = bossX + Math.cos(baseAngle) * radius;
      const wy = bossY + Math.sin(baseAngle) * radius;

      // ワールド境界チェック（建物半径分の余白を確保）
      const pad = CAPITAL_RADIUS_BASE + 10;
      if (wx < pad || wx > WORLD_W - pad || wy < pad || wy > WORLD_H - pad) continue;

      // ボス本体との最小間隔チェック
      if (dist2(wx, wy, bossX, bossY) < minBossDist2) continue;

      // 先行配置済み首都建物との重なりチェック
      let tooClose = false;
      for (const cap of result) {
        if (dist2(wx, wy, cap.wx, cap.wy) < minCapDist2) {
          tooClose = true;
          break;
        }
      }
      if (tooClose) continue;

      result.push(makeCapitalBuilding(wx, wy, config));
      placed = true;
    }
    // MAX_ATTEMPTS 試行後も配置できなかった場合はそのスロットをスキップ
    // （ボスが端に追い込まれた場合の安全網）
  }

  // 変更1: 城下の雑魚建物（small）を CAPITAL_SMALL_INNER〜SMALL_OUTER の環状帯に充填する。
  // ポアソンディスク風: 候補をランダムに生成し、既配置建物との最小間隔で除去する。
  // ボスとの間隔も確保。卵持ち割当の対象に含める（_townMeta は持たないが
  // assignEggBearers のフォールバックで全体1町として処理される）。
  const smallPad = CAPITAL_SMALL_RADIUS + 10;
  const smallMinD2 = CAPITAL_SMALL_MIN_SPACING * CAPITAL_SMALL_MIN_SPACING;
  // ボス本体との最小距離（ボス半径 + small 半径 + 余白）
  const bossSmallDist2 = (BOSS_RADIUS + CAPITAL_SMALL_RADIUS + 14) * (BOSS_RADIUS + CAPITAL_SMALL_RADIUS + 14);
  // 配置された全建物（ring + small）を重なりチェックに使うためまとめて参照する
  // result にはリング建物が入っているので、small 同士 + ring との距離も見る
  const MAX_ATTEMPTS_SMALL = 6;

  for (let k = 0; k < CAPITAL_SMALL_COUNT; k++) {
    let placed = false;
    for (let attempt = 0; attempt < MAX_ATTEMPTS_SMALL && !placed; attempt++) {
      const angle = Math.random() * Math.PI * 2;
      // 内縁〜外縁のランダム半径（均等分布にするため√変換を使う）
      const rMin = CAPITAL_SMALL_INNER, rMax = CAPITAL_SMALL_OUTER;
      const rnd  = Math.sqrt(Math.random());  // 外側に密度が偏らないよう補正
      const r    = rMin + rnd * (rMax - rMin);

      const wx = bossX + Math.cos(angle) * r;
      const wy = bossY + Math.sin(angle) * r;

      // ワールド境界チェック
      if (wx < smallPad || wx > WORLD_W - smallPad || wy < smallPad || wy > WORLD_H - smallPad) continue;

      // ボス本体との距離チェック
      if (dist2(wx, wy, bossX, bossY) < bossSmallDist2) continue;

      // 既配置建物（ring large + 先行small）との重なりチェック
      let tooClose = false;
      for (const cap of result) {
        // ring の large と small では最小間隔を変える
        const gap = (cap.size === "small")
          ? CAPITAL_SMALL_MIN_SPACING
          : CAPITAL_SMALL_RADIUS + CAPITAL_RADIUS_BASE + 14;
        if (dist2(wx, wy, cap.wx, cap.wy) < gap * gap) { tooClose = true; break; }
      }
      if (tooClose) continue;

      result.push(makeCapitalSmallBuilding(wx, wy, config));
      placed = true;
    }
  }

  return result;
}

/**
 * 首都要塞建物を生成する。
 * 通常 large 帯のパラメータを使い、HP のみ CAPITAL_HP_MULT 倍で「首都＝強い」感を出す。
 * isBoss は false のまま——ボスではなく「ボスを守る要塞の一部」として機能する。
 *
 * @param {number} wx  ワールドX座標
 * @param {number} wy  ワールドY座標
 * @param {Object} config  STAGE_CONFIGS[stageIndex]
 * @returns {Object}  建物オブジェクト
 */
function makeCapitalBuilding(wx, wy, config) {
  const bLarge = config.buildings.large;
  const baseHp = randInt(BUILDING_SIZE_PARAMS.large.hpMin, BUILDING_SIZE_PARAMS.large.hpMax);
  const hp     = Math.round(baseHp * CAPITAL_HP_MULT);
  // 首都建物の色は large カラーから選ぶ（ステージテーマに合わせる）
  const color  = randChoice(bLarge.colors);

  const building = makeBuilding(wx, wy, "large", color, bLarge, hp);
  // 首都建物は要塞都市の一部であることを示すフラグ
  // （_townMeta は持たない → assignEggBearers のフォールバックで全体1町として卵割当対象に含まれる）
  building._isCapital = true;
  return building;
}

/**
 * 城下の雑魚建物（small サイズ）を生成する。
 * 通常 small 帯と同じパラメータを使う（弱い・すぐ壊れる城下住民）。
 * 卵持ち割当の対象になることでボス前で群れが育つ良い流れを作る。
 *
 * @param {number} wx  ワールドX座標
 * @param {number} wy  ワールドY座標
 * @param {Object} config  STAGE_CONFIGS[stageIndex]
 * @returns {Object}  建物オブジェクト
 */
function makeCapitalSmallBuilding(wx, wy, config) {
  const bSmall = config.buildings.small;
  const hp     = randInt(BUILDING_SIZE_PARAMS.small.hpMin, BUILDING_SIZE_PARAMS.small.hpMax);
  // 城下の small は small カラーから選ぶ（ステージテーマに合わせる）
  const color  = randChoice(bSmall.colors);
  const building = makeBuilding(wx, wy, "small", color, bSmall, hp);
  // 城下建物フラグ（通常クラスタとの区別用。卵割当・カリング対象には通常通り含まれる）
  building._isCapitalSmall = true;
  return building;
}

// =================================================================
// v0.6-p3: 首都城壁（ドラゴン侵入不可・破壊可能）＋地形障害物（破壊不可）
// 仕様: docs/gdd/dragon-tide-v0.6-spec.md §8
// =================================================================

// 城壁リング半径（城下充填の外縁360pxの外側）
const WALL_RING_RADIUS   = 420;
// セグメント間隔（弧長px）。半径420の円周≈2639px ÷ 48px ≈ 55セグメント
const WALL_SEG_SPACING   = 48;
// セグメントの当たり半径（隣とほぼ接し、隙間から竜が抜けない値）
const WALL_SEG_RADIUS    = 26;
// ゲート（開口部）の幅（弧長px）。群れが余裕を持って通れる幅
const WALL_GATE_WIDTH    = 150;
// ステージ別城壁設定（stageIndex 0始まり）: STAGE1は城壁なし、進むほどゲートが減る（§8.2）
// v0.8: ステージ5〜8を追加。後半は二重リング＋高HPが標準になる
const WALL_STAGE_CONFIG = [
  null,
  { gates: 3, hp: 40, doubleRing: false },
  { gates: 2, hp: 46, doubleRing: false },
  { gates: 1, hp: 52, doubleRing: true },
  { gates: 2, hp: 64, doubleRing: true },
  { gates: 2, hp: 72, doubleRing: true },
  { gates: 1, hp: 84, doubleRing: true },
  { gates: 1, hp: 96, doubleRing: true },
];
// 二重リング（STAGE 4）の外側リング半径
const WALL_OUTER_RING_RADIUS = 484;

/**
 * 城壁セグメントを1つ生成する。settlements パイプライン（描画・ダメージ・
 * 空間ハッシュ・XP）に乗せるため建物オブジェクトとして作る。
 * _isWall=true: Boids押し出し対象・卵/攻撃なし・XP12（xpValueOf参照）。
 */
function makeWallSegment(wx, wy, hp, tangentAngle) {
  return {
    wx,
    wy,
    size: "wall",
    color: "#6a7078",
    shape: "wallSegment",
    radius: WALL_SEG_RADIUS,
    maxHp: hp,
    hp,
    fallen: false,
    isEggBearer: false,
    isBoss: false,
    _isWall: true,
    _wallAngle: tangentAngle,   // 描画時にリング接線方向へ回転させる
    // 城壁は攻撃しない（attackRadius=0 で射程判定に一切かからない）
    attackTimer: Infinity,
    attackRadius: 0,
    projectileInterval: Infinity,
    projectileSpeed: 0,
    projectileDamage: 0,
    projectileColor: "#fff",
    projectileCount: 0,
    projectileTracking: false,
    projectileAoe: 0,
    reward: { eggMin: 0, eggMax: 0 },
    _breathParticleTimer: 0,
  };
}

/**
 * ボスを中心とした城壁リングを生成する（STAGE 2以降）。
 * ゲート角をランダム基準で等間隔に取り、その弧幅内のセグメントを抜いて開口部にする。
 * STAGE 4 は外側にもう1周（二重リング。ゲート角は共有＝一直線に突破口が並ぶ）。
 */
function generateWallRing(boss, stageIndex) {
  const config = WALL_STAGE_CONFIG[stageIndex];
  if (!config) return [];

  const result = [];
  const gateBaseAngle = Math.random() * Math.PI * 2;
  const gateAngles = [];
  for (let g = 0; g < config.gates; g++) {
    gateAngles.push(gateBaseAngle + (g * Math.PI * 2) / config.gates);
  }

  const rings = config.doubleRing
    ? [WALL_RING_RADIUS, WALL_OUTER_RING_RADIUS]
    : [WALL_RING_RADIUS];

  for (const ringRadius of rings) {
    const segCount      = Math.floor((Math.PI * 2 * ringRadius) / WALL_SEG_SPACING);
    const angleStep     = (Math.PI * 2) / segCount;
    const gateHalfAngle = (WALL_GATE_WIDTH * 0.5) / ringRadius;

    for (let k = 0; k < segCount; k++) {
      const angle = k * angleStep;

      // ゲート開口部チェック（角度差を -π〜π に正規化して比較）
      let inGate = false;
      for (const gate of gateAngles) {
        let diff = angle - gate;
        while (diff >  Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        if (Math.abs(diff) < gateHalfAngle) { inGate = true; break; }
      }
      if (inGate) continue;

      const wx = boss.wx + Math.cos(angle) * ringRadius;
      const wy = boss.wy + Math.sin(angle) * ringRadius;
      // マップ外にはみ出るセグメントはスキップ（ボスは端から十分内側だが安全網）
      if (wx < 20 || wx > WORLD_W - 20 || wy < 20 || wy > WORLD_H - 20) continue;

      result.push(makeWallSegment(wx, wy, config.hp, angle + Math.PI / 2));
    }
  }
  return result;
}

const MOVER_DEFS = {

  ironclad: {

  balloon: {

  raider: {

// ステージ別の出現構成。後半ほど種類と数が増える（Shooterプレイテスト「後半にバリエーション」）
// v0.8: ステージ5〜8を追加（既存5種の混成密度を上げ、HP/XPはステージ係数でスケール）
const MOVER_SPAWNS_BY_STAGE = [
  [["mammoth", 1]],
  [["colossus", 2]],
  [["knights", 2], ["colossus", 1]],
  [["ironclad", 2], ["knights", 2], ["balloon", 2]],
  [["ironclad", 2], ["balloon", 2], ["knights", 1]],
  [["colossus", 3], ["balloon", 2], ["ironclad", 1]],
  [["ironclad", 3], ["knights", 3], ["balloon", 2]],
  [["ironclad", 3], ["colossus", 2], ["knights", 2], ["balloon", 3]],
];

// v0.8: 移動敵のステージスケーリング。HPは硬く、XPは美味しくなる
function moverStageHpMult(stageIndex) { return 1 + 0.30 * stageIndex; }
function moverStageXpMult(stageIndex) { return 1 + 0.25 * stageIndex; }

// 全移動敵共通の追跡反応距離（この距離内の群れへ進撃する）
const MOVER_PURSUIT_RANGE = 650;
// 移動敵の攻撃が作動する索敵距離（誰もいない空へ撃たない）
const MOVER_ENGAGE_RANGE = 450;
// マンモス踏鳴らしの押し飛ばし距離（px）
const SHOCKWAVE_PUSH_DIST = 26;

let movers = [];

// 踏鳴らし衝撃波の表示FX（小プール）
const shockwaveFxList = [];
const SHOCKWAVE_FX_DURATION = 0.5;

/** ステージの移動敵を生成する。waypoint はボス要塞圏・スタート地点を避けて取る。 */
function generateMovers(stageIndex, boss) {
  const spawns = MOVER_SPAWNS_BY_STAGE[stageIndex];
  const result = [];

  const bossClear2 = (WALL_OUTER_RING_RADIUS + 150) ** 2;
  function randPoint() {
    for (let attempt = 0; attempt < 20; attempt++) {
      const x = 300 + Math.random() * (WORLD_W - 600);
      const y = 250 + Math.random() * (WORLD_H - 500);
      if (dist2(x, y, boss.wx, boss.wy) < bossClear2) continue;
      if (dist2(x, y, 250, WORLD_H * 0.5) < 500 * 500) continue;
      return { x, y };
    }
    return { x: WORLD_W * 0.5, y: WORLD_H * 0.5 };
  }

  for (const [defKey, count] of spawns) {
    const def = MOVER_DEFS[defKey];
    for (let k = 0; k < count; k++) {
      const mover = makeMover(def, randPoint);
      // v0.8: ステージが進むほど硬く・XPは美味しく
      mover.maxHp   = Math.round(def.hp * moverStageHpMult(stageIndex));
      mover.hp      = mover.maxHp;
      mover.xpValue = Math.round(def.xp * moverStageXpMult(stageIndex));
      result.push(mover);
    }
  }
  return result;
}

/** 移動敵1体を生成する（経路生成込み）。 */
function makeMover(def, randPoint) {
  {
    const waypoints = [];
    if (def.moveType === "loop") {
      // 外周航路: マップ縁に沿った6点の周回路
      const marginX = 400, marginY = 320;
      waypoints.push(
        { x: marginX, y: marginY },
        { x: WORLD_W * 0.5, y: marginY * 0.8 },
        { x: WORLD_W - marginX, y: marginY },
        { x: WORLD_W - marginX, y: WORLD_H - marginY },
        { x: WORLD_W * 0.5, y: WORLD_H - marginY * 0.8 },
        { x: marginX, y: WORLD_H - marginY },
      );
    } else if (def.moveType === "patrol") {
      for (let p = 0; p < 4; p++) waypoints.push(randPoint());
    } else {
      // pingpong: 2点間往復（600〜1200px 離す）
      const a = randPoint();
      let b = randPoint();
      for (let attempt = 0; attempt < 10; attempt++) {
        const d2ab = dist2(a.x, a.y, b.x, b.y);
        if (d2ab > 600 * 600 && d2ab < 1200 * 1200) break;
        b = randPoint();
      }
      waypoints.push(a, b);
    }

    const start = waypoints[Math.floor(Math.random() * waypoints.length)];
    return {
      def,
      hp: def.hp,
      maxHp: def.hp,
      wx: start.x + randRange(-40, 40),
      wy: start.y + randRange(-40, 40),
      headingX: 1,
      headingY: 0,
      waypoints,
      wpIdx: Math.floor(Math.random() * waypoints.length),
      wpDir: 1,                 // pingpong 用の進行方向（1/-1）
      attackTimer: Math.random() * 2.0,
      beamTargetIdx: -1,        // colossus の照射対象（描画用）
      swayPhase: Math.random() * Math.PI * 2,  // v0.9: 生気づけアニメの個体位相
      alive: true,
    };
  }
}

function updateMovers(dt) {
  // 衝撃波FXの寿命更新
  for (let i = shockwaveFxList.length - 1; i >= 0; i--) {
    shockwaveFxList[i].life -= dt;
    if (shockwaveFxList[i].life <= 0) shockwaveFxList.splice(i, 1);
  }

  for (const m of movers) {
    if (!m.alive) continue;
    const def = m.def;

    // ---- 移動 ----
    // v0.7: 全移動敵が追跡型に。反応距離内に群れがいれば重心へ進撃、
    // いなければ各自の経路（往復/巡回/外周）を回る。
    let targetX, targetY;
    let pursuing = false;
    const centroid = calcFriendlyCentroid();
    if (dist2(m.wx, m.wy, centroid.x, centroid.y) < MOVER_PURSUIT_RANGE * MOVER_PURSUIT_RANGE) {
      targetX = centroid.x;
      targetY = centroid.y;
      pursuing = true;
    }
    if (!pursuing) {
      const wp = m.waypoints[m.wpIdx];
      targetX = wp.x;
      targetY = wp.y;
      if (dist2(m.wx, m.wy, wp.x, wp.y) < 40 * 40) {
        // 到着 → 次のwaypointへ（pingpongは端で折り返し、他は周回）
        if (def.moveType === "pingpong") {
          if (m.wpIdx + m.wpDir < 0 || m.wpIdx + m.wpDir >= m.waypoints.length) m.wpDir *= -1;
          m.wpIdx += m.wpDir;
        } else {
          m.wpIdx = (m.wpIdx + 1) % m.waypoints.length;
        }
      }
    }

    const dx = targetX - m.wx;
    const dy = targetY - m.wy;
    const d  = Math.sqrt(dx * dx + dy * dy) || 1;
    m.headingX = dx / d;
    m.headingY = dy / d;
    m.wx += m.headingX * def.speed * dt;
    m.wy += m.headingY * def.speed * dt;

    // 地形（岩山・湖）は移動敵も回り込む（押し出しスライド）。飛行ユニットは無視
    if (def.flying) { /* 気球は地形を飛び越える */ } else
    for (const ob of terrainObstacles) {
      const odx = m.wx - ob.wx;
      const ody = m.wy - ob.wy;
      const minD = ob.radius + def.radius;
      const od2  = odx * odx + ody * ody;
      if (od2 < minD * minD && od2 > 0) {
        const od = Math.sqrt(od2);
        m.wx = ob.wx + (odx / od) * minD;
        m.wy = ob.wy + (ody / od) * minD;
      }
    }

    // ---- 攻撃 ----
    const nearestIdx = findNearestAliveBoid(m.wx, m.wy);
    if (nearestIdx < 0) { m.beamTargetIdx = -1; continue; }
    const ndx = px[nearestIdx] - m.wx;
    const ndy = py[nearestIdx] - m.wy;
    const nearestD2 = ndx * ndx + ndy * ndy;

    const atk = def.attack;
    if (atk.type === "beam") {
      // コロッサス: 眼光ビーム（持続照射）
      if (nearestD2 < atk.range * atk.range) {
        m.beamTargetIdx = nearestIdx;
        applyDamageToBoid(nearestIdx, atk.dps * dt);
      } else {
        m.beamTargetIdx = -1;
      }
      continue;
    }

    if (nearestD2 > MOVER_ENGAGE_RANGE * MOVER_ENGAGE_RANGE) continue;
    m.attackTimer -= dt;
    if (m.attackTimer > 0) continue;
    m.attackTimer = atk.interval;

    if (atk.type === "shockwave") {
      // マンモス隊: 踏鳴らし（半径内の全個体にダメージ＋押し飛ばし＋リングFX）
      if (nearestD2 < (atk.radius + 60) * (atk.radius + 60)) {
        shockwaveFxList.push({ x: m.wx, y: m.wy, maxR: atk.radius, life: SHOCKWAVE_FX_DURATION });
        for (let i = 0; i < N; i++) {
          if (boidDead[i] || boidDowned[i]) continue;
          const sdx = px[i] - m.wx;
          const sdy = py[i] - m.wy;
          const sd2 = sdx * sdx + sdy * sdy;
          if (sd2 < atk.radius * atk.radius) {
            applyDamageToBoid(i, atk.damage);
            // v0.7: 外向きに押し飛ばす（MELEEのノックバック無効は体当たり被弾用なので適用しない）
            const sd = Math.sqrt(sd2) || 1;
            px[i] += (sdx / sd) * SHOCKWAVE_PUSH_DIST;
            py[i] += (sdy / sd) * SHOCKWAVE_PUSH_DIST;
          }
        }
        hapticPulse(25);
      } else {
        m.attackTimer = 0.4; // 射程外: 短い再チェック間隔で待機
      }
    } else if (atk.type === "fan") {
      // 騎士方陣: 扇状の矢斉射
      if (nearestD2 < atk.range * atk.range) {
        const baseAngle = Math.atan2(ndy, ndx);
        for (let k = -(atk.count >> 1); k <= (atk.count >> 1); k++) {
          spawnFanProjectileRaw(m.wx, m.wy, baseAngle + k * 0.22, atk.speed, atk.damage, "#e8eef8", 0);
        }
      } else {
        m.attackTimer = 0.4;
      }
    } else if (atk.type === "broadside") {
      // 陸上甲鉄艦: 進行方向と直交する2方向に3連砲
      const heading = Math.atan2(m.headingY, m.headingX);
      for (const side of [Math.PI / 2, -Math.PI / 2]) {
        for (let k = -1; k <= 1; k++) {
          spawnFanProjectileRaw(m.wx, m.wy, heading + side + k * 0.15, atk.speed, atk.damage, "#90b0d0", 1);
        }
      }
    } else if (atk.type === "bomb") {
      // v0.7 爆撃気球: 最寄りの竜めがけてAoE爆弾を投下（projectileAoe で着弾時に範囲被害）
      if (nearestD2 < atk.range * atk.range) {
        spawnProjectile(m.wx, m.wy, nearestIdx, atk.speed, atk.damage, "#e0b070", atk.aoe, false, 1);
      } else {
        m.attackTimer = 0.4;
      }
    }
  }
}

// -----------------------------------------------------------------
// v0.7: ボスノヴァ — ボスが周期的に放つ反発衝撃波。
// 「序盤は跳ね返される」の本体: 育っていない群れはボスに張り付けない。
// -----------------------------------------------------------------
let bossSettlementIdx = -1;   // 現ステージのボス index（generateStageLayout 後に検索）
let bossNovaTimer = BOSS_NOVA_INTERVAL;

function cacheBossIndex() {
  bossSettlementIdx = settlements.findIndex(s => s.isBoss);
  bossNovaTimer = BOSS_NOVA_INTERVAL;
}

function updateBossNova(dt) {
  if (bossSettlementIdx < 0) return;
  const boss = settlements[bossSettlementIdx];
  if (!boss || boss.fallen) return;

  bossNovaTimer -= dt;
  if (bossNovaTimer > 0) return;

  // 半径内に有効個体がいるときだけ発動（無人の空に撃たない）
  const r2 = BOSS_NOVA_RADIUS * BOSS_NOVA_RADIUS;
  let anyInRange = false;
  for (let i = 0; i < N; i++) {
    if (boidDead[i] || boidDowned[i]) continue;
    const dx = px[i] - boss.wx;
    const dy = py[i] - boss.wy;
    if (dx * dx + dy * dy < r2) { anyInRange = true; break; }
  }
  if (!anyInRange) { bossNovaTimer = 0.5; return; }  // 短い間隔で再チェック

  bossNovaTimer = BOSS_NOVA_INTERVAL;
  shockwaveFxList.push({
    x: boss.wx, y: boss.wy, maxR: BOSS_NOVA_RADIUS,
    life: SHOCKWAVE_FX_DURATION, color: boss._bossGlowColor ?? "#ff8800",
  });

  for (let i = 0; i < N; i++) {
    if (boidDead[i] || boidDowned[i]) continue;
    const dx = px[i] - boss.wx;
    const dy = py[i] - boss.wy;
    const d2 = dx * dx + dy * dy;
    if (d2 >= r2) continue;
    const d  = Math.sqrt(d2) || 1;
    const nx = dx / d;
    const ny = dy / d;
    applyDamageToBoid(i, BOSS_NOVA_DAMAGE);
    // 中心に近いほど強く弾き飛ばす（位置変位＋外向き速度）
    const pushDist = BOSS_NOVA_PUSH_MIN + (1 - d / BOSS_NOVA_RADIUS) * 90;
    px[i] += nx * pushDist;
    py[i] += ny * pushDist;
    vx[i] = nx * BASE_CFG.maxSpeed;
    vy[i] = ny * BASE_CFG.maxSpeed;
  }
  triggerFlash("rgba(255,140,40,0.18)", 0.15);
  triggerShake(5, 0.3);   // v0.8: ノヴァの衝撃を画面でも伝える
  hapticPulse(60);
}

// -----------------------------------------------------------------
// v0.8: レイダー湧き — 通常建物が枯れてもXP/卵が尽きないための詰み防止。
// 残存建物が閾値を切ると、ボス城塞から小型レイダーが定期的に湧き続ける。
// -----------------------------------------------------------------
const RAIDER_TRIGGER_RATIO  = 0.10;  // 通常建物の残存率がこれ未満で湧き始める
const RAIDER_SPAWN_INTERVAL = 3.5;   // 湧き間隔（秒）
const RAIDER_MAX_ALIVE      = 10;    // 同時生存上限
const RAIDER_CHECK_INTERVAL = 1.0;   // 残存数の集計間隔（毎フレームの全建物走査を避ける）

let raiderSpawnTimer = 0;
let raiderCheckTimer = 0;
let raiderModeActive = false;

function resetRaiderState() {
  raiderSpawnTimer = 0;
  raiderCheckTimer = 0;
  raiderModeActive = false;
}

function updateRaiderSpawns(dt) {
  if (bossSettlementIdx < 0) return;
  const boss = settlements[bossSettlementIdx];
  if (!boss || boss.fallen) return;

  // 残存建物率のチェック（1秒間隔）
  raiderCheckTimer -= dt;
  if (raiderCheckTimer <= 0) {
    raiderCheckTimer = RAIDER_CHECK_INTERVAL;
    let remaining = 0;
    let total = 0;
    for (const s of settlements) {
      if (s.isBoss || s._isWall) continue;
      total++;
      if (!s.fallen) remaining++;
    }
    raiderModeActive = total > 0 && (remaining / total) < RAIDER_TRIGGER_RATIO;
  }
  if (!raiderModeActive) return;

  raiderSpawnTimer -= dt;
  if (raiderSpawnTimer > 0) return;
  raiderSpawnTimer = RAIDER_SPAWN_INTERVAL;

  // 生存レイダー数の確認＋死骸の間引き（配列の無限成長防止）
  let aliveRaiders = 0;
  for (const m of movers) {
    if (m.def.name === "raider" && m.alive) aliveRaiders++;
  }
  movers = movers.filter(m => m.alive || m.def.name !== "raider");
  if (aliveRaiders >= RAIDER_MAX_ALIVE) return;

  // ボス城塞の縁から1〜2体湧く（経路はボス周辺の徘徊。追跡は共通ロジックが担う）
  const spawnCount = Math.min(1 + (Math.random() < 0.5 ? 1 : 0), RAIDER_MAX_ALIVE - aliveRaiders);
  for (let k = 0; k < spawnCount; k++) {
    const angle = Math.random() * Math.PI * 2;
    const raider = makeMover(MOVER_DEFS.raider, () => ({
      x: Math.max(100, Math.min(WORLD_W - 100, boss.wx + randRange(-800, 800))),
      y: Math.max(100, Math.min(WORLD_H - 100, boss.wy + randRange(-800, 800))),
    }));
    raider.wx = boss.wx + Math.cos(angle) * (boss.radius + 34);
    raider.wy = boss.wy + Math.sin(angle) * (boss.radius + 34);
    raider.xpValue = Math.round(MOVER_DEFS.raider.xp * moverStageXpMult(currentStage));
    movers.push(raider);
    spawnCollisionParticles(raider.wx, raider.wy);
  }
  hapticPulse(15);
}

/** 移動敵へのダメージ適用。倒したらXPジェム＋卵＋演出。 */
function damageMover(m, damage) {
  if (!m.alive) return;
  m.hp -= damage;
  if (m.hp <= 0) {
    m.alive = false;
    m.hp = 0;
    runKills++;
    // v0.8: ステージスケール済みXP（xpValue）。未設定の個体は基礎値
    spawnXpGems(m.wx, m.wy, m.xpValue ?? m.def.xp);
    let eggs = m.def.eggDrop;
    // v0.8: 確率卵（レイダー用。群れの供給源が完全に絶えないように）
    if (m.def.eggChance && Math.random() < m.def.eggChance) eggs += 1;
    for (let k = 0; k < eggs; k++) {
      const angle = Math.random() * Math.PI * 2;
      const r = m.def.radius + 12 + Math.random() * 30;
      spawnEgg(m.wx + Math.cos(angle) * r, m.wy + Math.sin(angle) * r);
    }
    spawnCollisionParticles(m.wx, m.wy);
    spawnCollisionParticles(m.wx + 8, m.wy - 8);
    triggerFlash("rgba(255,255,255,0.18)", 0.12);
    hapticPulse(90);
  }
}

/** 群れの体当たり判定（移動敵版）。建物用クールダウンを共用して連打を防ぐ。 */
function updateMoverRams() {
  if (movers.length === 0) return;
  const isMelee = flockWeapon === "melee";
  const ramDamage = isMelee ? MELEE_COLLISION_DAMAGE * effWeaponDmgMult("melee") : COLLISION_DAMAGE;

  for (const m of movers) {
    if (!m.alive) continue;
    const hitR = m.def.radius + 6;
    const hitR2 = hitR * hitR;
    for (let i = 0; i < N; i++) {
      if (boidDead[i] || boidDowned[i]) continue;
      if (boidCollisionCooldown[i] > 0) continue;
      const dx = m.wx - px[i];
      const dy = m.wy - py[i];
      if (dx * dx + dy * dy > hitR2) continue;
      damageMover(m, ramDamage);
      boidHitStopTimer[i]      = HITSTOP_DURATION;
      boidCollisionCooldown[i] = isMelee ? MELEE_COLLISION_COOLDOWN : COLLISION_COOLDOWN;
      spawnCollisionParticles(m.wx, m.wy);
      // v0.8: 緋竜の斬閃演出（移動敵への体当たりも派手に）
      if (isMelee) {
        spawnMeleeImpactFx(m.wx, m.wy, Math.atan2(vy[i], vx[i]));
        triggerShake(2.2, 0.09);
      }
      hapticPulse(15);
      if (!m.alive) break;
    }
  }
}

/** 移動敵の描画（本体＋HPバー＋コロッサスの眼光ビーム＋衝撃波リング）。ワールド座標系で呼ぶ。 */
function drawMovers() {
  for (const m of movers) {
    if (!m.alive) continue;
    const def = m.def;
    const angle = Math.atan2(m.headingY, m.headingX);

    ctx.save();
    ctx.translate(m.wx, m.wy);

    // 外周グロー（存在感）
    ctx.globalAlpha = 0.20;
    ctx.fillStyle = def.glowColor;
    ctx.beginPath();
    ctx.arc(0, 0, def.radius * 1.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;

    // v0.7: Gemini生成スプライトがあれば画像描画（実測ピボット・前方方向補正つき）。
    // 読めなかった敵だけ従来のベクター描画にフォールバックする。
    const enemyImg = enemyImages[def.name];
    if (enemyImg) {
      const meta  = ENEMY_SPRITE_META[def.name];
      const drawW = def.radius * meta.drawScale;
      const s     = drawW / enemyImg.naturalWidth;
      const drawH = enemyImg.naturalHeight * s;
      const phase = m.swayPhase ?? 0;

      // v0.9: 浮遊ユニット（守護像・気球）は地面に落ち影を描いて高度感を出す
      if (meta.hover || def.flying) {
        ctx.globalAlpha = 0.22;
        ctx.fillStyle = "#000000";
        ctx.beginPath();
        ctx.ellipse(5, 8, def.radius * 0.85, def.radius * 0.55, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
      }

      if (meta.forward === "up")        ctx.rotate(angle + Math.PI / 2);
      else if (meta.forward === "down") ctx.rotate(angle - Math.PI / 2);

      // v0.9: 生気づけアニメーション。静止画のまま滑るのを防ぐ
      if (meta.hover) {
        // 浮遊: 呼吸のような脈動＋ゆっくり漂う傾き（守護像＝歩行アニメ不要のデザイン）
        const bob = Math.sin(breathTime * 2.2 + phase);
        ctx.rotate(bob * 0.06);
        const sc = 1 + bob * 0.045;
        ctx.scale(sc, sc);
      } else if (def.name === "balloon") {
        ctx.rotate(Math.sin(breathTime * 0.9 + phase) * 0.07);
      } else {
        // 地上ユニット: 歩行スイング（車両の甲鉄艦はごく控えめに）
        const swayAmp = def.name === "ironclad" ? 0.02 : 0.05;
        ctx.rotate(Math.sin(breathTime * 5.0 + phase) * swayAmp);
      }

      ctx.drawImage(
        enemyImg,
        -enemyImg.naturalWidth  * s * meta.px,
        -enemyImg.naturalHeight * s * meta.py,
        drawW, drawH,
      );
      ctx.restore();
    } else {
    ctx.rotate(angle);
    if (def.name === "mammoth") {
      // 巨獣の群像: 大小の楕円3体の塊
      ctx.fillStyle = def.color;
      ctx.strokeStyle = "rgba(255,255,255,0.4)";
      ctx.lineWidth = 1.5;
      for (const [ox, oy, r] of [[6, 0, 13], [-8, 9, 9], [-8, -10, 10]]) {
        ctx.beginPath();
        ctx.ellipse(ox, oy, r * 1.25, r, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }
      // 牙
      ctx.strokeStyle = "#f0e0c0";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(16, -5); ctx.lineTo(24, -9);
      ctx.moveTo(16,  5); ctx.lineTo(24,  9);
      ctx.stroke();
    } else if (def.name === "colossus") {
      // 歩く神像: 胴体の縦長矩形＋頭部円＋肩
      ctx.fillStyle = def.color;
      ctx.strokeStyle = "rgba(255,255,255,0.5)";
      ctx.lineWidth = 1.5;
      ctx.fillRect(-10, -16, 22, 32);
      ctx.strokeRect(-10, -16, 22, 32);
      ctx.beginPath();
      ctx.arc(16, 0, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      // 目（眼光の源）
      ctx.fillStyle = "#ff4040";
      ctx.beginPath();
      ctx.arc(19, 0, 2.5, 0, Math.PI * 2);
      ctx.fill();
    } else if (def.name === "knights") {
      // 騎士方陣: 4×4 の小さな盾の格子
      ctx.fillStyle = def.color;
      ctx.strokeStyle = "rgba(60,70,90,0.8)";
      ctx.lineWidth = 0.8;
      for (let gy = -1.5; gy <= 1.5; gy++) {
        for (let gx = -1.5; gx <= 1.5; gx++) {
          ctx.fillRect(gx * 11 - 4, gy * 11 - 4, 8, 8);
          ctx.strokeRect(gx * 11 - 4, gy * 11 - 4, 8, 8);
        }
      }
    } else if (def.name === "raider") {
      // v0.8 レイダー: 小型の赤い牙獣（シェブロン型）。画像なしのベクター専用
      ctx.fillStyle = def.color;
      ctx.strokeStyle = "rgba(255,160,160,0.7)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(11, 0);       // 鼻先
      ctx.lineTo(-2, -7);
      ctx.lineTo(-8, -4);
      ctx.lineTo(-5, 0);       // 尾の付け根のくびれ
      ctx.lineTo(-8, 4);
      ctx.lineTo(-2, 7);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      // 牙
      ctx.strokeStyle = "#ffe0e0";
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(8, -3); ctx.lineTo(12, -5);
      ctx.moveTo(8, 3);  ctx.lineTo(12, 5);
      ctx.stroke();
    } else if (def.name === "balloon") {
      // 爆撃気球: 丸い気嚢＋吊り索＋ゴンドラ（回転させず常に上向きで描く）
      ctx.rotate(-angle); // 気球は姿勢を回転させない
      ctx.fillStyle = def.color;
      ctx.strokeStyle = "rgba(255,230,180,0.5)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(0, -4, 15, 12, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      // 気嚢の縦帯
      ctx.strokeStyle = "rgba(60,40,20,0.5)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, -16); ctx.lineTo(0, 8);
      ctx.moveTo(-9, -13); ctx.lineTo(-6, 6);
      ctx.moveTo(9, -13); ctx.lineTo(6, 6);
      ctx.stroke();
      // ゴンドラ
      ctx.fillStyle = "#4a3520";
      ctx.fillRect(-5, 10, 10, 6);
      ctx.beginPath();
      ctx.moveTo(-6, 8); ctx.lineTo(-9, 2);
      ctx.moveTo(6, 8); ctx.lineTo(9, 2);
      ctx.strokeStyle = "rgba(30,20,10,0.8)";
      ctx.stroke();
    } else {
      // 陸上甲鉄艦: 細長い装甲艦体＋砲塔
      ctx.fillStyle = def.color;
      ctx.strokeStyle = "rgba(255,255,255,0.45)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(26, 0);
      ctx.lineTo(14, -11);
      ctx.lineTo(-22, -11);
      ctx.lineTo(-28, 0);
      ctx.lineTo(-22, 11);
      ctx.lineTo(14, 11);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#2a3540";
      for (const tx of [-12, 2]) {
        ctx.beginPath();
        ctx.arc(tx, 0, 5, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
    } // v0.7: 画像/ベクター分岐の閉じ

    // HPバー（ボスバーの縮小版・常時表示）
    const barW = def.radius * 2.4;
    const barX = m.wx - barW * 0.5;
    const barY = m.wy - def.radius - 14;
    const hpRatio = Math.max(0, m.hp / m.maxHp);
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    ctx.fillRect(barX - 1, barY - 1, barW + 2, 7);
    ctx.fillStyle = hpRatio > 0.5 ? def.glowColor : (hpRatio > 0.25 ? "#e0c040" : "#e04040");
    ctx.fillRect(barX, barY, barW * hpRatio, 5);
    ctx.globalAlpha = 1.0;

    // コロッサスの眼光ビーム
    if (def.attack.type === "beam" && m.beamTargetIdx >= 0 && !boidDead[m.beamTargetIdx]) {
      ctx.save();
      ctx.strokeStyle = "rgba(255,64,64,0.65)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(m.wx, m.wy);
      ctx.lineTo(px[m.beamTargetIdx], py[m.beamTargetIdx]);
      ctx.stroke();
      ctx.restore();
    }
  }

  // 衝撃波リング（マンモス踏鳴らし・ボスノヴァ共用。色は発生源が指定）
  for (const fx of shockwaveFxList) {
    const progress = 1 - fx.life / SHOCKWAVE_FX_DURATION;
    ctx.save();
    ctx.globalAlpha = Math.max(0, 1 - progress) * 0.7;
