// =================================================================
// v0.6-p2: 武器タイプシステム（BEAM / BULLET / MISSILE / MELEE）
// 群れは常に単一タイプ（★進化で100%全転換。仕様 §5.4-C / §6）
// =================================================================

// 群れ全体の現在武器。ステージ開始時は必ず BEAM（resetProgression で戻る）
let flockWeapon = "beam";

// 武器タイプ → スプライト属性（既存の fire/ice/shadow パレットを充当。
// 緋竜=crimson は fire 画像の赤強調ティント。仕様 §5.4-C）
const WEAPON_ELEMENT = { beam: "fire", bullet: "ice", missile: "shadow", melee: "crimson" };

// HUD表示用ラベルと色
const WEAPON_HUD = {
  beam:    { label: "\u{1F525} 火竜", color: "#ff8c28" },
  bullet:  { label: "❄️ 氷竜",    color: "#a0e8ff" },
  missile: { label: "\u{1F311} 影竜", color: "#c080ff" },
  melee:   { label: "\u{1F43E} 緋竜", color: "#ff4030" },
};

// 転換時のフラッシュ色（進化の瞬間を派手に）
const WEAPON_FLASH_COLOR = {
  bullet:  "rgba(160,232,255,0.6)",
  missile: "rgba(192,128,255,0.6)",
  melee:   "rgba(255,64,48,0.6)",
};

// ---- BULLET（氷竜・直進弾丸）基礎性能（仕様 §6.2）----
const BULLET_RANGE      = 220;  // 射出可能距離（px）
const BULLET_SPEED      = 400;  // 弾速（px/s・直進非追尾）
const BULLET_DAMAGE     = 6;    // 単発ダメージ
const BULLET_INTERVAL   = 1.2;  // 発射間隔（秒）
const BULLET_MAX_TRAVEL = 300;  // 弾の最大飛距離（px）

// ---- MISSILE（影竜・加速ホーミング）基礎性能（仕様 §6.3）----
const MISSILE_RANGE      = 300;   // ロックオン距離（px）
const MISSILE_DAMAGE     = 15;    // 直撃ダメージ
const MISSILE_INTERVAL   = 2.5;   // 発射間隔（秒）
const MISSILE_INIT_SPEED = 60;    // 初速（px/s）
const MISSILE_MAX_SPEED  = 500;   // 最高速（px/s）
const MISSILE_ACCEL      = 600;   // 加速度（px/s²）
const MISSILE_TURN_RATE  = 3.5;   // 旋回率（rad/s）
const MISSILE_AOE        = 30;    // 爆発半径（px）
const MISSILE_AOE_FACTOR = 0.5;   // 爆発範囲ダメージ係数
const MISSILE_LIFETIME   = 4.0;   // 追尾失敗時の寿命（秒）

// ---- MELEE（緋竜・直接攻撃特化）基礎性能（仕様 §6.4）----
const MELEE_COLLISION_DAMAGE   = 25;    // 体当たりダメージ（通常8の約3倍強）
const MELEE_COLLISION_COOLDOWN = 0.35;  // 体当たりクールダウン（通常0.5より短い）
const MELEE_HP_MULT            = 1.5;   // 個体最大HP倍率

// 各個体の射撃タイマー（BULLET/MISSILE共用。initBoids で確保）
let boidFireTimer = null;

/**
 * ★進化: 群れ全体を weapon タイプへ100%転換する。
 * - HP上限の変化（melee ±50%）は現在HPも比率維持で追従
 * - 全個体の位置に閃光パーティクル＋画面フラッシュで「一斉に色が変わる」を演出
 */
function convertFlock(weapon) {
  const oldMax = effBoidMaxHp();
  flockWeapon = weapon;
  const newMax = effBoidMaxHp();
  const ratio  = newMax / oldMax;

  for (let i = 0; i < N; i++) {
    if (!boidDead[i]) boidHp[i] = Math.min(newMax, boidHp[i] * ratio);
    // 射撃タイマーをばらけさせて一斉射撃の不自然さを防ぐ
    if (boidFireTimer) boidFireTimer[i] = Math.random() * currentFireInterval();
  }

  // 進化演出: 群れの一部個体に出現FXリング＋強フラッシュ＋強振動
  let fxCount = 0;
  for (let i = 0; i < N && fxCount < 12; i++) {
    if (boidDead[i] || boidDowned[i]) continue;
    if (Math.random() < 0.4) { spawnDragonAppearEffect(px[i], py[i]); fxCount++; }
  }
  triggerFlash(WEAPON_FLASH_COLOR[weapon] ?? "rgba(255,255,255,0.5)", 0.35);
  hapticPulse(120);
  updateHUDWeapon();
}

function currentFireInterval() {
  if (flockWeapon === "bullet")  return BULLET_INTERVAL * effFireIntervalMult("bullet");
  if (flockWeapon === "missile") return MISSILE_INTERVAL * effFireIntervalMult("missile");
  return 1.0;
}

const hudWeaponEl = document.getElementById("h-weapon");
function updateHUDWeapon() {
  const info = WEAPON_HUD[flockWeapon];
  hudWeaponEl.textContent   = info.label;
  hudWeaponEl.style.color   = info.color;
}

/** 建物へのダメージ適用＋陥落処理の共通ヘルパー（弾丸・ミサイル用） */
function damageBuilding(settlementIdx, damage) {
  const settlement = settlements[settlementIdx];
  if (!settlement || settlement.fallen) return;
  settlement.hp -= damage;
  if (settlement.hp <= 0 && !settlement.fallen) {
    settlementFall(settlementIdx);
    buildingLayerDirty = true;
  }
}

// -----------------------------------------------------------------
// 自軍投射物プール（BULLET弾・MISSILE弾。敵投射物プールとは独立）
// -----------------------------------------------------------------
const MAX_DPROJ = 300;
const dprojX       = new Float32Array(MAX_DPROJ);
const dprojY       = new Float32Array(MAX_DPROJ);
const dprojVx      = new Float32Array(MAX_DPROJ);
const dprojVy      = new Float32Array(MAX_DPROJ);
const dprojStartX  = new Float32Array(MAX_DPROJ);
const dprojStartY  = new Float32Array(MAX_DPROJ);
const dprojAge     = new Float32Array(MAX_DPROJ);
const dprojActive  = new Uint8Array(MAX_DPROJ);
const dprojKind    = new Uint8Array(MAX_DPROJ);   // 0=bullet, 1=missile
const dprojHits    = new Uint8Array(MAX_DPROJ);   // bullet: 残り貫通ヒット数
const dprojLastHit = new Int32Array(MAX_DPROJ);   // bullet: 直前ヒット建物（連続多段ヒット防止）
const dprojTarget  = new Int32Array(MAX_DPROJ);   // missile: 追尾対象の建物インデックス

function clearDragonProjectiles() { dprojActive.fill(0); }

function spawnDragonProjectile(fromX, fromY, kind, angle, targetIdx) {
  let slot = -1;
  for (let i = 0; i < MAX_DPROJ; i++) {
    if (!dprojActive[i]) { slot = i; break; }
  }
  if (slot < 0) return;

  dprojActive[slot]  = 1;
  dprojX[slot]       = fromX;
  dprojY[slot]       = fromY;
  dprojStartX[slot]  = fromX;
  dprojStartY[slot]  = fromY;
  dprojAge[slot]     = 0;
  dprojKind[slot]    = kind;
  dprojLastHit[slot] = -1;
  dprojTarget[slot]  = targetIdx;

  if (kind === 0) {
    dprojVx[slot]  = Math.cos(angle) * BULLET_SPEED;
    dprojVy[slot]  = Math.sin(angle) * BULLET_SPEED;
    dprojHits[slot] = Math.min(255, effBulletPierce());
  } else {
    // ミサイルは初速が遅く、発射方向にゆらぎ（±0.8rad）を持たせてから加速追尾する
    const wobbled = angle + (Math.random() - 0.5) * 1.6;
    dprojVx[slot]  = Math.cos(wobbled) * MISSILE_INIT_SPEED;
    dprojVy[slot]  = Math.sin(wobbled) * MISSILE_INIT_SPEED;
    dprojHits[slot] = 1;
  }
}

// 近傍建物クエリ用の作業バッファ（自軍弾専用。既存バッファと分離して干渉を防ぐ）
const _dprojNeighbourBuf = [];

/**
 * 指定座標から最も近い未陥落の建物を探す（cellRadius セル走査）。
 * @param {boolean} excludeWalls  true のとき城壁を対象外にする
 *   （ミサイルは壁を飛び越える＝壁を狙えないため。弾丸は壁を狙える＝攻城槌）
 */
function findNearestBuilding(wx, wy, maxDist, cellRadius, excludeWalls) {
  buildingGridQueryRadius(wx, wy, cellRadius, _dprojNeighbourBuf);
  let best = -1;
  let bestD2 = maxDist * maxDist;
  for (const sIdx of _dprojNeighbourBuf) {
    const s = settlements[sIdx];
    if (!s || s.fallen) continue;
    if (excludeWalls && s._isWall) continue;
    const dx = s.wx - wx;
    const dy = s.wy - wy;
    const d2 = dx * dx + dy * dy;
    if (d2 < bestD2) { bestD2 = d2; best = sIdx; }
  }
  return best;
}

/** BULLET: 射程内の最近建物へ直進弾を放つ（各個体、間隔 1.2s×連射機構） */
function updateBulletAttacks(dt) {
  const range      = BULLET_RANGE * effWeaponRangeMult("bullet");
  const interval   = BULLET_INTERVAL * effFireIntervalMult("bullet");
  const cellRadius = Math.max(1, Math.ceil(range / BUILDING_GRID_CELL));

  for (let i = 0; i < N; i++) {
    if (boidDead[i] || boidDowned[i]) continue;
    boidFireTimer[i] -= dt;
    if (boidFireTimer[i] > 0) continue;

    const targetIdx = findNearestBuilding(px[i], py[i], range, cellRadius, false);
    if (targetIdx < 0) continue; // 射程内に標的なし: タイマーは0のまま待機（見つけ次第撃つ）

    boidFireTimer[i] = interval;
    const target = settlements[targetIdx];
    const angle  = Math.atan2(target.wy - py[i], target.wx - px[i]);
    spawnDragonProjectile(px[i], py[i], 0, angle, targetIdx);
  }
}

/** MISSILE: ロック距離内の最近建物に向けて加速ホーミング弾を放つ（間隔 2.5s×連射機構） */
function updateMissileAttacks(dt) {
  const range      = MISSILE_RANGE * effWeaponRangeMult("missile");
  const interval   = MISSILE_INTERVAL * effFireIntervalMult("missile");
  const cellRadius = Math.max(1, Math.ceil(range / BUILDING_GRID_CELL));

  for (let i = 0; i < N; i++) {
    if (boidDead[i] || boidDowned[i]) continue;
    boidFireTimer[i] -= dt;
    if (boidFireTimer[i] > 0) continue;

    // v0.6-p3: ミサイルは城壁を狙わない（壁越しに内部の建物をロックする）
    const targetIdx = findNearestBuilding(px[i], py[i], range, cellRadius, true);
    if (targetIdx < 0) continue;

    boidFireTimer[i] = interval;
    // 発射方向は現在の進行方向（そこからゆらいで加速する軌道が気持ちよさの本体）
    const angle = Math.atan2(vy[i], vx[i]);
    spawnDragonProjectile(px[i], py[i], 1, angle, targetIdx);
  }
}

/** 自軍投射物の移動・追尾・建物ヒット処理 */
function updateDragonProjectiles(dt) {
  for (let i = 0; i < MAX_DPROJ; i++) {
    if (!dprojActive[i]) continue;
    dprojAge[i] += dt;

    if (dprojKind[i] === 1) {
      // ---- ミサイル: 加速＋旋回追尾 ----
      let targetIdx = dprojTarget[i];
      let target = (targetIdx >= 0) ? settlements[targetIdx] : null;
      if (!target || target.fallen) {
        // 対象消失: 現在位置周辺で再ロック（城壁は対象外。見つからなければ直進して寿命切れ）
        targetIdx = findNearestBuilding(dprojX[i], dprojY[i], 250, 3, true);
        dprojTarget[i] = targetIdx;
        target = (targetIdx >= 0) ? settlements[targetIdx] : null;
      }

      const speed = Math.min(
        MISSILE_MAX_SPEED,
        Math.sqrt(dprojVx[i] * dprojVx[i] + dprojVy[i] * dprojVy[i]) + MISSILE_ACCEL * dt,
      );
      let heading = Math.atan2(dprojVy[i], dprojVx[i]);
      if (target) {
        const desired = Math.atan2(target.wy - dprojY[i], target.wx - dprojX[i]);
        let diff = desired - heading;
        while (diff >  Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        const maxTurn = MISSILE_TURN_RATE * dt;
        heading += Math.max(-maxTurn, Math.min(maxTurn, diff));
      }
      dprojVx[i] = Math.cos(heading) * speed;
      dprojVy[i] = Math.sin(heading) * speed;

      if (dprojAge[i] > MISSILE_LIFETIME) { dprojActive[i] = 0; continue; }
    } else {
      // ---- 弾丸: 直進・飛距離上限 ----
      const tdx = dprojX[i] - dprojStartX[i];
      const tdy = dprojY[i] - dprojStartY[i];
      if (tdx * tdx + tdy * tdy > BULLET_MAX_TRAVEL * BULLET_MAX_TRAVEL) {
        dprojActive[i] = 0;
        continue;
      }
    }

    dprojX[i] += dprojVx[i] * dt;
    dprojY[i] += dprojVy[i] * dt;

    if (dprojX[i] < -50 || dprojX[i] > WORLD_W + 50 || dprojY[i] < -50 || dprojY[i] > WORLD_H + 50) {
      dprojActive[i] = 0;
      continue;
    }

    // ---- v0.6-p3: 岩山チェック（弾丸のみ。ミサイルは地形を飛び越える）----
    if (dprojKind[i] === 0) {
      let blockedByRock = false;
      for (const ob of terrainObstacles) {
        if (ob.type !== "rock") continue;
        const rdx = ob.wx - dprojX[i];
        const rdy = ob.wy - dprojY[i];
        if (rdx * rdx + rdy * rdy < ob.radius * ob.radius) { blockedByRock = true; break; }
      }
      if (blockedByRock) {
        spawnHitParticles(dprojX[i], dprojY[i]);
        dprojActive[i] = 0;
        continue;
      }
    }

    // ---- v0.6-p4: 移動敵ヒット判定（数が少ないので全走査） ----
    let hitMover = false;
    for (const m of movers) {
      if (!m.alive) continue;
      const mdx = m.wx - dprojX[i];
      const mdy = m.wy - dprojY[i];
      const mHitR = m.def.radius + 3;
      if (mdx * mdx + mdy * mdy > mHitR * mHitR) continue;
      if (dprojKind[i] === 0) {
        damageMover(m, BULLET_DAMAGE * effWeaponDmgMult("bullet"));
        spawnHitParticles(dprojX[i], dprojY[i]);
        dprojHits[i]--;
        if (dprojHits[i] <= 0) dprojActive[i] = 0;
      } else {
        damageMover(m, MISSILE_DAMAGE * effWeaponDmgMult("missile"));
        spawnCollisionParticles(dprojX[i], dprojY[i]);
        dprojActive[i] = 0;
      }
      hitMover = true;
      break;
    }
    if (hitMover && !dprojActive[i]) continue;

    // ---- 建物ヒット判定 ----
    buildingGridQuery(dprojX[i], dprojY[i], _dprojNeighbourBuf);
    for (const sIdx of _dprojNeighbourBuf) {
      const s = settlements[sIdx];
      if (!s || s.fallen) continue;
      // v0.6-p3: ミサイルは城壁を飛び越える（唯一の壁越し攻撃。仕様 §6.3）
      if (dprojKind[i] === 1 && s._isWall) continue;
      if (dprojKind[i] === 0 && sIdx === dprojLastHit[i]) continue; // 同じ建物への多段ヒット防止
      const hitR = s.radius + 3;
      const dx = s.wx - dprojX[i];
      const dy = s.wy - dprojY[i];
      if (dx * dx + dy * dy > hitR * hitR) continue;

      if (dprojKind[i] === 0) {
        // 弾丸: ダメージ＋貫通消費
        damageBuilding(sIdx, BULLET_DAMAGE * effWeaponDmgMult("bullet"));
        spawnHitParticles(dprojX[i], dprojY[i]);
        dprojLastHit[i] = sIdx;
        dprojHits[i]--;
        if (dprojHits[i] <= 0) { dprojActive[i] = 0; }
        break;
      } else {
        // ミサイル: 直撃＋爆発範囲ダメージ
        const dmg  = MISSILE_DAMAGE * effWeaponDmgMult("missile");
        const aoeR = MISSILE_AOE * effMissileAoeMult();
        damageBuilding(sIdx, dmg);
        // 爆心周辺の他建物に範囲ダメージ
        buildingGridQueryRadius(dprojX[i], dprojY[i], Math.max(1, Math.ceil(aoeR / BUILDING_GRID_CELL)), _dprojNeighbourBuf);
        for (const aIdx of _dprojNeighbourBuf) {
          if (aIdx === sIdx) continue;
          const a = settlements[aIdx];
          if (!a || a.fallen) continue;
          const adx = a.wx - dprojX[i];
          const ady = a.wy - dprojY[i];
          if (adx * adx + ady * ady < (aoeR + a.radius) * (aoeR + a.radius)) {
            damageBuilding(aIdx, dmg * MISSILE_AOE_FACTOR);
          }
        }
        spawnCollisionParticles(dprojX[i], dprojY[i]);
        hapticPulse(12);
        dprojActive[i] = 0;
        break;
      }
    }
  }
}

/** 自軍投射物の描画。カメラ変換内（ワールド座標系）で呼ぶこと。 */
function drawDragonProjectiles() {
  ctx.save();
  for (let i = 0; i < MAX_DPROJ; i++) {
    if (!dprojActive[i]) continue;

    // ビューポートカリング
    const sx = (dprojX[i] - cam.x) * cam.scale + viewW * 0.5;
    const sy = (dprojY[i] - cam.y) * cam.scale + viewH * 0.5;
    if (sx < -40 || sx > viewW + 40 || sy < -40 || sy > viewH + 40) continue;

    const speed = Math.sqrt(dprojVx[i] * dprojVx[i] + dprojVy[i] * dprojVy[i]) || 1;
    const nx = dprojVx[i] / speed;
    const ny = dprojVy[i] / speed;

    if (dprojKind[i] === 0) {
      // 弾丸: 氷色の細長い光条（進行方向に伸びる）
      const len = 9;
      ctx.strokeStyle = "rgba(160,232,255,0.95)";
      ctx.lineWidth   = 2.2;
      ctx.lineCap     = "round";
      ctx.beginPath();
      ctx.moveTo(dprojX[i] - nx * len, dprojY[i] - ny * len);
      ctx.lineTo(dprojX[i], dprojY[i]);
      ctx.stroke();
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(dprojX[i], dprojY[i], 1.6, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // ミサイル: 影紫の弾頭＋速度に応じて伸びる排気トレイル
      const trailLen = 6 + (speed / MISSILE_MAX_SPEED) * 16;
      ctx.strokeStyle = "rgba(192,128,255,0.55)";
      ctx.lineWidth   = 2.8;
      ctx.lineCap     = "round";
      ctx.beginPath();
      ctx.moveTo(dprojX[i] - nx * trailLen, dprojY[i] - ny * trailLen);
      ctx.lineTo(dprojX[i], dprojY[i]);
      ctx.stroke();
      ctx.fillStyle = "#c080ff";
      ctx.beginPath();
      ctx.arc(dprojX[i], dprojY[i], 3.0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.85)";
      ctx.beginPath();
      ctx.arc(dprojX[i], dprojY[i], 1.2, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();
}

/**
 * 武器攻撃のディスパッチャ。tick の playing 分岐から毎フレーム呼ぶ。
 * breathTime（羽ばたき・ジェム明滅などの共通アニメ時計）もここで進める。
 */
function updateWeaponAttacks(dt) {
  if (gameState !== "playing") return;
  breathTime += dt;
  activeBreaths.length = 0;

  if (flockWeapon === "beam") {
    updateBeamAttacks(dt);
  } else if (flockWeapon === "bullet") {
    updateBulletAttacks(dt);
  } else if (flockWeapon === "missile") {
    updateMissileAttacks(dt);
  }
  // melee は遠隔攻撃なし（強化された体当たり = updateCollisionAttacks が担う）

  updateDragonProjectiles(dt);
}

// -----------------------------------------------------------------
// 変更2(追加): 竜やられエフェクト — HP0でダウンに入る瞬間に出す死亡FX
// 出現FX(金色)と明確に色を変え、灰/暗赤の飛散パーティクルで「やられた」を伝える。
// プール上限付き（MAX_PARTICLES 内で既存スロット流用）。多数同時でも破綻しない。
// -----------------------------------------------------------------

// 死亡FX: やられリングプール（出現FXプールとは別）
const MAX_DOWN_FX = 20;
const downFxWx     = new Float32Array(MAX_DOWN_FX);
const downFxWy     = new Float32Array(MAX_DOWN_FX);
const downFxLife   = new Float32Array(MAX_DOWN_FX);
const downFxActive = new Uint8Array(MAX_DOWN_FX);
const DOWN_FX_DURATION = 0.40; // やられリング表示時間（出現FXより短め・速く消える）
const DOWN_FX_RING_MAX = 40;   // やられリングの最大半径（出現FXの半分）

/**
 * 竜がダウンに入った瞬間に呼ぶ。
 * 灰/暗赤のパーティクル（partType=2）+ しぼむリングエフェクトをスポーンする。
 * 出現FX（金色・弾ける）と色と挙動を明確に差別化して「やられた」を伝える。
 */
function spawnDragonDownEffect(wx, wy) {
  // --- しぼむリング ---
  let slot = -1;
  for (let i = 0; i < MAX_DOWN_FX; i++) {
    if (!downFxActive[i]) { slot = i; break; }
  }
  // 空きがなければ残り寿命最小を上書き
  if (slot < 0) {
    let minLife = Infinity;
    for (let i = 0; i < MAX_DOWN_FX; i++) {
      if (downFxLife[i] < minLife) { minLife = downFxLife[i]; slot = i; }
    }
  }
  downFxActive[slot] = 1;
  downFxWx[slot]     = wx;
  downFxWy[slot]     = wy;
  downFxLife[slot]   = DOWN_FX_DURATION;

  // --- 飛散パーティクル（灰/暗赤・5〜7個）---
  // 出現FXは金色で14個だが、やられFXは灰系で少数に抑えて地味な「やられ感」を出す
  const DEATH_SPARK_COUNT = 5 + Math.floor(Math.random() * 3); // 5〜7個
  let spawned = 0;
  for (let i = 0; i < MAX_PARTICLES && spawned < DEATH_SPARK_COUNT; i++) {
    if (partActive[i]) continue;
    partActive[i] = 1;
    partType[i]   = 2; // 死亡FX（灰〜暗赤）
    partX[i] = wx + (Math.random() - 0.5) * 10;
    partY[i] = wy + (Math.random() - 0.5) * 10;
    const angle = Math.random() * Math.PI * 2;
    // 出現FXより遅め（しぼむ感・エネルギーが抜ける感）
    const speed = 40 + Math.random() * 80;
    partVx[i]   = Math.cos(angle) * speed;
    partVy[i]   = Math.sin(angle) * speed;
    // 寿命短め（やられは素早く消える）
    partLife[i] = 0.25 + Math.random() * 0.15;
    spawned++;
  }

  // 短い振動フィードバック（ダウンの衝撃感）
  hapticPulse(20);
}

function updateDownEffects(dt) {
  for (let i = 0; i < MAX_DOWN_FX; i++) {
    if (!downFxActive[i]) continue;
    downFxLife[i] -= dt;
    if (downFxLife[i] <= 0) downFxActive[i] = 0;
  }
}

/**
 * やられリングを描画する。カメラ変換内（ワールド座標系）で呼ぶこと。
 * 出現FXとは逆に「しぼむ」ように内側に向かって半径が縮まる演出。
 * 色は暗赤〜灰系で「失った」感を出す。
 */
function drawDownEffects() {
  for (let i = 0; i < MAX_DOWN_FX; i++) {
    if (!downFxActive[i]) continue;
    const progress = 1.0 - downFxLife[i] / DOWN_FX_DURATION; // 0→1
    // しぼむ: 最初は大きく、末期に向けて収縮する（出現FXとは逆）
    const ringRadius = DOWN_FX_RING_MAX * (1.0 - progress * 0.5);
    // フェードアウト: 後半で急速に消える
    const alpha = Math.max(0, 1.0 - progress * progress * 1.8);
    const wx = downFxWx[i];
    const wy = downFxWy[i];

    ctx.save();

    // 外リング（暗赤）
    ctx.globalAlpha = alpha * 0.80;
    ctx.strokeStyle = "#c03020";
    ctx.lineWidth   = Math.max(0.5, 2.5 * (1 - progress));
    ctx.beginPath();
    ctx.arc(wx, wy, Math.max(0.5, ringRadius), 0, Math.PI * 2);
    ctx.stroke();

    // 内リング（灰）: わずかに遅れて登場
    if (progress > 0.1) {
      const innerP = (progress - 0.1) / 0.9;
      const innerR = DOWN_FX_RING_MAX * 0.55 * (1.0 - innerP * 0.4);
      ctx.globalAlpha = alpha * 0.55;
      ctx.strokeStyle = "#808080";
      ctx.lineWidth   = Math.max(0.5, 1.5 * (1 - innerP));
      ctx.beginPath();
      ctx.arc(wx, wy, Math.max(0.5, innerR), 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.restore();
  }
}

// -----------------------------------------------------------------
// 変更2: 竜出現エフェクト — 卵回収で竜+1したときの弾けるエフェクト
// プール上限 12: 多数同時発生でも破綻しない軽量構造。
// リングは拡大しながらフェードアウト（0.4秒）、火花は短命パーティクルを流用。
// -----------------------------------------------------------------
const MAX_APPEAR_FX = 20;  // プール拡張: 多数同時出現（Katamari的に増える）に対応
const appearFxWx    = new Float32Array(MAX_APPEAR_FX);
const appearFxWy    = new Float32Array(MAX_APPEAR_FX);
const appearFxLife  = new Float32Array(MAX_APPEAR_FX);  // 残り寿命（秒）
const appearFxActive = new Uint8Array(MAX_APPEAR_FX);
const APPEAR_FX_DURATION = 0.62; // リングの表示時間（秒）: 0.42→0.62 で一瞬すぎず目立つ
const APPEAR_FX_RING_MAX = 76;   // リングの最大半径（論理px）: 38→76 で倍の広がり

/**
 * 指定ワールド座標に竜出現エフェクトをスポーンする。
 * プールが満杯のときは古いスロット（最も残り寿命が少ない）を上書き。
 */
function spawnDragonAppearEffect(wx, wy) {
  // 空きスロットを探す
  let slot = -1;
  for (let i = 0; i < MAX_APPEAR_FX; i++) {
    if (!appearFxActive[i]) { slot = i; break; }
  }
  // 空きがなければ残り寿命が最も少ないスロットを再利用
  if (slot < 0) {
    let minLife = Infinity;
    for (let i = 0; i < MAX_APPEAR_FX; i++) {
      if (appearFxLife[i] < minLife) { minLife = appearFxLife[i]; slot = i; }
    }
  }
  appearFxActive[slot] = 1;
  appearFxWx[slot]     = wx;
  appearFxWy[slot]     = wy;
  appearFxLife[slot]   = APPEAR_FX_DURATION;

  // 金〜白〜薄橙の火花パーティクル: partType=1 で描画時に金色系で描き分ける
  // 14個に増量、飛散半径・初速・サイズ大きめで「弾けるお祝い」感を出す
  const SPARK_COUNT = 14;
  let spawned = 0;
  for (let i = 0; i < MAX_PARTICLES && spawned < SPARK_COUNT; i++) {
    if (partActive[i]) continue;
    partActive[i] = 1;
    partType[i]   = 1; // 出現エフェクト火花（金〜白〜薄橙）
    partX[i] = wx + (Math.random() - 0.5) * 14;
    partY[i] = wy + (Math.random() - 0.5) * 14;
    const angle = Math.random() * Math.PI * 2;
    // 内側の輝く粒子（遅め・大きめ）と外側に飛ぶ粒子（速め）を混在させる
    const speed = 80 + Math.random() * 160;
    partVx[i]   = Math.cos(angle) * speed;
    partVy[i]   = Math.sin(angle) * speed;
    // 寿命: 0.45〜0.65秒（APPEAR_FX_DURATIONに近い長さで同期感）
    partLife[i] = 0.45 + Math.random() * 0.20;
    spawned++;
  }

  // 軽い振動フィードバック（8ms: 気づける程度、連打でも不快にならない長さ）
  hapticPulse(8);
}

function updateAppearEffects(dt) {
  for (let i = 0; i < MAX_APPEAR_FX; i++) {
    if (!appearFxActive[i]) continue;
    appearFxLife[i] -= dt;
    if (appearFxLife[i] <= 0) appearFxActive[i] = 0;
  }
}

/**
 * 竜出現エフェクトを描画する。カメラ変換内（ワールド座標系）で呼ぶこと。
 * 3重リング＋中心閃光で「嬉しい瞬間」を派手に祝う。
 * リングはイーズアウトで減速しながら拡大し、progress二乗でフェードアウト。
 */
function drawAppearEffects() {
  for (let i = 0; i < MAX_APPEAR_FX; i++) {
    if (!appearFxActive[i]) continue;
    const progress = 1.0 - appearFxLife[i] / APPEAR_FX_DURATION; // 0→1
    // フェードアウト: 前半は不透明を保ち、後半で急速に消える（より存在感を出す）
    const alpha    = Math.max(0, 1.0 - progress * progress * progress);
    const wx       = appearFxWx[i];
    const wy       = appearFxWy[i];

    ctx.save();

    // ---- 中心閃光: 最初の20%だけ表示する小さな白い光球 ----
    if (progress < 0.20) {
      const flashP = progress / 0.20; // 0→1（最初の20%区間内）
      // 始まりに強く光り、すぐ消える（エネルギーが放出される感じ）
      const flashAlpha = Math.max(0, 1.0 - flashP * flashP) * 0.90;
      const flashR     = 10 + flashP * 6; // 10→16px
      ctx.globalAlpha  = flashAlpha;
      const grd = ctx.createRadialGradient(wx, wy, 0, wx, wy, flashR);
      grd.addColorStop(0, "#ffffff");
      grd.addColorStop(0.4, "#fff8c0");
      grd.addColorStop(1.0, "rgba(255,220,80,0)");
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.arc(wx, wy, flashR, 0, Math.PI * 2);
      ctx.fill();
    }

    // ---- 外側リング（金）: 最大半径まで広がるメインリング ----
    const outerRadius = APPEAR_FX_RING_MAX * progress;
    ctx.globalAlpha   = alpha * 0.90;
    ctx.strokeStyle   = "#ffe060";
    ctx.lineWidth     = Math.max(0.5, 3.5 * (1 - progress));
    ctx.beginPath();
    ctx.arc(wx, wy, Math.max(0.5, outerRadius), 0, Math.PI * 2);
    ctx.stroke();

    // ---- 中間リング（白）: 外側の75%の位置に追随 ----
    const midRadius   = APPEAR_FX_RING_MAX * 0.75 * progress;
    ctx.globalAlpha   = alpha * 0.65;
    ctx.strokeStyle   = "#ffffff";
    ctx.lineWidth     = Math.max(0.5, 2.0 * (1 - progress));
    ctx.beginPath();
    ctx.arc(wx, wy, Math.max(0.5, midRadius), 0, Math.PI * 2);
    ctx.stroke();

    // ---- 内側リング（薄橙）: 外側の45%の位置、やや遅れて展開する感じ ----
    // progress が 0.1 を過ぎてから表示（展開の「タメ」を演出）
    if (progress > 0.08) {
      const innerProgress = Math.min(1.0, (progress - 0.08) / 0.92);
      const innerRadius   = APPEAR_FX_RING_MAX * 0.45 * innerProgress;
      ctx.globalAlpha     = alpha * 0.50;
      ctx.strokeStyle     = "#ffb040";
      ctx.lineWidth       = Math.max(0.5, 1.5 * (1 - innerProgress));
      ctx.beginPath();
      ctx.arc(wx, wy, Math.max(0.5, innerRadius), 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.restore();
  }
}

// -----------------------------------------------------------------
// 画面フラッシュ
// -----------------------------------------------------------------
let flashTimer = 0;
let flashColor = "";

function triggerFlash(color, duration) {
  flashTimer = duration ?? 0.1;
  flashColor = color;
}

// -----------------------------------------------------------------
// v0.8: 画面シェイク（緋竜の体当たり・ボスノヴァなどの衝撃演出）
// render 冒頭でスクリーン座標に微小オフセットを加える。
// -----------------------------------------------------------------
let shakeTimer = 0;
let shakeDuration = 0;
let shakeAmplitude = 0;

function triggerShake(amplitude, duration) {
  // 進行中のシェイクより強いときだけ上書き（弱い揺れで強い揺れを消さない）
  if (shakeTimer > 0 && amplitude < shakeAmplitude) return;
  shakeAmplitude = amplitude;
  shakeDuration = duration;
  shakeTimer = duration;
}

// -----------------------------------------------------------------
// v0.8: 緋竜の斬撃インパクトFX（体当たり命中時の深紅の斬閃）
// -----------------------------------------------------------------
const MAX_SLASH_FX = 24;
const slashFxList = [];
const SLASH_FX_DURATION = 0.22;

function spawnMeleeImpactFx(wx, wy, angle) {
  if (slashFxList.length >= MAX_SLASH_FX) slashFxList.shift();
  slashFxList.push({ x: wx, y: wy, angle, life: SLASH_FX_DURATION });

  // 深紅の火花（partType=3）を撒く
  const count = 8 + Math.floor(Math.random() * 5);
  let spawned = 0;
  for (let i = 0; i < MAX_PARTICLES && spawned < count; i++) {
    if (partActive[i]) continue;
    partActive[i] = 1;
    partType[i]   = 3;
    partX[i] = wx + (Math.random() - 0.5) * 10;
    partY[i] = wy + (Math.random() - 0.5) * 10;
    // 斬撃方向を中心に扇状へ飛ぶ
    const sparkAngle = angle + (Math.random() - 0.5) * 1.8;
    const speed = 120 + Math.random() * 200;
    partVx[i]   = Math.cos(sparkAngle) * speed;
    partVy[i]   = Math.sin(sparkAngle) * speed;
    partLife[i] = 0.22 + Math.random() * 0.18;
    spawned++;
  }
}

function updateSlashFx(dt) {
  for (let i = slashFxList.length - 1; i >= 0; i--) {
    slashFxList[i].life -= dt;
    if (slashFxList[i].life <= 0) slashFxList.splice(i, 1);
  }
}

/** 斬閃を描画する。カメラ変換内（ワールド座標系）で呼ぶこと。 */
function drawSlashFx() {
  for (const fx of slashFxList) {
    const progress = 1 - fx.life / SLASH_FX_DURATION;
    const alpha = Math.max(0, 1 - progress * progress);
    const len = 16 + progress * 22;   // 斬閃が伸びる
    ctx.save();
    ctx.translate(fx.x, fx.y);
    ctx.rotate(fx.angle + Math.PI / 4); // 進行方向に対して斜めの斬り筋
    ctx.lineCap = "round";
    // 外側の深紅
    ctx.globalAlpha = alpha * 0.85;
    ctx.strokeStyle = "#ff3020";
    ctx.lineWidth = 4 * (1 - progress * 0.6);
    ctx.beginPath();
    ctx.moveTo(-len, 0);
    ctx.lineTo(len, 0);
    ctx.stroke();
    // 内側の白いコア
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = "rgba(255,240,230,0.95)";
    ctx.lineWidth = 1.6 * (1 - progress * 0.5);
    ctx.beginPath();
    ctx.moveTo(-len * 0.8, 0);
    ctx.lineTo(len * 0.8, 0);
    ctx.stroke();
    ctx.restore();
  }
  ctx.globalAlpha = 1.0;
}

// -----------------------------------------------------------------
// ステージ状態管理
// v0.6.1: gameState = "title" | "playing" | "stage-clear" | "all-clear"
// （3択カードは非モーダル化したため "levelup" 状態は廃止。playing のままスローモーになる）
// 全滅（defeat）は存在しない — ダウンした竜は必ず復帰する（仕様 §2.2）。
// -----------------------------------------------------------------
let currentStage = 0;

let gameState = "title";
let stageClearPhase = "none";
let stageClearTimer = 0;

const overlayEl    = document.getElementById("overlay");
const overlayTitle = document.getElementById("overlay-title");
const retryBtn     = document.getElementById("retry-btn");
const resultStatsEl = document.getElementById("result-stats");

const stageOverlayEl = document.getElementById("stage-overlay");
const stageTextEl    = document.getElementById("stage-text");
const stageSubEl     = document.getElementById("stage-sub");

const titleOverlayEl = document.getElementById("title-overlay");
const titleBestEl    = document.getElementById("title-best");

// ---- ベスト記録（localStorage。ラン中断セーブは仕様スコープ外）----
const BEST_TIME_KEY  = "dragonTide_bestTimeMs";
const BEST_KILLS_KEY = "dragonTide_bestKills";

function loadBestRecord() {
  try {
    return {
      timeMs: Number(localStorage.getItem(BEST_TIME_KEY)) || 0,
      kills:  Number(localStorage.getItem(BEST_KILLS_KEY)) || 0,
    };
  } catch (_) {
    return { timeMs: 0, kills: 0 };
  }
}

function saveBestRecord(timeMs, kills) {
  try {
    const best = loadBestRecord();
    if (!best.timeMs || timeMs < best.timeMs) localStorage.setItem(BEST_TIME_KEY, String(Math.round(timeMs)));
    if (kills > best.kills) localStorage.setItem(BEST_KILLS_KEY, String(kills));
  } catch (_) {}
}

function formatRunTime(ms) {
  const totalSec = Math.floor(ms / 1000);
  return Math.floor(totalSec / 60) + ":" + String(totalSec % 60).padStart(2, "0");
}

function refreshTitleBest() {
  const best = loadBestRecord();
  titleBestEl.textContent = best.timeMs > 0
    ? STRINGS.bestLine(formatRunTime(best.timeMs), best.kills)
    : STRINGS.noRecord;
}

// ---- ラン開始（タイトル → STAGE 1）----
function startRun() {
  if (gameState !== "title") return;
  runStartTime = performance.now();
  runKills     = 0;
  runMaxFlock  = BOIDS_INITIAL;
  runTotalXp   = 0;
  titleOverlayEl.classList.remove("visible");
  gameState = "playing";
  hapticPulse(30);
}

function triggerStageClear() {
  if (gameState !== "playing") return;

  if (currentStage >= TOTAL_STAGES - 1) {
    triggerAllClear();
    return;
  }

  gameState = "stage-clear";
  stageClearPhase = "silence";
  stageClearTimer = 0.5;
  hapticPulse(150);
}

// ---- 全制覇（STAGE 4 ボス撃破）→ リザルト表示 ----
function triggerAllClear() {
  gameState = "all-clear";
  const runTimeMs = performance.now() - runStartTime;
  saveBestRecord(runTimeMs, runKills);

  overlayEl.classList.add("visible");
  overlayTitle.textContent = STRINGS.resultTitle;
  resultStatsEl.innerHTML =
    `${STRINGS.statTime}: <span class="stat-value">${formatRunTime(runTimeMs)}</span><br>` +
    `${STRINGS.statKills}: <span class="stat-value">${runKills}</span><br>` +
    `${STRINGS.statFlock}: <span class="stat-value">${runMaxFlock}</span><br>` +
    `${STRINGS.statLevel}: <span class="stat-value">Lv.${playerLevel}</span><br>` +
    `${STRINGS.statXp}: <span class="stat-value">${runTotalXp}</span>`;
  resultStatsEl.classList.add("visible");
  retryBtn.textContent = STRINGS.toTitle;
  setTimeout(() => overlayTitle.classList.add("show"), 300);
  setTimeout(() => retryBtn.classList.add("visible"), 1500);
  hapticPulse(300);
}

function updateStageClearSequence(dt) {
  if (gameState !== "stage-clear") return;

  stageClearTimer -= dt;

  if (stageClearPhase === "silence" && stageClearTimer <= 0) {
    stageClearPhase = "flash";
    triggerFlash("rgba(255,255,200,0.85)", 0.25);
    stageClearTimer = 0.3;
  } else if (stageClearPhase === "flash" && stageClearTimer <= 0) {
    stageClearPhase = "text";
    const nextStage = currentStage + 1;
    const nextConfig = STAGE_CONFIGS[nextStage];
    stageTextEl.textContent = "STAGE " + (nextStage + 1);
    stageSubEl.textContent  = nextConfig.name;
    stageOverlayEl.classList.add("visible");
    stageClearTimer = 2.0;
  } else if (stageClearPhase === "text" && stageClearTimer <= 0) {
    stageClearPhase = "transition";
    stageOverlayEl.classList.remove("visible");
    advanceToNextStage();
  }
}

function advanceToNextStage() {
  currentStage++;
  gameState = "playing";
  stageClearPhase = "none";

  for (let i = 0; i < MAX_PROJECTILES; i++) projActive[i] = 0;
  for (let i = 0; i < MAX_PARTICLES; i++)   partActive[i] = 0;
  for (let e = 0; e < MAX_EGGS; e++)        eggActive[e] = 0;
  for (let i = 0; i < MAX_APPEAR_FX; i++)   appearFxActive[i] = 0;
  for (let i = 0; i < MAX_DOWN_FX; i++)     downFxActive[i] = 0;

  activeBreaths.length = 0;
  clearXpGems();
  clearDragonProjectiles();
  resetFires();                 // v0.10: 前ステージの炎を消す

  settlements = generateStageLayout(currentStage);
  rebuildBuildingGrid();
  buildingLayerDirty = true;
  minimapBaseDirty = true;
  rebuildBuildingLayer();
  cacheBossIndex();

  // 変更1: 群れを BOIDS_INITIAL=10 体にリセット（HP・ダウン状態・タイマーすべてクリア）
  // v0.7: レベル・強化カード・竜の種族（武器）は**ラン全体で持ち越し**に変更
  // （Shooterプレイテスト判断）。リセットするのは群れの数だけ。
  // resetProgression() はラン開始時（returnToTitle/boot）のみ呼ぶ。
  resetBoidsForStageStart();
  resetLeader();
  // 3択カードが開いたままステージを跨がないよう畳む（pendingCards は持ち越される）
  dismissLevelUpCards();

  updateHUDStage();
  updateHUDBuildings();
}

/**
 * ラン全体をSTAGE 1の初期状態に巻き戻してタイトル画面へ戻る。
 * リザルト画面の「タイトルへ」ボタンから呼ばれる（v0.6: 全滅リスタートは存在しない）。
 */
function returnToTitle() {
  gameState       = "title";
  stageClearPhase = "none";
  stageClearTimer = 0;
  currentStage    = 0;
  totalEggCount   = 0;
  flashTimer      = 0;

  overlayEl.classList.remove("visible");
  overlayTitle.classList.remove("show");
  retryBtn.classList.remove("visible");
  resultStatsEl.classList.remove("visible");
  stageOverlayEl.classList.remove("visible");
  levelupOverlayEl.classList.remove("visible");

  for (let e = 0; e < MAX_EGGS; e++)          eggActive[e]  = 0;
  for (let i = 0; i < MAX_PROJECTILES; i++)   projActive[i] = 0;
  for (let i = 0; i < MAX_PARTICLES; i++)     partActive[i] = 0;
  for (let i = 0; i < MAX_APPEAR_FX; i++)     appearFxActive[i] = 0;
  for (let i = 0; i < MAX_DOWN_FX; i++)       downFxActive[i] = 0;

  activeBreaths.length = 0;
  clearXpGems();
  resetFires();                 // v0.10: タイトルへ戻る際も炎を消す

  settlements = generateStageLayout(0);
  rebuildBuildingGrid();
  buildingLayerDirty = true;
  minimapBaseDirty = true;
  rebuildBuildingLayer();
  cacheBossIndex();

  resetBoidsForStageStart();
  resetLeader();
  resetProgression();
  updateHUDEggs();
  updateHUDStage();
  updateHUDBuildings();

  refreshTitleBest();
  titleOverlayEl.classList.add("visible");
}

retryBtn.addEventListener("pointerdown", (e) => {
