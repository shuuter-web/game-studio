const TOTAL_STAGES = STAGE_CONFIGS.length;

// -----------------------------------------------------------------
// Canvas セットアップ
// -----------------------------------------------------------------
const canvas = document.getElementById("stage");
// desynchronized:true は低レイテンシ描画パスを使うが、毎フレーム全画面を
// 再描画する本作ではダブルバッファを経由せず未完成フレームが表示され、
// 動的要素が点滅して見える。安定した合成のため無効化する。
const ctx = canvas.getContext("2d", { alpha: false });

const minimapCanvas = document.getElementById("minimap");
const minimapCtx = minimapCanvas.getContext("2d");

// オフスクリーンCanvas: 建物の静的レイヤー（毎フレーム再描画しない）
let buildingLayerCanvas = null;
let buildingLayerCtx    = null;
let buildingLayerDirty  = true;

function createBuildingLayer() {
  buildingLayerCanvas = document.createElement("canvas");
  buildingLayerCanvas.width  = WORLD_W;
  buildingLayerCanvas.height = WORLD_H;
  buildingLayerCtx = buildingLayerCanvas.getContext("2d");
  buildingLayerDirty = true;
}

let viewW = 0, viewH = 0, dpr = 1;
let bottomUIHeight = 0;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  viewW = window.innerWidth;
  viewH = window.innerHeight;
  bottomUIHeight = viewH * 0.20;
  canvas.width  = Math.floor(viewW * dpr);
  canvas.height = Math.floor(viewH * dpr);
  canvas.style.width  = viewW + "px";
  canvas.style.height = viewH + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", resize);
resize();

// -----------------------------------------------------------------
// カメラ（ワールド座標系でのカメラ中心）
// -----------------------------------------------------------------
const cam = { x: 400, y: WORLD_H / 2 };

function worldToScreen(wx, wy) {
  return {
    x: wx - cam.x + viewW * 0.5,
    y: wy - cam.y + viewH * 0.5,
  };
}

function screenToWorld(sx, sy) {
  return {
    x: sx + cam.x - viewW * 0.5,
    y: sy + cam.y - viewH * 0.5,
  };
}

function updateCamera(dt) {
  const centroid = calcFriendlyCentroid();
  const lerpFactor = 0.08;
  cam.x += (centroid.x - cam.x) * lerpFactor;
  cam.y += (centroid.y - cam.y) * lerpFactor;
  cam.x = Math.max(viewW * 0.5, Math.min(WORLD_W - viewW * 0.5, cam.x));
  cam.y = Math.max(viewH * 0.5, Math.min(WORLD_H - viewH * 0.5, cam.y));
}

// -----------------------------------------------------------------
// 集落（建物）の動的生成 — 街区（ブロック）方式
// -----------------------------------------------------------------
let settlements = [];

function randRange(min, max) {
  return min + Math.random() * (max - min);
}

function randInt(min, max) {
  return min + Math.floor(Math.random() * (max - min + 1));
}

function randChoice(array) {
  return array[Math.floor(Math.random() * array.length)];
}

function dist2(ax, ay, bx, by) {
  const dx = ax - bx, dy = ay - by;
  return dx * dx + dy * dy;
}

// 町の中心座標を均等にマップへ配置（グリッドジッター法）
function placeTownCenters(townCount) {
  // 左端250pxは群れスタート地点なので除外
  const MARGIN_LEFT  = 300;
  const MARGIN_RIGHT = 150;
  const MARGIN_Y     = 200;

  const usableW = WORLD_W - MARGIN_LEFT - MARGIN_RIGHT;
  const usableH = WORLD_H - MARGIN_Y * 2;

  const cols = Math.ceil(Math.sqrt(townCount * (usableW / usableH)));
  const rows = Math.ceil(townCount / cols);
  const cellW = usableW / cols;
  const cellH = usableH / rows;

  const centers = [];
  for (let row = 0; row < rows && centers.length < townCount; row++) {
    for (let col = 0; col < cols && centers.length < townCount; col++) {
      const cx = MARGIN_LEFT + col * cellW + randRange(cellW * 0.25, cellW * 0.75);
      const cy = MARGIN_Y    + row * cellH + randRange(cellH * 0.25, cellH * 0.75);
      centers.push({ x: cx, y: cy });
    }
  }
  return centers;
}

  const result = [];

  // 町の色ヒント（同じ町は同系色。townBaseHues からシフト）
  const baseHue = config.townBaseHues[townIndex % config.townBaseHues.length];

  // 変更1: 建物間隔を広げて「広い都市」感を出す（26→52、2倍に）
  // 縦横2倍の間隔 → 1町あたりの占有面積が約4倍になる
  const SMALL_SPACING = 52;   // 建物間隔 (旧26px → 52px)
  const GRID_JITTER   = 8;    // ±px のランダムオフセット（やや広め）

  // 格子サイズ推算: 小建物をほぼ正方形に詰める
  const gridCols = Math.ceil(Math.sqrt(smallCount * 1.1));
  const gridRows = Math.ceil(smallCount / gridCols);
  const townW = gridCols * SMALL_SPACING;
  const townH = gridRows * SMALL_SPACING;

  const startX = townCenterX - townW * 0.5;
  const startY = townCenterY - townH * 0.5;

  // 道路の描画のためにレーン情報を保存（描画フェーズで使う）
  // 道路幅（px）= SMALL_SPACING * 0.6 程度のすき間として視覚的に見える

  // 小建物を格子配置
  const bSmall = config.buildings.small;
  let placed = 0;
  const positions = [];
  for (let row = 0; row < gridRows && placed < smallCount; row++) {
    for (let col = 0; col < gridCols && placed < smallCount; col++) {
      const wx = startX + col * SMALL_SPACING + randRange(-GRID_JITTER, GRID_JITTER);
      const wy = startY + row * SMALL_SPACING + randRange(-GRID_JITTER, GRID_JITTER);

      // ワールド境界チェック
      if (wx < 10 || wx > WORLD_W - 10 || wy < 10 || wy > WORLD_H - 10) continue;

      const hp = randInt(BUILDING_SIZE_PARAMS.small.hpMin, BUILDING_SIZE_PARAMS.small.hpMax);
      // 同じ町の建物は基本色に近いが微妙にバリエーション
      const colorVariant = shadeColor(baseHue, randInt(-15, 15));
      result.push(makeBuilding(wx, wy, "small", colorVariant, bSmall, hp));
      positions.push({ x: wx, y: wy });
      placed++;
    }
  }

  // 中型建物: 格子の「交差点」相当に配置
  const bMedium = config.buildings.medium;
  const blockSize = SMALL_SPACING * 4; // ブロックサイズ目安
  for (let m = 0; m < mediumCount; m++) {
    // 格子内のランダムな「ブロック角」に配置
    const col = randInt(0, gridCols - 1);
    const row = randInt(0, gridRows - 1);
    const wx = startX + col * SMALL_SPACING + SMALL_SPACING * 0.5 + randRange(-8, 8);
    const wy = startY + row * SMALL_SPACING + SMALL_SPACING * 0.5 + randRange(-8, 8);
    if (wx < 10 || wx > WORLD_W - 10 || wy < 10 || wy > WORLD_H - 10) continue;

    // 小建物との重複チェック
    let tooClose = false;
    for (const p of positions) {
      if (dist2(wx, wy, p.x, p.y) < 20 * 20) { tooClose = true; break; }
    }
    if (tooClose) continue;

    const hp = randInt(BUILDING_SIZE_PARAMS.medium.hpMin, BUILDING_SIZE_PARAMS.medium.hpMax);
    const colorVariant = shadeColor(baseHue, randInt(-10, 20));
    result.push(makeBuilding(wx, wy, "medium", colorVariant, bMedium, hp));
    positions.push({ x: wx, y: wy });
  }

  // 大型建物: 町の中心・角に配置（教会・領主の館・城など）
  const bLarge = config.buildings.large;
  const largePositionOffsets = [
    { x: 0, y: 0 },                   // 中心
    { x: -townW * 0.35, y: -townH * 0.35 },  // 左上
    { x:  townW * 0.35, y: -townH * 0.35 },  // 右上
    { x: -townW * 0.35, y:  townH * 0.35 },  // 左下
    { x:  townW * 0.35, y:  townH * 0.35 },  // 右下
  ];
  for (let k = 0; k < largeCount; k++) {
    const offset = largePositionOffsets[k % largePositionOffsets.length];
    const wx = Math.max(30, Math.min(WORLD_W - 30, townCenterX + offset.x + randRange(-20, 20)));
    const wy = Math.max(30, Math.min(WORLD_H - 30, townCenterY + offset.y + randRange(-20, 20)));
    const hp = randInt(BUILDING_SIZE_PARAMS.large.hpMin, BUILDING_SIZE_PARAMS.large.hpMax);
    const largeColor = bLarge.colors[k % bLarge.colors.length];
    result.push(makeBuilding(wx, wy, "large", largeColor, bLarge, hp));
  }

  // 道路情報を埋め込む（描画用メタデータ。最初の建物に付属させる）
  if (result.length > 0) {
    result[0]._townMeta = {
      startX, startY, townW, townH,
      gridCols, gridRows, spacing: SMALL_SPACING,
    };
  }

  return result;
}

function makeBuilding(wx, wy, size, color, bConfig, hp) {
  return {
    wx,
    wy,
    size,
    color,
    shape:  randChoice(bConfig.shapes),
    radius: BUILDING_SIZE_PARAMS[size].radiusBase,
    maxHp:  hp,
    hp,
    fallen: false,
    attackTimer: Math.random() * bConfig.projectileInterval,
    attackRadius:        bConfig.attackRadius,
    projectileInterval:  bConfig.projectileInterval,
    projectileSpeed:     bConfig.projectileSpeed,
    projectileDamage:    bConfig.projectileDamage,
    projectileColor:     bConfig.projectileColor,
    projectileCount:     bConfig.projectileCount,
    projectileTracking:  bConfig.projectileTracking,
    projectileAoe:       bConfig.projectileAoe ?? 0,
    reward:              bConfig.reward,
    // ブレスヒットパーティクルのインターバルカウンタ
    _breathParticleTimer: 0,
  };
}

function generateStageLayout(stageIndex) {
  const config = STAGE_CONFIGS[stageIndex];
  const townCenters = placeTownCenters(config.townCount);

  const result = [];
  for (let t = 0; t < townCenters.length; t++) {
    const center = townCenters[t];
    const townBuildings = generateTown(
      center.x, center.y,
      config.smallPerTown,
      config.mediumPerTown,
      config.largePerTown,
      config,
      t,
    );
    for (const b of townBuildings) result.push(b);
  }
  return result;
}

// -----------------------------------------------------------------
// オフスクリーンCanvas: 建物の静的描画レイヤー
// 建物が壊れたときだけ部分再描画する
// -----------------------------------------------------------------
function rebuildBuildingLayer() {
  if (!buildingLayerCtx) return;
  const bctx = buildingLayerCtx;

  // 完全クリア
  bctx.clearRect(0, 0, WORLD_W, WORLD_H);

  // 道路ラインを先に描く（建物の下に来る）
  drawRoadsOnLayer(bctx);

  // 全建物を描画
  for (let s = 0; s < settlements.length; s++) {
    drawSettlementOnLayer(bctx, settlements[s]);
  }

  buildingLayerDirty = false;
}

function drawRoadsOnLayer(bctx) {
  // 各町のメタ情報から道路を描く
  for (let s = 0; s < settlements.length; s++) {
    const meta = settlements[s]._townMeta;
    if (!meta) continue;
    drawTownRoadsOnLayer(bctx, meta);
  }
}

function drawTownRoadsOnLayer(bctx, meta) {
  const { startX, startY, townW, townH, gridCols, gridRows, spacing } = meta;
  // 道路は建物間のすき間をうっすら明るく見せる（薄い線）
  bctx.strokeStyle = "rgba(200, 180, 140, 0.08)";
  bctx.lineWidth = spacing * 0.5;
  bctx.lineCap = "butt";

  // 横方向の道路（各行の中央）
  for (let row = 0; row <= gridRows; row++) {
    const y = startY + row * spacing;
    bctx.beginPath();
    bctx.moveTo(startX - spacing * 0.5, y);
    bctx.lineTo(startX + townW + spacing * 0.5, y);
    bctx.stroke();
  }
  // 縦方向の道路（各列の中央）
  for (let col = 0; col <= gridCols; col++) {
    const x = startX + col * spacing;
    bctx.beginPath();
    bctx.moveTo(x, startY - spacing * 0.5);
    bctx.lineTo(x, startY + townH + spacing * 0.5);
    bctx.stroke();
  }
}

function drawSettlementOnLayer(bctx, settlement) {
  const alpha = settlement.fallen ? 0.22 : 1.0;
  const color = settlement.fallen ? "#333" : settlement.color;

  bctx.save();
  bctx.globalAlpha = alpha;

  switch (settlement.shape) {
    case "circle":      drawCircleOnCtx(bctx, settlement.wx, settlement.wy, settlement.radius, color); break;
    case "square":      drawSquareOnCtx(bctx, settlement.wx, settlement.wy, settlement.radius, color); break;
    case "squareTower": drawSquareTowerOnCtx(bctx, settlement.wx, settlement.wy, settlement.radius, color); break;
    case "hexagon":     drawHexagonOnCtx(bctx, settlement.wx, settlement.wy, settlement.radius, color); break;
    case "triangle":    drawTriangleOnCtx(bctx, settlement.wx, settlement.wy, settlement.radius, color); break;
    case "polygon":     drawPolygonOnCtx(bctx, settlement.wx, settlement.wy, settlement.radius, color); break;
    case "star":        drawStarOnCtx(bctx, settlement.wx, settlement.wy, settlement.radius, color, 5); break;
    case "star4":       drawStarOnCtx(bctx, settlement.wx, settlement.wy, settlement.radius, color, 4); break;
    default:            drawCircleOnCtx(bctx, settlement.wx, settlement.wy, settlement.radius, color); break;
  }

  bctx.restore();
}

// -----------------------------------------------------------------
// 建物形状描画（オフスクリーン用・メインCanvas用共通）
// -----------------------------------------------------------------
function drawCircleOnCtx(c, wx, wy, r, color) {
  c.fillStyle = color;
  c.strokeStyle = "rgba(255,255,255,0.4)";
  c.lineWidth = 1.5;
  c.beginPath();
  c.arc(wx, wy, r, 0, Math.PI * 2);
  c.fill();
  c.stroke();
}

function drawSquareOnCtx(c, wx, wy, r, color) {
  c.fillStyle = color;
  c.strokeStyle = "rgba(255,255,255,0.35)";
  c.lineWidth = 1.5;
  c.fillRect(wx - r, wy - r, r * 2, r * 2);
  c.strokeRect(wx - r, wy - r, r * 2, r * 2);
}

function drawSquareTowerOnCtx(c, wx, wy, r, color) {
  c.fillStyle = color;
  c.strokeStyle = "rgba(255,255,255,0.4)";
  c.lineWidth = 1.5;
  c.fillRect(wx - r, wy - r, r * 2, r * 2);
  c.strokeRect(wx - r, wy - r, r * 2, r * 2);
  const towerSize = r * 0.4;
  const positions = [
    [wx - r, wy - r], [wx + r - towerSize, wy - r],
    [wx - r, wy + r - towerSize], [wx + r - towerSize, wy + r - towerSize],
  ];
  c.fillStyle = shadeColor(color, -20);
  for (const [tx, ty] of positions) {
    c.fillRect(tx, ty, towerSize, towerSize);
  }
}

function drawHexagonOnCtx(c, wx, wy, r, color) {
  c.fillStyle = color;
  c.strokeStyle = "rgba(255,255,255,0.5)";
  c.lineWidth = 1.5;
  c.beginPath();
  for (let k = 0; k < 6; k++) {
    const angle = (k * Math.PI * 2) / 6 - Math.PI / 6;
    if (k === 0) c.moveTo(wx + Math.cos(angle) * r, wy + Math.sin(angle) * r);
    else c.lineTo(wx + Math.cos(angle) * r, wy + Math.sin(angle) * r);
  }
  c.closePath();
  c.fill();
  c.stroke();
}

function drawTriangleOnCtx(c, wx, wy, r, color) {
  c.fillStyle = color;
  c.strokeStyle = "rgba(255,255,255,0.45)";
  c.lineWidth = 1.5;
  c.beginPath();
  c.moveTo(wx, wy - r);
  c.lineTo(wx + r * 0.9, wy + r * 0.7);
  c.lineTo(wx - r * 0.9, wy + r * 0.7);
  c.closePath();
  c.fill();
  c.stroke();
}

function drawPolygonOnCtx(c, wx, wy, r, color) {
  c.fillStyle = color;
  c.strokeStyle = "rgba(255,255,255,0.3)";
  c.lineWidth = 1.5;
  const sides = 5 + ((Math.round(wx + wy) % 3));
  c.beginPath();
  for (let k = 0; k < sides; k++) {
    const baseAngle = (k * Math.PI * 2) / sides;
    const jitter = 0.65 + 0.35 * ((Math.sin(k * 13.7 + wx * 0.01) + 1) * 0.5);
    const rx = wx + Math.cos(baseAngle) * r * jitter;
    const ry = wy + Math.sin(baseAngle) * r * jitter;
    if (k === 0) c.moveTo(rx, ry);
    else c.lineTo(rx, ry);
  }
  c.closePath();
  c.fill();
  c.stroke();
}

function drawStarOnCtx(c, wx, wy, r, color, spikes) {
  c.fillStyle = color;
  c.strokeStyle = "rgba(255,255,255,0.4)";
  c.lineWidth = 1.5;
  c.beginPath();
  const innerR = r * 0.50;
  for (let k = 0; k < spikes * 2; k++) {
    const angle = (k * Math.PI) / spikes - Math.PI / 2;
    const rad = k % 2 === 0 ? r : innerR;
    if (k === 0) c.moveTo(wx + Math.cos(angle) * rad, wy + Math.sin(angle) * rad);
    else c.lineTo(wx + Math.cos(angle) * rad, wy + Math.sin(angle) * rad);
  }
  c.closePath();
  c.fill();
  c.stroke();
}

// -----------------------------------------------------------------
// 投射物プール（最大200個）
// -----------------------------------------------------------------
const MAX_PROJECTILES = 200;

const projWx        = new Float32Array(MAX_PROJECTILES);
const projWy        = new Float32Array(MAX_PROJECTILES);
const projVx        = new Float32Array(MAX_PROJECTILES);
const projVy        = new Float32Array(MAX_PROJECTILES);
const projActive    = new Uint8Array(MAX_PROJECTILES);
const projDmg       = new Float32Array(MAX_PROJECTILES);
const projAoe       = new Float32Array(MAX_PROJECTILES);
const projTracking  = new Uint8Array(MAX_PROJECTILES);
const projTargetIdx = new Int32Array(MAX_PROJECTILES);
const projColor     = new Array(MAX_PROJECTILES).fill("#fff");
const projTailX     = new Float32Array(MAX_PROJECTILES);
const projTailY     = new Float32Array(MAX_PROJECTILES);

function spawnProjectile(fromWx, fromWy, targetBoidIdx, speed, damage, color, aoe, isTracking) {
  let slot = -1;
  for (let i = 0; i < MAX_PROJECTILES; i++) {
    if (!projActive[i]) { slot = i; break; }
  }
  if (slot < 0) return;

  projActive[slot]     = 1;
  projWx[slot]         = fromWx;
  projWy[slot]         = fromWy;
  projTailX[slot]      = fromWx;
  projTailY[slot]      = fromWy;
  projDmg[slot]        = damage;
  projAoe[slot]        = aoe ?? 0;
  projTracking[slot]   = isTracking ? 1 : 0;
  projTargetIdx[slot]  = targetBoidIdx;
  projColor[slot]      = color;

  if (targetBoidIdx >= 0 && !boidDead[targetBoidIdx]) {
    const dx = px[targetBoidIdx] - fromWx;
    const dy = py[targetBoidIdx] - fromWy;
    const d  = Math.sqrt(dx * dx + dy * dy) || 1;
    projVx[slot] = (dx / d) * speed;
    projVy[slot] = (dy / d) * speed;
  } else {
    projVx[slot] = speed;
    projVy[slot] = 0;
  }
}

function findNearestAliveBoid(wx, wy) {
  let nearest = -1;
  let nearestDist2 = Infinity;
  for (let i = 0; i < N; i++) {
    if (boidDead[i]) continue;
    const dx = px[i] - wx;
    const dy = py[i] - wy;
    const d2 = dx * dx + dy * dy;
    if (d2 < nearestDist2) {
      nearestDist2 = d2;
      nearest = i;
    }
  }
  return nearest;
}

// 建物のSpatial Hash（ブレス射程判定用）
// 建物は静的なのでステージ生成時に1回だけ構築する
const buildingGrid = new Map();
const BUILDING_GRID_CELL = 100; // セルサイズ（px）

function buildingGridClear() { buildingGrid.clear(); }

function buildingGridInsert(settlementIdx, wx, wy) {
  const cx = (wx / BUILDING_GRID_CELL) | 0;
  const cy = (wy / BUILDING_GRID_CELL) | 0;
  const key = cx * 100003 + cy;
  let bucket = buildingGrid.get(key);
  if (!bucket) { bucket = []; buildingGrid.set(key, bucket); }
  bucket.push(settlementIdx);
}

function buildingGridQuery(wx, wy, out) {
  out.length = 0;
  const cx = (wx / BUILDING_GRID_CELL) | 0;
  const cy = (wy / BUILDING_GRID_CELL) | 0;
  // BREATH_RANGE 80px を BUILDING_GRID_CELL 100px で割ると1セル以内に収まる
  for (let dy = -1; dy <= 1; dy++) {
    for (let dx = -1; dx <= 1; dx++) {
      const key = (cx + dx) * 100003 + (cy + dy);
      const b = buildingGrid.get(key);
      if (b) for (const idx of b) out.push(idx);
    }
  }
}

function rebuildBuildingGrid() {
  buildingGridClear();
  for (let s = 0; s < settlements.length; s++) {
    if (!settlements[s].fallen) {
      buildingGridInsert(s, settlements[s].wx, settlements[s].wy);
    }
  }
}

// 建物Spatial Hashの近傍クエリ用バッファ
const _buildingNeighbourBuf = [];

function updateSettlementAttacks(dt) {
  for (let s = 0; s < settlements.length; s++) {
    const settlement = settlements[s];
    if (settlement.fallen) continue;

    let inRange = false;
    const atkR2 = settlement.attackRadius * settlement.attackRadius;
    for (let i = 0; i < N; i++) {
      if (boidDead[i]) continue;
      const dx = px[i] - settlement.wx;
      const dy = py[i] - settlement.wy;
      if (dx * dx + dy * dy < atkR2) { inRange = true; break; }
    }
    if (!inRange) continue;

    settlement.attackTimer -= dt;
    if (settlement.attackTimer > 0) continue;
    settlement.attackTimer = settlement.projectileInterval;

    const targetIdx = findNearestAliveBoid(settlement.wx, settlement.wy);
    if (targetIdx < 0) continue;

    const count = settlement.projectileCount;
    if (count === 1) {
      spawnProjectile(
        settlement.wx, settlement.wy,
        targetIdx,
        settlement.projectileSpeed,
        settlement.projectileDamage,
        settlement.projectileColor,
        settlement.projectileAoe,
        settlement.projectileTracking,
      );
    } else if (count === 2) {
      const baseAngle = calcAngleToTarget(settlement.wx, settlement.wy, targetIdx);
      for (let k = -1; k <= 0; k++) {
        spawnFanProjectileRaw(
          settlement.wx, settlement.wy,
          baseAngle + k * 0.4,
          settlement.projectileSpeed,
          settlement.projectileDamage,
          settlement.projectileColor,
        );
      }
    } else if (count === 3) {
      const baseAngle = calcAngleToTarget(settlement.wx, settlement.wy, targetIdx);
      for (let k = -1; k <= 1; k++) {
        spawnFanProjectileRaw(
          settlement.wx, settlement.wy,
          baseAngle + k * 0.3,
          settlement.projectileSpeed,
          settlement.projectileDamage,
          settlement.projectileColor,
        );
      }
    } else {
      const angleStep = (Math.PI * 2) / count;
      const baseAngle = Math.random() * Math.PI * 2;
      for (let k = 0; k < count; k++) {
        spawnFanProjectileRaw(
          settlement.wx, settlement.wy,
          baseAngle + k * angleStep,
          settlement.projectileSpeed,
          settlement.projectileDamage,
          settlement.projectileColor,
        );
      }
    }
  }
}

function calcAngleToTarget(fromX, fromY, targetBoidIdx) {
  if (targetBoidIdx < 0) return 0;
  return Math.atan2(py[targetBoidIdx] - fromY, px[targetBoidIdx] - fromX);
}

function spawnFanProjectileRaw(fromWx, fromWy, angle, speed, damage, color) {
  let slot = -1;
  for (let i = 0; i < MAX_PROJECTILES; i++) {
    if (!projActive[i]) { slot = i; break; }
  }
  if (slot < 0) return;
  projActive[slot]     = 1;
  projWx[slot]         = fromWx;
  projWy[slot]         = fromWy;
  projTailX[slot]      = fromWx;
  projTailY[slot]      = fromWy;
  projVx[slot]         = Math.cos(angle) * speed;
  projVy[slot]         = Math.sin(angle) * speed;
  projDmg[slot]        = damage;
  projAoe[slot]        = 0;
  projTracking[slot]   = 0;
  projTargetIdx[slot]  = -1;
  projColor[slot]      = color;
}

function updateProjectiles(dt) {
  for (let i = 0; i < MAX_PROJECTILES; i++) {
    if (!projActive[i]) continue;

    if (projTracking[i] && projTargetIdx[i] >= 0 && !boidDead[projTargetIdx[i]]) {
      const dx = px[projTargetIdx[i]] - projWx[i];
      const dy = py[projTargetIdx[i]] - projWy[i];
      const d  = Math.sqrt(dx * dx + dy * dy) || 1;
      const currentSpeed = Math.sqrt(projVx[i] * projVx[i] + projVy[i] * projVy[i]);
      projVx[i] += (dx / d * currentSpeed - projVx[i]) * 0.06;
      projVy[i] += (dy / d * currentSpeed - projVy[i]) * 0.06;
    }

    projTailX[i] = projWx[i];
    projTailY[i] = projWy[i];

    projWx[i] += projVx[i] * dt;
    projWy[i] += projVy[i] * dt;

    if (projWx[i] < -50 || projWx[i] > WORLD_W + 50 || projWy[i] < -50 || projWy[i] > WORLD_H + 50) {
      projActive[i] = 0;
      continue;
    }

    checkProjectileHitBoids(i);
  }
}

function checkProjectileHitBoids(projIdx) {
  const HIT_R  = 8;
  const HIT_R2 = HIT_R * HIT_R;
  for (let i = 0; i < N; i++) {
    if (boidDead[i]) continue;
    const dx = projWx[projIdx] - px[i];
    const dy = projWy[projIdx] - py[i];
    if (dx * dx + dy * dy < HIT_R2) {
      if (projAoe[projIdx] > 0) {
        applyAoeProjectileDamage(projWx[projIdx], projWy[projIdx], projAoe[projIdx], projDmg[projIdx]);
      } else {
        applyDamageToBoid(i, projDmg[projIdx]);
      }
      spawnHitParticles(projWx[projIdx], projWy[projIdx]);
      projActive[projIdx] = 0;
      return;
    }
  }
}

function applyAoeProjectileDamage(wx, wy, aoeR, damage) {
  const r2 = aoeR * aoeR;
  for (let i = 0; i < N; i++) {
    if (boidDead[i]) continue;
    const dx = wx - px[i];
    const dy = wy - py[i];
    if (dx * dx + dy * dy < r2) {
      applyDamageToBoid(i, damage);
    }
  }
}

// -----------------------------------------------------------------
// ブレス攻撃（レーザー照射）
// 近接ダメージの代替: ドラゴンが射程内の最近建物へ連続照射
// ブレスデータは描画フェーズで使えるよう毎フレーム収集する
// -----------------------------------------------------------------

// ブレス情報バッファ: { boidIdx, settlementIdx, hitX, hitY } の配列
// 毎フレームのupdate時に構築し、draw時に参照する
const activeBreaths = [];

// ブレスのアニメーション時間（sin揺らぎ用）
let breathTime = 0;

function updateBreathAttacks(dt) {
  if (gameState !== "playing") return;

  breathTime += dt;
  activeBreaths.length = 0;

  const BREATH_R2 = BREATH_RANGE * BREATH_RANGE;
  const combatParams = FORMATION_COMBAT[currentFormation];
  // 毎秒ダメージ × dt × 隊形倍率
  const damageThisFrame = BREATH_DAMAGE_PER_SEC * dt * combatParams.attackMultiplier;

  // Spatial Hash を使ってブレス射程内の建物候補を絞る
  for (let i = 0; i < N; i++) {
    if (boidDead[i]) continue;

    // 各ドラゴンの最近建物を1つだけ探す（射程内に限定）
    buildingGridQuery(px[i], py[i], _buildingNeighbourBuf);

    let nearestSettlementIdx = -1;
    let nearestDist2 = BREATH_R2 + 1;

    for (const sIdx of _buildingNeighbourBuf) {
      const settlement = settlements[sIdx];
      if (!settlement || settlement.fallen) continue;
      const dx = settlement.wx - px[i];
      const dy = settlement.wy - py[i];
      const d2 = dx * dx + dy * dy;
      if (d2 < nearestDist2) {
        nearestDist2 = d2;
        nearestSettlementIdx = sIdx;
      }
    }

    if (nearestSettlementIdx < 0) continue;

    const settlement = settlements[nearestSettlementIdx];

    // ダメージ適用
    settlement.hp -= damageThisFrame;

    // ヒットパーティクル（0.2秒間引き）
    settlement._breathParticleTimer -= dt;
    if (settlement._breathParticleTimer <= 0) {
      settlement._breathParticleTimer = BREATH_PARTICLE_INTERVAL;
      spawnHitParticles(
        settlement.wx + (Math.random() - 0.5) * settlement.radius,
        settlement.wy + (Math.random() - 0.5) * settlement.radius,
      );
    }

    // 建物破壊チェック
    if (settlement.hp <= 0 && !settlement.fallen) {
      settlementFall(nearestSettlementIdx);
      // 破壊された建物のグリッドエントリを更新（次フレームで再構築される）
      buildingLayerDirty = true;
    }

    // ブレス描画データを収集
    activeBreaths.push({
      boidIdx: i,
      targetWx: settlement.wx,
      targetWy: settlement.wy,
    });
  }
}

// -----------------------------------------------------------------
// 変更2: 直接衝突攻撃（ドラゴンが建物に体当たりしたときのダメージ＋ヒットストップ）
// 群れの流れを止めないよう、衝突しても押し戻しはせず通過させる。
// かわりにクールダウンで連続ヒットを防ぎ、単発の重い一撃感を出す。
// -----------------------------------------------------------------
function updateCollisionAttacks(dt) {
  if (gameState !== "playing") return;

  // ヒットストップタイマーとクールダウンを先に進める
  for (let i = 0; i < N; i++) {
    if (boidHitStopTimer[i] > 0)      boidHitStopTimer[i]    = Math.max(0, boidHitStopTimer[i] - dt);
    if (boidCollisionCooldown[i] > 0) boidCollisionCooldown[i] = Math.max(0, boidCollisionCooldown[i] - dt);
  }

  for (let i = 0; i < N; i++) {
    if (boidDead[i]) continue;
    // クールダウン中はこの個体の衝突判定をスキップ
    if (boidCollisionCooldown[i] > 0) continue;

    // Spatial Hash で近傍建物を取得（BREATH_RANGE と同じグリッドを流用）
    buildingGridQuery(px[i], py[i], _buildingNeighbourBuf);

    for (const sIdx of _buildingNeighbourBuf) {
      const s = settlements[sIdx];
      if (!s || s.fallen) continue;

      // 衝突判定: ドラゴン半径6px + 建物半径 の合計以内に入ったら衝突
      const collideR = s.radius + 6;
      const dx = s.wx - px[i];
      const dy = s.wy - py[i];
      if (dx * dx + dy * dy > collideR * collideR) continue;

      // --- 衝突発生 ---

      // 建物にダメージ（ブレスより大きい単発ダメージ）
      s.hp -= COLLISION_DAMAGE;

      // ヒットストップ: この個体だけ一瞬止める（3フレーム相当）
      boidHitStopTimer[i]    = HITSTOP_DURATION;
      // クールダウンをセットして同じ建物への連続ヒットを防ぐ
      boidCollisionCooldown[i] = COLLISION_COOLDOWN;

      // 強めのパーティクル（破片が飛ぶ）
      spawnCollisionParticles(s.wx, s.wy);

      // 振動フィードバック（15ms）
      hapticPulse(15);

      // 建物破壊チェック
      if (s.hp <= 0 && !s.fallen) {
        settlementFall(sIdx);
        buildingLayerDirty = true;
      }

      // 1個体につき1建物までで打ち切り（同フレームで複数衝突しない）
      break;
    }
  }
}

// 衝突時の強めパーティクル（破片感）
function spawnCollisionParticles(wx, wy) {
  // 通常のブレスパーティクルより多く、速く、広がりも大きい
  const count = 6 + Math.floor(Math.random() * 5); // 6〜10個
  let spawned = 0;
  for (let i = 0; i < MAX_PARTICLES && spawned < count; i++) {
    if (partActive[i]) continue;
    partActive[i] = 1;
    partX[i] = wx + (Math.random() - 0.5) * 12;
    partY[i] = wy + (Math.random() - 0.5) * 12;
    const angle = Math.random() * Math.PI * 2;
    // 通常の2〜3倍の初速で破片が吹き飛ぶ
    const speed = 80 + Math.random() * 160;
    partVx[i]   = Math.cos(angle) * speed;
    partVy[i]   = Math.sin(angle) * speed;
    // 寿命も少し長め
    partLife[i] = 0.25 + Math.random() * 0.20;
    spawned++;
  }
}

function settlementFall(settlementIndex) {
  const settlement = settlements[settlementIndex];
  settlement.fallen = true;
  settlement.hp = 0;

  const reward = settlement.reward;
  const eggCount = reward.eggMin + Math.floor(Math.random() * (reward.eggMax - reward.eggMin + 1));
  for (let k = 0; k < eggCount; k++) {
    const angle = Math.random() * Math.PI * 2;
    const r = settlement.radius + 10 + Math.random() * 40;
    spawnEgg(settlement.wx + Math.cos(angle) * r, settlement.wy + Math.sin(angle) * r);
  }

  hapticPulse(80);
  // 建物レイヤーを部分的に再描画（fallen状態に更新）
  if (buildingLayerCtx) {
    const bc = buildingLayerCtx;
    const padding = settlement.radius + 4;
    bc.clearRect(
      settlement.wx - padding,
      settlement.wy - padding,
      padding * 2,
      padding * 2,
    );
    drawSettlementOnLayer(bc, settlement);
  }
  // 建物グリッドも更新
  rebuildBuildingGrid();
  updateHUDBuildings();

  const remaining = settlements.filter(s => !s.fallen).length;
  if (remaining === 0) {
    triggerStageClear();
  }
}

// -----------------------------------------------------------------
// Spatial Hash（自軍用）
// -----------------------------------------------------------------
const grid = new Map();

function gridKey(cx, cy) { return (cx * 73856093 ^ cy * 19349663); }
function gridClear() { grid.clear(); }
function gridInsert(index, x, y, cellSize) {
  const cx = (x / cellSize) | 0;
  const cy = (y / cellSize) | 0;
  const k  = gridKey(cx, cy);
  let bucket = grid.get(k);
  if (!bucket) { bucket = []; grid.set(k, bucket); }
  bucket.push(index);
}
function gridQuery(x, y, cellSize, out) {
  out.length = 0;
  const cx = (x / cellSize) | 0;
  const cy = (y / cellSize) | 0;
  for (let dy = -1; dy <= 1; dy++) {
    for (let dx = -1; dx <= 1; dx++) {
      const b = grid.get(gridKey(cx + dx, cy + dy));
      if (b) for (let i = 0; i < b.length; i++) out.push(b[i]);
    }
  }
}

// -----------------------------------------------------------------
// Boids SoA — 自軍（ワールド座標で管理）
// -----------------------------------------------------------------
const MAX_BOIDS = 20;
let N = 0;
let px, py, vx, vy;
let boidHp;
let boidDead;
let boidFadeTimer;
let formationLerp;
let formationDelay;
// 変更2: 衝突ヒットストップタイマー（>0の間、その個体を停止させる）
let boidHitStopTimer;
// 変更2: 衝突クールダウン（建物インデックスごとに記録）
// boidCollisionCooldown[i] は「最後に衝突した時刻からの残り秒数」
let boidCollisionCooldown;

// 変更4: 竜のHP を10倍（3 → 30）にして群れが簡単に壊滅しなくなる
const BOID_MAX_HP   = 30;
const FADE_DURATION = 0.3;
const TRANSITION_SECS = 0.15;
const JITTER_MAX = 0.08;

// 変更2: 衝突攻撃パラメータ
// ブレスより大きい単発ダメージ（毎秒換算ではなく1ヒット）
const COLLISION_DAMAGE      = 8;
// 衝突後の再発動クールダウン（同じドラゴンが同じ建物に連続ヒットしない）
const COLLISION_COOLDOWN    = 0.5; // 秒
// ヒットストップ持続（フレーム数を秒換算: 3フレーム≒0.048秒）
const HITSTOP_DURATION      = 0.048;

function initBoids() {
  N = MAX_BOIDS;
  px                  = new Float32Array(N);
  py                  = new Float32Array(N);
  vx                  = new Float32Array(N);
  vy                  = new Float32Array(N);
  boidHp              = new Float32Array(N);
  boidDead            = new Uint8Array(N);
  boidFadeTimer       = new Float32Array(N);
  formationLerp       = new Float32Array(N);
  formationDelay      = new Float32Array(N);
  // 変更2: ヒットストップ＋衝突クールダウン配列
  boidHitStopTimer    = new Float32Array(N);
  boidCollisionCooldown = new Float32Array(N);
  // 尻尾角度履歴リングバッファ（TAIL_SEGS個前までの進行角度）
  boidAngleHistory    = new Float32Array(N * TAIL_SEGS);

  const startWx = 250;
  const startWy = WORLD_H * 0.5;
  for (let i = 0; i < N; i++) {
    const r = Math.random() * 80;
    const a = Math.random() * Math.PI * 2;
    px[i] = startWx + Math.cos(a) * r;
    py[i] = startWy + Math.sin(a) * r;
    const ang = Math.random() * Math.PI * 2;
    vx[i] = Math.cos(ang) * BASE_CFG.minSpeed;
    vy[i] = Math.sin(ang) * BASE_CFG.minSpeed;
    boidHp[i]        = BOID_MAX_HP;
    boidDead[i]      = 0;
    boidFadeTimer[i] = 0;
    formationLerp[i]  = 1.0;
    formationDelay[i] = 0;
    // 尻尾角度履歴：初期値は現在の進行角度で埋める
    for (let s = 0; s < TAIL_SEGS; s++) {
      boidAngleHistory[i * TAIL_SEGS + s] = ang;
    }
  }
}

function resetBoidsPositionForNextStage() {
  const startWx = 250;
  const startWy = WORLD_H * 0.5;
  for (let i = 0; i < N; i++) {
    if (boidDead[i]) continue;
    const r = Math.random() * 80;
    const a = Math.random() * Math.PI * 2;
    px[i] = startWx + Math.cos(a) * r;
    py[i] = startWy + Math.sin(a) * r;
    const ang = Math.random() * Math.PI * 2;
    vx[i] = Math.cos(ang) * BASE_CFG.minSpeed;
    vy[i] = Math.sin(ang) * BASE_CFG.minSpeed;
    formationLerp[i]  = 1.0;
    formationDelay[i] = 0;
  }
}

function countAliveBoids() {
  let count = 0;
  for (let i = 0; i < N; i++) {
    if (!boidDead[i]) count++;
  }
  return count;
}

// -----------------------------------------------------------------
// パーティクルプール（最大120個。建物増加でブレスパーティクルが増えるため）
// -----------------------------------------------------------------
const MAX_PARTICLES = 120;
const partX      = new Float32Array(MAX_PARTICLES);
const partY      = new Float32Array(MAX_PARTICLES);
const partVx     = new Float32Array(MAX_PARTICLES);
const partVy     = new Float32Array(MAX_PARTICLES);
const partLife   = new Float32Array(MAX_PARTICLES);
const partActive = new Uint8Array(MAX_PARTICLES);

function spawnHitParticles(wx, wy) {
  // ブレスの火花は少数（2〜4個）に抑えてパフォーマンスを確保
  const count = 2 + Math.floor(Math.random() * 3);
  let spawned = 0;
  for (let i = 0; i < MAX_PARTICLES && spawned < count; i++) {
    if (partActive[i]) continue;
    partActive[i] = 1;
    partX[i] = wx;
    partY[i] = wy;
    const angle = Math.random() * Math.PI * 2;
    const speed = 30 + Math.random() * 60;
    partVx[i]   = Math.cos(angle) * speed;
    partVy[i]   = Math.sin(angle) * speed;
    partLife[i] = 0.20 + Math.random() * 0.15;
    spawned++;
  }
}

function updateParticles(dt) {
  for (let i = 0; i < MAX_PARTICLES; i++) {
    if (!partActive[i]) continue;
    partX[i]    += partVx[i] * dt;
    partY[i]    += partVy[i] * dt;
    partVx[i]   *= 0.85;
    partVy[i]   *= 0.85;
    partLife[i] -= dt;
    if (partLife[i] <= 0) partActive[i] = 0;
  }
}

// -----------------------------------------------------------------
// 卵システム（ワールド座標）
// -----------------------------------------------------------------
const MAX_EGGS = 200;
const eggWx     = new Float32Array(MAX_EGGS);
const eggWy     = new Float32Array(MAX_EGGS);
const eggActive = new Uint8Array(MAX_EGGS);
let totalEggCount = 0;

function spawnEgg(wx, wy) {
  for (let i = 0; i < MAX_EGGS; i++) {
    if (eggActive[i]) continue;
    eggActive[i] = 1;
    eggWx[i] = wx;
    eggWy[i] = wy;
    return i;
  }
  return -1;
}

function collectNearbyEggs() {
  for (let e = 0; e < MAX_EGGS; e++) {
    if (!eggActive[e]) continue;
    for (let i = 0; i < N; i++) {
      if (boidDead[i]) continue;
      const dx = eggWx[e] - px[i];
      const dy = eggWy[e] - py[i];
      if (dx * dx + dy * dy < 60 * 60) {
        eggActive[e] = 0;
        totalEggCount++;
        break;
      }
    }
  }
}

let flashTimer = 0;
let flashColor = "";
let formationJustChanged = false;

function triggerFlash(color, duration) {
  flashTimer = duration ?? 0.1;
  flashColor = color;
}

// -----------------------------------------------------------------
// ステージ状態管理
// -----------------------------------------------------------------
let currentStage = 0;

let gameState = "playing";
let defeatTimer = 0;
let stageClearPhase = "none";
let stageClearTimer = 0;

const overlayEl    = document.getElementById("overlay");
const overlayTitle = document.getElementById("overlay-title");
const retryBtn     = document.getElementById("retry-btn");

const stageOverlayEl = document.getElementById("stage-overlay");
const stageTextEl    = document.getElementById("stage-text");
const stageSubEl     = document.getElementById("stage-sub");

function triggerDefeat() {
  gameState   = "defeat";
  defeatTimer = 2.0;
  overlayEl.classList.add("visible");
  overlayTitle.textContent = "SCATTERED";
  setTimeout(() => {
    overlayTitle.classList.add("show");
    retryBtn.classList.add("visible");
  }, 400);
  hapticPulse(400);
}

function triggerStageClear() {
  if (gameState !== "playing") return;

  if (currentStage >= TOTAL_STAGES - 1) {
    triggerAllClear();
    return;
  }

  gameState = "stage-clear";
  stageClearPhase = "silence";
  stageClearTimer = 0.5;
  hapticPulse(150);
}

function triggerAllClear() {
  gameState = "all-clear";
  overlayEl.classList.add("visible");
  overlayTitle.textContent = "ALL CIVILIZATIONS CONQUERED";
  setTimeout(() => overlayTitle.classList.add("show"), 300);
  setTimeout(() => retryBtn.classList.add("visible"), 1500);
  hapticPulse(300);
}

function updateStageClearSequence(dt) {
  if (gameState !== "stage-clear") return;

  stageClearTimer -= dt;

  if (stageClearPhase === "silence" && stageClearTimer <= 0) {
    stageClearPhase = "flash";
    triggerFlash("rgba(255,255,200,0.85)", 0.25);
    stageClearTimer = 0.3;
  } else if (stageClearPhase === "flash" && stageClearTimer <= 0) {
    stageClearPhase = "text";
    const nextStage = currentStage + 1;
    const nextConfig = STAGE_CONFIGS[nextStage];
    stageTextEl.textContent = "STAGE " + (nextStage + 1);
    stageSubEl.textContent  = nextConfig.name;
    stageOverlayEl.classList.add("visible");
    stageClearTimer = 2.0;
  } else if (stageClearPhase === "text" && stageClearTimer <= 0) {
    stageClearPhase = "transition";
    stageOverlayEl.classList.remove("visible");
    advanceToNextStage();
  }
}

function advanceToNextStage() {
  currentStage++;
  gameState = "playing";
  stageClearPhase = "none";

  for (let i = 0; i < MAX_PROJECTILES; i++) projActive[i] = 0;
  for (let i = 0; i < MAX_PARTICLES; i++)   partActive[i] = 0;
  for (let e = 0; e < MAX_EGGS; e++)        eggActive[e] = 0;

  activeBreaths.length = 0;

  settlements = generateStageLayout(currentStage);
  rebuildBuildingGrid();
  buildingLayerDirty = true;
  rebuildBuildingLayer();

  resetBoidsPositionForNextStage();
  resetLeader();

  updateHUDStage();
  updateHUDBuildings();
}

function restartGame() {
  gameState       = "playing";
  defeatTimer     = 0;
  stageClearPhase = "none";
  stageClearTimer = 0;
  currentStage    = 0;
  totalEggCount   = 0;
  flashTimer      = 0;

  overlayEl.classList.remove("visible");
  overlayTitle.classList.remove("show");
  retryBtn.classList.remove("visible");
  stageOverlayEl.classList.remove("visible");

  for (let e = 0; e < MAX_EGGS; e++)          eggActive[e]  = 0;
  for (let i = 0; i < MAX_PROJECTILES; i++)   projActive[i] = 0;
  for (let i = 0; i < MAX_PARTICLES; i++)     partActive[i] = 0;

  activeBreaths.length = 0;

  settlements = generateStageLayout(0);
  rebuildBuildingGrid();
  buildingLayerDirty = true;
  rebuildBuildingLayer();

  initBoids();
  resetLeader();
  // 変更3: リスタート後も散開をデフォルトにする
  setFormation("spread");
  updateHUDEggs();
  updateHUDStage();
  updateHUDBuildings();
}

retryBtn.addEventListener("pointerdown", (e) => {
  e.stopPropagation();
  restartGame();
});

document.addEventListener("keydown", (e) => {
  if (e.key === "r" || e.key === "R") {
    if (gameState !== "playing") restartGame();
  }
});

// -----------------------------------------------------------------
// ウェイポイントパス（リーダー追従）
// -----------------------------------------------------------------
const PATH_MAX = 240;
const pathBuf = new Float32Array(PATH_MAX * 2);
let pathHead = 0;
let pathLen  = 0;
let leaderPathConsumeIdx = 0;

function pathGet(logicalIdx) {
  const ring = (pathHead - pathLen + logicalIdx + PATH_MAX) % PATH_MAX;
  return { x: pathBuf[ring * 2], y: pathBuf[ring * 2 + 1] };
}

function pathClear() {
  pathLen  = 0;
  pathHead = 0;
  leaderPathConsumeIdx = 0;
}

function pathPush(wx, wy) {
  if (pathLen > 0) {
    const last = pathGet(pathLen - 1);
    const dx = wx - last.x, dy = wy - last.y;
    const minSeg = Math.max(BASE_CFG.pathMinSegment, 30);
    if (dx * dx + dy * dy < minSeg * minSeg) return;
  }
  pathBuf[pathHead * 2]     = wx;
  pathBuf[pathHead * 2 + 1] = wy;
  pathHead = (pathHead + 1) % PATH_MAX;
  if (pathLen < PATH_MAX) pathLen++;
}

const leader = { x: 250, y: WORLD_H * 0.5, vx: 0, vy: 0 };

function resetLeader() {
  leader.x  = 250;
  leader.y  = WORLD_H * 0.5;
  leader.vx = 0;
  leader.vy = 0;
  pathClear();
  idleAngle = 0;
}

// -----------------------------------------------------------------
// 隊形管理
// -----------------------------------------------------------------
// 変更3: デフォルト隊形を散開にする
let currentFormation = "spread";
let prevFormation    = "spread";

function setFormation(name) {
  if (name === currentFormation) return;
  prevFormation    = currentFormation;
  currentFormation = name;
  for (let i = 0; i < N; i++) {
    formationLerp[i]  = 0;
    formationDelay[i] = Math.random() * JITTER_MAX;
  }
  hapticPulse(30);
  formationJustChanged = true;
  updateFormationButtons(name);
}

function updateFormationButtons(name) {
  document.querySelectorAll(".formation-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.formation === name);
  });
}

document.querySelectorAll(".formation-btn").forEach(btn => {
  btn.addEventListener("pointerdown", (e) => {
    e.stopPropagation();
    setFormation(btn.dataset.formation);
  });
});

// -----------------------------------------------------------------
// 触覚フィードバック
// -----------------------------------------------------------------
function hapticPulse(durationMs) {
  try { navigator.vibrate?.(durationMs); } catch (_) {}
}

// -----------------------------------------------------------------
// 入力システム（スクリーン座標 → ワールド座標変換）
// -----------------------------------------------------------------
let inputMode = "NONE";
let isDrawing = false;
let touchRing = { active: false, x: 0, y: 0 };

const TRAIL_LIFETIME = 1.2;
const trailPoints    = [];

function addTrailPoint(sx, sy, now) {
  if (trailPoints.length >= 400) trailPoints.shift();
  trailPoints.push({ x: sx, y: sy, bornAt: now });
}

function inputStart(sx, sy, now) {
  if (sy >= viewH - bottomUIHeight) {
    inputMode = "UI";
    return;
  }
  inputMode = "DRAW";
  isDrawing = true;
  pathClear();
  const w = screenToWorld(sx, sy);
  pathPush(w.x, w.y);
  addTrailPoint(w.x, w.y, now);
  touchRing.active = true;
  touchRing.x = sx;
  touchRing.y = sy;
  hapticPulse(10);
}

function inputMove(sx, sy, now) {
  if (inputMode !== "DRAW") return;
  const w = screenToWorld(sx, sy);
  pathPush(w.x, w.y);
  addTrailPoint(w.x, w.y, now);
  touchRing.x = sx;
  touchRing.y = sy;
}

function inputEnd() {
  isDrawing = false;
  inputMode = "NONE";
  touchRing.active = false;
}

canvas.addEventListener("touchstart", (e) => {
  const t = e.touches[0];
  inputStart(t.clientX, t.clientY, performance.now());
  e.preventDefault();
}, { passive: false });

canvas.addEventListener("touchmove", (e) => {
  const t = e.touches[0];
  inputMove(t.clientX, t.clientY, performance.now());
  e.preventDefault();
}, { passive: false });

canvas.addEventListener("touchend",    (e) => { inputEnd(); e.preventDefault(); }, { passive: false });
canvas.addEventListener("touchcancel", (e) => { inputEnd(); e.preventDefault(); }, { passive: false });

canvas.addEventListener("mousedown",  (e) => inputStart(e.clientX, e.clientY, performance.now()));
canvas.addEventListener("mousemove",  (e) => { if (isDrawing) inputMove(e.clientX, e.clientY, performance.now()); });
canvas.addEventListener("mouseup",    () => inputEnd());
canvas.addEventListener("mouseleave", () => inputEnd());

// -----------------------------------------------------------------
// アイドル旋回（ワールド座標でリーダーが徘徊）
// -----------------------------------------------------------------
let idleAngle = 0;
const IDLE_ANGULAR_SPEED = 0.35;

function getIdleLeaderTarget(dt) {
  idleAngle += IDLE_ANGULAR_SPEED * dt;
  const r = BASE_CFG.idleWanderRadius;
  const centroid = calcFriendlyCentroid();
  return {
    x: centroid.x + Math.cos(idleAngle) * r,
    y: centroid.y + Math.sin(idleAngle) * r * 0.6,
  };
}

// -----------------------------------------------------------------
// 自軍の重心（ワールド座標）
// -----------------------------------------------------------------
function calcFriendlyCentroid() {
  let cx = 0, cy = 0, count = 0;
  for (let i = 0; i < N; i++) {
    if (boidDead[i]) continue;
    cx += px[i];
    cy += py[i];
    count++;
  }
  if (count === 0) return { x: leader.x, y: leader.y };
  return { x: cx / count, y: cy / count };
}

// -----------------------------------------------------------------
// 消滅フェードタイマー更新
// -----------------------------------------------------------------
function updateDeathTimers(dt) {
  for (let i = 0; i < N; i++) {
    if (boidFadeTimer[i] > 0) boidFadeTimer[i] = Math.max(0, boidFadeTimer[i] - dt);
  }
}

function applyDamageToBoid(boidIndex, damage) {
  const combatParams = FORMATION_COMBAT[currentFormation];
  const effectiveDamage = damage * combatParams.hitRateMultiplier;
  boidHp[boidIndex] -= effectiveDamage;
  if (boidHp[boidIndex] <= 0 && !boidDead[boidIndex]) {
    boidDead[boidIndex]      = 1;
    boidFadeTimer[boidIndex] = FADE_DURATION;
  }
}

// -----------------------------------------------------------------
// ゲーム状態チェック
// -----------------------------------------------------------------
function checkGameConditions() {
  if (gameState !== "playing") return;
  if (countAliveBoids() === 0) {
    triggerDefeat();
  }
}

// -----------------------------------------------------------------
// Simulation step — 自軍Boids
// -----------------------------------------------------------------
const neighbours = [];

function buildFormationParams() {
  const ov = FORMATION_OVERRIDES[currentFormation] ?? {};
  return {
    perception:       ov.perception       ?? BASE_CFG.perception,
    separationRadius: ov.separationRadius ?? BASE_CFG.separationRadius,
    wSeparation:      ov.wSeparation      ?? BASE_CFG.wSeparation,
    wAlignment:       BASE_CFG.wAlignment,
    wCohesion:        ov.wCohesion        ?? BASE_CFG.wCohesion,
    ringRadius:       ov.ringRadius       ?? 0,
  };
}

function buildPrevFormationParams() {
  const ov = FORMATION_OVERRIDES[prevFormation] ?? {};
  return {
    perception:       ov.perception       ?? BASE_CFG.perception,
    separationRadius: ov.separationRadius ?? BASE_CFG.separationRadius,
    wSeparation:      ov.wSeparation      ?? BASE_CFG.wSeparation,
    wAlignment:       BASE_CFG.wAlignment,
    wCohesion:        ov.wCohesion        ?? BASE_CFG.wCohesion,
    ringRadius:       ov.ringRadius       ?? 0,
  };
}

function lerpVal(a, b, t) { return a + (b - a) * t; }

function simStep(dt) {
  updateLeader(dt);

  for (let i = 0; i < N; i++) {
    if (boidDead[i]) continue;
    if (formationDelay[i] > 0) {
      formationDelay[i] -= dt;
    } else if (formationLerp[i] < 1) {
      formationLerp[i] = Math.min(1, formationLerp[i] + dt / TRANSITION_SECS);
    }
  }

  // 変更2: ヒットストップ中の個体は移動・加速を計算するが位置更新をスキップ
  // （速度ベクトルは維持することで停止後にスムーズに動き出す）
  const boidHitStopped = boidHitStopTimer; // 参照を短縮

  const paramsNext = buildFormationParams();
  const paramsPrev = buildPrevFormationParams();

  gridClear();
  for (let i = 0; i < N; i++) {
    if (!boidDead[i]) gridInsert(i, px[i], py[i], paramsNext.perception);
  }

  for (let i = 0; i < N; i++) {
    if (boidDead[i]) continue;

    // ヒットストップ中は物理更新を丸ごとスキップして速度・向きも凍結する。
    // 位置だけ止めて速度を積分し続けると向き(atan2)が毎フレーム振れて
    // 三角形がチラついて見えるため（ちらつき報告の原因）。
    if (boidHitStopped[i] > 0) continue;

    const t    = formationLerp[i];
    const perc = lerpVal(paramsPrev.perception,       paramsNext.perception,       t);
    const sepR = lerpVal(paramsPrev.separationRadius, paramsNext.separationRadius, t);
    const wSep = lerpVal(paramsPrev.wSeparation,      paramsNext.wSeparation,      t);
    const wAli = paramsNext.wAlignment;
    const wCoh = lerpVal(paramsPrev.wCohesion,        paramsNext.wCohesion,        t);
    const ringR = lerpVal(paramsPrev.ringRadius,      paramsNext.ringRadius,       t);

    const perc2 = perc * perc;
    const sep2  = sepR * sepR;
    const xi = px[i], yi = py[i];

    let sepX = 0, sepY = 0;
    let aliX = 0, aliY = 0;
    let cohX = 0, cohY = 0;
    let nAli = 0, nCoh = 0;

    gridQuery(xi, yi, paramsNext.perception, neighbours);
    for (let k = 0; k < neighbours.length; k++) {
      const j = neighbours[k];
      if (j === i || boidDead[j]) continue;
      const dx = xi - px[j], dy = yi - py[j];
      const d2 = dx * dx + dy * dy;
      if (d2 > perc2 || d2 === 0) continue;
      if (d2 < sep2) {
        const invD = 1 / Math.sqrt(d2);
        sepX += dx * invD;
        sepY += dy * invD;
      }
      aliX += vx[j]; aliY += vy[j]; nAli++;
      cohX += px[j]; cohY += py[j]; nCoh++;
    }

    let ax = 0, ay = 0;
    ax += sepX * wSep * 80;
    ay += sepY * wSep * 80;

    if (nAli > 0) {
      const inv = 1 / nAli;
      ax += (aliX * inv - vx[i]) * wAli;
      ay += (aliY * inv - vy[i]) * wAli;
    }
    if (nCoh > 0) {
      const inv = 1 / nCoh;
      ax += (cohX * inv - xi) * wCoh;
      ay += (cohY * inv - yi) * wCoh;
    }

    {
      const ldx = leader.x - xi, ldy = leader.y - yi;
      const ld  = Math.sqrt(ldx * ldx + ldy * ldy) || 1;
      if (ringR > 0) {
        const targetX = leader.x - (ldx / ld) * ringR;
        const targetY = leader.y - (ldy / ld) * ringR;
        ax += (targetX - xi) * BASE_CFG.wLeader * 1.5;
        ay += (targetY - yi) * BASE_CFG.wLeader * 1.5;
      } else {
        ax += (ldx / ld) * BASE_CFG.wLeader * 120;
        ay += (ldy / ld) * BASE_CFG.wLeader * 120;
      }
    }

    const am = Math.sqrt(ax * ax + ay * ay);
    if (am > BASE_CFG.maxForce) { const s = BASE_CFG.maxForce / am; ax *= s; ay *= s; }

    let nvx = vx[i] + ax * dt;
    let nvy = vy[i] + ay * dt;
    const sp = Math.sqrt(nvx * nvx + nvy * nvy);
    if      (sp > BASE_CFG.maxSpeed) { const s = BASE_CFG.maxSpeed / sp; nvx *= s; nvy *= s; }
    else if (sp < BASE_CFG.minSpeed && sp > 0.0001) { const s = BASE_CFG.minSpeed / sp; nvx *= s; nvy *= s; }
    else if (sp <= 0.0001) { nvx = BASE_CFG.minSpeed; nvy = 0; }
    vx[i] = nvx; vy[i] = nvy;

    let nx = xi + nvx * dt;
    let ny = yi + nvy * dt;
    if (nx < 10)         { nx = 10;         vx[i] = Math.abs(vx[i]) * 0.5; }
    else if (nx > WORLD_W - 10) { nx = WORLD_W - 10; vx[i] = -Math.abs(vx[i]) * 0.5; }
    if (ny < 10)         { ny = 10;         vy[i] = Math.abs(vy[i]) * 0.5; }
    else if (ny > WORLD_H - 10) { ny = WORLD_H - 10; vy[i] = -Math.abs(vy[i]) * 0.5; }
    px[i] = nx; py[i] = ny;
  }
}

function updateLeader(dt) {
  if (pathLen > 0) {
    if (leaderPathConsumeIdx >= pathLen) leaderPathConsumeIdx = pathLen - 1;

    let tgt = pathGet(Math.min(leaderPathConsumeIdx, pathLen - 1));
    let dx = tgt.x - leader.x, dy = tgt.y - leader.y;
    let d2 = dx * dx + dy * dy;

    while (d2 < 24 * 24 && leaderPathConsumeIdx < pathLen - 1) {
      leaderPathConsumeIdx++;
      tgt = pathGet(leaderPathConsumeIdx);
      dx = tgt.x - leader.x; dy = tgt.y - leader.y;
      d2 = dx * dx + dy * dy;
    }

    const d = Math.sqrt(d2) || 1;
    const desiredVx = (dx / d) * BASE_CFG.leaderSpeed;
    const desiredVy = (dy / d) * BASE_CFG.leaderSpeed;
    leader.vx += (desiredVx - leader.vx) * Math.min(1, dt * 8);
    leader.vy += (desiredVy - leader.vy) * Math.min(1, dt * 8);
  } else {
    const target = getIdleLeaderTarget(dt);
    leader.vx += ((target.x - leader.x) * 0.8 - leader.vx) * Math.min(1, dt * 2.0);
    leader.vy += ((target.y - leader.y) * 0.8 - leader.vy) * Math.min(1, dt * 2.0);
  }

  leader.x += leader.vx * dt;
  leader.y += leader.vy * dt;
  leader.x = Math.max(0, Math.min(WORLD_W, leader.x));
  leader.y = Math.max(0, Math.min(WORLD_H, leader.y));
}

// -----------------------------------------------------------------
// 描画
// -----------------------------------------------------------------
function render(now) {
  const stageConfig = STAGE_CONFIGS[currentStage];
  ctx.fillStyle = stageConfig.bgColor;
  ctx.fillRect(0, 0, viewW, viewH);

  ctx.save();
  ctx.translate(-cam.x + viewW * 0.5, -cam.y + viewH * 0.5);

  drawWorldGrid();

  // 建物静的レイヤーをオフスクリーンCanvasからコピー（カメラオフセット適用済み）
  if (buildingLayerCanvas) {
    // drawImage の座標はすでにctx変換行列が適用されているので (0,0) から描く
    ctx.drawImage(buildingLayerCanvas, 0, 0);
  }

  // 攻撃射程リング（静的レイヤーの上に動的に描く）
  drawSettlementRanges();

  // HP バーは動的なので毎フレーム描画
  drawSettlementHPBars();

  drawEggs();
  drawBreathAttacks(now);
  drawBoids();
  drawProjectiles();
  drawParticles();

  // 軌跡はワールド座標で保持しているのでカメラ変換の内側で描く。
  // これでドラゴンが実際に追う経路と一致し、地面に固定されたまま流れる。
  drawTrail(now);

  ctx.restore();

  // 指先リングはスクリーン座標（指の現在位置）なのでカメラ変換の外で描く。
  drawTouchRing();
  drawFlash();

  if (gameState === "defeat") {
    const darkness = Math.min(0.75, 1 - defeatTimer / 2.0);
    ctx.fillStyle = `rgba(0,0,0,${darkness.toFixed(3)})`;
    ctx.fillRect(0, 0, viewW, viewH);
  }
}

function drawWorldGrid() {
  const stageConfig = STAGE_CONFIGS[currentStage];
  ctx.strokeStyle = stageConfig.gridColor;
  ctx.lineWidth = 1;
  const GRID_SIZE = 200;
  for (let x = 0; x <= WORLD_W; x += GRID_SIZE) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, WORLD_H);
    ctx.stroke();
  }
  for (let y = 0; y <= WORLD_H; y += GRID_SIZE) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(WORLD_W, y);
    ctx.stroke();
  }
  ctx.strokeStyle = "rgba(100, 120, 100, 0.4)";
  ctx.lineWidth = 2;
  ctx.strokeRect(0, 0, WORLD_W, WORLD_H);
}

function drawSettlementRanges() {
  // 攻撃射程を薄く表示（既存の動作を維持）
  for (let s = 0; s < settlements.length; s++) {
    const settlement = settlements[s];
    if (settlement.fallen) continue;

    ctx.strokeStyle = "rgba(180, 60, 60, 0.08)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(settlement.wx, settlement.wy, settlement.attackRadius, 0, Math.PI * 2);
    ctx.stroke();
  }
}

// HP バーのみ動的に描画（建物形状はオフスクリーンに焼き付け済み）
function drawSettlementHPBars() {
  for (let s = 0; s < settlements.length; s++) {
    const settlement = settlements[s];
    if (settlement.fallen) continue;

    const hpRatio = Math.max(0, settlement.hp / settlement.maxHp);
    const barW = settlement.radius * 2;
    const barX = settlement.wx - settlement.radius;
    const barY = settlement.wy - settlement.radius - 8;
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.fillRect(barX, barY, barW, 4);
    ctx.fillStyle = hpRatio > 0.5 ? "#50e070" : (hpRatio > 0.25 ? "#e0c040" : "#e04040");
    ctx.fillRect(barX, barY, barW * hpRatio, 4);
    ctx.globalAlpha = 1.0;
  }
}

// -----------------------------------------------------------------
// ブレス（レーザー）描画
// 口元から建物まで: 根元太く → 先端細く、sin波揺らぎ、橙〜赤グラデーション
// -----------------------------------------------------------------
function drawBreathAttacks(now) {
  if (activeBreaths.length === 0) return;

  ctx.save();
  ctx.lineCap = "round";

  for (let k = 0; k < activeBreaths.length; k++) {
    const breath = activeBreaths[k];
    const bIdx = breath.boidIdx;
    if (boidDead[bIdx]) continue;

    const fromX = px[bIdx];
    const fromY = py[bIdx];
    const toX   = breath.targetWx;
    const toY   = breath.targetWy;

    const dx = toX - fromX;
    const dy = toY - fromY;
    const dist = Math.sqrt(dx * dx + dy * dy) || 1;

    // sin波の揺らぎ（炎っぽさ）
    // 法線方向に ±2px の振動
    const normalX = -dy / dist;
    const normalY =  dx / dist;
    const wobble  = Math.sin(breathTime * 18 + bIdx * 2.3) * 2.0;

    // 制御点（中間点にオフセット）
    const midX = fromX + dx * 0.5 + normalX * wobble;
    const midY = fromY + dy * 0.5 + normalY * wobble;

    // グラデーション: 根元 橙(#ff8020) → 先端 深紅(#ff1000)
    const grad = ctx.createLinearGradient(fromX, fromY, toX, toY);
    grad.addColorStop(0.0, "rgba(255, 200, 60, 0.95)");   // 口元: 明るい橙
    grad.addColorStop(0.35, "rgba(255, 100, 20, 0.90)");  // 中間: 橙
    grad.addColorStop(1.0, "rgba(220, 20, 0, 0.80)");     // 先端: 深紅

    // 根元3px → 先端0.5px のテーパー線（2本描画で表現）
    // 外側グロー（薄く太め）
    ctx.strokeStyle = "rgba(255, 80, 0, 0.20)";
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(fromX, fromY);
    ctx.quadraticCurveTo(midX, midY, toX, toY);
    ctx.stroke();

    // メインレーザー
    ctx.strokeStyle = grad;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(fromX, fromY);
    ctx.quadraticCurveTo(midX, midY, toX, toY);
    ctx.stroke();

    // コア（白く輝く中心線）
    ctx.strokeStyle = "rgba(255, 255, 200, 0.70)";
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(fromX, fromY);
    ctx.quadraticCurveTo(midX, midY, toX, toY);
    ctx.stroke();

    // 命中点の輝点
    ctx.fillStyle = "rgba(255, 200, 80, 0.90)";
    ctx.beginPath();
    ctx.arc(toX, toY, 2.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "rgba(255, 255, 255, 0.80)";
    ctx.beginPath();
    ctx.arc(toX, toY, 1.0, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

function drawBoids() {
  // プリレンダスプライトのDPR（createDragonSprites で使ったものと一致させる）
  const spriteDpr     = Math.min(window.devicePixelRatio || 1, 2);
  const spritePx      = Math.ceil(DRAGON_SPRITE_LOGICAL * spriteDpr);
  const halfLogical   = DRAGON_SPRITE_LOGICAL / 2;
  const sprites       = dragonSprites["fire"]; // 現在は火属性のみ
  const palette       = DRAGON_ELEMENT_COLORS.fire;

  // スプライトがまだ生成されていない場合はフォールバック描画しない（ちらつき防止）
  if (!sprites || sprites.length === 0) return;

  // ---- 尻尾の緩和チェーン更新 ----
  // 先頭セグメントは現在の進行方向へ、後続は1つ前のセグメントへ、指数平滑で寄せる。
  // これにより尻尾は遅れて柔らかくしなる（生の履歴シフトのカクつきを排除）。
  // ヒットストップ中は vx/vy が凍結されるので尻尾はゆっくりまっすぐに落ち着く。
  for (let i = 0; i < N; i++) {
    if (boidDead[i] && boidFadeTimer[i] <= 0) continue;
    const base = i * TAIL_SEGS;
    const head = Math.atan2(vy[i], vx[i]);
    boidAngleHistory[base] = easeAngle(boidAngleHistory[base], head, TAIL_EASE_HEAD);
    for (let s = 1; s < TAIL_SEGS; s++) {
      boidAngleHistory[base + s] = easeAngle(boidAngleHistory[base + s], boidAngleHistory[base + s - 1], TAIL_EASE_SEG);
    }
  }

  for (let i = 0; i < N; i++) {
    if (boidDead[i] && boidFadeTimer[i] <= 0) continue;

    let alpha = 0.85;
    if (boidDead[i]) {
      alpha = (boidFadeTimer[i] / FADE_DURATION) * 0.85;
    }

    const wx    = px[i], wy = py[i];
    const angle = Math.atan2(vy[i], vx[i]);

    // ---- 羽ばたきフレーム選択 ----
    // breathTime（毎フレーム dt 加算済み）に個体ごとの位相オフセットを加算
    // → 群れが一斉でなくバラバラに羽ばたく
    const phase     = breathTime * DRAGON_FLAP_SPEED + BOID_FLAP_PHASE[i] * Math.PI * 2;
    // sin を 0〜1 に正規化してフレームインデックスへ
    const tNorm     = (Math.sin(phase) * 0.5 + 0.5);
    const frameIdx  = Math.floor(tNorm * DRAGON_FLAP_FRAMES) % DRAGON_FLAP_FRAMES;
    const sprite    = sprites[frameIdx];

    // ---- 尻尾（動的描画）----
    // 進行方向後方に TAIL_SEGS セグメントをカーブさせる。
    // 各セグメントは「過去の角度履歴」を逆方向に使い、旋回に遅れて追従する。
    // 速度が速いほど角度差が小さくなりまっすぐ伸び、急旋回ほど大きくしなる。
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.lineCap     = "round";
    ctx.lineJoin    = "round";

    // 尻尾の根元：胴体後端（進行方向の逆、約5px 後ろ）
    const tailRootOffX = -Math.cos(angle) * 5;
    const tailRootOffY = -Math.sin(angle) * 5;
    let segX = wx + tailRootOffX;
    let segY = wy + tailRootOffY;

    const base = i * TAIL_SEGS;
    // 速度の大きさで「尻尾のまっすぐ度」を調整（速いと旋回が少なくまっすぐ）
    const speed    = Math.sqrt(vx[i] * vx[i] + vy[i] * vy[i]);
    const maxSpeed = BASE_CFG.maxSpeed || 120;
    // speedRatio: 0（低速）〜1（最高速）。低速ほどしなりを強調
    const speedRatio = Math.min(1, speed / maxSpeed);
    // 時間ベースの微小揺れ（個体ごとに位相をずらす）
    const wobble = Math.sin(breathTime * 1.5 + BOID_FLAP_PHASE[i] * Math.PI * 2) * TAIL_WOBBLE;

    for (let s = 0; s < TAIL_SEGS; s++) {
      // s番目のセグメントは「s個前の角度履歴」の逆方向（後方）を使う
      // 旋回差：現在角度と履歴角度の差をセグメント方向に加える
      const histAngle  = boidAngleHistory[base + Math.min(s, TAIL_SEGS - 1)];
      // 旋回差を -π〜+π に正規化
      let   angleDiff  = histAngle - angle;
      while (angleDiff >  Math.PI) angleDiff -= Math.PI * 2;
      while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
      // しなり量：低速時に大きく、高速時に小さく。さらに時間揺れを足す
      const curl       = angleDiff * (1 - speedRatio * 0.6) + wobble * (1 - s / TAIL_SEGS);
      // セグメント方向：進行方向の逆 + 旋回差による横ずれ
      const segAngle   = angle + Math.PI + curl;
      const nextX      = segX + Math.cos(segAngle) * TAIL_SEG_LEN;
      const nextY      = segY + Math.sin(segAngle) * TAIL_SEG_LEN;

      // テーパリング：根元太く先細り
      const taper      = (1 - (s + 1) / (TAIL_SEGS + 1));
      const lineW      = Math.max(0.4, TAIL_WIDTH0 * taper);
      // 先端に向けて少し透明に
      const tailAlpha  = alpha * (0.75 + 0.25 * taper);

      ctx.globalAlpha  = tailAlpha;
      ctx.lineWidth    = lineW;
      ctx.strokeStyle  = palette.body;
      ctx.beginPath();
      ctx.moveTo(segX, segY);
      ctx.lineTo(nextX, nextY);
      ctx.stroke();

      segX = nextX;
      segY = nextY;
    }

    ctx.globalAlpha = 1.0;
    ctx.restore();

    // ---- drawImage（rotate→translate。毎フレームパスを引かない） ----
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(wx, wy);
    ctx.rotate(angle);
    // スプライト中心が竜の重心に来るよう -halfLogical オフセット
    ctx.drawImage(
      sprite,
      0, 0, spritePx, spritePx,             // ソース（物理px）
      -halfLogical, -halfLogical,             // デスト位置（論理px）
      DRAGON_SPRITE_LOGICAL, DRAGON_SPRITE_LOGICAL, // デストサイズ（論理px）
    );
    ctx.globalAlpha = 1.0;
    ctx.restore();

    // ---- HPバー（既存ロジックを維持） ----
    if (!boidDead[i] && boidHp[i] < BOID_MAX_HP) {
      const hpRatio = Math.max(0, boidHp[i] / BOID_MAX_HP);
      const barW = 14;
      ctx.fillStyle = "rgba(0,0,0,0.5)";
      ctx.fillRect(wx - barW / 2, wy - 18, barW, 3);
      ctx.fillStyle = hpRatio > 0.5 ? "#4adf80" : "#f0604a";
      ctx.fillRect(wx - barW / 2, wy - 18, barW * hpRatio, 3);
    }
  }
}

function drawProjectiles() {
  for (let i = 0; i < MAX_PROJECTILES; i++) {
    if (!projActive[i]) continue;

    const sx = projWx[i] - cam.x + viewW * 0.5;
    const sy = projWy[i] - cam.y + viewH * 0.5;
    if (sx < -20 || sx > viewW + 20 || sy < -20 || sy > viewH + 20) continue;

    ctx.strokeStyle = projColor[i];
    ctx.lineWidth = 1.5;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(projTailX[i], projTailY[i]);
    ctx.lineTo(projWx[i], projWy[i]);
    ctx.stroke();

    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(projWx[i], projWy[i], 2, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawParticles() {
  ctx.save();
  for (let i = 0; i < MAX_PARTICLES; i++) {
    if (!partActive[i]) continue;
    const lifeRatio = partLife[i] / 0.30;
    const alpha = Math.max(0, lifeRatio);
    const radius = 1.5 + lifeRatio * 2;
    // ブレスパーティクル: 火花色（橙〜赤）
    ctx.fillStyle = `rgba(255, ${(180 * lifeRatio) | 0}, 40, ${alpha.toFixed(3)})`;
    ctx.beginPath();
    ctx.arc(partX[i], partY[i], radius, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawEggs() {
  ctx.save();
  for (let e = 0; e < MAX_EGGS; e++) {
    if (!eggActive[e]) continue;
    ctx.fillStyle = "rgba(255, 200, 40, 0.90)";
    ctx.strokeStyle = "rgba(255, 240, 120, 0.60)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(eggWx[e], eggWy[e], 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  }
  ctx.restore();
}

function drawTrail(now) {
  if (trailPoints.length < 2) return;
  const cutoff = now - TRAIL_LIFETIME * 1000;
  while (trailPoints.length > 0 && trailPoints[0].bornAt < cutoff) {
    trailPoints.shift();
  }
  if (trailPoints.length < 2) return;

  for (let i = 1; i < trailPoints.length; i++) {
    const p    = trailPoints[i];
    const prev = trailPoints[i - 1];
    const ageRatio = (now - p.bornAt) / (TRAIL_LIFETIME * 1000);
    const alpha    = Math.max(0, 1 - ageRatio) * 0.35;
    ctx.strokeStyle = `rgba(140, 200, 255, ${alpha.toFixed(3)})`;
    ctx.lineWidth   = 2.5;
    ctx.lineCap     = "round";
    ctx.beginPath();
    ctx.moveTo(prev.x, prev.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  }
}

function drawTouchRing() {
  if (!touchRing.active) return;
  ctx.strokeStyle = "rgba(200, 230, 255, 0.30)";
  ctx.lineWidth   = 1.5;
  ctx.beginPath();
  ctx.arc(touchRing.x, touchRing.y, 20, 0, Math.PI * 2);
  ctx.stroke();
}

function drawFlash() {
  if (flashTimer <= 0) return;
  ctx.fillStyle = flashColor;
  ctx.fillRect(0, 0, viewW, viewH);
}

// -----------------------------------------------------------------
// ミニマップ描画
// -----------------------------------------------------------------
const MINIMAP_W = 80;
const MINIMAP_H = 60;

function drawMinimap() {
  const stageConfig = STAGE_CONFIGS[currentStage];
  minimapCtx.fillStyle = stageConfig.bgColor;
  minimapCtx.fillRect(0, 0, MINIMAP_W, MINIMAP_H);

  const scaleX = MINIMAP_W / WORLD_W;
  const scaleY = MINIMAP_H / WORLD_H;

  for (let s = 0; s < settlements.length; s++) {
    const settlement = settlements[s];
    const mx = settlement.wx * scaleX;
    const my = settlement.wy * scaleY;
    const dotR = settlement.size === "large" ? 3 : (settlement.size === "medium" ? 2 : 1.5);
    minimapCtx.fillStyle = settlement.fallen ? "#333" : settlement.color;
    minimapCtx.beginPath();
    minimapCtx.arc(mx, my, dotR, 0, Math.PI * 2);
    minimapCtx.fill();
  }

  const centroid = calcFriendlyCentroid();
  const mx = centroid.x * scaleX;
  const my = centroid.y * scaleY;
  minimapCtx.fillStyle = "rgba(255,255,255,0.9)";
  minimapCtx.beginPath();
  minimapCtx.arc(mx, my, 2, 0, Math.PI * 2);
  minimapCtx.fill();

  const vpLeft   = (cam.x - viewW * 0.5) * scaleX;
  const vpTop    = (cam.y - viewH * 0.5) * scaleY;
  const vpWidth  = viewW * scaleX;
  const vpHeight = viewH * scaleY;
  minimapCtx.strokeStyle = "rgba(120,200,255,0.25)";
  minimapCtx.lineWidth   = 0.5;
  minimapCtx.strokeRect(vpLeft, vpTop, vpWidth, vpHeight);
}

// -----------------------------------------------------------------
// HUD更新
// -----------------------------------------------------------------
let hudUpdateCounter = 0;
const hudAlive     = document.getElementById("h-alive");
const hudMax       = document.getElementById("h-max");
const hudEggs      = document.getElementById("h-eggs");
const hudStage     = document.getElementById("h-stage");
const hudBuildings = document.getElementById("h-buildings");

function updateHUD() {
  hudUpdateCounter++;
  if (hudUpdateCounter < 10) return;
  hudUpdateCounter = 0;

  const aliveCount = countAliveBoids();
  hudAlive.textContent = aliveCount;
  hudMax.textContent   = MAX_BOIDS;
  updateHUDEggs();
}

function updateHUDEggs() {
  hudEggs.textContent = totalEggCount;
}

function updateHUDStage() {
  hudStage.textContent = "STAGE " + (currentStage + 1) + "/" + TOTAL_STAGES;
}

function updateHUDBuildings() {
  const total     = settlements.length;
  const remaining = settlements.filter(s => !s.fallen).length;
  hudBuildings.textContent = remaining + "/" + total;
}

// -----------------------------------------------------------------
// FPS計測
// -----------------------------------------------------------------
let fpsFrames = 0;
let fpsLast   = performance.now();
let fpsEma    = 0;
const hudFps  = document.getElementById("h-fps");

function tickFps(now) {
  fpsFrames++;
  const elapsed = now - fpsLast;
  if (elapsed >= 500) {
    const fps  = (fpsFrames * 1000) / elapsed;
    fpsEma     = fpsEma === 0 ? fps : fpsEma * 0.7 + fps * 0.3;
    fpsFrames  = 0;
    fpsLast    = now;
    hudFps.textContent = fps.toFixed(1);
  }
}

// -----------------------------------------------------------------
// 竜スプライト（プリレンダ方式）
// -----------------------------------------------------------------
// 属性カラーパレット定義 — 将来の属性追加時はここに追加するだけでよい
const DRAGON_ELEMENT_COLORS = {
  // 各属性: { body, wing, rimAlpha }
  // bodyは胴体中心色、wingは翼の先端色、rimAlpha は縁の透明度
  fire:   { body: "rgba(120, 200, 255, 1.0)", wing: "rgba(80, 160, 255, 1.0)",  rim: "rgba(60, 120, 220, 0.0)" },
  ice:    { body: "rgba(180, 240, 255, 1.0)", wing: "rgba(140, 220, 255, 1.0)", rim: "rgba(100, 180, 240, 0.0)" },
  shadow: { body: "rgba(180, 100, 255, 1.0)", wing: "rgba(120, 60, 200, 1.0)",  rim: "rgba(80, 30, 160, 0.0)" },
};

// プリレンダ設定
const DRAGON_FLAP_FRAMES = 8;      // 羽ばたき1サイクルのフレーム数
const DRAGON_FLAP_SPEED  = 1.6;   // 羽ばたきサイクル毎秒（breathTime に掛ける係数）。
                                  // 低いほどゆったり滑空する。速いと虫のように見えるため抑えめ。

// スプライト1枚の論理サイズ（翼を広げた最大幅を内包する正方形）
// 胴体+翼+頭のみ（尻尾は動的描画に変更）
// 頭先 x=13 ～ 翼後端 x≈-9、翼高さ ±17 → 幅22×高34 → 対角 ceil(sqrt(22²+34²))≈41 → 52px で余裕あり
const DRAGON_SPRITE_LOGICAL = 52;

// 要素 × フレームのスプライトキャッシュ
// dragonSprites["fire"][frameIndex] = OffscreenCanvas or HTMLCanvasElement
const dragonSprites = {};

// 個体ごとの羽ばたき位相オフセット（index で決定的に割り当て）
// 0〜1 の値 × 2π がラジアン位相
const BOID_FLAP_PHASE = new Float32Array(20); // MAX_BOIDS=20
for (let i = 0; i < 20; i++) {
  // 黄金角分割でなるべく均等に散らす
  BOID_FLAP_PHASE[i] = (i * 0.618033988) % 1.0;
}

// -----------------------------------------------------------------
// 尻尾：動的描画パラメータ
// -----------------------------------------------------------------
// 各boidの過去の進行角度を保持するリングバッファ
// TAIL_SEGS セグメント分の角度を記録し、旋回に追従した「鞭のしなり」を実現する。
// MAX_BOIDS=20、TAIL_SEGS=5 → 100要素のFloat32Array（≈400Bytes）
const TAIL_SEGS     = 5;    // 尻尾セグメント数（多いほど滑らかだがコスト増）
const TAIL_SEG_LEN  = 4.5;  // 1セグメントの長さ（論理px）
const TAIL_WIDTH0   = 2.2;  // 根元の線幅（px）
const TAIL_WOBBLE   = 0.07; // 時間ベースの微小揺れ振幅（ラジアン）。過剰にならない値
// 尻尾は「緩和チェーン」で柔らかく追従させる。各フレーム、先頭は現在の進行方向へ、
// 後続セグメントは1つ前のセグメントへ、指数平滑で少しずつ寄っていく（バネ/鞭のしなり）。
// 係数が小さいほど遅れて柔らかくしなる。生の履歴をそのまま使うとカクつくため平滑化する。
const TAIL_EASE_HEAD = 0.18; // 先頭セグメントが現在の進行方向へ寄る速さ
const TAIL_EASE_SEG  = 0.16; // 後続セグメントが前セグメントへ寄る速さ
// boidAngleHistory[i * TAIL_SEGS + s] = 平滑化された各セグメントの向き
// s=0 が先頭（頭に近い）、s=TAIL_SEGS-1 が尾の先端
let boidAngleHistory; // initBoids() で確保

// 角度を最短回り（±π境界をまたがない）で target へ k だけ寄せる
function easeAngle(cur, target, k) {
  let d = target - cur;
  while (d >  Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return cur + d * k;
}

/**
 * 竜シルエットを1フレーム分オフスクリーンcanvasに描画して返す。
 * @param {string} element  "fire" | "ice" | "shadow"
 * @param {number} wingAngle  翼の上下角度（ラジアン）。0=水平、+はたたんだ方向
 * @param {number} spritePx  canvas物理解像度（= 論理サイズ × DPR）
 * @returns {HTMLCanvasElement}
 */
function renderDragonFrame(element, wingAngle, spritePx) {
  const oc = document.createElement("canvas");
  oc.width  = spritePx;
  oc.height = spritePx;
  const c = oc.getContext("2d");

  const palette = DRAGON_ELEMENT_COLORS[element] ?? DRAGON_ELEMENT_COLORS.fire;
  const half    = spritePx / 2;
  // 論理サイズ→物理ピクセルへのスケール
  const scale   = spritePx / DRAGON_SPRITE_LOGICAL;

  c.save();
  c.translate(half, half);
  c.scale(scale, scale);

  // --- 全体を半透明に --- globalAlpha でなく fillStyle/strokeStyle に埋め込む
  // 死亡フェードは drawBoids 側で globalAlpha を設定するためここでは 1.0 で焼く

  // ---- 胴体（細長い楕円形） ----
  // 注意: 尻尾は毎フレーム drawBoids() で動的描画するためここでは焼かない
  // +X が頭方向。胴体は x=-5〜+12 の範囲、中心y=0
  c.beginPath();
  c.ellipse(4, 0, 9, 3.2, 0, 0, Math.PI * 2);
  const bodyGrad = c.createRadialGradient(5, -1, 0.5, 4, 0, 9);
  bodyGrad.addColorStop(0.0, palette.body);
  bodyGrad.addColorStop(1.0, palette.rim);
  c.fillStyle = bodyGrad;
  c.fill();

  // ---- 翼（左右対称。wingAngle で上下に開閉） ----
  // 翼は胴体中央付近 (x=2, y=0) から伸びる。
  // wSpan: 翼の横方向長さ（水平から前後に広がる）
  // wUp/wDown: 翼先端の Y オフセット（wingAngle で変化）
  const wBase    = 2;   // 翼の付け根 x
  const wSpanX   = 15;  // 翼先端の x オフセット（斜め後方）。13→15 で横リーチ拡大
  const wDepth   = -5;  // 翼先端の x 前後ずれ（後退翼らしさ）
  const wOpen    = 17;  // 水平展開時の Y 振れ幅。13→17 で竜らしい翼幅に拡大

  // wingAngle が 0 = 水平（最大展開）、π/2 に近づく = たたんだ状態（翼を閉じる）
  const yOffset = Math.cos(wingAngle) * wOpen;   // 正= 下方向

  // 上翼
  drawWing(c, wBase, 0, wBase + wDepth, -yOffset, wSpanX, palette, +1);
  // 下翼
  drawWing(c, wBase, 0, wBase + wDepth,  yOffset, wSpanX, palette, -1);

  // ---- 頭（+X 方向の先端、小さな三角形の嘴） ----
  c.beginPath();
  c.moveTo(13, 0);    // 嘴先端
  c.lineTo(9, -2.0);
  c.lineTo(8,  0);
  c.lineTo(9,  2.0);
  c.closePath();
  c.fillStyle = palette.body;
  c.fill();

  // ---- 小さな角（頭部上部） ----
  c.beginPath();
  c.moveTo(11, -1.5);
  c.lineTo(13, -4);
  c.lineTo(10, -2.5);
  c.closePath();
  c.fillStyle = palette.wing;
  c.globalAlpha = 0.75;
  c.fill();
  c.globalAlpha = 1.0;

  c.restore();
  return oc;
}

/**
 * 翼を1枚描画するヘルパー
 * @param {CanvasRenderingContext2D} c
 * @param {number} bx  翼の付け根 x
 * @param {number} by  翼の付け根 y
 * @param {number} mx  翼の中間折り返し x
 * @param {number} my  翼の先端 y（上翼は負、下翼は正）
 * @param {number} spanX  翼先端の x オフセット（後退翼）
 * @param {Object} palette
 * @param {number} sign  +1=上翼 -1=下翼（グラデーション方向用）
 */
function drawWing(c, bx, by, mx, my, spanX, palette, sign) {
  // 翼の先端座標（後退翼: x が胴体より少し後ろへ）
  const tipX = mx - spanX * 0.4;
  const tipY = my;

  // 翼形状: 付け根→翼膜前縁→先端→翼膜後縁→付け根
  c.beginPath();
  c.moveTo(bx, by);
  // 前縁（進行方向側）
  c.quadraticCurveTo(bx + 4, my * 0.5, tipX, tipY);
  // 後縁（尾側）
  c.quadraticCurveTo(bx - 3, my * 0.6, bx, by);
  c.closePath();

  // グラデーション: 付け根は body色、先端は wing色（より透明）
  const grd = c.createLinearGradient(bx, by, tipX, tipY);
  grd.addColorStop(0.0, palette.body);
  grd.addColorStop(0.6, palette.wing);
  grd.addColorStop(1.0, palette.rim);
  c.fillStyle = grd;
  c.fill();

  // 翼の骨格ライン（輪郭を少し締める）
  c.strokeStyle = palette.wing;
  c.lineWidth   = 0.6;
  c.globalAlpha = 0.5;
  c.stroke();
  c.globalAlpha = 1.0;
}

/**
 * 起動時に全属性・全フレームのスプライトをプリレンダして dragonSprites に格納する。
 * 呼び出し後は毎フレームの drawBoids で drawImage するだけでよい。
 */
function createDragonSprites() {
  const spriteDpr  = Math.min(window.devicePixelRatio || 1, 2);
  const spritePx   = Math.ceil(DRAGON_SPRITE_LOGICAL * spriteDpr);

  for (const element of Object.keys(DRAGON_ELEMENT_COLORS)) {
    dragonSprites[element] = [];
    for (let f = 0; f < DRAGON_FLAP_FRAMES; f++) {
      // 羽ばたきの位相: 0〜2π を FLAP_FRAMES 分割
      // wingAngle: 0=水平（最大展開）→ π*0.65 = 約37度折りたたみ
      const phase     = (f / DRAGON_FLAP_FRAMES) * Math.PI * 2;
      const wingAngle = (Math.sin(phase) * 0.5 + 0.5) * (Math.PI * 0.65);
      dragonSprites[element].push(renderDragonFrame(element, wingAngle, spritePx));
    }
  }
}

// -----------------------------------------------------------------
// ユーティリティ
// -----------------------------------------------------------------
function shadeColor(hex, amount) {
  // hex は "#rrggbb" 形式
  let num;
  try {
    num = parseInt(hex.replace("#", ""), 16);
  } catch (_) {
    return hex;
  }
  const r = Math.min(255, Math.max(0, (num >> 16) + amount));
  const g = Math.min(255, Math.max(0, ((num >> 8) & 0xff) + amount));
  const b = Math.min(255, Math.max(0, (num & 0xff) + amount));
  return `rgb(${r},${g},${b})`;
}

// -----------------------------------------------------------------
// ゲームループ（setInterval固定16ms）
// -----------------------------------------------------------------
let lastTickTs = performance.now();

function tick() {
  const now  = performance.now();
  let dtMs   = now - lastTickTs;
  if (dtMs > BASE_CFG.maxDtMs) dtMs = BASE_CFG.maxDtMs;
  lastTickTs = now;
  const dt   = dtMs / 1000;

  if (gameState === "playing") {
    simStep(dt);
    updateCamera(dt);
    updateSettlementAttacks(dt);
    updateProjectiles(dt);
    updateBreathAttacks(dt);      // ブレス攻撃（レーザー照射）
    updateCollisionAttacks(dt);   // 変更2: 直接衝突ダメージ＋ヒットストップ
    updateDeathTimers(dt);
    updateParticles(dt);
    collectNearbyEggs();
    checkGameConditions();
  } else if (gameState === "stage-clear") {
    simStep(dt);
    updateCamera(dt);
    updateParticles(dt);
    updateStageClearSequence(dt);
  } else if (gameState === "defeat") {
    defeatTimer -= dt;
    updateDeathTimers(dt);
    updateParticles(dt);
    updateCamera(dt);
  } else if (gameState === "all-clear") {
    simStep(dt);
    updateCamera(dt);
  }

  if (flashTimer > 0) flashTimer = Math.max(0, flashTimer - dt);

  render(now);
  drawMinimap();
  updateHUD();
  tickFps(now);
}

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) lastTickTs = performance.now();
});

// -----------------------------------------------------------------
// 起動
// -----------------------------------------------------------------
function boot() {
  resize();
  // 竜スプライトを起動時に一度だけプリレンダする（DPR確定後に呼ぶこと）
  createDragonSprites();
  createBuildingLayer();
  settlements = generateStageLayout(0);
  rebuildBuildingGrid();
  rebuildBuildingLayer();
  initBoids();
  resetLeader();
  updateHUDStage();
  updateHUDBuildings();
  setInterval(tick, BASE_CFG.fixedStepMs);
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", boot);
} else {
  boot();
}
</script>
