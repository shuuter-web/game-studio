<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>竜潮 / Dragon Tide — Phase 2</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #08101a;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #stage { display: block; width: 100%; height: 100%; }

  /* 右上 HUD */
  #hud {
    position: fixed;
    top: env(safe-area-inset-top, 8px);
    right: 8px;
    padding: 6px 8px;
    background: rgba(8, 16, 26, 0.70);
    border: 1px solid rgba(120, 200, 255, 0.20);
    border-radius: 6px;
    font-family: -apple-system, BlinkMacSystemFont, monospace;
    font-size: 11px;
    line-height: 1.6;
    color: #fff;
    pointer-events: none;
    min-width: 100px;
    text-align: right;
  }
  #hud .k { color: #6fa6c8; margin-right: 4px; }

  /* 左上 HUD: 自軍残数 */
  #hud-left {
    position: fixed;
    top: env(safe-area-inset-top, 8px);
    left: 8px;
    padding: 6px 8px;
    background: rgba(8, 16, 26, 0.70);
    border: 1px solid rgba(120, 200, 255, 0.20);
    border-radius: 6px;
    font-family: -apple-system, BlinkMacSystemFont, monospace;
    font-size: 13px;
    line-height: 1.6;
    color: #fff;
    pointer-events: none;
  }
  #hud-left .label { color: #6fa6c8; font-size: 10px; }

  /* 右下 HUD: ウェーブ数 */
  #hud-wave {
    position: fixed;
    bottom: calc(20vh + env(safe-area-inset-bottom, 0px) + 8px);
    right: 8px;
    padding: 6px 10px;
    background: rgba(8, 16, 26, 0.70);
    border: 1px solid rgba(120, 200, 255, 0.20);
    border-radius: 6px;
    font-family: -apple-system, BlinkMacSystemFont, monospace;
    font-size: 13px;
    color: #aed6f1;
    pointer-events: none;
  }

  /* 隊形切替ボタン — 画面下部 */
  #formation-bar {
    position: fixed;
    bottom: 0;
    left: 0; right: 0;
    height: calc(20vh + env(safe-area-inset-bottom, 0px));
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    pointer-events: none;
  }
  .formation-btn {
    pointer-events: auto;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: 2px solid rgba(120, 200, 255, 0.35);
    background: rgba(10, 22, 38, 0.80);
    color: #d8e6f2;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .formation-btn.active {
    background: rgba(30, 90, 138, 0.90);
    border-color: #6fc0ff;
    box-shadow: 0 0 12px rgba(111, 192, 255, 0.40);
  }

  /* リトライボタン (非表示時は display:none) */
  #retry-btn {
    position: fixed;
    bottom: calc(20vh + env(safe-area-inset-bottom, 0px) + 20px);
    left: 50%;
    transform: translateX(-50%);
    padding: 14px 40px;
    background: rgba(180, 40, 40, 0.85);
    border: 2px solid rgba(255, 100, 100, 0.60);
    border-radius: 30px;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, monospace;
    font-size: 16px;
    cursor: pointer;
    display: none;
    pointer-events: auto;
    letter-spacing: 0.1em;
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<!-- 右上 HUD -->
<div id="hud">
  <span class="k">FPS</span><span id="h-fps">--</span><br/>
  <span class="k">avg</span><span id="h-avg">--</span>
</div>

<!-- 左上 HUD: 自軍残数 -->
<div id="hud-left">
  <div class="label">FLOCK</div>
  <span id="h-alive">20</span> / <span id="h-max">20</span>
</div>

<!-- 右下 HUD: ウェーブ -->
<div id="hud-wave">Wave 1</div>

<!-- 隊形ボタン: ●（密集）/ ∴（散開）/ ○（円環）-->
<div id="formation-bar">
  <button class="formation-btn active" id="btn-tight"   data-formation="tight">&#9679;</button>
  <button class="formation-btn"        id="btn-spread"  data-formation="spread">&#8756;</button>
  <button class="formation-btn"        id="btn-ring"    data-formation="ring">&#9675;</button>
</div>

<!-- リトライボタン -->
<button id="retry-btn">R — リトライ</button>

<script>
"use strict";

/* ============================================================
 * 竜潮 / Dragon Tide — Phase 2: Battle Core
 *
 * 検証目標:
 *   「隊形切り替えがバトルにどう影響するか」を体感できること
 *   - 密集で突っ込むと強いが被弾も多い
 *   - 散開で敵を包囲する動きが自然発生する
 *   - 円環で耐えながら戦う戦術が機能する
 *
 * 実装方針:
 *   - Phase 1 の Boids・ウェイポイント・隊形コードを最大限流用
 *   - 敵 Boids は別配列で管理（同じ SoA 構造体を使い回す）
 *   - パーティクルは配列プール方式（最大50個）
 *   - setInterval(16ms) 固定維持
 * ============================================================ */

// -----------------------------------------------------------------
// バランスデータ: fetch 失敗時のフォールバック値
// (ソース: data/balance/dragon-tide.json §boids + §formations)
// -----------------------------------------------------------------
const BALANCE_FALLBACK = {
  base: {
    perception:       40,
    separationRadius: 18,
    maxSpeed:         160,
    minSpeed:         60,
    maxForce:         320,
    wSeparation:      1.8,
    wAlignment:       1.0,
    wCohesion:        0.9,
    wLeader:          1.6,
    leaderSeekDist:   80,
    pathMaxPoints:    240,
    pathMinSegment:   8,
    leaderSpeed:      220,
    idleWanderRadius: 120,
    fixedStepMs:      16,
    maxDtMs:          64,
  },
  formationOverrides: {
    tight:  { wCohesion: 2.2, wSeparation: 0.8, perception: 30, separationRadius: 12 },
    spread: { wCohesion: 0.4, wSeparation: 2.5, perception: 55, separationRadius: 28 },
    ring:   { wCohesion: 1.5, wSeparation: 1.2, perception: 45, separationRadius: 22, ringRadius: 80 },
  },
  transitionSeconds:   0.15,
  transitionJitterMax: 0.08,
};

// 隊形別戦闘パラメータ (GDD §9.2 / data/balance/dragon-tide.json §formations)
// フェーズ2では属性は全て「火」に固定
const FORMATION_COMBAT = {
  // 密集: 高ダメージ・被弾増 / 散開: 範囲攻撃・被弾減 / 円環: 低ダメージ・被弾大幅減
  tight: {
    damageMultiplier:   1.5,   // 集中火力
    defenseMultiplier:  1.2,   // 密集してて当たりやすい
    aoeRadius:          0,     // 単体攻撃
    flashColor:         "rgba(255,80,40,0.18)", // 切替フラッシュ色（赤）
  },
  spread: {
    damageMultiplier:   1.0,
    defenseMultiplier:  0.9,   // 散らばって当たりにくい
    aoeRadius:          20,    // 自分周囲20px内の敵全員にダメージ
    flashColor:         "rgba(60,120,255,0.18)", // 青
  },
  ring: {
    damageMultiplier:   0.8,
    defenseMultiplier:  0.6,   // 盾になる
    aoeRadius:          0,
    flashColor:         "rgba(40,200,100,0.18)", // 緑
  },
};

// ステージ1の敵数 (data/balance/dragon-tide.json stages[0].enemyCount = 7)
// フェーズ2検証用に10〜15体に設定（GDD仕様通り）
const ENEMY_COUNT_PER_WAVE = 12;

// -----------------------------------------------------------------
// ランタイム設定: fetch 後に BASE_CFG へ注入
// -----------------------------------------------------------------
let BASE_CFG = { ...BALANCE_FALLBACK.base };
let FORMATION_OVERRIDES = { ...BALANCE_FALLBACK.formationOverrides };
let TRANSITION_SECS  = BALANCE_FALLBACK.transitionSeconds;
let JITTER_MAX       = BALANCE_FALLBACK.transitionJitterMax;

// バランス JSON を非同期 fetch（失敗時はフォールバックのまま続行）
(async () => {
  try {
    const resp = await fetch("../../data/balance/dragon-tide.json");
    if (!resp.ok) throw new Error("fetch status " + resp.status);
    const data = await resp.json();
    if (data.boids) {
      BASE_CFG          = { ...BALANCE_FALLBACK.base,             ...data.boids.base };
      FORMATION_OVERRIDES = { ...BALANCE_FALLBACK.formationOverrides, ...data.boids.formationOverrides };
      TRANSITION_SECS   = data.boids.transitionSeconds    ?? TRANSITION_SECS;
      JITTER_MAX        = data.boids.transitionJitterMax  ?? JITTER_MAX;
    }
  } catch (_e) {
    // フォールバック値をそのまま使用。ゲームは続行可能。
  }
})();

// -----------------------------------------------------------------
// Canvas セットアップ
// -----------------------------------------------------------------
const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });

let viewW = 0, viewH = 0, dpr = 1;
let bottomUIHeight = 0;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  viewW = window.innerWidth;
  viewH = window.innerHeight;
  bottomUIHeight = viewH * 0.20;
  canvas.width  = Math.floor(viewW * dpr);
  canvas.height = Math.floor(viewH * dpr);
  canvas.style.width  = viewW + "px";
  canvas.style.height = viewH + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", resize);
resize();

// -----------------------------------------------------------------
// Spatial Hash (自軍・敵共用)
// -----------------------------------------------------------------
const grid = new Map();

function gridKey(cx, cy) {
  return (cx * 73856093 ^ cy * 19349663);
}
function gridClear() { grid.clear(); }
function gridInsert(index, x, y, cellSize) {
  const cx = (x / cellSize) | 0;
  const cy = (y / cellSize) | 0;
  const k  = gridKey(cx, cy);
  let bucket = grid.get(k);
  if (!bucket) { bucket = []; grid.set(k, bucket); }
  bucket.push(index);
}
function gridQuery(x, y, cellSize, out) {
  out.length = 0;
  const cx = (x / cellSize) | 0;
  const cy = (y / cellSize) | 0;
  for (let dy = -1; dy <= 1; dy++) {
    for (let dx = -1; dx <= 1; dx++) {
      const b = grid.get(gridKey(cx + dx, cy + dy));
      if (b) for (let i = 0; i < b.length; i++) out.push(b[i]);
    }
  }
}

// -----------------------------------------------------------------
// Boids SoA — 自軍
// -----------------------------------------------------------------
const MAX_BOIDS = 20;
let N = 0;
let px, py, vx, vy;
let boidHp;         // 自軍HP (各3)
let boidDead;       // 消滅フラグ
let boidFadeTimer;  // 消滅アニメーション秒数 (0.3秒でフェード)

let formationLerp;
let formationDelay;

const BOID_MAX_HP    = 3;
const FADE_DURATION  = 0.3; // 消滅フェードアウト秒数 (GDD §11.4)

function initBoids() {
  N = MAX_BOIDS;
  px             = new Float32Array(N);
  py             = new Float32Array(N);
  vx             = new Float32Array(N);
  vy             = new Float32Array(N);
  boidHp         = new Float32Array(N);
  boidDead       = new Uint8Array(N);
  boidFadeTimer  = new Float32Array(N);
  formationLerp  = new Float32Array(N);
  formationDelay = new Float32Array(N);

  const cx = viewW * 0.5;
  const cy = viewH * 0.5;
  for (let i = 0; i < N; i++) {
    const r = Math.random() * 80;
    const a = Math.random() * Math.PI * 2;
    px[i] = cx + Math.cos(a) * r;
    py[i] = cy + Math.sin(a) * r;
    const ang = Math.random() * Math.PI * 2;
    vx[i] = Math.cos(ang) * BASE_CFG.minSpeed;
    vy[i] = Math.sin(ang) * BASE_CFG.minSpeed;
    boidHp[i]        = BOID_MAX_HP;
    boidDead[i]      = 0;
    boidFadeTimer[i] = 0;
    formationLerp[i]  = 1.0;
    formationDelay[i] = 0;
  }
}

// 自軍の生存数を返す
function countAliveBoids() {
  let count = 0;
  for (let i = 0; i < N; i++) {
    if (!boidDead[i]) count++;
  }
  return count;
}

// -----------------------------------------------------------------
// Boids SoA — 敵群
// 敵も同じ SoA 構造。ただし Spatial Hash は別フェーズで使う。
// -----------------------------------------------------------------
const MAX_ENEMIES = 20;
let EN = 0; // 現在の敵数

let epx, epy, evx, evy;
let enemyHp;
let enemyDead;
let enemyFadeTimer;

const ENEMY_MAX_HP   = 3;
const ENEMY_SPEED    = 60; // 自軍の重心へ近づく速度 (px/s)

function initEnemies(count) {
  EN = count;
  epx          = new Float32Array(MAX_ENEMIES);
  epy          = new Float32Array(MAX_ENEMIES);
  evx          = new Float32Array(MAX_ENEMIES);
  evy          = new Float32Array(MAX_ENEMIES);
  enemyHp      = new Float32Array(MAX_ENEMIES);
  enemyDead    = new Uint8Array(MAX_ENEMIES);
  enemyFadeTimer = new Float32Array(MAX_ENEMIES);

  for (let i = 0; i < EN; i++) {
    spawnEnemy(i);
  }
}

// 敵を画面端のランダム位置に配置する
function spawnEnemy(i) {
  // 4辺のいずれかから出現
  const side = Math.floor(Math.random() * 4);
  let spawnX, spawnY;
  if (side === 0) {      // 上
    spawnX = Math.random() * viewW;
    spawnY = -20;
  } else if (side === 1) { // 下
    spawnX = Math.random() * viewW;
    spawnY = viewH + 20;
  } else if (side === 2) { // 左
    spawnX = -20;
    spawnY = Math.random() * viewH;
  } else {               // 右
    spawnX = viewW + 20;
    spawnY = Math.random() * viewH;
  }
  epx[i] = spawnX;
  epy[i] = spawnY;
  evx[i] = 0;
  evy[i] = 0;
  enemyHp[i]        = ENEMY_MAX_HP;
  enemyDead[i]      = 0;
  enemyFadeTimer[i] = 0;
}

function countAliveEnemies() {
  let count = 0;
  for (let i = 0; i < EN; i++) {
    if (!enemyDead[i]) count++;
  }
  return count;
}

// -----------------------------------------------------------------
// パーティクルプール (最大50個、GCゼロ設計)
// -----------------------------------------------------------------
const MAX_PARTICLES = 50;

const partX      = new Float32Array(MAX_PARTICLES);
const partY      = new Float32Array(MAX_PARTICLES);
const partVx     = new Float32Array(MAX_PARTICLES);
const partVy     = new Float32Array(MAX_PARTICLES);
const partLife   = new Float32Array(MAX_PARTICLES); // 残り寿命 (秒)
const partActive = new Uint8Array(MAX_PARTICLES);   // 使用中フラグ

// ヒット時パーティクルを3〜5個発火させる
function spawnHitParticles(x, y) {
  const count = 3 + Math.floor(Math.random() * 3); // 3〜5個
  let spawned = 0;
  for (let i = 0; i < MAX_PARTICLES && spawned < count; i++) {
    if (partActive[i]) continue;
    partActive[i] = 1;
    partX[i] = x;
    partY[i] = y;
    const angle = Math.random() * Math.PI * 2;
    const speed = 40 + Math.random() * 80;
    partVx[i]   = Math.cos(angle) * speed;
    partVy[i]   = Math.sin(angle) * speed;
    partLife[i] = 0.25 + Math.random() * 0.15;
    spawned++;
  }
}

function updateParticles(dt) {
  for (let i = 0; i < MAX_PARTICLES; i++) {
    if (!partActive[i]) continue;
    partX[i]    += partVx[i] * dt;
    partY[i]    += partVy[i] * dt;
    partVx[i]   *= 0.85; // 減速
    partVy[i]   *= 0.85;
    partLife[i] -= dt;
    if (partLife[i] <= 0) partActive[i] = 0;
  }
}

// -----------------------------------------------------------------
// 卵システム
// 敵消滅時にその場に金色の小円を残す
// -----------------------------------------------------------------
const MAX_EGGS = 30;
const eggX        = new Float32Array(MAX_EGGS);
const eggY        = new Float32Array(MAX_EGGS);
const eggActive   = new Uint8Array(MAX_EGGS);
const eggFalling  = new Uint8Array(MAX_EGGS); // ウェーブクリア演出用

// 卵を配置してスロットインデックスを返す。空きがなければ -1 を返す。
function spawnEgg(x, y) {
  for (let i = 0; i < MAX_EGGS; i++) {
    if (eggActive[i]) continue;
    eggActive[i]  = 1;
    eggX[i]       = x;
    eggY[i]       = y;
    eggFalling[i] = 0;
    return i;
  }
  return -1;
}

// 自軍の近く(60px以内)の卵を回収する
function collectNearbyEggs(dt) {
  for (let e = 0; e < MAX_EGGS; e++) {
    if (!eggActive[e]) continue;
    for (let i = 0; i < N; i++) {
      if (boidDead[i]) continue;
      const dx = eggX[e] - px[i];
      const dy = eggY[e] - py[i];
      if (dx * dx + dy * dy < 60 * 60) {
        eggActive[e] = 0; // 回収
        break;
      }
    }
  }
}

// -----------------------------------------------------------------
// 画面フラッシュ
// 隊形切替後の最初のヒット時に発火
// -----------------------------------------------------------------
let flashTimer  = 0;   // フラッシュ残り時間 (秒)
let flashColor  = "";  // フラッシュ色
let formationJustChanged = false; // 隊形切替直後フラグ

function triggerFlash(color) {
  flashTimer = 0.1;
  flashColor = color;
}

// -----------------------------------------------------------------
// 戦闘状態
// -----------------------------------------------------------------
const COMBAT_RANGE     = 30;   // 近接判定距離 (px)
// 散開の範囲攻撃半径 (GDD仕様: 自分周囲20px内の敵全員)
const SPREAD_AOE_RANGE = 20;
// フレームごとの攻撃確率 (確定ではない)
// 16ms×62.5フレーム = 1秒。毎フレーム10%で≒1.6発/秒
const ATTACK_PROB_PER_FRAME = 0.10;

// -----------------------------------------------------------------
// ウェーブ・ゲーム状態管理
// -----------------------------------------------------------------
let currentWave   = 1;
let gameState     = "playing"; // "playing" | "defeat" | "wave_clear"
let defeatTimer   = 0;  // 敗北演出タイマー (秒)
let waveClearTimer = 0; // ウェーブクリア演出タイマー (秒)

const hudAlive = document.getElementById("h-alive");
const hudMax   = document.getElementById("h-max");
const hudWave  = document.getElementById("hud-wave");
const retryBtn = document.getElementById("retry-btn");

// resetFriendlies: リトライ時は true、ウェーブ継続時は false
// - リトライ: 自軍HP・生死を全回復してから開始
// - ウェーブ継続: 自軍の状態を引き継ぐ（損耗がリスクとして残る）
function startWave(waveNumber, resetFriendlies) {
  currentWave = waveNumber;
  gameState   = "playing";
  defeatTimer = 0;
  waveClearTimer = 0;
  formationJustChanged = false;
  retryBtn.style.display = "none";
  hudWave.textContent    = "Wave " + waveNumber;

  // 敵を初期化
  initEnemies(ENEMY_COUNT_PER_WAVE);

  if (resetFriendlies) {
    // リトライ時のみ自軍をフル回復
    for (let i = 0; i < N; i++) {
      boidHp[i]        = BOID_MAX_HP;
      boidDead[i]      = 0;
      boidFadeTimer[i] = 0;
    }
  }

  // 卵をリセット
  for (let e = 0; e < MAX_EGGS; e++) eggActive[e] = 0;
}

function triggerDefeat() {
  gameState   = "defeat";
  defeatTimer = 2.0; // 2秒演出
  retryBtn.style.display = "block";
  hapticPulse(400); // GDD §7.3: 失敗時は弱く長い振動
}

function triggerWaveClear() {
  gameState      = "wave_clear";
  waveClearTimer = 3.0; // 3秒演出: 卵が上から降ってくる

  // 全卵を画面上から降らせる演出用に設定
  for (let e = 0; e < MAX_EGGS; e++) {
    if (eggActive[e]) eggFalling[e] = 1;
  }
  // 追加の卵を数個降らせる
  for (let k = 0; k < 5; k++) {
    const slotIndex = spawnEgg(Math.random() * viewW, -20);
    if (slotIndex >= 0) eggFalling[slotIndex] = 1;
  }
}

// -----------------------------------------------------------------
// リーダー & ウェイポイントパス
// -----------------------------------------------------------------
const PATH_MAX = 240;
const pathBuf = new Float32Array(PATH_MAX * 2);
let pathHead = 0;
let pathLen  = 0;
let leaderPathConsumeIdx = 0;

function pathGet(logicalIdx) {
  const ring = (pathHead - pathLen + logicalIdx + PATH_MAX) % PATH_MAX;
  return { x: pathBuf[ring * 2], y: pathBuf[ring * 2 + 1] };
}

function pathClear() {
  pathLen  = 0;
  pathHead = 0;
  leaderPathConsumeIdx = 0;
}

function pathPush(x, y) {
  if (pathLen > 0) {
    const last = pathGet(pathLen - 1);
    const dx = x - last.x, dy = y - last.y;
    const minSeg = Math.max(BASE_CFG.pathMinSegment, 30);
    if (dx * dx + dy * dy < minSeg * minSeg) return;
  }
  pathBuf[pathHead * 2]     = x;
  pathBuf[pathHead * 2 + 1] = y;
  pathHead = (pathHead + 1) % PATH_MAX;
  if (pathLen < PATH_MAX) pathLen++;
}

const leader = { x: 0, y: 0, vx: 0, vy: 0 };

function resetLeader() {
  leader.x = viewW * 0.5;
  leader.y = viewH * 0.45;
  leader.vx = 0;
  leader.vy = 0;
  pathClear();
  idleAngle = 0;
}

// -----------------------------------------------------------------
// 隊形管理
// -----------------------------------------------------------------
const FORMATIONS = ["tight", "spread", "ring"];
let currentFormation = "tight";
let prevFormation    = "tight";

function setFormation(name) {
  if (name === currentFormation) return;
  prevFormation    = currentFormation;
  currentFormation = name;

  for (let i = 0; i < N; i++) {
    formationLerp[i]  = 0;
    formationDelay[i] = Math.random() * JITTER_MAX;
  }

  hapticPulse(30);
  formationJustChanged = true; // 次ヒットでフラッシュ発火
  updateFormationButtons(name);
}

function updateFormationButtons(name) {
  document.querySelectorAll(".formation-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.formation === name);
  });
}

document.querySelectorAll(".formation-btn").forEach(btn => {
  btn.addEventListener("pointerdown", (e) => {
    e.stopPropagation();
    setFormation(btn.dataset.formation);
  });
});

retryBtn.addEventListener("pointerdown", (e) => {
  e.stopPropagation();
  // リトライ: ウェーブ1から自軍をフル回復して再挑戦
  resetLeader();
  startWave(1, true);
});

// -----------------------------------------------------------------
// 触覚フィードバック
// -----------------------------------------------------------------
function hapticPulse(durationMs) {
  try { navigator.vibrate?.(durationMs); } catch (_) {}
}

// -----------------------------------------------------------------
// 入力システム
// -----------------------------------------------------------------
let inputMode = "NONE";
let isDrawing = false;

let touchRing = { active: false, x: 0, y: 0, opacity: 0 };

const TRAIL_LIFETIME = 1.2;
const trailPoints    = [];
let trailMaxPoints   = 400;

function addTrailPoint(x, y, now) {
  if (trailPoints.length >= trailMaxPoints) trailPoints.shift();
  trailPoints.push({ x, y, bornAt: now });
}

function inputStart(x, y, now) {
  if (y >= viewH - bottomUIHeight) {
    inputMode = "UI";
    return;
  }
  inputMode = "DRAW";
  isDrawing = true;
  pathClear();
  pathPush(x, y);
  addTrailPoint(x, y, now);

  touchRing.active  = true;
  touchRing.x       = x;
  touchRing.y       = y;
  touchRing.opacity = 0.30;

  hapticPulse(10);
}

function inputMove(x, y, now) {
  if (inputMode !== "DRAW") return;
  pathPush(x, y);
  addTrailPoint(x, y, now);
  touchRing.x = x;
  touchRing.y = y;
}

function inputEnd() {
  isDrawing = false;
  inputMode = "NONE";
  touchRing.active = false;
}

canvas.addEventListener("touchstart", (e) => {
  const t = e.touches[0];
  inputStart(t.clientX, t.clientY, performance.now());
  e.preventDefault();
}, { passive: false });

canvas.addEventListener("touchmove", (e) => {
  const t = e.touches[0];
  inputMove(t.clientX, t.clientY, performance.now());
  e.preventDefault();
}, { passive: false });

canvas.addEventListener("touchend",    (e) => { inputEnd(); e.preventDefault(); }, { passive: false });
canvas.addEventListener("touchcancel", (e) => { inputEnd(); e.preventDefault(); }, { passive: false });

canvas.addEventListener("mousedown",  (e) => inputStart(e.clientX, e.clientY, performance.now()));
canvas.addEventListener("mousemove",  (e) => { if (isDrawing) inputMove(e.clientX, e.clientY, performance.now()); });
canvas.addEventListener("mouseup",    () => inputEnd());
canvas.addEventListener("mouseleave", () => inputEnd());

// -----------------------------------------------------------------
// アイドル旋回
// -----------------------------------------------------------------
let idleAngle = 0;
const IDLE_ANGULAR_SPEED = 0.35;

function getIdleLeaderTarget(dt) {
  idleAngle += IDLE_ANGULAR_SPEED * dt;
  const r = BASE_CFG.idleWanderRadius;
  return {
    x: viewW * 0.5 + Math.cos(idleAngle) * r,
    y: viewH * 0.45 + Math.sin(idleAngle) * r * 0.6,
  };
}

// -----------------------------------------------------------------
// 自軍の重心を計算する
// -----------------------------------------------------------------
function calcFriendlyCentroid() {
  let cx = 0, cy = 0, count = 0;
  for (let i = 0; i < N; i++) {
    if (boidDead[i]) continue;
    cx += px[i];
    cy += py[i];
    count++;
  }
  if (count === 0) return { x: viewW * 0.5, y: viewH * 0.5 };
  return { x: cx / count, y: cy / count };
}

// -----------------------------------------------------------------
// 敵 Boids シミュレーション
// 敵は Boids ロジックを使いつつ自軍重心へ緩やかに接近
// -----------------------------------------------------------------
const eNeighbours = [];

function simEnemies(dt) {
  const centroid = calcFriendlyCentroid();

  for (let i = 0; i < EN; i++) {
    if (enemyDead[i]) continue;

    // 敵どうしの簡易分離 (O(n^2) だが敵数が少ないので許容)
    let sepX = 0, sepY = 0;
    const SEP_R = 20;
    for (let j = 0; j < EN; j++) {
      if (j === i || enemyDead[j]) continue;
      const dx = epx[i] - epx[j];
      const dy = epy[i] - epy[j];
      const d2 = dx * dx + dy * dy;
      if (d2 < SEP_R * SEP_R && d2 > 0) {
        const invD = 1 / Math.sqrt(d2);
        sepX += dx * invD;
        sepY += dy * invD;
      }
    }

    // 自軍重心へ向かう引力
    const tdx = centroid.x - epx[i];
    const tdy = centroid.y - epy[i];
    const td  = Math.sqrt(tdx * tdx + tdy * tdy) || 1;

    // 加速度: 引力 + 分離力
    let ax = (tdx / td) * 80 + sepX * 40;
    let ay = (tdy / td) * 80 + sepY * 40;

    evx[i] += ax * dt;
    evy[i] += ay * dt;

    // 速度キャップ
    const sp = Math.sqrt(evx[i] * evx[i] + evy[i] * evy[i]);
    if (sp > ENEMY_SPEED) {
      evx[i] = evx[i] / sp * ENEMY_SPEED;
      evy[i] = evy[i] / sp * ENEMY_SPEED;
    }

    epx[i] += evx[i] * dt;
    epy[i] += evy[i] * dt;
  }
}

// -----------------------------------------------------------------
// 戦闘シミュレーション
// 近接した自軍個体と敵個体が確率的に攻撃し合う
// -----------------------------------------------------------------
function simCombat(dt) {
  if (gameState !== "playing") return;

  const combatParams = FORMATION_COMBAT[currentFormation];

  for (let i = 0; i < N; i++) {
    if (boidDead[i]) continue;

    for (let e = 0; e < EN; e++) {
      if (enemyDead[e]) continue;

      const dx = px[i] - epx[e];
      const dy = py[i] - epy[e];
      const d2 = dx * dx + dy * dy;

      if (d2 > COMBAT_RANGE * COMBAT_RANGE) continue;

      // --- 自軍が敵を攻撃 ---
      if (Math.random() < ATTACK_PROB_PER_FRAME) {
        const damage = combatParams.damageMultiplier;

        if (combatParams.aoeRadius > 0) {
          // 散開: 自分周囲の敵全員にダメージ
          applyAoeDamage(px[i], py[i], combatParams.aoeRadius, damage);
        } else {
          // 密集・円環: 単体攻撃
          applyDamageToEnemy(e, damage);
        }

        spawnHitParticles(epx[e], epy[e]);

        // 隊形切替後の最初のヒットにフラッシュ (GDD §11.3)
        if (formationJustChanged) {
          triggerFlash(combatParams.flashColor);
          formationJustChanged = false;
        }

        hapticPulse(20);
      }

      // --- 敵が自軍を攻撃 ---
      if (Math.random() < ATTACK_PROB_PER_FRAME) {
        const incomingDamage = 1 * combatParams.defenseMultiplier;
        applyDamageToBoid(i, incomingDamage);
      }
    }
  }
}

function applyDamageToEnemy(enemyIndex, damage) {
  enemyHp[enemyIndex] -= damage;
  if (enemyHp[enemyIndex] <= 0 && !enemyDead[enemyIndex]) {
    enemyDead[enemyIndex]      = 1;
    enemyFadeTimer[enemyIndex] = FADE_DURATION;
    // 卵を落とす (GDD §4.1)
    spawnEgg(epx[enemyIndex], epy[enemyIndex]);
  }
}

function applyAoeDamage(x, y, radius, damage) {
  const r2 = radius * radius;
  for (let e = 0; e < EN; e++) {
    if (enemyDead[e]) continue;
    const dx = x - epx[e];
    const dy = y - epy[e];
    if (dx * dx + dy * dy < r2) {
      applyDamageToEnemy(e, damage);
    }
  }
}

function applyDamageToBoid(boidIndex, damage) {
  boidHp[boidIndex] -= damage;
  if (boidHp[boidIndex] <= 0 && !boidDead[boidIndex]) {
    boidDead[boidIndex]      = 1;
    boidFadeTimer[boidIndex] = FADE_DURATION;
  }
}

// -----------------------------------------------------------------
// 消滅フェードタイマー更新
// -----------------------------------------------------------------
function updateDeathTimers(dt) {
  for (let i = 0; i < N; i++) {
    if (boidFadeTimer[i] > 0) boidFadeTimer[i] = Math.max(0, boidFadeTimer[i] - dt);
  }
  for (let e = 0; e < EN; e++) {
    if (enemyFadeTimer[e] > 0) enemyFadeTimer[e] = Math.max(0, enemyFadeTimer[e] - dt);
  }
}

// -----------------------------------------------------------------
// ゲーム状態チェック
// -----------------------------------------------------------------
function checkGameConditions() {
  if (gameState !== "playing") return;

  const aliveCount = countAliveBoids();
  if (aliveCount === 0) {
    triggerDefeat();
    return;
  }

  const enemyAliveCount = countAliveEnemies();
  if (enemyAliveCount === 0) {
    triggerWaveClear();
  }
}

// -----------------------------------------------------------------
// ウェーブクリア演出後の次ウェーブ開始
// -----------------------------------------------------------------
function updateWaveClear(dt) {
  waveClearTimer -= dt;

  // 卵が上から降ってくる演出
  for (let e = 0; e < MAX_EGGS; e++) {
    if (eggActive[e] && eggFalling[e]) {
      eggY[e] += 60 * dt;
      if (eggY[e] > viewH + 30) eggActive[e] = 0;
    }
  }

  if (waveClearTimer <= 0) {
    // 次ウェーブへ。自軍の損耗を引き継ぐことでウェーブ継続のリスクを演出する。
    startWave(currentWave + 1, false);
  }
}

// -----------------------------------------------------------------
// Simulation step — 自軍 Boids
// -----------------------------------------------------------------
const neighbours = [];

function buildFormationParams() {
  const ov = FORMATION_OVERRIDES[currentFormation] ?? {};
  return {
    perception:       ov.perception       ?? BASE_CFG.perception,
    separationRadius: ov.separationRadius ?? BASE_CFG.separationRadius,
    wSeparation:      ov.wSeparation      ?? BASE_CFG.wSeparation,
    wAlignment:       BASE_CFG.wAlignment,
    wCohesion:        ov.wCohesion        ?? BASE_CFG.wCohesion,
    ringRadius:       ov.ringRadius       ?? 0,
  };
}

function buildPrevFormationParams() {
  const ov = FORMATION_OVERRIDES[prevFormation] ?? {};
  return {
    perception:       ov.perception       ?? BASE_CFG.perception,
    separationRadius: ov.separationRadius ?? BASE_CFG.separationRadius,
    wSeparation:      ov.wSeparation      ?? BASE_CFG.wSeparation,
    wAlignment:       BASE_CFG.wAlignment,
    wCohesion:        ov.wCohesion        ?? BASE_CFG.wCohesion,
    ringRadius:       ov.ringRadius       ?? 0,
  };
}

function lerpVal(a, b, t) { return a + (b - a) * t; }

function simStep(dt) {
  updateLeader(dt);

  for (let i = 0; i < N; i++) {
    if (boidDead[i]) continue;
    if (formationDelay[i] > 0) {
      formationDelay[i] -= dt;
    } else if (formationLerp[i] < 1) {
      formationLerp[i] = Math.min(1, formationLerp[i] + dt / TRANSITION_SECS);
    }
  }

  const paramsNext = buildFormationParams();
  const paramsPrev = buildPrevFormationParams();

  gridClear();
  for (let i = 0; i < N; i++) {
    if (!boidDead[i]) gridInsert(i, px[i], py[i], paramsNext.perception);
  }

  for (let i = 0; i < N; i++) {
    if (boidDead[i]) continue;

    const t = formationLerp[i];
    const perc  = lerpVal(paramsPrev.perception,       paramsNext.perception,       t);
    const sepR  = lerpVal(paramsPrev.separationRadius, paramsNext.separationRadius, t);
    const wSep  = lerpVal(paramsPrev.wSeparation,      paramsNext.wSeparation,      t);
    const wAli  = paramsNext.wAlignment;
    const wCoh  = lerpVal(paramsPrev.wCohesion,        paramsNext.wCohesion,        t);
    const ringR = lerpVal(paramsPrev.ringRadius,       paramsNext.ringRadius,       t);

    const perc2 = perc * perc;
    const sep2  = sepR * sepR;

    const xi = px[i], yi = py[i];
    let sepX = 0, sepY = 0;
    let aliX = 0, aliY = 0;
    let cohX = 0, cohY = 0;
    let nAli = 0, nCoh = 0;

    gridQuery(xi, yi, paramsNext.perception, neighbours);
    for (let k = 0; k < neighbours.length; k++) {
      const j = neighbours[k];
      if (j === i || boidDead[j]) continue;
      const dx = xi - px[j], dy = yi - py[j];
      const d2 = dx * dx + dy * dy;
      if (d2 > perc2 || d2 === 0) continue;
      if (d2 < sep2) {
        const invD = 1 / Math.sqrt(d2);
        sepX += dx * invD;
        sepY += dy * invD;
      }
      aliX += vx[j]; aliY += vy[j]; nAli++;
      cohX += px[j]; cohY += py[j]; nCoh++;
    }

    let ax = 0, ay = 0;

    ax += sepX * wSep * 80;
    ay += sepY * wSep * 80;

    if (nAli > 0) {
      const inv = 1 / nAli;
      ax += (aliX * inv - vx[i]) * wAli;
      ay += (aliY * inv - vy[i]) * wAli;
    }
    if (nCoh > 0) {
      const inv = 1 / nCoh;
      ax += (cohX * inv - xi) * wCoh;
      ay += (cohY * inv - yi) * wCoh;
    }

    {
      const ldx = leader.x - xi, ldy = leader.y - yi;
      const ld  = Math.sqrt(ldx * ldx + ldy * ldy) || 1;
      if (ringR > 0) {
        const targetX = leader.x - (ldx / ld) * ringR;
        const targetY = leader.y - (ldy / ld) * ringR;
        ax += (targetX - xi) * BASE_CFG.wLeader * 1.5;
        ay += (targetY - yi) * BASE_CFG.wLeader * 1.5;
      } else {
        ax += (ldx / ld) * BASE_CFG.wLeader * 120;
        ay += (ldy / ld) * BASE_CFG.wLeader * 120;
      }
    }

    const am = Math.sqrt(ax * ax + ay * ay);
    if (am > BASE_CFG.maxForce) { const s = BASE_CFG.maxForce / am; ax *= s; ay *= s; }

    let nvx = vx[i] + ax * dt;
    let nvy = vy[i] + ay * dt;
    const sp = Math.sqrt(nvx * nvx + nvy * nvy);
    if      (sp > BASE_CFG.maxSpeed) { const s = BASE_CFG.maxSpeed / sp; nvx *= s; nvy *= s; }
    else if (sp < BASE_CFG.minSpeed && sp > 0.0001) { const s = BASE_CFG.minSpeed / sp; nvx *= s; nvy *= s; }
    else if (sp <= 0.0001) { nvx = BASE_CFG.minSpeed; nvy = 0; }
    vx[i] = nvx; vy[i] = nvy;

    let nx = xi + nvx * dt;
    let ny = yi + nvy * dt;
    if (nx < -10)             nx = viewW + 10;
    else if (nx > viewW + 10) nx = -10;
    if (ny < -10)             ny = viewH + 10;
    else if (ny > viewH + 10) ny = -10;
    px[i] = nx; py[i] = ny;
  }
}

function updateLeader(dt) {
  if (pathLen > 0) {
    if (leaderPathConsumeIdx >= pathLen) leaderPathConsumeIdx = pathLen - 1;

    let tgt = pathGet(Math.min(leaderPathConsumeIdx, pathLen - 1));
    let dx = tgt.x - leader.x, dy = tgt.y - leader.y;
    let d2 = dx * dx + dy * dy;

    while (d2 < 24 * 24 && leaderPathConsumeIdx < pathLen - 1) {
      leaderPathConsumeIdx++;
      tgt = pathGet(leaderPathConsumeIdx);
      dx = tgt.x - leader.x; dy = tgt.y - leader.y;
      d2 = dx * dx + dy * dy;
    }

    const d = Math.sqrt(d2) || 1;
    const desiredVx = (dx / d) * BASE_CFG.leaderSpeed;
    const desiredVy = (dy / d) * BASE_CFG.leaderSpeed;
    leader.vx += (desiredVx - leader.vx) * Math.min(1, dt * 8);
    leader.vy += (desiredVy - leader.vy) * Math.min(1, dt * 8);
  } else {
    const target = getIdleLeaderTarget(dt);
    leader.vx += ((target.x - leader.x) * 0.8 - leader.vx) * Math.min(1, dt * 2.0);
    leader.vy += ((target.y - leader.y) * 0.8 - leader.vy) * Math.min(1, dt * 2.0);
  }

  leader.x += leader.vx * dt;
  leader.y += leader.vy * dt;
  leader.x = Math.max(0, Math.min(viewW, leader.x));
  leader.y = Math.max(0, Math.min(viewH, leader.y));
}

// -----------------------------------------------------------------
// 描画
// -----------------------------------------------------------------
function render(now) {
  // 背景クリア
  ctx.fillStyle = "#08101a";
  ctx.fillRect(0, 0, viewW, viewH);

  // 敗北演出: 画面全体が暗くなる (GDD §7.3)
  if (gameState === "defeat") {
    const darkness = Math.min(0.75, 1 - defeatTimer / 2.0);
    ctx.fillStyle = `rgba(0,0,0,${darkness.toFixed(3)})`;
    ctx.fillRect(0, 0, viewW, viewH);
  }

  drawTrail(now);
  drawEggs();
  drawBoids();
  drawEnemies();
  drawParticles();
  drawTouchRing(now);
  drawFlash();
}

// ライン残光
function drawTrail(now) {
  if (trailPoints.length < 2) return;

  const cutoff = now - TRAIL_LIFETIME * 1000;
  while (trailPoints.length > 0 && trailPoints[0].bornAt < cutoff) {
    trailPoints.shift();
  }
  if (trailPoints.length < 2) return;

  for (let i = 1; i < trailPoints.length; i++) {
    const p    = trailPoints[i];
    const prev = trailPoints[i - 1];
    const ageRatio = (now - p.bornAt) / (TRAIL_LIFETIME * 1000);
    const alpha    = Math.max(0, 1 - ageRatio) * 0.35;

    ctx.strokeStyle = `rgba(140, 200, 255, ${alpha.toFixed(3)})`;
    ctx.lineWidth   = 2.5;
    ctx.lineCap     = "round";
    ctx.beginPath();
    ctx.moveTo(prev.x, prev.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  }
}

// 自軍 Boids 描画 (白/青系三角形)
function drawBoids() {
  for (let i = 0; i < N; i++) {
    if (boidDead[i] && boidFadeTimer[i] <= 0) continue;

    let alpha = 0.75;
    if (boidDead[i]) {
      // 消滅フェードアウト
      alpha = (boidFadeTimer[i] / FADE_DURATION) * 0.75;
    }

    const x = px[i], y = py[i];
    const angle = Math.atan2(vy[i], vx[i]);
    const cosA  = Math.cos(angle);
    const sinA  = Math.sin(angle);

    ctx.setTransform(dpr * cosA, dpr * sinA, -dpr * sinA, dpr * cosA, x * dpr, y * dpr);
    ctx.fillStyle = `rgba(120, 180, 255, ${alpha.toFixed(3)})`;
    ctx.beginPath();
    ctx.moveTo(9,  0);
    ctx.lineTo(-6,  4);
    ctx.lineTo(-3,  0);
    ctx.lineTo(-6, -4);
    ctx.closePath();
    ctx.fill();

    // HP バー (生存中のみ、HP<MAX時に表示)
    if (!boidDead[i] && boidHp[i] < BOID_MAX_HP) {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const hpRatio = Math.max(0, boidHp[i] / BOID_MAX_HP);
      const barW = 14;
      ctx.fillStyle = "rgba(0,0,0,0.5)";
      ctx.fillRect(x - barW / 2, y - 14, barW, 2);
      ctx.fillStyle = hpRatio > 0.5 ? "#4adf80" : "#f0604a";
      ctx.fillRect(x - barW / 2, y - 14, barW * hpRatio, 2);
    }
  }

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// 敵 Boids 描画 (赤い半透明三角形, GDD §フェーズ2仕様)
function drawEnemies() {
  for (let i = 0; i < EN; i++) {
    if (enemyDead[i] && enemyFadeTimer[i] <= 0) continue;

    let alpha = 0.70;
    if (enemyDead[i]) {
      alpha = (enemyFadeTimer[i] / FADE_DURATION) * 0.70;
    }

    const x = epx[i], y = epy[i];
    const angle = Math.atan2(evy[i], evx[i]);
    const cosA  = Math.cos(angle);
    const sinA  = Math.sin(angle);

    ctx.setTransform(dpr * cosA, dpr * sinA, -dpr * sinA, dpr * cosA, x * dpr, y * dpr);
    ctx.fillStyle = `rgba(220, 60, 60, ${alpha.toFixed(3)})`;
    ctx.beginPath();
    // 敵は逆向き気味の三角形でシルエット差別化
    ctx.moveTo(8,  0);
    ctx.lineTo(-5,  5);
    ctx.lineTo(-2,  0);
    ctx.lineTo(-5, -5);
    ctx.closePath();
    ctx.fill();

    // 敵HP バー
    if (!enemyDead[i] && enemyHp[i] < ENEMY_MAX_HP) {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const hpRatio = Math.max(0, enemyHp[i] / ENEMY_MAX_HP);
      const barW = 14;
      ctx.fillStyle = "rgba(0,0,0,0.5)";
      ctx.fillRect(x - barW / 2, y - 14, barW, 2);
      ctx.fillStyle = "#e05050";
      ctx.fillRect(x - barW / 2, y - 14, barW * hpRatio, 2);
    }
  }

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// パーティクル描画 (小さな輝点)
function drawParticles() {
  ctx.save();
  for (let i = 0; i < MAX_PARTICLES; i++) {
    if (!partActive[i]) continue;
    const lifeRatio = partLife[i] / 0.35; // 最大寿命で正規化
    const alpha = Math.max(0, lifeRatio);
    const radius = 2 + lifeRatio * 2;

    ctx.fillStyle = `rgba(255, 220, 80, ${alpha.toFixed(3)})`;
    ctx.beginPath();
    ctx.arc(partX[i], partY[i], radius, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// 卵描画 (金色の小円)
function drawEggs() {
  ctx.save();
  for (let e = 0; e < MAX_EGGS; e++) {
    if (!eggActive[e]) continue;
    ctx.fillStyle = "rgba(255, 200, 40, 0.85)";
    ctx.strokeStyle = "rgba(255, 240, 120, 0.60)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(eggX[e], eggY[e], 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  }
  ctx.restore();
}

// タッチリング
function drawTouchRing(now) {
  if (!touchRing.active) return;
  ctx.strokeStyle = `rgba(200, 230, 255, ${touchRing.opacity.toFixed(3)})`;
  ctx.lineWidth   = 1.5;
  ctx.beginPath();
  ctx.arc(touchRing.x, touchRing.y, 20, 0, Math.PI * 2);
  ctx.stroke();
}

// 画面フラッシュ (隊形切替直後ヒット時)
function drawFlash() {
  if (flashTimer <= 0) return;
  ctx.fillStyle = flashColor;
  ctx.fillRect(0, 0, viewW, viewH);
}

// -----------------------------------------------------------------
// HUD 更新 (毎フレームではなく 10フレームごとに DOM 更新)
// -----------------------------------------------------------------
let hudUpdateCounter = 0;

function updateHUD() {
  hudUpdateCounter++;
  if (hudUpdateCounter < 10) return;
  hudUpdateCounter = 0;

  const aliveCount = countAliveBoids();
  hudAlive.textContent = aliveCount;
  hudMax.textContent   = MAX_BOIDS;
}

// -----------------------------------------------------------------
// FPS 計測
// -----------------------------------------------------------------
let fpsFrames = 0;
let fpsLast   = performance.now();
let fpsEma    = 0;
const hudFps  = document.getElementById("h-fps");
const hudAvg  = document.getElementById("h-avg");

function tickFps(now) {
  fpsFrames++;
  const elapsed = now - fpsLast;
  if (elapsed >= 500) {
    const fps  = (fpsFrames * 1000) / elapsed;
    fpsEma     = fpsEma === 0 ? fps : fpsEma * 0.7 + fps * 0.3;
    fpsFrames  = 0;
    fpsLast    = now;
    hudFps.textContent = fps.toFixed(1);
    hudAvg.textContent = fpsEma.toFixed(1);
  }
}

// -----------------------------------------------------------------
// ゲームループ (setInterval 固定 16ms)
// -----------------------------------------------------------------
let lastTickTs = performance.now();

function tick() {
  const now  = performance.now();
  let dtMs   = now - lastTickTs;
  if (dtMs > BASE_CFG.maxDtMs) dtMs = BASE_CFG.maxDtMs;
  lastTickTs = now;
  const dt   = dtMs / 1000;

  // --- Update ---

  if (gameState === "playing") {
    simStep(dt);
    simEnemies(dt);
    simCombat(dt);
    updateDeathTimers(dt);
    collectNearbyEggs(dt);
    checkGameConditions();
  } else if (gameState === "defeat") {
    defeatTimer -= dt;
    updateDeathTimers(dt);
    // 敗北演出中も自軍の残骸フェード
  } else if (gameState === "wave_clear") {
    simStep(dt); // 自軍は動き続ける
    updateWaveClear(dt);
  }

  // フラッシュタイマー更新
  if (flashTimer > 0) flashTimer = Math.max(0, flashTimer - dt);

  // パーティクル更新 (常時)
  updateParticles(dt);

  // --- Render ---
  render(now);

  // HUD
  updateHUD();
  tickFps(now);
}

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) lastTickTs = performance.now();
});

// -----------------------------------------------------------------
// 起動
// -----------------------------------------------------------------
function boot() {
  resize();
  initBoids();
  resetLeader();
  // 起動時はリセットフラグなし (initBoids で既に HP 初期化済み)
  startWave(1, false);
  setInterval(tick, BASE_CFG.fixedStepMs);
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", boot);
} else {
  boot();
}
</script>
</body>
