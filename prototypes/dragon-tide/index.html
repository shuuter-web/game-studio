    ctx.strokeStyle = fx.color ?? "#d0a060";
    ctx.lineWidth = Math.max(1, 4 * (1 - progress));
    ctx.beginPath();
    ctx.arc(fx.x, fx.y, fx.maxR * progress, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
}

// -----------------------------------------------------------------
// 地形障害物（岩山・湖）: 破壊不可・ドラゴン侵入不可。
// 岩山は投射不透過（氷弾・敵弾を止める）、湖は投射透過。ミサイルは全て飛び越える。
// -----------------------------------------------------------------
let terrainObstacles = [];

const TERRAIN_COUNT_MIN   = 5;
const TERRAIN_COUNT_MAX   = 9;
const TERRAIN_MARGIN      = 140;   // マップ端からの最小距離
const TERRAIN_START_CLEAR = 420;   // 群れスタート地点（左端中央）の確保半径
const TERRAIN_MAX_ATTEMPTS = 30;

/**
 * 地形障害物をマップの空白地帯へ散布する。
 * 建物・首都城壁・他の地形と重ならない位置のみ採用（重なったらスキップ）。
 * 「何もない空間」を「回り込む地形」に置き換えるのが目的（仕様 §9.2）。
 */
function generateTerrainObstacles(buildings, boss) {
  const result = [];
  const count  = randInt(TERRAIN_COUNT_MIN, TERRAIN_COUNT_MAX);
  // 城壁リング＋余白の外側にのみ配置（要塞攻略の導線を地形で塞がない）
  const bossClear = WALL_OUTER_RING_RADIUS + 120;

  for (let k = 0; k < count; k++) {
    const type   = Math.random() < 0.55 ? "rock" : "lake";
    const radius = type === "rock" ? randRange(40, 85) : randRange(55, 105);

    for (let attempt = 0; attempt < TERRAIN_MAX_ATTEMPTS; attempt++) {
      const wx = TERRAIN_MARGIN + Math.random() * (WORLD_W - TERRAIN_MARGIN * 2);
      const wy = TERRAIN_MARGIN + Math.random() * (WORLD_H - TERRAIN_MARGIN * 2);

      // 群れスタート地点の確保
      if (dist2(wx, wy, 250, WORLD_H * 0.5) < (TERRAIN_START_CLEAR + radius) ** 2) continue;
      // ボス要塞圏の確保
      if (dist2(wx, wy, boss.wx, boss.wy) < (bossClear + radius) ** 2) continue;

      // 既存建物との重なりチェック
      let collides = false;
      for (const b of buildings) {
        const minD = radius + b.radius + 30;
        if (dist2(wx, wy, b.wx, b.wy) < minD * minD) { collides = true; break; }
      }
      if (collides) continue;

      // 他の地形との重なりチェック
      for (const ob of result) {
        const minD = radius + ob.radius + 60;
        if (dist2(wx, wy, ob.wx, ob.wy) < minD * minD) { collides = true; break; }
      }
      if (collides) continue;

      result.push({ wx, wy, radius, type });
      break;
    }
  }
  return result;
}

// 各町の建物リストから EGG_BEARER_RATIO の割合でランダムに卵持ちを選ぶ。
// _townMeta を持つ建物が「町の先頭」なので、それを境界として町ごとに分割する。
// 町ごとに割り当てることで全マップに散らばった配置になる。
function assignEggBearers(buildings) {
  // まず全フラグをリセット
  for (const b of buildings) b.isEggBearer = false;

  // _townMeta の有無で町の区切りを検出し、町ごとの配列を作る
  const towns = [];
  let current = null;
  for (const b of buildings) {
    if (b._townMeta) {
      current = [];
      towns.push(current);
    }
    if (current) current.push(b);
  }
  // _townMeta が一切ない場合は全体を1町として扱う（フォールバック）
  if (towns.length === 0) towns.push(buildings);

  for (const town of towns) {
    // この町での卵持ち数（最低1、実効割合で計算。密度倍率で割って絶対数を一定に）
    const count = Math.max(1, Math.round(town.length * eggBearerRatio()));
    // シャッフル相当: インデックス配列をランダムに選んでフラグを立てる
    const indices = [];
    for (let i = 0; i < town.length; i++) indices.push(i);
    // フィッシャー–イェーツで先頭 count 要素だけ選ぶ（部分シャッフル）
    for (let i = 0; i < count; i++) {
      const j = i + Math.floor(Math.random() * (indices.length - i));
      const tmp = indices[i]; indices[i] = indices[j]; indices[j] = tmp;
      town[indices[i]].isEggBearer = true;
    }
  }
}

// -----------------------------------------------------------------
// オフスクリーンCanvas: 建物の静的描画レイヤー
// 建物が壊れたときだけ部分再描画する
// -----------------------------------------------------------------
function rebuildBuildingLayer() {
  if (!buildingLayerCtx) return;
  const bctx = buildingLayerCtx;

  // 完全クリア
  bctx.clearRect(0, 0, WORLD_W, WORLD_H);

  // v0.8: 地面のディテール（土のパッチ＋スペックル）を最背面に焼く
  drawGroundDetailOnLayer(bctx);

  // v0.10: 川（街道より下に敷き、橋は街道の後で川の上に架ける）
  drawRiverOnLayer(bctx);

  // v0.9.1: 街と街をつなぐ街道（地形より下＝湖にかかる部分は湖が上書きして途切れる）
  drawInterTownRoadsOnLayer(bctx);

  // v0.10: 橋（川×街道の交点。川と街道の両方の上に乗る）
  drawBridgesOnLayer(bctx);

  // v0.6-p3: 地形（岩山・湖）は最背面に焼く
  drawTerrainOnLayer(bctx);

  // v0.9.1: 街区の下地（石畳ベース＋集落の土地面）。道路より先に敷く
  drawTownBasesOnLayer(bctx);

  // 道路ラインを先に描く（建物の下に来る）
  drawRoadsOnLayer(bctx);

  // 全建物を描画
  for (let s = 0; s < settlements.length; s++) {
    drawSettlementOnLayer(bctx, settlements[s]);
  }

  buildingLayerDirty = false;
}

/**
 * v0.8: 地面のディテールを静的レイヤーに焼く（背景クオリティアップ）。
 * ステージ背景色から導出した明暗2色で、大きな柔らかいパッチ（地表のむら）と
 * 細かいスペックル（砂利・草）を散らす。ステージ生成時に1回だけ実行される。
 */
function drawGroundDetailOnLayer(bctx) {
  const config = STAGE_CONFIGS[currentStage];
  // bgColor("#rrggbb")から明・暗のバリエーションを作る
  const lighter = shadeColor(config.bgColor, 14);
  const darker  = shadeColor(config.bgColor, -8);

  // v0.9: Gemini生成の低コントラスト地表タイルを薄く敷く。
  // alpha を抑えてステージ背景色を透かす＝時代ごとの色味を保ちつつ質感だけ足す。
  // ユニット視認性を優先し、これ以上濃くしないこと。
  if (groundTileImage) {
    const pattern = bctx.createPattern(groundTileImage, "repeat");
    if (pattern) {
      bctx.globalAlpha = 0.30;
      bctx.fillStyle = pattern;
      bctx.fillRect(0, 0, WORLD_W, WORLD_H);
      bctx.globalAlpha = 1.0;
    }
  }

  // 大きな柔らかいパッチ（地表のむら）
  for (let k = 0; k < 60; k++) {
    const x = Math.random() * WORLD_W;
    const y = Math.random() * WORLD_H;
    const rx = 90 + Math.random() * 240;
    const ry = rx * (0.5 + Math.random() * 0.5);
    bctx.globalAlpha = 0.16 + Math.random() * 0.10;
    bctx.fillStyle = Math.random() < 0.5 ? lighter : darker;
    bctx.beginPath();
    bctx.ellipse(x, y, rx, ry, Math.random() * Math.PI, 0, Math.PI * 2);
    bctx.fill();
  }

  // 細かいスペックル（砂利・草むら。v0.9: タイルが質感を担うため減量）
  bctx.globalAlpha = 0.22;
  for (let k = 0; k < 700; k++) {
    const x = Math.random() * WORLD_W;
    const y = Math.random() * WORLD_H;
    const size = 1 + Math.random() * 2.5;
    bctx.fillStyle = Math.random() < 0.6 ? lighter : darker;
    bctx.fillRect(x, y, size, size);
  }
  bctx.globalAlpha = 1.0;
}

function drawRoadsOnLayer(bctx) {
  // 各町のメタ情報から道路を描く
  for (let s = 0; s < settlements.length; s++) {
    const meta = settlements[s]._townMeta;
    if (!meta) continue;
    drawTownRoadsOnLayer(bctx, meta);
  }
}

/**
 * v0.10: 川を建物レイヤーに焼く。ポリラインを太線で二層描き（濃い水＋明るい流れ）。
 * 通行判定は持たない＝飛竜は川を越えられる。あくまで土地を形づくる背景。
 */
function drawRiverOnLayer(bctx) {
  if (riverPolyline.length < 2) return;
  bctx.save();
  bctx.lineJoin = "round";
  bctx.lineCap = "round";

  const stroke = (width, style, alpha) => {
    bctx.globalAlpha = alpha;
    bctx.strokeStyle = style;
    bctx.lineWidth = width;
    bctx.beginPath();
    bctx.moveTo(riverPolyline[0].x, riverPolyline[0].y);
    for (let i = 1; i < riverPolyline.length; i++) bctx.lineTo(riverPolyline[i].x, riverPolyline[i].y);
    bctx.stroke();
  };

  // 岸（濃い土の縁）→ 水面（深い青）→ 流れのハイライト
  stroke(riverWidth + 12, "rgba(40, 45, 40, 0.55)", 1);
  stroke(riverWidth,      "rgba(34, 62, 104, 0.92)", 1);
  stroke(riverWidth * 0.45, "rgba(90, 140, 200, 0.5)", 1);
  bctx.restore();
  bctx.globalAlpha = 1.0;
}

/**
 * v0.10: 橋を川×街道の交点に描く。橋スプライト（bridge.png）があれば街道角度で回転配置、
 * なければ石畳の矩形でフォールバック。
 */
function drawBridgesOnLayer(bctx) {
  if (bridgePlacements.length === 0) return;
  const img = buildingImages.bridge;
  for (const br of bridgePlacements) {
    bctx.save();
    bctx.translate(br.x, br.y);
    bctx.rotate(br.angle);
    // 石の土台を必ず先に敷く（川の青が透けず橋がはっきり見える。両岸に乗る長さ）
    const baseW = riverWidth + 56;
    const baseH = 34;
    bctx.fillStyle = "#8a8478";
    bctx.fillRect(-baseW / 2, -baseH / 2, baseW, baseH);
    bctx.strokeStyle = "rgba(30,28,24,0.8)";
    bctx.lineWidth = 2.5;
    bctx.strokeRect(-baseW / 2, -baseH / 2, baseW, baseH);
    if (img) {
      const drawW = riverWidth + 56;
      const drawH = drawW * (img.naturalHeight / img.naturalWidth);
      bctx.drawImage(img, -drawW / 2, -drawH / 2, drawW, drawH);
    }
    bctx.restore();
  }
}

/**
 * v0.9.1: 街と街をつなぐ街道を描く。
 * 中点を法線方向に決定的にたわませた二次曲線＝手で踏み固めた道の有機感。
 * 二層描き（広い土の道＋中央の轍）で「使い込まれた街道」に見せる。
 */
function drawInterTownRoadsOnLayer(bctx) {
  if (townRoadEdges.length === 0) return;
  const config = STAGE_CONFIGS[currentStage];
  const roadBase = shadeColor(config.bgColor, 20);
  const roadWorn = shadeColor(config.bgColor, 34);

  bctx.save();
  bctx.lineCap = "round";
  for (const [a, b] of townRoadEdges) {
    const midX = (a.x + b.x) / 2;
    const midY = (a.y + b.y) / 2;
    const dx = b.x - a.x, dy = b.y - a.y;
    const len = Math.sqrt(dx * dx + dy * dy) || 1;
    // 法線方向の決定的なたわみ（±80px。座標由来なので再構築しても同じ形）
    const bulge = (Math.sin(a.x * 0.013 + b.y * 0.017) * 80);
    const cx = midX + (-dy / len) * bulge;
    const cy = midY + (dx / len) * bulge;

    // 広い土の道
    bctx.globalAlpha = 0.50;
    bctx.strokeStyle = roadBase;
    bctx.lineWidth = 26;
    bctx.beginPath();
    bctx.moveTo(a.x, a.y);
    bctx.quadraticCurveTo(cx, cy, b.x, b.y);
    bctx.stroke();

    // 中央の轍（明るい擦れ）
    bctx.globalAlpha = 0.30;
    bctx.strokeStyle = roadWorn;
    bctx.lineWidth = 9;
    bctx.beginPath();
    bctx.moveTo(a.x, a.y);
    bctx.quadraticCurveTo(cx, cy, b.x, b.y);
    bctx.stroke();
  }
  bctx.restore();
}

/**
 * v0.9.1: 街区の下地。町全体に石畳ベース（角丸矩形）を敷いて
 * 「格子模様の上に建物が浮いている」感を消す。tiny集落には小さな土の広場。
 */
function drawTownBasesOnLayer(bctx) {
  const config = STAGE_CONFIGS[currentStage];
  const paveColor = shadeColor(config.bgColor, 16);
  const edgeColor = shadeColor(config.bgColor, -10);

  bctx.save();
  for (let s = 0; s < settlements.length; s++) {
    const meta = settlements[s]._townMeta;
    if (!meta) continue;
    const { cx, cy, plazaR, ringR, streets, townR, fields } = meta;

    // v0.10: 町の敷地＝広場円＋通りに沿った太い踏み固め帯＋環状路の有機的ブロブ
    bctx.globalAlpha = 0.50;
    bctx.fillStyle = paveColor;
    // 町全体の淡い土台（外縁に向けて消える放射グラデーション）
    const grad = bctx.createRadialGradient(cx, cy, plazaR, cx, cy, townR + 30);
    grad.addColorStop(0, paveColor);
    grad.addColorStop(1, "rgba(0,0,0,0)");
    bctx.fillStyle = grad;
    bctx.beginPath();
    bctx.arc(cx, cy, townR + 30, 0, Math.PI * 2);
    bctx.fill();
    // 広場（濃いめの石畳）
    bctx.globalAlpha = 0.55;
    bctx.fillStyle = paveColor;
    bctx.beginPath();
    bctx.arc(cx, cy, plazaR + 12, 0, Math.PI * 2);
    bctx.fill();
    // 通りの踏み固め帯
    bctx.strokeStyle = paveColor;
    bctx.lineCap = "round";
    bctx.globalAlpha = 0.40;
    bctx.lineWidth = 44;
    for (const st of streets) {
      bctx.beginPath();
      bctx.moveTo(cx, cy);
      bctx.lineTo(cx + Math.cos(st.angle) * st.len, cy + Math.sin(st.angle) * st.len);
      bctx.stroke();
    }
    bctx.lineWidth = 38;
    bctx.beginPath();
    bctx.arc(cx, cy, ringR, 0, Math.PI * 2);
    bctx.stroke();

    // v0.10: 畑 — 縞模様の耕作地＋柵。「人が住み、耕している土地」の記号
    for (const f of fields) {
      bctx.save();
      bctx.translate(f.x, f.y);
      bctx.rotate(f.angle);
      // 土のベース
      bctx.globalAlpha = 0.42;
      bctx.fillStyle = "rgba(150, 128, 74, 0.9)";
      bctx.fillRect(-f.w / 2, -f.h / 2, f.w, f.h);
      // 畝（うね）の縞
      bctx.globalAlpha = 0.35;
      bctx.strokeStyle = "rgba(96, 78, 44, 0.9)";
      bctx.lineWidth = 2.5;
      for (let fx = -f.w / 2 + 6; fx < f.w / 2 - 3; fx += 9) {
        bctx.beginPath();
        bctx.moveTo(fx, -f.h / 2 + 4);
        bctx.lineTo(fx, f.h / 2 - 4);
        bctx.stroke();
      }
      // 柵（外周）
      bctx.globalAlpha = 0.55;
      bctx.strokeStyle = "rgba(70, 52, 30, 0.9)";
      bctx.lineWidth = 2;
      bctx.strokeRect(-f.w / 2, -f.h / 2, f.w, f.h);
      bctx.restore();
    }
  }

  // tiny集落: 各棟の足元に踏み固めた土の広場
  bctx.globalAlpha = 0.30;
  bctx.fillStyle = paveColor;
  for (let s = 0; s < settlements.length; s++) {
    const st = settlements[s];
    if (!st._tinySettlement) continue;
    bctx.beginPath();
    bctx.ellipse(st.wx, st.wy, st.radius * 2.6, st.radius * 2.1, 0, 0, Math.PI * 2);
    bctx.fill();
  }
  bctx.restore();
  bctx.globalAlpha = 1.0;
}

function drawTownRoadsOnLayer(bctx, meta) {
  const { cx, cy, plazaR, ringR, streets, townR } = meta;

  // v0.7: 要塞都市には町全体を囲う「城郭リム」（v0.10: 円形に変更）
  if (meta._fortified) {
    bctx.save();
    bctx.strokeStyle = "rgba(224, 32, 48, 0.35)";
    bctx.lineWidth = 5;
    bctx.beginPath();
    bctx.arc(cx, cy, townR + 22, 0, Math.PI * 2);
    bctx.stroke();
    bctx.strokeStyle = "rgba(20, 20, 28, 0.55)";
    bctx.lineWidth = 2;
    bctx.beginPath();
    bctx.arc(cx, cy, townR + 27, 0, Math.PI * 2);
    bctx.stroke();
    bctx.restore();
  }

  // v0.10: 通りの中心線（放射状＋環状路＋広場の縁）を明るく見せる
  bctx.save();
  bctx.strokeStyle = "rgba(210, 195, 160, 0.18)";
  bctx.lineCap = "round";
  bctx.lineWidth = 9;
  for (const st of streets) {
    bctx.beginPath();
    bctx.moveTo(cx + Math.cos(st.angle) * plazaR * 0.6, cy + Math.sin(st.angle) * plazaR * 0.6);
    bctx.lineTo(cx + Math.cos(st.angle) * st.len, cy + Math.sin(st.angle) * st.len);
    bctx.stroke();
  }
  bctx.lineWidth = 7;
  bctx.beginPath();
  bctx.arc(cx, cy, ringR, 0, Math.PI * 2);
  bctx.stroke();
  // 広場の縁取り
  bctx.strokeStyle = "rgba(210, 195, 160, 0.22)";
  bctx.lineWidth = 2.5;
  bctx.beginPath();
  bctx.arc(cx, cy, plazaR - 4, 0, Math.PI * 2);
  bctx.stroke();
  bctx.restore();
}

// -----------------------------------------------------------------
// v0.9: 建物スプライトのティント（無彩色スプライト × 建物色 = 時代ごとの街並み）
// multiply で着色 → destination-in で元の透明度を復元する定番レシピ。
// キャッシュは (サイズ, 色) 単位。1ステージで使う色は十数種なので小さく収まる。
// -----------------------------------------------------------------
const _tintedBuildingCache = new Map();

// 建物色はshadeColorの±15ゆらぎで建物ごとに微妙に違う。そのままキャッシュキーに
// すると数百枚のティントcanvas（数十MB）になるため、RGB各24刻みに量子化して
// 色数を数十種に抑える（見た目の差はほぼ分からない）。
function quantizeTintColor(color) {
  let r = 128, g = 128, b = 128;
  if (color.startsWith("#") && color.length >= 7) {
    r = parseInt(color.slice(1, 3), 16);
    g = parseInt(color.slice(3, 5), 16);
    b = parseInt(color.slice(5, 7), 16);
  } else {
    const m = color.match(/rgb\((\d+),(\d+),(\d+)\)/);
    if (m) { r = +m[1]; g = +m[2]; b = +m[3]; }
  }
  const q = (v) => Math.min(255, Math.round(v / 24) * 24);
  return `rgb(${q(r)},${q(g)},${q(b)})`;
}

function getTintedBuildingSprite(sizeKey, rawColor) {
  const color = quantizeTintColor(rawColor);
  const cacheKey = sizeKey + "_" + color;
  const cached = _tintedBuildingCache.get(cacheKey);
  if (cached) return cached;
  const img = buildingImages[sizeKey];
  if (!img) return null;

  // ティントcanvasは128pxに縮小して保持する。建物の描画サイズは最大でも
  // 64ワールドpx程度なので画質は落ちず、キャッシュのメモリを1/4に抑えられる。
  const TINT_CANVAS_SIZE = 128;
  const scale = TINT_CANVAS_SIZE / Math.max(img.naturalWidth, img.naturalHeight);
  const tc = document.createElement("canvas");
  tc.width  = Math.max(1, Math.round(img.naturalWidth * scale));
  tc.height = Math.max(1, Math.round(img.naturalHeight * scale));
  const c = tc.getContext("2d");
  c.drawImage(img, 0, 0, tc.width, tc.height);
  c.globalCompositeOperation = "multiply";
  c.fillStyle = color;
  c.fillRect(0, 0, tc.width, tc.height);
  c.globalCompositeOperation = "destination-in";
  c.drawImage(img, 0, 0, tc.width, tc.height);

  _tintedBuildingCache.set(cacheKey, tc);
  return tc;
}

/** 建物に使うスプライトのサイズキーを返す（対象外の建物は null）。 */
function buildingSpriteKeyFor(settlement) {
  if (settlement._isWall || settlement.isBoss) return null;
  if (settlement._landmark) return settlement._landmark;  // v0.10: temple / windmill
  switch (settlement.size) {
    case "tiny":
    case "small":  return "small";
    case "medium": return "medium";
    case "large":  return "large";
    default:       return null;
  }
}

function drawSettlementOnLayer(bctx, settlement) {
  const alpha = settlement.fallen ? 0.22 : 1.0;
  const color = settlement.fallen ? "#333" : settlement.color;

  bctx.save();
  bctx.globalAlpha = alpha;

  // v0.8: ドロップシャドウ（立体感）。瓦礫と城壁・ボスには不要
  if (!settlement.fallen && !settlement._isWall && !settlement.isBoss) {
    bctx.globalAlpha = 0.30;
    bctx.fillStyle = "#000000";
    bctx.beginPath();
    bctx.ellipse(
      settlement.wx + settlement.radius * 0.18,
      settlement.wy + settlement.radius * 0.26,
      settlement.radius * 1.02, settlement.radius * 0.92, 0, 0, Math.PI * 2,
    );
    bctx.fill();
    bctx.globalAlpha = alpha;
  }

  // v0.9: 建物スプライトが使えるならティントして描画
  const spriteKey  = settlement.fallen ? null : buildingSpriteKeyFor(settlement);
  const tinted     = spriteKey ? getTintedBuildingSprite(spriteKey, color) : null;
  // v0.9.1: 陥落建物は廃墟スプライト（城壁セグメントだけは従来の瓦礫ベクター）
  const ruinImg    = (settlement.fallen && !settlement._isWall) ? buildingImages.ruin : null;
  const usedSprite = !!tinted || !!ruinImg;

  if (ruinImg) {
    // v0.11: 廃墟は元建物（radius*2.3）を完全に覆うサイズに拡大し、
    // ほぼ不透明で描いて下の元建物や地面が透けないようにする（陥落跡の見た目修正）。
    const drawW = settlement.radius * 2.6;
    const drawH = drawW * (ruinImg.naturalHeight / ruinImg.naturalWidth);
    // 座標由来の決定的な90度回転＋反転で同じ廃墟の並びに見えないようにする
    const seed = Math.floor(settlement.wx * 7 + settlement.wy * 13);
    bctx.save();
    bctx.globalAlpha = 0.95;
    bctx.translate(settlement.wx, settlement.wy);
    bctx.rotate((seed % 4) * Math.PI / 2);
    bctx.scale(seed % 2 === 0 ? 1 : -1, 1);
    bctx.drawImage(ruinImg, -drawW / 2, -drawH / 2, drawW, drawH);
    bctx.restore();
  } else if (tinted) {
    const drawW = settlement.radius * (settlement._landmark ? 2.6 : 2.3);
    const drawH = drawW * (tinted.height / tinted.width);
    // 座標由来の決定的な左右反転でタイル感を減らす
    const flip = (Math.floor(settlement.wx * 7 + settlement.wy * 13) % 2 === 0) ? 1 : -1;
    bctx.save();
    bctx.translate(settlement.wx, settlement.wy);
    // v0.10: 通りに面する向きで建物を回転（有機的な街並みの核）
    bctx.rotate(settlement._faceAngle ?? 0);
    bctx.scale(flip, 1);
    bctx.drawImage(tinted, -drawW / 2, -drawH / 2, drawW, drawH);
    bctx.restore();
  } else {
  switch (settlement.shape) {
    case "circle":      drawCircleOnCtx(bctx, settlement.wx, settlement.wy, settlement.radius, color); break;
    case "square":      drawSquareOnCtx(bctx, settlement.wx, settlement.wy, settlement.radius, color); break;
    case "squareTower": drawSquareTowerOnCtx(bctx, settlement.wx, settlement.wy, settlement.radius, color); break;
    case "hexagon":     drawHexagonOnCtx(bctx, settlement.wx, settlement.wy, settlement.radius, color); break;
    case "triangle":    drawTriangleOnCtx(bctx, settlement.wx, settlement.wy, settlement.radius, color); break;
    case "polygon":     drawPolygonOnCtx(bctx, settlement.wx, settlement.wy, settlement.radius, color); break;
    case "star":        drawStarOnCtx(bctx, settlement.wx, settlement.wy, settlement.radius, color, 5); break;
    case "star4":       drawStarOnCtx(bctx, settlement.wx, settlement.wy, settlement.radius, color, 4); break;
    // ボス集落専用形状: 外輪グロー + 多重リング + 中心十字で一目でボスと分かる
    case "bossCircle":
      drawBossOnLayer(bctx, settlement, color);
      break;
    // v0.6-p3: 城壁セグメント（リング接線方向に回転した石ブロック）
    case "wallSegment":
      drawWallSegmentOnCtx(bctx, settlement, color);
      break;
    default:            drawCircleOnCtx(bctx, settlement.wx, settlement.wy, settlement.radius, color); break;
  }
  }

  // v0.8: 屋根のシェーディング（左上のシーン＋窓明かり）で建物のクオリティを上げる
  // v0.9: スプライト描画時はスプライト自体に陰影があるためスキップ
  if (!usedSprite && !settlement.fallen && !settlement._isWall && !settlement.isBoss) {
    const swx = settlement.wx;
    const swy = settlement.wy;
    const sr  = settlement.radius;
    // 左上のハイライト（陽の当たる面）
    bctx.globalAlpha = 0.16;
    bctx.fillStyle = "#ffffff";
    bctx.beginPath();
    bctx.arc(swx - sr * 0.30, swy - sr * 0.32, sr * 0.48, 0, Math.PI * 2);
    bctx.fill();
    bctx.globalAlpha = 1.0;
    // 窓明かり（medium/large のみ。座標由来の決定的配置で焼き付ける）
    if (settlement.size === "medium" || settlement.size === "large") {
      const windowCount = settlement.size === "large" ? 4 : 2;
      bctx.fillStyle = "rgba(255, 220, 130, 0.75)";
      for (let k = 0; k < windowCount; k++) {
        const seed  = Math.sin(swx * 0.37 + swy * 0.61 + k * 5.3);
        const angle = seed * Math.PI * 2;
        const dist  = sr * (0.28 + 0.30 * Math.abs(Math.sin(seed * 13.7)));
        bctx.fillRect(swx + Math.cos(angle) * dist - 1.2, swy + Math.sin(angle) * dist - 1.2, 2.4, 2.4);
      }
    }
  }

  // v0.7: 要塞都市の建物は「明らかに強そう」な装飾を重ねる
  // （黒鉄の太い輪郭＋屋上の深紅の軍旗。fallen 後は通常の瓦礫と同じ見た目に落ちる）
  if (settlement._fortified && !settlement.fallen) {
    const wx = settlement.wx;
    const wy = settlement.wy;
    const r  = settlement.radius;
    // 黒鉄の輪郭（二重）
    bctx.strokeStyle = "rgba(20, 20, 28, 0.9)";
    bctx.lineWidth = 2.5;
    bctx.beginPath();
    bctx.arc(wx, wy, r + 2, 0, Math.PI * 2);
    bctx.stroke();
    bctx.strokeStyle = "rgba(255, 60, 60, 0.55)";
    bctx.lineWidth = 1;
    bctx.beginPath();
    bctx.arc(wx, wy, r + 4, 0, Math.PI * 2);
    bctx.stroke();
    // 深紅の軍旗（ポール＋三角旗）
    bctx.strokeStyle = "#404048";
    bctx.lineWidth = 1.2;
    bctx.beginPath();
    bctx.moveTo(wx, wy - r);
    bctx.lineTo(wx, wy - r - 9);
    bctx.stroke();
    bctx.fillStyle = "#e02030";
    bctx.beginPath();
    bctx.moveTo(wx, wy - r - 9);
    bctx.lineTo(wx + 7, wy - r - 6.5);
    bctx.lineTo(wx, wy - r - 4);
    bctx.closePath();
    bctx.fill();
  }

  bctx.restore();
}

/**
 * v0.6-p3: 城壁セグメントを描画する。
 * リング接線方向（_wallAngle）に回転した石ブロック＋胸壁の刻みで「城壁」に見せる。
 * fallen 時は呼び出し元の alpha=0.22/color="#333" でそのまま瓦礫化する。
 */
function drawWallSegmentOnCtx(c, settlement, color) {
  const halfL = WALL_SEG_SPACING * 0.5 + 3; // 隣セグメントと視覚的につながる長さ
  const halfW = 9;                          // 壁の厚み（見た目）
  c.save();
  c.translate(settlement.wx, settlement.wy);
  c.rotate(settlement._wallAngle);

  // 壁本体
  c.fillStyle = color;
  c.strokeStyle = "rgba(255,255,255,0.35)";
  c.lineWidth = 1.5;
  c.fillRect(-halfL, -halfW, halfL * 2, halfW * 2);
  c.strokeRect(-halfL, -halfW, halfL * 2, halfW * 2);

  // 胸壁の刻み（上辺の凸凹）
  if (!settlement.fallen) {
    c.fillStyle = shadeColor("#6a7078", 25);
    const merlonW = 8;
    for (let mx = -halfL + 2; mx < halfL - merlonW; mx += merlonW * 2) {
      c.fillRect(mx, -halfW - 3, merlonW, 3);
    }
  }
  c.restore();
}

/**
 * v0.6-p3: 地形障害物（岩山・湖）を静的レイヤーに焼く。
 * 岩山: 灰色の多角形の山＋ハイライト。湖: 深い青の楕円＋岸のリム。
 */
function drawTerrainOnLayer(bctx) {
  for (const ob of terrainObstacles) {
    if (ob.type === "rock") {
      // ごつごつした多角形（座標由来の決定的ジッター）
      bctx.fillStyle = "#4a4e52";
      bctx.strokeStyle = "rgba(255,255,255,0.25)";
      bctx.lineWidth = 2;
      bctx.beginPath();
      const sides = 8;
      for (let k = 0; k < sides; k++) {
        const angle  = (k * Math.PI * 2) / sides;
        const jitter = 0.75 + 0.25 * ((Math.sin(k * 7.3 + ob.wx * 0.013) + 1) * 0.5);
        const rx = ob.wx + Math.cos(angle) * ob.radius * jitter;
        const ry = ob.wy + Math.sin(angle) * ob.radius * jitter;
        if (k === 0) bctx.moveTo(rx, ry); else bctx.lineTo(rx, ry);
      }
      bctx.closePath();
      bctx.fill();
      bctx.stroke();
      // 山頂ハイライト
      bctx.fillStyle = "#6a7076";
      bctx.beginPath();
      bctx.arc(ob.wx - ob.radius * 0.18, ob.wy - ob.radius * 0.22, ob.radius * 0.38, 0, Math.PI * 2);
      bctx.fill();
    } else {
      // 湖: 深い青＋岸のリム
      bctx.fillStyle = "rgba(30, 60, 110, 0.85)";
      bctx.strokeStyle = "rgba(120, 180, 230, 0.45)";
      bctx.lineWidth = 2.5;
      bctx.beginPath();
      bctx.ellipse(ob.wx, ob.wy, ob.radius, ob.radius * 0.78, ob.wx * 0.01, 0, Math.PI * 2);
      bctx.fill();
      bctx.stroke();
    }
  }
}

/**
 * ボス集落をオフスクリーンCanvasに描画する。
 * 外輪グロー（薄い大円）＋実体（二重リング）＋中心の8角星＋十字マークで
 * 小集落とは明確に差別化した外観を作る。
 * fallen 時は通常建物と同じく暗く潰れる（alpha=0.22, color="#333" で呼ばれる）。
 */
function drawBossOnLayer(bctx, settlement, color) {
  const wx = settlement.wx;
  const wy = settlement.wy;
  const r  = settlement.radius;        // BOSS_RADIUS = 46
  const glowColor = settlement._bossGlowColor ?? color;
  const isFallen  = settlement.fallen;

  if (isFallen) {
    // 陥落後は単純な暗い大円にまとめる（視認は残すが存在感は消す）
    bctx.fillStyle = color;
    bctx.beginPath();
    bctx.arc(wx, wy, r, 0, Math.PI * 2);
    bctx.fill();
    return;
  }

  // --- 外輪グロー（大きな半透明円） ---
  // 半透明でじわっと広がる光。オフスクリーン焼き付けなので毎フレームコストゼロ。
  bctx.globalAlpha = 0.18;
  bctx.fillStyle   = glowColor;
  bctx.beginPath();
  bctx.arc(wx, wy, r * 1.7, 0, Math.PI * 2);
  bctx.fill();

  bctx.globalAlpha = 0.10;
  bctx.fillStyle   = glowColor;
  bctx.beginPath();
  bctx.arc(wx, wy, r * 2.2, 0, Math.PI * 2);
  bctx.fill();

  bctx.globalAlpha = 1.0;

  // --- 外リング（太い輪郭） ---
  bctx.strokeStyle = glowColor;
  bctx.lineWidth   = 4;
  bctx.beginPath();
  bctx.arc(wx, wy, r, 0, Math.PI * 2);
  bctx.stroke();

  // --- 実体（中塗り） ---
  const grad = bctx.createRadialGradient(wx, wy, r * 0.1, wx, wy, r * 0.95);
  grad.addColorStop(0.0, glowColor);
  grad.addColorStop(0.5, color);
  grad.addColorStop(1.0, "rgba(0,0,0,0.6)");
  bctx.fillStyle = grad;
  bctx.beginPath();
  bctx.arc(wx, wy, r, 0, Math.PI * 2);
  bctx.fill();

  // --- 内リング --- （中心との境界を強調）
  bctx.strokeStyle = "rgba(255,255,255,0.55)";
  bctx.lineWidth   = 1.5;
  bctx.beginPath();
  bctx.arc(wx, wy, r * 0.55, 0, Math.PI * 2);
  bctx.stroke();

  // --- 8角星（中心マーク） ---
  drawStarOnCtx(bctx, wx, wy, r * 0.35, glowColor, 8);

  // --- 十字ライン（城砦感） ---
  bctx.strokeStyle = "rgba(255,255,255,0.40)";
  bctx.lineWidth   = 1.5;
  const cr = r * 0.85;
  bctx.beginPath();
  bctx.moveTo(wx - cr, wy); bctx.lineTo(wx + cr, wy);
  bctx.moveTo(wx, wy - cr); bctx.lineTo(wx, wy + cr);
  bctx.stroke();

  // --- 外縁の白い輪郭線（存在感を締める） ---
  bctx.strokeStyle = "rgba(255,255,255,0.70)";
  bctx.lineWidth   = 2;
  bctx.beginPath();
  bctx.arc(wx, wy, r + 2, 0, Math.PI * 2);
  bctx.stroke();
}

// -----------------------------------------------------------------
// 建物形状描画（オフスクリーン用・メインCanvas用共通）
// -----------------------------------------------------------------
function drawCircleOnCtx(c, wx, wy, r, color) {
  c.fillStyle = color;
  c.strokeStyle = "rgba(255,255,255,0.4)";
  c.lineWidth = 1.5;
  c.beginPath();
  c.arc(wx, wy, r, 0, Math.PI * 2);
  c.fill();
  c.stroke();
}

function drawSquareOnCtx(c, wx, wy, r, color) {
  c.fillStyle = color;
  c.strokeStyle = "rgba(255,255,255,0.35)";
  c.lineWidth = 1.5;
  c.fillRect(wx - r, wy - r, r * 2, r * 2);
  c.strokeRect(wx - r, wy - r, r * 2, r * 2);
}

function drawSquareTowerOnCtx(c, wx, wy, r, color) {
  c.fillStyle = color;
  c.strokeStyle = "rgba(255,255,255,0.4)";
  c.lineWidth = 1.5;
  c.fillRect(wx - r, wy - r, r * 2, r * 2);
  c.strokeRect(wx - r, wy - r, r * 2, r * 2);
  const towerSize = r * 0.4;
  const positions = [
    [wx - r, wy - r], [wx + r - towerSize, wy - r],
    [wx - r, wy + r - towerSize], [wx + r - towerSize, wy + r - towerSize],
  ];
  c.fillStyle = shadeColor(color, -20);
  for (const [tx, ty] of positions) {
    c.fillRect(tx, ty, towerSize, towerSize);
  }
}

function drawHexagonOnCtx(c, wx, wy, r, color) {
  c.fillStyle = color;
  c.strokeStyle = "rgba(255,255,255,0.5)";
  c.lineWidth = 1.5;
  c.beginPath();
  for (let k = 0; k < 6; k++) {
    const angle = (k * Math.PI * 2) / 6 - Math.PI / 6;
    if (k === 0) c.moveTo(wx + Math.cos(angle) * r, wy + Math.sin(angle) * r);
    else c.lineTo(wx + Math.cos(angle) * r, wy + Math.sin(angle) * r);
  }
  c.closePath();
  c.fill();
  c.stroke();
}

function drawTriangleOnCtx(c, wx, wy, r, color) {
  c.fillStyle = color;
  c.strokeStyle = "rgba(255,255,255,0.45)";
  c.lineWidth = 1.5;
  c.beginPath();
  c.moveTo(wx, wy - r);
  c.lineTo(wx + r * 0.9, wy + r * 0.7);
  c.lineTo(wx - r * 0.9, wy + r * 0.7);
  c.closePath();
  c.fill();
  c.stroke();
}

function drawPolygonOnCtx(c, wx, wy, r, color) {
  c.fillStyle = color;
  c.strokeStyle = "rgba(255,255,255,0.3)";
  c.lineWidth = 1.5;
  const sides = 5 + ((Math.round(wx + wy) % 3));
  c.beginPath();
  for (let k = 0; k < sides; k++) {
    const baseAngle = (k * Math.PI * 2) / sides;
    const jitter = 0.65 + 0.35 * ((Math.sin(k * 13.7 + wx * 0.01) + 1) * 0.5);
    const rx = wx + Math.cos(baseAngle) * r * jitter;
    const ry = wy + Math.sin(baseAngle) * r * jitter;
    if (k === 0) c.moveTo(rx, ry);
    else c.lineTo(rx, ry);
  }
  c.closePath();
  c.fill();
  c.stroke();
}

function drawStarOnCtx(c, wx, wy, r, color, spikes) {
  c.fillStyle = color;
  c.strokeStyle = "rgba(255,255,255,0.4)";
  c.lineWidth = 1.5;
  c.beginPath();
  const innerR = r * 0.50;
  for (let k = 0; k < spikes * 2; k++) {
    const angle = (k * Math.PI) / spikes - Math.PI / 2;
    const rad = k % 2 === 0 ? r : innerR;
    if (k === 0) c.moveTo(wx + Math.cos(angle) * rad, wy + Math.sin(angle) * rad);
    else c.lineTo(wx + Math.cos(angle) * rad, wy + Math.sin(angle) * rad);
  }
  c.closePath();
  c.fill();
  c.stroke();
}

// -----------------------------------------------------------------
// 投射物プール（最大200個）
// -----------------------------------------------------------------
const MAX_PROJECTILES = 200;

const projWx        = new Float32Array(MAX_PROJECTILES);
const projWy        = new Float32Array(MAX_PROJECTILES);
const projVx        = new Float32Array(MAX_PROJECTILES);
const projVy        = new Float32Array(MAX_PROJECTILES);
const projActive    = new Uint8Array(MAX_PROJECTILES);
const projDmg       = new Float32Array(MAX_PROJECTILES);
const projAoe       = new Float32Array(MAX_PROJECTILES);
const projTracking  = new Uint8Array(MAX_PROJECTILES);
const projTargetIdx = new Int32Array(MAX_PROJECTILES);
const projColor     = new Array(MAX_PROJECTILES).fill("#fff");
const projTailX     = new Float32Array(MAX_PROJECTILES);
const projTailY     = new Float32Array(MAX_PROJECTILES);
// 変更3: 飛距離管理用 SoA（発射点を記録して走破距離で消滅判定する）
const projStartWx   = new Float32Array(MAX_PROJECTILES);
const projStartWy   = new Float32Array(MAX_PROJECTILES);
// 変更5: 投射物種別 SoA（0=arrow 通常矢弾、1=catapult カタパルト弾）
// Uint8Array: 0 or 1 で表現。初期化漏れなし（new Uint8Array はゼロ初期化される）
const projKind      = new Uint8Array(MAX_PROJECTILES); // 0=arrow, 1=catapult

// 変更3: 投射物パラメータ定数
// 弾速倍率: ステージ設定の projectileSpeed にこの倍率を掛けて「大型矢」の重厚な速さにする。
const PROJECTILE_SPEED_MULT  = 3.6;
// 変更5: 種別ごとの飛距離上限（px）
// カタパルト弾: 広い射程（大型・首都・ボスのみが撃つ威圧感）
const PROJECTILE_MAX_RANGE   = 420; // catapult 用（従来値を維持）
// 通常矢弾: 短い射程（small/tiny/medium が撃つ。近づかないと当たらない）
const ARROW_MAX_RANGE        = 250;

// 変更5: 種別ごとのノックバック速度（px/s）
// カタパルト弾: 強いノックバック（大型・首都・ボスの圧力感）
const CATAPULT_KNOCKBACK_SPEED = 220; // 旧120→220へ増強
// 通常矢弾: 弱いノックバック（ちょっと押される程度）
const ARROW_KNOCKBACK_SPEED    = 60;

// 変更5: kind=0(arrow) / kind=1(catapult)
function spawnProjectile(fromWx, fromWy, targetBoidIdx, speed, damage, color, aoe, isTracking, kind) {
  let slot = -1;
  for (let i = 0; i < MAX_PROJECTILES; i++) {
    if (!projActive[i]) { slot = i; break; }
  }
  if (slot < 0) return;

  // 変更3: 弾速倍率を適用（大型矢の重厚な速さ）
  const actualSpeed = speed * PROJECTILE_SPEED_MULT;

  projActive[slot]     = 1;
  projWx[slot]         = fromWx;
  projWy[slot]         = fromWy;
  projTailX[slot]      = fromWx;
  projTailY[slot]      = fromWy;
  // 変更3: 発射点を記録（飛距離上限判定用）
  projStartWx[slot]    = fromWx;
  projStartWy[slot]    = fromWy;
  projDmg[slot]        = damage;
  projAoe[slot]        = aoe ?? 0;
  projTracking[slot]   = isTracking ? 1 : 0;
  projTargetIdx[slot]  = targetBoidIdx;
  projColor[slot]      = color;
  // 変更5: 種別を記録（デフォルト 0=arrow）
  projKind[slot]       = (kind === 1) ? 1 : 0;

  if (targetBoidIdx >= 0 && !boidDead[targetBoidIdx]) {
    const dx = px[targetBoidIdx] - fromWx;
    const dy = py[targetBoidIdx] - fromWy;
    const d  = Math.sqrt(dx * dx + dy * dy) || 1;
    projVx[slot] = (dx / d) * actualSpeed;
    projVy[slot] = (dy / d) * actualSpeed;
  } else {
    projVx[slot] = actualSpeed;
    projVy[slot] = 0;
  }
}

function findNearestAliveBoid(wx, wy) {
  let nearest = -1;
  let nearestDist2 = Infinity;
  for (let i = 0; i < N; i++) {
    // 変更2: ダウン中の個体は投射物のターゲットにしない
    if (boidDead[i] || boidDowned[i]) continue;
    const dx = px[i] - wx;
    const dy = py[i] - wy;
    const d2 = dx * dx + dy * dy;
    if (d2 < nearestDist2) {
      nearestDist2 = d2;
      nearest = i;
    }
  }
  return nearest;
}

// 建物のSpatial Hash（ブレス射程判定用）
// 建物は静的なのでステージ生成時に1回だけ構築する
const buildingGrid = new Map();
const BUILDING_GRID_CELL = 100; // セルサイズ（px）

function buildingGridClear() { buildingGrid.clear(); }

function buildingGridInsert(settlementIdx, wx, wy) {
  const cx = (wx / BUILDING_GRID_CELL) | 0;
  const cy = (wy / BUILDING_GRID_CELL) | 0;
  const key = cx * 100003 + cy;
  let bucket = buildingGrid.get(key);
  if (!bucket) { bucket = []; buildingGrid.set(key, bucket); }
  bucket.push(settlementIdx);
}

function buildingGridQuery(wx, wy, out) {
  out.length = 0;
  const cx = (wx / BUILDING_GRID_CELL) | 0;
  const cy = (wy / BUILDING_GRID_CELL) | 0;
  // BREATH_RANGE 80px を BUILDING_GRID_CELL 100px で割ると1セル以内に収まる
  for (let dy = -1; dy <= 1; dy++) {
    for (let dx = -1; dx <= 1; dx++) {
      const key = (cx + dx) * 100003 + (cy + dy);
      const b = buildingGrid.get(key);
      if (b) for (const idx of b) out.push(idx);
    }
  }
}

// v0.6: 走査セル半径を指定できる版。「射程延伸」でブレス射程が
// グリッドセル（100px）を超えたときに取りこぼしを防ぐ。
function buildingGridQueryRadius(wx, wy, cellRadius, out) {
  out.length = 0;
  const cx = (wx / BUILDING_GRID_CELL) | 0;
  const cy = (wy / BUILDING_GRID_CELL) | 0;
  for (let dy = -cellRadius; dy <= cellRadius; dy++) {
    for (let dx = -cellRadius; dx <= cellRadius; dx++) {
      const key = (cx + dx) * 100003 + (cy + dy);
      const b = buildingGrid.get(key);
      if (b) for (const idx of b) out.push(idx);
    }
  }
}

function rebuildBuildingGrid() {
  buildingGridClear();
  for (let s = 0; s < settlements.length; s++) {
    if (!settlements[s].fallen) {
      buildingGridInsert(s, settlements[s].wx, settlements[s].wy);
    }
  }
}

// 建物Spatial Hashの近傍クエリ用バッファ
const _buildingNeighbourBuf = [];

// 攻撃判定ゲート用: フレーム内で「射程内にドラゴンがいる」とマークされた建物インデックスの集合。
// ドラゴン側から建物ハッシュをたどる逆引き方式で、群れから遠い建物の全ドラゴン走査を省く。
// Set は毎フレームクリアして使い回す。
const _settlementsInRange = new Set();

// 攻撃判定に使う空間ハッシュのセルサイズ。
// 最大attackRadius=300px を1クエリ(±1セル)でカバーするには cellSize >= 300 が必要。
// BUILDING_GRID_CELL=100 は 100px 範囲クエリ用なので、攻撃判定用に別グリッドを持つ。
// ただし、専用グリッドを別途維持するコストを避けるため、以下の方式を採る:
// 「各ドラゴンの位置から最大攻撃射程(MAX_ATTACK_RADIUS)内の建物グリッドセルを走査し、
//  ヒットした建物インデックスを _settlementsInRange に登録する」
// BUILDING_GRID_CELL=100 で cellRadius=ceil(300/100)=3 → ±3セル(7×7=49セル) のクエリ
// ボスの BOSS_ATTACK_RADIUS=380 が最大値。空間ハッシュクエリ半径もこれに合わせる。
const MAX_ATTACK_RADIUS = 380; // ボスの attackRadius（最大値）
const _ATKCELL_RADIUS = Math.ceil(MAX_ATTACK_RADIUS / BUILDING_GRID_CELL); // = 4

// ドラゴン位置周辺の建物を攻撃判定グリッドで収集する
function _queryBuildingsForAttack(bx, by) {
  const cx = (bx / BUILDING_GRID_CELL) | 0;
  const cy = (by / BUILDING_GRID_CELL) | 0;
  for (let dy = -_ATKCELL_RADIUS; dy <= _ATKCELL_RADIUS; dy++) {
    for (let dx = -_ATKCELL_RADIUS; dx <= _ATKCELL_RADIUS; dx++) {
      const key = (cx + dx) * 100003 + (cy + dy);
      const bucket = buildingGrid.get(key);
      if (bucket) {
        for (const idx of bucket) _settlementsInRange.add(idx);
      }
    }
  }
}

function updateSettlementAttacks(dt) {
  // (A) 逆引き方式: ドラゴン側から「近くの建物」を空間ハッシュで収集する。
  // 群れ全体でO(N × (2*cellRadius+1)^2) ≈ O(N × 49)。
  // 群れから遠い大多数の建物は Set に入らないため全ドラゴン走査から除外される。
  _settlementsInRange.clear();
  for (let i = 0; i < N; i++) {
    if (boidDead[i] || boidDowned[i]) continue;
    _queryBuildingsForAttack(px[i], py[i]);
  }

  // (B) Set 内の建物だけ射程内判定・発射処理する。
  // Set サイズは群れ近傍の建物数のみ（遠方の建物は含まれない）。
  for (const s of _settlementsInRange) {
    const settlement = settlements[s];
    if (!settlement || settlement.fallen) continue;

    let inRange = false;
    const atkR2 = settlement.attackRadius * settlement.attackRadius;
    for (let i = 0; i < N; i++) {
      if (boidDead[i] || boidDowned[i]) continue;
      const dx = px[i] - settlement.wx;
      const dy = py[i] - settlement.wy;
      if (dx * dx + dy * dy < atkR2) { inRange = true; break; }
    }
    if (!inRange) continue;

    settlement.attackTimer -= dt;
    if (settlement.attackTimer > 0) continue;
    // 通常建物: 発射頻度を大幅に下げる（×4倍の間隔 = たまに飛ぶ「雰囲気」として残す）
    // ボス: projectileInterval をそのまま使う（定数で設定した高頻度を活かす）
    settlement.attackTimer = settlement.isBoss
      ? settlement.projectileInterval
      : settlement.projectileInterval * 4.0;

    const targetIdx = findNearestAliveBoid(settlement.wx, settlement.wy);
    if (targetIdx < 0) continue;

    // 変更5: 集落種別に応じて弾種を決定する。
    // ボス → ボス重弾（kind=2: 位置ごと押し戻す強烈なノックバック。v0.7）
    // large・首都（_isCapital）→ カタパルト弾（kind=1: 強ノックバック・大きな矢）
    // それ以外（small/tiny/medium）→ 通常矢弾（kind=0: 小さく・射程短い・弱ノックバック）
    const isCatapultShooter = settlement._isCapital || settlement.size === "large";
    const kind = settlement.isBoss ? 2 : (isCatapultShooter ? 1 : 0);

    const count = settlement.projectileCount;
    if (count === 1) {
      spawnProjectile(
        settlement.wx, settlement.wy,
        targetIdx,
        settlement.projectileSpeed,
        settlement.projectileDamage,
        settlement.projectileColor,
        settlement.projectileAoe,
        settlement.projectileTracking,
        kind,
      );
    } else if (count === 2) {
      const baseAngle = calcAngleToTarget(settlement.wx, settlement.wy, targetIdx);
      for (let k = -1; k <= 0; k++) {
        spawnFanProjectileRaw(
          settlement.wx, settlement.wy,
          baseAngle + k * 0.4,
          settlement.projectileSpeed,
          settlement.projectileDamage,
          settlement.projectileColor,
          kind,
        );
      }
    } else if (count === 3) {
      const baseAngle = calcAngleToTarget(settlement.wx, settlement.wy, targetIdx);
      for (let k = -1; k <= 1; k++) {
        spawnFanProjectileRaw(
          settlement.wx, settlement.wy,
          baseAngle + k * 0.3,
          settlement.projectileSpeed,
          settlement.projectileDamage,
          settlement.projectileColor,
          kind,
        );
      }
    } else {
      const angleStep = (Math.PI * 2) / count;
      const baseAngle = Math.random() * Math.PI * 2;
      for (let k = 0; k < count; k++) {
        spawnFanProjectileRaw(
          settlement.wx, settlement.wy,
          baseAngle + k * angleStep,
          settlement.projectileSpeed,
          settlement.projectileDamage,
          settlement.projectileColor,
          kind,
        );
      }
    }
  }
}

function calcAngleToTarget(fromX, fromY, targetBoidIdx) {
  if (targetBoidIdx < 0) return 0;
  return Math.atan2(py[targetBoidIdx] - fromY, px[targetBoidIdx] - fromX);
}

// 変更5: kind=0(arrow) / kind=1(catapult)
function spawnFanProjectileRaw(fromWx, fromWy, angle, speed, damage, color, kind) {
  let slot = -1;
  for (let i = 0; i < MAX_PROJECTILES; i++) {
    if (!projActive[i]) { slot = i; break; }
  }
  if (slot < 0) return;
  // 変更3: 弾速倍率を適用
  const actualSpeed = speed * PROJECTILE_SPEED_MULT;
  projActive[slot]     = 1;
  projWx[slot]         = fromWx;
  projWy[slot]         = fromWy;
  projTailX[slot]      = fromWx;
  projTailY[slot]      = fromWy;
  // 変更3: 発射点を記録（飛距離上限判定用）
  projStartWx[slot]    = fromWx;
  projStartWy[slot]    = fromWy;
  projVx[slot]         = Math.cos(angle) * actualSpeed;
  projVy[slot]         = Math.sin(angle) * actualSpeed;
  projDmg[slot]        = damage;
  projAoe[slot]        = 0;
  projTracking[slot]   = 0;
  projTargetIdx[slot]  = -1;
  projColor[slot]      = color;
  // 変更5: 種別を記録（デフォルト 0=arrow）
  projKind[slot]       = (kind === 1) ? 1 : 0;
}

function updateProjectiles(dt) {
  for (let i = 0; i < MAX_PROJECTILES; i++) {
    if (!projActive[i]) continue;

    if (projTracking[i] && projTargetIdx[i] >= 0 && !boidDead[projTargetIdx[i]]) {
      const dx = px[projTargetIdx[i]] - projWx[i];
      const dy = py[projTargetIdx[i]] - projWy[i];
      const d  = Math.sqrt(dx * dx + dy * dy) || 1;
      const currentSpeed = Math.sqrt(projVx[i] * projVx[i] + projVy[i] * projVy[i]);
      projVx[i] += (dx / d * currentSpeed - projVx[i]) * 0.06;
      projVy[i] += (dy / d * currentSpeed - projVy[i]) * 0.06;
    }

    projTailX[i] = projWx[i];
    projTailY[i] = projWy[i];

    projWx[i] += projVx[i] * dt;
    projWy[i] += projVy[i] * dt;

    if (projWx[i] < -50 || projWx[i] > WORLD_W + 50 || projWy[i] < -50 || projWy[i] > WORLD_H + 50) {
      projActive[i] = 0;
      continue;
    }

    // 変更5: 飛距離上限チェック（種別ごとに異なる最大射程を適用）
    // catapult(kind=1): PROJECTILE_MAX_RANGE=420px（広い射程）
    // arrow  (kind=0): ARROW_MAX_RANGE=250px（短い射程、近づかないと当たらない）
    const tdx      = projWx[i] - projStartWx[i];
    const tdy      = projWy[i] - projStartWy[i];
    const maxRange = projKind[i] === 2 ? BOSS_SHOT_MAX_RANGE
                   : projKind[i] === 1 ? PROJECTILE_MAX_RANGE
                   : ARROW_MAX_RANGE;
    if (tdx * tdx + tdy * tdy > maxRange * maxRange) {
      projActive[i] = 0;
      continue;
    }

    // v0.6-p3: 岩山は敵の投射も止める（岩陰に隠れる立ち回りが生まれる）
    let blockedByRock = false;
    for (const ob of terrainObstacles) {
      if (ob.type !== "rock") continue;
      const rdx = ob.wx - projWx[i];
      const rdy = ob.wy - projWy[i];
      if (rdx * rdx + rdy * rdy < ob.radius * ob.radius) { blockedByRock = true; break; }
    }
    if (blockedByRock) {
      projActive[i] = 0;
      continue;
    }

    checkProjectileHitBoids(i);
  }
}

// 投射物ダメージ係数: 1ヒットで BOID_MAX_HP の 1/7 程度（数発耐える）
// 0.0 から復活。ダウンモデルにより恒久消滅しないのでダメージを有効化する。
const PROJECTILE_DAMAGE_MULTIPLIER = 1.0;

// 変更3: 投射物命中時のノックバック速度（px/s）
// 弾の進行方向と同方向に押し出す（矢が刺さって押される感覚）。
// 120px/s は maxSpeed(160) の75%なので体感できるが maxSpeed クランプで飛び出さない。
const PROJECTILE_KNOCKBACK_SPEED = 120;

function checkProjectileHitBoids(projIdx) {
  const HIT_R  = 8;
  const HIT_R2 = HIT_R * HIT_R;

  // トンネリング対策: 弾速が高いと1フレームで HIT_R を超える距離を移動しうる。
  // テール（前フレーム位置）と現在位置の中間点でも判定することで
  // 最大936 px/s（260 × 3.6）の弾でもすり抜けを防ぐ。
  // 中間点 = tailX + (wx - tailX) * 0.5。2ステップで直径16pxのギャップをカバーできる。
  const midX = (projWx[projIdx] + projTailX[projIdx]) * 0.5;
  const midY = (projWy[projIdx] + projTailY[projIdx]) * 0.5;

  for (let i = 0; i < N; i++) {
    if (boidDead[i] || boidDowned[i]) continue;

    // 現在位置で判定
    let dx = projWx[projIdx] - px[i];
    let dy = projWy[projIdx] - py[i];
    let hit = dx * dx + dy * dy < HIT_R2;

    // 当たらなければ中間点でも判定（高速弾のトンネリングを防ぐ）
    if (!hit) {
      dx  = midX - px[i];
      dy  = midY - py[i];
      hit = dx * dx + dy * dy < HIT_R2;
    }

    if (hit) {
      applyDamageToBoid(i, PROJECTILE_HIT_DAMAGE * PROJECTILE_DAMAGE_MULTIPLIER);
      // v0.7: AoE弾（爆撃気球・古代の投石など projectileAoe>0）は着弾点周囲にも被害
      if (projAoe[projIdx] > 0) {
        applyAoeProjectileDamage(projWx[projIdx], projWy[projIdx], projAoe[projIdx],
                                 projDmg[projIdx] * 0.6);
        spawnCollisionParticles(projWx[projIdx], projWy[projIdx]);
      }
      spawnHitParticles(projWx[projIdx], projWy[projIdx]);
      if (!boidDowned[i]) applyProjectileKnockback(i, projIdx);
      projActive[projIdx] = 0;
      return;
    }
  }
}

function applyProjectileKnockback(boidIdx, projIdx) {
  // v0.6-p2: 緋竜（MELEE）はノックバック無効（突っ込み続ける。仕様 §6.4）
  if (flockWeapon === "melee") return;

  const pvx    = projVx[projIdx];
  const pvy    = projVy[projIdx];
  const pspeed = Math.sqrt(pvx * pvx + pvy * pvy) || 1;
  const nx = pvx / pspeed;
  const ny = pvy / pspeed;

  // v0.7: ボス重弾（kind=2）は速度でなく「位置ごと」押し戻す。
  // simStep が毎フレーム速度を maxSpeed にクランプするため、速度加算だけでは
  // 1フレームで減衰して「跳ね返された」体感にならない。変位なら確実に飛ぶ。
  if (projKind[projIdx] === 2) {
    px[boidIdx] += nx * BOSS_SHOT_KNOCKBACK_DIST;
    py[boidIdx] += ny * BOSS_SHOT_KNOCKBACK_DIST;
    vx[boidIdx] = nx * BASE_CFG.maxSpeed;
    vy[boidIdx] = ny * BASE_CFG.maxSpeed;
    return;
  }

  // 変更5: 種別ごとにノックバック強度を分岐する
  // catapult(kind=1): CATAPULT_KNOCKBACK_SPEED=220（強い。体感できる吹き飛び）
  // arrow  (kind=0): ARROW_KNOCKBACK_SPEED=60（弱い。ちょっと押される程度）
  const knockbackSpeed = projKind[projIdx] === 1
    ? CATAPULT_KNOCKBACK_SPEED
    : ARROW_KNOCKBACK_SPEED;

  vx[boidIdx] += nx * knockbackSpeed;
  vy[boidIdx] += ny * knockbackSpeed;
  // 速度を maxSpeed でクランプして飛び出しを防ぐ
  const sp = Math.sqrt(vx[boidIdx] * vx[boidIdx] + vy[boidIdx] * vy[boidIdx]);
  if (sp > BASE_CFG.maxSpeed) {
    vx[boidIdx] = (vx[boidIdx] / sp) * BASE_CFG.maxSpeed;
    vy[boidIdx] = (vy[boidIdx] / sp) * BASE_CFG.maxSpeed;
  }
}

function applyAoeProjectileDamage(wx, wy, aoeR, damage) {
  const r2 = aoeR * aoeR;
  for (let i = 0; i < N; i++) {
    if (boidDead[i] || boidDowned[i]) continue;
    const dx = wx - px[i];
    const dy = wy - py[i];
    if (dx * dx + dy * dy < r2) {
      applyDamageToBoid(i, damage);
    }
  }
}

// -----------------------------------------------------------------
// ブレス攻撃（レーザー照射）
// 近接ダメージの代替: ドラゴンが射程内の最近建物へ連続照射
// ブレスデータは描画フェーズで使えるよう毎フレーム収集する
// -----------------------------------------------------------------

// ブレス情報バッファ: { boidIdx, settlementIdx, hitX, hitY } の配列
// 毎フレームのupdate時に構築し、draw時に参照する
const activeBreaths = [];

// ブレスのアニメーション時間（sin揺らぎ用）
let breathTime = 0;

// v0.6: 多重照射の最大対象数（「多重照射」カード max=2 → 最大3対象）
const BREATH_MAX_TARGETS = 3;
// 多重照射の近傍上位選択に使う作業バッファ（毎フレーム使い回し）
const _breathTargetBuf = [];

// v0.6-p2: BEAM武器の攻撃処理。updateWeaponAttacks から flockWeapon==="beam" のとき呼ばれる
// （breathTime の加算と activeBreaths のクリアはディスパッチャ側で行う）。
function updateBeamAttacks(dt) {
  // v0.6: 射程・威力・対象数は強化カードで伸びる
  const effRange   = BREATH_RANGE * effWeaponRangeMult("beam");
  const BREATH_R2  = effRange * effRange;
  const maxTargets = Math.min(BREATH_MAX_TARGETS, effBeamTargets());
  const damageThisFrame = BREATH_DAMAGE_PER_SEC * effWeaponDmgMult("beam") * dt;
  // 射程延伸で 100px（グリッドセル）を超えたら近傍クエリの走査半径も広げる
  const cellRadius = Math.max(1, Math.ceil(effRange / BUILDING_GRID_CELL));

  // Spatial Hash を使ってブレス射程内の建物候補を絞る
  for (let i = 0; i < N; i++) {
    // 変更2: ダウン中はブレスを吐かない
    if (boidDead[i] || boidDowned[i]) continue;

    buildingGridQueryRadius(px[i], py[i], cellRadius, _buildingNeighbourBuf);

    // 射程内の建物を距離昇順で最大 maxTargets 件選ぶ（挿入ソート、k≤3 なので軽い）
    _breathTargetBuf.length = 0;
    for (const sIdx of _buildingNeighbourBuf) {
      const settlement = settlements[sIdx];
      if (!settlement || settlement.fallen) continue;
      const dx = settlement.wx - px[i];
      const dy = settlement.wy - py[i];
      const d2 = dx * dx + dy * dy;
      if (d2 >= BREATH_R2) continue;

      let insertAt = _breathTargetBuf.length;
      for (let t = 0; t < _breathTargetBuf.length; t++) {
        if (d2 < _breathTargetBuf[t].d2) { insertAt = t; break; }
      }
      _breathTargetBuf.splice(insertAt, 0, { sIdx, d2 });
      if (_breathTargetBuf.length > maxTargets) _breathTargetBuf.length = maxTargets;
    }

    // v0.6-p4: 射程内に建物が無いときは移動敵を照射する（純BEAM群でも移動敵を倒せる）
    if (_breathTargetBuf.length === 0) {
      let nearestMover = null;
      let nearestMoverD2 = BREATH_R2;
      for (const m of movers) {
        if (!m.alive) continue;
        const mdx = m.wx - px[i];
        const mdy = m.wy - py[i];
        const md2 = mdx * mdx + mdy * mdy;
        if (md2 < nearestMoverD2) { nearestMoverD2 = md2; nearestMover = m; }
      }
      if (nearestMover) {
        damageMover(nearestMover, damageThisFrame);
        activeBreaths.push({ boidIdx: i, targetWx: nearestMover.wx, targetWy: nearestMover.wy });
      }
      continue;
    }

    for (let t = 0; t < _breathTargetBuf.length; t++) {
      const sIdx = _breathTargetBuf[t].sIdx;
      const settlement = settlements[sIdx];
      if (settlement.fallen) continue; // 同フレーム内で先の照射により陥落済み

      // ダメージ適用
      settlement.hp -= damageThisFrame;

      // ヒットパーティクル（0.2秒間引き）
      settlement._breathParticleTimer -= dt;
      if (settlement._breathParticleTimer <= 0) {
        settlement._breathParticleTimer = BREATH_PARTICLE_INTERVAL;
        spawnHitParticles(
          settlement.wx + (Math.random() - 0.5) * settlement.radius,
          settlement.wy + (Math.random() - 0.5) * settlement.radius,
        );
      }

      // 建物破壊チェック
      if (settlement.hp <= 0 && !settlement.fallen) {
        settlementFall(sIdx);
        // 破壊された建物のグリッドエントリを更新（次フレームで再構築される）
        buildingLayerDirty = true;
      }

      // ブレス描画データを収集
      activeBreaths.push({
        boidIdx: i,
        targetWx: settlement.wx,
        targetWy: settlement.wy,
      });
    }
  }
}

// -----------------------------------------------------------------
// 変更2: 直接衝突攻撃（ドラゴンが建物に体当たりしたときのダメージ＋ヒットストップ）
// 群れの流れを止めないよう、衝突しても押し戻しはせず通過させる。
// かわりにクールダウンで連続ヒットを防ぎ、単発の重い一撃感を出す。
// -----------------------------------------------------------------
function updateCollisionAttacks(dt) {
  if (gameState !== "playing") return;

  // ヒットストップタイマーとクールダウンを先に進める
  for (let i = 0; i < N; i++) {
    if (boidHitStopTimer[i] > 0)      boidHitStopTimer[i]    = Math.max(0, boidHitStopTimer[i] - dt);
    if (boidCollisionCooldown[i] > 0) boidCollisionCooldown[i] = Math.max(0, boidCollisionCooldown[i] - dt);
  }

  for (let i = 0; i < N; i++) {
    // 変更2: ダウン中は建物に衝突しない
    if (boidDead[i] || boidDowned[i]) continue;
    // クールダウン中はこの個体の衝突判定をスキップ
    if (boidCollisionCooldown[i] > 0) continue;

    // Spatial Hash で近傍建物を取得（BREATH_RANGE と同じグリッドを流用）
    buildingGridQuery(px[i], py[i], _buildingNeighbourBuf);

    for (const sIdx of _buildingNeighbourBuf) {
      const s = settlements[sIdx];
      if (!s || s.fallen) continue;

      // 衝突判定: ドラゴン半径6px + 建物半径 の合計以内に入ったら衝突
      const collideR = s.radius + 6;
      const dx = s.wx - px[i];
      const dy = s.wy - py[i];
      if (dx * dx + dy * dy > collideR * collideR) continue;

      // --- 衝突発生 ---

      // 建物にダメージ（ブレスより大きい単発ダメージ）
      // v0.6-p2: 緋竜（MELEE）は体当たりが主武装（威力約3倍・クールダウン短縮。仕様 §6.4）
      const isMelee = flockWeapon === "melee";
      s.hp -= isMelee
        ? MELEE_COLLISION_DAMAGE * effWeaponDmgMult("melee")
        : COLLISION_DAMAGE;

      // ヒットストップ: この個体だけ一瞬止める（3フレーム相当）
      boidHitStopTimer[i]    = HITSTOP_DURATION;
      // クールダウンをセットして同じ建物への連続ヒットを防ぐ
      boidCollisionCooldown[i] = isMelee ? MELEE_COLLISION_COOLDOWN : COLLISION_COOLDOWN;

      // 強めのパーティクル（破片が飛ぶ）
      spawnCollisionParticles(s.wx, s.wy);
      // v0.8: 緋竜は深紅の斬閃＋火花＋画面シェイクで一撃の重さを出す
      if (isMelee) {
        spawnMeleeImpactFx(s.wx, s.wy, Math.atan2(vy[i], vx[i]));
        triggerShake(2.2, 0.09);
      }

      // 振動フィードバック（15ms）
      hapticPulse(15);

      // 建物破壊チェック
      if (s.hp <= 0 && !s.fallen) {
        settlementFall(sIdx);
        buildingLayerDirty = true;
      }

      // 1個体につき1建物までで打ち切り（同フレームで複数衝突しない）
      break;
    }
  }
}

// 衝突時の強めパーティクル（破片感）
function spawnCollisionParticles(wx, wy) {
  // 通常のブレスパーティクルより多く、速く、広がりも大きい
  const count = 6 + Math.floor(Math.random() * 5); // 6〜10個
  let spawned = 0;
  for (let i = 0; i < MAX_PARTICLES && spawned < count; i++) {
    if (partActive[i]) continue;
    partActive[i] = 1;
    partX[i] = wx + (Math.random() - 0.5) * 12;
    partY[i] = wy + (Math.random() - 0.5) * 12;
    const angle = Math.random() * Math.PI * 2;
    // 通常の2〜3倍の初速で破片が吹き飛ぶ
    const speed = 80 + Math.random() * 160;
    partVx[i]   = Math.cos(angle) * speed;
    partVy[i]   = Math.sin(angle) * speed;
    // 寿命も少し長め
    partLife[i] = 0.25 + Math.random() * 0.20;
    spawned++;
  }
}

function settlementFall(settlementIndex) {
  const settlement = settlements[settlementIndex];
  settlement.fallen = true;
  settlement.hp = 0;

  // v0.6: XPジェムを撒く＋撃破数を記録（仕様 §5.1）
  spawnXpGems(settlement.wx, settlement.wy, xpValueOf(settlement));
  runKills++;

  // v0.10: 石造りの城壁以外は炎上させる（燃える街の演出）
  if (!settlement._isWall) spawnFire(settlement.wx, settlement.wy, settlement.radius);

  // 変更1: 卵持ち建物だけが卵を EGG_DROP_COUNT 個落とす。
  // 残りの建物は壊しても卵を落とさない（破壊演出はそのまま）。
  if (settlement.isEggBearer) {
    for (let k = 0; k < EGG_DROP_COUNT; k++) {
      const angle = Math.random() * Math.PI * 2;
      const r = settlement.radius + 10 + Math.random() * 40;
      spawnEgg(settlement.wx + Math.cos(angle) * r, settlement.wy + Math.sin(angle) * r);
    }
  }

  hapticPulse(80);
  // 建物レイヤーを部分的に再描画（fallen状態に更新）
  if (buildingLayerCtx) {
    const bc = buildingLayerCtx;
    // ボスはグロー外輪が radius * 2.2 まで広がるため、クリア矩形を大きめに取る
    // v0.7: 要塞建物は軍旗（radius+9上方）と外輪リングがあるため広めにクリアする
    // v0.11: 廃墟スプライト（radius*2.6・90度回転あり）を完全に包む範囲をクリアして
    // 元建物の縁が残らないようにする。ボスは城塞グロー、要塞は軍旗ぶんの余白も確保。
    const padding = settlement.isBoss ? settlement.radius * 2.5
                  : Math.max(settlement.radius * 1.55, settlement.radius + 14);
    bc.clearRect(
      settlement.wx - padding,
      settlement.wy - padding,
      padding * 2,
      padding * 2,
    );
    drawSettlementOnLayer(bc, settlement);
  }
  // 建物グリッドも更新
  rebuildBuildingGrid();
  minimapBaseDirty = true;  // v0.6-p4: ミニマップの建物ドットキャッシュも更新
  updateHUDBuildings();

  // 変更3: クリア条件を「ボス集落の陥落」に変更。
  // 小集落は育成用の餌であり、残っていてもボスを倒せば次ステージへ進む。
  // ボスが高耐久なため、先に小集落で群れを育てる必要が自然に生まれる。
  if (settlement.isBoss) {
    triggerStageClear();
  }
}

// -----------------------------------------------------------------
// Spatial Hash（自軍用）
// -----------------------------------------------------------------
const grid = new Map();

function gridKey(cx, cy) { return (cx * 73856093 ^ cy * 19349663); }
function gridClear() { grid.clear(); }
function gridInsert(index, x, y, cellSize) {
  const cx = (x / cellSize) | 0;
  const cy = (y / cellSize) | 0;
  const k  = gridKey(cx, cy);
  let bucket = grid.get(k);
  if (!bucket) { bucket = []; grid.set(k, bucket); }
  bucket.push(index);
}
function gridQuery(x, y, cellSize, out) {
  out.length = 0;
  const cx = (x / cellSize) | 0;
  const cy = (y / cellSize) | 0;
  for (let dy = -1; dy <= 1; dy++) {
    for (let dx = -1; dx <= 1; dx++) {
      const b = grid.get(gridKey(cx + dx, cy + dy));
      if (b) for (let i = 0; i < b.length; i++) out.push(b[i]);
    }
  }
}

// -----------------------------------------------------------------
// Boids SoA — 自軍（ワールド座標で管理）
// -----------------------------------------------------------------
// v0.6: 配列確保上限。実際の群れ上限は BASE_FLOCK_CAP + 「大繁殖」カード分（effFlockCap()）
// で決まり、最大でも MAX_BOIDS を超えない（大繁殖2回で 100+50=150）。
const MAX_BOIDS = 150;
const BASE_FLOCK_CAP = 100;
let N = 0;
let px, py, vx, vy;
let boidHp;
let boidDead;
let boidFadeTimer;
// 衝突ヒットストップタイマー（>0の間、その個体を停止させる）
let boidHitStopTimer;
// 変更2: 衝突クールダウン（建物インデックスごとに記録）
// boidCollisionCooldown[i] は「最後に衝突した時刻からの残り秒数」
let boidCollisionCooldown;
// 変更2 (ダウン/復帰モデル): ダウン状態フラグと復帰タイマー
// boidDowned[i]=1 の間はダウン中。有効個体数から除外され、ブレス/衝突/ターゲット対象外。
// boidDownTimer[i] > 0 の間タイマーが進み、0 になったらフェードインで復帰する。
// boidReviveTimer[i] > 0 の間はフェードイン中（描画用）。
let boidDowned;
let boidDownTimer;
let boidReviveTimer;

// 変更4: 竜のHP を10倍（3 → 30）にして群れが簡単に壊滅しなくなる
const BOID_MAX_HP   = 30;
const FADE_DURATION = 0.3;

// 変更2: 衝突攻撃パラメータ
// ブレスより大きい単発ダメージ（毎秒換算ではなく1ヒット）
const COLLISION_DAMAGE      = 8;
// 衝突後の再発動クールダウン（同じドラゴンが同じ建物に連続ヒットしない）
const COLLISION_COOLDOWN    = 0.5; // 秒
// ヒットストップ持続（フレーム数を秒換算: 3フレーム≒0.048秒）
const HITSTOP_DURATION      = 0.048;

// 群れの初期個体数（卵回収で MAX_BOIDS まで増える）
const BOIDS_INITIAL = 10;

function initBoids() {
  // 配列は常に MAX_BOIDS 分確保し、N は現在の有効個体数を管理する
  px                    = new Float32Array(MAX_BOIDS);
  py                    = new Float32Array(MAX_BOIDS);
  vx                    = new Float32Array(MAX_BOIDS);
  vy                    = new Float32Array(MAX_BOIDS);
  boidHp                = new Float32Array(MAX_BOIDS);
  boidDead              = new Uint8Array(MAX_BOIDS);
  boidFadeTimer         = new Float32Array(MAX_BOIDS);
  boidHitStopTimer      = new Float32Array(MAX_BOIDS);
  boidCollisionCooldown = new Float32Array(MAX_BOIDS);
  // 変更2: ダウン/復帰モデル配列
  boidDowned            = new Uint8Array(MAX_BOIDS);
  boidDownTimer         = new Float32Array(MAX_BOIDS);
  boidReviveTimer       = new Float32Array(MAX_BOIDS);
  // v0.6-p2: 射撃タイマー（BULLET/MISSILE共用）
  boidFireTimer         = new Float32Array(MAX_BOIDS);
  // 尻尾角度履歴リングバッファ（TAIL_SEGS個前までの進行角度）
  boidAngleHistory      = new Float32Array(MAX_BOIDS * TAIL_SEGS);

  // 初期配置は BOIDS_INITIAL 体だけ。卵回収で増えていく雪だるま体験をさせる。
  N = BOIDS_INITIAL;

  const startWx = 250;
  const startWy = WORLD_H * 0.5;
  for (let i = 0; i < MAX_BOIDS; i++) {
    boidHp[i]        = BOID_MAX_HP;
    boidDead[i]      = 1; // 一旦全部 dead にしてから N 体だけ有効化
    boidFadeTimer[i] = 0;
    boidHitStopTimer[i]      = 0;
    boidCollisionCooldown[i] = 0;
    boidDowned[i]            = 0;
    boidDownTimer[i]         = 0;
    boidReviveTimer[i]       = 0;
    // 尻尾角度履歴を 0 で初期化（後で有効化時に上書き）
    for (let s = 0; s < TAIL_SEGS; s++) {
      boidAngleHistory[i * TAIL_SEGS + s] = 0;
    }
  }

  // 最初の N 体を有効化
  for (let i = 0; i < N; i++) {
    const r = Math.random() * 80;
    const a = Math.random() * Math.PI * 2;
    px[i] = startWx + Math.cos(a) * r;
    py[i] = startWy + Math.sin(a) * r;
    const ang = Math.random() * Math.PI * 2;
    vx[i] = Math.cos(ang) * BASE_CFG.minSpeed;
    vy[i] = Math.sin(ang) * BASE_CFG.minSpeed;
    boidHp[i]        = BOID_MAX_HP;
    boidDead[i]      = 0;
    boidFadeTimer[i] = 0;
    for (let s = 0; s < TAIL_SEGS; s++) {
      boidAngleHistory[i * TAIL_SEGS + s] = ang;
    }
  }
}

/**
 * ステージ開始時の群れ完全リセット（変更1）。
 * boot / advanceToNextStage の両方からこの関数を通す（共通化）。
 *
 * - 群れを BOIDS_INITIAL=10 体に戻す
 * - 全個体のHP・ダウン/復帰状態・フェード・衝突タイマーをクリア
 * - 尻尾角度履歴も初期化
 * - カメラズームは有効個体数=10 に下がることで自動的に寄りに戻る（追加処理不要）
 *
 * 前ステージの群れ数・HP・ダウン状態は一切持ち越さない。
 * これにより「ステージ開始は寄り、育つと引き」という弧が毎ステージ生まれる。
 */
function resetBoidsForStageStart() {
  const startWx = 250;
  const startWy = WORLD_H * 0.5;

  // N を BOIDS_INITIAL に戻し、全スロットを dead でリセットしてから有効分を起こす
  N = BOIDS_INITIAL;

  // v0.7: 強化カードが持ち越されるため、HPは実効最大値（硬鱗・種族補正込み）で初期化する
  const maxHpNow = effBoidMaxHp();
  for (let i = 0; i < MAX_BOIDS; i++) {
    boidHp[i]                = maxHpNow;
    boidDead[i]              = 1;           // 一旦全滅状態に
    boidFadeTimer[i]         = 0;
    boidHitStopTimer[i]      = 0;
    boidCollisionCooldown[i] = 0;
    boidDowned[i]            = 0;
    boidDownTimer[i]         = 0;
    boidReviveTimer[i]       = 0;
    boidFireTimer[i]         = Math.random() * currentFireInterval(); // 射撃をばらけさせる
    const base = i * TAIL_SEGS;
    for (let s = 0; s < TAIL_SEGS; s++) boidAngleHistory[base + s] = 0;
  }

  // BOIDS_INITIAL 体だけ有効化・配置
  for (let i = 0; i < N; i++) {
    const r   = Math.random() * 80;
    const a   = Math.random() * Math.PI * 2;
    px[i]     = startWx + Math.cos(a) * r;
    py[i]     = startWy + Math.sin(a) * r;
    const ang = Math.random() * Math.PI * 2;
    vx[i]     = Math.cos(ang) * BASE_CFG.minSpeed;
    vy[i]     = Math.sin(ang) * BASE_CFG.minSpeed;
    boidDead[i] = 0;
    const base = i * TAIL_SEGS;
    for (let s = 0; s < TAIL_SEGS; s++) boidAngleHistory[base + s] = ang;
  }
}

function countAliveBoids() {
  // 変更2: ダウン中（boidDowned）は有効個体数から除外する。
  // これによりカメラズーム・ブレス範囲・HUD表示がダウン分だけ薄まり、
  // 復帰すると盛り返す気持ちいいフィードバックになる。
  let count = 0;
  for (let i = 0; i < N; i++) {
    if (!boidDead[i] && !boidDowned[i]) count++;
  }
  return count;
}

// -----------------------------------------------------------------
// パーティクルプール（v0.8: 200個へ拡張。緋竜の斬撃火花・派手化した攻撃FXのため）
// -----------------------------------------------------------------
const MAX_PARTICLES = 200;
const partX      = new Float32Array(MAX_PARTICLES);
const partY      = new Float32Array(MAX_PARTICLES);
const partVx     = new Float32Array(MAX_PARTICLES);
const partVy     = new Float32Array(MAX_PARTICLES);
const partLife   = new Float32Array(MAX_PARTICLES);
const partActive = new Uint8Array(MAX_PARTICLES);
// partType: 0=ブレス火花（橙〜赤）、1=出現エフェクト火花（金〜白〜薄橙）、2=死亡FX（灰〜暗赤）
const partType   = new Uint8Array(MAX_PARTICLES);

function spawnHitParticles(wx, wy) {
  // ブレスの火花は少数（2〜4個）に抑えてパフォーマンスを確保
  const count = 2 + Math.floor(Math.random() * 3);
  let spawned = 0;
  for (let i = 0; i < MAX_PARTICLES && spawned < count; i++) {
    if (partActive[i]) continue;
    partActive[i] = 1;
    partType[i]   = 0; // ブレス火花
    partX[i] = wx;
    partY[i] = wy;
    const angle = Math.random() * Math.PI * 2;
    const speed = 30 + Math.random() * 60;
    partVx[i]   = Math.cos(angle) * speed;
    partVy[i]   = Math.sin(angle) * speed;
    partLife[i] = 0.20 + Math.random() * 0.15;
    spawned++;
  }
}

function updateParticles(dt) {
  for (let i = 0; i < MAX_PARTICLES; i++) {
    if (!partActive[i]) continue;
    partX[i]    += partVx[i] * dt;
    partY[i]    += partVy[i] * dt;
    partVx[i]   *= 0.85;
    partVy[i]   *= 0.85;
    partLife[i] -= dt;
    if (partLife[i] <= 0) partActive[i] = 0;
  }
}

// -----------------------------------------------------------------
// v0.10: 炎上システム — 破壊した建物が数秒燃え、火の粉と煙柱を上げる。
// 「人間社会が燃えている」画を作る。専用プールで既存FXと枠を奪い合わない。
// -----------------------------------------------------------------
const MAX_FIRES = 48;
const fireX      = new Float32Array(MAX_FIRES);
const fireY      = new Float32Array(MAX_FIRES);
const fireLife   = new Float32Array(MAX_FIRES);
const fireEmit   = new Float32Array(MAX_FIRES);
const fireScale  = new Float32Array(MAX_FIRES);   // 建物サイズに応じた炎の規模
const fireActive = new Uint8Array(MAX_FIRES);
const FIRE_DURATION = 2.4;

const MAX_EMBERS = 200;
const emberX       = new Float32Array(MAX_EMBERS);
const emberY       = new Float32Array(MAX_EMBERS);
const emberVx      = new Float32Array(MAX_EMBERS);
const emberVy      = new Float32Array(MAX_EMBERS);
const emberLife    = new Float32Array(MAX_EMBERS);
const emberMaxLife = new Float32Array(MAX_EMBERS);
const emberType    = new Uint8Array(MAX_EMBERS);   // 0=火の粉, 1=煙
const emberActive  = new Uint8Array(MAX_EMBERS);

function resetFires() {
  fireActive.fill(0);
  emberActive.fill(0);
}

// 建物破壊時に炎上を開始する。radius で炎の規模を決める。
function spawnFire(wx, wy, radius) {
  let slot = -1;
  for (let i = 0; i < MAX_FIRES; i++) { if (!fireActive[i]) { slot = i; break; } }
  if (slot < 0) {
    // 満杯なら残り寿命最小を上書き（新しい破壊を優先）
    let minL = Infinity;
    for (let i = 0; i < MAX_FIRES; i++) if (fireLife[i] < minL) { minL = fireLife[i]; slot = i; }
  }
  fireActive[slot]  = 1;
  fireX[slot]       = wx;
  fireY[slot]       = wy;
  fireLife[slot]    = FIRE_DURATION * (0.7 + Math.random() * 0.6);
  fireEmit[slot]    = 0;
  fireScale[slot]   = Math.max(0.7, radius / 12);
}

function _spawnEmber(wx, wy, type, scale) {
  let slot = -1;
  for (let i = 0; i < MAX_EMBERS; i++) { if (!emberActive[i]) { slot = i; break; } }
  if (slot < 0) return;
  emberActive[slot] = 1;
  emberX[slot] = wx + (Math.random() - 0.5) * 8 * scale;
  emberY[slot] = wy + (Math.random() - 0.5) * 6 * scale;
  if (type === 0) {
    emberVx[slot]   = (Math.random() - 0.5) * 30;
    emberVy[slot]   = -40 - Math.random() * 50;      // 火の粉は上へ舞う
    emberLife[slot] = 0.4 + Math.random() * 0.35;
  } else {
    emberVx[slot]   = (Math.random() - 0.5) * 18 - 6; // 煙はわずかに一方向へ流れる
    emberVy[slot]   = -22 - Math.random() * 16;
    emberLife[slot] = 1.1 + Math.random() * 0.8;
  }
  emberMaxLife[slot] = emberLife[slot];
  emberType[slot]    = type;
}

function updateFires(dt) {
  for (let i = 0; i < MAX_FIRES; i++) {
    if (!fireActive[i]) continue;
    fireLife[i] -= dt;
    if (fireLife[i] <= 0) { fireActive[i] = 0; continue; }
    fireEmit[i] -= dt;
    if (fireEmit[i] <= 0) {
      fireEmit[i] = 0.05 + Math.random() * 0.05;
      const sc = fireScale[i];
      _spawnEmber(fireX[i], fireY[i], 0, sc);                       // 火の粉
      if (Math.random() < 0.7) _spawnEmber(fireX[i], fireY[i], 1, sc); // 煙
    }
  }
  for (let i = 0; i < MAX_EMBERS; i++) {
    if (!emberActive[i]) continue;
    emberX[i] += emberVx[i] * dt;
    emberY[i] += emberVy[i] * dt;
    if (emberType[i] === 1) { emberVy[i] *= 0.98; emberVx[i] *= 0.99; } // 煙は上昇が緩む
    else                    { emberVy[i] += 8 * dt; }                    // 火の粉はやや重力
    emberLife[i] -= dt;
    if (emberLife[i] <= 0) emberActive[i] = 0;
  }
}

// ember描画（カメラ変換内・ワールド座標）。竜より下の地上レイヤーで呼ぶ。
function drawEmbers() {
  for (let i = 0; i < MAX_EMBERS; i++) {
    if (!emberActive[i]) continue;
    const t = emberLife[i] / emberMaxLife[i];   // 1→0
    if (emberType[i] === 1) {
      // 煙: 灰、寿命で膨張＆フェード（アルファ抑えめでユニット視認性を守る）
      const r = 4 + (1 - t) * 14;
      ctx.globalAlpha = t * 0.26;
      ctx.fillStyle = "#4a4a4a";
      ctx.beginPath();
      ctx.arc(emberX[i], emberY[i], r, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // 火の粉: 橙〜黄、小さく明るい
      const r = 1 + t * 2.2;
      const g = (120 + 120 * t) | 0;
      ctx.globalAlpha = Math.min(1, t * 1.4);
      ctx.fillStyle = `rgb(255,${g},40)`;
      ctx.beginPath();
      ctx.arc(emberX[i], emberY[i], r, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1.0;
}

// -----------------------------------------------------------------
// 卵システム（ワールド座標）
// -----------------------------------------------------------------
const MAX_EGGS = 200;
const eggWx     = new Float32Array(MAX_EGGS);
const eggWy     = new Float32Array(MAX_EGGS);
const eggActive = new Uint8Array(MAX_EGGS);
let totalEggCount = 0;

function spawnEgg(wx, wy) {
  for (let i = 0; i < MAX_EGGS; i++) {
    if (eggActive[i]) continue;
    eggActive[i] = 1;
    eggWx[i] = wx;
    eggWy[i] = wy;
    return i;
  }
  return -1;
}

function collectNearbyEggs() {
  for (let e = 0; e < MAX_EGGS; e++) {
    if (!eggActive[e]) continue;
    for (let i = 0; i < N; i++) {
      if (boidDead[i]) continue;
      const dx = eggWx[e] - px[i];
      const dy = eggWy[e] - py[i];
      if (dx * dx + dy * dy < 60 * 60) {
        eggActive[e] = 0;
        totalEggCount++;
        // 卵回収 = その場で竜+1（群れ上限未満のときのみ）
        // v0.6: 上限到達後の卵は XP+10 に変換する（拾って無駄がない）
        const added = spawnBoidAtEgg(eggWx[e], eggWy[e]);
        if (!added) spawnXpGems(eggWx[e], eggWy[e], EGG_OVERFLOW_XP);
        break;
      }
    }
  }
}

/**
 * 卵の位置に竜を1体スポーンする。
 * 群れが上限（effFlockCap）に達していたら何もしない（カウンタは増える）。
 * SoA の全要素を初期化して NaN/ゴミを防ぐ。
 * @returns {boolean} 追加に成功したら true（上限到達時は false）
 */
function spawnBoidAtEgg(wx, wy) {
  if (N >= effFlockCap() || N >= MAX_BOIDS) return false; // 上限到達時は追加しない
  // 変更2: 竜出現エフェクトをスポーン（追加に成功したときのみ）
  spawnDragonAppearEffect(wx, wy);

  const idx = N; // 新しい個体スロット
  N++;           // 有効個体数を先に増やす

  // 群れの平均速度を取得して初速に使う（群れの流れに乗せる）
  let avgVx = 0, avgVy = 0, aliveCount = 0;
  for (let i = 0; i < N - 1; i++) {
    if (!boidDead[i]) { avgVx += vx[i]; avgVy += vy[i]; aliveCount++; }
  }
  if (aliveCount > 0) {
    avgVx /= aliveCount;
    avgVy /= aliveCount;
  } else {
    // 群れが全滅していたら右方向に発射
    avgVx = BASE_CFG.minSpeed;
    avgVy = 0;
  }
  // 群れ平均速度にランダム成分を少し加える（単純コピーで整列しすぎないよう）
  const randAngle = Math.random() * Math.PI * 2;
  const randStrength = BASE_CFG.minSpeed * 0.3;
  const initVx = avgVx + Math.cos(randAngle) * randStrength;
  const initVy = avgVy + Math.sin(randAngle) * randStrength;

  // 速度の大きさを minSpeed 以上に保証
  const speed = Math.sqrt(initVx * initVx + initVy * initVy) || BASE_CFG.minSpeed;
  const scale = speed < BASE_CFG.minSpeed ? BASE_CFG.minSpeed / speed : 1;
  const finalVx = initVx * scale;
  const finalVy = initVy * scale;

  // 初期角度（尻尾の向き初期化に使う）
  const initAngle = Math.atan2(finalVy, finalVx);

  // SoA 全要素を正確に初期化
  px[idx]                   = wx;
  py[idx]                   = wy;
  vx[idx]                   = finalVx;
  vy[idx]                   = finalVy;
  boidHp[idx]               = BOID_MAX_HP;
  boidDead[idx]             = 0;
  boidFadeTimer[idx]        = 0;
  boidHitStopTimer[idx]     = 0;
  boidCollisionCooldown[idx] = 0;
  // 変更2: ダウン/復帰モデル配列の初期化（NaN/未定義防止）
  boidDowned[idx]      = 0;
  boidDownTimer[idx]   = 0;
  boidReviveTimer[idx] = 0;

  // 尻尾角度履歴：全セグメントを初期角度で埋める（NaN 防止）
  const base = idx * TAIL_SEGS;
  for (let s = 0; s < TAIL_SEGS; s++) {
    boidAngleHistory[base + s] = initAngle;
  }

  // v0.6: リザルト用の最大群れ数を更新
  if (N > runMaxFlock) runMaxFlock = N;
  return true;
}

// ★レベルアップ調整パラメータ（ここだけ変えればレベルの上がり方を調整できる）
//   必要XP(Lv n → n+1) = XP_LEVEL_BASE × XP_LEVEL_GROWTH^(n-1)
//   - XP_LEVEL_BASE  : 最初のレベルアップに必要なXP。大きいほど全体的に上がりにくい
//   - XP_LEVEL_GROWTH: レベルごとの必要XP倍率。大きいほど後半が急に上がりにくくなる
//   例) もっと速く上げたい → XP_LEVEL_BASE を 120 などに下げる
//       もっとゆっくりにしたい → XP_LEVEL_BASE を 220 などに上げる
//   v0.11: 建物数が約1.8倍に増えXP総量が増えたため 110→160 に引き上げ
//   （建物増ぶんを相殺しつつ前バージョンよりわずかに速い上がり方に調整）
// ============================================================
const XP_LEVEL_BASE   = 160;
const XP_LEVEL_GROWTH = 1.35;
function xpForNext(level) {
  return Math.ceil(XP_LEVEL_BASE * Math.pow(XP_LEVEL_GROWTH, level - 1));
}

function upCount(id) { return upgradeCounts[id] || 0; }

// ---- 効果の集計（取得回数から都度計算。ステージリセットで自然に戻る）----
function effHpMult()        { return 1 + 0.20 * upCount("scale"); }
function effSpeedMult()     { return 1 + 0.08 * upCount("wind"); }
function effReviveMult()    { return Math.pow(0.85, upCount("tide")); }
function effMagnetRadius()  { return XP_MAGNET_RADIUS_BASE * (1 + 0.40 * upCount("magnet")); }
function effFlockCap()      { return Math.min(MAX_BOIDS, BASE_FLOCK_CAP + 25 * upCount("brood")); }
function effDmgTakenMult()  { return Math.pow(0.88, upCount("resonance")); }
// 武器別強化はタイプ別に保持される（転換しても消えず、そのタイプに戻れば効く。§5.4-C）
function effWeaponDmgMult(weapon)   { return 1 + 0.15 * upCount("dmg_" + weapon); }
function effWeaponRangeMult(weapon) { return 1 + 0.15 * upCount("range_" + weapon); }
function effFireIntervalMult(weapon){ return Math.pow(0.82, upCount("rate_" + weapon)); }
function effBeamTargets()   { return 1 + upCount("multibeam"); }
function effBulletPierce()  { return 1 + upCount("pierce"); }
function effMissileAoeMult(){ return 1 + 0.30 * upCount("blast"); }
// v0.6-p2: 緋竜（MELEE）は個体HP +50%（仕様 §6.4）
function effBoidMaxHp()     { return BOID_MAX_HP * effHpMult() * (flockWeapon === "melee" ? MELEE_HP_MULT : 1); }

// ---- カード取得時の即時効果（倍率系は eff* で都度参照するため不要）----
function applyCardImmediate(cardId) {
  if (cardId === "scale") {
    // 現在HPも新しい最大値の比率で引き上げる（取った瞬間に体感がある）
    const count = upCount("scale");
    const ratio = (1 + 0.20 * count) / (1 + 0.20 * (count - 1));
    for (let i = 0; i < N; i++) {
      if (!boidDead[i] && !boidDowned[i]) boidHp[i] *= ratio;
    }
  } else if (cardId === "brood") {
    // 上限+25 に加えて即時に竜5体を群れ重心付近へ無償孵化
    const centroid = calcFriendlyCentroid();
    for (let k = 0; k < 5; k++) {
      const angle = Math.random() * Math.PI * 2;
      const r     = 30 + Math.random() * 50;
      spawnBoidAtEgg(centroid.x + Math.cos(angle) * r, centroid.y + Math.sin(angle) * r);
    }
  } else if (cardId === "evo_bullet") {
    convertFlock("bullet");
  } else if (cardId === "evo_missile") {
    convertFlock("missile");
  } else if (cardId === "evo_melee") {
    convertFlock("melee");
  } else if (cardId === "orb") {
    addXp(150);
  }
}

// ---- XP加算とレベルアップ検出 ----
function addXp(value) {
  playerXp   += value;
  runTotalXp += value;
  while (playerXp >= xpForNext(playerLevel)) {
    playerXp -= xpForNext(playerLevel);
    playerLevel++;
    pendingCards++;
  }
  updateXpHud();
}

  flockWeapon = "beam";

// -----------------------------------------------------------------
// v0.6: XPジェム（破壊対象から飛び出し群れへ吸い込まれる光の粒）
// -----------------------------------------------------------------
const MAX_GEMS = 400;
const gemX      = new Float32Array(MAX_GEMS);
const gemY      = new Float32Array(MAX_GEMS);
const gemVx     = new Float32Array(MAX_GEMS);
const gemVy     = new Float32Array(MAX_GEMS);
const gemVal    = new Float32Array(MAX_GEMS);
const gemAge    = new Float32Array(MAX_GEMS);
const gemActive = new Uint8Array(MAX_GEMS);

const XP_MAGNET_RADIUS_BASE = 120;  // 吸引開始半径（「吸引域」カードで拡大）
const XP_COLLECT_RADIUS     = 14;   // 回収判定半径
const XP_ATTRACT_SPEED      = 600;  // 吸引速度（px/s）
const GEM_SCATTER_DURATION  = 0.22; // 飛散フェーズの長さ（秒）
const EGG_OVERFLOW_XP       = 10;   // 群れ上限到達後の卵1個ぶんのXP

// 撃破対象のXP基礎値（仕様 §5.1）
function xpValueOf(settlement) {
  if (settlement.isBoss)     return 300;
  if (settlement._isWall)    return 12;
  if (settlement._isCapital) return 30;
  let base;
  switch (settlement.size) {
    case "tiny":   base = 1; break;
    case "medium": base = 8; break;
    case "large":  base = 20; break;
    default:       base = 2; break; // small / 城下small
  }
  // v0.7: 要塞都市はリスクに見合う2倍報酬
  return settlement._fortified ? base * 2 : base;
}

/**
 * value ぶんのXPジェムを額面 25/5/1 に分割してスポーンする。
 * 大きい建物ほど粒が多く飛び散る（報酬の視覚化）。プール満杯時は直接加算。
 */
function spawnXpGems(wx, wy, value) {
  const DENOMS = [25, 5, 1];
  let remaining = value;
  for (const denom of DENOMS) {
    while (remaining >= denom) {
      remaining -= denom;
      let slot = -1;
      for (let i = 0; i < MAX_GEMS; i++) {
        if (!gemActive[i]) { slot = i; break; }
      }
      if (slot < 0) { addXp(remaining + denom); return; } // プール枯渇: 残額を直接加算
      gemActive[slot] = 1;
      gemX[slot]   = wx + (Math.random() - 0.5) * 8;
      gemY[slot]   = wy + (Math.random() - 0.5) * 8;
      const angle  = Math.random() * Math.PI * 2;
      const speed  = 60 + Math.random() * 120;
      gemVx[slot]  = Math.cos(angle) * speed;
      gemVy[slot]  = Math.sin(angle) * speed;
      gemVal[slot] = denom;
      gemAge[slot] = 0;
    }
  }
}

function clearXpGems() { gemActive.fill(0); }

function updateXpGems(dt) {
  const magnetR2  = effMagnetRadius() * effMagnetRadius();
  const collectR2 = XP_COLLECT_RADIUS * XP_COLLECT_RADIUS;

  for (let g = 0; g < MAX_GEMS; g++) {
    if (!gemActive[g]) continue;
    gemAge[g] += dt;

    if (gemAge[g] < GEM_SCATTER_DURATION) {
      // 飛散フェーズ: 初速で広がりつつ減速
      gemX[g]  += gemVx[g] * dt;
      gemY[g]  += gemVy[g] * dt;
      gemVx[g] *= 0.88;
      gemVy[g] *= 0.88;
      continue;
    }

    // 吸引フェーズ: 最寄りの有効個体を探して吸い込まれる
    let nearest = -1;
    let nearestD2 = magnetR2;
    for (let i = 0; i < N; i++) {
      if (boidDead[i] || boidDowned[i]) continue;
      const dx = px[i] - gemX[g];
      const dy = py[i] - gemY[g];
      const d2 = dx * dx + dy * dy;
      if (d2 < nearestD2) { nearestD2 = d2; nearest = i; }
    }
    if (nearest < 0) continue; // 吸引範囲外: その場で待機（消えない）

    if (nearestD2 < collectR2) {
      gemActive[g] = 0;
      addXp(gemVal[g]);
      continue;
    }

    const d  = Math.sqrt(nearestD2) || 1;
    const nx = (px[nearest] - gemX[g]) / d;
    const ny = (py[nearest] - gemY[g]) / d;
    // 近いほど速く吸い込まれる（気持ちいい加速感）
    const speedScale = 1 + (1 - Math.min(1, d / effMagnetRadius())) * 1.5;
    gemX[g] += nx * XP_ATTRACT_SPEED * speedScale * dt;
    gemY[g] += ny * XP_ATTRACT_SPEED * speedScale * dt;
  }
}

/**
 * XPジェムを描画する。カメラ変換内（ワールド座標系）で呼ぶこと。
 * 青白いダイヤ型＝XP。金色の卵と色で明確に区別する。
 */
function drawXpGems() {
  ctx.save();
  for (let g = 0; g < MAX_GEMS; g++) {
    if (!gemActive[g]) continue;
    // 額面でサイズを変える: 1→2.5px, 5→3.5px, 25→5px
    const r = gemVal[g] >= 25 ? 5 : (gemVal[g] >= 5 ? 3.5 : 2.5);
    const pulse = 0.75 + 0.25 * Math.sin(breathTime * 6 + g * 1.7);
    const wx = gemX[g], wy = gemY[g];
    ctx.globalAlpha = pulse;
    ctx.fillStyle   = gemVal[g] >= 25 ? "#a0ecff" : "#60c8ff";
    ctx.beginPath();
    ctx.moveTo(wx, wy - r);
    ctx.lineTo(wx + r * 0.7, wy);
    ctx.lineTo(wx, wy + r);
    ctx.lineTo(wx - r * 0.7, wy);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = pulse * 0.9;
    ctx.strokeStyle = "rgba(255,255,255,0.7)";
    ctx.lineWidth   = 0.8;
    ctx.stroke();
  }
  ctx.globalAlpha = 1.0;
  ctx.restore();
}

// -----------------------------------------------------------------
// v0.6.1: レベルアップ3択カードUI（非モーダル・スローモー方式）
// 時間停止をやめ、カード表示中はワールドを SLOWMO_SCALE 倍速で進める。
// 線描画は継続でき、SLOWMO_DURATION 秒たつと通常速度に戻る（カードは選ぶまで残る）。
// ゲームオーバーが存在しないため、選択中の被弾リスクはほぼ無い。
// -----------------------------------------------------------------
const levelupOverlayEl = document.getElementById("levelup-overlay");
const cardListEl       = document.getElementById("card-list");

const SLOWMO_SCALE    = 0.25;  // カード表示中のワールド速度倍率
const SLOWMO_DURATION = 7.0;   // スローが持続する秒数（実時間。以降は通常速度でカードだけ残る）
const SLOWMO_EASE     = 8;     // timeScale の追従速さ（急停止感を出さないためのイージング）

let upgradeCardsVisible = false;
let slowmoTimer = 0;
let timeScale   = 1;   // ワールド時間倍率（tick で dt に乗算）

/**
 * pendingCards が残っていれば3択カードを画面下部に出す。tick の playing 分岐末尾から呼ぶ。
 * ゲームは止めない（スローモーのみ）。表示中は新たに開かない（選択後に次を開く）。
 */
function maybeShowLevelUp() {
  if (gameState !== "playing" || pendingCards <= 0 || upgradeCardsVisible) return;
  upgradeCardsVisible = true;
  slowmoTimer = SLOWMO_DURATION;
  buildLevelUpCards();
  levelupOverlayEl.classList.add("visible");
  triggerFlash("rgba(160,236,255,0.35)", 0.15);
  hapticPulse(60);
}

/** 取得可能なカードから重み付きで3枚（重複なし）選んでDOMに並べる。 */
function buildLevelUpCards() {
  const pool = CARD_DEFS.filter(def => {
    if (upCount(def.id) >= def.max) return false;
    // 武器強化カードは現在の武器タイプにのみ出現
    if (def.weapon && def.weapon !== flockWeapon) return false;
    // ★進化: 現在と同タイプは出さない・解禁レベル未満は出さない
    if (def.targetWeapon) {
      if (def.targetWeapon === flockWeapon) return false;
      if (playerLevel < def.minLevel) return false;
    }
    return true;
  });

  const picks = [];
  const candidates = pool.slice();
  while (picks.length < 3 && candidates.length > 0) {
    let totalWeight = 0;
    for (const def of candidates) totalWeight += CARD_RARITY_WEIGHT[def.rarity];
    let roll = Math.random() * totalWeight;
    let chosenIdx = 0;
    for (let i = 0; i < candidates.length; i++) {
      roll -= CARD_RARITY_WEIGHT[candidates[i].rarity];
      if (roll <= 0) { chosenIdx = i; break; }
    }
    const chosen = candidates[chosenIdx];
    picks.push(chosen);
    candidates.splice(chosenIdx, 1);
    // ★は3枚中1枚まで（仕様 §5.5）: 1枚選ばれたら残りの★を候補から外す
    if (chosen.rarity === "star") {
      for (let i = candidates.length - 1; i >= 0; i--) {
        if (candidates[i].rarity === "star") candidates.splice(i, 1);
      }
    }
  }
  // プールが痩せた場合は竜玉（XP+50）で補充（最低1枚は必ず出す）
  if (picks.length < 3) picks.push(CARD_ORB);

  cardListEl.innerHTML = "";
  for (const def of picks) {
    const text = STRINGS.cards[def.id];
    const btn  = document.createElement("button");
    btn.className = "upgrade-card rarity-" + def.rarity;
    const taken = upCount(def.id);
    const stack = (def.max !== Infinity && def.max > 1) ? ` (${taken + 1}/${def.max})` : "";
    btn.innerHTML =
      `<span class="card-icon">${def.icon}</span>` +
      `<span><div class="card-name">${text.name}${stack}</div>` +
      `<div class="card-desc">${text.desc}</div></span>`;
    btn.addEventListener("pointerdown", (e) => {
      e.stopPropagation();
      e.preventDefault();
      chooseCard(def);
    });
    cardListEl.appendChild(btn);
  }
}

function chooseCard(def) {
  if (!upgradeCardsVisible) return;
  upgradeCounts[def.id] = upCount(def.id) + 1;
  applyCardImmediate(def.id);
  pendingCards--;
  updateHUDLevel();
  hapticPulse(30);

  upgradeCardsVisible = false;
  slowmoTimer = 0;
  levelupOverlayEl.classList.remove("visible");
  // 連続レベルアップが残っていれば続けて開く（スロー時間もリフレッシュされる）
  if (pendingCards > 0) maybeShowLevelUp();
}

/** カードUIを閉じてスローを解除する（ステージ遷移・タイトル帰還時の安全網）。 */
function dismissLevelUpCards() {
  upgradeCardsVisible = false;
  slowmoTimer = 0;
  timeScale   = 1;
  levelupOverlayEl.classList.remove("visible");
}
