// -----------------------------------------------------------------
// ウェイポイントパス（リーダー追従）
// -----------------------------------------------------------------
const PATH_MAX = 240;
const pathBuf = new Float32Array(PATH_MAX * 2);
let pathHead = 0;
let pathLen  = 0;
let leaderPathConsumeIdx = 0;

function pathGet(logicalIdx) {
  const ring = (pathHead - pathLen + logicalIdx + PATH_MAX) % PATH_MAX;
  return { x: pathBuf[ring * 2], y: pathBuf[ring * 2 + 1] };
}

function pathClear() {
  pathLen  = 0;
  pathHead = 0;
  leaderPathConsumeIdx = 0;
}

function pathPush(wx, wy) {
  if (pathLen > 0) {
    const last = pathGet(pathLen - 1);
    const dx = wx - last.x, dy = wy - last.y;
    const minSeg = Math.max(BASE_CFG.pathMinSegment, 30);
    if (dx * dx + dy * dy < minSeg * minSeg) return;
  }
  pathBuf[pathHead * 2]     = wx;
  pathBuf[pathHead * 2 + 1] = wy;
  pathHead = (pathHead + 1) % PATH_MAX;
  if (pathLen < PATH_MAX) {
    pathLen++;
  } else {
    // バッファが満杯で最古点を上書きするとき、論理窓が1つ前進する。
    // leaderPathConsumeIdx が同じ「実点」を指し続けるよう1だけ引く。
    // ただし 0 未満にはしない（負になると pathGet が誤変換する）。
    leaderPathConsumeIdx = Math.max(0, leaderPathConsumeIdx - 1);
  }
}

const leader = { x: 250, y: WORLD_H * 0.5, vx: 0, vy: 0 };

function resetLeader() {
  leader.x  = 250;
  leader.y  = WORLD_H * 0.5;
  leader.vx = 0;
  leader.vy = 0;
  pathClear();
  idleAngle = 0;
}

// -----------------------------------------------------------------
// 触覚フィードバック
// -----------------------------------------------------------------
function hapticPulse(durationMs) {
  try { navigator.vibrate?.(durationMs); } catch (_) {}
}

// -----------------------------------------------------------------
// 入力システム（スクリーン座標 → ワールド座標変換）
// -----------------------------------------------------------------
let inputMode = "NONE";
let isDrawing = false;
let touchRing = { active: false, x: 0, y: 0 };

// 変更3: 指の現在ワールド座標を保持する。
// isDrawing 中は静止していてもこの位置をリーダー目標として供給し続けることで、
// 指を押し続けるだけで群れが誘導され続ける（パスが尽きてアイドルに落ちない）。
let pointerWorldX = 0;
let pointerWorldY = 0;

const TRAIL_LIFETIME = 1.2;
const trailPoints    = [];

function addTrailPoint(sx, sy, now) {
  if (trailPoints.length >= 400) trailPoints.shift();
  trailPoints.push({ x: sx, y: sy, bornAt: now });
}

function inputStart(sx, sy, now) {
  // v0.6: ライン描画はプレイ中とステージクリア演出中のみ受け付ける。
  // タイトル/リザルトはDOMオーバーレイが操作を担う。
  // v0.6.1: 3択カード表示中もプレイ継続（カード領域外なら線が引ける）。
  if (gameState !== "playing" && gameState !== "stage-clear") {
    inputMode = "NONE";
    return;
  }
  if (sy >= viewH - bottomUIHeight) {
    inputMode = "UI";
    return;
  }
  inputMode = "DRAW";
  isDrawing = true;
  pathClear();
  const w = screenToWorld(sx, sy);
  pathPush(w.x, w.y);
  addTrailPoint(w.x, w.y, now);
  // 変更3: 指のワールド座標を保持（静止保持でも誘導継続するため）
  pointerWorldX = w.x;
  pointerWorldY = w.y;
  touchRing.active = true;
  touchRing.x = sx;
  touchRing.y = sy;
  hapticPulse(10);
}

function inputMove(sx, sy, now) {
  if (inputMode !== "DRAW") return;
  const w = screenToWorld(sx, sy);
  pathPush(w.x, w.y);
  addTrailPoint(w.x, w.y, now);
  // 変更3: 指が動いたときも最新ワールド座標を更新する
  pointerWorldX = w.x;
  pointerWorldY = w.y;
  touchRing.x = sx;
  touchRing.y = sy;
}

function inputEnd() {
  isDrawing = false;
  inputMode = "NONE";
  touchRing.active = false;
}

canvas.addEventListener("touchstart", (e) => {
  const t = e.touches[0];
  inputStart(t.clientX, t.clientY, performance.now());
  e.preventDefault();
}, { passive: false });

canvas.addEventListener("touchmove", (e) => {
  const t = e.touches[0];
  inputMove(t.clientX, t.clientY, performance.now());
  e.preventDefault();
}, { passive: false });

canvas.addEventListener("touchend", (e) => {
  // touches が残っている（マルチタッチの一本が離れただけ）は無視する。
  // e.touches.length === 0 のときのみ入力終了とする。
  if (e.touches.length === 0) { inputEnd(); }
  e.preventDefault();
}, { passive: false });
// touchcancel はスクロール防止 preventDefault の失敗時などに誤発火しやすい。
// isDrawing を切らず、そのまま巡航継続させる。
// ただし touches が完全に 0 になった場合は終了する（ハードウェア切断など）。
canvas.addEventListener("touchcancel", (e) => {
  if (e.touches.length === 0) { inputEnd(); }
  e.preventDefault();
}, { passive: false });

canvas.addEventListener("mousedown",  (e) => inputStart(e.clientX, e.clientY, performance.now()));
canvas.addEventListener("mousemove",  (e) => { if (isDrawing) inputMove(e.clientX, e.clientY, performance.now()); });
canvas.addEventListener("mouseup",    () => inputEnd());
canvas.addEventListener("mouseleave", () => inputEnd());

// -----------------------------------------------------------------
// アイドル旋回（ワールド座標でリーダーが徘徊）
// -----------------------------------------------------------------
let idleAngle = 0;
const IDLE_ANGULAR_SPEED = 0.35;

function getIdleLeaderTarget(dt) {
  idleAngle += IDLE_ANGULAR_SPEED * dt;
  const r = BASE_CFG.idleWanderRadius;
  const centroid = calcFriendlyCentroid();
  return {
    x: centroid.x + Math.cos(idleAngle) * r,
    y: centroid.y + Math.sin(idleAngle) * r * 0.6,
  };
}

// -----------------------------------------------------------------
// 自軍の重心（ワールド座標）
// -----------------------------------------------------------------
function calcFriendlyCentroid() {
  let cx = 0, cy = 0, count = 0;
  for (let i = 0; i < N; i++) {
    // 変更2: ダウン中は重心計算から除外（カメラ追従が薄まるフィードバックのため）
    if (boidDead[i] || boidDowned[i]) continue;
    cx += px[i];
    cy += py[i];
    count++;
  }
  if (count === 0) return { x: leader.x, y: leader.y };
  return { x: cx / count, y: cy / count };
}

// -----------------------------------------------------------------
// 消滅フェードタイマー更新 + 変更2: ダウンタイマー更新・復帰処理
// -----------------------------------------------------------------
function updateDeathTimers(dt) {
  for (let i = 0; i < N; i++) {
    // 既存: フェードアウトタイマー（ダウン開始直後のフェードアウト）
    if (boidFadeTimer[i] > 0) boidFadeTimer[i] = Math.max(0, boidFadeTimer[i] - dt);

    // 変更2: ダウンタイマーが進み、0になったら復帰開始
    if (boidDowned[i]) {
      boidDownTimer[i] = Math.max(0, boidDownTimer[i] - dt);
      if (boidDownTimer[i] <= 0 && boidReviveTimer[i] <= 0) {
        // 復帰開始: 群れの重心付近にフェードインで出現
        const centroid = calcFriendlyCentroid();
        const angle    = Math.random() * Math.PI * 2;
        const scatter  = 40 + Math.random() * 60;
        px[i] = centroid.x + Math.cos(angle) * scatter;
        py[i] = centroid.y + Math.sin(angle) * scatter;
        // 群れ平均速度に乗せる
        let avgVx = 0, avgVy = 0, cnt = 0;
        for (let j = 0; j < N; j++) {
          if (!boidDead[j] && !boidDowned[j]) { avgVx += vx[j]; avgVy += vy[j]; cnt++; }
        }
        if (cnt > 0) { avgVx /= cnt; avgVy /= cnt; }
        else { avgVx = BASE_CFG.minSpeed; avgVy = 0; }
        vx[i] = avgVx + (Math.random() - 0.5) * 30;
        vy[i] = avgVy + (Math.random() - 0.5) * 30;
        // HP全回復・フラグリセット（v0.6: 硬鱗カード分も含めた実効最大HP）
        boidHp[i]          = effBoidMaxHp();
        boidDowned[i]      = 0;
        boidDead[i]        = 0;
        boidFadeTimer[i]   = 0;
        boidReviveTimer[i] = BOID_REVIVE_DURATION;
        // 尻尾角度履歴を現在の速度方向で初期化（NaN防止）
        const initAngle = Math.atan2(vy[i], vx[i]);
        const base = i * TAIL_SEGS;
        for (let s = 0; s < TAIL_SEGS; s++) boidAngleHistory[base + s] = initAngle;
      }
    }

    // 変更2: フェードイン復帰アニメタイマー
    if (boidReviveTimer[i] > 0) boidReviveTimer[i] = Math.max(0, boidReviveTimer[i] - dt);
  }
}

function applyDamageToBoid(boidIndex, damage) {
  // 変更2: ダウン中・すでに dead の場合は何もしない
  if (boidDead[boidIndex] || boidDowned[boidIndex]) return;
  // v0.6: 「竜鱗共鳴」カードで被ダメージ軽減
  boidHp[boidIndex] -= damage * effDmgTakenMult();
  if (boidHp[boidIndex] <= 0) {
    // 変更2: 消滅ではなくダウン状態へ移行（恒久喪失なし）
    // v0.6: 「再生の潮」カードで復帰時間短縮
    boidDowned[boidIndex]    = 1;
    boidDownTimer[boidIndex] = BOID_DOWN_DURATION * effReviveMult();
    boidReviveTimer[boidIndex] = 0;
    // boidDead は立てない（dead=生存スロット外を意味するため）
    // フェードアウトは boidFadeTimer で表現する
    boidFadeTimer[boidIndex] = FADE_DURATION;
    boidHp[boidIndex]        = 0;
    // 変更2(追加): やられた瞬間に死亡FX（灰/暗赤）を出す。
    // 出現FX（金色・弾ける）と色味を明確に変えて「やられた」と認識させる。
    spawnDragonDownEffect(px[boidIndex], py[boidIndex]);
  }
}

// v0.6: 全滅チェック（checkGameConditions/triggerDefeat）は廃止。
// ダウンした竜は必ず復帰するためゲームオーバーは存在しない（仕様 §2.2）。

// -----------------------------------------------------------------
// Simulation step — 自軍Boids
// -----------------------------------------------------------------
const neighbours = [];

// v0.6: フレーム内で使い回す速度倍率キャッシュ（simStep 冒頭で更新）
let _simSpeedMult = 1;

function simStep(dt) {
  _simSpeedMult = effSpeedMult();
  updateLeader(dt);

  // ヒットストップ中の個体は移動・加速を計算するが位置更新をスキップ
  // （速度ベクトルは維持することで停止後にスムーズに動き出す）
  const boidHitStopped = boidHitStopTimer; // 参照を短縮

  // 隊形廃止により BASE_CFG の固定値を直接参照
  const perc = BASE_CFG.perception;
  const sepR = BASE_CFG.separationRadius;
  const wSep = BASE_CFG.wSeparation;
  const wAli = BASE_CFG.wAlignment;
  const wCoh = BASE_CFG.wCohesion;

  gridClear();
  for (let i = 0; i < N; i++) {
    // 変更2: ダウン中の個体はグリッドに登録しない（他の個体の分離・整列計算対象外）
    if (!boidDead[i] && !boidDowned[i]) gridInsert(i, px[i], py[i], perc);
  }

  for (let i = 0; i < N; i++) {
    // 変更2: ダウン中も位置更新をスキップ（タイマーは updateDeathTimers で進む）
    if (boidDead[i] || boidDowned[i]) continue;

    // ヒットストップ中は物理更新を丸ごとスキップして速度・向きも凍結する。
    // 位置だけ止めて速度を積分し続けると向き(atan2)が毎フレーム振れて
    // 三角形がチラついて見えるため（ちらつき報告の原因）。
    if (boidHitStopped[i] > 0) continue;

    const perc2 = perc * perc;
    const sep2  = sepR * sepR;
    const xi = px[i], yi = py[i];

    let sepX = 0, sepY = 0;
    let aliX = 0, aliY = 0;
    let cohX = 0, cohY = 0;
    let nAli = 0, nCoh = 0;

    gridQuery(xi, yi, perc, neighbours);
    for (let k = 0; k < neighbours.length; k++) {
      const j = neighbours[k];
      if (j === i || boidDead[j]) continue;
      const dx = xi - px[j], dy = yi - py[j];
      const d2 = dx * dx + dy * dy;
      if (d2 > perc2 || d2 === 0) continue;
      if (d2 < sep2) {
        const invD = 1 / Math.sqrt(d2);
        sepX += dx * invD;
        sepY += dy * invD;
      }
      aliX += vx[j]; aliY += vy[j]; nAli++;
      cohX += px[j]; cohY += py[j]; nCoh++;
    }

    let ax = 0, ay = 0;
    ax += sepX * wSep * 80;
    ay += sepY * wSep * 80;

    if (nAli > 0) {
      const inv = 1 / nAli;
      ax += (aliX * inv - vx[i]) * wAli;
      ay += (aliY * inv - vy[i]) * wAli;
    }
    if (nCoh > 0) {
      const inv = 1 / nCoh;
      ax += (cohX * inv - xi) * wCoh;
      ay += (cohY * inv - yi) * wCoh;
    }

    {
      const ldx = leader.x - xi, ldy = leader.y - yi;
      const ld  = Math.sqrt(ldx * ldx + ldy * ldy) || 1;
      // 隊形廃止により ring 配置は常にスキップ — 通常リーダー追従のみ
      ax += (ldx / ld) * BASE_CFG.wLeader * 120;
      ay += (ldy / ld) * BASE_CFG.wLeader * 120;
    }

    const am = Math.sqrt(ax * ax + ay * ay);
    if (am > BASE_CFG.maxForce) { const s = BASE_CFG.maxForce / am; ax *= s; ay *= s; }

    let nvx = vx[i] + ax * dt;
    let nvy = vy[i] + ay * dt;
    const sp = Math.sqrt(nvx * nvx + nvy * nvy);
    // v0.6: 「疾風」カードで上限・下限速度が伸びる
    const maxSp = BASE_CFG.maxSpeed * _simSpeedMult;
    const minSp = BASE_CFG.minSpeed * _simSpeedMult;
    if      (sp > maxSp) { const s = maxSp / sp; nvx *= s; nvy *= s; }
    else if (sp < minSp && sp > 0.0001) { const s = minSp / sp; nvx *= s; nvy *= s; }
    else if (sp <= 0.0001) { nvx = minSp; nvy = 0; }
    vx[i] = nvx; vy[i] = nvy;

    let nx = xi + nvx * dt;
    let ny = yi + nvy * dt;
    if (nx < 10)         { nx = 10;         vx[i] = Math.abs(vx[i]) * 0.5; }
    else if (nx > WORLD_W - 10) { nx = WORLD_W - 10; vx[i] = -Math.abs(vx[i]) * 0.5; }
    if (ny < 10)         { ny = 10;         vy[i] = Math.abs(vy[i]) * 0.5; }
    else if (ny > WORLD_H - 10) { ny = WORLD_H - 10; vy[i] = -Math.abs(vy[i]) * 0.5; }
    px[i] = nx; py[i] = ny;
  }
}

// -----------------------------------------------------------------
// v0.6-p3: 障害物押し出し（城壁・岩山・湖はドラゴン侵入不可）
// リーダー（指の軌跡）は壁を無視できるが、個体は物理的に堰き止められる。
// 押し出し距離は 障害物半径+5px（体当たり判定の半径+6px より内側）に置くことで、
// 壁面に押し付けられた竜が連続で壁をラミング攻撃できる＝ブリーチの手段になる。
// -----------------------------------------------------------------
const _obstacleQueryBuf = [];
const OBSTACLE_PUSH_GAP = 5;

function applyObstaclePushout() {
  for (let i = 0; i < N; i++) {
    if (boidDead[i] || boidDowned[i]) continue;

    // 地形（岩山・湖）: 個数が少ないので全走査
    for (const ob of terrainObstacles) {
      pushBoidOutOfCircle(i, ob.wx, ob.wy, ob.radius + OBSTACLE_PUSH_GAP);
    }

    // 城壁セグメント: 建物空間ハッシュから近傍のみ
    buildingGridQuery(px[i], py[i], _obstacleQueryBuf);
    for (const sIdx of _obstacleQueryBuf) {
      const s = settlements[sIdx];
      if (!s || s.fallen || !s._isWall) continue;
      pushBoidOutOfCircle(i, s.wx, s.wy, s.radius + OBSTACLE_PUSH_GAP);
    }
  }
}

/** 個体 i を円 (cx,cy,minDist) の外側へ押し出し、内向き速度成分を殺してスライドさせる。 */
function pushBoidOutOfCircle(i, cx, cy, minDist) {
  const dx = px[i] - cx;
  const dy = py[i] - cy;
  const d2 = dx * dx + dy * dy;
  if (d2 >= minDist * minDist || d2 === 0) return;
  const d  = Math.sqrt(d2);
  const nx = dx / d;
  const ny = dy / d;
  px[i] = cx + nx * minDist;
  py[i] = cy + ny * minDist;
  // 法線方向の内向き速度を除去 → 壁面に沿って滑る（渦を巻く絵になる）
  const vDotN = vx[i] * nx + vy[i] * ny;
  if (vDotN < 0) {
    vx[i] -= vDotN * nx;
    vy[i] -= vDotN * ny;
  }
}

// 巡航操舵: 指に到達したときの「直前進行方向」を保持する。
// 指が静止している間はこの方向を維持して前進し続ける（停止しない）。
let _cruiseVx = 0;
let _cruiseVy = 1; // 初期値: 下向き（正規化済み）

// isDrawing 中にリーダーが「指方向へ舵を切りながら常に leaderSpeed で前進」する閾値。
// 指までの距離がこの値未満になったら「到達」とみなし進行方向を維持して巡航する。
const LEADER_ARRIVAL_DIST = 60; // px（パスの先読み半径 24px より大きく取る）

function updateLeader(dt) {
  // v0.6: 「疾風」カードでリーダー速度も伸びる（群れと感覚を揃える）
  const speed = BASE_CFG.leaderSpeed * _simSpeedMult;

  if (isDrawing) {
    // ---- 巡航操舵モード ----
    // 押下中は「常に leaderSpeed で前進し続ける」。指は進行方向の舵。
    // 目標が前方に十分離れているときだけ _cruise を目標方向へなめらかに寄せる。
    // 指に到達/追い越しても減速や引き返しをせず _cruise 方向へ直進を続ける
    // （指の点を中心に往復してその場で止まってしまうトラップを防ぐ）。

    // 目標点を決める: 描いた軌跡（パス）が残っていればそのウェイポイントを追従、
    // 消費しきったら指の現在位置。followingPath=軌跡をなぞっている最中。
    let tx = pointerWorldX, ty = pointerWorldY;
    let followingPath = false;
    if (pathLen > 0) {
      if (leaderPathConsumeIdx >= pathLen) leaderPathConsumeIdx = pathLen - 1;
      // 進行はリーダーに「最も近い未消費ウェイポイント」まで進める。
      // こうするとコーナーを突っ切って各ウェイポイント半径に入らなくても消費が進み、
      // 「線の最初しか追わずインデックスが止まる」問題を防げる。
      // 自己交差で遠くへ飛ばないよう前方の探索窓を限定する。
      const SCAN_AHEAD = 40;
      const scanEnd = Math.min(pathLen - 1, leaderPathConsumeIdx + SCAN_AHEAD);
      let bestIdx = leaderPathConsumeIdx, bestD2 = Infinity;
      for (let k = leaderPathConsumeIdx; k <= scanEnd; k++) {
        const p = pathGet(k);
        const ex = p.x - leader.x, ey = p.y - leader.y;
        const e2 = ex * ex + ey * ey;
        if (e2 < bestD2) { bestD2 = e2; bestIdx = k; }
      }
      if (bestIdx > leaderPathConsumeIdx) leaderPathConsumeIdx = bestIdx; // 戻らない
      // 末尾インデックスに達するまではパスを追従（弧などをなぞる）。
      // 末尾に達したら（距離に関わらず）パス追従を終え、指位置＋aheadDot 巡航へ移す。
      // ここで pathClear はしない＝指を離した後のループ追従（円を描いて離すと周回）のため保持。
      // 押しっぱなしの末端引き戻しトラップは下の aheadDot 判定で防ぐ。
      if (leaderPathConsumeIdx < pathLen - 1) {
        // 最近傍より少し先（lookahead +2）を目標にして弧へ早めに舵を切る
        const aimIdx = Math.min(leaderPathConsumeIdx + 2, pathLen - 1);
        const atgt = pathGet(aimIdx);
        tx = atgt.x; ty = atgt.y; followingPath = true;
      }
    }

    const dx = tx - leader.x, dy = ty - leader.y;
    const d  = Math.sqrt(dx * dx + dy * dy) || 1;
    // 目標が進行方向の前方にあるか（後方の固定点へ引き返してUターンするトラップを防ぐ）。
    // 指を静止保持してリーダーが追い越した場合、目標は後方になり aheadDot < 0 になる。
    const aheadDot = (dx / d) * _cruiseVx + (dy / d) * _cruiseVy;

    if (followingPath || (d > LEADER_ARRIVAL_DIST && aheadDot > 0)) {
      // 軌跡を追従中、または目標が前方に十分離れている →
      // 速度ベクトルを目標方向へ機敏に寄せて、描いた線（弧など）に追従する。
      const nx = dx / d, ny = dy / d;
      const k  = Math.min(1, dt * 10); // 機敏な操舵
      leader.vx += (nx * speed - leader.vx) * k;
      leader.vy += (ny * speed - leader.vy) * k;
      // 速度がついている間は巡航方向を覚えておく（静止保持への移行を滑らかに）
      const cs = Math.sqrt(leader.vx * leader.vx + leader.vy * leader.vy);
      if (cs > 1) { _cruiseVx = leader.vx / cs; _cruiseVy = leader.vy / cs; }
    } else {
      // 指に到達／追い越し（目標が近い or 後方）＝指を静止保持 →
      // 直前の進行方向へ直進巡航。速度は leaderSpeed 固定で減速しない
      // ＝押している限りまっすぐ進み続ける（その場で旋回・停止しない）。
      leader.vx = _cruiseVx * speed;
      leader.vy = _cruiseVy * speed;
    }
  } else if (pathLen > 2) {
    // ---- パス・ループ追従モード（指を離した後）----
    // 記録した軌跡を繰り返しなぞる。円を描いて離すと、その円をずっとぐるぐる回る。
    // 最近傍ウェイポイントを全走査で求め、数点先（末尾はラップ）を目標に全速で追う。
    let ni = 0, nd = Infinity;
    for (let k = 0; k < pathLen; k++) {
      const p = pathGet(k);
      const ex = p.x - leader.x, ey = p.y - leader.y;
      const e2 = ex * ex + ey * ey;
      if (e2 < nd) { nd = e2; ni = k; }
    }
    const aim = pathGet((ni + 3) % pathLen); // 数点先（ラップで周回）
    const dx = aim.x - leader.x, dy = aim.y - leader.y;
    const d  = Math.sqrt(dx * dx + dy * dy) || 1;
    const nx = dx / d, ny = dy / d;
    const k  = Math.min(1, dt * 6);
    leader.vx += (nx * speed - leader.vx) * k;
    leader.vy += (ny * speed - leader.vy) * k;
    const cs = Math.sqrt(leader.vx * leader.vx + leader.vy * leader.vy);
    if (cs > 1) { _cruiseVx = leader.vx / cs; _cruiseVy = leader.vy / cs; }
  } else {
    // ---- アイドル旋回モード（パスが無い／ごく短いとき）----
    const target = getIdleLeaderTarget(dt);
    leader.vx += ((target.x - leader.x) * 0.8 - leader.vx) * Math.min(1, dt * 2.0);
    leader.vy += ((target.y - leader.y) * 0.8 - leader.vy) * Math.min(1, dt * 2.0);
    // アイドル中も巡航方向を現在の移動方向に更新しておく（次の押し込み時に自然な向きで発進）
    const idleSpd = Math.sqrt(leader.vx * leader.vx + leader.vy * leader.vy);
    if (idleSpd > 10) {
      _cruiseVx = leader.vx / idleSpd;
      _cruiseVy = leader.vy / idleSpd;
    }
  }

  leader.x += leader.vx * dt;
  leader.y += leader.vy * dt;
  leader.x = Math.max(0, Math.min(WORLD_W, leader.x));
  leader.y = Math.max(0, Math.min(WORLD_H, leader.y));
}

// -----------------------------------------------------------------
// 描画
// -----------------------------------------------------------------
function render(now) {
  const stageConfig = STAGE_CONFIGS[currentStage];
  ctx.fillStyle = stageConfig.bgColor;
  ctx.fillRect(0, 0, viewW, viewH);

  ctx.save();
  // v0.8: 画面シェイク（減衰しながらランダムに揺れる）
  if (shakeTimer > 0 && shakeDuration > 0) {
    const shakePower = shakeAmplitude * (shakeTimer / shakeDuration);
    ctx.translate((Math.random() - 0.5) * 2 * shakePower, (Math.random() - 0.5) * 2 * shakePower);
  }
  // カメラ変換: 画面中心を原点にしてズームスケールを適用してからワールドオフセット
  ctx.translate(viewW * 0.5, viewH * 0.5);
  ctx.scale(cam.scale, cam.scale);
  ctx.translate(-cam.x, -cam.y);

  drawWorldGrid();

  // 建物静的レイヤーをオフスクリーンCanvasからコピー（カメラオフセット適用済み）
  if (buildingLayerCanvas) {
    // drawImage の座標はすでにctx変換行列が適用されているので (0,0) から描く
    ctx.drawImage(buildingLayerCanvas, 0, 0);
  }

  drawBossCitadel();   // v0.7: ボス城塞スプライト（静的レイヤーのボス円の上に重ねる）

  // 攻撃射程リング（静的レイヤーの上に動的に描く）
  drawSettlementRanges();

  // HP バーは動的なので毎フレーム描画
  drawSettlementHPBars();

  drawEggBearerMarkers(now);
  drawEggs();
  drawEmbers();             // v0.10: 燃える建物の火の粉・煙（建物の上・ユニットの下）
  drawXpGems();              // v0.6: XPジェム（青白ダイヤ。金色の卵と区別）
  drawMovers();              // v0.6-p4: 移動敵（竜より下のレイヤー）
  drawBreathAttacks(now);
  drawDragonProjectiles();   // v0.6-p2: 自軍の氷弾・ミサイル
  drawSlashFx();             // v0.8: 緋竜の斬閃
  drawBoids();
  drawProjectiles();
  drawParticles();
  drawAppearEffects();  // 変更2: 竜出現リングエフェクト（ワールド座標系）
  drawDownEffects();    // 変更2(追加): 竜やられリングエフェクト（ワールド座標系）

  // 軌跡はワールド座標で保持しているのでカメラ変換の内側で描く。
  // これでドラゴンが実際に追う経路と一致し、地面に固定されたまま流れる。
  drawTrail(now);

  ctx.restore();

  // 指先リングはスクリーン座標（指の現在位置）なのでカメラ変換の外で描く。
  drawTouchRing();
  drawFlash();
}

/**
 * v0.7: ボス城塞スプライト。静的レイヤーのボス描画（グロー円）の上に重ね、
 * ゆっくり脈動させて「攻略目標の威容」を出す。陥落後は描かない（瓦礫円が残る）。
 */
function drawBossCitadel() {
  if (bossSettlementIdx < 0) return;
  const boss = settlements[bossSettlementIdx];
  if (!boss || boss.fallen) return;
  const img = enemyImages.citadel;
  if (!img) return;

  // ビューポートカリング
  const meta  = ENEMY_SPRITE_META.citadel;
  const drawW = boss.radius * meta.drawScale;
  const bounds = getViewBoundsWorld(drawW);
  if (boss.wx < bounds.minX || boss.wx > bounds.maxX ||
      boss.wy < bounds.minY || boss.wy > bounds.maxY) return;

  const s     = drawW / img.naturalWidth;
  const drawH = img.naturalHeight * s;
  const pulse = 1 + 0.02 * Math.sin(breathTime * 2);
  ctx.save();
  ctx.translate(boss.wx, boss.wy);
  ctx.scale(pulse, pulse);
  ctx.drawImage(
    img,
    -img.naturalWidth  * s * meta.px,
    -img.naturalHeight * s * meta.py,
    drawW, drawH,
  );
  ctx.restore();
}

function drawWorldGrid() {
  const stageConfig = STAGE_CONFIGS[currentStage];
  const GRID_SIZE = 200;

  // ビューポートカリング: 画面内に入る格子線だけ描く。
  // グリッド座標をビューポートの世界境界でスナップして範囲を絞る。
  const bounds = getViewBoundsWorld(GRID_SIZE); // 1セル分の余白
  const startX = Math.floor(Math.max(0, bounds.minX) / GRID_SIZE) * GRID_SIZE;
  const endX   = Math.min(WORLD_W, Math.ceil(bounds.maxX / GRID_SIZE) * GRID_SIZE);
  const startY = Math.floor(Math.max(0, bounds.minY) / GRID_SIZE) * GRID_SIZE;
  const endY   = Math.min(WORLD_H, Math.ceil(bounds.maxY / GRID_SIZE) * GRID_SIZE);

  ctx.strokeStyle = stageConfig.gridColor;
  ctx.lineWidth = 1;
  for (let x = startX; x <= endX; x += GRID_SIZE) {
    ctx.beginPath();
    ctx.moveTo(x, Math.max(0, bounds.minY));
    ctx.lineTo(x, Math.min(WORLD_H, bounds.maxY));
    ctx.stroke();
  }
  for (let y = startY; y <= endY; y += GRID_SIZE) {
    ctx.beginPath();
    ctx.moveTo(Math.max(0, bounds.minX), y);
    ctx.lineTo(Math.min(WORLD_W, bounds.maxX), y);
    ctx.stroke();
  }
  ctx.strokeStyle = "rgba(100, 120, 100, 0.4)";
  ctx.lineWidth = 2;
  ctx.strokeRect(0, 0, WORLD_W, WORLD_H);
}

// -----------------------------------------------------------------
// ビューポートカリング共通ヘルパー
// ワールド座標での可視矩形を返す。margin はワールドpx単位の余白。
// カメラ変換: screen_x = (world_x - cam.x) * cam.scale + viewW * 0.5
// → world_x_visible: cam.x ± (viewW * 0.5 / cam.scale)
// -----------------------------------------------------------------
function getViewBoundsWorld(margin) {
  const halfW = viewW * 0.5 / cam.scale;
  const halfH = viewH * 0.5 / cam.scale;
  return {
    minX: cam.x - halfW - margin,
    maxX: cam.x + halfW + margin,
    minY: cam.y - halfH - margin,
    maxY: cam.y + halfH + margin,
  };
}

function drawSettlementRanges() {
  // ビューポートカリング: 攻撃射程（attackRadius）を余白として使う。
  // 射程リングの一部が画面内にかかる建物だけを描画する。
  // ボスの BOSS_ATTACK_RADIUS=380 が最大値なので余白を 400px に拡大する。
  const RANGE_MARGIN = 400;
  const bounds = getViewBoundsWorld(RANGE_MARGIN);

  ctx.strokeStyle = "rgba(180, 60, 60, 0.08)";
  ctx.lineWidth = 1;

  for (let s = 0; s < settlements.length; s++) {
    const settlement = settlements[s];
    if (settlement.fallen) continue;

    // ビューポート外の建物はスキップ（余白は射程半径分を含んでいる）
    if (settlement.wx < bounds.minX || settlement.wx > bounds.maxX ||
        settlement.wy < bounds.minY || settlement.wy > bounds.maxY) continue;

    ctx.beginPath();
    ctx.arc(settlement.wx, settlement.wy, settlement.attackRadius, 0, Math.PI * 2);
    ctx.stroke();
  }
}

// HP バーのみ動的に描画（建物形状はオフスクリーンに焼き付け済み）
function drawSettlementHPBars() {
  // ビューポートカリング: ボスのグロー外輪(radius*2.5)を余白として使う
  const HP_MARGIN = Math.ceil(BOSS_RADIUS * 2.5) + 4;
  const bounds = getViewBoundsWorld(HP_MARGIN);

  ctx.globalAlpha = 0.85;
  for (let s = 0; s < settlements.length; s++) {
    const settlement = settlements[s];
    if (settlement.fallen) continue;

    // ビューポート外の建物はスキップ
    if (settlement.wx < bounds.minX || settlement.wx > bounds.maxX ||
        settlement.wy < bounds.minY || settlement.wy > bounds.maxY) continue;

    if (settlement.isBoss) {
      // ボス専用HPバー: 常に表示、太く広く、視認性最優先
      drawBossHPBar(settlement);
    } else {
      // 通常建物: 満タンはバーを描かない（節約）
      if (settlement.hp >= settlement.maxHp) continue;
      const hpRatio = Math.max(0, settlement.hp / settlement.maxHp);
      const barW = settlement.radius * 2;
      const barX = settlement.wx - settlement.radius;
      const barY = settlement.wy - settlement.radius - 8;
      ctx.fillStyle = "rgba(0,0,0,0.5)";
      ctx.fillRect(barX, barY, barW, 4);
      ctx.fillStyle = hpRatio > 0.5 ? "#50e070" : (hpRatio > 0.25 ? "#e0c040" : "#e04040");
      ctx.fillRect(barX, barY, barW * hpRatio, 4);
    }
  }
  ctx.globalAlpha = 1.0;
}

/**
 * ボス集落のHPバーを描画する。
 * 通常建物より大きく（幅 radius*2.8、高さ 8px）、ラベル付きで一目でボスHPと分かる。
 * ビューポートカリングは呼び出し元の drawSettlementHPBars で済んでいる。
 */
function drawBossHPBar(boss) {
  const hpRatio = Math.max(0, boss.hp / boss.maxHp);
  const barW    = boss.radius * 2.8;
  const barH    = 8;
  const barX    = boss.wx - barW * 0.5;
  const barY    = boss.wy - boss.radius - 18;
  const glowColor = boss._bossGlowColor ?? boss.color;

  ctx.globalAlpha = 0.95;

  // 背景
  ctx.fillStyle = "rgba(0,0,0,0.70)";
  ctx.fillRect(barX - 1, barY - 1, barW + 2, barH + 2);

  // HP本体（HP残量で色変化）
  const barColor = hpRatio > 0.6 ? glowColor
                 : hpRatio > 0.3 ? "#e0c040"
                 : "#e04040";
  ctx.fillStyle = barColor;
  ctx.fillRect(barX, barY, barW * hpRatio, barH);

  // 枠線
  ctx.strokeStyle = "rgba(255,255,255,0.50)";
  ctx.lineWidth   = 1;
  ctx.strokeRect(barX, barY, barW, barH);

  // ラベル "BOSS"
  ctx.fillStyle   = "rgba(255,255,255,0.85)";
  ctx.font        = `bold ${Math.max(7, Math.round(9 / cam.scale))}px monospace`;
  ctx.textAlign   = "center";
  ctx.fillText("BOSS", boss.wx, barY - 3);
  ctx.textAlign   = "left"; // リセット

  ctx.globalAlpha = 1.0;
}

// -----------------------------------------------------------------
// 変更1: 卵持ち建物の目印描画
// 立っている卵持ち建物の上に金色の小オーブを明滅させて描く。
// cam.scale が小さい（引き画面）でも視認できるよう最低サイズを保証する。
// fallen になると描画から除外されるので「陥落後に消える」を自動的に満たす。
// -----------------------------------------------------------------
function drawEggBearerMarkers(now) {
  // 明滅周期: 1.2秒サイクル（sin波で 0.4〜1.0 の alpha 範囲）
  const pulse = 0.4 + 0.6 * (Math.sin(now * 0.001 * Math.PI * 2 / 1.2) * 0.5 + 0.5);

  // ビューポートカリング: オーブ表示範囲（最大5/cam.scale * 2.2 ≈ 数十px）の余白
  const EGG_MARGIN = 60;
  const bounds = getViewBoundsWorld(EGG_MARGIN);

  ctx.save();
  for (let s = 0; s < settlements.length; s++) {
    const st = settlements[s];
    if (st.fallen || !st.isEggBearer) continue;

    // ビューポート外の建物はスキップ
    if (st.wx < bounds.minX || st.wx > bounds.maxX ||
        st.wy < bounds.minY || st.wy > bounds.maxY) continue;

    // オーブ中心: 建物の真上（半径 + 10px）
    const ox = st.wx;
    const oy = st.wy - st.radius - 10;

    // カメラズームに関係なくスクリーン上で最低 5px の半径を保証する。
    // ワールド座標半径 = max(5 / cam.scale, 5) で計算する。
    const worldR = Math.max(5 / cam.scale, 5);

    // 外側グロー（金色・広め・薄め）
    ctx.globalAlpha = pulse * 0.35;
    ctx.fillStyle = "#ffd040";
    ctx.beginPath();
    ctx.arc(ox, oy, worldR * 2.2, 0, Math.PI * 2);
    ctx.fill();

    // メインオーブ（金色）
    ctx.globalAlpha = pulse * 0.90;
    ctx.fillStyle = "#ffe060";
    ctx.strokeStyle = "#fff8a0";
    ctx.lineWidth = Math.max(0.5, 1.5 / cam.scale);
    ctx.beginPath();
    ctx.arc(ox, oy, worldR, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // 中心ハイライト（白い点）
    ctx.globalAlpha = pulse * 0.80;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(ox, oy, worldR * 0.35, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1.0;
  ctx.restore();
}

// -----------------------------------------------------------------
// ブレス（レーザー）描画
// 口元から建物まで: 根元太く → 先端細く、sin波揺らぎ、橙〜赤グラデーション
// -----------------------------------------------------------------
function drawBreathAttacks(now) {
  if (activeBreaths.length === 0) return;

  ctx.save();
  ctx.lineCap = "round";

  for (let k = 0; k < activeBreaths.length; k++) {
    const breath = activeBreaths[k];
    const bIdx = breath.boidIdx;
    if (boidDead[bIdx]) continue;

    // ブレスは体の中心でなく顔の前（口元）から出す。
    // 竜の描画原点は画像の質量重心（DRAGON_FIRE_BODY_PIVOT、中心ではない）なので、
    // 鼻先までの距離もその重心基準で再計算する。
    // fire胴体画像（613x1138）: 鼻先(alpha検出上端、y=16)は重心cy=545.3から
    //   元画像px換算で 545.3-16 = 529.3px前方
    //   → DRAGON_FIRE_BODY_DRAW_H=27論理px換算で 529.3 * (27/1138) ≈ 12.56論理px
    //   （胴体・翼分離に伴い胴体画像が変わったため再計算。preview_evalで実測確認済み）。
    // 旧ベクター比率（8 / 9.62 ≈ 0.832、口先よりわずかに手前から出す意図）を踏襲し
    // 12.56 * 0.832 ≈ 10.4 → 10 に再計算。
    const headAngle = Math.atan2(vy[bIdx], vx[bIdx]);
    const MOUTH_OFFSET = 10;
    const fromX = px[bIdx] + Math.cos(headAngle) * MOUTH_OFFSET;
    const fromY = py[bIdx] + Math.sin(headAngle) * MOUTH_OFFSET;
    const toX   = breath.targetWx;
    const toY   = breath.targetWy;

    const dx = toX - fromX;
    const dy = toY - fromY;
    const dist = Math.sqrt(dx * dx + dy * dy) || 1;

    // sin波の揺らぎ（炎っぽさ）
    // 法線方向に ±2px の振動
    const normalX = -dy / dist;
    const normalY =  dx / dist;
    const wobble  = Math.sin(breathTime * 18 + bIdx * 2.3) * 2.0;

    // 制御点（中間点にオフセット）
    const midX = fromX + dx * 0.5 + normalX * wobble;
    const midY = fromY + dy * 0.5 + normalY * wobble;

    // グラデーション: 根元 橙(#ff8020) → 先端 深紅(#ff1000)
    const grad = ctx.createLinearGradient(fromX, fromY, toX, toY);
    grad.addColorStop(0.0, "rgba(255, 200, 60, 0.95)");   // 口元: 明るい橙
    grad.addColorStop(0.35, "rgba(255, 100, 20, 0.90)");  // 中間: 橙
    grad.addColorStop(1.0, "rgba(220, 20, 0, 0.80)");     // 先端: 深紅

    // v0.8: 通常攻撃の派手化 — グロー太め・コア強め・命中点にフレア
    // 外側グロー（薄く太め）
    ctx.strokeStyle = "rgba(255, 80, 0, 0.28)";
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.moveTo(fromX, fromY);
    ctx.quadraticCurveTo(midX, midY, toX, toY);
    ctx.stroke();

    // メインレーザー
    ctx.strokeStyle = grad;
    ctx.lineWidth = 3.4;
    ctx.beginPath();
    ctx.moveTo(fromX, fromY);
    ctx.quadraticCurveTo(midX, midY, toX, toY);
    ctx.stroke();

    // コア（白く輝く中心線）
    ctx.strokeStyle = "rgba(255, 255, 210, 0.85)";
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.moveTo(fromX, fromY);
    ctx.quadraticCurveTo(midX, midY, toX, toY);
    ctx.stroke();

    // 命中点のフレア（脈動する二重光点）
    const flare = 1 + 0.35 * Math.sin(breathTime * 20 + bIdx * 3.1);
    ctx.fillStyle = "rgba(255, 160, 40, 0.45)";
    ctx.beginPath();
    ctx.arc(toX, toY, 6.5 * flare, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "rgba(255, 200, 80, 0.90)";
    ctx.beginPath();
    ctx.arc(toX, toY, 3.2 * flare, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "rgba(255, 255, 255, 0.90)";
    ctx.beginPath();
    ctx.arc(toX, toY, 1.4, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

function drawBoids() {
  // プリレンダスプライトのDPR（createDragonSprites で使ったものと一致させる）
  const spriteDpr     = Math.min(window.devicePixelRatio || 1, 2);
  const spritePx      = Math.ceil(DRAGON_SPRITE_LOGICAL * spriteDpr);
  const halfLogical   = DRAGON_SPRITE_LOGICAL / 2;
  // v0.6-p2: 現在の武器タイプに対応する属性スプライト＋パレット（全転換方式）
  const element       = WEAPON_ELEMENT[flockWeapon] ?? "fire";
  const sprites       = dragonSprites[element] ?? dragonSprites["fire"];
  const palette       = DRAGON_ELEMENT_COLORS[element] ?? DRAGON_ELEMENT_COLORS.fire;

  // スプライトがまだ生成されていない場合はフォールバック描画しない（ちらつき防止）
  if (!sprites || sprites.length === 0) return;

  // ---- 尻尾の緩和チェーン更新 ----
  // 先頭セグメントは現在の進行方向へ、後続は1つ前のセグメントへ、指数平滑で寄せる。
  // これにより尻尾は遅れて柔らかくしなる（生の履歴シフトのカクつきを排除）。
  // ヒットストップ中は vx/vy が凍結されるので尻尾はゆっくりまっすぐに落ち着く。
  for (let i = 0; i < N; i++) {
    if (boidDead[i] && boidFadeTimer[i] <= 0) continue;
    // 変更2: ダウン中でフェード完了かつ復帰フェードイン未開始は更新不要
    if (boidDowned[i] && boidFadeTimer[i] <= 0 && boidReviveTimer[i] <= 0) continue;
    const base = i * TAIL_SEGS;
    const head = Math.atan2(vy[i], vx[i]);
    boidAngleHistory[base] = easeAngle(boidAngleHistory[base], head, TAIL_EASE_HEAD);
    for (let s = 1; s < TAIL_SEGS; s++) {
      boidAngleHistory[base + s] = easeAngle(boidAngleHistory[base + s], boidAngleHistory[base + s - 1], TAIL_EASE_SEG);
    }
  }

  for (let i = 0; i < N; i++) {
    // dead かつフェード完了 → スキップ（従来通り）
    if (boidDead[i] && boidFadeTimer[i] <= 0) continue;
    // 変更2: ダウン中でフェードアウト完了（boidFadeTimer=0）かつ復帰フェードイン未開始 → 非表示
    if (boidDowned[i] && boidFadeTimer[i] <= 0 && boidReviveTimer[i] <= 0) continue;

    let alpha = 0.85;
    if (boidDowned[i] && boidFadeTimer[i] > 0) {
      // ダウン開始直後: フェードアウト
      alpha = (boidFadeTimer[i] / FADE_DURATION) * 0.85;
    } else if (boidReviveTimer[i] > 0) {
      // 復帰フェードイン: 0→0.85 へ
      alpha = (1.0 - boidReviveTimer[i] / BOID_REVIVE_DURATION) * 0.85;
    } else if (boidDead[i]) {
      // 従来の dead フェードアウト（ダウンモデル移行後はほぼ使われない）
      alpha = (boidFadeTimer[i] / FADE_DURATION) * 0.85;
    }

    const wx    = px[i], wy = py[i];
    const angle = Math.atan2(vy[i], vx[i]);

    // ---- 羽ばたきフレーム選択 ----
    // breathTime（毎フレーム dt 加算済み）に個体ごとの位相オフセットを加算
    // → 群れが一斉でなくバラバラに羽ばたく
    const phase     = breathTime * DRAGON_FLAP_SPEED + BOID_FLAP_PHASE[i] * Math.PI * 2;
    // sin を 0〜1 に正規化してフレームインデックスへ
    const tNorm     = (Math.sin(phase) * 0.5 + 0.5);
    const frameIdx  = Math.floor(tNorm * DRAGON_FLAP_FRAMES) % DRAGON_FLAP_FRAMES;
    const sprite    = sprites[frameIdx];

    // ---- 尻尾（動的描画）----
    // 進行方向後方に TAIL_SEGS セグメントをカーブさせる。
    // 各セグメントは「過去の角度履歴」を逆方向に使い、旋回に遅れて追従する。
    // 速度が速いほど角度差が小さくなりまっすぐ伸び、急旋回ほど大きくしなる。
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.lineCap     = "round";
    ctx.lineJoin    = "round";

    // 尻尾の根元：胴体後端（進行方向の逆側）。
    // fireは胴体・翼分離後の DRAGON_FIRE_BODY_PIVOT（重心）が描画原点。
    // 胴体後端（画像内ではごく短い尻尾スタブ）までの距離を実測で再計算した。
    // 実際にプリレンダされたcanvas（spritePx=52、flapFactor=1.0）をgetImageDataで
    // 解析すると、不透明ピクセルは重心から約10論理px止まりだった
    // （preview_evalでdragonSprites.fire[12]を実測して確認済み）。
    // 尻尾の根本が実際の見た目上の胴体終端と自然につながるよう、実測に合わせて採用。
    const TAIL_ROOT_OFFSET = 10;
    const tailRootOffX = -Math.cos(angle) * TAIL_ROOT_OFFSET;
    const tailRootOffY = -Math.sin(angle) * TAIL_ROOT_OFFSET;
    let segX = wx + tailRootOffX;
    let segY = wy + tailRootOffY;

    const base = i * TAIL_SEGS;
    // 速度の大きさで「尻尾のまっすぐ度」を調整（速いと旋回が少なくまっすぐ）
    const speed    = Math.sqrt(vx[i] * vx[i] + vy[i] * vy[i]);
    const maxSpeed = BASE_CFG.maxSpeed || 120;
    // speedRatio: 0（低速）〜1（最高速）。低速ほどしなりを強調
    const speedRatio = Math.min(1, speed / maxSpeed);
    // 時間ベースの微小揺れ（個体ごとに位相をずらす）
    const wobble = Math.sin(breathTime * 1.5 + BOID_FLAP_PHASE[i] * Math.PI * 2) * TAIL_WOBBLE;

    for (let s = 0; s < TAIL_SEGS; s++) {
      // s番目のセグメントは「s個前の角度履歴」の逆方向（後方）を使う
      // 旋回差：現在角度と履歴角度の差をセグメント方向に加える
      const histAngle  = boidAngleHistory[base + Math.min(s, TAIL_SEGS - 1)];
      // 旋回差を -π〜+π に正規化
      let   angleDiff  = histAngle - angle;
      while (angleDiff >  Math.PI) angleDiff -= Math.PI * 2;
      while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
      // しなり量：低速時に大きく、高速時に小さく。さらに時間揺れを足す
      const curl       = angleDiff * (1 - speedRatio * 0.6) + wobble * (1 - s / TAIL_SEGS);
      // セグメント方向：進行方向の逆 + 旋回差による横ずれ
      const segAngle   = angle + Math.PI + curl;
      const nextX      = segX + Math.cos(segAngle) * TAIL_SEG_LEN;
      const nextY      = segY + Math.sin(segAngle) * TAIL_SEG_LEN;

      // テーパリング：根元太く先細り
      const taper      = (1 - (s + 1) / (TAIL_SEGS + 1));
      const lineW      = Math.max(0.4, TAIL_WIDTH0 * taper);
      // 先端に向けて少し透明に
      const tailAlpha  = alpha * (0.75 + 0.25 * taper);

      ctx.globalAlpha  = tailAlpha;
      ctx.lineWidth    = lineW;
      ctx.strokeStyle  = palette.body;
      ctx.beginPath();
      ctx.moveTo(segX, segY);
      ctx.lineTo(nextX, nextY);
      ctx.stroke();

      segX = nextX;
      segY = nextY;
    }

    ctx.globalAlpha = 1.0;
    ctx.restore();

    // ---- drawImage（rotate→translate。毎フレームパスを引かない） ----
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(wx, wy);
    ctx.rotate(angle);
    // スプライト中心が竜の重心に来るよう -halfLogical オフセット
    ctx.drawImage(
      sprite,
      0, 0, spritePx, spritePx,             // ソース（物理px）
      -halfLogical, -halfLogical,             // デスト位置（論理px）
      DRAGON_SPRITE_LOGICAL, DRAGON_SPRITE_LOGICAL, // デストサイズ（論理px）
    );
    ctx.globalAlpha = 1.0;
    ctx.restore();

    // ---- HPバー（既存ロジックを維持。v0.6: 硬鱗カード分を含む実効最大HP基準） ----
    const boidMaxHpNow = effBoidMaxHp();
    if (!boidDead[i] && boidHp[i] < boidMaxHpNow) {
      const hpRatio = Math.max(0, boidHp[i] / boidMaxHpNow);
      const barW = 14;
      ctx.fillStyle = "rgba(0,0,0,0.5)";
      ctx.fillRect(wx - barW / 2, wy - 18, barW, 3);
      ctx.fillStyle = hpRatio > 0.5 ? "#4adf80" : "#f0604a";
      ctx.fillRect(wx - barW / 2, wy - 18, barW * hpRatio, 3);
    }
  }
}

/**
 * 変更3: 投射物を「カタパルトの大きな矢（ボルト）」として描画する。
 * 進行方向へ向いた太めのシャフト + 先端の三角鏃 + 末尾の小さな矢羽根（フレッチング）。
 * 進行方向は速度ベクトル (projVx, projVy) から算出してキャンバスを回転させる。
 * 色は既存の projColor を流用してステージ別テーマを維持する。
 */
function drawProjectiles() {
  // 変更5: 種別ごとのサイズ定数（論理px）
  // catapult: 従来の大きな矢サイズを維持（存在感のある重厚な矢）
  const CATAPULT_SHAFT_LEN     = 18;
  const CATAPULT_SHAFT_WIDTH   = 2.8;
  const CATAPULT_HEAD_LEN      = 7;
  const CATAPULT_HEAD_HALF_W   = 3.5;
  const CATAPULT_FLETCH_LEN    = 5;
  const CATAPULT_FLETCH_HALF_W = 2.8;

  // arrow: カタパルトより一回り小さい矢（細く短く、多数が飛ぶ印象）
  const ARROW_SHAFT_LEN     = 12;
  const ARROW_SHAFT_WIDTH   = 1.6;
  const ARROW_HEAD_LEN      = 4;
  const ARROW_HEAD_HALF_W   = 2.2;
  const ARROW_FLETCH_LEN    = 3;
  const ARROW_FLETCH_HALF_W = 1.8;

  for (let i = 0; i < MAX_PROJECTILES; i++) {
    if (!projActive[i]) continue;

    // カメラ変換（スケール込み）でスクリーン座標を計算してカリング
    const sx = (projWx[i] - cam.x) * cam.scale + viewW * 0.5;
    const sy = (projWy[i] - cam.y) * cam.scale + viewH * 0.5;
    if (sx < -40 || sx > viewW + 40 || sy < -40 || sy > viewH + 40) continue;

    // 進行方向（速度ベクトルから算出）
    const angle = Math.atan2(projVy[i], projVx[i]);
    const color = projColor[i];

    // v0.7: ボス重弾（kind=2）は矢でなく脈動する光弾として描く（明確な脅威表示）
    if (projKind[i] === 2) {
      const pulse = 0.85 + 0.15 * Math.sin(breathTime * 14 + i * 1.3);
      ctx.save();
      ctx.globalAlpha = 0.35 * pulse;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(projWx[i], projWy[i], 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 0.95;
      ctx.beginPath();
      ctx.arc(projWx[i], projWy[i], 4.5 * pulse, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.9)";
      ctx.beginPath();
      ctx.arc(projWx[i], projWy[i], 1.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      continue;
    }

    // 変更5: 種別ごとにサイズを選択
    const isCatapult  = projKind[i] === 1;
    const SHAFT_LEN     = isCatapult ? CATAPULT_SHAFT_LEN     : ARROW_SHAFT_LEN;
    const SHAFT_WIDTH   = isCatapult ? CATAPULT_SHAFT_WIDTH   : ARROW_SHAFT_WIDTH;
    const HEAD_LEN      = isCatapult ? CATAPULT_HEAD_LEN      : ARROW_HEAD_LEN;
    const HEAD_HALF_W   = isCatapult ? CATAPULT_HEAD_HALF_W   : ARROW_HEAD_HALF_W;
    const FLETCH_LEN    = isCatapult ? CATAPULT_FLETCH_LEN    : ARROW_FLETCH_LEN;
    const FLETCH_HALF_W = isCatapult ? CATAPULT_FLETCH_HALF_W : ARROW_FLETCH_HALF_W;

    ctx.save();
    // 矢の中心（弾頭先端の少し手前）をワールド座標の現在位置に合わせて配置
    ctx.translate(projWx[i], projWy[i]);
    ctx.rotate(angle);

    // --- シャフト（矢柄）: 後端 (-SHAFT_LEN) → 0 ---
    ctx.strokeStyle = color;
    ctx.lineWidth   = SHAFT_WIDTH;
    ctx.lineCap     = "round";
    ctx.beginPath();
    ctx.moveTo(-SHAFT_LEN, 0);
    ctx.lineTo(0, 0);
    ctx.stroke();

    // --- 鏃（やじり）: 三角形、先端が +HEAD_LEN の位置 ---
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(HEAD_LEN, 0);
    ctx.lineTo(0, -HEAD_HALF_W);
    ctx.lineTo(0,  HEAD_HALF_W);
    ctx.closePath();
    ctx.fill();

    // 鏃に白いハイライト（輝き感）
    ctx.strokeStyle = "rgba(255,255,255,0.55)";
    ctx.lineWidth   = isCatapult ? 0.8 : 0.5;
    ctx.beginPath();
    ctx.moveTo(HEAD_LEN, 0);
    ctx.lineTo(0, -HEAD_HALF_W);
    ctx.stroke();

    // --- フレッチング（矢羽根）: 末尾に小さなV字 ---
    ctx.strokeStyle = color;
    ctx.lineWidth   = isCatapult ? 1.4 : 1.0;
    ctx.globalAlpha = 0.80;
    ctx.beginPath();
    ctx.moveTo(-SHAFT_LEN + FLETCH_LEN, 0);
    ctx.lineTo(-SHAFT_LEN, -FLETCH_HALF_W);
    ctx.moveTo(-SHAFT_LEN + FLETCH_LEN, 0);
    ctx.lineTo(-SHAFT_LEN, FLETCH_HALF_W);
    ctx.stroke();
    ctx.globalAlpha = 1.0;

    ctx.restore();
  }
}

function drawParticles() {
  ctx.save();
  for (let i = 0; i < MAX_PARTICLES; i++) {
    if (!partActive[i]) continue;
    if (partType[i] === 1) {
      // 出現エフェクト火花: 金〜白〜薄橙。寿命が長いので基準を0.55秒にする
      const lifeRatio = Math.max(0, partLife[i] / 0.55);
      const alpha  = Math.max(0, lifeRatio * lifeRatio); // 後半で急速フェード
      // 輝く白→金→薄橙へ変化（序盤は白っぽく、末期は橙）
      const g = (200 + (55 * lifeRatio)) | 0; // 200→255（白寄り→金）
      const radius = Math.max(0.5, 1.0 + lifeRatio * 3.5); // 最大4.5px
      ctx.fillStyle = `rgba(255, ${g}, ${(80 * (1 - lifeRatio)) | 0}, ${alpha.toFixed(3)})`;
      ctx.beginPath();
      ctx.arc(partX[i], partY[i], radius, 0, Math.PI * 2);
      ctx.fill();
    } else if (partType[i] === 3) {
      // v0.8 緋竜の斬撃火花: 深紅→白熱のスパーク（大きめ・速い）
      const lifeRatio = Math.max(0, partLife[i] / 0.35);
      const alpha = Math.max(0, lifeRatio);
      const g = (40 + 180 * lifeRatio) | 0;   // 白熱（若いほど白い）→深紅へ
      const radius = Math.max(0.5, 1.2 + lifeRatio * 3.0);
      ctx.fillStyle = `rgba(255, ${g}, ${(30 * lifeRatio) | 0}, ${alpha.toFixed(3)})`;
      ctx.beginPath();
      ctx.arc(partX[i], partY[i], radius, 0, Math.PI * 2);
      ctx.fill();
    } else if (partType[i] === 2) {
      // 死亡FX: 灰〜暗赤。出現FX(金)とは明確に色を分ける
      const lifeRatio = Math.max(0, partLife[i] / 0.35);
      const alpha  = Math.max(0, lifeRatio * lifeRatio);
      // 序盤は暗赤(r=180,g=40,b=40)、末期は灰(r=120,g=120,b=120)へ変化
      const r = (120 + (60 * lifeRatio)) | 0;
      const g = (40  + (80 * (1 - lifeRatio))) | 0;
      const b = (40  + (80 * (1 - lifeRatio))) | 0;
      const radius = Math.max(0.5, 0.8 + lifeRatio * 2.2); // 小さめ
      ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha.toFixed(3)})`;
      ctx.beginPath();
      ctx.arc(partX[i], partY[i], radius, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // ブレスパーティクル: 火花色（橙〜赤）
      const lifeRatio = partLife[i] / 0.30;
      const alpha = Math.max(0, lifeRatio);
      const radius = 1.5 + lifeRatio * 2;
      ctx.fillStyle = `rgba(255, ${(180 * lifeRatio) | 0}, 40, ${alpha.toFixed(3)})`;
      ctx.beginPath();
      ctx.arc(partX[i], partY[i], radius, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();
}

function drawEggs() {
  ctx.save();
  for (let e = 0; e < MAX_EGGS; e++) {
    if (!eggActive[e]) continue;
    ctx.fillStyle = "rgba(255, 200, 40, 0.90)";
    ctx.strokeStyle = "rgba(255, 240, 120, 0.60)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(eggWx[e], eggWy[e], 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  }
  ctx.restore();
}

function drawTrail(now) {
  if (trailPoints.length < 2) return;
  const cutoff = now - TRAIL_LIFETIME * 1000;
  while (trailPoints.length > 0 && trailPoints[0].bornAt < cutoff) {
    trailPoints.shift();
  }
  if (trailPoints.length < 2) return;

  for (let i = 1; i < trailPoints.length; i++) {
    const p    = trailPoints[i];
    const prev = trailPoints[i - 1];
    const ageRatio = (now - p.bornAt) / (TRAIL_LIFETIME * 1000);
    const alpha    = Math.max(0, 1 - ageRatio) * 0.35;
    ctx.strokeStyle = `rgba(140, 200, 255, ${alpha.toFixed(3)})`;
    ctx.lineWidth   = 2.5;
    ctx.lineCap     = "round";
    ctx.beginPath();
    ctx.moveTo(prev.x, prev.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  }
}

function drawTouchRing() {
  if (!touchRing.active) return;
  ctx.strokeStyle = "rgba(200, 230, 255, 0.30)";
  ctx.lineWidth   = 1.5;
  ctx.beginPath();
  ctx.arc(touchRing.x, touchRing.y, 20, 0, Math.PI * 2);
  ctx.stroke();
}

function drawFlash() {
  if (flashTimer <= 0) return;
  ctx.fillStyle = flashColor;
  ctx.fillRect(0, 0, viewW, viewH);
}

// -----------------------------------------------------------------
// ミニマップ描画
// -----------------------------------------------------------------
const MINIMAP_W = 80;
const MINIMAP_H = 60;

// v0.6-p4: 建物ドットは静的なのでオフスクリーンにキャッシュする。
// 建物数が約2倍（1500〜1900棟）になり、毎フレーム全棟の arc/fill を
// 描くとミニマップだけで数msかかるため。陥落・ステージ遷移時のみ再構築。
let minimapBaseCanvas = null;
let minimapBaseCtx    = null;
let minimapBaseDirty  = true;

function rebuildMinimapBase() {
  if (!minimapBaseCanvas) {
    minimapBaseCanvas = document.createElement("canvas");
    minimapBaseCanvas.width  = MINIMAP_W;
    minimapBaseCanvas.height = MINIMAP_H;
    minimapBaseCtx = minimapBaseCanvas.getContext("2d");
  }
  const minimapCtx = minimapBaseCtx;
  const stageConfig = STAGE_CONFIGS[currentStage];
  minimapCtx.fillStyle = stageConfig.bgColor;
  minimapCtx.fillRect(0, 0, MINIMAP_W, MINIMAP_H);

  const scaleX = MINIMAP_W / WORLD_W;
  const scaleY = MINIMAP_H / WORLD_H;

  for (let s = 0; s < settlements.length; s++) {
    const settlement = settlements[s];
    const mx = settlement.wx * scaleX;
    const my = settlement.wy * scaleY;

    if (settlement.isBoss) {
      // ボス集落: 目立つ大きなダイヤモンドマーカー（陥落後は暗く）
      const bossR = settlement.fallen ? 3 : 5;
      const glowColor = settlement._bossGlowColor ?? settlement.color;
      if (!settlement.fallen) {
        // 外グロー
        minimapCtx.fillStyle = glowColor;
        minimapCtx.globalAlpha = 0.35;
        minimapCtx.beginPath();
        minimapCtx.arc(mx, my, bossR * 2.0, 0, Math.PI * 2);
        minimapCtx.fill();
        minimapCtx.globalAlpha = 1.0;
      }
      // ダイヤモンド（回転した正方形）
      minimapCtx.fillStyle = settlement.fallen ? "#333" : glowColor;
      minimapCtx.beginPath();
      minimapCtx.moveTo(mx,         my - bossR);
      minimapCtx.lineTo(mx + bossR, my);
      minimapCtx.lineTo(mx,         my + bossR);
      minimapCtx.lineTo(mx - bossR, my);
      minimapCtx.closePath();
      minimapCtx.fill();
      // 輪郭
      if (!settlement.fallen) {
        minimapCtx.strokeStyle = "#ffffff";
        minimapCtx.lineWidth   = 0.8;
        minimapCtx.stroke();
      }
    } else {
      // 通常建物
      const dotR = settlement.size === "large" ? 3 : (settlement.size === "medium" ? 2 : (settlement.size === "tiny" ? 1.0 : 1.5));
      minimapCtx.fillStyle = settlement.fallen ? "#333" : settlement.color;
      minimapCtx.beginPath();
      minimapCtx.arc(mx, my, dotR, 0, Math.PI * 2);
      minimapCtx.fill();
    }
  }

  minimapBaseDirty = false;
}

function drawMinimap() {
  if (minimapBaseDirty || !minimapBaseCanvas) rebuildMinimapBase();
  minimapCtx.drawImage(minimapBaseCanvas, 0, 0);

  const scaleX = MINIMAP_W / WORLD_W;
  const scaleY = MINIMAP_H / WORLD_H;

  // v0.6-p4: 移動敵（専用色・白リング付きで建物と区別）
  for (const m of movers) {
    if (!m.alive) continue;
    const mmx = m.wx * scaleX;
    const mmy = m.wy * scaleY;
    minimapCtx.fillStyle = m.def.glowColor;
    minimapCtx.beginPath();
    minimapCtx.arc(mmx, mmy, 2.2, 0, Math.PI * 2);
    minimapCtx.fill();
    minimapCtx.strokeStyle = "rgba(255,255,255,0.85)";
    minimapCtx.lineWidth = 0.6;
    minimapCtx.stroke();
  }

  const centroid = calcFriendlyCentroid();
  const mx = centroid.x * scaleX;
  const my = centroid.y * scaleY;
  minimapCtx.fillStyle = "rgba(255,255,255,0.9)";
  minimapCtx.beginPath();
  minimapCtx.arc(mx, my, 2, 0, Math.PI * 2);
  minimapCtx.fill();

  // ズームスケールを考慮した視野矩形: cam.scale が小さいほど広い範囲が見える
  const vpWorldW  = viewW / cam.scale;
  const vpWorldH  = viewH / cam.scale;
  const vpLeft    = (cam.x - vpWorldW * 0.5) * scaleX;
  const vpTop     = (cam.y - vpWorldH * 0.5) * scaleY;
  const vpWidth   = vpWorldW * scaleX;
  const vpHeight  = vpWorldH * scaleY;
  minimapCtx.strokeStyle = "rgba(120,200,255,0.25)";
  minimapCtx.lineWidth   = 0.5;
  minimapCtx.strokeRect(vpLeft, vpTop, vpWidth, vpHeight);
}

function updateHUDBuildings() {
  // 変更3: ボスHPをメインで表示し、小集落の残数を括弧で添える。
  // ボスが陥落済みならクリア状態なので "CLEARED" を表示する。
  const boss = settlements.find(s => s.isBoss);
  // v0.6-p3: 城壁は「残建物」に数えない（掃討対象ではなく攻略の障害物のため）
  const smallRemaining = settlements.filter(s => !s.isBoss && !s._isWall && !s.fallen).length;
  const smallTotal     = settlements.filter(s => !s.isBoss && !s._isWall).length;

  if (!boss) {

let fpsFrames = 0;
let fpsLast   = performance.now();
let fpsEma    = 0;
const hudFps  = document.getElementById("h-fps");

function tickFps(now) {
  fpsFrames++;
  const elapsed = now - fpsLast;
  if (elapsed >= 500) {
    const fps  = (fpsFrames * 1000) / elapsed;
    fpsEma     = fpsEma === 0 ? fps : fpsEma * 0.7 + fps * 0.3;
    fpsFrames  = 0;
    fpsLast    = now;
    hudFps.textContent = fps.toFixed(1);
  }
}

// 個体ごとの羽ばたき位相オフセット（index で決定的に割り当て）
// 0〜1 の値 × 2π がラジアン位相
const BOID_FLAP_PHASE = new Float32Array(MAX_BOIDS); // MAX_BOIDS=100
for (let i = 0; i < MAX_BOIDS; i++) {
  // 黄金角分割でなるべく均等に散らす
  BOID_FLAP_PHASE[i] = (i * 0.618033988) % 1.0;
}

// -----------------------------------------------------------------
// 尻尾：動的描画パラメータ
// -----------------------------------------------------------------
// 各boidの過去の進行角度を保持するリングバッファ
// TAIL_SEGS セグメント分の角度を記録し、旋回に追従した「鞭のしなり」を実現する。
// MAX_BOIDS=20、TAIL_SEGS=5 → 100要素のFloat32Array（≈400Bytes）
const TAIL_SEGS     = 5;    // 尻尾セグメント数（多いほど滑らかだがコスト増）
const TAIL_SEG_LEN  = 4.5;  // 1セグメントの長さ（論理px）
const TAIL_WIDTH0   = 2.2;  // 根元の線幅（px）
const TAIL_WOBBLE   = 0.07; // 時間ベースの微小揺れ振幅（ラジアン）。過剰にならない値
// 尻尾は「緩和チェーン」で柔らかく追従させる。各フレーム、先頭は現在の進行方向へ、
// 後続セグメントは1つ前のセグメントへ、指数平滑で少しずつ寄っていく（バネ/鞭のしなり）。
// 係数が小さいほど遅れて柔らかくしなる。生の履歴をそのまま使うとカクつくため平滑化する。
const TAIL_EASE_HEAD = 0.18; // 先頭セグメントが現在の進行方向へ寄る速さ
const TAIL_EASE_SEG  = 0.16; // 後続セグメントが前セグメントへ寄る速さ
// boidAngleHistory[i * TAIL_SEGS + s] = 平滑化された各セグメントの向き
// s=0 が先頭（頭に近い）、s=TAIL_SEGS-1 が尾の先端
let boidAngleHistory; // initBoids() で確保

// 角度を最短回り（±π境界をまたがない）で target へ k だけ寄せる
function easeAngle(cur, target, k) {
  let d = target - cur;
  while (d >  Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return cur + d * k;
}

/**
 * fire属性専用: 胴体（固定サイズ）+ 翼（左右、flapFactorで羽ばたき）を合成描画する。
 * 胴体まで一緒に伸縮すると「蝶々がペラペラ開閉している」ように見えてしまうため、
 * 胴体は常に固定サイズで描き、羽ばたきのscaleは翼にのみ適用する。
 * @param {number} flapFactor  翼スパン軸の縮小係数（常に正、0.13〜1.0）
 * @param {number} half  オフスクリーンcanvas半分のサイズ（物理px）
 * @param {number} scale  論理px→物理pxのスケール
 * @param {CanvasRenderingContext2D} c
 */
function drawFireDragonBodyAndWings(flapFactor, half, scale, c) {
  const bodyImg = dragonFireImages.body;
  const wingImg = dragonFireImages.wing;

  const bodyPivot = DRAGON_FIRE_BODY_PIVOT;
  const bodyDrawH = DRAGON_FIRE_BODY_DRAW_H;
  const bodyDrawW = bodyDrawH * (bodyImg.naturalWidth / bodyImg.naturalHeight);
  // 胴体の論理スケール（元画像px → 描画px）。肩オフセットの換算にも使う。
  const kxBody = bodyDrawW / bodyPivot.w;
  const kyBody = bodyDrawH / bodyPivot.h;
  const bodyPivotX = bodyPivot.cx * kxBody;
  const bodyPivotY = bodyPivot.cy * kyBody;

  const wingDrawW = DRAGON_FIRE_WING_DRAW_W;
  const wingDrawH = wingDrawW * (wingImg.naturalHeight / wingImg.naturalWidth);
  const wingAnchor = DRAGON_FIRE_WING_ANCHOR;
  const wingRootX = wingAnchor.x * (wingDrawW / wingImg.naturalWidth);
  const wingRootY = wingAnchor.y * (wingDrawH / wingImg.naturalHeight);

  // 肩の元画像座標を、胴体ピボットと同じ回転後ローカル座標系に変換する。
  // （回転後の座標系では「前後方向」がlocalX、「左右方向」がlocalYになる。
  //  導出はTDD参照。preview_evalで実測検証済み。）
  function shoulderLocal(rawX, rawY) {
    const localY = kxBody * (rawX - bodyPivot.cx);
    const localX = -kyBody * (rawY - bodyPivot.cy);
    return { localX, localY };
  }
  const leftShoulder  = shoulderLocal(DRAGON_FIRE_SHOULDER.left.x,  DRAGON_FIRE_SHOULDER.left.y);
  const rightShoulder = shoulderLocal(DRAGON_FIRE_SHOULDER.right.x, DRAGON_FIRE_SHOULDER.right.y);

  // ---- 胴体（固定サイズ・flapFactorのscaleを適用しない）----
  c.drawImage(bodyImg, -bodyPivotX, -bodyPivotY, bodyDrawW, bodyDrawH);

  // ---- 左翼: 肩に付け根(root)を合わせ、翼のスパン軸（画像ローカルX）にのみflapFactorを適用 ----
  c.save();
  c.translate(leftShoulder.localY, -leftShoulder.localX);
  c.scale(flapFactor, 1);
  c.drawImage(wingImg, -wingRootX, -wingRootY, wingDrawW, wingDrawH);
  c.restore();

  // ---- 右翼: 左翼と左右対称の同一画像を水平反転して使う ----
  c.save();
  c.translate(rightShoulder.localY, -rightShoulder.localX);
  c.scale(-flapFactor, 1);
  c.drawImage(wingImg, -wingRootX, -wingRootY, wingDrawW, wingDrawH);
  c.restore();
}

/**
 * 竜シルエットを1フレーム分オフスクリーンcanvasに描画して返す。
 * ラスター画像（assets/dragon_*.png）が読み込めている場合はそれを使い、
 * 失敗している場合のみ旧ベクター描画（renderDragonFrameVector）へフォールバックする。
 * fireのみ胴体・翼分離方式（drawFireDragonBodyAndWings）、ice/shadowは従来の
 * 一体画像＋whole-image scale方式のまま変更しない。
 * @param {string} element  "fire" | "ice" | "shadow"
 * @param {number} wingAngle  翼の上下角度（ラジアン）。0=水平、+はたたんだ方向
 * @param {number} spritePx  canvas物理解像度（= 論理サイズ × DPR）
 * @returns {HTMLCanvasElement}
 */
function renderDragonFrame(element, wingAngle, spritePx) {
  // v0.6-p2: crimson（緋竜）は fire の胴体・翼画像を赤強調ティントで流用する
  const isCrimson = element === "crimson";
  const isFire = element === "fire" || isCrimson;
  const img = isFire ? dragonFireImages.body : dragonImages[element];
  const wingImgReady = isFire ? dragonFireImages.wing : true;
  if (!dragonImagesLoaded || !img || !wingImgReady) {
    return renderDragonFrameVector(element, wingAngle, spritePx);
  }

  const oc = document.createElement("canvas");
  oc.width  = spritePx;
  oc.height = spritePx;
  const c = oc.getContext("2d");

  const half  = spritePx / 2;
  // 論理サイズ→物理ピクセルへのスケール
  const scale = spritePx / DRAGON_SPRITE_LOGICAL;

  // wingAngle（0=水平最大展開 〜 π*0.65=最大羽ばたみ）から羽ばたき係数を算出。
  // 常に正の値（0.13〜1.0）になるため、羽ばたんでも潰れて反転することはない。
  const flapFactor = 0.4 + 0.6 * Math.cos(wingAngle);

  c.save();
  c.translate(half, half);
  c.scale(scale, scale);
  // 画像は「鼻先が画像の上方向（-Y）」を向いているため、まず+X（ゲーム内の進行方向規約）へ回頭する。
  c.rotate(Math.PI / 2);

  if (isFire) {
    // fire: 胴体固定 + 翼のみ羽ばたき（胴体まで伸縮する「蝶々開閉」を防ぐため）
    drawFireDragonBodyAndWings(flapFactor, half, scale, c);
  } else {
    // ice/shadow: 従来通り、全身画像に flapFactor の scale をまとめて適用（変更しない）
    // 翼スパン（画像の横幅）を DRAGON_TARGET_WINGSPAN 論理pxに正規化し、
    // 縦は元画像のアスペクト比を保って算出する（属性ごとに縦が異なる＝仕様）。
    const drawW = DRAGON_TARGET_WINGSPAN;
    const drawH = DRAGON_TARGET_WINGSPAN * (img.naturalHeight / img.naturalWidth);

    // 画像中心(w/2,h/2)は視覚的重心と一致しないため、質量重心(DRAGON_SPRITE_PIVOTS)を
    // 描画原点に使う。drawW/drawHへの縮小スケールと同じ比率で重心座標も換算する。
    const pivot = DRAGON_SPRITE_PIVOTS[element] ?? DRAGON_SPRITE_PIVOTS.ice;
    const pivotScaleX = drawW / pivot.w;
    const pivotScaleY = drawH / pivot.h;
    const pivotX = pivot.cx * pivotScaleX;
    const pivotY = pivot.cy * pivotScaleY;

    // 画像自身のX軸（翼スパン方向）をflapFactorで縮小してから描画する
    // （rotateは既に上で適用済み。逆順だと翼スパン軸がずれる）。
    c.scale(flapFactor, 1);
    c.drawImage(img, -pivotX, -pivotY, drawW, drawH);
  }

  c.restore();

  // v0.6-p2: crimson は描画済みピクセルにのみ赤を重ねて高彩度化する
  // （source-atop は透明部を汚さないため輪郭はそのまま保たれる）
  if (isCrimson) {
    c.save();
    c.globalCompositeOperation = "source-atop";
    c.fillStyle = "rgba(255, 30, 20, 0.45)";
    c.fillRect(0, 0, spritePx, spritePx);
    c.restore();
  }

  return oc;
}

/**
 * 竜シルエットのベクター描画版（旧実装）。
 * ラスター画像のロードに失敗した場合のフォールバックとして残す。
 * @param {string} element  "fire" | "ice" | "shadow"
 * @param {number} wingAngle  翼の上下角度（ラジアン）。0=水平、+はたたんだ方向
 * @param {number} spritePx  canvas物理解像度（= 論理サイズ × DPR）
 * @returns {HTMLCanvasElement}
 */
function renderDragonFrameVector(element, wingAngle, spritePx) {
  const oc = document.createElement("canvas");
  oc.width  = spritePx;
  oc.height = spritePx;
  const c = oc.getContext("2d");

  const palette = DRAGON_ELEMENT_COLORS[element] ?? DRAGON_ELEMENT_COLORS.fire;
  const half    = spritePx / 2;
  // 論理サイズ→物理ピクセルへのスケール
  const scale   = spritePx / DRAGON_SPRITE_LOGICAL;

  c.save();
  c.translate(half, half);
  c.scale(scale, scale);

  // --- 全体を半透明に --- globalAlpha でなく fillStyle/strokeStyle に埋め込む
  // 死亡フェードは drawBoids 側で globalAlpha を設定するためここでは 1.0 で焼く

  // ---- 翼（左右対称。wingAngle で上下に開閉） ----
  // 翼の付け根は胴体中央よりやや前 (x=3)。
  // wingAngle が 0 = 水平（最大展開）、π*0.65 に近づく = たたんだ状態。
  const wBase = 3;   // 付け根 x
  const wOpen = 19;  // 水平展開時の Y 振れ幅（翼を大きく＝厚みアップ）
  const yOffset = Math.cos(wingAngle) * wOpen;  // 正=下方向

  // 上翼（sign=+1 で Y が上=負方向）
  drawWing(c, wBase, 0, -yOffset, palette);
  // 下翼（sign=-1 で Y が下=正方向）
  drawWing(c, wBase, 0,  yOffset, palette);

  // ---- 胴体（細長い楕円形、角張り翼に馴染む細身） ----
  // 注意: 尻尾は毎フレーム drawBoids() で動的描画するためここでは焼かない
  // +X が頭方向。胴体は x=-5〜+11 の範囲、中心y=0
  c.beginPath();
  c.ellipse(3, 0, 9, 2.8, 0, 0, Math.PI * 2);
  const bodyGrad = c.createRadialGradient(4, -1, 0.5, 3, 0, 9);
  bodyGrad.addColorStop(0.0, palette.body);
  bodyGrad.addColorStop(1.0, palette.rim);
  c.fillStyle = bodyGrad;
  c.fill();

  // ---- 頭部（+X 方向。細い首 → 菱形ベース → 尖ったマズル） ----
  // 全体が x=10〜16 の範囲に収まる。幅は ±3.5 程度。
  // トップビューの竜頭：後頭部が広く前方に向けて先細りするひし形シルエット。
  // 首（胴体前端 x≈9 から頭の後端 x≈14 まで伸ばす。細長くして首を長く見せる）
  c.beginPath();
  c.moveTo(9.0, -1.9);
  c.lineTo(14.0, -1.5);
  c.lineTo(14.0,  1.5);
  c.lineTo(9.0,  1.9);
  c.closePath();
  c.fillStyle = palette.body;
  c.fill();

  // 頭（首の先 x=14 から前方へ。元より +3 前進させて首を長く見せる）
  c.beginPath();
  // 首の接続点（頭の後端）
  c.moveTo(14,  1.8);   // 右首付け根
  c.lineTo(14, -1.8);   // 左首付け根
  // 後頭部の広がり（左右に張り出す）
  c.lineTo(15, -3.2);
  // 頭頂（最も広い部分）
  c.lineTo(16, -3.5);
  // こめかみ〜マズルへの先細り
  c.lineTo(18, -1.8);
  // マズル先端（鼻先）
  c.lineTo(19,  0.0);
  c.lineTo(18,  1.8);
  c.lineTo(16,  3.5);
  c.lineTo(15,  3.2);
  c.closePath();
  c.fillStyle = palette.body;
  c.fill();

  // 頭部の輪郭を少し締める（存在感強化）
  c.strokeStyle = palette.wing;
  c.lineWidth   = 0.8;
  c.globalAlpha = 0.7;
  c.stroke();
  c.globalAlpha = 1.0;

  // ---- ツノ（後頭部から後方斜めに伸びる1対） ----
  // +X が進行方向なのでツノは -X 方向（後ろ）に伸びる。
  // 上ツノ（頭の前進に合わせて +3）
  c.beginPath();
  c.moveTo(15, -3.0);   // ツノの付け根（後頭部）
  c.lineTo(12, -6.5);   // ツノの先端（後方かつ外側）
  c.lineTo(14, -3.8);   // ツノの腹側
  c.closePath();
  c.fillStyle = palette.wing;
  c.globalAlpha = 0.85;
  c.fill();
  c.globalAlpha = 1.0;

  // 下ツノ
  c.beginPath();
  c.moveTo(15,  3.0);
  c.lineTo(12,  6.5);
  c.lineTo(14,  3.8);
  c.closePath();
  c.fillStyle = palette.wing;
  c.globalAlpha = 0.85;
  c.fill();
  c.globalAlpha = 1.0;

  c.restore();
  return oc;
}

/**
 * 角張った膜翼を1枚描画するヘルパー。
 * ドラゴンスピリット系のトップビュー飛竜翼を模した lineTo ポリゴン。
 *
 * 翼の構成（全 lineTo：quadraticCurveTo なし）:
 *   付け根(bx,by) → 前縁先端（斜め前＋外側）→ 翼先端（尖り角）
 *   → 後縁スカラップ1 → スカラップ2 → 後縁付け根
 *
 * wingTipY の符号で上翼/下翼を切り替える（上翼は負、下翼は正）。
 *
 * @param {CanvasRenderingContext2D} c
 * @param {number} bx         翼の付け根 x（胴体上の接続点）
 * @param {number} by         翼の付け根 y（通常 0）
 * @param {number} wingTipY   翼先端の Y 座標（wingAngle=0 で ±wOpen、たたむと 0 に近づく）
 * @param {Object} palette
 */
function drawWing(c, bx, _by, wingTipY, palette) {
  // sign: +1=下翼（Y正）、-1=上翼（Y負）
  const sign = wingTipY >= 0 ? 1 : -1;
  // 翼の絶対Y振れ（0〜wOpen）
  const yAbs = Math.abs(wingTipY);

  // ---------------------------------------------------------------
  // トップビュー飛竜翼の頂点レイアウト（+X=頭方向）
  //
  //  胴体方向(+X) ←→ 尾方向(-X)
  //
  //  frontRoot ─── lead              ← 前縁（シャープな直線エッジ）
  //      |                    \
  //    rearRoot        tip(翼先端・最外縁)
  //      ↑   \              /
  //   後縁付け根  sc1Out ── sc1In     ← スカラップ（指の骨）
  //              sc2Out ── sc2In
  //
  // 前縁は「前肩(lead)が胴体よりも前(+X)に出る」ことで
  // 矢じり形の後退翼シルエットを作る。
  // ---------------------------------------------------------------

  // 前縁の付け根（胴体の前寄りに接続）— 根元を厚めに
  const frontRootX = bx + 4;
  const frontRootY = sign * 1.7;

  // 前縁の「肩」: 胴体よりさらに前(+X)に張り出し、外側(Y)にも出る
  // ここが前縁の最も前方の点 → 直線エッジの鋭角感を作る。肩を高くして前縁を肉厚に
  const leadX = bx + 7;
  const leadY = sign * (yAbs * 0.60);

  // 翼先端（最も外側・後退角で後方へ。さらに後ろへ引いて翼を大きく＝厚みアップ）
  const tipX = bx - 7;
  const tipY = sign * yAbs;

  // 後縁スカラップ1: 翼先端から後縁を辿る最初の「指の骨」突起
  // 谷(InY)を浅くして膜を肉厚に見せる
  const sc1OutX = bx - 2;
  const sc1OutY = sign * (yAbs * 0.84);
  const sc1InX  = bx + 1.5;
  const sc1InY  = sign * (yAbs * 0.66);

  // 後縁スカラップ2: 中間の突起（谷を浅く）
  const sc2OutX = bx + 4;
  const sc2OutY = sign * (yAbs * 0.50);
  const sc2InX  = bx + 6;
  const sc2InY  = sign * (yAbs * 0.34);

  // 後縁の付け根（胴体の後方寄りに接続。後方へ引いてコード＝前後幅を増やす）
  const rearRootX = bx - 4;
  const rearRootY = sign * 1.9;

  // ----- パス描画（全 lineTo：曲線なし） -----
  c.beginPath();
  c.moveTo(frontRootX, frontRootY);  // 前縁付け根
  c.lineTo(leadX,      leadY);       // 前縁の肩（前方に突き出る）
  c.lineTo(tipX,       tipY);        // 翼先端（尖り角）
  c.lineTo(sc1OutX,    sc1OutY);     // スカラップ1 突起
  c.lineTo(sc1InX,     sc1InY);      // スカラップ1 谷
  c.lineTo(sc2OutX,    sc2OutY);     // スカラップ2 突起
  c.lineTo(sc2InX,     sc2InY);      // スカラップ2 谷
  c.lineTo(rearRootX,  rearRootY);   // 後縁付け根
  c.closePath();

  // グラデーション: 付け根 body色 → 先端 rim色（透明）
  const grd = c.createLinearGradient(frontRootX, frontRootY, tipX, tipY);
  grd.addColorStop(0.0,  palette.body);
  grd.addColorStop(0.55, palette.wing);
  grd.addColorStop(1.0,  palette.rim);
  c.fillStyle = grd;
  c.fill();

  // 前縁ライン強調（付け根 → 肩 → 翼先端）: 直線エッジの存在感を出す
  c.beginPath();
  c.moveTo(frontRootX, frontRootY);
  c.lineTo(leadX,      leadY);
  c.lineTo(tipX,       tipY);
  c.strokeStyle = palette.wing;
  c.lineWidth   = 0.9;
  c.globalAlpha = 0.65;
  c.stroke();
  c.globalAlpha = 1.0;
}

/**
 * 起動時に全属性・全フレームのスプライトをプリレンダして dragonSprites に格納する。
 * 呼び出し後は毎フレームの drawBoids で drawImage するだけでよい。
 */
function createDragonSprites() {
  const spriteDpr  = Math.min(window.devicePixelRatio || 1, 2);
  const spritePx   = Math.ceil(DRAGON_SPRITE_LOGICAL * spriteDpr);

  for (const element of Object.keys(DRAGON_ELEMENT_COLORS)) {
    dragonSprites[element] = [];
    for (let f = 0; f < DRAGON_FLAP_FRAMES; f++) {
      // 羽ばたきの位相: 0〜2π を FLAP_FRAMES 分割
      // wingAngle: 0=水平（最大展開）→ π*0.65 = 約37度折りたたみ
      const phase     = (f / DRAGON_FLAP_FRAMES) * Math.PI * 2;
      const wingAngle = (Math.sin(phase) * 0.5 + 0.5) * (Math.PI * 0.65);
      dragonSprites[element].push(renderDragonFrame(element, wingAngle, spritePx));
    }
  }
}

// -----------------------------------------------------------------
// ユーティリティ
// -----------------------------------------------------------------
function shadeColor(hex, amount) {
  // hex は "#rrggbb" 形式
  let num;
  try {
    num = parseInt(hex.replace("#", ""), 16);
  } catch (_) {
    return hex;
  }
  const r = Math.min(255, Math.max(0, (num >> 16) + amount));
  const g = Math.min(255, Math.max(0, ((num >> 8) & 0xff) + amount));
  const b = Math.min(255, Math.max(0, (num & 0xff) + amount));
  return `rgb(${r},${g},${b})`;
}

// -----------------------------------------------------------------
// ゲームループ（setInterval固定16ms）
// -----------------------------------------------------------------
let lastTickTs = performance.now();

function tick() {
  const now  = performance.now();
  let dtMs   = now - lastTickTs;
  if (dtMs > BASE_CFG.maxDtMs) dtMs = BASE_CFG.maxDtMs;
  lastTickTs = now;
  const dt   = dtMs / 1000;

  if (gameState === "playing") {
    // v0.6.1: カード表示中はスローモー（時間停止は廃止）。
    // timeScale はイージングで目標値に寄せ、急停止・急再開のカクつきを防ぐ。
    const targetScale = (upgradeCardsVisible && slowmoTimer > 0) ? SLOWMO_SCALE : 1;
    timeScale += (targetScale - timeScale) * Math.min(1, dt * SLOWMO_EASE);
    if (upgradeCardsVisible && slowmoTimer > 0) slowmoTimer -= dt; // 実時間で減衰
    const wdt = dt * timeScale;

    simStep(wdt);
    applyObstaclePushout();       // v0.6-p3: 城壁・地形の侵入不可
    updateCamera(wdt);
    updateSettlementAttacks(wdt);
    updateProjectiles(wdt);
    updateWeaponAttacks(wdt);     // v0.6-p2: 武器ディスパッチ（BEAM/BULLET/MISSILE）
    updateCollisionAttacks(wdt);  // 変更2: 直接衝突ダメージ＋ヒットストップ（MELEEは威力増）
    updateMovers(wdt);            // v0.6-p4: 移動敵の巡回・攻撃
    updateMoverRams();            // v0.6-p4: 移動敵への体当たり
    updateBossNova(wdt);          // v0.7: ボスの反発衝撃波
    updateRaiderSpawns(wdt);      // v0.8: 建物枯渇時のレイダー湧き（詰み防止）
    updateDeathTimers(wdt);
    updateParticles(wdt);
    updateAppearEffects(wdt);     // 変更2: 竜出現エフェクト更新
    updateDownEffects(wdt);       // 変更2(追加): 竜やられエフェクト更新
    collectNearbyEggs();
    updateXpGems(wdt);            // v0.6: XPジェムの飛散・吸引・回収
    updateSlashFx(wdt);           // v0.8: 緋竜の斬閃FX
    updateFires(wdt);             // v0.10: 燃える建物の火の粉・煙柱
    maybeShowLevelUp();           // v0.6: レベルアップが積まれていれば3択を出す（非モーダル）
  } else if (gameState === "title") {
    // v0.6: タイトル画面ではアイドル旋回する群れを背景として見せる
    simStep(dt);
    updateCamera(dt);
    updateParticles(dt);
  } else if (gameState === "stage-clear") {
    simStep(dt);
    applyObstaclePushout();
    updateCamera(dt);
    updateParticles(dt);
    updateAppearEffects(dt);
    updateDownEffects(dt);
    updateXpGems(dt);             // v0.6: ボスのXPジェムをクリア演出中に吸収させる
    updateFires(dt);              // v0.10: クリア演出中も街は燃え続ける
    updateStageClearSequence(dt);
  } else if (gameState === "all-clear") {
    simStep(dt);
    updateCamera(dt);
  }

  if (flashTimer > 0) flashTimer = Math.max(0, flashTimer - dt);
  if (shakeTimer > 0) shakeTimer = Math.max(0, shakeTimer - dt);

  render(now);
  drawMinimap();
  updateHUD();
  tickFps(now);
}

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) lastTickTs = performance.now();
});

// -----------------------------------------------------------------
// 起動
// -----------------------------------------------------------------
async function boot() {
  resize();
  // 竜のラスター画像を先にロードしてから竜スプライトをプリレンダする。
  // ロードが完了する前に createDragonSprites を呼ぶと画像が未定義のまま焼き込まれる
  // （renderDragonFrame内でロード未完了と判定されベクター描画にフォールバックしてしまう）ため、
  // 必ずこの await の後で呼ぶこと。ロード失敗時も preloadDragonImages 内で
  // dragonImagesLoaded=false が設定され、renderDragonFrame が自動でベクター描画に切り替わる。
  await preloadDragonImages();
  // 竜スプライトを起動時に一度だけプリレンダする（DPR確定後・画像ロード完了後に呼ぶこと）
  createDragonSprites();
  createBuildingLayer();
  settlements = generateStageLayout(0);
  rebuildBuildingGrid();
  rebuildBuildingLayer();
  cacheBossIndex();
  // 変更1: initBoids で配列を確保してから resetBoidsForStageStart で初期状態を作る。
  // initBoids は配列アロケーションのみ担い、resetBoidsForStageStart が
  // boot/restart/advanceToNextStage の共通初期化パスになる。
  initBoids();
  resetBoidsForStageStart();
  resetLeader();
  resetProgression();
  updateHUDStage();
  updateHUDBuildings();
  // v0.6: タイトル画面から開始（背景でアイドル旋回する群れが見える）
  refreshTitleBest();
  titleOverlayEl.classList.add("visible");
  setInterval(tick, BASE_CFG.fixedStepMs);
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", boot);
} else {
  boot();
}
</script>
