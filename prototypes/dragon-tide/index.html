<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>竜潮 / Dragon Tide — World Map</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #08101a;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #stage { display: block; width: 100%; height: 100%; }

  /* 右上 HUD: FPS */
  #hud {
    position: fixed;
    top: env(safe-area-inset-top, 8px);
    right: 8px;
    padding: 5px 8px;
    background: rgba(8, 16, 26, 0.70);
    border: 1px solid rgba(120, 200, 255, 0.20);
    border-radius: 6px;
    font-family: -apple-system, BlinkMacSystemFont, monospace;
    font-size: 11px;
    line-height: 1.6;
    color: #fff;
    pointer-events: none;
    min-width: 70px;
    text-align: right;
  }
  #hud .k { color: #6fa6c8; margin-right: 4px; }

  /* 左上 HUD: FLOCK残数 */
  #hud-left {
    position: fixed;
    top: env(safe-area-inset-top, 8px);
    left: 8px;
    padding: 5px 8px;
    background: rgba(8, 16, 26, 0.70);
    border: 1px solid rgba(120, 200, 255, 0.20);
    border-radius: 6px;
    font-family: -apple-system, BlinkMacSystemFont, monospace;
    font-size: 13px;
    line-height: 1.6;
    color: #fff;
    pointer-events: none;
  }
  #hud-left .label { color: #6fa6c8; font-size: 10px; }

  /* 右下 HUD: 卵カウント + ステージ */
  #hud-eggs {
    position: fixed;
    bottom: calc(20vh + env(safe-area-inset-bottom, 0px) + 8px);
    right: 8px;
    padding: 5px 10px;
    background: rgba(8, 16, 26, 0.70);
    border: 1px solid rgba(255, 200, 40, 0.30);
    border-radius: 6px;
    font-family: -apple-system, BlinkMacSystemFont, monospace;
    font-size: 13px;
    color: #ffd040;
    pointer-events: none;
    line-height: 1.7;
  }

  /* 左下 HUD: ミニマップ */
  #minimap-container {
    position: fixed;
    bottom: calc(20vh + env(safe-area-inset-bottom, 0px) + 8px);
    left: 8px;
    background: rgba(8, 16, 26, 0.80);
    border: 1px solid rgba(120, 200, 255, 0.25);
    border-radius: 4px;
    pointer-events: none;
    overflow: hidden;
  }
  #minimap { display: block; }

  /* 残建物カウント（ミニマップの上） */
  #hud-buildings {
    position: fixed;
    bottom: calc(20vh + env(safe-area-inset-bottom, 0px) + 8px + 60px + 4px);
    left: 8px;
    padding: 3px 8px;
    background: rgba(8, 16, 26, 0.70);
    border: 1px solid rgba(255, 180, 60, 0.25);
    border-radius: 4px;
    font-family: -apple-system, BlinkMacSystemFont, monospace;
    font-size: 11px;
    color: #ffb840;
    pointer-events: none;
  }

  /* リトライ / クリアオーバーレイ */
  #overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 20px;
    pointer-events: none;
  }
  #overlay.visible { display: flex; pointer-events: auto; }
  #overlay-title {
    font-family: -apple-system, BlinkMacSystemFont, monospace;
    font-size: 28px;
    color: #fff;
    text-shadow: 0 0 20px rgba(255,200,80,0.8);
    letter-spacing: 0.08em;
    opacity: 0;
    transition: opacity 0.8s;
  }
  #overlay-title.show { opacity: 1; }
  #retry-btn {
    padding: 14px 40px;
    background: rgba(180, 40, 40, 0.85);
    border: 2px solid rgba(255, 100, 100, 0.60);
    border-radius: 30px;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, monospace;
    font-size: 16px;
    cursor: pointer;
    display: none;
    pointer-events: auto;
    letter-spacing: 0.1em;
  }
  #retry-btn.visible { display: block; }

  /* バージョン表示（左下・スクリーン固定） */
  #hud-version {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 4px);
    left: 8px;
    font-family: -apple-system, BlinkMacSystemFont, monospace;
    font-size: 10px;
    color: rgba(120, 180, 255, 0.45);
    pointer-events: none;
    letter-spacing: 0.05em;
  }

  /* ステージ間演出オーバーレイ */
  #stage-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
  }
  #stage-overlay.visible { opacity: 1; }
  #stage-text {
    font-family: -apple-system, BlinkMacSystemFont, monospace;
    font-size: 42px;
    color: #fff;
    text-shadow: 0 0 30px rgba(255,200,80,0.9), 0 0 60px rgba(255,120,40,0.5);
    letter-spacing: 0.12em;
    text-align: center;
  }
  #stage-sub {
    font-family: -apple-system, BlinkMacSystemFont, monospace;
    font-size: 18px;
    color: #ffd080;
    margin-top: 12px;
    letter-spacing: 0.2em;
    text-align: center;
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<!-- 右上 HUD: FPS -->
<div id="hud">
  <span class="k">FPS</span><span id="h-fps">--</span>
</div>

<!-- 左上 HUD: FLOCK残数 -->
<div id="hud-left">
  <div class="label">FLOCK</div>
  <span id="h-alive">10</span> / <span id="h-max">100</span>
</div>

<!-- 右下 HUD: 卵 + ステージ -->
<div id="hud-eggs">
  <div>&#x1F95A; x <span id="h-eggs">0</span></div>
  <div id="h-stage" style="color:#80c8ff;font-size:11px;">STAGE 1/4</div>
</div>

<!-- 残建物カウント -->
<div id="hud-buildings">&#x1F3F0; <span id="h-buildings">--/--</span></div>

<!-- 左下: ミニマップ -->
<div id="minimap-container">
  <canvas id="minimap" width="80" height="60"></canvas>
</div>

<!-- バージョン表示（左下・スクリーン固定） -->
<div id="hud-version"></div>

<!-- ゲームオーバー/クリアオーバーレイ -->
<div id="overlay">
  <div id="overlay-title">EPOCH CONQUERED</div>
  <button id="retry-btn">R — リスタート</button>
</div>

<!-- ステージ間演出 -->
<div id="stage-overlay">
  <div>
    <div id="stage-text">STAGE 2</div>
    <div id="stage-sub">ANCIENT CIVILIZATION</div>
  </div>
</div>

<script>
"use strict";

// -----------------------------------------------------------------
// バージョン定数（ここだけ更新すれば画面に反映される）
// -----------------------------------------------------------------
const GAME_VERSION = "v0.5.1";
document.getElementById("hud-version").textContent = GAME_VERSION;

/* ============================================================
 * 竜潮 / Dragon Tide — Stage Edition v3
 *
 * v3改修:
 *   - 街区（ブロック）方式マップ: 1ステージ150〜250建物
 *   - 静的レイヤー（オフスクリーンCanvas）で建物描画コスト削減
 *   - ブレス攻撃（レーザー）: 近接接触ダメージを廃止し連続照射方式に変更
 *   - ブレス命中点にヒットパーティクル（0.2秒間引き）
 * ============================================================ */

// -----------------------------------------------------------------
// ワールド定数
// -----------------------------------------------------------------
// 変更1: ワールドサイズを拡大（4800×3600）
// オフスクリーンcanvasメモリ: 4800×3600×4byte = 69.1MB（許容範囲内）
// 建物間隔も52px（旧26px）に広げているため、1町の占有面積は旧比約4倍になる
const WORLD_W = 4800;
const WORLD_H = 3600;

// ブレス射程（px）
const BREATH_RANGE = 80;
// ブレス基礎ダメージ（毎フレーム・秒間換算: 0.05/frame × 60fps = 3/sec）
const BREATH_DAMAGE_PER_SEC = 3.0;
// ブレスヒットパーティクル間引き間隔（秒）
const BREATH_PARTICLE_INTERVAL = 0.2;

// -----------------------------------------------------------------
// 変更1: 卵持ち建物パラメータ
// 全建物のうち約18%だけが陥落時に卵を落とす（EGG_BEARER_RATIO）。
// 落とす卵は常に1個（EGG_DROP_COUNT）で群れの増加ペースを緩やかにする。
// 視覚的な目印は毎フレーム動的描画（明滅アニメ付き）で陥落後は消える。
// -----------------------------------------------------------------
// 実験: 建物密度の一括倍率。各ステージの町あたり建物数にこれを掛ける。
// 卵割合はこの倍率で割って、卵の絶対数（＝群れの成長ペース）を一定に保つ。
let BUILDING_DENSITY_MULT = 4; // 4=密な街（最適化済み後のデフォルト）
                               // ビューポートカリング＋空間ハッシュゲートにより
                               // 数千棟でも per-frame コストはほぼ一定。
const EGG_BEARER_RATIO_BASE = 0.18; // 基準割合（密度1倍のときの値）
// 実効割合は BASE / 密度倍率。密度を上げた分だけ割合を下げて卵の総数を一定に。
function eggBearerRatio() { return EGG_BEARER_RATIO_BASE / BUILDING_DENSITY_MULT; }
const EGG_DROP_COUNT   = 1;    // 陥落時に落とす卵の個数

// -----------------------------------------------------------------
// 変更2: ダウン/復帰モデル パラメータ
// HP0 以下 → ダウン状態（フェードアウト → 一定秒後フェードインで全回復して復帰）
// 恒久消滅はない。ダウン中は有効個体数から除外されカメラ・ブレス範囲に影響しない。
// -----------------------------------------------------------------
const BOID_DOWN_DURATION    = 10.0;  // ダウン継続秒数（この後フェードインで復帰）
const BOID_REVIVE_DURATION  = 0.6;  // フェードイン復帰アニメ秒数

// 1ヒットあたりのダメージ量（BOID_MAX_HP の約1/7 ≒ 数発耐える）
// BOID_MAX_HP=30 → 約4.3ダメージ → 7発でダウン
const PROJECTILE_HIT_DAMAGE = 4.3;

// -----------------------------------------------------------------
// バランスデータ（Phase2から流用）
// -----------------------------------------------------------------
// Boids パラメータ（散開相当の値を恒久固定値として採用）
const BASE_CFG = {
  perception:       55,   // spread 値
  separationRadius: 28,   // spread 値
  maxSpeed:         160,
  minSpeed:         60,
  maxForce:         320,
  wSeparation:      2.5,  // spread 値
  wAlignment:       1.0,
  wCohesion:        0.4,  // spread 値
  wLeader:          1.6,
  leaderSeekDist:   80,
  pathMaxPoints:    240,
  pathMinSegment:   8,
  leaderSpeed:      220,
  idleWanderRadius: 120,
  fixedStepMs:      16,
  maxDtMs:          64,
};

// -----------------------------------------------------------------
// ステージ定義
// -----------------------------------------------------------------

const BUILDING_SIZE_PARAMS = {
  // tiny は小さく散在する極小集落（変更4追加）。すぐ壊れる育成フィーダー。
  // small の 0.6 倍の radius で地図にまばらに点在する。
  tiny:   { hpMin: 3, hpMax: 6,  radiusBase: 6  },
  // small は「育成フィーダー」。すぐ壊れて卵が出て群れが育つことが目的。HP低め。
  small:  { hpMin: 6, hpMax: 10, radiusBase: 10 },
  medium: { hpMin: 25, hpMax: 35, radiusBase: 16 },
  large:  { hpMin: 60, hpMax: 85, radiusBase: 28 },
  // boss: 別途 BOSS_PARAMS で管理（サイズ/形状はここと独立）
};

// -----------------------------------------------------------------
// tiny ハムレット（クラスタ）パラメータ
// tiny を単体バラバラではなく「小さな集落（ハムレット）」の塊として配置する。
// 各クラスタ中心をマップに散在させ、そこから近距離に複数棟を密集配置することで
// 「農村の集まり」という視覚的まとまりを作る。
// -----------------------------------------------------------------
// ステージあたりのハムレット数（クラスタ数）
const TINY_HAMLET_COUNT     = 10;  // 8〜12個を目標に中央値を採用
// 1クラスタあたりの tiny 棟数（min/max でランダム）
const TINY_PER_HAMLET_MIN   = 5;
const TINY_PER_HAMLET_MAX   = 8;   // 5〜10棟。合計は50〜80棟程度
// クラスタ内での棟の散布半径（px）：密集して「集落」に見える大きさ
const TINY_HAMLET_RADIUS_MIN = 40;
const TINY_HAMLET_RADIUS_MAX = 65;
// クラスタ中心同士の最小間隔（他クラスタとの分離）
const TINY_HAMLET_MIN_SPACING = 280; // クラスタ同士がくっつかない最小値
// 既存街区（small/medium/large）クラスタとの最小間隔
const TINY_HAMLET_FROM_TOWN_GAP = 120;
// クラスタ内 tiny 棟同士の最小中心間距離（重なり防止）
const TINY_MIN_SPACING        = BUILDING_SIZE_PARAMS.tiny.radiusBase * 2 + 8; // 20px
// 既存建物（small/medium/large）との最小間隔
const TINY_FROM_EXISTING_GAP  = BUILDING_SIZE_PARAMS.tiny.radiusBase + 10;   // 16px
// マップ端からのマージン
const TINY_MARGIN = 80;
// クラスタ中心の配置試行回数
const TINY_HAMLET_MAX_ATTEMPTS = 20;
// クラスタ内各棟の配置試行回数
const TINY_PER_BUILDING_MAX_ATTEMPTS = 12;

// -----------------------------------------------------------------
// 首都要塞（capital district）パラメータ
// ボス周囲を大型建物のリングで取り囲み、さらに城下の雑魚建物で埋める「首都城下町」。
// -----------------------------------------------------------------
// リング配置半径（ボス中心からの距離）
const CAPITAL_RING_INNER = 80;   // ドーナツ内縁: ボス半径(46) + 最低間隔(34)
const CAPITAL_RING_OUTER = 180;  // ドーナツ外縁（外縁を広げて建物が並ぶ余地を確保）
// リングの建物数。
// 理論上限: 中間半径 130px の円周 ≈ 817px ÷ 最小間隔60px ≈ 13棟。
// 14棟を目標に設定（試行4回で多少スキップが出ても 10〜14 棟確保できる）。
const CAPITAL_RING_COUNT = 14;
// 首都建物の HP は通常 large より 30% 高い（「首都＝強い」感。ただしボスより明確に弱い）
const CAPITAL_HP_MULT = 1.30;
// 首都建物の radius は通常 large と同じ（見た目の一貫性を維持）
const CAPITAL_RADIUS_BASE = BUILDING_SIZE_PARAMS.large.radiusBase; // 28px
// 首都建物同士の最小中心間距離（重なり防止）
// radius*2 + 4px = 60px（ぎりぎり接触しない最小値）
const CAPITAL_MIN_SPACING = CAPITAL_RADIUS_BASE * 2 + 4; // 60px

// 変更1: 城下の雑魚建物（small）充填パラメータ
// 大型リング（外縁180px）の外側〜360px の環状帯に small 建物を敷き詰めて城下町にする。
// small radius=10px なので間隔26px あれば隣接せず、32px で余裕を確保。
const CAPITAL_SMALL_INNER  = CAPITAL_RING_OUTER + 8;   // 188px: リング直外から開始
const CAPITAL_SMALL_OUTER  = 360;  // 360px: 城下充填の外縁
// small 建物内の充填試行数。ポアソンディスク風にランダム配置 × 試行でほぼ上限に収束。
const CAPITAL_SMALL_COUNT  = 45;   // 目標棟数（実際は重なり除去で若干減る場合あり）
const CAPITAL_SMALL_RADIUS = BUILDING_SIZE_PARAMS.small.radiusBase; // 10px
// small 同士の最小間隔（radius*2 + 12px のゆとり）
const CAPITAL_SMALL_MIN_SPACING = CAPITAL_SMALL_RADIUS * 2 + 12; // 32px

// 小集落クラスタとの分離に使う「ボス＋リング＋城下充填」占有半径
// 城下外縁 CAPITAL_SMALL_OUTER + small radius + 余白 → 他クラスタを外に追い出す
const CAPITAL_EXCLUSION_RADIUS = CAPITAL_SMALL_OUTER + CAPITAL_SMALL_RADIUS + 60; // 430px
// ボスをマップ端から確保するマージン（城下外縁 + 余白がマップ外に出ないよう）
const CAPITAL_BOSS_MARGIN = CAPITAL_SMALL_OUTER + CAPITAL_SMALL_RADIUS + 80; // 450px

// -----------------------------------------------------------------
// ボス集落パラメータ
// ボスはステージごとに1体だけ配置される高耐久・高火力の核心目標。
// HP: 小集落の約15倍を起点に、ステージが進むほど係数を掛けて増やす。
// 火力: 発射間隔=小集落の約1/3、projectileCount 3〜5、弾速・ダメージ高め。
// 投射ダメージはダウン/復帰モデルのまま（恒久喪失なし）。
// -----------------------------------------------------------------
const BOSS_BASE_HP = 150;          // ステージ1のボスHP（小集落8の約18倍≈育成コスト感）
const BOSS_HP_STAGE_MULT = 1.4;    // ステージごとのHP増加係数（1→210, 2→294, 3→411, 4→576）
const BOSS_RADIUS = 46;            // ボスの見た目半径（小集落10の4.6倍、一目でボスと分かる）
const BOSS_ATTACK_RADIUS = 380;    // ボスの攻撃射程（小集落の2.5倍以上）

// ボスの投射パラメータ（ステージ4 large より強い）
const BOSS_FIRE_PARAMS = {
  // projectileInterval = 小集落の約1/3。高い頻度で群れをダウンさせる圧力になる。
  projectileInterval: 0.6,         // 0.6秒ごと × 後で×4倍ゲートあり → 実質2.4秒
  projectileSpeed:    260,
  projectileDamage:   2.0,         // BOID_MAX_HP=30 → 約15発でダウン（ただし×複数本）
  projectileCount:    4,           // 4方向にファン展開で群れを散らす
  projectileTracking: false,
};

// ボスのHP計算（stageIndexは0始まり）
function calcBossHp(stageIndex) {
  return Math.round(BOSS_BASE_HP * Math.pow(BOSS_HP_STAGE_MULT, stageIndex));
}

const STAGE_CONFIGS = [
  // ===== ステージ1: 石器時代 =====
  {
    name: "STONE AGE",
    subtitle: "THE FIRST CIVILIZATION",
    bgColor: "#0d1a08",
    gridColor: "rgba(40, 80, 20, 0.35)",
    // 街の色テーマ（町ごとに微妙に変化させる基準色）
    townBaseHues: ["#c05820", "#a04010", "#d06828", "#b04818"],

    buildings: {
      // small は育成フィーダー。すぐ壊れて卵が出て群れを育てる役割。
      small: {
        colors: ["#c05820", "#a04010", "#d06828"],
        shapes: ["circle", "polygon"],
        attackRadius: 150,
        projectileInterval: 3.5,
        projectileSpeed: 75,
        projectileDamage: 0.8,
        projectileColor: "#c0a060",
        projectileCount: 1,
        projectileTracking: false,
        reward: { eggMin: 2, eggMax: 4 },
      },
      medium: {
        colors: ["#904818", "#b05820"],
        shapes: ["circle", "polygon"],
        attackRadius: 170,
        projectileInterval: 2.8,
        projectileSpeed: 80,
        projectileDamage: 1,
        projectileColor: "#b09050",
        projectileCount: 1,
        projectileTracking: false,
        reward: { eggMin: 3, eggMax: 5 },
      },
      large: {
        colors: ["#783010"],
        shapes: ["polygon"],
        attackRadius: 180,
        projectileInterval: 2.2,
        projectileSpeed: 85,
        projectileDamage: 1.2,
        projectileColor: "#a08040",
        projectileCount: 2,
        projectileTracking: false,
        reward: { eggMin: 5, eggMax: 7 },
      },
    },
    // ボス集落テーマ（見た目・色。HP/火力は BOSS_* 定数から計算）
    boss: {
      color: "#ff4400",           // 赤橙の巨大神殿——他の茶系と明確に差別化
      glowColor: "#ff8800",       // ミニマップ/グロー用の明るい色
      shape: "bossCircle",        // 専用形状（drawSettlementOnLayer で分岐）
      projectileColor: "#ff6020",
    },
    // 町数・建物密度
    townCount: 5,
    smallPerTown: 28,
    mediumPerTown: 6,
    largePerTown: 1,
  },

  // ===== ステージ2: 古代文明 =====
  {
    name: "ANCIENT ERA",
    subtitle: "GODS WALK AMONG US",
    bgColor: "#1a1408",
    gridColor: "rgba(80, 60, 20, 0.35)",
    townBaseHues: ["#4060b0", "#3050a0", "#6080c0", "#506890"],

    buildings: {
      small: {
        colors: ["#4060b0", "#3050a0", "#6080c0"],
        shapes: ["square", "triangle"],
        attackRadius: 180,
        projectileInterval: 2.8,
        projectileSpeed: 85,
        projectileDamage: 0.8,
        projectileColor: "#8090d0",

// -----------------------------------------------------------------
// カメラ（ワールド座標系でのカメラ中心＋ズームスケール）
// -----------------------------------------------------------------
// 変更1: スケールを常に「100匹時の最大ズームアウト値」に固定する。
// 群れ数に関係なく開始直後（10匹）からこの引き量で遊ぶため、
// プレイヤーはマップ全体を見渡しながら戦略的に動ける。
const CAM_FIXED_SCALE = 0.6; // MAX_BOIDS=100 のときの値（元の最大引き量）
const cam = { x: 400, y: WORLD_H / 2, scale: CAM_FIXED_SCALE };

// 変更1: 群れ数に依らず常に固定スケールを返す。
// 位置追従（群れ重心への lerp）は updateCamera で維持するが、
// ズーム量はこの定数で固定し、動的変化をしない。
function calcTargetCamScale(_aliveCount) {
  return CAM_FIXED_SCALE;
}

function worldToScreen(wx, wy) {
  return {
    x: (wx - cam.x) * cam.scale + viewW * 0.5,
    y: (wy - cam.y) * cam.scale + viewH * 0.5,
  };
}

function screenToWorld(sx, sy) {
  return {
    x: (sx - viewW * 0.5) / cam.scale + cam.x,
    y: (sy - viewH * 0.5) / cam.scale + cam.y,
  };
}

function updateCamera(dt) {
  const centroid = calcFriendlyCentroid();
  const lerpFactor = 0.08;
  cam.x += (centroid.x - cam.x) * lerpFactor;
  cam.y += (centroid.y - cam.y) * lerpFactor;

  // ズームスケール: 有効ワールド表示範囲をスケールで除した値でクランプする
  // scale が小さいほど広い範囲が見えるため、境界余白はスケールを考慮する
  const halfW = viewW * 0.5 / cam.scale;
  const halfH = viewH * 0.5 / cam.scale;
  cam.x = Math.max(halfW, Math.min(WORLD_W - halfW, cam.x));
  cam.y = Math.max(halfH, Math.min(WORLD_H - halfH, cam.y));

  // 群れ生存数に応じてスケールをなめらかに変化させる（lerpで追従）
  const aliveCount = countAliveBoids();
  const targetScale = calcTargetCamScale(aliveCount);
  cam.scale += (targetScale - cam.scale) * Math.min(1, dt * 1.5);
}

// -----------------------------------------------------------------
// 集落（建物）の動的生成 — 街区（ブロック）方式
// -----------------------------------------------------------------
let settlements = [];

function randRange(min, max) {
  return min + Math.random() * (max - min);
}

function randInt(min, max) {
  return min + Math.floor(Math.random() * (max - min + 1));
}

function randChoice(array) {
  return array[Math.floor(Math.random() * array.length)];
}

function dist2(ax, ay, bx, by) {
  const dx = ax - bx, dy = ay - by;
  return dx * dx + dy * dy;
}

/**
 * 町の中心座標を均等にマップへ配置（グリッドジッター法）。
 *
 * bossWx/bossWy が渡されたとき、その周囲 CAPITAL_EXCLUSION_RADIUS 以内の
 * グリッドセルを除外して小集落クラスタが首都要塞と重ならないようにする。
 * 除外されたセルは最大3回まで再抽選し、それでも回避できない場合はスキップする
 * （小集落数がやや減るが、要塞都市の「独立感」を優先）。
 *
 * @param {number} townCount  生成したい町の数
 * @param {number} [bossWx]   ボスのワールドX（オプション）
 * @param {number} [bossWy]   ボスのワールドY（オプション）
 */
function placeTownCenters(townCount, bossWx, bossWy) {
  // 左端250pxは群れスタート地点なので除外
  const MARGIN_LEFT  = 300;
  const MARGIN_RIGHT = 150;
  const MARGIN_Y     = 200;

  const usableW = WORLD_W - MARGIN_LEFT - MARGIN_RIGHT;
  const usableH = WORLD_H - MARGIN_Y * 2;

  const cols = Math.ceil(Math.sqrt(townCount * (usableW / usableH)));
  const rows = Math.ceil(townCount / cols);
  const cellW = usableW / cols;
  const cellH = usableH / rows;

  // ボス＋リング占有の排除半径の二乗（距離比較用）
  const excl2 = CAPITAL_EXCLUSION_RADIUS * CAPITAL_EXCLUSION_RADIUS;
  const hasExclusion = (bossWx !== undefined && bossWy !== undefined);

  const centers = [];
  for (let row = 0; row < rows && centers.length < townCount; row++) {
    for (let col = 0; col < cols && centers.length < townCount; col++) {
      let cx, cy;
      let accepted = false;

      // 最大3回試行して排除ゾーン外の座標を探す
      for (let attempt = 0; attempt < 3; attempt++) {
        cx = MARGIN_LEFT + col * cellW + randRange(cellW * 0.25, cellW * 0.75);
        cy = MARGIN_Y    + row * cellH + randRange(cellH * 0.25, cellH * 0.75);
        if (!hasExclusion || dist2(cx, cy, bossWx, bossWy) >= excl2) {
          accepted = true;
          break;
        }
      }

      // 3回試行してもボス周辺だった場合はこのセルをスキップ
      // （首都と重なる小集落を強制配置しない）
      if (!accepted) continue;

      centers.push({ x: cx, y: cy });
    }
  }
  return centers;
}

// 1つの町を格子状街区として生成
// - 小建物を格子に沿って配置（±jitter）
// - 中型・大型は町の中心・角に配置
function generateTown(townCenterX, townCenterY, smallCount, mediumCount, largeCount, config, townIndex) {
  const result = [];

  // 町の色ヒント（同じ町は同系色。townBaseHues からシフト）
  const baseHue = config.townBaseHues[townIndex % config.townBaseHues.length];

  // 変更1: 建物間隔を広げて「広い都市」感を出す（26→52、2倍に）
  // 縦横2倍の間隔 → 1町あたりの占有面積が約4倍になる
  const SMALL_SPACING = 52;   // 建物間隔 (旧26px → 52px)
  const GRID_JITTER   = 8;    // ±px のランダムオフセット（やや広め）

  // 格子サイズ推算: 小建物をほぼ正方形に詰める
  const gridCols = Math.ceil(Math.sqrt(smallCount * 1.1));
  const gridRows = Math.ceil(smallCount / gridCols);
  const townW = gridCols * SMALL_SPACING;
  const townH = gridRows * SMALL_SPACING;

  const startX = townCenterX - townW * 0.5;
  const startY = townCenterY - townH * 0.5;

  // 道路の描画のためにレーン情報を保存（描画フェーズで使う）
  // 道路幅（px）= SMALL_SPACING * 0.6 程度のすき間として視覚的に見える

  // 小建物を格子配置
  const bSmall = config.buildings.small;
  let placed = 0;
  const positions = [];
  for (let row = 0; row < gridRows && placed < smallCount; row++) {
    for (let col = 0; col < gridCols && placed < smallCount; col++) {
      const wx = startX + col * SMALL_SPACING + randRange(-GRID_JITTER, GRID_JITTER);
      const wy = startY + row * SMALL_SPACING + randRange(-GRID_JITTER, GRID_JITTER);

      // ワールド境界チェック
      if (wx < 10 || wx > WORLD_W - 10 || wy < 10 || wy > WORLD_H - 10) continue;

      const hp = randInt(BUILDING_SIZE_PARAMS.small.hpMin, BUILDING_SIZE_PARAMS.small.hpMax);
      // 同じ町の建物は基本色に近いが微妙にバリエーション
      const colorVariant = shadeColor(baseHue, randInt(-15, 15));
      result.push(makeBuilding(wx, wy, "small", colorVariant, bSmall, hp));
      positions.push({ x: wx, y: wy });
      placed++;
    }
  }

  // 中型建物: 格子の「交差点」相当に配置
  const bMedium = config.buildings.medium;
  const blockSize = SMALL_SPACING * 4; // ブロックサイズ目安
  for (let m = 0; m < mediumCount; m++) {
    // 格子内のランダムな「ブロック角」に配置
    const col = randInt(0, gridCols - 1);
    const row = randInt(0, gridRows - 1);
    const wx = startX + col * SMALL_SPACING + SMALL_SPACING * 0.5 + randRange(-8, 8);
    const wy = startY + row * SMALL_SPACING + SMALL_SPACING * 0.5 + randRange(-8, 8);
    if (wx < 10 || wx > WORLD_W - 10 || wy < 10 || wy > WORLD_H - 10) continue;

    // 小建物との重複チェック
    let tooClose = false;
    for (const p of positions) {
      if (dist2(wx, wy, p.x, p.y) < 20 * 20) { tooClose = true; break; }
    }
    if (tooClose) continue;

    const hp = randInt(BUILDING_SIZE_PARAMS.medium.hpMin, BUILDING_SIZE_PARAMS.medium.hpMax);
    const colorVariant = shadeColor(baseHue, randInt(-10, 20));
    result.push(makeBuilding(wx, wy, "medium", colorVariant, bMedium, hp));
    positions.push({ x: wx, y: wy });
  }

  // 大型建物: 町の中心・角に配置（教会・領主の館・城など）
  const bLarge = config.buildings.large;
  const largePositionOffsets = [
    { x: 0, y: 0 },                   // 中心
    { x: -townW * 0.35, y: -townH * 0.35 },  // 左上
    { x:  townW * 0.35, y: -townH * 0.35 },  // 右上
    { x: -townW * 0.35, y:  townH * 0.35 },  // 左下
    { x:  townW * 0.35, y:  townH * 0.35 },  // 右下
  ];
  for (let k = 0; k < largeCount; k++) {
    const offset = largePositionOffsets[k % largePositionOffsets.length];
    const wx = Math.max(30, Math.min(WORLD_W - 30, townCenterX + offset.x + randRange(-20, 20)));
    const wy = Math.max(30, Math.min(WORLD_H - 30, townCenterY + offset.y + randRange(-20, 20)));
    const hp = randInt(BUILDING_SIZE_PARAMS.large.hpMin, BUILDING_SIZE_PARAMS.large.hpMax);
    const largeColor = bLarge.colors[k % bLarge.colors.length];
    result.push(makeBuilding(wx, wy, "large", largeColor, bLarge, hp));
  }

  // 道路情報を埋め込む（描画用メタデータ。最初の建物に付属させる）
  if (result.length > 0) {
    result[0]._townMeta = {
      startX, startY, townW, townH,
      gridCols, gridRows, spacing: SMALL_SPACING,
    };
  }

  return result;
}

function makeBuilding(wx, wy, size, color, bConfig, hp) {
  return {
    wx,
    wy,
    size,
    color,
    shape:  randChoice(bConfig.shapes),
    radius: BUILDING_SIZE_PARAMS[size].radiusBase,
    maxHp:  hp,
    hp,
    fallen: false,
    // 変更1: 卵持ちフラグ（generateTown 内で EGG_BEARER_RATIO に従い後から設定する）
    isEggBearer: false,
    // ボス集落フラグ（通常建物は false。makeBossBuilding で true になる）
    isBoss: false,
    attackTimer: Math.random() * bConfig.projectileInterval,
    attackRadius:        bConfig.attackRadius,
    projectileInterval:  bConfig.projectileInterval,
    projectileSpeed:     bConfig.projectileSpeed,
    projectileDamage:    bConfig.projectileDamage,
    projectileColor:     bConfig.projectileColor,
    projectileCount:     bConfig.projectileCount,
    projectileTracking:  bConfig.projectileTracking,
    projectileAoe:       bConfig.projectileAoe ?? 0,
    reward:              bConfig.reward,
    // ブレスヒットパーティクルのインターバルカウンタ
    _breathParticleTimer: 0,
  };
}

/**
 * tiny ハムレット（集落クラスタ）をマップ全体に配置する。
 *
 * 単体バラバラ配置から「ハムレット単位のクラスタ配置」に変更。
 * 1クラスタ = TINY_PER_HAMLET_MIN〜MAX 棟の密集体。
 * クラスタ中心はボス＋首都占有領域・既存街区・他クラスタと重ならない位置に散在させる。
 *
 * settlements 配列への追加 → 空間ハッシュ・ビューポートカリング・攻撃ゲート・
 * オフスクリーン合成・ミニマップは自動的に対象になる（既存最適化を壊さない）。
 *
 * @param {Array}  existingBuildings  既存の建物リスト（重なりチェック用）
 * @param {number} bossWx            ボスのワールドX
 * @param {number} bossWy            ボスのワールドY
 * @param {Object} config            STAGE_CONFIGS[stageIndex]
 * @returns {Array}  配置された tiny 建物のリスト
 */
function generateTinySettlements(existingBuildings, bossWx, bossWy, config) {
  const result = [];
  const bSmall = config.buildings.small; // tiny は small のパラメータを流用（攻撃・色）
  const tinyR  = BUILDING_SIZE_PARAMS.tiny.radiusBase;

  // 既存建物の位置リスト（tiny との重なりチェック用）
  const occupied = existingBuildings.map(b => ({ x: b.wx, y: b.wy, r: b.radius }));

  // 首都占有領域の二乗（ボス中心からの排除距離）
  const excl2 = CAPITAL_EXCLUSION_RADIUS * CAPITAL_EXCLUSION_RADIUS;
  // クラスタ同士の最小間隔二乗
  const hamletSpacing2 = TINY_HAMLET_MIN_SPACING * TINY_HAMLET_MIN_SPACING;
  // 既存街区との最小間隔二乗（クラスタ中心 vs 既存建物中心）
  const fromTown2 = TINY_HAMLET_FROM_TOWN_GAP * TINY_HAMLET_FROM_TOWN_GAP;

  // 確定したクラスタ中心リスト（他クラスタとの分離チェック用）
  const hamletCenters = [];

  for (let h = 0; h < TINY_HAMLET_COUNT; h++) {
    // --- クラスタ中心の配置 ---
    let centerX = 0, centerY = 0;
    let hamletPlaced = false;

    for (let attempt = 0; attempt < TINY_HAMLET_MAX_ATTEMPTS && !hamletPlaced; attempt++) {
      const cx = TINY_MARGIN + Math.random() * (WORLD_W - TINY_MARGIN * 2);
      const cy = TINY_MARGIN + Math.random() * (WORLD_H - TINY_MARGIN * 2);

      // 首都占有領域チェック（クラスタ中心がボス周辺に入らない）
      if (dist2(cx, cy, bossWx, bossWy) < excl2) continue;

      // 既存街区（small/medium/large 建物）との間隔チェック
      // クラスタ半径 + fromTown2 内に既存建物があれば除外
      let tooCloseToTown = false;
      for (const ob of occupied) {
        // 既存建物との最小間隔 = その建物 radius + tinyハムレット半径 + gap
        const minD = ob.r + TINY_HAMLET_RADIUS_MAX + TINY_HAMLET_FROM_TOWN_GAP;
        if (dist2(cx, cy, ob.x, ob.y) < minD * minD) {
          tooCloseToTown = true;
          break;
        }
      }
      if (tooCloseToTown) continue;

      // 他クラスタ中心との最小間隔チェック
      let tooCloseToHamlet = false;
      for (const hc of hamletCenters) {
        if (dist2(cx, cy, hc.x, hc.y) < hamletSpacing2) {
          tooCloseToHamlet = true;
          break;
        }
      }
      if (tooCloseToHamlet) continue;

      centerX = cx;
      centerY = cy;
      hamletPlaced = true;
    }

    if (!hamletPlaced) continue; // このクラスタは配置不能 → スキップ

    hamletCenters.push({ x: centerX, y: centerY });

    // --- クラスタ内の棟を配置 ---
    const buildingCount = randInt(TINY_PER_HAMLET_MIN, TINY_PER_HAMLET_MAX);
    const hamletR = randRange(TINY_HAMLET_RADIUS_MIN, TINY_HAMLET_RADIUS_MAX);
    // このクラスタで確定した棟（クラスタ内の重なりチェック用）
    const hamletBuildings = [];

    for (let k = 0; k < buildingCount; k++) {
      let placed = false;

      for (let attempt = 0; attempt < TINY_PER_BUILDING_MAX_ATTEMPTS && !placed; attempt++) {
        // クラスタ中心の周囲 hamletR 以内にランダム配置（一様分布にするため√補正）
        const angle = Math.random() * Math.PI * 2;
        const r     = hamletR * Math.sqrt(Math.random());
        const wx    = centerX + Math.cos(angle) * r;
        const wy    = centerY + Math.sin(angle) * r;

        // ワールド境界チェック
        if (wx < TINY_MARGIN || wx > WORLD_W - TINY_MARGIN ||
            wy < TINY_MARGIN || wy > WORLD_H - TINY_MARGIN) continue;

        // 既存建物（街区・首都）との重なりチェック
        let tooClose = false;
        for (const ob of occupied) {
          const minD = ob.r + tinyR + TINY_FROM_EXISTING_GAP;
          if (dist2(wx, wy, ob.x, ob.y) < minD * minD) { tooClose = true; break; }
        }
        if (tooClose) continue;

        // クラスタ内 tiny 棟同士の重なりチェック
        for (const hb of hamletBuildings) {
          if (dist2(wx, wy, hb.x, hb.y) < TINY_MIN_SPACING * TINY_MIN_SPACING) {
            tooClose = true; break;
          }
        }
        if (tooClose) continue;

        // 他クラスタ（result 全体）との重なりチェック
        for (const t of result) {
          if (dist2(wx, wy, t.wx, t.wy) < TINY_MIN_SPACING * TINY_MIN_SPACING) {
            tooClose = true; break;
          }
        }
        if (tooClose) continue;

        // 配置確定
        const hp    = randInt(BUILDING_SIZE_PARAMS.tiny.hpMin, BUILDING_SIZE_PARAMS.tiny.hpMax);
        const color = randChoice(bSmall.colors);
        const b     = makeBuilding(wx, wy, "tiny", color, bSmall, hp);
        // tiny 専用フラグ（ミニマップ・デバッグ等で識別）
        b._tinySettlement = true;
        // tiny の radius は BUILDING_SIZE_PARAMS.tiny.radiusBase で確定
        b.radius = tinyR;
        result.push(b);
        occupied.push({ x: wx, y: wy, r: tinyR });
        hamletBuildings.push({ x: wx, y: wy });
        placed = true;
      }
    }
  }

  return result;
}

/**
 * ボス集落を1体生成する。
 * 高HP・高火力・大半径で、小集落の育成なしでは倒せない圧力を作る。
 * isBoss=true を持つことでクリア条件・描画・ミニマップで特別扱いされる。
 */
function makeBossBuilding(wx, wy, stageIndex, bossTheme) {
  const hp = calcBossHp(stageIndex);
  // 攻撃タイマーはあえて0から始めて、ステージ開始直後から脅威感を出す
  return {
    wx,
    wy,
    size: "boss",
    color: bossTheme.color,
    shape: bossTheme.shape,        // "bossCircle" — 専用描画関数で処理
    radius: BOSS_RADIUS,
    maxHp: hp,
    hp,
    fallen: false,
    isEggBearer: false,            // ボスは卵を落とさない（強すぎる報酬になるため）
    isBoss: true,
    attackTimer: 0,
    attackRadius:       BOSS_ATTACK_RADIUS,
    projectileInterval: BOSS_FIRE_PARAMS.projectileInterval,
    projectileSpeed:    BOSS_FIRE_PARAMS.projectileSpeed,
    projectileDamage:   BOSS_FIRE_PARAMS.projectileDamage,
    projectileColor:    bossTheme.projectileColor,
    projectileCount:    BOSS_FIRE_PARAMS.projectileCount,
    projectileTracking: BOSS_FIRE_PARAMS.projectileTracking,
    projectileAoe:      0,
    reward:             { eggMin: 0, eggMax: 0 },
    _breathParticleTimer: 0,
    // ボス専用: グロー色（描画時に外輪のグロー効果に使う）
    _bossGlowColor: bossTheme.glowColor,
  };
}

function generateStageLayout(stageIndex) {
  const config = STAGE_CONFIGS[stageIndex];

  // --- (1) ボスを先に配置する ---
  // ボス＋要塞リングが確実にマップ内に収まる位置を確保してから、
  // 小集落クラスタをその周囲を避けて配置する（先取り方式）。
  const boss = placeBossBuilding(stageIndex, config);

  // --- (2) 小集落クラスタの中心をボス＋リング占有領域を避けて決める ---
  const townCenters = placeTownCenters(config.townCount, boss.wx, boss.wy);

  const result = [];
  for (let t = 0; t < townCenters.length; t++) {
    const center = townCenters[t];
    const townBuildings = generateTown(
      center.x, center.y,
      Math.round(config.smallPerTown  * BUILDING_DENSITY_MULT),
      Math.round(config.mediumPerTown * BUILDING_DENSITY_MULT),
      Math.round(config.largePerTown  * BUILDING_DENSITY_MULT),
      config,
      t,
    );
    for (const b of townBuildings) result.push(b);
  }

  // --- (2b) 首都要塞リング（座標のみ先計算）して小集落建物との衝突除去に使う ---
  // placeCapitalDistrict は config が必要なため、ここで仮実行して座標を取得する。
  // 首都建物と重なるクラスタ建物は remove してから result に残す。
  const capitalBuildings = placeCapitalDistrict(boss, config);

  // 首都建物の占有エリアを「除去対象」として各小集落建物をフィルタリングする。
  // 重なり判定: 中心距離 < 首都建物 radius + 小集落建物 radius + 最小隙間 6px
  const CLUSTER_PURGE_GAP = 6;
  function collidesWithCapital(b) {
    for (const cap of capitalBuildings) {
      const d2 = dist2(b.wx, b.wy, cap.wx, cap.wy);
      const minD = cap.radius + b.radius + CLUSTER_PURGE_GAP;
      if (d2 < minD * minD) return true;
    }
    return false;
  }

  // _townMeta フラグを保持しながらフィルタ（先頭建物の meta を後続に移す必要はない）
  const purged = result.filter(b => !collidesWithCapital(b));
  // result を purged で置き換える（参照を変えず内容を更新）
  result.length = 0;
  for (const b of purged) result.push(b);

  // 卵持ちフラグをステージ全体に散らばらせて付与する（町ごとに均等割当）。
  assignEggBearers(result);

  // --- (3) ボスと首都建物を配列に追加 ---
  result.push(boss);
  for (const b of capitalBuildings) result.push(b);

  // --- (4) 変更4: tiny 集落をマップ全体に散布する ---
  // 首都・既存建物との重なりを避けて配置し、最後に result へ追加する。
  // assignEggBearers の後に追加するため、tiny はフォールバック（towns=0）で
  // 全体1町として扱われるが、ここでは全建物確定後に個別に卵持ち割当を補う。
  const tinyBuildings = generateTinySettlements(result, boss.wx, boss.wy, config);
  // tiny だけを対象に卵持ちを割当（eggBearerRatio に基づく）
  const tinyEggCount = Math.max(1, Math.round(tinyBuildings.length * eggBearerRatio()));
  const tinyIndices  = Array.from({ length: tinyBuildings.length }, (_, i) => i);
  for (let i = 0; i < tinyEggCount && i < tinyIndices.length; i++) {
    const j   = i + Math.floor(Math.random() * (tinyIndices.length - i));
    const tmp = tinyIndices[i]; tinyIndices[i] = tinyIndices[j]; tinyIndices[j] = tmp;
    tinyBuildings[tinyIndices[i]].isEggBearer = true;
  }
  for (const b of tinyBuildings) result.push(b);

  return result;
}

/**
 * ボス集落を「ボス＋リング全体がマップ内に収まる」ワールド右寄り位置に配置する。
 * 小集落クラスタはこの後に生成されるため、ここでは既存建物チェックは不要。
 * マップ端からのマージンに CAPITAL_BOSS_MARGIN（リング外縁＋余白）を使う。
 */
function placeBossBuilding(stageIndex, config) {
  const bossTheme = config.boss;
  // ワールド右2/3エリアかつリング外縁がマップ外に出ない安全内側に配置する。
  // CAPITAL_BOSS_MARGIN = CAPITAL_RING_OUTER + CAPITAL_RADIUS_BASE + 80px のマージン。
  const minX = WORLD_W * 0.45;
  const maxX = WORLD_W - CAPITAL_BOSS_MARGIN;
  const minY = CAPITAL_BOSS_MARGIN;
  const maxY = WORLD_H - CAPITAL_BOSS_MARGIN;

  // 乱数で配置（マップが狭くて範囲が逆転しないようクランプ）
  const safeMaxX = Math.max(minX + 1, maxX);
  const safeMaxY = Math.max(minY + 1, maxY);
  const bossWx = minX + Math.random() * (safeMaxX - minX);
  const bossWy = minY + Math.random() * (safeMaxY - minY);

  return makeBossBuilding(bossWx, bossWy, stageIndex, bossTheme);
}

/**
 * ボス周囲に large サイズ帯の建物を環状（ドーナツ状）に配置して「首都要塞」を形成する。
 *
 * アルゴリズム:
 *   CAPITAL_RING_COUNT 本の候補角度をリング内に均等分割し、
 *   CAPITAL_RING_INNER〜CAPITAL_RING_OUTER のドーナツ領域に収めた座標を生成する。
 *   各候補は (1) ボス本体との最小間隔、(2) 先行配置済み首都建物との最小間隔を確認し、
 *   重なる場合は半径または角度を微調整して再試行する。
 *
 * @param {Object} boss  placeBossBuilding で生成したボスオブジェクト
 * @param {Object} config  STAGE_CONFIGS[stageIndex]
 * @returns {Array}  配置された首都建物のリスト
 */
function placeCapitalDistrict(boss, config) {
  const result = [];
  const bossX = boss.wx;
  const bossY = boss.wy;

  // ボス中心から最低限離れなければならない距離（ボス半径 + 首都建物半径 + 最小隙間）
  const minBossDist = BOSS_RADIUS + CAPITAL_RADIUS_BASE + 10;
  const minBossDist2 = minBossDist * minBossDist;

  // 首都建物同士の最小距離（重なり防止）
  const minCapDist2 = CAPITAL_MIN_SPACING * CAPITAL_MIN_SPACING;

  // 角度スロットを CAPITAL_RING_COUNT 等分割
  const angleStep = (Math.PI * 2) / CAPITAL_RING_COUNT;

  for (let k = 0; k < CAPITAL_RING_COUNT; k++) {
    // 各スロットで最大4回試行：境界チェックや重なりで失敗した場合に半径・角度を微変化させて再挑戦
    const MAX_ATTEMPTS = 4;
    let placed = false;

    for (let attempt = 0; attempt < MAX_ATTEMPTS && !placed; attempt++) {
      // 角度に±15%のランダムオフセット（有機的な配置感）
      const baseAngle = k * angleStep + (Math.random() * angleStep * 0.30 - angleStep * 0.15);

      // 半径: ドーナツ内縁〜外縁のランダム位置（attempt が増えるほど内縁寄りを試して境界を回避）
      const radiusRand = Math.max(0, Math.random() - attempt * 0.15);
      const radius = CAPITAL_RING_INNER + radiusRand * (CAPITAL_RING_OUTER - CAPITAL_RING_INNER);

      const wx = bossX + Math.cos(baseAngle) * radius;
      const wy = bossY + Math.sin(baseAngle) * radius;

      // ワールド境界チェック（建物半径分の余白を確保）
      const pad = CAPITAL_RADIUS_BASE + 10;
      if (wx < pad || wx > WORLD_W - pad || wy < pad || wy > WORLD_H - pad) continue;

      // ボス本体との最小間隔チェック
      if (dist2(wx, wy, bossX, bossY) < minBossDist2) continue;

      // 先行配置済み首都建物との重なりチェック
      let tooClose = false;
      for (const cap of result) {
        if (dist2(wx, wy, cap.wx, cap.wy) < minCapDist2) {
          tooClose = true;
          break;
        }
      }
      if (tooClose) continue;

      result.push(makeCapitalBuilding(wx, wy, config));
      placed = true;
    }
    // MAX_ATTEMPTS 試行後も配置できなかった場合はそのスロットをスキップ
    // （ボスが端に追い込まれた場合の安全網）
  }

  // 変更1: 城下の雑魚建物（small）を CAPITAL_SMALL_INNER〜SMALL_OUTER の環状帯に充填する。
  // ポアソンディスク風: 候補をランダムに生成し、既配置建物との最小間隔で除去する。
  // ボスとの間隔も確保。卵持ち割当の対象に含める（_townMeta は持たないが
  // assignEggBearers のフォールバックで全体1町として処理される）。
  const smallPad = CAPITAL_SMALL_RADIUS + 10;
  const smallMinD2 = CAPITAL_SMALL_MIN_SPACING * CAPITAL_SMALL_MIN_SPACING;
  // ボス本体との最小距離（ボス半径 + small 半径 + 余白）
  const bossSmallDist2 = (BOSS_RADIUS + CAPITAL_SMALL_RADIUS + 14) * (BOSS_RADIUS + CAPITAL_SMALL_RADIUS + 14);
  // 配置された全建物（ring + small）を重なりチェックに使うためまとめて参照する
  // result にはリング建物が入っているので、small 同士 + ring との距離も見る
  const MAX_ATTEMPTS_SMALL = 6;

  for (let k = 0; k < CAPITAL_SMALL_COUNT; k++) {
    let placed = false;
    for (let attempt = 0; attempt < MAX_ATTEMPTS_SMALL && !placed; attempt++) {
      const angle = Math.random() * Math.PI * 2;
      // 内縁〜外縁のランダム半径（均等分布にするため√変換を使う）
      const rMin = CAPITAL_SMALL_INNER, rMax = CAPITAL_SMALL_OUTER;
      const rnd  = Math.sqrt(Math.random());  // 外側に密度が偏らないよう補正
      const r    = rMin + rnd * (rMax - rMin);

      const wx = bossX + Math.cos(angle) * r;
      const wy = bossY + Math.sin(angle) * r;

      // ワールド境界チェック
      if (wx < smallPad || wx > WORLD_W - smallPad || wy < smallPad || wy > WORLD_H - smallPad) continue;

      // ボス本体との距離チェック
      if (dist2(wx, wy, bossX, bossY) < bossSmallDist2) continue;

      // 既配置建物（ring large + 先行small）との重なりチェック
      let tooClose = false;
      for (const cap of result) {
        // ring の large と small では最小間隔を変える
        const gap = (cap.size === "small")
          ? CAPITAL_SMALL_MIN_SPACING
          : CAPITAL_SMALL_RADIUS + CAPITAL_RADIUS_BASE + 14;
        if (dist2(wx, wy, cap.wx, cap.wy) < gap * gap) { tooClose = true; break; }
      }
      if (tooClose) continue;

      result.push(makeCapitalSmallBuilding(wx, wy, config));
      placed = true;
    }
  }

  return result;
}

/**
 * 首都要塞建物を生成する。
 * 通常 large 帯のパラメータを使い、HP のみ CAPITAL_HP_MULT 倍で「首都＝強い」感を出す。
 * isBoss は false のまま——ボスではなく「ボスを守る要塞の一部」として機能する。
 *
 * @param {number} wx  ワールドX座標
 * @param {number} wy  ワールドY座標
 * @param {Object} config  STAGE_CONFIGS[stageIndex]
 * @returns {Object}  建物オブジェクト
 */
function makeCapitalBuilding(wx, wy, config) {
  const bLarge = config.buildings.large;
  const baseHp = randInt(BUILDING_SIZE_PARAMS.large.hpMin, BUILDING_SIZE_PARAMS.large.hpMax);
  const hp     = Math.round(baseHp * CAPITAL_HP_MULT);
  // 首都建物の色は large カラーから選ぶ（ステージテーマに合わせる）
  const color  = randChoice(bLarge.colors);

  const building = makeBuilding(wx, wy, "large", color, bLarge, hp);
  // 首都建物は要塞都市の一部であることを示すフラグ
  // （_townMeta は持たない → assignEggBearers のフォールバックで全体1町として卵割当対象に含まれる）
  building._isCapital = true;
  return building;
}

/**
 * 城下の雑魚建物（small サイズ）を生成する。
 * 通常 small 帯と同じパラメータを使う（弱い・すぐ壊れる城下住民）。
 * 卵持ち割当の対象になることでボス前で群れが育つ良い流れを作る。
 *
 * @param {number} wx  ワールドX座標
 * @param {number} wy  ワールドY座標
 * @param {Object} config  STAGE_CONFIGS[stageIndex]
 * @returns {Object}  建物オブジェクト
 */
function makeCapitalSmallBuilding(wx, wy, config) {
  const bSmall = config.buildings.small;
  const hp     = randInt(BUILDING_SIZE_PARAMS.small.hpMin, BUILDING_SIZE_PARAMS.small.hpMax);
  // 城下の small は small カラーから選ぶ（ステージテーマに合わせる）
  const color  = randChoice(bSmall.colors);
  const building = makeBuilding(wx, wy, "small", color, bSmall, hp);
  // 城下建物フラグ（通常クラスタとの区別用。卵割当・カリング対象には通常通り含まれる）
  building._isCapitalSmall = true;
  return building;
}

// 各町の建物リストから EGG_BEARER_RATIO の割合でランダムに卵持ちを選ぶ。
// _townMeta を持つ建物が「町の先頭」なので、それを境界として町ごとに分割する。
// 町ごとに割り当てることで全マップに散らばった配置になる。
function assignEggBearers(buildings) {
  // まず全フラグをリセット
  for (const b of buildings) b.isEggBearer = false;

  // _townMeta の有無で町の区切りを検出し、町ごとの配列を作る
  const towns = [];
  let current = null;
  for (const b of buildings) {
    if (b._townMeta) {
      current = [];
      towns.push(current);
    }
    if (current) current.push(b);
  }
  // _townMeta が一切ない場合は全体を1町として扱う（フォールバック）
  if (towns.length === 0) towns.push(buildings);

  for (const town of towns) {
    // この町での卵持ち数（最低1、実効割合で計算。密度倍率で割って絶対数を一定に）
    const count = Math.max(1, Math.round(town.length * eggBearerRatio()));
    // シャッフル相当: インデックス配列をランダムに選んでフラグを立てる
    const indices = [];
    for (let i = 0; i < town.length; i++) indices.push(i);
    // フィッシャー–イェーツで先頭 count 要素だけ選ぶ（部分シャッフル）
    for (let i = 0; i < count; i++) {
      const j = i + Math.floor(Math.random() * (indices.length - i));
      const tmp = indices[i]; indices[i] = indices[j]; indices[j] = tmp;
      town[indices[i]].isEggBearer = true;
    }
  }
}

// -----------------------------------------------------------------
// オフスクリーンCanvas: 建物の静的描画レイヤー
// 建物が壊れたときだけ部分再描画する
// -----------------------------------------------------------------
function rebuildBuildingLayer() {
  if (!buildingLayerCtx) return;
  const bctx = buildingLayerCtx;

  // 完全クリア
  bctx.clearRect(0, 0, WORLD_W, WORLD_H);

  // 道路ラインを先に描く（建物の下に来る）
  drawRoadsOnLayer(bctx);

  // 全建物を描画
  for (let s = 0; s < settlements.length; s++) {
    drawSettlementOnLayer(bctx, settlements[s]);
  }

  buildingLayerDirty = false;
}

function drawRoadsOnLayer(bctx) {
  // 各町のメタ情報から道路を描く
  for (let s = 0; s < settlements.length; s++) {
    const meta = settlements[s]._townMeta;
    if (!meta) continue;
    drawTownRoadsOnLayer(bctx, meta);
  }
}

function drawTownRoadsOnLayer(bctx, meta) {
  const { startX, startY, townW, townH, gridCols, gridRows, spacing } = meta;
  // 道路は建物間のすき間をうっすら明るく見せる（薄い線）
  bctx.strokeStyle = "rgba(200, 180, 140, 0.08)";
  bctx.lineWidth = spacing * 0.5;
  bctx.lineCap = "butt";

  // 横方向の道路（各行の中央）
  for (let row = 0; row <= gridRows; row++) {
    const y = startY + row * spacing;
    bctx.beginPath();
    bctx.moveTo(startX - spacing * 0.5, y);
    bctx.lineTo(startX + townW + spacing * 0.5, y);
    bctx.stroke();
  }
  // 縦方向の道路（各列の中央）
  for (let col = 0; col <= gridCols; col++) {
    const x = startX + col * spacing;
    bctx.beginPath();
    bctx.moveTo(x, startY - spacing * 0.5);
    bctx.lineTo(x, startY + townH + spacing * 0.5);
    bctx.stroke();
  }
}

function drawSettlementOnLayer(bctx, settlement) {
  const alpha = settlement.fallen ? 0.22 : 1.0;
  const color = settlement.fallen ? "#333" : settlement.color;

  bctx.save();
  bctx.globalAlpha = alpha;

  switch (settlement.shape) {
    case "circle":      drawCircleOnCtx(bctx, settlement.wx, settlement.wy, settlement.radius, color); break;
    case "square":      drawSquareOnCtx(bctx, settlement.wx, settlement.wy, settlement.radius, color); break;
    case "squareTower": drawSquareTowerOnCtx(bctx, settlement.wx, settlement.wy, settlement.radius, color); break;
    case "hexagon":     drawHexagonOnCtx(bctx, settlement.wx, settlement.wy, settlement.radius, color); break;
    case "triangle":    drawTriangleOnCtx(bctx, settlement.wx, settlement.wy, settlement.radius, color); break;
    case "polygon":     drawPolygonOnCtx(bctx, settlement.wx, settlement.wy, settlement.radius, color); break;
    case "star":        drawStarOnCtx(bctx, settlement.wx, settlement.wy, settlement.radius, color, 5); break;
    case "star4":       drawStarOnCtx(bctx, settlement.wx, settlement.wy, settlement.radius, color, 4); break;
    // ボス集落専用形状: 外輪グロー + 多重リング + 中心十字で一目でボスと分かる
    case "bossCircle":
      drawBossOnLayer(bctx, settlement, color);
      break;
    default:            drawCircleOnCtx(bctx, settlement.wx, settlement.wy, settlement.radius, color); break;
  }

  bctx.restore();
}

/**
 * ボス集落をオフスクリーンCanvasに描画する。
 * 外輪グロー（薄い大円）＋実体（二重リング）＋中心の8角星＋十字マークで
 * 小集落とは明確に差別化した外観を作る。
 * fallen 時は通常建物と同じく暗く潰れる（alpha=0.22, color="#333" で呼ばれる）。
 */
function drawBossOnLayer(bctx, settlement, color) {
  const wx = settlement.wx;
  const wy = settlement.wy;
  const r  = settlement.radius;        // BOSS_RADIUS = 46
  const glowColor = settlement._bossGlowColor ?? color;
  const isFallen  = settlement.fallen;

  if (isFallen) {
    // 陥落後は単純な暗い大円にまとめる（視認は残すが存在感は消す）
    bctx.fillStyle = color;
    bctx.beginPath();
    bctx.arc(wx, wy, r, 0, Math.PI * 2);
    bctx.fill();
    return;
  }

  // --- 外輪グロー（大きな半透明円） ---
  // 半透明でじわっと広がる光。オフスクリーン焼き付けなので毎フレームコストゼロ。
  bctx.globalAlpha = 0.18;
  bctx.fillStyle   = glowColor;
  bctx.beginPath();
  bctx.arc(wx, wy, r * 1.7, 0, Math.PI * 2);
  bctx.fill();

  bctx.globalAlpha = 0.10;
  bctx.fillStyle   = glowColor;
  bctx.beginPath();
  bctx.arc(wx, wy, r * 2.2, 0, Math.PI * 2);
  bctx.fill();

  bctx.globalAlpha = 1.0;

  // --- 外リング（太い輪郭） ---
  bctx.strokeStyle = glowColor;
  bctx.lineWidth   = 4;
  bctx.beginPath();
  bctx.arc(wx, wy, r, 0, Math.PI * 2);
  bctx.stroke();

  // --- 実体（中塗り） ---
  const grad = bctx.createRadialGradient(wx, wy, r * 0.1, wx, wy, r * 0.95);
  grad.addColorStop(0.0, glowColor);
  grad.addColorStop(0.5, color);
  grad.addColorStop(1.0, "rgba(0,0,0,0.6)");
  bctx.fillStyle = grad;
  bctx.beginPath();
  bctx.arc(wx, wy, r, 0, Math.PI * 2);
  bctx.fill();

  // --- 内リング --- （中心との境界を強調）
  bctx.strokeStyle = "rgba(255,255,255,0.55)";
  bctx.lineWidth   = 1.5;
  bctx.beginPath();
  bctx.arc(wx, wy, r * 0.55, 0, Math.PI * 2);
  bctx.stroke();

  // --- 8角星（中心マーク） ---
  drawStarOnCtx(bctx, wx, wy, r * 0.35, glowColor, 8);

  // --- 十字ライン（城砦感） ---
  bctx.strokeStyle = "rgba(255,255,255,0.40)";
  bctx.lineWidth   = 1.5;
  const cr = r * 0.85;
  bctx.beginPath();
  bctx.moveTo(wx - cr, wy); bctx.lineTo(wx + cr, wy);
  bctx.moveTo(wx, wy - cr); bctx.lineTo(wx, wy + cr);
  bctx.stroke();

  // --- 外縁の白い輪郭線（存在感を締める） ---
  bctx.strokeStyle = "rgba(255,255,255,0.70)";
  bctx.lineWidth   = 2;
  bctx.beginPath();
  bctx.arc(wx, wy, r + 2, 0, Math.PI * 2);
  bctx.stroke();
}

// -----------------------------------------------------------------
// 建物形状描画（オフスクリーン用・メインCanvas用共通）
// -----------------------------------------------------------------
function drawCircleOnCtx(c, wx, wy, r, color) {
  c.fillStyle = color;
  c.strokeStyle = "rgba(255,255,255,0.4)";
  c.lineWidth = 1.5;
  c.beginPath();
  c.arc(wx, wy, r, 0, Math.PI * 2);
  c.fill();
  c.stroke();
}

function drawSquareOnCtx(c, wx, wy, r, color) {
  c.fillStyle = color;
  c.strokeStyle = "rgba(255,255,255,0.35)";
  c.lineWidth = 1.5;
  c.fillRect(wx - r, wy - r, r * 2, r * 2);
  c.strokeRect(wx - r, wy - r, r * 2, r * 2);
}

function drawSquareTowerOnCtx(c, wx, wy, r, color) {
  c.fillStyle = color;
  c.strokeStyle = "rgba(255,255,255,0.4)";
  c.lineWidth = 1.5;
  c.fillRect(wx - r, wy - r, r * 2, r * 2);
  c.strokeRect(wx - r, wy - r, r * 2, r * 2);
  const towerSize = r * 0.4;
  const positions = [
    [wx - r, wy - r], [wx + r - towerSize, wy - r],
    [wx - r, wy + r - towerSize], [wx + r - towerSize, wy + r - towerSize],
  ];
  c.fillStyle = shadeColor(color, -20);
  for (const [tx, ty] of positions) {
    c.fillRect(tx, ty, towerSize, towerSize);
  }
}

function drawHexagonOnCtx(c, wx, wy, r, color) {
  c.fillStyle = color;
  c.strokeStyle = "rgba(255,255,255,0.5)";
  c.lineWidth = 1.5;
  c.beginPath();
  for (let k = 0; k < 6; k++) {
    const angle = (k * Math.PI * 2) / 6 - Math.PI / 6;
    if (k === 0) c.moveTo(wx + Math.cos(angle) * r, wy + Math.sin(angle) * r);
    else c.lineTo(wx + Math.cos(angle) * r, wy + Math.sin(angle) * r);
  }
  c.closePath();
  c.fill();
  c.stroke();
}

function drawTriangleOnCtx(c, wx, wy, r, color) {
  c.fillStyle = color;
  c.strokeStyle = "rgba(255,255,255,0.45)";
  c.lineWidth = 1.5;
  c.beginPath();
  c.moveTo(wx, wy - r);
  c.lineTo(wx + r * 0.9, wy + r * 0.7);
  c.lineTo(wx - r * 0.9, wy + r * 0.7);
  c.closePath();
  c.fill();
  c.stroke();
}

function drawPolygonOnCtx(c, wx, wy, r, color) {
  c.fillStyle = color;
  c.strokeStyle = "rgba(255,255,255,0.3)";
  c.lineWidth = 1.5;
  const sides = 5 + ((Math.round(wx + wy) % 3));
  c.beginPath();
  for (let k = 0; k < sides; k++) {
    const baseAngle = (k * Math.PI * 2) / sides;
    const jitter = 0.65 + 0.35 * ((Math.sin(k * 13.7 + wx * 0.01) + 1) * 0.5);
    const rx = wx + Math.cos(baseAngle) * r * jitter;
    const ry = wy + Math.sin(baseAngle) * r * jitter;
    if (k === 0) c.moveTo(rx, ry);
    else c.lineTo(rx, ry);
  }
  c.closePath();
  c.fill();
  c.stroke();
}

function drawStarOnCtx(c, wx, wy, r, color, spikes) {
  c.fillStyle = color;
  c.strokeStyle = "rgba(255,255,255,0.4)";
  c.lineWidth = 1.5;
  c.beginPath();
  const innerR = r * 0.50;
  for (let k = 0; k < spikes * 2; k++) {
    const angle = (k * Math.PI) / spikes - Math.PI / 2;
    const rad = k % 2 === 0 ? r : innerR;
    if (k === 0) c.moveTo(wx + Math.cos(angle) * rad, wy + Math.sin(angle) * rad);
    else c.lineTo(wx + Math.cos(angle) * rad, wy + Math.sin(angle) * rad);
  }
  c.closePath();
  c.fill();
  c.stroke();
}

// -----------------------------------------------------------------
// 投射物プール（最大200個）
// -----------------------------------------------------------------
const MAX_PROJECTILES = 200;

const projWx        = new Float32Array(MAX_PROJECTILES);
const projWy        = new Float32Array(MAX_PROJECTILES);
const projVx        = new Float32Array(MAX_PROJECTILES);
const projVy        = new Float32Array(MAX_PROJECTILES);
const projActive    = new Uint8Array(MAX_PROJECTILES);
const projDmg       = new Float32Array(MAX_PROJECTILES);
const projAoe       = new Float32Array(MAX_PROJECTILES);
const projTracking  = new Uint8Array(MAX_PROJECTILES);
const projTargetIdx = new Int32Array(MAX_PROJECTILES);
const projColor     = new Array(MAX_PROJECTILES).fill("#fff");
const projTailX     = new Float32Array(MAX_PROJECTILES);
const projTailY     = new Float32Array(MAX_PROJECTILES);
// 変更3: 飛距離管理用 SoA（発射点を記録して走破距離で消滅判定する）
const projStartWx   = new Float32Array(MAX_PROJECTILES);
const projStartWy   = new Float32Array(MAX_PROJECTILES);
// 変更5: 投射物種別 SoA（0=arrow 通常矢弾、1=catapult カタパルト弾）
// Uint8Array: 0 or 1 で表現。初期化漏れなし（new Uint8Array はゼロ初期化される）
const projKind      = new Uint8Array(MAX_PROJECTILES); // 0=arrow, 1=catapult

// 変更3: 投射物パラメータ定数
// 弾速倍率: ステージ設定の projectileSpeed にこの倍率を掛けて「大型矢」の重厚な速さにする。
const PROJECTILE_SPEED_MULT  = 3.6;
// 変更5: 種別ごとの飛距離上限（px）
// カタパルト弾: 広い射程（大型・首都・ボスのみが撃つ威圧感）
const PROJECTILE_MAX_RANGE   = 420; // catapult 用（従来値を維持）
// 通常矢弾: 短い射程（small/tiny/medium が撃つ。近づかないと当たらない）
const ARROW_MAX_RANGE        = 250;

// 変更5: 種別ごとのノックバック速度（px/s）
// カタパルト弾: 強いノックバック（大型・首都・ボスの圧力感）
const CATAPULT_KNOCKBACK_SPEED = 220; // 旧120→220へ増強
// 通常矢弾: 弱いノックバック（ちょっと押される程度）
const ARROW_KNOCKBACK_SPEED    = 60;

// 変更5: kind=0(arrow) / kind=1(catapult)
function spawnProjectile(fromWx, fromWy, targetBoidIdx, speed, damage, color, aoe, isTracking, kind) {
  let slot = -1;
  for (let i = 0; i < MAX_PROJECTILES; i++) {
    if (!projActive[i]) { slot = i; break; }
  }
  if (slot < 0) return;

  // 変更3: 弾速倍率を適用（大型矢の重厚な速さ）
  const actualSpeed = speed * PROJECTILE_SPEED_MULT;

  projActive[slot]     = 1;
  projWx[slot]         = fromWx;
  projWy[slot]         = fromWy;
  projTailX[slot]      = fromWx;
  projTailY[slot]      = fromWy;
  // 変更3: 発射点を記録（飛距離上限判定用）
  projStartWx[slot]    = fromWx;
  projStartWy[slot]    = fromWy;
  projDmg[slot]        = damage;
  projAoe[slot]        = aoe ?? 0;
  projTracking[slot]   = isTracking ? 1 : 0;
  projTargetIdx[slot]  = targetBoidIdx;
  projColor[slot]      = color;
  // 変更5: 種別を記録（デフォルト 0=arrow）
  projKind[slot]       = (kind === 1) ? 1 : 0;

  if (targetBoidIdx >= 0 && !boidDead[targetBoidIdx]) {
    const dx = px[targetBoidIdx] - fromWx;
    const dy = py[targetBoidIdx] - fromWy;
    const d  = Math.sqrt(dx * dx + dy * dy) || 1;
    projVx[slot] = (dx / d) * actualSpeed;
    projVy[slot] = (dy / d) * actualSpeed;
  } else {
    projVx[slot] = actualSpeed;
    projVy[slot] = 0;
  }
}

function findNearestAliveBoid(wx, wy) {
  let nearest = -1;
  let nearestDist2 = Infinity;
  for (let i = 0; i < N; i++) {
    // 変更2: ダウン中の個体は投射物のターゲットにしない
    if (boidDead[i] || boidDowned[i]) continue;
    const dx = px[i] - wx;
    const dy = py[i] - wy;
    const d2 = dx * dx + dy * dy;
    if (d2 < nearestDist2) {
      nearestDist2 = d2;
      nearest = i;
    }
  }
  return nearest;
}

// 建物のSpatial Hash（ブレス射程判定用）
// 建物は静的なのでステージ生成時に1回だけ構築する
const buildingGrid = new Map();
const BUILDING_GRID_CELL = 100; // セルサイズ（px）

function buildingGridClear() { buildingGrid.clear(); }

function buildingGridInsert(settlementIdx, wx, wy) {
  const cx = (wx / BUILDING_GRID_CELL) | 0;
  const cy = (wy / BUILDING_GRID_CELL) | 0;
  const key = cx * 100003 + cy;
  let bucket = buildingGrid.get(key);
  if (!bucket) { bucket = []; buildingGrid.set(key, bucket); }
  bucket.push(settlementIdx);
}

function buildingGridQuery(wx, wy, out) {
  out.length = 0;
  const cx = (wx / BUILDING_GRID_CELL) | 0;
  const cy = (wy / BUILDING_GRID_CELL) | 0;
  // BREATH_RANGE 80px を BUILDING_GRID_CELL 100px で割ると1セル以内に収まる
  for (let dy = -1; dy <= 1; dy++) {
    for (let dx = -1; dx <= 1; dx++) {
      const key = (cx + dx) * 100003 + (cy + dy);
      const b = buildingGrid.get(key);
      if (b) for (const idx of b) out.push(idx);
    }
  }
}

function rebuildBuildingGrid() {
  buildingGridClear();
  for (let s = 0; s < settlements.length; s++) {
    if (!settlements[s].fallen) {
      buildingGridInsert(s, settlements[s].wx, settlements[s].wy);
    }
  }
}

// 建物Spatial Hashの近傍クエリ用バッファ
const _buildingNeighbourBuf = [];

// 攻撃判定ゲート用: フレーム内で「射程内にドラゴンがいる」とマークされた建物インデックスの集合。
// ドラゴン側から建物ハッシュをたどる逆引き方式で、群れから遠い建物の全ドラゴン走査を省く。
// Set は毎フレームクリアして使い回す。
const _settlementsInRange = new Set();

// 攻撃判定に使う空間ハッシュのセルサイズ。
// 最大attackRadius=300px を1クエリ(±1セル)でカバーするには cellSize >= 300 が必要。
// BUILDING_GRID_CELL=100 は 100px 範囲クエリ用なので、攻撃判定用に別グリッドを持つ。
// ただし、専用グリッドを別途維持するコストを避けるため、以下の方式を採る:
// 「各ドラゴンの位置から最大攻撃射程(MAX_ATTACK_RADIUS)内の建物グリッドセルを走査し、
//  ヒットした建物インデックスを _settlementsInRange に登録する」
// BUILDING_GRID_CELL=100 で cellRadius=ceil(300/100)=3 → ±3セル(7×7=49セル) のクエリ
// ボスの BOSS_ATTACK_RADIUS=380 が最大値。空間ハッシュクエリ半径もこれに合わせる。
const MAX_ATTACK_RADIUS = 380; // ボスの attackRadius（最大値）
const _ATKCELL_RADIUS = Math.ceil(MAX_ATTACK_RADIUS / BUILDING_GRID_CELL); // = 4

// ドラゴン位置周辺の建物を攻撃判定グリッドで収集する
function _queryBuildingsForAttack(bx, by) {
  const cx = (bx / BUILDING_GRID_CELL) | 0;
  const cy = (by / BUILDING_GRID_CELL) | 0;
  for (let dy = -_ATKCELL_RADIUS; dy <= _ATKCELL_RADIUS; dy++) {
    for (let dx = -_ATKCELL_RADIUS; dx <= _ATKCELL_RADIUS; dx++) {
      const key = (cx + dx) * 100003 + (cy + dy);
      const bucket = buildingGrid.get(key);
      if (bucket) {
        for (const idx of bucket) _settlementsInRange.add(idx);
      }
    }
  }
}

function updateSettlementAttacks(dt) {
  // (A) 逆引き方式: ドラゴン側から「近くの建物」を空間ハッシュで収集する。
  // 群れ全体でO(N × (2*cellRadius+1)^2) ≈ O(N × 49)。
  // 群れから遠い大多数の建物は Set に入らないため全ドラゴン走査から除外される。
  _settlementsInRange.clear();
  for (let i = 0; i < N; i++) {
    if (boidDead[i] || boidDowned[i]) continue;
    _queryBuildingsForAttack(px[i], py[i]);
  }

  // (B) Set 内の建物だけ射程内判定・発射処理する。
  // Set サイズは群れ近傍の建物数のみ（遠方の建物は含まれない）。
  for (const s of _settlementsInRange) {
    const settlement = settlements[s];
    if (!settlement || settlement.fallen) continue;

    let inRange = false;
    const atkR2 = settlement.attackRadius * settlement.attackRadius;
    for (let i = 0; i < N; i++) {
      if (boidDead[i] || boidDowned[i]) continue;
      const dx = px[i] - settlement.wx;
      const dy = py[i] - settlement.wy;
      if (dx * dx + dy * dy < atkR2) { inRange = true; break; }
    }
    if (!inRange) continue;

    settlement.attackTimer -= dt;
    if (settlement.attackTimer > 0) continue;
    // 通常建物: 発射頻度を大幅に下げる（×4倍の間隔 = たまに飛ぶ「雰囲気」として残す）
    // ボス: projectileInterval をそのまま使う（定数で設定した高頻度を活かす）
    settlement.attackTimer = settlement.isBoss
      ? settlement.projectileInterval
      : settlement.projectileInterval * 4.0;

    const targetIdx = findNearestAliveBoid(settlement.wx, settlement.wy);
    if (targetIdx < 0) continue;

    // 変更5: 集落種別に応じて弾種を決定する。
    // large・首都（_isCapital）・ボス → カタパルト弾（kind=1: 強ノックバック・大きな矢）
    // それ以外（small/tiny/medium）→ 通常矢弾（kind=0: 小さく・射程短い・弱ノックバック）
    const isCatapultShooter = settlement.isBoss || settlement._isCapital ||
                              settlement.size === "large";
    const kind = isCatapultShooter ? 1 : 0;

    const count = settlement.projectileCount;
    if (count === 1) {
      spawnProjectile(
        settlement.wx, settlement.wy,
        targetIdx,
        settlement.projectileSpeed,
        settlement.projectileDamage,
        settlement.projectileColor,
        settlement.projectileAoe,
        settlement.projectileTracking,
        kind,
      );
    } else if (count === 2) {
      const baseAngle = calcAngleToTarget(settlement.wx, settlement.wy, targetIdx);
      for (let k = -1; k <= 0; k++) {
        spawnFanProjectileRaw(
          settlement.wx, settlement.wy,
          baseAngle + k * 0.4,
          settlement.projectileSpeed,
          settlement.projectileDamage,
          settlement.projectileColor,
          kind,
        );
      }
    } else if (count === 3) {
      const baseAngle = calcAngleToTarget(settlement.wx, settlement.wy, targetIdx);
      for (let k = -1; k <= 1; k++) {
        spawnFanProjectileRaw(
          settlement.wx, settlement.wy,
          baseAngle + k * 0.3,
          settlement.projectileSpeed,
          settlement.projectileDamage,
          settlement.projectileColor,
          kind,
        );
      }
    } else {
      const angleStep = (Math.PI * 2) / count;
      const baseAngle = Math.random() * Math.PI * 2;
      for (let k = 0; k < count; k++) {
        spawnFanProjectileRaw(
          settlement.wx, settlement.wy,
          baseAngle + k * angleStep,
          settlement.projectileSpeed,
          settlement.projectileDamage,
          settlement.projectileColor,
          kind,
        );
      }
    }
  }
}

function calcAngleToTarget(fromX, fromY, targetBoidIdx) {
  if (targetBoidIdx < 0) return 0;
  return Math.atan2(py[targetBoidIdx] - fromY, px[targetBoidIdx] - fromX);
}

// 変更5: kind=0(arrow) / kind=1(catapult)
function spawnFanProjectileRaw(fromWx, fromWy, angle, speed, damage, color, kind) {
  let slot = -1;
  for (let i = 0; i < MAX_PROJECTILES; i++) {
    if (!projActive[i]) { slot = i; break; }
  }
  if (slot < 0) return;
  // 変更3: 弾速倍率を適用
  const actualSpeed = speed * PROJECTILE_SPEED_MULT;
  projActive[slot]     = 1;
  projWx[slot]         = fromWx;
  projWy[slot]         = fromWy;
  projTailX[slot]      = fromWx;
  projTailY[slot]      = fromWy;
  // 変更3: 発射点を記録（飛距離上限判定用）
  projStartWx[slot]    = fromWx;
  projStartWy[slot]    = fromWy;
  projVx[slot]         = Math.cos(angle) * actualSpeed;
  projVy[slot]         = Math.sin(angle) * actualSpeed;
  projDmg[slot]        = damage;
  projAoe[slot]        = 0;
  projTracking[slot]   = 0;
  projTargetIdx[slot]  = -1;
  projColor[slot]      = color;
  // 変更5: 種別を記録（デフォルト 0=arrow）
  projKind[slot]       = (kind === 1) ? 1 : 0;
}

function updateProjectiles(dt) {
  for (let i = 0; i < MAX_PROJECTILES; i++) {
    if (!projActive[i]) continue;

    if (projTracking[i] && projTargetIdx[i] >= 0 && !boidDead[projTargetIdx[i]]) {
      const dx = px[projTargetIdx[i]] - projWx[i];
      const dy = py[projTargetIdx[i]] - projWy[i];
      const d  = Math.sqrt(dx * dx + dy * dy) || 1;
      const currentSpeed = Math.sqrt(projVx[i] * projVx[i] + projVy[i] * projVy[i]);
      projVx[i] += (dx / d * currentSpeed - projVx[i]) * 0.06;
      projVy[i] += (dy / d * currentSpeed - projVy[i]) * 0.06;
    }

    projTailX[i] = projWx[i];
    projTailY[i] = projWy[i];

    projWx[i] += projVx[i] * dt;
    projWy[i] += projVy[i] * dt;

    if (projWx[i] < -50 || projWx[i] > WORLD_W + 50 || projWy[i] < -50 || projWy[i] > WORLD_H + 50) {
      projActive[i] = 0;
      continue;
    }

    // 変更5: 飛距離上限チェック（種別ごとに異なる最大射程を適用）
    // catapult(kind=1): PROJECTILE_MAX_RANGE=420px（広い射程）
    // arrow  (kind=0): ARROW_MAX_RANGE=250px（短い射程、近づかないと当たらない）
    const tdx      = projWx[i] - projStartWx[i];
    const tdy      = projWy[i] - projStartWy[i];
    const maxRange = projKind[i] === 1 ? PROJECTILE_MAX_RANGE : ARROW_MAX_RANGE;
    if (tdx * tdx + tdy * tdy > maxRange * maxRange) {
      projActive[i] = 0;
      continue;
    }

    checkProjectileHitBoids(i);
  }
}

// 投射物ダメージ係数: 1ヒットで BOID_MAX_HP の 1/7 程度（数発耐える）
// 0.0 から復活。ダウンモデルにより恒久消滅しないのでダメージを有効化する。
const PROJECTILE_DAMAGE_MULTIPLIER = 1.0;

// 変更3: 投射物命中時のノックバック速度（px/s）
// 弾の進行方向と同方向に押し出す（矢が刺さって押される感覚）。
// 120px/s は maxSpeed(160) の75%なので体感できるが maxSpeed クランプで飛び出さない。
const PROJECTILE_KNOCKBACK_SPEED = 120;

function checkProjectileHitBoids(projIdx) {
  const HIT_R  = 8;
  const HIT_R2 = HIT_R * HIT_R;

  // トンネリング対策: 弾速が高いと1フレームで HIT_R を超える距離を移動しうる。
  // テール（前フレーム位置）と現在位置の中間点でも判定することで
  // 最大936 px/s（260 × 3.6）の弾でもすり抜けを防ぐ。
  // 中間点 = tailX + (wx - tailX) * 0.5。2ステップで直径16pxのギャップをカバーできる。
  const midX = (projWx[projIdx] + projTailX[projIdx]) * 0.5;
  const midY = (projWy[projIdx] + projTailY[projIdx]) * 0.5;

  for (let i = 0; i < N; i++) {
    if (boidDead[i] || boidDowned[i]) continue;

    // 現在位置で判定
    let dx = projWx[projIdx] - px[i];
    let dy = projWy[projIdx] - py[i];
    let hit = dx * dx + dy * dy < HIT_R2;

    // 当たらなければ中間点でも判定（高速弾のトンネリングを防ぐ）
    if (!hit) {
      dx  = midX - px[i];
      dy  = midY - py[i];
      hit = dx * dx + dy * dy < HIT_R2;
    }

    if (hit) {
      applyDamageToBoid(i, PROJECTILE_HIT_DAMAGE * PROJECTILE_DAMAGE_MULTIPLIER);
      spawnHitParticles(projWx[projIdx], projWy[projIdx]);
      if (!boidDowned[i]) applyProjectileKnockback(i, projIdx);
      projActive[projIdx] = 0;
      return;
    }
  }
}

function applyProjectileKnockback(boidIdx, projIdx) {
  // 変更5: 種別ごとにノックバック強度を分岐する
  // catapult(kind=1): CATAPULT_KNOCKBACK_SPEED=220（強い。体感できる吹き飛び）
  // arrow  (kind=0): ARROW_KNOCKBACK_SPEED=60（弱い。ちょっと押される程度）
  const knockbackSpeed = projKind[projIdx] === 1
    ? CATAPULT_KNOCKBACK_SPEED
    : ARROW_KNOCKBACK_SPEED;

  const pvx    = projVx[projIdx];
  const pvy    = projVy[projIdx];
  const pspeed = Math.sqrt(pvx * pvx + pvy * pvy) || 1;
  vx[boidIdx] += (pvx / pspeed) * knockbackSpeed;
  vy[boidIdx] += (pvy / pspeed) * knockbackSpeed;
  // 速度を maxSpeed でクランプして飛び出しを防ぐ
  const sp = Math.sqrt(vx[boidIdx] * vx[boidIdx] + vy[boidIdx] * vy[boidIdx]);
  if (sp > BASE_CFG.maxSpeed) {
    vx[boidIdx] = (vx[boidIdx] / sp) * BASE_CFG.maxSpeed;
    vy[boidIdx] = (vy[boidIdx] / sp) * BASE_CFG.maxSpeed;
  }
}

function applyAoeProjectileDamage(wx, wy, aoeR, damage) {
  const r2 = aoeR * aoeR;
  for (let i = 0; i < N; i++) {
    if (boidDead[i] || boidDowned[i]) continue;
    const dx = wx - px[i];
    const dy = wy - py[i];
    if (dx * dx + dy * dy < r2) {
      applyDamageToBoid(i, damage);
    }
  }
}

// -----------------------------------------------------------------
// ブレス攻撃（レーザー照射）
// 近接ダメージの代替: ドラゴンが射程内の最近建物へ連続照射
// ブレスデータは描画フェーズで使えるよう毎フレーム収集する
// -----------------------------------------------------------------

// ブレス情報バッファ: { boidIdx, settlementIdx, hitX, hitY } の配列
// 毎フレームのupdate時に構築し、draw時に参照する
const activeBreaths = [];

// ブレスのアニメーション時間（sin揺らぎ用）
let breathTime = 0;

function updateBreathAttacks(dt) {
  if (gameState !== "playing") return;

  breathTime += dt;
  activeBreaths.length = 0;

  const BREATH_R2 = BREATH_RANGE * BREATH_RANGE;
  // attackMultiplier は隊形廃止により 1.0 固定
  const damageThisFrame = BREATH_DAMAGE_PER_SEC * dt;

  // Spatial Hash を使ってブレス射程内の建物候補を絞る
  for (let i = 0; i < N; i++) {
    // 変更2: ダウン中はブレスを吐かない
    if (boidDead[i] || boidDowned[i]) continue;

    // 各ドラゴンの最近建物を1つだけ探す（射程内に限定）
    buildingGridQuery(px[i], py[i], _buildingNeighbourBuf);

    let nearestSettlementIdx = -1;
    let nearestDist2 = BREATH_R2 + 1;

    for (const sIdx of _buildingNeighbourBuf) {
      const settlement = settlements[sIdx];
      if (!settlement || settlement.fallen) continue;
      const dx = settlement.wx - px[i];
      const dy = settlement.wy - py[i];
      const d2 = dx * dx + dy * dy;
      if (d2 < nearestDist2) {
        nearestDist2 = d2;
        nearestSettlementIdx = sIdx;
      }
    }

    if (nearestSettlementIdx < 0) continue;

    const settlement = settlements[nearestSettlementIdx];

    // ダメージ適用
    settlement.hp -= damageThisFrame;

    // ヒットパーティクル（0.2秒間引き）
    settlement._breathParticleTimer -= dt;
    if (settlement._breathParticleTimer <= 0) {
      settlement._breathParticleTimer = BREATH_PARTICLE_INTERVAL;
      spawnHitParticles(
        settlement.wx + (Math.random() - 0.5) * settlement.radius,
        settlement.wy + (Math.random() - 0.5) * settlement.radius,
      );
    }

    // 建物破壊チェック
    if (settlement.hp <= 0 && !settlement.fallen) {
      settlementFall(nearestSettlementIdx);
      // 破壊された建物のグリッドエントリを更新（次フレームで再構築される）
      buildingLayerDirty = true;
    }

    // ブレス描画データを収集
    activeBreaths.push({
      boidIdx: i,
      targetWx: settlement.wx,
      targetWy: settlement.wy,
    });
  }
}

// -----------------------------------------------------------------
// 変更2: 直接衝突攻撃（ドラゴンが建物に体当たりしたときのダメージ＋ヒットストップ）
// 群れの流れを止めないよう、衝突しても押し戻しはせず通過させる。
// かわりにクールダウンで連続ヒットを防ぎ、単発の重い一撃感を出す。
// -----------------------------------------------------------------
function updateCollisionAttacks(dt) {
  if (gameState !== "playing") return;

  // ヒットストップタイマーとクールダウンを先に進める
  for (let i = 0; i < N; i++) {
    if (boidHitStopTimer[i] > 0)      boidHitStopTimer[i]    = Math.max(0, boidHitStopTimer[i] - dt);
    if (boidCollisionCooldown[i] > 0) boidCollisionCooldown[i] = Math.max(0, boidCollisionCooldown[i] - dt);
  }

  for (let i = 0; i < N; i++) {
    // 変更2: ダウン中は建物に衝突しない
    if (boidDead[i] || boidDowned[i]) continue;
    // クールダウン中はこの個体の衝突判定をスキップ
    if (boidCollisionCooldown[i] > 0) continue;

    // Spatial Hash で近傍建物を取得（BREATH_RANGE と同じグリッドを流用）
    buildingGridQuery(px[i], py[i], _buildingNeighbourBuf);

    for (const sIdx of _buildingNeighbourBuf) {
      const s = settlements[sIdx];
      if (!s || s.fallen) continue;

      // 衝突判定: ドラゴン半径6px + 建物半径 の合計以内に入ったら衝突
      const collideR = s.radius + 6;
      const dx = s.wx - px[i];
      const dy = s.wy - py[i];
      if (dx * dx + dy * dy > collideR * collideR) continue;

      // --- 衝突発生 ---

      // 建物にダメージ（ブレスより大きい単発ダメージ）
      s.hp -= COLLISION_DAMAGE;

      // ヒットストップ: この個体だけ一瞬止める（3フレーム相当）
      boidHitStopTimer[i]    = HITSTOP_DURATION;
      // クールダウンをセットして同じ建物への連続ヒットを防ぐ
      boidCollisionCooldown[i] = COLLISION_COOLDOWN;

      // 強めのパーティクル（破片が飛ぶ）
      spawnCollisionParticles(s.wx, s.wy);

      // 振動フィードバック（15ms）
      hapticPulse(15);

      // 建物破壊チェック
      if (s.hp <= 0 && !s.fallen) {
        settlementFall(sIdx);
        buildingLayerDirty = true;
      }

      // 1個体につき1建物までで打ち切り（同フレームで複数衝突しない）
      break;
    }
  }
}

// 衝突時の強めパーティクル（破片感）
function spawnCollisionParticles(wx, wy) {
  // 通常のブレスパーティクルより多く、速く、広がりも大きい
  const count = 6 + Math.floor(Math.random() * 5); // 6〜10個
  let spawned = 0;
  for (let i = 0; i < MAX_PARTICLES && spawned < count; i++) {
    if (partActive[i]) continue;
    partActive[i] = 1;
    partX[i] = wx + (Math.random() - 0.5) * 12;
    partY[i] = wy + (Math.random() - 0.5) * 12;
    const angle = Math.random() * Math.PI * 2;
    // 通常の2〜3倍の初速で破片が吹き飛ぶ
    const speed = 80 + Math.random() * 160;
    partVx[i]   = Math.cos(angle) * speed;
    partVy[i]   = Math.sin(angle) * speed;
    // 寿命も少し長め
    partLife[i] = 0.25 + Math.random() * 0.20;
    spawned++;
  }
}

function settlementFall(settlementIndex) {
  const settlement = settlements[settlementIndex];
  settlement.fallen = true;
  settlement.hp = 0;

  // 変更1: 卵持ち建物だけが卵を EGG_DROP_COUNT 個落とす。
  // 残りの建物は壊しても卵を落とさない（破壊演出はそのまま）。
  if (settlement.isEggBearer) {
    for (let k = 0; k < EGG_DROP_COUNT; k++) {
      const angle = Math.random() * Math.PI * 2;
      const r = settlement.radius + 10 + Math.random() * 40;
      spawnEgg(settlement.wx + Math.cos(angle) * r, settlement.wy + Math.sin(angle) * r);
    }
  }

  hapticPulse(80);
  // 建物レイヤーを部分的に再描画（fallen状態に更新）
  if (buildingLayerCtx) {
    const bc = buildingLayerCtx;
    // ボスはグロー外輪が radius * 2.2 まで広がるため、クリア矩形を大きめに取る
    const padding = settlement.isBoss ? settlement.radius * 2.5 : settlement.radius + 4;
    bc.clearRect(
      settlement.wx - padding,
      settlement.wy - padding,
      padding * 2,
      padding * 2,
    );
    drawSettlementOnLayer(bc, settlement);
  }
  // 建物グリッドも更新
  rebuildBuildingGrid();
  updateHUDBuildings();

  // 変更3: クリア条件を「ボス集落の陥落」に変更。
  // 小集落は育成用の餌であり、残っていてもボスを倒せば次ステージへ進む。
  // ボスが高耐久なため、先に小集落で群れを育てる必要が自然に生まれる。
  if (settlement.isBoss) {
    triggerStageClear();
  }
}

// -----------------------------------------------------------------
// Spatial Hash（自軍用）
// -----------------------------------------------------------------
const grid = new Map();

function gridKey(cx, cy) { return (cx * 73856093 ^ cy * 19349663); }
function gridClear() { grid.clear(); }
function gridInsert(index, x, y, cellSize) {
  const cx = (x / cellSize) | 0;
  const cy = (y / cellSize) | 0;
  const k  = gridKey(cx, cy);
  let bucket = grid.get(k);
  if (!bucket) { bucket = []; grid.set(k, bucket); }
  bucket.push(index);
}
function gridQuery(x, y, cellSize, out) {
  out.length = 0;
  const cx = (x / cellSize) | 0;
  const cy = (y / cellSize) | 0;
  for (let dy = -1; dy <= 1; dy++) {
    for (let dx = -1; dx <= 1; dx++) {
      const b = grid.get(gridKey(cx + dx, cy + dy));
      if (b) for (let i = 0; i < b.length; i++) out.push(b[i]);
    }
  }
}

// -----------------------------------------------------------------
// Boids SoA — 自軍（ワールド座標で管理）
// -----------------------------------------------------------------
const MAX_BOIDS = 100;
let N = 0;
let px, py, vx, vy;
let boidHp;
let boidDead;
let boidFadeTimer;
// 衝突ヒットストップタイマー（>0の間、その個体を停止させる）
let boidHitStopTimer;
// 変更2: 衝突クールダウン（建物インデックスごとに記録）
// boidCollisionCooldown[i] は「最後に衝突した時刻からの残り秒数」
let boidCollisionCooldown;
// 変更2 (ダウン/復帰モデル): ダウン状態フラグと復帰タイマー
// boidDowned[i]=1 の間はダウン中。有効個体数から除外され、ブレス/衝突/ターゲット対象外。
// boidDownTimer[i] > 0 の間タイマーが進み、0 になったらフェードインで復帰する。
// boidReviveTimer[i] > 0 の間はフェードイン中（描画用）。
let boidDowned;
let boidDownTimer;
let boidReviveTimer;

// 変更4: 竜のHP を10倍（3 → 30）にして群れが簡単に壊滅しなくなる
const BOID_MAX_HP   = 30;
const FADE_DURATION = 0.3;

// 変更2: 衝突攻撃パラメータ
// ブレスより大きい単発ダメージ（毎秒換算ではなく1ヒット）
const COLLISION_DAMAGE      = 8;
// 衝突後の再発動クールダウン（同じドラゴンが同じ建物に連続ヒットしない）
const COLLISION_COOLDOWN    = 0.5; // 秒
// ヒットストップ持続（フレーム数を秒換算: 3フレーム≒0.048秒）
const HITSTOP_DURATION      = 0.048;

// 群れの初期個体数（卵回収で MAX_BOIDS まで増える）
const BOIDS_INITIAL = 10;

function initBoids() {
  // 配列は常に MAX_BOIDS 分確保し、N は現在の有効個体数を管理する
  px                    = new Float32Array(MAX_BOIDS);
  py                    = new Float32Array(MAX_BOIDS);
  vx                    = new Float32Array(MAX_BOIDS);
  vy                    = new Float32Array(MAX_BOIDS);
  boidHp                = new Float32Array(MAX_BOIDS);
  boidDead              = new Uint8Array(MAX_BOIDS);
  boidFadeTimer         = new Float32Array(MAX_BOIDS);
  boidHitStopTimer      = new Float32Array(MAX_BOIDS);
  boidCollisionCooldown = new Float32Array(MAX_BOIDS);
  // 変更2: ダウン/復帰モデル配列
  boidDowned            = new Uint8Array(MAX_BOIDS);
  boidDownTimer         = new Float32Array(MAX_BOIDS);
  boidReviveTimer       = new Float32Array(MAX_BOIDS);
  // 尻尾角度履歴リングバッファ（TAIL_SEGS個前までの進行角度）
  boidAngleHistory      = new Float32Array(MAX_BOIDS * TAIL_SEGS);

  // 初期配置は BOIDS_INITIAL 体だけ。卵回収で増えていく雪だるま体験をさせる。
  N = BOIDS_INITIAL;

  const startWx = 250;
  const startWy = WORLD_H * 0.5;
  for (let i = 0; i < MAX_BOIDS; i++) {
    boidHp[i]        = BOID_MAX_HP;
    boidDead[i]      = 1; // 一旦全部 dead にしてから N 体だけ有効化
    boidFadeTimer[i] = 0;
    boidHitStopTimer[i]      = 0;
    boidCollisionCooldown[i] = 0;
    boidDowned[i]            = 0;
    boidDownTimer[i]         = 0;
    boidReviveTimer[i]       = 0;
    // 尻尾角度履歴を 0 で初期化（後で有効化時に上書き）
    for (let s = 0; s < TAIL_SEGS; s++) {
      boidAngleHistory[i * TAIL_SEGS + s] = 0;
    }
  }

  // 最初の N 体を有効化
  for (let i = 0; i < N; i++) {
    const r = Math.random() * 80;
    const a = Math.random() * Math.PI * 2;
    px[i] = startWx + Math.cos(a) * r;
    py[i] = startWy + Math.sin(a) * r;
    const ang = Math.random() * Math.PI * 2;
    vx[i] = Math.cos(ang) * BASE_CFG.minSpeed;
    vy[i] = Math.sin(ang) * BASE_CFG.minSpeed;
    boidHp[i]        = BOID_MAX_HP;
    boidDead[i]      = 0;
    boidFadeTimer[i] = 0;
    for (let s = 0; s < TAIL_SEGS; s++) {
      boidAngleHistory[i * TAIL_SEGS + s] = ang;
    }
  }
}

/**
 * ステージ開始時の群れ完全リセット（変更1）。
 * boot / advanceToNextStage の両方からこの関数を通す（共通化）。
 *
 * - 群れを BOIDS_INITIAL=10 体に戻す
 * - 全個体のHP・ダウン/復帰状態・フェード・衝突タイマーをクリア
 * - 尻尾角度履歴も初期化
 * - カメラズームは有効個体数=10 に下がることで自動的に寄りに戻る（追加処理不要）
 *
 * 前ステージの群れ数・HP・ダウン状態は一切持ち越さない。
 * これにより「ステージ開始は寄り、育つと引き」という弧が毎ステージ生まれる。
 */
function resetBoidsForStageStart() {
  const startWx = 250;
  const startWy = WORLD_H * 0.5;

  // N を BOIDS_INITIAL に戻し、全スロットを dead でリセットしてから有効分を起こす
  N = BOIDS_INITIAL;

  for (let i = 0; i < MAX_BOIDS; i++) {
    boidHp[i]                = BOID_MAX_HP;
    boidDead[i]              = 1;           // 一旦全滅状態に
    boidFadeTimer[i]         = 0;
    boidHitStopTimer[i]      = 0;
    boidCollisionCooldown[i] = 0;
    boidDowned[i]            = 0;
    boidDownTimer[i]         = 0;
    boidReviveTimer[i]       = 0;
    const base = i * TAIL_SEGS;
    for (let s = 0; s < TAIL_SEGS; s++) boidAngleHistory[base + s] = 0;
  }

  // BOIDS_INITIAL 体だけ有効化・配置
  for (let i = 0; i < N; i++) {
    const r   = Math.random() * 80;
    const a   = Math.random() * Math.PI * 2;
    px[i]     = startWx + Math.cos(a) * r;
    py[i]     = startWy + Math.sin(a) * r;
    const ang = Math.random() * Math.PI * 2;
    vx[i]     = Math.cos(ang) * BASE_CFG.minSpeed;
    vy[i]     = Math.sin(ang) * BASE_CFG.minSpeed;
    boidDead[i] = 0;
    const base = i * TAIL_SEGS;
    for (let s = 0; s < TAIL_SEGS; s++) boidAngleHistory[base + s] = ang;
  }
}

function countAliveBoids() {
  // 変更2: ダウン中（boidDowned）は有効個体数から除外する。
  // これによりカメラズーム・ブレス範囲・HUD表示がダウン分だけ薄まり、
  // 復帰すると盛り返す気持ちいいフィードバックになる。
  let count = 0;
  for (let i = 0; i < N; i++) {
    if (!boidDead[i] && !boidDowned[i]) count++;
  }
  return count;
}

// -----------------------------------------------------------------
// パーティクルプール（最大120個。建物増加でブレスパーティクルが増えるため）
// -----------------------------------------------------------------
const MAX_PARTICLES = 120;
const partX      = new Float32Array(MAX_PARTICLES);
const partY      = new Float32Array(MAX_PARTICLES);
const partVx     = new Float32Array(MAX_PARTICLES);
const partVy     = new Float32Array(MAX_PARTICLES);
const partLife   = new Float32Array(MAX_PARTICLES);
const partActive = new Uint8Array(MAX_PARTICLES);
// partType: 0=ブレス火花（橙〜赤）、1=出現エフェクト火花（金〜白〜薄橙）、2=死亡FX（灰〜暗赤）
const partType   = new Uint8Array(MAX_PARTICLES);

function spawnHitParticles(wx, wy) {
  // ブレスの火花は少数（2〜4個）に抑えてパフォーマンスを確保
  const count = 2 + Math.floor(Math.random() * 3);
  let spawned = 0;
  for (let i = 0; i < MAX_PARTICLES && spawned < count; i++) {
    if (partActive[i]) continue;
    partActive[i] = 1;
    partType[i]   = 0; // ブレス火花
    partX[i] = wx;
    partY[i] = wy;
    const angle = Math.random() * Math.PI * 2;
    const speed = 30 + Math.random() * 60;
    partVx[i]   = Math.cos(angle) * speed;
    partVy[i]   = Math.sin(angle) * speed;
    partLife[i] = 0.20 + Math.random() * 0.15;
    spawned++;
  }
}

function updateParticles(dt) {
  for (let i = 0; i < MAX_PARTICLES; i++) {
    if (!partActive[i]) continue;
    partX[i]    += partVx[i] * dt;
    partY[i]    += partVy[i] * dt;
    partVx[i]   *= 0.85;
    partVy[i]   *= 0.85;
    partLife[i] -= dt;
    if (partLife[i] <= 0) partActive[i] = 0;
  }
}

// -----------------------------------------------------------------
// 卵システム（ワールド座標）
// -----------------------------------------------------------------
const MAX_EGGS = 200;
const eggWx     = new Float32Array(MAX_EGGS);
const eggWy     = new Float32Array(MAX_EGGS);
const eggActive = new Uint8Array(MAX_EGGS);
let totalEggCount = 0;

function spawnEgg(wx, wy) {
  for (let i = 0; i < MAX_EGGS; i++) {
    if (eggActive[i]) continue;
    eggActive[i] = 1;
    eggWx[i] = wx;
    eggWy[i] = wy;
    return i;
  }
  return -1;
}

function collectNearbyEggs() {
  for (let e = 0; e < MAX_EGGS; e++) {
    if (!eggActive[e]) continue;
    for (let i = 0; i < N; i++) {
      if (boidDead[i]) continue;
      const dx = eggWx[e] - px[i];
      const dy = eggWy[e] - py[i];
      if (dx * dx + dy * dy < 60 * 60) {
        eggActive[e] = 0;
        totalEggCount++;
        // 卵回収 = その場で竜+1（群れ上限未満のときのみ）
        spawnBoidAtEgg(eggWx[e], eggWy[e]);
        break;
      }
    }
  }
}

/**
 * 卵の位置に竜を1体スポーンする。
 * 群れが MAX_BOIDS に達していたら何もしない（カウンタは増える）。
 * SoA の全要素を初期化して NaN/ゴミを防ぐ。
 */
function spawnBoidAtEgg(wx, wy) {
  if (N >= MAX_BOIDS) return; // 上限到達時は追加しない（エフェクトも出さない）
  // 変更2: 竜出現エフェクトをスポーン（追加に成功したときのみ）
  spawnDragonAppearEffect(wx, wy);

  const idx = N; // 新しい個体スロット
  N++;           // 有効個体数を先に増やす

  // 群れの平均速度を取得して初速に使う（群れの流れに乗せる）
  let avgVx = 0, avgVy = 0, aliveCount = 0;
  for (let i = 0; i < N - 1; i++) {
    if (!boidDead[i]) { avgVx += vx[i]; avgVy += vy[i]; aliveCount++; }
  }
  if (aliveCount > 0) {
    avgVx /= aliveCount;
    avgVy /= aliveCount;
  } else {
    // 群れが全滅していたら右方向に発射
    avgVx = BASE_CFG.minSpeed;
    avgVy = 0;
  }
  // 群れ平均速度にランダム成分を少し加える（単純コピーで整列しすぎないよう）
  const randAngle = Math.random() * Math.PI * 2;
  const randStrength = BASE_CFG.minSpeed * 0.3;
  const initVx = avgVx + Math.cos(randAngle) * randStrength;
  const initVy = avgVy + Math.sin(randAngle) * randStrength;

  // 速度の大きさを minSpeed 以上に保証
  const speed = Math.sqrt(initVx * initVx + initVy * initVy) || BASE_CFG.minSpeed;
  const scale = speed < BASE_CFG.minSpeed ? BASE_CFG.minSpeed / speed : 1;
  const finalVx = initVx * scale;
  const finalVy = initVy * scale;

  // 初期角度（尻尾の向き初期化に使う）
  const initAngle = Math.atan2(finalVy, finalVx);

  // SoA 全要素を正確に初期化
  px[idx]                   = wx;
  py[idx]                   = wy;
  vx[idx]                   = finalVx;
  vy[idx]                   = finalVy;
  boidHp[idx]               = BOID_MAX_HP;
  boidDead[idx]             = 0;
  boidFadeTimer[idx]        = 0;
  boidHitStopTimer[idx]     = 0;
  boidCollisionCooldown[idx] = 0;
  // 変更2: ダウン/復帰モデル配列の初期化（NaN/未定義防止）
  boidDowned[idx]      = 0;
  boidDownTimer[idx]   = 0;
  boidReviveTimer[idx] = 0;

  // 尻尾角度履歴：全セグメントを初期角度で埋める（NaN 防止）
  const base = idx * TAIL_SEGS;
  for (let s = 0; s < TAIL_SEGS; s++) {
    boidAngleHistory[base + s] = initAngle;
  }
}

// -----------------------------------------------------------------
// 変更2(追加): 竜やられエフェクト — HP0でダウンに入る瞬間に出す死亡FX
// 出現FX(金色)と明確に色を変え、灰/暗赤の飛散パーティクルで「やられた」を伝える。
// プール上限付き（MAX_PARTICLES 内で既存スロット流用）。多数同時でも破綻しない。
// -----------------------------------------------------------------

// 死亡FX: やられリングプール（出現FXプールとは別）
const MAX_DOWN_FX = 20;
const downFxWx     = new Float32Array(MAX_DOWN_FX);
const downFxWy     = new Float32Array(MAX_DOWN_FX);
const downFxLife   = new Float32Array(MAX_DOWN_FX);
const downFxActive = new Uint8Array(MAX_DOWN_FX);
const DOWN_FX_DURATION = 0.40; // やられリング表示時間（出現FXより短め・速く消える）
const DOWN_FX_RING_MAX = 40;   // やられリングの最大半径（出現FXの半分）

/**
 * 竜がダウンに入った瞬間に呼ぶ。
 * 灰/暗赤のパーティクル（partType=2）+ しぼむリングエフェクトをスポーンする。
 * 出現FX（金色・弾ける）と色と挙動を明確に差別化して「やられた」を伝える。
 */
function spawnDragonDownEffect(wx, wy) {
  // --- しぼむリング ---
  let slot = -1;
  for (let i = 0; i < MAX_DOWN_FX; i++) {
    if (!downFxActive[i]) { slot = i; break; }
  }
  // 空きがなければ残り寿命最小を上書き
  if (slot < 0) {
    let minLife = Infinity;
    for (let i = 0; i < MAX_DOWN_FX; i++) {
      if (downFxLife[i] < minLife) { minLife = downFxLife[i]; slot = i; }
    }
  }
  downFxActive[slot] = 1;
  downFxWx[slot]     = wx;
  downFxWy[slot]     = wy;
  downFxLife[slot]   = DOWN_FX_DURATION;

  // --- 飛散パーティクル（灰/暗赤・5〜7個）---
  // 出現FXは金色で14個だが、やられFXは灰系で少数に抑えて地味な「やられ感」を出す
  const DEATH_SPARK_COUNT = 5 + Math.floor(Math.random() * 3); // 5〜7個
  let spawned = 0;
  for (let i = 0; i < MAX_PARTICLES && spawned < DEATH_SPARK_COUNT; i++) {
    if (partActive[i]) continue;
    partActive[i] = 1;
