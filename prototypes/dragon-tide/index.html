<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>竜潮 / Dragon Tide — Phase 1</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #08101a;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #stage { display: block; width: 100%; height: 100%; }

  /* FPS HUD (右上、デバッグ用) */
  #hud {
    position: fixed;
    top: env(safe-area-inset-top, 8px);
    right: 8px;
    padding: 6px 8px;
    background: rgba(8, 16, 26, 0.70);
    border: 1px solid rgba(120, 200, 255, 0.20);
    border-radius: 6px;
    font-family: -apple-system, BlinkMacSystemFont, monospace;
    font-size: 11px;
    line-height: 1.6;
    color: #fff;
    pointer-events: none;
    min-width: 100px;
    text-align: right;
  }
  #hud .k { color: #6fa6c8; margin-right: 4px; }

  /* 隊形切替ボタン — 画面下部 */
  #formation-bar {
    position: fixed;
    bottom: 0;
    left: 0; right: 0;
    height: calc(20vh + env(safe-area-inset-bottom, 0px));
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    /* タッチ開始を canvas に通すため pointer-events を制御 */
    pointer-events: none;
  }
  .formation-btn {
    pointer-events: auto;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: 2px solid rgba(120, 200, 255, 0.35);
    background: rgba(10, 22, 38, 0.80);
    color: #d8e6f2;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .formation-btn.active {
    background: rgba(30, 90, 138, 0.90);
    border-color: #6fc0ff;
    box-shadow: 0 0 12px rgba(111, 192, 255, 0.40);
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<!-- FPS表示 (デバッグ用、右上) -->
<div id="hud">
  <span class="k">FPS</span><span id="h-fps">--</span><br/>
  <span class="k">avg</span><span id="h-avg">--</span>
</div>

<!-- 隊形ボタン: ●（密集）/ ∴（散開）/ ○（円環）-->
<div id="formation-bar">
  <button class="formation-btn active" id="btn-tight"   data-formation="tight">●</button>
  <button class="formation-btn"        id="btn-spread"  data-formation="spread">∴</button>
  <button class="formation-btn"        id="btn-ring"    data-formation="ring">○</button>
</div>

<script>
"use strict";

/* ============================================================
 * 竜潮 / Dragon Tide — Phase 1: The Toy
 *
 * 検証目標:
 *   「敵ゼロ・スコアゼロ・無限の空モードだけで、
 *    テスターが平均3分以上触り続けるか」
 *
 * 実装方針 (GDD §11, TDD §1):
 *   - Boidsプロト資産をベースに隊形3種・触覚フィードバックを追加
 *   - data/balance/dragon-tide.json の boids セクションを fetch 使用
 *     （失敗時はフォールバック値を内包）
 *   - setInterval(16ms) 固定、rAF 不使用
 *   - Canvas 2D のみ、外部ライブラリ禁止
 * ============================================================ */

// -----------------------------------------------------------------
// バランスデータ: fetch 失敗時のフォールバック値
// (ソース: data/balance/dragon-tide.json §boids)
// -----------------------------------------------------------------
const BALANCE_FALLBACK = {
  base: {
    perception:       40,
    separationRadius: 18,
    maxSpeed:         160,
    minSpeed:         60,
    maxForce:         320,
    wSeparation:      1.8,
    wAlignment:       1.0,
    wCohesion:        0.9,
    wLeader:          1.6,
    leaderSeekDist:   80,
    pathMaxPoints:    240,
    pathMinSegment:   8,
    leaderSpeed:      220,
    idleWanderRadius: 120,
    fixedStepMs:      16,
    maxDtMs:          64,
  },
  formationOverrides: {
    tight:  { wCohesion: 2.2, wSeparation: 0.8, perception: 30, separationRadius: 12 },
    spread: { wCohesion: 0.4, wSeparation: 2.5, perception: 55, separationRadius: 28 },
    ring:   { wCohesion: 1.5, wSeparation: 1.2, perception: 45, separationRadius: 22, ringRadius: 80 },
  },
  transitionSeconds:  0.15,
  transitionJitterMax: 0.08,
};

// -----------------------------------------------------------------
// ランタイム設定: fetch 後に BASE_CFG へ注入
// -----------------------------------------------------------------
let BASE_CFG = { ...BALANCE_FALLBACK.base };
let FORMATION_OVERRIDES = { ...BALANCE_FALLBACK.formationOverrides };
let TRANSITION_SECS  = BALANCE_FALLBACK.transitionSeconds;
let JITTER_MAX       = BALANCE_FALLBACK.transitionJitterMax;

// バランス JSON を非同期 fetch（失敗時はフォールバックのまま続行）
(async () => {
  try {
    // prototypes から実行した場合の相対パス
    const resp = await fetch("../../data/balance/dragon-tide.json");
    if (!resp.ok) throw new Error("fetch status " + resp.status);
    const data = await resp.json();
    if (data.boids) {
      BASE_CFG          = { ...BALANCE_FALLBACK.base,             ...data.boids.base };
      FORMATION_OVERRIDES = { ...BALANCE_FALLBACK.formationOverrides, ...data.boids.formationOverrides };
      TRANSITION_SECS   = data.boids.transitionSeconds    ?? TRANSITION_SECS;
      JITTER_MAX        = data.boids.transitionJitterMax  ?? JITTER_MAX;
    }
  } catch (_e) {
    // フォールバック値をそのまま使用。ゲームは続行可能。
  }
})();

// -----------------------------------------------------------------
// Canvas セットアップ
// -----------------------------------------------------------------
const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });

let viewW = 0, viewH = 0, dpr = 1;
let bottomUIHeight = 0; // 画面下 20% のボタン領域高さ

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2); // DPR 2 キャップ
  viewW = window.innerWidth;
  viewH = window.innerHeight;
  bottomUIHeight = viewH * 0.20;
  canvas.width  = Math.floor(viewW * dpr);
  canvas.height = Math.floor(viewH * dpr);
  canvas.style.width  = viewW + "px";
  canvas.style.height = viewH + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", resize);
resize();

// -----------------------------------------------------------------
// Spatial Hash (プロトから流用・セルサイズ = perception)
// -----------------------------------------------------------------
const grid = new Map();

function gridKey(cx, cy) {
  // 整数ハッシュ: 大量セルでも衝突が少ない素数乗算
  return (cx * 73856093 ^ cy * 19349663);
}
function gridClear() { grid.clear(); }
function gridInsert(index, x, y, cellSize) {
  const cx = (x / cellSize) | 0;
  const cy = (y / cellSize) | 0;
  const k  = gridKey(cx, cy);
  let bucket = grid.get(k);
  if (!bucket) { bucket = []; grid.set(k, bucket); }
  bucket.push(index);
}
function gridQuery(x, y, cellSize, out) {
  out.length = 0;
  const cx = (x / cellSize) | 0;
  const cy = (y / cellSize) | 0;
  for (let dy = -1; dy <= 1; dy++) {
    for (let dx = -1; dx <= 1; dx++) {
      const b = grid.get(gridKey(cx + dx, cy + dy));
      if (b) for (let i = 0; i < b.length; i++) out.push(b[i]);
    }
  }
}

// -----------------------------------------------------------------
// Boids SoA (Structure of Arrays)
// -----------------------------------------------------------------
const MAX_BOIDS = 20; // フェーズ1: 固定20体
let N = 0;
let px, py, vx, vy;

// 隊形補間用: 個体ごとに独立した lerp 進捗 [0..1] と遅延 (秒)
// これにより「ざわっ」とした有機的な再配置感を生む (GDD §11.3)
let formationLerp;   // Float32Array: lerp進捗
let formationDelay;  // Float32Array: 各個体の遅延秒数

function initBoids() {
  N = MAX_BOIDS;
  px             = new Float32Array(N);
  py             = new Float32Array(N);
  vx             = new Float32Array(N);
  vy             = new Float32Array(N);
  formationLerp  = new Float32Array(N);
  formationDelay = new Float32Array(N);

  // 初期配置: 画面中央付近でランダム分布
  const cx = viewW * 0.5;
  const cy = viewH * 0.5;
  for (let i = 0; i < N; i++) {
    const r = Math.random() * 80;
    const a = Math.random() * Math.PI * 2;
    px[i] = cx + Math.cos(a) * r;
    py[i] = cy + Math.sin(a) * r;
    const ang = Math.random() * Math.PI * 2;
    vx[i] = Math.cos(ang) * BASE_CFG.minSpeed;
    vy[i] = Math.sin(ang) * BASE_CFG.minSpeed;
    formationLerp[i]  = 1.0;
    formationDelay[i] = 0;
  }
}

// -----------------------------------------------------------------
// リーダー & ウェイポイントパス
// -----------------------------------------------------------------
// リングバッファ方式で GC を最小化 (TDD §4.3)
const PATH_MAX = 240;
const pathBuf = new Float32Array(PATH_MAX * 2); // [x0,y0, x1,y1, ...]
let pathHead = 0; // 次に書き込むインデックス（0..PATH_MAX-1）
let pathLen  = 0; // 有効な点数
let leaderPathConsumeIdx = 0; // リーダーが次に目指すウェイポイントの論理インデックス

// パスバッファからの読み取り（ringbuffer 考慮）
function pathGet(logicalIdx) {
  // logicalIdx 0 = 最古, pathLen-1 = 最新
  const ring = (pathHead - pathLen + logicalIdx + PATH_MAX) % PATH_MAX;
  return { x: pathBuf[ring * 2], y: pathBuf[ring * 2 + 1] };
}

function pathClear() {
  pathLen  = 0;
  pathHead = 0;
  // リーダーの追従インデックスも一緒にリセット（新ライン開始時に先頭から追う）
  leaderPathConsumeIdx = 0;
}

function pathPush(x, y) {
  if (pathLen > 0) {
    const last = pathGet(pathLen - 1);
    const dx = x - last.x, dy = y - last.y;
    // 過密点の間引き: GDD 指定 30px 以上離れた点だけ記録
    // (プロトの pathMinSegment は 8px だがフェーズ1仕様は 30px を優先)
    const minSeg = Math.max(BASE_CFG.pathMinSegment, 30);
    if (dx * dx + dy * dy < minSeg * minSeg) return;
  }
  pathBuf[pathHead * 2]     = x;
  pathBuf[pathHead * 2 + 1] = y;
  pathHead = (pathHead + 1) % PATH_MAX;
  if (pathLen < PATH_MAX) pathLen++;
}

const leader = { x: 0, y: 0, vx: 0, vy: 0 };

function resetLeader() {
  leader.x = viewW * 0.5;
  leader.y = viewH * 0.45;
  leader.vx = 0;
  leader.vy = 0;
  pathClear();
  // アイドル旋回の初期角度
  idleAngle = 0;
}

// -----------------------------------------------------------------
// 隊形管理
// -----------------------------------------------------------------
const FORMATIONS = ["tight", "spread", "ring"];
let currentFormation = "tight";
let prevFormation    = "tight";

function setFormation(name) {
  if (name === currentFormation) return;
  prevFormation    = currentFormation;
  currentFormation = name;

  // 個体ごとにランダム遅延を設定 → 「ざわっ」感 (GDD §11.3)
  for (let i = 0; i < N; i++) {
    formationLerp[i]  = 0;
    formationDelay[i] = Math.random() * JITTER_MAX;
  }

  // 振動フィードバック (GDD §11.3 中パルス 30ms)
  hapticPulse(30);

  updateFormationButtons(name);
}

function updateFormationButtons(name) {
  document.querySelectorAll(".formation-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.formation === name);
  });
}

document.querySelectorAll(".formation-btn").forEach(btn => {
  btn.addEventListener("pointerdown", (e) => {
    e.stopPropagation();
    setFormation(btn.dataset.formation);
  });
});

// -----------------------------------------------------------------
// 触覚フィードバック (GDD §11, TDD haptics.js)
// navigator.vibrate 非対応ブラウザでは no-op
// -----------------------------------------------------------------
function hapticPulse(durationMs) {
  try { navigator.vibrate?.(durationMs); } catch (_) {}
}

// -----------------------------------------------------------------
// 入力システム
// 画面下 20% からの入力 → ボタン領域（canvas では処理しない）
// それ以外 → ライン描画 (GDD §10)
// -----------------------------------------------------------------
let inputMode    = "NONE"; // "DRAW" | "UI" | "NONE"
let isDrawing    = false;

// 指先の光リング (GDD §11.1)
let touchRing = { active: false, x: 0, y: 0, opacity: 0 };

// ライン残光 (GDD §11.2)
// 各区間に誕生時刻を持たせて 1.2 秒でフェードアウト
const TRAIL_LIFETIME = 1.2; // 秒
const trailPoints = []; // { x, y, bornAt }
let trailMaxPoints = 400;

function addTrailPoint(x, y, now) {
  if (trailPoints.length >= trailMaxPoints) trailPoints.shift();
  trailPoints.push({ x, y, bornAt: now });
}

function inputStart(x, y, now) {
  // 押し始めの y 座標で操作モードを確定 (GDD §4.2、touchstart で一度きり判定)
  if (y >= viewH - bottomUIHeight) {
    inputMode = "UI";
    return;
  }
  inputMode = "DRAW";
  isDrawing = true;
  pathClear();
  pathPush(x, y);
  addTrailPoint(x, y, now);

  // 指先の光リングを即時表示 (GDD §11.1)
  touchRing.active  = true;
  touchRing.x       = x;
  touchRing.y       = y;
  touchRing.opacity = 0.30;

  // タッチ開始の弱パルス (GDD §11.1 10ms)
  hapticPulse(10);
}

function inputMove(x, y, now) {
  if (inputMode !== "DRAW") return;
  pathPush(x, y);
  addTrailPoint(x, y, now);
  touchRing.x = x;
  touchRing.y = y;
}

function inputEnd() {
  isDrawing = false;
  inputMode = "NONE";
  touchRing.active = false;
}

canvas.addEventListener("touchstart", (e) => {
  const t = e.touches[0];
  inputStart(t.clientX, t.clientY, performance.now());
  e.preventDefault();
}, { passive: false });

canvas.addEventListener("touchmove", (e) => {
  const t = e.touches[0];
  inputMove(t.clientX, t.clientY, performance.now());
  e.preventDefault();
}, { passive: false });

canvas.addEventListener("touchend",    (e) => { inputEnd(); e.preventDefault(); }, { passive: false });
canvas.addEventListener("touchcancel", (e) => { inputEnd(); e.preventDefault(); }, { passive: false });

// 開発用マウスフォールバック
canvas.addEventListener("mousedown",  (e) => inputStart(e.clientX, e.clientY, performance.now()));
canvas.addEventListener("mousemove",  (e) => { if (isDrawing) inputMove(e.clientX, e.clientY, performance.now()); });
canvas.addEventListener("mouseup",    () => inputEnd());
canvas.addEventListener("mouseleave", () => inputEnd());

// -----------------------------------------------------------------
// アイドル旋回 (GDD §11.5-2 / §11.5-3: 眺める体験の成立)
// ライン入力がない間、群れは緩やかに旋回し続ける
// -----------------------------------------------------------------
let idleAngle = 0;
const IDLE_ANGULAR_SPEED = 0.35; // rad/s — ゆっくりした旋回感

function getIdleLeaderTarget(dt) {
  idleAngle += IDLE_ANGULAR_SPEED * dt;
  const r = BASE_CFG.idleWanderRadius;
  return {
    x: viewW * 0.5 + Math.cos(idleAngle) * r,
    y: viewH * 0.45 + Math.sin(idleAngle) * r * 0.6, // 縦持ち画面では縦を少し縮める
  };
}

// -----------------------------------------------------------------
// Simulation step
// -----------------------------------------------------------------
const neighbours = []; // 毎フレーム再利用するスクラッチ配列（GCゼロ）

function buildFormationParams() {
  const ov = FORMATION_OVERRIDES[currentFormation] ?? {};
  return {
    perception:       ov.perception       ?? BASE_CFG.perception,
    separationRadius: ov.separationRadius ?? BASE_CFG.separationRadius,
    wSeparation:      ov.wSeparation      ?? BASE_CFG.wSeparation,
    wAlignment:       BASE_CFG.wAlignment,
    wCohesion:        ov.wCohesion        ?? BASE_CFG.wCohesion,
    ringRadius:       ov.ringRadius       ?? 0,
  };
}

function buildPrevFormationParams() {
  const ov = FORMATION_OVERRIDES[prevFormation] ?? {};
  return {
    perception:       ov.perception       ?? BASE_CFG.perception,
    separationRadius: ov.separationRadius ?? BASE_CFG.separationRadius,
    wSeparation:      ov.wSeparation      ?? BASE_CFG.wSeparation,
    wAlignment:       BASE_CFG.wAlignment,
    wCohesion:        ov.wCohesion        ?? BASE_CFG.wCohesion,
    ringRadius:       ov.ringRadius       ?? 0,
  };
}

// 線形補間
function lerpVal(a, b, t) { return a + (b - a) * t; }

function simStep(dt) {
  // --- リーダー位置の更新 ---
  updateLeader(dt);

  // --- 個体ごとの隊形補間進捗更新 ---
  // 切替開始から TRANSITION_SECS + 各自の jitter 秒で lerp が 1 に達する
  for (let i = 0; i < N; i++) {
    if (formationDelay[i] > 0) {
      formationDelay[i] -= dt;
    } else if (formationLerp[i] < 1) {
      // lerp の速度: 0→1 を TRANSITION_SECS で通過
      formationLerp[i] = Math.min(1, formationLerp[i] + dt / TRANSITION_SECS);
    }
  }

  // --- 現在と前回の隊形パラメータ ---
  const paramsNext = buildFormationParams();
  const paramsPrev = buildPrevFormationParams();

  // --- Spatial Hash 構築 (perception は現在隊形のものを使用) ---
  gridClear();
  for (let i = 0; i < N; i++) gridInsert(i, px[i], py[i], paramsNext.perception);

  // --- 各 Boid のステアリング力計算 ---
  for (let i = 0; i < N; i++) {
    const t = formationLerp[i];

    // 隊形パラメータを個体ごとの lerp 進捗で補間
    const perc     = lerpVal(paramsPrev.perception,       paramsNext.perception,       t);
    const sepR     = lerpVal(paramsPrev.separationRadius, paramsNext.separationRadius, t);
    const wSep     = lerpVal(paramsPrev.wSeparation,      paramsNext.wSeparation,      t);
    const wAli     = paramsNext.wAlignment;
    const wCoh     = lerpVal(paramsPrev.wCohesion,        paramsNext.wCohesion,        t);
    const ringR    = lerpVal(paramsPrev.ringRadius,       paramsNext.ringRadius,       t);

    const perc2 = perc * perc;
    const sep2  = sepR * sepR;

    const xi = px[i], yi = py[i];
    let sepX = 0, sepY = 0;
    let aliX = 0, aliY = 0;
    let cohX = 0, cohY = 0;
    let nAli = 0, nCoh = 0;

    gridQuery(xi, yi, paramsNext.perception, neighbours);
    for (let k = 0; k < neighbours.length; k++) {
      const j = neighbours[k];
      if (j === i) continue;
      const dx = xi - px[j], dy = yi - py[j];
      const d2 = dx * dx + dy * dy;
      if (d2 > perc2 || d2 === 0) continue;
      if (d2 < sep2) {
        const invD = 1 / Math.sqrt(d2);
        sepX += dx * invD;
        sepY += dy * invD;
      }
      aliX += vx[j]; aliY += vy[j]; nAli++;
      cohX += px[j]; cohY += py[j]; nCoh++;
    }

    let ax = 0, ay = 0;

    ax += sepX * wSep * 80;
    ay += sepY * wSep * 80;

    if (nAli > 0) {
      const inv = 1 / nAli;
      ax += (aliX * inv - vx[i]) * wAli;
      ay += (aliY * inv - vy[i]) * wAli;
    }
    if (nCoh > 0) {
      const inv = 1 / nCoh;
      ax += (cohX * inv - xi) * wCoh;
      ay += (cohY * inv - yi) * wCoh;
    }

    // リーダー引力: 通常はリーダー点へ seek、円環は ringRadius の円周上を目標 (TDD §5.2)
    {
      const ldx = leader.x - xi, ldy = leader.y - yi;
      const ld  = Math.sqrt(ldx * ldx + ldy * ldy) || 1;
      if (ringR > 0) {
        // リーダーから ringRadius 離れた点（リーダー方向の逆）が目標
        const targetX = leader.x - (ldx / ld) * ringR;
        const targetY = leader.y - (ldy / ld) * ringR;
        ax += (targetX - xi) * BASE_CFG.wLeader * 1.5;
        ay += (targetY - yi) * BASE_CFG.wLeader * 1.5;
      } else {
        ax += (ldx / ld) * BASE_CFG.wLeader * 120;
        ay += (ldy / ld) * BASE_CFG.wLeader * 120;
      }
    }

    // 加速度キャップ
    const am = Math.sqrt(ax * ax + ay * ay);
    if (am > BASE_CFG.maxForce) { const s = BASE_CFG.maxForce / am; ax *= s; ay *= s; }

    // 速度積分
    let nvx = vx[i] + ax * dt;
    let nvy = vy[i] + ay * dt;
    const sp = Math.sqrt(nvx * nvx + nvy * nvy);
    if      (sp > BASE_CFG.maxSpeed) { const s = BASE_CFG.maxSpeed / sp; nvx *= s; nvy *= s; }
    else if (sp < BASE_CFG.minSpeed && sp > 0.0001) { const s = BASE_CFG.minSpeed / sp; nvx *= s; nvy *= s; }
    else if (sp <= 0.0001) { nvx = BASE_CFG.minSpeed; nvy = 0; }
    vx[i] = nvx; vy[i] = nvy;

    // 位置積分 (トーラス折り返しで個体が消えない)
    let nx = xi + nvx * dt;
    let ny = yi + nvy * dt;
    if (nx < -10)             nx = viewW + 10;
    else if (nx > viewW + 10) nx = -10;
    if (ny < -10)             ny = viewH + 10;
    else if (ny > viewH + 10) ny = -10;
    px[i] = nx; py[i] = ny;
  }
}

function updateLeader(dt) {
  if (pathLen > 0) {
    // パスの最新点に向かって進む (プロトの critically-damped seek を踏襲)
    if (leaderPathConsumeIdx >= pathLen) leaderPathConsumeIdx = pathLen - 1;

    let tgt = pathGet(Math.min(leaderPathConsumeIdx, pathLen - 1));
    let dx = tgt.x - leader.x, dy = tgt.y - leader.y;
    let d2 = dx * dx + dy * dy;

    // 通過判定: 24px 以内に入ったら次のウェイポイントへ
    while (d2 < 24 * 24 && leaderPathConsumeIdx < pathLen - 1) {
      leaderPathConsumeIdx++;
      tgt = pathGet(leaderPathConsumeIdx);
      dx = tgt.x - leader.x; dy = tgt.y - leader.y;
      d2 = dx * dx + dy * dy;
    }

    const d = Math.sqrt(d2) || 1;
    const desiredVx = (dx / d) * BASE_CFG.leaderSpeed;
    const desiredVy = (dy / d) * BASE_CFG.leaderSpeed;
    // critically-damped: 目標速度へスムーズに収束
    leader.vx += (desiredVx - leader.vx) * Math.min(1, dt * 8);
    leader.vy += (desiredVy - leader.vy) * Math.min(1, dt * 8);
  } else {
    // アイドル: 緩やかに円を描く (GDD §11.5-2 眺める体験)
    const target = getIdleLeaderTarget(dt);
    leader.vx += ((target.x - leader.x) * 0.8 - leader.vx) * Math.min(1, dt * 2.0);
    leader.vy += ((target.y - leader.y) * 0.8 - leader.vy) * Math.min(1, dt * 2.0);
  }

  leader.x += leader.vx * dt;
  leader.y += leader.vy * dt;
  // 画面端クランプ（トーラスにはしない — リーダーが消えると操作感が壊れる）
  leader.x = Math.max(0, Math.min(viewW, leader.x));
  leader.y = Math.max(0, Math.min(viewH, leader.y));
}

// -----------------------------------------------------------------
// 描画
// -----------------------------------------------------------------
function render(now) {
  // 背景クリア
  ctx.fillStyle = "#08101a";
  ctx.fillRect(0, 0, viewW, viewH);

  drawTrail(now);
  drawBoids();
  drawTouchRing(now);
}

// ライン残光 (GDD §11.2: 1.2秒で消える水墨感)
function drawTrail(now) {
  if (trailPoints.length < 2) return;

  // 古い点を削除
  const cutoff = now - TRAIL_LIFETIME * 1000;
  while (trailPoints.length > 0 && trailPoints[0].bornAt < cutoff) {
    trailPoints.shift();
  }
  if (trailPoints.length < 2) return;

  // 区間ごとに透明度を変えて描画
  for (let i = 1; i < trailPoints.length; i++) {
    const p = trailPoints[i];
    const prev = trailPoints[i - 1];
    // 生存割合: 0=誕生 → 1=消滅
    const ageRatio = (now - p.bornAt) / (TRAIL_LIFETIME * 1000);
    const alpha    = Math.max(0, 1 - ageRatio) * 0.35;

    ctx.strokeStyle = `rgba(140, 200, 255, ${alpha.toFixed(3)})`;
    ctx.lineWidth   = 2.5;
    ctx.lineCap     = "round";
    ctx.beginPath();
    ctx.moveTo(prev.x, prev.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  }
}

// タッチ開始時の指先リング (GDD §11.1)
function drawTouchRing(now) {
  if (!touchRing.active) return;
  ctx.strokeStyle = `rgba(200, 230, 255, ${touchRing.opacity.toFixed(3)})`;
  ctx.lineWidth   = 1.5;
  ctx.beginPath();
  ctx.arc(touchRing.x, touchRing.y, 20, 0, Math.PI * 2);
  ctx.stroke();
}

// 群れの描画 (GDD §2.3: 半透明シルエット)
function drawBoids() {
  // 単一 fillStyle でバッチ描画 — iOS Safari では state 変更が最もコスト高い
  ctx.fillStyle = "rgba(120, 180, 255, 0.75)";

  for (let i = 0; i < N; i++) {
    const x = px[i], y = py[i];
    const angle = Math.atan2(vy[i], vx[i]);
    const cosA  = Math.cos(angle);
    const sinA  = Math.sin(angle);

    // ctx.save/restore を避け setTransform で直接変換 (TDD §5 レンダリング最適化)
    ctx.setTransform(dpr * cosA, dpr * sinA, -dpr * sinA, dpr * cosA, x * dpr, y * dpr);
    ctx.beginPath();
    // 竜シルエット: やや細長い三角形（後でgraphics-engineerが磨く）
    ctx.moveTo(9,  0);
    ctx.lineTo(-6,  4);
    ctx.lineTo(-3,  0);
    ctx.lineTo(-6, -4);
    ctx.closePath();
    ctx.fill();
  }

  // グローバル変換を元に戻す
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// -----------------------------------------------------------------
// FPS 計測
// -----------------------------------------------------------------
let fpsFrames = 0;
let fpsLast   = performance.now();
let fpsEma    = 0; // EMA
const hudFps  = document.getElementById("h-fps");
const hudAvg  = document.getElementById("h-avg");

function tickFps(now) {
  fpsFrames++;
  const elapsed = now - fpsLast;
  if (elapsed >= 500) {
    const fps  = (fpsFrames * 1000) / elapsed;
    fpsEma     = fpsEma === 0 ? fps : fpsEma * 0.7 + fps * 0.3;
    fpsFrames  = 0;
    fpsLast    = now;
    hudFps.textContent = fps.toFixed(1);
    hudAvg.textContent = fpsEma.toFixed(1);
  }
}

// -----------------------------------------------------------------
// ゲームループ (setInterval 固定 16ms — TDD §2.1)
// -----------------------------------------------------------------
let lastTickTs = performance.now();

function tick() {
  const now  = performance.now();
  let dtMs   = now - lastTickTs;
  if (dtMs > BASE_CFG.maxDtMs) dtMs = BASE_CFG.maxDtMs; // 巨大 dt のクランプ
  lastTickTs = now;
  const dt   = dtMs / 1000;

  // update: ロジックのみ。Canvas API に触れない (TDD §2.2)
  simStep(dt);

  // render: 描画のみ。状態を書き換えない (TDD §2.2)
  render(now);

  tickFps(now);
}

// タブ復帰時に dt をリセット (プロトパターン踏襲)
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) lastTickTs = performance.now();
});

// -----------------------------------------------------------------
// 起動
// -----------------------------------------------------------------
// DOMContentLoaded 後に起動することで、ビューポートが確定した状態で
// resize() → initBoids() を呼ぶ（プレビュー環境での timing 問題を回避）
function boot() {
  resize(); // viewW/viewH を確定させてから boids を初期化
  initBoids();
  resetLeader();
  setInterval(tick, BASE_CFG.fixedStepMs);
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", boot);
} else {
  boot();
}
</script>
</body>
