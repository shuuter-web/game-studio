<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ARCANE ARMOR — 魔導機甲戦線</title>
<style>
  :root {
    --gold: #f2c14e; --gold-deep: #b9862a; --cyan: #6ef3ff; --blue: #3f8cff; --red: #ff5a4d; --magenta: #ff5cf0;
    --ink: #0a101c; --panel: rgba(10, 16, 28, .74); --line: rgba(255, 255, 255, .14);
    --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070b14; color: #eef3ff;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Noto Sans JP", system-ui, sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: none; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .layer { position: fixed; inset: 0; pointer-events: none; }
  #vignette { background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(3, 6, 14, .55) 100%); }
  #flash { background: #fff; opacity: 0; }
  #dim { background: radial-gradient(ellipse at 50% 45%, rgba(8, 14, 30, .05) 30%, rgba(4, 8, 20, .62) 100%); opacity: 0; transition: opacity .25s; }
  body.commanding #dim { opacity: 1; }
  .hidden { display: none !important; }

  /* ---------- 上部HUD ---------- */
  #hud { position: fixed; left: 0; right: 0; top: 0; padding: calc(8px + var(--safe-top)) 10px 0; display: flex; gap: 8px;
    align-items: flex-start; justify-content: center; pointer-events: none; transition: opacity .3s, transform .3s; }
  .army { flex: 1 1 0; max-width: 340px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 6px 10px 8px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .army .row { display: flex; justify-content: space-between; align-items: baseline; font-size: 11px; letter-spacing: .08em; }
  .army .name { font-weight: 800; }
  .army .count { font-weight: 900; font-size: 15px; font-style: italic; }
  .army .bar { height: 8px; border-radius: 4px; background: rgba(255, 255, 255, .1); margin-top: 4px; overflow: hidden; }
  .army .bar i { display: block; height: 100%; width: 100%; border-radius: 4px; transition: width .25s; }
  #armyPlayer .name, #armyPlayer .count { color: var(--cyan); }
  #armyPlayer .bar i { background: linear-gradient(90deg, #2f7dff, #6ef3ff); box-shadow: 0 0 10px #4ad; }
  #armyEnemy .row { flex-direction: row-reverse; }
  #armyEnemy .name, #armyEnemy .count { color: #ff8d7e; }
  #armyEnemy .bar i { background: linear-gradient(270deg, #ff3b3b, #ff9a5c); box-shadow: 0 0 10px #d44; margin-left: auto; }
  #clock { flex: 0 0 auto; min-width: 74px; text-align: center; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 4px 8px 5px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #clockTime { font-size: 20px; font-weight: 900; font-style: italic; letter-spacing: .04em; line-height: 1.1; }
  #clockSeed { font-size: 8px; opacity: .5; letter-spacing: .06em; }

  #tools { position: fixed; right: 10px; top: calc(118px + var(--safe-top)); display: flex; flex-direction: column; gap: 6px; }
  .tool { pointer-events: auto; width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel);
    color: #dfe8ff; font-size: 12px; font-weight: 800; display: grid; place-items: center; cursor: pointer; }
  .tool:active { transform: scale(.94); }

  /* ---------- 指令ゲージと手札 ---------- */
  #bottom { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 8px calc(8px + var(--safe-bottom)); pointer-events: none;
    transition: opacity .3s, transform .3s; }
  #bottomInner { margin: 0 auto; }
  #detail { background: var(--panel); border: 1px solid rgba(242, 193, 78, .5); border-radius: 12px; padding: 9px 11px; margin-bottom: 8px;
    display: none; gap: 10px; align-items: center; pointer-events: auto; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  body.commanding #detail { display: flex; }
  #detailText { flex: 1; min-width: 0; }
  #detailName { font-weight: 900; font-size: 15px; letter-spacing: .06em; }
  #detailName.ally { color: var(--cyan); } #detailName.foe { color: #ff8d7e; }
  #detailRole { font-size: 11px; line-height: 1.45; opacity: .8; margin-top: 1px; }
  #detailSkill { font-weight: 900; font-size: 13px; color: var(--gold); letter-spacing: .06em; margin-top: 5px; }
  #detailDesc { font-size: 11.5px; line-height: 1.45; opacity: .95; margin-top: 1px; }
  .btn { pointer-events: auto; border: 0; border-radius: 10px; font: inherit; font-weight: 900; letter-spacing: .12em; cursor: pointer;
    padding: 11px 16px; color: #1a1305; background: linear-gradient(180deg, #ffe08a, var(--gold) 55%, var(--gold-deep));
    box-shadow: 0 3px 0 #6d4c12, 0 6px 16px rgba(0, 0, 0, .45); white-space: nowrap; }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #6d4c12; }
  .btn.ghost { background: rgba(255, 255, 255, .08); color: #dfe8ff; box-shadow: inset 0 0 0 1px var(--line); }
  .btn:disabled { filter: grayscale(1) brightness(.6); letter-spacing: .02em; font-size: 12px; }
  #commandBar { display: flex; align-items: center; gap: 12px; }
  #btnPause { min-width: 120px; padding: 13px 18px; background: rgba(10, 16, 28, .8); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  body.commanding #btnPause { color: #1a1305; background: linear-gradient(180deg, #ffe08a, var(--gold) 55%, var(--gold-deep)); box-shadow: 0 3px 0 #6d4c12; }
  #charges { flex: 1; display: flex; align-items: center; gap: 8px; font-size: 10px; letter-spacing: .14em; font-weight: 800; color: #cfd9f5; text-shadow: 0 1px 3px #000; }
  #pips { flex: 1; display: flex; gap: 6px; }
  #pips div { flex: 1; height: 12px; border-radius: 6px; background: rgba(8, 12, 22, .7); border: 1px solid var(--line); overflow: hidden; }
  #pips i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--gold-deep), var(--gold)); }
  #pips div.full { border-color: var(--gold); box-shadow: 0 0 10px rgba(242, 193, 78, .7); }
  #pips div.full i { background: linear-gradient(90deg, #ffe08a, #fff3c4); }
  #bottomInner { max-width: 640px; margin: 0 auto; }
  #phase { position: fixed; left: 0; right: 0; top: calc(78px + var(--safe-top)); text-align: center; pointer-events: none; opacity: 0;
    transform: scaleX(1.3); transition: opacity .25s, transform .25s; }
  body.commanding #phase { opacity: 1; transform: none; }
  #phase span { display: inline-block; padding: 5px 22px; font-weight: 900; font-style: italic; letter-spacing: .16em; font-size: 13px; color: var(--gold);
    background: linear-gradient(90deg, transparent, rgba(8, 12, 24, .88) 20%, rgba(8, 12, 24, .88) 80%, transparent);
    border-top: 1px solid rgba(242, 193, 78, .6); border-bottom: 1px solid rgba(242, 193, 78, .6); text-shadow: 0 0 12px rgba(242, 193, 78, .7); }

  /* ---------- カットイン ---------- */
  #cutins { position: fixed; left: 0; right: 0; top: calc(104px + var(--safe-top)); pointer-events: none; }
  .cutin { position: relative; height: 44px; margin-bottom: 6px; overflow: hidden; }
  .cutin .band { position: absolute; inset: 0; transform: skewX(-18deg) translateX(-120%); animation: bandIn 1.5s cubic-bezier(.2, .9, .2, 1) forwards; }
  .cutin.player .band { background: linear-gradient(90deg, rgba(20, 70, 190, .0), rgba(26, 96, 230, .9) 30%, rgba(110, 243, 255, .85) 70%, rgba(110, 243, 255, 0)); }
  .cutin.enemy .band { background: linear-gradient(270deg, rgba(160, 20, 30, 0), rgba(205, 38, 46, .9) 30%, rgba(255, 110, 200, .8) 70%, rgba(255, 110, 200, 0));
    transform: skewX(-18deg) translateX(120%); animation-name: bandInRight; }
  .cutin .label { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 9%; opacity: 0;
    animation: labelIn 1.5s ease-out forwards; text-shadow: 0 2px 0 rgba(0, 0, 0, .55), 0 0 14px rgba(0, 0, 0, .5); }
  .cutin.enemy .label { align-items: flex-end; }
  .cutin .who { font-size: 9px; letter-spacing: .3em; font-weight: 800; opacity: .9; }
  .cutin .what { font-size: 20px; font-weight: 900; font-style: italic; letter-spacing: .08em; line-height: 1.05; }
  @keyframes bandIn { 0% { transform: skewX(-18deg) translateX(-120%); } 18%, 75% { transform: skewX(-18deg) translateX(0); } 100% { transform: skewX(-18deg) translateX(120%); } }
  @keyframes bandInRight { 0% { transform: skewX(-18deg) translateX(120%); } 18%, 75% { transform: skewX(-18deg) translateX(0); } 100% { transform: skewX(-18deg) translateX(-120%); } }
  @keyframes labelIn { 0%, 10% { opacity: 0; letter-spacing: .5em; } 22%, 72% { opacity: 1; letter-spacing: normal; } 100% { opacity: 0; } }

  #numbers .num { position: absolute; font-weight: 900; font-style: italic; font-size: 15px; color: #fff; text-shadow: 0 1px 0 #000, 0 0 6px rgba(0, 0, 0, .8);
    animation: numRise .8s ease-out forwards; will-change: transform, opacity; }
  #numbers .num.big { font-size: 22px; color: #ffe27a; }
  #numbers .num.ally { color: #ff9c8f; }
  #numbers .num.miss { color: #bfe9ff; font-size: 12px; }
  @keyframes numRise { 0% { transform: translate(-50%, 0) scale(.6); opacity: 0; } 15% { transform: translate(-50%, -10px) scale(1.25); opacity: 1; }
    100% { transform: translate(-50%, -44px) scale(1); opacity: 0; } }

  /* ---------- オーバーレイ ---------- */
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    padding: 24px; pointer-events: auto; }
  #title { background: linear-gradient(180deg, rgba(5, 9, 18, .78), rgba(5, 9, 18, .1) 38%, rgba(5, 9, 18, .1) 60%, rgba(5, 9, 18, .86)); justify-content: space-between; }
  #title .logo { margin-top: 7vh; }
  #title .logo small { display: block; letter-spacing: .5em; font-size: 11px; color: var(--cyan); font-weight: 800; margin-bottom: 6px; text-shadow: 0 0 10px rgba(110, 243, 255, .8); }
  #title h1 { margin: 0; font-size: clamp(38px, 10vw, 84px); line-height: .95; font-weight: 900; font-style: italic; letter-spacing: .02em;
    background: linear-gradient(180deg, #fff 10%, #ffe9a8 45%, var(--gold) 60%, #9c6a1a 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 0 rgba(0, 0, 0, .55)) drop-shadow(0 0 26px rgba(242, 193, 78, .45)); }
  #title h2 { margin: 10px 0 0; font-size: clamp(15px, 4vw, 24px); letter-spacing: .5em; font-weight: 900; color: #fff; text-shadow: 0 2px 8px #000; }
  #title .foot { margin-bottom: 6vh; }
  #title .how { font-size: 12px; line-height: 1.8; opacity: .88; max-width: 460px; margin: 0 auto 16px; text-shadow: 0 1px 4px #000; }
  #btnStart { font-size: 18px; padding: 15px 46px; animation: startPulse 1.6s ease-in-out infinite; }
  @keyframes startPulse { 50% { filter: brightness(1.18); transform: scale(1.03); } }
  #version { font-size: 9px; opacity: .45; margin-top: 12px; letter-spacing: .1em; }

  #result { background: radial-gradient(ellipse at center, rgba(8, 12, 24, .5), rgba(4, 6, 14, .9)); }
  #resultTitle { font-size: clamp(46px, 13vw, 104px); font-weight: 900; font-style: italic; line-height: 1; letter-spacing: .04em; animation: resultIn .7s cubic-bezier(.2, 1.4, .3, 1); }
  #result.win #resultTitle { background: linear-gradient(180deg, #fff, #ffe9a8 40%, var(--gold) 60%, #9c6a1a); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 0 rgba(0, 0, 0, .6)) drop-shadow(0 0 30px rgba(242, 193, 78, .6)); }
  #result.lose #resultTitle { color: #c9d0e4; text-shadow: 0 4px 0 #000, 0 0 30px rgba(255, 60, 60, .5); }
  @keyframes resultIn { from { transform: scale(2.4); opacity: 0; } }
  #resultSub { letter-spacing: .4em; font-size: 12px; font-weight: 800; margin-top: 6px; opacity: .85; }
  #resultStats { display: grid; grid-template-columns: repeat(3, auto); gap: 6px 22px; margin: 22px 0; font-size: 12px; }
  #resultStats b { display: block; font-size: 22px; font-style: italic; color: var(--gold); }
  #resultButtons { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

  /* ---------- リプレイ ---------- */
  .letter { position: fixed; left: 0; right: 0; height: 0; background: #000; transition: height .5s; pointer-events: none; }
  #letterTop { top: 0; } #letterBottom { bottom: 0; }
  body.replay .letter { height: 9vh; }
  body.replay #hud, body.replay #bottom, body.replay #tools { opacity: 0; pointer-events: none; }
  body.replay #bottom { transform: translateY(40px); }
  body.replay #bottom * { pointer-events: none; }
  #replayHud { position: fixed; left: 0; right: 0; bottom: calc(9vh + 10px); display: none; justify-content: space-between; align-items: center; padding: 0 14px; pointer-events: none; }
  body.replay #replayHud { display: flex; }
  #replayLabel { font-weight: 900; font-style: italic; letter-spacing: .3em; font-size: 13px; color: #fff; text-shadow: 0 0 10px rgba(255, 60, 60, .9); }
  #replayLabel::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #ff3b3b; margin-right: 8px; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  #replayHud .btn { padding: 8px 14px; font-size: 12px; }
  #announce { position: fixed; left: 0; right: 0; top: 40%; text-align: center; font-size: clamp(30px, 9vw, 70px); font-weight: 900; font-style: italic; letter-spacing: .12em;
    color: #fff; text-shadow: 0 4px 0 rgba(0, 0, 0, .6), 0 0 30px rgba(110, 243, 255, .8); pointer-events: none; opacity: 0; }
  #announce.show { animation: announce 1.5s ease-out forwards; }
  @keyframes announce { 0% { opacity: 0; transform: scale(1.8); } 20%, 70% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(.94); } }
  #fatal { position: fixed; inset: 0; display: none; place-items: center; padding: 30px; background: #0a0f1c; color: #ffb4a8; font-size: 13px; white-space: pre-wrap; z-index: 99; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="vignette" class="layer"></div>
<div id="dim" class="layer"></div>
<div id="numbers" class="layer"></div>
<div id="flash" class="layer"></div>
<div id="letterTop" class="letter"></div><div id="letterBottom" class="letter"></div>

<div id="hud" class="hidden">
  <div id="armyPlayer" class="army"><div class="row"><span class="name" data-i18n="armyPlayer"></span><span class="count" id="countPlayer"></span></div><div class="bar"><i id="barPlayer"></i></div></div>
  <div id="clock"><div id="clockTime">0:00</div><div id="clockSeed"></div></div>
  <div id="armyEnemy" class="army"><div class="row"><span class="name" data-i18n="armyEnemy"></span><span class="count" id="countEnemy"></span></div><div class="bar"><i id="barEnemy"></i></div></div>
</div>
<div id="tools" class="hidden">
  <button class="tool" id="btnSpeed">×1</button>
  <button class="tool" id="btnSound">♪</button>
  <button class="tool" id="btnLang">EN</button>
</div>
<div id="phase"><span data-i18n="phase"></span></div>
<div id="cutins"></div>
<div id="announce"></div>

<div id="bottom" class="hidden"><div id="bottomInner">
  <div id="detail">
    <div id="detailText"><div id="detailName"></div><div id="detailRole"></div><div id="detailSkill"></div><div id="detailDesc"></div></div>
    <button class="btn" id="btnIssue"></button>
  </div>
  <div id="commandBar">
    <button class="btn ghost" id="btnPause"></button>
    <div id="charges"><span data-i18n="orders"></span><div id="pips"></div></div>
  </div>
</div></div>

<div id="replayHud">
  <div id="replayLabel">REPLAY</div>
  <div style="display:flex;gap:8px">
    <button class="btn ghost" id="btnReplaySpeed">×1</button>
    <button class="btn ghost" id="btnReplayExit" data-i18n="replayExit"></button>
  </div>
</div>

<div id="title" class="overlay">
  <div class="logo"><small>TACTICAL AUTO-BATTLE</small><h1>ARCANE<br>ARMOR</h1><h2 data-i18n="subtitle"></h2></div>
  <div class="foot">
    <div class="how" data-i18n="how"></div>
    <button class="btn" id="btnStart" data-i18n="start"></button>
    <div id="version"></div>
  </div>
</div>

<div id="result" class="overlay hidden">
  <div id="resultTitle"></div>
  <div id="resultSub"></div>
  <div id="resultStats"></div>
  <div id="resultButtons">
    <button class="btn" id="btnReplay" data-i18n="watchReplay"></button>
    <button class="btn ghost" id="btnRetry" data-i18n="retry"></button>
    <button class="btn ghost" id="btnNext" data-i18n="nextBattle"></button>
  </div>
</div>
<div id="fatal"></div>

<script>
"use strict";
const GAME_VERSION = "v0.3.0";

// =================================================================
// <SIM> ここから </SIM> まではDOMにも描画にも触らない戦闘ロジック。
// tools からこの区間だけを取り出してヘッドレスで回す（verify.mjs）。
// 同じシードと同じ指令列なら必ず同じ戦闘になる ＝ リプレイは「記録の再生」ではなく「再計算」。
// =================================================================
// <SIM>
function makeRandomGenerator(seedValue) {   // mulberry32
  let state = seedValue >>> 0;
  return function nextRandom() {
    state = (state + 0x6D2B79F5) >>> 0;
    let t = state;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let nextLogicRandom = null, nextFxRandom = null, currentSeed = 0;
function reseedRandom(seedValue) {
  currentSeed = seedValue >>> 0;
  nextLogicRandom = makeRandomGenerator(currentSeed);
  nextFxRandom = makeRandomGenerator((currentSeed ^ 0x9E3779B9) >>> 0);
  return currentSeed;
}
function random() { return nextLogicRandom(); }     // 戦闘結果に効く乱数
function fxRandom() { return nextFxRandom(); }      // 見た目だけの乱数（リプレイの再現性に影響させない）

// 数値はここに集める（本制作では data/balance/ へ切り出す）。距離の単位は「車両1両がおよそ1.4」
const BALANCE = {
  tickRate: 60,
  fieldWidth: 44, fieldDepth: 27,
  hitboxFactor: 0.55,           // 当たり判定は見た目より小さめ（かすめた弾は外れ扱いにして撃ち合いを長引かせる）
  fastTargetPenalty: 5,         // 装甲車以外は、速くて当てにくい装甲車を後回しにする
  chargeSeconds: 4, maxCharges: 2, startCharges: 1,   // 指令ゲージ: 4秒で1回分たまり、2回分まで貯められる
  timeLimitSeconds: 150,
  rearDot: 0.5,                 // 弾の進行方向と車体の向きの内積がこれ以上なら背面命中
  rearDamageFactor: 2,          // 背面はダメージ2倍（回り込みに意味を持たせる）
  aimTolerance: 0.07,           // 砲がこの角度以内に向いたら撃つ（ラジアン）
  retargetSeconds: 0.6,
  avoidDistance: 4, obstacleMargin: 2.2, edgeMargin: 2.0,
  obstaclePairs: 6,
  units: {
    // behavior: 車種ごとの行動方式。どの車種も止まらずに走り続ける。
    //   skirmish=切り返しながら詰めて目標の周りを回る / assault=まっすぐ押し込んでから近距離で回る /
    //   siege=遠くから撃っては場所を変える（寄られたら後退） / raider=戦場の端を回り込んで後衛を襲う / escort=味方の主力の後ろにつく
    tank:      { hp: 4, radius: 0.75, maxSpeed: 4.8, reverseSpeed: 2.6, acceleration: 6, braking: 9, turnRate: 2.1, pivot: true, turretRate: 3.4,
                 behavior: "skirmish", preferredRange: 9, orbitLead: 0.6, orbitThrottle: 1, leadSkill: 0.9, weaveRate: 0.035, weaveAngle: 0.7,
                 weapon: { kind: "shell", damage: 1, speed: 17, range: 13, reload: 5.6, spread: 0.21, radius: 0.18, burst: 1 } },
    heavy:     { hp: 8, radius: 0.95, maxSpeed: 3.2, reverseSpeed: 1.8, acceleration: 3.2, braking: 7, turnRate: 1.4, pivot: true, turretRate: 2.2,
                 behavior: "assault", preferredRange: 8, orbitLead: 0.45, orbitThrottle: 0.8, frontArmor: 0.5, leadSkill: 0.9,
                 weapon: { kind: "shell", damage: 2, speed: 15, range: 13.5, reload: 7.5, spread: 0.18, radius: 0.24, burst: 1 } },
    artillery: { hp: 2, radius: 0.75, maxSpeed: 3.4, reverseSpeed: 2.8, acceleration: 4.5, braking: 9, turnRate: 1.6, pivot: true, turretRate: 1.4, turretLimit: 0.4,
                 behavior: "siege", fleeRange: 10, leadSkill: 0.6, scootDistance: 7,
                 weapon: { kind: "mortar", damage: 2, splash: 1.7, range: 21, minRange: 6, reload: 8, flight: 1.7, scatter: 3.6, maxFireSpeed: 0.8 } },
    scout:     { hp: 3, radius: 0.6, maxSpeed: 7.8, reverseSpeed: 3.2, acceleration: 10, braking: 12, turnRate: 2.8, pivot: false, turretRate: 6,
                 behavior: "raider", preferredRange: 6, orbitLead: 1.0, orbitThrottle: 1, leadSkill: 0.85, backlineBias: 14, diveDistance: 5,
                 weapon: { kind: "shell", damage: 0.5, speed: 21, range: 9.5, reload: 4, spread: 0.26, radius: 0.1, burst: 3, burstInterval: 0.11 } },
    oracle:    { hp: 3, radius: 0.7, maxSpeed: 4.4, reverseSpeed: 2.4, acceleration: 5.5, braking: 8, turnRate: 2.0, pivot: false, turretRate: 9,
                 behavior: "escort", followDistance: 4.2, soloRange: 11,

const TEAM_PLAYER = 0, TEAM_ENEMY = 1;

// ---------- 戦場（平らな広場と、遮蔽になる障害物） ----------

// ---------- 戦闘の生成 ----------

  for (const [type, x, z] of BALANCE.formation) {

// ---------- 1ティック ----------
function stepBattle(battle) {

  runScheduled(battle);
  const count = battle.units.length, forward = (battle.tick & 1) === 0;

  }
  separateVehicles(battle);
  updateBullets(battle);
  updateShells(battle);
  if (!battle.over) checkOutcome(battle);
  // ゲージは最後に増やす（自軍の指令はこの関数の外・敵軍は中で出すので、途中で増やすと敵だけ1拍早く動ける）
  const gain = 1 / secondsToTicks(BALANCE.chargeSeconds);

// ---------- 操縦（前進・後退・旋回・加減速だけ。横滑りはしない） ----------

function tileHash(x, z, salt) {   // 飾りの配置用（シードに依らず毎回同じ）
  let value = Math.imul(x * 374761393 + z * 668265263 + salt * 2147483647, 1274126177);
  value ^= value >>> 13; value = Math.imul(value, 1274126177); value ^= value >>> 16;
  return (value >>> 0) / 4294967296;
}
function lerpAngle(from, to, amount) {
  let delta = (to - from) % (Math.PI * 2);
  if (delta > Math.PI) delta -= Math.PI * 2; else if (delta < -Math.PI) delta += Math.PI * 2;
  return from + delta * amount;
}

// 1両を数個のメッシュにまとめる（24両×部品ごとのメッシュでは描画呼び出しが増えすぎる）
function createBuilder() {
  const positions = [], normals = [], colors = [];
  const matrix = new THREE.Matrix4(), quaternion = new THREE.Quaternion(), euler = new THREE.Euler();
  const offset = new THREE.Vector3(), scaling = new THREE.Vector3(), tint = new THREE.Color();
  function add(source, x, y, z, color, rx = 0, ry = 0, rz = 0, sx = 1, sy = 1, sz = 1) {
    const geometry = source.index ? source.toNonIndexed() : source;
    quaternion.setFromEuler(euler.set(rx, ry, rz));
    geometry.applyMatrix4(matrix.compose(offset.set(x, y, z), quaternion, scaling.set(sx, sy, sz)));
    const position = geometry.attributes.position.array, normal = geometry.attributes.normal.array;
    tint.set(color);
    for (let i = 0; i < position.length; i += 3) {
      positions.push(position[i], position[i + 1], position[i + 2]);
      normals.push(normal[i], normal[i + 1], normal[i + 2]);
      colors.push(tint.r, tint.g, tint.b);
    }
    if (geometry !== source) geometry.dispose();
    source.dispose();
  }
  return {
    box(w, h, d, x, y, z, color, rx, ry, rz) { add(new THREE.BoxGeometry(w, h, d), x, y, z, color, rx, ry, rz); },
    cyl(top, bottom, height, segments, x, y, z, color, rx, ry, rz) { add(new THREE.CylinderGeometry(top, bottom, height, segments), x, y, z, color, rx, ry, rz); },
    cone(radius, height, segments, x, y, z, color, rx, ry, rz) { add(new THREE.ConeGeometry(radius, height, segments), x, y, z, color, rx, ry, rz); },
    ball(radius, x, y, z, color, sx, sy, sz) { add(new THREE.IcosahedronGeometry(radius, 1), x, y, z, color, 0, 0, 0, sx, sy, sz); },
    rock(radius, x, y, z, color, sx, sy, sz, ry) { add(new THREE.DodecahedronGeometry(radius, 0), x, y, z, color, 0.3, ry, 0.2, sx, sy, sz); },
    gem(radius, x, y, z, color, sx, sy, sz, rx, rz) { add(new THREE.OctahedronGeometry(radius, 0), x, y, z, color, rx, 0, rz, sx, sy, sz); },
    isEmpty() { return positions.length === 0; },
    build(boost = 1) {
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute("normal", new THREE.Float32BufferAttribute(normals, 3));
      geometry.setAttribute("color", new THREE.Float32BufferAttribute(boost === 1 ? colors : colors.map((value) => value * boost), 3));
      return geometry;
    },
  };
}

function dropTrackMark(x, z, heading, width) {
  trackDummy.position.set(x, 0.012, z); trackDummy.rotation.set(0, heading, 0); trackDummy.scale.set(width, 1, 0.5); trackDummy.updateMatrix();

function buildTerrain(field) {
  if (terrainGroup) {
    scene.remove(terrainGroup);
    terrainGroup.traverse((object) => { if (object.geometry) object.geometry.dispose(); });
  }
  terrainGroup = new THREE.Group();
  crystalSpots.length = 0;
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(field.width, field.depth).rotateX(-Math.PI / 2), groundMaterial);
  ground.receiveShadow = true;
  terrainGroup.add(ground);
  // 台座（ジオラマの土台）。下へ行くほど暗くする
  const cliffDepth = 2.2, cliff = new THREE.BoxGeometry(field.width, cliffDepth, field.depth).toNonIndexed();
  const cliffPosition = cliff.attributes.position, cliffColors = [], upper = new THREE.Color(0x9a6d42), lower = new THREE.Color(0x1d1626), mixed = new THREE.Color();
  for (let i = 0; i < cliffPosition.count; i++) {
    mixed.copy(upper).lerp(lower, cliffPosition.getY(i) > 0 ? 0 : 1);
    cliffColors.push(mixed.r, mixed.g, mixed.b);
  }
  cliff.setAttribute("color", new THREE.Float32BufferAttribute(cliffColors, 3));
  const base = new THREE.Mesh(cliff, cliffMaterial);
  base.position.y = -cliffDepth / 2 - 0.01;
  terrainGroup.add(base);

  const solid = createBuilder(), glowing = createBuilder();
  field.obstacles.forEach((obstacle, index) => {
    const x = obstacle.x, z = obstacle.z, size = obstacle.radius, pairIndex = index >> 1;
    const h1 = tileHash(pairIndex, 1, 3), h2 = tileHash(pairIndex, 2, 4), turn = h1 * Math.PI * 2;
    if (obstacle.kind === OBSTACLE_ROCK) {
      solid.rock(size * 0.8, x - size * 0.1, size * 0.5, z, 0x8f93a1, 1, 0.85, 1, turn);
      solid.rock(size * 0.5, x + size * 0.55, size * 0.3, z + size * 0.35, 0x767a88, 1, 0.8, 1, turn + 1);
      solid.rock(size * 0.36, x - size * 0.5, size * 0.2, z - size * 0.6, 0x9ea2b0, 1, 0.8, 1, turn + 2);
    } else if (obstacle.kind === OBSTACLE_CRYSTAL) {
      const hue = h2 < 0.5 ? 0x7ff3ff : 0xc9a2ff;
      solid.rock(size * 0.75, x, size * 0.25, z, 0x6f7080, 1.2, 0.55, 1.2, turn);
      glowing.gem(size * 0.42, x, size * 1.3, z, hue, 1, 2.6, 1, 0.08, 0.1);
      glowing.gem(size * 0.3, x + size * 0.55, size * 0.85, z + size * 0.2, hue, 1, 2.2, 1, 0.1, -0.5);
      glowing.gem(size * 0.25, x - size * 0.5, size * 0.75, z - size * 0.3, hue, 1, 2.2, 1, -0.3, 0.45);
      crystalSpots.push([x, size * 1.3, z, h2 < 0.5 ? 0 : 1, size]);
    } else if (obstacle.kind === OBSTACLE_RUIN) {
      const stone = 0xbdb7a8, height = 1.2 + h2 * 1.2, side = size * 1.45;
      solid.box(side, 0.16, side, x, 0.08, z, 0xa8a294, 0, turn * 0.15);
      for (const [px, pz, scale] of [[-0.3, -0.25, 1], [0.32, 0.3, 0.55]]) {
        solid.cyl(size * 0.2, size * 0.23, height * scale, 8, x + px * size, 0.16 + height * scale / 2, z + pz * size, stone);
        solid.box(size * 0.56, 0.12, size * 0.56, x + px * size, 0.22, z + pz * size, stone);
      }
      solid.box(size * 0.6, 0.14, size * 0.6, x - 0.3 * size, 0.2 + height, z - 0.25 * size, 0xcbc5b6, 0, 0.3);
      solid.cyl(size * 0.19, size * 0.19, size * 0.9, 8, x + size * 0.1, size * 0.19 + 0.16, z - size * 0.45, 0xa9a394, Math.PI / 2, turn);
    } else {
      const leaf = h2 < 0.25 ? [0x2f9c8f, 0x45b8a6, 0x6fd6c0] : [0x3c8f47, 0x52ab59, 0x74c768];
      for (let tree = 0; tree < 4; tree++) {
        const angle = turn + tree * 1.7, reach = tree === 0 ? 0 : size * 0.55, grow = (0.9 + tileHash(pairIndex, tree, 7) * 0.5) * 1.5;
        const tx = x + Math.cos(angle) * reach, tz = z + Math.sin(angle) * reach;
        solid.cyl(0.07 * grow, 0.1 * grow, 0.4 * grow, 6, tx, 0.2 * grow, tz, 0x6d4a2c);
        solid.cone(0.36 * grow, 0.55 * grow, 7, tx, 0.6 * grow, tz, leaf[0], 0, angle);
        solid.cone(0.27 * grow, 0.48 * grow, 7, tx, 0.93 * grow, tz, leaf[1], 0, angle + 0.5);
        solid.cone(0.18 * grow, 0.4 * grow, 7, tx, 1.24 * grow, tz, leaf[2], 0, angle + 1);
      }
    }
  });
  // 通行に関係ない飾り（草むら・小石）
  for (let i = 0; i < 260; i++) {
    const x = (tileHash(i, 11, 1) - 0.5) * (field.width - 1), z = (tileHash(i, 12, 2) - 0.5) * (field.depth - 1);
    if (field.obstacles.some((obstacle) => Math.hypot(obstacle.x - x, obstacle.z - z) < obstacle.radius + 0.3)) continue;
    if (i % 5 === 0) solid.rock(0.07 + tileHash(i, 13, 3) * 0.07, x, 0.04, z, 0x9a9488, 1, 0.6, 1, i);
    else for (let blade = 0; blade < 3; blade++) solid.cone(0.045, 0.17, 4, x + (tileHash(i, blade, 4) - 0.5) * 0.4, 0.08, z + (tileHash(i, blade, 5) - 0.5) * 0.4, blade === 1 ? 0xb4e472 : 0x93d05e);
  }
  const props = new THREE.Mesh(solid.build(), propMaterial);
  props.castShadow = true; props.receiveShadow = true;
  terrainGroup.add(props);
  if (!glowing.isEmpty()) terrainGroup.add(new THREE.Mesh(glowing.build(1.9), glowMaterial));
  scene.add(terrainGroup);
}

// リプレイのカメラ演出。見どころ（スキル・撃破）へ切り替え、何もなければ交戦中の車両を追う
const director = { timer: 0, age: 0, mode: "wide", followId: -1, yawDrift: 0, zoomDrift: 0, interest: null, slow: 1, slowTimer: 0 };
function noteInterest(tileX, tileZ, weight) {

const GOLD = [3.2, 2.2, 0.6], EMBER = [3.2, 1.2, 0.3], WHITE = [3, 3, 3];

    case "fire": {

        sparks.spawn(scratchA.x, scratchA.y, scratchA.z, 0, 0, 0, 0.16, 3.6, 0.8, 3, 3, 3, 1);
        for (let i = 0; i < 16; i++) sparks.spawn(scratchA.x, scratchA.y, scratchA.z, dirX * (4 + fxRandom() * 9) + spread(2), spread(2), dirZ * (4 + fxRandom() * 9) + spread(2), 0.25 + fxRandom() * 0.3, 0.3, 0.03, color[0], color[1], color[2], 1, 0, 2);

        pulseLight(scratchA.x, 1.2, scratchA.z, color, 5, 0.3);
        addShake(0.08); audio.play("beam");
        break;
      }
      const small = type === "scout", heavy = type === "heavy" || event.weapon === "mortar";
      shooter.recoil = 1;
      const flashSize = small ? 0.8 : (heavy ? 2.6 : 1.9);
      sparks.spawn(scratchA.x + dirX * 0.15, scratchA.y, scratchA.z + dirZ * 0.15, 0, 0, 0, 0.09, flashSize, flashSize * 0.3, 3.4, 2.8, 1.6, 1);
      if (!small) {
        for (let i = 0; i < 7; i++) sparks.spawn(scratchA.x, scratchA.y, scratchA.z, dirX * (3 + fxRandom() * 6) + spread(1.6), spread(1.6) + 0.6, dirZ * (3 + fxRandom() * 6) + spread(1.6), 0.18 + fxRandom() * 0.15, 0.28, 0.04, 3.2, 1.8, 0.6, 1, 0, 3);

        const shot = shots.take(), tone = TEAM_SHELL[team];

        shot.arc = 3.2 + shot.start.distanceTo(shot.end) * 0.22;

        shot.mesh.scale.set(0.16, 0.16, 0.26); shot.mesh.position.copy(scratchA);
        const mark = spawnRune(event.x, 0.06, event.z, BALANCE.units.artillery.weapon.splash * 2, event.duration, team === TEAM_PLAYER ? [0.5, 1.4, 2.4] : [2.6, 0.7, 0.4]);
        mark.strength = 0.55;
      }
      audio.play(small ? "gun" : (event.weapon === "mortar" ? "mortar" : (heavy ? "heavy" : "cannon")));
      break;
    }
    case "bolt": {
      const caster = views[event.unitId], color = TEAM_GLOW[caster.unit.team];
      caster.recoil = 1;
      muzzleWorld(caster, scratchA);
      let from = scratchA.clone();
      for (let i = 0; i < 10; i++) sparks.spawn(from.x, from.y, from.z, spread(3), spread(3), spread(3), 0.25, 0.4, 0.04, color[0], color[1], color[2], 1);
      for (const targetId of event.targetIds) {

        sparks.spawn(to.x, to.y, to.z, 0, 0, 0, 0.12, 1.8, 0.4, color[0], color[1], color[2], 1);
        spawnRing(to.x, 0.08, to.z, 0.3, 1.9, 0.4, color);

const pointers = new Map();

function pickUnit(screenX, screenY) {

  for (const unitView of views) {
    if (unitView.dead) continue;
    scratchB.copy(unitView.root.position); scratchB.y += 0.6; scratchB.project(camera);
    const distance = Math.hypot((scratchB.x * 0.5 + 0.5) * viewportWidth - screenX, (-scratchB.y * 0.5 + 0.5) * viewportHeight - screenY);
    if (distance < bestDistance) { bestDistance = distance; best = unitView.unit.id; }
  }

}
canvas.addEventListener("pointermove", (event) => {
  const previous = pointers.get(event.pointerId);
  if (!previous || (state !== "battle" && state !== "command")) return;
  if (pointers.size === 1) {
    const dx = (event.clientX - previous[0]) / pixelsPerUnit, dy = (event.clientY - previous[1]) / pixelsPerUnit;
    cameraBasis(view.yaw, view.pitch);
    user.pan.addScaledVector(cameraRight, -dx);
    scratchA.set(cameraUp.x, 0, cameraUp.z).normalize();          // 画面の上方向を地面に落としたもの
    user.pan.addScaledVector(scratchA, dy / Math.sin(view.pitch));

  }
  previous[0] = event.clientX; previous[1] = event.clientY;
  if (pointers.size === 2) {
    const [first, second] = [...pointers.values()], distance = Math.hypot(first[0] - second[0], first[1] - second[1]);
    if (pinchDistance > 0) user.zoom = clampNumber(user.zoom * pinchDistance / distance, 0.3, 1.15);

for (const name of ["pointerup", "pointercancel"]) canvas.addEventListener(name, (event) => {

  const moved = Math.hypot(event.clientX - tapStart.x, event.clientY - tapStart.y), held = performance.now() - tapStart.time;
  tapStart = null;
  if (moved > 10 || held > 400) return;   // ドラッグ（視点移動）はタップ扱いにしない

$("btnStart").addEventListener("click", () => { audio.ensure(); beginBattle(battle.seed); });
$("btnIssue").addEventListener("click", confirmOrder);
$("btnPause").addEventListener("click", () => { audio.ensure(); setPaused(state === "battle"); });
window.addEventListener("keydown", (event) => { if (event.code === "Space" && (state === "battle" || state === "command")) { event.preventDefault(); setPaused(state === "battle"); } });
$("btnReplay").addEventListener("click", () => { audio.ensure(); beginReplay(); });
$("btnRetry").addEventListener("click", () => { audio.ensure(); beginBattle(record.seed); });
$("btnNext").addEventListener("click", () => { audio.ensure(); beginBattle(fixedSeed !== null ? (record.seed + 1) >>> 0 : freshSeed()); });
$("btnReplayExit").addEventListener("click", () => { if (state === "replay") showResult(); });
$("btnSpeed").addEventListener("click", () => { speed = speed === 1 ? 2 : 1; $("btnSpeed").textContent = `×${speed}`; });
$("btnReplaySpeed").addEventListener("click", () => { replaySpeed = replaySpeed === 1 ? 2 : (replaySpeed === 2 ? 0.5 : 1); $("btnReplaySpeed").textContent = `×${replaySpeed}`; });
$("btnSound").addEventListener("click", () => { audio.ensure(); $("btnSound").style.opacity = audio.toggle() ? "0.4" : "1"; });
$("btnLang").addEventListener("click", () => { language = language === "ja" ? "en" : "ja"; applyLanguage(); for (const key of Object.keys(hudShown)) delete hudShown[key]; });

// ---------- メインループ ----------
function stepSimulation(realDt) {
  let simulated = 0;
  if (state !== "battle" && state !== "replay") return 0;
  if (director.slowTimer > 0) director.slowTimer -= realDt;
  const scale = (state === "replay" ? replaySpeed : speed) * (director.slowTimer > 0 ? director.slow : 1);
  accumulator += realDt * scale;
  while (accumulator >= TICK_SECONDS) {
    if (state === "battle" && autoPlay && !battle.over) autoOrder(battle, TEAM_PLAYER, autoRandom);
    if (state === "replay") for (const unitId of replayOrders.get(battle.tick) || []) issueOrder(battle, TEAM_PLAYER, unitId);
    stepBattle(battle);
    accumulator -= TICK_SECONDS; simulated += TICK_SECONDS;
    for (const event of battle.events) handleEvent(event);
    battle.events.length = 0;
    if (battle.over) {
      endTimer += TICK_SECONDS;
      if (endTimer >= 2.4) { finishBattle(); break; }
    }
  }
  return simulated;
}
let lastTime = performance.now(), clock = 0, failed = false;
function frame(now) {
  if (failed) return;
  requestAnimationFrame(frame);
  const realDt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now; clock += realDt;
  const simDt = stepSimulation(realDt);
  const effectDt = (state === "title" || state === "result") ? realDt : (state === "command" ? realDt * 0.04 : simDt);

  if (state === "replay") updateDirector(realDt);
  else {
    const orbit = state === "title" || state === "result";
    const ease = 1 - Math.exp(-realDt * (orbit ? 2 : 7));
    const wantedYaw = fit.yaw + (orbit ? Math.sin(clock * 0.22) * 0.22 : 0);
    view.yaw += (wantedYaw - view.yaw) * ease; view.pitch += (fit.pitch - view.pitch) * ease;
    view.half += ((orbit ? fit.plainHalf * 0.86 : fit.half * user.zoom) - view.half) * ease;
    scratchA.copy(orbit ? fit.plainCenter : fit.center).add(user.pan);
    view.target.lerp(scratchA, ease);
  }
  applyCamera(clock);
  for (const unitView of views) updateUnitView(unitView, state === "command" ? 0 : (simDt > 0 ? simDt : (state === "title" ? realDt : 0)), clock);
  updateEffects(simDt, effectDt, realDt, clock);
  if (state !== "title") updateHud();
  if (composer) composer.render(); else renderer.render(scene, camera);
}

applyLanguage();
resize();
setupBattle(freshSeed());
view.yaw = fit.yaw; view.pitch = fit.pitch; view.half = fit.plainHalf; view.target.copy(fit.plainCenter);
window.__game = {   // 検証用（Playwright から状態を読む）
  get battle() { return battle; }, get state() { return state; }, get record() { return record; },
  begin: (seed) => beginBattle(seed), replay: beginReplay, select: selectUnit, confirm: confirmOrder, pause: setPaused,
  skip(seconds) {   // 描画を待たずに戦闘を進める（ソフトウェア描画の検証環境は数fpsしか出ないため）
    for (let elapsed = 0; elapsed < seconds && (state === "battle" || state === "replay"); elapsed += 0.05) {
      const simDt = stepSimulation(0.05);
      for (const unitView of views) updateUnitView(unitView, simDt, clock);
      updateEffects(simDt, simDt, 0.05, clock);
    }
    return `${state} tick ${battle.tick}`;
  },
  zoom(factor) { user.zoom = factor; },
};
requestAnimationFrame(frame);
})().catch((error) => {
  const panel = document.getElementById("fatal");
  panel.style.display = "grid";
  panel.textContent = `起動に失敗しました / Failed to start\n\n${error && error.stack ? error.stack : error}`;
});
</script>
</body>
</html>
