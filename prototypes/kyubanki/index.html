<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>九盤記 -KYUBANKI-</title>
<style>
:root{
  --bg:#0e1220; --panel:#161d31; --panel2:#1c2440; --line:#2a3352;
  --text:#e8ecff; --dim:#8a93b8;
  --blue:#5b8cff; --red:#ff6b6b; --gold:#ffd166; --green:#7bd88f; --purple:#c77bff;
  --bs:min(96vw, 54vh);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  background:var(--bg); color:var(--text);
  font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;
  display:flex; flex-direction:column; align-items:center;
  overflow:hidden; user-select:none; touch-action:manipulation;
}
#topbar{
  width:var(--bs); display:flex; align-items:center; gap:8px;
  padding:6px 2px; font-size:13px;
}
#chTitle{font-weight:bold; color:var(--gold); flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
#turnLabel{color:var(--dim);}
#objLabel{width:var(--bs); font-size:11px; color:var(--dim); padding:0 2px 4px;}
#menuBtn{
  background:var(--panel2); border:1px solid var(--line); color:var(--text);
  border-radius:6px; padding:3px 10px; font-size:13px;
}
/* ---- board ---- */
#boardWrap{position:relative; width:var(--bs); height:var(--bs); flex-shrink:0;}
#board{
  position:absolute; inset:0; border-radius:8px; overflow:hidden;
  box-shadow:0 0 0 2px var(--line), 0 8px 30px rgba(0,0,0,.5);
  background:#000;
}
.cell{
  position:absolute; width:11.111%; height:11.111%;
  display:flex; align-items:center; justify-content:center;
  font-size:calc(var(--bs)/9*.55);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);
}
.t-PLAIN{background:#3d5c3a;}
.t-ROAD{background:#7d6f50;}
.t-FOREST{background:#2c4a2c;}
.t-MOUNTAIN{background:#4a4a52;}
.t-WATER{background:#2c4a6e;}
.t-HOUSE{background:#5c4b32;}
.t-VOID{background:#07070f;}
.t-VOID::after{
  content:''; position:absolute; inset:12%; border-radius:50%;
  background:radial-gradient(circle,#2a1145 0%,transparent 70%);
  animation:voidPulse 2.4s ease-in-out infinite;
}
@keyframes voidPulse{0%,100%{opacity:.35;transform:scale(.9);}50%{opacity:.8;transform:scale(1.1);}}
.cell .deco{opacity:.85; pointer-events:none; filter:drop-shadow(0 2px 2px rgba(0,0,0,.4));}
.hl-move::before, .hl-atk::before, .hl-danger::before{
  content:''; position:absolute; inset:6%; border-radius:4px; pointer-events:none;
}
.hl-move::before{background:rgba(91,140,255,.42); box-shadow:inset 0 0 0 2px rgba(140,180,255,.8);}
.hl-atk::before{background:rgba(255,107,107,.45); box-shadow:inset 0 0 0 2px rgba(255,150,150,.9); animation:atkBlink .8s ease-in-out infinite;}
.hl-danger::before{background:rgba(255,107,107,.18); box-shadow:inset 0 0 0 1px rgba(255,107,107,.4);}
@keyframes atkBlink{0%,100%{opacity:1;}50%{opacity:.55;}}
/* ---- markers (chest/shard) ---- */
.marker{
  position:absolute; width:11.111%; height:11.111%; pointer-events:none;
  display:flex; align-items:center; justify-content:center;
  font-size:calc(var(--bs)/9*.5); z-index:2;
  filter:drop-shadow(0 0 6px rgba(255,209,102,.8));
  animation:markerFloat 1.6s ease-in-out infinite;
}
@keyframes markerFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-8%);}}
/* ---- units ---- */
.unit{
  position:absolute; width:11.111%; height:11.111%; pointer-events:none; z-index:3;
  display:flex; align-items:center; justify-content:center;
  transition:left .22s ease, top .22s ease;
}
.unit .body{
  width:82%; height:82%; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:calc(var(--bs)/9*.46);
  transition:transform .12s ease;
}
.unit.side-hero .body{background:rgba(20,40,90,.75); box-shadow:0 0 0 2px var(--blue), 0 2px 6px rgba(0,0,0,.5);}
.unit.side-enemy .body{background:rgba(80,15,25,.75); box-shadow:0 0 0 2px var(--red), 0 2px 6px rgba(0,0,0,.5);}
.unit.boss .body{box-shadow:0 0 0 3px var(--purple), 0 0 18px rgba(199,123,255,.8);}
.unit.acted{filter:grayscale(.9) brightness(.65);}
.unit.selected .body{box-shadow:0 0 0 3px var(--gold), 0 0 14px rgba(255,209,102,.9); animation:selPulse 1s ease-in-out infinite;}
@keyframes selPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
.unit .hpbar{
  position:absolute; bottom:2%; left:12%; right:12%; height:9%;
  background:rgba(0,0,0,.65); border-radius:3px; overflow:hidden;
}
.unit .hpfill{height:100%; background:var(--green); transition:width .25s ease;}
.unit.side-enemy .hpfill{background:var(--red);}
.unit .lvtag{
  position:absolute; top:-2%; right:2%; font-size:calc(var(--bs)/9*.16);
  background:rgba(0,0,0,.7); color:var(--gold); border-radius:4px; padding:0 3px;
}
.dmgfloat{
  position:absolute; width:11.111%; text-align:center; z-index:6; pointer-events:none;
  font-weight:bold; font-size:calc(var(--bs)/9*.4);
  color:#fff; text-shadow:0 0 6px #000,0 2px 2px #000;
  animation:dmgUp .75s ease-out forwards;
}
.dmgfloat.heal{color:var(--green);} .dmgfloat.crit{color:var(--gold);}
@keyframes dmgUp{0%{transform:translateY(0);opacity:1;}100%{transform:translateY(-70%);opacity:0;}}
/* ---- bottom UI ---- */
#bottom{
  width:var(--bs); flex:1; min-height:150px; display:flex; flex-direction:column;
  padding-top:8px; gap:6px;
}
#infoPanel{
  background:var(--panel); border:1px solid var(--line); border-radius:8px;
  padding:8px 10px; font-size:13px; min-height:58px;
}
#infoPanel .iname{font-weight:bold;}
#infoPanel .istats{color:var(--dim); font-size:12px; margin-top:3px;}
#infoPanel .expbar{height:4px; background:#000; border-radius:2px; margin-top:5px; overflow:hidden;}
#infoPanel .expfill{height:100%; background:var(--gold);}
#actionBar{display:flex; gap:6px; flex-wrap:wrap;}
#actionBar button, #phaseBtn{
  flex:1; min-width:70px; padding:11px 4px; font-size:14px; font-weight:bold;
  background:var(--panel2); color:var(--text);
  border:1px solid var(--line); border-radius:8px;
}
#actionBar button:active, #phaseBtn:active{background:#2a3560;}
#actionBar button.primary{background:#24407c; border-color:var(--blue);}
#actionBar button.danger{background:#5c2430; border-color:var(--red);}
#phaseBtn{flex:none; width:100%;}
/* ---- dialogue ---- */
#dlg{
  position:fixed; left:50%; bottom:10px; transform:translateX(-50%);
  width:min(96vw,560px); z-index:20; display:none;
}
#dlgBox{
  background:rgba(14,18,32,.96); border:1px solid var(--line); border-radius:12px;
  padding:12px 14px; box-shadow:0 8px 30px rgba(0,0,0,.6);
}
#dlgHead{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
#dlgFace{font-size:26px;}
#dlgName{font-weight:bold; font-size:14px;}
#dlgText{font-size:14px; line-height:1.7; min-height:48px; white-space:pre-wrap;}
#dlgNext{text-align:right; color:var(--dim); font-size:12px; animation:selPulse 1.2s infinite;}
#dlgSkip{
  position:absolute; top:-30px; right:0; background:var(--panel2); color:var(--dim);
  border:1px solid var(--line); border-radius:6px; padding:3px 10px; font-size:12px;
}
/* ---- overlays ---- */
.overlay{
  position:fixed; inset:0; z-index:30; display:none;
  background:rgba(8,10,20,.92);
  flex-direction:column; align-items:center; justify-content:center; gap:14px;
  text-align:center; padding:20px;
}
.overlay h1{font-size:42px; letter-spacing:.15em; color:var(--gold); text-shadow:0 0 30px rgba(255,209,102,.4);}
.overlay h2{font-size:22px; color:var(--gold);}
.overlay .sub{color:var(--dim); font-size:14px; line-height:1.8;}
.overlay button{
  width:min(70vw,260px); padding:14px; font-size:16px; font-weight:bold;
  background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:10px;
}
.overlay button.primary{background:#24407c; border-color:var(--blue);}
.overlay button:disabled{opacity:.35;}
#toast{
  position:fixed; top:14%; left:50%; transform:translateX(-50%);
  background:rgba(10,14,28,.92); border:1px solid var(--line); border-radius:8px;
  padding:8px 18px; font-size:14px; font-weight:bold; z-index:25;
  display:none; white-space:nowrap; box-shadow:0 4px 20px rgba(0,0,0,.5);
}
#phaseBanner{
  position:fixed; top:38%; left:0; right:0; z-index:24; display:none;
  text-align:center; font-size:26px; font-weight:bold; letter-spacing:.2em;
  padding:14px 0; background:linear-gradient(90deg,transparent,rgba(20,30,60,.95),transparent);
  text-shadow:0 0 12px rgba(0,0,0,.8); pointer-events:none;
}
</style>
</head>
<body>
<div id="topbar">
  <span id="chTitle"></span>
  <span id="turnLabel"></span>
  <button id="menuBtn">☰</button>
</div>
<div id="objLabel"></div>
<div id="boardWrap"><div id="board"></div></div>
<div id="bottom">
  <div id="infoPanel"></div>
  <div id="actionBar"></div>
  <button id="phaseBtn" style="display:none"></button>
</div>

<div id="dlg">
  <button id="dlgSkip"></button>
  <div id="dlgBox">
    <div id="dlgHead"><span id="dlgFace"></span><span id="dlgName"></span></div>
    <div id="dlgText"></div>
    <div id="dlgNext">▼</div>
  </div>
</div>

<div id="toast"></div>
<div id="phaseBanner"></div>

<div class="overlay" id="titleOv">
  <div class="sub" id="titleTop"></div>
  <h1>九盤記</h1>
  <div class="sub" id="titleSub"></div>
  <button class="primary" id="btnNew"></button>
  <button id="btnCont"></button>
</div>

<div class="overlay" id="menuOv">
  <h2 id="menuTitle"></h2>
  <button class="primary" id="btnResume"></button>
  <button id="btnRetryMenu"></button>
  <button id="btnToTitle"></button>
</div>

<div class="overlay" id="overOv">
  <h2 id="overTitle"></h2>
  <div class="sub" id="overText"></div>
  <button class="primary" id="btnRetry"></button>
</div>

<div class="overlay" id="endOv">
  <div class="sub" id="endTop"></div>
  <h1>九盤記</h1>
  <h2 id="endFin"></h2>
  <div class="sub" id="endStats"></div>
  <button class="primary" id="btnAgain"></button>
</div>

<script>
'use strict';
const GAME_VERSION = 'v1.0.0';
/* =========================================================
   九盤記 -KYUBANKI- : 9x9マスで完結するミニマルSRPG
   世界そのものが81マスしかない、という設定を
   「盤のフチが虚無に食われる」メカニクスに直結させている。
   ========================================================= */

// ---------- 設定値（マジックナンバー隔離） ----------
const CFG = {
  GRID: 9,
  EXP_NEXT: 20,        // レベルアップ必要経験値
  EXP_HIT: 5,          // 攻撃を当てたときの経験値
  POTION_HEAL: 10,
  START_POTIONS: 2,
  LEVEL_HEAL: 5,       // レベルアップ時の回復量
  ANIM_MOVE: 240, ANIM_HIT: 340, ANIM_TURN: 900,
  SAVE_KEY: 'kyubanki_save_v1',
};
const DIRS = [[1,0],[-1,0],[0,1],[0,-1]];

// ---------- 文字列（i18n: 全UI文字列をここに集約） ----------
const L = {
  turn: n => `ターン ${n}`,
  chapter: (n,t) => n<5 ? `第${'一二三四'[n-1]}章「${t}」` : `終章「${t}」`,
  objRout: '目標：敵を全滅させよ', objShards: '目標：光ノ欠片✨を3つ集めよ', objBoss: '目標：盤外ノ王を倒せ',
  lose: '（味方が倒れたら章の最初から）',
  playerPhase: 'プレイヤーフェイズ', enemyPhase: 'エネミーフェイズ',
  atk: '攻撃', wait: '待機', cancel: 'キャンセル', potion: n => `ポーション×${n}`,
  endPhase: 'フェイズ終了', skip: 'スキップ ≫',
  newGame: 'はじめから', contGame: 'つづきから', resume: '再開する',
  retryCh: 'この章をやり直す', toTitle: 'タイトルへ（データ削除）', menu: 'メニュー',
  titleTop: '― 81マスに、世界のぜんぶ。 ―',
  titleSub: 'ミニマル・ストラテジーRPG\nユニットをタップ → 青マスへ移動 → 赤い敵をタップで攻撃',
  overTitle: '敗北……', retry: '章の最初からやり直す',
  overText: name => `${name}が倒れてしまった。\n世界を守れるのは、三人だけ。`,
  endFin: '─ 完 ─', endTop: 'フチは戻り、世界に朝が来る。',
  endStats: (t,lv) => `討伐までの総ターン数：${t}\n最終レベル：${lv}`,
  again: 'タイトルへ',
  gotItem: n => `${n}を手に入れた！`, shardGet: n => `光ノ欠片 ${n}/3`,
  levelUp: (n,lv) => `${n} はレベル${lv}に上がった！`,
  joined: n => `${n}が仲間になった！`,
  corrupted: '盤外ノ王がフチのマスを虚無に落とした！',
  summoned: '虚無から魔物が湧き出した！',
  chClear: '章クリア！',
  terrainInfo: (n,d) => d>0 ? `地形：${n}（守備+${d}）` : `地形：${n}`,
  unitStats: u => `HP ${u.hp}/${u.maxhp}　攻 ${u.atk}　守 ${u.def}　移 ${u.mov}　射 ${u.rng}`,
  expLabel: u => `Lv${u.lv}　EXP ${u.exp}/${CFG.EXP_NEXT}`,
  tapHint: '自分のユニットをタップして行動しよう',
  enemyInfo: '敵の行動範囲を表示中（もう一度タップで解除）',
  moveHint: '青いマスをタップで移動（自分をもう一度タップでその場に待機）',
  actHint: '行動を選ぼう（赤い敵をタップで攻撃）',
};

// ---------- 地形 ----------
const TERRAIN = {
  PLAIN:    {name:'平地', cost:1, pass:true,  def:0},
  ROAD:     {name:'道',   cost:1, pass:true,  def:0},
  FOREST:   {name:'森',   cost:2, pass:true,  def:1, deco:'🌲'},
  MOUNTAIN: {name:'山',   cost:0, pass:false, def:0, deco:'⛰️'},
  WATER:    {name:'水場', cost:0, pass:false, def:0, deco:'🌊'},
  HOUSE:    {name:'家',   cost:0, pass:false, def:0, deco:'🏠'},
  VOID:     {name:'虚無', cost:0, pass:false, def:0},
};
const CHAR_T = {'.':'PLAIN','R':'ROAD','F':'FOREST','M':'MOUNTAIN','W':'WATER','H':'HOUSE'};
// 世界＝この9行だけ。中央に村の広場、北に森、南東に川。
const BASE_MAP = [
  'MM.FFF..M',
  'M..FF....',
  '..H.H.FF.',
  '..RRR.FF.',
  'F.RRR....',
  'F.RRR.WW.',
  '.FH.HWWW.',
  '.F....W..',
  'MM......M',
];

// ---------- キャラクター ----------
const FACES = {narr:'📖', alto:'🗡️', yuzu:'🔮', garo:'🛡️', king:'👁️'};
const NAME_COLORS = {narr:'#8a93b8', alto:'#5b8cff', yuzu:'#c77bff', garo:'#7bd88f', king:'#ff6b6b'};
const NAMES = {narr:'', alto:'アルト', yuzu:'ユズ', garo:'ガロ', king:'盤外ノ王'};
const HERO_BASE = {
  alto: {hp:20, atk:6, def:2, mov:3, rng:1},
  yuzu: {hp:13, atk:7, def:1, mov:3, rng:2},
  garo: {hp:26, atk:5, def:4, mov:2, rng:1},
};
const ENEMY_TYPES = {
  slime: {name:'スライム', emoji:'🫠', hp:8,  atk:3,  def:0, mov:2, rng:1, exp:8},
  wolf:  {name:'荒野の狼', emoji:'🐺', hp:12, atk:5,  def:1, mov:3, rng:1, exp:10},
  skel:  {name:'骸骨兵',   emoji:'💀', hp:14, atk:6,  def:2, mov:2, rng:1, exp:12},
  shade: {name:'虚ろの影', emoji:'👻', hp:10, atk:7,  def:0, mov:3, rng:2, exp:14},
  wisp:  {name:'虚無の澱', emoji:'🌑', hp:8,  atk:5,  def:0, mov:3, rng:1, exp:6},
  king:  {name:'盤外ノ王', emoji:'👁️', hp:46, atk:10, def:3, mov:1, rng:2, exp:30, boss:true},
};
const ITEMS = {
  potion: {name:'ポーション', emoji:'🧪'},
  sword:  {name:'鋼の剣（攻+2）',       emoji:'⚔️', apply:u=>{u.atk+=2;}},
  armor:  {name:'革の鎧（守+2）',       emoji:'🥋', apply:u=>{u.def+=2;}},
  boots:  {name:'疾風のブーツ（移+1）', emoji:'👢', apply:u=>{u.mov+=1;}},
};

// ---------- 章データ（ストーリー・スポーン・盤の変化） ----------
const CORNER_VOIDS = [[0,0],[1,0],[0,1],[7,0],[8,0],[8,1],[0,7],[0,8],[1,8],[8,7],[7,8],[8,8]];
const EDGE_VOIDS = CORNER_VOIDS.concat([[4,0],[0,4],[8,4],[4,8]]);
const CHAPTERS = [
  { // 第一章
    title:'スライムの夜', obj:'rout', voids:[],
    heroes:{alto:[3,4]},
    enemies:[{t:'slime',x:7,y:1},{t:'slime',x:8,y:4},{t:'slime',x:5,y:8}],
    chests:[{x:0,y:3,item:'potion'}],
    shards:[],
    intro:[
      {s:'narr',t:'世界は、九かける九の八十一マス。\n──その外には、何もない。'},
      {s:'narr',t:'盤の真ん中の小さな村に、少年剣士がひとり。'},
      {s:'alto',t:'またスライムか！\n畑を荒らすなって言ってんだろ！'},
      {s:'narr',t:'（ユニットをタップ→青マスで移動。\n　赤く光る敵をタップで攻撃！\n　🎁のマスに乗るとアイテムが拾える）'},
    ],
    events:[{turn:2,type:'join',hero:'yuzu',x:5,y:1,lines:[
      {s:'yuzu',t:'あーあ、剣一本でがんばっちゃって。\n天才魔女ユズさんが手伝ってあげる！'},
      {s:'alto',t:'お前まだ“見習い”だろ。……でも助かる！'},
      {s:'yuzu',t:'“天才”見習い魔女、ね。\n（私は2マス先まで攻撃できるよ）'},
    ]}],
    outro:[
      {s:'alto',t:'ふう……最近、魔物が多いな。'},
      {s:'yuzu',t:'……ねえアルト。世界の“フチ”、見た？\nなんだか──欠けてる気がするの。'},
    ],
  },
  { // 第二章
    title:'流れ者の盾', obj:'rout', voids:[],
    heroes:{alto:[3,4], yuzu:[4,4]},
    enemies:[{t:'wolf',x:2,y:0},{t:'wolf',x:3,y:0},{t:'wolf',x:5,y:0},{t:'wolf',x:6,y:1}],
    chests:[{x:8,y:6,item:'sword'},{x:0,y:5,item:'potion'}],
    shards:[],
    intro:[
      {s:'narr',t:'翌朝。北の森から、狼の群れが村へ。'},
      {s:'alto',t:'村のみんなは家の中へ！　行くぞ、ユズ！'},
      {s:'yuzu',t:'四匹もいる！？　ちょっと多くない！？'},
    ],
    events:[{turn:2,type:'join',hero:'garo',x:2,y:8,lines:[
      {s:'garo',t:'……ガキが二人で狼の群れか。死ぬ気か。'},
      {s:'alto',t:'あんた誰だ！？'},
      {s:'garo',t:'流れの傭兵、ガロ。この村に一度、\n飯を恵んでもらった。──借りは返す。'},
    ]}],
    outro:[
      {s:'yuzu',t:'おじさん強〜い！'},
      {s:'garo',t:'おじさんではない。ガロだ。\n……それより、見ろ。'},
      {s:'garo',t:'世界の隅が──黒い。'},
    ],
  },
  { // 第三章
    title:'欠けはじめた世界', obj:'rout', voids:CORNER_VOIDS,
    heroes:{alto:[3,4], yuzu:[2,4], garo:[4,4]},
    enemies:[{t:'skel',x:1,y:1},{t:'skel',x:7,y:1},{t:'skel',x:1,y:7},{t:'skel',x:7,y:7},{t:'shade',x:4,y:0}],
    chests:[{x:8,y:3,item:'armor'},{x:0,y:4,item:'boots'}],
    shards:[],
    intro:[
      {s:'narr',t:'その夜。世界の四隅が、音もなく消えた。'},

// ---------- 効果音（超軽量シンセ） ----------
let AC = null;
function sfx(kind){
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if(AC.state === 'suspended') AC.resume();
    const now = AC.currentTime;
    const tone = (freq, dur, type, vol, when) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, now+when);
      g.gain.exponentialRampToValueAtTime(0.001, now+when+dur);
      o.connect(g); g.connect(AC.destination);
      o.start(now+when); o.stop(now+when+dur);
    };
    if(kind==='tap') tone(600,.06,'square',.05,0);
    else if(kind==='move') tone(440,.08,'triangle',.07,0);
    else if(kind==='hit'){ tone(160,.12,'sawtooth',.12,0); tone(90,.15,'square',.1,.02); }
    else if(kind==='heal'){ tone(520,.1,'triangle',.08,0); tone(780,.15,'triangle',.08,.08); }
    else if(kind==='pick'){ tone(880,.09,'square',.06,0); tone(1320,.12,'square',.06,.07); }
    else if(kind==='level'){ [523,659,784,1046].forEach((f,i)=>tone(f,.12,'triangle',.09,i*.09)); }
    else if(kind==='death'){ tone(220,.25,'sawtooth',.1,0); tone(110,.35,'sawtooth',.09,.05); }
    else if(kind==='void'){ tone(70,.5,'sawtooth',.12,0); }
  }catch(e){ /* 音は演出のみ。失敗しても無視 */ }
}

// ---------- 盤の生成・描画 ----------
function buildBoard(){
  boardEl.innerHTML = '';
  cellEls.length = 0;
  for(let y=0;y<CFG.GRID;y++) for(let x=0;x<CFG.GRID;x++){
    const c = document.createElement('div');
    c.className = 'cell';
    c.style.left = (x*100/CFG.GRID)+'%';
    c.style.top = (y*100/CFG.GRID)+'%';
    c.addEventListener('pointerdown', () => onCellTap(x,y));
    boardEl.appendChild(c);
    cellEls.push(c);
  }
}
function renderCells(){
  for(let y=0;y<CFG.GRID;y++) for(let x=0;x<CFG.GRID;x++){
    const i = idx(x,y), key = S.board[i], t = TERRAIN[key];
    const c = cellEls[i];
    c.className = 'cell t-'+key;
    if(S.moveSet.has(i) && S.sel && !S.selMoved) c.classList.add('hl-move');
    if(S.targets.some(u => idx(u.x,u.y)===i)) c.classList.add('hl-atk');
    if(S.dangerSet && S.dangerSet.has(i)) c.classList.add('hl-danger');
    c.innerHTML = t.deco ? `<span class="deco">${t.deco}</span>` : '';
  }
}
function posStyle(el,x,y){
  el.style.left = (x*100/CFG.GRID)+'%';
  el.style.top = (y*100/CFG.GRID)+'%';
}
function renderMarkers(){
  const want = new Map();
  S.chests.filter(c=>!c.opened).forEach(c => want.set('c'+idx(c.x,c.y), {x:c.x,y:c.y,e:'🎁'}));
  S.shards.filter(s=>!s.got).forEach(s => want.set('s'+idx(s.x,s.y), {x:s.x,y:s.y,e:'✨'}));
  for(const [k,el] of markerEls) if(!want.has(k)){ el.remove(); markerEls.delete(k); }
  for(const [k,m] of want){
    if(!markerEls.has(k)){
      const el = document.createElement('div');
      el.className = 'marker'; el.textContent = m.e;
      posStyle(el,m.x,m.y);
      boardEl.appendChild(el); markerEls.set(k,el);
    }
  }
}
function renderUnits(){
  for(const [id,el] of unitEls){
    if(!S.units.some(u=>u.uid===id && u.alive)){ el.remove(); unitEls.delete(id); }
  }
  for(const u of S.units){
    if(!u.alive) continue;
    let el = unitEls.get(u.uid);
    if(!el){
      el = document.createElement('div');
      el.className = 'unit side-'+u.side + (u.boss?' boss':'');
      el.innerHTML = `<div class="body">${u.emoji}</div><div class="hpbar"><div class="hpfill"></div></div><div class="lvtag"></div>`;
      boardEl.appendChild(el); unitEls.set(u.uid, el);
      posStyle(el,u.x,u.y);
    }
    posStyle(el,u.x,u.y);
    el.classList.toggle('acted', u.side==='hero' && !!u.acted && S.mode==='player');
    el.classList.toggle('selected', S.sel===u);
    el.querySelector('.hpfill').style.width = Math.max(0, u.hp/u.maxhp*100)+'%';
    el.querySelector('.lvtag').textContent = u.side==='hero' ? 'Lv'+u.lv : '';
  }
}

// ---------- 移動範囲（ダイクストラ：森はコスト2） ----------
function calcMove(u){
  const dist = new Map();
  dist.set(idx(u.x,u.y), 0);
  const pq = [[0,u.x,u.y]];
  while(pq.length){
    pq.sort((a,b)=>a[0]-b[0]);
    const [d,x,y] = pq.shift();
    if(d > dist.get(idx(x,y))) continue;
    for(const [dx,dy] of DIRS){
      const nx=x+dx, ny=y+dy;
      if(!inGrid(nx,ny)) continue;
      const t = terrainAt(nx,ny);
      if(!t.pass) continue;
      const occ = unitAt(nx,ny);
      if(occ && occ.side!==u.side) continue; // 敵はすり抜け不可
      const nd = d + t.cost;
      if(nd > u.mov) continue;
      const k = idx(nx,ny);
      if(dist.has(k) && dist.get(k)<=nd) continue;
      dist.set(k, nd);
      pq.push([nd,nx,ny]);
    }
  }
  for(const k of [...dist.keys()]){
    const x=k%CFG.GRID, y=Math.floor(k/CFG.GRID);
    const o = unitAt(x,y);
    if(o && o!==u) dist.delete(k); // 他ユニットのマスには止まれない
  }
  return dist;
}
function targetsFrom(u, x, y){
  return S.units.filter(v => v.alive && v.side!==u.side &&
    Math.abs(v.x-x)+Math.abs(v.y-y) >= 1 &&
    Math.abs(v.x-x)+Math.abs(v.y-y) <= u.rng);
}

// ---------- 入力 ----------
function onCellTap(x,y){
  if(S.busy) return;
  if(S.mode==='dialogue'){ if(dlgState.resolve) advanceDlg(); return; }
  if(S.mode!=='player') return;
  const u = unitAt(x,y);

  // 行動確定待ち（移動済み）：敵タップで攻撃
  if(S.sel && S.selMoved){
    if(u && S.targets.includes(u)){ doPlayerAttack(S.sel, u); }
    return;
  }
  // 選択中：移動 or 切替 or 直接攻撃
  if(S.sel && !S.selMoved){
    if(u === S.sel){ commitPosition(S.sel); return; } // その場で行動へ
    if(u && u.side==='hero' && !u.acted){ selectHero(u); return; }
    if(u && u.side==='enemy' && targetsFrom(S.sel,S.sel.x,S.sel.y).includes(u)){
      S.selMoved = true; S.selOrigin = {x:S.sel.x,y:S.sel.y};
      doPlayerAttack(S.sel, u); return;
    }
    if(S.moveSet.has(idx(x,y))){ movePlayerTo(S.sel,x,y); return; }
    deselect(); renderAll(); renderInfo(null); return;
  }
  // 未選択
  if(u && u.side==='hero' && !u.acted){ selectHero(u); return; }
  if(u && u.side==='enemy'){ toggleDanger(u); return; }
  if(u && u.side==='hero' && u.acted){ renderInfo(u); return; }
  S.dangerSet = null; S.dangerId = null;
  renderAll();
  const t = terrainAt(x,y);
  renderInfo(null, L.terrainInfo(t.name, t.def));
}
function selectHero(u){
  sfx('tap');
  S.sel = u; S.selMoved = false; S.selPicked = false;
  S.selOrigin = {x:u.x, y:u.y};
  S.moveSet = calcMove(u);
  S.targets = []; S.dangerSet = null; S.dangerId = null;
  renderAll(); renderInfo(u, L.moveHint);
}
function deselect(){
  S.sel = null; S.selMoved = false; S.selPicked = false;
  S.moveSet = new Map(); S.targets = [];
}
function toggleDanger(u){
  sfx('tap');
  if(S.dangerId === u.uid){ S.dangerSet = null; S.dangerId = null; renderAll(); renderInfo(u); return; }
  const reach = calcMove(u);
  const set = new Set(reach.keys());
  for(const k of reach.keys()){
    const x=k%CFG.GRID, y=Math.floor(k/CFG.GRID);
    for(let dx=-u.rng; dx<=u.rng; dx++) for(let dy=-u.rng; dy<=u.rng; dy++){
      if(Math.abs(dx)+Math.abs(dy)>u.rng) continue;
      const nx=x+dx, ny=y+dy;
      if(inGrid(nx,ny)) set.add(idx(nx,ny));
    }
  }
  S.dangerSet = set; S.dangerId = u.uid;
  renderAll(); renderInfo(u, L.enemyInfo);
}
async function movePlayerTo(u,x,y){
  S.busy = true; sfx('move');
  u.x = x; u.y = y;
  renderUnits();
  await sleep(CFG.ANIM_MOVE);
  S.selPicked = await tryPickup(u);
  S.busy = false;
  if(S.mode!=='player'){ deselect(); renderAll(); return; } // 拾得で章クリアした場合
  commitPosition(u);
}
function commitPosition(u){
  S.selMoved = true;
  S.targets = targetsFrom(u, u.x, u.y);
  renderAll(); renderInfo(u, L.actHint);
}
function cancelMove(){
  sfx('tap');
  const u = S.sel;
  u.x = S.selOrigin.x; u.y = S.selOrigin.y;
  deselect(); renderAll(); renderInfo(null);
}
function usePotion(){
  const u = S.sel;
  if(S.potions<=0 || !u) return;
  S.potions--;
  const amt = Math.min(CFG.POTION_HEAL, u.maxhp-u.hp);
  u.hp += amt;
  sfx('heal');
  floatText(u.x,u.y,'+'+amt,'heal');
  endHeroAction(u);
}
$('phaseBtn').addEventListener('pointerdown', ()=>{
  if(S.mode!=='player' || S.busy) return;
  sfx('tap');
  heroesAlive().forEach(h=>h.acted=true);
  deselect(); renderAll();
  startEnemyPhase();
});

// ---------- 戦闘 ----------
function floatText(x,y,txt,cls){
  const el = document.createElement('div');
  el.className = 'dmgfloat' + (cls?' '+cls:'');
  el.textContent = txt;
  posStyle(el,x,y);
  boardEl.appendChild(el);
  setTimeout(()=>el.remove(), 800);
}
async function bump(att,def){
  const el = unitEls.get(att.uid);
  if(!el) return;
  const dx = (def.x-att.x)*38, dy = (def.y-att.y)*38;
  const body = el.querySelector('.body');
  body.style.transform = `translate(${dx}%,${dy}%)`;
  await sleep(120);
  body.style.transform = '';
}
async function strike(a,d){
  await bump(a,d);
  const t = terrainAt(d.x,d.y);
  const dmg = Math.max(1, a.atk - (d.def + t.def));
  d.hp -= dmg;
  sfx('hit');
  floatText(d.x, d.y, dmg, '');
  renderUnits();
  if(a.side==='hero') gainExp(a, d.hp<=0 ? d.expReward : CFG.EXP_HIT);
  await sleep(CFG.ANIM_HIT);
  if(d.hp<=0) await killUnit(d);
}
async function combat(att,def){
  await strike(att,def);
  // 反撃：射程内なら撃ち返す
  if(def.alive && att.alive && mdist(att,def)<=def.rng) await strike(def,att);
}
async function killUnit(u){
  u.alive = false;
  sfx('death');
  const el = unitEls.get(u.uid);
  if(el){ el.style.transition = 'opacity .4s'; el.style.opacity = '0'; }
  await sleep(400);
  renderUnits();
}
function gainExp(h, amt){
  h.exp += amt;
  while(h.exp >= CFG.EXP_NEXT){
    h.exp -= CFG.EXP_NEXT;
    h.lv++;
    h.maxhp += 2; h.atk += 1;
    if(h.lv % 2 === 0) h.def += 1;
    h.hp = Math.min(h.maxhp, h.hp + CFG.LEVEL_HEAL);
    sfx('level');
    toast(L.levelUp(h.name, h.lv));
    floatText(h.x, h.y, 'LV UP!', 'crit');
  }
}
async function doPlayerAttack(hero, target){
  S.busy = true;
  S.targets = [];
  renderCells();
  await combat(hero, target);
  S.busy = false;
  if(!hero.alive){ await gameOver(hero); return; }
  if(await checkClear()) return;
  endHeroAction(hero);
}
function endHeroAction(u){
  u.acted = true;
  deselect();
  renderAll(); renderInfo(null);
  if(S.mode!=='player') return;
  if(heroesAlive().every(h=>h.acted)){
    setTimeout(()=>{ if(S.mode==='player') startEnemyPhase(); }, 350);
  }
}

// ---------- 拾得（宝箱・欠片） ----------
async function tryPickup(u){
  let picked = false;
  const chest = S.chests.find(c=>!c.opened && c.x===u.x && c.y===u.y);
  if(chest){
    chest.opened = true; picked = true;
    const item = ITEMS[chest.item];
    sfx('pick');
    if(chest.item==='potion'){ S.potions++; }
    else{ item.apply(u); }
    toast(L.gotItem(item.emoji+item.name), 1800);
    renderMarkers();
  }
  const shard = S.shards.find(s=>!s.got && s.x===u.x && s.y===u.y);
  if(shard){
    shard.got = true; picked = true;
    S.shardsGot++;
    sfx('pick');
    floatText(u.x,u.y,'✨','crit');
    toast(L.shardGet(S.shardsGot), 1800);
    renderMarkers();
    if(await checkClear()) return picked;
  }
  return picked;
}

// ---------- 敵フェイズ ----------
function heroDistField(){
  // 全ヒーローからのBFS距離（接近AI用・地形コスト無視の歩数）
  const dist = new Array(CFG.GRID*CFG.GRID).fill(Infinity);
  const q = [];
  for(const h of heroesAlive()){ dist[idx(h.x,h.y)] = 0; q.push([h.x,h.y]); }
  while(q.length){
    const [x,y] = q.shift();
    const d = dist[idx(x,y)];
    for(const [dx,dy] of DIRS){
      const nx=x+dx, ny=y+dy;
      if(!inGrid(nx,ny)) continue;
      if(!terrainAt(nx,ny).pass) continue;
      if(dist[idx(nx,ny)] <= d+1) continue;
      dist[idx(nx,ny)] = d+1;
      q.push([nx,ny]);
    }
  }
  return dist;
}
async function enemyAct(e){
  const reach = calcMove(e);
  reach.set(idx(e.x,e.y), 0);
  // 攻撃できる位置を探す（倒せる>大ダメージ>低HP狙い）
  let best = null;
  for(const k of reach.keys()){
    const x=k%CFG.GRID, y=Math.floor(k/CFG.GRID);
    for(const h of heroesAlive()){
      const d = Math.abs(h.x-x)+Math.abs(h.y-y);
      if(d<1 || d>e.rng) continue;
      const t = terrainAt(h.x,h.y);
      const dmg = Math.max(1, e.atk-(h.def+t.def));
      const score = (dmg>=h.hp ? 1000 : 0) + dmg*10 + (h.maxhp-h.hp);
      if(!best || score>best.score) best = {x,y,target:h,score};
    }
  }
  if(best){
    if(best.x!==e.x || best.y!==e.y){
      e.x = best.x; e.y = best.y;
      renderUnits(); await sleep(CFG.ANIM_MOVE);
    }
    await combat(e, best.target);
    return;
  }
  // 攻撃不可なら最寄りのヒーローへ接近
  const df = heroDistField();
  let bt = null;
  for(const k of reach.keys()){
    const x=k%CFG.GRID, y=Math.floor(k/CFG.GRID);
    const d = df[k];
    if(d===Infinity) continue;
    if(!bt || d<bt.d) bt = {x,y,d};
  }
  if(bt && (bt.x!==e.x || bt.y!==e.y)){
    e.x = bt.x; e.y = bt.y;
    renderUnits(); await sleep(CFG.ANIM_MOVE);
  }
}
async function startEnemyPhase(){
  S.mode = 'enemy'; S.busy = true;
  renderAll(); renderInfo(null, L.enemyPhase);
  await phaseBanner(L.enemyPhase, 'var(--red)');
  for(const e of [...S.units]){
    if(!e.alive || e.side!=='enemy') continue;
    if(S.mode!=='enemy') return; // 章クリア/敗北で中断
    await enemyAct(e);
    const dead = S.units.find(u=>u.side==='hero' && !u.alive);
    if(dead){ await gameOver(dead); return; }
    if(await checkClear()) return; // 反撃で全滅した場合
    await sleep(120);
  }
  // 終章：王がフチのマスを虚無化する
  const ch = CHAPTERS[S.chapterIdx];
  if(ch.corrupt){
    const boss = S.units.find(u=>u.alive && u.boss);
    if(boss) await corruptEdge();
  }
  S.turn++; S.totalTurns++;
  S.busy = false;
  await startPlayerPhase();
}
async function corruptEdge(){
  const cands = [];
  for(let x=0;x<CFG.GRID;x++) for(let y=0;y<CFG.GRID;y++){
    if(x!==0 && y!==0 && x!==CFG.GRID-1 && y!==CFG.GRID-1) continue;
    if(S.board[idx(x,y)]==='VOID') continue;
    if(unitAt(x,y)) continue;
    cands.push([x,y]);
  }
  if(!cands.length) return;
  const [x,y] = cands[Math.floor(Math.random()*cands.length)];
  S.board[idx(x,y)] = 'VOID';
  const chest = S.chests.find(c=>!c.opened && c.x===x && c.y===y);
  if(chest) chest.opened = true; // 虚無に呑まれた宝箱は失われる
  sfx('void');
  toast(L.corrupted, 1600);
  renderCells(); renderMarkers();
  await sleep(500);
}

// ---------- ターン進行・イベント ----------
async function startPlayerPhase(){
  S.mode = 'player';
  heroesAlive().forEach(h=>h.acted=false);
  renderAll(); renderInfo(null);
  await phaseBanner(L.turn(S.turn), 'var(--gold)');
  const ch = CHAPTERS[S.chapterIdx];
  for(const ev of ch.events){
    if(ev.turn!==S.turn || ev.done) continue;
    ev.done = true;
    if(ev.type==='join'){
      addHero(ev.hero, ev.x, ev.y);
      renderAll();
      await dialogue(ev.lines);
      toast(L.joined(NAMES[ev.hero]), 1600);
    }else if(ev.type==='summon'){
      const [fx,fy] = findFreeTile(ev.x, ev.y);
      spawnEnemy({t:ev.t, x:fx, y:fy});
      sfx('void');
      toast(L.summoned, 1500);
      renderAll();
    }
  }
  S.mode = 'player';
  renderAll();
}

// ---------- 章クリア・敗北 ----------
async function checkClear(){
  const ch = CHAPTERS[S.chapterIdx];
  let clear = false;
  if(ch.obj==='rout') clear = enemiesAlive().length===0;
  else if(ch.obj==='shards') clear = S.shardsGot>=3;
  else if(ch.obj==='boss') clear = !S.units.some(u=>u.alive && u.boss);
  if(!clear) return false;
  S.mode = 'anim'; S.busy = true;
  deselect(); renderAll();
  toast(L.chClear, 1500);
  sfx('level');
  await sleep(900);
  await dialogue(ch.outro);
  S.busy = false;
  if(S.chapterIdx >= CHAPTERS.length-1){ showEnding(); return true; }
  S.chapterIdx++;
  saveGame();
  await startChapter(S.chapterIdx);
  return true;
}
async function gameOver(hero){
  S.mode = 'over'; S.busy = false;
  $('overTitle').textContent = L.overTitle;
  $('overText').textContent = L.overText(hero.name);
  $('btnRetry').textContent = L.retry;
  $('overOv').style.display = 'flex';
}
function showEnding(){
  S.mode = 'ending';
  const maxLv = Math.max(...Object.values(S.party).map(h=>h.lv));
  $('endTop').textContent = L.endTop;
  $('endFin').textContent = L.endFin;
  $('endStats').textContent = L.endStats(S.totalTurns+S.turn, maxLv);
  $('btnAgain').textContent = L.again;
  localStorage.removeItem(CFG.SAVE_KEY);
  $('endOv').style.display = 'flex';
}

// ---------- ユニット生成・章ロード ----------
function makeHero(id){
  const b = HERO_BASE[id];
  return {uid:'h_'+id, id, side:'hero', name:NAMES[id], emoji:FACES[id],
    hp:b.hp, maxhp:b.hp, atk:b.atk, def:b.def, mov:b.mov, rng:b.rng,
    lv:1, exp:0, alive:true, acted:false, x:0, y:0};
}
function findFreeTile(x,y){
  // 指定マスが埋まっていたら最寄りの空き通行可能マスを探す
  const q = [[x,y]], seen = new Set([idx(x,y)]);
  while(q.length){
    const [cx,cy] = q.shift();
    if(terrainAt(cx,cy).pass && !unitAt(cx,cy)) return [cx,cy];
    for(const [dx,dy] of DIRS){
      const nx=cx+dx, ny=cy+dy;
      if(!inGrid(nx,ny) || seen.has(idx(nx,ny))) continue;
      seen.add(idx(nx,ny));
      q.push([nx,ny]);
    }
  }
  return [x,y];
}
function addHero(id, x, y){
  if(!S.party[id]) S.party[id] = makeHero(id);
  const h = S.party[id];
  const [fx,fy] = findFreeTile(x,y);
  h.alive = true; h.acted = false; h.x = fx; h.y = fy;
  if(!S.units.includes(h)) S.units.push(h);
  return h;
}
function spawnEnemy(spec){
  const t = ENEMY_TYPES[spec.t];
  const boost = spec.boost || 0;
  const e = {uid:'e'+(S.uidSeq++), side:'enemy', type:spec.t,
    name:t.name, emoji:t.emoji,
    hp:t.hp+boost*3, maxhp:t.hp+boost*3, atk:t.atk+boost, def:t.def,
    mov:t.mov, rng:t.rng, expReward:t.exp, boss:!!t.boss,
    alive:true, x:spec.x, y:spec.y};
  S.units.push(e);
  return e;
}
async function startChapter(ci){
  const ch = CHAPTERS[ci];
  S.chapterIdx = ci;
  S.totalTurns += S.turn>1 ? S.turn-1 : 0;
  S.turn = 1;
  // 章の合間に休息する想定で全回復（カジュアル向け）
  for(const h of Object.values(S.party)) h.hp = h.maxhp;
  S.snapshot = JSON.stringify({party:S.party, potions:S.potions});
  // 盤の構築（虚無を適用）
  S.board = [];
  for(let y=0;y<CFG.GRID;y++) for(let x=0;x<CFG.GRID;x++)
    S.board.push(CHAR_T[BASE_MAP[y][x]]);
  for(const [x,y] of ch.voids) S.board[idx(x,y)] = 'VOID';
  // ユニット配置
  S.units = [];
  for(const [id,pos] of Object.entries(ch.heroes)) addHero(id, pos[0], pos[1]);
  ch.enemies.forEach(spawnEnemy);
  ch.events.forEach(ev=>ev.done=false);
  S.chests = ch.chests.map(c=>({...c, opened:false}));
  S.shards = ch.shards.map(s=>({x:s[0], y:s[1], got:false}));
  S.shardsGot = 0;
  deselect();
  S.dangerSet = null; S.dangerId = null;
  // マーカー・ユニットDOMを作り直す
  for(const el of unitEls.values()) el.remove();
  unitEls.clear();
  for(const el of markerEls.values()) el.remove();
  markerEls.clear();
  S.mode = 'anim';
  renderAll(); renderInfo(null);
  await phaseBanner(L.chapter(ci+1, ch.title), 'var(--gold)');
  await dialogue(ch.intro);
  S.mode = 'player';
  await startPlayerPhase();
}
function retryChapter(){
  const snap = JSON.parse(S.snapshot);
  S.party = snap.party; S.potions = snap.potions;
  // JSON復元でオブジェクト参照が切れるためunitsは章ロードで再構築される
  startChapter(S.chapterIdx);
}

// ---------- セーブ ----------
function saveGame(){
  try{
    localStorage.setItem(CFG.SAVE_KEY, JSON.stringify({
      ch:S.chapterIdx, party:S.party, potions:S.potions, totalTurns:S.totalTurns,
    }));
  }catch(e){}
}
function loadGame(){
  try{
    const raw = localStorage.getItem(CFG.SAVE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}

// ---------- タイトル・メニュー ----------
function newGame(){
  $('titleOv').style.display = 'none';
  S.party = {}; S.potions = CFG.START_POTIONS;
  S.totalTurns = 0;
  localStorage.removeItem(CFG.SAVE_KEY);
  startChapter(0);
}
function continueGame(){
  const sv = loadGame();
  if(!sv) return;
  $('titleOv').style.display = 'none';
  S.party = sv.party; S.potions = sv.potions; S.totalTurns = sv.totalTurns||0;
  startChapter(sv.ch);
}
function showTitle(){
  ['menuOv','overOv','endOv'].forEach(id=>$(id).style.display='none');
  S.mode = 'title';
  $('titleTop').textContent = L.titleTop;
  $('titleSub').textContent = L.titleSub + '\n' + GAME_VERSION;
  $('btnNew').textContent = L.newGame;
  $('btnCont').textContent = L.contGame;
  $('btnCont').disabled = !loadGame();
  $('titleOv').style.display = 'flex';
}
$('btnNew').addEventListener('pointerdown', ()=>{ sfx('tap'); newGame(); });
$('btnCont').addEventListener('pointerdown', ()=>{ sfx('tap'); continueGame(); });
$('btnRetry').addEventListener('pointerdown', ()=>{ sfx('tap'); $('overOv').style.display='none'; retryChapter(); });
$('btnAgain').addEventListener('pointerdown', ()=>{ sfx('tap'); showTitle(); });
$('menuBtn').addEventListener('pointerdown', ()=>{
  if(S.mode!=='player' || S.busy) return;
  sfx('tap');
  S.mode = 'menu';
  $('menuTitle').textContent = L.menu;
  $('btnResume').textContent = L.resume;
  $('btnRetryMenu').textContent = L.retryCh;
  $('btnToTitle').textContent = L.toTitle;
  $('menuOv').style.display = 'flex';
});
$('btnResume').addEventListener('pointerdown', ()=>{ sfx('tap'); $('menuOv').style.display='none'; S.mode='player'; });
$('btnRetryMenu').addEventListener('pointerdown', ()=>{ sfx('tap'); $('menuOv').style.display='none'; retryChapter(); });
$('btnToTitle').addEventListener('pointerdown', ()=>{
  sfx('tap');
  localStorage.removeItem(CFG.SAVE_KEY);
  $('menuOv').style.display='none';
  showTitle();
});

// ---------- 起動 ----------
buildBoard();
renderInfo(null);
showTitle();

// 検証用フック（プレビューでの自動テスト用）
window.DBG = {S, CFG, CHAPTERS, startChapter, onCellTap, calcMove, unitAt, newGame,
  skipDlg: ()=>{ if(dlgState.resolve) closeDlg(); },
  endPhase: ()=>{ heroesAlive().forEach(h=>h.acted=true); deselect(); renderAll(); startEnemyPhase(); }};
</script>
