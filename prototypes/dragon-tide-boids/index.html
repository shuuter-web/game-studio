<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Dragon Tide - Boids Prototype</title>
<style>
  /* Mobile-first portrait layout. Disable text selection / callout to avoid
     long-press menus interrupting touch drag. */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #0a1622;
    color: #d8e6f2;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none; /* prevent browser-level pan/zoom from eating touch */
  }
  #stage { display: block; width: 100%; height: 100%; }
  #hud {
    position: fixed;
    top: env(safe-area-inset-top, 8px);
    right: 8px;
    padding: 8px 10px;
    background: rgba(8, 18, 28, 0.65);
    border: 1px solid rgba(120, 200, 255, 0.25);
    border-radius: 8px;
    font-size: 12px;
    line-height: 1.5;
    pointer-events: none;
    min-width: 132px;
    text-align: right;
    backdrop-filter: blur(4px);
  }
  #hud .row { display: flex; justify-content: space-between; gap: 8px; }
  #hud .k { color: #6fa6c8; }
  #hud .v { color: #ffffff; font-variant-numeric: tabular-nums; }
  #ctrls {
    position: fixed;
    bottom: env(safe-area-inset-bottom, 8px);
    left: 0; right: 0;
    display: flex; justify-content: center; gap: 8px;
    padding: 8px;
    pointer-events: none; /* let the canvas receive touches in empty space */
  }
  #ctrls button {
    pointer-events: auto;
    background: rgba(20, 36, 54, 0.85);
    color: #d8e6f2;
    border: 1px solid rgba(120, 200, 255, 0.35);
    border-radius: 18px;
    padding: 10px 14px;
    font-size: 13px;
    min-width: 64px;
  }
  #ctrls button.on { background: #1e5a8a; border-color: #6fc0ff; }
  #hint {
    position: fixed;
    top: 50%;
    left: 0; right: 0;
    text-align: center;
    transform: translateY(-50%);
    color: rgba(216, 230, 242, 0.5);
    font-size: 14px;
    pointer-events: none;
    transition: opacity 0.6s;
  }
  #hint.gone { opacity: 0; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="hud">
  <div class="row"><span class="k">FPS</span><span class="v" id="fps">--</span></div>
  <div class="row"><span class="k">avg</span><span class="v" id="fpsAvg">--</span></div>
  <div class="row"><span class="k">boids</span><span class="v" id="count">--</span></div>
  <div class="row"><span class="k">loop</span><span class="v" id="loopMode">setInterval</span></div>
  <div class="row"><span class="k">grid</span><span class="v" id="gridInfo">--</span></div>
  <div class="row"><span class="k">step</span><span class="v" id="stepMs">--</span></div>
</div>
<div id="hint">指でなぞって群れを導く</div>
<div id="ctrls">
  <button id="b50" class="on">50</button>
  <button id="b100">100</button>
  <button id="bLoop">rAF</button>
  <button id="bReset">reset</button>
</div>

<script>
"use strict";

/* ============================================================
 * Dragon Tide - Boids Prototype
 *
 * Architecture notes (tech-lead):
 *   - Single-file vanilla JS. No dependencies.
 *   - Fixed-rate logic loop via setInterval(16ms) per spec; rAF
 *     toggle available for comparative FPS measurement.
 *   - Decoupled update / render: update uses dt (seconds) so
 *     behaviour stays stable if the timer drifts (setInterval is
 *     not precise on mobile, and throttles in background).
 *   - Neighbour search via uniform spatial hash. Cell size equals
 *     the perception radius so each boid only inspects 9 cells.
 *   - Leader follows a polyline of waypoints recorded from touch.
 *   - Render uses one transform + one path per boid, batched in
 *     a single fillStyle to minimise state changes (Canvas 2D
 *     state changes are the dominant cost on mobile GPUs).
 * ============================================================ */

// ---------- Constants (data-driven knobs live here) ----------
const CONFIG = {
  // Visual world: we run sim in CSS pixels and scale render by DPR.
  maxDpr: 2,                 // cap devicePixelRatio to avoid Retina fill-rate cliffs

  // Boid behaviour
  perception: 40,            // px: separation/alignment/cohesion radius
  separationRadius: 18,      // px
  maxSpeed: 160,             // px/s
  minSpeed: 60,              // px/s (dragons keep gliding)
  maxForce: 320,             // px/s^2 acceleration cap

  wSeparation: 1.8,
  wAlignment:  1.0,
  wCohesion:   0.9,
  wLeader:     1.6,          // pull toward the leader/path
  leaderSeekDist: 80,        // px: target this far behind on the path

  // Leader / path
  pathMaxPoints: 240,
  pathMinSegment: 8,         // px: minimum spacing between recorded waypoints
  leaderSpeed: 220,          // px/s
  idleWanderRadius: 120,     // px: when no path, wander gently

  // Loop
  fixedStepMs: 16,           // setInterval rate
  // We clamp dt so a stalled tab does not produce a huge jump.
  maxDtMs: 64,

  // HUD
  hudUpdateMs: 250,
};

// ---------- Setup ----------
const canvas = document.getElementById("stage");
const ctx    = canvas.getContext("2d", { alpha: false, desynchronized: true });

const hud = {
  fps:    document.getElementById("fps"),
  fpsAvg: document.getElementById("fpsAvg"),
  count:  document.getElementById("count"),
  loop:   document.getElementById("loopMode"),
  grid:   document.getElementById("gridInfo"),
  step:   document.getElementById("stepMs"),
};

let viewW = 0, viewH = 0, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, CONFIG.maxDpr);
  viewW = window.innerWidth;
  viewH = window.innerHeight;
  canvas.width  = Math.floor(viewW * dpr);
  canvas.height = Math.floor(viewH * dpr);
  canvas.style.width  = viewW + "px";
  canvas.style.height = viewH + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", resize);
resize();

// ---------- Spatial hash ----------
// Why a uniform grid (not quadtree): boids are uniformly dense, perception
// radius is uniform, and rebuilding a quadtree every frame is more expensive
// than a flat integer-bucket scatter. Cell = perception so we scan 3x3 cells.
const CELL = CONFIG.perception;
const grid = new Map();  // key "cx,cy" -> array of indices into boid arrays
function gridKey(cx, cy) { return cx * 73856093 ^ cy * 19349663; } // hashed int key for Map

function gridClear() { grid.clear(); }
function gridInsert(i, x, y) {
  const cx = (x / CELL) | 0;
  const cy = (y / CELL) | 0;
  const k  = gridKey(cx, cy);
  let bucket = grid.get(k);
  if (!bucket) { bucket = []; grid.set(k, bucket); }
  bucket.push(i);
}
function gridQuery(x, y, out) {
  out.length = 0;
  const cx = (x / CELL) | 0;
  const cy = (y / CELL) | 0;
  for (let dy = -1; dy <= 1; dy++) {
    for (let dx = -1; dx <= 1; dx++) {
      const k = gridKey(cx + dx, cy + dy);
      const b = grid.get(k);
      if (!b) continue;
      for (let i = 0; i < b.length; i++) out.push(b[i]);
    }
  }
}

// ---------- Boids (Structure of Arrays for cache friendliness) ----------
let N = 0;
let px, py, vx, vy;
function allocate(n) {
  N = n;
  px = new Float32Array(n);
  py = new Float32Array(n);
  vx = new Float32Array(n);
  vy = new Float32Array(n);
  // Scatter near screen centre with random heading.
  const cx = viewW * 0.5, cy = viewH * 0.5;
  for (let i = 0; i < n; i++) {
    const r = Math.random() * 80;
    const a = Math.random() * Math.PI * 2;
    px[i] = cx + Math.cos(a) * r;
    py[i] = cy + Math.sin(a) * r;
    const ang = Math.random() * Math.PI * 2;
    vx[i] = Math.cos(ang) * CONFIG.minSpeed;
    vy[i] = Math.sin(ang) * CONFIG.minSpeed;
  }
}

// ---------- Leader & path ----------
const path = []; // [{x,y}, ...] waypoints from touch
const leader = { x: 0, y: 0, vx: 0, vy: 0, targetIdx: 0 };
function resetLeader() {
  leader.x = viewW * 0.5;
  leader.y = viewH * 0.5;
  leader.vx = CONFIG.leaderSpeed;
  leader.vy = 0;
  leader.targetIdx = 0;
  path.length = 0;
}

// ---------- Input ----------
let drawing = false;
let lastPath = { x: 0, y: 0 };
function pushPathPoint(x, y) {
  const last = path[path.length - 1];
  if (!last) {
    path.push({ x, y });
    return;
  }
  const dx = x - last.x, dy = y - last.y;
  if (dx * dx + dy * dy >= CONFIG.pathMinSegment * CONFIG.pathMinSegment) {
    path.push({ x, y });
    while (path.length > CONFIG.pathMaxPoints) path.shift();
  }
}
function inputStart(x, y) {
  drawing = true;
  path.length = 0;
  leader.targetIdx = 0;
  pushPathPoint(x, y);
  document.getElementById("hint").classList.add("gone");
}
function inputMove(x, y) { if (drawing) pushPathPoint(x, y); }
function inputEnd() { drawing = false; }

canvas.addEventListener("touchstart", e => {
  const t = e.touches[0]; inputStart(t.clientX, t.clientY); e.preventDefault();
}, { passive: false });
canvas.addEventListener("touchmove", e => {
  const t = e.touches[0]; inputMove(t.clientX, t.clientY); e.preventDefault();
}, { passive: false });
canvas.addEventListener("touchend",   e => { inputEnd(); e.preventDefault(); }, { passive: false });
canvas.addEventListener("touchcancel",e => { inputEnd(); e.preventDefault(); }, { passive: false });
canvas.addEventListener("mousedown",  e => inputStart(e.clientX, e.clientY));
canvas.addEventListener("mousemove",  e => inputMove(e.clientX, e.clientY));
canvas.addEventListener("mouseup",    inputEnd);
canvas.addEventListener("mouseleave", inputEnd);

// ---------- Simulation ----------
const neighbours = []; // scratch
function step(dt) {
  // 1) Advance leader toward next waypoint (or wander if no path).
  if (path.length > 0) {
    // Always seek the latest waypoint; the dragon "leader" is the player's
    // fingertip target, not a body that has to traverse every recorded point.
    // We still advance an index so the path "consumes" naturally as it's followed.
    let tgt = path[Math.min(leader.targetIdx, path.length - 1)];
    let dx = tgt.x - leader.x, dy = tgt.y - leader.y;
    let d2 = dx * dx + dy * dy;
    // Skip points the leader has effectively reached.
    while (d2 < 24 * 24 && leader.targetIdx < path.length - 1) {
      leader.targetIdx++;
      tgt = path[leader.targetIdx];
      dx = tgt.x - leader.x; dy = tgt.y - leader.y;
      d2 = dx * dx + dy * dy;
    }
    const d = Math.sqrt(d2) || 1;
    const sp = CONFIG.leaderSpeed;
    const desiredVx = (dx / d) * sp;
    const desiredVy = (dy / d) * sp;
    // simple critically-damped chase
    leader.vx += (desiredVx - leader.vx) * Math.min(1, dt * 6);
    leader.vy += (desiredVy - leader.vy) * Math.min(1, dt * 6);
  } else {
    // gentle drift back to centre when idle
    const cx = viewW * 0.5, cy = viewH * 0.5;
    leader.vx += ((cx - leader.x) * 0.5 - leader.vx) * Math.min(1, dt * 1.5);
    leader.vy += ((cy - leader.y) * 0.5 - leader.vy) * Math.min(1, dt * 1.5);
  }
  leader.x += leader.vx * dt;
  leader.y += leader.vy * dt;
  // Wrap leader to viewport
  if (leader.x < 0) leader.x = 0; if (leader.x > viewW) leader.x = viewW;
  if (leader.y < 0) leader.y = 0; if (leader.y > viewH) leader.y = viewH;

  // 2) Rebuild spatial hash.
  gridClear();
  for (let i = 0; i < N; i++) gridInsert(i, px[i], py[i]);

  // 3) Boid forces.
  const perc2 = CONFIG.perception * CONFIG.perception;
  const sep2  = CONFIG.separationRadius * CONFIG.separationRadius;
  const maxF  = CONFIG.maxForce;
  const maxV  = CONFIG.maxSpeed;
  const minV  = CONFIG.minSpeed;

  for (let i = 0; i < N; i++) {
    const xi = px[i], yi = py[i];
    let sepX = 0, sepY = 0;
    let aliX = 0, aliY = 0;
    let cohX = 0, cohY = 0;
    let nAli = 0, nCoh = 0;

    gridQuery(xi, yi, neighbours);
    for (let k = 0; k < neighbours.length; k++) {
      const j = neighbours[k];
      if (j === i) continue;
      const dx = xi - px[j], dy = yi - py[j];
      const d2 = dx * dx + dy * dy;
      if (d2 > perc2 || d2 === 0) continue;
      // Separation: weight by 1/d so very close neighbours dominate.
      if (d2 < sep2) {
        const invD = 1 / Math.sqrt(d2);
        sepX += dx * invD;
        sepY += dy * invD;
      }
      // Alignment: average velocity
      aliX += vx[j]; aliY += vy[j]; nAli++;
      // Cohesion: average position
      cohX += px[j]; cohY += py[j]; nCoh++;
    }

    // Compose steering (desired - current) in arbitrary units; we cap below.
    let ax = 0, ay = 0;

    // Separation - already a direction vector
    ax += sepX * CONFIG.wSeparation * 80;
    ay += sepY * CONFIG.wSeparation * 80;

    if (nAli > 0) {
      const inv = 1 / nAli;
      const desVx = aliX * inv, desVy = aliY * inv;
      ax += (desVx - vx[i]) * CONFIG.wAlignment;
      ay += (desVy - vy[i]) * CONFIG.wAlignment;
    }
    if (nCoh > 0) {
      const inv = 1 / nCoh;
      const cx = cohX * inv, cy = cohY * inv;
      ax += (cx - xi) * CONFIG.wCohesion;
      ay += (cy - yi) * CONFIG.wCohesion;
    }
    // Leader attraction: simple seek toward leader position. Weight scales
    // with distance so distant boids accelerate harder.
    {
      const dx = leader.x - xi, dy = leader.y - yi;
      const d  = Math.sqrt(dx * dx + dy * dy) || 1;
      ax += (dx / d) * CONFIG.wLeader * 120;
      ay += (dy / d) * CONFIG.wLeader * 120;
    }

    // Cap acceleration magnitude.
    const am = Math.sqrt(ax * ax + ay * ay);
    if (am > maxF) { const s = maxF / am; ax *= s; ay *= s; }

    // Integrate velocity, clamp speed to [minV, maxV].
    let nvx = vx[i] + ax * dt;
    let nvy = vy[i] + ay * dt;
    const sp = Math.sqrt(nvx * nvx + nvy * nvy);
    if (sp > maxV)      { const s = maxV / sp; nvx *= s; nvy *= s; }
    else if (sp < minV) { const s = (sp > 0.0001 ? minV / sp : 0); nvx *= s; nvy *= s; if (sp <= 0.0001) { nvx = minV; nvy = 0; } }
    vx[i] = nvx; vy[i] = nvy;

    // Integrate position; wrap on screen edges (toroidal world feels okay
    // for a flying-dragon prototype and prevents pile-ups against walls).
    let nx = xi + nvx * dt;
    let ny = yi + nvy * dt;
    if (nx < -10)        nx = viewW + 10;
    else if (nx > viewW + 10) nx = -10;
    if (ny < -10)        ny = viewH + 10;
    else if (ny > viewH + 10) ny = -10;
    px[i] = nx; py[i] = ny;
  }
}

// ---------- Rendering ----------
// Reusable triangle path so we don't reallocate.
function drawScene() {
  // Background with slight trail effect for motion smear (cheap on mobile;
  // a full clear also works if fillRect feels heavier than clearRect).
  ctx.fillStyle = "#0a1622";
  ctx.fillRect(0, 0, viewW, viewH);

  // Path trail
  if (path.length > 1) {
    ctx.strokeStyle = "rgba(120, 200, 255, 0.22)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(path[0].x, path[0].y);
    for (let i = 1; i < path.length; i++) ctx.lineTo(path[i].x, path[i].y);
    ctx.stroke();
  }

  // Leader marker
  ctx.fillStyle = "#ffd66f";
  ctx.beginPath();
  ctx.arc(leader.x, leader.y, 4, 0, Math.PI * 2);
  ctx.fill();

  // Boids: single fillStyle, transform-per-boid, shared triangle path.
  // We avoid ctx.save/restore (expensive on iOS Safari) and instead reset
  // the transform manually each iteration.
  ctx.fillStyle = "#7fc8ff";
  for (let i = 0; i < N; i++) {
    const x = px[i], y = py[i];
    const a = Math.atan2(vy[i], vx[i]);
    const cosA = Math.cos(a), sinA = Math.sin(a);
    // setTransform applies in CSS pixels (we already scaled by dpr globally,
    // so re-apply dpr to keep render crisp).
    ctx.setTransform(dpr * cosA, dpr * sinA, -dpr * sinA, dpr * cosA, x * dpr, y * dpr);
    ctx.beginPath();
    ctx.moveTo(7, 0);
    ctx.lineTo(-5,  3.5);
    ctx.lineTo(-5, -3.5);
    ctx.closePath();
    ctx.fill();
  }
  // Restore global transform.
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// ---------- FPS meter ----------
let fpsFrames = 0;
let fpsLast = performance.now();
let fpsValue = 0;
let fpsRolling = 0;          // EMA for "avg"
let stepMsRolling = 0;       // EMA for sim cost

function tickFps(now, stepMs) {
  fpsFrames++;
  // EMA on per-step cost
  stepMsRolling = stepMsRolling * 0.9 + stepMs * 0.1;
  const elapsed = now - fpsLast;
  if (elapsed >= CONFIG.hudUpdateMs) {
    fpsValue = (fpsFrames * 1000) / elapsed;
    fpsRolling = fpsRolling === 0 ? fpsValue : fpsRolling * 0.7 + fpsValue * 0.3;
    fpsFrames = 0;
    fpsLast = now;
    hud.fps.textContent    = fpsValue.toFixed(1);
    hud.fpsAvg.textContent = fpsRolling.toFixed(1);
    hud.count.textContent  = String(N);
    hud.grid.textContent   = String(grid.size);
    hud.step.textContent   = stepMsRolling.toFixed(2) + " ms";
  }
}

// ---------- Loop driver ----------
let useRaf = false;
let intervalHandle = null;
let rafHandle = null;
let lastTickTs = performance.now();

function tickOnce(nowTs) {
  // dt in seconds, clamped to avoid huge jumps after tab switch.
  let dtMs = nowTs - lastTickTs;
  if (dtMs > CONFIG.maxDtMs) dtMs = CONFIG.maxDtMs;
  lastTickTs = nowTs;
  const dt = dtMs / 1000;

  const t0 = performance.now();
  step(dt);
  const t1 = performance.now();
  drawScene();
  tickFps(performance.now(), t1 - t0);
}

function startLoop() {
  stopLoop();
  lastTickTs = performance.now();
  if (useRaf) {
    const frame = (ts) => { tickOnce(ts); rafHandle = requestAnimationFrame(frame); };
    rafHandle = requestAnimationFrame(frame);
    hud.loop.textContent = "rAF";
  } else {
    // Per spec: setInterval, so background tabs keep the sim alive
    // (mobile browsers still throttle, but less aggressively than rAF).
    intervalHandle = setInterval(() => tickOnce(performance.now()), CONFIG.fixedStepMs);
    hud.loop.textContent = "setInterval";
  }
}
function stopLoop() {
  if (intervalHandle != null) { clearInterval(intervalHandle); intervalHandle = null; }
  if (rafHandle      != null) { cancelAnimationFrame(rafHandle); rafHandle = null; }
}

// ---------- UI bindings ----------
const btn50    = document.getElementById("b50");
const btn100   = document.getElementById("b100");
const btnLoop  = document.getElementById("bLoop");
const btnReset = document.getElementById("bReset");

function setCount(n) {
  allocate(n);
  btn50.classList.toggle("on", n === 50);
  btn100.classList.toggle("on", n === 100);
  hud.count.textContent = String(n);
}
btn50.addEventListener("click",  () => setCount(50));
btn100.addEventListener("click", () => setCount(100));
btnLoop.addEventListener("click", () => {
  useRaf = !useRaf;
  btnLoop.textContent = useRaf ? "interval" : "rAF";
  startLoop();
});
btnReset.addEventListener("click", () => {
  resetLeader();
  setCount(N || 50);
});

window.addEventListener("keydown", (e) => {
  if (e.key === "1") setCount(50);
  else if (e.key === "2") setCount(100);
  else if (e.key === "r" || e.key === "R") { resetLeader(); setCount(N || 50); }
  else if (e.key === "l" || e.key === "L") { useRaf = !useRaf; btnLoop.textContent = useRaf ? "interval" : "rAF"; startLoop(); }
});

// ---------- Boot ----------
resetLeader();
setCount(50);
startLoop();

// Pause/resume on visibility (mostly for the rAF path; setInterval will
// continue throttled but we still want to reset the dt clock).
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) lastTickTs = performance.now();
});
</script>
</body>
</html>
