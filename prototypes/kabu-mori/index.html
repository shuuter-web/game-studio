<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>カブ盛りバブル — 相場検証プロト</title>
<style>
  :root {
    --paper: #fffaf0;
    --ink: #3b3326;
    --ink-soft: #7a6d58;
    --line: #e4d8bf;
    --accent: #6fae4b;
    --accent-ink: #ffffff;
    --shadow: 0 4px 14px rgba(60, 45, 20, 0.18);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd3df; color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "M PLUS Rounded 1c", "Yu Gothic", system-ui, sans-serif; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  /* 上：日付・相場・プレイヤー */
  #top { position: fixed; top: 0; left: 0; right: 0; padding: 8px 10px 0; pointer-events: none;
    display: flex; flex-direction: column; gap: 6px; max-width: 760px; margin: 0 auto; }
  #status { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; pointer-events: auto; }
  #status .pill { background: var(--paper); border-radius: 999px; padding: 4px 10px; box-shadow: var(--shadow); }
  #status .meta { margin-left: auto; font-size: 10px; font-weight: 400; color: var(--ink-soft); background: rgba(255,250,240,0.8); }
  #speed { border: 0; font: inherit; cursor: pointer; }
  .dot { width: 11px; height: 11px; border-radius: 50%; flex: none; border: 1px solid rgba(0,0,0,0.18); }
  #players { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
  .pcard { background: rgba(255,250,240,0.92); border-radius: 12px; padding: 4px 6px; box-shadow: var(--shadow);
    border: 2px solid transparent; min-width: 0; font-size: 11px; }
  .pcard.active { border-color: var(--pc); }
  .pcard .name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pcard .sub { color: var(--ink-soft); font-size: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pcard .coins { font-weight: 700; }
  .ministack { display: flex; align-items: flex-end; gap: 1px; height: 12px; margin-top: 2px; }
  .ministack i { border-radius: 50%; border: 1px solid rgba(0,0,0,0.2); flex: none; }

  /* 下：メッセージと選択肢 */
  #bottom { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 10px calc(10px + env(safe-area-inset-bottom));
    max-width: 760px; margin: 0 auto; }
  #panel { background: var(--paper); border-radius: 16px; padding: 10px 12px; box-shadow: var(--shadow); }
  #message { font-size: 14px; line-height: 1.5; min-height: 21px; }
  #rumors { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  #rumors:empty { display: none; }
  .rumor { font-size: 11px; background: #fff1c9; border-radius: 8px; padding: 2px 7px; }
  #buttons { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  #buttons:empty { display: none; }
  #buttons button { flex: 1 1 140px; min-height: 44px; border: 0; border-radius: 12px; font: inherit; font-size: 14px; font-weight: 700;
    background: var(--accent); color: var(--accent-ink); cursor: pointer; padding: 6px 10px; }
  #buttons button.secondary { background: #e9e0cc; color: var(--ink); }
  #buttons button:disabled { opacity: 0.55; cursor: default; }
  #buttons button.chip { flex: 0 1 auto; min-height: 40px; font-size: 13px; background: #ffffff; color: var(--ink);
    border: 2px solid var(--line); padding: 4px 9px; }

  #toast { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(0.9); opacity: 0;
    background: var(--paper); border-radius: 18px; padding: 12px 20px; font-size: 20px; font-weight: 700; box-shadow: var(--shadow);
    transition: opacity 0.2s, transform 0.2s; pointer-events: none; text-align: center; max-width: 86vw; }
  #toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  /* タイトル・結果 */
  #overlay { position: fixed; inset: 0; background: rgba(40, 60, 50, 0.45); display: flex; align-items: center; justify-content: center;
    padding: 16px; overflow-y: auto; }
  #overlay.hidden { display: none; }
  .sheet { background: var(--paper); border-radius: 20px; padding: 18px 18px 16px; max-width: 560px; width: 100%; box-shadow: var(--shadow);
    max-height: calc(100vh - 32px); overflow-y: auto; }
  .sheet h1 { margin: 0 0 2px; font-size: 26px; }
  .sheet h2 { font-size: 15px; margin: 16px 0 6px; }
  .sheet p, .sheet li { font-size: 13px; line-height: 1.6; }
  .sheet ol { padding-left: 20px; margin: 6px 0; }
  .sheet .lead { color: var(--ink-soft); margin-top: 0; }
  .sheet .actions { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .sheet .actions button { min-height: 48px; border: 0; border-radius: 14px; font: inherit; font-size: 15px; font-weight: 700;
    background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  .sheet .actions button.secondary { background: #e9e0cc; color: var(--ink); }
  .sheet .foot { font-size: 10px; color: var(--ink-soft); margin-top: 10px; }
  table.rank, table.faces { border-collapse: collapse; width: 100%; font-size: 12px; }
  table.rank td, table.faces td, table.faces th { padding: 4px 4px; border-bottom: 1px solid var(--line); text-align: center; }
  table.rank td:nth-child(2) { text-align: left; }
  .timeline-wrap { overflow-x: auto; }
  table.timeline { border-collapse: collapse; font-size: 10px; }
  table.timeline td, table.timeline th { border: 1px solid var(--line); padding: 1px 2px; text-align: center; min-width: 26px; vertical-align: top; }
  table.timeline th.typehead { text-align: left; white-space: nowrap; }
  table.timeline td.split { background: #fff1c9; }
  table.timeline td.herd { background: #dbe8f8; }
  .mark { display: block; line-height: 1.1; font-weight: 700; }
  .verdict { background: #f4f0e4; border-radius: 12px; padding: 8px 10px; font-size: 13px; line-height: 1.6; }
  .legend { font-size: 10px; color: var(--ink-soft); margin-top: 4px; }

  @media (max-width: 420px) {
    #message { font-size: 13px; }
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="top">
  <div id="status">
    <span class="pill" id="dayLabel">—</span>
    <button class="pill" id="speed" type="button">⏩ ふつう</button>
    <span class="pill meta" id="metaLabel"></span>
  </div>
  <div id="players"></div>
</div>

<div id="bottom">
  <div id="panel">
    <div id="message"></div>
    <div id="rumors"></div>
    <div id="buttons"></div>
  </div>
</div>

<div id="toast"></div>
<div id="overlay"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
// -----------------------------------------------------------------
// カブ盛りバブル — 相場検証プロト（PS-053）
//
// 検証したい最大の賭け：「頭を見て相場を読む」が駆け引きになるか。
// つまり、需給（全員の頭に乗っている数）で値が動くとき、売り時がプレイヤーごとに割れるか。
// 結果画面に「同じ日に、同じカブを誰かが売り・別の誰かが買った日（＝判断が割れた日）」を出す。
// v0.4.0：カブを「食べる」と突然変異ごとの効果が出る。頭の上では隣り合ったカブが増殖・合体・突然変異する
// （＝たくさん積むほど当たりが出る）。売る・食べるはタワーのどの段でも選べる。
// -----------------------------------------------------------------
const GAME_VERSION = "v0.5.0";

// ---- 調整値（データ駆動：ここだけ触ればバランスが変わる） ----
const CONFIG = {
  totalRounds: 16,            // 16日＝4週。1日＝全員が1手番
  roundsPerWeek: 4,           // 流行（隠れトレンド）が切り替わる単位
  startCoins: 12,
  startStackSize: 3,          // 最初から頭に乗っているカブ。隣り合い（増殖・突然変異）を序盤から起こすため3個
  maxStack: 12,               // これ以上は積めない（タワーの見た目の上限でもある）
  maxBuyPerVisit: 3,
  diceSides: 6,
  priceByLevel: [1, 2, 3, 5, 8],   // 段ごとの値段。上の段ほど伸び幅が大きい＝高値で売り抜ける価値を作る
  // 値段に上限はない（v0.5.0）。表の先は1段ごとに priceGrowthBeyond 倍で伸び続ける（8→13→21→33…）
  priceGrowthBeyond: 1.6,
  faces: ["😱", "😟", "🙂", "😄", "🤩"],   // 結果画面の記録表だけで使う（遊んでいる間は大きさで見せる）。🤩より上は🚀
  // 相場は数字やUIでなく、カブの大きさで見せる。島じゅうの同じ種類のカブが一斉に膨らむ／しぼむ。
  // 1段ごとに約1.25倍：並べたときに段の違いが目で分かる最小の差
  sizeByLevel: [0.62, 0.8, 1.0, 1.25, 1.55],
  // 表の先も1段ごとに大きくなり続ける。値段ほど急に伸ばさないのは、タワーが画面からはみ出さないようにするため
  sizeGrowthBeyond: 1.18,
  supplyPressurePerTurnip: 0.11,   // 平均より1個多く頭に乗っているごとに、毎日これだけ下がる
  meanReversion: 0.07,             // 真ん中（🙂）へ戻ろうとする力。張り付き防止
  trendChoices: [-0.45, -0.25, 0.25, 0.45],   // 週ごとの流行の強さ。0を入れないのは、うわさが必ず方向を持つようにするため
  rumorTruthRate: 0.75,            // うわさが本当である確率
  radioShift: 1,                   // ラジオのニュースで動く段数
  favoriteShopBonus: 1,            // 店主の好きなカブは顔が1段上で売れる
  // ---- 頭の上の反応（自分の手番の終わりに、自分の頭だけで起きる） ----
  growChance: 0.35,                // 同じ色が隣り合ったペアごとに、その色が1個増える確率
  mutateChance: 0.25,              // 違う色が隣り合ったペアごとに、どちらかに突然変異が付く確率
  bombFuse: 5,                     // 💣 は持ち主の手番の終わりを5回迎えると破裂し、両隣ごと吹き飛ぶ（v0.4.1で3→5：出過ぎて待ちが短かった）
  bombMutationRate: 0.35,          // べに×ほし の突然変異が💣になる確率（外れたら何も起きない）。v0.4.1で出現を減らした
  bigSizeFactor: 1.4,              // 同じ色3連が合体した「大カブ」の見た目の大きさ
  bigPriceMultiplier: 4,           // 大カブは同じ色1個の4倍で売れる。3個を合体させたので、3倍を超えないと合体が損になる
  groundTraitChance: 0.4,          // カブマスに置かれるカブが突然変異つきである確率
};

// 突然変異。食べたときの効果と、頭の上での見分け方（アイコン）
const TRAITS = {
  puff:    { icon: "🎈", name: "ふくらみ", short: "値上げ",       eat: "このカブの色が島じゅうで1段大きくなる" },
  wilt:    { icon: "🥀", name: "しおれ",   short: "値下げ",       eat: "好きな色を1段小さくする" },
  run:     { icon: "👟", name: "はしり",   short: "サイコロ2回",  eat: "このターンはサイコロを2回振って足す" },
  magnet:  { icon: "🧲", name: "じしゃく", short: "引き寄せ",     eat: "好きな相手の頭から好きなカブを1個引き寄せる" },
  sparkle: { icon: "✨", name: "きらきら", short: "うわさ的中",   eat: "次に聞くうわさが必ず本当になる" },
  bomb:    { icon: "💣", name: "ばくだん", short: "",             eat: "食べられない・売れない。5日で破裂して両隣ごと吹き飛ぶ。押し付けるしかない" },
};
// 違う色が隣り合うと付く突然変異（色の組み合わせで決まる）。順番は TURNIP_TYPES の添字の小さい方→大きい方
const PAIR_TRAITS = { "0-1": "run", "0-2": "sparkle", "0-3": "wilt", "1-2": "puff", "1-3": "bomb", "2-3": "magnet" };
const GROUND_TRAITS = ["puff", "puff", "wilt", "run", "magnet", "sparkle"];   // カブマスに出る突然変異（💣は頭の上の突然変異でしか生まれない）

// 見た目・待ち時間（ミリ秒）。?headless=1 では全部0になる
const TIMING = { hop: 230, cpuThink: 520, toast: 1100, fly: 380, marketTick: 900 };

const TURNIP_TYPES = [
  { id: "white", name: "しろカブ", color: 0xf4efe4, css: "#f4efe4", volatility: 0.18, supplySensitivity: 1, start: 2,
    note: "値動き小さめ" },
  { id: "red",   name: "べにカブ", color: 0xe0485e, css: "#e0485e", volatility: 0.32, supplySensitivity: 1, start: 2,
    note: "ふつう" },
  { id: "gold",  name: "きんカブ", color: 0xf2c230, css: "#f2c230", volatility: 0.3, supplySensitivity: 2, start: 3,
    note: "高い。みんなが持つと2倍の速さで下がる" },
  { id: "star",  name: "ほしカブ", color: 0x8a63e0, css: "#8a63e0", volatility: 0.6, supplySensitivity: 1, start: 1,
    note: "値動きが荒い" },
];

const SHOPS = [
  { name: "ひつじ屋",   emoji: "🐑", likes: 0 },
  { name: "りす商店",   emoji: "🐿️", likes: 1 },
  { name: "ペンギン堂", emoji: "🐧", likes: 2 },
  { name: "かめ屋",     emoji: "🐢", likes: 3 },
];

// 1周16マス。畑（買う）は止まったときだけ、市場（売る）は通りがかりでも寄れる。
// 売り時をサイコロ任せにせず、プレイヤーの判断にするため。
// カブマスにはカブが1個置いてあり、止まるとタダで拾える＋そのカブのうわさが聞こえる。
// v0.2.0 まではカブを得る機会が畑（4/16マス）だけで少なかった（ユーザー判定）ため、道とうわさマスをカブマスにした。
const BOARD = [
  { kind: "field", type: 0 }, { kind: "kabu" },  { kind: "kabu" }, { kind: "market", shop: 0 },
  { kind: "field", type: 1 }, { kind: "radio" }, { kind: "kabu" }, { kind: "market", shop: 1 },
  { kind: "field", type: 2 }, { kind: "kabu" },  { kind: "kabu" }, { kind: "market", shop: 2 },
  { kind: "field", type: 3 }, { kind: "radio" }, { kind: "kabu" }, { kind: "market", shop: 3 },
];

const CHARACTERS = [
  { name: "くま",   emoji: "🐻", kind: "bear",   body: 0xb3794c, inner: 0xe8c9a4, css: "#b3794c" },
  { name: "うさぎ", emoji: "🐰", kind: "rabbit", body: 0xf5ecef, inner: 0xf3b6c6, css: "#e58fb0" },
  { name: "ねこ",   emoji: "🐱", kind: "cat",    body: 0xf2a65a, inner: 0xfbe3c4, css: "#e8902f" },
  { name: "いぬ",   emoji: "🐶", kind: "dog",    body: 0xd9c29b, inner: 0x8a6a48, css: "#5d8fd0" },
];

const PERSONALITIES = {
  human:      { label: "プレイヤー" },
  trend:      { label: "順張り" },
  contrarian: { label: "逆張り" },
  rumor:      { label: "うわさ好き" },
  whim:       { label: "気まぐれ" },
};

// -----------------------------------------------------------------
// 乱数（スタジオ共通ルール）
//   random()   … ゲーム状態に影響する乱数（サイコロ・流行・うわさ）。?seed= で再現する対象
//   fxRandom() … 見た目だけの乱数（カブの傾き等）
// -----------------------------------------------------------------
function makeRandomGenerator(seedValue) {   // mulberry32
  let state = seedValue >>> 0;
  return function nextRandom() {
    state = (state + 0x6D2B79F5) >>> 0;
    let t = state;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let currentSeed = 0;
let nextLogicRandom = null;
let nextFxRandom = null;
function reseedRandom(seed) {
  currentSeed = seed >>> 0;
  nextLogicRandom = makeRandomGenerator(currentSeed);
  nextFxRandom = makeRandomGenerator((currentSeed ^ 0x9E3779B9) >>> 0);
}
function random()   { return nextLogicRandom(); }
function fxRandom() { return nextFxRandom(); }
function randomInt(count) { return Math.floor(random() * count); }

const params = new URLSearchParams(location.search);
const isHeadless = params.has("headless");   // 自動検証用：演出待ちを0にする
let speedFactor = isHeadless ? 0 : 1;

function clamp(value, low, high) { return Math.max(low, Math.min(high, value)); }
function wait(ms) {
  const scaled = ms * speedFactor;
  return scaled <= 0 ? Promise.resolve() : new Promise((resolve) => setTimeout(resolve, scaled));
}

// -----------------------------------------------------------------
// ゲーム状態
// -----------------------------------------------------------------
const game = {
  mode: "solo",
  round: 0,
  currentPlayer: 0,
  finished: false,
  trends: [],      // [週][種類] 隠れトレンド。うわさはこれの「来週ぶん」を漏らす
  market: [],      // 種類ごとの { value, level, lastDelta, history }
  players: [],
  actionLog: [],   // { round, player, type, kind: "buy"|"sell"|"hold"|"pick"|"push"|"grab", level }
  ground: {},      // カブマスの番号 → 置いてあるカブ（拾われたら null、日の終わりに補充）
  stats: {},       // 食べた・増えた・合体・突然変異・破裂の回数（検証用）
  newsLog: [],
};

function currentWeekIndex() { return Math.floor((Math.max(game.round, 1) - 1) / CONFIG.roundsPerWeek); }
function weekCount() { return Math.ceil(CONFIG.totalRounds / CONFIG.roundsPerWeek); }
function roundsLeft() { return CONFIG.totalRounds - game.round; }
// 段は下にだけ底がある（0＝いちばん小さい）。上には上限がない
function levelOf(value) { return Math.max(0, Math.round(value)); }
function priceOf(level) {
  const table = CONFIG.priceByLevel;
  if (level < table.length) return table[level];
  return Math.round(table[table.length - 1] * Math.pow(CONFIG.priceGrowthBeyond, level - (table.length - 1)));
}
function sizeOfLevel(level) {
  const table = CONFIG.sizeByLevel;
  if (level < table.length) return table[level];
  return table[table.length - 1] * Math.pow(CONFIG.sizeGrowthBeyond, level - (table.length - 1));
}
function faceOf(level) { return level < CONFIG.faces.length ? CONFIG.faces[level] : "🚀"; }

// 頭の上のカブ1個。type＝色（値段）、trait＝突然変異、big＝合体した大カブ、age＝💣の導火線
let nextTurnipId = 1;
function makeTurnip(type, trait) {
  return { id: nextTurnipId++, type, trait: trait || null, big: false, age: 0 };
}
function makeGroundTurnip() {
  const type = randomInt(TURNIP_TYPES.length);
  const trait = random() < CONFIG.groundTraitChance ? GROUND_TRAITS[randomInt(GROUND_TRAITS.length)] : null;
  return makeTurnip(type, trait);
}

function totalHeld(typeIndex) {
  let count = 0;
  for (const player of game.players) for (const turnip of player.stack) if (turnip.type === typeIndex) count++;
  return count;
}
function averageHeld() {
  let sum = 0;
  for (let t = 0; t < TURNIP_TYPES.length; t++) sum += totalHeld(t);
  return sum / TURNIP_TYPES.length;
}

function setupGame(mode, seed) {
  reseedRandom(seed);
  game.mode = mode;
  game.round = 0;
  game.finished = false;
  game.actionLog = [];
  game.newsLog = [];
  game.trends = [];
  for (let w = 0; w < weekCount(); w++) {
    game.trends.push(TURNIP_TYPES.map(() => CONFIG.trendChoices[randomInt(CONFIG.trendChoices.length)]));
  }
  game.market = TURNIP_TYPES.map((type) => ({ value: type.start, level: type.start, lastDelta: 0, history: [type.start] }));
  game.ground = {};
  BOARD.forEach((tile, index) => { if (tile.kind === "kabu") game.ground[index] = makeGroundTurnip(); });
  game.maxHeight = 0;
  game.stats = { pushedBombs: 0, eats: 0, grows: 0, merges: 0, mutations: 0, explosions: 0, lostToBombs: 0 };

  const personalitiesByMode = {
    solo:  ["human", "trend", "contrarian", "rumor"],
    party: ["human", "human", "human", "human"],
    watch: ["trend", "contrarian", "rumor", "whim"],
  };
  game.players = CHARACTERS.map((character, index) => {
    const personality = personalitiesByMode[mode][index];
    const stack = [];
    for (let k = 0; k < CONFIG.startStackSize; k++) stack.push(makeTurnip(randomInt(TURNIP_TYPES.length)));
    return {
      index, character, personality,
      isCpu: personality !== "human",
      name: mode === "party" ? `${character.emoji} ${character.name}` :
            (personality === "human" ? `${character.emoji} あなた` : `${character.emoji} ${character.name}`),
      coins: CONFIG.startCoins,
      position: 0,
      stack,                // 下→上（末尾がてっぺん）。売る・食べるはどの段でも選べる
      rumors: [],           // { week, type, direction }
      extraRoll: false,     // 👟 を食べたターンはサイコロ2回
      nextRumorTrue: false, // ✨ を食べると次のうわさが必ず本当
    };
  });
}

// ---- 相場：毎日の終わりに、流行＋需給＋ゆらぎで動く ----
function updateMarketLogic() {
  const week = currentWeekIndex();
  const average = averageHeld();
  const totals = TURNIP_TYPES.map((_, t) => totalHeld(t));
  TURNIP_TYPES.forEach((type, t) => {
    const entry = game.market[t];
    const before = entry.level;
    const supplyPressure = (totals[t] - average) * CONFIG.supplyPressurePerTurnip * type.supplySensitivity;
    const noise = (random() * 2 - 1) * type.volatility;
    const reversion = CONFIG.meanReversion * (2 - entry.value);
    entry.value = Math.max(-0.4, entry.value + game.trends[week][t] - supplyPressure + noise + reversion);
    entry.level = levelOf(entry.value);
    entry.lastDelta = entry.level - before;
    entry.history.push(entry.level);
  });
}

function applyNews(typeIndex, shift) {
  const entry = game.market[typeIndex];
  const before = entry.level;
  entry.value = Math.max(-0.4, entry.value + shift);
  entry.level = levelOf(entry.value);
  entry.lastDelta = entry.level - before;
}

function drawRumor(player, typeIndex) {
  const week = Math.min(currentWeekIndex() + 1, weekCount() - 1);
  const trueDirection = Math.sign(game.trends[week][typeIndex]);
  const isTrue = player.nextRumorTrue || random() < CONFIG.rumorTruthRate;
  player.nextRumorTrue = false;
  const rumor = { week, type: typeIndex, direction: isTrue ? trueDirection : -trueDirection, isTrue };
  player.rumors.push(rumor);
  return rumor;
}
function rumorText(rumor) {
  const when = rumor.week > currentWeekIndex() ? "来週" : "今週";
  const type = TURNIP_TYPES[rumor.type].name;
  return rumor.direction > 0 ? `${when}、${type}が流行るらしい` : `${when}、${type}は飽きられるらしい`;
}

function recordAction(player, typeIndex, kind) {
  game.actionLog.push({ round: game.round, player: player.index, type: typeIndex, kind, level: game.market[typeIndex].level });
}

// -----------------------------------------------------------------
// CPU の読み方（性格ごとに見るものが違う＝判断が割れる余地を作る）
// -----------------------------------------------------------------
function cpuOutlook(player, typeIndex) {
  const entry = game.market[typeIndex];
  const surplus = totalHeld(typeIndex) - averageHeld();
  const sensitivity = TURNIP_TYPES[typeIndex].supplySensitivity;
  switch (player.personality) {
    case "trend": {
      const history = entry.history;
      const recent = history.length >= 3 ? history[history.length - 1] - history[history.length - 3] : 0;
      return entry.lastDelta * 0.8 + recent * 0.3 - surplus * 0.04 * sensitivity;
    }
    case "contrarian":
      return (2 - entry.level) * 0.5 - surplus * 0.22 * sensitivity;
    case "rumor": {
      let belief = 0;
      for (const rumor of player.rumors) {
        if (rumor.type !== typeIndex) continue;
        if (rumor.week === currentWeekIndex()) belief += rumor.direction * 0.8;
        else if (rumor.week === currentWeekIndex() + 1) belief += rumor.direction * 0.5;
      }
      return belief + (2 - entry.level) * 0.2 - surplus * 0.06 * sensitivity;
    }
    case "whim":
      return random() * 2 - 1;
    default:
      return 0;
  }
}

function cpuWantsToSell(player, typeIndex, sellLevel) {
  if (roundsLeft() <= 1) return true;                // 最終日はしおれる前に全部売る
  if (sellLevel >= 4) return true;                   // 🤩 は誰でも売る
  if (player.personality === "contrarian" && sellLevel >= 3) return true;
  return cpuOutlook(player, typeIndex) < -0.15;
}

function cpuBuyCount(player, typeIndex, maxBuy) {
  if (maxBuy <= 0 || roundsLeft() <= 2) return 0;
  const level = game.market[typeIndex].level;
  if (level >= 4) return 0;
  const outlook = cpuOutlook(player, typeIndex);
  if (outlook <= 0.05) return 0;
  return Math.min(maxBuy, outlook > 0.6 ? 3 : outlook > 0.3 ? 2 : 1);
}

const canvas = document.getElementById("scene");
const hasThree = typeof THREE !== "undefined";
let renderer = null, scene = null, camera = null;
const view = {

  targetAngle: 0,

  sizes: TURNIP_TYPES.map(() => ({ value: 1, velocity: 0 })),   // 種類ごとの今のカブの大きさ（ばねで目標へ寄る）
  tweens: [],

};
const turnipGeometry = {};

function tilePosition(index) {
  const angle = (index / BOARD.length) * Math.PI * 2;
  return { x: Math.sin(angle) * view.ringRadius, z: Math.cos(angle) * view.ringRadius, angle };
}

// 同じマスに複数人いても重ならないよう、人ごとに決まった位置にずらす
const SLOT_OFFSETS = [[-0.32, -0.3], [0.32, -0.3], [-0.32, 0.3], [0.32, 0.3]];
function standingPoint(tileIndex, playerIndex) {
  const tile = tilePosition(tileIndex);
  const [dx, dz] = SLOT_OFFSETS[playerIndex];
  const cos = Math.cos(tile.angle), sin = Math.sin(tile.angle);
  return new THREE.Vector3(tile.x + dx * cos + dz * sin, 0.32, tile.z - dx * sin + dz * cos);
}

const emojiTextureCache = {};
function makeEmojiSprite(text, size, background) {
  // 頭の上のカブは何度も作り直すので、同じ絵文字のテクスチャは使い回す
  const cacheKey = `${text}|${background || ""}`;
  if (emojiTextureCache[cacheKey]) {
    const cached = new THREE.Sprite(new THREE.SpriteMaterial({ map: emojiTextureCache[cacheKey], transparent: true, depthWrite: false }));
    cached.scale.set(size, size, size);
    return cached;
  }
  const pixel = 128;
  const spriteCanvas = document.createElement("canvas");
  spriteCanvas.width = spriteCanvas.height = pixel;
  const context = spriteCanvas.getContext("2d");
  if (background) {
    context.fillStyle = background;
    context.beginPath(); context.arc(pixel / 2, pixel / 2, pixel / 2 - 4, 0, Math.PI * 2); context.fill();
  }
  context.font = `${Math.round(pixel * 0.62)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
  context.textAlign = "center"; context.textBaseline = "middle";
  context.fillText(text, pixel / 2, pixel / 2 + 6);
  const texture = new THREE.CanvasTexture(spriteCanvas);
  emojiTextureCache[cacheKey] = texture;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, depthWrite: false }));
  sprite.scale.set(size, size, size);
  sprite.userData.canvas = spriteCanvas;
  return sprite;
}
function standardMaterial(color, extra) {
  return new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.75, metalness: 0 }, extra || {}));
}

function buildTurnipAssets() {
  // カブの胴：下がとがった玉ねぎ型を回転体で作る
  const profile = [[0.002, 0], [0.025, 0.035], [0.07, 0.08], [0.15, 0.14], [0.205, 0.21], [0.215, 0.27],
                   [0.18, 0.335], [0.11, 0.38], [0.04, 0.4], [0.002, 0.405]];
  turnipGeometry.bulb = new THREE.LatheGeometry(profile.map(([x, y]) => new THREE.Vector2(x, y)), 20);
  turnipGeometry.leaf = new THREE.SphereGeometry(1, 10, 8);
  turnipGeometry.root = new THREE.ConeGeometry(0.018, 0.12, 6);
  turnipGeometry.leafMaterial = standardMaterial(0x5aa83c);
  turnipGeometry.stemMaterial = standardMaterial(0x7cc24f);
  TURNIP_TYPES.forEach((type) => {
    const extra = type.id === "gold" ? { metalness: 0.55, roughness: 0.32, emissive: 0x4a3300 } :
                  type.id === "star" ? { emissive: 0x24105a, roughness: 0.45 } :
                  type.id === "white" ? { roughness: 0.6 } : { roughness: 0.55 };
    turnipMaterials.push(standardMaterial(type.color, extra));
  });
}

const TURNIP_HEIGHT = 0.405;
// baseScale は置き場所ごとの大きさ。実際の大きさは毎フレーム baseScale × 相場の大きさ になる
function makeTurnipMesh(typeIndex, baseScale, turnip) {
  const group = new THREE.Group();
  group.userData.turnipType = typeIndex;
  group.userData.baseScale = baseScale || 1;
  const bulb = new THREE.Mesh(turnipGeometry.bulb, turnipMaterials[typeIndex]);
  bulb.castShadow = true;
  group.add(bulb);
  const root = new THREE.Mesh(turnipGeometry.root, turnipGeometry.stemMaterial);
  root.rotation.x = Math.PI; root.position.y = -0.04;
  group.add(root);
  for (let k = 0; k < 3; k++) {
    const leaf = new THREE.Mesh(turnipGeometry.leaf, k === 1 ? turnipGeometry.stemMaterial : turnipGeometry.leafMaterial);
    leaf.scale.set(0.05, 0.17, 0.1);
    const yaw = (k - 1) * 0.9;
    leaf.position.set(Math.sin(yaw) * 0.07, 0.5, Math.cos(yaw) * 0.02);
    leaf.rotation.z = -(k - 1) * 0.55;
    leaf.castShadow = true;
    group.add(leaf);
  }
  if (TURNIP_TYPES[typeIndex].id === "star") {
    const sparkle = makeEmojiSprite("✨", 0.26);
    sparkle.position.set(0.2, 0.32, 0.1);
    group.add(sparkle);
  }
  if (turnip && turnip.trait) {
    // 突然変異はカブの横にアイコンを付けて見分ける。💣 は導火線が短くなるほど大きくなる
    const iconSize = turnip.trait === "bomb" ? 0.3 + turnip.age * 0.07 : 0.3;
    const icon = makeEmojiSprite(TRAITS[turnip.trait].icon, iconSize);
    icon.position.set(0.24, 0.24, 0.16);
    group.add(icon);
  }
  if (turnip && turnip.big) {
    const crown = makeEmojiSprite("👑", 0.26);
    crown.position.set(-0.2, 0.36, 0.14);
    group.add(crown);
  }
  return group;
}
function turnipScale(turnip) { return turnip.big ? CONFIG.bigSizeFactor : 1; }

function buildCharacter(character) {
  const root = new THREE.Group();
  const bodyMaterial = standardMaterial(character.body);
  const innerMaterial = standardMaterial(character.inner);
  const darkMaterial = standardMaterial(0x2b2420, { roughness: 0.4 });
  const cheekMaterial = standardMaterial(0xf4a0a8);

  const body = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 16), bodyMaterial);
  body.scale.set(0.36, 0.42, 0.33); body.position.y = 0.42; body.castShadow = true;
  root.add(body);
  const belly = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 12), innerMaterial);
  belly.scale.set(0.24, 0.28, 0.12); belly.position.set(0, 0.38, 0.24);
  root.add(belly);
  for (const side of [-1, 1]) {
    const foot = new THREE.Mesh(new THREE.SphereGeometry(0.12, 12, 10), bodyMaterial);
    foot.scale.set(1, 0.6, 1.3); foot.position.set(side * 0.16, 0.06, 0.06); foot.castShadow = true;
    root.add(foot);
    const arm = new THREE.Mesh(new THREE.SphereGeometry(0.1, 12, 10), bodyMaterial);
    arm.scale.set(0.8, 1.3, 0.8); arm.position.set(side * 0.36, 0.5, 0.05); arm.rotation.z = side * 0.5;
    root.add(arm);
  }

  const head = new THREE.Group();
  head.position.y = 1.08;
  root.add(head);
  const skull = new THREE.Mesh(new THREE.SphereGeometry(0.44, 24, 18), bodyMaterial);
  skull.scale.set(1.08, 0.95, 1); skull.castShadow = true;
  head.add(skull);
  const muzzle = new THREE.Mesh(new THREE.SphereGeometry(0.17, 16, 12), innerMaterial);
  muzzle.scale.set(1.2, 0.8, 0.8); muzzle.position.set(0, -0.12, 0.36);
  head.add(muzzle);
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.05, 10, 8), darkMaterial);
  nose.position.set(0, -0.07, 0.49);
  head.add(nose);
  for (const side of [-1, 1]) {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.05, 10, 8), darkMaterial);
    eye.scale.set(1, 1.3, 0.6); eye.position.set(side * 0.17, 0.05, 0.4);
    head.add(eye);
    const cheek = new THREE.Mesh(new THREE.CircleGeometry(0.06, 14), cheekMaterial);
    cheek.position.set(side * 0.28, -0.1, 0.35); cheek.rotation.y = side * 0.55;
    head.add(cheek);

    let ear;
    if (character.kind === "bear") {
      ear = new THREE.Mesh(new THREE.SphereGeometry(0.13, 12, 10), bodyMaterial);
      ear.position.set(side * 0.34, 0.32, -0.02);
    } else if (character.kind === "rabbit") {
      // 長い耳は外へ倒しておく（頭の上をカブタワーに空けるため）
      ear = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 10), bodyMaterial);
      ear.scale.set(0.09, 0.33, 0.06); ear.position.set(side * 0.33, 0.52, -0.04); ear.rotation.z = -side * 0.55;
      const innerEar = new THREE.Mesh(new THREE.SphereGeometry(1, 10, 8), innerMaterial);
      innerEar.scale.set(0.5, 0.8, 0.4); innerEar.position.z = 0.6;
      ear.add(innerEar);
    } else if (character.kind === "cat") {
      ear = new THREE.Mesh(new THREE.ConeGeometry(0.13, 0.24, 4), bodyMaterial);
      ear.position.set(side * 0.3, 0.38, 0); ear.rotation.z = -side * 0.35; ear.rotation.y = Math.PI / 4;
    } else {
      ear = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 10), innerMaterial);
      ear.scale.set(0.09, 0.22, 0.13); ear.position.set(side * 0.45, 0.05, -0.02); ear.rotation.z = side * 0.25;
    }
    ear.castShadow = true;
    head.add(ear);
  }

  // カブタワーの付け根（頭のてっぺん）。ここに入れ子でカブを積み、上ほど大きく揺れるようにする
  const stackAnchor = new THREE.Group();
  stackAnchor.position.y = 0.4;
  head.add(stackAnchor);

  const ring = new THREE.Mesh(new THREE.RingGeometry(0.42, 0.5, 28), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0 }));
  ring.rotation.x = -Math.PI / 2; ring.position.y = 0.02;
  root.add(ring);

  return { root, head, stackAnchor, ring, nodes: [], swayPhase: fxRandom() * Math.PI * 2, swayImpulse: 0, bob: 0 };
}

function rebuildStackVisual(player) {
  const visual = player.visual;
  if (!visual) return;
  while (visual.stackAnchor.children.length) visual.stackAnchor.remove(visual.stackAnchor.children[0]);
  visual.nodes = [];
  let parent = visual.stackAnchor;
  player.stack.forEach((turnip, k) => {
    const node = new THREE.Group();
    // 1段上のカブを置く高さは、下のカブの今の大きさで決まる（毎フレーム更新）
    node.userData.below = k === 0 ? null : player.stack[k - 1];
    node.position.x = (fxRandom() - 0.5) * 0.05;
    node.position.z = (fxRandom() - 0.5) * 0.05;
    const mesh = makeTurnipMesh(turnip.type, STACK_SCALE * turnipScale(turnip), turnip);
    mesh.rotation.y = fxRandom() * Math.PI * 2;
    node.add(mesh);
    parent.add(node);
    visual.nodes.push(node);
    parent = node;
  });
}

function stackTopWorld(player) {
  const visual = player.visual;
  if (!visual) return null;   // ヘッドレス検証ではキャラを作らない
  const target = visual.nodes.length ? visual.nodes[visual.nodes.length - 1] : visual.stackAnchor;
  const position = new THREE.Vector3();
  target.getWorldPosition(position);
  const top = player.stack[player.stack.length - 1];
  if (visual.nodes.length && top) position.y += TURNIP_HEIGHT * STACK_SCALE * turnipScale(top) * currentSize(top.type);
  return position;
}

// タワーの k 段目の位置（食べる・売るで真ん中から抜くとき、そこから飛ばす）
function stackNodeWorld(player, index) {
  const visual = player.visual;
  if (!visual || !visual.nodes[index]) return stackTopWorld(player);
  const position = new THREE.Vector3();
  visual.nodes[index].getWorldPosition(position);
  return position;
}

const STACK_SCALE = 1.15;
function currentSize(typeIndex) { return view.sizes[typeIndex].value; }
function targetSize(typeIndex) { return sizeOfLevel(game.market[typeIndex].level); }

function buildWorld() {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });

  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x8fd3df);

  scene.add(new THREE.HemisphereLight(0xfff8e8, 0x6a8f5a, 0.75));
  const sun = new THREE.DirectionalLight(0xfff1d6, 0.95);
  sun.position.set(8, 16, 6);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -13, right: 13, top: 13, bottom: -13, near: 1, far: 50 });

  scene.add(sun);

  const sea = new THREE.Mesh(new THREE.CircleGeometry(80, 48), standardMaterial(0x6cc4d6, { roughness: 0.35 }));
  sea.rotation.x = -Math.PI / 2; sea.position.y = -0.35;
  scene.add(sea);
  const sand = new THREE.Mesh(new THREE.CylinderGeometry(10.6, 11.2, 0.5, 48), standardMaterial(0xf1e2b0));

  scene.add(sand);
  const grass = new THREE.Mesh(new THREE.CylinderGeometry(9.6, 9.9, 0.5, 48), standardMaterial(0x9fd06a));
  grass.position.y = -0.12; grass.receiveShadow = true;
  scene.add(grass);

  // 木（飾り）
  const trunkMaterial = standardMaterial(0x9a6b45);
  const leafMaterials = [standardMaterial(0x5fae4a), standardMaterial(0x78bf55)];
  for (let k = 0; k < 9; k++) {
    const angle = (k / 9) * Math.PI * 2 + 0.17;
    const radius = k % 2 ? 9.1 : 4.4;
    const tree = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.14, 0.7, 8), trunkMaterial);
    trunk.position.y = 0.35; trunk.castShadow = true;
    const crown = new THREE.Mesh(new THREE.SphereGeometry(0.55, 12, 10), leafMaterials[k % 2]);
    crown.position.y = 1.05; crown.scale.set(1, 1.15, 1); crown.castShadow = true;
    tree.add(trunk, crown);
    tree.position.set(Math.sin(angle) * radius, 0.13, Math.cos(angle) * radius);
    scene.add(tree);
  }

  // マス
  const tileColors = { field: 0xc99a62, kabu: 0xf6d77a, market: 0xf3a17a, radio: 0x9cc8f0 };
  BOARD.forEach((tile, index) => {
    const position = tilePosition(index);
    const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.88, 0.94, 0.22, 28), standardMaterial(tileColors[tile.kind]));
    disc.position.set(position.x, 0.2, position.z);
    disc.receiveShadow = true;
    scene.add(disc);
    view.tiles.push(new THREE.Vector3(position.x, 0.32, position.z));
    const outward = new THREE.Vector3(Math.sin(position.angle), 0, Math.cos(position.angle));

    if (tile.kind === "field") {
      // 畑：その種類のカブが植わっている
      for (const [dx, dz] of [[-0.3, 0.05], [0.3, 0.05], [0, -0.3]]) {
        const planted = makeTurnipMesh(tile.type, 0.85);
        planted.position.set(position.x + dx, 0.18, position.z + dz);
        scene.add(planted);
      }
    } else if (tile.kind === "market") {
      const shop = SHOPS[tile.shop];
      const stall = new THREE.Group();
      const counter = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.55, 0.5), standardMaterial(0xc98b5a));
      counter.position.y = 0.28; counter.castShadow = true;
      const roof = new THREE.Mesh(new THREE.ConeGeometry(0.95, 0.5, 4), standardMaterial(TURNIP_TYPES[shop.likes].color));
      roof.position.y = 1.35; roof.rotation.y = Math.PI / 4; roof.castShadow = true;
      for (const side of [-1, 1]) {
        const post = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.9, 6), trunkMaterial);
        post.position.set(side * 0.58, 0.85, 0);
        stall.add(post);
      }
      const keeper = makeEmojiSprite(shop.emoji, 0.7);
      keeper.position.y = 0.85;
      const favorite = makeTurnipMesh(shop.likes, 0.9);
      favorite.position.set(0.4, 0.56, 0.1);
      stall.add(counter, roof, keeper, favorite);
      stall.position.set(position.x + outward.x * 1.55, 0.05, position.z + outward.z * 1.55);
      stall.lookAt(0, 0.05, 0);
      scene.add(stall);
    } else if (tile.kind === "kabu" || tile.kind === "radio") {
      const icon = makeEmojiSprite(tile.kind === "kabu" ? "💬" : "📻", tile.kind === "kabu" ? 0.5 : 0.75, "rgba(255,250,240,0.9)");
      icon.position.set(position.x + outward.x * 1.25, 0.75, position.z + outward.z * 1.25);
      scene.add(icon);
    }
  });

  // 中央の見本台：4種を同じ台に並べ、大きさの差（＝値段の差）を見比べられるようにする
  const plinth = new THREE.Mesh(new THREE.CylinderGeometry(2.4, 2.6, 0.35, 32), standardMaterial(0xfff6e2));
  plinth.position.y = 0.17; plinth.castShadow = true; plinth.receiveShadow = true;
  scene.add(plinth);
  TURNIP_TYPES.forEach((type, t) => {
    const angle = (t / TURNIP_TYPES.length) * Math.PI * 2 + Math.PI / 4;
    const sample = makeTurnipMesh(t, 1.8);
    sample.position.set(Math.sin(angle) * 1.55, 0.4, Math.cos(angle) * 1.55);
    scene.add(sample);
  });

  view.focus = new THREE.Vector3(0, 0.8, 0);
  resizeRenderer();
  window.addEventListener("resize", resizeRenderer);
}


function addCharactersToWorld() {
  for (const player of game.players) {
    if (player.visual) scene.remove(player.visual.root);
    player.visual = buildCharacter(player.character);
    const point = standingPoint(player.position, player.index);
    player.visual.root.position.copy(point);
    player.visual.root.rotation.y = tilePosition(player.position).angle + Math.PI / 2;
    scene.add(player.visual.root);
    rebuildStackVisual(player);
  }
}

function resizeRenderer() {
  if (!renderer) return;
  const width = window.innerWidth, height = window.innerHeight;
  renderer.setSize(width, height, false);
  camera.aspect = width / Math.max(height, 1);
  camera.updateProjectionMatrix();
}

// ---- tween：演出の待ち合わせ。headless では即時に終わる ----
function animate(duration, update) {
  const scaled = duration * speedFactor;
  if (!hasThree || scaled <= 0) { update(1); return Promise.resolve(); }
  return new Promise((resolve) => view.tweens.push({ elapsed: 0, duration: scaled, update, resolve }));
}

let lastFrameTime = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const deltaSeconds = Math.min(0.05, (now - lastFrameTime) / 1000 || 0);
  lastFrameTime = now;
  view.clock += deltaSeconds;

  for (let k = view.tweens.length - 1; k >= 0; k--) {
    const tween = view.tweens[k];
    tween.elapsed += deltaSeconds * 1000;
    const progress = Math.min(1, tween.elapsed / tween.duration);
    tween.update(progress);
    if (progress >= 1) { view.tweens.splice(k, 1); tween.resolve(); }
  }

  // 相場の大きさ：ばねで目標へ寄せる。少し行き過ぎて戻る「ぷくっ」で、値動きに気づかせる
  if (game.market.length) {
    view.sizes.forEach((size, t) => {
      const force = (targetSize(t) - size.value) * 90 - size.velocity * 11;
      size.velocity += force * deltaSeconds;
      size.value += size.velocity * deltaSeconds;
    });
  }
  scene.traverse((object) => {
    const typeIndex = object.userData.turnipType;
    if (typeIndex !== undefined) object.scale.setScalar(object.userData.baseScale * currentSize(typeIndex));
    else if (object.userData.below !== undefined) {
      const below = object.userData.below;
      object.position.y = below === null ? 0
        : TURNIP_HEIGHT * 0.86 * STACK_SCALE * turnipScale(below) * currentSize(below.type);
    }
  });

  // カブタワーの揺れ：入れ子なので、各段の小さな傾きが上へ行くほど積み重なる
  for (const player of game.players) {
    const visual = player.visual;
    if (!visual) continue;
    visual.swayImpulse *= Math.pow(0.12, deltaSeconds);
    const height = visual.nodes.length;
    const amplitude = 0.012 + height * 0.004 + visual.swayImpulse;
    visual.nodes.forEach((node, k) => {
      node.rotation.z = Math.sin(view.clock * 1.9 + visual.swayPhase + k * 0.45) * amplitude;
      node.rotation.x = Math.cos(view.clock * 1.5 + visual.swayPhase + k * 0.3) * amplitude * 0.6;
    });
    const isActive = player.index === game.currentPlayer && !game.finished && game.round > 0;
    visual.ring.material.opacity = isActive ? 0.65 + Math.sin(view.clock * 5) * 0.25 : 0;
    visual.ring.material.color.set(player.character.css);
  }

  // カメラ：手番の人の外側から、島の中央（相場の柱）も入るように見る
  let angleDifference = view.targetAngle - view.cameraAngle;
  angleDifference = Math.atan2(Math.sin(angleDifference), Math.cos(angleDifference));
  view.cameraAngle += angleDifference * Math.min(1, deltaSeconds * 2.2);
  const portrait = camera.aspect < 0.9;
  const distance = view.ringRadius + (portrait ? 13 : 9);
  const heightAbove = portrait ? 13 : 9.5;
  camera.position.set(Math.sin(view.cameraAngle) * distance, heightAbove, Math.cos(view.cameraAngle) * distance);
  // 縦長画面は下のパネルが画面の下1/4を覆うので、注視点を手番の人の側へ寄せて人を画面中央に出す
  const lookReach = view.ringRadius * (portrait ? 0.8 : 0.4);
  const lookTarget = new THREE.Vector3(Math.sin(view.cameraAngle) * lookReach, portrait ? -1.2 : 1.2,
                                       Math.cos(view.cameraAngle) * lookReach);
  // 相場が動く瞬間は、中央の見本台へ視線を寄せて「膨らむ／しぼむ」を見せる
  view.centerBlend += ((view.lookCenter ? 1 : 0) - view.centerBlend) * Math.min(1, deltaSeconds * 4);
  lookTarget.lerp(new THREE.Vector3(0, portrait ? -2.2 : 0.8, 0), view.centerBlend * 0.85);
  camera.lookAt(lookTarget);
  renderer.render(scene, camera);
}

function focusPlayer(player) {
  view.targetAngle = tilePosition(player.position).angle;
}

async function hopTo(player, tileIndex) {
  if (!player.visual) return;
  const visual = player.visual;
  const from = visual.root.position.clone();
  const to = standingPoint(tileIndex, player.index);
  visual.root.rotation.y = Math.atan2(to.x - from.x, to.z - from.z);
  visual.swayImpulse = Math.min(0.12, visual.swayImpulse + 0.04);
  await animate(TIMING.hop, (t) => {
    visual.root.position.lerpVectors(from, to, t);
    visual.root.position.y = to.y + Math.sin(Math.PI * t) * 0.55;
  });
}

// カブが飛んでいく演出（売る＝屋台へ、抜く＝畑から頭へ、押し付け／ひったくり＝頭から頭へ）
async function flyTurnip(turnip, from, to) {
  if (!hasThree || !from || !to) return;
  const mesh = makeTurnipMesh(turnip.type, STACK_SCALE * turnipScale(turnip), turnip);
  scene.add(mesh);
  await animate(TIMING.fly, (t) => {
    mesh.position.lerpVectors(from, to, t);
    mesh.position.y += Math.sin(Math.PI * t) * 1.4;
    mesh.rotation.y = t * 6;
  });
  scene.remove(mesh);
}

// 頭の上で何か起きたときに、絵文字をふわっと浮かせる（増えた・合体・突然変異・破裂）
function popEmoji(player, text) {
  if (!hasThree || !player.visual || speedFactor <= 0) return;
  const sprite = makeEmojiSprite(text, 0.7);
  const start = stackTopWorld(player);
  sprite.position.copy(start);
  scene.add(sprite);
  animate(900, (t) => {
    sprite.position.y = start.y + 0.3 + t * 1.2;
    sprite.material.opacity = 1 - t * t;
    if (t >= 1) scene.remove(sprite);
  });
}

// カブマスに置いてあるカブの見た目。マスの中心より少し外側に寝かせて置く（人と重ならないように）
function groundTurnipWorld(tileIndex) {
  const position = tilePosition(tileIndex);
  return new THREE.Vector3(position.x + Math.sin(position.angle) * 0.55, 0.42, position.z + Math.cos(position.angle) * 0.55);
}
function updateGroundVisual(tileIndex) {
  if (!hasThree || !scene) return;
  const old = view.groundMeshes[tileIndex];
  if (old) scene.remove(old);
  view.groundMeshes[tileIndex] = null;
  const groundTurnip = game.ground[tileIndex];
  if (!groundTurnip) return;
  const mesh = makeTurnipMesh(groundTurnip.type, 1.1, groundTurnip);
  mesh.position.copy(groundTurnipWorld(tileIndex));
  mesh.rotation.z = 0.5;
  mesh.rotation.y = tilePosition(tileIndex).angle;
  scene.add(mesh);
  view.groundMeshes[tileIndex] = mesh;
}

function marketStallWorld(tileIndex) {
  const position = tilePosition(tileIndex);
  return new THREE.Vector3(position.x + Math.sin(position.angle) * 1.55, 0.8, position.z + Math.cos(position.angle) * 1.55);
}

// 大きさはフレームごとに相場へ寄っていくので、ここでは膨らむ／しぼむのを見せる時間だけ待つ。
// 中央の見本台が映るようにカメラを島の中心へ少し寄せる
async function showMarketChange() {
  view.lookCenter = true;
  await wait(TIMING.marketTick);
  view.lookCenter = false;
}

// -----------------------------------------------------------------
// UI
// -----------------------------------------------------------------
const elements = {
  dayLabel: document.getElementById("dayLabel"),
  metaLabel: document.getElementById("metaLabel"),
  players: document.getElementById("players"),
  message: document.getElementById("message"),
  rumors: document.getElementById("rumors"),
  buttons: document.getElementById("buttons"),
  toast: document.getElementById("toast"),
  overlay: document.getElementById("overlay"),
  speed: document.getElementById("speed"),
};

function renderHud() {
  const week = currentWeekIndex() + 1;
  elements.dayLabel.textContent = game.round > 0 ? `${game.round}日目 / ${CONFIG.totalRounds}・第${week}週` : "カブ盛りバブル";
  elements.metaLabel.textContent = `${GAME_VERSION} seed ${currentSeed}`;
  elements.players.innerHTML = game.players.map((player) => {
    // 手元の一覧も大きさで描く（3Dと同じ読み方で済むように）
    const dots = player.stack.map((turnip) => {
      // 手元の一覧は枠に収めるため20pxで止める（3Dのカブは上限なく大きくなる）
      const diameter = Math.min(20, Math.round(9 * sizeOfLevel(game.market[turnip.type].level) * turnipScale(turnip)) + 1);
      const ring = turnip.trait === "bomb" ? "box-shadow:0 0 0 2px #2b2420;" : turnip.trait ? "box-shadow:0 0 0 2px #f5b400;" : "";
      return `<i style="width:${diameter}px;height:${diameter}px;background:${TURNIP_TYPES[turnip.type].css};${ring}"></i>`;
    }).join("");
    const rumorCount = player.rumors.length ? ` 💬${player.rumors.length}` : "";
    const active = player.index === game.currentPlayer && game.round > 0 && !game.finished ? " active" : "";
    return `<div class="pcard${active}" style="--pc:${player.character.css}">
      <div class="name">${player.name}</div>
      <div class="sub">${PERSONALITIES[player.personality].label}${rumorCount}</div>
      <div class="coins">🪙${player.coins}</div>
      <div class="ministack" title="左が下・右がてっぺん">${dots}</div>
    </div>`;
  }).join("");
}

function renderRumorsFor(player) {
  // うわさは本人にしか見えない。CPUの番に人間のうわさを出し続けるのは、ひとり用で読み返せるようにするため
  const viewer = player && !player.isCpu ? player : game.players.find((p) => !p.isCpu);
  if (!viewer) { elements.rumors.innerHTML = ""; return; }
  const current = currentWeekIndex();
  elements.rumors.innerHTML = viewer.rumors
    .filter((rumor) => rumor.week >= current)
    .map((rumor) => `<span class="rumor">💬 ${rumorText(rumor)}</span>`).join("");
}

function setMessage(html) { elements.message.innerHTML = html; }

async function showToast(html) {
  if (isHeadless) return;
  elements.toast.innerHTML = html;
  elements.toast.classList.add("show");
  await wait(TIMING.toast);
  elements.toast.classList.remove("show");
}

// 人間なら押されたボタン、CPUなら少し待ってから cpuChoice を返す
function ask(player, html, options, cpuChoice) {
  setMessage(html);
  renderRumorsFor(player);
  elements.buttons.innerHTML = "";
  const buttons = options.map((option) => {
    const button = document.createElement("button");
    button.type = "button";
    button.innerHTML = option.label;
    if (option.secondary) button.className = "secondary";
    if (option.chip) button.className = "chip";
    if (option.disabled) button.disabled = true;
    elements.buttons.appendChild(button);
    return { button, option };
  });
  if (player.isCpu) {
    buttons.forEach(({ button, option }) => {
      button.disabled = true;
      if (option.id === cpuChoice) button.style.outline = "3px solid #3b3326";
    });
    return wait(TIMING.cpuThink).then(() => { elements.buttons.innerHTML = ""; return cpuChoice; });
  }
  return new Promise((resolve) => {
    buttons.forEach(({ button, option }) => !option.disabled && button.addEventListener("click", () => {
      elements.buttons.innerHTML = "";
      resolve(option.id);
    }, { once: true }));
  });
}

elements.speed.addEventListener("click", () => {
  if (isHeadless) return;
  const fast = speedFactor === 1;
  speedFactor = fast ? 0.35 : 1;
  elements.speed.textContent = fast ? "⏩ はやい" : "⏩ ふつう";
});

// -----------------------------------------------------------------
// 手番
// -----------------------------------------------------------------
function turnipLabel(typeIndex) {
  const type = TURNIP_TYPES[typeIndex];
  return `<span class="dot" style="display:inline-block;vertical-align:-1px;background:${type.css}"></span>${type.name}`;
}
// 1個のカブの呼び名（色＋突然変異＋大カブ）
function turnipName(turnip) {
  const trait = turnip.trait ? `${TRAITS[turnip.trait].icon}` : "";
  return `${trait}${turnipLabel(turnip.type)}${turnip.big ? "👑" : ""}`;
}
function sellLevelOf(turnip, shop) {
  const bonus = shop && shop.likes === turnip.type ? CONFIG.favoriteShopBonus : 0;
  return game.market[turnip.type].level + bonus;
}
function sellPriceOf(turnip, shop) {
  return priceOf(sellLevelOf(turnip, shop)) * (turnip.big ? CONFIG.bigPriceMultiplier : 1);
}
// タワーをボタンの列にする（てっぺんを左に）。filter で選べないカブは押せなくする
function stackOptions(player, filter, suffix) {
  const options = [];
  for (let index = player.stack.length - 1; index >= 0; index--) {
    const turnip = player.stack[index];
    const allowed = !filter || filter(turnip);
    options.push({ id: String(index), chip: true, disabled: !allowed,
      label: `${index === player.stack.length - 1 ? "⬆" : ""}${turnipName(turnip)}${allowed && suffix ? suffix(turnip) : ""}` });
  }
  return options;
}
function removeFromStack(player, index) {
  const [turnip] = player.stack.splice(index, 1);
  return turnip;
}

async function visitMarket(player, tileIndex, passingThrough) {
  const shop = SHOPS[BOARD[tileIndex].shop];
  const sellable = (turnip) => turnip.trait !== "bomb";
  // 💣 は市場では処分できない（v0.4.2：引き取りは簡単すぎて脅威が消えた）。手放すには押し付けるしかない
  while (player.stack.some(sellable)) {
    // CPU：売りたいカブの中でいちばん高く売れるものから売る
    let cpuChoice = "stop";
    if (player.isCpu) {
      let bestPrice = -1;
      player.stack.forEach((turnip, index) => {
        if (!sellable(turnip)) return;
        const level = sellLevelOf(turnip, shop);
        if (cpuWantsToSell(player, turnip.type, level) && sellPriceOf(turnip, shop) > bestPrice) { bestPrice = sellPriceOf(turnip, shop); cpuChoice = String(index); }
      });
    }
    const options = stackOptions(player, sellable, (turnip) => ` +${sellPriceOf(turnip, shop)}🪙`);
    options.push({ id: "stop", label: passingThrough ? "素通りする" : "売るのをやめる", secondary: true });
    const choice = await ask(player,
      `${shop.emoji} <b>${shop.name}</b>${passingThrough ? "の前を通りかかった" : "に着いた"}。どのカブを売る？（どの段でも売れる）<br><small>${turnipLabel(shop.likes)}は好物なので高く買ってくれる。👑大カブは${CONFIG.bigPriceMultiplier}個分の値段。💣は売れない。</small>`,
      options, cpuChoice);
    if (choice === "stop") {
      // 売れるのに売らなかった＝「まだ上がる」と読んだ記録。売った人との判断の割れを数えるのに使う
      new Set(player.stack.filter(sellable).map((turnip) => turnip.type)).forEach((type) => recordAction(player, type, "hold"));
      break;
    }
    const index = Number(choice);
    const from = stackNodeWorld(player, index);
    const turnip = removeFromStack(player, index);
    const level = sellLevelOf(turnip, shop);
    player.coins += sellPriceOf(turnip, shop);
    game.actionLog.push({ round: game.round, player: player.index, type: turnip.type, kind: "sell", level });
    rebuildStackVisual(player);
    renderHud();
    await flyTurnip(turnip, from, marketStallWorld(tileIndex));
  }
}

async function visitField(player, tileIndex) {
  const typeIndex = BOARD[tileIndex].type;
  const level = game.market[typeIndex].level;
  const price = priceOf(level);
  const room = CONFIG.maxStack - player.stack.length;
  const maxBuy = Math.min(CONFIG.maxBuyPerVisit, Math.floor(player.coins / price), room);
  if (maxBuy <= 0) {
    setMessage(`${turnipLabel(typeIndex)}の畑。${room <= 0 ? "頭がいっぱいで積めない" : "コインが足りない"}。`);
    await wait(TIMING.cpuThink);
    return;
  }
  const options = [];
  for (let n = 1; n <= maxBuy; n++) options.push({ id: String(n), label: `${n}こ抜く −${price * n}🪙` });
  options.push({ id: "0", label: "抜かない", secondary: true });
  const cpuChoice = player.isCpu ? String(cpuBuyCount(player, typeIndex, maxBuy)) : "0";
  const choice = Number(await ask(player,
    `${turnipLabel(typeIndex)}の畑。いまの大きさなら1こ ${price}🪙。抜いた分は頭のてっぺんに積む。`,
    options, cpuChoice));
  for (let n = 0; n < choice; n++) {
    player.coins -= price;
    const bought = makeTurnip(typeIndex);
    const from = view.tiles[tileIndex] ? view.tiles[tileIndex].clone() : null;
    await flyTurnip(bought, from, stackTopWorld(player));
    player.stack.push(bought);
    recordAction(player, typeIndex, "buy");
    rebuildStackVisual(player);
    if (player.visual) player.visual.swayImpulse += 0.03;
    renderHud();
  }
}

async function meetOthers(player) {
  const others = game.players.filter((other) => other !== player && other.position === player.position);
  for (const other of others) {
    const canPush = player.stack.length > 0 && other.stack.length < CONFIG.maxStack;
    const canGrab = other.stack.length > 0 && player.stack.length < CONFIG.maxStack;
    if (!canPush && !canGrab) continue;
    const theirTop = other.stack[other.stack.length - 1];
    const options = [];
    if (canPush) options.push({ id: "push", label: `押し付ける（どれでも1個）→${other.character.emoji}` });
    if (canGrab) options.push({ id: "grab", label: `ひったくる（${other.character.emoji}のてっぺん ${turnipName(theirTop)}）` });
    options.push({ id: "none", label: "なにもしない", secondary: true });
    let cpuChoice = "none";
    let cpuPushIndex = -1;
    if (player.isCpu) {
      // 💣 があれば最優先で押し付ける。なければ見通しの悪いカブを押し付ける
      const bombIndex = player.stack.findIndex((turnip) => turnip.trait === "bomb");
      let worst = 0;
      player.stack.forEach((turnip, index) => {
        const outlook = cpuOutlook(player, turnip.type);
        if (outlook < worst) { worst = outlook; cpuPushIndex = index; }
      });
      if (bombIndex >= 0) cpuPushIndex = bombIndex;
      const theirTopOutlook = canGrab && theirTop.trait !== "bomb" ? cpuOutlook(player, theirTop.type) + (theirTop.trait ? 0.3 : 0) + (theirTop.big ? 0.5 : 0) : -9;
      if (canPush && bombIndex >= 0) cpuChoice = "push";
      else if (canGrab && theirTopOutlook > 0.2) cpuChoice = "grab";
      else if (canPush && worst < -0.2) cpuChoice = "push";
    }
    const choice = await ask(player, `${other.name} と同じマスになった！`, options, cpuChoice);
    if (choice === "push") {
      const pick = await ask(player, `どのカブを ${other.name} の頭に押し付ける？（相手のてっぺんに乗る）`,
        stackOptions(player, null, null), String(cpuPushIndex >= 0 ? cpuPushIndex : player.stack.length - 1));
      const index = Number(pick);
      const from = stackNodeWorld(player, index);
      const turnip = removeFromStack(player, index);
      rebuildStackVisual(player);
      await flyTurnip(turnip, from, stackTopWorld(other));
      other.stack.push(turnip);
      if (turnip.trait === "bomb") game.stats.pushedBombs++;
      rebuildStackVisual(other);
      game.actionLog.push({ round: game.round, player: player.index, type: turnip.type, kind: "push", level: game.market[turnip.type].level });
      await showToast(`${player.character.emoji}→${other.character.emoji} ${TURNIP_TYPES[turnip.type].name}${turnip.trait ? TRAITS[turnip.trait].icon : ""}を押し付けた`);
    } else if (choice === "grab") {
      const from = stackTopWorld(other);
      const turnip = other.stack.pop();
      rebuildStackVisual(other);
      await flyTurnip(turnip, from, stackTopWorld(player));
      player.stack.push(turnip);
      rebuildStackVisual(player);
      game.actionLog.push({ round: game.round, player: player.index, type: turnip.type, kind: "grab", level: game.market[turnip.type].level });
      await showToast(`${player.character.emoji}←${other.character.emoji} ${TURNIP_TYPES[turnip.type].name}${turnip.trait ? TRAITS[turnip.trait].icon : ""}をひったくった`);
    }
    renderHud();
  }
}

// カブマス：置いてあるカブをタダで拾い（頭が満杯なら拾えない）、そのカブのうわさも聞く
async function visitKabuTile(player, tileIndex) {
  const groundTurnip = game.ground[tileIndex];
  if (!groundTurnip) {
    setMessage("このマスのカブは、もう誰かが拾っていった。");
    await wait(TIMING.cpuThink);
    return;
  }
  const typeIndex = groundTurnip.type;
  const canPick = player.stack.length < CONFIG.maxStack;
  if (canPick) {
    game.ground[tileIndex] = null;
    const from = groundTurnipWorld(tileIndex);
    updateGroundVisual(tileIndex);
    await flyTurnip(groundTurnip, from, stackTopWorld(player));
    player.stack.push(groundTurnip);
    recordAction(player, typeIndex, "pick");
    rebuildStackVisual(player);
    if (player.visual) player.visual.swayImpulse += 0.03;
    renderHud();
  }
  const rumor = drawRumor(player, typeIndex);
  const secret = player.isCpu ? "（中身は本人だけが知っている）" : `💬「${rumorText(rumor)}」`;
  const traitNote = groundTurnip.trait ? `<br><small>${TRAITS[groundTurnip.trait].icon}${TRAITS[groundTurnip.trait].name}：${TRAITS[groundTurnip.trait].eat}</small>` : "";
  await ask(player,
    `${turnipName(groundTurnip)}を${canPick ? "拾った！" : "見つけたが、頭がいっぱいで拾えない。"}${traitNote}<br>そのとき、うわさが聞こえた。${secret}<br><small>うわさは4回に1回ははずれる。</small>`,
    [{ id: "ok", label: "ふむふむ" }], "ok");
}

// ---- 食べる（手番の最初に1個まで。どの段でも選べる） ----
function cpuEatChoice(player) {
  let best = 0.5, choice = "skip";
  player.stack.forEach((turnip, index) => {
    let score = 0;
    if (turnip.trait === "puff") score = player.stack.filter((t) => t.type === turnip.type).length * 0.4 + cpuOutlook(player, turnip.type) * 0.2;
    else if (turnip.trait === "wilt") score = cpuWiltTarget(player).score;
    else if (turnip.trait === "magnet") score = game.players.some((other) => other !== player && other.stack.some((t) => t.trait !== "bomb")) ? 0.75 : 0;
    else if (turnip.trait === "run") score = 0.45;
    else if (turnip.trait === "sparkle") score = 0.3;
    if (score > best) { best = score; choice = String(index); }
  });
  return choice;
}
// しおれを使うなら「ライバルが多く持っていて自分は少ない色」
function cpuWiltTarget(player) {
  let best = { type: 0, score: -9 };
  TURNIP_TYPES.forEach((_, t) => {
    const mine = player.stack.filter((turnip) => turnip.type === t).length;
    const score = (totalHeld(t) - mine * 2) * 0.25;
    if (score > best.score) best = { type: t, score };
  });
  return best;
}

async function eatPhase(player) {
  const edible = (turnip) => turnip.trait !== "bomb";
  if (!player.stack.some(edible)) return;
  const options = stackOptions(player, edible, (turnip) => turnip.trait ? `（${TRAITS[turnip.trait].short}）` : "");
  options.push({ id: "skip", label: "食べない", secondary: true });
  const choice = await ask(player,
    `<b>${player.name}</b> の番。サイコロの前に、頭のカブを1個食べられる（どの段でも）。<br><small>突然変異カブは食べると効果が出る。ふつうのカブは頭が軽くなるだけ。</small>`,
    options, player.isCpu ? cpuEatChoice(player) : "skip");
  if (choice === "skip") return;
  const index = Number(choice);
  const from = stackNodeWorld(player, index);
  const turnip = removeFromStack(player, index);
  game.stats.eats++;
  rebuildStackVisual(player);
  renderHud();
  popEmoji(player, "😋");
  if (from && hasThree) await flyTurnip(turnip, from, from.clone().add(new THREE.Vector3(0, -1.2, 0.3)));
  await applyEatEffect(player, turnip);
  renderHud();
}

async function applyEatEffect(player, turnip) {
  const name = turnipName(turnip);
  switch (turnip.trait) {
    case "puff": {
      applyNews(turnip.type, 1);
      if (hasThree) await showMarketChange();
      await ask(player, `${name}を食べた！ ${turnipLabel(turnip.type)}が島じゅうでぷくっと大きくなった。`, [{ id: "ok", label: "やった" }], "ok");
      break;
    }
    case "wilt": {
      const options = TURNIP_TYPES.map((_, t) => ({ id: String(t), label: turnipLabel(t) }));
      const target = Number(await ask(player, `${name}を食べた！ どの色を小さくする？`, options, String(cpuWiltTarget(player).type)));
      applyNews(target, -1);
      if (hasThree) await showMarketChange();
      setMessage(`${turnipLabel(target)}が島じゅうでしゅんと縮んだ。`);
      await wait(TIMING.cpuThink);
      break;
    }
    case "run":
      player.extraRoll = true;
      await ask(player, `${name}を食べた！ 足が速くなった。このターンはサイコロを2回振る。`, [{ id: "ok", label: "いくぞ" }], "ok");
      break;
    case "magnet": {
      const targets = game.players.filter((other) => other !== player && other.stack.length > 0);
      if (!targets.length || player.stack.length >= CONFIG.maxStack) { setMessage(`${name}を食べたが、引き寄せられるカブがない。`); await wait(TIMING.cpuThink); break; }
      // CPU：いちばん高く売れそうな（💣以外の）カブを持っている相手から取る
      let cpuTarget = targets[0], cpuIndex = targets[0].stack.length - 1, bestValue = -9;
      for (const other of targets) other.stack.forEach((t, index) => {
        if (t.trait === "bomb") return;
        const value = sellPriceOf(t, null) + cpuOutlook(player, t.type) + (t.trait ? 1 : 0);
        if (value > bestValue) { bestValue = value; cpuTarget = other; cpuIndex = index; }
      });
      const whoId = await ask(player, `${name}を食べた！ 誰の頭から引き寄せる？`,
        targets.map((other) => ({ id: String(other.index), label: `${other.name}` })), String(cpuTarget.index));
      const victim = game.players[Number(whoId)];
      const pick = Number(await ask(player, `${victim.name} の頭のどのカブを引き寄せる？`, stackOptions(victim, null, null),
        String(victim === cpuTarget ? cpuIndex : victim.stack.length - 1)));
      const from = stackNodeWorld(victim, pick);
      const pulled = removeFromStack(victim, pick);
      rebuildStackVisual(victim);
      await flyTurnip(pulled, from, stackTopWorld(player));
      player.stack.push(pulled);
      rebuildStackVisual(player);
      game.actionLog.push({ round: game.round, player: player.index, type: pulled.type, kind: "grab", level: game.market[pulled.type].level });
      await showToast(`🧲 ${player.character.emoji}←${victim.character.emoji} ${TURNIP_TYPES[pulled.type].name}`);
      break;
    }
    case "sparkle":
      player.nextRumorTrue = true;
      await ask(player, `${name}を食べた！ 耳がよく聞こえる。次に聞くうわさは必ず本当。`, [{ id: "ok", label: "ふむ" }], "ok");
      break;
    default:
      setMessage(`${name}を食べた。むしゃむしゃ。頭が少し軽くなった。`);
      await wait(TIMING.cpuThink);
  }
}

// ---- 頭の上の反応（自分の手番の終わり）：💣の導火線 → 増殖 → 合体 → 突然変異 ----
function pairKey(a, b) { return a < b ? `${a}-${b}` : `${b}-${a}`; }

function mergeTriples(player, events) {
  // 同じ色が3つ並んだら合体して👑大カブに（💣と大カブ同士は合体しない）
  let merged = true;
  while (merged) {
    merged = false;
    for (let k = 0; k + 2 < player.stack.length; k++) {
      const trio = player.stack.slice(k, k + 3);
      if (trio.every((t) => t.type === trio[0].type && t.trait !== "bomb" && !t.big)) {
        const big = makeTurnip(trio[0].type, (trio.find((t) => t.trait) || {}).trait || null);
        big.big = true;
        player.stack.splice(k, 3, big);
        game.stats.merges++;
        events.push(`👑 ${TURNIP_TYPES[big.type].name}が3つ合体して大カブになった`);
        merged = true;
        break;
      }
    }
  }
}

async function headReactions(player) {
  const events = [];
  const emojis = [];
  // 💣：導火線を進め、尽きたら両隣ごと吹き飛ぶ
  for (let k = 0; k < player.stack.length; k++) {
    const turnip = player.stack[k];
    if (turnip.trait !== "bomb") continue;
    turnip.age++;
    if (turnip.age >= CONFIG.bombFuse) {
      const start = Math.max(0, k - 1);
      const end = Math.min(player.stack.length, k + 2);
      const blown = player.stack.splice(start, end - start);
      game.stats.explosions++;
      game.stats.lostToBombs += blown.length - 1;
      events.push(`💥 ばくだんが破裂！ ${blown.length - 1}個のカブが吹き飛んだ`);
      emojis.push("💥");
      if (player.visual) player.visual.swayImpulse += 0.15;
      k = start - 1;
    }
  }
  // 増殖：同じ色が隣り合ったペアごとに、その色が1個増える
  const before = player.stack.slice();
  for (let k = 0; k + 1 < before.length; k++) {
    const lower = before[k], upper = before[k + 1];
    if (lower.type !== upper.type || lower.trait === "bomb" || upper.trait === "bomb") continue;
    if (player.stack.length >= CONFIG.maxStack) break;
    if (random() < CONFIG.growChance) {
      const index = player.stack.indexOf(upper);
      player.stack.splice(index + 1, 0, makeTurnip(lower.type));
      game.stats.grows++;
      events.push(`🌱 ${TURNIP_TYPES[lower.type].name}が増えた`);
      emojis.push("🌱");
    }
  }
  mergeTriples(player, events);
  // 突然変異：違う色が隣り合ったペアごとに、組み合わせで決まる変異が付く
  for (let k = 0; k + 1 < player.stack.length; k++) {
    const lower = player.stack[k], upper = player.stack[k + 1];
    if (lower.type === upper.type) continue;
    const candidates = [lower, upper].filter((t) => !t.trait);
    if (!candidates.length) continue;
    if (random() < CONFIG.mutateChance) {
      const target = candidates[randomInt(candidates.length)];
      const trait = PAIR_TRAITS[pairKey(lower.type, upper.type)];
      if (trait === "bomb" && random() >= CONFIG.bombMutationRate) continue;
      target.trait = trait;
      game.stats.mutations++;
      events.push(`🧬 ${TURNIP_TYPES[target.type].name}が突然変異 → ${TRAITS[target.trait].icon}${TRAITS[target.trait].name}`);
      emojis.push(TRAITS[target.trait].icon);
    }
  }
  if (!events.length) return;
  rebuildStackVisual(player);
  renderHud();
  emojis.slice(0, 4).forEach((emoji, k) => setTimeout(() => popEmoji(player, emoji), k * 220 * speedFactor));
  if (player.visual) player.visual.swayImpulse += 0.05;
  await ask(player, `${player.name} の頭の上で…<br>${events.join("<br>")}`, [{ id: "ok", label: "おお" }], "ok");
}

function refillGround() {
  BOARD.forEach((tile, index) => {
    if (tile.kind === "kabu" && game.ground[index] === null) {
      game.ground[index] = makeGroundTurnip();
      updateGroundVisual(index);
    }
  });
}

async function playTurn(player) {
  game.currentPlayer = player.index;
  if (hasThree) focusPlayer(player);
  renderHud();
  await eatPhase(player);
  await ask(player, `<b>${player.name}</b> の番。`, [{ id: "roll", label: player.extraRoll ? "🎲🎲 サイコロを2回ふる" : "🎲 サイコロをふる" }], "roll");
  const rolls = [1 + randomInt(CONFIG.diceSides)];
  if (player.extraRoll) rolls.push(1 + randomInt(CONFIG.diceSides));
  player.extraRoll = false;
  const steps = rolls.reduce((a, b) => a + b, 0);
  await showToast(rolls.map((r) => `🎲 ${r}`).join(" + "));
  for (let step = 1; step <= steps; step++) {
    player.position = (player.position + 1) % BOARD.length;
    if (hasThree) { await hopTo(player, player.position); focusPlayer(player); }
    const passing = BOARD[player.position];
    if (step < steps && passing.kind === "market" && player.stack.length > 0) {
      await visitMarket(player, player.position, true);
    }
  }
  const tile = BOARD[player.position];
  await meetOthers(player);
  if (tile.kind === "field") {
    await visitField(player, player.position);
  } else if (tile.kind === "market") {
    if (player.stack.length > 0) await visitMarket(player, player.position, false);
  } else if (tile.kind === "kabu") {
    await visitKabuTile(player, player.position);
  } else if (tile.kind === "radio") {
    const typeIndex = randomInt(TURNIP_TYPES.length);
    const shift = random() < 0.5 ? -CONFIG.radioShift : CONFIG.radioShift;
    applyNews(typeIndex, shift);
    game.newsLog.push({ round: game.round, type: typeIndex, shift });
    renderHud();
    if (hasThree) await showMarketChange();
    await ask(player, `📻 島ラジオ速報：${turnipLabel(typeIndex)} ${shift > 0 ? "がテレビで紹介されて人気上昇！ ぷくっと大きくなった" : "に悪いうわさ… しゅんと縮んだ"}`,
      [{ id: "ok", label: "なるほど" }], "ok");
  }
  renderHud();
  await headReactions(player);
  game.maxHeight = Math.max(game.maxHeight || 0, player.stack.length);
  renderHud();
}

async function runGame() {
  for (game.round = 1; game.round <= CONFIG.totalRounds; game.round++) {
    renderHud();
    if ((game.round - 1) % CONFIG.roundsPerWeek === 0) {
      await showToast(`📅 第${currentWeekIndex() + 1}週${currentWeekIndex() + 1 === weekCount() ? "（最終週）" : ""}`);
    }
    if (roundsLeft() === 0) await showToast("最終日！ 残ったカブは今夜しおれる");
    for (const player of game.players) await playTurn(player);
    updateMarketLogic();
    renderHud();
    refillGround();
    if (hasThree) await showMarketChange();
  }
  game.round = CONFIG.totalRounds;
  game.finished = true;
  renderHud();
  setMessage("シーズン終了！ 頭に残ったカブはしおれてしまった。");
  elements.buttons.innerHTML = "";
  showResults();
}

// -----------------------------------------------------------------
// 結果：勝敗と「売り時が割れたか」の検証表示
// -----------------------------------------------------------------
function summarize() {
  const splitDays = [];   // 同じ日・同じカブで、売った人と「買った／売れるのに持ち続けた」人が別にいる
  const herdDays = [];    // 同じ日・同じカブを3人以上が売った（＝一斉に同じ判断）
  for (let round = 1; round <= CONFIG.totalRounds; round++) {
    TURNIP_TYPES.forEach((_, t) => {
      const sellers = new Set(), bulls = new Set();
      for (const action of game.actionLog) {
        if (action.round !== round || action.type !== t) continue;
        if (action.kind === "sell") sellers.add(action.player);
        if (action.kind === "buy" || action.kind === "hold") bulls.add(action.player);
      }
      const split = sellers.size > 0 && [...bulls].some((b) => !sellers.has(b));
      if (split) splitDays.push({ round, type: t });
      if (sellers.size >= 3) herdDays.push({ round, type: t });
    });
  }
  const tradeDays = new Set(game.actionLog.filter((a) => a.kind === "sell" || a.kind === "buy").map((a) => `${a.round}-${a.type}`)).size;
  const ranking = [...game.players].sort((a, b) => b.coins - a.coins)
    .map((p) => ({ index: p.index, name: p.name, personality: p.personality, coins: p.coins, leftover: p.stack.length }));
  const sellDays = new Set(game.actionLog.filter((a) => a.kind === "sell").map((a) => `${a.round}-${a.type}`)).size;
  return { seed: currentSeed, splitDays, herdDays, tradeDays, sellDays, ranking,
           holds: game.actionLog.filter((a) => a.kind === "hold").length,
           picks: game.actionLog.filter((a) => a.kind === "pick").length,
           stats: Object.assign({}, game.stats),
           maxHeight: game.maxHeight,
           sells: game.actionLog.filter((a) => a.kind === "sell").length,
           buys: game.actionLog.filter((a) => a.kind === "buy").length };
}

function averageFace(levels) {
  if (!levels.length) return "—";
  return faceOf(Math.round(levels.reduce((a, b) => a + b, 0) / levels.length));
}

function showResults() {
  const summary = summarize();
  window.__kabuResult = summary;
  if (isHeadless) return;
  const medals = ["🥇", "🥈", "🥉", "4"];
  const rankingRows = summary.ranking.map((row, k) =>
    `<tr><td>${medals[k]}</td><td>${row.name} <small>${PERSONALITIES[row.personality].label}</small></td><td>🪙${row.coins}</td><td><small>しおれ ${row.leftover}</small></td></tr>`).join("");

  const faceRows = game.players.map((player) => `<tr><td style="text-align:left">${player.character.emoji}</td>${TURNIP_TYPES.map((_, t) => {
    const buys = game.actionLog.filter((a) => a.player === player.index && a.type === t && a.kind === "buy").map((a) => a.level);
    const sells = game.actionLog.filter((a) => a.player === player.index && a.type === t && a.kind === "sell").map((a) => a.level);
    return `<td>${averageFace(buys)}→${averageFace(sells)}</td>`;
  }).join("")}</tr>`).join("");

  const splitKey = new Set(summary.splitDays.map((d) => `${d.round}-${d.type}`));
  const herdKey = new Set(summary.herdDays.map((d) => `${d.round}-${d.type}`));
  let header = '<tr><th class="typehead">日</th>';
  for (let round = 1; round <= CONFIG.totalRounds; round++) header += `<th>${round}</th>`;
  header += "</tr>";
  const timelineRows = TURNIP_TYPES.map((type, t) => {
    let row = `<tr><th class="typehead">${turnipLabel(t)}</th>`;
    for (let round = 1; round <= CONFIG.totalRounds; round++) {
      const face = faceOf(game.market[t].history[round - 1]);
      const symbols = { buy: "▲", sell: "▼", hold: "・" };
      const marks = game.actionLog.filter((a) => a.round === round && a.type === t && symbols[a.kind])
        .map((a) => `<span class="mark" style="color:${game.players[a.player].character.css}">${symbols[a.kind]}</span>`);
      const uniqueMarks = [...new Set(marks)].join("");
      const cls = splitKey.has(`${round}-${t}`) ? "split" : herdKey.has(`${round}-${t}`) ? "herd" : "";
      row += `<td class="${cls}">${face}${uniqueMarks}</td>`;
    }
    return row + "</tr>";
  }).join("");

  const splitRate = summary.sellDays ? summary.splitDays.length / summary.sellDays : 0;
  const verdict = splitRate >= 0.3 && summary.herdDays.length <= summary.splitDays.length
    ? "売り時が割れている：同じ日に「売る人」と「買う／持ち続ける人」が分かれた場面が多い。頭を見て読む駆け引きが起きている。"
    : splitRate >= 0.15
      ? "少し割れている：判断が分かれた日はあるが、まだ少ない。需給の効き（supplyPressurePerTurnip）かうわさの頻度を上げる余地あり。"
      : "割れていない：全員がほぼ同じ判断をしている。需給・うわさ・店主の好みのどれかを強める必要がある。";

  elements.overlay.innerHTML = `<div class="sheet">
    <h1>シーズン終了</h1>
    <p class="lead">頭に残ったカブはしおれて0🪙。いちばん稼いだ人の勝ち。</p>
    <table class="rank">${rankingRows}</table>

    <h2>🔍 検証：売り時は割れたか</h2>
    <div class="verdict">${verdict}<br>
      <small>判断が割れた日 ${summary.splitDays.length}／誰かが売った日 ${summary.sellDays}（${Math.round(splitRate * 100)}%）・一斉売りの日 ${summary.herdDays.length}</small></div>

    <h2>相場と売買の記録</h2>
    <div class="timeline-wrap"><table class="timeline">${header}${timelineRows}</table></div>
    <div class="legend">顔＝その日の朝のカブの大きさ（😱いちばん小さい→😟→🙂→😄→🤩→🚀それより上）　▲買い ▼売り ・売れたのに持ち続けた（色＝プレイヤー）　<span style="background:#fff1c9">黄</span>＝売った人と、買った／持ち続けた人が分かれた日　<span style="background:#dbe8f8">青</span>＝3人以上が一斉に売った日</div>

    <h2>平均でどの大きさのときに買って、どの大きさで売ったか</h2>
    <table class="faces"><tr><th></th>${TURNIP_TYPES.map((_, t) => `<th>${turnipLabel(t)}</th>`).join("")}</tr>${faceRows}</table>

    <div class="actions">
      <button type="button" data-action="again">同じシードでもう一度</button>
      <button type="button" class="secondary" data-action="title">タイトルへ</button>
    </div>
    <div class="foot">${GAME_VERSION}・seed ${currentSeed}（URL に ?seed=${currentSeed} を付けると同じ流行とサイコロで再現）</div>
  </div>`;
  elements.overlay.classList.remove("hidden");
  elements.overlay.querySelector('[data-action="again"]').addEventListener("click", () => startGame(game.mode, currentSeed));
  elements.overlay.querySelector('[data-action="title"]').addEventListener("click", showTitle);
}

  const fixed = params.get("seed");
  if (fixed !== null && /^\d+$/.test(fixed)) return Number(fixed) >>> 0;
  return (Date.now() ^ 0x5bd1e995) >>> 0;
}

function startGame(mode, seed) {
  elements.overlay.classList.add("hidden");

  }
  renderHud();
  runGame();
}

// 自動検証用：?headless=1 で開くと window.__kabuSimulate(seed, mode) が使える
window.__kabuSimulate = async function simulate(seed, mode) {
  setupGame(mode || "watch", seed);
  await runGame();
  return window.__kabuResult;
};
window.__kabuGame = game;

if (hasThree) {
  buildTurnipAssets();
  buildWorld();
  requestAnimationFrame(frame);
} else {
  setMessage("3D表示ライブラリ（three.js）を読み込めなかった。ネットにつながっているか確認して再読み込みしてください。");
}
setupGame("watch", pickSeed());
if (hasThree) {
  addCharactersToWorld();
  Object.keys(game.ground).forEach((index) => updateGroundVisual(Number(index)));
}
renderHud();
if (!isHeadless) showTitle();
</script>
</body>
</html>
